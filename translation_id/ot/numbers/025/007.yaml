  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֗רְא פִּֽינְחָס֙ בֶּן אֶלְעָזָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵ֑ן וַ/יָּ֨קָם֙ מִ/תּ֣וֹךְ הָֽ/עֵדָ֔ה וַ/יִּקַּ֥ח רֹ֖מַח בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/007.yaml
  text: When Phinehas son of Eleazar[a], son of Aaron the priest, saw it[b], he rose up from the midst of the congregation and took a spear in his hand.
translation:
  language: id
  text: Ketika Pinehas, anak Eleazar, anak Harun, sang imam, melihat hal itu,[a] ia bangkit dari tengah-tengah umat[b] lalu mengambil sebuah tombak di tangannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “melihat”; objeknya tersirat dari konteks sebelumnya. Dapat juga diterjemahkan “melihat ini”.'
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “dari antara jemaah” atau “dari tengah-tengah perkumpulan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: melihat hal itu
  rationale: Verba Ibrani hanya menyatakan 'melihat', sedangkan objeknya tersirat dari tindakan pada ayat sebelumnya. 'Melihat hal itu' wajar dalam bahasa Indonesia dan tidak memperinci objek melampaui konteks.
- source_word: פִּינְחָס
  choice: Pinehas
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בֶּן אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: anak Eleazar, anak Imam Harun
  rationale: Mempertahankan urutan silsilah. הַכֹּהֵן berarti 'imam'; gelar 'Imam Besar' tidak ditambahkan karena tidak terdapat dalam teks ayat ini.
- source_word: וַיָּקָם
  choice: ia bangkit
  rationale: Menyampaikan tindakan berdiri atau bangkit yang mengawali tindakan tegas Pinehas, dengan ungkapan Indonesia yang alami.
- source_word: מִתּוֹךְ הָעֵדָה
  choice: dari tengah-tengah umat
  rationale: מִתּוֹךְ berarti 'dari tengah-tengah', sedangkan עֵדָה menunjuk pada komunitas Israel yang berhimpun. 'Umat' alami dan mempertahankan pengertian korporatifnya.
- source_word: וַיִּקַּח
  choice: lalu mengambil
  rationale: Verba umum 'mengambil' cukup mewakili makna tanpa menambahkan intensitas seperti 'menyambar'.
- source_word: רֹמַח
  choice: sebuah tombak
  rationale: Padanan Indonesia yang jelas dan umum untuk senjata tikam bertangkai panjang ini.
- source_word: בְּיָדוֹ
  choice: di tangannya
  rationale: Terjemahan langsung dan idiomatis yang menunjukkan bahwa Pinehas memegang atau membawa tombak itu.
theological_decisions:
- issue: Pemadanan הָעֵדָה
  choice: umat
  alternative: jemaah; perkumpulan
  rationale: '''Umat'' dengan alami menunjuk kepada komunitas Israel dalam konteks Pentateukh tanpa memasukkan pengertian gerejawi yang lebih kemudian; alternatif ''jemaah'' dan ''perkumpulan'' tetap mungkin.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur naratif Ibrani dipertahankan tanpa membuat kalimat terasa kaku. 'Imam Harun' dipakai sebagai aposisi alami, dan dua catatan kaki menjaga unsur yang tersirat serta rentang makna עֵדָה.
