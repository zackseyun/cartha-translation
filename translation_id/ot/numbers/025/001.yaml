id: NUM.25.1
reference: Numbers 25:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֥שֶׁב יִשְׂרָאֵ֖ל בַּ/שִּׁטִּ֑ים וַ/יָּ֣חֶל הָ/עָ֔ם לִ/זְנ֖וֹת אֶל בְּנ֥וֹת מוֹאָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/001.yaml
  text: While Israel was staying at Shittim[a], the people began to prostitute themselves with the daughters of Moab.
translation:
  language: id
  text: Ketika Israel tinggal di Sitim, bangsa itu mulai melacurkan diri dengan perempuan-perempuan Moab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mulai melakukan percabulan dengan perempuan-perempuan Moab”; secara harfiah, “mulai berbuat sebagai pelacur dengan anak-anak perempuan Moab.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: Kata kerja יָשַׁב dapat berarti duduk, menetap, berdiam, atau tinggal. Dalam konteks persinggahan Israel, “tinggal” terdengar alami dan tidak menyiratkan permukiman permanen.
- source_word: בַּשִּׁטִּים
  choice: di Sitim
  rationale: Nama tempat ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia. Preposisi בְּ paling alami diterjemahkan “di” untuk lokasi persinggahan.
- source_word: וַיָּחֶל
  choice: mulai
  rationale: Dalam konstruksi ini bentuk verba tersebut berfungsi secara idiomatis untuk menandai awal suatu tindakan.
- source_word: הָעָם
  choice: bangsa itu
  rationale: Kata עַם menunjuk secara kolektif kepada Israel yang baru disebut. “Bangsa itu” menjaga hubungan tersebut dan terdengar wajar dalam narasi.
- source_word: לִזְנוֹת
  choice: melacurkan diri
  rationale: Verba זנה menyatakan perilaku seksual terlarang dengan gambaran pelacuran. Pilihan ini mempertahankan ketajaman ungkapan Ibrani, sedangkan alternatif yang lebih umum dicatat dalam catatan kaki.
- source_word: אֶל
  choice: dengan
  rationale: Walaupun אֶל pada dasarnya berarti “kepada/ke arah”, bersama verba זנה dan objek persona, maknanya secara idiomatis menunjukkan keterlibatan seksual dengan pihak tersebut.
- source_word: בְּנוֹת מוֹאָב
  choice: perempuan-perempuan Moab
  rationale: Secara harfiah ungkapan ini berarti “anak-anak perempuan Moab”, tetapi dalam konteks ini menunjuk kepada kaum perempuan Moab. Bentuk alami bahasa Indonesia menghindari kesan bahwa yang dimaksud secara khusus adalah anak perempuan.
theological_decisions:
- issue: Sifat dosa Israel dalam kalimat pembuka
  choice: 'Menggunakan bahasa pelacuran yang eksplisit: “melacurkan diri”.'
  alternative: “melakukan percabulan” atau “melakukan perbuatan seksual yang tidak bermoral”.
  rationale: Verba Ibrani זנה lebih tajam daripada ungkapan moral yang umum dan membangkitkan gambaran pelacuran. Terjemahan ini mempertahankan daya ungkap teks tanpa menambahkan penafsiran teologis yang belum dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Melacurkan diri” sengaja dipertahankan sebagai ungkapan keras yang mencerminkan metafora Ibrani; catatan kaki menyediakan padanan yang lebih idiomatis dan bentuk yang lebih harfiah.
