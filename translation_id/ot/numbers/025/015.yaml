revisions:
- from: Nama perempuan Midian yang dibunuh itu ialah Kozbi, anak perempuan Zur[a]. Zur adalah kepala kaum-kaum dalam suatu keluarga besar di Midian.[b]
  to: Nama perempuan Midian yang dibunuh itu ialah Kozbi, putri Zur. Zur adalah pemimpin kelompok-kelompok kaum dari satu keluarga leluhur di Midian.[a]
  rationale: Revisi memperjelas bahwa Zur, bukan Kozbi, adalah pemimpin, dan memperbaiki representasi serta kelancaran frasa רֹאשׁ אֻמּוֹת בֵּית־אָב. Terjemahan tetap menjaga keluasan makna אֻמּוֹת melalui catatan kaki, sementara istilah בית־אב diterjemahkan secara fungsional dan diberi penjelasan harfiah. Catatan yang hanya menduplikasi teks utama dihapus.
