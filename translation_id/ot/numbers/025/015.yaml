base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/015.yaml
  text: And the name of the Midianite woman who was struck down was Cozbi daughter of Zur[b][a], who was head of the clans of a father's house in Midian.
translation:
  language: id
  text: Nama perempuan Midian yang dibunuh itu ialah Kozbi, putri Zur. Zur adalah pemimpin kelompok-kelompok kaum dari satu keluarga leluhur di Midian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kelompok-kelompok kaum” juga dapat diterjemahkan “bangsa-bangsa” atau “kelompok-kelompok suku”. “Keluarga leluhur” secara harfiah berarti “rumah ayah”, suatu istilah kekerabatan untuk keluarga luas atau rumah tangga leluhur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם
  choice: Nama
  rationale: Dalam bahasa Indonesia, pembukaan tanpa kata penghubung lebih alami; hubungan naratif dengan ayat sebelumnya tetap jelas.
- source_word: הָאִשָּׁה הַמֻּכָּה הַמִּדְיָנִית
  choice: perempuan Midian yang dibunuh itu
  rationale: Susunan ini alami dalam bahasa Indonesia. Partisip pasif הַמֻּכָּה secara harfiah berarti 'yang dipukul/ditumbangkan', tetapi konteks langsung menunjukkan bahwa perempuan itu telah dibunuh.
- source_word: כָּזְבִּי בַת צוּר
  choice: Kozbi, anak perempuan Zur
  rationale: Nama ditransliterasikan menurut kebiasaan Indonesia, dan hubungan keturunan dinyatakan secara jelas.
- source_word: רֹאשׁ
  choice: kepala
  rationale: Mempertahankan metafora Ibrani yang lazim untuk seorang pemimpin.
- source_word: אֻמּוֹת
  choice: kaum-kaum
  rationale: Kata ini dapat berarti bangsa-bangsa atau kelompok-kelompok masyarakat; dalam konteks kekerabatan, 'kaum-kaum' paling wajar tanpa mempersempitnya secara berlebihan.
- source_word: בֵּית אָב
  choice: keluarga besar
  rationale: Ungkapan harfiah 'rumah ayah' merupakan istilah kekerabatan bagi keluarga luas atau rumah tangga leluhur; 'keluarga besar' menyampaikan fungsinya secara alami.
- source_word: בְּמִדְיָן הוּא
  choice: Zur adalah ... di Midian
  rationale: Pronomina הוּא merujuk kembali kepada Zur. Memulai kalimat kedua menghilangkan kemungkinan bahwa Kozbi dianggap sebagai kepala dan menghasilkan bahasa Indonesia yang jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Kalimat Ibrani dibagi menjadi dua agar rujukan הוּא kepada Zur tidak ambigu. Penanda catatan kaki [a] dan [b] keduanya dicantumkan dalam teks utama.
