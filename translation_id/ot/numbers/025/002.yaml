  naturalness: “Sujud kepada ilah-ilah mereka” adalah ungkapan baku dan alami dalam bahasa Indonesia modern. Pengulangan “persembahan-persembahan kurban” tidak diperlukan untuk menyampaikan jamak Ibrani, sebab bahasa Indonesia lazim tidak menandai jamak apabila konteksnya cukup.
  terminology: “Ilah-ilah” tepat untuk אֱלֹהֵיהֶן dalam konteks dewa-dewa asing. “Persembahan kurban bagi ilah-ilah mereka” menyampaikan זִבְחֵי אֱלֹהֵיהֶן secara wajar, tanpa terlalu mempersempitnya menjadi perjamuan saja.
