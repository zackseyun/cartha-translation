  yaml_path: translation/ot/numbers/025/002.yaml
  text: And they invited the people to the sacrifices of their gods[a], and the people ate and bowed down to their gods.
translation:
  language: id
  text: Mereka mengundang bangsa itu ke persembahan kurban bagi ilah-ilah mereka. Bangsa itu makan dan sujud kepada[a] ilah-ilah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menyembah ilah-ilah mereka.” Kata Ibrani ini secara harfiah menunjuk pada tindakan bersujud atau menundukkan diri, yang sering dilakukan sebagai tindakan penyembahan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרֶאןָ
  choice: perempuan-perempuan itu mengundang
  rationale: Bentuk feminin jamak merujuk kepada perempuan-perempuan Moab pada ayat sebelumnya. Dengan לְ bagi orang yang dituju, קרא di sini secara alami berarti mengundang.
- source_word: לָעָם
  choice: umat itu
  rationale: Kata עָם dengan artikel menunjuk kepada umat yang sudah dikenal dari konteks, yaitu Israel, tanpa mengulang nama Israel. 'Umat' sesuai dengan konteks umat perjanjian dan tetap dekat dengan bentuk Ibrani.
- source_word: לְזִבְחֵי אֱלֹהֵיהֶן
  choice: ke persembahan-persembahan kurban bagi ilah-ilah mereka
  rationale: זִבְחֵי adalah bentuk jamak konstruksi yang menunjuk kepada kurban atau perjamuan kurban yang berkaitan dengan ilah-ilah itu. 'Bagi' menyampaikan arah persembahan secara wajar dalam bahasa Indonesia, sedangkan 'persembahan-persembahan kurban' mempertahankan bentuk jamaknya.
- source_word: וַיֹּאכַל
  choice: umat itu pun makan
  rationale: Verba tunggal mengikuti subjek kolektif הָעָם. Bahasa Indonesia dapat mempertahankan subjek kolektif secara alami; 'pun' menandai kelanjutan dan tanggapan dalam narasi.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: sujud menyembah
  rationale: Verba ini menggambarkan tindakan merendahkan diri atau bersujud yang dalam konteks ini merupakan penyembahan. 'Sujud menyembah' mempertahankan unsur gerak tubuh sekaligus makna kultisnya tanpa menjadi sekadar abstrak.
- source_word: לֵאלֹהֵיהֶן
  choice: kepada ilah-ilah mereka
  rationale: Preposisi לְ menandai pihak yang menjadi tujuan tindakan sujud. Dalam susunan Indonesia, makna 'kepada' sudah terkandung secara alami dalam frasa 'sujud menyembah ilah-ilah mereka'.
theological_decisions:
- issue: Makna tindakan penyembahan berhala dalam וַיִּשְׁתַּחֲווּ
  choice: sujud menyembah ilah-ilah mereka
  alternative: sujud kepada ilah-ilah mereka; menyembah ilah-ilah mereka
  rationale: '''Sujud menyembah'' menjaga tindakan jasmani yang dinyatakan oleh verba Ibrani sekaligus menunjukkan fungsi religiusnya dalam konteks kurban kepada ilah-ilah lain. Terjemahan ini tidak mengurangi perbuatan itu menjadi gerak penghormatan biasa ataupun menghilangkan citra konkretnya.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ilah-ilah' dipakai untuk dewa-dewa yang disembah bangsa lain, sedangkan pengulangan 'persembahan-persembahan kurban' mempertahankan bentuk jamak sumber meski sedikit lebih eksplisit dalam bahasa Indonesia. Penanda catatan kaki [a] ditempatkan langsung setelah ungkapan yang dijelaskannya.
