  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ֠/יָּבֹא אַחַ֨ר אִֽישׁ יִשְׂרָאֵ֜ל אֶל הַ/קֻּבָּ֗ה וַ/יִּדְקֹר֙ אֶת שְׁנֵי/הֶ֔ם אֵ֚ת אִ֣ישׁ יִשְׂרָאֵ֔ל וְ/אֶת הָ/אִשָּׁ֖ה אֶל קֳבָתָ֑/הּ וַ/תֵּֽעָצַר֙ הַ/מַּגֵּפָ֔ה מֵ/עַ֖ל בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/008.yaml
  text: He went after the Israelite man into the chamber and pierced both of them—the Israelite man and the woman—through her belly[c][b][a]. Then the plague was stopped from upon the sons of Israel.
translation:
  language: id
  text: Ia menyusul orang Israel itu ke dalam bilik itu[a], lalu menikam keduanya—orang Israel itu dan perempuan itu—hingga menembus perut perempuan itu[b]. Maka wabah yang menimpa bani Israel pun berhenti[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ruang dalam”, “bilik tenda”, atau “paviliun”. Kata Ibrani ini langka dan menunjuk pada suatu ruang atau kompartemen tertutup.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ke perutnya”; kata Ibrani tersebut menunjuk pada perut atau rongga perut.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “anak-anak Israel”, ungkapan baku untuk kaum atau keturunan Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֻּבָּה
  choice: bilik tersebut
  rationale: Kata benda langka ini menunjuk pada ruang atau kompartemen tertutup. “Bilik” menyampaikan ruang privat tanpa memastikan bentuk bangunannya.
- source_word: וַיִּדְקֹר
  choice: menikam
  rationale: Kata ini menggambarkan tusukan senjata secara keras; “menikam” alami dalam bahasa Indonesia dan tidak mengurangi kekerasan tindakan itu.
- source_word: שְׁנֵיהֶם
  choice: keduanya
  rationale: Mempertahankan penegasan bahwa kedua orang itu menjadi sasaran tindakan yang sama.
- source_word: אֶל קֳבָתָהּ
  choice: hingga menembus perut perempuan itu
  rationale: קֳבָה menunjuk pada perut atau rongga perut. Ungkapan ini mempertahankan detail anatomis konkret dan mengungkapkan arah tusukan secara alami dalam bahasa Indonesia.
- source_word: וַתֵּעָצַר
  choice: pun berhenti
  rationale: Bentuk pasif/resultatif Ibrani menyatakan bahwa wabah itu dihentikan. Dalam konteks ini, “pun berhenti” menyampaikan hasil tersebut dengan alami.
- source_word: הַמַּגֵּפָה
  choice: wabah
  rationale: “Wabah” merupakan padanan Indonesia yang jelas dan lazim bagi מַגֵּפָה dalam konteks penghukuman.
- source_word: מֵעַל בְּנֵי יִשְׂרָאֵל
  choice: yang menimpa bani Israel
  rationale: Ungkapan ini mengalihkan idiom spasial harfiah “dari atas” ke bentuk Indonesia yang alami, sambil mempertahankan gagasan bahwa wabah sedang menekan atau menimpa mereka.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: orang Israel itu
  rationale: Dalam konteks Indonesia, “orang Israel” sudah secara alami menunjuk identitas kebangsaannya; jenis kelamin laki-laki juga jelas dari konteks dan ayat sebelumnya.
theological_decisions:
- issue: Ungkapan kolektif bergender בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel; umat Israel; anak-anak Israel
  rationale: “Bani Israel” merupakan ungkapan Indonesia yang dikenal untuk keturunan atau kaum Israel, mempertahankan warna genealogis ungkapan Ibrani tanpa menyiratkan bahwa wabah hanya menimpa laki-laki.
- issue: Detail anatomis dalam adegan penghukuman
  choice: hingga menembus perut perempuan itu
  alternative: hingga menembus bagian perutnya
  rationale: Teks Ibrani memberikan detail tubuh yang konkret. Terjemahan tidak melunakkan kekerasannya dan juga tidak menambahkan rincian di luar sumber.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur kalimat dibuat alami tanpa menghilangkan urutan tindakan, kekerasan adegan, atau hubungan langsung antara tindakan itu dan berhentinya wabah.
