  text: And it happened after the plague[a].
translation:
  language: id
  text: Setelah tulah itu, terjadilah hal berikut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Dan terjadilah sesudah tulah itu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: terjadilah hal berikut
  rationale: Bentuk wayyiqtol dari היה berfungsi sebagai rumus peralihan naratif. Dalam bahasa Indonesia, tambahan idiomatis “hal berikut” membuat klausa pendek ini dapat berdiri sebagai kalimat utuh tanpa mengubah fungsinya sebagai pengantar kepada peristiwa selanjutnya.
- source_word: אַחֲרֵי
  choice: setelah
  rationale: Kata depan ini secara langsung menunjukkan urutan waktu; “setelah” merupakan padanan Indonesia yang alami dan jelas.
- source_word: הַמַּגֵּפָה
  choice: tulah itu
  rationale: מַגֵּפָה menunjuk pada tulah atau bencana mematikan, khususnya dalam konteks penghukuman. “Tulah itu” sesuai dengan konteks langsung dan merujuk kembali kepada tulah yang baru disebutkan.
theological_decisions:
- issue: Rumus naratif sebagai ayat yang berdiri sendiri
  choice: 'Menerjemahkan klausa sebagai kalimat peralihan yang utuh: “Setelah tulah itu, terjadilah hal berikut.”'
  alternative: 'Mempertahankan bentuk yang lebih harfiah dan eliptis: “Dan terjadilah sesudah tulah itu.”'
  rationale: Teks Ibrani ayat ini hanya berupa peralihan singkat. Rumusan utama mempertahankan fungsi tersebut sekaligus menghasilkan kalimat Indonesia yang wajar; catatan kaki menjaga bentuk eliptis sumber tetap terlihat. Tidak ada persoalan doktrinal yang diputuskan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Tulah” dipilih karena alami dalam konteks penghukuman ilahi dan mempertahankan kaitan dengan peristiwa sebelumnya. Partikel “-lah” mempertahankan nuansa naratif tanpa memakai ungkapan yang arkais.
