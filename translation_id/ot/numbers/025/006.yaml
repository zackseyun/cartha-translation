  text: וְ/הִנֵּ֡ה אִישׁ֩ מִ/בְּנֵ֨י יִשְׂרָאֵ֜ל בָּ֗א וַ/יַּקְרֵ֤ב אֶל אֶחָי/ו֙ אֶת הַ/מִּדְיָנִ֔ית לְ/עֵינֵ֣י מֹשֶׁ֔ה וּ/לְ/עֵינֵ֖י כָּל עֲדַ֣ת בְּנֵי יִשְׂרָאֵ֑ל וְ/הֵ֣מָּה בֹכִ֔ים פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/006.yaml
  text: And behold, a man from the sons of Israel came and brought near to his brothers a Midianite woman, before the eyes of Moses and before the eyes of all the congregation of the sons of Israel, while they were weeping at the entrance of the tent of meeting.
translation:
  language: id
  text: Lihatlah, seorang laki-laki dari antara bani Israel datang dan mendekatkan seorang perempuan Midian kepada saudara-saudaranya[a], di depan mata Musa dan di depan mata seluruh jemaat bani Israel, sementara mereka sedang menangis di pintu masuk Kemah Pertemuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saudara-saudaranya”; dapat juga berarti “kaum kerabatnya” atau “sesama orang Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan penanda wacana yang mengarahkan perhatian pada tindakan yang mengejutkan, tanpa memakai bentuk Indonesia yang terlalu kuno.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: dari antara bani Israel
  rationale: “Bani Israel” merupakan ungkapan Indonesia yang mapan, ringkas, dan tetap mempertahankan nuansa keturunan atau hubungan kekeluargaan dalam ungkapan Ibrani.
- source_word: וַיַּקְרֵב
  choice: membawa ... mendekat
  rationale: Bentuk kausatif verba קרב menyatakan tindakan membawa atau membuat seseorang mendekat. Susunan ini menjaga unsur spasial sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: אֶל אֶחָיו
  choice: kepada saudara-saudaranya
  rationale: Menerjemahkan ungkapan kekeluargaan Ibrani secara langsung; catatan kaki memberi kemungkinan kontekstual “kaum kerabat” atau “sesama orang Israel.”
- source_word: הַמִּדְיָנִית
  choice: seorang perempuan Midian
  rationale: Adjektiva feminin dipakai secara substantival. Kata “perempuan” dinyatakan agar jelas, sedangkan “seorang” memperkenalkan tokoh secara alami dalam bahasa Indonesia.
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: di depan mata ... dan di depan mata
  rationale: Mempertahankan idiom serta pengulangan sumber untuk menekankan bahwa tindakan itu dilakukan secara terang-terangan.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: seluruh umat bani Israel
  rationale: “Umat” secara alami menyatakan komunitas perjanjian yang sedang berkumpul, sementara “bani Israel” menjaga nuansa keturunan.
- source_word: וְהֵמָּה בֹכִים
  choice: sementara mereka sedang menangis
  rationale: Menangkap tindakan duratif yang berlangsung bersamaan dengan kedatangan laki-laki itu.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: di pintu masuk Kemah Pertemuan
  rationale: Ungkapan yang jelas dan mapan untuk lokasi di bagian masuk tempat kudus; kapitalisasi menandai nama khusus bangunan ibadah tersebut.
theological_decisions:
- issue: Bahasa kekeluargaan dalam בְּנֵי יִשְׂרָאֵל dan אֶחָיו
  choice: Memakai “bani Israel” dan “saudara-saudaranya” dalam teks utama
  alternative: “orang Israel,” “kaum kerabatnya,” atau “sesama orang Israel”
  rationale: Pilihan utama mempertahankan citra kekeluargaan dalam bahasa Ibrani tanpa membatasi rujukannya secara doktrinal. Kemungkinan cakupan “saudara-saudaranya” dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan pengulangan retoris sumber, tetapi menggunakan bentuk yang tetap mudah dipahami pembaca umum.
