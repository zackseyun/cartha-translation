source:
  edition: WLC
  text: פִּֽינְחָ֨ס בֶּן אֶלְעָזָ֜ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן הֵשִׁ֤יב אֶת חֲמָתִ/י֙ מֵ/עַ֣ל בְּנֵֽי יִשְׂרָאֵ֔ל בְּ/קַנְא֥/וֹ אֶת קִנְאָתִ֖/י בְּ/תוֹכָ֑/ם וְ/לֹא כִלִּ֥יתִי אֶת בְּנֵֽי יִשְׂרָאֵ֖ל בְּ/קִנְאָתִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/011.yaml
  text: Phinehas son of Eleazar[a], son of Aaron the priest, has turned back my wrath from upon the sons of Israel by being jealous with my jealousy among them, so that I did not consume the sons of Israel in my jealousy.
translation:
  language: id
  text: Pinehas, anak Eleazar, yang adalah anak Imam Harun, telah memalingkan murka-Ku dari orang Israel karena ia menunjukkan kecemburuan-Ku di tengah-tengah mereka, sehingga Aku tidak menghabisi orang Israel dalam kecemburuan-Ku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ia bersemangat dengan semangat-Ku ... dalam semangat-Ku.” Bahasa Ibrani memakai bentuk-bentuk serumpun dari akar kata yang sama untuk tindakan Pinehas dan tanggapan Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: telah memalingkan
  rationale: Bentuk Hifil dari שׁוב di sini berarti menyebabkan murka berbalik atau tersingkir. Ungkapan ini mempertahankan makna kausatif sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: חֲמָתִי
  choice: murka-Ku
  rationale: חֵמָה menyatakan amarah yang menyala dan kuat. “Murka” mempertahankan intensitas serta bobot penghakimannya.
- source_word: מֵעַל
  choice: dari
  rationale: Secara harfiah berarti “dari atas,” tetapi dalam konstruksi ini menyatakan bahwa murka disingkirkan dari orang Israel. “Dari” menyampaikan relasi tersebut secara wajar tanpa menciptakan gambaran yang janggal dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani ini merupakan sebutan kolektif bagi bangsa Israel. “Orang Israel” alami, tepat, dan mencakup seluruh umat yang dimaksud dalam konteks.
- source_word: בְּקַנְאוֹ אֶת־קִנְאָתִי
  choice: karena ... ia bertindak dengan kecemburuan-Ku
  rationale: Frasa ini memakai bentuk verbal dan nominal dari akar קנא. Terjemahan mempertahankan gagasan kecemburuan perjanjian Allah serta menghubungkan tindakan Pinehas dengan kecemburuan Allah, tanpa menentukan secara berlebihan apakah itu terutama perasaan, semangat, atau tindakan membela kehormatan Allah.
- source_word: בְּתוֹכָם
  choice: di tengah-tengah mereka
  rationale: Terjemahan ini mempertahankan gambaran spasial dan komunal bahwa tindakan Pinehas berlangsung dalam lingkungan umat Israel.
- source_word: כִלִּיתִי
  choice: Aku tidak menghabisi
  rationale: Bentuk Piel dari כלה di sini menunjuk pada pemusnahan sampai tuntas. “Menghabisi” mempertahankan unsur ketuntasan yang lebih kuat daripada sekadar “menghukum.”
- source_word: בְּקִנְאָתִי
  choice: dalam kecemburuan-Ku
  rationale: Pilihan ini mempertahankan pengulangan קִנְאָה dan ketegangan teologis tentang kecemburuan ilahi sebagai dorongan bagi penghakiman.
- source_word: הַכֹּהֵן
  choice: Imam
  rationale: Gelar ini menerangkan Harun. Kapitalisasi membantu menunjukkan gelar yang melekat pada nama dalam susunan silsilah Indonesia.
theological_decisions:
- issue: Makna קנא / קִנְאָה dalam tindakan Pinehas dan tanggapan Allah
  choice: kecemburuan-Ku / dalam kecemburuan-Ku
  alternative: semangat-Ku / dalam semangat-Ku
  rationale: “Kecemburuan” mempertahankan nuansa tuntutan kesetiaan eksklusif dalam relasi perjanjian dan pengulangan akar Ibrani. Karena “semangat” juga mungkin dan lebih menonjolkan kegigihan membela kehormatan Allah, alternatif itu dicantumkan dalam catatan kaki.
- issue: Hubungan kecemburuan Pinehas dengan kecemburuan Allah
  choice: ia bertindak dengan kecemburuan-Ku
  alternative: ia berkobar-kobar dengan semangat bagi-Ku
  rationale: Teks Ibrani secara sengaja mendekatkan tindakan Pinehas dengan kecemburuan Allah. Rumusan terpilih menjaga hubungan itu tanpa menjelaskan secara dogmatis bagaimana Pinehas mengambil bagian di dalamnya.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Dalam konteks ini ungkapan tersebut adalah etnonim kolektif, bukan pembatasan kepada laki-laki atau anak biologis tertentu. Terjemahan idiomatis menghindari salah pengertian sambil mempertahankan rujukan kepada umat perjanjian.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Susunan silsilah diperjelas dengan “yang adalah anak” agar gelar “Imam” jelas menerangkan Harun. Pengulangan “kecemburuan-Ku” sengaja dipertahankan untuk mencerminkan pengulangan dan ketegangan teologis dalam teks Ibrani.
