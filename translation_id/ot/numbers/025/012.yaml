  text: לָ/כֵ֖ן אֱמֹ֑ר הִנְנִ֨/י נֹתֵ֥ן ל֛/וֹ אֶת בְּרִיתִ֖/י שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/012.yaml
  text: Therefore say, ‘Look, I am giving him my covenant of peace.’
translation:
  language: id
  text: 'Sebab itu, katakan: ‘Sesungguhnya, Aku memberikan kepadanya perjanjian damai-Ku.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Sebab itu
  rationale: Menyatakan kesimpulan atau akibat dari tindakan Pinehas dalam konteks sebelumnya; alami dalam bahasa Indonesia modern.
- source_word: הִנְנִי
  choice: Lihat, Aku
  rationale: Mempertahankan penanda perhatian dan penegasan diri dari ungkapan Ibrani, tanpa menghilangkannya menjadi sekadar ‘Aku’.
- source_word: נֹתֵן
  choice: memberikan
  rationale: Partisipel menyatakan tindakan ilahi yang sedang dinyatakan dengan tegas; bentuk kini Indonesia paling langsung.
- source_word: בְּרִיתִי שָׁלוֹם
  choice: perjanjian-Ku tentang damai sejahtera
  rationale: 'Konstruksi ini dibiarkan cukup terbuka: damai sejahtera dapat dipahami sebagai isi, sifat, atau hasil perjanjian. ‘Damai sejahtera’ mewakili cakupan שָׁלוֹם lebih baik daripada ‘damai’ saja.'
theological_decisions:
- issue: Hubungan antara ‘perjanjian-Ku’ dan שָׁלוֹם
  choice: perjanjian-Ku tentang damai sejahtera
  alternative: perjanjian damai sejahtera-Ku
  rationale: Pilihan utama tidak terlalu cepat menentukan apakah damai sejahtera merupakan nama, isi, sifat, atau hasil perjanjian, sehingga ketegangan semantis sumber tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan khidmat. Kapitalisasi ‘Aku’ dan akhiran ‘-Ku’ mengikuti kebiasaan penerjemahan Alkitab Indonesia untuk rujukan kepada Allah. Kutipan langsung dibuka sesudah titik dua.
