  source_fidelity: 'Draf secara umum setia pada Ibrani: לָכֵן, אֱמֹר, הִנְנִי, נֹתֵן, dan לּוֹ seluruhnya terwakili. Namun, בְּרִיתִי שָׁלוֹם secara harfiah dan idiomatis lebih baik diterjemahkan sebagai “perjanjian damai-Ku” atau “perjanjian-Ku, perjanjian damai,” bukan “perjanjian-Ku tentang damai sejahtera.” Kata “tentang” menggeser relasi konstruksi nomina menjadi topik perjanjian dan kurang mencerminkan bentuk sumber.'
  naturalness: Kalimat draf belum lengkap secara struktural karena kutipan langsung tidak memiliki tanda petik penutup. “Sebab itu, katakanlah” baku, tetapi “Sebab itu, katakan” lebih langsung dan sepadan dengan imperatif tunggal אֱמֹר. “Lihat, Aku” dapat dipahami, tetapi “Sesungguhnya, Aku” lebih alami dalam register Alkitab Indonesia bagi הִנְנִי tanpa mengurangi penegasannya.
  terminology: “Perjanjian damai-Ku” mempertahankan keterkaitan langsung antara “perjanjian-Ku” dan שָׁלוֹם serta tetap cukup terbuka mengenai apakah damai merupakan ciri, isi, atau hasil perjanjian. “Damai” lebih dekat dengan שָׁלוֹם; perluasan menjadi “damai sejahtera” tidak diperlukan di ayat ini. Kapitalisasi ilahi dipertahankan sesuai register yang dipilih.
