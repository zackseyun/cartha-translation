  text: 'Kemudian Yahweh berfirman kepada Musa:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. Dalam konteks Allah sebagai pembicara, “berfirman” merupakan padanan Indonesia yang alami dan bermartabat untuk דבר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap terlihat dan tidak diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menjadi tujuan ujaran; “kepada” adalah padanan Indonesia yang wajar.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif formulaik ini memperkenalkan isi perkataan langsung. “Demikian:” menjalankan fungsi tersebut secara alami dalam bahasa Indonesia dan mengarahkan pembaca kepada ujaran pada ayat berikutnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi, sedangkan “TUHAN” adalah penggantian tradisional dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Berfirman” dipakai sebagai kolokasi lazim ketika Allah berbicara; tanda titik dua menandai bahwa isi firman berlanjut pada ayat berikutnya.
