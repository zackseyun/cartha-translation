  text: And those who died in the plague were twenty-four thousand.
translation:
  language: id
  text: Orang-orang yang mati dalam wabah itu berjumlah dua puluh empat ribu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Jumlah ... adalah
  rationale: Bentuk wayyiqtol dari היה di sini memperkenalkan jumlah keseluruhan. Dalam bahasa Indonesia, konstruksi “Jumlah ... adalah” menyampaikan fungsi ini secara alami dan jelas.
- source_word: הַמֵּתִים
  choice: orang yang mati
  rationale: Partisipel dari מות merujuk kepada orang-orang yang meninggal; “orang yang mati” alami dalam pernyataan jumlah dan tetap dekat dengan bentuk sumber.
- source_word: בַּמַּגֵּפָה
  choice: dalam wabah itu
  rationale: מַגֵּפָה berarti wabah atau tulah yang mematikan. Preposisi ב dipertahankan sebagai “dalam”, sedangkan artikel tertentu dinyatakan dengan “itu” karena menunjuk pada wabah dalam konteks sebelumnya.
- source_word: אַרְבָּעָה וְעֶשְׂרִים אָלֶף
  choice: dua puluh empat ribu orang
  rationale: Ungkapan bilangan Ibrani dialihkan ke susunan bilangan Indonesia modern. Kata penggolong “orang” ditambahkan secara wajar untuk memperjelas bahwa jumlah tersebut adalah manusia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur jumlah dipilih agar pernyataan statistik terdengar alami tanpa mengurangi hubungan langsung dengan teks Ibrani.
