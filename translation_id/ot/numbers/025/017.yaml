  text: צָר֖וֹר אֶת הַ/מִּדְיָנִ֑ים וְ/הִכִּיתֶ֖ם אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/017.yaml
  text: Harass the Midianites and strike them down,[a]
translation:
  language: id
  text: Musuhilah orang Midian dan pukullah mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Perlakukanlah orang Midian sebagai musuh dan pukullah mereka.” Kata Ibrani צָרוֹר dapat berarti menunjukkan permusuhan atau memperlakukan seseorang sebagai musuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרוֹר
  choice: Musuhilah
  rationale: Bentuk ini menyampaikan perintah untuk memperlakukan orang Midian sebagai musuh atau menunjukkan permusuhan terhadap mereka. Pilihan ini mempertahankan cakupan makna Ibrani tanpa mempersempitnya menjadi satu taktik gangguan tertentu.
- source_word: הַמִּדְיָנִים
  choice: orang Midian
  rationale: Sebutan baku dan alami dalam bahasa Indonesia untuk bangsa atau kelompok yang berasal dari Midian.
- source_word: וְהִכִּיתֶם
  choice: dan pukullah mereka
  rationale: Bentuk Hifil dari נכה dapat berarti memukul, menyerang, atau mengalahkan. “Pukullah” mempertahankan kekerasan tindakan sekaligus tidak memastikan bahwa hasilnya harus kematian atau kekalahan total.
- source_word: אוֹתָם
  choice: mereka
  rationale: Kata ganti objek ini merujuk kembali kepada orang Midian.
- source_word: אֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Penanda objek langsung dalam bahasa Ibrani; fungsinya tercermin dalam susunan kalimat Indonesia.
theological_decisions:
- issue: Menerjemahkan perintah ilahi untuk bermusuhan dan melakukan kekerasan tanpa memperhalus atau memperluasnya
  choice: Musuhilah orang Midian dan pukullah mereka
  alternative: Ganggu terus orang Midian dan seranglah mereka
  rationale: 'Teks Ibrani memuat dua perintah langsung: memperlakukan orang Midian sebagai lawan dan melakukan tindakan keras terhadap mereka. Terjemahan mempertahankan ketegangan dan kerasnya perintah tanpa menambahkan alasan teologis yang tidak disebutkan dalam ayat ini.'
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan tegas. “Musuhilah” bernada luhur tetapi tetap mudah dimengerti; “pukullah” mempertahankan keluasan makna verba Ibrani dan menghindari penafsiran berlebihan seperti “bunuhlah” atau “tumpaslah”.
