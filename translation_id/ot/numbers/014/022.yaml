  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י כָל הָ/אֲנָשִׁ֗ים הָ/רֹאִ֤ים אֶת כְּבֹדִ/י֙ וְ/אֶת אֹ֣תֹתַ֔/י אֲשֶׁר עָשִׂ֥יתִי בְ/מִצְרַ֖יִם וּ/בַ/מִּדְבָּ֑ר וַ/יְנַסּ֣וּ אֹתִ֗/י זֶ֚ה עֶ֣שֶׂר פְּעָמִ֔ים וְ/לֹ֥א שָׁמְע֖וּ בְּ/קוֹלִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/022.yaml
  text: For all the men who have seen my glory and my signs that I did in Egypt and in the wilderness[a], and have tested me these ten times and have not listened to my voice—
translation:
  language: id
  text: Sebab semua orang yang telah melihat kemuliaan-Ku dan tanda-tanda yang Kulakukan di Mesir dan di padang gurun, dan telah menguji Aku sepuluh kali ini dan tidak mendengarkan suara-Ku[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak menaati Aku.” Ungkapan Ibrani “mendengarkan suara-Ku” dapat berarti mengindahkan atau menaati.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Dalam konteks, kata ini memperkenalkan dasar bagi sumpah atau hukuman ilahi pada ayat sebelumnya; “Sebab” mempertahankan hubungan penjelas tersebut.
- source_word: כָל הָאֲנָשִׁים
  choice: semua orang
  rationale: אֲנָשִׁים menunjuk kepada orang-orang, secara kontekstual kaum laki-laki dewasa dari angkatan yang dihukum. Dalam bahasa Indonesia, “semua orang” alami dan tidak mengubah rujukan kontekstual menjadi umat manusia secara umum.
- source_word: הָרֹאִים
  choice: yang telah melihat
  rationale: Partisip ini bersifat deskriptif-substantival; bentuk perfektif Indonesia menyatakan pengalaman lampau yang tetap relevan bagi penghakiman sekarang.
- source_word: כְּבֹדִי
  choice: kemuliaan-Ku
  rationale: Dalam konteks ilahi, כָּבוֹד merujuk pada kemuliaan Allah yang dinyatakan; pilihan baku ini mempertahankan bobot teologisnya.
- source_word: אֹתֹתַי
  choice: tanda-tanda
  rationale: אוֹת menekankan tindakan sebagai tanda atau bukti. “Tanda-tanda” lebih tepat daripada “mukjizat,” yang lebih interpretatif.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: yang Kulakukan
  rationale: Terjemahan langsung dan alami bagi verba עשה tanpa memperinci cara tindakan itu dilakukan.
- source_word: בְמִצְרַיִם וּבַמִּדְבָּר
  choice: di Mesir dan di padang gurun
  rationale: “Padang gurun” merupakan padanan Indonesia yang lazim bagi מִדְבָּר dalam kisah keluaran.
- source_word: וַיְנַסּוּ אֹתִי
  choice: telah menguji Aku
  rationale: נסה di sini berarti mencoba atau menguji Allah; “menguji Aku” jelas dan mempertahankan tuduhan dalam teks.
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: sepuluh kali ini
  rationale: Penempatan “ini” mempertahankan unsur deiktis זֶה, meskipun ungkapan Ibrani tersebut juga dapat dipahami secara idiomatis sebagai “sepuluh kali.”
- source_word: וְלֹא שָׁמְעוּ בְּקוֹלִי
  choice: dan tidak mendengarkan suara-Ku
  rationale: Terjemahan ini mempertahankan idiom Ibrani dan citra suara Allah, sementara makna menaati atau mengindahkan dicatat dalam catatan kaki.
theological_decisions:
- issue: Rujukan diri Allah dalam perkataan langsung
  choice: 'Mempertahankan bentuk orang pertama: “kemuliaan-Ku,” “tanda-tanda yang Kulakukan,” “Aku,” dan “suara-Ku.”'
  alternative: Mengubahnya menjadi narasi orang ketiga atau menambahkan penjelasan doktrinal.
  rationale: Teks merupakan perkataan langsung Allah dan tidak memberi dasar untuk perluasan teologis.
- issue: Cakupan הָאֲנָשִׁים
  choice: “semua orang” dengan rujukan kontekstual kepada orang-orang dari angkatan yang dihukum
  alternative: “semua laki-laki”
  rationale: Bahasa Indonesia lazim memakai “orang” untuk אֲנָשִׁים; konteks narasi tetap menentukan kelompok yang dimaksud tanpa perlu membuat ungkapan kaku.
- issue: Daya idiom שׁמע בקול
  choice: Mempertahankan bentuk “mendengarkan suara-Ku” dalam teks utama
  alternative: “menaati Aku” atau “mengindahkan suara-Ku”
  rationale: Pilihan utama menjaga bentuk ungkapan Ibrani dan ketegangan antara mendengar secara lahiriah dan menanggapi dengan ketaatan; makna idiomatis dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Tanda pisah pada akhir ayat dipertahankan karena kalimat dan keputusan hukuman berlanjut ke ayat berikutnya. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
