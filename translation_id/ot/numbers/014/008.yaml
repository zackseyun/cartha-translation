id: NUM.14.8
reference: Numbers 14:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם חָפֵ֥ץ בָּ֨/נוּ֙ יְהוָ֔ה וְ/הֵבִ֤יא אֹתָ֨/נוּ֙ אֶל הָ/אָ֣רֶץ הַ/זֹּ֔את וּ/נְתָנָ֖/הּ לָ֑/נוּ אֶ֕רֶץ אֲשֶׁר הִ֛וא זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/008.yaml
  text: If Yahweh delights in us[a], he will bring us into this land and give it to us—a land flowing with milk and honey.
translation:
  language: id
  text: Jika Yahweh berkenan kepada kita[a], Ia akan membawa kita masuk ke negeri ini dan memberikannya kepada kita—negeri yang berlimpah susu dan madu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyenangi kita” atau “berpihak kepada kita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Kata ini memperkenalkan syarat; 'jika' mempertahankan bentuk kondisional dalam konteks ini.
- source_word: חָפֵץ בָּנוּ
  choice: berkenan kepada kita
  rationale: Ungkapan ini menyatakan kesenangan atau sikap baik Yahweh terhadap umat; pilihan ini alami, bermartabat, dan tetap mempertahankan nuansa personalnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang muncul langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: וְהֵבִיא אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  choice: Ia akan membawa kita masuk ke negeri ini
  rationale: Rangkaian verba menyatakan akibat dari syarat sebelumnya; 'masuk ke' sesuai dengan konteks memasuki Kanaan.
- source_word: וּנְתָנָהּ לָנוּ
  choice: dan memberikannya kepada kita
  rationale: Akhiran pronominal merujuk kepada negeri tersebut; bentuk '-nya' mempertahankan rujukan itu secara eksplisit.
- source_word: אֶרֶץ אֲשֶׁר הִוא זָבַת חָלָב וּדְבָשׁ
  choice: negeri yang berlimpah susu dan madu
  rationale: Ungkapan Ibrani menggambarkan kesuburan dan kelimpahan. 'Berlimpah susu dan madu' menyampaikan idiom itu secara alami dalam bahasa Indonesia tanpa menafsirkannya secara berlebihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; 'Yahweh' mempertahankan nama perjanjian itu sebagai transliterasi, bukan menggantinya dengan gelar.
- issue: Sifat kesukaan ilahi dalam חָפֵץ בָּנוּ
  choice: berkenan kepada kita
  alternative: menyenangi kita; berpihak kepada kita
  rationale: '''Berkenan'' mempertahankan makna kesenangan atau persetujuan ilahi tanpa mempersempitnya menjadi sekadar keberpihakan.'
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. Kata 'negeri' dipakai untuk wilayah Kanaan, sedangkan 'Ia' mempertahankan rujukan yang jelas dan register hormat. Tanda pisah mempertahankan pengulangan penjelas dalam bahasa Ibrani.
