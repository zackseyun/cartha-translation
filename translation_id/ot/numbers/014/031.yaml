  terminology: '"Negeri" merupakan padanan yang baik dan tidak menambahkan penafsiran seperti "tanah perjanjian" atau "Kanaan." "Jarahan" dan alternatif "rampasan"/"mangsa" mencerminkan rentang makna לָבַז. Catatan kaki b dengan tepat menjaga makna dasar "mengenal" sekaligus mencatat nuansa pengalaman. Semua jangkar catatan kaki ditempatkan pada frasa yang relevan.'
