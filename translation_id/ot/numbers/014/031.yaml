  source_fidelity: 'Teks Indonesia menerjemahkan semua unsur utama Ibrani dengan setia: טַפְּכֶם sebagai "anak-anakmu yang masih kecil," לָבַז sebagai "menjadi jarahan," tindakan ilahi membawa mereka masuk, וְיָדְעוּ sebagai "mengenal," dan מְאַסְתֶּם sebagai "telah kamu tolak." Objek yang didahulukan dalam "akan Kubawa masuk" tetap jelas merujuk kepada anak-anak itu, sementara tujuan masuk dipahami dari "negeri" yang menyusul, sebagaimana dalam konteks Ibrani.'
