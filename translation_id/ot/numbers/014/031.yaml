id: NUM.14.31
reference: Numbers 14:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/טַ֨פְּ/כֶ֔ם אֲשֶׁ֥ר אֲמַרְתֶּ֖ם לָ/בַ֣ז יִהְיֶ֑ה וְ/הֵבֵיאתִ֣י אֹתָ֔/ם וְ/יָֽדְעוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר מְאַסְתֶּ֖ם בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/031.yaml
  text: But your little ones[a], whom you said would become plunder, I will bring in[c][b], and they will know the land that you rejected.
translation:
  language: id
  text: Tetapi anak-anakmu yang masih kecil, yang kamu katakan akan menjadi jarahan[a], akan Kubawa masuk; mereka akan mengenal[b] negeri yang telah kamu tolak[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi rampasan” atau “menjadi mangsa.”
    reason: lexical_alternative
  - marker: b
    text: Atau “mengalami.” Kata Ibrani yang berarti “mengenal” di sini dapat mencakup pengenalan melalui pengalaman.
    reason: lexical_alternative
  - marker: c
    text: Atau “telah kamu pandang hina.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: anak-anakmu yang masih kecil
  rationale: טַף menunjuk terutama kepada anak-anak kecil. Ungkapan ini mempertahankan kesan kerentanan mereka dalam konteks ketakutan orang tua mereka.
- source_word: לָבַז
  choice: menjadi jarahan
  rationale: בַּז berarti barang atau orang yang dirampas musuh. 'Menjadi jarahan' alami dalam konteks peperangan dan mempertahankan gambaran bahwa mereka akan jatuh ke tangan musuh.
- source_word: וְהֵבֵיאתִי אֹתָם
  choice: akan Kubawa masuk
  rationale: Bentuk kausatif dari בוא berarti membuat seseorang masuk. Objeknya sudah disebut di awal kalimat, sedangkan tujuannya dipahami sebagai negeri itu.
- source_word: וְיָדְעוּ
  choice: mereka akan mengenal
  rationale: יָדַע secara dasar berarti 'mengenal/mengetahui' dan di sini dapat mencakup pengenalan melalui pengalaman. 'Mengenal' mempertahankan keluasan makna tersebut.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Dalam konteks ini הָאָרֶץ menunjuk kepada negeri yang hendak diberikan kepada Israel. 'Negeri' merupakan padanan Indonesia yang alami tanpa menambahkan 'perjanjian' atau 'Kanaan' yang tidak tertulis dalam ayat.
- source_word: מְאַסְתֶּם בָּהּ
  choice: yang telah kamu tolak
  rationale: מָאַס dapat berarti menolak, meremehkan, atau memandang hina. 'Tolak' menyampaikan penolakan umat terhadap negeri itu tanpa mempersempitnya menjadi emosi penghinaan.
theological_decisions:
- issue: Apakah negeri itu perlu disebut secara eksplisit sebagai tanah perjanjian atau Kanaan
  choice: Memakai 'negeri' tanpa tambahan penjelas dalam teks utama.
  alternative: '''tanah perjanjian'' atau ''negeri Kanaan'''
  rationale: Teks Ibrani hanya menyebut 'negeri itu/negeri'. Acuannya jelas dari konteks, sehingga tambahan tersebut akan memasukkan keterangan yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Susunan objek di depan pada 'akan Kubawa masuk' mengikuti penekanan ayat sekaligus tetap alami. Semua penanda catatan kaki ditempatkan langsung sesudah kata atau frasa yang dijelaskan.
