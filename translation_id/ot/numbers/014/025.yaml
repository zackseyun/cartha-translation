base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/025.yaml
  text: The Amalekites and the Canaanites are living in the valley[a]. Tomorrow turn and set out for yourselves into the wilderness by the way of the Red Sea.
translation:
  language: id
  text: Orang Amalek dan orang Kanaan tinggal di lembah. Besok, berbaliklah dan berangkatlah ke padang gurun melalui jalan ke arah Laut Teberau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Laut Gelagah.” Secara tradisional diterjemahkan “Laut Merah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: Orang Amalek dan orang Kanaan
  rationale: Kedua kata nisbah berbentuk tunggal dengan kata sandang, tetapi masing-masing berfungsi secara kolektif untuk menyebut kelompok bangsa. Ungkapan Indonesia dengan “orang” dapat menyatakan kelompok secara alami.
- source_word: יוֹשֵׁב
  choice: tinggal
  rationale: Partisip ini menyatakan keadaan menetap yang sedang berlangsung; “tinggal” jelas dan alami dalam bahasa Indonesia modern.
- source_word: בָּעֵמֶק
  choice: di lembah
  rationale: עֵמֶק menunjuk pada lembah atau kawasan rendah; “lembah” merupakan padanan langsung yang sesuai konteks.
- source_word: מָחָר
  choice: Besok
  rationale: Keterangan waktu ini secara langsung menunjuk pada hari berikutnya.
- source_word: פְּנוּ
  choice: berbaliklah
  rationale: Imperatif jamak dari פנה memerintahkan perubahan arah. Dalam konteks perintah kembali menuju padang gurun, “berbaliklah” menyampaikan maksudnya tanpa menambahkan tujuan yang tidak disebutkan pada verba itu sendiri.
- source_word: וּסְעוּ
  choice: dan berangkatlah
  rationale: Dalam konteks perjalanan, נסע berarti membongkar perkemahan lalu mulai bergerak; “berangkatlah” menyampaikan perintah perjalanan secara wajar.
- source_word: לָכֶם
  choice: tersirat dalam bentuk perintah kepada umat
  rationale: Dativus pronominal ini memberi penekanan pada pihak yang harus pergi. Terjemahan harfiah “bagi diri kalian” terasa janggal dalam bahasa Indonesia; arah personalnya sudah jelas dalam imperatif jamak dan konteks.
- source_word: הַמִּדְבָּר
  choice: padang gurun
  rationale: מִדְבָּר adalah wilayah belantara yang kering dan tidak harus berupa gurun pasir; “padang gurun” adalah istilah Indonesia yang mapan dalam konteks perjalanan Israel.
- source_word: דֶּרֶךְ יַם סוּף
  choice: melalui jalan menuju Laut Teberau
  rationale: דֶּרֶךְ menyatakan jalan atau rute, sedangkan יַם סוּף secara harfiah adalah “Laut Teberau/Laut Gelagah.” Susunan ini mempertahankan nama sumber dan mengungkapkan arah rute secara alami.
