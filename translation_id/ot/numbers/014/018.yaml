  - severity: medium
    issue: Padanan untuk פקד עון אבות על בנים berpotensi menggeser makna.
    rationale: “Memperhitungkan kesalahan para ayah kepada anak-anak” mudah dipahami sebagai menganggap anak-anak bersalah atas kesalahan ayah mereka. “Menuntut kesalahan ... pada anak-anak” lebih baik mempertahankan tindakan yudisial yang dinyatakan teks tanpa menentukan mekanismenya.
