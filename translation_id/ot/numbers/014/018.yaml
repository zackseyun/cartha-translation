  source_fidelity: Frasa “sekali-kali Ia tidak membebaskan dari hukuman” tidak memiliki objek yang tersirat dalam bahasa Indonesia dan kurang langsung mencerminkan penegasan Ibrani וְנַקֵּה לֹא יְנַקֶּה. Selain itu, “memperhitungkan kesalahan ... kepada anak-anak” dapat terdengar sebagai pengimputasian kesalahan itu sendiri, bukan tindakan penghukuman/penuntutan yang dinyatakan oleh פקד.
  naturalness: Bahasa selebihnya baku dan bernada khidmat. “Panjang sabar” dan “kasih setia” alami dalam register Alkitab Indonesia. “Hingga generasi ketiga dan keempat” lebih alami serta tepat daripada “sampai kepada keturunan ketiga dan sampai kepada keturunan keempat.”
  terminology: “Yahweh,” “kasih setia,” “kesalahan,” dan “pelanggaran” dapat dipertahankan. “Tidak akan membiarkan tanpa hukuman” menyatakan daya penegasan konstruksi Ibrani tanpa menambahkan “orang yang bersalah” sebagai objek eksplisit. “Menuntut kesalahan para ayah pada anak-anak mereka” mempertahankan ungkapan yudisial yang sulit tanpa menjelaskannya sebagai sekadar akibat alamiah.
