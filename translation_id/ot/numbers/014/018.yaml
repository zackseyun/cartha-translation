language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְהוָ֗ה אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד נֹשֵׂ֥א עָוֺ֖ן וָ/פָ֑שַׁע וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֞ד עֲוֺ֤ן אָבוֹת֙ עַל בָּנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/018.yaml
  text: Yahweh is slow to anger and abundant in steadfast love[a], forgiving iniquity and transgression, but he will by no means clear the guilty[d][c][b], visiting the iniquity of fathers on children to the third and to the fourth generation.
translation:
  language: id
  text: Yahweh panjang sabar dan berlimpah dalam kasih setia[a], mengampuni[b] kesalahan dan pelanggaran, tetapi Ia sekali-kali tidak akan membiarkan tanpa hukuman[c]. Ia menuntut kesalahan para ayah pada anak-anak mereka hingga generasi ketiga dan keempat[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “besar dalam kesetiaan perjanjian,” “kaya dalam belas kasih,” atau “berlimpah dalam kasih yang teguh.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “mengampuni” secara harfiah berarti “menanggung” atau “membawa” kesalahan dan pelanggaran.
    reason: lexical_alternative
  - marker: c
    text: Atau “sama sekali tidak membebaskan” atau “pasti tidak membiarkan tanpa hukuman.”
    reason: lexical_alternative
  - marker: d
    text: Dalam bahasa Ibrani, ungkapan “yang ketiga” dan “yang keempat” secara tersirat menunjuk pada generasi.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama pribadi ilahi yang terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֶרֶךְ אַפַּיִם
  choice: panjang sabar
  rationale: Ungkapan Ibrani ini secara harfiah berkaitan dengan 'panjang hidung', suatu idiom untuk lambat menjadi marah. 'Panjang sabar' merupakan padanan Indonesia yang alami dan bermartabat.
- source_word: רַב חֶסֶד
  choice: berlimpah dalam kasih setia
  rationale: חֶסֶד mencakup kasih yang teguh, kesetiaan relasional atau perjanjian, dan belas kasih; 'kasih setia' mempertahankan keluasan makna itu, sedangkan 'berlimpah' mencerminkan רַב.
- source_word: נֹשֵׂא עָוֺן וָפָשַׁע
  choice: mengampuni kesalahan dan pelanggaran
  rationale: Dalam hubungan dengan dosa, נשׂא dapat berarti menanggung, membawa, atau menghapus sehingga mengampuni. Padanan ini alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan citra harfiahnya.
- source_word: עָוֺן
  choice: kesalahan
  rationale: Kata ini dapat menunjuk pada perbuatan menyimpang maupun kesalahan atau kesalahan yang mendatangkan tanggungan; 'kesalahan' cukup luas tanpa mempersempitnya hanya menjadi hukuman.
- source_word: פָשַׁע
  choice: pelanggaran
  rationale: Kata ini mengandung gagasan pelanggaran atau pemberontakan. 'Pelanggaran' membedakannya dari עָוֺן tanpa menjadikan unsur pemberontakan lebih eksplisit daripada yang diperlukan.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: tetapi sekali-kali Ia tidak membebaskan dari hukuman
  rationale: Konstruksi infinitif absolut dengan verba berhingga menegaskan penyangkalan. Ungkapan Indonesia ini menyampaikan daya yudisialnya tanpa menambahkan objek eksplisit seperti 'orang yang bersalah' ke dalam teks utama.
- source_word: פֹּקֵד עֲוֺן אָבוֹת עַל בָּנִים
  choice: Ia memperhitungkan kesalahan para ayah kepada anak-anak mereka
  rationale: פקד di sini menyatakan tindakan ilahi yang menghadapkan atau membebankan kesalahan beserta akibat yudisialnya. 'Memperhitungkan ... kepada' mempertahankan ketegangan tanpa mereduksinya menjadi akibat alamiah belaka.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: sampai kepada keturunan ketiga dan sampai kepada keturunan keempat
  rationale: Bahasa Ibrani menyebut 'yang ketiga' dan 'yang keempat' secara eliptis. 'Keturunan' ditambahkan demi kejelasan, dan pengulangan 'sampai kepada' mencerminkan pengulangan preposisi sumber.
theological_decisions:
- issue: Pengampunan ilahi dan penghakiman ilahi
  choice: Mempertahankan pernyataan bahwa Yahweh mengampuni, tetapi sama sekali tidak membebaskan dari hukuman.
  alternative: Menyelaraskannya dengan mengartikan bagian kedua hanya sebagai penolakan mengampuni orang yang tidak bertobat.
  rationale: Teks tidak menyebut syarat pertobatan di ayat ini; terjemahan harus mempertahankan ketegangan teologis yang dinyatakan sumber.
- issue: Kesalahan antargenerasi
  choice: Mempertahankan bahwa kesalahan para ayah diperhitungkan kepada anak-anak sampai keturunan ketiga dan keempat.
  alternative: Mengartikannya semata-mata sebagai akibat alamiah yang dialami generasi berikutnya.
  rationale: פקד dalam konteks ini memiliki daya tindakan dan penghakiman ilahi. Terjemahan tidak boleh menghapus ketegangan dengan ajaran tanggung jawab perseorangan dalam bagian Kitab Suci lain.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Nama 'Yahweh' dipertahankan. Kapitalisasi pronomina 'Ia' mengikuti register religius Indonesia, tanpa menambahkan gelar yang tidak ada dalam sumber. Pemenggalan menjadi dua kalimat menjaga keterbacaan tanpa mengubah hubungan makna.
