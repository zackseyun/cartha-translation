  text: בַּ/מִּדְבָּ֣ר הַ֠/זֶּה יִפְּל֨וּ פִגְרֵי/כֶ֜ם וְ/כָל פְּקֻדֵי/כֶם֙ לְ/כָל מִסְפַּרְ/כֶ֔ם מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה אֲשֶׁ֥ר הֲלִֽינֹתֶ֖ם עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/029.yaml
  text: In this wilderness your dead bodies will fall[a], all of you who were counted according to your whole number, from twenty years old and upward[c][b], who have grumbled against me.
translation:
  language: id
  text: Di padang gurun ini mayat-mayat kalian akan jatuh[a], yaitu semua orang di antara kalian yang terdaftar dalam sensus[b], menurut seluruh jumlah kalian, dari usia dua puluh tahun ke atas, yang telah bersungut-sungut terhadap-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mayat-mayat kalian akan jatuh.” Ungkapan Ibrani ini konkret dan menekankan kematian jasmani di padang gurun.
    reason: lexical_alternative
  - marker: b
    text: “Terdaftar dalam sensus” merujuk kepada mereka yang didata dalam pencacahan atau pengerahan umat Israel.
    reason: cultural_note
lexical_decisions:
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: Di padang gurun ini
  rationale: “Padang gurun” merupakan padanan Indonesia yang alami bagi מִדְבָּר dan mempertahankan latar pengembaraan Israel.
- source_word: יִפְּלוּ פִגְרֵיכֶם
  choice: mayat-mayat kalian akan bergelimpangan
  rationale: פֶּגֶר menunjuk pada mayat, sedangkan נפל berarti jatuh. “Bergelimpangan” secara alami mempertahankan gambaran konkret tentang mayat-mayat yang jatuh, tanpa memperhalusnya menjadi sekadar “kalian akan mati”.
- source_word: וְכָל פְּקֻדֵיכֶם לְכָל מִסְפַּרְכֶם
  choice: yaitu kalian semua yang terdaftar dalam sensus—seluruh jumlah kalian
  rationale: פְּקֻדִים merujuk kepada orang-orang yang didata atau dihitung dalam sensus. Susunan ini menyampaikan cakupan menyeluruh dari frasa לְכָל מִסְפַּרְכֶם dalam bahasa Indonesia yang tetap jelas.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: yang berumur dua puluh tahun ke atas
  rationale: Ini adalah rumusan ambang usia yang lazim dalam konteks sensus; “dua puluh tahun ke atas” merupakan ungkapan Indonesia modern yang tepat.
- source_word: אֲשֶׁר הֲלִינֹתֶם עָלָי
  choice: yang telah bersungut-sungut terhadap-Ku
  rationale: Dalam kisah pengembaraan, bentuk dari לון menyatakan keluhan yang bernada memberontak. “Bersungut-sungut” mempertahankan nuansa tersebut, sedangkan “terhadap” mencerminkan arah permusuhan dalam עָלַי.
theological_decisions:
- issue: Konkret atau tidaknya bahasa penghukuman
  choice: Mempertahankan gambaran fisik “mayat-mayat kalian akan bergelimpangan.”
  alternative: “Kalian akan mati di padang gurun ini.”
  rationale: Teks Ibrani menonjolkan mayat sebagai akibat nyata penghukuman. Terjemahan yang hanya menyatakan kematian akan menghilangkan kekuatan gambaran tersebut.
- issue: Cakupan kelompok yang dijatuhi hukuman
  choice: Menghubungkan hukuman dengan seluruh orang berumur dua puluh tahun ke atas yang terdaftar dan bersungut-sungut.
  alternative: Membaca frasa sensus sebagai kelompok tambahan yang terpisah.
  rationale: Rangkaian klausa Ibrani paling wajar menggambarkan kelompok sensus yang menyeluruh, dengan batas usia dan tindakan bersungut-sungut sebagai penjelasnya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Kata ganti “kalian” dipakai untuk mempertahankan bentuk jamak Ibrani; “terhadap-Ku” menandai bahwa pembicara adalah Allah tanpa mengubah isi kalimat.
