  text: וַ/יִּפֹּ֥ל מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן עַל פְּנֵי/הֶ֑ם לִ/פְנֵ֕י כָּל קְהַ֥ל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/005.yaml
  text: Then Moses and Aaron fell on their faces before the whole assembly of the congregation of the sons of Israel[a][b].
translation:
  language: id
  text: Lalu Musa dan Harun tersungkur dengan muka ke tanah di hadapan seluruh perhimpunan umat bani Israel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Israel” atau “anak-anak Israel”. Secara harfiah, bahasa Ibrani berbunyi “anak-anak lelaki Israel”; “bani Israel” adalah sebutan kolektif bagi keturunan Israel.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani yang diterjemahkan “perhimpunan umat” memakai dua istilah komunal yang berkaitan, sehingga memberi penekanan pada seluruh komunitas yang berkumpul.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: tersungkur
  rationale: Bentuk naratif dari נפל pada dasarnya berarti ‘jatuh’. Dalam konteks frasa berikutnya, ‘tersungkur’ menyampaikan tindakan jatuh merendahkan diri tanpa menentukan apakah tindakan itu merupakan penyembahan.
- source_word: עַל פְּנֵיהֶם
  choice: dengan muka ke tanah
  rationale: Ungkapan Ibrani harfiah ‘pada muka mereka’ menggambarkan posisi tubuh tertelungkup. Padanan ini alami dalam bahasa Indonesia dan mempertahankan gambaran fisiknya.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Preposisi ini menyatakan kehadiran secara ruang dan terbuka di depan seluruh umat; ‘di hadapan’ sesuai dengan suasana resmi adegan tersebut.
- source_word: כָּל
  choice: seluruh
  rationale: Dengan nomina kolektif, ‘seluruh’ menyatakan totalitas secara alami dalam bahasa Indonesia.
- source_word: קְהַל
  choice: perhimpunan
  rationale: קָהָל menunjuk kepada orang-orang yang berhimpun sebagai suatu kumpulan. ‘Perhimpunan’ mempertahankan unsur berkumpul dan cocok dalam rangkaian dengan עֵדָה.
- source_word: עֲדַת
  choice: umat
  rationale: עֵדָה menunjuk kepada komunitas atau umat sebagai kelompok yang teratur. ‘Umat’ alami untuk komunitas Israel dan tetap dibedakan dari ‘perhimpunan’.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan Ibrani secara harfiah berarti ‘anak-anak lelaki Israel’. ‘Bani Israel’ merupakan ungkapan Indonesia yang mapan bagi keturunan Israel, tetap dekat dengan bentuk sumber, dan tidak membatasi rujukannya hanya kepada laki-laki dewasa.
theological_decisions:
- issue: Apakah dua istilah kolektif קְהַל עֲדַת perlu dilebur menjadi satu
  choice: Mempertahankan keduanya sebagai ‘perhimpunan umat’
  alternative: ‘seluruh umat’ atau ‘jemaat yang berhimpun’
  rationale: Teks Ibrani memakai dua nomina komunal yang berkaitan. Mempertahankan keduanya menjaga tekanan resmi dan komunal tanpa membuat ungkapannya janggal dalam bahasa Indonesia.
- issue: Apakah tindakan Musa dan Harun harus disebut ‘sujud’
  choice: ‘tersungkur dengan muka ke tanah’
  alternative: ‘sujud’ atau ‘menjatuhkan diri’
  rationale: Teks menggambarkan postur merendahkan diri, tetapi tidak secara eksplisit menyebut objek penyembahan. Pilihan ini mempertahankan gambaran dan menghindari penetapan makna ibadah yang lebih khusus.
- issue: Cara menerjemahkan בְּנֵי יִשְׂרָאֵל
  choice: ‘bani Israel’
  alternative: ‘orang Israel’, ‘umat Israel’, atau ‘anak-anak Israel’
  rationale: ‘Bani Israel’ mempertahankan gagasan keturunan dalam ungkapan sumber sekaligus berfungsi secara idiomatis sebagai sebutan kolektif bagi bangsa itu.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. ‘Lalu’ mempertahankan alur naratif; ‘tersungkur dengan muka ke tanah’ menyampaikan idiom tubuh secara jelas; dan ‘perhimpunan umat’ sengaja mempertahankan dua unsur kolektif dalam teks Ibrani.
