  text: they certainly shall not see the land that I swore to their fathers[b][a], and none of those who despised me shall see it.
translation:
  language: id
  text: Sekali-kali mereka tidak akan melihat negeri itu[a] yang dengan sumpah Kujanjikan kepada leluhur mereka[b]. Tidak seorang pun dari mereka yang menghina Aku akan melihatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani secara harfiah berbunyi, “jika mereka melihat negeri itu.” Dalam formula sumpah ini, maksudnya adalah penyangkalan yang sangat tegas: “sekali-kali mereka tidak akan melihat negeri itu.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bapa-bapa mereka”; dapat juga diterjemahkan “bapa leluhur mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: sekali-kali ... tidak
  rationale: Dalam konteks sumpah ilahi ini, אִם bukan menyatakan syarat biasa, melainkan berfungsi sebagai penyangkalan yang sangat tegas. Ungkapan Indonesia ini menyampaikan daya penegasannya secara wajar.
- source_word: יִרְאוּ
  choice: akan melihat
  rationale: ראה secara harfiah berarti 'melihat', tetapi dalam konteks ini juga menyiratkan mengalami atau memasuki negeri itu. Terjemahan mempertahankan kata 'melihat' dan membiarkan implikasi konteks tetap terbuka.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Kata ini menunjuk kepada wilayah yang dijanjikan kepada para leluhur Israel. 'Negeri' lebih alami daripada 'tanah' ketika yang dimaksud ialah suatu wilayah tempat bangsa itu akan tinggal.
- source_word: נִשְׁבַּעְתִּי
  choice: dengan sumpah Kujanjikan
  rationale: Bentuk Niphal dari שבע menyatakan tindakan bersumpah. Susunan ini alami dalam bahasa Indonesia dan menjelaskan bahwa janji tersebut diteguhkan dengan sumpah tanpa mengurangi kekuatan perjanjiannya.
- source_word: לַאֲבֹתָם
  choice: kepada leluhur mereka
  rationale: Dalam konteks perjanjian, frasa ini menunjuk kepada para pendahulu laki-laki Israel, terutama para bapa leluhur. 'Leluhur mereka' merupakan ungkapan Indonesia yang alami; arti harfiahnya dicatat dalam catatan kaki.
- source_word: וְכָל ... לֹא
  choice: tidak seorang pun
  rationale: Gabungan unsur menyeluruh dengan penyangkalan paling wajar diungkapkan secara distributif sebagai 'tidak seorang pun' dalam bahasa Indonesia.
- source_word: מְנַאֲצַי
  choice: mereka yang menghina Aku
  rationale: Partisipel dari נאץ menyatakan sikap merendahkan, menolak, atau memperlakukan dengan hina. 'Menghina Aku' lugas, mudah dipahami, dan mempertahankan bobot moral ungkapan itu.
- source_word: לֹא יִרְאוּהָ
  choice: tidak ... akan melihatnya
  rationale: Akhiran pronominal feminin merujuk kembali kepada 'negeri'. Pengulangan kata 'melihat' dipertahankan sesuai dengan susunan Ibrani dan menegaskan putusan ilahi.
theological_decisions:
- issue: Daya formula sumpah pembuka
  choice: 'Diterjemahkan sebagai penyangkalan tegas: ''Sekali-kali mereka tidak akan melihat'''
  alternative: 'Diterjemahkan secara harfiah: ''Jika mereka melihat negeri itu'''
  rationale: Sesudah pernyataan sumpah dalam ayat sebelumnya, אִם membentuk formula sumpah yang secara idiomatis berarti bahwa hal tersebut pasti tidak akan terjadi. Terjemahan harfiah sebagai kalimat bersyarat akan mengaburkan daya putusan ilahi.
- issue: Cakupan אָבוֹת
  choice: Menggunakan 'leluhur mereka' dalam teks utama
  alternative: Menggunakan 'bapa-bapa mereka' atau 'bapa leluhur mereka'
  rationale: Kata Ibrani berbentuk maskulin dan secara harfiah berarti 'bapa-bapa mereka', tetapi dalam konteks ini menunjuk kepada para pendahulu Israel penerima janji. 'Leluhur' alami dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan informasi bentuk harfiahnya.
- issue: Arti 'melihat' negeri
  choice: Mempertahankan metafora sumber dengan 'melihat'
  alternative: Menjelaskannya sebagai 'memasuki' atau 'menikmati' negeri itu
  rationale: Dalam konteks, 'melihat' dapat mencakup mengalami dan memasuki negeri itu, tetapi teks tidak memakai kata kerja 'masuk'. Mempertahankan 'melihat' menghindari penyempitan makna.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Sekali-kali ... tidak' mempertahankan nada keputusan yang tegas; kapitalisasi pada 'Ku-' dan 'Aku' menandai pembicara ilahi menurut kebiasaan ortografi Alkitab bahasa Indonesia.
