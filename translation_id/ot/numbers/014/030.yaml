  text: אִם אַתֶּם֙ תָּבֹ֣אוּ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לְ/שַׁכֵּ֥ן אֶתְ/כֶ֖ם בָּ֑/הּ כִּ֚י אִם כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/030.yaml
  text: Surely you shall not come into the land in which I raised my hand to settle you[a], except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: id
  text: Sungguh, kalian tidak akan masuk ke negeri yang tentangnya Aku mengangkat tangan-Ku untuk membuat kalian tinggal di sana,[a] kecuali Kaleb anak Yefune dan Yosua anak Nun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “negeri yang tentangnya Aku mengangkat tangan-Ku untuk membuat kalian tinggal di dalamnya.” Mengangkat tangan merupakan isyarat sumpah; maksudnya, Allah telah bersumpah akan memberikan negeri itu kepada mereka.
    reason: cultural_note
lexical_decisions:
- source_word: אִם אַתֶּם תָּבֹאוּ
  choice: Sungguh, kalian tidak akan masuk
  rationale: Dalam pernyataan ilahi bernuansa sumpah ini, אִם berfungsi sebagai penyangkalan tegas, bukan syarat biasa. Bentuk ini menyampaikan kepastian hukuman dengan wajar dalam bahasa Indonesia.
- source_word: אֶל הָאָרֶץ
  choice: ke negeri
  rationale: Dengan verba בוא, frasa ini menunjuk gerak memasuki suatu wilayah. Dalam bahasa Indonesia, 'masuk ke negeri' merupakan ungkapan yang alami.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: yang tentangnya Aku mengangkat tangan
  rationale: Terjemahan ini mempertahankan gambaran konkret tindakan mengangkat tangan sebagai isyarat sumpah, tanpa menggantikannya sepenuhnya dengan penafsiran.
- source_word: לְשַׁכֵּן אֶתְכֶם בָּהּ
  choice: untuk menempatkan kalian di sana
  rationale: Bentuk kausatif שׁכן berarti membuat seseorang tinggal atau menetap. 'Menempatkan kalian di sana' mempertahankan unsur kausatif dan cocok dengan janji pemberian negeri.
- source_word: כִּי אִם
  choice: kecuali
  rationale: Konstruksi ini memperkenalkan satu-satunya orang yang dikecualikan dari penyangkalan sebelumnya.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: Kaleb anak Yefune
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia, dan patronimik Ibrani dipertahankan dengan 'anak'.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: dan Yosua anak Nun
  rationale: Konjungsi diterjemahkan secara langsung, sedangkan nama dan patronimik disajikan dalam bentuk Indonesia yang lazim.
theological_decisions:
- issue: Penerjemahan ungkapan sumpah tanpa mengaburkan hukuman ilahi
  choice: Sungguh, kalian tidak akan masuk ke negeri
  alternative: Jika kalian masuk ke negeri ...
  rationale: Dalam konteks keputusan penghukuman YHWH, אִם pada awal pernyataan merupakan rumus sumpah yang menyiratkan penyangkalan kuat. Terjemahan bersyarat secara harfiah akan menghasilkan penggalan kalimat yang menyesatkan dan melemahkan kepastian keputusan itu.
- issue: Makna tindakan mengangkat tangan
  choice: Mempertahankan gambaran 'Aku mengangkat tangan' dan menjelaskannya dalam catatan kaki
  alternative: Menerjemahkan langsung sebagai 'Aku bersumpah'
  rationale: Gambaran sumber dipertahankan dalam teks utama agar metafora budaya dan hubungan dengan sumpah tetap terlihat, sementara catatan menjelaskan maksudnya tanpa memasukkan penafsiran ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti jamak 'kalian' dipakai untuk memperjelas bahwa sapaan ditujukan kepada banyak orang. Huruf kapital pada 'Aku' mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Allah.
