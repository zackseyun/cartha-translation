  text: But as for you[a], your dead bodies will fall in this wilderness.
translation:
  language: id
  text: Tetapi kamu—mayatmu akan jatuh di padang gurun ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bangkaimu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פִגְרֵי/כֶם
  choice: mayatmu
  rationale: פֶּגֶר menunjuk pada tubuh yang sudah mati atau mayat. “Mayatmu” alami, lugas, dan mempertahankan kerasnya gambaran penghukuman tanpa menambahkan nada merendahkan seperti yang dapat muncul pada “bangkaimu”.
- source_word: אַתֶּם
  choice: kamu sendiri
  rationale: Kata ganti mandiri ini bersifat tegas dan kontras. “Kamu sendiri” menampilkan penekanan tersebut secara wajar dalam bahasa Indonesia.
- source_word: יִפְּלוּ
  choice: akan bergelimpangan
  rationale: נפל secara harfiah berarti “jatuh”; dengan subjek “mayat,” konteksnya menggambarkan kematian dan tubuh-tubuh yang tergeletak. “Akan bergelimpangan” menghasilkan ungkapan Indonesia yang alami dan tetap konkret, meskipun bentuk Ibraninya secara gramatikal adalah “akan jatuh.”
- source_word: בַּ/מִּדְבָּר
  choice: di padang gurun
  rationale: מִדְבָּר menunjuk pada wilayah tandus atau belantara. “Padang gurun” merupakan istilah Indonesia yang lazim dan sesuai dengan latar perjalanan Israel.
- source_word: הַ/זֶּה
  choice: ini
  rationale: Kata penunjuk ini mengacu pada padang gurun tertentu tempat mereka berada; “ini” menyampaikan rujukan itu tanpa menambah penekanan.
theological_decisions:
- issue: Keparahan dan kekonkretan gambaran penghukuman dalam פִגְרֵיכֶם
  choice: mayatmu akan bergelimpangan
  alternative: bangkaimu akan jatuh; tubuhmu yang mati akan jatuh
  rationale: Terjemahan mempertahankan kenyataan jasmani dan kerasnya hukuman atas generasi itu, tetapi tidak menambah nada penghinaan yang tidak wajib terkandung dalam kata sumber. Ungkapan ini juga tidak memperluas ayat menjadi pernyataan teologis di luar makna langsungnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Tanda pisah menandai kontras dan penekanan pada אַתֶּם. Bentuk tunggal “-mu/kamu” dipakai sebagai sapaan kolektif yang alami, sedangkan “bergelimpangan” menunjukkan banyaknya mayat dalam kelompok yang disapa.
