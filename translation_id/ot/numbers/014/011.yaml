id: NUM.14.11
reference: Numbers 14:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַד אָ֥נָה יְנַאֲצֻ֖/נִי הָ/עָ֣ם הַ/זֶּ֑ה וְ/עַד אָ֨נָה֙ לֹא יַאֲמִ֣ינוּ בִ֔/י בְּ/כֹל֙ הָֽ/אֹת֔וֹת אֲשֶׁ֥ר עָשִׂ֖יתִי בְּ/קִרְבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/011.yaml
  text: And Yahweh said to Moses[a], “How long will this people treat me with contempt? And how long will they not believe in me[c][b], despite all the signs that I have done among them?”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Berapa lama lagi bangsa ini akan memperlakukan Aku dengan hina?[a] Berapa lama lagi mereka tidak akan percaya kepada-Ku[b], sekalipun Aku telah melakukan semua tanda itu di tengah-tengah mereka?[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan menghina Aku?” atau “akan menolak Aku dengan sikap menghina?”
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak akan menaruh kepercayaan kepada-Ku.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “di tengahnya”; bentuk tunggal itu merujuk kepada bangsa tersebut sebagai satu kelompok.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani dan tidak menggantinya dengan gelar.
- source_word: עַד אָנָה
  choice: Berapa lama lagi
  rationale: Ungkapan tanya waktu yang alami dalam bahasa Indonesia dan mempertahankan nada keluhan retoris.
- source_word: יְנַאֲצֻנִי
  choice: akan memperlakukan Aku dengan hina
  rationale: Kata kerja נאץ menyatakan penghinaan yang tampak dalam sikap menolak atau meremehkan; pilihan ini mempertahankan kekuatan relasionalnya.
- source_word: הָעָם הַזֶּה
  choice: bangsa ini
  rationale: Mempertahankan bentuk kolektif tunggal dan nada berjarak dalam ucapan Yahweh; dalam konteks ini עַם menunjuk kepada umat Israel sebagai suatu bangsa.
- source_word: לֹא יַאֲמִינוּ בִי
  choice: tidak akan percaya kepada-Ku
  rationale: Bentuk אמן dengan preposisi ב dapat mencakup percaya dan menaruh kepercayaan; terjemahan utama mempertahankan bahasa percaya, sedangkan nuansa kepercayaan dicatat dalam catatan kaki.
- source_word: בְּכֹל הָאֹתוֹת
  choice: sekalipun ... semua tanda itu
  rationale: 'Preposisi ב dipahami secara konsesif dalam konteks: ketidakpercayaan terus berlangsung meskipun semua tanda telah dilakukan.'
- source_word: הָאֹתוֹת
  choice: tanda
  rationale: Menerjemahkan אוֹת secara langsung tanpa menambahkan kata 'mukjizat', walaupun konteks menunjukkan tindakan luar biasa dari Allah.
- source_word: עָשִׂיתִי
  choice: Aku telah melakukan
  rationale: Bentuk perfektif menunjuk kepada tindakan yang sudah dilakukan dan tetap relevan bagi teguran saat ini.
- source_word: בְּקִרְבּוֹ
  choice: di tengah-tengah mereka
  rationale: Akhiran Ibrani secara harfiah berbentuk tunggal dan merujuk kembali kepada 'bangsa ini' sebagai kolektif; bentuk jamak lebih alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Cakupan makna percaya dalam לֹא יַאֲמִינוּ בִי
  choice: tidak akan percaya kepada-Ku
  alternative: tidak akan menaruh kepercayaan kepada-Ku
  rationale: Bahasa Ibrani memuat unsur mengakui kebenaran sekaligus mengandalkan pribadi yang dipercayai. Teks utama tidak mempersempitnya hanya kepada salah satu unsur, dan nuansa kepercayaan dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “Berapa lama lagi” mempertahankan susunan retoris Ibrani. Pronomina yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kebiasaan penulisan religius Indonesia, tanpa menambahkan penafsiran denominasi.
