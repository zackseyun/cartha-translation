  source_fidelity: Terjemahan secara setia menyampaikan struktur retoris yang diulang (עַד־אָנָה), penghinaan/penolakan terhadap Yahweh (נאץ), ketidakpercayaan kepada-Nya, serta hubungan konsesif dengan seluruh tanda yang telah dilakukan-Nya di tengah umat itu. "Bangsa ini" mempertahankan kolektif tunggal הָעָם הַזֶּה, dan "mereka" pada bagian akhir merupakan penyesuaian Indonesia yang wajar bagi kolektif tersebut.
  naturalness: Bahasa Indonesia baku, jelas, dan bernada layak untuk ujaran ilahi. Pengulangan "Berapa lama lagi" efektif dan alami. "Memperlakukan Aku dengan hina" sedikit lebih harfiah daripada "menghina Aku", tetapi tetap idiomatis dan secara baik mempertahankan gagasan perlakuan penuh penghinaan.
  terminology: '"Yahweh" konsisten dengan kebijakan nama ilahi yang diberikan. "Percaya kepada-Ku" adalah padanan langsung yang tepat untuk יַאֲמִינוּ בִי; alternatif "menaruh kepercayaan" secara tepat mencatat nuansa trust. "Tanda" tidak menambahkan unsur "mukjizat" yang tidak dinyatakan secara leksikal.'
