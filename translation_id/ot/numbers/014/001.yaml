  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan tindakan ‘mengangkat suara dan berseru’ dipertahankan untuk mencerminkan bentuk ungkapan Ibrani, sementara ‘umat’ dan ‘bangsa’ mempertahankan variasi עֵדָה dan עָם.
