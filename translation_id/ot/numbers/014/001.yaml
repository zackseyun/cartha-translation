translation:
  language: id
  text: Lalu seluruh umat itu mengangkat suara mereka dan berseru[a], dan bangsa itu menangis pada malam itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “seluruh umat itu mengangkat [suara] ... dan mereka memberikan suara mereka,” suatu ungkapan untuk seruan keras bersama-sama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא
  choice: mengangkat
  rationale: Berasal dari נָשָׂא, ‘mengangkat/membawa’. Bersama ungkapan tentang suara, ‘mengangkat suara’ mempertahankan citra Ibrani dan tetap dapat dipahami dalam bahasa Indonesia.
- source_word: כָּל הָעֵדָה
  choice: seluruh umat itu
  rationale: עֵדָה menunjuk kepada komunitas Israel yang berhimpun. ‘Seluruh umat itu’ alami dalam bahasa Indonesia dan mempertahankan כָּל serta acuan tertentu pada komunitas tersebut.
- source_word: וַיִּתְּנוּ אֶת־קוֹלָם
  choice: dan berseru
  rationale: Secara harfiah berarti ‘memberikan suara mereka’, sebuah idiom untuk melontarkan seruan keras. ‘Berseru’ menyampaikan maknanya secara wajar, sedangkan unsur kerasnya tersirat dalam rangkaian ‘mengangkat suara dan berseru’.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עָם dapat berarti ‘rakyat’ atau ‘bangsa’. ‘Bangsa itu’ mempertahankan variasi leksikal terhadap עֵדָה tanpa mengaburkan bahwa kelompok yang sama sedang dibicarakan.
- source_word: וַיִּבְכּוּ
  choice: menangis
  rationale: בכה berarti ‘menangis/meratap’. ‘Menangis’ membedakannya dari seruan keras sebelumnya tanpa menambahkan intensitas yang tidak dinyatakan.
- source_word: בַּלַּיְלָה הַהוּא
  choice: pada malam itu
  rationale: Padanan Indonesia yang langsung dan alami untuk keterangan waktu ‘pada malam itu’.
