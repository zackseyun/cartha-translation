  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה לָ֥/מָּה זֶּ֛ה אַתֶּ֥ם עֹבְרִ֖ים אֶת פִּ֣י יְהוָ֑ה וְ/הִ֖וא לֹ֥א תִצְלָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/041.yaml
  text: But Moses said[c][b][a], “Why is this that you are transgressing the command of Yahweh? It will not succeed.”
translation:
  language: id
  text: Namun Musa berkata, “Mengapa kalian sampai melanggar perintah Yahweh? Hal itu tidak akan berhasil.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun Musa berkata
  rationale: 'Waw-konsekutif melanjutkan alur narasi, tetapi konteksnya bersifat kontras: Musa menanggapi tekad bangsa itu dengan peringatan.'
- source_word: לָמָה זֶּה
  choice: Mengapa
  rationale: Ungkapan ini memberi tekanan pada pertanyaan. Dalam bahasa Indonesia modern, tekanan tersebut tersampaikan secara alami melalui pertanyaan langsung tanpa konstruksi harfiah yang kaku.
- source_word: אַתֶּם עֹבְרִים
  choice: kalian melanggar
  rationale: Dengan objek פִּי יְהוָה, verba עבר bersifat idiomatis dan berarti melampaui atau melanggar apa yang diperintahkan, bukan menyeberang secara harfiah.
- source_word: אֶת פִּי יְהוָה
  choice: perintah Yahweh
  rationale: Secara harfiah berarti 'mulut Yahweh', tetapi dalam konteks ini menunjuk pada apa yang Yahweh firmankan atau perintahkan. 'Perintah Yahweh' paling jelas menyatakan pelanggaran terhadap arahan ilahi.
- source_word: וְהִוא
  choice: Usaha ini
  rationale: Pronomina feminin tunggal ini tampaknya merujuk pada tindakan atau upaya penyerbuan yang sedang direncanakan. Penyebutan eksplisit menghasilkan bahasa Indonesia yang jelas tanpa menutup rujukan kontekstualnya.
- source_word: לֹא תִצְלָח
  choice: tidak akan berhasil
  rationale: צלח di sini berarti berhasil atau mencapai hasil baik dalam suatu usaha; terjemahan ini alami dan tepat bagi rencana militer bangsa itu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung; 'Yahweh' mempertahankan nama diri tersebut alih-alih menggantinya dengan gelar.
- issue: Rujukan pronomina וְהִוא
  choice: Usaha ini tidak akan berhasil
  alternative: Itu tidak akan berhasil
  rationale: Pronomina tersebut kemungkinan menunjuk pada tindakan penyerbuan yang tersirat dalam konteks. 'Usaha ini' memperjelas rujukannya tanpa menambahkan penilaian teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kalian' dipakai karena subjek Ibrani berbentuk jamak dan Musa berbicara kepada bangsa itu. Susunan pertanyaan dibuat alami dalam bahasa Indonesia sambil mempertahankan nada teguran.
