base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/045.yaml
  text: Then the Amalekites and the Canaanites who lived in that hill country came down and struck them and beat them down as far as Hormah[a].
translation:
  language: id
  text: Lalu orang Amalek dan orang Kanaan yang tinggal di daerah pegunungan itu turun, memukul mereka, dan menghancurkan mereka sampai ke Horma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Horma adalah nama tempat; nama Ibraninya berkaitan dengan kata yang berarti “kehancuran” atau “dikhususkan untuk dimusnahkan”.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: turun
  rationale: Mempertahankan arah gerakan militer dari daerah pegunungan. Bentuk verba tunggal sebelum subjek majemuk merupakan konstruksi Ibrani yang lazim dan tidak perlu ditiru dalam bahasa Indonesia.
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: orang Amalek dan orang Kanaan
  rationale: Kedua sebutan bangsa berbentuk tunggal secara morfologis, tetapi dipakai secara kolektif; bentuk 'orang Amalek' dan 'orang Kanaan' alami dalam bahasa Indonesia.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: yang tinggal di daerah pegunungan itu
  rationale: יֹשֵׁב menyatakan bermukim, sedangkan הָר dalam konteks ini menunjuk kawasan bertopografi tinggi, bukan hanya satu gunung.
- source_word: וַיַּכּוּם
  choice: menyerang mereka
  rationale: נכה dapat berarti memukul, menyerang, atau mengalahkan. 'Menyerang' mempertahankan tindakan militer tanpa lebih dahulu menyerap intensifikasi dari verba berikutnya.
- source_word: וַיַּכְּתוּם
  choice: menghancurkan mereka
  rationale: Verba ini menggambarkan tindakan meremukkan atau menumpas secara keras setelah serangan pertama. 'Menghancurkan' menyampaikan peningkatan intensitas dengan bahasa Indonesia yang wajar tanpa menyatakan secara pasti bahwa semuanya dimusnahkan.
- source_word: עַד הַחָרְמָה
  choice: sampai ke Horma
  rationale: עַד menandai batas jangkauan, dan Horma dipertahankan sebagai nama tempat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas dengan nada naratif yang bermartabat. Nama etnis dan tempat mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia; catatan kaki mempertahankan permainan makna nama Horma tanpa mengganti nama tempat dalam teks utama.
