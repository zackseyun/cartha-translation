base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/017.yaml
  text: And now[a], please let the power of the Lord be great, just as you have spoken, saying,
translation:
  language: id
  text: 'Dan sekarang, biarlah kiranya kuasa Tuhan menjadi besar,[a] seperti yang telah Engkau firmankan:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kiranya kuasa Tuhan dinyatakan besar.”
    reason: Alternatif ini mencerminkan kemungkinan bahwa verba tersebut mengacu pada kuasa Tuhan yang diperlihatkan atau diagungkan, tanpa menyatakan bahwa kuasa itu bertambah secara hakiki.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Dan sekarang
  rationale: Mempertahankan baik penghubung ו maupun penanda waktu/wacana עתה yang mengawali permohonan Musa.
- source_word: יִגְדַּל נָא
  choice: biarlah kiranya ... menjadi besar
  rationale: Bentuk jusif menyatakan permohonan atau harapan, sedangkan נָא melembutkannya; 'kiranya' sesuai dengan ragam doa yang wajar dan bermartabat.
- source_word: כֹּחַ
  choice: kuasa
  rationale: Kata ini dapat berarti kekuatan atau kuasa; 'kuasa' paling sesuai untuk kemampuan ilahi dalam konteks ini.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Menerjemahkan gelar ilahi Adonai secara alami tanpa memperlakukannya sebagai bentuk khusus nama YHWH.
- source_word: כַּאֲשֶׁר
  choice: seperti
  rationale: Menyatakan kesesuaian antara permohonan Musa dan pernyataan Allah sebelumnya.
- source_word: דִּבַּרְתָּ
  choice: yang telah Engkau firmankan
  rationale: Bentuk perfektum menunjuk pada perkataan terdahulu yang tetap relevan; 'firmankan' lazim dan bermartabat untuk perkataan Allah.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Memperkenalkan kutipan yang berlanjut pada ayat berikut; titik dua lebih alami dalam bahasa Indonesia daripada menerjemahkannya secara kaku sebagai 'dengan berkata'.
theological_decisions:
- issue: Makna permohonan agar kuasa Tuhan 'menjadi besar'
  choice: 'Mempertahankan ungkapan dekat dengan bentuk Ibrani: ''menjadi besar'''
  alternative: '''dinyatakan besarlah'' atau ''nyatakanlah kebesaran kuasa Tuhan'''
  rationale: Teks Ibrani membiarkan hubungan antara kebesaran kuasa Tuhan dan penyataannya tetap terbuka. Terjemahan utama tidak menentukan bahwa kuasa itu bertambah secara hakiki ataupun hanya tampak besar.
- issue: Penerjemahan gelar ilahi אֲדֹנָי
  choice: Tuhan
  alternative: Sang Tuhan
  rationale: Bentuk sumber adalah gelar Adonai, bukan Tetragramaton. 'Tuhan' merupakan padanan Indonesia yang alami dan tidak memasukkan pembedaan tipografis yang tidak terdapat dalam teks ini.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam doa yang khidmat. Kapitalisasi 'Engkau' dipakai sebagai konvensi penghormatan dalam sapaan kepada Allah. Penutup 'demikian:' menghubungkan ayat ini secara alami dengan kutipan pada ayat berikut.
