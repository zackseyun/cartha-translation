  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל יְהוָ֑ה וְ/שָׁמְע֣וּ מִצְרַ֔יִם כִּֽי הֶעֱלִ֧יתָ בְ/כֹחֲ/ךָ֛ אֶת הָ/עָ֥ם הַ/זֶּ֖ה מִ/קִּרְבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/013.yaml
  text: But Moses said to Yahweh[a], “Then the Egyptians will hear, for by your power you brought up this people from among them.”
translation:
  language: id
  text: Tetapi Musa berkata kepada Yahweh, “Lalu orang Mesir akan mendengar tentang hal itu, sebab dengan kuasa-Mu Engkau telah membawa bangsa ini keluar dari tengah-tengah mereka.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dan orang Mesir telah mendengar bahwa dengan kuasa-Mu Engkau telah membawa bangsa ini keluar dari tengah-tengah mereka.” Bentuk kata kerja Ibrani dapat dipahami sebagai tindakan lampau atau sebagai akibat yang akan terjadi dalam permohonan Musa; teks utama memilih pengertian yang mengarah ke depan sesuai dengan alur argumen di sekitarnya.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Tetapi Musa berkata
  rationale: Waw-konsekutif melanjutkan narasi, tetapi konteks menunjukkan tanggapan yang berlawanan dengan keputusan penghukuman pada ayat sebelumnya; “Tetapi” menyatakan hubungan wacana itu secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan untuk mempertahankan nama pribadi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: וְשָׁמְעוּ
  choice: Lalu orang Mesir akan mendengarnya
  rationale: Bentuk qatal dapat dibaca sebagai lampau atau sebagai akibat yang dipandang ke depan. Dalam alur permohonan Musa dan kelanjutannya pada ayat berikut, pengertian akibat mendatang paling sesuai; “Lalu” memperjelas kaitan konsekuensinya.
- source_word: מִצְרַיִם
  choice: orang Mesir
  rationale: Nama ini dapat menunjuk negeri atau penduduknya. Karena subjeknya melakukan tindakan mendengar, rujukan kepada penduduk Mesir paling alami.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan dasar penjelasan bagi pernyataan tentang apa yang akan didengar orang Mesir.
- source_word: הֶעֱלִיתָ
  choice: Engkau telah membawa ... keluar
  rationale: Hifil dari עלה secara harfiah berarti “membawa naik”. Dalam konteks keluaran dari Mesir, “membawa keluar” menyampaikan arah tindakan secara alami dalam bahasa Indonesia, sedangkan aspek selesainya tindakan dipertahankan dengan “telah”.
- source_word: בְכֹחֲךָ
  choice: dengan kuasa-Mu
  rationale: Preposisi ב menyatakan sarana; frasa ini menekankan bahwa pembebasan itu dilakukan melalui kuasa Yahweh.
- source_word: הָעָם הַזֶּה
  choice: bangsa ini
  rationale: עם adalah nomina kolektif yang di sini menunjuk umat Israel. “Bangsa ini” alami dan tetap mempertahankan bentuk kolektif tunggal.
- source_word: מִקִּרְבּוֹ
  choice: dari tengah-tengah mereka
  rationale: Akhiran tunggal merujuk secara kolektif kepada Mesir. Bahasa Indonesia idiomatis memakai “mereka” untuk penduduk Mesir, sambil menyampaikan arti keluar dari lingkungan mereka.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar atau memilih bentuk tradisional alternatif.
- issue: Nilai waktu וְשָׁמְעוּ dalam permohonan Musa
  choice: 'akibat mendatang: “akan mendengarnya”'
  alternative: 'lampau: “telah mendengar”'
  rationale: Bentuk Ibrani memungkinkan pembacaan lampau, tetapi konteks ancaman pemusnahan Israel dan rangkaian alasan dalam ayat berikut mendukung pembacaan prospektif. Kemungkinan lampau tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat jelas bagi pembaca umum, dengan kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan langsung dalam teks utama.
