  to: Tetapi Musa berkata kepada Yahweh, “Lalu orang Mesir akan mendengar tentang hal itu, sebab dengan kuasa-Mu Engkau telah membawa bangsa ini keluar dari tengah-tengah mereka.[a]”
  rationale: Revisi hanya memperjelas objek tersirat dari “mendengar” dalam bahasa Indonesia. Tidak ada perubahan pada pembacaan prospektif, pada nama ilahi, atau pada makna dasar tindakan Yahweh membawa Israel keluar dari Mesir. Catatan kaki tetap mempertahankan alternatif pembacaan lampau dan jangkar [a] tetap berada pada akhir klausa yang relevan.
