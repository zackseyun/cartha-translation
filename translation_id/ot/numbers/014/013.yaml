  naturalness: Kalimat utama memerlukan objek yang jelas untuk “mendengarnya”; pronomina -nya tidak memiliki anteseden eksplisit dalam bahasa Indonesia. “Tentang hal itu” secara wajar mengungkapkan rujukan yang tersirat dalam argumen Musa tanpa menentukan secara berlebihan isi berita tersebut.
  terminology: “Yahweh” tepat untuk יהוה sesuai kebijakan yang diberikan. “Orang Mesir,” “kuasa-Mu,” dan “bangsa ini” baku dan sesuai register. Kapitalisasi pronomina ilahi konsisten.
