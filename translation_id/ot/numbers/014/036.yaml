  text: וְ/הָ֣/אֲנָשִׁ֔ים אֲשֶׁר שָׁלַ֥ח מֹשֶׁ֖ה לָ/ת֣וּר אֶת הָ/אָ֑רֶץ וַ/יָּשֻׁ֗בוּ ו/ילונו עָלָי/ו֙ אֶת כָּל הָ֣/עֵדָ֔ה לְ/הוֹצִ֥יא דִבָּ֖ה עַל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/036.yaml
  text: The men whom Moses sent to scout out the land returned and caused the whole congregation to grumble against him by bringing out a bad report about the land[a][b].
translation:
  language: id
  text: Orang-orang yang diutus Musa untuk menyelidiki negeri itu[a] kembali dan membuat seluruh umat bersungut-sungut terhadapnya dengan menyampaikan kabar buruk tentang negeri itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk mengintai negeri itu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan menyebarkan kabar buruk tentang negeri itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Orang-orang
  rationale: Kata penghubung Ibrani melanjutkan kisah, tetapi dalam bahasa Indonesia hubungan itu sudah jelas dari konteks sehingga tidak perlu ditambah penanda wacana seperti “Adapun” atau “Kemudian”.
- source_word: אֲשֶׁר שָׁלַח מֹשֶׁה
  choice: yang diutus Musa
  rationale: Klausa relatif ini diterjemahkan secara langsung dan alami; bentuk pasif menjaga orang-orang itu sebagai pokok kalimat.
- source_word: לָתוּר אֶת־הָאָרֶץ
  choice: untuk menyelidiki negeri itu
  rationale: תור menunjuk pada peninjauan atau pengumpulan keterangan tentang Kanaan. “Menyelidiki” cukup luas untuk mempertahankan maknanya tanpa memberi kesan spionase yang terlalu khusus.
- source_word: וַיָּשֻבוּ
  choice: kembali
  rationale: Padanan ringkas dan wajar bagi verba naratif שוב.
- source_word: וילונו עָלָיו
  choice: membuat seluruh umat bersungut-sungut terhadapnya
  rationale: 'Bentuk dan susunan kalimat menunjukkan makna kausatif: orang-orang itu menyebabkan umat mengeluh terhadap Musa. “Bersungut-sungut” mempertahankan motif keluhan umat di padang gurun.'
- source_word: אֶת כָּל־הָעֵדָה
  choice: seluruh umat
  rationale: עֵדָה di sini ialah komunitas Israel secara keseluruhan. “Umat” alami dalam bahasa Indonesia dan mempertahankan pengertian kolektifnya.
- source_word: לְהוֹצִיא דִבָּה
  choice: dengan menyampaikan kabar buruk
  rationale: Infinitif menyatakan cara atau sarana. דִבָּה adalah kabar yang mencemarkan atau mengecilkan hati; “kabar buruk” jelas dan tidak menambahkan penilaian yang tidak dinyatakan.
- source_word: עַל־הָאָרֶץ
  choice: tentang negeri itu
  rationale: עַל bersama דִבָּה menandai pokok kabar tersebut; “tentang” merupakan padanan Indonesia yang paling alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Kata ganti “-nya” mempertahankan rujukan pronominal teks Ibrani kepada Musa tanpa mengulang namanya.
