base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/007.yaml
  text: And they said to all the congregation of the sons of Israel[b][a], “The land through which we passed to spy it out is an exceedingly good land.”
translation:
  language: id
  text: Lalu mereka berkata kepada seluruh jemaat Israel[a], “Negeri yang telah kami lalui untuk mengintainya[b] itu sangat, sangat baik.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh umat Israel.”
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk menjelajahinya” atau “untuk menyelidikinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu mereka berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi dan memperkenalkan ucapan langsung; “lalu” wajar dalam narasi Indonesia.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: seluruh umat Israel
  rationale: עֵדָה menunjuk komunitas yang berhimpun, sedangkan בְּנֵי יִשְׂרָאֵל merupakan sebutan kolektif bagi orang Israel. “Umat Israel” alami, ringkas, dan tetap bermartabat.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan sebagai kata tersendiri
  rationale: Infinitif pengantar ucapan ini sudah terwakili secara alami oleh tanda baca dan kutipan langsung dalam bahasa Indonesia.
- source_word: הָאָרֶץ
  choice: Negeri
  rationale: Kata ini merujuk pada wilayah Kanaan yang sedang dibicarakan; “negeri” sesuai untuk suatu wilayah atau tanah kediaman.
- source_word: אֲשֶׁר עָבַרְנוּ בָהּ
  choice: yang telah kami lalui
  rationale: עבר dengan ב menyatakan gerak melintasi atau melalui suatu tempat. Bentuk ini alami dan mempertahankan makna geraknya.
- source_word: לָתוּר אֹתָהּ
  choice: untuk mengintainya
  rationale: Dalam konteks pengutusan para pengintai di Bilangan, תור berarti melakukan peninjauan atau pengamatan atas wilayah tersebut; “mengintai” mempertahankan nuansa misi pengintaian.
- source_word: טוֹבָה
  choice: baik
  rationale: Padanan dasar bagi טוֹבָה adalah “baik”; kadar penekanannya disampaikan oleh adverbia berikutnya.
- source_word: מְאֹד מְאֹד
  choice: sangat, sangat
  rationale: Pengulangan “sangat” mempertahankan bentuk dan daya tekan pengulangan Ibrani, sekalipun ungkapan “sungguh sangat” juga mungkin dalam bahasa Indonesia.
