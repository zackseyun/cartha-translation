base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/043.yaml
  text: For the Amalekites and the Canaanites are there before you, and you will fall by the sword, because you have turned back from following Yahweh, and Yahweh will not be with you.
translation:
  language: id
  text: Sebab orang Amalek dan orang Kanaan ada di sana di hadapan kalian, dan kalian akan gugur oleh pedang, karena kalian telah berbalik dari mengikuti Yahweh, dan Yahweh tidak akan menyertai kalian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Konjungsi ini menerangkan alasan bagi larangan dan peringatan pada ayat sebelumnya; “Sebab” wajar sebagai pembuka kalimat penjelas.
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: orang Amalek dan orang Kanaan
  rationale: Kedua bentuk tunggal itu dipakai secara kolektif untuk kelompok etnis; pola “orang + nama bangsa” alami dalam bahasa Indonesia.
- source_word: שָׁם לִפְנֵיכֶם
  choice: ada di sana, di hadapan kalian
  rationale: Mempertahankan baik unsur lokatif “di sana” maupun hubungan spasial “di hadapan kalian”; konteks menunjukkan bahwa musuh menghadang mereka.
- source_word: וּנְפַלְתֶּם בֶּחָרֶב
  choice: dan kalian akan tewas oleh pedang
  rationale: Secara harfiah berarti “kalian akan jatuh oleh pedang”; dalam konteks pertempuran, “tewas” menyampaikan maksud idiomatisnya dengan jelas tanpa menghilangkan gambaran pedang.
- source_word: כִּי עַל כֵּן
  choice: Karena
  rationale: Ungkapan ini memperkenalkan dasar sebab-akibat bagi kekalahan yang akan mereka alami; “Karena” menyampaikan fungsi kausalnya secara alami.
- source_word: שַׁבְתֶּם מֵאַחֲרֵי יְהוָה
  choice: kalian telah berbalik dan tidak lagi mengikuti Yahweh
  rationale: Mengungkapkan gerak berbalik dari posisi mengikuti Yahweh. Perumusan ini mempertahankan citra mengikuti sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: וְלֹא יִהְיֶה יְהוָה עִמָּכֶם
  choice: Yahweh tidak akan menyertai kalian
  rationale: “Menyertai” merupakan ungkapan Indonesia yang alami untuk kehadiran dan dukungan ilahi yang dimaksud oleh konstruksi “ada bersama kalian”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama יהוה secara langsung. “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna kehadiran Yahweh bersama umat
  choice: Yahweh tidak akan menyertai kalian
  alternative: Yahweh tidak akan ada bersama kalian
  rationale: “Menyertai” mempertahankan gagasan kehadiran yang sekaligus mengandung pertolongan dalam konteks perang, tanpa memperluasnya menjadi pernyataan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan langsung. Kata ganti jamak “kalian” dipakai karena bentuk Ibrani ditujukan kepada kelompok dan agar tidak ambigu seperti “kamu”. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual penting yang harus ditandai dalam ayat ini.
