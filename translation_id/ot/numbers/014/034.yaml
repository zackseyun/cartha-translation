revisions:
- from: Sesuai dengan jumlah hari kamu mengintai negeri itu, yaitu empat puluh hari—satu hari untuk satu tahun, satu hari untuk satu tahun—kamu harus menanggung kesalahanmu selama empat puluh tahun, dan kamu akan mengetahui bagaimana rasanya Aku menentang kamu.[a]
  to: Sesuai dengan jumlah hari kamu mengintai negeri itu, yaitu empat puluh hari—satu hari untuk satu tahun, satu hari untuk satu tahun—kamu harus menanggung kesalahanmu selama empat puluh tahun, dan kamu akan mengetahui bahwa Aku menentang kamu.[a]
  rationale: Revisi terbatas pada penghapusan tambahan interpretatif 'bagaimana rasanya' dan penyesuaian kecil pada catatan kaki. Parafrasa 'bahwa Aku menentang kamu' mempertahankan pilihan makna utama audit bahasa Inggris ('my opposition') dalam bahasa Indonesia yang alami, sementara catatan kaki menjaga ambiguitas leksikal תְּנוּאָתִי.
