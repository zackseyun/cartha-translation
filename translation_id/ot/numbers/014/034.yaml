  text: בְּ/מִסְפַּ֨ר הַ/יָּמִ֜ים אֲשֶׁר תַּרְתֶּ֣ם אֶת הָ/אָרֶץ֮ אַרְבָּעִ֣ים יוֹם֒ י֣וֹם לַ/שָּׁנָ֞ה י֣וֹם לַ/שָּׁנָ֗ה תִּשְׂאוּ֙ אֶת עֲוֺנֹ֣תֵי/כֶ֔ם אַרְבָּעִ֖ים שָׁנָ֑ה וִֽ/ידַעְתֶּ֖ם אֶת תְּנוּאָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/034.yaml
  text: According to the number of the days in which you spied out the land, forty days, a day for a year, a day for a year, you shall bear your iniquities forty years, and you shall know my opposition.
translation:
  language: id
  text: Sesuai dengan jumlah hari kamu mengintai negeri itu, yaitu empat puluh hari—satu hari untuk satu tahun, satu hari untuk satu tahun—kamu harus menanggung kesalahanmu selama empat puluh tahun, dan kamu akan mengetahui bahwa Aku menentang kamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “keterasingan-Ku,” “permusuhan-Ku,” atau “ketidaksenangan-Ku.” Istilah Ibrani ini langka dan maknanya tidak pasti. Istilah ini mungkin menunjuk pada sikap TUHAN yang menentang atau menjauh dari angkatan pemberontak ini; istilah ini tidak harus berarti bahwa Ia mengingkari janji-Nya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר הַיָּמִים
  choice: Sesuai dengan jumlah hari
  rationale: Frasa ini menyatakan kesepadanan antara jumlah hari pengintaian dan jumlah tahun hukuman; bentuk ini dekat dengan bahasa sumber sekaligus alami dalam bahasa Indonesia.
- source_word: תַּרְתֶּם
  choice: kamu mengintai
  rationale: Dalam konteks ini verba tersebut menunjuk pada misi pengintaian di Kanaan, bukan sekadar penjelajahan umum.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Yang dimaksud ialah negeri Kanaan yang baru saja dibicarakan; 'negeri itu' wajar dalam bahasa Indonesia dan tidak menambahkan penjelasan yang tidak tersurat.
- source_word: יוֹם לַשָּׁנָה יוֹם לַשָּׁנָה
  choice: satu hari untuk satu tahun, satu hari untuk satu tahun
  rationale: Pengulangan Ibrani dipertahankan karena memberi penekanan pada korespondensi satu hari dengan satu tahun.
- source_word: תִּשְׂאוּ אֶת עֲוֺנֹתֵיכֶם
  choice: kamu harus menanggung kesalahanmu
  rationale: Idiom ini mencakup kesalahan moral beserta akibatnya. 'Menanggung kesalahanmu' mempertahankan citra beban dan tidak mempersempitnya hanya menjadi hukuman.
- source_word: וִידַעְתֶּם
  choice: kamu akan mengetahui bagaimana rasanya
  rationale: ידע di sini bersifat pengalaman, bukan hanya pengetahuan intelektual. Ungkapan ini mengungkap dimensi pengalaman tanpa mengubah inti makna.
- source_word: תְּנוּאָתִי
  choice: Aku menentang kamu
  rationale: Nomina langka ini kemungkinan menyatakan sikap menentang, keterasingan, atau ketidaksenangan TUHAN terhadap angkatan yang memberontak. Bentuk verbal ini lebih alami dalam bahasa Indonesia daripada 'penentangan-Ku'.
theological_decisions:
- issue: Makna תְּנוּאָתִי yang langka dan peka secara teologis
  choice: bagaimana rasanya Aku menentang kamu
  alternative: keterasingan-Ku; permusuhan-Ku; ketidaksenangan-Ku; pemutusan hubungan oleh-Ku
  rationale: Pilihan utama sesuai dengan konteks penghukuman dan tidak menyiratkan bahwa Allah mengingkari janji. Catatan kaki mempertahankan ketidakpastian leksikal dengan menyebut kemungkinan keterasingan dan ketidaksenangan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan jamak Ibrani diterjemahkan dengan 'kamu', yang dalam konteks ini menunjuk kepada seluruh umat. Tanda pisah membantu mempertahankan pengulangan emphatik tanpa membuat kalimat sulit diikuti.
