source:
  edition: WLC
  text: סְלַֽח נָ֗א לַ/עֲוֺ֛ן הָ/עָ֥ם הַ/זֶּ֖ה כְּ/גֹ֣דֶל חַסְדֶּ֑/ךָ וְ/כַ/אֲשֶׁ֤ר נָשָׂ֨אתָה֙ לָ/עָ֣ם הַ/זֶּ֔ה מִ/מִּצְרַ֖יִם וְ/עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/019.yaml
  text: Please forgive the iniquity of this people according to the greatness of your steadfast love[a], just as you have forgiven this people from Egypt until now.
translation:
  language: id
  text: Ampunilah kiranya kesalahan bangsa ini sesuai dengan kebesaran kasih setia-Mu, sebagaimana Engkau telah menanggung[a] bangsa ini dari Mesir hingga sekarang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengampuni.” Kata kerja Ibrani ini dapat berarti “mengangkat, membawa, atau menanggung” dan, dalam konteks tertentu, “mengampuni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: סְלַח נָא
  choice: Ampunilah kiranya
  rationale: Bentuk imperatif סלח menyatakan permohonan agar mengampuni, sedangkan partikel נָא memberi nuansa permohonan yang sungguh-sungguh. “Ampunilah kiranya” mempertahankan keduanya dalam bahasa Indonesia yang wajar dan khidmat.
- source_word: לַעֲוֺן
  choice: kesalahan
  rationale: עָוֹן dapat menunjuk pada kejahatan, kesalahan, kesalahan moral beserta kesalahannya di hadapan hukum, atau akibatnya. Dalam konteks ini, “kesalahan” secara alami menyebut pelanggaran umat yang dimohonkan pengampunannya tanpa mempersempit makna hanya pada hukuman atau rasa bersalah.
- source_word: הָעָם הַזֶּה
  choice: bangsa ini
  rationale: עַם ialah nomina kolektif tunggal untuk suatu umat atau bangsa. “Bangsa ini” mempertahankan sifat kolektifnya dan sesuai dengan konteks Israel sebagai komunitas perjanjian.
- source_word: כְּגֹדֶל חַסְדֶּךָ
  choice: sesuai dengan kebesaran kasih setia-Mu
  rationale: גֹּדֶל berarti “kebesaran,” sedangkan חֶסֶד mencakup kasih yang teguh, kesetiaan, dan kemurahan dalam hubungan perjanjian. “Kasih setia” mempertahankan perpaduan kasih dan loyalitas tersebut.
- source_word: וְכַאֲשֶׁר
  choice: sebagaimana
  rationale: Kata penghubung ini memperkenalkan tindakan Allah sebelumnya sebagai dasar perbandingan bagi permohonan Musa. “Sebagaimana” menyatakannya dengan jelas dan wajar.
- source_word: נָשָׂאתָה
  choice: Engkau telah menanggung
  rationale: נשא pada dasarnya berarti mengangkat, membawa, atau menanggung, dan dalam konteks tertentu dapat berarti mengampuni. Karena objek langsungnya di sini adalah “bangsa ini,” bukan “kesalahan mereka,” “menanggung” mempertahankan gambaran Allah yang membawa dan bersabar terhadap umat-Nya, sementara kemungkinan makna “mengampuni” dicatat dalam catatan kaki.
- source_word: מִמִּצְרַיִם וְעַד הֵנָּה
  choice: sejak dari Mesir sampai sekarang
  rationale: Ungkapan ini mencakup kesinambungan dari Mesir hingga titik atau saat kini. “Sampai sekarang” menyampaikan tekanan temporal konteks dengan alami, sedangkan “sejak dari Mesir” mempertahankan titik awal geografis-historisnya.
theological_decisions:
- issue: Makna נָשָׂאתָה dalam permohonan Musa
  choice: Tindakan Allah sebelumnya digambarkan sebagai menanggung atau membawa bangsa itu, yang mencakup kesabaran dan pemeliharaan-Nya terhadap mereka.
  alternative: Engkau telah mengampuni bangsa ini sejak dari Mesir sampai sekarang.
  rationale: Karena objek verba tersebut ialah bangsa itu sendiri, bukan kesalahannya, makna lebih luas “menanggung/membawa” lebih dekat dengan bentuk Ibrani. Namun, karena נשא dapat bermakna “mengampuni” dalam konteks dosa, kemungkinan itu tidak dihapus, melainkan disajikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. “Ampunilah kiranya” mempertahankan kesungguhan permohonan, “kasih setia” menjaga nuansa relasional-perjanjian dari חֶסֶד, dan “menanggung” mempertahankan metafora serta ambiguitas leksikal sumber.
