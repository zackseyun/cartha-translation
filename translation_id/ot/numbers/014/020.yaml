  text: וַ/יֹּ֣אמֶר יְהוָ֔ה סָלַ֖חְתִּי כִּ/דְבָרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/020.yaml
  text: And Yahweh said[a], “I have forgiven, according to your word.”
translation:
  language: id
  text: Lalu Yahweh berkata, “Aku telah mengampuni sesuai dengan perkataanmu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Aku telah mengampuni seperti yang kaukatakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” menyatakan kesinambungan peristiwa secara alami tanpa menambahkan hubungan sebab-akibat yang tidak dinyatakan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap dipertahankan.
- source_word: סָלַחְתִּי
  choice: Aku telah mengampuni mereka
  rationale: Kata kerja סלח berarti mengampuni atau memaafkan. Bentuk perfektif diterjemahkan “telah mengampuni”. Objek “mereka” tersirat dari konteks permohonan Musa mengenai bangsa Israel dan diperlukan agar kalimat Indonesia alami.
- source_word: כִּדְבָרֶךָ
  choice: sesuai dengan perkataanmu
  rationale: Terjemahan ini mempertahankan unsur כ (“sesuai dengan”) dan דבר (“perkataan”), serta menghubungkan tindakan Yahweh dengan permohonan Musa.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi dan tidak menggantinya dengan sebuah gelar.
- issue: Cakupan pengampunan dalam konteks hukuman yang tetap menyusul
  choice: Mengampuni
  alternative: Memaafkan; mengampuni sepenuhnya tanpa konsekuensi
  rationale: סלח menyatakan pengampunan, tetapi ayat-ayat berikutnya tetap mengumumkan hukuman. Terjemahan tidak menambahkan bahwa semua konsekuensi dibatalkan, sehingga ketegangan naratif dan teologis tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “Aku” dan “-mu” mengikuti tuturan langsung Yahweh kepada Musa. Objek “mereka” ditambahkan secara kontekstual demi kealamian bahasa Indonesia, tanpa mengubah rujukannya.
