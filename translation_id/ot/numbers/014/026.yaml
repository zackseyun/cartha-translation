  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/026.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: id
  text: 'Yahweh[a] berfirman kepada Musa dan Harun demikian:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk Ibrani dan padanan tradisional nama ilahi.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Dalam rumus pengantar perkataan ilahi, verba דב״ר paling wajar diterjemahkan dengan “berfirman”; bentuk naratif berawalan waw membuka peristiwa tutur baru.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap dipertahankan, bukan diganti dengan gelar.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: kepada Musa dan Harun
  rationale: Preposisi אֶל menandai kedua orang yang disapa. Dalam bahasa Indonesia, satu “kepada” dapat secara alami berlaku bagi kedua nama tanpa mengaburkan bahwa keduanya adalah penerima firman.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif לֵאמֹר merupakan penanda baku yang mengantar perkataan langsung. “Demikian:” menyambungkan rumus pengantar ini secara alami dengan isi firman pada ayat berikutnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut, sementara catatan kaki memberitahukan padanan tradisional tanpa memasukkannya sebagai pengganti ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum, sedangkan tanda titik dua menunjukkan bahwa isi firman berlanjut pada ayat berikutnya.
