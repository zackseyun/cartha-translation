  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּ֔קֶר וַ/יַּֽעֲל֥וּ אֶל רֹאשׁ הָ/הָ֖ר לֵ/אמֹ֑ר הִנֶּ֗/נּוּ וְ/עָלִ֛ינוּ אֶל הַ/מָּק֛וֹם אֲשֶׁר אָמַ֥ר יְהוָ֖ה כִּ֥י חָטָֽאנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/040.yaml
  text: They rose early in the morning and went up to the top of the mountain[a], saying, “Here we are, and we will go up to the place that Yahweh has spoken of, for we have sinned.”
translation:
  language: id
  text: Pagi-pagi mereka bangun lalu naik ke puncak gunung dan berkata, “Kami di sini! Kami akan naik ke tempat yang Yahweh katakan, sebab kami telah berdosa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: Pagi-pagi mereka bangun
  rationale: Gabungan bentuk Hifil שׁכם dan בַבֹּקֶר menekankan bahwa mereka bangun atau mulai bergerak pada pagi hari sekali. ‘Pagi-pagi mereka bangun’ alami dalam bahasa Indonesia dan tidak menggandakan keterangan waktu secara kaku.
- source_word: וַיַּעֲלוּ אֶל רֹאשׁ הָהָר
  choice: lalu naik ke puncak gunung
  rationale: עלה berarti ‘naik’, sedangkan idiom רֹאשׁ הָהָר menunjuk pada bagian atas atau puncak gunung. ‘Lalu’ menyampaikan kesinambungan narasi waw.
- source_word: לֵאמֹר
  choice: dan berkata
  rationale: Infinitif ini memperkenalkan ujaran langsung. Dalam narasi Indonesia, ‘dan berkata’ lebih wajar daripada bentuk harfiah ‘dengan mengatakan’.
- source_word: הִנֶּנּוּ
  choice: Inilah kami!
  rationale: Ungkapan presentatif ini secara harfiah menyatakan kehadiran diri. Pilihan ini mempertahankan penekanan tanpa menafsirkannya secara lebih sempit sebagai ‘kami siap’.
- source_word: וְעָלִינוּ
  choice: Kami akan naik
  rationale: Bentuk ini dalam konteks menyatakan niat atau tindakan yang hendak dilakukan. ‘Akan naik’ mempertahankan nuansa tersebut tanpa mengubahnya menjadi perintah ajakan.
- source_word: אֶל הַמָּקוֹם
  choice: ke tempat
  rationale: מָקוֹם adalah kata umum untuk ‘tempat’; konteks tidak menuntut istilah yang lebih khusus.
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: yang telah Yahweh firmankan
  rationale: Klausa itu secara harfiah memakai verba ‘berkata/berfirman’ dan mengidentifikasi tempat yang dibicarakan Yahweh. ‘Firmankan’ wajar untuk tuturan ilahi, sedangkan catatan kaki mempertahankan bentuk alternatif yang lebih harfiah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi Tetragramaton ditransliterasikan sebagai nama diri, bukan diganti dengan gelar ‘TUHAN’.
- source_word: כִּי חָטָאנוּ
  choice: sebab kami telah berdosa
  rationale: כִּי memperkenalkan alasan, dan חטא menyatakan dosa atau kesalahan yang menimbulkan kesalahan moral. Bentuk ‘telah berdosa’ mempertahankan bobot teologis pengakuan mereka.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; transliterasi ‘Yahweh’ mempertahankannya sebagai nama diri.
- issue: Bobot moral חָטָאנוּ
  choice: kami telah berdosa
  alternative: kami telah berbuat salah
  rationale: ‘Berdosa’ mempertahankan pengakuan kesalahan di hadapan Allah dan tidak melemahkannya menjadi kekeliruan biasa.
- issue: Makna הִנֶּנּוּ sebagai pernyataan kehadiran
  choice: Inilah kami!
  alternative: Kami siap!
  rationale: Teks menyatakan kehadiran atau pengajuan diri, sementara ‘kami siap’ menambahkan penafsiran mengenai kesiapan yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan naratif dibuat alami tanpa menghilangkan urutan tindakan. Tanda seru pada ‘Inilah kami!’ mencerminkan penekanan ungkapan presentatif, bukan tambahan isi teologis.
