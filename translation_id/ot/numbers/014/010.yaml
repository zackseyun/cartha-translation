  text: וַ/יֹּֽאמְרוּ֙ כָּל הָ֣/עֵדָ֔ה לִ/רְגּ֥וֹם אֹתָ֖/ם בָּ/אֲבָנִ֑ים וּ/כְב֣וֹד יְהוָ֗ה נִרְאָה֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/010.yaml
  text: But all the congregation said to stone them with stones[a], and the glory of Yahweh appeared in the tent of meeting to all the sons of Israel.
translation:
  language: id
  text: Tetapi seluruh umat berkata, “Lempari mereka dengan batu!” Lalu kemuliaan Yahweh tampak di Kemah Pertemuan kepada seluruh bani Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih idiomatis: “kepada seluruh orang Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: seluruh umat
  rationale: עֵדָה menunjuk kepada komunitas Israel yang berhimpun. “Seluruh umat” alami dalam bahasa Indonesia dan mempertahankan makna kolektifnya.
- source_word: לִרְגּוֹם אֹתָם בָּאֲבָנִים
  choice: “Mereka harus dilempari dengan batu!”
  rationale: Ungkapan Ibrani menyatakan seruan atau usul untuk merajam mereka. Bentuk ujaran langsung ini menyampaikan daya ujarannya secara alami tanpa menambahkan bahwa mereka pasti dibunuh; “mereka” mempertahankan kata ganti dalam teks sumber.
- source_word: כְבוֹד יְהוָה
  choice: kemuliaan Yahweh
  rationale: כָּבוֹד di sini menunjuk pada kemuliaan ilahi yang menjadi tampak, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: נִרְאָה
  choice: tampak
  rationale: Bentuk Niphal dari ראה menyatakan bahwa kemuliaan itu terlihat atau menampakkan diri. “Tampak” ringkas dan alami serta tidak menentukan lebih jauh wujud manifestasinya.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di Kemah Pertemuan
  rationale: Ini adalah sebutan baku bagi tempat pertemuan kudus; “di” mempertahankan preposisi Ibrani tanpa memaksakan apakah manifestasi itu tepat di dalam atau pada lokasi kemah.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: kepada seluruh bani Israel
  rationale: בְּנֵי יִשְׂרָאֵל secara harfiah berarti “anak-anak lelaki/keturunan Israel” dan berfungsi sebagai sebutan kebangsaan. “Bani Israel” mempertahankan bentuk tradisional-kolektif, dengan padanan yang lebih idiomatis dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama diri ilahi, bukan gelar. “Yahweh” mempertahankan nama perjanjian itu secara langsung.
- issue: Sebutan kebangsaan בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel
  rationale: “Bani Israel” mencerminkan bentuk sumber dan identitas kolektif-kovenantalnya tanpa menyiratkan bahwa penampakan hanya ditujukan kepada laki-laki; padanan idiomatis diberikan dalam catatan kaki.
- issue: Hakikat penampakan kemuliaan
  choice: kemuliaan Yahweh tampak
  alternative: Yahweh menampakkan kemuliaan-Nya
  rationale: Susunan ini mempertahankan כְבוֹד יְהוָה sebagai subjek gramatikal dan tidak menjelaskan secara berlebihan bentuk teofani tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ujaran langsung dipakai agar konstruksi seruan Ibrani tentang perajaman terdengar alami. Kapitalisasi “Kemah Pertemuan” menandai nama tempat kudus tertentu.
