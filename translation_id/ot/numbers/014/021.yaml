  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אוּלָ֖ם חַי אָ֑נִי וְ/יִמָּלֵ֥א כְבוֹד יְהוָ֖ה אֶת כָּל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/021.yaml
  text: But as I live[a], the glory of Yahweh will fill all the earth.
translation:
  language: id
  text: Namun, demi Aku yang hidup, kemuliaan TUHAN akan memenuhi seluruh bumi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seluruh negeri”; kata Ibrani אֶרֶץ dapat berarti “bumi” atau “negeri”.'
    reason: Alternatif leksikal yang mempertahankan kemungkinan cakupan lokal dari istilah Ibrani.
lexical_decisions:
- source_word: וְאוּלָם
  choice: Namun
  rationale: Menandai pertentangan yang kuat dengan perkataan sebelumnya sekaligus tetap alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: חַי אָ֑נִי
  choice: demi Aku yang hidup
  rationale: Mengungkapkan formula sumpah ilahi secara idiomatis dalam bahasa Indonesia, bukan sekadar pernyataan bahwa Allah hidup.
- source_word: וְיִמָּלֵא
  choice: akan memenuhi
  rationale: Bentuk verba ini menempatkan 'kemuliaan TUHAN' sebagai subjek; 'akan memenuhi' mempertahankan susunan dan daya pernyataan Ibrani secara alami.
- source_word: כְבוֹד
  choice: kemuliaan
  rationale: Padanan baku dan sesuai konteks bagi כָּבוֹד ketika menunjuk pada kehadiran, keagungan, dan kehormatan ilahi.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Memakai konvensi reverensial Indonesia yang mapan untuk nama ilahi YHWH.
- source_word: אֶת כָּל הָאָרֶץ
  choice: seluruh bumi
  rationale: Konteks pernyataan agung tentang kemuliaan TUHAN mendukung cakupan universal, sementara kemungkinan arti lokal 'seluruh negeri' tetap dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan הָאָרֶץ
  choice: 'cakupan universal: ''seluruh bumi'''
  alternative: 'cakupan lokal: ''seluruh negeri'''
  rationale: אֶרֶץ dapat berarti 'bumi' ataupun 'negeri'. Konteks sumpah ilahi dan kemuliaan TUHAN mendukung pembacaan universal, tetapi ambiguitas leksikalnya tidak dihapus dan dicatat sebagai alternatif.
- issue: Peralihan dari orang pertama ke nama ilahi
  choice: mempertahankan 'Aku' lalu 'TUHAN'
  alternative: menyeragamkan menjadi 'kemuliaan-Ku'
  rationale: Teks Ibrani beralih dari formula sumpah orang pertama חַי אָנִי kepada frasa orang ketiga כְבוֹד יְהוָה. Peralihan ini dipertahankan tanpa harmonisasi.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, khidmat, dan mudah dipahami. Formula sumpah diterjemahkan secara idiomatis, sedangkan peralihan persona dalam teks sumber dipertahankan.
