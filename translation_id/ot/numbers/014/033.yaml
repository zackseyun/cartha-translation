  source_fidelity: 'Teks Indonesia dengan setia mencerminkan unsur-unsur utama Ibrani: anak-anak lelaki/putra-putra, peran sebagai gembala, padang belantara, empat puluh tahun, menanggung ketidaksetiaan, dan batas waktu hingga mayat-mayat generasi yang dihukum itu habis. Terjemahan “ketidaksetiaanmu” tidak memaksakan pembacaan seksual literal, sementara catatan kaki mempertahankan metafora seksual dalam זְנוּתֵיכֶם. “Sampai mayat-mayatmu habis” mempertahankan ungkapan keras dan hasil akhir dari תֹּם tanpa menambahkan cara kematian.'
