id: NUM.14.33
reference: Numbers 14:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ֠/בְנֵי/כֶם יִהְי֨וּ רֹעִ֤ים בַּ/מִּדְבָּר֙ אַרְבָּעִ֣ים שָׁנָ֔ה וְ/נָשְׂא֖וּ אֶת זְנוּתֵי/כֶ֑ם עַד תֹּ֥ם פִּגְרֵי/כֶ֖ם בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/033.yaml
  text: And your sons will be shepherds in the wilderness for forty years, and they will bear your acts of sexual unfaithfulness until your dead bodies are finished off in the wilderness.
translation:
  language: id
  text: Anak-anak lelakimu akan menjadi gembala[a] di padang belantara selama empat puluh tahun. Mereka akan menanggung ketidaksetiaanmu[b] sampai mayat-mayatmu habis di padang belantara.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan mengembara”. Kata Ibrani ini secara harfiah berkaitan dengan menggembalakan ternak, tetapi dalam konteks ini dapat menekankan kehidupan berpindah-pindah di padang belantara.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “ketidaksetiaan” secara harfiah dapat berarti “persundalan” dan memakai gambaran ketidaksetiaan seksual untuk melukiskan ketidaksetiaan kepada TUHAN.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “sampai mayat-mayatmu berakhir di padang belantara.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵיכֶם
  choice: Anak-anak lelakimu
  rationale: בנים berbentuk jamak maskulin dan secara langsung berarti “anak-anak lelaki”; bentuk Indonesia ini mempertahankan rujukan gender tanpa terdengar kuno.
- source_word: רֹעִים
  choice: menjadi gembala
  rationale: Partisip dari רעה secara leksikal berkaitan dengan menggembalakan atau menjadi gembala. Terjemahan ini mempertahankan gambaran kehidupan pastoral yang tidak menetap; nuansa “mengembara” dicatat dalam catatan kaki.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: מִדְבָּר menunjuk wilayah liar atau tanah penggembalaan yang tidak dihuni, bukan semata-mata gurun pasir. “Padang belantara” alami dalam bahasa Indonesia dan sesuai dengan latarnya.
- source_word: אַרְבָּעִים שָׁנָה
  choice: selama empat puluh tahun
  rationale: Frasa durasi diterjemahkan secara langsung dan wajar.
- source_word: וְנָשְׂאוּ
  choice: Mereka akan menanggung
  rationale: נשא berarti membawa atau menanggung, di sini dengan bobot menanggung akibat atau beban kesalahan. “Menanggung” mempertahankan idiom dan tidak menetapkan secara berlebihan apakah yang ditanggung adalah rasa bersalah atau akibatnya.
- source_word: אֶת זְנוּתֵיכֶם
  choice: ketidaksetiaanmu
  rationale: זְנוּת secara harfiah memakai gambaran persundalan atau ketidaksetiaan seksual, tetapi dalam konteks ini menggambarkan ketidaksetiaan umat kepada TUHAN. Pilihan utama yang ringkas dan alami ini tidak menyempitkannya menjadi perilaku seksual harfiah; citra seksual dijelaskan dalam catatan kaki.
- source_word: עַד תֹּם
  choice: sampai ... habis
  rationale: Bentuk dari תמם menyatakan berakhir atau selesainya sesuatu. “Sampai ... habis” menyampaikan berakhirnya seluruh angkatan yang dihukum tanpa menambahkan pelaku atau cara kematian.
- source_word: פִּגְרֵיכֶם
  choice: mayat-mayatmu
  rationale: פגר berarti mayat, bangkai, atau jasad tak bernyawa. “Mayat-mayat” mempertahankan kekerasan konkret ungkapan Ibrani dan tetap jelas bagi pembaca modern.
theological_decisions:
- issue: Apakah זְנוּתֵיכֶם harus dipahami secara seksual harfiah atau sebagai ketidaksetiaan perjanjian
  choice: ketidaksetiaanmu, dengan catatan bahwa bahasa Ibraninya memakai gambaran persundalan
  alternative: persundalanmu; ketidaksetiaan seksualmu
  rationale: Konteksnya adalah pemberontakan Israel terhadap TUHAN, sehingga pembacaan yang hanya menunjuk tindakan seksual terlalu sempit. Namun, catatan kaki mempertahankan metafora seksual yang sengaja dipakai teks.
- issue: Apakah רֹעִים harus diterjemahkan secara dinamis sebagai pengembara
  choice: menjadi gembala
  alternative: mengembara
  rationale: Makna leksikalnya berkaitan dengan penggembalaan. Terjemahan utama mempertahankan gambaran sumber, sedangkan kemungkinan penekanan pada hidup mengembara disediakan dalam catatan kaki.
- issue: Apa yang ditanggung anak-anak lelaki itu dalam וְנָשְׂאוּ אֶת זְנוּתֵיכֶם
  choice: mempertahankan ungkapan “menanggung ketidaksetiaanmu”
  alternative: menanggung akibat ketidaksetiaanmu
  rationale: Menambahkan “akibat” membuat hubungan hukuman lebih eksplisit dan mungkin memang dimaksudkan, tetapi teks Ibrani sendiri memakai objek “ketidaksetiaan.” Terjemahan utama mempertahankan ketegangan antara menanggung kesalahan dan menanggung akibatnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Padang belantara” dipilih alih-alih “gurun” agar tidak membatasi מִדְבָּר pada padang pasir. Bentuk “-mu” mengikuti sapaan kolektif Ibrani kepada umat dan dibiarkan alami dalam bahasa Indonesia.
