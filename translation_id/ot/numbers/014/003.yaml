id: NUM.14.3
reference: Numbers 14:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לָ/מָ֣ה יְ֠הוָה מֵבִ֨יא אֹתָ֜/נוּ אֶל הָ/אָ֤רֶץ הַ/זֹּאת֙ לִ/נְפֹּ֣ל בַּ/חֶ֔רֶב נָשֵׁ֥י/נוּ וְ/טַפֵּ֖/נוּ יִהְי֣וּ לָ/בַ֑ז הֲ/ל֧וֹא ט֦וֹב לָ֖/נוּ שׁ֥וּב מִצְרָֽיְמָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/003.yaml
  text: And why is Yahweh bringing us into this land to fall by the sword? Our wives and our little ones will become plunder[a]. Would it not be better for us to return to Egypt?
translation:
  language: id
  text: Mengapa Yahweh membawa kita ke negeri ini untuk tewas oleh pedang? Istri dan anak-anak kecil kita akan menjadi jarahan[a]. Bukankah lebih baik kita kembali ke Mesir?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan menjadi mangsa”; kata Ibrani ini dapat menunjuk pada orang atau barang yang dirampas musuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: Mengapa
  rationale: Dalam bahasa Indonesia, kesinambungan keluhan tidak perlu dinyatakan dengan kata pembuka 'dan'; 'Mengapa' lebih alami tanpa menghilangkan hubungan wacana.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: מֵבִיא
  choice: membawa
  rationale: Partisip Ibrani menggambarkan tindakan yang sedang berlangsung atau mengarah pada hasil yang segera; bentuk Indonesia 'membawa' secara alami mencakup aspek tersebut dalam konteks ini.
- source_word: אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  choice: kita ke negeri ini
  rationale: Menyatakan gerak menuju wilayah yang dimaksud secara alami dalam bahasa Indonesia.
- source_word: לִנְפֹּל בַּחֶרֶב
  choice: untuk tewas oleh pedang
  rationale: Menjaga gambaran pedang sekaligus menyampaikan dengan jelas idiom Ibrani tentang kematian dalam peperangan.
- source_word: נָשֵׁינוּ
  choice: istri
  rationale: Dalam konteks keluarga ini, arti khusus 'istri' lebih tepat daripada arti umum 'perempuan'.
- source_word: וְטַפֵּנוּ
  choice: dan anak-anak kecil kita
  rationale: טַף terutama menunjuk pada anak kecil atau tanggungan; pilihan ini mempertahankan penekanan pada kerentanan mereka.
- source_word: יִהְיוּ לָבַז
  choice: akan menjadi jarahan
  rationale: בַּז menunjuk pada rampasan yang direbut musuh; 'jarahan' jelas dan sesuai dengan konteks perang.
- source_word: הֲלוֹא טוֹב לָנוּ
  choice: Bukankah lebih baik
  rationale: Menyampaikan pertanyaan retoris negatif secara alami dalam bahasa Indonesia.
- source_word: שׁוּב מִצְרָיְמָה
  choice: kita kembali ke Mesir
  rationale: Menyampaikan gagasan berbalik pulang menuju Mesir dan cocok secara sintaksis setelah 'lebih baik'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama ilahi tanpa menggantinya dengan gelar, sementara bentuk vokalisasinya tetap merupakan rekonstruksi yang lazim.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tewas oleh pedang' mempertahankan citra perang dengan kejelasan idiomatis; 'anak-anak kecil' menonjolkan kerentanan kelompok yang dimaksud.
