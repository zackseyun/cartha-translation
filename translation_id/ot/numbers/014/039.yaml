  terminology: “Orang Israel” merupakan padanan kolektif yang baik untuk בני ישראל dalam teks utama. Catatan kaki perlu memperbaiki ungkapan “anak-anak lelaki Israel,” sebab bentuk harfiahnya lebih tepat “anak-anak Israel” atau, bila hendak menonjolkan bentuk maskulin gramatikal, “putra-putra Israel”; “bani Israel” adalah alternatif Indonesia yang mapan.
