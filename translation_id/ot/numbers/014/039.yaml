  text: Moses spoke these words to all the sons of Israel[a], and the people mourned greatly.
translation:
  language: id
  text: Musa berkata kepada semua orang Israel tentang perkataan ini, dan bangsa itu sangat berkabung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepada semua anak Israel”; dapat juga diterjemahkan “kepada semua bani Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: menyampaikan
  rationale: Bentuk piel dari דבר menyatakan tindakan Musa mengomunikasikan keputusan ilahi. 'Menyampaikan' terdengar alami dalam bahasa Indonesia dan memperjelas bahwa perkataan tersebut diteruskan kepada umat tanpa menambahkan nuansa tafsir seperti 'mengumumkan'.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: perkataan-perkataan ini
  rationale: דְּבָרִים dapat berarti 'perkataan', 'hal', atau 'perkara'. Di sini yang dimaksud ialah firman yang baru saja disampaikan kepada Musa, sehingga 'perkataan-perkataan ini' mempertahankan makna verbal dan bentuk jamaknya.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: kepada seluruh orang Israel
  rationale: בְּנֵי יִשְׂרָאֵל merupakan sebutan kolektif baku bagi umat Israel. 'Seluruh orang Israel' alami, inklusif sesuai rujukan kolektifnya, dan tidak mengesankan bahwa hanya laki-laki yang dimaksud; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וַיִּתְאַבְּלוּ
  choice: berkabung
  rationale: Bentuk hitpael dari אבל menunjukkan masuk atau berada dalam keadaan berkabung. 'Berkabung' menangkap kesedihan komunal yang kuat sebagai tanggapan terhadap hukuman ilahi.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עָם menunjuk kepada umat sebagai satu kelompok. 'Bangsa itu' membedakannya secara wajar dari frasa sebelumnya dan mempertahankan sifat kolektif rujukannya.
- source_word: מְאֹד
  choice: sangat
  rationale: מְאֹד memperkuat tindakan berkabung. 'Sangat berkabung' ringkas, jelas, dan wajar dalam bahasa Indonesia modern.
