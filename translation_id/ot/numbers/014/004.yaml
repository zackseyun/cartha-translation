  text: וַ/יֹּאמְר֖וּ אִ֣ישׁ אֶל אָחִ֑י/ו נִתְּנָ֥ה רֹ֖אשׁ וְ/נָשׁ֥וּבָה מִצְרָֽיְמָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/004.yaml
  text: And they said to one another[b][a], “Let us appoint a leader and return to Egypt.”
translation:
  language: id
  text: Lalu mereka berkata satu sama lain[a], “Mari kita mengangkat seorang pemimpin[b] dan kembali ke Mesir.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seorang kepada saudaranya.” Ungkapan Ibrani ini berarti bahwa mereka berbicara di antara mereka sendiri.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menempatkan seorang kepala.” Di sini “kepala” berarti orang yang ditempatkan di atas kelompok, yaitu seorang pemimpin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu mereka berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. “Lalu” menyampaikan perkembangan peristiwa secara alami tanpa menambahkan nuansa sebab-akibat.
- source_word: אִישׁ אֶל אָחִיו
  choice: satu sama lain
  rationale: Secara harfiah ungkapan ini berarti “seorang kepada saudaranya,” tetapi berfungsi secara timbal balik; bentuk maskulin tunggalnya bersifat distributif dan tidak menekankan jenis kelamin.
- source_word: נִתְּנָה
  choice: Mari kita mengangkat
  rationale: Bentuk kohortatif orang pertama jamak dari נתן, dengan רֹאשׁ sebagai objek, menyatakan ajakan untuk menempatkan atau menetapkan seseorang sebagai kepala. “Mengangkat” alami dalam bahasa Indonesia untuk penetapan seorang pemimpin.
- source_word: רֹאשׁ
  choice: seorang pemimpin
  rationale: Arti dasarnya ialah “kepala,” tetapi dalam konteks ini menunjuk kepada orang yang ditempatkan di atas kelompok sebagai pemimpin.
- source_word: וְנָשׁוּבָה
  choice: dan kembali
  rationale: Kohortatif yang dikoordinasikan dengan ajakan sebelumnya. Daya ajak tetap tercakup oleh “Mari kita,” sehingga tidak perlu diulang.
- source_word: מִצְרָיְמָה
  choice: ke Mesir
  rationale: Akhiran direktif menyatakan gerak menuju Mesir. Gagasan “kembali” sudah dinyatakan oleh verba sebelumnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Mengangkat seorang pemimpin” dipilih sebagai ungkapan alami yang mempertahankan maksud idiom Ibrani, sementara catatan kaki mencatat bentuk harfiahnya.
