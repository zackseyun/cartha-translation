translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Namun” mempertahankan kontras wacana, “tetap hidup” menyampaikan hasil yang berlawanan dengan nasib para pengintai lain, dan alternatif bagi תור dicatat agar keluasan maknanya tetap terlihat.
