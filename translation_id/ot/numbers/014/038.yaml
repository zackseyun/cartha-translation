base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/038.yaml
  text: But Joshua son of Nun and Caleb son of Jephunneh remained alive from among those men who had gone to spy out the land[a].
translation:
  language: id
  text: Namun, Yosua anak Nun dan Kaleb anak Yefune tetap hidup dari antara orang-orang itu yang telah pergi untuk mengintai negeri itu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjelajahi negeri itu” atau “meninjau negeri itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ
  choice: Namun, Yosua
  rationale: Konjungsi waw diterjemahkan sebagai “Namun” untuk menyatakan kontras dengan kematian para pengintai lain dalam ayat sebelumnya; nama יהושע ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: בִּן נוּן
  choice: anak Nun
  rationale: Konstruksi patronimik Ibrani diterjemahkan secara langsung dan alami dalam bahasa Indonesia.
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: dan Kaleb anak Yefune
  rationale: Konjungsi menghubungkan Kaleb dengan Yosua sebagai dua orang yang tetap hidup; nama-nama ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: חָיוּ
  choice: tetap hidup
  rationale: Bentuk qal dari חיה dapat berarti hidup atau tetap hidup. “Tetap hidup” menonjolkan kontras kontekstual bahwa keduanya tidak mati seperti orang-orang lain.
- source_word: מִן הָאֲנָשִׁים הָהֵם
  choice: di antara orang-orang
  rationale: Preposisi מן menunjukkan bahwa Yosua dan Kaleb merupakan pengecualian dari kelompok tersebut. “Di antara” menyampaikan hubungan kelompok itu secara alami dalam bahasa Indonesia tanpa menambah gagasan baru.
- source_word: הַהֹלְכִים
  choice: yang telah pergi
  rationale: Partisipel ini mendeskripsikan orang-orang tersebut berdasarkan perjalanan yang sudah mereka lakukan; “telah pergi” sesuai dengan sudut pandang naratif retrospektif.
- source_word: לָתוּר אֶת הָאָרֶץ
  choice: untuk mengintai negeri itu
  rationale: Dalam konteks ini, תור menunjuk pada misi peninjauan atau pengintaian atas Kanaan. “Mengintai” tepat secara kontekstual, sedangkan “negeri itu” merujuk pada wilayah yang sedang dibicarakan.
