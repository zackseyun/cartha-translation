  text: וְ/עַבְדִּ֣/י כָלֵ֗ב עֵ֣קֶב הָֽיְתָ֞ה ר֤וּחַ אַחֶ֨רֶת֙ עִמּ֔/וֹ וַ/יְמַלֵּ֖א אַחֲרָ֑/י וַ/הֲבִֽיאֹתִ֗י/ו אֶל הָ/אָ֨רֶץ֙ אֲשֶׁר בָּ֣א שָׁ֔מָּ/ה וְ/זַרְע֖/וֹ יוֹרִשֶֽׁ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/024.yaml
  text: But my servant Caleb[a], because a different spirit was with him and he followed me fully, I will bring him into the land where he went[c][b], and his offspring will possess it.
translation:
  language: id
  text: Namun, hamba-Ku Kaleb, karena ia memiliki roh yang lain[a] dan mengikuti Aku dengan sepenuh hati[b], akan Kubawa masuk ke negeri yang pernah didatanginya, dan keturunannya akan memilikinya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mempunyai watak yang berbeda.” Kata Ibrani yang diterjemahkan “roh” juga dapat mengacu pada sikap atau kecenderungan batin.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, ungkapan Ibrani ini berbunyi “memenuhi sesudah Aku,” yakni mengikuti TUHAN sepenuhnya atau dengan segenap hati.
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “akan mewarisinya” atau “akan mengambilnya menjadi milik.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַבְדִּי כָלֵב
  choice: Namun, ... hamba-Ku Kaleb
  rationale: Kata penghubung diterjemahkan secara adversatif karena Kaleb dikontraskan dengan angkatan yang tidak percaya dalam konteks sebelumnya. עֶבֶד secara wajar berarti 'hamba' di sini.
- source_word: עֵקֶב
  choice: karena
  rationale: Menandai alasan bagi perlakuan khusus TUHAN terhadap Kaleb.
- source_word: הָיְתָה רוּחַ אַחֶרֶת עִמּוֹ
  choice: memiliki roh yang lain
  rationale: Ungkapan alami dalam bahasa Indonesia yang tetap mempertahankan keluasan makna רוּחַ, baik sebagai roh maupun watak/sikap, tanpa secara khusus menyamakannya dengan Roh Allah.
- source_word: וַיְמַלֵּא אַחֲרָי
  choice: mengikuti Aku dengan sepenuh hati
  rationale: Menyampaikan idiom Ibrani secara alami; secara harfiah ungkapan itu berbunyi kira-kira 'memenuhi sesudah Aku' dan berarti mengikuti dengan sepenuhnya.
- source_word: וַהֲבִיאֹתִיו
  choice: Aku akan membawanya masuk
  rationale: Bentuk deklaratif dipahami sebagai tindakan masa depan yang dijanjikan Allah; 'masuk' memperjelas gerak menuju negeri itu.
- source_word: אֶל הָאָרֶץ אֲשֶׁר בָּא שָׁמָּה
  choice: ke negeri yang telah didatanginya itu
  rationale: Mencerminkan בוא dan שמה dengan menunjuk pada negeri yang sebelumnya didatangi Kaleb sebagai pengintai, tanpa mempersempitnya menjadi bagian tertentu dari negeri itu.
- source_word: וְזַרְעוֹ
  choice: dan keturunannya
  rationale: זֶרַע bersifat kolektif dan dalam konteks ini secara alami menunjuk kepada para keturunan Kaleb.
- source_word: יוֹרִשֶׁנָּה
  choice: akan memilikinya
  rationale: ירשׁ dapat berarti mewarisi atau mengambil/memiliki tanah; 'memilikinya' sesuai dengan konteks janji negeri dan tetap jelas bagi pembaca modern.
theological_decisions:
- issue: Makna 'roh yang lain' pada Kaleb
  choice: Mempertahankan ungkapan luas 'roh yang lain'.
  alternative: watak yang berbeda; Roh Allah menyertainya secara khusus
  rationale: רוּחַ dapat menunjuk pada roh, watak, atau sikap. Teks tidak secara eksplisit menyebut Roh Kudus, sehingga terjemahan tidak menetapkan tafsiran doktrinal tertentu.
- issue: Sifat kesetiaan Kaleb
  choice: mengikuti Aku dengan sepenuh hati
  alternative: mengikuti Aku sepenuhnya
  rationale: Idiom menekankan kesetiaan Kaleb yang utuh. 'Dengan sepenuh hati' menyampaikan makna itu secara alami tanpa menambahkan gagasan teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar dan bermartabat. Pronomina ilahi memakai kapital sesuai konvensi penerbitan Alkitab Indonesia. Struktur kalimat mempertahankan hubungan sebab-akibat dan kontras konteks, sementara idiom Ibrani dibuat mudah dipahami.
