language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּעְפִּ֕לוּ לַ/עֲל֖וֹת אֶל רֹ֣אשׁ הָ/הָ֑ר וַ/אֲר֤וֹן בְּרִית יְהוָה֙ וּ/מֹשֶׁ֔ה לֹא מָ֖שׁוּ מִ/קֶּ֥רֶב הַֽ/מַּחֲנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/044.yaml
  text: But they presumed to go up to the top of the mountain[b][a], though the ark of the covenant of Yahweh and Moses did not move from the midst of the camp.
translation:
  language: id
  text: Namun, mereka dengan lancang[a] naik ke puncak gunung itu, sedangkan tabut perjanjian Yahweh[b] dan Musa tidak beranjak dari tengah-tengah perkemahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka bertindak lancang dengan naik” atau “mereka nekat naik.” Kata kerja Ibrani menyatakan tindakan yang lancang atau menantang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tabut perjanjian Yahweh”; dapat juga diterjemahkan, “tabut perjanjian milik Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְפִּלוּ
  choice: dengan lancang mereka
  rationale: Bentuk ini menyatakan tindakan yang nekat, lancang, dan dilakukan dengan sengaja. Ungkapan tersebut mempertahankan penilaian negatif dalam konteks ketidaktaatan, bukan sekadar keberanian untuk naik.
- source_word: לַעֲלוֹת
  choice: naik
  rationale: Kata ini secara biasa menyatakan gerakan ke tempat yang lebih tinggi; 'naik' alami dan tepat dalam bahasa Indonesia.
- source_word: אֶל רֹאשׁ הָהָר
  choice: ke puncak gunung itu
  rationale: רֹאשׁ secara harfiah berarti 'kepala', tetapi di sini secara idiomatis berarti 'puncak'. Artikel pada הָהָר menunjuk kepada gunung yang telah dikenal dalam konteks.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: sedangkan tabut perjanjian Yahweh
  rationale: Konstruksi ini dipahami sebagai 'tabut perjanjian Yahweh'. 'Sedangkan' menyampaikan kontras naratif antara gerakan bangsa itu dan tetap tinggalnya tabut serta Musa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', sehingga mempertahankan nama pribadi dalam teks Ibrani dan membedakannya dari gelar 'Tuhan'.
- source_word: וּמֹשֶׁה
  choice: dan Musa
  rationale: Nama pribadi diberikan dalam bentuk Indonesia yang lazim.
- source_word: לֹא מָשׁוּ
  choice: tidak beranjak
  rationale: Kata kerja ini berarti tidak bergerak atau tidak meninggalkan tempat. 'Tidak beranjak' alami dalam narasi Indonesia dan menegaskan bahwa keduanya tidak menyertai bangsa itu.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: dari tengah-tengah perkemahan
  rationale: Ungkapan ini mempertahankan arti lokasi di dalam atau di tengah perkemahan tanpa harus menyiratkan titik pusat yang persis.
theological_decisions:
- issue: Nuansa tindakan Israel dalam וַיַּעְפִּלוּ
  choice: dengan lancang mereka naik
  alternative: mereka nekat naik; mereka dengan lancang memberanikan diri untuk naik
  rationale: Pilihan ini mempertahankan unsur kesengajaan dan kesalahan yang melekat pada tindakan mereka dalam konteks, tanpa menambahkan motif teologis yang tidak dinyatakan langsung oleh kata tersebut.
- issue: Penyebutan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks sumber memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan fungsi nama itu dan mengikuti bentuk transliterasi ilmiah yang umum.
- issue: Hubungan tabut dan perjanjian dalam וַאֲרוֹן בְּרִית יְהוָה
  choice: tabut perjanjian Yahweh
  alternative: tabut perjanjian milik Yahweh; tabut perjanjian dari Yahweh
  rationale: Rangkaian konstruksi Ibrani paling wajar dipertahankan secara ringkas sebagai 'tabut perjanjian Yahweh', sementara kemungkinan hubungan genitifnya dicatat tanpa dipersempit secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Dengan lancang' membawa bobot moral kata Ibrani tanpa menjadi terlalu teknis; 'tidak beranjak' memberi kontras naratif yang jelas. Semua penanda catatan kaki dicantumkan langsung pada unsur yang dijelaskan.
