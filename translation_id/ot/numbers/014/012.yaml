  yaml_path: translation/ot/numbers/014/012.yaml
  text: I will strike him with the plague and dispossess him[a], and I will make you into a nation greater and mightier than he.
translation:
  language: id
  text: Aku akan menghantam bangsa itu dengan wabah dan mencabut haknya atas miliknya[a]. Namun, Aku akan menjadikan engkau suatu bangsa yang lebih besar dan lebih kuat daripada bangsa itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mencabut hak warisnya.” Kata Ibrani ini dapat menyatakan pencabutan milik atau pusaka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכֶּנּוּ
  choice: Aku akan menghantam bangsa itu
  rationale: Bentuk kausatif נכה berarti ‘memukul/menghantam’. Sufiks tunggal maskulin merujuk secara kolektif kepada Israel; ‘bangsa itu’ mempertahankan acuan kolektif tunggal secara alami dalam bahasa Indonesia.
- source_word: בַדֶּבֶר
  choice: dengan wabah
  rationale: דֶּבֶר menunjuk pada wabah atau penyakit menular, khususnya sebagai penghukuman. ‘Wabah’ jelas dan alami dalam bahasa Indonesia modern.
- source_word: וְאוֹרִשֶׁנּוּ
  choice: dan mencabut hak miliknya
  rationale: Bentuk kausatif ירשׁ dapat berarti mencabut kepemilikan atau hak waris. Ungkapan ini mempertahankan nuansa hilangnya milik/pusaka tanpa membatasinya hanya pada tindakan mengusir dari suatu wilayah.
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: Aku akan menjadikan engkau suatu bangsa
  rationale: Konstruksi עשה + objek + לְ menyatakan menjadikan seseorang sebagai sesuatu. ‘Engkau’ tunggal merujuk kepada Musa dan sesuai dengan suasana tutur yang khidmat.
- source_word: גָּדוֹל וְעָצוּם מִמֶּנּוּ
  choice: yang lebih besar dan lebih kuat daripada bangsa itu
  rationale: Frasa מן memberi nilai perbandingan bagi kedua sifat. עָצוּם dapat menunjuk pada kekuatan atau besarnya jumlah; ‘lebih kuat’ mempertahankan makna kekuasaan tanpa menutup kemungkinan keluasan maknanya.
theological_decisions:
- issue: Acuan sufiks tunggal dalam ancaman penghukuman
  choice: Dinyatakan sebagai ‘bangsa itu’ dan ‘-nya’, yakni Israel sebagai satu kesatuan kolektif.
  alternative: Menggunakan bentuk jamak ‘mereka’.
  rationale: Bahasa Ibrani memakai sufiks orang ketiga tunggal maskulin. ‘Bangsa itu’ mempertahankan gambaran Israel sebagai satu kesatuan sekaligus terdengar alami dalam bahasa Indonesia.
- issue: Makna ירשׁ dalam bentuk kausatif
  choice: mencabut hak miliknya
  alternative: mencabut hak warisnya; menghalau bangsa itu
  rationale: Konteks mencakup kehilangan milik/pusaka dan penolakan Israel sebagai bangsa. Pilihan utama mempertahankan keluasan makna itu, sedangkan nuansa hak waris dicatat dalam catatan kaki.
- issue: Hubungan kedua klausa ilahi
  choice: Namun, Aku akan menjadikan engkau
  alternative: dan Aku akan menjadikan engkau
  rationale: Waw Ibrani menghubungkan dua tindakan dan dalam konteks ini mengandung peralihan kontras dari pemusnahan Israel kepada pembentukan bangsa melalui Musa. ‘Namun’ membuat relasi wacana itu alami tanpa mengubah isi proposisional.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. ‘Aku/engkau’ dipakai untuk mempertahankan tuturan langsung ilahi kepada Musa. Acuan tunggal kolektif Ibrani diungkapkan dengan ‘bangsa itu’, bukan pronomina manusia tunggal yang janggal dalam bahasa Indonesia.
