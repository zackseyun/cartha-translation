  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַ֣ךְ בַּֽ/יהוָה֮ אַל תִּמְרֹדוּ֒ וְ/אַתֶּ֗ם אַל תִּֽירְאוּ֙ אֶת עַ֣ם הָ/אָ֔רֶץ כִּ֥י לַחְמֵ֖/נוּ הֵ֑ם סָ֣ר צִלָּ֧/ם מֵ/עֲלֵי/הֶ֛ם וַֽ/יהוָ֥ה אִתָּ֖/נוּ אַל תִּירָאֻֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/009.yaml
  text: Only[a], do not rebel against Yahweh. And do not fear the people of the land, for they are our bread; their protection has departed from over them, and Yahweh is with us[b]. Do not fear them.
translation:
  language: id
  text: Namun, janganlah memberontak terhadap Yahweh. Jangan takut kepada penduduk negeri itu, sebab mereka adalah makanan bagi kita.[a] Perlindungan mereka telah meninggalkan mereka,[b] sedangkan Yahweh menyertai kita. Jangan takut kepada mereka!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka adalah roti kita,” sebuah gambaran bahwa mereka akan mudah ditaklukkan atau dilahap.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bayang-bayang mereka telah pergi dari atas mereka.” “Bayang-bayang” di sini kemungkinan berarti naungan atau perlindungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Hanya saja
  rationale: Partikel ini memberi pembatasan atau penegasan kuat pada nasihat yang menyusul; “Hanya saja” alami dalam bahasa Indonesia dan tetap mempertahankan daya pembatasnya.
- source_word: בַּיהוָה אַל תִּמְרֹדוּ
  choice: janganlah memberontak terhadap Yahweh
  rationale: Dengan verba מרד, preposisi ב menandai pihak yang menjadi sasaran pemberontakan. Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh” sesuai bukti teks sumber.
- source_word: עַם הָאָרֶץ
  choice: penduduk negeri itu
  rationale: Dalam konteks pengintaian dan penaklukan Kanaan, ungkapan ini secara alami merujuk kepada orang-orang yang mendiami negeri tersebut; pilihan ini menghindari kemungkinan salah paham bahwa yang dimaksud ialah suatu golongan sosial.
- source_word: כִּי לַחְמֵנוּ הֵם
  choice: sebab mereka adalah makanan bagi kita
  rationale: Secara harfiah לֶחֶם berarti “roti”, tetapi dalam metafora ini menunjuk pada makanan, yaitu musuh yang mudah ditaklukkan atau dilahap. “Makanan bagi kita” menyampaikan fungsi metafora secara jelas, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: סָר צִלָּם מֵעֲלֵיהֶם
  choice: Perlindungan mereka telah lenyap
  rationale: צֵל secara harfiah berarti “bayang-bayang”, tetapi di sini merupakan metafora bagi naungan atau perlindungan. Terjemahan ini menyampaikan maknanya dalam bahasa Indonesia modern tanpa menentukan identitas pelindung yang tidak disebutkan teks.
- source_word: וַיהוָה אִתָּנוּ
  choice: sedangkan Yahweh menyertai kita
  rationale: Waw menghubungkan klausa yang secara konteks berkontras dengan lenyapnya perlindungan lawan. “Sedangkan” membuat hubungan itu alami tanpa menambah isi teologis.
- source_word: אַל תִּירָאֻם
  choice: Jangan takut kepada mereka!
  rationale: Larangan penutup yang berulang dipertahankan demi penekanan retoris teks Ibrani.
theological_decisions:
- issue: Bentuk metafora כִּי לַחְמֵנוּ הֵם
  choice: Menerjemahkan maknanya sebagai “mereka adalah makanan bagi kita” dan mencatat bentuk harfiah “roti”
  alternative: “mereka adalah roti kita” atau “kita akan melahap mereka”
  rationale: Pilihan utama mempertahankan metafora konsumsi dalam bahasa Indonesia yang lebih wajar, tanpa memperluasnya menjadi pernyataan eksplisit tentang tindakan melahap yang tidak dinyatakan langsung.
- issue: Makna צִלָּם
  choice: “Perlindungan mereka”
  alternative: “bayang-bayang mereka” atau “naungan mereka”
  rationale: “Perlindungan” menyampaikan fungsi idiom tersebut, sedangkan catatan kaki menjaga citra harfiah dan kemungkinan nuansa naungan tanpa menetapkan siapa atau apa pelindung itu.
- issue: Nama ilahi יהוה
  choice: “Yahweh”
  alternative: “TUHAN”
  rationale: Transliterasi mempertahankan nama khusus ilahi yang hadir dalam teks Ibrani dan membedakannya dari gelar umum, tanpa menambahkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pengulangan larangan takut dipertahankan untuk menampilkan desakan retoris ayat. “Penduduk negeri itu” dipilih sebagai padanan kontekstual yang alami bagi עַם הָאָרֶץ.
