id: NUM.14.16
reference: Numbers 14:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ/בִּלְתִּ֞י יְכֹ֣לֶת יְהוָ֗ה לְ/הָבִיא֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣ע לָ/הֶ֑ם וַ/יִּשְׁחָטֵ֖/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/016.yaml
  text: Because Yahweh was not able to bring this people into the land that he swore to them[a], he slaughtered them in the wilderness.
translation:
  language: id
  text: Karena Yahweh tidak mampu membawa bangsa ini masuk ke negeri yang telah Dia janjikan dengan sumpah kepada mereka,[a] Dia membantai mereka di padang belantara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “negeri yang mengenainya Dia telah bersumpah kepada mereka.” Bahasa Ibrani tidak menyatakan secara eksplisit apa yang dijanjikan dalam sumpah itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבִּלְתִּי
  choice: Karena ... tidak
  rationale: Gabungan preposisi dan partikel negatif ini memperkenalkan alasan yang menurut Musa akan dikemukakan bangsa-bangsa; susunan ini alami dalam bahasa Indonesia.
- source_word: יְכֹלֶת
  choice: tidak mampu
  rationale: Bentuk dari יכל menyatakan kemampuan atau kesanggupan. Pilihan ini mempertahankan tuduhan tentang ketidakmampuan tanpa meredakannya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לְהָבִיא
  choice: membawa ... masuk
  rationale: Bentuk Hifil dari בוא berarti menyebabkan masuk; ungkapan Indonesia ini menyatakan gerak memasuki negeri dengan jelas.
- source_word: הָעָם הַזֶּה
  choice: bangsa ini
  rationale: עָם merupakan nomina kolektif tunggal. 'Bangsa ini' alami dalam bahasa Indonesia dan mempertahankan rujukan kolektifnya.
- source_word: אֶל הָאָרֶץ
  choice: ke negeri
  rationale: Dalam konstruksi 'membawa ... masuk ke', frasa ini secara alami menyatakan tujuan, yaitu negeri yang dijanjikan.
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: yang telah Dia janjikan dengan sumpah kepada mereka
  rationale: Secara harfiah frasa ini menyatakan bahwa Dia bersumpah kepada mereka; terjemahan ini mempertahankan unsur sumpah sambil menyampaikan hubungan negeri itu dengan janji secara alami. Catatan kaki mencatat bentuk yang lebih harfiah dan ambiguitas objek sumpah.
- source_word: וַיִּשְׁחָטֵם
  choice: Dia membantai mereka
  rationale: שׁחט adalah kata yang keras untuk menyembelih atau membantai. 'Membantai' mempertahankan tajamnya tuduhan bangsa-bangsa.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: מִדְבָּר menunjuk wilayah liar dan tandus tempat perjalanan Israel; 'padang belantara' merupakan padanan Indonesia yang jelas dan sesuai konteks.
theological_decisions:
- issue: Tuduhan bangsa-bangsa mengenai kemampuan Yahweh
  choice: Karena Yahweh tidak mampu membawa bangsa ini...
  alternative: Karena Yahweh tidak sanggup membawa bangsa ini...
  rationale: Ayat ini melanjutkan perkataan yang menurut Musa akan diucapkan bangsa-bangsa. Terjemahan mempertahankan tuduhan retoris tentang ketidakmampuan ilahi tanpa mengubahnya menjadi pernyataan teologis dari narator atau melunakkannya.
- issue: Objek sumpah yang tersirat
  choice: negeri yang telah Dia janjikan dengan sumpah kepada mereka
  alternative: negeri yang mengenainya Dia telah bersumpah kepada mereka
  rationale: Bahasa Ibrani tidak menyebutkan secara eksplisit 'memberikan'. Teks utama menyampaikan makna janji bersumpah secara wajar, sedangkan catatan kaki menjaga bentuk yang lebih harfiah dan ambiguitas sintaksis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan lugas. Bentuk 'Dia' dipakai untuk rujukan kepada Yahweh sesuai kebiasaan ortografis religius Indonesia. Kata 'membantai' sengaja mempertahankan kerasnya וַיִּשְׁחָטֵם, sedangkan 'padang belantara' memberi gambaran wilayah liar tanpa membatasi maknanya pada gurun pasir.
