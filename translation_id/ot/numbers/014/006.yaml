id: NUM.14.6
reference: Numbers 14:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֣עַ בִּן נ֗וּן וְ/כָלֵב֙ בֶּן יְפֻנֶּ֔ה מִן הַ/תָּרִ֖ים אֶת הָ/אָ֑רֶץ קָרְע֖וּ בִּגְדֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/006.yaml
  text: And Joshua son of Nun and Caleb son of Jephunneh[a], from those who had spied out the land[b], tore their clothes.
translation:
  language: id
  text: Yosua anak Nun dan Kaleb anak Yefune, yang termasuk di antara orang-orang yang telah mengintai negeri itu,[a] mengoyakkan pakaian mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani juga dapat dipahami: “dari antara orang-orang yang telah mengintai negeri itu.” Preposisinya menunjukkan bahwa Yosua dan Kaleb termasuk dalam kelompok para pengintai.'
    reason: lexical_alternative
  - marker: b
    text: Mengoyakkan pakaian merupakan tanda dukacita, kengerian, atau kesesakan yang lazim pada zaman itu.
    reason: cultural_note
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: Yosua anak Nun
  rationale: Konjungsi waw tidak perlu dinyatakan secara kaku pada awal kalimat Indonesia; nama dan patronimik diterjemahkan menurut bentuk baku yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: dan Kaleb anak Yefune
  rationale: Konjungsi menghubungkan Kaleb dengan Yosua sebagai subjek bersama; patronimik dipertahankan secara langsung dan nama memakai ejaan Indonesia yang lazim.
- source_word: מִן הַתָּרִים
  choice: yang termasuk di antara orang-orang yang telah mengintai
  rationale: Preposisi מִן dipahami secara partitif, yakni Yosua dan Kaleb merupakan anggota kelompok pengintai. Bentuk partisip diterjemahkan sebagai tindakan yang telah berlangsung sebelumnya.
- source_word: אֶת הָאָרֶץ
  choice: negeri itu
  rationale: Penanda objek langsung אֶת tidak diterjemahkan. הָאָרֶץ merujuk pada wilayah yang sedang dibicarakan; 'negeri itu' alami dalam konteks dan tidak menambahkan nama Kanaan yang tidak terdapat dalam ayat.
- source_word: קָרְעוּ בִּגְדֵיהֶם
  choice: mengoyakkan pakaian mereka
  rationale: Ungkapan ini menyatakan tindakan merobek pakaian; 'mengoyakkan' mempertahankan tindakan yang disengaja, sedangkan 'pakaian' jelas dan wajar dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan hubungan partitif dalam teks Ibrani. Istilah 'mengoyakkan pakaian' mempertahankan gambaran budaya asli, yang dijelaskan melalui catatan kaki.
