  terminology: “TUHAN” tepat untuk יהוה menurut konvensi Indonesia. “Demi Aku yang hidup” mempertahankan formula sumpah חַי־אָנִי secara khidmat. Pemakaian “kalian” tepat untuk orang kedua jamak.
