  yaml_path: translation/ot/numbers/014/028.yaml
  text: Say to them, ‘As I live, declares the LORD, surely just as you have spoken in my hearing, so I will do to you.’
translation:
  language: id
  text: Katakanlah kepada mereka, “Demi Aku yang hidup, demikianlah firman TUHAN, sesungguhnya, seperti yang telah kalian katakan di telinga-Ku, demikianlah akan Kulakukan kepada kalian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי אָנִי
  choice: Demi Aku yang hidup
  rationale: Ungkapan sumpah ilahi ini diterjemahkan secara alami dan khidmat dalam bahasa Indonesia sambil mempertahankan dasar harfiahnya, yaitu bahwa TUHAN bersumpah demi hidup-Nya sendiri.
- source_word: נְאֻם יְהוָה
  choice: demikianlah firman TUHAN
  rationale: Rumus kenabian נְאֻם diterjemahkan dengan ungkapan Indonesia yang lazim dan bermartabat; nama perjanjian יהוה ditampilkan sebagai TUHAN sesuai konvensi terjemahan Indonesia.
- source_word: אִם לֹא
  choice: sesungguhnya
  rationale: Dalam konteks sumpah, bentuk ini berfungsi sebagai penegasan kuat, bukan sebagai syarat biasa; 'sesungguhnya' menyampaikan daya penegasannya tanpa menambahkan isi.
- source_word: דִּבַּרְתֶּם בְּאָזְנָי
  choice: yang telah kalian katakan di hadapan-Ku
  rationale: Secara harfiah berarti 'yang kalian katakan di telinga-Ku'. Ungkapan 'di hadapan-Ku' terdengar alami dalam bahasa Indonesia dan tetap menyatakan bahwa Allah sendiri mendengar perkataan mereka.
- source_word: אֶעֱשֶׂה לָכֶם
  choice: akan Kulakukan terhadap kalian
  rationale: Preposisi ל menunjukkan tindakan yang dikenakan kepada mereka; 'terhadap kalian' mempertahankan nuansa penghakiman dalam konteks tanpa memperjelas melampaui teks.
theological_decisions:
- issue: Bentuk sumpah ilahi חַי אָנִי
  choice: Demi Aku yang hidup
  alternative: Aku bersumpah demi hidup-Ku
  rationale: Pilihan utama mempertahankan bentuk idiom sumber dan ketegangan retorisnya, sedangkan alternatif secara eksplisit menambahkan verba 'bersumpah' yang hanya tersirat.
- issue: Penulisan nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH / Yahweh
  rationale: TUHAN mengikuti konvensi baku yang luas dalam Alkitab bahasa Indonesia dan selaras dengan lapisan konsultasi yang telah diaudit, tanpa memasukkan pelafalan yang diperdebatkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina jamak 'kalian' dipakai agar pembedaan jumlah dalam bahasa Ibrani tetap jelas; bentuk enklitik kapital pada 'Ku-' menandai rujukan kepada Allah. Struktur paralel 'seperti ... demikianlah ...' dipertahankan.
