base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/037.yaml
  text: those men who had brought out a bad report about the land died by the plague before Yahweh.
translation:
  language: id
  text: Orang-orang yang menyampaikan laporan buruk tentang negeri itu mati karena wabah di hadapan Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמֻתוּ
  choice: mati
  rationale: Bentuk wayyiqtol Qal dari מות menyatakan peristiwa lampau dalam rangkaian narasi; konjungsi tidak diterjemahkan tersendiri agar kalimat Indonesia tetap alami.
- source_word: הָאֲנָשִׁים
  choice: Orang-orang itu
  rationale: Nomina jamak definit ini merujuk kembali kepada para pengintai yang telah disebutkan; bentuk 'orang-orang itu' mempertahankan daya rujuk tersebut.
- source_word: מוֹצִאֵי דִבַּת הָאָרֶץ רָעָה
  choice: yang menyampaikan laporan buruk tentang negeri itu
  rationale: Konstruksi partisipial mengidentifikasi mereka melalui tindakan sebelumnya. דִבָּה mengandung nuansa laporan buruk atau mencemarkan; 'menyampaikan' mengungkapkan tindakan kausatif הוציא secara alami tanpa mempersempitnya menjadi sekadar menyebarkan.
- source_word: רָעָה
  choice: buruk
  rationale: Kata ini menerangkan 'laporan'; 'buruk' merupakan padanan Indonesia yang alami dan tetap memuat penilaian negatif tanpa melebihkan nuansanya menjadi istilah moral yang lebih sempit.
- source_word: בַּמַּגֵּפָה
  choice: karena wabah
  rationale: מַגֵּפָה menunjuk pada wabah atau pukulan mematikan. Preposisi בְּ di sini menyatakan sarana atau sebab kematian; 'karena wabah' jelas dan idiomatis dalam bahasa Indonesia.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי secara harfiah dan teologis menyatakan kejadian dalam hadirat Yahweh; 'di hadapan' mempertahankan ungkapan sumber dengan wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. Transliterasi 'Yahweh' mempertahankan nama tersebut dan selaras dengan lapisan konsultasi yang diperbarui.
- issue: Makna לִפְנֵי יְהוָה dalam peristiwa penghukuman
  choice: di hadapan Yahweh
  alternative: oleh Yahweh
  rationale: Frasa sumber menyatakan lokasi atau kehadiran secara teologis, bukan secara eksplisit menyebut Yahweh sebagai pelaku gramatikal. Terjemahan ini tidak menghapus kaitan penghukuman ilahi, tetapi juga tidak mengubah frasa menjadi keterangan pelaku.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dibuat alami bagi pembaca umum sambil mempertahankan rujukan anaforis, nuansa negatif דִבָּה, serta ungkapan kehadiran ilahi.
