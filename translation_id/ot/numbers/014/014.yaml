id: NUM.14.14
reference: Numbers 14:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אָמְר֗וּ אֶל יוֹשֵׁב֮ הָ/אָ֣רֶץ הַ/זֹּאת֒ שָֽׁמְעוּ֙ כִּֽי אַתָּ֣ה יְהוָ֔ה בְּ/קֶ֖רֶב הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁר עַ֨יִן בְּ/עַ֜יִן נִרְאָ֣ה אַתָּ֣ה יְהוָ֗ה וַ/עֲנָֽנְ/ךָ֙ עֹמֵ֣ד עֲלֵ/הֶ֔ם וּ/בְ/עַמֻּ֣ד עָנָ֗ן אַתָּ֨ה הֹלֵ֤ךְ לִ/פְנֵי/הֶם֙ יוֹמָ֔ם וּ/בְ/עַמּ֥וּד אֵ֖שׁ לָֽיְלָה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/014.yaml
  text: And they will tell the inhabitants of this land[a], who have heard that you, Yahweh, are in the midst of this people, that you, Yahweh, are seen face to face, and your cloud stands over them, and you go before them in a pillar of cloud by day and in a pillar of fire by night.
translation:
  language: id
  text: Lalu mereka akan memberitahukan hal itu kepada penduduk negeri ini. Mereka telah mendengar bahwa Engkau, Yahweh, berada di tengah-tengah bangsa ini; bahwa Engkau, Yahweh, tampak muka dengan muka[a]; bahwa awan-Mu berdiri di atas mereka; dan bahwa Engkau berjalan di depan mereka dalam tiang awan pada siang hari dan dalam tiang api pada malam hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mata dengan mata Engkau terlihat.”
    reason: Frasa Ibrani עַיִן בְּעַיִן secara harfiah memuat gambaran “mata dengan mata”; teks utama memakai padanan idiomatis Indonesia tanpa menghilangkan ambiguitas bentuk Niphal נִרְאָה.
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַזֹּאת
  choice: penduduk negeri ini
  rationale: Partisip tunggal berfungsi kolektif. 'Penduduk negeri ini' alami dalam bahasa Indonesia dan menunjuk kepada seluruh masyarakat yang mendiami negeri itu.
- source_word: שָׁמְעוּ
  choice: mereka telah mendengar
  rationale: Bentuk qatal menunjukkan informasi yang sudah mereka dengar dan kini mereka ketahui; 'telah mendengar' mempertahankan hubungan antara tindakan lampau dan keadaan kini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: בְּקֶרֶב
  choice: berada di tengah-tengah
  rationale: Ungkapan ini mempertahankan gambaran kehadiran Yahweh di antara umat, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: עַיִן בְּעַיִן
  choice: berhadapan muka dengan muka
  rationale: Idiom harfiahnya adalah 'mata dengan mata'. Dalam konteks penampakan, 'berhadapan muka dengan muka' menyampaikan kedekatan langsung tanpa menghilangkan ambiguitas; bentuk harfiah dicatat dalam catatan kaki.
- source_word: נִרְאָה
  choice: terlihat
  rationale: Bentuk Niphal mempertahankan nuansa pasif, yaitu Yahweh dapat dilihat atau tampak, tanpa menentukan lebih jauh sifat penampakan itu.
- source_word: וַעֲנָנְךָ עֹמֵד עֲלֵהֶם
  choice: awan-Mu berdiri di atas mereka
  rationale: Terjemahan konkret ini mempertahankan citra awan yang tetap berada di atas umat.
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: berjalan di depan mereka
  rationale: '''Berjalan di depan'' dekat dengan verba Ibrani dan tidak mengubahnya secara interpretatif menjadi ''memimpin''.'
- source_word: בְּעַמּוּד עָנָן ... וּבְעַמּוּד אֵשׁ
  choice: dalam tiang awan ... dan dalam tiang api
  rationale: Preposisi diterjemahkan secara lokatif/modal untuk menggambarkan cara kehadiran Yahweh tampak ketika berjalan di depan umat.
- source_word: יוֹמָם ... לָיְלָה
  choice: pada siang hari ... pada malam hari
  rationale: Ini adalah padanan adverbial waktu yang alami dan jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama ilahi secara langsung. Transliterasi 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Makna עַיִן בְּעַיִן נִרְאָה
  choice: Engkau ... terlihat berhadapan muka dengan muka
  alternative: Engkau tampak mata dengan mata; Engkau terlihat dengan jelas
  rationale: Frasa Ibrani bersifat idiomatis dan secara harfiah berbunyi 'mata dengan mata'. Teks utama memakai ungkapan Indonesia yang dapat dipahami, sedangkan catatan kaki mempertahankan citra harfiah dan kemungkinan 'menampakkan diri', tanpa menetapkan teori tertentu mengenai cara umat melihat Allah.
- issue: Hubungan sintaksis שָׁמְעוּ כִּי
  choice: 'kalimat baru: ''Mereka telah mendengar bahwa ...'''
  alternative: 'anak kalimat relatif: ''yang telah mendengar bahwa ...'''
  rationale: Dalam alur Ibrani, verba jamak 'mereka telah mendengar' paling wajar merujuk kepada penduduk negeri itu dan melanjutkan apa yang bangsa-bangsa ketahui. Pemisahan menjadi kalimat baru menghindari struktur Indonesia yang terlalu bertumpuk tanpa mengubah hubungan makna.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina yang merujuk kepada Yahweh ditulis dengan huruf kapital. Struktur Ibrani yang panjang dibagi menjadi dua kalimat dan beberapa klausa bertitik koma agar mudah dipahami, sambil mempertahankan pengulangan nama Yahweh dan rangkaian kesaksian tentang kehadiran-Nya.
