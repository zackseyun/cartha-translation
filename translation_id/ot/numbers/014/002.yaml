  text: וַ/יִּלֹּ֨נוּ֙ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֔ן כֹּ֖ל בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם כָּל הָ/עֵדָ֗ה לוּ מַ֨תְנוּ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם א֛וֹ בַּ/מִּדְבָּ֥ר הַ/זֶּ֖ה לוּ מָֽתְנוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/002.yaml
  text: And all the sons of Israel grumbled against Moses and against Aaron[a], and the whole congregation said to them[b], “If only we had died in the land of Egypt! Or if only we had died in this wilderness!”
translation:
  language: id
  text: Lalu seluruh bani Israel[a] bersungut-sungut[b] terhadap Musa dan Harun. Segenap umat itu berkata kepada mereka, “Sekiranya kami mati di tanah Mesir! Atau sekiranya kami mati di padang gurun ini!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh anak-anak lelaki Israel”; maksudnya, seluruh orang Israel.
    reason: lexical_alternative
  - marker: b
    text: Atau “menggerutu” atau “mengeluh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: bersungut-sungut
  rationale: Ungkapan ini secara alami menyatakan keluhan bersama yang bernada menentang para pemimpin, sesuai dengan pemakaian verba לון/לין dalam kisah perjalanan di padang gurun.
- source_word: עַל
  choice: terhadap
  rationale: Dalam konstruksi dengan verba keluhan, preposisi ini menandai Musa dan Harun sebagai sasaran keluhan; “terhadap” mempertahankan daya konfrontatifnya.
- source_word: כֹּל בְּנֵי יִשְׂרָאֵל
  choice: seluruh bani Israel
  rationale: “Bani Israel” mempertahankan bentuk sebutan kolektif yang dekat dengan ungkapan Ibrani dan tetap lazim dipahami sebagai seluruh orang Israel.
- source_word: כָּל הָעֵדָה
  choice: segenap umat itu
  rationale: עֵדָה menunjuk pada komunitas Israel sebagai satu perhimpunan. “Segenap umat itu” alami dalam bahasa Indonesia dan menghindari kesan bahwa yang dimaksud hanya sebuah sidang formal.
- source_word: לוּ
  choice: Ah, sekiranya
  rationale: לוּ mengungkapkan harapan yang berlawanan dengan kenyataan. Gabungan ini menyampaikan nada keluhan dan hasrat kuat tanpa bahasa yang usang.
- source_word: מַתְנוּ / מָתְנוּ
  choice: kami mati
  rationale: Bentuk perfektif sesudah לוּ menyatakan harapan kontrafaktual. Bahasa Indonesia tidak wajib menandai kala lampau secara morfologis; konteks Mesir dan ungkapan “sekiranya” sudah menyampaikan maksud tersebut tanpa menambahkan penafsiran waktu yang berlebihan.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: di tanah Mesir
  rationale: Pilihan ini mempertahankan unsur אֶרֶץ sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: di padang gurun ini
  rationale: “Padang gurun” adalah padanan Indonesia yang umum untuk מִדְבָּר dalam konteks perjalanan Israel dan mempertahankan latar geografis ayat.
theological_decisions:
- issue: Sebutan nasional bergender dalam בְּנֵי יִשְׂרָאֵל
  choice: seluruh bani Israel
  alternative: seluruh orang Israel; seluruh anak Israel; seluruh putra Israel
  rationale: Bentuk Ibrani secara harfiah memakai “anak-anak lelaki/putra-putra Israel,” tetapi sebagai sebutan nasional ungkapan itu merujuk kepada umat secara keseluruhan. “Bani Israel” mempertahankan bentuk tradisional yang berakar pada hubungan keturunan tanpa secara keliru membatasi kelompok itu hanya pada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Bani Israel” dipakai sebagai sebutan kolektif yang dikenal luas; “bersungut-sungut” mempertahankan nada keluhan yang membangkang. Seruan “Ah, sekiranya” menyampaikan kuatnya harapan kontrafaktual tanpa susunan yang terasa kaku.
