  terminology: “Yahweh” secara konsisten merepresentasikan יהוה. Istilah “musuh-musuh kalian” dan “dikalahkan” sesuai konteks peperangan. Catatan kaki terikat pada penanda yang benar dan menawarkan alternatif yang relevan tanpa mengubah makna utama.
