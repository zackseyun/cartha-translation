base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/042.yaml
  text: Do not go up[a], for Yahweh is not among you[b], so that you may not be struck down before your enemies.
translation:
  language: id
  text: Jangan naik[a], sebab Yahweh tidak ada di tengah-tengah kalian[b], agar kalian tidak dikalahkan[c] di hadapan musuh-musuh kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “maju mendaki.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di bagian tengah kalian”; dapat juga diterjemahkan “di antara kalian.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “dipukul jatuh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּעֲלוּ
  choice: Jangan naik
  rationale: Partikel larangan אַל bersama bentuk verba תַּעֲלוּ menyatakan larangan. Verba עלה secara harfiah berarti ‘naik’ dan dalam konteks ini menunjuk pada gerak maju menuju daerah perbukitan; ‘naik’ mempertahankan gambaran geografis Ibrani.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi larangan sebelumnya; ‘sebab’ alami dalam bahasa Indonesia yang bermartabat.
- source_word: אֵין יְהוָה בְּקִרְבְּכֶם
  choice: Yahweh tidak ada di tengah-tengah kalian
  rationale: Mempertahankan nama ilahi יְהוָה dan arti spasial-komunal בְּקִרְבְּכֶם, yakni kehadiran di tengah umat, tanpa memperluas klaim teologis teks.
- source_word: וְלֹא תִּנָּגְפוּ
  choice: agar kalian tidak dikalahkan
  rationale: Dalam konteks peringatan, rangkaian ini menyatakan akibat buruk yang hendak dihindari. Nifal נגף dapat berarti dipukul atau dikalahkan dalam pertempuran; ‘dikalahkan’ paling jelas dan alami dalam konteks militer.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: di hadapan musuh-musuh kalian
  rationale: לִפְנֵי secara harfiah berarti ‘di hadapan’ dan lazim dipakai untuk kekalahan di depan pihak lawan; אֹיְבֵיכֶם berarti ‘musuh-musuh kalian’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. ‘Yahweh’ mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Ungkapan kehadiran ilahi בְּקִרְבְּכֶם
  choice: tidak ada di tengah-tengah kalian
  alternative: tidak menyertai kalian
  rationale: Pilihan utama mempertahankan gambaran kehadiran di tengah komunitas dan tidak menyederhanakannya menjadi ungkapan yang lebih umum tentang penyertaan.
- issue: Daya peringatan וְלֹא תִּנָּגְפוּ
  choice: agar kalian tidak dikalahkan
  alternative: dan jangan sampai kalian dipukul jatuh
  rationale: ‘Agar ... tidak’ menyampaikan akibat yang hendak dihindari secara alami. Alternatif mempertahankan citra pukulan secara lebih harfiah, tetapi kurang lancar dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan sapaan jamak ‘kalian’, sesuai orang kedua jamak dalam teks. Susunan kalimat mempertahankan larangan, alasannya, lalu akibat militer yang harus dihindari. Tanda koma menjaga ayat sebagai satu rangkaian peringatan.
