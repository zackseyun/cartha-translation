base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/015.yaml
  text: And if you kill this people as one man[a], then the nations that have heard your report will say[b],
translation:
  language: id
  text: Jika Engkau membunuh bangsa ini sekaligus,[a] bangsa-bangsa yang telah mendengar kabar tentang Engkau akan berkata,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seperti satu orang”; maksudnya, seluruh bangsa itu bersama-sama atau sekaligus.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang telah mendengar tentang kemasyhuran-Mu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמַתָּה
  choice: Jika Engkau membunuh
  rationale: Bentuk Hifil dari מות berarti menyebabkan mati atau membunuh. Walaupun וְ secara harfiah hanya merupakan kata penghubung, konteks lanjutan dari ayat sebelumnya bersifat pengandaian, sehingga 'jika' menyampaikan hubungan itu secara alami.
- source_word: הָעָם הַזֶּה
  choice: seluruh bangsa ini
  rationale: עָם menunjuk kepada Israel secara kolektif. 'Bangsa ini' alami dalam bahasa Indonesia, sedangkan 'seluruh' memperjelas totalitas yang dinyatakan oleh ungkapan berikutnya.
- source_word: כְּאִישׁ אֶחָד
  choice: sekaligus
  rationale: Secara harfiah berarti 'seperti satu orang', tetapi di sini merupakan ungkapan yang menyatakan bahwa segenap bangsa dibinasakan bersama-sama atau dalam satu tindakan. 'Sekaligus' menyampaikan maksud idiom itu dengan alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: הַגּוֹיִם
  choice: bangsa-bangsa
  rationale: גּוֹיִם berarti bangsa-bangsa di luar Israel dalam konteks ini. Pilihan ini menghindari asosiasi yang lebih khusus dari istilah 'orang-orang bukan Yahudi'.
- source_word: אֲשֶׁר שָׁמְעוּ אֶת שִׁמְעֲךָ
  choice: yang telah mendengar kabar tentang Engkau
  rationale: שֵׁמַע dapat berarti kabar, berita, atau kemasyhuran. Susunan dengan sufiks orang kedua dapat dipahami sebagai kabar mengenai TUHAN; 'kabar tentang Engkau' alami dan mempertahankan ambiguitas antara laporan mengenai karya-Nya dan reputasi-Nya.
- source_word: לֵאמֹר
  choice: akan berkata,
  rationale: Infinitif ini memperkenalkan isi perkataan bangsa-bangsa yang berlanjut pada ayat berikutnya. Dalam bahasa Indonesia paling alami dinyatakan dengan verba finit 'akan berkata'.
theological_decisions:
- issue: Ungkapan antropologis dengan nomina maskulin tunggal
  choice: sekaligus
  alternative: seperti satu orang
  rationale: אִישׁ dalam frasa ini berfungsi secara idiomatis dan tidak menegaskan bahwa orang-orang yang dimaksud semuanya laki-laki. Terjemahan 'sekaligus' mempertahankan gagasan totalitas tanpa memberi kesan keliru mengenai jenis kelamin, sementara bentuk sumber dijelaskan dalam catatan kaki.
- issue: Makna שִׁמְעֲךָ
  choice: kabar tentang Engkau
  alternative: kemasyhuran-Mu
  rationale: Kata ini dapat menunjuk pada laporan yang didengar maupun kemasyhuran yang timbul darinya. Pilihan utama tidak membatasi maknanya hanya pada reputasi, dan alternatif semantiknya dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada 'Engkau' mengikuti rujukan langsung kepada Allah. Kalimat sengaja diakhiri koma karena perkataan bangsa-bangsa berlanjut pada ayat berikutnya.
