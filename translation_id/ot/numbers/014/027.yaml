  text: עַד מָתַ֗י לָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את אֲשֶׁ֛ר הֵ֥מָּה מַלִּינִ֖ים עָלָ֑/י אֶת תְּלֻנּ֞וֹת בְּנֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר הֵ֧מָּה מַלִּינִ֛ים עָלַ֖/י שָׁמָֽעְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/027.yaml
  text: How long shall this evil congregation grumble against me? I have heard the complaints of the sons of Israel[b][a], which they are grumbling against me.
translation:
  language: id
  text: “Sampai kapan umat[a] jahat ini bersungut-sungut terhadap-Ku? Aku telah mendengar keluhan orang Israel[b] yang mereka tujukan terhadap-Ku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jemaah” atau “perhimpunan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak Israel”; maksudnya, bangsa Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: Sampai kapan
  rationale: Ungkapan waktu ini merupakan pertanyaan retoris yang menyatakan kejengkelan; padanan ini alami dalam bahasa Indonesia dan mempertahankan tekanannya.
- source_word: לָעֵדָה
  choice: umat
  rationale: עֵדָה menunjuk pada kelompok atau komunitas Israel secara kolektif. “Umat” alami dan bermartabat dalam konteks ini; alternatif yang lebih formal dicatat dalam catatan kaki.
- source_word: הָרָעָה הַזֹּאת
  choice: yang jahat ini
  rationale: רָעָה di sini merupakan penilaian moral, bukan sekadar menyatakan sesuatu yang buruk atau tidak menyenangkan.
- source_word: מַלִּינִים
  choice: bersungut-sungut
  rationale: Dalam kisah pengembaraan di padang gurun, bentuk ini menggambarkan keluhan berulang yang bernada menentang. “Bersungut-sungut” mempertahankan nuansa tersebut.
- source_word: עָלַי
  choice: terhadap-Ku
  rationale: Preposisi ini menyatakan bahwa keluhan itu diarahkan kepada Allah dengan nuansa permusuhan atau perlawanan, bukan sekadar dibicarakan di hadapan-Nya.
- source_word: תְּלֻנּוֹת
  choice: keluhan
  rationale: Kata benda ini menunjuk pada keluhan yang diungkapkan. “Keluhan” jelas dalam bahasa Indonesia modern, sedangkan pengulangan akar gagasannya tetap tercermin melalui “bersungut-sungut” dan frasa relatif berikutnya.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani harfiah “anak-anak lelaki Israel” berfungsi sebagai sebutan kolektif bagi bangsa Israel. “Orang Israel” adalah padanan Indonesia yang alami tanpa mempersempit rujukannya hanya kepada laki-laki.
- source_word: שָׁמָעְתִּי
  choice: Aku telah mendengar
  rationale: Bentuk perfektif menyatakan bahwa Allah sungguh telah mendengar keluhan yang berlangsung dan kini menanggapinya.
theological_decisions:
- issue: Ketiadaan kata kerja utama yang tersurat sesudah עַד מָתַי
  choice: Aku harus menanggung
  alternative: 'Mempertahankan elipsis: “Sampai kapan lagi dengan umat yang jahat ini?”'
  rationale: Teks Ibrani berbentuk eliptis dan tidak menyebutkan kata kerja utama. “Menanggung” melengkapi maksud pertanyaan secara alami dalam bahasa Indonesia tanpa mengubah sasaran kecaman; ketidaktersuratan kata kerja dalam sumber dijelaskan dalam catatan kaki.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Dalam konteks ini ungkapan tersebut merupakan nama kolektif umat perjanjian, bukan penegasan bahwa hanya putra-putra atau laki-laki yang dimaksud. Padanan kolektif mencegah penyempitan makna yang tidak dituntut teks.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. “Bersungut-sungut” dipertahankan karena tepat untuk keluhan berulang yang bersifat menentang, sedangkan “umat” dipilih daripada istilah kelembagaan yang lebih kaku. Huruf kapital pada pronomina ilahi mengikuti konvensi penerbitan Alkitab Indonesia.
