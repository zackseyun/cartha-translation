  text: אֲנִ֣י יְהוָה֮ דִּבַּרְתִּי֒ אִם לֹ֣א זֹ֣את אֶֽעֱשֶׂ֗ה לְ/כָל הָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את הַ/נּוֹעָדִ֖ים עָלָ֑/י בַּ/מִּדְבָּ֥ר הַ/זֶּ֛ה יִתַּ֖מּוּ וְ/שָׁ֥ם יָמֻֽתוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/035.yaml
  text: 'I[a], Yahweh, have spoken[b]. Surely I will do this to all this evil congregation who have gathered together against me: in this wilderness they will come to an end, and there they will die.'
translation:
  language: id
  text: 'Aku, Yahweh, telah berfirman: Sesungguhnya[a], Aku akan melakukan hal ini terhadap seluruh umat jahat ini[b] yang berhimpun melawan Aku. Di padang gurun ini mereka akan habis, dan di sana mereka akan mati.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jika tidak”; dalam konteks sumpah, ungkapan ini merupakan penegasan kuat.
    reason: lexical_alternative
  - marker: b
    text: Atau “seluruh jemaah jahat ini” atau “seluruh perhimpunan jahat ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: דִּבַּרְתִּי
  choice: telah berfirman
  rationale: Bentuk perfektif menyatakan ucapan ilahi yang sudah disampaikan dan tetap berlaku; 'berfirman' sesuai dengan ragam khidmat untuk perkataan Allah.
- source_word: אִם לֹא
  choice: Sesungguhnya
  rationale: Dalam konteks sumpah, ungkapan ini merupakan penegasan kuat, bukan syarat yang belum terpenuhi.
- source_word: הָעֵדָה
  choice: umat
  rationale: Di sini kata tersebut menunjuk kepada komunitas Israel secara kolektif; 'umat' alami dalam bahasa Indonesia dan tidak menyiratkan struktur gerejawi.
- source_word: הָרָעָה
  choice: yang jahat
  rationale: Mempertahankan penilaian moral atas komunitas yang memberontak, bukan sekadar keadaan yang buruk.
- source_word: הַנּוֹעָדִים עָלָי
  choice: yang berhimpun menentang Aku
  rationale: Menyampaikan tindakan berkumpul secara kolektif sekaligus arah permusuhannya terhadap Yahweh.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: di padang gurun ini
  rationale: '''Padang gurun'' merupakan padanan Indonesia yang lazim bagi מִדְבָּר dalam narasi Pentateukh.'
- source_word: יִתַּמּוּ
  choice: mereka akan habis
  rationale: Menjaga gagasan mencapai kesudahan tanpa meleburkannya dengan klausa berikutnya yang secara eksplisit menyebut kematian.
- source_word: וְשָׁם יָמֻתוּ
  choice: dan di sinilah mereka akan mati
  rationale: Kata penunjuk tempat dipertahankan dengan merujuk kembali secara tegas kepada padang gurun yang baru disebut.
theological_decisions:
- issue: Rumus penegasan seperti sumpah אִם לֹא
  choice: 'Penegasan kuat: ''Sesungguhnya, inilah yang akan Kulakukan'''
  alternative: 'Bentuk harfiah bersyarat: ''jika tidak, inilah yang akan Kulakukan'''
  rationale: Dalam konteks ini ungkapan Ibrani berfungsi sebagai ikrar ilahi yang pasti, bukan kondisi terbuka.
- issue: Sebutan kolektif עֵדָה bagi Israel
  choice: '''umat'''
  alternative: '''jemaah'' atau ''perhimpunan'''
  rationale: Konteksnya adalah penghukuman terhadap komunitas yang berkumpul sebagai satu kesatuan; 'umat' mempertahankan makna korporat tanpa memasukkan pengertian kelembagaan tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pada kata ganti yang merujuk kepada Allah mengikuti kebiasaan penulisan religius Indonesia. Susunan klausa mempertahankan penegasan ilahi, penilaian moral, dan kesejajaran antara 'akan habis' dan 'akan mati'.
