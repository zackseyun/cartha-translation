  text: Before the mountains were settled[a], before the hills, I was brought forth.
translation:
  language: id
  text: 'Sebelum gunung-gunung ditegakkan,

    sebelum ada bukit-bukit, aku dilahirkan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: Aku diperanakkan atau Aku dimunculkan. Bahasa Ibrani memakai gambaran kelahiran atau asal-usul bagi Hikmat yang dipersonifikasikan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: Sebelum
  rationale: Penanda waktu ini menyatakan bahwa sesuatu terjadi lebih dahulu; “sebelum” adalah padanan Indonesia yang alami dan mendukung kesejajaran puitis ayat ini.
- source_word: הָרִים
  choice: gunung-gunung
  rationale: Bentuk jamak ini secara langsung berarti gunung-gunung; dalam bahasa Indonesia, nomina generik jamak tidak memerlukan kata sandang tertentu.
- source_word: הָטְבָּעוּ
  choice: ditanam kukuh
  rationale: Bentuk Hofal dari טבע menggambarkan gunung-gunung sebagai sesuatu yang dibenamkan atau dipasang dengan teguh. “Ditanam kukuh” mempertahankan gambaran penempatan yang mantap tanpa terdengar terlalu teknis.
- source_word: לִפְנֵי
  choice: sebelum
  rationale: Preposisi ini dipakai secara temporal dan sejajar dengan בטרם; pengulangan “sebelum” mempertahankan struktur puisi Ibrani.
- source_word: גְבָעוֹת
  choice: bukit-bukit
  rationale: Padanan umum bagi bentuk jamak yang menjadi pasangan puitis “gunung-gunung”.
- source_word: חוֹלָלְתִּי
  choice: aku dilahirkan
  rationale: Kata ini memakai citra kelahiran atau asal-usul bagi Hikmat yang dipersonifikasikan. “Aku dilahirkan” alami dalam bahasa Indonesia dan mempertahankan citra tersebut tanpa mempersempitnya menjadi rumusan doktrinal tertentu.
theological_decisions:
- issue: Bahasa asal-usul Hikmat yang dipersonifikasikan dapat dibaca melalui perdebatan teologis kemudian.
  choice: aku dilahirkan
  alternative: aku diperanakkan; aku dimunculkan
  rationale: Terjemahan ini mempertahankan citra kelahiran dalam bahasa Ibrani, tetapi tidak menyamakan Hikmat secara eksplisit dengan tokoh tertentu ataupun menetapkan kesimpulan Kristologis. Alternatif dicatat agar keluasan makna asal-usul tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Pengulangan “sebelum” menjaga paralelisme Ibrani. “Ditanam kukuh” mempertahankan citra gunung yang dibenamkan atau ditetapkan teguh, sedangkan “aku dilahirkan” menjaga personifikasi dan ketegangan teologis teks.
