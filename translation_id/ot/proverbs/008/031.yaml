  text: rejoicing in the world of his earth[b][a], and my delight was with the sons of man.
translation:
  language: id
  text: 'bersukacita di dunia-Nya yang berpenghuni[a],

    dan kesukaanku ada bersama umat manusia[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di dunia yang dihuni.” Frasa Ibrani ini mencakup kata untuk “dunia” dan “bumi-Nya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “anak-anak manusia”; maksudnya, seluruh umat manusia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֶקֶת
  choice: bersukacita
  rationale: Partisipel feminin ini menggambarkan Hikmat yang dipersonifikasikan sedang menikmati ciptaan dengan riang. “Bersukacita” mempertahankan gerak sukacita yang aktif tanpa memberi kesan sekadar bermain-main.
- source_word: בְּתֵבֵל אַרְצוֹ
  choice: di dunia-Nya yang berpenghuni
  rationale: תֵבֵל menunjuk pada dunia sebagai wilayah bumi yang tertata dan dihuni, sedangkan אַרְצוֹ menyatakan bahwa bumi itu milik-Nya. Susunan Indonesia ini menyampaikan kedua unsur secara alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וְשַׁעֲשֻׁעַי
  choice: dan kesukaanku
  rationale: Nomina berakhiran orang pertama secara harfiah dapat berbentuk jamak (“kesenangan-kesenanganku”), tetapi dalam puisi ini paling alami dipahami sebagai gagasan kolektif atau intensif, yaitu “kesukaanku”.
- source_word: אֶת בְּנֵי אָדָם
  choice: bersama umat manusia
  rationale: אֶת di sini menyertai ungkapan relasional שַׁעֲשֻׁעַי dan paling alami diterjemahkan “bersama”. בְּנֵי אָדָם secara idiomatis merujuk kepada seluruh manusia; bentuk harfiahnya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Suara feminin Hikmat yang dipersonifikasikan dan kemungkinan pembacaan kristologis kemudian
  choice: Mempertahankan ucapan orang pertama Hikmat sebagai tokoh feminin dalam puisi Ibrani tanpa mengidentifikasikannya secara eksplisit dengan pribadi lain
  alternative: Menerjemahkan dengan bahasa yang secara langsung mengidentifikasikan Hikmat dengan Sang Anak sebelum inkarnasi
  rationale: Teks Ibrani menampilkan Hikmat yang dipersonifikasikan sebagai pembicara. Terjemahan harus mempertahankan bentuk puisi tersebut dan membiarkan kemungkinan pembacaan kanonis atau tipologis tetap menjadi soal penafsiran.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan mudah dipahami. Bentuk feminin gramatikal tidak perlu ditandai pada verba Indonesia, tetapi konteks tetap mempertahankan Hikmat sebagai pembicara yang dipersonifikasikan. Pemenggalan dua larik mengikuti paralelisme puisi Ibrani.
