  source_fidelity: Draf dengan tepat mencakup cakupan menyeluruh (כָּל), ucapan dari mulut sang Hikmat, sifatnya yang benar/selaras dengan kebenaran (בְּצֶדֶק), serta penyangkalan atas dua istilah metaforis yang berdekatan, נִפְתָּל dan עִקֵּשׁ. “Benar” adalah padanan Indonesia yang wajar di konteks ini dan tidak secara tidak perlu membatasi makna kepada ranah hukum.
