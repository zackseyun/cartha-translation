  register: Bahasa Indonesia modern, lugas, dan bermartabat. Paralelisme moral-spasial antara perkataan yang benar dan sesuatu yang berbelit-belit atau bengkok dipertahankan; tidak diperlukan catatan kaki karena padanan utama cukup mencakup nuansa leksikal ayat.
