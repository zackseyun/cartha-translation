  terminology: “Berbelit-belit” dan “bengkok” mempertahankan pasangan metaforis Ibrani tanpa memaksakan tafsiran doktrinal. Tidak diperlukan catatan kaki; alternatif seperti “menyimpang” atau “licik” bukan keharusan dan dapat mempersempit atau menggeser citra tekstual.
