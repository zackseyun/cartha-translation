  text: All the words of my mouth are righteous[a]; there is nothing twisted or crooked in them.
translation:
  language: id
  text: Semua perkataan mulutku benar; tidak ada yang berbelit-belit atau bengkok di dalamnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּצֶדֶק
  choice: benar
  rationale: Ungkapan preposisional Ibrani ini menyatakan bahwa seluruh perkataan Hikmat selaras dengan kebenaran dan kelurusan moral. Dalam bahasa Indonesia, predikat 'benar' menyampaikan maksud itu secara alami tanpa mempersempitnya hanya pada keadilan hukum.
- source_word: כָּל
  choice: Semua
  rationale: '''Semua'' secara wajar menyatakan cakupan menyeluruh atas bentuk jamak ''perkataan''.'
- source_word: אִמְרֵי פִי
  choice: perkataan dari mulutku
  rationale: Pilihan ini mempertahankan gambaran konkret Ibrani tentang perkataan yang keluar dari mulut, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: אֵין בָּהֶם
  choice: tidak ada ... di dalamnya
  rationale: Susunan ini mempertahankan bentuk penyangkalan eksistensial dan rujukan kepada semua perkataan tersebut.
- source_word: נִפְתָּל
  choice: berbelit-belit
  rationale: Kata ini menggambarkan sesuatu yang dipelintir, berliku, atau tidak lurus; 'berbelit-belit' alami untuk tuturan yang menyesatkan atau tidak terus terang.
- source_word: וְעִקֵּשׁ
  choice: atau bengkok
  rationale: '''Bengkok'' mempertahankan metafora konkret mengenai penyimpangan moral. Dalam klausa negatif bahasa Indonesia, ''atau'' secara alami menyampaikan bahwa tidak satu pun dari kedua sifat itu terdapat dalam perkataan tersebut.'
theological_decisions: []
