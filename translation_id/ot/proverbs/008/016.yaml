id: PRO.8.16
reference: Proverbs 8:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בִּ֭/י שָׂרִ֣ים יָשֹׂ֑רוּ וּ֝/נְדִיבִ֗ים כָּל שֹׁ֥פְטֵי צֶֽדֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/016.yaml
  text: By me rulers rule[a], and nobles, all judges of righteousness.
translation:
  language: id
  text: 'Melalui aku para penguasa memerintah,

    dan para bangsawan, semua hakim yang adil.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “semua hakim yang benar.” Kata Ibrani צֶדֶק dapat menunjuk pada kebenaran moral maupun keadilan dalam penghakiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: Melalui aku
  rationale: Preposisi ב dengan akhiran orang pertama tunggal menyatakan sarana atau perantaraan dalam ucapan Hikmat. “Melalui aku” alami dalam bahasa Indonesia dan tidak menyiratkan bahwa setiap penguasa pasti mendapat pengesahan moral.
- source_word: שָׂרִים
  choice: para penguasa
  rationale: Kata ini menunjuk kepada pemimpin atau pejabat tinggi. “Para penguasa” mencakup fungsi pemerintahan tanpa membatasinya pada putra raja.
- source_word: יָשֹׂרוּ
  choice: memerintah
  rationale: Verba שׂרר berarti berkuasa atau memerintah. Pilihan ini ringkas dan mempertahankan kesejajaran dengan “para penguasa”.
- source_word: וּנְדִיבִים
  choice: para bangsawan
  rationale: Istilah ini dapat menunjuk kepada orang-orang terkemuka atau pemimpin dari kalangan bangsawan. “Para bangsawan” membedakannya dari kelompok penguasa pada baris pertama.
- source_word: כָּל שֹׁפְטֵי צֶדֶק
  choice: semua yang menghakimi dengan benar
  rationale: Partisipel שֹׁפְטֵי dapat diterjemahkan secara fungsional sebagai “yang menghakimi”. Frasa “dengan benar” menyampaikan צֶדֶק secara alami sambil tetap dapat mencakup kelurusan moral dan keadilan dalam putusan.
- source_word: צֶדֶק
  choice: dengan benar
  rationale: צֶדֶק mencakup apa yang benar secara moral maupun adil secara hukum. Ungkapan “dengan benar” mempertahankan keluasan itu; nuansa yudisial “dengan adil” dicatat dalam catatan kaki.
theological_decisions:
- issue: Peran Hikmat dalam pelaksanaan kekuasaan politik
  choice: Ayat ini menyatakan bahwa para pemimpin menjalankan pemerintahan dan penghakiman melalui Hikmat.
  alternative: Ayat ini menyatakan bahwa setiap kekuasaan politik secara langsung disahkan oleh Hikmat.
  rationale: Bahasa Ibrani menggambarkan Hikmat sebagai sarana bagi pemerintahan yang benar, tetapi tidak dengan sendirinya menyatakan bahwa setiap penguasa atau setiap tindakannya memperoleh pengesahan moral.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur dua baris mempertahankan gaya puitis; koma mengikuti hubungan sintaksis yang dapat dipahami sebagai kelanjutan atau perincian, tanpa memaksakan penafsiran apposisi yang terlalu tegas.
