  terminology: '"Penguasa," "bangsawan," and "memerintah" are suitable. Rendering שֹׁפְטֵי as "hakim" retains the source term''s judicial-office sense. "Adil" is idiomatic in this setting and preserves the justice-oriented sense; the footnote records "benar" for the broader moral sense of צֶדֶק.'
