  text: On the heights beside the road[a], at the crossroads she takes her stand.
translation:
  language: id
  text: Di puncak-puncak bukit, di tepi jalan, di persimpangan jalan[a], ia berdiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di rumah jalur-jalur”—yakni, di tempat jalur-jalur bertemu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹאשׁ מְרוֹמִים
  choice: Di tempat tinggi
  rationale: Ungkapan ini menunjuk pada lokasi yang tinggi dan menonjol. Pilihan ini alami dalam bahasa Indonesia serta mempertahankan gambaran bahwa Hikmat berdiri di tempat yang mudah terlihat dan didengar.
- source_word: עֲלֵי דָרֶךְ
  choice: di tepi jalan
  rationale: Frasa ini menyatakan lokasi di sisi atau dekat jalan. 'Di tepi jalan' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: בֵּית נְתִיבוֹת
  choice: di persimpangan jalan
  rationale: Secara harfiah berarti 'rumah jalan-jalan' dan menunjuk pada tempat beberapa jalur bertemu. 'Di persimpangan jalan' menyampaikan makna idiomatisnya dengan jelas.
- source_word: נִצָּבָה
  choice: ia berdiri
  rationale: Bentuk feminin tunggal ini menggambarkan Hikmat yang berdiri atau mengambil posisi. 'Ia berdiri' ringkas, alami, dan tidak menambahkan penafsiran yang melampaui teks.
theological_decisions:
- issue: Personifikasi Hikmat sebagai tokoh feminin
  choice: Menggunakan kata ganti 'ia' dengan rujukan kepada Hikmat dalam konteks
  alternative: Mengulangi 'Hikmat' atau memakai bentuk yang secara eksplisit menandai feminin
  rationale: Kata kerja Ibrani berbentuk feminin tunggal dan selaras dengan personifikasi Hikmat. Bahasa Indonesia tidak membedakan gender dalam kata ganti orang ketiga; 'ia' mempertahankan personifikasi tanpa memasukkan penandaan gender yang tidak alami.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis yang ringkas. Pengulangan kata 'jalan' dipertahankan karena alami dalam ungkapan 'persimpangan jalan' dan memperjelas latar ruang publik.
