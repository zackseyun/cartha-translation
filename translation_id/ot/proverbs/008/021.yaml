  yaml_path: translation/ot/proverbs/008/021.yaml
  text: to endow those who love me with wealth[a], and to fill their treasuries.
translation:
  language: id
  text: untuk mengaruniakan harta[a] kepada orang-orang yang mengasihi aku dan memenuhi perbendaharaan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk membuat orang-orang yang mengasihi aku mewarisi milik”; kata Ibrani יֵשׁ juga dapat diterjemahkan “milik”, “kekayaan”, atau “sesuatu yang nyata”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַנְחִיל
  choice: untuk mengaruniakan
  rationale: Bentuk Hifil dari נחל berarti menyebabkan seseorang mewarisi atau memberikan sesuatu sebagai milik. “Mengaruniakan” alami dalam bahasa Indonesia dan menyampaikan tindakan pemberian, sementara nuansa warisan dicatat dalam catatan kaki.
- source_word: אֹהֲבַי
  choice: orang-orang yang mengasihi aku
  rationale: Partisip dengan akhiran orang pertama tunggal menunjuk kepada mereka yang dicirikan oleh kasih kepada Hikmat yang dipersonifikasikan.
- source_word: יֵשׁ
  choice: harta
  rationale: Dalam konteks ini, terutama karena sejajar dengan tempat penyimpanan, kata ini menunjuk kepada milik atau kekayaan yang nyata. “Harta” jelas dan tidak sekuat “kekayaan” dalam menyiratkan kemakmuran besar.
- source_word: וְאֹצְרֹתֵיהֶם
  choice: dan ... tempat-tempat penyimpanan mereka
  rationale: Bentuk jamak אוֹצָר dapat berarti gudang atau perbendaharaan. “Tempat-tempat penyimpanan” mempertahankan gambaran konkret tanpa membatasi isinya pada uang.
- source_word: אֲמַלֵּא
  choice: memenuhi
  rationale: Bentuk Piel orang pertama tunggal secara harfiah berarti “aku akan memenuhi”; di sini klausa tersebut secara alami melanjutkan tujuan dari infinitif sebelumnya, sehingga diterjemahkan secara koordinatif sebagai “dan memenuhi”.
theological_decisions:
- issue: Sifat berkat yang dijanjikan oleh Hikmat yang dipersonifikasikan
  choice: Mempertahankan gambaran konkret tentang harta dan tempat penyimpanan tanpa menambahkan jaminan teologis mengenai kemakmuran materi.
  alternative: Menerjemahkan secara abstrak sebagai “kekayaan sejati” atau “harta yang kekal”.
  rationale: Kesejajaran יֵשׁ dengan “tempat-tempat penyimpanan” mendukung citra kepemilikan yang konkret, tetapi teks tidak memberi alasan untuk menambahkan penjelasan doktrinal bahwa semua orang saleh pasti menjadi kaya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. Kata ganti “aku” mempertahankan tuturan Hikmat yang dipersonifikasikan. Susunan tujuan pada kedua klausa dipertahankan agar ayat mengalir sebagai kelanjutan dari konteks sebelumnya.
