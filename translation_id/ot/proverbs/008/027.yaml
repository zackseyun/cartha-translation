source:
  edition: WLC
  text: בַּ/הֲכִינ֣/וֹ שָׁ֭מַיִם שָׁ֣ם אָ֑נִי בְּ/ח֥וּק/וֹ ח֝֗וּג עַל פְּנֵ֥י תְהֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/027.yaml
  text: When he established the heavens[a], I was there, when he inscribed a circle on the face of the deep.
translation:
  language: id
  text: Ketika Ia menegakkan langit, aku ada di sana; ketika Ia menggoreskan sebuah lingkaran[a] di atas permukaan samudra raya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menarik garis lingkar”; gambaran Ibrani ini dapat merujuk pada cakrawala atau batas melingkar di atas perairan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהֲכִינוֹ
  choice: ketika Ia menegakkan
  rationale: Bentuk ב ditambah infinitif konstruk dan sufiks berfungsi temporal. “Menegakkan” menyampaikan tindakan menetapkan dan mengokohkan tatanan ciptaan, bukan sekadar menyiapkannya.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Dalam bahasa Indonesia, “langit” merupakan padanan alami bagi bentuk Ibrani yang secara morfologis jamak dan tetap mencakup ruang kosmis dalam konteks penciptaan.
- source_word: שָׁם אָ֑נִי
  choice: aku ada di sana
  rationale: שָׁם bersifat lokatif, sedangkan kopula “ada” perlu ditambahkan agar ungkapan nominal Ibrani terdengar wajar dalam bahasa Indonesia.
- source_word: בְּח֥וּק/וֹ
  choice: ketika Ia menggoreskan
  rationale: Bentuk temporal ini menggambarkan tindakan menorehkan atau menarik suatu batas. “Menggoreskan” mempertahankan citra konkret yang berkaitan dengan objek חוּג.
- source_word: חוּג
  choice: sebuah lingkaran
  rationale: Padanan ini mempertahankan citra geometris dasar dalam bahasa Ibrani tanpa langsung menafsirkannya sebagai cakrawala atau kubah.
- source_word: עַל פְּנֵי
  choice: di atas permukaan
  rationale: Ungkapan ini menyampaikan arti harfiah “di atas muka/permukaan” dengan susunan yang alami dalam bahasa Indonesia modern.
- source_word: תְהוֹם
  choice: samudra raya
  rationale: Istilah ini menyampaikan perairan dalam purba dalam gambaran penciptaan tanpa memasukkan asosiasi teologis tambahan yang mungkin timbul dari kata “jurang maut”.
theological_decisions:
- issue: Gambaran kosmologis dalam tuturan Hikmat
  choice: Mempertahankan gambaran puitis tentang kehadiran Hikmat pada waktu penciptaan dan citra sebuah lingkaran di atas samudra raya.
  alternative: Menafsirkannya secara lebih khusus sebagai cakrawala, kubah langit, atau sebagai rujukan langsung kepada suatu rumusan kristologis tertentu.
  rationale: Teks Ibrani menampilkan Hikmat yang dipersonifikasikan dan memakai citra kosmologis yang terbuka. Terjemahan tidak seharusnya menetapkan model kosmologi atau kesimpulan doktrinal yang tidak dinyatakan langsung oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Kata ganti “aku” mempertahankan suara langsung Hikmat; “Ia” merujuk kepada Allah tanpa menambahkan gelar yang tidak terdapat dalam teks. Tanda titik koma memperjelas dua anak kalimat temporal yang sejajar.
