id: PRO.8.23
reference: Proverbs 8:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מֵ֭/עוֹלָם נִסַּ֥כְתִּי מֵ/רֹ֗אשׁ מִ/קַּדְמֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/023.yaml
  text: From everlasting I was established[a], from the beginning, from before the earth.
translation:
  language: id
  text: Sejak kekekalan aku telah ditetapkan[a], sejak semula, sebelum bumi ada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aku telah ditempatkan” atau “aku telah dilantik”; kata kerja Ibrani ini diperdebatkan dan, meski kurang mungkin di sini, juga dipahami sebagai “aku telah diurapi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעוֹלָם
  choice: Sejak kekekalan
  rationale: עוֹלָם dapat menunjuk pada masa purbakala yang sangat jauh atau kekekalan. Dalam konteks Hikmat yang mendahului penciptaan, “sejak kekekalan” mempertahankan cakupan waktu yang luhur tanpa mempersempitnya menjadi sekadar zaman dahulu.
- source_word: נִסַּכְתִּי
  choice: aku telah ditetapkan
  rationale: Bentuk Nifal dari נסך di sini diperdebatkan. “Telah ditetapkan” secara alami menyampaikan gagasan ditempatkan atau diangkat bagi suatu peran, tanpa memasukkan nuansa mesianik yang tidak dituntut konteks.
- source_word: מֵרֹאשׁ
  choice: sejak semula
  rationale: Dalam ungkapan waktu, רֹאשׁ lazim berarti awal atau permulaan. “Sejak semula” ringkas, bermartabat, dan sesuai dengan kesejajaran frasa-frasa temporal ayat ini.
- source_word: מִקַּדְמֵי אָרֶץ
  choice: sebelum bumi ada
  rationale: Frasa ini menyatakan keberadaan yang mendahului bumi. “Sebelum bumi ada” mengungkapkan maksud kosmisnya dengan jelas dan wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Kemungkinan pembacaan kristologis berlebihan atas Hikmat yang dipersonifikasikan
  choice: Menerjemahkan ucapan Hikmat sebagai penetapan sebelum penciptaan tanpa istilah mesianik atau Trinitarian yang eksplisit.
  alternative: Menerjemahkan נִסַּכְתִּי sebagai “aku telah diurapi,” yang dapat mendorong pembacaan mesianik.
  rationale: Walaupun tradisi Kristen dapat menghubungkan Amsal 8 dengan Sang Anak secara tipologis, terjemahan perlu mencerminkan arti sastra langsung teks Ibrani. Karena itu, pilihan kata tidak memasukkan muatan doktrinal yang tidak diwajibkan oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Susunan tiga frasa waktu dipertahankan, sedangkan frasa terakhir dibuat sedikit lebih eksplisit agar alami dan jelas bagi pembaca umum.
