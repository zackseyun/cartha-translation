  yaml_path: translation/ot/proverbs/008/012.yaml
  text: I[a], wisdom, dwell with prudence, and I find knowledge and discretion.
translation:
  language: id
  text: 'Aku, hikmat, tinggal bersama kecerdikan,

    dan aku menemukan pengetahuan tentang pertimbangan yang matang.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku, hikmat, telah tinggal bersama kecerdikan, dan aku menemukan pengetahuan tentang rencana-rencana.” Bentuk verba Ibrani dapat diterjemahkan “telah tinggal”; kata yang diterjemahkan “pertimbangan yang matang” juga dapat berarti “rencana-rencana”, “siasat-siasat”, atau “kebijaksanaan praktis”, bergantung pada konteks.
    reason: Alternatif aspek verba dan keluasan makna leksikal מְזִמּוֹת.
lexical_decisions:
- source_word: חָכְמָה
  choice: hikmat
  rationale: Kata ini berarti ‘hikmat’. Huruf kecil mempertahankan personifikasi puitis tanpa menjadikannya nama diri atau memasukkan identifikasi teologis yang tidak dinyatakan ayat ini.
- source_word: שָׁכַנְתִּי
  choice: tinggal
  rationale: Verba שׁכן berarti tinggal atau berdiam. Bentuk kini paling alami dalam tuturan personifikasi ini, sementara kemungkinan aspek perfektif dipertahankan dalam catatan kaki.
- source_word: עָרְמָה
  choice: kecerdikan
  rationale: Dalam konteks positif Amsal, kata ini menunjuk pada kecakapan praktis atau kelihaian yang bijak, bukan tipu daya. ‘Kecerdikan’ mempertahankan unsur ketajaman praktis tersebut.
- source_word: דַעַת
  choice: pengetahuan
  rationale: Padanan langsung yang menjaga perbedaannya dari ‘hikmat’.
- source_word: מְזִמּוֹת
  choice: pertimbangan yang matang
  rationale: Dalam konteks hikmat yang positif, bentuk jamak ini dapat mengacu pada pertimbangan, kebijaksanaan praktis, atau rencana. ‘Pertimbangan yang matang’ menyampaikan makna terpuji tanpa nuansa negatif ‘muslihat’.
- source_word: אֶמְצָא
  choice: aku menemukan
  rationale: Verba מצא pada dasarnya berarti ‘menemukan’. Padanan ini mempertahankan gambaran sederhana bahasa Ibrani tanpa mengubahnya menjadi ‘memiliki’ atau ‘memperoleh’.
- source_word: וְ
  choice: dan
  rationale: Konjungsi ini menghubungkan kedua klausa secara langsung dan mempertahankan kesejajaran puisinya.
theological_decisions:
- issue: Personifikasi hikmat
  choice: Menampilkan hikmat sebagai penutur yang dipersonifikasikan, dengan huruf kecil.
  alternative: Memakai ‘Hikmat’ sebagai nama diri atau menerjemahkannya dengan identifikasi kristologis.
  rationale: Amsal 8 menggunakan personifikasi puitis. Terjemahan perlu mempertahankan ciri sastra-teologis itu tanpa menetapkan identitas doktrinal yang tidak dinyatakan dalam ayat ini.
- issue: Hubungan דַעַת dengan מְזִמּוֹת
  choice: 'Menerjemahkannya sebagai hubungan genitif: ‘pengetahuan tentang pertimbangan yang matang’.'
  alternative: 'Memperlakukan keduanya sebagai dua unsur koordinatif: ‘pengetahuan dan pertimbangan yang matang’.'
  rationale: Tidak ada konjungsi di antara kedua nomina itu, dan bentuk דַעַת dapat berfungsi sebagai bentuk terikat. Karena itu, hubungan ‘pengetahuan tentang …’ lebih dekat dengan susunan Ibrani, sedangkan keluasan makna מְזִמּוֹת dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara sederhana. ‘Aku’ sesuai dengan tuturan personifikasi langsung; ‘kecerdikan’ dipakai dalam arti positif dan praktis. Pemenggalan dua baris mengikuti kesejajaran puisi Ibrani.
