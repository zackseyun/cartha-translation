id: PRO.8.15
reference: Proverbs 8:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בִּ֭/י מְלָכִ֣ים יִמְלֹ֑כוּ וְ֝/רוֹזְנִ֗ים יְחֹ֣קְקוּ צֶֽדֶק׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/015.yaml
  text: By me kings reign[b][a], and rulers decree justice.
translation:
  language: id
  text: Melalui aku[a] raja-raja memerintah, dan para penguasa[b] menetapkan apa yang adil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: Oleh aku.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: para pembesar atau bangsawan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: melalui aku
  rationale: Preposisi ב dengan pronomina orang pertama tunggal menyatakan sarana atau perantaraan dalam perkataan Hikmat. “Melalui aku” alami dalam bahasa Indonesia dan mempertahankan peran Hikmat sebagai sarana yang memungkinkan pemerintahan.
- source_word: מְלָכִים
  choice: raja-raja
  rationale: Padanan langsung dan lazim untuk bentuk jamak yang menunjuk para penguasa monarki.
- source_word: יִמְלֹכוּ
  choice: memerintah
  rationale: Kata kerja מלך berarti menjalankan kekuasaan sebagai raja. Dalam hubungan dengan “raja-raja”, “memerintah” menyampaikan makna itu secara jelas dan wajar.
- source_word: וְרֹזְנִים
  choice: dan para penguasa
  rationale: רֹזְנִים menunjuk para pejabat tinggi, pembesar, atau tokoh berwenang. “Para penguasa” mudah dipahami dan sesuai dengan kesejajaran terhadap “raja-raja”.
- source_word: יְחֹקְקוּ
  choice: menetapkan
  rationale: Dalam konteks pemerintahan, חקק berarti menetapkan, mengundangkan, atau mengeluarkan ketentuan yang berwenang. “Menetapkan” mempertahankan daya hukumnya tanpa memasukkan proses legislasi modern.
- source_word: צֶדֶק
  choice: apa yang adil
  rationale: צֶדֶק dapat berarti keadilan, kebenaran, atau hal yang benar. Sesudah “menetapkan”, frasa “apa yang adil” terdengar alami dan mempertahankan nuansa etis-yuridisnya.
theological_decisions:
- issue: Apakah ayat ini menyatakan bahwa Hikmat memungkinkan pelaksanaan kekuasaan tanpa mengesahkan secara moral semua tindakan setiap penguasa
  choice: Ayat ini menyatakan peran Hikmat dalam pemerintahan dan penetapan yang adil, tanpa menyiratkan bahwa setiap penguasa nyata selalu memerintah dengan adil.
  alternative: Membacanya sebagai pengesahan ilahi tanpa syarat atas semua kekuasaan politik atau sebagai pernyataan bahwa semua keputusan penguasa pasti adil.
  rationale: Dalam konteksnya, Hikmat yang dipersonifikasikan menyatakan perannya yang sangat penting dalam pemerintahan yang benar. Terjemahan mempertahankan hubungan positif antara Hikmat dan keadilan tanpa menyelesaikan ketegangan dengan melebih-lebihkan cakupan klaim tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan paralel sumber dipertahankan, sedangkan “apa yang adil” dipilih agar hubungan antara tindakan menetapkan dan צֶדֶק tetap jelas serta alami.
