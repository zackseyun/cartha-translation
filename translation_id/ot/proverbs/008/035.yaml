id: PRO.8.35
reference: Proverbs 8:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י מֹ֭צְאִ/י מצאי חַיִּ֑ים וַ/יָּ֥פֶק רָ֝צ֗וֹן מֵ/יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/035.yaml
  text: For whoever finds me finds life and obtains favor from Yahweh.
translation:
  language: id
  text: Sebab siapa yang menemukan aku, menemukan kehidupan dan memperoleh perkenanan dari Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Partikel ini memberikan alasan bagi nasihat sebelumnya; “Sebab” mempertahankan hubungan penjelas antarayat secara wajar.
- source_word: מֹצְאִי
  choice: siapa yang menemukan aku
  rationale: Bentuk ini menunjuk secara umum kepada orang yang menemukan Hikmat yang dipersonifikasikan. Ungkapan ini alami dalam bahasa Indonesia dan tidak membatasi rujukannya pada laki-laki.
- source_word: חַיִּים
  choice: kehidupan
  rationale: Walaupun berbentuk jamak dalam bahasa Ibrani, kata ini lazim dipakai secara idiomatis dengan arti “hidup/kehidupan”; “kehidupan” sesuai dengan gaya hikmat yang bermartabat.
- source_word: וַיָּפֶק
  choice: memperoleh
  rationale: Dalam konstruksi ini verba tersebut menyatakan mendapatkan atau memperoleh sesuatu, tanpa perlu menonjolkan arti harfiah “mengeluarkan”.
- source_word: רָצוֹן
  choice: perkenanan
  rationale: Kata ini di sini menunjuk pada penerimaan, kemurahan, atau perkenanan ilahi. “Perkenanan” mempertahankan nuansa relasional dan teologisnya.
- source_word: מֵיְהוָה
  choice: dari Yahweh
  rationale: Preposisi מִן menandai sumber perkenanan, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Bentuk tunggal generik dalam konteks Hikmat yang dipersonifikasikan
  choice: siapa yang menemukan aku
  alternative: orang yang menemukan aku; ia yang menemukan aku
  rationale: Pilihan ini mempertahankan cakupan umum bentuk Ibrani tanpa memberi kesan bahwa pernyataan hanya berlaku bagi laki-laki.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks menyebut Tetragramaton secara langsung; “Yahweh” mempertahankan nama ilahi itu sebagai nama diri dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pengulangan “menemukan” dipertahankan karena mencerminkan kesejajaran dan penekanan teks Ibrani. Pronomina “aku” merujuk kepada Hikmat yang dipersonifikasikan dalam konteks pasal ini.
