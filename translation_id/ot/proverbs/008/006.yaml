  yaml_path: translation/ot/proverbs/008/006.yaml
  text: Listen[a], for I will speak noble things[b], and the opening of my lips will be upright things.
translation:
  language: id
  text: Dengarkanlah, sebab aku akan menyampaikan hal-hal mulia[a], dan ketika bibirku terbuka, yang keluar adalah hal-hal yang benar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hal-hal luhur.” Kata Ibrani ini berkaitan dengan sesuatu yang bersifat bangsawan atau pangeran, sehingga di sini menunjuk pada perkataan yang bernilai tinggi.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “apa yang lurus.” Kata Ibrani ini menyatakan kelurusan atau ketulusan dalam arti moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Dengarkanlah
  rationale: Bentuk imperatif jamak dari שׁמע menyerukan agar para pendengar menyimak dengan sungguh-sungguh. “Dengarkanlah” alami dalam bahasa Indonesia modern dan tetap bernada khidmat.
- source_word: כִּי
  choice: sebab
  rationale: 'Di sini כִּי memperkenalkan alasan bagi perintah untuk mendengarkan: Hikmat akan segera berbicara. “Sebab” menyampaikan hubungan penjelas itu dengan ringkas.'
- source_word: נְגִידִים
  choice: hal-hal mulia
  rationale: Walaupun kata ini berkaitan dengan pemimpin atau bangsawan, dalam konteks puitis ini kata tersebut menunjuk pada perkataan yang bernilai tinggi dan bermartabat. “Hal-hal mulia” mempertahankan asosiasi keluhuran tanpa menafsirkannya sebagai orang-orang tertentu.
- source_word: אֲדַבֵּר
  choice: aku akan menyampaikan
  rationale: Imperfek orang pertama tunggal ini menyatakan ujaran yang segera disampaikan. “Menyampaikan” cocok dengan objek berupa hal-hal mulia dan terdengar lebih alami daripada konstruksi “berbicara hal-hal mulia”.
- source_word: וּמִפְתַּח שְׂפָתַי
  choice: dan ketika bibirku terbuka, yang keluar
  rationale: Ungkapan Ibrani secara harfiah berarti “dan terbukanya bibirku.” Rumusan ini mempertahankan citra bibir yang terbuka sambil mengungkapkan hubungan predikatif yang tersirat secara alami dalam bahasa Indonesia.
- source_word: מֵישָׁרִים
  choice: hal-hal yang benar
  rationale: Kata ini menunjuk pada kelurusan atau ketulusan dalam arti moral. “Hal-hal yang benar” jelas bagi pembaca modern dan tetap mempertahankan bentuk jamak substantival dalam paralel dengan “hal-hal mulia.”
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Citra puitis tentang bibir yang terbuka dipertahankan, sedangkan susunan klausa dibuat alami bagi pembaca umum. Kata ganti “aku” mengikuti tuturan langsung Hikmat dalam konteks pasal ini.
