source:
  edition: WLC
  text: יִֽרְאַ֣ת יְהוָה֮ שְֽׂנֹ֫את רָ֥ע גֵּ֘אָ֤ה וְ/גָא֨וֹן וְ/דֶ֣רֶךְ רָ֭ע וּ/פִ֨י תַהְפֻּכ֬וֹת שָׂנֵֽאתִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/013.yaml
  text: The fear of Yahweh is to hate evil[a]; pride and arrogance and the way of evil and a mouth of perversions I hate.
translation:
  language: id
  text: Takut akan TUHAN berarti membenci kejahatan. Aku membenci kesombongan, keangkuhan, jalan yang jahat, dan mulut yang mengucapkan hal-hal menyimpang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mulut penyimpangan-penyimpangan”; dapat juga diterjemahkan “mulut yang serong” atau “mulut yang berkata sesat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: takut akan TUHAN
  rationale: Frasa konstruksi ini menyatakan rasa takut penuh hormat yang tertuju kepada YHWH. Bentuk “TUHAN” mengikuti konvensi baku bahasa Indonesia untuk nama ilahi tersebut.
- source_word: שְׂנֹאת
  choice: berarti membenci
  rationale: Infinitif konstruktus berfungsi sebagai predikat. “Berarti membenci” mempertahankan daya verbalnya dan terdengar alami dalam bahasa Indonesia.
- source_word: רָע
  choice: kejahatan
  rationale: Konteksnya menunjuk pada keburukan moral, bukan kemalangan atau sesuatu yang sekadar tidak menyenangkan.
- source_word: גֵּאָה
  choice: kesombongan
  rationale: Nomina abstrak ini menunjuk pada sikap meninggikan diri.
- source_word: גָאוֹן
  choice: keangkuhan
  rationale: Dalam daftar sifat buruk ini, kata tersebut berarti keluhuran diri yang angkuh. “Keangkuhan” membedakannya dari גֵּאָה sambil mempertahankan tumpang tindih maknanya.
- source_word: דֶרֶךְ רָע
  choice: jalan yang jahat
  rationale: Ungkapan ini menggambarkan pola atau arah hidup yang dicirikan oleh kejahatan, sekaligus mempertahankan metafora jalan.
- source_word: פִי תַהְפֻּכוֹת
  choice: mulut yang mengucapkan hal-hal menyimpang
  rationale: Ungkapan harfiahnya adalah “mulut penyimpangan-penyimpangan/hal-hal yang serong.” Pilihan ini mempertahankan citra “mulut” dan menjelaskan bahwa yang dimaksud ialah perkataan yang bengkok atau menyimpang.
- source_word: שָׂנֵאתִי
  choice: Aku membenci
  rationale: Bentuk perfek orang pertama tunggal di sini menyatakan sikap yang tetap atau umum dalam tuturan Hikmat, sehingga wajar diterjemahkan dengan kala kini bahasa Indonesia.
theological_decisions:
- issue: Sudut pandang penutur dalam wacana Hikmat
  choice: Mempertahankan bentuk orang pertama “Aku membenci” tanpa mengidentifikasi penuturnya di dalam ayat.
  alternative: Menambahkan bahwa “Aku” adalah Hikmat yang dipersonifikasikan atau suara Allah.
  rationale: Teks Ibrani sendiri memakai orang pertama dalam konteks tuturan Hikmat. Menamai penutur secara eksplisit akan menyelesaikan ketegangan sastra-teologis yang dibiarkan terbuka oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan klausa kedua dibuat alami dalam bahasa Indonesia dengan menempatkan “Aku membenci” sebelum daftar objek, tanpa mengubah cakupan maknanya. Penanda catatan kaki ditempatkan pada frasa yang memang dijelaskannya.
