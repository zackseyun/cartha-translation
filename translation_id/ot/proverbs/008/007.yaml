source:
  edition: WLC
  text: כִּֽי אֱ֭מֶת יֶהְגֶּ֣ה חִכִּ֑/י וְ/תוֹעֲבַ֖ת שְׂפָתַ֣/י רֶֽשַׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/007.yaml
  text: For my mouth will utter truth[a], and wickedness is an abomination to my lips.
translation:
  language: id
  text: Sebab mulutku akan mengucapkan kebenaran[a], dan kefasikan adalah kekejian bagi bibirku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “langit-langit mulutku akan mengucapkan kebenaran.” Di sini “langit-langit mulut” dipakai sebagai kiasan untuk organ bicara.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menerangkan dasar bagi seruan Hikmat pada ayat sebelumnya; “sebab” mempertahankan hubungan penjelas tersebut secara alami.
- source_word: אֱמֶת
  choice: kebenaran
  rationale: Dalam konteks perkataan, kata ini menunjuk pada isi yang benar atau sifat benar dari ucapan; “kebenaran” ringkas dan sesuai dengan kontras etis dalam baris berikutnya.
- source_word: יֶהְגֶּה
  choice: akan mengucapkan
  rationale: Walaupun verba ini dapat berarti bergumam atau merenungkan, subjek berupa organ bicara dan objek “kebenaran” menunjukkan tindakan menyuarakan sesuatu.
- source_word: חִכִּי
  choice: mulutku
  rationale: Secara harfiah berarti “langit-langit mulutku,” tetapi di sini dipakai sebagai metonimia untuk organ bicara; “mulutku” menyampaikan maksudnya dengan jelas, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: וְתוֹעֲבַת
  choice: dan ... adalah kekejian
  rationale: Nomina ini menyatakan sesuatu yang sangat menjijikkan atau patut dibenci secara moral; “kekejian” mempertahankan daya moral dan ragam bahasa Alkitab yang bermartabat.
- source_word: שְׂפָתַי
  choice: bagi bibirku
  rationale: Ungkapan konstruksi ini menyatakan bahwa kefasikan menjijikkan bagi atau tidak dapat diterima oleh bibir Hikmat; “bagi bibirku” mempertahankan metafora tubuh Ibrani.
- source_word: רֶשַׁע
  choice: kefasikan
  rationale: Kata ini menunjuk pada kejahatan atau perilaku yang secara moral salah. “Kefasikan” cocok dengan kontras antara ucapan benar dan ucapan jahat serta mempertahankan bobot etisnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang modern, jelas, dan bermartabat. Paralelisme puitis dipertahankan melalui pasangan “mulutku” dan “bibirku,” sedangkan istilah moral “kebenaran,” “kefasikan,” dan “kekejian” mempertahankan kekuatan kontras teks Ibrani.
