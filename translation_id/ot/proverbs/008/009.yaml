source:
  edition: WLC
  text: כֻּלָּ֣/ם נְ֭כֹחִים לַ/מֵּבִ֑ין וִֽ֝/ישָׁרִ֗ים לְ/מֹ֣צְאֵי דָֽעַת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/009.yaml
  text: All of them are straightforward to the one who understands[a], and upright to those who find knowledge.
translation:
  language: id
  text: Semuanya lugas[a] bagi orang yang berpengertian, dan lurus bagi mereka yang menemukan pengetahuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jelas,” “langsung,” atau “benar.” Kata Ibrani menekankan bahwa perkataan hikmat itu lurus dan tidak bengkok bagi orang yang berpengertian.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Semuanya
  rationale: Kata ini merujuk kembali kepada perkataan-perkataan hikmat dalam konteks sebelumnya dan mempertahankan cakupan menyeluruh dari bentuk Ibrani.
- source_word: נְכֹחִים
  choice: lugas
  rationale: Kata sifat ini menggambarkan sesuatu yang lurus, langsung, atau jelas. Dalam konteks perkataan, “lugas” menyampaikan bahwa perkataan hikmat tidak bengkok atau menyesatkan.
- source_word: לַמֵּבִין
  choice: bagi orang yang berpengertian
  rationale: Preposisi ל menyatakan hubungan bagi/kepada, sedangkan partisipel בין menunjuk kepada orang yang memiliki pengertian atau daya membedakan.
- source_word: וִישָׁרִים
  choice: dan lurus
  rationale: יָשָׁר berarti lurus, benar, atau jujur. “Lurus” mempertahankan gambaran spasial-etis dalam paralelisme Ibrani.
- source_word: לְמֹצְאֵי
  choice: bagi mereka yang menemukan
  rationale: Partisipel ini secara aktif berarti orang-orang yang menemukan; terjemahan ini mempertahankan citra memperoleh sesuatu melalui penemuan.
- source_word: דָעַת
  choice: pengetahuan
  rationale: Padanan ini menjaga perbedaan leksikal dengan בין, yang diterjemahkan sebagai berpengertian pada baris sebelumnya.
theological_decisions: []
