  register: Bahasa Indonesia baku modern dengan susunan paralel yang ringkas dan bernada hikmat. “Lugas” dipilih agar alami bagi pembaca masa kini sekaligus mempertahankan gambaran perkataan yang langsung dan tidak bengkok.
