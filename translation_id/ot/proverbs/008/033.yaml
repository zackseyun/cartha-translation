id: PRO.8.33
reference: Proverbs 8:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שִׁמְע֖וּ מוּסָ֥ר וַ/חֲכָ֗מוּ וְ/אַל תִּפְרָֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/033.yaml
  text: Hear instruction and become wise[a], and do not neglect it.
translation:
  language: id
  text: Dengarkanlah didikan dan jadilah bijaksana; jangan mengabaikannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jangan melepaskannya” atau “jangan menolaknya.” Kata kerja Ibrani dapat berarti melepaskan, menolak, atau mengabaikan didikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Dengarkanlah
  rationale: Bentuk imperatif jamak dari שׁמע. Pilihan ini menyampaikan kegiatan mendengar dengan penuh perhatian, yang dapat mencakup ketaatan tanpa mempersempit artinya menjadi sekadar 'taatilah'.
- source_word: מוּסָר
  choice: didikan
  rationale: Dalam sastra hikmat, מוּסָר menunjuk pada pembentukan melalui pengajaran, koreksi, dan disiplin. 'Didikan' alami dalam bahasa Indonesia dan cukup luas untuk menampung unsur-unsur tersebut.
- source_word: וַחֲכָמוּ
  choice: dan jadilah bijaksana
  rationale: Imperatif jamak dari חכם. 'Jadilah bijaksana' mempertahankan daya perintah dan menggambarkan perolehan hikmat, bukan hanya keadaan sudah berhikmat.
- source_word: וְאַל תִּפְרָעוּ
  choice: jangan mengabaikannya
  rationale: Konstruksi larangan ini memakai פרע, yang dapat berarti membiarkan lepas, menolak, atau mengabaikan. Akhiran '-nya' merujuk secara alami kepada didikan yang baru disebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hikmat yang lugas dan bermartabat. Bentuk jamak pada perintah Ibrani tidak ditandai secara eksplisit karena verba bahasa Indonesia tidak membedakan jumlah; konteks sapaan tetap terbuka. Tanda titik koma mempertahankan hubungan erat sekaligus kontras antara perintah positif dan larangan.
