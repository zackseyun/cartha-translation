  source_fidelity: 'Teks Indonesia mengikuti tiga imperatif Ibrani dengan baik: שִׁמְעוּ diterjemahkan “Dengarkanlah,” מוּסָר sebagai “didikan,” וַחֲכָמוּ sebagai “jadilah bijaksana,” dan וְאַל תִּפְרָעוּ sebagai larangan untuk tidak mengabaikan didikan itu. Objek tersirat pada verba terakhir dinyatakan secara wajar oleh akhiran “-nya.”'
