  text: לִֽ/י עֵ֭צָה וְ/תוּשִׁיָּ֑ה אֲנִ֥י בִ֝ינָ֗ה לִ֣/י גְבוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/014.yaml
  text: Counsel and sound wisdom are mine[a]; I am understanding; strength is mine.
translation:
  language: id
  text: Nasihat dan kebijaksanaan yang andal adalah milikku[a]; akulah pengertian; kekuatan adalah milikku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Nasihat dan kebijaksanaan yang efektif adalah milikku; akulah wawasan; keperkasaan adalah milikku.”
    reason: Alternatif ini mencerminkan rentang makna תוּשִׁיָּה, בִּינָה, dan גְּבוּרָה.
lexical_decisions:
- source_word: עֵצָה
  choice: nasihat
  rationale: Dalam sastra hikmat, kata ini menunjuk pada nasihat atau pengarahan yang bijaksana, bukan sekadar saran biasa.
- source_word: תוּשִׁיָּה
  choice: kebijaksanaan yang tepat guna
  rationale: Kata ini mengandung gagasan kebijaksanaan yang kokoh sekaligus efektif dalam praktik; ungkapan ini mempertahankan unsur daya guna tanpa membatasinya pada keberhasilan materi.
- source_word: אֲנִי בִינָה
  choice: akulah pengertian
  rationale: Klausa tanpa verba ini mengidentifikasikan Hikmat dengan pengertian, bukan hanya menyatakan bahwa ia memilikinya. Bentuk 'akulah' mempertahankan tekanan predikatifnya.
- source_word: גְּבוּרָה
  choice: kekuatan
  rationale: Padanan ini mencakup tenaga, daya, atau keperkasaan tanpa memasukkan nuansa militer yang tidak wajib dalam konteks.
- source_word: לִי ... לִי
  choice: adalah milikku ... adalah milikku
  rationale: Pengulangan bentuk kepunyaan dalam bahasa Ibrani dipertahankan untuk menjaga penekanan dan kesejajaran puitis.
theological_decisions:
- issue: Personifikasi Hikmat
  choice: Mempertahankan ucapan orang pertama Hikmat sebagai personifikasi tanpa menambahkan identifikasi kristologis ke dalam terjemahan.
  alternative: Menjadikannya pernyataan kristologis langsung dalam teks terjemahan.
  rationale: Teks Ibrani menampilkan Hikmat sebagai sosok yang berbicara. Terjemahan perlu mempertahankan penyajian sastra-teologis itu tanpa menyelesaikan perdebatan penafsiran yang melampaui ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel dipertahankan; 'akulah' memberi tekanan alami pada identifikasi diri Hikmat.
