  text: Beside the gates[a], at the mouth of the city, at the entrance of the doorways[b], she cries out.
translation:
  language: id
  text: Di sisi gerbang-gerbang, di pintu masuk kota[a], di pintu-pintu masuk, ia berseru lantang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di mulut kota.” Secara harfiah, ungkapan Ibrani ini berarti “di mulut kota.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “ia memanggil dengan nyaring.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְיַד
  choice: di sisi
  rationale: Ungkapan dengan יָד menyatakan lokasi ‘di sisi’ atau ‘di dekat’; ‘di sisi’ ringkas dan mempertahankan gambaran ruang.
- source_word: שְׁעָרִים
  choice: gerbang-gerbang
  rationale: Bentuk jamak menunjuk pada gerbang-gerbang kota sebagai tempat umum untuk berkumpul dan menjalankan urusan masyarakat.
- source_word: לְפִי
  choice: di mulut
  rationale: Secara harfiah berarti ‘di mulut’. Ungkapan ini mempertahankan citra Ibrani dan tetap dapat dipahami sebagai bagian terbuka atau jalan masuk kota.
- source_word: קָרֶת
  choice: kota
  rationale: Kata ini berarti kota atau permukiman; ‘kota’ paling sesuai dengan latar gerbang perkotaan.
- source_word: מְבוֹא
  choice: jalan masuk
  rationale: Menunjuk pada tempat atau jalur untuk masuk. ‘Jalan masuk’ alami dalam bahasa Indonesia dan cocok dengan rangkaian keterangan tempat.
- source_word: פְתָחִים
  choice: pintu-pintu
  rationale: Bentuk jamak ini berarti bukaan, pintu, atau jalan masuk; ‘pintu-pintu’ mempertahankan gambaran konkret tanpa mengulang ‘jalan masuk’.
- source_word: תָּרֹנָּה
  choice: ia berseru lantang
  rationale: Bentuk feminin tunggal ini menggambarkan suara Hikmat yang terdengar dalam seruan terbuka. ‘Berseru lantang’ menyampaikan panggilan publik yang keras tanpa menentukan emosi secara berlebihan.
