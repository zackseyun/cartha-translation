  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pengulangan ‘gerbang-gerbang’ dan ‘pintu-pintu’ mempertahankan bentuk jamak serta susunan spasial teks Ibrani; ‘di mulut kota’ sengaja mempertahankan metafora sumber dan dijelaskan dalam catatan kaki.
