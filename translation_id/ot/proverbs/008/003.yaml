  naturalness: Perlu perbaikan ringan demi bahasa Indonesia modern yang jelas dan alami. “Di pintu masuk kota” menyampaikan makna Ibrani secara idiomatis, dengan harfiahnya dipertahankan dalam catatan kaki. “Di pintu-pintu masuk” lebih lancar daripada “di jalan masuk ke pintu-pintu.”
