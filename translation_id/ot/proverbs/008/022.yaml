id: PRO.8.22
reference: Proverbs 8:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְֽהוָ֗ה קָ֭נָ/נִי רֵאשִׁ֣ית דַּרְכּ֑/וֹ קֶ֖דֶם מִפְעָלָ֣י/ו מֵ/אָֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/022.yaml
  text: Yahweh possessed me at the beginning of his way[a], before his works of old.
translation:
  language: id
  text: Yahweh memiliki aku pada permulaan jalan-Nya,[a] sebelum karya-karya-Nya pada zaman dahulu kala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yahweh menciptakan aku” atau “Yahweh memperoleh aku.” Kata kerja Ibrani ini dapat memiliki lebih dari satu arti. Ayat ini berperan penting dalam perdebatan sepanjang sejarah mengenai Hikmat yang dipersonifikasikan dan hubungannya dengan Sang Anak.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama diri ilahi yang dinyatakan oleh Tetragramaton, bukan menggantinya dengan gelar.
- source_word: קָנָנִי
  choice: memiliki aku
  rationale: Kata kerja קנה dapat berarti memperoleh, memiliki, atau—dalam konteks tertentu—menciptakan. “Memiliki aku” mempertahankan pilihan leksikal yang kuat tanpa menetapkan makna “menciptakan”; kemungkinan lain dicatat dalam catatan kaki.
- source_word: רֵאשִׁית
  choice: permulaan
  rationale: Dalam rangkaian ini, kata tersebut paling wajar menyatakan awal secara temporal.
- source_word: דַּרְכּוֹ
  choice: jalan-Nya
  rationale: Menerjemahkan metafora Ibrani secara langsung dan tetap cukup luas untuk mencakup haluan atau kegiatan Yahweh tanpa mempersempit maknanya.
- source_word: קֶדֶם
  choice: sebelum
  rationale: Dalam konstruksi ini, kata tersebut menyatakan bahwa Hikmat mendahului karya-karya Yahweh secara temporal.
- source_word: מִפְעָלָיו
  choice: karya-karya-Nya
  rationale: Mengacu pada hal-hal yang dikerjakan atau dijadikan oleh Yahweh; bentuk jamak mempertahankan bentuk sumber.
- source_word: מֵאָז
  choice: pada zaman dahulu kala
  rationale: Mengungkapkan masa lampau yang amat jauh atau purbakala dalam bahasa Indonesia yang alami.
theological_decisions:
- issue: Makna קָנָנִי dalam ayat yang berperan penting dalam perdebatan kristologis
  choice: memiliki aku
  alternative: menciptakan aku; memperoleh aku; melahirkan aku
  rationale: Amsal 8 secara langsung menampilkan Hikmat yang dipersonifikasikan dan tidak secara langsung menyebut Sang Anak. Teks utama memilih makna leksikal yang kuat tanpa menyelesaikan perdebatan teologis kemudian; alternatif penting “menciptakan” dan “memperoleh” dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami tanpa menghilangkan metafora “jalan-Nya” atau ambiguitas utama pada קָנָנִי.
