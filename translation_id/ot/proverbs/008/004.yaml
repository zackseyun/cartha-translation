id: PRO.8.4
reference: Proverbs 8:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲלֵי/כֶ֣ם אִישִׁ֣ים אֶקְרָ֑א וְ֝/קוֹלִ֗/י אֶל בְּנֵ֥י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/004.yaml
  text: To you[a], O men, I call, and my voice is to the sons of mankind.
translation:
  language: id
  text: Kepada kalian, hai para pria, aku berseru; suaraku tertuju kepada anak-anak manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “umat manusia” atau “manusia.” Secara harfiah, bahasa Ibrani berbunyi “anak-anak manusia,” sebuah ungkapan umum untuk manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲלֵיכֶם
  choice: Kepada kalian
  rationale: Preposisi אֶל dengan akhiran orang kedua jamak menunjuk langsung kepada orang-orang yang disapa. “Kepada kalian” alami dalam bahasa Indonesia modern dan mempertahankan bentuk jamaknya.
- source_word: אִישִׁים
  choice: hai para pria
  rationale: Bentuk jamak אִישׁ menunjuk kepada laki-laki. Partikel “hai” menyatakan fungsi vokatif, sedangkan “para pria” mempertahankan unsur gender dalam teks sumber.
- source_word: אֶקְרָא
  choice: aku berseru
  rationale: Bentuk Qal imperfek orang pertama tunggal dari קרא menyatakan tindakan memanggil atau berseru kepada pendengar. “Berseru” cocok dengan suasana seruan Hikmat di hadapan umum.
- source_word: וְקוֹלִי
  choice: suaraku
  rationale: Nomina קוֹל dengan akhiran orang pertama tunggal secara langsung berarti “suaraku” dan mempertahankan paralelisme puitis.
- source_word: אֶל
  choice: tertuju kepada
  rationale: Preposisi ini menunjukkan arah. Dalam bahasa Indonesia, “suaraku tertuju kepada” lebih alami daripada konstruksi harfiah yang kaku, tanpa menghilangkan daya arahnya.
- source_word: בְּנֵי אָדָם
  choice: anak-anak manusia
  rationale: Ungkapan Ibrani ini secara harfiah berarti “anak-anak manusia” dan secara idiomatis merujuk kepada umat manusia. Terjemahan utama mempertahankan citra genealogis dan paralelisme sumber; makna idiomatis dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Bahasa antropologis bergender dalam paralelisme Ibrani
  choice: Mempertahankan “para pria” untuk אִישִׁים dan ungkapan formal “anak-anak manusia” untuk בְּנֵי אָדָם.
  alternative: “orang-orang ... umat manusia” atau “manusia ... semua orang”
  rationale: 'Kedua ungkapan sumber tidak identik: yang pertama secara gramatikal merujuk kepada laki-laki, sedangkan yang kedua merupakan ungkapan umum bagi manusia. Terjemahan tidak meratakan perbedaan itu, tetapi catatan kaki menerangkan cakupan idiomatis frasa kedua.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Aku” dipakai karena Hikmat berbicara sebagai tokoh puitis; tanda titik koma mempertahankan keseimbangan dua baris paralel.
