base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/029.yaml
  text: when he set a boundary for the sea[a], so that the waters would not transgress his command, when he marked out the foundations of the earth[b],
translation:
  language: id
  text: ketika Ia menetapkan batas bagi laut[a], supaya air tidak melanggar titah-Nya[b], ketika Ia menggariskan dasar-dasar bumi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketetapan-Nya bagi laut”; kata Ibrani חֻקּוֹ dapat menunjuk pada ketetapan atau batas tetap yang ditentukan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “mulut-Nya”, yaitu apa yang diperintahkan oleh mulut-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׂוּמוֹ
  choice: ketika Ia menetapkan
  rationale: Kata depan ב pada bentuk infinitif konstruk שׂוּם dengan akhiran pronominal menyatakan waktu dalam konteks ini. “Menetapkan” wajar dalam bahasa Indonesia untuk tindakan menentukan batas.
- source_word: לַיָּם חֻקּוֹ
  choice: batas bagi laut
  rationale: חֹק/חֻק dapat berarti ketetapan, batas tetap, atau batas yang ditentukan. Dalam gambaran penciptaan laut, “batas bagi laut” menyampaikan makna konkret tanpa menghilangkan nuansa penetapan ilahi.
- source_word: וּמַיִם לֹא יַעַבְרוּ
  choice: sehingga air tidak melampaui
  rationale: ו menghubungkan klausa yang secara kontekstual menyatakan hasil atau tujuan. עבר berarti melewati atau melampaui; pilihan ini sesuai baik dengan gambaran batas maupun dengan objek “titah-Nya”.
- source_word: פִּיו
  choice: titah-Nya
  rationale: Secara harfiah berarti “mulut-Nya”, tetapi di sini merupakan metonimia untuk perkataan atau perintah yang keluar dari mulut Allah. “Titah-Nya” alami, ringkas, dan sesuai dengan ragam bahasa yang luhur.
- source_word: בְּחוּקוֹ
  choice: ketika Ia menetapkan
  rationale: Bentuk infinitif konstruk חקק dengan ב kembali berfungsi temporal. Kata kerja ini dapat berarti mengukir, menetapkan, atau menentukan; “menetapkan” cocok dengan tindakan Allah menata dasar-dasar bumi.
- source_word: מוֹסְדֵי אָרֶץ
  choice: dasar-dasar bumi
  rationale: Terjemahan ini mempertahankan gambaran kosmologis konkret dari frasa konstruk Ibrani tersebut.
theological_decisions:
- issue: Gambaran penciptaan dalam perkataan Hikmat
  choice: Ayat diterjemahkan sebagai gambaran puitis tentang Allah yang menata ciptaan.
  alternative: Menjadikannya semata-mata gambaran abstrak tentang keteraturan, atau memasukkan kategori kristologis yang berasal dari perkembangan teologi kemudian.
  rationale: Teks Ibrani menggambarkan penetapan batas laut dan dasar-dasar bumi secara konkret. Terjemahan mempertahankan gambaran itu tanpa menyelesaikan perdebatan teologis yang tidak dinyatakan langsung oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “ketika Ia menetapkan” mempertahankan kesejajaran dua klausa Ibrani. “Air” dipakai sebagai nomina kolektif alami dalam bahasa Indonesia. Tanda koma akhir dipertahankan karena ayat ini berlanjut secara sintaksis dalam tuturan Hikmat.
