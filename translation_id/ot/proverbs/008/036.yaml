source:
  edition: WLC
  text: וְֽ֭/חֹטְאִ/י חֹמֵ֣ס נַפְשׁ֑/וֹ כָּל מְ֝שַׂנְאַ֗/י אָ֣הֲבוּ מָֽוֶת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/036.yaml
  text: But the one who sins against me wrongs his own soul[b][a]; all who hate me love death.
translation:
  language: id
  text: Namun, siapa yang berdosa terhadap aku[a] mencelakakan dirinya sendiri[b]; semua yang membenci aku mencintai maut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini juga dapat berarti “meleset dari aku” atau “gagal mendapatkan aku.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “melakukan kekerasan terhadap nyawa/hidupnya sendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחֹטְאִי
  choice: Namun, siapa yang berdosa terhadap aku
  rationale: Partisipel חטא dengan akhiran orang pertama berarti orang yang berbuat salah atau berdosa terhadap Hikmat. Terjemahan ini mempertahankan objek eksplisit “aku”; kemungkinan nuansa dasar “meleset” dicatat dalam catatan kaki.
- source_word: חֹמֵס
  choice: mencelakakan
  rationale: Bentuk partisipel dari חמס dapat menyatakan melakukan kekerasan, merugikan, atau mencederai. Dalam hubungan dengan נַפְשׁוֹ, “mencelakakan” menyampaikan akibat serius yang menimpa diri pelaku tanpa membatasinya pada kekerasan jasmani.
- source_word: נַפְשׁוֹ
  choice: dirinya sendiri
  rationale: נֶפֶשׁ dapat berarti nyawa, hidup, diri, atau pribadi. Dalam ungkapan ini, “dirinya sendiri” menyampaikan makna refleksif secara alami dan tidak memaksakan pembedaan teknis antara tubuh dan jiwa.
- source_word: כָּל מְשַׂנְאַי
  choice: semua yang membenci aku
  rationale: Mempertahankan cakupan universal כָּל dan akhiran orang pertama pada partisipel שׂנא dalam susunan Indonesia yang jelas.
- source_word: אָהֲבוּ
  choice: mencintai
  rationale: Walaupun bentuk Ibraninya perfektif, konteks amsal menyatakan kebenaran umum; kala kini generik tersampaikan secara alami tanpa penanda waktu tambahan.
- source_word: מָוֶת
  choice: maut
  rationale: “Maut” adalah padanan langsung yang ringkas dan bermartabat, serta mempertahankan pertentangan hikmat antara kehidupan dan kematian.
theological_decisions:
- issue: Makna antropologis נֶפֶשׁ dalam ungkapan mencelakakan diri
  choice: dirinya sendiri
  alternative: nyawanya sendiri; jiwanya sendiri
  rationale: Ayat ini menegaskan bahwa menolak Hikmat bersifat merusak diri. “Dirinya sendiri” menjaga cakupan נֶפֶשׁ tanpa menyiratkan antropologi tubuh-jiwa yang tidak diwajibkan oleh teks; bentuk yang lebih harfiah dicatat dalam catatan kaki.
- issue: Rentang makna חטא dengan Hikmat sebagai objek
  choice: berdosa terhadap aku
  alternative: meleset dari aku; gagal mendapatkan aku
  rationale: Dalam konstruksi ini, “berdosa terhadap aku” merupakan ungkapan Indonesia yang jelas dan sesuai dengan nilai moral חטא, sementara kemungkinan metaforis “meleset” tetap dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. “Namun” menandai pertentangan dengan ayat sebelumnya; “maut” dipilih untuk mempertahankan ketegasan dan kesejajaran puitis. Semua penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
