id: PRO.8.1
reference: Proverbs 8:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֲ/לֹֽא חָכְמָ֥ה תִקְרָ֑א וּ֝/תְבוּנָ֗ה תִּתֵּ֥ן קוֹלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/001.yaml
  text: Does not wisdom call[b][a], and understanding raise her voice?
translation:
  language: id
  text: Bukankah hikmat berseru[a], dan pengertian memperdengarkan suaranya[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memanggil.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “memberikan suaranya”; ungkapan Ibrani ini berarti bersuara atau berbicara lantang.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan jawaban ya, tanpa mengubahnya menjadi pernyataan seperti 'sungguh'.
- source_word: חָכְמָה
  choice: hikmat
  rationale: Padanan baku dan wajar dalam sastra hikmat Alkitab; konteks mempersonifikasikannya tanpa perlu memakai huruf kapital sebagai identifikasi teologis.
- source_word: תִקְרָא
  choice: berseru
  rationale: Qal קרא dapat berarti memanggil atau berseru. Dalam gambaran seruan terbuka dan paralel dengan memperdengarkan suara, 'berseru' terdengar alami; 'memanggil' tetap dicatat sebagai alternatif.
- source_word: וּתְבוּנָה
  choice: dan pengertian
  rationale: תבונה menunjuk pada pengertian, kecakapan memahami, atau daya membedakan. 'Pengertian' merupakan padanan langsung dan serasi dengan 'hikmat'.
- source_word: תִּתֵּן קוֹלָהּ
  choice: memperdengarkan suaranya
  rationale: Ungkapan itu secara harfiah berarti 'memberikan suaranya'. Dalam bahasa Indonesia, 'memperdengarkan suaranya' mempertahankan citra bersuara dan personifikasi secara alami tanpa harus menyiratkan bahwa volume suara meningkat.
theological_decisions:
- issue: Personifikasi hikmat dan pengertian
  choice: Mempertahankan personifikasi melalui tindakan berseru dan memperdengarkan suara, sambil menulis 'hikmat' dan 'pengertian' sebagai nomina abstrak biasa.
  alternative: Menggunakan huruf kapital ('Hikmat') atau menafsirkannya secara eksplisit sebagai pribadi ilahi tertentu.
  rationale: Bentuk feminin Ibrani dan konteks sastra mendukung personifikasi sebagai perempuan, tetapi bahasa Indonesia tidak memiliki pronomina feminin untuk benda. Tindakan dan bentuk posesif '-nya' cukup mempertahankan personifikasi tanpa memasukkan identifikasi teologis yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada sastra yang mudah dipahami. Susunan pertanyaan retoris dan kesejajaran kedua klausa dipertahankan. Semua penanda catatan kaki ditempatkan langsung dalam teks utama.
