  yaml_path: translation/ot/proverbs/008/032.yaml
  text: And now[a], sons, listen to me; blessed are those who keep my ways.
translation:
  language: id
  text: Dan sekarang, hai anak-anak lelaki[a], dengarkanlah aku; berbahagialah mereka yang memegang teguh jalan-jalanku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak-anak.” Bahasa Ibrani memakai bentuk jamak maskulin, “anak-anak lelaki,” yang lazim dalam pengajaran hikmat, meskipun seruan ini berlaku secara luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Dan sekarang
  rationale: Gabungan konjungsi dan keterangan waktu menandai peralihan sekaligus seruan baru; “Dan sekarang” mempertahankan kesinambungan wacana.
- source_word: בָנִים
  choice: anak-anak lelaki
  rationale: Bentuk Ibrani ini adalah jamak maskulin dan lazim dipakai untuk menyapa murid dalam sastra hikmat. Pilihan ini mempertahankan bentuk sapaan sumber tanpa menambahkan kata “-ku” yang tidak tersurat.
- source_word: שִׁמְעוּ לִי
  choice: dengarkanlah aku
  rationale: Ungkapan ini menyerukan kegiatan mendengar dengan penuh perhatian kepada sang pembicara. “Dengarkanlah aku” alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi sekadar “taatilah aku”.
- source_word: וְאַשְׁרֵי
  choice: berbahagialah mereka
  rationale: אַשְׁרֵי menyatakan keadaan yang patut disebut sejahtera atau berbahagia. “Berbahagialah mereka” mempertahankan corak ucapan bahagia dan register Alkitab yang wajar.
- source_word: דְּרָכַי
  choice: jalan-jalanku
  rationale: Bentuk jamak דֶּרֶךְ dalam sastra hikmat menunjuk pada cara hidup atau arah perilaku; “jalan-jalanku” mempertahankan metafora sumber.
- source_word: יִשְׁמֹרוּ
  choice: memelihara
  rationale: שׁמר dapat berarti menjaga, memelihara, atau menaati. Dalam konteks ajaran Hikmat, “memelihara” mencakup perhatian yang sungguh-sungguh dan pelaksanaan praktis.
theological_decisions:
- issue: Sapaan bergender dalam pengajaran hikmat
  choice: anak-anak lelaki
  alternative: anak-anak
  rationale: Teks utama mempertahankan bentuk jamak maskulin dari bahasa Ibrani dan latar sapaan pedagogisnya. Alternatif yang lebih inklusif dicatat karena nasihat ini luas penerapannya dan tidak harus dipahami hanya berlaku bagi laki-laki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan sumber dipertahankan secara formal, sedangkan metafora “jalan-jalanku” dan bentuk ucapan bahagia dijaga agar nuansa sastra hikmat tetap terdengar.
