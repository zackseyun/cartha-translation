  text: I walk in the way of righteousness[a], in the midst of the paths of justice,
translation:
  language: id
  text: Aku berjalan di jalan kebenaran[a], di tengah jalur-jalur keadilan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "di jalan keadilan ... di antara jalur-jalur penghakiman." Istilah Ibrani צְדָקָה dan מִשְׁפָּט memiliki cakupan makna yang bertumpang tindih, tetapi teks utama mempertahankan pembedaan puitis antara "kebenaran" dan "keadilan".
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֹרַח
  choice: di jalan
  rationale: אֹרַח berarti jalan, jalur, atau arah hidup. Frasa 'di jalan' mempertahankan gambaran gerak dalam suatu pola hidup bermoral dan terdengar alami dalam sastra hikmat Indonesia.
- source_word: צְדָקָה
  choice: kebenaran
  rationale: צְדָקָה dapat berarti kebenaran atau keadilan. 'Kebenaran' di sini menyatakan perilaku yang benar dan mempertahankan pembedaan puitis dengan מִשְׁפָּט, meskipun cakupan kedua istilah itu bertumpang tindih.
- source_word: אֲהַלֵּךְ
  choice: Aku berjalan
  rationale: Bentuk dari הלך menggambarkan gerak atau perilaku yang berlangsung. 'Aku berjalan' mempertahankan metafora perjalanan yang khas dalam sastra hikmat dan suara orang pertama dari Hikmat.
- source_word: בְּתוֹךְ
  choice: di tengah
  rationale: תּוֹךְ menunjuk bagian tengah atau bagian dalam. 'Di tengah' mempertahankan citra ruang dan kesejajaran dengan baris pertama.
- source_word: נְתִיבוֹת
  choice: lorong-lorong
  rationale: נְתִיבוֹת adalah bentuk jamak bagi jalur atau jalan setapak. 'Lorong-lorong' mempertahankan bentuk jamak dan memberi variasi puitis yang wajar terhadap אֹרַח tanpa menghilangkan metafora jalan.
- source_word: מִשְׁפָּט
  choice: keadilan
  rationale: מִשְׁפָּט dapat berarti keadilan, penghakiman, atau keputusan hukum. Dalam pasangan etis ini, 'keadilan' paling alami dan mempertahankan nuansa sosial-yudisialnya.
