translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang sederhana dan bermartabat. Paralelisme dua baris dipertahankan; elipsis verba pada baris kedua diperjelas dengan mengulangi 'lebih baik' agar mudah dipahami.
