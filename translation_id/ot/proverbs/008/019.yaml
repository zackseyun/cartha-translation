  text: My fruit is better than gold[a], even fine gold, and my yield than choice silver.
translation:
  language: id
  text: 'Buahku lebih baik daripada emas[a], bahkan daripada emas murni,

    dan hasilku lebih baik daripada perak pilihan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani untuk logam berharga membedakan חָרוּץ, “emas,” dari פָּז, “emas yang sangat baik atau murni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב ... מִן
  choice: lebih baik daripada
  rationale: Adjektiva טוֹב yang diikuti מִן menyatakan perbandingan; pengulangan 'lebih baik' pada baris kedua membuat hubungan perbandingan jelas dan alami dalam bahasa Indonesia.
- source_word: פִּרְיִי
  choice: buahku
  rationale: פְּרִי berarti buah atau hasil; 'buahku' mempertahankan metafora tentang apa yang dihasilkan hikmat.
- source_word: מֵחָרוּץ
  choice: daripada emas
  rationale: חָרוּץ dalam sastra hikmat menunjuk pada emas secara umum. Terjemahan 'emas' mempertahankan pembedaan dengan פָּז yang menyusul.
- source_word: וּמִפָּז
  choice: bahkan emas murni
  rationale: פָּז menunjuk pada emas yang sangat baik atau murni; 'bahkan' menyampaikan peningkatan penekanan setelah penyebutan emas secara umum.
- source_word: וּתְבוּאָתִי
  choice: dan hasilku
  rationale: תְּבוּאָה dapat berarti hasil bumi, hasil, atau pendapatan. 'Hasilku' alami dalam bahasa Indonesia serta tetap sejajar dengan metafora 'buahku'.
- source_word: מִכֶּסֶף נִבְחָר
  choice: daripada perak pilihan
  rationale: נִבְחָר secara harfiah berarti 'yang dipilih' dan dalam konteks ini menunjukkan mutu tinggi; 'perak pilihan' ringkas dan mempertahankan nuansa tersebut.
