  variant: modern standard Indonesian
source:
  edition: WLC
  text: וָֽ/אֶהְיֶ֥ה אֶצְל֗/וֹ אָ֫מ֥וֹן וָֽ/אֶהְיֶ֣ה שַׁ֭עֲשֻׁעִים י֤וֹם י֑וֹם מְשַׂחֶ֖קֶת לְ/פָנָ֣י/ו בְּ/כָל עֵֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/030.yaml
  text: Then I was beside him[a], like a master workman; and I was his delight day after day, rejoicing before him at all times[b],
translation:
  language: id
  text: Lalu aku ada di sisi-Nya[a] seperti seorang pekerja ahli; aku adalah kesenangan-Nya hari demi hari, bersukacita di hadapan-Nya setiap saat[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seperti anak kecil” (atau “sebagai seorang yang setia”); arti kata Ibrani yang diterjemahkan “pekerja ahli” tidak pasti.
    reason: alternative_reading
  - marker: b
    text: Atau, “bermain-main di hadapan-Nya setiap saat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה
  choice: aku berada / aku menjadi
  rationale: Bentuk wayyiqtol dari היה melanjutkan gambaran masa lampau. Dalam klausa lokasi, 'aku berada' paling alami; dengan nomina kesenangan, 'aku menjadi' lebih wajar dalam bahasa Indonesia.
- source_word: אֶצְלוֹ
  choice: di sisi-Nya
  rationale: אצל menyatakan kedekatan atau keberadaan bersama seseorang; 'di sisi-Nya' mempertahankan nuansa relasional-spasial tanpa menafsirkannya lebih jauh.
- source_word: אָמֹון
  choice: seperti seorang ahli pembangun
  rationale: Kata ini sangat sulit dan diperdebatkan. Dalam konteks penciptaan, pengertian seorang pekerja ahli masuk akal, tetapi kemungkinan 'anak kecil' atau 'yang setia' tetap dicatat dalam catatan kaki.
- source_word: שַׁעֲשֻׁעִים
  choice: kesenangan-Nya
  rationale: Nomina ini berarti kesenangan atau sesuatu yang menjadi kesukaan. Kepemilikan oleh Allah tersirat dari konteks dan dinyatakan secara alami dalam bahasa Indonesia.
- source_word: יוֹם יוֹם
  choice: hari demi hari
  rationale: Pengulangan kata 'hari' menyatakan keberulangan dan kesinambungan.
- source_word: מְשַׂחֶקֶת
  choice: bersukacita
  rationale: Partisipel שׂחק dapat berarti bermain, tertawa, atau bergembira. 'Bersukacita' sesuai dengan ragam puisi yang luhur, sedangkan arti lebih harfiah 'bermain-main' dipertahankan dalam catatan kaki.
- source_word: לְפָנָיו
  choice: di hadapan-Nya
  rationale: Ungkapan ini menyatakan keberadaan dalam hadirat seseorang; 'di hadapan-Nya' ringkas dan transparan.
- source_word: בְּכָל עֵת
  choice: setiap saat
  rationale: Frasa ini menyatakan waktu yang menyeluruh atau terus-menerus; 'setiap saat' alami dalam bahasa Indonesia.
theological_decisions:
- issue: Peran Hikmat dalam penciptaan yang tersirat oleh אָמוֹן
  choice: Menerjemahkan Hikmat sebagai 'seperti seorang ahli pembangun' dalam teks utama sambil mempertahankan alternatif dalam catatan kaki.
  alternative: seperti anak kecil; sebagai seorang yang setia
  rationale: Kata Ibrani ini ambigu secara leksikal dan tidak seharusnya dipakai untuk menetapkan klaim kristologis atau metafisis tertentu melalui terjemahan. Pilihan utama cocok dengan konteks penciptaan, tetapi ketidakpastian asli tetap dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab Indonesia. Tanda koma akhir dipertahankan karena ayat ini berlanjut secara sintaktis ke ayat berikutnya.
