id: PRO.8.34
reference: Proverbs 8:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַ֥שְֽׁרֵי אָדָם֮ שֹׁמֵ֪עַֽ֫ לִ֥/י לִ/שְׁקֹ֣ד עַל דַּ֭לְתֹתַ/י י֤וֹם י֑וֹם לִ֝/שְׁמֹ֗ר מְזוּזֹ֥ת פְּתָחָֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/034.yaml
  text: Blessed is the man who listens to me[a], watching at my doors day by day, keeping watch at the doorposts of my entrances.
translation:
  language: id
  text: Berbahagialah orang[a] yang mendengarkan aku, tekun menunggu di depan pintu-pintuku hari demi hari, dan berjaga di tiang-tiang pintu masukku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “orang” berbentuk tunggal dan dipakai secara generik, yaitu menunjuk kepada siapa pun yang mendengarkan Hikmat.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Ungkapan ini menyatakan keadaan diberkati dan sejahtera dalam bentuk ucapan bahagia; “Berbahagialah” mempertahankan bentuk sastra hikmat yang alami dalam bahasa Indonesia.
- source_word: אָדָם
  choice: orang
  rationale: Kata benda tunggal ini dipakai secara generik untuk siapa pun yang mendengarkan Hikmat. “Orang” mempertahankan ketunggalan tanpa membatasi maknanya hanya pada laki-laki.
- source_word: שֹׁמֵעַ לִי
  choice: yang mendengarkan aku
  rationale: Bentuk partisipial dengan ל menggambarkan sikap mendengar yang terus-menerus dan penuh perhatian. Terjemahan ini mempertahankan citra mendengar tanpa mempersempitnya menjadi “menaati”, meskipun ketaatan tersirat.
- source_word: לִשְׁקֹד עַל דַּלְתֹתַי
  choice: tekun menunggu di depan pintu-pintuku
  rationale: שׁקד mengandung nuansa berjaga dengan rajin dan penuh harap. Dalam gambaran seseorang yang hadir di pintu Hikmat, “tekun menunggu” menyampaikan kewaspadaan sekaligus kesungguhan, sedangkan “di depan” mengungkapkan posisi orang itu secara alami.
- source_word: יוֹם יוֹם
  choice: hari demi hari
  rationale: Pengulangan kata “hari” menekankan keteraturan yang berkelanjutan; “hari demi hari” mempertahankan daya iteratif itu.
- source_word: לִשְׁמֹר
  choice: berjaga
  rationale: Kata ini berarti menjaga, mengawasi, atau berjaga. Dalam konteks menanti di kediaman Hikmat, “berjaga” mempertahankan gambaran perhatian yang terus-menerus tanpa harus menyiratkan perlindungan dari serangan.
- source_word: מְזוּזֹת פְּתָחָי
  choice: tiang-tiang pintu masukku
  rationale: מְזוּזוֹת menunjuk pada tiang atau kusen pintu, sedangkan פְּתָחַי berbentuk jamak dan berarti bukaan atau jalan masuk. Frasa ini mempertahankan citra arsitektural dan nuansa jamaknya secara wajar.
theological_decisions:
- issue: Pemakaian tunggal generik אָדָם dalam ucapan bahagia hikmat
  choice: orang
  alternative: laki-laki; seseorang
  rationale: Dalam konteks ini אָדָם menunjuk secara representatif kepada setiap manusia yang mendengarkan Hikmat, bukan hanya laki-laki. “Orang” merupakan bentuk tunggal yang alami, akurat, dan inklusif dalam bahasa Indonesia; catatan kaki menjelaskan daya generiknya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan tiga tindakan—mendengarkan, tekun menunggu, dan berjaga—mempertahankan gerak paralel teks Ibrani, sementara sapaan “aku” mempertahankan personifikasi Hikmat dalam konteks pasal ini.
