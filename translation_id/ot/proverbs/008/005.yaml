  yaml_path: translation/ot/proverbs/008/005.yaml
  text: Learn prudence[a], you simple ones; and learn understanding, you fools.
translation:
  language: id
  text: Hai orang-orang yang tak berpengalaman, perolehlah kecerdikan; hai orang-orang bebal, perolehlah pengertian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “pahamilah hati”. Dalam ungkapan Ibrani, “hati” dapat menunjuk pada pusat pemahaman, pertimbangan, dan penilaian.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִינוּ
  choice: milikilah
  rationale: Bentuk imperatif jamak dari בין secara dasar berarti memahami atau memperoleh pengertian. Dalam kedua klausa, “milikilah” mengungkapkan seruan untuk memperoleh sifat yang disebutkan dan mempertahankan pengulangan Ibrani secara alami dalam bahasa Indonesia.
- source_word: פְתָאיִם
  choice: orang-orang yang tak berpengalaman
  rationale: Dalam kitab Amsal, istilah ini menunjuk kepada orang yang belum matang, mudah dipengaruhi, atau naif, bukan kepada orang yang memiliki keterbatasan intelektual.
- source_word: עָרְמָה
  choice: kecerdikan
  rationale: Dalam konteks hikmat yang positif, kata ini berarti kecakapan menilai dan bertindak dengan cermat. “Kecerdikan” mempertahankan nuansa ketajaman praktis tanpa harus menyiratkan tipu daya.
- source_word: וּכְסִילִים
  choice: hai orang-orang bebal
  rationale: כסיל adalah sebutan khas dalam sastra hikmat bagi orang yang keras kepala dan menolak hikmat. “Bebal” mempertahankan dimensi moral tersebut dan bentuk sapaan langsung.
- source_word: לֵב
  choice: hati yang berpengertian
  rationale: Secara harfiah berarti “hati”, tetapi dalam pemikiran Ibrani hati juga menjadi pusat pemahaman, pertimbangan, dan penilaian. Ungkapan ini mempertahankan gambaran sumber sekaligus menjelaskan fungsinya.
theological_decisions: []
translation_notes:
  register: Bahasa sapaan dibuat langsung dan bermartabat. “Tak berpengalaman” dipilih agar kategori פתי tidak disalahartikan sebagai keterbatasan kecerdasan, sedangkan “bebal” mempertahankan teguran moral yang lebih kuat pada כסיל.
