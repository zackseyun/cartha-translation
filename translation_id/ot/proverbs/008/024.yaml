source:
  edition: WLC
  text: בְּ/אֵין תְּהֹמ֥וֹת חוֹלָ֑לְתִּי בְּ/אֵ֥ין מַ֝עְיָנ֗וֹת נִכְבַּדֵּי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/024.yaml
  text: When there were no depths[a], I was brought forth, when there were no springs abounding with water.
translation:
  language: id
  text: Ketika samudra raya belum ada, aku dilahirkan[a]; ketika mata-mata air yang sarat air belum ada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “aku dihasilkan” atau “aku dibentuk.” Kata Ibrani ini dapat membangkitkan gambaran kelahiran.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵין
  choice: ketika ... belum ada
  rationale: Ungkapan ini menyatakan keadaan waktu dalam dua baris sejajar. Pilihan ini alami dalam bahasa Indonesia dan tidak mempertegasnya menjadi “sebelum” secara berlebihan.
- source_word: תְּהֹמוֹת
  choice: samudra raya
  rationale: Kata Ibrani ini menunjuk pada perairan dalam atau samudra purba. “Samudra raya” mempertahankan gambaran kosmis tanpa memasukkan unsur mitologis yang tidak dinyatakan secara eksplisit.
- source_word: חוֹלָלְתִּי
  choice: aku dilahirkan
  rationale: Bentuk pasif ini memakai gambaran kelahiran atau proses menghasilkan. “Dilahirkan” jelas dan wajar dalam bahasa Indonesia, sambil mempertahankan metafora tentang Hikmat yang dipersonifikasikan.
- source_word: מַעְיָנוֹת
  choice: mata-mata air
  rationale: Kata ini menunjuk pada sumber air alami. Bentuk ulang menyampaikan jamak Ibrani dengan wajar.
- source_word: נִכְבַּדֵּי מָיִם
  choice: yang sarat air
  rationale: Secara konkret ungkapan ini menggambarkan mata air yang berat atau penuh dengan air. “Sarat air” mempertahankan citra tersebut secara ringkas dan puitis.
theological_decisions:
- issue: Bahasa tentang asal-usul Hikmat dalam Amsal 8
  choice: aku dilahirkan
  alternative: aku dihasilkan; aku dibentuk
  rationale: Teks puitis memakai gambaran kelahiran bagi Hikmat yang dipersonifikasikan. Pilihan ini mempertahankan metafora tersebut tanpa menarik kesimpulan kristologis atau dogmatis yang tidak dinyatakan oleh ayat ini sendiri.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis yang tetap mudah dipahami. Titik koma menandai kesejajaran kedua baris. Kata ganti “aku” mengikuti personifikasi Hikmat dalam konteks.
