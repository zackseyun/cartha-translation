  text: I love those who love me[a], and those who seek me diligently find me.
translation:
  language: id
  text: Aku mengasihi orang-orang yang mengasihi aku, dan orang-orang yang mencari aku dengan sungguh-sungguh menemukan aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mereka yang mencari aku sejak dini menemukan aku.” Kata kerja Ibrani ini dapat berarti mencari sejak dini dan, dalam arti yang diperluas, mencari dengan tekun atau sungguh-sungguh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Aku
  rationale: Kata ganti orang pertama tunggal dinyatakan secara eksplisit pada awal klausa untuk mempertahankan penekanan bahasa Ibrani dan suara Hikmat yang dipersonifikasikan.
- source_word: אֹהֲבַי / אהבי/ה
  choice: orang-orang yang mengasihi aku
  rationale: Partisip dengan akhiran orang pertama tunggal berfungsi sebagai nomina, secara harfiah berarti mereka yang mengasihi aku. Klausa relatif ini alami dalam bahasa Indonesia dan tidak menambahkan tafsiran lain.
- source_word: אֵהָב
  choice: Aku mengasihi
  rationale: Bentuk imperfek dapat menyatakan kebiasaan, kebenaran umum, atau masa depan. Dalam konteks pepatah dan paralelisme ayat ini, bentuk kini generik paling tepat.
- source_word: מְשַׁחֲרַי
  choice: orang-orang yang mencari aku dengan sungguh-sungguh
  rationale: Partisip Piel dari שׁחר dapat berarti mencari sejak dini dan, secara idiomatis, mencari dengan tekun atau sungguh-sungguh. Pilihan ini menyampaikan daya idiomatisnya secara alami; arti temporal yang lebih harfiah dipertahankan dalam catatan kaki.
- source_word: יִמְצָאֻנְנִי
  choice: akan menemukan aku
  rationale: Imperfek orang ketiga jamak dengan akhiran orang pertama tunggal. Bentuk 'akan menemukan' alami dalam bahasa Indonesia setelah klausa partisipial dan mempertahankan nuansa hasil atau kepastian tanpa harus membatasi pernyataan pada satu masa depan tertentu.
theological_decisions:
- issue: Bahasa timbal balik tentang kasih Hikmat
  choice: Menyajikannya sebagai prinsip umum bahwa Hikmat mengasihi mereka yang mengasihinya dan dapat ditemukan oleh mereka yang sungguh-sungguh mencarinya.
  alternative: Menafsirkannya secara langsung sebagai pernyataan tentang pemilihan keselamatan, keberpihakan perjanjian, atau kristologi.
  rationale: Dalam Amsal 8, Hikmat berbicara melalui personifikasi puitis. Terjemahan mempertahankan bentuk sastra dan ketegangan teologis itu tanpa memasukkan klaim doktrinal yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Kata ganti “aku” dipakai untuk mempertahankan suara langsung personifikasi Hikmat; pengulangan “aku” menjaga kesejajaran dan kejelasan referen.
