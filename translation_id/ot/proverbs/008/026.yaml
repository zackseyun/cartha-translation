  text: עַד לֹ֣א עָ֭שָׂה אֶ֣רֶץ וְ/חוּצ֑וֹת וְ֝/רֹ֗אשׁ עָפְר֥וֹת תֵּבֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/026.yaml
  text: before he had made the earth and the fields[b][a], or the first of the dust of the world.
translation:
  language: id
  text: sebelum Ia menjadikan bumi, tanah lapang,[a] dan debu dunia yang pertama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat-tempat terbuka.” Dalam konteks perkotaan, חוּצוֹת dapat berarti “jalan-jalan,” tetapi konteks penciptaan di sini lebih mendukung arti kawasan terbuka atau tanah lapang.
    reason: lexical_alternative
  - marker: b
    text: Atau “permulaan debu dunia.” Ungkapan Ibraninya padat dan agak tidak lazim; kemungkinan menunjuk pada debu atau tanah yang paling awal.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד לֹא
  choice: sebelum
  rationale: Dalam konstruksi temporal ini, ungkapan tersebut secara idiomatis menyatakan waktu sebelum suatu tindakan terjadi.
- source_word: עָשָׂה
  choice: menjadikan
  rationale: Kata kerja umum untuk ‘membuat/melakukan’; ‘menjadikan’ alami dalam konteks penciptaan tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: אֶרֶץ
  choice: bumi
  rationale: Konteks penciptaan dan kesejajarannya dengan תֵּבֵל mendukung cakupan global, bukan ‘tanah’ setempat.
- source_word: חוּצוֹת
  choice: tanah-tanah lapang
  rationale: Bentuk jamak ini menunjuk tempat-tempat terbuka; konteks penciptaan tidak mendukung arti perkotaan ‘jalan-jalan’.
- source_word: רֹאשׁ
  choice: yang pertama
  rationale: Dalam rangkaian dengan עָפְרוֹת, kata ini paling mungkin menyatakan bagian yang mula-mula atau paling awal.
- source_word: עָפְרוֹת
  choice: debu tanah
  rationale: Bentuk jamak dari עפר dipahami secara kolektif sebagai debu atau tanah kering; ‘debu tanah’ mempertahankan citra material sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: תֵּבֵל
  choice: dunia
  rationale: Kata ini menunjuk dunia sebagai tatanan kosmis, sering kali dunia yang didiami; ‘dunia’ ringkas dan sesuai konteks.
theological_decisions:
- issue: Hubungan unsur terakhir dengan dua unsur sebelumnya di bawah עַד לֹא
  choice: ataupun
  alternative: dan
  rationale: Walaupun teks memakai konjungsi וְ, seluruh daftar berada dalam cakupan ‘sebelum/belum’; ‘ataupun’ secara alami mengoordinasikan unsur terakhir dalam lingkungan negatif-temporal tanpa mengubahnya menjadi pilihan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan bentuk temporal ayat serta kepadatan ungkapan Ibrani terakhir, sementara ‘tanah-tanah lapang’ menghindari kesan jalan perkotaan.
