  text: כִּֽי טוֹבָ֣ה חָ֭כְמָה מִ/פְּנִינִ֑ים וְ/כָל חֲ֝פָצִ֗ים לֹ֣א יִֽשְׁווּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/011.yaml
  text: For wisdom is better than jewels[a], and all desirable things cannot compare with her.
translation:
  language: id
  text: Sebab hikmat lebih baik daripada permata[a], dan segala sesuatu yang diinginkan tidak dapat menyamainya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mutiara” atau “batu delima”; istilah Ibrani ini merujuk secara umum pada benda atau batu berharga.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan atau dasar bagi ajakan sebelumnya dan mempertahankan hubungan antarkalimat secara alami.
- source_word: טוֹבָה חָכְמָה
  choice: hikmat lebih baik
  rationale: Adjektiva טוֹבָה bersama preposisi perbandingan מִן menyatakan makna komparatif; 'hikmat' adalah padanan baku dan sesuai dengan personifikasinya dalam pasal ini.
- source_word: מִפְּנִינִים
  choice: daripada permata
  rationale: פְּנִינִים menunjuk pada benda atau batu berharga, tetapi jenis tepatnya tidak pasti; 'permata' mempertahankan cakupan umum tanpa mempersempitnya menjadi mutiara atau batu delima.
- source_word: וְכָל חֲפָצִים
  choice: dan segala sesuatu yang diinginkan
  rationale: Mencakup semua hal yang menjadi objek keinginan; frasa ini alami dalam bahasa Indonesia dan tidak membatasinya hanya pada kesenangan atau barang tertentu.
- source_word: לֹא יִשְׁווּ בָהּ
  choice: tidak dapat menyamainya
  rationale: Verba שׁוה dengan ב menyatakan kesetaraan atau keterbandingan. Akhiran feminin tunggal tercermin melalui '-nya', yang dalam konteks merujuk kepada Hikmat yang dipersonifikasikan.
theological_decisions:
- issue: Personifikasi hikmat
  choice: Mempertahankan rujukan personal melalui konteks dan akhiran '-nya'
  alternative: Mengungkapkannya secara nonpersonal sebagai 'hal itu' atau mengulang 'hikmat'
  rationale: Akhiran בָהּ berbentuk feminin tunggal dan Amsal 8 secara konsisten menggambarkan Hikmat sebagai seorang perempuan. Bahasa Indonesia tidak memiliki pronomina orang ketiga bergender, sehingga '-nya' mempertahankan rujukannya tanpa menambahkan klaim doktrinal.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Sebab' mempertahankan hubungan logis dengan ayat sebelumnya; 'menyamainya' menyampaikan perbandingan dengan ringkas dan alami. Penanda catatan kaki [a] dicantumkan langsung setelah 'permata'.
