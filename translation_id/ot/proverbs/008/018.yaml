id: PRO.8.18
reference: Proverbs 8:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עֹֽשֶׁר וְ/כָב֥וֹד אִתִּ֑/י ה֥וֹן עָ֝תֵ֗ק וּ/צְדָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/018.yaml
  text: Riches and honor are with me[b][a], enduring wealth and righteousness.
translation:
  language: id
  text: 'Kekayaan dan kehormatan ada padaku,

    harta yang bertahan lama[a] dan kebenaran.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “harta yang tetap”; kata sifat Ibraninya juga dapat menyiratkan harta yang kukuh atau bernilai besar.
    reason: lexical_alternative
  - marker: b
    text: Atau “keadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׁר
  choice: kekayaan
  rationale: Menunjukkan kelimpahan materi. “Kekayaan” alami dalam bahasa Indonesia dan berpasangan dengan “kehormatan” dalam baris puitis ini.
- source_word: כָבוֹד
  choice: kehormatan
  rationale: Dalam sastra hikmat, kata ini di sini paling wajar menunjuk pada martabat atau penghargaan sosial, bukan secara khusus kemuliaan ilahi.
- source_word: אִתִּי
  choice: ada padaku
  rationale: Ungkapan ini menyatakan bahwa kekayaan dan kehormatan berada bersama Hikmat atau menjadi miliknya. “Ada padaku” mempertahankan personifikasi dan terdengar wajar dalam bahasa Indonesia.
- source_word: הוֹן
  choice: harta
  rationale: Menunjuk pada milik atau kekayaan. “Harta” membedakannya dari עֹשֶׁר yang diterjemahkan “kekayaan”, sambil mempertahankan kesejajaran maknanya.
- source_word: עָתֵק
  choice: yang bertahan lama
  rationale: Dalam kaitannya dengan harta, kata sifat ini paling mungkin menyatakan sifat tahan lama atau tetap, meskipun dapat pula mengandung nuansa harta yang kukuh atau bernilai besar.
- source_word: צְדָקָה
  choice: kebenaran
  rationale: Kata ini mencakup kelurusan moral dan dapat pula berarti keadilan. “Kebenaran” mempertahankan cakupan moral yang luas, sedangkan “keadilan” dicatat sebagai alternatif.
theological_decisions:
- issue: Cakupan makna צְדָקָה dalam konteks hikmat yang bermuatan moral
  choice: kebenaran
  alternative: keadilan
  rationale: Konteksnya tidak secara khusus bersifat hukum atau pengadilan. “Kebenaran” dipilih untuk menyatakan kelurusan moral secara luas, tetapi kemungkinan makna “keadilan” tetap dipertahankan dalam catatan kaki agar ketegangan semantis teks Ibrani tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis dua baris. Diksi dibuat lugas dan bermartabat; pengulangan semantis antara “kekayaan” dan “harta” dipertahankan tanpa memakai kata Indonesia yang sama.
