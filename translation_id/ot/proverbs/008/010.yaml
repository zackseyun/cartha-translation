translation:
  language: id
  text: Terimalah didikanku alih-alih perak, dan pengetahuan alih-alih emas pilihan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, “dan bukan/jangan perak.” Dalam konteks ini, bentuk Ibraninya menyatakan pilihan: didikan hikmat perlu diutamakan daripada perak.'
    reason: lexical_alternative
  - marker: b
    text: “Emas pilihan” dapat juga diterjemahkan “emas murni” atau “emas terpilih.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ
  choice: Terimalah
  rationale: Bentuk imperatif jamak dari לקח. Dalam konteks ajakan hikmat, “terimalah” secara alami menyampaikan tindakan menyambut dan menjadikan didikan itu milik sendiri.
- source_word: מוּסָרִי
  choice: didikanku
  rationale: מוּסָר mencakup pengajaran yang membentuk, menegur, dan mendisiplinkan. “Didikan” mempertahankan nuansa pembentukan itu serta sejajar dengan “pengetahuan”.
- source_word: וְאַל כָּסֶף
  choice: bukan perak
  rationale: 'Secara bentuk, frasa ini berarti “dan jangan/bukan perak,” tetapi dalam susunan puitis setelah imperatif menyatakan pilihan: didikan harus dipilih alih-alih perak. Terjemahan ringkas ini mempertahankan bentuk kontras Ibrani; maknanya dijelaskan dalam catatan.'
- source_word: דַעַת
  choice: pengetahuan
  rationale: Padanan langsung dan lazim bagi דַעַת dalam sastra hikmat, menunjuk pada pengetahuan yang lahir dari hikmat, bukan sekadar informasi.
- source_word: מֵחָרוּץ
  choice: daripada emas
  rationale: חָרוּץ di sini menunjuk pada emas yang bernilai tinggi. Preposisi מִן menyatakan perbandingan, sehingga “daripada” mempertahankan struktur perbandingan tersebut.
- source_word: נִבְחָר
  choice: pilihan
  rationale: Partisip pasif dari בחר berarti “yang dipilih.” Sebagai keterangan bagi emas, “pilihan” secara wajar menyatakan emas terpilih atau bermutu tinggi tanpa mengubahnya menjadi superlatif.
