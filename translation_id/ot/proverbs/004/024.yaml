  text: Put away crookedness of mouth from you[a], and put devious lips far from you.
translation:
  language: id
  text: Singkirkanlah dari dirimu perkataan yang bengkok[a], dan jauhkanlah darimu bibir yang menyimpang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "mulut yang bengkok" dan "bibir yang menyimpang." Kedua nomina Ibrani itu menggambarkan ucapan yang secara moral menyimpang atau diputarbalikkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵר
  choice: Jauhkanlah
  rationale: Imperatif kausatif ini menuntut tindakan sengaja untuk menyingkirkan sesuatu; pilihan ini juga berpadu alami dengan frasa pemisahan מִמְּךָ.
- source_word: מִמְּךָ
  choice: dari dirimu
  rationale: Preposisi dengan sufiks orang kedua tunggal menyatakan pemisahan dari orang yang dinasihati dan menekankan tanggung jawab pribadinya.
- source_word: עִקְּשׁוּת פֶּה
  choice: perkataan yang bengkok
  rationale: עִקְּשׁוּת menyatakan kebengkokan atau penyimpangan moral, sedangkan פֶּה secara harfiah berarti 'mulut' tetapi secara metonimis menunjuk pada perkataan. Ungkapan ini mempertahankan metafora kebengkokan dalam bahasa Indonesia yang wajar.
- source_word: וּלְזוּת
  choice: yang menyimpang
  rationale: Nomina ini menunjuk pada penyimpangan atau kepalsuan dalam ujaran. Bentuk ini alami sebagai keterangan bagi 'bibir' dan tetap sejajar secara makna dengan 'bengkok' pada klausa pertama.
- source_word: שְׂפָתַיִם
  choice: bibir
  rationale: Terjemahan harfiah mempertahankan citraan tubuh dan paralelisme puitis dengan perkataan atau mulut pada klausa pertama.
- source_word: הַרְחֵק
  choice: singkirkanlah jauh-jauh
  rationale: Imperatif kausatif berarti membuat sesuatu menjadi jauh. 'Singkirkanlah jauh-jauh' menyampaikan tindakan aktif sekaligus intensifikasi jarak.
- source_word: מִמֶּךָ
  choice: darimu
  rationale: Menandai pemisahan dari orang yang dinasihati; bentuk ringkas ini lancar setelah 'jauh-jauh'.
