  text: בְּ/אֹ֣רַח רְ֭שָׁעִים אַל תָּבֹ֑א וְ/אַל תְּ֝אַשֵּׁ֗ר בְּ/דֶ֣רֶךְ רָעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/014.yaml
  text: Do not enter the path of the wicked[a], and do not walk in the way of evil men.
translation:
  language: id
  text: Jangan memasuki jalur orang fasik, dan jangan menempuh[a] jalan orang jahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jangan maju di jalan orang jahat” atau “jangan berjalan lurus di jalan orang jahat.” Verba Ibrani dapat berarti maju, melangkah maju, atau berjalan lurus.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרַח
  choice: jalur
  rationale: Kata ini menunjuk pada jalur atau lintasan, dan secara kiasan pada pola hidup. “Jalur” mempertahankan metafora perjalanan sekaligus membedakannya dari דֶּרֶךְ pada baris kedua.
- source_word: רְשָׁעִים
  choice: orang fasik
  rationale: Bentuk substantival jamak ini menunjuk secara umum kepada orang yang hidup dalam kefasikan. “Orang fasik” merupakan ungkapan Indonesia yang ringkas dan sesuai dengan konteks hikmat.
- source_word: אַל תָּבֹא
  choice: jangan memasuki
  rationale: Dengan frasa בְּאֹרַח, verba בוא menyatakan masuk ke atau mulai menempuh suatu jalur. “Jangan memasuki” menyampaikan larangan itu secara alami.
- source_word: תְּאַשֵּׁר
  choice: jangan terus melangkah
  rationale: Dalam bentuk Piel, verba אשר dapat berarti terus maju, berjalan lurus, atau melanjutkan perjalanan. “Terus melangkah” mempertahankan gambaran perjalanan moral tanpa membatasi maknanya pada gerak kaki secara harfiah.
- source_word: דֶּרֶךְ
  choice: jalan
  rationale: Kata ini lazim berarti jalan dan secara metaforis cara atau pola hidup. “Jalan” alami dalam bahasa Indonesia dan tetap konkret.
- source_word: רָעִים
  choice: orang jahat
  rationale: Adjektiva substantival jamak ini menunjuk kepada orang-orang yang jahat. Bahasa Indonesia tidak menandai gender gramatikal, sehingga “orang jahat” menyampaikan rujukan personal dan kolektif tanpa menambahkan jenis kelamin yang tidak perlu.
theological_decisions:
- issue: Penerjemahan bentuk maskulin jamak רָעִים
  choice: orang jahat
  alternative: laki-laki jahat
  rationale: Bentuk Ibrani secara gramatikal maskulin jamak, tetapi dalam konteks peribahasa berfungsi sebagai sebutan umum bagi golongan orang jahat. Karena bahasa Indonesia tidak memiliki gender gramatikal pada kata “orang”, terjemahan ini menjaga cakupan umum teks dan tidak mempersempitnya hanya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada nasihat yang tegas. Paralelisme Ibrani dipertahankan melalui pasangan “jalur” dan “jalan”; “fasik” dan “jahat” membedakan dua istilah sumber tanpa mengubah kesejajarannya.
