  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שִׁמְע֣וּ בָ֭נִים מ֣וּסַר אָ֑ב וְ֝/הַקְשִׁ֗יבוּ לָ/דַ֥עַת בִּינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/001.yaml
  text: Hear[a], sons, a father's instruction, and pay attention to know understanding.
translation:
  language: id
  text: Dengarkanlah, hai anak-anak lelaki[a], didikan seorang ayah, dan perhatikanlah untuk memperoleh pengertian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak-anak.” Teks Ibrani secara harfiah berbunyi “anak-anak lelaki,” sesuai dengan bingkai pengajaran ayah kepada anak lelaki yang lazim dalam Amsal.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Dengarlah
  rationale: Imperatif jamak ini menyerukan pendengaran yang penuh perhatian. “Dengarlah” ringkas, wajar, dan mempertahankan ungkapan khas sastra hikmat.
- source_word: בָנִים
  choice: anak-anak lelaki
  rationale: Nomina jamak maskulin ini secara harfiah berarti “anak-anak lelaki” dan mempertahankan bingkai pengajaran ayah kepada anak lelaki dalam Amsal; kemungkinan cakupan yang lebih luas dicatat dalam catatan kaki.
- source_word: מוּסַר
  choice: didikan
  rationale: Dalam sastra hikmat, istilah ini mencakup pengajaran, pembentukan, disiplin, dan koreksi. “Didikan” secara alami memadukan unsur pengajaran dan pembentukan.
- source_word: אָב
  choice: seorang ayah
  rationale: Frasa konstruksi Ibrani tidak menyatakan ayah tertentu. “Seorang ayah” mempertahankan ketakrifan yang tidak ditentukan tanpa memasukkan arti “ayahku”.
- source_word: וְהַקְשִׁיבוּ
  choice: dan perhatikanlah
  rationale: Imperatif ini menuntut perhatian terarah dan lebih kuat daripada sekadar mendengar; “perhatikanlah” juga membedakannya dari imperatif pertama.
- source_word: לָדַעַת
  choice: supaya kalian memperoleh
  rationale: Infinitif dengan ל dapat menyatakan tujuan. Dalam bahasa Indonesia, “supaya kalian memperoleh” menyampaikan tujuan secara alami dan menghindari frasa kaku “untuk mengetahui pengertian”.
- source_word: בִּינָה
  choice: pengertian
  rationale: Istilah hikmat utama ini menunjuk pada pemahaman atau kemampuan membedakan. “Pengertian” merupakan padanan luas dan baku dalam konteks didaktis.
theological_decisions:
- issue: Sapaan bergender dalam pengajaran hikmat
  choice: anak-anak lelaki
  alternative: anak-anak
  rationale: Teks Ibrani memakai bentuk jamak maskulin dan mempertahankan bingkai ayah kepada anak lelaki. Terjemahan utama menjaga bentuk tersebut tanpa menyangkal kemungkinan penerapan ajaran yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Partikel “hai” mempertahankan sapaan langsung yang jelas; “kalian” memperjelas bahwa kedua imperatif ditujukan kepada kelompok. Susunan akhir dibuat alami dalam bahasa Indonesia sambil mempertahankan hubungan tujuan pada לָדַעַת.
