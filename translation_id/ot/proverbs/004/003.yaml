  text: For I was a son to my father[b][a], tender and an only child before my mother.
translation:
  language: id
  text: Sebab dahulu aku adalah seorang anak laki-laki bagi ayahku, lembut dan satu-satunya bagi ibuku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di hadapan ibuku”; ungkapan ini menyatakan kedudukanku dalam hubungan dengan ibuku. Kata Ibrani yang diterjemahkan “satu-satunya” juga dapat berarti “anak tunggal,” “yang unik,” atau, dalam konteks tertentu, “yang terkasih.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas ayat ini sebagai dasar bagi nasihat sang ayah dalam konteks sekitarnya.
- source_word: בֵן הָיִיתִי לְאָבִי
  choice: dahulu aku adalah anak bagi ayahku
  rationale: Menjaga acuan khusus kepada anak laki-laki yang tersirat dalam בֵן sekaligus mempertahankan konstruksi relasional dengan לְאָבִי dalam bahasa Indonesia yang tetap dapat dipahami.
- source_word: רַךְ
  choice: masih muda
  rationale: Dalam konteks masa kanak-kanak, רַךְ menyatakan kemudaan dan kerentanan. 'Masih muda' lebih alami daripada 'lembut' dalam bahasa Indonesia tanpa menghilangkan gagasan usia belia.
- source_word: וְיָחִיד
  choice: dan anak satu-satunya
  rationale: יָחִיד dapat berarti satu-satunya, tunggal, atau unik. 'Anak satu-satunya' paling sesuai dengan hubungan kepada ibu dalam konteks ini, sementara kemungkinan makna lain dicatat dalam catatan kaki.
- source_word: לִפְנֵי אִמִּי
  choice: bagi ibuku
  rationale: Secara harfiah berarti 'di hadapan ibuku', tetapi di sini ungkapan itu menyatakan kedudukan relasional. 'Bagi ibuku' menyampaikan maksud tersebut secara alami dalam bahasa Indonesia.
