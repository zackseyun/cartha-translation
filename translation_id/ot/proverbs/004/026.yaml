  text: Level the path of your feet[a], and all your ways will be established.
translation:
  language: id
  text: Ratakanlah jalan bagi kakimu[a], dan segala jalanmu akan menjadi mantap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Pertimbangkanlah lintasan kakimu”; kata kerja Ibrani ini juga dapat berarti menimbang atau mempertimbangkan dengan cermat.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּלֵּס
  choice: Ratakanlah
  rationale: Bentuk imperatif Piel dari פלס dapat berarti membuat rata atau meratakan, dan juga dapat berkaitan dengan menimbang atau mempertimbangkan. Dalam gambaran tentang jalan, “Ratakanlah” mempertahankan metafora konkret sambil tetap menyiratkan pengarahan hidup yang cermat.
- source_word: מַעְגַּל
  choice: jalan
  rationale: Kata ini menunjuk pada jalur atau lintasan dan dalam sastra hikmat juga menggambarkan arah hidup. “Jalan” alami dalam bahasa Indonesia serta mempertahankan makna harfiah dan kiasannya.
- source_word: רַגְלֶךָ
  choice: bagi kakimu
  rationale: Ungkapan ini mempertahankan gambaran tubuh yang sedang berjalan. Bentuk tunggal kolektif dalam bahasa Ibrani wajar diungkapkan dengan “kakimu” dalam bahasa Indonesia.
- source_word: וְכָל
  choice: dan segala
  rationale: Kata penghubung Ibrani secara langsung mengoordinasikan klausa kedua tanpa harus menambahkan hubungan akibat yang lebih tegas seperti “maka”.
- source_word: דְּרָכֶיךָ
  choice: jalanmu
  rationale: Bentuk jamak דֶּרֶךְ sering merujuk pada jalan-jalan atau seluruh cara hidup seseorang. “Segala jalanmu” menyampaikan cakupan jamak melalui kata “segala” dan cocok dengan metafora moral ayat ini.
- source_word: יִכֹּנוּ
  choice: akan teguh
  rationale: Bentuk Nifal dari כון berarti menjadi mantap, kokoh, atau teguh. “Akan teguh” menyampaikan hasil berupa kestabilan tanpa memperjelas pelaku yang tidak disebutkan dalam teks.
