  yaml_path: translation/ot/proverbs/004/022.yaml
  text: For they are life to those who find them[a], and healing to all their flesh.
translation:
  language: id
  text: Sebab, semua itu adalah kehidupan bagi orang yang menemukannya dan kesembuhan bagi seluruh tubuhnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kesembuhan bagi seluruh dagingnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi nasihat pada ayat sebelumnya; “sebab” menyatakan hubungan penjelas itu secara wajar.
- source_word: חַיִּים הֵם
  choice: semuanya itu adalah kehidupan
  rationale: Bentuk jamak חַיִּים secara idiomatis menyatakan gagasan tunggal “kehidupan”. Kata “semuanya itu” merujuk kembali kepada perkataan atau ajaran yang disebut dalam konteks.
- source_word: לְמֹצְאֵיהֶם
  choice: bagi orang yang menemukannya
  rationale: Partisip dengan akhiran pronominal menunjuk kepada orang yang menemukan perkataan-perkataan tersebut. Bentuk tunggal generik dalam bahasa Indonesia juga selaras dengan akhiran tunggal pada בְּשָׂרוֹ di klausa berikutnya.
- source_word: בְּשָׂרוֹ
  choice: seluruh tubuhnya
  rationale: בָּשָׂר secara harfiah berarti “daging”, tetapi di sini menunjuk kepada keberadaan jasmani seseorang. “Tubuhnya” menyampaikan makna kontekstual dengan alami, sedangkan akhiran -nya mempertahankan acuan kepada orang generik tersebut.
- source_word: מַרְפֵּא
  choice: kesembuhan
  rationale: Nomina ini berarti kesembuhan, pemulihan, atau kesehatan. “Kesembuhan” mempertahankan nuansa hasil pemulihan tanpa mengartikannya sebagai obat konkret.
theological_decisions:
- issue: Akhiran maskulin tunggal dalam ungkapan amsal yang bersifat generik
  choice: orang yang menemukannya ... seluruh tubuhnya
  alternative: mereka yang menemukannya ... seluruh tubuh mereka
  rationale: Bahasa Ibrani beralih dari bentuk partisip jamak kepada akhiran tunggal maskulin yang mewakili setiap orang secara individual. Bentuk tunggal generik Indonesia mempertahankan hubungan itu tanpa menambahkan penandaan gender yang tidak diperlukan oleh tata bahasa Indonesia.
- issue: Terjemahan harfiah atau kontekstual בָּשָׂר
  choice: tubuh
  alternative: daging
  rationale: Walaupun arti leksikal dasarnya ialah “daging”, dalam ungkapan “seluruh dagingnya” kata itu mencakup keseluruhan tubuh jasmani. “Tubuh” lebih alami dan jelas dalam bahasa Indonesia modern, sementara alternatif harfiah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur sebab-akibat serta kesejajaran kedua klausa dipertahankan, dengan ungkapan yang tetap mudah dipahami pembaca umum.
