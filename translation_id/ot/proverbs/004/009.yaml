lexical_decisions:
- source_word: תִּתֵּן
  choice: ia akan mengenakan
  rationale: Bentuk Qal imperfek orang ketiga feminin tunggal; subjeknya adalah hikmat yang dipersonifikasikan. Dalam konteks perhiasan pada kepala, 'mengenakan' mengungkapkan tindakan menaruh dengan wajar.
- source_word: לְרֹאשְׁךָ
  choice: pada kepalamu
  rationale: Preposisi ל dalam konteks perhiasan kepala paling alami diterjemahkan 'pada' dalam bahasa Indonesia.
- source_word: לִוְיַת
  choice: rangkaian bunga
  rationale: Nomina ini menunjuk pada karangan atau rangkaian hiasan yang dikenakan di kepala. 'Rangkaian bunga' jelas bagi pembaca modern dan mempertahankan citra konkretnya.
- source_word: חֵן
  choice: yang anggun
  rationale: Kata ini dapat berarti keelokan, pesona, kemurahan, atau perkenanan. Dalam konstruksi dengan hiasan kepala, 'yang anggun' menyampaikan daya tarik ornamental secara alami.
- source_word: עֲטֶרֶת
  choice: mahkota
  rationale: Padanan umum dan mudah dipahami untuk hiasan kepala kerajaan atau kehormatan dalam paralelisme ayat ini.
- source_word: תִּפְאֶרֶת
  choice: yang indah
  rationale: Kata ini dapat menyatakan keindahan, semarak, kemuliaan, atau kehormatan. Dalam citra perhiasan, 'yang indah' paling alami tanpa menutup alternatif 'kemegahan'.
- source_word: תְּמַגְּנֶךָּ
  choice: ia akan menganugerahkan kepadamu
  rationale: Bentuk Piel imperfek orang ketiga feminin tunggal dengan akhiran orang kedua maskulin tunggal, dalam arti menyerahkan atau memberikan. 'Menganugerahkan' sesuai dengan pemberian mahkota dan register puitis; bukan bermakna 'melindungi' dalam paralel ini.
