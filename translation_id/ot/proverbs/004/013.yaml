  text: הַחֲזֵ֣ק בַּ/מּוּסָ֣ר אַל תֶּ֑רֶף נִ֝צְּרֶ֗/הָ כִּי הִ֥יא חַיֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/013.yaml
  text: Hold fast to instruction; do not let go. Guard her[a], for she is your life.
translation:
  language: id
  text: Peganglah teguh didikan[a]; jangan lepaskan. Jagalah dia, karena dialah hidupmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “disiplin” atau “koreksi”. Kata Ibrani musar mencakup pengajaran yang membentuk watak serta latihan disipliner.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזֵק
  choice: Peganglah teguh
  rationale: Bentuk imperatif ini menyerukan pegangan atau keterikatan yang kuat. Pilihan ini mempertahankan metafora memegang sekaligus daya desaknya.
- source_word: בַּמּוּסָר
  choice: didikan
  rationale: Dalam Amsal, מוּסָר mencakup pengajaran yang membentuk watak, termasuk disiplin dan koreksi. “Didikan” menyampaikan cakupan itu secara alami dalam bahasa Indonesia.
- source_word: אַל תֶּרֶף
  choice: jangan lepaskan
  rationale: Kata kerja רפה di sini berarti mengendurkan atau melepaskan pegangan. Terjemahan ini melanjutkan metafora pada klausa sebelumnya.
- source_word: נִצְּרֶהָ
  choice: Jagalah dia
  rationale: נצר berarti menjaga, memelihara, atau melindungi. “Dia” mempertahankan personifikasi yang tampak dalam sufiks feminin Ibrani dan diteruskan dalam klausa berikutnya.
- source_word: כִּי הִיא
  choice: karena dialah
  rationale: Pronomina feminin itu merujuk kembali kepada didikan yang dipersonifikasikan. Bentuk “dialah” juga mempertahankan penegasan bahwa didikan itu merupakan hidup si pendengar.
- source_word: חַיֶּיךָ
  choice: hidupmu
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, חַיִּים lazim berarti “hidup” secara menyeluruh. Bentuk tunggal paling wajar dalam bahasa Indonesia.
