  text: Prize her highly[a], and she will exalt you[b]; she will honor you when you embrace her.
translation:
  language: id
  text: Hargailah dia[a], maka ia akan meninggikan engkau; ia akan menghormatimu ketika engkau memeluknya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sayangilah dia” atau “Tinggikanlah dia.” Kata kerja Ibrani pada awal ayat ini jarang dipakai dan dapat mengandung arti menghargai, menyayangi, atau meninggikan hikmat.'
    reason: lexical_alternative
  - marker: b
    text: 'Kata Ibrani yang diterjemahkan “ketika” juga dapat dipahami sebagai “karena”: “ia akan menghormatimu karena engkau memeluknya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַלְסְלֶהָ
  choice: Junjunglah dia
  rationale: Kata kerja yang langka ini dapat menunjuk pada tindakan menghargai, menyayangi, atau meninggikan. “Junjunglah” mempertahankan gagasan memberi nilai dan kedudukan tinggi kepada hikmat, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: וּתְרוֹמְמֶךָ
  choice: maka dia akan meninggikan engkau
  rationale: Bentuk dari רומם berarti mengangkat atau meninggikan. Subjek feminin tunggal merujuk kepada hikmat yang dipersonifikasikan sebagai perempuan.
- source_word: תְּכַבֵּדְךָ
  choice: dia akan menghormati engkau
  rationale: Bentuk piel dari כבד di sini menyatakan pemberian kehormatan. “Menghormati” alami dan tidak melebihkan maknanya menjadi pemuliaan ilahi.
- source_word: כִּי
  choice: karena
  rationale: Makna kausal yang lazim, “karena”, dipertahankan agar hubungan sintaksis Ibrani tidak diam-diam diubah menjadi hubungan waktu.
- source_word: תְחַבְּקֶנָּה
  choice: engkau memeluknya
  rationale: Kata חבק berarti memeluk. Pilihan ini mempertahankan gambaran hikmat sebagai perempuan yang dipeluk erat.
