  text: וְ/אֹ֣רַח צַ֭דִּיקִים כְּ/א֣וֹר נֹ֑גַהּ הוֹלֵ֥ךְ וָ֝/א֗וֹר עַד נְכ֥וֹן הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/018.yaml
  text: But the path of the righteous is like the light of dawn[b][a], going on and shining until the day is fully established.
translation:
  language: id
  text: Namun, jalan orang-orang benar seperti cahaya fajar[a], yang semakin lama semakin terang[b] hingga hari terang sepenuhnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “cahaya yang cemerlang.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “yang terus berjalan dan bercahaya.”'
    reason: literal_rendering
lexical_decisions:
- source_word: וְ/אֹרַח
  choice: Namun, jalan
  rationale: אֹרַח berarti ‘jalan’ atau ‘lintasan’. Konjungsi וְ secara dasar berarti ‘dan’, tetapi konteksnya mempertentangkan jalan orang benar dengan jalan orang fasik pada ayat sebelumnya, sehingga ‘namun’ menyatakan hubungan wacana itu secara wajar.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Bentuk jamak substantival ini menunjuk kepada orang yang benar secara moral. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kategori etis dalam Amsal.
- source_word: כְּ/אוֹר נֹגַהּ
  choice: seperti cahaya fajar
  rationale: כְּ menandai perbandingan, אוֹר berarti ‘cahaya’, dan נֹגַהּ berarti ‘kecemerlangan/sinar terang’. Dalam gambaran yang berkembang menuju siang penuh, ‘cahaya fajar’ menyampaikan citra tersebut dengan jelas; alternatif leksikal dicatat dalam catatan kaki.
- source_word: הוֹלֵךְ וָ/אוֹר
  choice: yang semakin lama semakin terang
  rationale: Secara harfiah rangkaian ini berarti ‘berjalan/terus berlangsung dan bercahaya’. Dalam konteks cahaya pagi, konstruksi tersebut mengungkapkan perkembangan yang berkelanjutan. Terjemahan idiomatis ini mempertahankan gerak progresifnya, sementara bentuk yang lebih harfiah dicatat dalam catatan kaki.
- source_word: עַד נְכוֹן הַ/יּוֹם
  choice: hingga hari mencapai terangnya yang penuh
  rationale: עַד menandai batas waktu, נְכוֹן menyatakan keadaan yang teguh atau telah terbentuk sepenuhnya, dan הַיּוֹם berarti ‘hari/siang itu’. Dalam citra fajar, ungkapan ini menunjuk pada siang yang telah mencapai keadaan penuh dan mantap. Pilihan ini alami dalam bahasa Indonesia tanpa mengubahnya menjadi penanda waktu tertentu seperti tengah hari.
theological_decisions:
- issue: Kategori moral צַדִּיקִים
  choice: orang-orang benar
  alternative: orang benar; orang-orang yang adil
  rationale: Konteks membandingkan arah hidup orang benar dan orang fasik. ‘Orang-orang benar’ mempertahankan kategori etis-teologis teks tanpa memasukkan pengertian doktrinal yang lebih khusus.
- issue: Perkembangan jalan orang benar sebagai gambaran cahaya
  choice: Mempertahankannya sebagai simile tentang jalan hidup yang kian terang
  alternative: Menafsirkannya secara khusus sebagai pertumbuhan rohani, pembenaran, atau kemakmuran
  rationale: Ayat memakai metafora jalan dan cahaya tanpa menjelaskan satu mekanisme doktrinal tertentu. Terjemahan tidak mempersempit gambaran itu kepada ajaran denominasi atau hasil duniawi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Semakin lama semakin terang’ dipilih sebagai ungkapan alami bagi perkembangan cahaya yang berkelanjutan. Semua penanda catatan kaki ditempatkan langsung pada bagian teks yang dijelaskan.
