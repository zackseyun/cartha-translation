translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme dijaga melalui 'kata-kataku' dan 'ucapanku', sementara metafora telinga dipertahankan dan dijelaskan dalam catatan kaki.
