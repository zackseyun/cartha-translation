base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/020.yaml
  text: My son[a], pay attention to my words[b]; incline your ear to my sayings.
translation:
  language: id
  text: Anakku, perhatikanlah kata-kataku; condongkanlah telingamu[a] kepada ucapanku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “condongkanlah telingamu” berarti dengarkanlah dengan saksama.
