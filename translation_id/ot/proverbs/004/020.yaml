lexical_decisions:
- source_word: בְּנִי
  choice: Anakku
  rationale: Sapaan tunggal maskulin dari seorang ayah atau guru kepada anak laki-lakinya dipertahankan sesuai konteks sastra langsung.
- source_word: לִדְבָרַי
  choice: kata-kataku
  rationale: Bentuk jamak dengan akhiran orang pertama tunggal menunjuk pada perkataan atau pengajaran si pembicara; bentuk ini alami dalam bahasa Indonesia dan tetap sejajar dengan klausa berikutnya.
- source_word: הַקְשִׁיבָה
  choice: perhatikanlah
  rationale: Imperatif Hifil ini menuntut tindakan mendengarkan dengan sungguh-sungguh; 'perhatikanlah' menyampaikan daya idiomatisnya secara alami.
- source_word: לַאֲמָרַי
  choice: kepada ucapanku
  rationale: '''Ucapan'' mempertahankan variasi leksikal dalam paralelisme puisi tanpa menyamakan אֲמָרַי sepenuhnya dengan דְבָרַי.'
- source_word: הַט אָזְנֶךָ
  choice: arahkanlah telingamu
  rationale: Ungkapan ini mempertahankan gambaran konkret bahasa Ibrani sekaligus dapat dipahami sebagai ajakan untuk mendengarkan dengan saksama.
