  text: Do not let them depart from your eyes[b][a]; keep them within your heart.
translation:
  language: id
  text: Jangan biarkan itu menjauh dari pandanganmu[a]; jagalah itu di dalam hatimu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari matamu”; maksudnya, jangan biarkan itu lepas dari perhatianmu.
    reason: lexical_alternative
  - marker: b
    text: Dalam pemakaian bahasa Ibrani, “hati” menunjuk pada diri batiniah, termasuk pikiran, kehendak, dan perasaan.
    reason: cultural_note
lexical_decisions:
- source_word: אַל
  choice: Jangan
  rationale: Partikel larangan diterjemahkan dengan bentuk larangan yang jelas dan wajar dalam bahasa Indonesia modern.
- source_word: יַלִּיזוּ
  choice: biarkan semua itu menjauh
  rationale: Bentuk ini mempertahankan gagasan dasar לוז, yaitu beralih atau menjauh, dengan subjek jamak yang merujuk pada perkataan dan ucapan dalam konteks sebelumnya.
- source_word: מֵעֵינֶיךָ
  choice: dari pandanganmu
  rationale: Ungkapan ini menyampaikan citra 'dari matamu' secara alami dalam bahasa Indonesia, yakni tidak membiarkannya lepas dari perhatian.
- source_word: שָׁמְרֵם
  choice: simpanlah semuanya
  rationale: Imperatif שׁמר mencakup menjaga dan memelihara; 'simpanlah' sesuai dengan lokasi batin yang disebut sesudahnya, sedangkan 'semuanya' menyatakan sufiks objek jamak.
- source_word: בְּתוֹךְ
  choice: di dalam
  rationale: Padanan langsung dan alami yang mempertahankan penekanan pada lokasi batin.
- source_word: לְבָבֶךָ
  choice: hatimu
  rationale: Mempertahankan metafora Ibrani tentang hati sebagai pusat batin yang mencakup pikiran, kehendak, dan perasaan.
