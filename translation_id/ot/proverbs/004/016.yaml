  text: כִּ֤י לֹ֣א יִֽ֭שְׁנוּ אִם לֹ֣א יָרֵ֑עוּ וְֽ/נִגְזְלָ֥ה שְׁ֝נָתָ֗/ם אִם לֹ֥א יכשולו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/016.yaml
  text: For they do not sleep unless they have done evil[a], and their sleep is taken away unless they make someone stumble.
translation:
  language: id
  text: Sebab mereka tidak tidur kalau belum berbuat jahat, dan tidur mereka dirampas kalau belum membuat orang lain tersandung[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kalau mereka sendiri tersandung.” Bentuk Ibraninya singkat dan dapat dipahami sebagai membuat orang lain tersandung atau sebagai mereka sendiri tersandung; konteks lebih mendukung tindakan mencelakakan orang lain.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi peringatan pada ayat sebelumnya dan mempertahankan daya kausalnya.
- source_word: לֹא יִשְׁנוּ
  choice: mereka tidak tidur
  rationale: Menerjemahkan bentuk negatif secara dekat dan menyatakan kebiasaan orang fasik yang baru tidur setelah melakukan kejahatan.
- source_word: אִם לֹא יָרֵעוּ
  choice: sebelum berbuat jahat
  rationale: Dalam konstruksi ini, אִם לֹא menyatakan syarat yang harus terpenuhi; 'sebelum' alami dalam bahasa Indonesia. Kata kerja Hifil יָרֵעוּ dibiarkan tanpa objek sebagaimana teks Ibrani.
- source_word: וְנִגְזְלָה שְׁנָתָם
  choice: dan tidur mereka lenyap
  rationale: נִגְזְלָה secara harfiah menggambarkan tidur yang dirampas atau diambil. 'Lenyap' mempertahankan hasil pasif secara alami tanpa membuat ungkapan Indonesia terasa kaku.
- source_word: אִם לֹא יכשולו
  choice: sebelum membuat seseorang tersandung
  rationale: Konteks dan paralelisme mendukung makna bahwa mereka menyebabkan orang lain jatuh. 'Tersandung' mempertahankan metafora Ibrani, sementara ketaksaan bentuk dicatat dalam catatan kaki.
theological_decisions:
- issue: Objek yang tidak dinyatakan pada יָרֵעוּ
  choice: 'Kejahatan secara umum: ''berbuat jahat'''
  alternative: Mencelakakan orang lain
  rationale: Teks Ibrani tidak menyebut objek, sehingga terjemahan utama tidak mempersempitnya menjadi tindakan terhadap korban tertentu.
- issue: Makna יכשולו
  choice: 'Kausatif menurut konteks: membuat orang lain tersandung'
  alternative: 'Intransitif: mereka sendiri tersandung'
  rationale: Paralelisme dengan perbuatan jahat dan gambaran orang fasik yang tidak tenang sebelum merugikan orang lain mendukung bacaan kausatif, tetapi bentuk Ibraninya singkat sehingga alternatif perlu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'sebelum' membuat hubungan syarat-waktu kedua klausa jelas bagi pembaca umum; metafora 'tersandung' dipertahankan.
