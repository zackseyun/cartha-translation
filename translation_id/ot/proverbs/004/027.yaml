  text: Do not turn to the right or to the left[b][a]; remove your foot from evil.
translation:
  language: id
  text: Jangan menyimpang ke kanan atau ke kiri; jauhkan kakimu dari kejahatan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֵּט
  choice: menyimpang
  rationale: Bentuk larangan dengan אַל menyatakan agar seseorang tidak berbelok atau menyimpang dari jalan yang lurus. Dalam bahasa Indonesia, “menyimpang” mempertahankan gambaran arah sekaligus daya moralnya.
- source_word: יָמִין וּשְׂמֹאול
  choice: ke kanan atau ke kiri
  rationale: Terjemahan langsung dan alami bagi pasangan arah yang menegaskan agar tidak menyimpang ke arah mana pun.
- source_word: הָסֵר
  choice: jauhkan
  rationale: Imperatif ini berarti menyingkirkan atau mengalihkan. “Jauhkan” terdengar alami dengan objek “kakimu” dan tetap mempertahankan gambaran konkret tentang menjauhi jalan yang jahat.
- source_word: רַגְלְךָ
  choice: kakimu
  rationale: Bentuk Ibrani tunggal dipertahankan untuk menjaga metafora jasmani tentang langkah dan jalan hidup.
- source_word: מֵרָע
  choice: dari kejahatan
  rationale: Dalam konteks nasihat hikmat ini, רַע terutama menunjuk pada kejahatan secara moral. Pilihan ini mempertahankan cakupan umumnya tanpa mempersempitnya pada tindakan tertentu.
