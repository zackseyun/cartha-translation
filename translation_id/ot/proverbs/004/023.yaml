  text: Guard your heart more than all guarding[b][a], for from it are the springs of life.
translation:
  language: id
  text: Lebih daripada segala sesuatu yang kaujaga, jagalah hatimu,[a] sebab dari situlah terpancar kehidupan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Lebih daripada segala penjagaan, jagalah hatimu.” Ungkapan Ibrani menekankan kewaspadaan tertinggi dan juga dapat dipahami: “Jagalah hatimu lebih daripada apa pun yang kaujaga.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “sebab darinya berasal aliran-aliran kehidupan” atau “sumber-sumber kehidupan.” Kata Ibrani dapat menunjuk pada sesuatu yang keluar, mengalir, atau menjadi sumber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל מִשְׁמָר
  choice: Lebih daripada segala sesuatu yang kaujaga
  rationale: Frasa Ibrani menempatkan ungkapan perbandingan di depan untuk menekankan bahwa hati harus dijaga dengan kewaspadaan tertinggi. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan kaitan makna dengan kata perintah berikutnya.
- source_word: נְצֹר
  choice: jagalah
  rationale: Kata perintah ini menyatakan tindakan melindungi atau memelihara dengan waspada. 'Jagalah' ringkas, tegas, dan mempertahankan permainan makna dengan מִשְׁמָר.
- source_word: לִבֶּךָ
  choice: hatimu
  rationale: Dalam pemikiran Ibrani, hati mencakup pusat pikiran, kehendak, dan perasaan. Istilah konkret 'hati' dipertahankan agar cakupannya tidak dipersempit.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi perintah sebelumnya; 'sebab' menyatakan hubungan penjelas tersebut dengan jelas dan bermartabat.
- source_word: מִמֶּנּוּ
  choice: dari situlah
  rationale: Akhiran pronominal merujuk kembali kepada hati. 'Dari situlah' alami dalam bahasa Indonesia dan menonjolkan hati sebagai titik asal.
- source_word: תּוֹצְאוֹת חַיִּים
  choice: terpancar kehidupan
  rationale: תּוֹצְאוֹת dapat menunjuk pada keluaran, aliran, atau sumber. Ungkapan verbal ini mempertahankan gambaran bahwa kehidupan mengalir keluar dari hati tanpa memakai padanan harfiah yang kaku.
theological_decisions:
- issue: Cakupan antropologis 'hati'
  choice: Mempertahankan 'hati' sebagai pusat kehidupan batin manusia.
  alternative: pikiran; batin; diri terdalam
  rationale: Teks memakai bahasa antropologis Ibrani yang mencakup pikiran, kehendak, dan perasaan. Mengganti istilah itu dengan salah satu aspeknya akan mempersempit maknanya.
- issue: Hubungan hati dengan kehidupan
  choice: Menyatakan hati sebagai tempat asal pancaran kehidupan tanpa menjelaskan mekanismenya.
  alternative: Menafsirkan 'kehidupan' secara khusus sebagai perilaku, keselamatan rohani, atau kesehatan jasmani.
  rationale: Pepatah ini membiarkan cakupan 'kehidupan' luas. Terjemahan tidak boleh membatasi pernyataan itu pada satu penerapan teologis atau moral tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan orang kedua tunggal yang akrab melalui bentuk terikat '-mu' dan 'kau-'. Susunan awal mempertahankan penekanan retoris bahasa Ibrani, sedangkan klausa penutup dibuat alami dan mudah dipahami. Nada ringkas, tegas, dan bernuansa hikmat.
