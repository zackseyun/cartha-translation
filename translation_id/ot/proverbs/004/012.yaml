  text: בְּֽ֭/לֶכְתְּ/ךָ לֹא יֵצַ֣ר צַעֲדֶ֑/ךָ וְ/אִם תָּ֝ר֗וּץ לֹ֣א תִכָּשֵֽׁל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/012.yaml
  text: When you walk[a], your step will not be hindered; and if you run, you will not stumble.
translation:
  language: id
  text: Ketika engkau berjalan, langkahmu tidak akan terhambat[a]; dan jika engkau berlari, engkau tidak akan tersandung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “langkahmu tidak akan menjadi sempit/terbatas.” Verba Ibraninya mengandung gagasan dipersempit atau dikekang.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתְּךָ
  choice: Ketika engkau berjalan
  rationale: Infinitif konstruk הלך dengan prefiks ב dan sufiks orang kedua maskulin tunggal berfungsi secara temporal. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan arti ‘ketika/sewaktu engkau berjalan’.
- source_word: יֵצַר
  choice: tidak akan terhambat
  rationale: Verba ini menyampaikan gagasan menjadi sempit, terdesak, atau terbatas. Dalam kaitannya dengan ‘langkahmu’, ‘tidak akan terhambat’ mengungkapkan bahwa gerak atau kemajuan tidak dibatasi, sementara nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: צַעֲדֶךָ
  choice: langkahmu
  rationale: Nomina tunggal dengan sufiks orang kedua maskulin tunggal. Bentuk tunggal ‘langkahmu’ mempertahankan bentuk dan gambaran jalan dalam teks Ibrani.
- source_word: וְאִם
  choice: dan jika
  rationale: Mempertahankan konjungsi serta bentuk bersyarat sederhana dari bahasa Ibrani tanpa mengubahnya menjadi kepastian temporal.
- source_word: תָּרוּץ
  choice: engkau berlari
  rationale: רץ pada umumnya berarti ‘berlari’; konteks tidak menuntut pelemahan menjadi ‘bergegas’ atau penguatan menjadi ‘berlomba’.
- source_word: תִכָּשֵׁל
  choice: engkau tidak akan tersandung
  rationale: Bentuk nifal כשל lazimnya menunjuk pada tersandung. Pilihan ini mempertahankan citra perjalanan dan tetap memungkinkan gema harfiah maupun kiasan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hikmat yang lugas dan bermartabat. Pronomina ‘engkau’ mempertahankan sapaan orang kedua tunggal dan cocok dengan register Alkitab tanpa terasa arkais. Tanda catatan kaki ditempatkan sesudah ‘terhambat’, yakni unsur yang dijelaskan.
