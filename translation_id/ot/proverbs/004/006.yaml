  text: Do not forsake her[a], and she will keep you; love her, and she will guard you.
translation:
  language: id
  text: Jangan tinggalkan dia[a], dan dia akan menjagamu; kasihilah dia, dan dia akan melindungimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah hikmat, yang dalam bagian ini dipersonifikasikan sebagai seorang perempuan.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תַּעַזְבֶהָ
  choice: Jangan tinggalkan dia
  rationale: אַל dengan bentuk imperfek menyatakan larangan. עזב berarti meninggalkan atau menelantarkan; “tinggalkan” alami dalam bahasa Indonesia dan tetap memuat daya relasional konteks. Pronomina feminin Ibrani merujuk kepada hikmat yang dipersonifikasikan.
- source_word: וְתִשְׁמְרֶךָּ
  choice: maka dia akan menjagamu
  rationale: שׁמר mencakup menjaga, memelihara, dan mengawasi. Dalam hubungan akibat yang tersirat setelah larangan, “maka” lebih alami daripada “dan” dalam bahasa Indonesia, sedangkan “menjagamu” mempertahankan makna luas verba tersebut.
- source_word: אֱהָבֶהָ
  choice: kasihilah dia
  rationale: אהב berarti mengasihi atau mencintai. “Kasihilah” sesuai dengan bentuk perintah, bernada luhur tetapi tetap mudah dipahami, dan mempertahankan hubungan pribadi dengan hikmat yang dipersonifikasikan.
- source_word: וְתִצְּרֶךָּ
  choice: maka dia akan melindungimu
  rationale: נצר menyatakan menjaga atau melindungi dengan nuansa perlindungan. “Melindungimu” membedakannya secara wajar dari שׁמר pada klausa sebelumnya tanpa melebihkan maknanya.
theological_decisions:
- issue: Personifikasi hikmat sebagai perempuan
  choice: Memakai pronomina orang ketiga “dia” dan menjelaskan personifikasi dalam catatan kaki
  alternative: Mengulang kata “hikmat” atau memakai bentuk abstrak tanpa personifikasi
  rationale: Akhiran feminin Ibrani menunjuk kembali kepada hikmat, yang secara gramatikal feminin dan secara sastra dipersonifikasikan sebagai perempuan dalam konteks ini. Karena bahasa Indonesia tidak membedakan gender pada pronomina “dia”, catatan kaki mempertahankan informasi sastra yang tidak tampak dalam bentuk pronominanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme kedua klausa dipertahankan. “Maka” mengungkapkan hubungan perintah dan akibat secara alami, tanpa mengubah janji yang dinyatakan oleh bentuk verba Ibrani.
