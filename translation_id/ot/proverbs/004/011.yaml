  text: I have instructed you in the way of wisdom[a]; I have led you in paths of uprightness.
translation:
  language: id
  text: Aku telah mengajarimu jalan hikmat; aku telah menuntunmu di lintasan-lintasan yang lurus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “lintasan-lintasan kelurusan.” Kata Ibrani yang digunakan dapat menunjuk pada kelurusan jalan maupun kelurusan moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדֶרֶךְ חָכְמָה
  choice: jalan hikmat
  rationale: דֶּרֶךְ dapat berarti jalan secara harfiah maupun arah atau pola hidup. Ungkapan ini mempertahankan metafora perjalanan dan hubungan eratnya dengan חָכְמָה.
- source_word: הֹרֵתִיךָ
  choice: Aku telah mengajarimu
  rationale: Bentuk Hifil dari ירה berarti mengajar, memberi petunjuk, atau mengarahkan. 'Mengajarimu' alami dalam konteks didikan hikmat, sedangkan 'telah' menyatakan tindakan yang sudah dilakukan dan tetap relevan.
- source_word: הִדְרַכְתִּיךָ
  choice: aku telah menuntunmu
  rationale: Bentuk Hifil dari דרך menggambarkan tindakan memimpin atau membimbing seseorang menempuh suatu jalan. 'Menuntunmu' mempertahankan citra gerak dan cocok dengan perkataan seorang ayah kepada anaknya.
- source_word: בְּמַעְגְּלֵי
  choice: di lintasan-lintasan
  rationale: מַעְגָּל berarti lintasan, jalur, atau jalan. Bentuk jamaknya dipertahankan, dan 'lintasan-lintasan' menghindari pengulangan langsung dengan 'jalan' pada bagian pertama sambil menjaga paralelisme.
- source_word: יֹשֶׁר
  choice: yang lurus
  rationale: יֹשֶׁר adalah nomina yang mencakup kelurusan harfiah dan kelurusan moral. Bentuk 'yang lurus' terdengar alami dalam bahasa Indonesia serta mempertahankan permainan antara citra jalan dan makna etis.
theological_decisions:
- issue: Apakah יֹשֶׁר harus dinyatakan secara eksplisit sebagai sifat moral
  choice: Memakai 'yang lurus' agar citra jalan dan makna moral tetap hadir tanpa mempersempit arti
  alternative: Memakai 'yang benar' atau 'kejujuran' untuk menonjolkan makna etis
  rationale: Konteks Amsal mengarah pada kehidupan yang benar, tetapi kata Ibraninya sengaja selaras dengan metafora jalan. Terjemahan tidak boleh menghapus salah satu sisi makna tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Pronomina 'Aku' dan '-mu' mencerminkan tuturan langsung seorang ayah kepada anaknya. Paralelisme puitis serta metafora perjalanan dipertahankan.
