  yaml_path: translation/ot/proverbs/004/025.yaml
  text: Let your eyes look straight ahead[a], and your eyelids be directed before you.
translation:
  language: id
  text: 'Biarlah matamu memandang lurus ke depan,

    dan biarlah kelopak matamu terarah lurus ke hadapanmu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan biarlah kelopak matamu lurus ke hadapanmu.” Kata kerja Ibrani dapat secara lebih harfiah menyatakan kelurusan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֶיךָ
  choice: matamu
  rationale: Bentuk Ibrani secara gramatikal jamak dengan sufiks orang kedua tunggal, tetapi dalam bahasa Indonesia idiom tubuh yang alami ialah bentuk tunggal kolektif “matamu”.
- source_word: לְנֹכַח
  choice: lurus ke depan
  rationale: Frasa ini menunjuk pada arah yang tepat di depan seseorang; “lurus ke depan” alami dalam bahasa Indonesia dan mempertahankan gagasan fokus serta arah yang lurus.
- source_word: יַבִּיטוּ
  choice: memandang
  rationale: Verba נבט berarti melihat atau memandang. “Memandang” sesuai dengan gaya puitis yang bermartabat tanpa menambahkan intensitas yang tidak tersurat.
- source_word: וְעַפְעַפֶּיךָ
  choice: dan kelopak matamu
  rationale: Kata Ibrani secara konkret menyebut kelopak mata sebagai paralel puitis bagi mata; citra tubuh ini dipertahankan dan tidak diratakan menjadi “pandanganmu”.
- source_word: יַיְשִׁרוּ
  choice: mengarah tepat
  rationale: Bentuk dari ישר menyampaikan kelurusan atau pengarahan yang lurus. Dalam bahasa Indonesia, “mengarah tepat” dapat diterapkan secara alami pada kelopak mata sebagai ungkapan puitis sekaligus mempertahankan nuansa arah yang benar.
- source_word: נֶגְדֶּךָ
  choice: ke hadapanmu
  rationale: Kata ini menunjuk pada apa yang berada di depan seseorang. “Ke hadapanmu” ringkas, puitis, dan berpadanan dengan “ke depan” pada baris pertama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Paralelisme dua baris serta citra konkret “mata/kelopak mata” dipertahankan. “Biarlah” meneruskan daya nasihat bentuk jussif Ibrani tanpa terdengar kaku.
