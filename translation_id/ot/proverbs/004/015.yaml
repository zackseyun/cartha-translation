  text: פְּרָעֵ֥/הוּ אַל תַּעֲבָר בּ֑/וֹ שְׂטֵ֖ה מֵ/עָלָ֣י/ו וַ/עֲבֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/015.yaml
  text: Avoid it[a]; do not pass through it[b]. Turn away from it and pass on.
translation:
  language: id
  text: Jauhilah jalan itu[a]; jangan melewatinya. Menyimpanglah darinya, lalu teruslah berjalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Hindarilah jalan itu.” Kata kerja Ibraninya jarang digunakan dan menyatakan tindakan menjaga jarak dari jalan orang fasik.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרָעֵהוּ
  choice: Jauhilah jalan itu
  rationale: Kata kerja yang jarang ini, dengan akhiran pronominal, dalam konteks tersebut memerintahkan agar orang menjaga jarak dari jalan orang fasik. Penyebutan ulang 'jalan itu' memperjelas rujukannya secara alami dalam bahasa Indonesia.
- source_word: אַל תַּעֲבָר בּוֹ
  choice: jangan melewatinya
  rationale: Partikel negatif אַל menyatakan larangan, sedangkan עבר dengan ב mempertahankan gambaran bergerak melalui atau menyusuri jalan tersebut.
- source_word: שְׂטֵה מֵעָלָיו
  choice: Menyimpanglah darinya
  rationale: Bentuk imperatif שְׂטֵה berarti berbelok atau menyimpang, dan מֵעָלָיו menyatakan menjauh dari jalan itu. Pilihan ini mempertahankan metafora jalan serta gerakan menghindar yang disengaja.
- source_word: וַעֲבוֹר
  choice: lalu teruslah berjalan
  rationale: Imperatif terakhir menyuruh pendengar bergerak terus melewati tempat itu tanpa mengambil jalan tersebut. 'Teruslah berjalan' alami dalam bahasa Indonesia dan membedakannya dari larangan sebelumnya.
