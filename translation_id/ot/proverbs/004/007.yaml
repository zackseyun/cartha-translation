  text: רֵאשִׁ֣ית חָ֭כְמָה קְנֵ֣ה חָכְמָ֑ה וּ/בְ/כָל קִ֝נְיָנְ/ךָ֗ קְנֵ֣ה בִינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/007.yaml
  text: 'The beginning of wisdom is this: acquire wisdom[a], and with all you acquire[b], acquire understanding.'
translation:
  language: id
  text: 'Inilah permulaan hikmat: perolehlah hikmat[a], dan dengan segala yang kauperoleh[b], perolehlah pengertian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Hikmat adalah hal yang terutama; sebab itu, perolehlah hikmat,” dengan memahami רֵאשִׁית sebagai “yang terutama” atau “yang paling penting.”
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “dengan seluruh perolehanmu” atau “dengan segala milikmu.” Ungkapan Ibrani ini kemungkinan memainkan pengulangan kata yang berarti “memperoleh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: permulaan
  rationale: Kata ini dapat berarti awal, bagian pertama, atau hal yang terutama. 'Permulaan' mempertahankan bentuk ungkapan Ibrani dan membiarkan klausa berikutnya menjelaskan apa yang harus dilakukan.
- source_word: חָכְמָה
  choice: hikmat
  rationale: Padanan baku dan wajar dalam sastra Amsal untuk kecakapan hidup yang bersifat praktis dan moral, bukan sekadar kecerdasan.
- source_word: קְנֵה
  choice: perolehlah
  rationale: Bentuk imperatif ini dapat berarti membeli, mendapatkan, atau memperoleh. 'Perolehlah' menyatakan tindakan sengaja untuk mendapatkan sesuatu tanpa membatasi maknanya pada transaksi jual beli.
- source_word: וּבְכָל קִנְיָנְךָ
  choice: dan dengan segala yang kauperoleh
  rationale: Terjemahan ini mempertahankan hubungan bunyi dan makna antara nomina קִנְיָן dan verba קנה, sekaligus tidak mempersempit ungkapan menjadi harta atau uang saja.
- source_word: בִינָה
  choice: pengertian
  rationale: Dalam sastra hikmat, kata ini menunjuk pada kemampuan memahami dan membedakan dengan tepat; 'pengertian' merupakan padanan Indonesia yang luas dan alami.
theological_decisions:
- issue: Makna רֵאשִׁית dalam klausa pembuka
  choice: Dipahami sebagai 'permulaan', sehingga klausa berikut menjelaskan langkah awal hikmat.
  alternative: 'Dipahami sebagai ''yang terutama'' atau ''hal yang paling utama'', sehingga artinya: ''Hikmat adalah hal yang terutama; sebab itu, perolehlah hikmat.'''
  rationale: Bahasa Ibrani yang ringkas memungkinkan kedua pemahaman. Teks utama mempertahankan makna umum 'permulaan', sedangkan catatan menjaga alternatif yang sah tanpa menutup ketegangan semantis.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pengulangan 'hikmat' dan 'perolehlah' dipertahankan untuk mencerminkan penekanan serta permainan kata dalam bahasa Ibrani; bentuk 'kauperoleh' dipilih agar padat dan sesuai dengan gaya sastra hikmat.
