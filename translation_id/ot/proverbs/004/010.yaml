  text: שְׁמַ֣ע בְּ֭נִ/י וְ/קַ֣ח אֲמָרָ֑/י וְ/יִרְבּ֥וּ לְ֝/ךָ֗ שְׁנ֣וֹת חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/010.yaml
  text: Hear[a], my son, and receive my words[c][b], and the years of your life will be many.
translation:
  language: id
  text: Dengarkanlah, anakku, dan terimalah perkataanku, maka tahun-tahun hidupmu akan bertambah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַע
  choice: Dengarkanlah
  rationale: Imperatif ini bukan sekadar meminta mendengar bunyi, melainkan menyimak dengan perhatian. “Dengarkanlah” alami dalam bahasa Indonesia dan mempertahankan daya perintahnya.
- source_word: בְּנִי
  choice: anakku
  rationale: Bentuk sapaan ini secara harfiah berarti “anakku” dan mempertahankan bingkai pengajaran ayah kepada anak laki-laki, tanpa perlu menambahkan kata “laki-laki” yang tidak alami dalam sapaan Indonesia.
- source_word: וְקַח
  choice: dan terimalah
  rationale: Kata kerja לקח secara dasar berarti mengambil, tetapi dalam konteks menerima pengajaran, “terimalah” lebih alami dan tetap dekat dengan maknanya.
- source_word: אֲמָרָי
  choice: perkataanku
  rationale: Bentuk jamak dengan akhiran orang pertama tunggal merujuk pada kata-kata atau ujaran sang pengajar. “Perkataanku” merupakan padanan Indonesia yang ringkas dan wajar.
- source_word: וְיִרְבּוּ
  choice: akan bertambah
  rationale: Kata רבה menyatakan menjadi banyak atau bertambah. Dengan subjek “tahun-tahun hidupmu”, “akan bertambah” alami dan mempertahankan gambaran peningkatan jumlah tahun.
- source_word: לְךָ שְׁנוֹת חַיִּים
  choice: tahun-tahun hidupmu
  rationale: Secara harfiah, frasa ini dapat dipahami sebagai “tahun-tahun kehidupan bagimu”. Bentuk posesif “hidupmu” menyampaikan relasinya secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sapaan bergender dalam pengajaran hikmat
  choice: anakku
  alternative: anakku laki-laki
  rationale: Bahasa Ibrani memakai bentuk maskulin tunggal dalam bingkai pengajaran kepada seorang putra. “Anakku” adalah sapaan Indonesia yang wajar dan tidak menghapus hubungan orang tua-anak, sedangkan penambahan “laki-laki” akan terasa kaku dan berlebihan.
- issue: Hubungan antara menerima perkataan dan panjang umur
  choice: maka tahun-tahun hidupmu akan bertambah
  alternative: dan tahun-tahun hidupmu akan bertambah
  rationale: Waw dapat menghubungkan klausa secara sederhana ataupun menyiratkan hasil. “Maka” menyampaikan hubungan hasil yang wajar dalam pepatah ini tanpa mengubahnya menjadi jaminan mekanis yang dijelaskan lebih jauh daripada teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Partikel -lah mempertahankan nada nasihat imperatif; struktur kalimat tetap dekat dengan paralelisme dan hubungan antarklausa bahasa Ibrani.
