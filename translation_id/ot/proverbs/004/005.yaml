translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada nasihat yang tegas. Partikel “-lah” mempertahankan daya imperatif tanpa terdengar kasar. Struktur berulang dari teks Ibrani dipertahankan, demikian pula ungkapan konkret “perkataan mulutku”.
