  text: Acquire wisdom[a]; acquire understanding. Do not forget[b], and do not turn away from the words of my mouth.
translation:
  language: id
  text: Dapatkanlah[a] hikmat, dapatkanlah pengertian. Jangan lupa dan jangan menyimpang[b] dari perkataan mulutku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Perolehlah hikmat, perolehlah pengertian.” Kata Ibrani ini dapat berarti mendapatkan, memperoleh, atau membeli, bergantung pada konteksnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “jangan berbelok” atau “jangan menyimpang” dari perkataan mulutku.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְנֵה
  choice: Dapatkanlah
  rationale: Bentuk imperatif קנה menyatakan tindakan sengaja untuk memperoleh sesuatu yang bernilai. “Dapatkanlah” alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi transaksi jual-beli; pengulangan dipertahankan demi penekanan retoris.
- source_word: חָכְמָה
  choice: hikmat
  rationale: Padanan baku dan bermartabat bagi חכמה dalam sastra Amsal, yang mencakup kecakapan hidup serta kebijaksanaan moral.
- source_word: בִינָה
  choice: pengertian
  rationale: Mewakili kemampuan memahami dan membedakan, sekaligus tetap membedakannya dari “hikmat” tanpa menafsirkan secara berlebihan.
- source_word: אַל תִּשְׁכַּח
  choice: Jangan melupakannya
  rationale: שכח pada dasarnya berarti “lupa”. Akhiran “-nya” ditambahkan secara wajar dalam bahasa Indonesia dengan merujuk pada hikmat dan pengertian yang baru disebut.
- source_word: וְאַל תֵּט
  choice: dan jangan menyimpang
  rationale: נטה dapat berarti berbelok atau menyimpang. Dalam konteks nasihat, “menyimpang dari” secara alami menyampaikan larangan untuk meninggalkan arah pengajaran.
- source_word: מֵאִמְרֵי פִי
  choice: dari perkataan mulutku
  rationale: Terjemahan ini mempertahankan citraan Ibrani mengenai ucapan yang keluar dari mulut sang pengajar, alih-alih meratakannya menjadi sekadar “ajaranku”.
