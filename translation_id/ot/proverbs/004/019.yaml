  text: The way of the wicked is like deep darkness[b][a]; they do not know what makes them stumble.
translation:
  language: id
  text: Jalan orang-orang fasik seperti kegelapan pekat; mereka tidak tahu apa yang membuat mereka tersandung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “apa yang menjadi sandungan mereka.” Ungkapan Ibrani dapat menunjuk pada sesuatu yang menyebabkan mereka tersandung atau pada objek yang menjadi sandungan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: jalan
  rationale: Mempertahankan metafora hikmat tentang arah hidup atau perilaku seseorang dalam bentuk yang alami dalam bahasa Indonesia.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Menyatakan bentuk jamak substantival bagi orang yang bersalah secara moral; istilah ini ringkas, bermartabat, dan lazim dalam konteks sastra hikmat.
- source_word: כָּאֲפֵלָה
  choice: seperti kegelapan pekat
  rationale: Awalan כְּ menyatakan perbandingan, sedangkan אֲפֵלָה menunjuk pada kegelapan atau kesuraman yang sangat tebal, bukan sekadar keadaan gelap biasa.
- source_word: לֹא יָדְעוּ
  choice: mereka tidak tahu
  rationale: Terjemahan langsung yang tetap mencakup ketidaktahuan maupun ketidaksadaran tanpa mempersempit maknanya.
- source_word: בַּמֶּה יִכָּשֵׁלוּ
  choice: apa yang membuat mereka tersandung
  rationale: Mengungkapkan secara alami kemungkinan instrumental atau kausal dari בַּמֶּה dan mempertahankan gambaran moral tentang tersandung; kemungkinan makna objek tempat mereka tersandung dicatat dalam catatan kaki.
theological_decisions:
- issue: Penyebab atau objek sandungan dalam בַּמֶּה יִכָּשֵׁלוּ
  choice: apa yang membuat mereka tersandung
  alternative: pada apa mereka tersandung
  rationale: Konstruksi Ibrani dapat menunjuk kepada sarana atau penyebab sandungan maupun objek yang mengenainya mereka tersandung. Teks utama memakai ungkapan Indonesia yang alami, sementara catatan kaki mempertahankan kemungkinan lainnya tanpa menyelesaikan ambiguitas secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas dan bermartabat. “Kegelapan pekat” mempertahankan intensitas gambaran Ibrani, sedangkan “tersandung” menjaga metafora jalan dalam kedua bagian ayat.
