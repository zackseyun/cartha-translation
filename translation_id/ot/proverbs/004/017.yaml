  text: כִּ֣י לָ֭חֲמוּ לֶ֣חֶם רֶ֑שַׁע וְ/יֵ֖ין חֲמָסִ֣ים יִשְׁתּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/017.yaml
  text: For they eat the bread of wickedness[b][a], and drink the wine of violence.
translation:
  language: id
  text: Sebab mereka makan roti kefasikan dan minum anggur kekerasan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai bentuk jamak untuk “kekerasan”; bentuk itu mungkin menyatakan kekerasan secara kolektif atau menegaskan intensitasnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan bagi peringatan dalam konteks sebelumnya; “sebab” mempertahankan fungsi penjelasnya secara wajar dalam bahasa Indonesia.
- source_word: לָחֲמוּ
  choice: mereka makan
  rationale: Berasal dari לחם II, “makan, mengonsumsi.” Terjemahan “makan” paling langsung dan mempertahankan kesejajaran dengan “minum.”
- source_word: לֶחֶם
  choice: roti
  rationale: Citra konkret “roti” dipertahankan karena berpasangan secara puitis dengan “anggur.” Bahasa Indonesia tidak memerlukan kata sandang.
- source_word: רֶשַׁע
  choice: kefasikan
  rationale: Menunjuk pada kejahatan atau perilaku yang bertentangan dengan moral; “kefasikan” sesuai dengan ragam sastra hikmat yang luhur tanpa menghilangkan bobot etiknya.
- source_word: וְיֵין
  choice: dan ... anggur
  rationale: Konjungsi menghubungkan dua baris yang sejajar, sedangkan “anggur” mempertahankan gambaran konkret teks Ibrani.
- source_word: חֲמָסִים
  choice: kekerasan
  rationale: Walaupun berbentuk jamak dalam bahasa Ibrani, kata ini dapat berfungsi secara kolektif atau intensif. Bentuk tunggal abstrak “kekerasan” paling alami dalam bahasa Indonesia; catatan kaki mencatat bentuk sumbernya.
- source_word: יִשְׁתּוּ
  choice: minum
  rationale: Subjek “mereka” sudah dinyatakan pada klausa pertama dan secara alami berlaku juga bagi verba ini, sehingga kesejajaran puitis tetap ringkas.
theological_decisions: []
