  yaml_path: translation/ot/proverbs/004/004.yaml
  text: Then he taught me and said to me[a], “Let your heart hold fast my words[b]; keep my commandments and live.”
translation:
  language: id
  text: Ia mengajar aku dan berkata kepadaku, “Hendaklah hatimu[a] berpegang teguh pada perkataanku[b]. Peliharalah perintah-perintahku dan hiduplah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, “hati” sering mencakup pikiran, kehendak, dan pengertian, bukan hanya perasaan.
    reason: cultural_note
  - marker: b
    text: Atau, “menyimpan perkataanku dengan teguh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרֵנִי
  choice: Ia mengajar aku
  rationale: Bentuk Hifil dari ירה di sini berarti mengajar atau memberi pengajaran. “Mengajar aku” alami dalam bahasa Indonesia dan sesuai dengan konteks pendidikan dari ayah kepada anak.
- source_word: וַיֹּאמֶר לִי
  choice: dan berkata kepadaku
  rationale: Terjemahan langsung dan wajar untuk pengantar perkataan langsung, tanpa menambahkan nuansa tafsiran.
- source_word: יִתְמָךְ
  choice: berpegang teguh pada
  rationale: תמך berarti memegang, menopang, atau mempertahankan. Dengan “hati” sebagai subjek dan “perkataanku” sebagai objek, ungkapan ini menyampaikan tindakan menyimpan perkataan dengan kukuh dalam batin.
- source_word: דְּבָרַי
  choice: perkataanku
  rationale: Menerjemahkan bentuk jamak דברים dengan akhiran orang pertama secara ringkas dan alami; konteksnya menunjuk pada perkataan pengajaran sang ayah.
- source_word: לִבֶּךָ
  choice: hatimu
  rationale: “Hati” mempertahankan gambaran antropologis Ibrani dan dalam konteks ini mencakup pikiran, kehendak, serta pengertian, bukan hanya perasaan.
- source_word: שְׁמֹר
  choice: Peliharalah
  rationale: שמר dapat berarti menjaga, menaati, atau memelihara. “Peliharalah” cocok dengan “perintah-perintah” dan mempertahankan unsur menjaga serta menjalankannya.
- source_word: מִצְוֺתַי
  choice: perintah-perintahku
  rationale: מצוה menunjuk pada perintah yang berwibawa. Bentuk jamak Indonesia mempertahankan bentuk jamak teks Ibrani tanpa memberi warna denominasi tertentu.
- source_word: וֶחְיֵה
  choice: dan hiduplah
  rationale: Bentuk imperatif חיה dengan kata sambung diterjemahkan sebagai seruan langsung. Ini mempertahankan susunan Ibrani yang padat tanpa memastikan apakah hubungan tersebut terutama hasil, tujuan, atau kelanjutan nasihat.
theological_decisions:
- issue: Hubungan antara menaati perintah dan hidup
  choice: “Peliharalah perintah-perintahku dan hiduplah”
  alternative: “Peliharalah perintah-perintahku, maka engkau akan hidup” atau “supaya engkau hidup”
  rationale: Teks Ibrani memakai imperatif yang disambungkan dengan ו, sehingga dapat terdengar sebagai seruan yang diikuti hasil atau tujuan. Terjemahan dengan “dan” mempertahankan kepadatan serta ketegangan tersebut tanpa menjadikannya secara tegas janji bersyarat atau klausa tujuan.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Bentuk “hiduplah” mempertahankan daya imperatif teks Ibrani, sedangkan “berpegang teguh” menyampaikan keteguhan batin tanpa terdengar teknis.
