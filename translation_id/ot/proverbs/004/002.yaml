id: PRO.4.2
reference: Proverbs 4:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י לֶ֣קַח ט֭וֹב נָתַ֣תִּי לָ/כֶ֑ם תּֽ֝וֹרָתִ֗/י אַֽל תַּעֲזֹֽבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/002.yaml
  text: For I have given you good instruction[a]; do not forsake my teaching.
translation:
  language: id
  text: Sebab aku telah memberikan pengajaran yang baik kepada kalian; jangan tinggalkan ajaranku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “petunjukku”; secara tradisional, “hukumku.” Kata Ibrani torah dapat berarti pengajaran atau petunjuk secara luas, bukan hanya hukum yang berupa ketetapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan bagi nasihat dalam konteks sebelumnya dan mempertahankan hubungan logis ayat ini secara alami dalam bahasa Indonesia.
- source_word: לֶקַח טוֹב
  choice: pengajaran yang baik
  rationale: לֶקַח menunjuk pada pengajaran yang diberikan dan diterima dalam konteks sastra hikmat; טוֹב menyatakan kualitasnya.
- source_word: נָתַתִּי לָכֶם
  choice: aku telah memberikan ... kepada kalian
  rationale: Bentuk perfek menyatakan tindakan yang sudah dilakukan dan tetap relevan. Bentuk jamak 'kalian' mempertahankan sufiks orang kedua jamak.
- source_word: תּוֹרָתִי
  choice: ajaranku
  rationale: Dalam konteks nasihat seorang ayah, תּוֹרָה berarti ajaran atau petunjuk yang berwibawa, bukan semata-mata hukum tertulis.
- source_word: אַל תַּעֲזֹבוּ
  choice: jangan tinggalkan
  rationale: Larangan ini menyerukan agar para pendengar tidak melepaskan atau meninggalkan ajaran tersebut; ungkapan ini alami sekaligus cukup kuat dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna תּוֹרָתִי dalam konteks hikmat
  choice: ajaranku
  alternative: hukumnya atau petunjukku
  rationale: Konteks ayah yang mengajar anak-anaknya mendukung pengertian luas berupa ajaran yang berwibawa. Pilihan ini tidak mempersempitnya menjadi hukum Musa, tetapi catatan kaki mempertahankan rentang makna istilah Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Kalian' dipakai untuk mempertahankan bentuk jamak Ibrani, sedangkan 'aku' mencerminkan suara pribadi sang ayah/pengajar.
