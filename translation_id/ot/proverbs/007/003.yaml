  terminology: ‘Loh hati’ adalah padanan mapan dan tepat bagi לוּחַ לִבֶּךָ. ‘Ikatlah’ menyampaikan imperatif קשר secara langsung; ‘semuanya itu’ dengan aman mewakili objek jamak yang konteksnya adalah ajaran/perintah sebelumnya.
