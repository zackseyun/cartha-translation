  text: Tie them on your fingers[a]; write them on the tablet of your heart.
translation:
  language: id
  text: Ikatlah semuanya itu pada jari-jarimu; tuliskanlah semuanya itu pada loh hatimu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָשְׁרֵם
  choice: Ikatkanlah semuanya itu
  rationale: Bentuk imperatif dari קשר dengan sufiks jamak berarti ‘ikatkan mereka/semuanya itu’. ‘Ikatkanlah semuanya itu’ alami dalam bahasa Indonesia dan mempertahankan gambaran konkret tentang ajaran yang dilekatkan dekat pada diri.
- source_word: עַל אֶצְבְּעֹתֶיךָ
  choice: pada jari-jarimu
  rationale: עַל bersifat lokatif, sedangkan אֶצְבְּעֹתֶיךָ berbentuk jamak dengan sufiks orang kedua tunggal. Terjemahan ini mengikuti jumlah gramatikal dan mempertahankan gambaran sesuatu yang senantiasa dikenakan atau terlihat.
- source_word: כָּתְבֵם
  choice: tuliskanlah
  rationale: Imperatif כתב dengan sufiks jamak menyatakan tindakan menuliskan hal-hal yang dirujuk. Objeknya dipahami dari ‘semuanya itu’ pada klausa pertama sehingga tidak perlu diulang dalam bahasa Indonesia.
- source_word: עַל לוּחַ
  choice: pada loh
  rationale: לוּחַ berarti loh atau papan tulis. ‘Loh’ mempertahankan citra konkret bahan tempat menulis serta gema pemakaian alkitabiahnya.
- source_word: לִבֶּךָ
  choice: hatimu
  rationale: לֵב mencakup pikiran, kehendak, dan batin, bukan hanya emosi. ‘Hati’ adalah padanan Indonesia yang paling wajar dan menjaga metafora asli tanpa mempersempit maknanya.
theological_decisions:
- issue: Internalisasi ajaran melalui metafora konkret
  choice: Mempertahankan gambaran mengikat pada jari dan menulis pada loh hati.
  alternative: Parafrasa seperti ‘ingatlah selalu dan resapkanlah dalam batinmu’.
  rationale: Teks Ibrani menyampaikan nasihat melalui dua gambaran konkret yang sejajar. Mempertahankannya menjaga bobot sastra dan gema bahasa perjanjian/kebijaksanaan tanpa menggantinya dengan tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ‘-lah’ menyampaikan imperatif nasihat dengan wajar; ‘loh hati’ mempertahankan ungkapan alkitabiah yang jelas dan padat.
