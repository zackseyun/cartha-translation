  text: בְּ֭נִ/י שְׁמֹ֣ר אֲמָרָ֑/י וּ֝/מִצְוֺתַ֗/י תִּצְפֹּ֥ן אִתָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/001.yaml
  text: My son[a], keep my words, and treasure up my commandments with you.
translation:
  language: id
  text: Anakku, peganglah perkataanku, dan simpanlah[a] perintah-perintahku bersamamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “simpanlah baik-baik.” Kata kerja Ibrani ini dapat berarti menyimpan dengan cermat atau menyembunyikan sesuatu agar tetap aman.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Anakku
  rationale: Sapaan tunggal maskulin dengan akhiran orang pertama tunggal paling tepat diterjemahkan sebagai sapaan seorang ayah kepada anak laki-lakinya; bentuk ini juga alami dalam sastra hikmat Indonesia.
- source_word: שְׁמֹר
  choice: peganglah
  rationale: Dalam konteks ajaran hikmat, kata ini mencakup menjaga, mengingat, dan menaati. 'Peganglah' secara alami menyampaikan keteguhan mempertahankan ajaran tanpa membatasi maknanya pada pengamatan atau penjagaan fisik.
- source_word: אֲמָרָי
  choice: perkataanku
  rationale: Bentuk jamak ini menunjuk pada perkataan atau ajaran sang penutur. Bentuk kolektif 'perkataanku' terdengar alami dan bermartabat dalam bahasa Indonesia.
- source_word: וּמִצְוֺתַי
  choice: dan perintah-perintahku
  rationale: Terjemahan ini mempertahankan bobot instruktif dan moral dari מִצְוָה serta bentuk jamaknya.
- source_word: תִּצְפֹּן
  choice: simpanlah
  rationale: Kata kerja ini menggambarkan menyimpan atau menyembunyikan sesuatu secara cermat agar tetap aman. 'Simpanlah' mempertahankan gagasan penyimpanan yang disengaja tanpa menyiratkan kerahasiaan.
- source_word: אִתָּךְ
  choice: dekat padamu
  rationale: Secara harfiah berarti 'denganmu'. Dalam bahasa Indonesia, 'dekat padamu' lebih alami untuk menyatakan bahwa perintah itu dijaga dalam kepemilikan dan selalu tersedia, tanpa memperkuatnya menjadi 'di dalam hatimu'.
