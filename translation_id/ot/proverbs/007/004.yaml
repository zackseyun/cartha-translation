  naturalness: “Katakanlah kepada hikmat” dan “Engkaulah saudariku” baku serta puitis. “Panggillah pengertian sahabat karib” merupakan susunan ringkas yang alami dalam gaya hikmat Indonesia dan mempertahankan paralelisme.
