  text: Say to wisdom[a], “You are my sister,” and call understanding your kinswoman,
translation:
  language: id
  text: 'Katakanlah kepada hikmat: “Engkaulah saudariku,” dan panggillah pengertian sahabat karib[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kenalan dekat” atau “kerabat.” Kata Ibrani מוֹדָע dapat menunjuk kepada seseorang yang dikenal dekat, termasuk sahabat akrab atau, bergantung pada konteks, kerabat.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Katakanlah
  rationale: Bentuk imperatif orang kedua tunggal maskulin dari אמר. “Katakanlah” secara langsung memperkenalkan ucapan dan sejalan dengan ajakan pada klausa berikutnya.
- source_word: לַחָכְמָה
  choice: kepada hikmat
  rationale: Preposisi ל menandai pihak yang diajak bicara. “Hikmat” merupakan padanan baku חָכְמָה dan mempertahankan personifikasinya dalam Amsal.
- source_word: אֲחֹתִי אָתְּ
  choice: Engkaulah saudariku
  rationale: Terjemahan ini mempertahankan istilah kekerabatan אֲחוֹת dengan sufiks orang pertama tunggal serta fungsi predikatif kata ganti feminin אָתְּ. Partikel “-lah” memberi penegasan yang wajar dalam bahasa Indonesia.
- source_word: וּמוֹדָע
  choice: sebagai kerabat dekatmu
  rationale: מוֹדָע menunjuk kepada seseorang yang dikenal dan dapat bermakna kenalan dekat atau kerabat. “Kerabat dekatmu” mempertahankan kesejajaran kekeluargaan dengan “saudariku,” sedangkan catatan kaki menjaga keluasan maknanya.
- source_word: לַבִּינָה
  choice: pengertian
  rationale: בִּינָה dalam Amsal menunjuk pada kemampuan memahami atau membedakan. “Pengertian” menjaga pasangan leksikalnya dengan “hikmat” dan mudah dipahami pembaca modern.
- source_word: תִקְרָא
  choice: sebutlah ... sebagai
  rationale: Bentuk imperfek orang kedua tunggal ini mempunyai daya direktif yang meneruskan imperatif pertama. Dalam konstruksi predikatif bahasa Indonesia, “sebutlah ... sebagai” menyampaikan arti ‘panggil/namai sebagai’ secara alami.
