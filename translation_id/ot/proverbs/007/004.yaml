translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Personifikasi hikmat serta pengertian dan metafora kekeluargaan dipertahankan. “Engkau” dipakai dalam ujaran langsung untuk nada yang bermartabat, sedangkan struktur keseluruhan tetap alami bagi pembaca umum.
