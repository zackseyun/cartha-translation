translation:
  language: id
  text: Aku melihat di antara orang-orang naif; aku memperhatikan di antara para pemuda seorang anak muda yang kurang pengertian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kekurangan hati”; dalam ungkapan Ibrani ini, “hati” dapat menunjuk pada pengertian atau pertimbangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Aku melihat
  rationale: Bentuk wayyiqtol orang pertama tunggal dari ראה menyatakan pengamatan dalam rangkaian narasi. "Aku melihat" lugas dan alami dalam bahasa Indonesia.
- source_word: בַפְּתָאיִם
  choice: di antara orang-orang yang tidak berpengalaman
  rationale: פְּתָאיִם menunjuk kepada golongan orang polos atau naif yang mudah dipengaruhi dalam sastra hikmat. Pilihan ini menyampaikan ketidakmatangan mereka tanpa menyiratkan kekurangan intelektual bawaan.
- source_word: אָבִינָה
  choice: aku mengamati
  rationale: Bentuk dari בין membawa nuansa memahami atau membedakan dengan cermat. Dalam konteks pengamatan ini, "mengamati" membedakannya dari sekadar "melihat" dan terdengar wajar dalam bahasa Indonesia.
- source_word: בַבָּנִים
  choice: di antara anak-anak muda
  rationale: Secara harfiah berarti "di antara anak-anak lelaki/putra-putra", tetapi konteksnya menunjuk kepada sekelompok laki-laki muda. "Anak-anak muda" menyampaikan maksud kontekstual secara alami.
- source_word: נַעַר
  choice: seorang pemuda
  rationale: נַעַר dapat berarti anak lelaki atau laki-laki muda. Tokoh ini cukup dewasa untuk berjalan sendiri di jalan, sehingga "pemuda" sesuai dengan rentang usia yang tersirat.
- source_word: חֲסַר לֵב
  choice: kurang berakal
  rationale: Ungkapan ini secara harfiah berarti "kekurangan hati"; dalam pemakaian hikmat Ibrani, לֵב mencakup pengertian, pertimbangan, dan kepekaan moral. "Kurang berakal" mempertahankan nuansa penilaian yang buruk tanpa menerjemahkan idiom secara kaku.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada sastra hikmat yang lugas dan bermartabat. Kesejajaran antara "melihat" dan "mengamati" dipertahankan, sementara idiom Ibrani dijelaskan dalam catatan kaki.
