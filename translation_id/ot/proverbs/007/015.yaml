  text: Therefore I came out to meet you[a], to seek your face, and I have found you.
translation:
  language: id
  text: Itulah sebabnya aku keluar untuk menemuimu, untuk mencari[a] wajahmu, dan aku menemukanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mencarimu sejak pagi” atau “mencarimu dengan sungguh-sungguh”; kata kerja Ibrani ini dapat menyiratkan pencarian sejak dini atau dengan tekun.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Ungkapan ini menyatakan alasan tindakan perempuan tersebut. Pilihan ini alami dalam bahasa Indonesia modern dan tetap mempertahankan hubungan sebab-akibat.
- source_word: יָצָאתִי
  choice: aku keluar
  rationale: Kata kerja ini berarti keluar atau pergi keluar. Dalam ujaran langsung ini, 'aku keluar' menyampaikan gerakan sang pembicara dengan jelas.
- source_word: לִקְרָאתֶךָ
  choice: untuk menemuimu
  rationale: Konstruksi ini lazim berarti pergi menyongsong atau menemui seseorang; 'menemuimu' merupakan padanan Indonesia yang alami dan tepat.
- source_word: לְשַׁחֵר
  choice: untuk mencari
  rationale: Kata kerja ini menyatakan pencarian yang dapat bernuansa dilakukan sejak dini atau dengan sungguh-sungguh. Teks utama mempertahankan arti intinya, sedangkan nuansanya dicatat dalam catatan kaki.
- source_word: פָּנֶיךָ
  choice: wajahmu
  rationale: Secara harfiah berarti 'wajahmu'. Ungkapan konkret ini dipertahankan karena dapat dipahami dalam konteks dan menjaga gaya serta ketegasan personal bahasa Ibrani.
- source_word: וָאֶמְצָאֶךָּ
  choice: dan aku telah menemukanmu
  rationale: Bentuk ini melanjutkan tindakan dengan arti 'dan aku menemukanmu'. Bentuk 'telah menemukanmu' menonjolkan hasil yang kini tercapai dalam perjumpaan tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Pronomina akrab 'aku' dan '-mu' sesuai dengan ujaran langsung yang bersifat pribadi. Ungkapan harfiah 'mencari wajahmu' dipertahankan, dengan ambiguitas leksikal kata kerja dijelaskan dalam catatan kaki.
