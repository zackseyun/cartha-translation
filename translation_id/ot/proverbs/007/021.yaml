- from: Dengan banyak bujuk rayunya ia membuat pemuda itu menyimpang[a]; dengan bibirnya yang licin ia menyeretnya.
  to: Dengan banyak rayuannya ia membujuknya[a]; dengan kelicinan bibirnya ia mendesaknya.
  rationale: Revisi menghilangkan nomina yang tidak dinyatakan dalam ayat sumber, memakai «membujuk» sebagai padanan utama yang alami untuk הִטַּתּוּ dalam konteks rayuan, dan mengganti «menyeret» dengan «mendesak» untuk mempertahankan kekuatan verbal תַּדִּיחֶנּוּ tanpa menyiratkan seretan fisik atau paksaan mutlak. Metafora «kelicinan bibirnya» dipertahankan.
