  text: הִ֭טַּתּ/וּ בְּ/רֹ֣ב לִקְחָ֑/הּ בְּ/חֵ֥לֶק שְׂ֝פָתֶ֗י/הָ תַּדִּיחֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/021.yaml
  text: She persuades him with her abundant persuasion[a]; with the smoothness of her lips she compels him.
translation:
  language: id
  text: Dengan banyak rayuannya ia membujuknya[a]; dengan kelicinan bibirnya ia mendesaknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dengan banyak rayuannya ia menyesatkannya; dengan kelicinan bibirnya ia mendorongnya terus.”'
    reason: Alternatif ini mencerminkan kemungkinan bahwa הִטַּתּוּ menekankan tindakan membelokkan atau menyesatkan, dan bahwa תַּדִּיחֶנּוּ melukiskan dorongan atau desakan yang menggerakkan orang itu maju.
lexical_decisions:
- source_word: הִטַּתּוּ
  choice: ia membuat pemuda itu menyimpang
  rationale: Bentuk Hifil dari נטה menyatakan tindakan menyebabkan objek berbelok atau menyimpang. Terjemahan ini mempertahankan unsur kausatif dan arah moral yang tersirat dalam konteks, tanpa mempersempitnya menjadi tindakan seksual.
- source_word: בְּרֹב לִקְחָהּ
  choice: dengan banyak bujuk rayunya
  rationale: רֹב berarti banyak atau berlimpah, sedangkan לֶקַח di sini menunjuk pada wacana persuasif. 'Banyak bujuk rayunya' alami dalam bahasa Indonesia dan sesuai dengan konteks rayuan.
- source_word: בְּחֵלֶק שְׂפָתֶיהָ
  choice: dengan bibirnya yang licin
  rationale: Terjemahan ini mempertahankan citra konkret 'bibir' serta metafora kelicinan dalam חֵלֶק. Dalam bahasa Indonesia, ungkapan tersebut menyiratkan kata-kata yang mulus dan menyanjung.
- source_word: תַּדִּיחֶנּוּ
  choice: ia menyeretnya
  rationale: Hifil נדח dapat berarti mendorong, menghalau, atau membuat bergerak menyimpang. 'Menyeretnya' menyampaikan daya desak yang kuat dan gerak menuju jalan yang salah tanpa menyatakan bahwa kehendaknya sama sekali ditiadakan.
theological_decisions:
- issue: Tingkat paksaan dalam תַּדִּיחֶנּוּ
  choice: ia menyeretnya
  alternative: ia memaksanya
  rationale: Kata Ibrani menggambarkan dorongan kuat atau penghalauan, tetapi tidak harus berarti paksaan mutlak. 'Menyeretnya' menjaga ketegangan antara pengaruh kuat perempuan itu dan tanggung jawab pemuda tersebut.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan mudah dipahami. 'Pemuda itu' dipakai pada penyebutan pertama agar objek pronominal jelas dalam konteks ayat tunggal; 'bibirnya yang licin' mempertahankan metafora Ibrani.
