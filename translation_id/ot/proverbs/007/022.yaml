  yaml_path: translation/ot/proverbs/007/022.yaml
  text: He goes after her at once[a], like an ox going to the slaughter, and like a fetter to the discipline of a fool.
translation:
  language: id
  text: Seketika itu juga ia mengikuti perempuan itu, seperti lembu yang menuju penyembelihan, dan seperti belenggu menuju didikan seorang bodoh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baris kedua dalam teks Ibrani sulit dipahami. Secara harfiah, bunyinya kira-kira, “dan seperti belenggu menuju didikan seorang bodoh.” Kata yang diterjemahkan “belenggu” dapat dipahami secara berbeda. Karena itu, sebagian menerjemahkan bagian ini kira-kira, “seperti rusa yang melangkah ke dalam jerat,” atau “seperti belenggu untuk didikan seorang bodoh.”
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלֵךְ אַחֲרֶיהָ
  choice: mengikuti perempuan itu
  rationale: Bentuk partisip Qal menggambarkan tindakannya secara hidup. Dalam konteks ini, ungkapan harfiah 'berjalan di belakangnya' secara idiomatis berarti mengikuti perempuan tersebut.
- source_word: פִּתְאֹם
  choice: segera
  rationale: Kata keterangan ini menandai tindakan mendadak dan tanpa pertimbangan. 'Segera' menyampaikan kepatuhan spontan dengan bahasa Indonesia yang alami.
- source_word: כְּשׁוֹר אֶל טָבַח יָבֹא
  choice: seperti lembu yang menuju penyembelihan
  rationale: Terjemahan ini mempertahankan gambaran seekor lembu yang bergerak tanpa menyadari bahwa tujuannya adalah kematian.
- source_word: וּכְעֶכֶס
  choice: dan seperti orang bodoh yang terbelenggu
  rationale: עֶכֶס sulit dipastikan artinya; kemungkinan berkaitan dengan belenggu atau gelang kaki. Susunan Indonesia ini menghasilkan perbandingan yang dapat dipahami, tetapi ketidakpastian teks tetap dijelaskan dalam catatan kaki.
- source_word: אֶל מוּסַר אֱוִיל
  choice: menuju hukuman
  rationale: מוּסָר dapat berarti didikan, koreksi, atau hukuman. Dalam konteks orang yang sedang menuju akibat fatal, 'hukuman' paling alami, sementara hubungan sintaksisnya dengan 'orang bodoh' tetap diakui sebagai bagian dari kesulitan baris ini.
