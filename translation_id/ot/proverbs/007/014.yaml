source:
  edition: WLC
  text: זִבְחֵ֣י שְׁלָמִ֣ים עָלָ֑/י הַ֝/יּ֗וֹם שִׁלַּ֥מְתִּי נְדָרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/014.yaml
  text: Peace offerings were due from me[a]; today I have paid my vows.
translation:
  language: id
  text: Aku wajib mempersembahkan kurban keselamatan[a]; hari ini aku telah menunaikan nazar-nazarku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “kurban persekutuan.” Istilah Ibrani menunjuk pada kurban damai atau kesejahteraan; sesudah dipersembahkan, sebagian dagingnya dapat dimakan oleh orang yang mempersembahkannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִבְחֵי שְׁלָמִים
  choice: kurban keselamatan
  rationale: Frasa ini menunjuk pada kurban syukur atau kesejahteraan yang sebagian dagingnya dapat dimakan oleh orang yang mempersembahkannya. “Kurban keselamatan” mempertahankan istilah kultis dan kaitannya dengan makna damai atau sejahtera.
- source_word: עָלַי
  choice: aku wajib mempersembahkan
  rationale: Secara harfiah berarti “atas aku,” tetapi dalam konteks nazar menyatakan kewajiban yang menjadi tanggungan si pembicara. Ungkapan Indonesia ini menyampaikan fungsi idiomatisnya tanpa mengaburkan konteks persembahan.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Padanan temporal yang langsung, alami, dan tepat dalam bahasa Indonesia modern.
- source_word: שִׁלַּמְתִּי
  choice: aku telah menunaikan
  rationale: Dalam konstruksi dengan nazar, bentuk Piel dari שׁלם berarti memenuhi atau menunaikan kewajiban nazar. “Telah menunaikan” menyatakan tindakan yang sudah selesai dan lebih alami daripada “membayar nazar.”
- source_word: נְדָרָי
  choice: nazar-nazarku
  rationale: Bentuk Ibrani ini jamak dengan akhiran orang pertama tunggal. Bentuk ulang mempertahankan jumlah jamak dan jelas bagi pembaca Indonesia.
theological_decisions:
- issue: Istilah ibadah dalam perkataan perempuan yang menggoda
  choice: Mempertahankan bahasa eksplisit tentang kurban dan nazar tanpa menambahkan penilaian moral dalam ayat.
  alternative: Memparafrasakannya sebagai pernyataan bahwa ia mempunyai makanan atau daging di rumah.
  rationale: Teks sengaja menempatkan bahasa ibadah yang sah di dalam bujukan perempuan itu. Terjemahan perlu mempertahankan ketegangan tersebut dan tidak mengubahnya menjadi keterangan umum tentang makanan.
- issue: Makna עָלַי dalam konteks kurban nazar
  choice: Menyatakannya sebagai kewajiban untuk mempersembahkan kurban.
  alternative: Menerjemahkannya sebagai “ada padaku,” yakni kurban atau daging kurban tersedia bersamanya.
  rationale: Preposisi tersebut secara idiomatis dapat menandai kewajiban yang menjadi tanggungan seseorang, dan klausa berikutnya menjelaskan bahwa nazar itu telah ditunaikan hari itu. Pilihan ini mengikuti hubungan antarklausa tanpa memasukkan “daging” yang tidak disebut secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Menunaikan nazar” merupakan ungkapan alami dalam konteks keagamaan, sedangkan “kurban keselamatan” mempertahankan istilah teknis tanpa membuat kalimat terlalu berat.
