  text: Jangan biarkan hatimu menyimpang ke jalan-jalannya; jangan tersesat di lintasan-lintasannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵשְׂטְ
  choice: menyimpang
  rationale: Bentuk larangan ini menyatakan berbelok atau menyimpang dari arah yang benar; padanan ini alami sekaligus mempertahankan gambaran arah moral.
- source_word: דְּרָכֶיהָ
  choice: jalan-jalannya
  rationale: Bentuk jamak dengan pronomina feminin merujuk kepada jalan atau cara perempuan yang dibicarakan dalam konteks.
- source_word: תֵּתַע
  choice: tersesat
  rationale: Kata ini dapat berarti mengembara, menyimpang, atau tersesat. 'Tersesat' mempertahankan bahaya kehilangan arah tanpa menambahkan gagasan yang tidak terdapat dalam teks.
- source_word: בִּנְתִיבוֹתֶיהָ
  choice: di lorong-lorongnya
  rationale: Istilah ini menunjuk jalur atau lintasan. 'Lorong-lorong' membedakannya dari דְּרָכֶיהָ dan mempertahankan paralelisme puitis.
