  text: He took a bag of money in his hand[a]; he will come home at the full moon.
translation:
  language: id
  text: Ia membawa sekantong uang di tangannya; ia akan pulang pada saat bulan purnama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada hari yang telah ditentukan”. Istilah Ibraninya sulit dipastikan dan juga dipahami oleh sebagian orang sebagai “bulan baru”, meskipun “bulan purnama” paling sesuai dengan konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: צְרוֹר
  choice: sekantong
  rationale: Kata ini menunjuk pada sesuatu yang diikat atau dibungkus, dan dalam konteks ini berarti kantong uang. Bentuk “sekantong” alami dalam bahasa Indonesia dan menyatu dengan kata “uang”.
- source_word: הַכֶּסֶף
  choice: uang
  rationale: Walaupun arti dasarnya adalah “perak”, kata ini kerap dipakai secara metonimis untuk uang. Konteks perjalanan mendukung makna tersebut.
- source_word: לָקַח בְּיָדוֹ
  choice: membawa
  rationale: Ungkapan Ibrani harfiahnya berarti “mengambil di tangannya”, tetapi di sini maksud alaminya ialah membawa sesuatu sebagai bekal perjalanan. “Membawa” menyampaikan makna itu tanpa ungkapan Indonesia yang kaku.
- source_word: לְיוֹם הַכֵּסֶא
  choice: pada waktu bulan purnama
  rationale: Frasa ini menunjukkan waktu kepulangan. הַכֵּסֶא paling mungkin mengacu pada bulan purnama, tetapi maknanya diperdebatkan; karena itu alternatifnya dicatat dalam catatan kaki.
- source_word: יָבֹא בֵיתוֹ
  choice: ia akan pulang
  rationale: Secara harfiah frasa ini berarti “ia akan datang ke rumahnya”. “Ia akan pulang” merupakan padanan Indonesia yang alami dan tepat dalam konteks.
