  text: pada senja, pada petang hari, di pekatnya malam dan kegelapan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֶשֶׁף
  choice: waktu senja
  rationale: Dalam konteks rangkaian menuju malam, kata ini menunjuk pada cahaya redup saat peralihan dari petang ke malam. 'Waktu senja' alami dalam bahasa Indonesia dan tidak mempersempit maknanya secara berlebihan.
- source_word: עֶרֶב יוֹם
  choice: ketika hari menjelang petang
  rationale: Ungkapan ini mempertahankan kedua unsur, 'hari' dan 'petang', sekaligus menyampaikan gerak waktu menuju malam dengan bahasa Indonesia yang wajar.
- source_word: אִישׁוֹן לַיְלָה
  choice: dalam pekatnya malam
  rationale: Secara harfiah אִישׁוֹן berkaitan dengan pupil mata, tetapi dalam ungkapan ini menunjuk pada bagian malam yang paling gelap. 'Pekatnya malam' menyampaikan idiom itu secara jelas tanpa terjemahan harfiah yang kabur.
- source_word: וַאֲפֵלָה
  choice: dan kegelapan
  rationale: Pilihan ini mempertahankan penumpukan gambaran gelap dalam teks Ibrani tanpa menambahkan intensitas yang tidak perlu setelah 'pekatnya malam'.
- source_word: בְּ ... בְּ ... בְּ
  choice: pada ... ketika ... dalam ...
  rationale: Preposisi Ibrani yang berulang menandai tahapan waktu. Variasi ini menghasilkan bahasa Indonesia yang alami sambil mempertahankan perkembangan bertahap dari senja menuju malam yang gelap.
