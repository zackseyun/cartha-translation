translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Paralelisme ajakan dipertahankan dengan pengulangan “biarlah kita”, sedangkan metafora minum dalam baris pertama tetap dibuat hidup. Tidak diperlukan catatan kaki karena nuansa erotis kedua nomina dapat disampaikan secara wajar dalam teks utama.
