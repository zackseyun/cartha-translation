  - severity: low
    issue: “Mereguk” kurang alami daripada “meneguk” dalam kolokasi metaforis ini.
    rationale: “Meneguk cinta sampai puas” tetap puitis dan sensual, tetapi lebih idiomatis serta jelas sebagai pelestarian metafora minum.
