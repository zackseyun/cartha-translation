  text: Come[a], let us drink our fill of love until morning[b]; let us delight ourselves with love.
translation:
  language: id
  text: Mari, kita meneguk cinta sampai puas hingga pagi; mari kita menikmati kemesraan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכָה
  choice: Mari
  rationale: Bentuk imperatif dari הלך dipakai secara idiomatis sebagai ajakan. “Mari” paling alami dalam bahasa Indonesia dan sesuai dengan nada rayuan dalam konteks.
- source_word: נִרְוֶה
  choice: biarlah kita mereguk ... sepuas-puasnya
  rationale: Kata רוה berarti minum sampai puas atau menjadi kenyang/jenuh. Ungkapan ini mempertahankan metafora minum sekaligus terdengar alami dan sensual dalam bahasa Indonesia.
- source_word: דֹדִים
  choice: cinta
  rationale: Dalam konteks erotis, bentuk jamak ini dapat menunjuk pada cinta, kemesraan, atau ungkapan kasih secara fisik. “Cinta” mempertahankan keluasan makna tanpa memperjelasnya melebihi teks.
- source_word: עַד הַבֹּקֶר
  choice: sampai pagi
  rationale: Padanan temporal yang langsung, alami, dan tepat.
- source_word: נִתְעַלְּסָה
  choice: biarlah kita menikmati
  rationale: Bentuk hitpael dari עלס menyatakan bersenang-senang atau menikmati kenikmatan. “Menikmati” menyampaikan kesenangan bersama secara alami tanpa menjadi kasar.
- source_word: בָּאֳהָבִים
  choice: belaian cinta
  rationale: Bentuk jamak dari akar אהב dalam konteks ini menunjuk pada ungkapan cinta yang erotis. “Belaian cinta” konkret dan sensual, tetapi tetap santun serta tidak mempersempitnya menjadi istilah seksual yang terlalu eksplisit.
