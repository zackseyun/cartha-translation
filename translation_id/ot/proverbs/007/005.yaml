  text: to keep you from the forbidden woman[a], from the foreign woman whose words are smooth.
translation:
  language: id
  text: 'untuk menjagamu dari perempuan terlarang,

    dari perempuan asing yang berkata-kata manis.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang merayu dengan kata-katanya” atau “yang kata-katanya menyanjung.” Secara harfiah, bahasa Ibrani berbunyi “telah membuat kata-katanya licin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמָרְךָ
  choice: untuk menjagamu
  rationale: Infinitif dengan prefiks ל menyatakan tujuan yang berkaitan dengan ayat sebelumnya. “Menjagamu” mempertahankan makna perlindungan dari akar שׁמר dan terdengar alami dalam bahasa Indonesia.
- source_word: מֵאִשָּׁה זָרָה
  choice: dari perempuan terlarang
  rationale: זָרָה secara dasar berarti “asing” atau “bukan milik sendiri,” tetapi dalam konteks Amsal menunjuk kepada perempuan yang berada di luar batas hubungan seksual yang sah. “Perempuan terlarang” menyampaikan daya moral ungkapan itu tanpa memakai frasa “perempuan aneh” yang menyesatkan.
- source_word: מִנָּכְרִיָּה
  choice: dari perempuan asing
  rationale: נָכְרִיָּה lebih langsung berarti perempuan asing atau orang luar. Pilihan ini mempertahankan perbedaan leksikal antara זָרָה dan נָכְרִיָּה dalam paralelisme Ibrani, tanpa memastikan bahwa yang dimaksud semata-mata kebangsaan.
- source_word: אֲמָרֶיהָ
  choice: kata-katanya
  rationale: Bentuk jamak berkonstruksi ini berarti “perkataan-perkataannya” atau “kata-katanya.” Bentuk “kata-katanya” paling alami dalam bahasa Indonesia.
- source_word: הֶחֱלִיקָה
  choice: melicinkan
  rationale: Bentuk Hifil dari חלק secara harfiah berarti “membuat licin” dan di sini menggambarkan perkataan yang halus serta merayu. “Melicinkan” mempertahankan metafora sumber dan ambiguitas antara tutur yang memikat dan sanjungan yang menipu.
theological_decisions:
- issue: Identitas “perempuan asing”
  choice: Mempertahankan sebutan “perempuan asing” tanpa membatasinya pada etnis atau kebangsaan tertentu.
  alternative: Menerjemahkannya sebagai “perempuan pezina” atau “perempuan jalang.”
  rationale: Teks memakai istilah yang dapat berarti orang luar dan dalam konteks Amsal berfungsi secara moral-relasional. Menentukan secara eksplisit bahwa ia pezina atau mengaitkannya hanya dengan etnis akan mempersempit ungkapan Ibrani.
translation_notes:
  register: Bahasa modern, ringkas, dan bermartabat. Paralelisme dua baris dipertahankan. Metafora “melicinkan kata-kata” sengaja dipertahankan dalam teks utama, sedangkan makna rayuan atau sanjungan dijelaskan dalam catatan kaki.
