base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/006.yaml
  text: For at the window of my house[a], through my lattice, I looked out,
translation:
  language: id
  text: 'Sebab dari jendela rumahku,

    melalui kisi-kisiku, aku memandang ke luar,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan dasar penjelasan atau adegan yang mendukung perkataan selanjutnya; “Sebab” mempertahankan hubungan wacana tanpa menjadikannya kausal secara berlebihan.
- source_word: בְּחַלּוֹן בֵּיתִי
  choice: dari jendela rumahku
  rationale: חַלּוֹן berarti “jendela,” sedangkan בְּ dalam konteks tindakan melihat menyatakan tempat atau titik pandang. “Dari jendela rumahku” alami dalam bahasa Indonesia dan memperjelas posisi pengamat tanpa menambah isi.
- source_word: בְּעַד
  choice: melalui
  rationale: Menandai pandangan yang menembus atau berasal dari balik sebuah bukaan; “melalui” mempertahankan gambaran visual tersebut.
- source_word: אֶשְׁנַבִּי
  choice: kisi-kisiku
  rationale: אֶשְׁנָב menunjuk pada bukaan berjaring atau berkisi. “Kisi-kisiku” mempertahankan citra konkret dan membedakannya dari חַלּוֹן, “jendela.”
- source_word: נִשְׁקָפְתִּי
  choice: aku memandang ke luar
  rationale: Bentuk verba ini menyatakan tindakan melihat ke luar atau ke bawah dari suatu titik pandang. “Memandang ke luar” jelas, wajar, dan tidak menambahkan intensitas seperti “mengintip.”
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan dua baris mempertahankan paralelisme gambaran Ibrani serta pembedaan antara jendela dan kisi-kisi. Tidak diperlukan catatan kaki karena padanan “kisi-kisi” dapat menyampaikan arti אֶשְׁנָב secara langsung.
