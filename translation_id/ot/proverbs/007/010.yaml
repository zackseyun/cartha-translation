base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/010.yaml
  text: And look—a woman came to meet him[a], dressed like a prostitute and cunning of heart.
translation:
  language: id
  text: Dan lihatlah, seorang perempuan datang menemuinya, berpakaian seperti pelacur dan menyimpan rahasia dalam hatinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berhati licik,” “penuh rahasia,” atau “menyembunyikan niat dalam hatinya.” Secara harfiah, bahasa Ibraninya menggambarkan hati yang dijaga atau tertutup, sehingga dapat menyiratkan maksud yang tidak tersingkap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Dan lihatlah
  rationale: Memperkenalkan adegan secara hidup dan langsung; bentuk ini alami dalam bahasa Indonesia serta mempertahankan daya deiktis ungkapan Ibrani.
- source_word: אִשָּׁה
  choice: seorang perempuan
  rationale: Konteks menyebut sosok perempuan yang belum dikenali; padanan ini paling wajar tanpa menyiratkan bahwa ia adalah istri.
- source_word: לִקְרָאתוֹ
  choice: datang menyongsong dia
  rationale: Mengungkapkan gerak mendekat untuk berjumpa secara langsung, sesuai idiom Ibrani dan konteks naratif.
- source_word: שִׁית זוֹנָה
  choice: berpakaian seperti pelacur
  rationale: Mengungkapkan pakaian atau penampilan khas pelacur dalam bahasa Indonesia masa kini tanpa memakai istilah arkais atau lebih kasar.
- source_word: וּנְצֻרַת לֵב
  choice: berhati tertutup
  rationale: Mempertahankan citra dasar dari akar נצר, yaitu dijaga atau tertutup, sekaligus membiarkan konteks menyiratkan maksud yang disembunyikan tanpa langsung menafsirkannya sebagai kelicikan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Lihatlah” menjaga ketajaman pembukaan adegan; “pelacur” merupakan istilah kontemporer yang jelas. Ungkapan “berhati tertutup” sengaja mempertahankan metafora serta ambiguitas leksikal teks Ibrani, dengan kemungkinan makna kontekstual dijelaskan dalam catatan kaki.
