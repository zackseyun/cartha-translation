review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the woman’s approach, her prostitute-like attire, and the imagery of a guarded/concealed heart. However, Indonesian “berhati tertutup” normally means emotionally closed or unreceptive, which does not reliably convey the Hebrew expression’s sense of concealed intentions and its possible implication of craftiness.
  naturalness: “Datang menyongsong dia” is understandable but somewhat elevated and less natural in current narrative Indonesian than “datang menemuinya.” “Menyimpan rahasia dalam hatinya” is clear, idiomatic, and retains the source’s image without forcing the stronger interpretation “licik” into the main text.
  terminology: “Perempuan” and “pelacur” are appropriate modern-standard terms. The proposed rendering for נְצֻרַת לֵב preserves its semantic openness in the text, while the note records the contextual alternatives.
  issues:
  - severity: medium
    issue: “Berhati tertutup” is misleading in Indonesian.
    rationale: In contemporary Indonesian it commonly describes emotional reserve or unwillingness to open oneself, rather than a heart guarded so as to conceal plans or intentions. This weakens source fidelity for נְצֻרַת לֵב.
  - severity: low
    issue: “Datang menyongsong dia” is more formal than needed.
    rationale: It is not incorrect, but “datang menemuinya” is more idiomatic modern Indonesian and clearly expresses the direct encounter denoted by לִקְרָאתוֹ.
  revised_text: Dan lihatlah, seorang perempuan datang menemuinya, berpakaian seperti pelacur dan menyimpan rahasia dalam hatinya.[a]
