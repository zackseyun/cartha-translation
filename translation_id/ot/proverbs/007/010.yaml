revisions:
- from: Dan lihatlah, seorang perempuan datang menyongsong dia, berpakaian seperti pelacur dan berhati tertutup.[a]
  to: Dan lihatlah, seorang perempuan datang menemuinya, berpakaian seperti pelacur dan menyimpan rahasia dalam hatinya.[a]
  rationale: The revision replaces an Indonesian expression whose usual sense is emotional closedness with a natural expression for concealed inward intentions. It retains the Hebrew image and ambiguity in the main text and leaves the contextual implication of craftiness to the footnote. The approach verb is also made more idiomatic without changing the meaning.
