  text: until an arrow pierces his liver[a], like a bird rushing into a snare, and he does not know that it will cost him his life.
translation:
  language: id
  text: sampai anak panah menembus hatinya, seperti burung yang bergegas masuk ke dalam jerat, dan ia tidak menyadari bahwa hal itu akan merenggut nyawanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bahwa itu bagi/terhadap nyawanya.” Ungkapan Ibrani ini eliptis; dalam konteksnya, jalan yang ditempuhnya berakhir dengan kehilangan nyawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: sampai
  rationale: Penanda waktu ini meneruskan gambaran pada ayat sebelumnya hingga mencapai akibat yang mematikan.
- source_word: יְפַלַּח
  choice: menembus
  rationale: Bentuk Piel dari פלח menggambarkan penetrasi yang kuat; “menembus” alami dalam bahasa Indonesia dan sesuai dengan gambaran anak panah yang masuk ke tubuh.
- source_word: חֵץ
  choice: anak panah
  rationale: Padanan baku bagi proyektil yang dimaksud.
- source_word: כְּבֵדוֹ
  choice: hatinya
  rationale: כָּבֵד secara konkret berarti organ hati. “Hatinya” mempertahankan bagian tubuh dalam citra Ibrani, meskipun dalam bahasa Indonesia kata ini juga memiliki makna kiasan.
- source_word: כְמַהֵר צִפּוֹר
  choice: seperti burung yang bergegas
  rationale: Ungkapan ini menyampaikan gerakan cepat dan tanpa kewaspadaan; “bergegas” tetap wajar sekaligus bermartabat.
- source_word: אֶל־פָּח
  choice: menuju jerat
  rationale: פָּח adalah jerat atau perangkap, khususnya bagi burung. “Menuju jerat” mempertahankan arah gerak yang dinyatakan oleh אֶל.
- source_word: וְלֹא יָדַע
  choice: tanpa menyadari
  rationale: Merupakan ungkapan Indonesia yang alami untuk ketidaktahuan akan bahaya yang sedang dihadapi; subjeknya sengaja tidak dinyatakan ulang sehingga hubungan dengan pemuda maupun burung tetap terbuka.
- source_word: כִּי בְנַפְשׁוֹ הוּא
  choice: bahwa nyawanya menjadi taruhan
  rationale: Ungkapan Ibrani ini eliptis, secara harfiah kira-kira “bahwa itu bagi/terhadap nyawanya.” Pilihan ini menyampaikan bahwa tindakannya membahayakan hidupnya tanpa mempersempitnya menjadi rumusan yang terlalu eksplisit.
theological_decisions:
- issue: Rujukan subjek dalam וְלֹא יָדַע
  choice: 'Subjek tidak diulang dalam terjemahan: “tanpa menyadari”'
  alternative: “dan ia tidak menyadari” atau secara eksplisit “burung itu tidak menyadari”
  rationale: Bahasa Ibrani memakai bentuk maskulin tunggal yang dapat meneruskan pemuda atau, dalam bingkai perumpamaan, burung. Struktur Indonesia tanpa subjek eksplisit mempertahankan hubungan retoris dan ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bernada hikmat. Citra konkret “anak panah,” “hati,” dan “jerat” dipertahankan. Frasa “nyawanya menjadi taruhan” dipilih sebagai ungkapan alami untuk klausa Ibrani yang eliptis, sementara konstruksi “tanpa menyadari” menjaga kemungkinan bahwa ketidaktahuan itu berlaku sekaligus pada burung dalam perumpamaan dan pemuda yang digambarkan.
