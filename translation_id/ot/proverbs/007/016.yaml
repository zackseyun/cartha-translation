translation:
  language: id
  text: Aku telah menghampari tempat tidurku dengan kain-kain penutup[a], dengan kain lenan Mesir yang bercorak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan karya berukir, dengan kain lenan dari Mesir.” Istilah-istilah Ibrani untuk penutup bercorak dan bahan dari Mesir ini langka; keduanya mungkin secara lebih khusus menunjuk pada tekstil berhias atau bersulam.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְבַדִּים
  choice: kain-kain penutup
  rationale: Nomina jamak ini menunjuk pada penutup atau hamparan hias. Pilihan ini cukup luas untuk mempertahankan nuansa dekoratif tanpa menentukannya sebagai permadani lantai.
- source_word: רָבַדְתִּי
  choice: Aku telah membentangkan
  rationale: Verba ini berarti menghamparkan atau menata berlapis-lapis; bentuk 'telah' menyatakan persiapan yang sudah selesai.
- source_word: עַרְשִׂי
  choice: tempat tidurku
  rationale: Kata ini dapat berarti ranjang atau dipan. 'Tempat tidurku' alami dalam bahasa Indonesia dan sesuai dengan konteks rayuan.
- source_word: חֲטֻבוֹת
  choice: berwarna-warni
  rationale: Istilah jamak yang langka ini dalam konteks tekstil kemungkinan menunjuk pada bahan berhias, bercorak, atau dikerjakan secara dekoratif. Karena maknanya tidak pasti, alternatif dicatat dalam catatan kaki.
- source_word: אֵטוּן
  choice: kain lenan
  rationale: Istilah tekstil langka ini dapat dipahami sebagai benang, lenan, atau kain halus. 'Kain lenan' menghasilkan ungkapan Indonesia yang wajar, tetapi ketidakpastian leksikal tetap dinyatakan dalam catatan kaki.
- source_word: מִצְרָיִם
  choice: dari Mesir
  rationale: Terjemahan langsung ini mempertahankan asal bahan sebagai barang mewah impor tanpa mengubahnya menjadi adjektiva.
