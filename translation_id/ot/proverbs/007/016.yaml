  naturalness: “Aku telah membentangkan kain-kain penutup di tempat tidurku” dapat dipahami, tetapi “menghampari tempat tidurku dengan …” lebih idiomatis untuk tindakan menata penutup pada ranjang. “Kain lenan Mesir yang bercorak” juga lebih lancar daripada konstruksi berulang “dengan …, dengan …”.
