  yaml_path: translation/ot/proverbs/007/011.yaml
  text: She is loud and rebellious; her feet do not stay at home.
translation:
  language: id
  text: Ia gaduh dan suka memberontak; kakinya tidak menetap di rumahnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֹמִיָּה
  choice: ribut
  rationale: Partisip feminin ini menggambarkan orang yang gaduh atau riuh. “Ribut” alami dalam bahasa Indonesia dan mempertahankan penilaian negatif dalam konteks.
- source_word: וְסֹרָרֶת
  choice: dan suka memberontak
  rationale: Bentuk feminin dari סרר menyatakan sikap membangkang atau tidak tunduk. “Suka memberontak” menyampaikan kecenderungan yang melekat tanpa mempersempitnya pada jenis pemberontakan tertentu.
- source_word: בְּבֵיתָהּ לֹא יִשְׁכְּנוּ רַגְלֶיהָ
  choice: kakinya tidak betah di rumah
  rationale: Secara harfiah, kakinya tidak tinggal/menetap di rumahnya. Ungkapan idiomatis “tidak betah di rumah” mempertahankan citra kaki sekaligus menyampaikan bahwa ia terus berkeliaran.
