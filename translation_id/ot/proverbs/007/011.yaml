  source_fidelity: Teks Ibrani menyifatkan perempuan itu sebagai הֹמִיָּה, yakni gaduh/riuh, dan סֹרָרֶת, yakni keras kepala atau memberontak. Klausa terakhir secara harfiah menyatakan bahwa kakinya tidak menetap di rumahnya. Draf mempertahankan struktur dan citra kaki, tetapi “ribut” dapat berarti bertengkar atau menjadi persoalan, sedangkan “tidak betah” lebih menafsirkan perasaan daripada menyatakan tidak menetap.
