  yaml_path: translation/ot/proverbs/007/012.yaml
  text: In the street[a], now in the squares[b], and beside every corner she lies in wait.
translation:
  language: id
  text: Kadang di jalanan, kadang di lapangan-lapangan kota, dan di dekat setiap sudut ia mengintai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ia menunggu untuk menyergap.” Kata Ibrani ini menggambarkan tindakan menunggu secara tersembunyi dengan maksud menyergap.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעַם ... פַּעַם
  choice: kadang ... kadang
  rationale: Pengulangan פַּעַם menandai pergantian tempat. Bentuk “kadang ... kadang” mempertahankan pola berulang itu secara alami dalam bahasa Indonesia tanpa menambahkan kata temporal yang tidak ada dalam sumber.
- source_word: בַּחוּץ
  choice: di luar
  rationale: חוּץ menunjuk kawasan luar atau ruang publik. “Di luar” mempertahankan keluasan maknanya dan membedakannya dari lapangan-lapangan kota pada frasa berikut.
- source_word: בָּרְחֹבוֹת
  choice: di lapangan-lapangan kota
  rationale: Bentuk jamak רְחֹבוֹת merujuk pada ruang-ruang publik yang luas atau plaza di kota. “Lapangan-lapangan kota” jelas bagi pembaca Indonesia dan tidak mengulang gagasan jalan.
- source_word: וְאֵצֶל כָּל פִּנָּה
  choice: di dekat setiap sudut
  rationale: אֵצֶל menyatakan kedekatan, sedangkan פִּנָּה berarti sudut. Ungkapan ini tetap dekat dengan bentuk Ibrani dan wajar dalam konteks kota.
- source_word: תֶאֱרֹב
  choice: ia mengintai
  rationale: ארב menggambarkan tindakan menunggu secara tersembunyi dengan maksud menangkap atau menyergap. “Mengintai” menyampaikan nuansa diam-diam dan predatoris secara ringkas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pengulangan “kadang ... kadang” mempertahankan gerak berpindah-pindah dalam teks Ibrani. Pronomina “ia” mengikuti tokoh perempuan dalam konteks ayat-ayat sebelumnya.
