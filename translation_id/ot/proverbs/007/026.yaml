  text: For she has cast down many wounded[a], and all her slain are mighty.
translation:
  language: id
  text: 'Sebab, banyak orang terluka telah ia tumbangkan,

    dan semua orang yang dibunuhnya adalah orang-orang perkasa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan orang-orang yang dibunuhnya semuanya berjumlah banyak.” Kata Ibrani yang diterjemahkan “orang-orang perkasa” juga dapat menyatakan jumlah yang besar.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menjelaskan alasan bagi peringatan dalam konteks sebelumnya; “sebab” menyampaikan fungsi penjelas tersebut secara alami.
- source_word: רַבִּים
  choice: banyak
  rationale: Padanan kuantitatif yang langsung, wajar, dan ringkas.
- source_word: חֲלָלִים
  choice: orang terluka
  rationale: Kata ini dapat menunjuk kepada orang yang tertikam, terluka parah, atau terbunuh. “Orang terluka” mempertahankan kemungkinan perkembangan puitis menuju הֲרֻגֶיהָ, “orang yang dibunuhnya,” pada baris berikutnya.
- source_word: הִפִּילָה
  choice: telah dijatuhkannya
  rationale: Bentuk kausatif dari נפל menyatakan bahwa perempuan itu menyebabkan mereka jatuh. Bentuk ini ringkas dan mempertahankan gambaran para korban yang ditumbangkan.
- source_word: וַעֲצֻמִים
  choice: orang-orang perkasa
  rationale: עָצוּם dapat berarti kuat atau perkasa, tetapi dalam konteks tertentu juga dapat menyatakan jumlah yang besar. Teks utama mempertahankan gambaran mengejutkan bahwa bahkan orang perkasa menjadi korbannya, sementara kemungkinan makna kuantitatif dicatat dalam catatan kaki.
- source_word: כָּל
  choice: semua
  rationale: Menyampaikan cakupan universal kata Ibrani secara langsung.
- source_word: הֲרֻגֶיהָ
  choice: orang yang dibunuhnya
  rationale: 'Ungkapan ini menerjemahkan partisip pasif dengan sufiks feminin secara jelas dan alami: orang-orang yang dibunuh olehnya.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis yang tetap mudah dipahami. Akhiran -nya mempertahankan rujukan kepada perempuan dalam konteks. Kedua ketaksaan leksikal utama dipertahankan melalui catatan kaki tanpa memaksakan satu penafsiran.
