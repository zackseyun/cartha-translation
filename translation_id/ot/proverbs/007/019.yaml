  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan 'laki-laki itu' sengaja dipertahankan untuk mencerminkan ketidaklangsungan teks Ibrani, sementara catatan kaki menjelaskan rujukannya. 'Perjalanan jauh' mempertahankan unsur jarak dalam מֵרָחוֹק.
