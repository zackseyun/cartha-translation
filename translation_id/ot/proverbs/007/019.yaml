  text: כִּ֤י אֵ֣ין הָ/אִ֣ישׁ בְּ/בֵית֑/וֹ הָ֝לַ֗ךְ בְּ/דֶ֣רֶךְ מֵ/רָחֽוֹק׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/019.yaml
  text: For the man is not at his house[a]; he has gone on a journey far away.
translation:
  language: id
  text: Sebab laki-laki itu tidak ada di rumahnya[a]; ia telah pergi menempuh perjalanan jauh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “suamiku tidak ada di rumah.” Secara lebih harfiah, bahasa Ibrani berbunyi “laki-laki itu tidak ada di rumahnya,” suatu ungkapan tidak langsung yang dalam konteks ini mengacu kepada suaminya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi jaminan perempuan itu dalam konteks; mempertahankan hubungan sebab akibat secara alami dalam bahasa Indonesia.
- source_word: אֵין
  choice: tidak ada
  rationale: Dengan frasa nominal dan keterangan tempat berikutnya, bentuk ini menyatakan ketidakhadiran.
- source_word: הָאִישׁ
  choice: laki-laki itu
  rationale: Mempertahankan ungkapan Ibrani yang tidak langsung, secara harfiah 'laki-laki itu'; dalam konteks, yang dimaksud ialah suaminya.
- source_word: בְּבֵיתוֹ
  choice: di rumahnya
  rationale: Mempertahankan unsur tempat dan akhiran posesif orang ketiga tunggal dari teks sumber.
- source_word: הָלַךְ
  choice: ia telah pergi
  rationale: Bentuk qatal menyatakan tindakan keberangkatan yang sudah terjadi dan masih relevan karena ia tetap berada jauh dari rumah.
- source_word: בְּדֶרֶךְ
  choice: menempuh perjalanan
  rationale: Ungkapan dengan kata 'jalan' dalam konteks ini secara idiomatis berarti melakukan perjalanan.
- source_word: מֵרָחוֹק
  choice: jauh
  rationale: Menyampaikan gagasan jarak tanpa mengubahnya menjadi durasi perjalanan.
theological_decisions: []
