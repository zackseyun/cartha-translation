  text: דַּרְכֵ֣י שְׁא֣וֹל בֵּיתָ֑/הּ יֹ֝רְד֗וֹת אֶל חַדְרֵי מָֽוֶת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/027.yaml
  text: Her house is the way to Sheol[b][a], going down to the chambers of death.
translation:
  language: id
  text: Rumahnya adalah jalan-jalan menuju Syeol[a], yang menurun ke bilik-bilik maut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Syeol adalah alam orang mati; dapat juga diterjemahkan “kubur”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּרְכֵי
  choice: jalan-jalan
  rationale: Bentuk jamak konstruksi dipertahankan karena partisipel jamak יֹרְדוֹת selaras dengannya; bahasa Indonesia dapat memakai bentuk ulang ini secara wajar.
- source_word: שְׁאוֹל
  choice: Syeol
  rationale: Transliterasi mempertahankan konsep Ibrani tentang alam orang mati tanpa mempersempitnya menjadi kubur atau menyamakannya dengan doktrin neraka yang berkembang kemudian.
- source_word: בֵּיתָהּ
  choice: rumahnya
  rationale: Arti harfiah 'rumahnya' paling sesuai dengan konteks perempuan itu dan tempat yang dimasuki.
- source_word: יֹרְדוֹת
  choice: yang menurun
  rationale: Mempertahankan daya partisipel feminin jamak dan gambaran gerak ke bawah, dengan 'jalan-jalan' sebagai anteseden.
- source_word: חַדְרֵי מָוֶת
  choice: bilik-bilik maut
  rationale: '''Bilik-bilik'' mempertahankan bentuk jamak dan nuansa ruang bagian dalam; ''maut'' memberi nada puitis dan mengancam yang sesuai dengan ayat.'
theological_decisions:
- issue: Penerjemahan שְׁאוֹל
  choice: Syeol
  alternative: alam orang mati; kubur
  rationale: Syeol menunjuk pada ranah orang mati secara lebih luas daripada satu liang kubur. Transliterasi menjaga kekhasan konsep itu tanpa mengidentikkannya dengan neraka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis yang tetap mudah dipahami. Bentuk jamak Ibrani dipertahankan, dan 'bilik-bilik maut' menjaga paralelisme serta suasana suram ayat.
