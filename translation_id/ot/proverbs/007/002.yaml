id: PRO.7.2
reference: Proverbs 7:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שְׁמֹ֣ר מִצְוֺתַ֣/י וֶ/חְיֵ֑ה וְ֝/תוֹרָתִ֗/י כְּ/אִישׁ֥וֹן עֵינֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/002.yaml
  text: Keep my commandments and live[a], and my instruction as the pupil of your eye.
translation:
  language: id
  text: Jagalah perintah-perintahku dan hiduplah; jagalah ajaranku seperti biji matamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seperti pupil matamu.” Ungkapan Ibrani ini menggambarkan sesuatu yang harus dijaga dengan sangat hati-hati.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֹר
  choice: Jagalah
  rationale: Kata kerja שׁמר mencakup menjaga, memelihara, dan menaati. “Jagalah” mempertahankan unsur ketaatan sekaligus perhatian sungguh-sungguh, serta selaras dengan gambaran biji mata pada bagian akhir ayat.
- source_word: מִצְוֺתַי
  choice: perintah-perintahku
  rationale: Bentuk jamak dengan akhiran orang pertama tunggal diterjemahkan langsung dan wajar dalam bahasa Indonesia.
- source_word: וֶחְיֵה
  choice: dan hiduplah
  rationale: Bentuk imperatif dan susunan parataktis Ibrani dipertahankan. Terjemahan ini tidak memaksakan apakah hidup merupakan perintah lanjutan atau hasil yang tersirat.
- source_word: וְתוֹרָתִי
  choice: ajaranku
  rationale: Dalam konteks Amsal, תּוֹרָה menunjuk pada ajaran atau didikan hikmat sang penutur, bukan semata-mata hukum dalam arti perundang-undangan.
- source_word: כְּאִישׁוֹן עֵינֶיךָ
  choice: seperti biji matamu
  rationale: “Biji mata” adalah ungkapan Indonesia yang alami bagi pupil dan juga menyampaikan sesuatu yang dijaga dengan sangat hati-hati.
theological_decisions:
- issue: Makna תּוֹרָה dalam konteks sastra hikmat
  choice: ajaran
  alternative: hukum; pengajaran
  rationale: “Ajaran” mempertahankan cakupan didikan hikmat dalam konteks nasihat orang tua tanpa mempersempitnya menjadi hukum legal atau secara khusus menyamakannya dengan Taurat Musa.
- issue: Hubungan antara menaati perintah dan hidup
  choice: dan hiduplah
  alternative: supaya engkau hidup; maka engkau akan hidup
  rationale: Susunan koordinatif Ibrani dipertahankan agar nuansa antara perintah dan akibat tidak dipastikan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada nasihat hikmat. Pengulangan “jagalah” melengkapi elipsis dalam baris kedua secara alami tanpa mengubah hubungan antarklausa.
