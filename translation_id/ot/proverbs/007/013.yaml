  text: 'Ia memegangnya erat dan menciumnya; dengan wajah tanpa malu[a] ia berkata kepadanya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ia membuat wajahnya berani/tegar”; dapat juga diterjemahkan “dengan wajah berani” atau “dengan kelancangan tanpa rasa malu.” Ungkapan Ibrani ini menyatakan sikap yang berani secara lancang, tanpa rasa malu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶחֱזִיקָה בּוֹ
  choice: Ia memegang pemuda itu
  rationale: Kata החזיק dengan ב berarti memegang atau mencengkeram seseorang. Dalam bahasa Indonesia, “memegang” menyampaikan tindakan fisik yang tegas tanpa memberi kesan kekerasan yang tidak dinyatakan secara pasti; “pemuda itu” memperjelas rujukan pronomina sesuai konteks.
- source_word: וְנָשְׁקָה לּוֹ
  choice: dan menciumnya
  rationale: Kata נשק dalam bentuk Qal lazim berarti “mencium”; bentuk ini alami dan mempertahankan urutan tindakan dalam bahasa Ibrani.
- source_word: הֵעֵזָה פָנֶיהָ
  choice: dengan muka tanpa malu
  rationale: Ungkapan Ibrani secara harfiah menggambarkan perempuan itu membuat mukanya berani/keras, yakni bersikap lancang dan tidak merasa malu. Pilihan ini mempertahankan unsur “muka” sekaligus menyampaikan nilai pragmatis idiom tersebut dalam bahasa Indonesia.
- source_word: וַתֹּאמַר לוֹ
  choice: ia berkata kepadanya
  rationale: Terjemahan ini mempertahankan objek tak langsung לוֹ dan mengantar langsung kepada perkataan pada ayat berikutnya.
