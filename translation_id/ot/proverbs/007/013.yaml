translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Muka” dipilih, bukan “wajah”, untuk menjaga daya idiomatis ungkapan keberanian yang tidak tahu malu. Tanda titik koma memisahkan rangkaian tindakan fisik dari pengantar ujaran yang berlanjut ke ayat berikutnya.
