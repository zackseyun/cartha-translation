translation:
  language: id
  text: Ia melintas di jalan dekat sudutnya[a], lalu melangkah di jalan menuju rumahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia melintas di jalan pasar dekat sudutnya, lalu melangkah di jalan menuju rumahnya.”
    reason: Alternatif ini mempertahankan kemungkinan bahwa שׁוּק berarti “jalan pasar,” sambil tetap menerjemahkan דֶּרֶךְ secara eksplisit sebagai “jalan.”
lexical_decisions:
- source_word: עֹבֵר
  choice: melintas
  rationale: Partisipel Qal menggambarkan gerak melewati atau melalui suatu tempat sekaligus membuka adegan; bentuk Indonesia ini mempertahankan nuansa gerak yang sedang berlangsung.
- source_word: בַּשּׁוּק
  choice: di jalan
  rationale: שׁוּק dapat berarti jalan umum, khususnya jalan kota atau jalan pasar. Dalam konteks perjalanan menuju sebuah rumah, 'jalan' paling alami, sedangkan nuansa pasar dicatat dalam catatan kaki.
- source_word: אֵצֶל
  choice: dekat
  rationale: Preposisi ini menyatakan kedekatan tempat; 'dekat' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: פִּנָּהּ
  choice: sudut tempat perempuan itu biasa berada
  rationale: פִּנָּה berarti 'sudut', dan sufiks feminin tunggal mengaitkannya dengan perempuan dalam konteks. Ungkapan ini membuat kaitan posesif yang sukar dinyatakan secara alami sebagai 'sudutnya' tanpa mengubahnya menjadi 'persimpangan'.
- source_word: וְדֶרֶךְ בֵּיתָהּ
  choice: lalu ... menuju rumahnya
  rationale: דֶּרֶךְ bersama בֵּיתָהּ menunjukkan jalur atau arah ke rumah perempuan itu. 'Menuju rumahnya' menyampaikan arah gerak secara alami tanpa memastikan bahwa ia telah tiba.
- source_word: יִצְעָד
  choice: melangkah
  rationale: צעד menyatakan tindakan melangkah atau berjalan; 'melangkah' mempertahankan gambaran konkret kata Ibrani.
