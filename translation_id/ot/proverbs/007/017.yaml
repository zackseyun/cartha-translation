  text: I have perfumed my bed with myrrh[a], aloes, and cinnamon.
translation:
  language: id
  text: Aku telah mengharumkan tempat tidurku dengan mur, kayu gaharu[a], dan kayu manis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini menunjuk pada sejenis kayu harum yang digunakan dalam wewangian (sering disebut aloes atau aloewood), bukan tanaman lidah buaya dalam pengertian yang umum sekarang.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְתִּי
  choice: Aku telah mengharumkan
  rationale: Bentuk Piel ini menggambarkan tindakan membubuhkan bahan-bahan harum. 'Mengharumkan' menyampaikan tindakan sekaligus hasilnya secara alami dalam bahasa Indonesia.
- source_word: מִשְׁכָּבִי
  choice: tempat tidurku
  rationale: מִשְׁכָּב adalah tempat untuk berbaring; dalam konteks rayuan ini, 'tempat tidurku' jelas, alami, dan tepat.
- source_word: מֹר
  choice: mur
  rationale: '''Mur'' merupakan istilah baku bahasa Indonesia untuk damar aromatik ini.'
- source_word: אֲהָלִים
  choice: kayu gaharu
  rationale: Dalam konteks ini istilah Ibrani menunjuk pada kayu harum untuk wewangian, bukan tanaman lidah buaya modern. 'Kayu gaharu' lebih mudah dipahami dan menghindari salah pengertian.
- source_word: וְקִנָּמוֹן
  choice: dan kayu manis
  rationale: קִנָּמוֹן menunjuk pada rempah aromatik kayu manis; konjungsinya dipertahankan secara alami sebagai 'dan'.
