  text: וְ/עַתָּ֣ה בָ֭נִים שִׁמְעוּ לִ֑/י וְ֝/הַקְשִׁ֗יבוּ לְ/אִמְרֵי פִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/024.yaml
  text: And now[a], sons, listen to me, and pay attention to the words of my mouth.
translation:
  language: id
  text: Maka sekarang, hai anak-anak,[a] dengarkanlah aku dan perhatikanlah perkataan mulutku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki.” Kata Ibrani memakai bentuk jamak maskulin yang lazim digunakan sebagai sapaan dalam pengajaran hikmat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maka sekarang
  rationale: Gabungan konjungsi dan keterangan waktu menandai peralihan menuju seruan yang diperbarui. “Maka sekarang” mempertahankan alur wacana secara alami dalam bahasa Indonesia.
- source_word: בָנִים
  choice: anak-anakku
  rationale: Bentuk Ibrani adalah jamak maskulin, secara harfiah “anak-anak lelaki,” tetapi dalam sapaan pengajaran hikmat menyatakan relasi guru sebagai ayah kepada para murid. “Anak-anakku” merupakan sapaan Indonesia yang alami dan tetap mempertahankan citra pedagogis tersebut; catatan kaki menjelaskan bentuk gender sumber.
- source_word: שִׁמְעוּ לִי
  choice: dengarkanlah aku
  rationale: שׁמע dengan ל menyatakan tindakan mendengar dengan penuh perhatian kepada pembicara. Bentuk “-lah” menyampaikan imperatif dengan wajar dan bermartabat.
- source_word: וְהַקְשִׁיבוּ
  choice: dan perhatikanlah
  rationale: Bentuk Hifil dari קשׁב menyerukan perhatian sungguh-sungguh. “Perhatikanlah” jelas dan alami serta mempertahankan kesejajaran dengan perintah sebelumnya.
- source_word: לְאִמְרֵי
  choice: perkataan
  rationale: Bentuk jamak konstruksi ini berarti “perkataan-perkataan/sabda-sabda.” Dalam idiom Indonesia, nomina kolektif “perkataan” paling alami bersama “mulutku” tanpa menghilangkan maknanya.
- source_word: פִי
  choice: mulutku
  rationale: Terjemahan ini mempertahankan ungkapan puitis harfiah “perkataan mulutku,” alih-alih menguraikannya menjadi “yang kuucapkan.”
theological_decisions:
- issue: Sapaan bergender dalam pengajaran hikmat
  choice: anak-anakku
  alternative: anak-anak lelakiku; putra-putraku
  rationale: בָנִים adalah bentuk jamak maskulin dan secara leksikal dapat berarti “anak-anak lelaki.” Namun, dalam konteks pengajaran hikmat, ini merupakan sapaan pedagogis kepada para murid. Bahasa Indonesia lazim memakai “anak-anakku” untuk sapaan demikian tanpa secara eksplisit menandai gender. Catatan kaki mempertahankan informasi bentuk maskulin sumber dan tidak menentukan secara dogmatis apakah cakupannya hanya laki-laki atau representatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Partikel imperatif “-lah” menjaga nada nasihat yang tegas tanpa terdengar kasar. Ungkapan puitis “perkataan mulutku” dipertahankan.
