base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/013.yaml
  text: In the transgression of the lips there is a snare for an evil man[b][a], but the righteous comes out of trouble.
translation:
  language: id
  text: Dalam pelanggaran bibir[b] ada jerat bagi orang jahat[a], tetapi orang benar keluar dari kesusahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Karena pelanggaran bibir, orang jahat terjerat.” Bahasa Ibrani sangat padat; hubungan antara “pelanggaran bibir” dan “jerat” dapat dipahami sebagai lingkup (“dalam”) atau sebagai sarana/akibat (“karena”).
    reason: alternative_reading
  - marker: b
    text: “Bibir” merupakan ungkapan Ibrani yang merujuk pada perkataan atau kata-kata yang diucapkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶשַׁע
  choice: Dalam pelanggaran
  rationale: Preposisi ב dapat menyatakan lingkup atau sarana. “Dalam” mempertahankan kepadatan dan ambiguitas Ibrani; kemungkinan makna sarana dijelaskan dalam catatan [a].
- source_word: שְׂפָתַיִם
  choice: bibir
  rationale: Terjemahan harfiah ini mempertahankan metafora anggota tubuh dalam bahasa Ibrani, yang merujuk pada perkataan; maknanya dijelaskan dalam catatan [b].
- source_word: מוֹקֵשׁ
  choice: jerat
  rationale: “Jerat” mempertahankan gambaran konkret tentang sesuatu yang menangkap atau membinasakan, lazim dalam sastra hikmat.
- source_word: רָע
  choice: orang jahat
  rationale: Kata sifat substantival tunggal ini menunjuk kepada seseorang yang jahat. Bahasa Indonesia secara alami memakai “orang jahat” tanpa harus menandai gender gramatikal.
- source_word: וַיֵּצֵא
  choice: keluar
  rationale: Pilihan ini mempertahankan gambaran dasar verba “keluar” tanpa mempersempitnya menjadi “lolos” atau “terlepas”.
- source_word: מִצָּרָה
  choice: dari kesusahan
  rationale: צָרָה berarti kesusahan, kesesakan, atau malapetaka; “kesusahan” alami dalam bahasa Indonesia dan cukup luas.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Bentuk substantival ini menggambarkan tipe orang yang hidup benar dan menghasilkan kontras yang jelas dengan “orang jahat”.
theological_decisions:
- issue: Hubungan antara pelanggaran bibir dan jerat
  choice: Dalam pelanggaran bibir ada jerat bagi orang jahat
  alternative: Karena pelanggaran bibir, orang jahat terjerat
  rationale: Susunan Ibrani sangat padat dan ב dapat dipahami sebagai lingkup maupun sarana/akibat. Teks utama mempertahankan ambiguitas itu, sedangkan catatan memberi alternatif kausal-instrumental.
- issue: Substantiva maskulin tunggal dalam sastra hikmat
  choice: orang jahat ... orang benar
  alternative: laki-laki jahat ... laki-laki benar
  rationale: Dalam konteks ini bentuk maskulin tunggal menyajikan tipe manusia secara representatif. Bahasa Indonesia tidak memiliki gender gramatikal pada “orang”, sehingga terjemahan ini tetap tunggal tanpa menambahkan jenis kelamin yang tidak menjadi pokok peribahasa.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada sastra hikmat. Metafora “bibir” dan “jerat” dipertahankan, sementara susunan dibuat alami tanpa menghilangkan kepadatan atau ambiguitas sumber.
