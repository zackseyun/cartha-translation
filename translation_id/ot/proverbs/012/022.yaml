  text: Lying lips are an abomination to Yahweh[a], but those who act faithfully are his delight.
translation:
  language: id
  text: Bibir dusta adalah kekejian bagi Yahweh, tetapi orang yang bertindak dengan setia[a] adalah kesukaan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mempraktikkan kesetiaan,” “bertindak dengan jujur,” atau “dapat dipercaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: kekejian
  rationale: Kata benda ini menyatakan sesuatu yang sangat dibenci atau dianggap menjijikkan secara moral. “Kekejian” mempertahankan daya etis dan bentuk nominal teks Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
- source_word: שִׂפְתֵי שָׁקֶר
  choice: bibir dusta
  rationale: Ungkapan konstruksi ini secara harfiah berarti “bibir kebohongan.” “Bibir dusta” mempertahankan metafora Ibrani dan terdengar wajar serta padat dalam bahasa Indonesia.
- source_word: וְעֹשֵׂי אֱמוּנָה
  choice: tetapi orang yang berlaku setia
  rationale: Partisip עֹשֵׂי menunjuk kepada orang-orang yang melakukan atau mempraktikkan sesuatu, sedangkan אֱמוּנָה dapat berarti kesetiaan, kebenaran, atau sifat dapat dipercaya. “Berlaku setia” alami dalam bahasa Indonesia dan cocok dengan pertentangan terhadap dusta. Kata hubung diterjemahkan “tetapi” untuk menyatakan antitesis yang jelas dalam amsal.
- source_word: רְצוֹנוֹ
  choice: adalah kesukaan-Nya
  rationale: רָצוֹן dapat berarti kesukaan, perkenanan, atau kehendak baik. “Kesukaan-Nya” mempertahankan bentuk nominal dan membentuk pasangan retoris yang kuat dengan “kekejian bagi Yahweh.”
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Transliterasi “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan sebuah gelar.
- issue: Cakupan makna אֱמוּנָה dalam perilaku manusia
  choice: berlaku setia
  alternative: bertindak benar atau dapat dipercaya
  rationale: Dalam konstruksi dengan “melakukan,” kata ini menggambarkan perilaku yang bercirikan kesetiaan, kebenaran, dan keterandalan. Terjemahan utama tidak membatasi maknanya hanya pada keyakinan batin, sedangkan catatan kaki mempertahankan alternatif leksikal yang nyata.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat, dengan kesejajaran antitetis khas amsal tetap dipertahankan. Metafora “bibir” serta pasangan nominal “kekejian” dan “kesukaan” dipertahankan sejauh tetap alami.
