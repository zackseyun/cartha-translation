source:
  edition: WLC
  text: לֹא יְאֻנֶּ֣ה לַ/צַּדִּ֣יק כָּל אָ֑וֶן וּ֝/רְשָׁעִ֗ים מָ֣לְאוּ רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/021.yaml
  text: No harm will happen to the righteous, but the wicked are filled with trouble.
translation:
  language: id
  text: Tidak ada kemalangan yang akan menimpa orang benar, tetapi orang fasik dipenuhi malapetaka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְאֻנֶּה
  choice: akan menimpa
  rationale: Bentuk pasif dari אנה menyatakan sesuatu yang terjadi atau menimpa seseorang; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa kejadian yang datang atas orang itu.
- source_word: כָּל אָוֶן
  choice: kemalangan
  rationale: 'Dalam konteks ini אָוֶן dapat menunjuk pada kesusahan atau bencana, bukan semata-mata kejahatan moral. Dengan negasi, כָּל berfungsi idiomatis: tidak ada kemalangan.'
- source_word: צַדִּיק
  choice: orang benar
  rationale: Padanan baku yang mempertahankan kategori moral dan perjanjian dalam sastra hikmat.
- source_word: רְשָׁעִים
  choice: orang fasik
  rationale: Padanan yang lazim dan bermartabat bagi orang-orang yang bersalah secara moral, sekaligus membentuk kontras dengan orang benar.
- source_word: מָלְאוּ רָע
  choice: dipenuhi malapetaka
  rationale: מָלְאוּ berarti 'penuh/dipenuhi', sedangkan רָע dapat berarti kejahatan, keburukan, kesusahan, atau bencana. 'Malapetaka' mempertahankan kesejajaran antitetis dengan 'kemalangan' tanpa mengubah klausa menjadi pernyataan bahwa mereka penuh kejahatan moral.
theological_decisions:
- issue: Apakah ayat ini menjanjikan bahwa orang benar tidak pernah mengalami penderitaan apa pun?
  choice: Menerjemahkan אָוֶן sebagai 'kemalangan' dan mempertahankan bentuk pepatah yang tegas tanpa tambahan penjelas.
  alternative: Menambahkan pembatas seperti 'pada akhirnya' atau menerjemahkan sebagai 'kejahatan tidak akan mencelakakan orang benar'.
  rationale: Teks Ibrani menyatakan prinsip hikmat secara ringkas dan absolut pada permukaan, tetapi tidak memuat pembatas waktu atau keterangan tambahan. Terjemahan tidak boleh menyelesaikan ketegangan teologis itu dengan memasukkan unsur yang tidak tertulis.
- issue: Makna רָע pada klausa tentang orang fasik
  choice: malapetaka
  alternative: kejahatan
  rationale: רָע memang ambigu antara keburukan moral dan akibat buruk. Paralel dengan אָוֶן serta penggunaan kata 'dipenuhi' mendukung pengertian kesusahan atau bencana, selaras dengan lapisan konsultasi bahasa Inggris yang memilih 'trouble', sambil mengakui kemungkinan alternatif leksikal.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bernada hikmat. Susunan antitetis dipertahankan. 'Orang fasik' dipilih sebagai istilah Alkitabiah yang masih dipahami luas; 'kemalangan' dan 'malapetaka' membedakan kedua kata Ibrani sambil menjaga hubungan maknanya.
