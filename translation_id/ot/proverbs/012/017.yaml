  text: He who breathes out truth declares righteousness[a], but a false witness[b], deceit.
translation:
  language: id
  text: Orang yang mengucapkan kebenaran menyatakan apa yang benar, tetapi saksi dusta menyatakan tipu daya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָפִיחַ
  choice: mengucapkan
  rationale: Bentuk Hifil dari נפח secara harfiah menggambarkan mengembuskan, tetapi secara idiomatis berarti mengeluarkan atau mengucapkan perkataan. 'Mengucapkan' terdengar alami dalam bahasa Indonesia sambil mempertahankan tindakan tutur.
- source_word: אֱמוּנָה
  choice: kebenaran
  rationale: Dalam konteks kesaksian dan kontras dengan saksi dusta, kata ini menunjuk pada kebenaran atau keterandalan perkataan. 'Kebenaran' paling jelas menyampaikan kontras forensiknya.
- source_word: יַגִּיד
  choice: menyatakan
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau menyatakan. 'Menyatakan' sesuai dengan konteks pemberian kesaksian.
- source_word: צֶדֶק
  choice: apa yang benar
  rationale: Dalam konteks hukum-etis ini, צֶדֶק dapat menunjuk pada perkara atau putusan yang benar dan adil. 'Apa yang benar' alami bagi pembaca modern serta tidak mempersempitnya hanya menjadi sifat moral abstrak.
- source_word: עֵד שְׁקָרִים
  choice: saksi dusta
  rationale: Ungkapan Ibrani ini secara idiomatis berarti saksi yang dicirikan oleh kebohongan. 'Saksi dusta' merupakan padanan baku, ringkas, dan sesuai dengan konteks hukum.
- source_word: מִרְמָה
  choice: tipu daya
  rationale: Nomina penutup ini berdiri dalam klausa eliptis tanpa verba. Verba 'mengucapkan' dilengkapi secara wajar dalam bahasa Indonesia agar kontrasnya jelas, sedangkan 'tipu daya' mempertahankan arti kelicikan atau penipuan.
