  yaml_path: translation/ot/proverbs/012/006.yaml
  text: The words of the wicked are an ambush for blood[b][a], but the mouth of the upright delivers them.
translation:
  language: id
  text: Kata-kata orang fasik adalah penyergapan untuk menumpahkan darah,[a] tetapi mulut orang jujur menyelamatkan mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengintai darah.” Ungkapan Ibrani menggambarkan kata-kata orang fasik sebagai penyergapan yang mematikan.
    reason: lexical_alternative
  - marker: b
    text: '“Mereka” secara umum dapat menunjuk kepada orang-orang yang terancam oleh kekerasan itu. Ada yang memahami maksudnya secara refleksif: “mulut orang jujur menyelamatkan diri mereka sendiri,” atau hanya “menyelamatkan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Kata-kata
  rationale: Bentuk jamak konstruktus dari דָּבָר di sini menunjuk pada perkataan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan kesejajaran dengan gambaran “mulut” pada baris kedua.
- source_word: רְשָׁעִים
  choice: orang fasik
  rationale: Adjektiva yang dipakai sebagai nomina ini menunjuk kepada orang-orang yang jahat secara moral. “Orang fasik” ringkas, bermartabat, dan membentuk kontras etis dengan “orang jujur”.
- source_word: אֱרָב דָּם
  choice: menghadang untuk menumpahkan darah
  rationale: Ungkapan Ibrani menggambarkan penghadangan atau penyergapan yang bertujuan mencurahkan darah. Bentuk verbal ini lebih wajar dalam bahasa Indonesia sambil mempertahankan citra ancaman mematikan.
- source_word: וּפִי
  choice: tetapi mulut
  rationale: Konjungsi menyatakan pertentangan, sedangkan “mulut” dipertahankan untuk menjaga citra Ibrani dan kesejajaran puitis dengan “kata-kata”.
- source_word: יְשָׁרִים
  choice: orang jujur
  rationale: Kata ini secara harfiah menunjuk kepada mereka yang lurus dalam watak. “Orang jujur” adalah ungkapan Indonesia yang alami dan mudah dipahami dalam konteks etis ini.
- source_word: יַצִּילֵם
  choice: menyelamatkan mereka
  rationale: Bentuk hifil dari נצל berarti melepaskan atau menyelamatkan, dengan sufiks objek orang ketiga jamak. “Mereka” mempertahankan objek yang tersurat sekaligus membiarkan rujukannya tetap tidak sepenuhnya ditentukan.
theological_decisions:
- issue: Rujukan sufiks jamak pada יַצִּילֵם
  choice: “mereka,” yakni secara umum orang-orang yang terancam
  alternative: “diri mereka sendiri,” dengan orang jujur sebagai rujukannya
  rationale: Morfologi menyatakan objek orang ketiga jamak, tetapi antesedennya tidak disebutkan secara tegas. Teks utama mempertahankan “mereka,” dan catatan kaki mengakui kemungkinan pemahaman refleksif tanpa menetapkannya.
translation_notes:
  register: Bahasa Indonesia baku yang modern, ringkas, dan bernada hikmat. Susunan antitetis serta citra “kata-kata/mulut” dipertahankan. Ungkapan “menghadang untuk menumpahkan darah” dipilih agar gambaran penyergapan tetap jelas bagi pembaca umum.
