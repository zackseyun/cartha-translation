  text: אֱוִ֗יל בַּ֭/יּוֹם יִוָּדַ֣ע כַּעְס֑/וֹ וְ/כֹסֶ֖ה קָל֣וֹן עָרֽוּם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/016.yaml
  text: A fool’s anger is known at once[b][a], but a prudent man covers shame.
translation:
  language: id
  text: Kemarahan orang bodoh segera terlihat,[a] tetapi orang yang bijaksana menutupi aib.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada hari itu”; dapat juga diterjemahkan “pada hari yang sama.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menutupi penghinaan” atau “menyembunyikan kehinaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִיל
  choice: orang bodoh
  rationale: Dalam sastra hikmat, kata ini menunjuk pada orang yang bodoh secara moral dan praktis, bukan sekadar kurang cerdas.
- source_word: בַּיּוֹם
  choice: langsung
  rationale: Secara harfiah berarti 'pada hari itu'; dalam konteks pepatah ini, ungkapan tersebut paling wajar dipahami sebagai penanda kesegeraan.
- source_word: יִוָּדַע
  choice: terlihat
  rationale: Bentuk nifal menyatakan bahwa kemarahan itu menjadi nyata atau diketahui; 'terlihat' menyampaikan maknanya secara alami dalam bahasa Indonesia.
- source_word: כַּעְסוֹ
  choice: kemarahan
  rationale: Kata ini mengacu pada amarah atau kejengkelan; 'kemarahan' jelas dan sesuai dengan kontras mengenai pengendalian diri.
- source_word: וְכֹסֶה
  choice: tetapi ... menutupi
  rationale: Verba ini berarti menutupi atau menyembunyikan. 'Menutupi' mempertahankan metafora Ibrani, sedangkan 'tetapi' menyatakan kontras antarklausa.
- source_word: קָלוֹן
  choice: penghinaan
  rationale: Kata ini dapat berarti kehinaan, aib, atau penghinaan. Dalam konteks reaksi terhadap perlakuan yang memalukan, 'penghinaan' merupakan padanan alami sambil tetap mengakui alternatif dalam catatan kaki.
- source_word: עָרוּם
  choice: orang bijak
  rationale: Dalam Amsal, kata ini lazimnya bernilai positif dan menunjuk pada orang yang cerdik, arif, atau berhati-hati. 'Orang bijak' alami bagi pembaca Indonesia dan membentuk kontras yang jelas dengan 'orang bodoh'.
