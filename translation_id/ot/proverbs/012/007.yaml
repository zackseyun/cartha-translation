  text: The wicked are overthrown and are no more[b][a], but the house of the righteous will stand.
translation:
  language: id
  text: Orang-orang fasik ditumbangkan dan tidak ada lagi[a], tetapi rumah[b] orang-orang benar akan berdiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dan mereka tidak ada.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “rumah tangga” atau “keluarga.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפוֹךְ
  choice: ditumbangkan
  rationale: Bentuk ini dipakai secara eliptis dan menyatakan penjungkirbalikan atau keruntuhan. Bentuk pasif “ditumbangkan” menghasilkan kalimat Indonesia yang jelas sekaligus mempertahankan daya konkret ungkapan Ibrani.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Adjektiva jamak ini dipakai sebagai nomina bagi orang yang jahat secara moral. “Orang-orang fasik” merupakan padanan ringkas dan lazim dalam sastra hikmat.
- source_word: וְאֵינָם
  choice: lalu lenyap
  rationale: Secara harfiah berarti “dan mereka tidak ada.” Dalam konteks ini, “lalu lenyap” secara alami mengungkapkan bahwa mereka tidak ada lagi tanpa menentukan lebih jauh bentuk kebinasaan mereka; arti harfiahnya dicatat dalam catatan kaki.
- source_word: וּבֵית
  choice: tetapi rumah
  rationale: Kata בַּיִת dapat menunjuk pada bangunan rumah maupun keluarga atau rumah tangga. “Rumah” mempertahankan keluasan metafora itu, sedangkan “tetapi” memperjelas pertentangan yang dibawa oleh konteks.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Adjektiva jamak substantival ini menunjuk pada mereka yang hidup benar. Padanan ini jelas bagi pembaca modern dan mempertahankan kategori etis dalam amsal.
- source_word: יַעֲמֹד
  choice: akan tetap berdiri
  rationale: Kata kerja ini secara harfiah berarti “berdiri” dan dalam konteks menyiratkan keteguhan atau keberlangsungan. “Akan tetap berdiri” mempertahankan gambaran konkret sekaligus menyampaikan kontras dengan ditumbangkan.
