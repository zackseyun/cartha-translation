  text: A truthful lip is established forever[b][a], but a lying tongue lasts only a moment.
translation:
  language: id
  text: Bibir yang mengatakan kebenaran akan tetap teguh untuk selama-lamanya,[a] tetapi lidah dusta hanya bertahan sesaat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Bibir kebenaran akan diteguhkan untuk selama-lamanya.”'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani pada bagian kedua sulit dipastikan. Dalam konteks ini, maksudnya tampaknya bahwa dusta hanya bertahan sebentar, berlawanan dengan kebenaran yang tetap untuk selama-lamanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂפַת אֱמֶת
  choice: Bibir yang mengatakan kebenaran
  rationale: Frasa harfiahnya ialah 'bibir kebenaran'. Ungkapan ini menunjuk pada orang atau tutur kata yang benar; bentuk dengan klausa relatif terdengar alami dalam bahasa Indonesia sambil mempertahankan gambaran konkret 'bibir'.
- source_word: תִּכּוֹן
  choice: akan tetap teguh
  rationale: Bentuk nifal dari כון menyatakan sesuatu yang ditegakkan, menjadi kukuh, atau bertahan. 'Akan tetap teguh' mempertahankan nuansa kekukuhan dan cocok dengan daya pernyataan umum amsal.
- source_word: לָעַד
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan atau ketetapan yang permanen dan membentuk kontras langsung dengan singkatnya dusta.
- source_word: וְעַד
  choice: tetapi
  rationale: Walaupun unsur penghubungnya secara bentuk dapat berarti 'dan', struktur paralel antitetis amsal ini menuntut hubungan pertentangan yang alami dalam bahasa Indonesia.
- source_word: אַרְגִּיעָה
  choice: hanya bertahan sesaat
  rationale: Bentuk Ibrani ini sulit dan telah dipahami dengan beberapa cara. Dalam konteks, tafsiran temporal 'sesaat' paling kuat karena berlawanan dengan לָעַד, sedangkan 'bertahan' melengkapi verba yang tersirat secara alami.
- source_word: לְשׁוֹן שָׁקֶר
  choice: lidah dusta
  rationale: Terjemahan ini mempertahankan metafora tubuh dan konstruksi ringkas Ibrani. 'Dusta' menyatakan kepalsuan atau kebohongan dalam tuturan.
