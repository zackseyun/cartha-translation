  text: Deceit is in the heart of those who devise evil[b][a], but joy belongs to those who counsel peace.
translation:
  language: id
  text: Tipu daya ada dalam hati orang-orang yang merancang kejahatan, tetapi ada sukacita bagi orang-orang yang menganjurkan perdamaian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “perdamaian” juga dapat mencakup kesejahteraan atau keutuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִרְמָה
  choice: tipu daya
  rationale: Nomina ini menunjuk pada maksud atau tindakan menipu. “Tipu daya” alami dalam bahasa Indonesia dan sesuai sebagai sifat batin yang dikontraskan dengan sukacita.
- source_word: בְּלֶב
  choice: ada dalam hati
  rationale: Frasa ini menyatakan batin sebagai pusat niat dan pertimbangan. Kata “ada” dilengkapi karena klausa Ibrani tidak memakai kopula.
- source_word: חֹרְשֵׁי רָע
  choice: orang-orang yang merancang kejahatan
  rationale: Partisipel חרשׁ dalam konteks ini menyiratkan perencanaan yang disengaja; “merancang” mempertahankan nuansa tersebut.
- source_word: וּלְיֹעֲצֵי שָׁלוֹם
  choice: tetapi ... pada orang-orang yang menasihati perdamaian
  rationale: Lamed menandai pihak yang mengalami atau memiliki sukacita, sedangkan partisipel יֹעֲצֵי mempertahankan tindakan memberi nasihat atau menganjurkan. “Perdamaian” cocok sebagai sesuatu yang dinasihatkan atau diupayakan.
- source_word: שָׁלוֹם
  choice: perdamaian
  rationale: Dalam konteks nasihat yang berlawanan dengan perancangan kejahatan, “perdamaian” merupakan ungkapan Indonesia yang alami, sambil tetap membuka cakupan makna kesejahteraan dan keutuhan melalui catatan kaki.
- source_word: שִׂמְחָה
  choice: sukacita ada pada
  rationale: Klausa nominal Ibrani membiarkan hubungan ini tersirat. “Ada pada” menyampaikan bahwa sukacita menjadi bagian atau pengalaman para penasihat perdamaian tanpa mempertegas hubungan melebihi teks.
