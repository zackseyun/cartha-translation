  text: A wicked man desires the prey of evil men[b][a], but the root of the righteous yields fruit.
translation:
  language: id
  text: Orang fasik menginginkan hasil buruan orang-orang jahat[a], tetapi akar orang-orang benar menghasilkan buah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jaring orang-orang jahat” atau “perangkap orang-orang jahat.” Kata Ibrani ini sulit dipastikan; kata ini dapat merujuk pada sesuatu yang ditangkap atau diperoleh, seperti hasil buruan atau jarahan, ataupun pada jaring atau perangkap.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “akar orang-orang benar memberi.” Terjemahan “menghasilkan buah” menyatakan secara eksplisit makna pertanian yang kemungkinan besar tersirat dalam ungkapan Ibrani ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָמַד
  choice: menginginkan
  rationale: Kata kerja ini menyatakan keinginan yang kuat. “Menginginkan” mempertahankan keluasan maknanya tanpa secara otomatis mempersempitnya menjadi tindakan mengingini milik orang lain; konteks orang fasik tetap memberi nuansa negatif.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Kata sifat tunggal yang dipakai sebagai nomina ini menunjuk secara umum kepada seseorang yang fasik. Ungkapan “orang fasik” alami dan lazim dalam bahasa Indonesia.
- source_word: מְצוֹד
  choice: hasil buruan
  rationale: Nomina Ibrani ini sulit dipastikan dan dapat menunjuk pada buruan atau hasil tangkapan, jarahan, jaring, maupun perangkap. “Hasil buruan” secara alami menyatakan sesuatu yang ditangkap dan cocok sebagai objek keinginan, tanpa menghilangkan citra perburuan yang mungkin terkandung di dalamnya.
- source_word: רָעִים
  choice: orang-orang jahat
  rationale: Kata sifat jamak yang dipakai sebagai nomina ini merujuk kepada para pelaku kejahatan. “Orang-orang jahat” jelas, alami, dan mempertahankan bentuk jamaknya.
- source_word: שֹׁרֶשׁ
  choice: akar
  rationale: Metafora tumbuhan dalam teks sumber dipertahankan secara langsung dan menyiapkan gambaran tentang hasil yang muncul pada klausa berikutnya.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Kata sifat jamak substantival ini menunjuk kepada golongan orang benar. Terjemahan ini mempertahankan bentuk jamak dan kontras etis dengan orang fasik.
- source_word: יִתֵּן
  choice: menghasilkan buah
  rationale: Secara harfiah verba ini berarti “memberi”. Karena subjeknya adalah “akar”, terjemahan “menghasilkan buah” mengungkapkan makna pertanian yang sangat mungkin tersirat dan menghasilkan bahasa Indonesia yang lengkap serta alami.
