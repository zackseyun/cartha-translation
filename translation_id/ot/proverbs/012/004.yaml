  yaml_path: translation/ot/proverbs/012/004.yaml
  text: A wife of noble character is her husband's crown[b][a], but one who brings shame is like rot in his bones.
translation:
  language: id
  text: Istri yang cakap[a] adalah mahkota bagi suaminya, tetapi istri yang mendatangkan malu bagaikan kebusukan dalam tulang-tulang suaminya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “istri yang tangguh,” “istri yang bernilai luhur,” atau “istri yang unggul.” Kata Ibrani חַיִל mencakup kekuatan, nilai, kecakapan, dan keunggulan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seperti kebusukan dalam tulang-tulangnya,” sebuah gambaran tentang kehancuran batin atau aib yang menggerogoti.
    reason: cultural_note
lexical_decisions:
- source_word: אֵשֶׁת חַיִל
  choice: istri yang cakap
  rationale: Konteks dengan בַּעְלָהּ menunjukkan bahwa אֵשֶׁת berarti “istri.” חַיִל mencakup kecakapan, kekuatan, nilai, dan keluhuran; “cakap” alami dalam bahasa Indonesia dan mempertahankan unsur kemampuan tanpa membatasinya hanya pada keberanian atau moralitas.
- source_word: עֲטֶרֶת בַּעְלָהּ
  choice: mahkota bagi suaminya
  rationale: עֲטֶרֶת adalah mahkota atau karangan kehormatan. Frasa “mahkota bagi suaminya” mempertahankan metafora kehormatan sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: מְבִישָׁה
  choice: istri yang mendatangkan malu
  rationale: Partisip feminin kausatif ini menunjuk kembali kepada istri dan berarti menyebabkan atau mendatangkan malu. Terjemahan verbal mempertahankan daya aktif bentuk Ibrani.
- source_word: וּכְרָקָב בְּעַצְמוֹתָיו
  choice: tetapi ... bagaikan kebusukan dalam tulang-tulang suaminya
  rationale: וּ memperkenalkan kontras sehingga diterjemahkan “tetapi.” רָקָב berarti kebusukan atau pembusukan, dan “dalam tulang-tulang” dipertahankan sebagai gambaran kerusakan batin yang mendalam. “Suaminya” menghindari ketaksaan rujukan pronomina dalam bahasa Indonesia.
theological_decisions: []
