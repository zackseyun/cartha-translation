  text: אֹהֵ֣ב מ֭וּסָר אֹ֣הֵֽב דָּ֑עַת וְ/שֹׂנֵ֖א תוֹכַ֣חַת בָּֽעַר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/001.yaml
  text: Whoever loves discipline loves knowledge[a], but he who hates reproof is stupid.
translation:
  language: id
  text: Siapa yang mencintai didikan mencintai pengetahuan, tetapi siapa yang membenci teguran adalah bebal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dungu” atau “tidak berakal.” Kata Ibrani בָּעַר dapat menggambarkan orang yang bebal, tumpul, atau bersifat seperti binatang.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: siapa mencintai
  rationale: Partisip ini berfungsi secara umum dalam pepatah. Ungkapan ini alami dalam bahasa Indonesia dan tidak membatasi maksudnya pada laki-laki.
- source_word: מוּסָר
  choice: didikan
  rationale: Dalam Amsal, kata ini mencakup pembentukan melalui pengajaran, disiplin, dan koreksi. “Didikan” mempertahankan cakupan tersebut secara alami.
- source_word: דָּעַת
  choice: pengetahuan
  rationale: Padanan langsung yang mempertahankan tema hikmat mengenai pengetahuan yang diperoleh dan diterima.
- source_word: וְשֹׂנֵא
  choice: tetapi siapa membenci
  rationale: Waw membentuk pertentangan antara kedua bagian pepatah, sehingga “tetapi” mengungkapkan hubungan antitetisnya dengan jelas.
- source_word: תוֹכַחַת
  choice: teguran
  rationale: Kata ini menunjuk pada koreksi atau celaan verbal; “teguran” ringkas, lazim, dan sesuai dengan laras pepatah.
- source_word: בָּעַר
  choice: bodoh seperti binatang
  rationale: Kata Ibrani ini bukan sekadar menyatakan kurang cerdas, melainkan kebebalan atau ketidakpekaan yang disamakan dengan sifat binatang. Ungkapan ini mempertahankan daya gambarnya dalam bahasa Indonesia.
