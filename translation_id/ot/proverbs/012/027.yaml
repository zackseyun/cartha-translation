  yaml_path: translation/ot/proverbs/012/027.yaml
  text: A lazy man does not roast his game[b][a], but diligence is a man’s precious wealth.
translation:
  language: id
  text: Orang malas tidak memanggang hasil buruannya[a], tetapi harta manusia yang berharga ialah kerajinan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak memperoleh mangsanya,” jika kata kerjanya dipahami lebih luas sebagai memperoleh atau menyiapkan hasil buruan, bukan secara khusus memanggangnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲרֹךְ
  choice: memanggang
  rationale: Kata kerja חרך pada dasarnya menunjuk pada menghanguskan atau memanggang dengan api. Bersama צֵידוֹ, gambaran konkretnya ialah orang malas yang tidak mengolah hasil buruannya.
- source_word: רְמִיָּה
  choice: orang malas
  rationale: Dalam konteks Amsal, kata ini dapat menyatakan kemalasan atau kelalaian. Bentuk personal dipakai dalam bahasa Indonesia agar pertentangannya dengan kerajinan jelas dan alami.
- source_word: צֵידוֹ
  choice: hasil buruannya
  rationale: צֵיד berarti hewan buruan atau mangsa. 'Hasil buruannya' alami dalam bahasa Indonesia dan cocok dengan tindakan memanggang.
- source_word: הוֹן
  choice: harta
  rationale: הוֹן berarti kekayaan atau harta. 'Harta' menjaga bentuk pepatah tetap ringkas.
- source_word: אָדָם
  choice: bagi manusia
  rationale: אָדָם di sini bersifat umum dan menunjuk kepada manusia. Ungkapan 'bagi manusia' menyampaikan cakupan generik tanpa menambahkan pembedaan gender yang tidak diperlukan dalam bahasa Indonesia.
- source_word: יָקָר
  choice: berharga
  rationale: יָקָר menyatakan nilai atau sesuatu yang berharga; pilihan ini jelas dan wajar dalam hubungan dengan 'harta'.
- source_word: חָרוּץ
  choice: kerajinan
  rationale: חָרוּץ dapat menunjuk kepada sifat rajin atau orang yang rajin. Terjemahan abstrak 'kerajinan' menghasilkan kontras langsung dengan kemalasan dan mengikuti salah satu pembacaan yang masuk akal atas klausa Ibrani yang padat.
theological_decisions:
- issue: Hubungan sintaksis dalam klausa kedua
  choice: kerajinan adalah harta berharga bagi manusia
  alternative: milik orang rajin itu berharga
  rationale: Teks Ibrani sangat ringkas dan hubungan antara הוֹן, אָדָם, יָקָר, dan חָרוּץ tidak dinyatakan secara lengkap. Teks utama mempertahankan kontras sifat antara kemalasan dan kerajinan, sedangkan catatan kaki mengakui pembacaan yang menjadikan חָרוּץ sebagai sebutan bagi orang rajin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada pepatah. 'Orang malas' dan 'kerajinan' membentuk pertentangan yang mudah dipahami, sedangkan dua catatan kaki mempertahankan ketidakpastian leksikal dan sintaksis teks Ibrani.
