  yaml_path: translation/ot/proverbs/012/023.yaml
  text: A prudent man conceals knowledge[b][a], but the heart of fools proclaims folly.
translation:
  language: id
  text: Orang yang bijaksana menyembunyikan pengetahuan,[a] tetapi hati orang-orang bodoh menyerukan kebodohan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Orang yang cerdik menutupi pengetahuan.” Kata sifat Ibrani ini dapat berarti “cerdik” maupun “bijaksana”, dan kata kerjanya secara harfiah berarti “menutupi”.
    reason: lexical_alternative
  - marker: b
    text: Atau, “hati orang-orang bodoh memanggil-manggil kebodohan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: orang
  rationale: Dalam pepatah hikmat ini, nomina tunggal tersebut menunjuk kepada seorang individu secara umum; 'orang' alami dalam bahasa Indonesia dan tidak memberi penekanan gender yang tidak diperlukan.
- source_word: עָרוּם
  choice: bijaksana
  rationale: 'Dalam konteks Amsal, kata ini sering bernuansa positif: cerdik, arif, atau bertindak dengan pertimbangan. Kontras dengan orang bodoh mendukung pilihan positif ''bijaksana'', sementara kemungkinan ''cerdik'' dicatat dalam catatan kaki.'
- source_word: כֹּסֶה
  choice: menyimpan
  rationale: Secara harfiah berarti 'menutupi' dan dalam konteks ini menyatakan tidak memamerkan atau tidak buru-buru mengungkapkan pengetahuan. 'Menyimpan' menyampaikan pengendalian diri secara alami tanpa menyiratkan penipuan.
- source_word: דָּעַת
  choice: pengetahuannya
  rationale: '''Pengetahuan'' merupakan padanan langsung bagi istilah hikmat ini. Akhiran posesif membuat hubungan dengan orang bijaksana jelas dan alami dalam bahasa Indonesia, tanpa mengubah maksud.'
- source_word: לֵב
  choice: hati
  rationale: Mempertahankan gambaran antropologis Ibrani tentang pusat pikiran dan watak batin; ungkapan ini tetap mudah dipahami dalam bahasa Indonesia.
- source_word: כְּסִילִים
  choice: orang-orang bodoh
  rationale: Istilah ini merupakan kategori moral-intelektual yang khas dalam sastra hikmat. Bentuk jamak sumber dipertahankan.
- source_word: יִקְרָא
  choice: menyerukan
  rationale: Kata kerja ini secara dasar berarti 'memanggil/berseru'. 'Menyerukan' mempertahankan citra bersuara keras sekaligus menyampaikan bahwa kebodohan dibuat nyata atau terbuka.
- source_word: אִוֶּלֶת
  choice: kebodohan
  rationale: Padanan Indonesia yang lugas bagi istilah utama Amsal tentang sikap dan perilaku yang berlawanan dengan hikmat.
theological_decisions: []
