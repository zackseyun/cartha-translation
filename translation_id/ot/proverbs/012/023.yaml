  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat sesuai bentuk pepatah. Paralelisme antarklausa dan gambaran 'hati' dipertahankan; pilihan 'menyimpan' menghindari kesan bahwa orang bijaksana menyembunyikan kebenaran secara tidak jujur, sementara catatan kaki menjaga arti harfiah dan ambiguitas leksikal.
