  text: בְּ/אֹֽרַח צְדָקָ֥ה חַיִּ֑ים וְ/דֶ֖רֶךְ נְתִיבָ֣ה אַל מָֽוֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/028.yaml
  text: In the path of righteousness is life[a], and in its pathway there is no death.
translation:
  language: id
  text: 'Di jalan kebenaran ada kehidupan,[a]

    dan di jalurnya tidak ada kematian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan jalurnya adalah kekekalan.” Ini mencerminkan pemahaman lain atas baris kedua dalam bahasa Ibrani yang sulit.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/אֹרַח
  choice: Di jalan
  rationale: אֹרַח berarti jalan, jalur, atau arah hidup. “Di jalan” alami dalam bahasa Indonesia dan mempertahankan metafora perjalanan moral; prefiks בְּ diterjemahkan “di”.
- source_word: צְדָקָה
  choice: kebenaran
  rationale: צְדָקָה dapat berarti kebenaran atau keadilan. Dalam konteks hikmat tentang cara hidup yang benar, “kebenaran” paling sesuai dan mudah dipahami.
- source_word: חַיִּים
  choice: kehidupan
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, חַיִּים lazim berfungsi sebagai kata benda kolektif yang berarti kehidupan. “Kehidupan” juga menjaga pertentangannya dengan “kematian”.
- source_word: וְ/דֶרֶךְ נְתִיבָה
  choice: dan di jalurnya
  rationale: Ungkapan Ibrani ini sangat padat dan sukar. “Di jalurnya” memahami נְתִיבָה sebagai jalur yang merujuk kembali kepada jalan kebenaran, sementara preposisi “di” dipasok dari kesejajaran baris pertama.
- source_word: אַל
  choice: tidak ada
  rationale: Meskipun אַל biasanya merupakan partikel larangan, di sini partikel itu dipahami sebagai penyangkalan. “Tidak ada” menghasilkan pernyataan yang koheren tanpa mengubah teks Masoret.
- source_word: מָוֶת
  choice: kematian
  rationale: מָוֶת berarti kematian. Pilihan ini mempertahankan pertentangan langsung dengan kehidupan.
theological_decisions:
- issue: 'Penafsiran baris kedua yang sulit: ודרך נתיבה אל־מות'
  choice: Baris kedua menyatakan bahwa di jalur kebenaran tidak ada kematian.
  alternative: “dan jalurnya menuju kekekalan” atau “dan jalan setapaknya menuju kematian.”
  rationale: Susunan Ibraninya padat dan dapat dipahami dengan beberapa cara. Bacaan utama mempertahankan teks Masoret dan antitesis kehidupan–kematian yang paling wajar dalam konteks, sedangkan pemahaman “kekekalan” dicatat sebagai alternatif agar ambiguitas aslinya tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang ringkas dan bermartabat. “Jalan” dan “jalur” mempertahankan paralelisme dengan variasi alami; “ada kehidupan” mempertahankan struktur eksistensial teks sumber.
