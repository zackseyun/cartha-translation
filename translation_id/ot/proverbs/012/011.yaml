  yaml_path: translation/ot/proverbs/012/011.yaml
  text: Whoever works his land will have plenty of bread[a], but he who pursues empty things lacks sense.
translation:
  language: id
  text: Orang yang menggarap tanahnya akan kenyang dengan roti, tetapi orang yang mengejar hal-hal sia-sia[a] kurang pengertian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengejar orang-orang yang tidak berguna”; ungkapan Ibrani “yang kosong” dapat dipahami sebagai orang atau sebagai hal.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵד
  choice: menggarap
  rationale: Partisip ini menunjuk pada bekerja atau mengusahakan lahan pertanian. “Menggarap” alami dalam bahasa Indonesia dan lebih tepat dalam konteks ini daripada arti umum “melayani”.
- source_word: אַדְמָתוֹ
  choice: tanahnya
  rationale: אַדָמָה berarti tanah atau lahan. “Tanahnya” mempertahankan gambaran konkret mengenai pekerjaan pertanian dan unsur kepemilikan dalam sufiks Ibrani.
- source_word: יִשְׂבַּע לָחֶם
  choice: akan kenyang dengan makanan
  rationale: Ungkapan ini secara harfiah menyatakan bahwa orang itu akan dipuaskan atau dikenyangkan dengan לֶחֶם. Dalam bahasa Ibrani, לֶחֶם dapat berarti roti atau makanan secara lebih luas; “makanan” menyampaikan hasil nyata dari kerja dengan wajar dalam bahasa Indonesia.
- source_word: וּמְרַדֵּף
  choice: tetapi orang yang mengejar
  rationale: Konjungsi dipahami secara kontras karena paralelisme antitetis. “Mengejar” mempertahankan gambaran tentang mencurahkan diri kepada suatu sasaran.
- source_word: רֵיקִים
  choice: hal-hal sia-sia
  rationale: Bentuk jamak ini secara harfiah berarti “yang kosong” dan dapat merujuk kepada hal-hal yang hampa atau orang-orang yang tidak berguna. Teks utama memakai pengertian impersonal yang cocok dengan kontras terhadap kerja produktif, sedangkan kemungkinan personal dipertahankan dalam catatan kaki.
- source_word: חֲסַר לֵב
  choice: tidak berakal budi
  rationale: Idiom harfiahnya ialah “kekurangan hati”; dalam sastra hikmat, hati merupakan pusat pengertian dan pertimbangan. “Tidak berakal budi” menyampaikan makna tersebut secara alami dan bermartabat.
