  text: Anxiety in a man's heart weighs it down[b][a], but a good word makes it glad.
translation:
  language: id
  text: Kekhawatiran dalam hati seseorang[a] membuatnya tertekan[b], tetapi perkataan yang baik menggembirakannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dalam hati seorang laki-laki.” Bentuk tunggal itu mewakili manusia pada umumnya.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “membuatnya merunduk.” Kata kerja Ibrani menggambarkan sesuatu yang dibawa turun atau dibuat membungkuk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּאָגָה
  choice: kekhawatiran
  rationale: Kata benda ini menunjuk pada rasa cemas atau khawatir. “Kekhawatiran” alami dalam bahasa Indonesia modern dan tetap menyatakan beban batin.
- source_word: בְלֶב אִישׁ
  choice: dalam hati seseorang
  rationale: Secara harfiah frasa ini berarti “dalam hati seorang laki-laki,” tetapi אִישׁ di sini berfungsi sebagai bentuk tunggal representatif. “Seseorang” menyampaikan cakupan umum pepatah, sedangkan “hati” mempertahankan gambaran Ibrani tentang batin manusia.
- source_word: יַשְׁחֶנָּה
  choice: membuatnya tertekan
  rationale: Bentuk verba ini menggambarkan tindakan membuat rendah, membungkuk, atau merunduk. “Membuatnya tertekan” mengungkapkan dampak kekhawatiran secara alami sambil tetap mencerminkan gambaran tentang batin yang dibawa turun. Pronomina “-nya” juga tidak memaksakan rujukan yang lebih sempit daripada teks Ibrani.
- source_word: וְדָבָר טוֹב
  choice: tetapi perkataan yang baik
  rationale: דָבָר dapat berarti perkataan, hal, atau pesan. “Perkataan yang baik” mempertahankan keluasan maknanya, dan “tetapi” menyatakan pertentangan dalam paralelisme pepatah ini.
- source_word: יְשַׂמְּחֶנָּה
  choice: menggembirakannya
  rationale: Bentuk Piel dari שׂמח bersifat kausatif, yaitu membuat gembira. “Menggembirakannya” ringkas, alami, dan mempertahankan hubungan dengan batin atau orang yang disebut pada baris pertama.
