translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bernada pepatah. “Seseorang” dipakai untuk menyampaikan fungsi representatif אִישׁ tanpa membatasi penerapan ayat hanya kepada laki-laki. Akhiran “-nya” mempertahankan keluwesan rujukan kepada hati atau orang batiniah.
