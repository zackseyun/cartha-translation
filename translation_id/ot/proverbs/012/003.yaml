  text: לֹא יִכּ֣וֹן אָדָ֣ם בְּ/רֶ֑שַׁע וְ/שֹׁ֥רֶשׁ צַ֝דִּיקִ֗ים בַּל יִמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/003.yaml
  text: A man is not established by wickedness[b][a], but the root of the righteous will not be moved.
translation:
  language: id
  text: 'Seseorang tidak menjadi teguh melalui kefasikan,

    tetapi akar orang-orang benar tidak akan goyah.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִכּוֹן
  choice: akan menjadi teguh
  rationale: Bentuk Nifal dari כון menyatakan keadaan diteguhkan atau menjadi kokoh. Ungkapan ini mempertahankan nuansa hasil sekaligus cocok dengan pernyataan hikmat yang berlaku umum.
- source_word: אָדָם
  choice: seseorang
  rationale: Dalam pepatah ini, אָדָם menunjuk secara umum kepada seorang manusia, bukan khusus kepada laki-laki. 'Seseorang' alami dalam bahasa Indonesia dan mempertahankan acuan individual.
- source_word: בְּרֶשַׁע
  choice: karena kefasikan
  rationale: 'Preposisi ב dipahami sebagai sarana atau dasar: kefasikan tidak dapat menghasilkan kemapanan yang bertahan. ''Karena'' menyampaikan hubungan itu secara wajar dalam bahasa Indonesia.'
- source_word: שֹׁרֶשׁ
  choice: akar
  rationale: Metafora konkret dipertahankan karena menggambarkan sumber kehidupan, ketahanan, dan kemantapan.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Adjektiva jamak substantival ini menunjuk kepada golongan orang yang hidup benar. Bentuk jamak dinyatakan secara eksplisit.
- source_word: בַּל יִמּוֹט
  choice: tidak akan goyah
  rationale: מוט menggambarkan bergeser, terhuyung, atau kehilangan kestabilan; 'goyah' mempertahankan gambaran keteguhan akar dan terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan antropologis אָדָם dalam ujaran amsal
  choice: Menerjemahkannya sebagai 'seseorang' yang mewakili manusia secara umum
  alternative: '''seorang laki-laki'' atau ''manusia'''
  rationale: Konteks tidak membatasi pernyataan kepada laki-laki. Pilihan 'seseorang' mempertahankan bentuk individual generik tanpa memasukkan pembatasan gender yang tidak dituntut teks.
- issue: Sumber kestabilan moral
  choice: Menyatakan bahwa kefasikan tidak dapat membuat seseorang teguh
  alternative: Membaca בְּרֶשַׁע secara lokatif sebagai 'di dalam kefasikan'
  rationale: Makna sarana atau dasar paling sesuai dengan kontras terhadap akar orang benar yang tetap kokoh, tetapi terjemahan tidak menambahkan penjelasan tentang bagaimana kebenaran menghasilkan keteguhan.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Paralelisme antarbait serta metafora 'akar' dipertahankan; 'kefasikan' dipilih untuk רֶשַׁע karena menyatakan keburukan moral yang disengaja, sedangkan 'goyah' menyampaikan citra hilangnya kestabilan secara alami.
