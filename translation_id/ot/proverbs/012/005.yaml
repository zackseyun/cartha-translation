  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur antitetis Ibrani dipertahankan dengan “tetapi”. Ungkapan “tertuju pada” dan “penuh” ditambahkan secara idiomatis untuk menyatakan hubungan predikatif dua nomina tanpa menghilangkan bacaan yang lebih harfiah, yang dicatat dalam catatan kaki.
