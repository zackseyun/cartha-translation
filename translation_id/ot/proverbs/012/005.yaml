    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְשְׁבוֹת
  choice: pikiran
  rationale: Kata benda ini dapat berarti pikiran, rancangan, atau niat. “Pikiran” alami dalam bahasa Indonesia dan tetap membuka cakupan batin maupun perencanaan.
- source_word: צַדִּיקִים
  choice: orang benar
  rationale: Bentuk adjektiva substantival jamak ini menunjuk kepada orang-orang yang hidup benar; “orang benar” merupakan ungkapan baku, ringkas, dan representatif dalam bahasa Indonesia.
- source_word: מִשְׁפָּט
  choice: tertuju pada keadilan
  rationale: Nomina ini berarti keadilan, keputusan hukum, atau apa yang benar. Frasa predikatif ini mempertahankan nomina “keadilan” sambil menghasilkan kalimat Indonesia yang alami tanpa mengubahnya menjadi sekadar sifat.
- source_word: תַּחְבֻּלוֹת
  choice: siasat
  rationale: Kata ini mencakup nasihat, pengarahan, rancangan, atau strategi. “Siasat” mempertahankan unsur perencanaan strategis dan, dalam konteks orang fasik, berpasangan alami dengan tipu daya.
- source_word: רְשָׁעִים
  choice: orang fasik
  rationale: Adjektiva substantival jamak ini menunjuk kepada orang-orang jahat secara moral. “Orang fasik” menjaga kontras hikmat yang lazim dengan “orang benar.”
- source_word: מִרְמָה
  choice: tipu daya
  rationale: Nomina ini menyatakan penipuan, kelicikan, atau pengkhianatan. “Tipu daya” jelas, alami, dan cocok sebagai kualitas siasat orang fasik.
