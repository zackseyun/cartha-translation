  text: Rancangan orang benar adalah keadilan[a]; siasat orang fasik adalah tipu daya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “rancangan” juga dapat berarti “pikiran” atau “niat”; “keadilan” juga dapat berarti “keputusan yang adil” atau “apa yang benar”.
    reason: lexical_alternative
