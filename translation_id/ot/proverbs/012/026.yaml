source:
  edition: WLC
  text: יָתֵ֣ר מֵ/רֵעֵ֣/הוּ צַדִּ֑יק וְ/דֶ֖רֶךְ רְשָׁעִ֣ים תַּתְעֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/026.yaml
  text: The righteous person is a guide to his neighbor[b][a], but the way of the wicked leads them astray.
translation:
  language: id
  text: Orang benar menuntun sesamanya[a][b], tetapi jalan orang-orang fasik menyesatkan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kata Ibrani yang diterjemahkan “menuntun” sulit dipastikan maknanya. Terjemahan lain yang mungkin: “Orang benar lebih unggul daripada sesamanya.”'
    reason: alternative_reading
  - marker: b
    text: Atau “temannya” atau “rekannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָתֵר
  choice: menuntun
  rationale: Bentuk dan makna kata ini dalam konteks tersebut terkenal sulit. Dalam paralel antitetis dengan jalan orang fasik yang menyesatkan, makna aktif ‘menuntun’ menghasilkan ungkapan Indonesia yang wajar tanpa menutupi kemungkinan analisis komparatif yang dicatat dalam catatan kaki.
- source_word: מֵרֵעֵהוּ
  choice: sesamanya
  rationale: רֵעַ dapat berarti sesama, teman, atau rekan. ‘Sesamanya’ cukup luas untuk konteks sosial sastra hikmat; unsur מ־ dipahami sebagai bagian dari konstruksi sulit bersama יָתֵר, bukan diterjemahkan secara kaku sebagai ‘dari’.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Kata sifat ini dipakai sebagai nomina tunggal generik. ‘Orang benar’ merupakan ungkapan baku, ringkas, dan tidak membatasi maknanya pada laki-laki.
- source_word: וְדֶרֶךְ
  choice: tetapi jalan
  rationale: Kata sambung וְ diterjemahkan secara adversatif karena kedua bagian amsal membentuk paralelisme yang mempertentangkan orang benar dengan orang-orang fasik.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Bentuk jamak substantival ini lazim menunjuk kepada mereka yang hidup dalam kefasikan. Bentuk ulang menyatakan jamak dengan jelas dalam bahasa Indonesia.
- source_word: תַּתְעֵם
  choice: menyesatkan mereka
  rationale: Bentuk kausatif dari תעה dengan akhiran orang ketiga jamak berarti menyebabkan mereka menyimpang atau tersesat. ‘Menyesatkan mereka’ mempertahankan makna kausatif dan kontras dengan ‘menuntun’.
