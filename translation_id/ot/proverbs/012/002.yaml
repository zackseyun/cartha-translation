  text: ט֗וֹב יָפִ֣יק רָ֭צוֹן מֵ/יְהוָ֑ה וְ/אִ֖ישׁ מְזִמּ֣וֹת יַרְשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/002.yaml
  text: A good man obtains favor from Yahweh[b][a], but a man of schemes he condemns.
translation:
  language: id
  text: Orang baik memperoleh perkenanan[a] dari Yahweh, tetapi orang yang merancang kejahatan[b] dinyatakan-Nya bersalah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kerelaan hati” atau “penerimaan.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang rencana-rencana.” Kata Ibrani ini juga dapat berarti “rencana” dalam arti netral; di sini konteksnya menunjukkan rencana yang licik atau jahat.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: orang baik
  rationale: Kata sifat ini dipakai secara substantival untuk menyebut seseorang yang berkarakter baik. Tambahan “orang” diperlukan agar wajar dalam bahasa Indonesia tanpa mempersempit maknanya menjadi satu kebajikan tertentu.
- source_word: יָפִיק
  choice: memperoleh
  rationale: Dalam gabungan dengan רָצוֹן dan מֵיְהוָה, bentuk ini secara idiomatis menyatakan bahwa seseorang mendapatkan atau memperoleh perkenanan yang berasal dari Yahweh.
- source_word: רָצוֹן
  choice: perkenanan
  rationale: Dalam konteks ini kata tersebut menunjuk pada penerimaan, kerelaan hati, atau sikap baik ilahi. “Perkenanan” ringkas, alami, dan sesuai dengan laras sastra hikmat.
- source_word: מֵיְהוָה
  choice: dari Yahweh
  rationale: Preposisi מִן menandai sumber perkenanan, sedangkan nama perjanjian יְהוָה dipertahankan sebagai “Yahweh”.
- source_word: אִישׁ מְזִמּוֹת
  choice: orang yang penuh siasat
  rationale: אִישׁ menyebut seorang laki-laki/orang, tetapi dalam pepatah ini mewakili suatu tipe manusia. מְזִמּוֹת pada dirinya dapat berarti rencana, tetapi pertentangannya dengan “orang baik” dan vonis pada akhir ayat memberi nuansa licik atau jahat; “penuh siasat” mempertahankan nuansa itu tanpa menambahkan kata “jahat” ke teks utama.
- source_word: יַרְשִׁיעַ
  choice: dinyatakan-Nya bersalah
  rationale: Hifil dari רשע berarti menyatakan bersalah atau menghukum sebagai orang fasik. Bentuk “-Nya” membawa subjek tersirat, yaitu Yahweh dari klausa pertama, sekaligus mempertahankan keringkasan paralelisme Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks secara langsung memakai Tetragramaton. “Yahweh” mempertahankannya sebagai nama diri ilahi dan tidak mengubahnya menjadi gelar.
- issue: Subjek tersirat pada יַרְשִׁיעַ
  choice: Yahweh dibawa sebagai subjek melalui bentuk “dinyatakan-Nya bersalah”
  alternative: “orang yang penuh siasat dinyatakan bersalah” atau pengulangan eksplisit “Yahweh menyatakan ... bersalah”
  rationale: Klausa kedua tidak menyebut subjek secara eksplisit, tetapi paralelisme paling alami meneruskan Yahweh dari klausa pertama. Bentuk dengan “-Nya” menjernihkan hubungan itu tanpa mengulang nama yang tidak terdapat dalam klausa kedua.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas dan bermartabat khas amsal. Paralelisme antitetis dipertahankan, dan ungkapan “dinyatakan-Nya bersalah” menjaga nuansa yudisial kata kerja Ibrani.
