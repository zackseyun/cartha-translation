source:
  edition: WLC
  text: דֶּ֣רֶךְ אֱ֭וִיל יָשָׁ֣ר בְּ/עֵינָ֑י/ו וְ/שֹׁמֵ֖עַ לְ/עֵצָ֣ה חָכָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/015.yaml
  text: The way of a fool is right in his own eyes[b][a], but he who listens to counsel is wise.
translation:
  language: id
  text: Jalan orang bodoh benar menurut pandangannya sendiri,[a] tetapi orang yang mendengarkan nasihat adalah bijak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Jalan orang bodoh tampak benar baginya.” Secara harfiah: “benar di matanya sendiri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: jalan
  rationale: Mempertahankan metafora khas sastra hikmat bagi arah hidup atau perilaku seseorang tanpa mempersempit maknanya.
- source_word: אֱוִיל
  choice: orang bodoh
  rationale: Dalam Amsal, istilah ini menunjuk kepada orang yang kekurangan hikmat secara moral dan intelektual; padanan ini alami dan mapan dalam bahasa Indonesia.
- source_word: יָשָׁר
  choice: benar
  rationale: Dalam hubungan dengan idiom 'menurut pandangannya sendiri', kata ini menyatakan penilaian bahwa jalannya tepat atau benar, bukan pernyataan objektif bahwa jalannya lurus secara moral.
- source_word: בְּעֵינָיו
  choice: menurut pandangannya sendiri
  rationale: Mengungkapkan idiom Ibrani 'di matanya sendiri' secara alami sebagai penilaian pribadi, sambil mempertahankan penekanan pada diri sendiri.
- source_word: וְשֹׁמֵעַ
  choice: tetapi orang yang mendengarkan
  rationale: Waw berfungsi secara kontras dalam antitesis pepatah ini; bentuk partisipelnya menyatakan ciri umum seseorang yang mau mendengar.
- source_word: לְעֵצָה
  choice: nasihat
  rationale: Padanan modern dan wajar bagi arahan atau pertimbangan yang diberikan kepada seseorang.
- source_word: חָכָם
  choice: adalah bijak
  rationale: 'Mempertahankan fungsi predikatif kata Ibrani: orang yang mendengarkan nasihat terbukti bijak.'
theological_decisions:
- issue: Bentuk tunggal maskulin yang berfungsi generik
  choice: orang bodoh ... pandangannya sendiri; orang yang mendengarkan
  alternative: jalannya sendiri tampak benar baginya; siapa yang mendengarkan nasihat itu bijak
  rationale: Bahasa Indonesia tidak menuntut pronomina bergender. Bentuk tunggal dan maksud representatif sumber tetap dipertahankan tanpa menambahkan penandaan gender yang tidak alami.
- issue: Apakah יָשָׁר menyatakan kebenaran objektif atau penilaian subjektif
  choice: benar menurut pandangannya sendiri
  alternative: tampak benar baginya
  rationale: 'Susunan ini menjaga ketegangan teks: jalan itu dinilai benar dari sudut pandang si bodoh, bukan ditegaskan benar oleh pengamsal. Catatan kaki memberi alternatif yang menjelaskan implikasi idiom tersebut.'
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pola antitesis kedua klausa dipertahankan. Ungkapan 'menurut pandangannya sendiri' dipilih agar idiom Ibrani dapat dipahami pembaca umum, sementara bentuk harfiahnya dicatat dalam catatan kaki.
