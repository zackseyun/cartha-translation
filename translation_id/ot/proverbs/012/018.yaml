base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/018.yaml
  text: There is one who speaks rashly like the thrusts of a sword[b][a], but the tongue of the wise brings healing.
translation:
  language: id
  text: Ada orang yang berbicara tanpa pikir panjang, seperti tikaman-tikaman pedang, tetapi lidah orang bijak mendatangkan kesembuhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "adalah obat."
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Ada orang yang
  rationale: Memperkenalkan suatu tipe orang secara umum dan menghubungkannya secara alami dengan partisip berikutnya.
- source_word: בּוֹטֶה
  choice: berbicara tanpa pikir panjang
  rationale: Mengungkapkan ucapan yang ceroboh dan tidak terkendali dengan bahasa Indonesia yang alami serta mudah dipahami.
- source_word: כְּמַדְקְרוֹת חָרֶב
  choice: seperti tikaman-tikaman pedang
  rationale: Mempertahankan perbandingan yang tajam dan bentuk jamak Ibrani, yang menggambarkan luka akibat tikaman berulang.
- source_word: וּלְשׁוֹן
  choice: tetapi lidah
  rationale: Mempertahankan metafora Ibrani untuk perkataan; kata penghubung adversatif menyatakan kontras antarbait.
- source_word: חֲכָמִים
  choice: orang bijak
  rationale: Merujuk secara generik kepada orang-orang berhikmat tanpa pembatasan gender; dalam idiom Indonesia, bentuk ini dapat mewakili kelas jamak.
- source_word: מַרְפֵּא
  choice: adalah penyembuh
  rationale: Mempertahankan struktur nominal dan ambiguitas leksikal antara sesuatu yang mendatangkan kesembuhan dan suatu obat; catatan kaki memberi alternatif yang alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bernada amsal. Metafora “lidah” serta citra tikaman pedang dipertahankan. Ungkapan “tanpa pikir panjang” dipilih agar makna ucapan gegabah jelas bagi pembaca umum, sementara “adalah penyembuh” menjaga bentuk predikat nominal teks Ibrani.
