  yaml_path: translation/ot/proverbs/012/010.yaml
  text: A righteous man knows the life of his animal[a], but the compassion of the wicked is cruel.
translation:
  language: id
  text: Orang benar memperhatikan kebutuhan hewannya[a], tetapi belas kasihan orang fasik itu kejam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memahami kehidupan hewannya.” Secara harfiah, bahasa Ibrani mengatakan “mengetahui kehidupan/nyawa hewannya”; ungkapan ini menyatakan perhatian yang saksama terhadap kebutuhan dan kesejahteraan hewan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדֵעַ
  choice: memahami
  rationale: Partisipel dari ידע berarti mengetahui atau memahami. Dalam konteks ini, kata tersebut menyiratkan pengenalan yang penuh perhatian terhadap keadaan hewan, tanpa langsung memparafrasakannya sebagai “merawat”.
- source_word: צַדִּיק
  choice: orang benar
  rationale: צַדִּיק menunjuk kepada seseorang yang benar. “Orang benar” adalah ungkapan baku dan alami dalam bahasa Indonesia serta tetap dapat berfungsi secara umum dalam sastra hikmat.
- source_word: נֶפֶשׁ
  choice: keadaan hidup
  rationale: נֶפֶשׁ dapat berarti jiwa, nyawa, kehidupan, atau diri makhluk hidup. Dalam hubungannya dengan hewan, “keadaan hidup” menyampaikan perhatian pada kehidupan dan kesejahteraannya tanpa memberi kesan teknis tentang jiwa hewan.
- source_word: בְּהֶמְתּוֹ
  choice: hewannya
  rationale: בְּהֵמָה dapat menunjuk kepada hewan, khususnya hewan piaraan atau ternak. “Hewannya” mempertahankan bentuk tunggal dan akhiran kepunyaan tanpa mempersempitnya hanya pada sapi atau jenis ternak tertentu.
- source_word: רַחֲמֵי
  choice: belas kasihan
  rationale: Bentuk jamak konstruksi dari רחם mengungkapkan rasa atau tindakan belas kasihan. “Belas kasihan” jelas, alami, dan mempertahankan ironi etis pada baris kedua.
- source_word: רְשָׁעִים
  choice: orang fasik
  rationale: Bentuk substantival jamak ini lazim menunjuk kepada orang-orang yang fasik. Bahasa Indonesia dapat memakai frasa kolektif “orang fasik” secara alami dalam pernyataan umum.
- source_word: אַכְזָרִי
  choice: kejam
  rationale: אַכְזָרִי berarti kejam, tanpa belas kasihan, atau bengis. “Kejam” merupakan padanan langsung dan kuat yang menonjolkan paradoks bahwa belas kasihan orang fasik pun ternyata kejam.
theological_decisions:
- issue: Subjek maskulin tunggal yang berfungsi umum dalam amsal
  choice: orang benar
  alternative: seorang laki-laki yang benar
  rationale: Bahasa Ibrani memakai bentuk maskulin tunggal, tetapi dalam sastra hikmat bentuk itu berfungsi sebagai pernyataan umum. Bahasa Indonesia tidak menandai gender pada kata “orang”; menambahkan “laki-laki” akan terdengar tidak alami dan dapat mempersempit cakupan yang secara pragmatis bersifat umum.
- issue: Makna נֶפֶשׁ ketika dikenakan pada hewan
  choice: keadaan hidup
  alternative: jiwa; nyawa; kebutuhan
  rationale: Terjemahan ini tidak memutuskan persoalan antropologis atau doktrinal mengenai “jiwa” hewan. Frasa “keadaan hidup” mempertahankan acuan kepada kehidupan makhluk tersebut sekaligus membiarkan implikasi perhatian terhadap kebutuhannya muncul dari konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hikmat. Susunan antitetis kedua baris dipertahankan. “Memahami keadaan hidup” dipilih agar makna Ibrani tetap terlihat namun tidak terasa sekaku “mengetahui jiwa hewannya.”
