  text: From the fruit of a man's mouth he is satisfied with good[b][a], and the recompense of a man's hands returns to him.
translation:
  language: id
  text: Seseorang menjadi puas dengan kebaikan dari buah mulutnya,[a] dan balasan dari perbuatan tangannya[b] kembali kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan apa yang baik.” Kata Ibrani yang dipakai dapat berarti kebaikan, hal yang baik, atau manfaat.
    reason: lexical_alternative
  - marker: b
    text: Atau, “hasil perbuatan tangannya.” Kata Ibrani ini dapat menekankan balasan atau hasil yang kembali kepada seseorang karena tindakannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּרִי פִי אִישׁ
  choice: Dari buah mulutnya seseorang
  rationale: Mempertahankan metafora Ibrani tentang perkataan sebagai buah yang dihasilkan mulut, sambil memakai susunan yang wajar dalam bahasa Indonesia. אִישׁ bersifat tunggal dan generik, sehingga diterjemahkan “seseorang”.
- source_word: יִשְׂבַּע טוֹב
  choice: dikenyangkan dengan kebaikan
  rationale: שׂבע berarti menjadi kenyang atau puas. Ungkapan “dikenyangkan” mempertahankan gambaran konkret teks, sedangkan “kebaikan” menjaga keluasan טוֹב, yang dapat menunjuk pada sesuatu yang baik maupun manfaat.
- source_word: וּגְמוּל יְדֵי אָדָם
  choice: dan balasan atas perbuatan tangannya
  rationale: גְמוּל menunjuk pada balasan atau akibat yang diperoleh dari suatu tindakan, bukan sekadar pekerjaan tangan itu sendiri. “Perbuatan tangannya” mengungkapkan metonimia Ibrani secara jelas tanpa menghilangkan gambaran tangan.
- source_word: יָשׁוּב לוֹ
  choice: kembali kepadanya
  rationale: Menerjemahkan arti dasar שׁוב, “kembali,” dan mempertahankan prinsip timbal balik dalam pepatah ini. Bentuk kini menyatakan kebenaran umum sebagaimana lazim dalam amsal.
theological_decisions:
- issue: Istilah tunggal maskulin generik אִישׁ dan אָדָם
  choice: seseorang / -nya
  alternative: seorang laki-laki / manusia
  rationale: Dalam konteks sastra hikmat, kedua istilah itu menyatakan kebenaran umum mengenai manusia, bukan membatasi penerapannya pada laki-laki. Bahasa Indonesia secara alami dapat mempertahankan bentuk tunggal generik dengan “seseorang” dan pronomina “-nya” tanpa menambahkan pembedaan gender yang tidak ditekankan konteks.
- issue: Hubungan antara tindakan dan balasan
  choice: balasan atas perbuatan tangannya kembali kepadanya
  alternative: hasil pekerjaan tangannya kembali kepadanya
  rationale: Pilihan “balasan” mempertahankan daya makna גְמוּל sebagai apa yang diterima kembali akibat perbuatan seseorang, tanpa menentukan apakah balasan itu semata-mata upah positif atau konsekuensi yang lebih luas.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Metafora “buah mulut” dan “dikenyangkan” dipertahankan karena keduanya membentuk gambaran puitis utama ayat; susunan kalimat dibuat alami bagi pembaca umum.
