  text: Better is one who is lightly esteemed and has a servant than one who honors himself and lacks bread[a].
translation:
  language: id
  text: Lebih baik orang yang dipandang rendah tetapi memiliki seorang pelayan daripada orang yang meninggikan diri tetapi kekurangan makanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “daripada orang yang berpura-pura sebagai orang penting tetapi tidak mempunyai makanan.” Kata Ibrani yang diterjemahkan “meninggikan diri” dapat berarti menjadikan diri tampak terhormat atau penting.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Lebih baik
  rationale: Dalam peribahasa komparatif ini, טוֹב berfungsi sebagai pembuka perbandingan, sehingga 'Lebih baik' paling alami dalam bahasa Indonesia.
- source_word: נִקְלֶה
  choice: orang yang dipandang rendah
  rationale: Partisipel nifal ini menunjuk pada orang yang dianggap tidak penting atau rendah dalam pandangan sosial; pilihan ini mempertahankan nuansa penilaian orang lain tanpa memperkerasnya menjadi kebencian.
- source_word: וְעֶבֶד לוֹ
  choice: tetapi mempunyai seorang pelayan
  rationale: Secara harfiah, frasa ini berarti 'dan seorang hamba/pelayan baginya'. 'Mempunyai seorang pelayan' menyampaikan kepemilikan sarana nyata, sedangkan 'tetapi' memperjelas kontras paradoksal yang tersirat.
- source_word: מִמְּתַכַּבֵּד
  choice: orang yang membanggakan diri
  rationale: Bentuk hitpael dari כבד bersifat refleksif dan dapat berarti menampilkan atau menganggap diri terhormat/penting. 'Membanggakan diri' menjaga unsur meninggikan diri, sementara kemungkinan makna berpura-pura penting dicatat dalam catatan kaki.
- source_word: וַחֲסַר לָחֶם
  choice: tetapi kekurangan makanan
  rationale: לֶחֶם dapat berarti roti secara konkret maupun makanan secara umum. Dalam bahasa Indonesia, 'kekurangan makanan' secara alami menyampaikan kebutuhan pokok yang tidak terpenuhi; 'tetapi' menandai kontras dengan citra kehormatan diri.
