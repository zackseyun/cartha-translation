  text: לְֽ/פִי שִׂ֭כְל/וֹ יְהֻלַּל אִ֑ישׁ וְ/נַעֲוֵה לֵ֝֗ב יִהְיֶ֥ה לָ/בֽוּז־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/008.yaml
  text: A man is praised according to his insight[b][a], but one with a twisted heart will be despised.
translation:
  language: id
  text: Seseorang dipuji sesuai dengan kebijaksanaannya, tetapi orang yang hatinya bengkok akan dihina.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang yang bengkok hatinya”; ungkapan ini menunjuk pada watak batin yang menyimpang secara moral.
    reason: cultural_note
lexical_decisions:
- source_word: לְפִי
  choice: sesuai dengan
  rationale: Ungkapan ini menetapkan ukuran atau dasar penilaian; “sesuai dengan” alami dalam bahasa Indonesia dan mempertahankan hubungan proporsionalnya.
- source_word: שִׂכְלוֹ
  choice: kebijaksanaannya
  rationale: Dalam sastra hikmat, kata ini mencakup pengertian, pertimbangan yang baik, dan kecakapan bertindak; “kebijaksanaan” menyampaikan nuansa intelektual sekaligus praktis.
- source_word: יְהֻלַּל
  choice: dipuji
  rationale: Bentuk Pual menyatakan bahwa orang itu menerima pujian. Bentuk kini pasif cocok untuk kebenaran umum dalam amsal.
- source_word: אִישׁ
  choice: seseorang
  rationale: Walaupun bentuk Ibraninya maskulin tunggal, dalam amsal ini pemakaiannya bersifat generik. “Seseorang” menyampaikan cakupan umum secara alami tanpa mengubah acuannya.
- source_word: נַעֲוֵה
  choice: bengkok
  rationale: Kata ini menggambarkan penyimpangan atau kebengkokan moral. “Bengkok” mempertahankan metafora sumber dan tetap mudah dipahami.
- source_word: לֵב
  choice: hati
  rationale: “Hati” mempertahankan idiom Ibrani yang meliputi pikiran, kehendak, dan watak batin, bukan hanya emosi.
- source_word: יִהְיֶה לָבוּז
  choice: akan dihina
  rationale: Konstruksi harfiahnya berarti menjadi sasaran kehinaan atau dipandang hina; “akan dihina” ringkas, alami, dan mempertahankan daya hasilnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang modern, ringkas, dan bermartabat. Paralelisme antarklausa dipertahankan, demikian pula metafora “hati yang bengkok”. Penanda catatan kaki [a] ditempatkan langsung setelah klausa yang dijelaskannya.
