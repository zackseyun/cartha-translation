  register: Bahasa Indonesia baku, ringkas, dan bernada hikmat. Paralel antarkedua bagian dipertahankan melalui 'orang rajin' dan 'orang malas'; istilah 'pekerja paksa' mudah dipahami, sementara catatan kaki menjelaskan latar kerja rodi.
