  naturalness: “Tangan orang rajin akan memerintah” dapat dipahami, tetapi “memegang kekuasaan” adalah ungkapan Indonesia yang lebih alami bagi metonimia ini. “Orang malas akan menjalani kerja paksa” juga lebih idiomatis daripada “akan menjadi pekerja paksa.”
