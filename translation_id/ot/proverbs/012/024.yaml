  text: The hand of the diligent will rule[b][a], but the slack will be put to forced labor.
translation:
  language: id
  text: Tangan orang rajin akan memegang kekuasaan, tetapi orang malas akan menjalani kerja paksa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “akan dikenai kerja rodi.” Kata Ibrani מַס menunjuk pada kerja wajib atau kerja paksa yang dibebankan oleh penguasa.'
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: יַד
  choice: tangan
  rationale: Mempertahankan gambaran konkret Ibrani sebagai metonimia bagi daya atau tindakan; ungkapan ini tetap jelas dan hidup dalam bahasa Indonesia.
- source_word: חָרוּצִים
  choice: orang rajin
  rationale: Menunjuk kepada orang-orang yang tekun dan giat bekerja, serta membentuk kontras personal yang alami dengan רְמִיָּה.
- source_word: תִּמְשׁוֹל
  choice: akan memerintah
  rationale: Verba משל di sini menyatakan kekuasaan atau kedudukan berwenang; 'akan memerintah' merupakan padanan langsung dan ringkas.
- source_word: רְמִיָּה
  choice: orang malas
  rationale: Dalam konteks kontras dengan kerajinan, kata ini menunjuk pada kelambanan atau kemalasan. Bentuk personal dipilih agar sejajar dengan 'orang rajin', meskipun bentuk Ibraninya dapat pula dipahami secara abstrak sebagai 'kemalasan'.
- source_word: תִּהְיֶה
  choice: akan menjadi
  rationale: Menerjemahkan verba 'menjadi/berada' secara alami dalam hubungan predikatif dengan לָמַס tanpa menambahkan gagasan kausatif yang tidak dinyatakan.
- source_word: לָמַס
  choice: pekerja paksa
  rationale: מַס merujuk pada kewajiban kerja yang dipaksakan, termasuk kerja rodi atau corvée, bukan semata-mata pembayaran pajak.
