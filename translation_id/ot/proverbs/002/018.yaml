  text: For her house sinks down to death[a], and her paths to the dead.
translation:
  language: id
  text: Sebab rumahnya tenggelam ke dalam maut, dan jalan-jalannya menuju kepada orang-orang mati[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bayang-bayang orang mati,” istilah puitis bagi mereka yang telah meninggal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan bagi peringatan dalam konteks sebelumnya dan mempertahankan hubungan penjelas antarayat.
- source_word: שָׁחָה
  choice: terbenam
  rationale: Mengungkapkan gerakan turun atau tenggelam secara puitis tanpa menambahkan gagasan kausatif seperti 'membawa'.
- source_word: אֶל מָוֶת
  choice: menuju maut
  rationale: Mempertahankan arah yang dinyatakan oleh אֶל; 'maut' sesuai dengan ragam puitis-hikmat yang bermartabat.
- source_word: בֵּיתָהּ
  choice: rumahnya
  rationale: Mempertahankan gambaran konkret 'rumah' serta kemungkinan makna lebih luas yang tersirat tanpa menjelaskannya secara berlebihan.
- source_word: רְפָאִים
  choice: arwah orang mati
  rationale: Dalam konteks puisi hikmat, kata ini menunjuk kepada orang-orang mati yang berada di alam maut, bukan suku Refaim. Ungkapan ini mempertahankan nuansa puitisnya dengan lebih khusus daripada sekadar 'orang mati'.
- source_word: מַעְגְּלֹתֶיהָ
  choice: jalan-jalannya
  rationale: Padanan alami bagi jalur atau lintasan yang ditempuh; bentuk jamak dipertahankan, dan elipsis verba pada baris kedua tidak diisi secara berlebihan.
theological_decisions:
- issue: Makna רְפָאִים dalam konteks puisi hikmat
  choice: arwah orang mati
  alternative: orang mati; bayang-bayang orang mati; Refaim
  rationale: Konteks menunjuk kepada para penghuni alam maut, bukan kelompok etnis. Pilihan ini menghindari transliterasi yang menyesatkan dan tidak merinci kosmologi melampaui apa yang dinyatakan teks; alternatif puitis dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Paralelisme Ibrani dipertahankan, termasuk pelesapan verba pada klausa kedua. Penanda catatan kaki ditempatkan tepat setelah frasa yang diterangkannya.
