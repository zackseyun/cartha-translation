  yaml_path: translation/ot/proverbs/002/015.yaml
  text: whose paths are crooked[a], and who are devious in their ways,
translation:
  language: id
  text: yang jalan-jalannya bengkok[a] dan yang menyimpang dalam lintasan mereka,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang jalan-jalannya sesat dan yang berliku-liku dalam lintasan mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang ... dan yang
  rationale: Partikel relatif ini menghubungkan ayat dengan orang-orang jamak pada ayat sebelumnya. Pengulangan 'yang' membuat dua unsur paralel jelas dan alami dalam bahasa Indonesia.
- source_word: אָרְחֹתֵיהֶם
  choice: jalan-jalannya
  rationale: אֹרַח menunjuk pada jalan atau pola hidup. 'Jalan-jalan' mempertahankan metafora konkret sekaligus makna moralnya; enklitik '-nya' menyatakan kepunyaan jamak yang ditentukan oleh konteks.
- source_word: עִקְּשִׁים
  choice: bengkok
  rationale: Kata ini menggambarkan sesuatu yang tidak lurus, baik secara harfiah maupun moral. 'Bengkok' mempertahankan kedua lapisan makna tersebut dalam ungkapan Indonesia yang wajar.
- source_word: וּנְלוֹזִים
  choice: menyimpang
  rationale: Bentuk ini berasal dari gagasan berbelok atau menyimpang dari arah yang benar. 'Menyimpang' menyampaikan gerak menjauh sekaligus penyimpangan moral tanpa mempersempitnya menjadi kelicikan semata.
- source_word: בְּמַעְגְּלוֹתָם
  choice: dalam lintasan mereka
  rationale: מַעְגָּל berarti lintasan, jalur, atau jalan yang ditempuh. 'Lintasan' mempertahankan citra perjalanan dan variasi puitis terhadap 'jalan-jalan'.
