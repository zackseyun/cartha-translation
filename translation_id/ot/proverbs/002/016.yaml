  text: to rescue you from the strange woman[c][b][a], from the foreign woman whose words are smooth.
translation:
  language: id
  text: untuk menyelamatkan engkau dari perempuan terlarang[a], dari perempuan asing yang perkataannya manis.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perempuan asing.” Dalam Amsal, istilah ini kerap merujuk kepada perempuan di luar batas perkawinan atau tatanan relasional yang patut, bukan semata-mata kepada asal etnis.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “yang berkata manis” atau “yang kata-katanya menyanjung.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַצִּילְךָ
  choice: untuk menyelamatkan engkau
  rationale: 'Infinitif Hifil dengan akhiran orang kedua tunggal maskulin menyatakan tujuan atau hasil: hikmat menyelamatkan orang yang dinasihati dari bahaya.'
- source_word: מֵאִשָּׁה זָרָה
  choice: dari perempuan jalang
  rationale: זָרָה secara harfiah dapat berarti asing atau bukan milik sendiri, tetapi dalam konteks amsal ini menunjuk kepada perempuan yang berada di luar batas hubungan seksual atau perkawinan yang patut. 'Perempuan jalang' menyampaikan bahaya moralnya tanpa membatasinya hanya pada status etnis.
- source_word: מִנָּכְרִיָּה
  choice: dari perempuan asing
  rationale: נָכְרִיָּה mempertahankan gagasan keasingan atau status orang luar dan membentuk baris sejajar dengan זָרָה. Pengulangan 'dari' mengikuti kesejajaran Ibrani.
- source_word: אֲמָרֶיהָ הֶחֱלִיקָה
  choice: yang melicinkan kata-katanya
  rationale: Bentuk Hifil secara harfiah menyatakan bahwa ia membuat perkataannya licin. Ungkapan ini mempertahankan metafora Ibrani tentang tutur kata yang memikat atau merayu.
theological_decisions:
- issue: Identitas perempuan sebagai 'asing'
  choice: Teks utama membedakan 'perempuan jalang' dan sebutan sejajarnya 'perempuan asing' tanpa menjadikannya tuduhan etnis semata.
  alternative: Menerjemahkan kedua istilah hanya sebagai 'perempuan asing' atau secara khusus sebagai 'perempuan pezina'.
  rationale: Kesejajaran puitis menghubungkan keasingan dengan pelanggaran batas relasional yang patut, tetapi ayat ini sendiri tidak secara eksplisit menyebut perzinaan maupun membatasi maknanya pada asal bangsa.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Engkau' dipakai untuk mempertahankan sapaan orang kedua tunggal dalam wacana pengajaran. Metafora 'melicinkan kata-katanya' sengaja dipertahankan, dengan makna idiomatisnya dijelaskan dalam catatan kaki.
