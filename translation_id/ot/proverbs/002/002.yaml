lexical_decisions:
- source_word: לְהַקְשִׁיב
  choice: dengan memasang ... untuk mendengarkan
  rationale: Infinitif kausatif ini bergantung pada ayat sebelumnya dan menyatakan tindakan sengaja untuk memberi perhatian. Ungkapan Indonesia “memasang telinga untuk mendengarkan” alami sekaligus mempertahankan citra telinga.
- source_word: לַחָכְמָה
  choice: hikmat
  rationale: Preposisi ל mengarahkan perhatian kepada hikmat; “hikmat” merupakan padanan baku dan tepat dalam sastra hikmat.
- source_word: אָזְנֶךָ
  choice: telingamu
  rationale: Bentuk Ibrani tunggal dipertahankan dan cocok dengan ungkapan Indonesia “memasang telinga”.
- source_word: תַּטֶּה
  choice: mencondongkan
  rationale: Kata נטה berarti mencondongkan, mengarahkan, atau membentangkan. “Mencondongkan” mempertahankan gambaran sikap batin yang disengaja dan sejajar dengan tindakan pada baris pertama.
- source_word: לִבְּךָ
  choice: hatimu
  rationale: לֵב mencakup batin, pikiran, dan kehendak. “Hati” mempertahankan keluasan antropologi Ibrani, sedangkan “pikiran” akan mempersempit maknanya.
- source_word: לַתְּבוּנָה
  choice: kepada pengertian
  rationale: תְּבוּנָה menunjuk pada pengertian, wawasan, atau daya membedakan. “Pengertian” alami sebagai pasangan “hikmat”, sementara alternatif yang sah dicatat dalam catatan kaki.
