translation:
  language: id
  text: Sebab, jika engkau berseru memohon pengertian dan meninggikan suaramu untuk memperoleh pemahaman,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berseru memohon pemahaman dan meninggikan suaramu untuk memperoleh pengertian.” Kedua istilah hikmat ini hampir bersinonim dan dapat diterjemahkan dengan urutan padanan yang berbeda tanpa banyak mengubah maknanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: ya, jika
  rationale: Ungkapan ini melanjutkan syarat dari ayat sebelumnya dengan penegasan. “Ya, jika” mempertahankan baik unsur penegasan maupun hubungan bersyaratnya.
- source_word: בִּינָה
  choice: pengertian
  rationale: Kata ini menunjuk pada kemampuan memahami atau memperoleh wawasan. “Pengertian” alami dalam konteks sastra hikmat dan tetap dapat dibedakan dari istilah sejajar berikutnya.
- source_word: תִקְרָא
  choice: berseru meminta
  rationale: Dalam konteks ini קרא menyatakan seruan yang sungguh-sungguh untuk memperoleh sesuatu, bukan tindakan menamai. Tambahan “meminta” membuat sasaran seruan itu jelas dan alami dalam bahasa Indonesia.
- source_word: תְּבוּנָה
  choice: kebijaksanaan
  rationale: Istilah ini sangat berdekatan maknanya dengan בינה dan dapat menunjuk pada kecakapan memahami serta menimbang. “Kebijaksanaan” mempertahankan kesejajaran tanpa memakai kata yang sama persis.
- source_word: תִּתֵּן קוֹלֶךָ
  choice: memperdengarkan suaramu
  rationale: Idiom Ibrani ini secara harfiah berarti “memberikan suaramu”, yakni bersuara dengan nyata dan sungguh-sungguh. “Memperdengarkan suaramu” mempertahankan citra vokalnya dalam ungkapan Indonesia yang wajar.
