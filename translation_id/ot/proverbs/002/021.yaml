source:
  edition: WLC
  text: כִּֽי יְשָׁרִ֥ים יִשְׁכְּנוּ אָ֑רֶץ וּ֝/תְמִימִ֗ים יִוָּ֥תְרוּ בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/021.yaml
  text: For the upright will dwell in the land[a], and the blameless will remain in it.
translation:
  language: id
  text: Sebab orang yang lurus akan mendiami negeri[a], dan orang yang tidak bercela akan tetap tinggal di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bumi.” Kata Ibrani אָרֶץ dapat berarti “negeri” ataupun “bumi.” Di sini dipilih “negeri” karena konteks menekankan tetap tinggal di, atau disingkirkan dari, suatu tempat kediaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menghubungkan ayat tersebut dengan konteks sebelumnya sebagai dasar atau penjelasan; “Sebab” mempertahankan hubungan logis itu secara wajar dalam bahasa Indonesia.
- source_word: יְשָׁרִים
  choice: orang yang lurus
  rationale: Istilah ini menunjuk kepada orang yang lurus secara moral. Pilihan ini mempertahankan citra dasar “lurus” dan tidak menyamakannya begitu saja dengan istilah khusus lain seperti “orang benar”.
- source_word: יִשְׁכְּנוּ
  choice: akan mendiami
  rationale: Verba שכן menyatakan tinggal atau menetap. “Akan mendiami” menyampaikan keberadaan yang tetap dan cocok dengan objek berupa negeri.
- source_word: אָרֶץ
  choice: negeri
  rationale: Dalam konteks pertentangan dengan orang fasik yang akan disingkirkan pada ayat berikutnya, “negeri” menonjolkan tempat kediaman. Namun, cakupan “bumi” tetap mungkin dan dicatat dalam catatan kaki.
- source_word: וּתְמִימִים
  choice: orang yang tidak bercela
  rationale: תמימים menggambarkan keutuhan moral atau integritas. “Orang yang tidak bercela” jelas bagi pembaca modern dan sepadan dengan “orang yang lurus” tanpa menyiratkan kesempurnaan mutlak.
- source_word: יִוָּתְרוּ
  choice: akan tetap tinggal
  rationale: Bentuk Nifal dari יתר berarti ditinggalkan atau tetap tersisa. Dalam konteks ini, “akan tetap tinggal” secara alami mengungkapkan keberlanjutan mereka di negeri itu tanpa menambahkan gagasan perlindungan secara eksplisit.
- source_word: בָהּ
  choice: di sana
  rationale: Pronomina feminin ini merujuk kembali kepada אָרֶץ. “Di sana” merupakan rujukan anaforis yang alami dalam bahasa Indonesia setelah “negeri”.
theological_decisions:
- issue: Cakupan makna אָרֶץ
  choice: negeri
  alternative: bumi
  rationale: Konteks membicarakan orang yang terus menghuni suatu tempat dan orang yang disingkirkan darinya, sehingga “negeri” dipilih. Pilihan ini tidak dimaksudkan untuk memaksakan wilayah tertentu atau doktrin teritorial yang sempit; kemungkinan “bumi” dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme Ibrani dipertahankan melalui pasangan “orang yang lurus” dan “orang yang tidak bercela,” serta “akan mendiami” dan “akan tetap tinggal.” Bentuk tunggal kolektif “orang yang” dipakai secara alami dalam bahasa Indonesia untuk kelompok orang.
