  yaml_path: translation/ot/proverbs/002/012.yaml
  text: to deliver you from the evil way[a], from the man who speaks perverse things,
translation:
  language: id
  text: untuk melepaskanmu dari jalan yang jahat, dari orang yang mengatakan hal-hal yang menyimpang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hal-hal yang bengkok.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַצִּילְךָ
  choice: untuk menyelamatkanmu
  rationale: Infinitif Hifil dengan akhiran orang kedua tunggal menyatakan tujuan dalam konteks ini. “Menyelamatkanmu” secara alami menyampaikan tindakan meluputkan atau melindungi tanpa membatasi maknanya pada keselamatan rohani.
- source_word: מִדֶּרֶךְ רָע
  choice: dari jalan yang jahat
  rationale: 'דֶּרֶךְ mempertahankan gambaran jalan sekaligus makna kiasan berupa cara hidup, sedangkan רָע memberi penilaian moral: jalan itu jahat.'
- source_word: מֵאִישׁ
  choice: dari orang
  rationale: אִישׁ berbentuk tunggal maskulin, tetapi di sini menunjuk pada satu tipe pelaku secara representatif. Dalam bahasa Indonesia, “orang” merupakan padanan tunggal yang paling alami dan tidak meniadakan ciri gramatikal penting apa pun dari konteks.
- source_word: מְדַבֵּר
  choice: yang mengucapkan
  rationale: Partisipel ini menggambarkan kebiasaan atau ciri orang tersebut. Klausa relatif dengan “yang mengucapkan” alami dalam bahasa Indonesia.
- source_word: תַּהְפֻּכוֹת
  choice: perkataan yang menyimpang
  rationale: Nomina jamak ini mengacu pada ucapan yang bengkok, terbalik, atau menyimpang dari kelurusan. “Perkataan yang menyimpang” mempertahankan unsur ujaran yang tersirat oleh מְדַבֵּר dan daya moral istilah tersebut.
theological_decisions:
- issue: Rujukan maskulin pada אִישׁ
  choice: orang
  alternative: laki-laki
  rationale: Bentuk Ibrani memang maskulin tunggal, tetapi fungsi peribahasa ini bersifat representatif dan tidak menegaskan jenis kelamin pelaku sebagai pokok makna. “Orang” adalah bentuk tunggal alami dalam bahasa Indonesia; “laki-laki” akan menambahkan penekanan biologis yang tidak dituntut konteks.
- issue: Makna moral תַּהְפֻּכוֹת
  choice: perkataan yang menyimpang
  alternative: perkataan yang berbelit-belit
  rationale: Pilihan utama menjaga kecaman moral terhadap ujaran yang bengkok tanpa mempersempitnya menjadi sekadar gaya bicara yang rumit atau tidak langsung.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk “-mu” sesuai dengan sapaan orang kedua tunggal dalam teks Ibrani dan membuat hubungan ayat ini dengan konteks nasihat tetap alami.
