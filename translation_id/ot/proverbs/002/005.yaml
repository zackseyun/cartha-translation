  text: Then you will understand the fear of Yahweh and find the knowledge of God[a].
translation:
  language: id
  text: Maka engkau akan memahami takut akan Yahweh dan menemukan pengetahuan tentang Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: Maka
  rationale: Menandai hasil logis sekaligus kelanjutan dari syarat-syarat dalam ayat 1–4; “maka” ringkas dan alami dalam bahasa Indonesia.
- source_word: תָּבִין
  choice: engkau akan memahami
  rationale: Bentuk imperfek Qal orang kedua tunggal menyatakan bahwa orang yang disapa akan sampai pada pemahaman; “memahami” mempertahankan makna dasar verba בין.
- source_word: יִרְאַת יְהוָה
  choice: rasa takut akan Yahweh
  rationale: Mempertahankan ungkapan khas sastra hikmat tentang takut yang penuh hormat kepada Yahweh tanpa mempersempitnya menjadi sekadar penghormatan.
- source_word: וְדַעַת אֱלֹהִים
  choice: dan ... pengetahuan tentang Allah
  rationale: דַּעַת berarti “pengetahuan,” sedangkan אֱלֹהִים di sini menunjuk kepada Allah. “Tentang Allah” mempertahankan konstruksi yang dapat dipahami sebagai Allah sebagai objek pengetahuan.
- source_word: תִּמְצָא
  choice: menemukan
  rationale: Mempertahankan arti dasar מצא serta gambaran pencarian dan penemuan dari konteks sebelumnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung; “Yahweh” mempertahankannya sebagai nama diri.
- issue: Makna יִרְאַת יְהוָה
  choice: rasa takut akan Yahweh
  alternative: sikap hormat kepada Yahweh
  rationale: Pilihan utama mempertahankan keluasan dan ketegangan makna “takut” dalam tradisi hikmat, yang mencakup rasa gentar dan hormat, tanpa mereduksinya menjadi hormat saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti “engkau” mempertahankan sapaan orang kedua tunggal dalam teks Ibrani. Susunan paralel “memahami ... dan menemukan ...” dipertahankan.
