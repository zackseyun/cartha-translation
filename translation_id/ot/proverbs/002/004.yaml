lexical_decisions:
- source_word: אִם
  choice: jika
  rationale: Mempertahankan fungsi syarat yang melanjutkan rangkaian nasihat dalam konteks.
- source_word: תְּבַקְשֶׁנָּה
  choice: engkau mencarinya
  rationale: Verba בקשׁ berarti mencari. Akhiran feminin tunggal mengacu pada hikmat atau pengertian dalam ayat-ayat sebelumnya; bentuk '-nya' mempertahankan rujukan itu secara alami dalam bahasa Indonesia tanpa menentukan lebih jauh antesedennya.
- source_word: כַכָּסֶף
  choice: seperti perak
  rationale: Prefiks כ menyatakan perbandingan; frasa ini mempertahankan gambaran sesuatu yang bernilai dan dicari dengan sungguh-sungguh.
- source_word: וְכַמַּטְמוֹנִים
  choice: dan seperti harta terpendam
  rationale: מַטְמוֹנִים menunjuk pada barang berharga yang disembunyikan atau ditimbun. 'Harta terpendam' secara alami menyampaikan nilai sekaligus ketersembunyiannya.
- source_word: תַּחְפְּשֶׂנָּה
  choice: menyelidikinya
  rationale: Verba חפשׂ menyatakan pencarian yang saksama atau tekun. 'Menyelidikinya' membedakannya dari בקשׁ pada baris pertama sekaligus menekankan usaha pencarian yang mendalam.
