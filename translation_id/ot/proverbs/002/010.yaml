  yaml_path: translation/ot/proverbs/002/010.yaml
  text: For wisdom will enter your heart[b][a], and knowledge will be pleasant to your soul.
translation:
  language: id
  text: Sebab hikmat akan masuk ke dalam hatimu[a], dan pengetahuan akan terasa menyenangkan bagi jiwamu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ketika hikmat masuk ke dalam hatimu.”
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani yang diterjemahkan “jiwa” juga dapat berarti “diri” atau “kehidupan,” bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Dalam rangkaian nasihat dan janji pada konteks ini, כִּי paling wajar dipahami sebagai pengantar alasan atau penjelasan. Namun, makna temporal “ketika” tetap mungkin dan dicatat dalam catatan kaki.
- source_word: תָבוֹא
  choice: akan masuk
  rationale: Kata kerja בוא berarti datang atau masuk. Dengan בְּלִבֶּךָ, padanan “masuk ke dalam hatimu” menyampaikan gambaran Ibrani secara alami; bentuk mendatang sesuai dengan konteks janji pengajaran.
- source_word: חָכְמָה
  choice: hikmat
  rationale: “Hikmat” adalah padanan baku bagi חָכְמָה dan mempertahankan istilah utama kitab Amsal serta cakupan moral-intelektualnya.
- source_word: בְלִבֶּךָ
  choice: ke dalam hatimu
  rationale: לֵב menunjuk pusat batin manusia, termasuk pikiran dan kehendak. “Hati” mempertahankan ungkapan dan antropologi Ibrani tanpa mempersempitnya menjadi pikiran saja.
- source_word: וְדַעַת
  choice: dan pengetahuan
  rationale: דַּעַת berarti pengetahuan dan perlu dibedakan dari istilah lain dalam kosakata hikmat yang berarti pengertian atau kebijaksanaan.
- source_word: לְנַפְשְׁךָ
  choice: bagi jiwamu
  rationale: נֶפֶשׁ dapat berarti jiwa, diri, atau kehidupan. “Jiwamu” mempertahankan ungkapan Ibrani dan kesejajaran puitis dengan “hatimu,” sementara alternatif leksikal dicatat.
- source_word: יִנְעָם
  choice: akan terasa menyenangkan
  rationale: נעם menyatakan keadaan yang menyenangkan, manis, atau nikmat. “Akan terasa menyenangkan” alami dalam bahasa Indonesia dan mempertahankan sifat predikatif kata kerja tersebut tanpa mengubahnya menjadi tindakan “menyenangkan” dalam arti menghibur.
theological_decisions:
- issue: Antropologi Ibrani dalam לֵב dan נֶפֶשׁ
  choice: Mempertahankan “hati” dan “jiwa” dalam teks utama
  alternative: “pikiran” dan “diri” atau “kehidupan”
  rationale: Kedua istilah ini menggambarkan batin manusia dalam ungkapan Ibrani yang luas. Mempertahankan “hati” dan “jiwa” menjaga tekstur sastra dan teologis ayat tanpa memaksakan pemisahan filosofis yang lebih belakangan; keluasan makna נֶפֶשׁ dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel “hatimu” dan “jiwamu” dipertahankan, sedangkan “akan terasa menyenangkan bagi” dipilih agar predikat Ibrani terdengar alami dan tidak disalahpahami sebagai tindakan aktif.
