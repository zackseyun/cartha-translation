lexical_decisions:
- source_word: הַשְּׂמֵחִים
  choice: yang bersukacita
  rationale: Partisipel ini mencirikan orang-orang yang dibicarakan dalam ayat sebelumnya. “Bersukacita” mempertahankan unsur kegembiraan yang kuat dan bernilai moral dalam konteks ini.
- source_word: לַעֲשׂוֹת
  choice: berbuat
  rationale: Infinitif dari עשה secara langsung menyatakan tindakan “berbuat”. Bentuk ini alami bersama “jahat” dalam bahasa Indonesia dan tidak menambahkan gagasan kebiasaan yang tidak dinyatakan secara eksplisit.
- source_word: רָע
  choice: jahat
  rationale: Dalam konteks hikmat Amsal, kata ini terutama menunjuk pada kejahatan moral. “Jahat” menyampaikan daya moral tersebut secara ringkas dan alami.
- source_word: יָגִילוּ
  choice: bersorak-sorai
  rationale: Kata גיל mengungkapkan kegembiraan yang meluap. “Bersorak-sorai” membedakannya dari שמח pada baris pertama sekaligus mempertahankan peningkatan intensitas dalam paralelisme.
- source_word: בְּתַהְפֻּכוֹת
  choice: atas berbagai penyimpangan
  rationale: Bentuk jamak ini menunjuk pada hal, tindakan, atau pola yang terbalik dari yang lurus. “Berbagai penyimpangan” mempertahankan kemajemukan dan keluasan maknanya tanpa membatasinya hanya pada satu jenis perbuatan.
- source_word: רָע
  choice: yang jahat
  rationale: Kata terakhir memberi ciri moral pada berbagai penyimpangan tersebut. Klausa relatif singkat ini lebih alami dalam bahasa Indonesia daripada susunan harfiah “penyimpangan kejahatan”.
