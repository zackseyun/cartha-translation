  text: ו/צפן לַ֭/יְשָׁרִים תּוּשִׁיָּ֑ה מָ֝גֵ֗ן לְ/הֹ֣לְכֵי תֹֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/007.yaml
  text: He stores up sound wisdom for the upright[b][a]; he is a shield to those who walk in integrity.
translation:
  language: id
  text: Ia menyediakan kebijaksanaan yang sehat[a] bagi orang-orang yang lurus; Ia adalah perisai bagi mereka yang hidup dalam integritas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pertimbangan yang sehat”, “kecakapan”, atau “keberhasilan”; istilah Ibrani ini dapat menunjuk kepada hikmat yang efektif dan mendatangkan kesejahteraan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mereka yang berjalan dalam keutuhan”; dapat juga diterjemahkan “tanpa cela”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָפַן
  choice: menyimpan
  rationale: Kata kerja צפן menyatakan tindakan menyimpan, menimbun, atau menyediakan sesuatu sebagai cadangan. “Menyimpan” mempertahankan gambaran konkret dan wajar dalam bahasa Indonesia modern.
- source_word: לַיְשָׁרִים
  choice: bagi orang-orang yang lurus
  rationale: יְשָׁרִים menunjuk kepada orang yang lurus secara moral. Frasa ini jelas, alami, dan mempertahankan metafora etis Ibrani.
- source_word: תּוּשִׁיָּה
  choice: hikmat yang berguna
  rationale: תּוּשִׁיָּה dapat berarti hikmat yang sehat dan efektif, pertimbangan yang baik, kecakapan, atau keberhasilan yang dihasilkan olehnya. “Hikmat yang berguna” menyampaikan baik unsur kebijaksanaan maupun daya gunanya tanpa menyempitkan istilah itu menjadi keberhasilan semata.
- source_word: מָגֵן
  choice: perisai
  rationale: מָגֵן secara konkret berarti “perisai”. Metafora perlindungan dipertahankan, bukan diubah menjadi istilah abstrak.
- source_word: לְהֹלְכֵי
  choice: bagi mereka yang hidup
  rationale: Bentuk partisipel dari הלך secara harfiah berarti “mereka yang berjalan”, tetapi dalam konteks etis menunjuk kepada cara hidup yang terus-menerus. “Mereka yang hidup” menyampaikan idiom tersebut secara alami dalam bahasa Indonesia.
- source_word: תֹם
  choice: dengan tulus
  rationale: תֹם mencakup keutuhan moral, ketulusan, dan integritas. “Dengan tulus” sesuai dengan konstruksi adverbial setelah gagasan berjalan/hidup dan tidak menyiratkan keadaan tanpa dosa.
theological_decisions:
- issue: Hubungan kedua klausa dan subjek מָגֵן
  choice: 'Allah, yang tersirat dari konteks, dipahami sebagai subjek kedua klausa: Ia menyimpan hikmat dan Ia adalah perisai.'
  alternative: 'Klausa kedua dapat dipahami secara eliptis: “perisai [tersimpan/tersedia] bagi mereka yang hidup dengan tulus.”'
  rationale: Teks Ibrani tidak mengulang subjek pada klausa kedua. Konteks dekat, khususnya penyebutan TUHAN pada ayat sebelumnya, paling alami mendukung kelanjutan subjek ilahi, tetapi kemungkinan konstruksi eliptis tidak sepenuhnya ditiadakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora “perisai” dipertahankan, sedangkan idiom Ibrani “berjalan” dialihkan menjadi “hidup” agar mudah dipahami. Huruf kapital pada “Ia” menandai rujukan kepada TUHAN dari konteks ayat sebelumnya tanpa menambahkan nama ilahi ke dalam teks ayat.
