  text: who abandon the paths of uprightness to walk in the ways of darkness,[a]
translation:
  language: id
  text: yang meninggalkan jalan-jalan yang lurus untuk berjalan di jalan-jalan kegelapan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֹזְבִים
  choice: yang meninggalkan
  rationale: Partisipel ini berfungsi secara substantival dan melanjutkan gambaran tentang orang-orang pada ayat sebelumnya. “Meninggalkan” menyampaikan tindakan menjauh secara sengaja tanpa berlebihan.
- source_word: אָרְחוֹת
  choice: jalan-jalan
  rationale: Bentuk jamak ini merupakan metafora hikmat bagi arah atau pola hidup. “Jalan-jalan” mempertahankan metafora dan kesejajarannya dengan דַרְכֵי.
- source_word: יֹשֶׁר
  choice: kelurusan
  rationale: Kata ini menunjuk pada kelurusan moral atau apa yang benar. “Kelurusan” mempertahankan hubungan gambarannya dengan jalan, meskipun “kebenaran” lebih lazim dalam bahasa sehari-hari.
- source_word: לָלֶכֶת
  choice: untuk berjalan
  rationale: Infinitif ini menyatakan tujuan atau hasil. “Berjalan” mempertahankan metafora perilaku hidup yang khas dalam sastra hikmat.
- source_word: בְּדַרְכֵי
  choice: di jalan-jalan
  rationale: Preposisi בְּ dengan bentuk jamak konstruktus diterjemahkan secara alami sebagai “di jalan-jalan” dan mempertahankan paralelisme dengan אָרְחוֹת.
- source_word: חֹשֶׁךְ
  choice: kegelapan
  rationale: “Kegelapan” mempertahankan citra Ibrani beserta konotasi moralnya tanpa menggantikannya dengan penafsiran eksplisit seperti “kejahatan”.
theological_decisions:
- issue: Metafora moral kegelapan
  choice: kegelapan
  alternative: kejahatan
  rationale: Teks Ibrani memakai metafora kegelapan untuk arah hidup yang menyimpang. Terjemahan mempertahankan citra tersebut dan tidak mempersempit maknanya menjadi penjelasan teologis eksplisit.
- issue: Makna יֹשֶׁר dalam metafora jalan
  choice: kelurusan
  alternative: apa yang benar
  rationale: “Kelurusan” mempertahankan permainan konseptual antara jalan yang lurus dan kehidupan yang benar. Alternatif “apa yang benar” lebih idiomatis, tetapi mengurangi kekuatan metaforanya.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Struktur klausa dipertahankan karena ayat ini bergantung secara sintaksis pada konteks sebelumnya. Pengulangan “jalan-jalan” disengaja untuk mencerminkan paralelisme Ibrani antara אָרְחוֹת dan דַרְכֵי.
