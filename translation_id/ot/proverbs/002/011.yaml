  text: מְ֭זִמָּה תִּשְׁמֹ֥ר עָלֶ֗י/ךָ תְּבוּנָ֥ה תִנְצְרֶֽ/כָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/011.yaml
  text: Discretion will watch over you[a]; understanding will guard you.
translation:
  language: id
  text: Pertimbangan yang matang akan menjagamu; pengertian akan melindungimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kebijaksanaan akan memeliharamu; pemahaman akan menjagamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזִמָּה
  choice: Kebijaksanaan
  rationale: Dalam konteks positif Amsal, nomina ini menunjuk pada kemampuan berpikir dan merencanakan dengan arif, bukan siasat jahat. “Kebijaksanaan” alami bagi pembaca umum, meski cakupannya dapat pula dinyatakan sebagai pertimbangan yang matang.
- source_word: תִּשְׁמֹר עָלֶיךָ
  choice: akan menjaga engkau
  rationale: Gabungan שׁמר dengan עַל menyatakan penjagaan yang melindungi seseorang. “Menjaga engkau” mempertahankan arah tindakan kepada orang kedua dan terdengar wajar dalam ragam Alkitab yang bermartabat.
- source_word: תְּבוּנָה
  choice: pengertian
  rationale: Istilah hikmat ini menyatakan kemampuan memahami dan membedakan dengan tepat. “Pengertian” merupakan padanan langsung dan luas tanpa mempersempit maknanya.
- source_word: תִנְצְרֶכָּה
  choice: akan melindungi engkau
  rationale: נצר dapat berarti menjaga, memelihara, atau melindungi. “Melindungi” mempertahankan nuansa protektif sekaligus menghindari pengulangan kata “menjaga” dalam paralelisme.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “engkau” dipakai untuk sapaan orang kedua tunggal sesuai konteks nasihat seorang ayah kepada anaknya. Paralelisme Ibrani dipertahankan dengan dua istilah kemampuan batin dan dua verba perlindungan.
