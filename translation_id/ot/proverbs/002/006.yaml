id: PRO.2.6
reference: Proverbs 2:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי יְ֭הוָה יִתֵּ֣ן חָכְמָ֑ה מִ֝/פִּ֗י/ו דַּ֣עַת וּ/תְבוּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/006.yaml
  text: For Yahweh gives wisdom[c][b][a]; from his mouth come knowledge and understanding.
translation:
  language: id
  text: Sebab[a] Yahweh memberikan hikmat; dari mulut-Nya datang pengetahuan dan pengertian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Karena”.
    reason: lexical_alternative
  - marker: b
    text: Atau “daya membedakan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Partikel ini memperkenalkan dasar atau penjelasan bagi nasihat sebelumnya. “Sebab” mempertahankan hubungan penjelas itu secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri, bukan diganti dengan gelar, sesuai bentuk Ibrani.
- source_word: יִתֵּן
  choice: memberikan
  rationale: Bentuk imperfek di sini menyatakan kebenaran umum bercorak amsal, bukan semata-mata tindakan pada masa depan.
- source_word: חָכְמָה
  choice: hikmat
  rationale: Padanan baku dalam sastra Amsal yang mempertahankan tema utama kitab ini.
- source_word: מִפִּיו
  choice: dari mulut-Nya datang
  rationale: Mempertahankan gambaran konkret bahwa pengetahuan dan pengertian bersumber dari perkataan Yahweh; kata “datang” dilengkapi secara wajar dalam bahasa Indonesia.
- source_word: דַּעַת
  choice: pengetahuan
  rationale: Padanan langsung dan alami yang sesuai dengan pasangan istilah hikmat dalam ayat ini.
- source_word: וּתְבוּנָה
  choice: dan pengertian
  rationale: “Pengertian” merupakan padanan alami yang mencakup kemampuan memahami, sambil mengakui bahwa istilah ini juga dapat menonjolkan daya membedakan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian ilahi secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada ringkas dan bermartabat. Susunan paralel serta gambaran “dari mulut-Nya” dipertahankan, sementara bentuk verbal dibuat alami bagi pembaca umum.
