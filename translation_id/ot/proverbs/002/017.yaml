  text: הַ֭/עֹזֶבֶת אַלּ֣וּף נְעוּרֶ֑י/הָ וְ/אֶת בְּרִ֖ית אֱלֹהֶ֣י/הָ שָׁכֵֽחָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/017.yaml
  text: who abandons the companion of her youth and forgets the covenant of her God[a][b].
translation:
  language: id
  text: 'yang meninggalkan teman hidup masa mudanya[a]

    dan melupakan perjanjian Allahnya[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suami masa mudanya”. Kata Ibrani yang dipakai dapat berarti teman atau rekan yang akrab dan di sini kemungkinan menunjuk pada pasangan nikahnya.
    reason: lexical_alternative
  - marker: b
    text: “Perjanjian Allahnya” kemungkinan menunjuk pada perjanjian perkawinan yang dibuat di bawah wewenang atau kesaksian Allah, tetapi dapat juga menggemakan kewajibannya yang lebih luas dalam perjanjian dengan Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֹזֶבֶת
  choice: yang meninggalkan
  rationale: Partisipel Qal feminin tunggal ini menggambarkan perempuan yang disebut dalam konteks sebelumnya. “Meninggalkan” alami dalam bahasa Indonesia dan mencakup nuansa menelantarkan atau berpaling tanpa menjadi terlalu arkais.
- source_word: אַלּוּף
  choice: teman hidup
  rationale: Kata ini dapat berarti sahabat dekat atau rekan karib. Dalam konteks “masa mudanya” dan paralelnya dengan perjanjian, yang dimaksud kemungkinan besar ialah pasangan nikahnya. “Teman hidup” mempertahankan unsur kedekatan sekaligus menyampaikan konteks perkawinan tanpa langsung mempersempitnya menjadi “suami”.
- source_word: נְעוּרֶיהָ
  choice: masa mudanya
  rationale: Ungkapan ini menunjuk pada masa muda perempuan tersebut dan secara alami membentuk frasa “teman hidup masa mudanya” dalam bahasa Indonesia.
- source_word: וְאֶת
  choice: dan
  rationale: Konjungsi Ibrani menghubungkan tindakan kedua dengan tindakan pertama; penanda objek אֶת tidak perlu diterjemahkan tersendiri.
- source_word: בְּרִית
  choice: perjanjian
  rationale: “Perjanjian” mempertahankan bobot formal, relasional, dan teologis בְּרִית tanpa menentukan secara berlebihan apakah acuannya hanya perjanjian perkawinan atau kewajiban perjanjian kepada Allah secara lebih luas.
- source_word: אֱלֹהֶיהָ
  choice: Allahnya
  rationale: Akhiran feminin orang ketiga tunggal dinyatakan dengan “-nya”. Bentuk “Allahnya” ringkas, wajar, dan mempertahankan pertanggungjawaban pribadi yang ada dalam teks Ibrani.
- source_word: שָׁכֵחָה
  choice: melupakan
  rationale: Walaupun bentuk Ibraninya perfektif, dalam gambaran amsal tindakan ini berfungsi sebagai ciri perempuan tersebut. “Melupakan” di sini dapat mencakup pengabaian perjanjian, bukan sekadar kegagalan mengingat.
theological_decisions:
- issue: Apakah בְּרִית אֱלֹהֶיהָ secara khusus menunjuk pada perjanjian perkawinan di hadapan Allah atau pada kewajiban perjanjian kepada Allah secara lebih luas
  choice: perjanjian Allahnya, dengan kemungkinan kuat merujuk pada perjanjian perkawinan di bawah wewenang atau kesaksian Allah
  alternative: perjanjian perkawinannya di hadapan Allah; atau perjanjian Allah dalam arti kewajiban keagamaan yang lebih luas
  rationale: Paralel dengan “teman hidup masa mudanya” sangat mendukung konteks perkawinan. Namun, bunyi harfiahnya tetap “perjanjian Allahnya”, sehingga terjemahan utama mempertahankan keluasan dan ketegangan teologis ungkapan Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan dua baris mempertahankan paralelisme puisi Ibrani. “Teman hidup” dipilih sebagai padanan yang alami bagi relasi akrab sekaligus membuka implikasi perkawinan; catatan kaki menyediakan padanan yang lebih eksplisit.
