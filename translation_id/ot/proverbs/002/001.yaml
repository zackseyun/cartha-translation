base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/001.yaml
  text: My son[a], if you receive my words and store up my commandments with you[b],
translation:
  language: id
  text: Putraku[a], jika engkau menerima perkataanku dan menyimpan baik-baik perintah-perintahku bersamamu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Anakku.” Kata Ibrani yang dipakai berbentuk tunggal maskulin dan secara harfiah berarti “putraku”, yaitu bentuk sapaan yang lazim dalam pengajaran seorang ayah di kitab Amsal.
    reason: lexical_alternative
  - marker: b
    text: Atau, “menyimpannya sebagai harta.” Secara harfiah, “bersamamu.” Kata kerja Ibraninya dapat menyatakan menyimpan sesuatu dengan cermat agar tetap aman.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Putraku
  rationale: Sapaan tunggal maskulin ini secara harfiah berarti “putraku”. Bentuk tersebut mempertahankan gambaran pengajaran seorang ayah kepada putranya dalam sastra Amsal.
- source_word: אִם
  choice: jika
  rationale: Kata ini membuka anak kalimat bersyarat; “jika” mempertahankan daya kondisionalnya secara langsung.
- source_word: תִּקַּח
  choice: menerima
  rationale: Walaupun makna dasarnya adalah “mengambil”, dengan objek “perkataanku” kata ini menyatakan penerimaan yang terbuka terhadap pengajaran.
- source_word: אֲמָרָי
  choice: perkataanku
  rationale: Bentuk jamak ini menunjuk pada kata-kata atau ucapan sang pengajar. “Perkataanku” alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi jenis ujaran tertentu.
- source_word: וּמִצְוֺתַי
  choice: dan perintah-perintahku
  rationale: Bentuk jamak tersebut menyatakan berbagai perintah sang pengajar dan mempertahankan bobot moral serta instruksional istilah Ibrani.
- source_word: תִּצְפֹּן
  choice: menyimpan baik-baik
  rationale: Kata kerja ini menggambarkan menyimpan atau menyembunyikan sesuatu dengan cermat agar tetap aman. “Menyimpan baik-baik” menyampaikan unsur penjagaan yang disengaja dalam bahasa Indonesia yang wajar.
- source_word: אִתָּךְ
  choice: pada dirimu
  rationale: Ungkapan ini secara harfiah berarti “bersamamu” dan dalam konteks menyatakan bahwa perintah itu disimpan dalam penguasaan atau penjagaan orang tersebut. “Pada dirimu” menjaga gambaran itu tanpa menambahkan “dalam hati”, yang tidak terdapat dalam teks.
theological_decisions:
- issue: Sapaan anak laki-laki dalam pengajaran hikmat
  choice: Putraku
  alternative: Anakku
  rationale: Teks Ibrani memakai bentuk tunggal maskulin dalam kerangka sastra pengajaran ayah kepada putra. Terjemahan utama mempertahankan jenis kelamin gramatikal dan gambaran sastranya, sedangkan bentuk Indonesia yang lebih umum dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai untuk mempertahankan sapaan pribadi tunggal dalam pengajaran ayah kepada putranya. Susunan kalimat dibiarkan terbuka dengan koma karena ayat ini merupakan awal dari kalimat bersyarat yang berlanjut ke ayat berikutnya.
