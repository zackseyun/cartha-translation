  text: to guard the paths of justice[a], and he watches over the way of his faithful ones.
translation:
  language: id
  text: untuk menjaga jalan-jalan keadilan, dan Dia melindungi jalan orang-orang yang setia kepada-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks tertulis Ibrani (ketiv) berbunyi “orang yang setia kepada-Nya”; pembacaan Masoret (qere) berbunyi “orang-orang yang setia kepada-Nya.” Istilah ini juga dapat diterjemahkan “orang-orang saleh-Nya” dan menunjuk pada mereka yang hidup dalam kesetiaan kepada Allah.
    reason: Perbedaan ketiv/qere pada חסידו/חסידיו serta nuansa kesetiaan atau kesalehan perlu dipertahankan secara tepat.
lexical_decisions:
- source_word: לִנְצֹר
  choice: untuk menjaga
  rationale: Bentuk infinitif menyatakan tujuan atau hasil dalam kesinambungan dengan ayat sebelumnya. “Menjaga” mempertahankan nuansa perlindungan dari נצר dan cocok secara alami dengan “jalan-jalan”.
- source_word: אָרְחוֹת
  choice: jalan-jalan
  rationale: Bentuk jamak ini menunjuk pada jalan atau lintasan. “Jalan-jalan” mudah dipahami dan mempertahankan bentuk jamaknya.
- source_word: מִשְׁפָּט
  choice: keadilan
  rationale: Dalam konteks etis kitab Amsal, מִשְׁפָּט mengacu pada keadilan atau apa yang benar, bukan hanya putusan hukum.
- source_word: וְדֶרֶךְ
  choice: dan ... jalan
  rationale: “Jalan” menerjemahkan דֶרֶךְ secara wajar. Bentuk tunggalnya dipertahankan sebagai pasangan puitis bagi “jalan-jalan” pada baris sebelumnya.
- source_word: חסידו
  choice: orang-orang yang setia kepada-Nya
  rationale: Istilah חָסִיד menunjuk pada orang yang bercirikan kesetiaan atau kesalehan dalam hubungan dengan Allah. Bentuk jamak dipilih sesuai pembacaan Masoret yang lazim dan konteks kolektif, sementara persoalan bentuk tekstual dicatat dalam catatan kaki.
- source_word: יִשְׁמֹר
  choice: Dia melindungi
  rationale: שׁמר dapat berarti menjaga, mengawasi, atau melindungi. “Melindungi” mempertahankan makna protektif dan menghindari pengulangan kaku dengan “menjaga” pada klausa pertama.
theological_decisions:
- issue: Subjek tersirat dari יִשְׁמֹר
  choice: Allah, dinyatakan dengan “Dia”
  alternative: Subjek tidak tentu atau generik
  rationale: Dalam Amsal 2:6–8, TUHAN adalah pelaku yang memberi hikmat dan menjadi perisai. Klausa ini meneruskan penggambaran tindakan-Nya.
- issue: Jumlah dan makna חסידו
  choice: “orang-orang yang setia kepada-Nya”
  alternative: “orang yang setia kepada-Nya” atau “orang saleh-Nya”
  rationale: Pembacaan jamak merupakan pembacaan Masoret yang lazim dan sesuai dengan cakupan umum pernyataan ini. Catatan kaki mempertahankan kesadaran akan bentuk konsonantal yang dapat dipahami sebagai tunggal serta nuansa kesalehan dan kesetiaan perjanjian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur infinitif pada awal ayat serta peralihan ke verba finit dipertahankan. “Dia” dan “-Nya” memakai huruf kapital karena merujuk kepada Allah.
