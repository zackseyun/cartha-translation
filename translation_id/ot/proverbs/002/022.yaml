source:
  edition: WLC
  text: וּ֭/רְשָׁעִים מֵ/אֶ֣רֶץ יִכָּרֵ֑תוּ וּ֝/בוֹגְדִ֗ים יִסְּח֥וּ מִמֶּֽ/נָּה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/022.yaml
  text: But the wicked will be cut off from the land[b][a], and the treacherous will be uprooted from it.
translation:
  language: id
  text: Namun, orang-orang fasik akan disingkirkan dari negeri[a], dan mereka yang berkhianat akan direnggut dari sana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bumi”. Kata Ibrani אֶרֶץ dapat berarti “negeri” atau “bumi”; di sini “negeri” sesuai dengan perbandingan dengan orang lurus yang tetap tinggal di sana dalam ayat sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “dicabut dari sana”. Kata kerja Ibrani ini menyatakan penyingkiran secara paksa.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Bentuk jamak substantival ini menunjuk kepada orang-orang yang jahat secara moral. “Orang-orang fasik” ringkas, wajar dalam ragam Alkitab Indonesia, dan mempertahankan makna golongan.
- source_word: מֵאֶרֶץ
  choice: dari negeri
  rationale: אֶרֶץ dapat berarti “negeri/tanah” atau “bumi”. Konteks langsung dalam Amsal 2:21–22 membandingkan orang benar yang tetap tinggal di negeri dengan orang fasik yang disingkirkan darinya.
- source_word: יִכָּרֵתוּ
  choice: akan disingkirkan
  rationale: Nifal imperfek dari כרת secara harfiah menggambarkan tindakan “dipotong” atau “dilenyapkan”. “Disingkirkan” menyampaikan penghapusan paksa dari negeri secara alami dalam bahasa Indonesia tanpa memberi kesan bahwa tubuh mereka secara harfiah dipotong.
- source_word: בוֹגְדִים
  choice: mereka yang berkhianat
  rationale: Partisipel ini menunjuk kepada orang-orang yang bertindak licik, tidak setia, atau berkhianat. Bentuk “mereka yang berkhianat” alami dan mempertahankan sifat tindakan yang berulang atau menjadi ciri mereka.
- source_word: יִסְּחוּ
  choice: akan direnggut
  rationale: Kata kerja נסח menyatakan tindakan mencabut, menarik, atau menyingkirkan dengan paksa. “Direnggut” mempertahankan daya paksa ungkapan Ibrani tanpa mewajibkan metafora tumbuhan.
- source_word: מִמֶּנָּה
  choice: dari sana
  rationale: Akhiran pronominal feminin merujuk kembali kepada אֶרֶץ. Dalam bahasa Indonesia, “dari sana” menghindari pengulangan “negeri” dan lebih alami daripada “darinya” untuk tempat.
- source_word: וְ
  choice: Namun ... dan ...
  rationale: Kata penghubung pertama menyatakan pertentangan dengan ayat 21, sedangkan kata penghubung kedua mengoordinasikan dua klausa yang sejajar.
theological_decisions:
- issue: Cakupan makna אֶרֶץ dalam konteks sastra hikmat
  choice: negeri
  alternative: bumi
  rationale: Konteks terdekat membandingkan orang lurus yang mendiami negeri dengan orang fasik yang disingkirkan darinya. “Negeri” mempertahankan pertentangan tersebut tanpa mengubah pernyataan ini menjadi klaim eskatologis universal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hikmat yang bermartabat. “Orang-orang fasik” mempertahankan istilah moral yang lazim dipahami pembaca Alkitab, sedangkan “mereka yang berkhianat” lebih alami daripada bentuk nominal yang kaku. Paralelisme kedua klausa dipertahankan.
