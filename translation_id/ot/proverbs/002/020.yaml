  register: Bahasa Indonesia baku modern dengan sapaan tunggal “engkau,” sesuai corak sastra hikmat. Susunan paralel dan metafora perjalanan dipertahankan, sementara “menempuh” dan “tetap mengikuti” dipilih agar wajar serta mudah dipahami.
