source:
  edition: WLC
  text: לְמַ֗עַן תֵּ֭לֵךְ בְּ/דֶ֣רֶךְ טוֹבִ֑ים וְ/אָרְח֖וֹת צַדִּיקִ֣ים תִּשְׁמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/020.yaml
  text: so that you may walk in the way of the good and keep to the paths of the righteous[a][b].
translation:
  language: id
  text: agar engkau menempuh jalan orang-orang baik[a] dan tetap mengikuti jalur-jalur orang benar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “orang-orang yang baik.” Kata Ibrani yang berarti “baik” dipakai sebagai kata benda untuk menyebut suatu golongan orang.
    reason: lexical_alternative
  - marker: b
    text: Atau “menjaga jalur-jalur orang benar.” Kata kerja Ibrani dapat berarti “menjaga,” “memelihara,” atau “menaati”; di sini kemungkinan besar maksudnya ialah tetap berada pada jalur-jalur tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: agar
  rationale: Menandai tujuan atau hasil yang dimaksud dari ajaran sebelumnya; “agar” alami dalam bahasa Indonesia dan mempertahankan daya purposifnya.
- source_word: תֵּלֵךְ
  choice: engkau menempuh
  rationale: Bentuk imperfek Qal orang kedua tunggal dari הלך berada setelah לְמַעַן. “Menempuh” menyampaikan tindakan berjalan secara metaforis sebagai cara hidup dengan lebih alami daripada ungkapan harfiah yang kaku.
- source_word: בְּדֶרֶךְ
  choice: jalan
  rationale: דֶּרֶךְ dapat berarti jalan secara nyata atau cara hidup secara kiasan. “Menempuh jalan” mempertahankan kedua lapisan gambaran tersebut.
- source_word: טוֹבִים
  choice: orang-orang baik
  rationale: Adjektiva maskulin jamak ini dipakai secara substantival untuk suatu golongan orang. Bahasa Indonesia secara alami mengungkapkannya sebagai “orang-orang baik” tanpa menentukan gender.
- source_word: וְאָרְחוֹת
  choice: dan ... jalur-jalur
  rationale: Bentuk jamak אֹרַח menunjuk pada jalur atau lintasan, sering kali secara kiasan pada arah hidup. “Jalur-jalur” mempertahankan variasi puitis terhadap “jalan”.
- source_word: צַדִּיקִים
  choice: orang benar
  rationale: Adjektiva jamak substantival ini menunjuk pada golongan orang yang benar atau lurus secara moral. “Orang benar” merupakan ungkapan Indonesia yang ringkas dan lazim dalam konteks hikmat.
- source_word: תִּשְׁמֹר
  choice: tetap mengikuti
  rationale: שׁמר dapat berarti menjaga, memelihara, atau menaati. Dengan “jalur-jalur” sebagai objek, “tetap mengikuti” secara alami menyatakan bertahan pada arah hidup tersebut dan sejalan dengan klausa pertama.
