  text: All who go in to her do not return, nor do they regain the paths of life.
translation:
  language: id
  text: Semua yang datang kepadanya tidak akan kembali dan tidak akan mencapai jalan-jalan kehidupan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֶיהָ
  choice: yang menghampirinya
  rationale: Secara harfiah berarti ‘orang-orang yang masuk kepada/menemuinya’. Dalam konteks perempuan asing pada ayat-ayat sebelumnya, ‘menghampirinya’ menyampaikan gerak menuju keterlibatan dengannya tanpa membuat implikasi seksual menjadi lebih eksplisit daripada teks sumber.
- source_word: יְשׁוּבוּן
  choice: akan kembali
  rationale: Bentuk ini berasal dari שׁוב, ‘kembali’. Dalam rangkaian dengan gambaran rumah yang menuju maut, frasa ini menyatakan konsekuensi yang dipaparkan sebagai kepastian hikmat.
- source_word: יַשִּׂיגוּ
  choice: akan mencapai lagi
  rationale: נשׂג dalam bentuk ini dapat berarti ‘mencapai, memperoleh, menyusul’. ‘Mencapai lagi’ sesuai dengan paralel ‘kembali’ dan menangkap gagasan mendapatkan kembali akses kepada jalan kehidupan, tanpa mengubahnya menjadi istilah teknis teologis.
- source_word: אָרְחוֹת חַיִּים
  choice: jalan-jalan kehidupan
  rationale: Mempertahankan metafora jamak Ibrani tentang jalur-jalur yang menuju atau mencirikan kehidupan.
theological_decisions:
- issue: Apakah pernyataan tentang tidak kembali harus diperlunak menjadi kemungkinan atau peringatan umum
  choice: 'Mempertahankan bentuk tegas: ‘tidak akan kembali’ dan ‘tidak akan mencapai lagi’'
  alternative: ‘jarang kembali’ atau ‘sulit menemukan kembali’
  rationale: Teks Ibrani memakai negasi langsung dan tidak memberi pembatas eksplisit. Ketegangan dengan kemungkinan pertobatan dalam bagian Alkitab lain tidak diselesaikan dengan melunakkan ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bernada hikmat. Pronomina ‘-nya’ mempertahankan rujukan feminin dari konteks tanpa mengulang ‘perempuan itu’. Paralelisme dua klausa dipertahankan.
