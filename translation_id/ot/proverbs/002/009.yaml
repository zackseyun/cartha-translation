  text: Then you will understand righteousness and justice and equity[a], every good path.
translation:
  language: id
  text: Maka engkau akan memahami kebenaran, keadilan, kelurusan, dan setiap jalan yang baik.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: Maka
  rationale: Menandai hasil yang menyusul dari syarat dan ajaran pada ayat-ayat sebelumnya; alami sebagai penghubung dalam bahasa Indonesia.
- source_word: תָּבִין
  choice: engkau akan memahami
  rationale: Bentuk kata kerja ini menyatakan bahwa orang yang disapa akan memperoleh pengertian atau daya membedakan; “memahami” jelas dan tidak mempersempit maknanya.
- source_word: צֶדֶק
  choice: kebenaran
  rationale: Di sini menunjuk pada apa yang benar secara moral. “Kebenaran” mempertahankan bobot etisnya dan membedakannya dari מִשְׁפָּט.
- source_word: מִשְׁפָּט
  choice: keadilan
  rationale: Istilah ini dapat menunjuk pada putusan, tata hukum, atau keadilan; dalam rangkaian kebajikan ini, “keadilan” paling alami.
- source_word: מֵישָׁרִים
  choice: kelurusan
  rationale: Kata ini berakar pada gambaran tentang sesuatu yang lurus atau rata dan secara etis menunjuk pada kelurusan atau kejujuran. “Kelurusan” mempertahankan metafora dasarnya.
- source_word: כָּל
  choice: setiap
  rationale: Dengan nomina tunggal sesudahnya, makna distributif “setiap” paling wajar.
- source_word: מַעְגַּל
  choice: jalan
  rationale: Secara harfiah berarti jalur atau lintasan dan dalam Amsal kerap menjadi metafora bagi arah hidup.
- source_word: טוֹב
  choice: yang baik
  rationale: Mempertahankan cakupan luas kata sifat ini, baik secara moral maupun praktis.
theological_decisions:
- issue: Hubungan frasa כָּל מַעְגַּל טוֹב dengan tiga unsur sebelumnya
  choice: 'Dipertahankan sebagai frasa akhir yang diletakkan setelah koma: “kebenaran, keadilan, dan kelurusan, setiap jalan yang baik.”'
  alternative: Menambahkan “yakni” dan menjadikannya penjelasan tegas, atau menambahkan “dan” sebagai objek keempat.
  rationale: Teks Ibrani tidak memakai kata penghubung sebelum frasa terakhir. Koma mempertahankan kemungkinan bahwa frasa itu merangkum atau menambahkan objek tanpa menetapkan hubungannya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Kata ganti “engkau” mempertahankan sapaan tunggal dalam konteks pengajaran hikmat. Susunan nominal sengaja dekat dengan teks Ibrani, sementara catatan kaki menjelaskan istilah “kelurusan” yang agak kurang lazim.
