  text: אֵ֣שֶׁת כְּ֭סִילוּת הֹֽמִיָּ֑ה פְּ֝תַיּ֗וּת וּ/בַל יָ֥דְעָה מָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/013.yaml
  text: The woman Folly is loud[a]; she is simple and knows nothing.
translation:
  language: id
  text: Perempuan Kebodohan itu gaduh; ia lugu dan tidak tahu apa-apa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah dalam bahasa Ibrani, “dan ia tidak tahu apa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשֶׁת כְּסִילוּת
  choice: Perempuan Kebodohan
  rationale: Frasa konstruksi ini secara harfiah berarti “perempuan kebodohan.” Dalam Amsal 9, Kebodohan dipersonifikasikan sebagai perempuan, sejajar dengan Hikmat. Bentuk ini mempertahankan personifikasi tanpa menambahkan gelar kehormatan yang tidak ada dalam teks Ibrani.
- source_word: הֹמִיָּה
  choice: gaduh
  rationale: Kata ini menggambarkan sifat yang riuh, ribut, atau hiruk-pikuk. “Gaduh” alami dalam bahasa Indonesia modern dan menyampaikan bukan hanya kerasnya suara, tetapi juga kesan tidak tertib.
- source_word: פְּתַיּוּת
  choice: lugu
  rationale: Nomina ini menunjuk pada keluguan atau kenaifan. Karena klausa Ibrani tidak memakai kopula, terjemahan Indonesia menyatakannya sebagai sifat. “Lugu” menjaga kaitan dengan gagasan orang yang mudah dipengaruhi dalam Amsal, tanpa sekadar mengulang “bodoh.”
- source_word: וּבַל
  choice: dan tidak
  rationale: Konjungsi dan partikel negatif membentuk predikat tambahan. “Dan tidak” mempertahankan hubungan aditif dalam bahasa Ibrani tanpa memperkenalkan pertentangan yang lebih kuat.
- source_word: יָדְעָה מָּה
  choice: tidak tahu apa-apa
  rationale: Ungkapan Ibrani secara harfiah berbunyi “tidak tahu apa,” tetapi berfungsi sebagai penegasan ketidaktahuan. “Tidak tahu apa-apa” menyampaikan maksud itu secara wajar; bentuk harfiahnya dicatat dalam catatan kaki.
