translation:
  language: id
  text: 'dan duduk di ambang pintu rumahnya,

    di atas sebuah kursi[a], di tempat-tempat tinggi kota,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: "takhta."'
    reason: כִּסֵּא dapat menunjuk pada tempat duduk biasa maupun takhta kerajaan; konteks langsung tidak memastikan nuansa kerajaan.
lexical_decisions:
- source_word: וְיָשְׁבָה
  choice: dan duduk
  rationale: Bentuk Qal perfektif orang ketiga feminin tunggal dengan kata penghubung menggambarkan tindakan yang berlangsung dalam potret puitis ini; bahasa Indonesia tidak menandai kala secara morfologis, sehingga “duduk” mempertahankan keluwesan aspek konteksnya.
- source_word: לְפֶתַח
  choice: di pintu
  rationale: פֶּתַח menunjuk pada bukaan atau jalan masuk. “Di pintu” alami dalam bahasa Indonesia dan mempertahankan gambaran posisi di jalan masuk rumah.
- source_word: בֵּיתָהּ
  choice: rumahnya
  rationale: בַּיִת di sini menunjuk pada bangunan atau tempat tinggal secara fisik; “rumahnya” merupakan padanan langsung dan alami.
- source_word: עַל
  choice: di atas
  rationale: Preposisi ini menyatakan posisi pada suatu permukaan atau tempat; “di atas” adalah padanan lokatif yang wajar.
- source_word: כִּסֵּא
  choice: sebuah kursi
  rationale: כִּסֵּא dapat berarti kursi, tempat duduk, atau takhta. Konteks tidak secara pasti menuntut citra kerajaan; “kursi” memberikan gambaran konkret dan alami, sementara kemungkinan “takhta” dicatat dalam catatan kaki.
- source_word: מְרֹמֵי
  choice: tempat-tempat tinggi
  rationale: Bentuk jamak konstruksi ini menunjuk pada ketinggian atau lokasi-lokasi tinggi. “Tempat-tempat tinggi” mempertahankan bentuk jamak dan kesan lokasi yang menonjol tanpa mempersempitnya menjadi satu titik.
- source_word: קָרֶת
  choice: kota itu
  rationale: קָרֶת berarti kota atau permukiman perkotaan. “Kota itu” sesuai dengan latar publik yang sudah digambarkan dalam konteks dan memakai penentu yang alami dalam bahasa Indonesia.
