  text: מִי פֶ֭תִי יָסֻ֣ר הֵ֑נָּה חֲסַר לֵ֝֗ב אָ֣מְרָה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/004.yaml
  text: Whoever is simple[a], let him turn in here! To him who lacks sense she says,
translation:
  language: id
  text: “Siapa yang naif, singgahlah kemari!” Kepada orang yang kurang pengertian[a] ia berkata,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kekurangan hati”. Dalam ungkapan Ibrani, “hati” sering menunjuk pada pengertian atau pertimbangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Siapa yang
  rationale: Memperkenalkan siapa saja yang memenuhi gambaran berikut sebagai sasaran umum undangan, bukan menanyakan identitas orang tertentu.
- source_word: פֶתִי
  choice: tidak berpengalaman
  rationale: Dalam Amsal, kata ini menunjuk kepada orang yang masih naif dan mudah dipengaruhi, bukan orang yang kurang cerdas. Pilihan ini menyampaikan kategori hikmat tersebut tanpa kesan menghina.
- source_word: יָסֻר
  choice: singgahlah
  rationale: Bentuknya menyatakan ajakan untuk menyimpang dari jalan dan masuk ke tempat pembicara. 'Singgahlah' terdengar alami dalam undangan bahasa Indonesia serta mempertahankan gagasan berbelok masuk.
- source_word: הֵנָּה
  choice: kemari
  rationale: Kata penunjuk arah ini mengarahkan orang kepada tempat pembicara; 'kemari' lebih alami daripada terjemahan harfiah 'ke sini' bersama kata 'singgah'.
- source_word: חֲסַר לֵב
  choice: orang yang kurang pengertian
  rationale: Secara harfiah ungkapan ini berarti 'kekurangan hati', tetapi dalam idiom Ibrani hati merupakan pusat pengertian dan pertimbangan. Terjemahan ini mengungkapkan maknanya dengan jelas tanpa menyamakannya dengan kekurangan intelektual bawaan.
- source_word: אָמְרָה
  choice: ia berkata
  rationale: Bentuk feminin tunggal merujuk kepada Hikmat yang dipersonifikasikan. Bentuk lampau Ibrani memperkenalkan ujaran langsung; bahasa Indonesia secara alami memakai 'berkata' tanpa harus menentukan kala secara lebih khusus.
- source_word: לּוֹ
  choice: kepada orang
  rationale: Pronomina maskulin tunggal mengacu kembali kepada sasaran umum undangan. Pengulangan 'orang' menghasilkan bahasa Indonesia yang alami dan tetap mempertahankan acuan tunggal generik.
theological_decisions:
- issue: Identitas subjek feminin pada אָמְרָה
  choice: Memakai 'ia' dan tidak menambahkan nama 'Hikmat' dalam teks ayat
  alternative: Hikmat berkata
  rationale: Konteks mengidentifikasi sosok feminin itu sebagai Hikmat, tetapi nama tersebut tidak diulang dalam teks Ibrani ayat ini. 'Ia' mempertahankan hubungan kontekstual tanpa menambahkan unsur eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda koma pada akhir ayat dipertahankan karena klausa 'ia berkata' memperkenalkan ucapan yang berlanjut pada ayat berikutnya.
