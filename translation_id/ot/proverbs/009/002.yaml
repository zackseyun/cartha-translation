source:
  edition: WLC
  text: טָבְחָ֣ה טִ֭בְחָ/הּ מָסְכָ֣ה יֵינָ֑/הּ אַ֝֗ף עָֽרְכָ֥ה שֻׁלְחָנָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/002.yaml
  text: She has slaughtered her meat[a]; she has mixed her wine[b]; she has also set her table.
translation:
  language: id
  text: Ia telah menyembelih hewan untuk hidangannya[a], mencampur anggurnya[b], dan juga menata mejanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyembelih hewan-hewannya”; nomina Ibrani menunjuk pada hewan sembelihan atau daging hasil sembelihan yang disiapkan untuk jamuan.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, ia telah menyiapkan anggur dengan mencampurnya, kemungkinan menurut kebiasaan jamuan pada masa itu.
    reason: cultural_note
lexical_decisions:
- source_word: טָבְחָה
  choice: telah menyembelih
  rationale: Bentuk Qal perfektif orang ketiga feminin tunggal dari טבח menyatakan tindakan menyembelih hewan untuk jamuan; pilihan ini mempertahankan tindakan konkret dalam bahasa Indonesia yang wajar.
- source_word: טִבְחָהּ
  choice: hewan untuk hidangannya
  rationale: Nomina ini menunjuk pada hewan sembelihan atau daging hasil sembelihan yang disiapkan bagi jamuan. Frasa ini mempertahankan gagasan penyembelihan tanpa memberi kesan bahwa kata Ibrani hanya berarti hidangan secara umum.
- source_word: מָסְכָה
  choice: mencampur
  rationale: Kata kerja מסך di sini berarti mencampur atau meramu anggur sebagai bagian dari persiapan jamuan, bukan sekadar menuangkannya.
- source_word: יֵינָהּ
  choice: anggurnya
  rationale: Padanan langsung bagi nomina dengan akhiran posesif feminin; konteks menunjukkan anggur yang disiapkannya untuk jamuan.
- source_word: אַף
  choice: juga
  rationale: Partikel ini menambahkan tindakan persiapan berikutnya secara kumulatif.
- source_word: עָרְכָה
  choice: menata
  rationale: ערך berarti mengatur atau menata dengan tertib. Dalam konteks meja jamuan, 'menata mejanya' terdengar alami dan tetap dekat dengan citra sumber.
- source_word: שֻׁלְחָנָהּ
  choice: mejanya
  rationale: Mempertahankan gambaran konkret meja jamuan dan akhiran posesif feminin.
theological_decisions:
- issue: Subjek feminin yang dipersonifikasikan dalam puisi Hikmat
  choice: Menggunakan kata ganti 'Ia' tanpa menambahkan nama 'Hikmat' dalam ayat.
  alternative: Hikmat telah menyembelih hewan untuk hidangannya; ia telah mencampur anggurnya dan menata mejanya.
  rationale: Semua verba memiliki subjek feminin tunggal dan konteks langsung mengidentifikasinya sebagai Hikmat yang dipersonifikasikan. Bahasa Indonesia tidak membedakan gender dalam kata ganti orang ketiga; 'Ia' mempertahankan personifikasi dan kesinambungan konteks tanpa memasukkan penjelasan ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas dan bermartabat. Urutan tiga tindakan persiapan dipertahankan; pronomina 'Ia' dipilih karena wajar untuk personifikasi, sedangkan penanda feminin dalam bahasa Ibrani dijelaskan melalui konteks, bukan ditambahkan secara artifisial.
