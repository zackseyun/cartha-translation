  text: אַל תּ֣וֹכַח לֵ֭ץ פֶּן יִשְׂנָאֶ֑/ךָּ הוֹכַ֥ח לְ֝/חָכָ֗ם וְ/יֶאֱהָבֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/008.yaml
  text: Do not rebuke a scoffer[a], lest he hate you; rebuke a wise man[b], and he will love you.
translation:
  language: id
  text: Jangan menegur pencemooh[a], nanti ia membencimu; tegurlah orang bijak[b], maka ia akan mengasihimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengolok.” Kata Ibrani לֵץ menunjuk pada orang yang bercirikan cemoohan angkuh dan sikap meremehkan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seorang bijak”; bentuk tunggal maskulin dalam bahasa Ibrani dipakai secara representatif dalam kitab Amsal.
    reason: source_form
lexical_decisions:
- source_word: אַל
  choice: Jangan
  rationale: אַל dengan bentuk verba berikutnya menyatakan larangan; “jangan” adalah padanan langsung dan alami tanpa menambahkan penekanan.
- source_word: תּוֹכַח / הוֹכַח (יכח)
  choice: menegur / tegurlah
  rationale: Dalam sastra hikmat, יכח menunjuk pada teguran atau koreksi secara verbal. “Menegur” mempertahankan daya konfrontatifnya dan dapat digunakan secara alami dalam kedua klausa.
- source_word: לֵץ
  choice: pencemooh
  rationale: לֵץ dalam Amsal menggambarkan orang yang bercirikan cemoohan angkuh dan sikap meremehkan, bukan sekadar orang yang sesekali mengejek.
- source_word: פֶּן
  choice: nanti
  rationale: פֶּן memperkenalkan akibat negatif yang patut dihindari. Dalam larangan bahasa Indonesia, “nanti” secara alami menyampaikan akibat yang dikhawatirkan tanpa mengubahnya menjadi pernyataan tujuan.
- source_word: יִשְׂנָאֶךָּ
  choice: ia membencimu
  rationale: Bentuk imperfek setelah פֶּן menyatakan akibat yang mungkin atau diperkirakan; bersama “nanti,” frasa ini terdengar alami dalam bahasa Indonesia.
- source_word: לְחָכָם
  choice: orang bijak
  rationale: Bahasa Indonesia tidak menandai gender gramatikal pada “orang bijak.” Pilihan ini mempertahankan tipe manusia tunggal yang representatif tanpa memasukkan gender yang tidak perlu dalam bahasa sasaran.
- source_word: וְיֶאֱהָבֶךָּ
  choice: maka ia akan mengasihimu
  rationale: Bentuk imperfek menyatakan hasil yang diharapkan sesudah perintah. “Maka ... akan” membuat hubungan akibat itu jelas, sedangkan “mengasihi” mempertahankan cakupan luas verba אהב tanpa nuansa romantis yang dapat melekat pada “mencintai.”
theological_decisions:
- issue: Bentuk tunggal maskulin dalam pengajaran hikmat
  choice: orang bijak
  alternative: laki-laki bijak
  rationale: Kata Ibrani חָכָם berbentuk maskulin tunggal dan berfungsi sebagai tipe representatif. Karena bahasa Indonesia tidak memiliki gender gramatikal pada frasa “orang bijak,” bentuk alami ini mempertahankan rujukan tunggal dan cakupan umumnya; catatan kaki menjelaskan bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan ringkas. Paralelisme antitetis dipertahankan melalui pengulangan “menegur/tegurlah,” sementara “nanti” dan “maka” menyatakan dua akibat yang berlawanan secara alami.
