  text: For by me your days will be multiplied[a], and years of life will be added to you.
translation:
  language: id
  text: Sebab melalui aku[a] umurmu akan bertambah, dan tahun-tahun kehidupan akan ditambahkan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “di dalam aku” atau “oleh aku”; preposisi Ibrani di sini dapat dipahami dalam beberapa arti yang berdekatan, tetapi konteks lebih mendukung arti sarana: melalui Hikmat, umur diperpanjang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi nasihat sebelumnya dan mengalir wajar dalam ungkapan amsal Indonesia.
- source_word: בִי
  choice: melalui aku
  rationale: 'Preposisi ב dengan sufiks orang pertama tunggal paling wajar dipahami secara instrumental dalam konteks ini: Hikmat menjadi sarana bertambahnya umur, sambil tetap mempertahankan tutur Hikmat yang dipersonifikasikan.'
- source_word: יִרְבּוּ יָמֶיךָ
  choice: umurmu akan bertambah
  rationale: Secara harfiah berarti 'hari-harimu akan menjadi banyak/bertambah'. 'Umurmu akan bertambah' menyampaikan idiom Ibrani tentang panjangnya masa hidup secara alami dalam bahasa Indonesia.
- source_word: וְיוֹסִיפוּ לְּךָ
  choice: akan diperpanjang
  rationale: Konstruksi ini menyatakan bahwa tambahan tahun diberikan kepada orang yang disapa. Bentuk pasif idiomatis menghindari penyisipan pelaku yang tidak disebutkan.
- source_word: שְׁנוֹת חַיִּים
  choice: tahun-tahun hidupmu
  rationale: Mempertahankan gagasan 'tahun-tahun kehidupan' dengan bentuk Indonesia yang alami; sufiks 'mu' menyatakan penerima yang ditandai oleh לְךָ.
theological_decisions:
- issue: Sifat janji tentang umur panjang
  choice: Mempertahankan pernyataan langsung sebagai prinsip hikmat
  alternative: Menambahkan pembatas seperti 'biasanya' atau menjadikannya jaminan mutlak yang dijelaskan secara doktrinal
  rationale: Teks Ibrani menyatakannya tanpa pembatas eksplisit. Terjemahan tidak boleh menambah pengecualian maupun penafsiran teologis yang mengubah ketegangan khas sastra hikmat.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Pilihan 'umurmu' mengungkapkan idiom Ibrani 'hari-harimu' secara alami, sedangkan paralelisme dipertahankan melalui 'tahun-tahun hidupmu'.
