  text: וְֽ/לֹא יָ֭דַע כִּֽי רְפָאִ֣ים שָׁ֑ם בְּ/עִמְקֵ֖י שְׁא֣וֹל קְרֻאֶֽי/הָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/018.yaml
  text: But he does not know that the dead are there[a], that her guests are in the depths of Sheol.
translation:
  language: id
  text: Namun, ia tidak tahu bahwa orang mati ada di sana[a], dan bahwa para tamunya berada di kedalaman Syol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “arwah-arwah ada di sana.” Kata Ibrani רְפָאִים di sini menunjuk kepada orang-orang yang telah mati, yaitu mereka yang berada di Syol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Namun, ... tidak
  rationale: Dalam konteks ini, penghubung tersebut menyatakan pertentangan tajam dengan gambaran yang memikat pada ayat sebelumnya; “Namun” menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: יָדַע
  choice: ia tidak tahu
  rationale: Bentuk qatal di sini menggambarkan keadaan ketidaktahuan pada masa kini; ungkapan ini alami dan tepat.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi yang tidak diketahuinya dan berlaku secara wajar bagi kedua klausa.
- source_word: רְפָאִים
  choice: orang-orang mati
  rationale: Dalam konteks sastra hikmat, kata ini menunjuk kepada mereka yang telah mati dan berada di Syol, bukan kepada kelompok etnis Refaim. Pilihan ini jelas bagi pembaca modern, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: שָׁם
  choice: di sana
  rationale: Keterangan tempat sederhana ini mempertahankan rujukan kepada tempat perempuan itu dan kenyataan mengerikan di balik undangannya.
- source_word: בְּעִמְקֵי
  choice: di kedalaman
  rationale: Ungkapan ini mempertahankan gambaran ruang-ruang yang dalam dan gerak turun menuju dunia orang mati.
- source_word: שְׁאוֹל
  choice: Syol
  rationale: Istilah Ibrani dipertahankan dalam bentuk transliterasi Indonesia agar tidak dipersempit menjadi “kubur” atau diberi muatan doktrinal tambahan melalui “neraka”.
- source_word: קְרֻאֶיהָ
  choice: tamu-tamu perempuan itu
  rationale: Partisip pasif dari קרא dengan sufiks feminin tunggal menunjuk kepada orang-orang yang diundang olehnya. Ungkapan ini alami dan sekaligus mempertahankan kaitannya dengan perempuan dalam konteks.
theological_decisions:
- issue: Penerjemahan שְׁאוֹל
  choice: Syol
  alternative: kubur; alam orang mati; neraka
  rationale: Istilah ini menunjuk kepada dunia atau tempat orang mati. Mempertahankan “Syol” menghindari pemaksaan rincian doktrinal yang lebih kemudian dan menjaga bobot serta keterbukaan citra Ibraninya.
- issue: Identitas רְפָאִים
  choice: orang-orang mati
  alternative: arwah-arwah; roh-roh orang mati; Refaim
  rationale: Dalam konteks ini, kata tersebut merujuk kepada orang-orang yang telah mati di Syol, bukan bangsa atau kaum Refaim. Terjemahan utama mengutamakan kejelasan, sedangkan nuansa alternatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hikmat yang lugas dan bermartabat. “Ia” dipakai untuk tokoh laki-laki dari konteks sebelumnya; “perempuan itu” memperjelas sufiks feminin yang tidak dapat dinyatakan hanya dengan pronomina posesif Indonesia tanpa kemungkinan rujukan ganda.
