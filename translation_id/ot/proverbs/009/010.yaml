  text: תְּחִלַּ֣ת חָ֭כְמָה יִרְאַ֣ת יְהוָ֑ה וְ/דַ֖עַת קְדֹשִׁ֣ים בִּינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/010.yaml
  text: The beginning of wisdom is the fear of Yahweh[a], and the knowledge of the Holy One is understanding.
translation:
  language: id
  text: Permulaan hikmat adalah takut akan Yahweh, dan pengetahuan tentang Yang Mahakudus[a] adalah pengertian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, bahasa Ibrani memakai bentuk jamak: “yang kudus” atau “orang-orang kudus.” Di sini bentuk itu sering dipahami merujuk kepada Allah, sehingga diterjemahkan “Yang Mahakudus.”'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּחִלַּת
  choice: permulaan
  rationale: Bentuk konstruk ini menunjuk pada awal atau titik pangkal. “Permulaan” mempertahankan ungkapan Ibrani tanpa mempersempitnya menjadi sekadar unsur pertama atau prinsip utama.
- source_word: חָכְמָה
  choice: hikmat
  rationale: Istilah baku dan wajar untuk tema kebijaksanaan moral serta praktis dalam Amsal.
- source_word: יִרְאַת
  choice: takut akan
  rationale: Mempertahankan keluasan makna ungkapan Ibrani, yang mencakup rasa gentar, hormat, dan takzim kepada Allah; “hormat kepada” saja akan mempersempit ketegangannya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: וְדַעַת
  choice: dan pengetahuan tentang
  rationale: Mempertahankan bentuk nominal dan kesejajarannya dengan “hikmat” serta “pengertian”; kata benda konstruk ini menyatakan pengetahuan mengenai pihak yang disebut sesudahnya.
- source_word: קְדֹשִׁים
  choice: Yang Mahakudus
  rationale: Walaupun bentuk Ibraninya jamak, kesejajaran dengan Yahweh pada baris pertama kuat mendukung rujukan tunggal kepada Allah. Bentuk jamaknya tetap dicatat dalam catatan kaki.
- source_word: בִּינָה
  choice: pengertian
  rationale: Padanan langsung yang sesuai dengan kosakata hikmat dalam Amsal dan mempertahankan persamaan nominal teks Ibrani.
theological_decisions:
- issue: Rujukan קְדֹשִׁים
  choice: 'Rujukan ilahi tunggal: “Yang Mahakudus”'
  alternative: 'Rujukan jamak: “orang-orang kudus” atau “makhluk-makhluk kudus”'
  rationale: Kesejajaran sinonim antara “takut akan Yahweh” dan “pengetahuan tentang Yang Mahakudus” mendukung rujukan kepada Allah. Namun, karena bentuk Ibraninya secara morfologis jamak, kemungkinan bacaan harfiah tidak dihapus dan dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan nominal dipertahankan untuk mencerminkan kesejajaran puitis Ibrani. Ungkapan “takut akan” dipilih agar nuansa gentar sekaligus hormat tidak dilunakkan, sedangkan penanda catatan kaki ditempatkan tepat sesudah frasa yang diterangkannya.
