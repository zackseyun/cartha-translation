  text: יֹ֤סֵ֨ר לֵ֗ץ לֹקֵ֣חַֽ ל֣/וֹ קָל֑וֹן וּ/מוֹכִ֖יחַ לְ/רָשָׁ֣ע מוּמֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/007.yaml
  text: Whoever corrects a scoffer gets dishonor for himself[c][b][a], and whoever rebukes a wicked man gets a blemish for himself.
translation:
  language: id
  text: Orang yang menegur pencemooh mendatangkan aib atas dirinya sendiri,[a] dan orang yang menegur orang fasik mendapat noda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mendapat kehinaan bagi dirinya sendiri.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “nodanya.” Rujukan akhiran “-nya” dan maksud ungkapan ini tidak sepenuhnya jelas; ungkapan ini dapat menunjuk cela atau aib yang diterima penegur, mungkin berupa hinaan atau perlakuan buruk dari orang fasik.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹסֵר
  choice: orang yang menegur
  rationale: Bentuk partisip menyatakan prinsip umum. Dalam konteks ini, יסר menunjuk tindakan mendidik atau mengoreksi; “menegur” menyampaikan koreksi lisan tanpa memberi kesan hukuman fisik.
- source_word: לֵץ
  choice: pencemooh
  rationale: Istilah ini dalam Amsal menunjuk orang angkuh yang menghina dan menolak hikmat. “Pencemooh” mempertahankan unsur ejekan dan sikap merendahkan.
- source_word: לֹקֵחַ לוֹ קָלוֹן
  choice: mendapat kehinaan bagi dirinya sendiri
  rationale: Ungkapan לקח לו menggambarkan sesuatu yang ditanggung atau didatangkan atas diri sendiri, sedangkan קלון adalah aib, kehinaan, atau hilangnya kehormatan di hadapan orang lain.
- source_word: וּמוֹכִיחַ
  choice: dan orang yang memperingatkan
  rationale: Hifil partisip dari יכח berarti menegur, memperingatkan, atau menunjukkan kesalahan. “Memperingatkan” membedakannya dari kata kerja pada baris pertama sambil mempertahankan paralelismenya.
- source_word: לְרָשָׁע
  choice: orang fasik
  rationale: Bentuk tunggal maskulin ini dipakai secara generik. “Orang fasik” alami dalam bahasa Indonesia dan tidak menambahkan jenis kelamin yang tidak perlu bagi penerapan umum pepatah ini.
- source_word: מוּמוֹ
  choice: mendapat noda
  rationale: מוּם secara dasar berarti cacat atau noda. Akhiran pronominal dalam bentuk “nodanya” memiliki rujukan yang tidak sepenuhnya jelas; teks utama mempertahankan metafora tanpa menentukan secara paksa pemilik atau sumber noda tersebut.
theological_decisions:
- issue: Apakah ayat ini melarang semua teguran terhadap orang jahat
  choice: Diterjemahkan sebagai pengamatan hikmat tentang akibat yang lazim dialami penegur
  alternative: Dibaca sebagai larangan mutlak untuk menegur pencemooh atau orang fasik
  rationale: Bentuk pepatah menyatakan konsekuensi yang umum tanpa secara eksplisit merumuskan larangan universal; terjemahan tidak menambahkan perintah yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada pepatah. Paralelisme kedua baris dipertahankan. “Pencemooh” dan “orang fasik” membedakan dua istilah Ibrani, sementara catatan kaki mempertahankan ketaksaan frasa penutup.
