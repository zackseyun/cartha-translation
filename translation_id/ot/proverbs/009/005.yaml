id: PRO.9.5
reference: Proverbs 9:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְ֭כוּ לַחֲמ֣וּ בְֽ/לַחֲמִ֑/י וּ֝/שְׁת֗וּ בְּ/יַ֣יִן מָסָֽכְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/005.yaml
  text: Come[a], eat of my bread[b], and drink of the wine I have mixed.
translation:
  language: id
  text: Mari[a], makanlah rotiku, dan minumlah anggur yang telah kucampur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Pergilah, makanlah rotiku.” Verba Ibrani ini secara harfiah berarti “pergilah”, tetapi dalam konteks undangan berfungsi sebagai ajakan: “Mari.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “yang telah kusiapkan.” Verba Ibrani ini secara khusus merujuk pada anggur yang dicampur, mungkin dengan air atau rempah-rempah.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Mari
  rationale: Secara harfiah verba ini berarti “pergilah” atau “berjalanlah”, tetapi dalam konteks undangan oleh Hikmat, “Mari” menyampaikan fungsi pragmatisnya secara wajar dalam bahasa Indonesia tanpa mengubahnya menjadi pernyataan arah tempat.
- source_word: לַחֲמוּ
  choice: makanlah
  rationale: Verba dari akar לחם II berarti “makan” dalam konteks ini, sebagaimana ditegaskan oleh objek “rotiku” dan kesejajarannya dengan perintah “minumlah”.
- source_word: בְלַחֲמִי
  choice: rotiku
  rationale: Preposisi ב dengan verba “makan” memiliki nuansa partitif, tetapi bahasa Indonesia secara alami cukup mengatakan “makanlah rotiku”; ungkapan seperti “makanlah dari rotiku” akan terasa kurang luwes.
- source_word: וּשְׁתוּ
  choice: dan minumlah
  rationale: Imperatif ini dikoordinasikan dengan perintah sebelumnya; bentuk ini mempertahankan kesejajaran puitis antara makan dan minum.
- source_word: בְּיַיִן
  choice: anggur
  rationale: Preposisi ב memiliki nuansa partitif bersama verba “minum”, tetapi objek langsung tanpa preposisi merupakan bentuk yang paling alami dalam bahasa Indonesia.
- source_word: מָסָכְתִּי
  choice: yang telah kucampur
  rationale: Verba ini secara khusus menunjuk pada tindakan mencampur atau meramu anggur, kemungkinan dengan air atau rempah-rempah. “Kucampur” mempertahankan makna dasarnya tanpa menentukan bahan campurannya.
theological_decisions:
- issue: Sifat gambaran undangan Hikmat
  choice: Mempertahankan gambaran konkret tentang perjamuan tanpa perluasan alegoris dalam teks terjemahan.
  alternative: Menafsirkan roti dan anggur secara sakramental atau mengubah seluruh perjamuan menjadi ungkapan abstrak tentang pengajaran.
  rationale: Ayat ini menggambarkan Hikmat sebagai pribadi yang mengundang orang kepada perjamuan yang telah disiapkannya. Terjemahan tidak memasukkan makna sakramental atau doktrinal yang tidak dinyatakan secara eksplisit dalam teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bersifat mengundang. Bentuk imperatif dengan akhiran -lah mempertahankan nada ajakan yang bermartabat sekaligus mudah dipahami. Kepemilikan orang pertama dipertahankan dalam “rotiku” dan “kucampur”.
