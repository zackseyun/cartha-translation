  yaml_path: translation/ot/proverbs/009/003.yaml
  text: 'She has sent out her young women[b][a]; she calls from the heights of the city:'
translation:
  language: id
  text: 'Ia telah mengutus para gadisnya[a]; ia berseru dari tempat-tempat tertinggi di kota[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para perempuan mudanya.” Dalam bahasa Ibrani, istilah ini dapat menunjuk perempuan muda yang menjadi pelayan atau pengiring, tetapi status sosial mereka tidak dinyatakan secara tegas.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di atas puncak-puncak kota yang tinggi.” Frasa Ibrani ini menunjuk tempat-tempat yang tinggi dan menonjol di kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלְחָה
  choice: telah mengutus
  rationale: Bentuk Qal perfektum orang ketiga feminin menunjukkan tindakan yang sudah dilakukan oleh Hikmat yang dipersonifikasikan. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan konteks persiapan undangan.
- source_word: נַעֲרֹתֶיהָ
  choice: perempuan-perempuan mudanya
  rationale: Kata ini terutama menyatakan perempuan muda dan tidak dengan sendirinya memastikan status mereka sebagai hamba. Pilihan ini mempertahankan unsur usia dan gender tanpa menambahkan kedudukan sosial yang tidak tegas dalam teks.
- source_word: תִקְרָא
  choice: ia berseru
  rationale: Dalam konteks undangan terbuka dari tempat yang menonjol, verba קרא menyatakan panggilan yang disuarakan kepada khalayak. 'Berseru' menyampaikan sifat publik panggilan itu tanpa mengubahnya menjadi pengumuman formal.
- source_word: עַל גַּפֵּי מְרֹמֵי קָרֶת
  choice: dari tempat-tempat tertinggi di kota
  rationale: Frasa puitis ini menunjuk lokasi-lokasi tinggi atau paling menonjol di kota. 'Dari' sesuai dengan ungkapan Indonesia untuk asal suara, sedangkan bentuk jamak mempertahankan gambaran jamak dalam bahasa Ibrani.
theological_decisions:
- issue: Subjek feminin yang dipersonifikasikan
  choice: Memakai pronomina 'ia' yang merujuk kepada Hikmat dalam konteks
  alternative: Mengulang 'Hikmat' atau memakai 'dia'
  rationale: '''Ia'' mempertahankan kesinambungan dengan personifikasi Hikmat dan memberi ragam tulis yang wajar serta bermartabat tanpa menambahkan penafsiran teologis.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan dua tindakan berurutan dan tanda titik dua yang mengantar isi seruan pada ayat berikutnya.
