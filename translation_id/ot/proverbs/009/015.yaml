base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/015.yaml
  text: 'to call to those passing by on the road[a], who are going straight on their paths:'
translation:
  language: id
  text: 'untuk berseru kepada orang-orang yang lewat di jalan,

    yang berjalan lurus di jalur mereka[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang meluruskan jalan mereka.” Partisip Ibrani dapat menekankan tindakan berjalan terus dengan lurus atau menjaga arah perjalanan tetap lurus.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרֹא
  choice: untuk berseru
  rationale: Infinitif konstruk menyatakan tujuan dalam kalimat yang lebih luas. “Berseru” menyampaikan tindakan memanggil dengan suara keras di tempat umum tanpa menambahkan gagasan pemanggilan resmi.
- source_word: לְעֹבְרֵי דָרֶךְ
  choice: kepada orang-orang yang lewat di jalan
  rationale: Bentuk partisip mempertahankan gambaran konkret tentang orang yang sedang melintas, sedangkan “di jalan” menerjemahkan דָרֶךְ secara alami.
- source_word: הַמְיַשְּׁרִים
  choice: yang berjalan lurus
  rationale: Partisip dari ישר dalam konstruksi ini dapat menggambarkan orang yang terus bergerak lurus pada jalurnya, tetapi bentuknya juga memungkinkan pengertian kausatif/transitif “meluruskan”; kemungkinan kedua dipertahankan dalam catatan kaki.
- source_word: אֹרְחוֹתָם
  choice: di jalur mereka
  rationale: “Jalur” mempertahankan citra perjalanan dan membedakannya dari דָרֶךְ yang diterjemahkan “jalan”; ungkapan ini juga tetap terbuka terhadap nuansa kiasan khas sastra hikmat.
