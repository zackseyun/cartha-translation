  text: חָ֭כְמוֹת בָּנְתָ֣ה בֵיתָ֑/הּ חָצְבָ֖ה עַמּוּדֶ֣י/הָ שִׁבְעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/001.yaml
  text: Wisdom has built her house[a]; she has hewn out her seven pillars.
translation:
  language: id
  text: Hikmat[a] telah membangun rumahnya; ia telah memahat tujuh tiangnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kata Ibrani חָכְמוֹת berbentuk jamak, tetapi di sini diikuti verba feminin tunggal sehingga berfungsi sebagai sosok tunggal yang dipersonifikasikan: “Hikmat”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכְמוֹת
  choice: Hikmat
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, kata ini berfungsi sebagai sosok tunggal yang dipersonifikasikan, sebagaimana ditunjukkan oleh verba feminin tunggal sesudahnya. “Hikmat” menyampaikan personifikasi itu secara wajar tanpa menambahkan sebutan yang tidak terdapat dalam teks.
- source_word: בָּנְתָה
  choice: telah membangun
  rationale: Bentuk perfektif menggambarkan tindakan yang sudah selesai; “telah membangun” mempertahankan makna tersebut dan tetap alami dalam bahasa Indonesia.
- source_word: בֵיתָהּ
  choice: rumahnya
  rationale: Makna konkretnya adalah rumah, sesuai dengan gambaran arsitektural yang diteruskan oleh penyebutan tiang-tiang.
- source_word: חָצְבָה
  choice: telah memahat
  rationale: Verba ini menggambarkan tindakan memotong atau membentuk bahan keras, khususnya batu. “Memahat” mempertahankan gambaran kerja arsitektural yang konkret.
- source_word: עַמּוּדֶיהָ
  choice: tiangnya
  rationale: “Tiang” adalah istilah arsitektural yang umum, jelas, dan sesuai dengan gambaran bangunan dalam ayat ini.
- source_word: שִׁבְעָה
  choice: tujuh
  rationale: Bilangan ini diterjemahkan secara langsung. Kemungkinan makna simbolis berupa kelengkapan tidak dimasukkan ke dalam teks utama.
theological_decisions:
- issue: Personifikasi hikmat
  choice: Menerjemahkan חָכְמוֹת sebagai sosok tunggal yang dipersonifikasikan, “Hikmat”.
  alternative: Menerjemahkannya secara lebih eksplisit sebagai “Nyonya Hikmat” atau “Perempuan Hikmat”.
  rationale: Bahasa Ibrani menampilkan hikmat sebagai personifikasi feminin melalui verba dan pronomina posesif feminin tunggal. Bahasa Indonesia tidak menandai gender pada pronomina “ia” dan akhiran “-nya”, sehingga personifikasi dipertahankan tanpa menambahkan gelar atau keterangan gender yang tidak dinyatakan secara eksplisit oleh nomina itu sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan susunan yang ringkas. “Telah” mempertahankan aspek tindakan yang selesai, sedangkan pengulangan akhiran “-nya” menjaga kesejajaran kedua larik. Penanda catatan ditempatkan langsung sesudah “Hikmat” karena catatan menjelaskan bentuk dan fungsi kata tersebut.
