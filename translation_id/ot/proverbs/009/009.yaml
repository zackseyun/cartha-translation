  text: Give to a wise man[a], and he will become wiser still; teach a righteous man[b], and he will add learning.
translation:
  language: id
  text: Berilah pengajaran kepada orang bijak[a], maka ia akan semakin bijak; ajarlah orang benar[b], maka pengetahuannya akan bertambah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Berilah kepada orang bijak.” Teks Ibrani tidak menyebutkan apa yang diberikan; dalam konteks ini, yang dimaksud ialah pengajaran.
    reason: lexical_alternative
  - marker: b
    text: “Orang benar” berbentuk tunggal dalam bahasa Ibrani, tetapi berfungsi sebagai sebutan perwakilan bagi siapa pun yang benar; demikian pula “orang bijak” pada bagian sebelumnya.
    reason: cultural_note
lexical_decisions:
- source_word: תֵּן
  choice: Berilah
  rationale: Bentuk perintah dari נתן secara harfiah berarti “berilah”. Teks Ibrani tidak menyebutkan apa yang diberikan, sehingga keelipsisan dan keringkasan pepatah dipertahankan dalam teks utama.
- source_word: לְחָכָם
  choice: orang bijak
  rationale: חָכָם menunjuk kepada seseorang yang bijak. “Orang bijak” merupakan padanan Indonesia yang alami dan tidak perlu menyatakan gender gramatikal Ibrani.
- source_word: וְיֶחְכַּם עוֹד
  choice: maka ia akan semakin bijak
  rationale: Kata kerja חכם dengan עוֹד menyatakan pertambahan dalam kebijaksanaan. Ungkapan “semakin bijak” menyampaikan daya komparatifnya dengan wajar.
- source_word: הוֹדַע
  choice: ajarlah
  rationale: Bentuk Hifil dari ידע berarti “buatlah mengetahui”. Dalam konteks didikan hikmat, “ajarlah” menyampaikan fungsi pedagogisnya secara alami.
- source_word: לְצַדִּיק
  choice: orang benar
  rationale: צַדִּיק berarti orang yang benar atau adil. “Orang benar” mempertahankan istilah moral utama dalam sastra hikmat dan sejajar dengan “orang bijak”.
- source_word: וְיוֹסֶף לֶקַח
  choice: maka pengetahuannya akan bertambah
  rationale: יסף menyatakan penambahan, sedangkan לֶקַח merujuk pada pelajaran, pengetahuan, atau didikan yang diterima. Susunan ini alami dalam bahasa Indonesia dan menyampaikan bahwa orang benar memperoleh lebih banyak hasil pengajaran.
