  text: Leave the simple[a], and live; and walk in the way of understanding.
translation:
  language: id
  text: Tinggalkanlah keluguanmu[a] dan hiduplah; dan tempuhlah jalan pengertian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Tinggalkan orang-orang lugu.” Dalam konteksnya, Hikmat berbicara kepada orang-orang lugu; jadi seruan ini berarti meninggalkan keluguan atau keadaan mereka yang lugu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִזְבוּ
  choice: Tinggalkan
  rationale: Bentuk perintah jamak dari עזב menyatakan tindakan meninggalkan secara tegas. “Tinggalkan” alami dalam bahasa Indonesia modern dan tidak menambahkan nuansa yang tidak ada dalam teks.
- source_word: פְתָאיִם
  choice: orang-orang lugu
  rationale: Nomina jamak ini secara harfiah menunjuk kepada orang-orang yang lugu, naif, atau belum berpengalaman. “Orang-orang lugu” mempertahankan objek langsung dalam bahasa Ibrani tanpa diam-diam mengubahnya menjadi “cara hidupmu yang lugu”; kemungkinan makna kontekstual dijelaskan dalam catatan kaki.
- source_word: וִחְיוּ
  choice: dan hiduplah
  rationale: Bentuk perintah jamak dari חיה diterjemahkan sebagai perintah terkoordinasi, sehingga daya ringkas dan puitis teks tetap terpelihara. Terjemahan “supaya kamu hidup” mungkin secara kontekstual, tetapi mengubah bentuk perintah menjadi tujuan atau hasil.
- source_word: וְאִשְׁרוּ
  choice: melangkahlah
  rationale: Dalam konteks jalan, bentuk ini menyampaikan gagasan bergerak maju atau menempuh jalan. “Melangkahlah” mempertahankan metafora perjalanan hidup dan terdengar lebih alami daripada terjemahan kaku seperti “majulah di jalan.”
- source_word: בְּדֶרֶךְ
  choice: di jalan
  rationale: דֶּרֶךְ dapat berarti jalan secara konkret maupun arah hidup atau perilaku. “Di jalan” mempertahankan metafora hikmat yang lazim dan mudah dipahami.
- source_word: בִּינָה
  choice: pengertian
  rationale: בִּינָה menunjuk pada pengertian yang mampu membedakan dan menilai. “Pengertian” adalah padanan baku dan luas, sementara “daya memahami” atau “kearifan” akan lebih interpretatif.
