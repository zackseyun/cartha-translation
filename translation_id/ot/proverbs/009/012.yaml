id: PRO.9.12
reference: Proverbs 9:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם חָ֭כַמְתָּ חָכַ֣מְתָּ לָּ֑/ךְ וְ֝/לַ֗צְתָּ לְֽ/בַדְּ/ךָ֥ תִשָּֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/012.yaml
  text: If you are wise[a], you are wise for yourself; if you scoff, you alone will bear it.
translation:
  language: id
  text: Jika engkau bijaksana, engkau bijaksana bagi dirimu sendiri; jika engkau mencemooh, engkau sendirilah yang akan menanggungnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan menanggung akibatnya seorang diri.” Dalam bahasa Ibrani hanya tertulis “akan menanggung”; beban yang ditanggung tidak disebutkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Mempertahankan daya syarat dalam pepatah Ibrani; “ketika” akan menyiratkan kepastian yang tidak dinyatakan teks.
- source_word: חָכַמְתָּ ... חָכַמְתָּ לָּךְ
  choice: engkau bijaksana, engkau bijaksana bagi dirimu sendiri
  rationale: Pengulangan akar חכם dipertahankan sebagai penegasan, sedangkan לָּךְ diterjemahkan secara wajar sebagai manfaat yang kembali kepada orang itu sendiri.
- source_word: וְלַצְתָּ
  choice: jika engkau mencemooh
  rationale: Kata kerja לוץ menunjuk pada sikap mengejek dengan angkuh, ciri khas pencemooh dalam Amsal. “Mencemooh” mempertahankan bentuk verbal dan nuansa tersebut.
- source_word: לְבַדְּךָ
  choice: engkau sendirilah
  rationale: Bentuk penegas ini menyampaikan bahwa orang tersebut seorang diri memikul apa yang timbul dari sikapnya.
- source_word: תִשָּׂא
  choice: akan menanggungnya
  rationale: נשא berarti menanggung atau memikul. Objeknya tidak disebutkan dalam bahasa Ibrani; akhiran “-nya” membuat kalimat Indonesia alami tanpa secara tegas menentukan beban yang dimaksud.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Kata ganti “engkau” dipilih agar sesuai dengan sapaan tunggal dalam sastra hikmat. Pengulangan klausa dipertahankan, dan ambiguitas objek תִשָּׂא tidak dihilangkan dari teks utama.
