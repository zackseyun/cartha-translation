  text: מִי פֶ֭תִי יָסֻ֣ר הֵ֑נָּה וַ/חֲסַר לֵ֝֗ב וְ/אָ֣מְרָה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/016.yaml
  text: Whoever is simple[a], let him turn in here! And to him who lacks sense she says,
translation:
  language: id
  text: “Siapa pun yang tak berpengalaman, singgahlah ke sini!” Kepada orang yang tidak berpengertian[a] ia berkata,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kekurangan hati.” Dalam kitab Amsal, “hati” sering menunjuk pada pengertian, pertimbangan, atau kemampuan untuk menilai.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי פֶתִי
  choice: Siapa yang tidak berpengalaman
  rationale: מִי bersama פֶתִי memperkenalkan undangan umum. Dalam Amsal, פֶתִי menunjuk pada orang yang masih polos, mudah dipengaruhi, dan belum matang dalam pertimbangan; frasa ini lebih tepat daripada istilah yang menyiratkan keterbatasan intelektual.
- source_word: יָסֻר הֵנָּה
  choice: singgahlah ke sini
  rationale: Bentuk verba ini berfungsi sebagai ajakan untuk berbelok atau masuk ke tempat si pembicara. 'Singgahlah ke sini' alami dalam bahasa Indonesia dan mempertahankan arah ajakan tersebut.
- source_word: חֲסַר לֵב
  choice: orang yang kurang berakal
  rationale: Secara harfiah berarti 'kekurangan hati'; dalam bahasa hikmat Ibrani, 'hati' mencakup pengertian, pertimbangan, dan kemampuan menilai. 'Kurang berakal' menyampaikan makna idiomatis tanpa menyamakannya dengan kebodohan intelektual semata.
- source_word: וְאָמְרָה לּוֹ
  choice: Kepada ... ia berkata
  rationale: Bentuk feminin 'ia berkata' merujuk kepada perempuan yang berbicara dalam konteks, yakni Kebodohan yang dipersonifikasikan. Susunan ini mempertahankan unsur 'kepadanya' dan mengantar perkataan pada ayat berikutnya.
