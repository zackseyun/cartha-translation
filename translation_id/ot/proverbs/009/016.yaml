  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tidak berpengalaman' dipilih untuk kategori hikmat פֶתִי, sedangkan 'kurang berakal' menerjemahkan idiom חֲסַר לֵב. Tanda koma di akhir dipertahankan karena kalimat ini mengantar perkataan langsung pada ayat berikutnya.
