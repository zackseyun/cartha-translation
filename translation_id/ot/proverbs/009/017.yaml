  text: מַֽיִם גְּנוּבִ֥ים יִמְתָּ֑קוּ וְ/לֶ֖חֶם סְתָרִ֣ים יִנְעָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/017.yaml
  text: Stolen water is sweet[a], and bread of secrecy is pleasant.
translation:
  language: id
  text: Air curian terasa manis, dan roti dari tempat-tempat tersembunyi[a] terasa nikmat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “roti dari tempat-tempat tersembunyi” atau “roti kerahasiaan.” Ungkapan Ibrani ini padat; ungkapan itu juga dapat dipahami sebagai roti yang dinikmati secara rahasia.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם
  choice: air
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, kata ini lazim berfungsi sebagai nomina massa; bahasa Indonesia secara alami memakai “air”.
- source_word: גְּנוּבִים
  choice: curian
  rationale: Partisipel pasif dari גנב menyatakan bahwa air itu diperoleh dengan mencuri; “air curian” merupakan padanan langsung dan alami.
- source_word: יִמְתָּקוּ
  choice: terasa manis
  rationale: Kata kerja מתק berarti “manis”; “terasa manis” wajar dalam konteks makanan atau minuman dan mempertahankan citra rasa.
- source_word: לֶחֶם
  choice: roti
  rationale: “Roti” mempertahankan gambaran konkret dan kesejajaran dengan “air,” meskipun kata Ibrani ini kadang dapat berarti makanan secara umum.
- source_word: סְתָרִים
  choice: yang dimakan sembunyi-sembunyi
  rationale: Bentuk jamak dari סתר menunjuk pada kerahasiaan atau tempat tersembunyi. Dalam hubungan padat dengan “roti,” ungkapan ini paling alami dipahami sebagai roti yang dinikmati secara rahasia; catatan kaki mempertahankan kemungkinan bentuk yang lebih harfiah.
- source_word: יִנְעָם
  choice: terasa nikmat
  rationale: Kata kerja נעם berarti “menyenangkan/nikmat.” “Terasa nikmat” sesuai dengan citra makanan dan sejajar secara alami dengan “terasa manis.”
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis yang ringkas. Pengulangan “terasa” menjaga kesejajaran kedua klausa, sedangkan “sembunyi-sembunyi” mengungkapkan idiom Ibrani secara alami tanpa menghilangkan alternatif harfiahnya, yang dicatat dalam catatan kaki.
