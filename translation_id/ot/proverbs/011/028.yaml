  text: בּוֹטֵ֣חַ בְּ֭/עָשְׁר/וֹ ה֣וּא יִפֹּ֑ל וְ֝/כֶ/עָלֶ֗ה צַדִּיקִ֥ים יִפְרָֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/028.yaml
  text: Whoever trusts in his wealth will fall[a], but the righteous will flourish like leaves.
translation:
  language: id
  text: Siapa yang mengandalkan kekayaannya akan jatuh, tetapi orang-orang benar akan bertumbuh subur seperti daun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seperti dedaunan.” Bentuk Ibraninya secara harfiah tunggal, “daun,” tetapi dapat dipahami secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹטֵחַ
  choice: mengandalkan
  rationale: Partisipel בטח menyatakan penempatan kepercayaan atau rasa aman pada sesuatu. Dalam konteks kekayaan, “mengandalkan” terdengar alami dan mempertahankan daya teguran amsal ini.
- source_word: בְּעָשְׁרוֹ
  choice: kekayaannya
  rationale: עֹשֶׁר berarti kekayaan atau harta; bentuk bersufiks orang ketiga tunggal dipertahankan dengan “-nya”.
- source_word: הוּא יִפֹּל
  choice: akan jatuh
  rationale: 'Pronomina הוּא memberi penegasan pada akibat bagi orang tersebut, sedangkan bentuk imperfek dalam ujaran amsal wajar diterjemahkan sebagai akibat umum: “akan jatuh”.'
- source_word: וְכֶעָלֶה
  choice: seperti daun
  rationale: עָלֶה secara bentuk adalah tunggal, “daun”. Terjemahan formal ini mempertahankan citra botanis tanpa mengubahnya menjadi istilah kolektif.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Adjektiva maskulin jamak ini dipakai secara substantival dan menunjuk kepada golongan orang yang hidup benar.
- source_word: יִפְרָחוּ
  choice: akan bertumbuh subur
  rationale: פרח dapat berarti bertunas, berkembang, atau tumbuh subur. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran pertumbuhan yang berlawanan dengan kejatuhan.
theological_decisions:
- issue: Cakupan generik partisipel maskulin tunggal pada awal ayat
  choice: Siapa yang mengandalkan kekayaannya
  alternative: Orang yang mengandalkan kekayaan akan jatuh
  rationale: Bentuk Ibrani maskulin tunggal bersifat generik dalam gaya sastra hikmat. “Siapa yang” menyampaikan cakupan universal tanpa membatasi pepatah ini hanya kepada laki-laki, sementara “kekayaannya” tetap mencerminkan bentuk tunggal bersufiks.
- issue: Jumlah dalam perumpamaan עָלֶה
  choice: seperti daun
  alternative: seperti dedaunan
  rationale: Naskah Ibrani memakai nomina tunggal. Terjemahan utama mempertahankan bentuk itu, sambil mengakui bahwa dalam perumpamaan bentuk tunggal dapat memiliki nuansa representatif atau kolektif.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada hikmat. “Mengandalkan” dipilih untuk kepercayaan yang salah tempat, sedangkan “bertumbuh subur” menjaga citra kehidupan tanaman dan kontras dengan “jatuh”.
