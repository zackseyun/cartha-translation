base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/009.yaml
  text: With his mouth the godless man destroys his neighbor[b][a], but by knowledge the righteous are delivered.
translation:
  language: id
  text: Dengan mulutnya, orang fasik menghancurkan sesamanya,[a] tetapi melalui pengetahuan, orang-orang benar diselamatkan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang munafik menghancurkan sesamanya dengan mulutnya.” Kata Ibrani yang dipakai dapat menunjuk kepada orang yang munafik, tidak saleh, atau fasik.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “orang-orang benar meloloskan diri melalui pengetahuan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶה
  choice: Dengan mulutnya
  rationale: Preposisi ב menyatakan sarana. Ungkapan ini mempertahankan gambaran konkret bahwa mulut, yaitu perkataan, menjadi alat penghancuran.
- source_word: חָנֵף
  choice: orang fasik
  rationale: Kata ini dapat menunjuk kepada orang yang tidak saleh, cemar, atau munafik. Dalam pertentangannya dengan orang-orang benar, 'orang fasik' menyampaikan kategori moral-rohani yang luas tanpa membatasinya hanya pada kemunafikan.
- source_word: יַשְׁחִת
  choice: menghancurkan
  rationale: Bentuk Hifil dari שׁחת berarti menyebabkan kehancuran atau merusak. 'Menghancurkan' mempertahankan kekuatan verba Ibrani dan cocok dengan dampak perkataan yang digambarkan.
- source_word: רֵעֵהוּ
  choice: sesamanya
  rationale: רֵעַ dapat berarti kawan, sahabat, atau sesama. 'Sesamanya' alami dalam bahasa Indonesia dan cukup luas untuk konteks etika sosial ini.
- source_word: וּבְדַעַת
  choice: tetapi melalui pengetahuan
  rationale: Konjungsi menyatakan pertentangan, sedangkan ב menyatakan sarana. 'Pengetahuan' mempertahankan istilah penting dalam kosakata hikmat Amsal.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Adjektiva jamak ini dipakai secara substantival. Bentuk jamak eksplisit dalam bahasa Indonesia mempertahankan jumlah gramatikal sumber.
- source_word: יֵחָלֵצוּ
  choice: diselamatkan
  rationale: Bentuk Nifal dari חלץ di sini menyatakan dilepaskan atau diselamatkan dari bahaya. Bentuk pasif mempertahankan struktur sumber tanpa menentukan pelaku penyelamatan.
theological_decisions:
- issue: Makna חָנֵף dalam konteks sastra hikmat
  choice: orang fasik
  alternative: orang munafik; orang yang tidak saleh
  rationale: Istilah Ibrani dapat mencakup kemunafikan, tetapi pertentangan dengan 'orang-orang benar' menunjukkan kategori kebobrokan moral-rohani yang lebih luas. Catatan kaki mempertahankan kemungkinan makna yang lebih sempit.
- issue: Hubungan subjek dan verba pada klausa kedua
  choice: orang-orang benar menjadi subjek yang diselamatkan melalui pengetahuan
  alternative: orang lain diselamatkan oleh pengetahuan orang-orang benar
  rationale: Sintaksis Ibrani paling wajar memahami צַדִּיקִים sebagai subjek jamak dari יֵחָלֵצוּ. Terjemahan ini tidak menetapkan secara lebih khusus sumber atau objek bahaya tersebut.
- issue: Nuansa יֵחָלֵצוּ
  choice: diselamatkan
  alternative: meloloskan diri
  rationale: Bentuk Nifal memungkinkan nuansa pasif 'diselamatkan' maupun nuansa bahwa mereka 'lolos'. Teks utama mempertahankan bentuk pasif, sedangkan alternatif dicatat agar ambiguitas leksikal tidak hilang.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Paralelisme antarklausa dipertahankan, dengan 'tetapi' memperjelas pertentangan. 'Sesamanya' dipilih sebagai padanan sosial yang alami bagi רֵעֵהוּ, dan semua penanda catatan kaki muncul dalam teks utama.
