  yaml_path: translation/ot/proverbs/011/025.yaml
  text: A generous person will be enriched[b][a], and whoever refreshes others will himself be refreshed.
translation:
  language: id
  text: Orang yang murah hati akan berkelimpahan,[a] dan siapa yang menyegarkan orang lain akan disegarkan juga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pribadi (atau jiwa) berkat akan dibuat gemuk.” Bahasa Ibrani memakai gambaran kegemukan sebagai lambang kelimpahan, kesuburan, dan keadaan yang baik.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “orang yang mengairi akan diairi juga.” Gambaran air menyatakan bahwa orang yang memberi kesegaran kepada sesama akan menerima kesegaran pula.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: orang
  rationale: Kata ini dapat menunjuk kepada diri atau pribadi secara utuh; “orang” menyampaikan makna idiomatisnya secara alami tanpa mempersempitnya menjadi bagian rohani manusia.
- source_word: בְּרָכָה
  choice: yang murah hati
  rationale: Secara harfiah berarti “berkat,” tetapi dalam ungkapan נֶפֶשׁ בְּרָכָה kata ini menggambarkan orang yang menjadi berkat bagi orang lain. “Yang murah hati” menyatakan watak memberi yang dimaksud dalam konteks.
- source_word: תְדֻשָּׁן
  choice: akan hidup berkelimpahan
  rationale: Bentuk pasif dari דשׁן memakai gambaran menjadi gemuk atau subur sebagai lambang kelimpahan dan keadaan yang baik. Pilihan ini mempertahankan gagasan kelimpahan tanpa konotasi jasmani yang menyesatkan dalam bahasa Indonesia modern.
- source_word: וּמַרְוֶה
  choice: siapa menyegarkan orang lain
  rationale: Partisip Hifil dari רוה secara konkret berarti memberi minum atau mengairi. Dalam paralelisme ayat ini, “menyegarkan orang lain” mengungkapkan pemakaian kiasannya dengan alami, sementara gambaran air dijelaskan dalam catatan kaki.
- source_word: גַּם הוּא יוֹרֶא
  choice: ia sendiri juga akan disegarkan
  rationale: 'Ungkapan גַּם הוּא menekankan bahwa pelaku itu pun menerima hal serupa. Bentuk יוֹרֶא secara tradisional dipahami secara pasif dan berbalasan dengan מַרְוֶה: orang yang memberi kesegaran akan turut disegarkan.'
