id: PRO.11.14
reference: Proverbs 11:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּ/אֵ֣ין תַּ֭חְבֻּלוֹת יִפָּל עָ֑ם וּ֝/תְשׁוּעָ֗ה בְּ/רֹ֣ב יוֹעֵֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/014.yaml
  text: Without guidance a people falls[a], but in an abundance of counselors there is deliverance.
translation:
  language: id
  text: Tanpa arahan, suatu bangsa jatuh, tetapi dengan banyak penasihat ada keselamatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jika tidak ada arahan, suatu bangsa jatuh, tetapi dengan banyak penasihat ada keamanan/kelepasan/kemenangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵין
  choice: Tanpa
  rationale: Gabungan ב dengan אֵין menyatakan keadaan ketika sesuatu tidak ada. “Tanpa” ringkas, alami, dan tetap menyampaikan prinsip umum yang bersifat kondisional.
- source_word: תַּחְבֻּלוֹת
  choice: arahan
  rationale: Kata ini dapat berarti tuntunan, pengarahan, atau strategi yang cakap. “Arahan” cocok dengan konteks hikmat yang luas dan tetap dibedakan dari יוֹעֵץ, “penasihat,” pada bagian kedua.
- source_word: יִפָּל
  choice: jatuh
  rationale: Bentuk dari נפל secara harfiah berarti “jatuh” dan dalam konteks ini dapat menyiratkan keruntuhan atau kebinasaan. Terjemahan ini mempertahankan metafora Ibrani tanpa mempersempit maknanya.
- source_word: עָם
  choice: suatu bangsa
  rationale: עָם dapat menunjuk kepada rakyat atau bangsa. Bentuk “suatu bangsa” menyatakan prinsip umum, bukan bangsa tertentu.
- source_word: וּתְשׁוּעָה
  choice: tetapi ... ada keselamatan
  rationale: תְּשׁוּעָה mencakup keselamatan, kelepasan, keamanan, atau kemenangan. “Ada keselamatan” mempertahankan konstruksi nominal Ibrani dan keluasan dasarnya, sementara catatan kaki mencatat nuansa lain yang mungkin.
- source_word: בְּרֹב
  choice: dengan banyak
  rationale: Ungkapan ini berarti dalam atau dengan jumlah yang banyak. “Dengan banyak” merupakan susunan Indonesia yang alami dan mempertahankan penekanan pada banyaknya penasihat.
- source_word: יוֹעֵץ
  choice: penasihat
  rationale: Walaupun bentuk katanya tunggal, rangkaian רֹב יוֹעֵץ berfungsi kolektif dan mengacu kepada banyak penasihat. Bahasa Indonesia tidak perlu menandai jamak lagi sesudah “banyak”.
theological_decisions:
- issue: Cakupan makna תְּשׁוּעָה
  choice: keselamatan
  alternative: kelepasan, keamanan, atau kemenangan
  rationale: Dalam konteks hikmat sosial-politik ini, kata tersebut tidak perlu dibatasi pada keselamatan rohani ataupun kemenangan militer. Teks utama memakai istilah yang luas, dan catatan kaki mempertahankan kemungkinan nuansa kontekstual lainnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada peribahasa. “Suatu bangsa” menyatakan prinsip universal; “jatuh” mempertahankan metafora sumber. Penanda catatan kaki ditempatkan langsung setelah klausa yang berkaitan.
