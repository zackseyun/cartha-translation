  text: A kind man benefits himself[a], but a cruel man troubles his own flesh.
translation:
  language: id
  text: 'Orang yang baik hati mendatangkan kebaikan bagi dirinya sendiri,

    tetapi orang kejam mencelakakan dirinya sendiri.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dagingnya sendiri”; kata ini juga dapat berarti “tubuhnya sendiri” atau, jika dipahami sebagai kerabat sedarah, “kerabatnya sendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּמֵל
  choice: mendatangkan kebaikan bagi
  rationale: Bentuk partisip ini menyatakan tindakan berbuat baik atau membawa manfaat. Ungkapan ini alami dalam bahasa Indonesia dan membentuk kontras yang jelas dengan tindakan membawa celaka pada baris kedua.
- source_word: נַפְשׁוֹ
  choice: dirinya sendiri
  rationale: נֶפֶשׁ dapat berarti jiwa, hidup, atau diri. Dalam konteks amsal ini, maknanya bersifat refleksif dan praktis, sehingga 'dirinya sendiri' menghindari pembatasan makna pada jiwa sebagai unsur antropologis.
- source_word: אִישׁ חָסֶד
  choice: orang yang baik hati
  rationale: Frasa ini menggambarkan seseorang yang bercirikan חֶסֶד. 'Baik hati' adalah ungkapan Indonesia yang alami untuk kebaikan dan kepedulian kepada sesama tanpa memasukkan makna perjanjian secara teknis.
- source_word: עֹכֵר
  choice: membawa celaka atas
  rationale: עכר berarti mendatangkan kesusahan atau malapetaka. 'Membawa celaka atas' mempertahankan gagasan kausatif dan antitesis dengan 'mendatangkan kebaikan bagi'.
- source_word: שְׁאֵרוֹ
  choice: tubuhnya sendiri
  rationale: שְׁאֵר dapat menunjuk pada daging, tubuh, atau kerabat sedarah. Dalam kesejajaran dengan נַפְשׁוֹ, 'tubuhnya sendiri' paling wajar menyatakan bahwa kekejaman merugikan diri pelakunya, sementara kemungkinan lain dicatat dalam catatan kaki.
- source_word: אַכְזָרִי
  choice: orang kejam
  rationale: Kata sifat ini dipakai secara substantival. 'Orang kejam' ringkas, alami, dan sejajar dengan 'orang yang baik hati'.
