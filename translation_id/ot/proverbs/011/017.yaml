translation_notes:
  register: Bahasa Indonesia baku yang modern, ringkas, dan bernada amsal. Susunan antitetis serta tindakan yang berbalik kepada pelakunya dipertahankan. Pilihan 'orang' menyampaikan fungsi representatif bentuk maskulin Ibrani secara alami dalam bahasa Indonesia.
