  yaml_path: translation/ot/proverbs/011/019.yaml
  text: So righteousness leads to life[a], but he who pursues evil, to his own death.
translation:
  language: id
  text: Demikianlah, kebenaran menghasilkan kehidupan, tetapi orang yang mengejar kejahatan berakhir pada kematiannya sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Demikianlah, kebenaran adalah bagi kehidupan” atau “Sungguh, kebenaran menghasilkan kehidupan.” Klausa pertama dalam bahasa Ibrani tidak memiliki verba; hubungan antarkatanya dapat dipahami sebagai tujuan atau hasil.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Demikianlah
  rationale: Kata ini berfungsi secara adverbial untuk menegaskan atau menyimpulkan. “Demikianlah” mempertahankan daya pepatah dan kaitannya dengan konteks tanpa menentukan secara berlebihan apakah nuansanya terutama inferensial atau emfatis.
- source_word: צְדָקָה
  choice: kebenaran
  rationale: Dalam sastra hikmat, kata ini menunjuk pada kelurusan moral atau cara hidup yang benar. “Kebenaran” adalah padanan Indonesia yang lazim dan cukup luas untuk mencakup dimensi etisnya dalam pertentangan dengan kejahatan.
- source_word: לְחַיִּים
  choice: menuju kehidupan
  rationale: Preposisi לְ dapat menyatakan arah, hasil, atau tujuan. Karena klausa Ibrani tidak memiliki verba, “menuju” melengkapinya secara wajar sambil mempertahankan hubungan resultatif tanpa membuat kausalitasnya lebih tegas daripada teks.
- source_word: וּמְרַדֵּף
  choice: tetapi orang yang mengejar
  rationale: Partisipel ini dipakai secara substantival dan menggambarkan tindakan yang berkelanjutan atau menjadi kebiasaan. Dalam paralelisme antitetis, וּ paling alami diterjemahkan “tetapi”.
- source_word: רָעָה
  choice: kejahatan
  rationale: Pertentangannya dengan צְדָקָה mendukung arti etis “kejahatan,” bukan terutama “malapetaka” atau “bahaya.”
- source_word: לְמוֹתוֹ
  choice: menuju kematiannya sendiri
  rationale: Secara harfiah frasa ini berarti “menuju kematiannya.” Kata “sendiri” memperjelas sufiks orang ketiga maskulin tunggal dan menunjukkan bahwa kematian itu menimpa orang yang mengejar kejahatan, tanpa menambahkan pelaku eksternal.
theological_decisions:
- issue: Makna צְדָקָה dalam konteks hikmat
  choice: Kebenaran sebagai kelurusan moral yang menuju kehidupan
  alternative: Keadilan sosial yang menuju kehidupan
  rationale: Paralelisme antitetis mempertentangkan orientasi hidup yang benar dengan pengejaran kejahatan. Walaupun צְדָקָה dapat mencakup keadilan, konteks ini mendukung pengertian etis yang lebih luas dan tidak memasukkan kategori doktrinal yang lebih sempit.
- issue: Hubungan kebenaran dengan kehidupan
  choice: Memakai ungkapan arah/hasil “menuju kehidupan”
  alternative: “adalah untuk kehidupan” atau “menghasilkan kehidupan”
  rationale: Klausa pertama tidak berverba. Terjemahan ini membuat kalimat alami dalam bahasa Indonesia sambil mempertahankan keterbukaan hubungan yang dapat dipahami sebagai arah, tujuan, atau hasil.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak pepatah yang ringkas dan bermartabat. Paralelisme dipertahankan melalui pengulangan “menuju,” sedangkan “orang yang” dipilih agar inklusif dan alami.
