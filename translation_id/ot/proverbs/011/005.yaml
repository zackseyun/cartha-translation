base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/005.yaml
  text: The righteousness of the blameless makes his way straight[b][a], but the wicked falls by his wickedness.
translation:
  language: id
  text: Kebenaran orang yang tak bercela meluruskan jalannya[a], tetapi orang fasik jatuh karena kefasikannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “mengarahkan jalannya” atau “meratakan jalannya.” Kata kerja Ibrani menggambarkan tindakan membuat suatu jalan menjadi lurus.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “dalam kefasikannya.” Ungkapan Ibrani dapat menunjuk pada ranah perilaku fasik orang itu atau pada kefasikannya sebagai sarana atau penyebab kejatuhannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקַת
  choice: kebenaran
  rationale: Bentuk konstruksi dari צְדָקָה menunjuk pada keadaan benar dan perilaku lurus; “kebenaran” mempertahankan istilah etis yang lazim dalam sastra hikmat.
- source_word: תָּמִים
  choice: orang yang tak bercela
  rationale: Dalam Amsal, תָּמִים menyatakan keutuhan moral atau integritas, bukan kesempurnaan mutlak tanpa dosa.
- source_word: תְּיַשֵּׁר
  choice: meluruskan
  rationale: Bentuk piel dari ישר berarti membuat lurus atau rata. “Meluruskan” mempertahankan gambaran jalan yang dibuat lurus.
- source_word: דַּרְכּוֹ
  choice: jalannya
  rationale: דֶּרֶךְ merupakan metafora umum dalam sastra hikmat bagi jalan atau arah hidup; akhiran tunggal maskulin dipertahankan secara alami dalam bahasa Indonesia.
- source_word: וּבְרִשְׁעָתוֹ
  choice: karena kefasikannya
  rationale: Preposisi ב dapat menunjukkan sarana atau lingkungan. “Karena” secara alami menyampaikan kefasikan orang itu sendiri sebagai penyebab kejatuhannya tanpa meniadakan kemungkinan nuansa “di dalam” yang dicatat dalam catatan kaki.
- source_word: יִפֹּל
  choice: jatuh
  rationale: Bentuk imperfek dalam pepatah menyatakan kebenaran umum; bentuk kini tanpa penanda waktu paling alami dalam bahasa Indonesia.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Adjektiva tunggal yang digunakan secara substantival menunjuk pada seseorang yang fasik sebagai tipe moral.
theological_decisions:
- issue: Gender antropologis pada bentuk tunggal maskulin
  choice: Mempertahankan bentuk tunggal melalui “jalannya” dan “kefasikannya”
  alternative: Menggunakan bentuk jamak atau ungkapan netral tanpa pronomina
  rationale: Bahasa Ibrani memakai bentuk tunggal maskulin secara representatif. Bahasa Indonesia memungkinkan bentuk tunggal dipertahankan tanpa harus menambahkan pronomina bergender.
- issue: Hubungan antara kefasikan dan kejatuhan
  choice: “jatuh karena kefasikannya”
  alternative: “jatuh dalam kefasikannya”
  rationale: בְּ dapat dibaca secara instrumental/kausal atau lokatif. Teks utama mengungkapkan kausalitas moral pepatah, sedangkan kemungkinan lokatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada hikmat. Paralelisme antarklausa dipertahankan, demikian pula metafora jalan dan kejatuhan. Istilah “tak bercela” dimaksudkan sebagai integritas moral, bukan pernyataan tentang kesempurnaan tanpa dosa.
