  text: תֻּמַּ֣ת יְשָׁרִ֣ים תַּנְחֵ֑/ם וְ/סֶ֖לֶף בּוֹגְדִ֣ים ו/שד/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/003.yaml
  text: The integrity of the upright guides them[b][a], but the crookedness of the treacherous destroys them.
translation:
  language: id
  text: Integritas orang-orang yang lurus menuntun mereka, tetapi kebengkokan orang-orang yang berkhianat menghancurkan mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֻּמַּת
  choice: integritas
  rationale: Nomina ini menunjuk pada keutuhan watak atau integritas moral, bukan keadaan tanpa dosa. “Integritas” jelas dan lazim dalam bahasa Indonesia modern.
- source_word: יְשָׁרִים
  choice: orang-orang yang lurus
  rationale: Pilihan ini menyatakan kelurusan moral sekaligus mempertahankan pertentangan gambaran dengan סֶלֶף, yaitu sesuatu yang bengkok atau menyimpang.
- source_word: תַּנְחֵם
  choice: menuntun mereka
  rationale: Bentuk kausatif dari נחה berarti memimpin atau menuntun. Dalam konteks sastra hikmat, “menuntun” secara alami menyampaikan pengarahan hidup dan moral.
- source_word: סֶלֶף
  choice: kebengkokan
  rationale: Kata ini menggambarkan pemelintiran, penyimpangan, atau kebengkokan moral. “Kebengkokan” mempertahankan metafora Ibrani dan kontrasnya dengan orang-orang yang “lurus,” meskipun “penyelewengan” lebih idiomatis.
- source_word: בּוֹגְדִים
  choice: orang-orang yang berkhianat
  rationale: Partisip ini menunjuk kepada orang yang bertindak khianat atau mengingkari kepercayaan. Frasa ini lebih umum dan tepat daripada “para pengkhianat,” yang dapat terdengar terbatas pada pengkhianatan politik.
- source_word: ו/שד/ם
  choice: menghancurkan mereka
  rationale: Dalam hubungan paralel antarbait, ungkapan ini menyatakan bahwa kebengkokan orang-orang yang berkhianat membawa mereka kepada kehancuran. Terjemahan verbal ini ringkas dan alami, sementara kemungkinan pemahaman nominal dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. “Integritas” dipilih untuk keutuhan moral tanpa menyiratkan kesempurnaan tanpa dosa. Pasangan “lurus” dan “kebengkokan” sengaja dipertahankan agar permainan kontras konkret dalam bahasa Ibrani tetap terlihat.
