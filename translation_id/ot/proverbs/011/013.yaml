  text: A gossip reveals a secret[b][a], but one who is faithful in spirit conceals a matter.
translation:
  language: id
  text: Orang yang suka menggunjing[a] membocorkan rahasia, tetapi orang yang dapat dipercaya merahasiakan suatu perkara.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Orang yang berkeliling sebagai pembawa cerita.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “setia dalam roh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ רָכִיל
  choice: orang yang suka menggunjing
  rationale: Ungkapan ini secara harfiah menggambarkan orang yang berjalan ke sana kemari sebagai pembawa cerita. Dalam konteks ini, maksudnya ialah kebiasaan menyebarkan pembicaraan yang merugikan atau informasi pribadi. Pilihan ini alami dalam bahasa Indonesia dan tidak membatasi maknanya pada tuduhan palsu.
- source_word: מְגַלֶּה
  choice: membocorkan
  rationale: Kata ini berarti membuka atau membuat sesuatu diketahui. Dengan objek 'rahasia', 'membocorkan' secara idiomatis menyatakan penyingkapan informasi yang seharusnya dijaga.
- source_word: סּוֹד
  choice: rahasia
  rationale: Walaupun kata ini dapat berarti percakapan akrab, musyawarah, atau lingkungan orang dekat, kesejajaran dengan tindakan menutupi suatu perkara menunjukkan informasi pribadi atau rahasia.
- source_word: נֶאֱמַן רוּחַ
  choice: orang yang berjiwa setia
  rationale: Frasa ini secara harfiah berarti 'yang setia rohnya'. 'Berjiwa setia' mempertahankan unsur רוּחַ dan menggambarkan watak batin yang dapat dipercaya tanpa mereduksinya menjadi sekadar perilaku lahiriah.
- source_word: מְכַסֶּה
  choice: menutupi
  rationale: Pilihan ini mempertahankan metafora Ibrani tentang menutup atau menyelubungi informasi, sekaligus tetap mudah dipahami sebagai tindakan tidak menyingkapkannya.
- source_word: דָבָר
  choice: suatu perkara
  rationale: דָבָר memiliki cakupan luas, termasuk perkataan, hal, atau perkara. Di sini 'suatu perkara' menjaga keluasan tersebut dan cocok dengan konteks informasi yang dirahasiakan.
