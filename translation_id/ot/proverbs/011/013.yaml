- from: Orang yang suka menggunjing[a] membocorkan rahasia, tetapi orang yang berjiwa setia[b] menutupi suatu perkara.
  to: Orang yang suka menggunjing[a] membocorkan rahasia, tetapi orang yang dapat dipercaya merahasiakan suatu perkara.[b]
  rationale: Revisi memperjelas fungsi kontekstual נֶאֱמַן רוּחַ sebagai orang yang dapat dipercaya tanpa menghapus unsur harfiah “roh,” yang dipertahankan dalam catatan kaki. “Merahasiakan” menggantikan “menutupi” untuk menghindari konotasi Indonesia yang tidak dimaksudkan, sambil tetap menerjemahkan metafora “menutupi” sebagai tidak mengungkapkan. Struktur antitetis dan keluasan דָבָר sebagai “suatu perkara” dipertahankan.
