  text: The fruit of the righteous is a tree of life[a], and he who wins souls is wise.
translation:
  language: id
  text: Buah orang benar adalah pohon kehidupan, dan orang yang memenangkan orang lain adalah bijak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “orang yang mengambil orang-orang/nyawa adalah bijak.” Kata Ibrani yang diterjemahkan “memenangkan” secara harfiah berarti “mengambil,” dan kata yang diterjemahkan “orang lain” juga dapat berarti “jiwa,” “nyawa,” atau “kehidupan.” Ungkapan ini dapat menunjuk pada mendapatkan atau memengaruhi orang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרִי
  choice: buah
  rationale: Mempertahankan metafora Ibrani yang dapat menunjuk pada hasil atau dampak kehidupan orang benar.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva ini dipakai sebagai nomina dan secara wajar merujuk pada orang yang hidup benar.
- source_word: עֵץ חַיִּים
  choice: pohon kehidupan
  rationale: Mempertahankan ungkapan khas sastra hikmat serta gaungnya dengan pemakaian lain dalam Amsal dan Kejadian.
- source_word: לֹקֵחַ
  choice: memenangkan hati
  rationale: Secara harfiah berarti ‘mengambil’, tetapi bersama נְפָשׁוֹת dapat menyatakan tindakan mendapatkan atau memengaruhi orang. Ungkapan Indonesia ini menyampaikan makna tersebut tanpa menjadikannya istilah khusus mengenai pertobatan.
- source_word: נְפָשׁוֹת
  choice: orang lain
  rationale: Dalam konteks ini bentuk jamak נֶפֶשׁ dapat berarti orang-orang, diri, nyawa, atau kehidupan, bukan semata-mata jiwa sebagai unsur tak berwujud.
- source_word: חָכָם
  choice: orang bijak
  rationale: Adjektiva ini dapat dipahami secara substantival. Penempatan sebagai subjek menghasilkan kalimat Indonesia yang alami tanpa mengubah hubungan maknanya.
theological_decisions:
- issue: Makna ungkapan לֹקֵחַ נְפָשׁוֹת
  choice: orang bijak memenangkan hati orang lain
  alternative: orang yang mengambil orang-orang/nyawa adalah bijak
  rationale: Teks Ibrani ringkas dan dapat dibaca secara lebih harfiah sebagai ‘mengambil orang-orang/nyawa’. Terjemahan utama menyampaikan kemungkinan makna mendapatkan pengaruh atas orang lain, tetapi tidak secara khusus memasukkan gagasan penginjilan atau penyelamatan jiwa. Catatan kaki mempertahankan ketegangan leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada peribahasa. ‘Pohon kehidupan’ dipertahankan sebagai ungkapan utama. ‘Memenangkan hati orang lain’ dipilih agar idiomnya mudah dipahami, sementara catatan kaki menjaga arti harfiah dan ambiguitas teks Ibrani.
