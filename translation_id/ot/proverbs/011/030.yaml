  naturalness: “Orang yang memenangkan orang lain adalah bijak” adalah bahasa Indonesia baku dan cukup ringkas untuk gaya amsal. Pilihan ini tidak memaksakan idiom “memenangkan hati,” sambil tetap menyampaikan pembacaan idiomatis yang didukung audit bahasa Inggris.
  terminology: “Orang benar” dan “pohon kehidupan” tepat. “Memenangkan orang lain” mempertahankan objek manusia tanpa memakai “jiwa” dalam arti antropologis atau rohani yang terlalu sempit. Catatan kaki perlu menjelaskan bahwa “memenangkan” adalah penafsiran idiomatis dari ‘mengambil,’ bukan padanan harfiah.
