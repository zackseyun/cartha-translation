  text: He will surely suffer harm who becomes surety for a stranger[b][a], but whoever hates striking hands is secure.
translation:
  language: id
  text: Siapa yang menjadi penjamin bagi orang luar[a] pasti akan celaka, tetapi siapa yang membenci menepukkan tangan sebagai tanda jaminan[b] akan aman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '"Orang luar" dapat berarti orang yang bukan kerabat atau bukan anggota lingkaran dekat, bukan hanya orang berkebangsaan asing.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "menepukkan tangan"; tindakan ini digunakan untuk mengesahkan janji atau jaminan.
    reason: cultural_note
lexical_decisions:
- source_word: רַע יֵרוֹעַ
  choice: pasti akan celaka
  rationale: Gabungan adverbial רַע dengan bentuk Nifal יֵרוֹעַ menegaskan akibat buruk yang akan dialami, bukan kejahatan moral. Ungkapan ini alami dan tegas dalam bahasa Indonesia.
- source_word: עָרַב
  choice: menjadi penanggung
  rationale: Kata kerja ini menunjuk pada tindakan mengikat diri sebagai penjamin kewajiban orang lain. 'Menjadi penanggung' mempertahankan nuansa hukum-keuangan tanpa membatasi kewajiban itu secara eksplisit hanya pada utang.
- source_word: זָר
  choice: orang luar
  rationale: Dalam konteks sastra hikmat, kata ini dapat menunjuk pada orang di luar lingkaran keluarga atau kelompok, bukan semata-mata warga bangsa asing. 'Orang luar' mempertahankan keluasan makna tersebut.
- source_word: שֹׂנֵא
  choice: membenci
  rationale: Terjemahan ini mempertahankan kekuatan kata Ibrani dan menyatakan penolakan yang tegas, sebagaimana lazim dalam gaya amsal.
- source_word: תֹקְעִים
  choice: berjabat tangan untuk mengikat jaminan
  rationale: Ungkapan ini secara harfiah menggambarkan tindakan menepukkan atau menggenggam tangan sebagai isyarat pengesahan suatu jaminan. Terjemahan menjelaskan fungsi isyarat itu sambil mempertahankan gambaran konkretnya.
- source_word: בּוֹטֵחַ
  choice: akan aman
  rationale: Dalam pertentangan dengan orang yang akan celaka, kata ini menyatakan keadaan terlindung atau bebas dari bahaya yang ditimbulkan oleh jaminan tersebut.
