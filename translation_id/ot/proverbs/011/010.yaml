source:
  edition: WLC
  text: בְּ/ט֣וּב צַ֭דִּיקִים תַּעֲלֹ֣ץ קִרְיָ֑ה וּ/בַ/אֲבֹ֖ד רְשָׁעִ֣ים רִנָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/010.yaml
  text: In the prosperity of the righteous a city rejoices[b][a], and in the perishing of the wicked there is shouting.
translation:
  language: id
  text: Ketika orang-orang benar sejahtera, kota bersukacita[a], dan ketika orang-orang fasik binasa, terdengar sorak-sorai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Dalam kebaikan (atau kesejahteraan) orang-orang benar, kota bersukacita.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “terdengar seruan sukacita.” Kata Ibrani ini dapat menunjuk pada seruan nyaring atau sorak kegembiraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטוּב
  choice: ketika ... sejahtera
  rationale: Frasa בְּטוּב menunjuk pada keadaan atau saat orang benar mengalami kebaikan, kesejahteraan, atau keadaan yang baik. Bentuk temporal ini alami dalam bahasa Indonesia dan sesuai dengan kesejajaran בַּאֲבֹד pada bagian kedua.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Adjektiva jamak ini digunakan sebagai nomina dan menunjuk pada golongan orang yang hidup benar.
- source_word: תַּעֲלֹץ
  choice: bersukacita
  rationale: Kata kerja עלץ menyatakan kegembiraan yang kuat atau penuh sukacita; pilihan ini tetap wajar dengan 'kota' sebagai subjek yang dipersonifikasikan.
- source_word: קִרְיָה
  choice: kota
  rationale: Nomina ini berarti kota atau permukiman. Nomina tanpa penentu dalam bahasa Indonesia menyampaikan sifat umum pepatah dengan alami.
- source_word: וּבַאֲבֹד
  choice: dan ketika ... binasa
  rationale: Preposisi dengan infinitif konstruk אבד memperkenalkan keadaan atau waktu yang sejajar dengan bagian pertama. 'Binasa' mempertahankan cakupan makna tanpa menentukan apakah penyebabnya kematian, kehancuran, atau lenyapnya kekuasaan.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Adjektiva jamak substantival ini membentuk kontras moral dengan 'orang-orang benar'. 'Fasik' adalah istilah Indonesia yang ringkas dan lazim dalam konteks hikmat Alkitab.
- source_word: רִנָּה
  choice: terdengar sorak-sorai
  rationale: רִנָּה dapat berarti seruan nyaring, biasanya bernuansa gembira. 'Terdengar sorak-sorai' mengungkapkan klausa nominal Ibrani secara alami sambil mempertahankan gambaran reaksi publik.
theological_decisions:
- issue: Alasan kota bersukacita dan bersorak
  choice: Tidak dijelaskan lebih lanjut dalam teks utama.
  alternative: Menambahkan bahwa masyarakat bersukacita karena pemerintahan orang benar membawa berkat atau karena penindasan orang fasik berakhir.
  rationale: Teks Ibrani hanya menyatakan hubungan antara keadaan kedua kelompok dan tanggapan kota. Penjelasan sebab yang lebih khusus akan melampaui ayat dan dapat mempersempit daya berlaku pepatah.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur temporal yang sejajar mempertahankan keseimbangan kedua bagian pepatah. Bentuk jamak 'orang-orang benar' dan 'orang-orang fasik' memperjelas kategori moral, sedangkan 'kota' tanpa penentu terdengar alami sebagai pernyataan umum.
