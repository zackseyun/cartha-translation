source:
  edition: WLC
  text: בָּז לְ/רֵעֵ֥/הוּ חֲסַר לֵ֑ב וְ/אִ֖ישׁ תְּבוּנ֣וֹת יַחֲרִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/012.yaml
  text: Whoever despises his neighbor lacks sense[c][b][a], but a man of understanding keeps silent.
translation:
  language: id
  text: Orang yang menghina sesamanya[a] tidak berakal budi,[b] tetapi orang yang berpengertian[c] berdiam diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kawannya” atau “sahabatnya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kekurangan hati,” suatu ungkapan untuk orang yang tidak memiliki pertimbangan atau pengertian.
    reason: lexical_alternative
  - marker: c
    text: Bahasa Ibrani berbunyi “seorang laki-laki yang berpengertian,” dengan bentuk maskulin tunggal yang dipakai secara representatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז
  choice: menghina
  rationale: Partisipel ini menyatakan sikap meremehkan atau memperlakukan seseorang dengan penghinaan. “Menghina” ringkas, alami, dan mempertahankan kontras moral dalam amsal ini.
- source_word: לְרֵעֵהוּ
  choice: sesamanya
  rationale: רֵעַ dapat berarti kawan, sahabat, atau sesama. “Sesamanya” mempertahankan cakupan sosial-etis yang luas tanpa membatasinya pada persahabatan dekat.
- source_word: חֲסַר לֵב
  choice: tidak berakal budi
  rationale: Secara harfiah ungkapan ini berarti “kekurangan hati,” tetapi לֵב di sini menunjuk pada kemampuan menilai dan memahami. “Tidak berakal budi” menyampaikan idiom tersebut dalam bahasa Indonesia yang jelas dan bermartabat.
- source_word: וְאִישׁ תְּבוּנוֹת
  choice: orang yang berpengertian
  rationale: אִישׁ berbentuk maskulin tunggal dan dipakai secara representatif, sedangkan תְּבוּנוֹת menyatakan pengertian atau daya membedakan. “Orang yang berpengertian” alami dalam bahasa Indonesia; bentuk sumber dijelaskan dalam catatan.
- source_word: יַחֲרִישׁ
  choice: berdiam diri
  rationale: Bentuk Hifil ini berarti diam atau tidak berbicara. “Berdiam diri” menyiratkan pengendalian diri yang disengaja dan sesuai dengan kontras amsal.
theological_decisions:
- issue: Bahasa maskulin representatif dalam וְאִישׁ
  choice: orang yang berpengertian
  alternative: laki-laki yang berpengertian
  rationale: Bahasa Indonesia lazim memakai “orang” untuk pernyataan umum. Pilihan ini tidak membatasi ajaran amsal kepada laki-laki, sementara bentuk maskulin tunggal dalam bahasa Ibrani tetap dinyatakan secara terbuka dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya amsal yang ringkas dan bermartabat. Susunan antitetis sumber dipertahankan, dan istilah idiomatis dipilih agar mudah dipahami pembaca umum tanpa menghilangkan informasi leksikal penting.
