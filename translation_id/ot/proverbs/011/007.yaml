  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּ/מ֤וֹת אָדָ֣ם רָ֭שָׁע תֹּאבַ֣ד תִּקְוָ֑ה וְ/תוֹחֶ֖לֶת אוֹנִ֣ים אָבָֽדָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/007.yaml
  text: When a wicked man dies[a], his hope perishes, and the expectation of wealth comes to nothing.
translation:
  language: id
  text: Ketika orang fasik mati, harapannya lenyap, dan harapan akan kekuatan[a] pun sirna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “harapan orang-orang kuat pun sirna.” Kata Ibrani ini sulit dan dapat menunjuk pada kekuatan atau kuasa, ataupun pada orang-orang kuat; sebagian penafsir memahaminya sebagai kekayaan atau sumber daya.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמוֹת
  choice: Ketika ... mati
  rationale: Preposisi ב dengan infinitif konstruk מות membentuk klausa waktu; bentuk ini alami dalam bahasa Indonesia dan mempertahankan makna temporalnya.
- source_word: אָדָם רָשָׁע
  choice: orang fasik
  rationale: אָדָם di sini menunjuk seorang individu secara umum, sedangkan רָשָׁע menyatakan watak moral yang berlawanan dengan orang benar. 'Orang fasik' merupakan ungkapan hikmat yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: תֹּאבַד תִּקְוָה
  choice: harapannya lenyap
  rationale: תִּקְוָה berarti 'harapan', dan אבד menyatakan hilang atau musnah. Sufiks posesif tersirat secara alami dari subjek dalam konteks Indonesia.
- source_word: וְתוֹחֶלֶת
  choice: dan harapan ... pun
  rationale: תּוֹחֶלֶת berarti harapan atau penantian penuh harap. Pengulangan 'harapan' lebih alami daripada 'penantian' dalam konstruksi ini, sedangkan 'pun' menandai kesejajaran klausa kedua.
- source_word: אוֹנִים
  choice: kekuatan
  rationale: Bentuk yang sulit ini paling wajar dihubungkan dengan און/אֹון, yaitu kekuatan, daya, atau kuasa. Terjemahan abstrak 'kekuatan' mempertahankan arti leksikal tanpa menentukan secara berlebihan sumber atau jenis kekuatan tersebut.
- source_word: אָבָדָה
  choice: sirna
  rationale: Kata ini juga berasal dari אבד. 'Sirna' mempertahankan gagasan lenyapnya harapan sambil menghindari pengulangan kata yang kaku dalam dua baris paralel.
theological_decisions:
- issue: Cakupan gender אָדָם
  choice: orang
  alternative: laki-laki
  rationale: Dalam pepatah ini אָדָם menunjuk individu representatif, bukan menegaskan jenis kelamin biologis. 'Orang fasik' menyampaikan cakupan itu secara alami tanpa mengubah kontras moral teks.
- issue: Penafsiran אוֹנִים
  choice: kekuatan
  alternative: orang-orang kuat; kekayaan
  rationale: Istilah Ibrani ini tidak pasti dan dapat dipahami sebagai kekuatan atau sebagai bentuk yang menunjuk orang-orang kuat; dalam konteks tertentu, daya atau sumber daya juga dapat mengarah pada kekayaan. Teks utama memilih arti leksikal 'kekuatan', sedangkan alternatif personal dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat yang sesuai dengan sastra hikmat. Paralelisme dijaga melalui 'lenyap' dan 'sirna', sementara ambiguitas אוֹנִים tidak diselesaikan secara dogmatis.
