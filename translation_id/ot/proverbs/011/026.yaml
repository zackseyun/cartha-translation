  text: מֹ֣נֵֽעַ בָּ֭ר יִקְּבֻ֣/הוּ לְא֑וֹם וּ֝/בְרָכָ֗ה לְ/רֹ֣אשׁ מַשְׁבִּֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/026.yaml
  text: The one who withholds grain—the people curse him[b][a], but blessing is on the head of the one who sells it.
translation:
  language: id
  text: Orang yang menahan gandum akan dikutuk oleh rakyat[a], tetapi berkat ada di atas kepala orang yang menjualnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bangsa” atau “khalayak”; kata Ibrani לְאֹם dapat menunjuk suatu bangsa atau masyarakat secara kolektif.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang yang membagikannya”; partisipel Ibrani ini dapat menekankan penyediaan gandum, tetapi dalam konteks ini biasanya berarti menjual atau memasoknya, sebagai lawan dari menahannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹנֵעַ
  choice: orang yang menahan-nahan
  rationale: Partisipel ini menggambarkan tindakan atau kebiasaan menahan persediaan. Bentuk ulang “menahan-nahan” secara alami menyiratkan keengganan mengeluarkan gandum untuk umum.
- source_word: בָּר
  choice: gandum
  rationale: Dalam konteks ini kata tersebut menunjuk pada biji-bijian pangan. “Gandum” merupakan padanan Indonesia yang alami, meski cakupan Ibraninya dapat lebih umum daripada satu jenis serealia.
- source_word: יִקְּבֻהוּ
  choice: akan dikutuk
  rationale: Bentuk verba dari נקב di sini bermakna mengutuk; konstruksi pasif Indonesia mempertahankan rakyat sebagai pelaku yang disebut sesudah verba.
- source_word: לְאֹם
  choice: rakyat
  rationale: Kata ini dapat berarti bangsa, kaum, atau khalayak. Dalam latar sosial amsal ini, “rakyat” dengan wajar menunjuk masyarakat umum yang terdampak oleh penahanan pangan.
- source_word: וּבְרָכָה
  choice: tetapi berkat
  rationale: Waw secara bentuk berarti “dan”, tetapi paralelisme antitetis mendukung “tetapi” sebagai penghubung alami dalam bahasa Indonesia.
- source_word: לְרֹאשׁ
  choice: ada di atas kepala
  rationale: Ungkapan ini mempertahankan gambaran konkret Ibrani tentang berkat yang berada atau turun atas kepala seseorang.
- source_word: מַשְׁבִּיר
  choice: orang yang menjualnya
  rationale: Partisipel Hifil dari שׁבר dalam konteks persediaan pangan lazim menunjuk orang yang menyediakan gandum melalui penjualan. Kata ganti “-nya” merujuk kembali kepada gandum.
