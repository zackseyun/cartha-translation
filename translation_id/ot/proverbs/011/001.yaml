id: PRO.11.1
reference: Proverbs 11:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מֹאזְנֵ֣י מִ֭רְמָה תּוֹעֲבַ֣ת יְהוָ֑ה וְ/אֶ֖בֶן שְׁלֵמָ֣ה רְצוֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/001.yaml
  text: Dishonest scales are an abomination to Yahweh[a], but a full weight is his delight.
translation:
  language: id
  text: Neraca curang adalah kekejian bagi Yahweh, tetapi batu timbangan yang tepat[a] adalah kesukaan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “batu yang utuh.” Maksudnya ialah batu standar dengan berat penuh dan akurat yang digunakan dalam perdagangan.
    reason: Menjelaskan gambaran konkret dalam bahasa Ibrani dan makna komersialnya.
lexical_decisions:
- source_word: מֹאזְנֵי מִרְמָה
  choice: neraca curang
  rationale: Bentuk konstruksi ini secara harfiah menunjuk pada neraca yang terkait dengan penipuan. “Neraca curang” alami dalam bahasa Indonesia dan mempertahankan gambaran perdagangan serta pengukuran yang tidak jujur.
- source_word: תּוֹעֲבַת
  choice: kekejian
  rationale: Istilah ini menyatakan sesuatu yang sangat dibenci atau menjijikkan secara moral di hadapan Allah. “Kekejian” mempertahankan daya ungkapnya yang kuat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶבֶן שְׁלֵמָה
  choice: batu timbangan yang tepat
  rationale: Secara harfiah berarti “batu yang utuh/lengkap”; dalam konteks perdagangan, אֶבֶן adalah batu standar yang dipakai sebagai anak timbangan. “Yang tepat” menyampaikan bahwa beratnya penuh dan tidak dikurangi, sedangkan catatan kaki mempertahankan ungkapan harfiahnya.
- source_word: רְצוֹנוֹ
  choice: adalah kesukaan-Nya
  rationale: רָצוֹן dapat berarti perkenanan, kesenangan, atau kesukaan. Pilihan ini membentuk antitesis yang jelas dengan “kekejian” tanpa mengurangi penilaian pribadi Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama diri.
- issue: Nuansa רְצוֹנוֹ
  choice: kesukaan-Nya
  alternative: perkenanan-Nya
  rationale: Keduanya mungkin secara leksikal. “Kesukaan-Nya” dipilih karena lebih langsung mengimbangi “kekejian” dalam paralel antitetis, tanpa menyatakan bahwa batu itu memperoleh perkenanan sebagai ganjaran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan antitetis pepatah dipertahankan; istilah “neraca” dan “batu timbangan” menjaga latar perdagangan kuno sekaligus tetap mudah dipahami.
