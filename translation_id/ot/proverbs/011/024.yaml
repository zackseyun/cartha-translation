base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/024.yaml
  text: There is one who scatters[a], yet gains still more; and one who withholds more than is right, but only to poverty.
translation:
  language: id
  text: Ada orang yang membagi-bagikan dengan murah hati, tetapi semakin bertambah; ada pula yang menahan lebih daripada yang patut[a], tetapi hanya menuju kekurangan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani ini sulit. Dapat berarti “menahan melampaui batas yang patut” atau “menahan apa yang dituntut oleh keadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Ada orang yang
  rationale: Memperkenalkan suatu tipe orang secara umum; bentuk ini alami dalam bahasa Indonesia dan menghubungkan partisip-partisip berikutnya.
- source_word: מְפַזֵּר
  choice: membagi-bagikan dengan murah hati
  rationale: Kata ini secara harfiah berarti menyebarkan atau menghamburkan. Dalam konteks antitesis dengan menahan, ungkapan ini menyampaikan kiasan tentang pemberian yang leluasa tanpa menyiratkan pemborosan.
- source_word: וְנוֹסָף עוֹד
  choice: tetapi hartanya semakin bertambah
  rationale: Bentuk pasif ini menyatakan bahwa sesuatu terus ditambahkan atau bertambah. 'Hartanya' disuplai dari konteks ekonomi pepatah agar hasil paradoksal kemurahan hati jelas dalam bahasa Indonesia.
- source_word: וְחוֹשֵׂךְ
  choice: ada pula yang menahan
  rationale: Menunjukkan tindakan menahan atau menyimpan kembali dan membentuk kontras langsung dengan membagi-bagikan.
- source_word: מִיֹּשֶׁר
  choice: lebih daripada yang patut
  rationale: Frasa Ibrani ini sulit. Pilihan ini memahaminya sebagai menahan melampaui batas yang wajar, sambil mempertahankan muatan etis kata yang berarti kelurusan, kepatutan, atau apa yang benar.
- source_word: אַךְ לְמַחְסוֹר
  choice: tetapi akhirnya berkekurangan
  rationale: אַךְ membatasi atau menegaskan hasil ironis, sedangkan מַחְסוֹר berarti kekurangan atau kebutuhan. Rumusan ini alami dan jelas dalam bahasa Indonesia.
