id: PRO.11.18
reference: Proverbs 11:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רָשָׁ֗ע עֹשֶׂ֥ה פְעֻלַּת שָׁ֑קֶר וְ/זֹרֵ֥עַ צְ֝דָקָ֗ה שֶׂ֣כֶר אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/018.yaml
  text: A wicked man earns deceptive wages[b][a], but one who sows righteousness receives a true reward.
translation:
  language: id
  text: Orang fasik memperoleh upah yang menipu[a], tetapi orang yang menabur kebenaran mendapat ganjaran yang pasti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melakukan pekerjaan kepalsuan”; ungkapan Ibrani ini dapat menekankan pekerjaan yang curang atau hasil jerih payah yang ternyata sia-sia.
    reason: lexical_alternative
  - marker: b
    text: Atau “ganjaran yang sejati” atau “upah yang dapat diandalkan”; secara harfiah, “upah/ganjaran kebenaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Nomina maskulin tunggal ini dipakai secara umum dalam peribahasa. Bahasa Indonesia tidak perlu menandai gender gramatikalnya; 'orang fasik' alami dan mempertahankan ciri moral subjek.
- source_word: עֹשֶׂה פְעֻלַּת שָׁקֶר
  choice: memperoleh upah yang menipu
  rationale: Secara harfiah ungkapan ini dapat berarti 'melakukan pekerjaan kepalsuan', tetapi פְעֻלָּה juga berkaitan dengan hasil atau upah kerja. Dalam pasangan antitetis dengan שֶׂכֶר, terjemahan ini menampilkan hasil jerih payah yang tampak menguntungkan tetapi ternyata palsu atau mengecewakan.
- source_word: שָׁקֶר
  choice: yang menipu
  rationale: Kata ini mencakup kepalsuan, penipuan, dan sesuatu yang tidak dapat diandalkan. 'Yang menipu' mempertahankan ironi bahwa upah itu tampak nyata, tetapi hasilnya tidak seperti yang dijanjikan.
- source_word: וְזֹרֵעַ
  choice: tetapi orang yang menabur
  rationale: Walaupun וְ secara dasar berarti 'dan', struktur amsal ini bersifat antitetis sehingga 'tetapi' wajar. Bentuk partisipel diterjemahkan sebagai pelaku yang terus atau lazim melakukan tindakan tersebut.
- source_word: צְדָקָה
  choice: kebenaran
  rationale: Dalam konteks hikmat, istilah ini menunjuk kelakuan yang benar dan adil. 'Kebenaran' mempertahankan istilah moral-teologis yang luas dan selaras dengan ungkapan Indonesia 'menabur kebenaran'.
- source_word: שֶׂכֶר אֱמֶת
  choice: ganjaran yang pasti
  rationale: Secara harfiah berarti 'upah/ganjaran kebenaran'. אֱמֶת di sini menerangkan ganjaran sebagai nyata, teguh, dan dapat diandalkan; 'yang pasti' menyampaikan kontrasnya dengan upah yang menipu.
theological_decisions:
- issue: Cakupan makna צְדָקָה
  choice: kebenaran
  alternative: keadilan; apa yang benar
  rationale: Istilah ini dapat mencakup keadilan sosial maupun kelakuan benar. Konteks tidak membatasi maknanya pada salah satu sisi, sehingga 'kebenaran' mempertahankan keluasan etis-teologisnya.
- issue: Sifat ganjaran dalam שֶׂכֶר אֱמֶת
  choice: ganjaran yang pasti
  alternative: ganjaran yang sejati; upah yang dapat diandalkan
  rationale: Frasa tersebut menyatakan kepastian atau keandalan ganjaran sebagai kontras terhadap hasil orang fasik yang menipu; terjemahan ini tidak menentukan waktu atau mekanisme pemberian ganjaran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat khas amsal. Paralelisme antitetis dipertegas oleh 'tetapi'. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskan dan diurutkan [a], [b].
