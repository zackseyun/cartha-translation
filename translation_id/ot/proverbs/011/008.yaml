  text: The righteous is rescued from trouble[a], and the wicked comes in his place.
translation:
  language: id
  text: Orang benar dilepaskan dari kesesakan, dan orang fasik datang menggantikannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “datang sebagai gantinya”; frasa Ibrani ini dapat menyatakan penggantian, yang mengisyaratkan bahwa orang fasik mengalami kesesakan sebagai pengganti orang benar.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva substantival ini menunjuk kepada seorang yang hidup benar. “Orang benar” mempertahankan bentuk tunggal representatif dan merupakan ungkapan yang alami dalam sastra hikmat Indonesia.
- source_word: מִצָּרָה
  choice: dari kesesakan
  rationale: Preposisi מִן menyatakan pemisahan atau pembebasan dari suatu keadaan, sedangkan צָרָה mencakup kesesakan, kesulitan, atau malapetaka. “Kesesakan” menjaga bobot keadaan yang menekan tanpa membatasinya pada satu jenis bahaya.
- source_word: נֶחֱלָץ
  choice: dilepaskan
  rationale: Bentuk nifal dari חלץ menyatakan bahwa orang benar ditarik keluar atau dibebaskan. Bentuk pasif “dilepaskan” mempertahankan bahwa pembebasan itu dialami, bukan semata-mata hasil usahanya sendiri.
- source_word: וַיָּבֹא
  choice: datang
  rationale: Kata kerja ini secara dasar berarti “datang” dan menggerakkan klausa kedua. Bentuk kini cocok untuk pernyataan hikmat yang bersifat umum.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Adjektiva substantival ini menjadi pasangan kontras bagi “orang benar”. “Orang fasik” merupakan istilah Indonesia yang ringkas dan lazim untuk orang yang jahat serta menolak jalan yang benar.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: תַּחַת dengan sufiks dapat berarti “di tempatnya” atau “sebagai gantinya”. Dalam konteks paralel ini, “menggantikan dia” menyampaikan gagasan pembalikan atau penggantian, sementara kemungkinan ungkapan yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Sifat pembalikan antara orang benar dan orang fasik
  choice: 'Ayat ini menyatakan prinsip hikmat umum: orang benar dibebaskan dari kesesakan, lalu orang fasik mengambil tempatnya.'
  alternative: Orang fasik secara khusus mengalami kesesakan yang persis sama dengan kesesakan yang baru saja dilepaskan dari orang benar.
  rationale: Kata תַּחְתָּיו mendukung gagasan penggantian atau pembalikan, tetapi ayat ini tidak menjelaskan mekanisme, waktu, atau apakah peristiwanya harus dipahami sebagai satu kejadian konkret yang sama. Terjemahan mempertahankan pernyataan yang padat tanpa mengubahnya menjadi janji mutlak tentang setiap kasus.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bernada hikmat. “Orang benar” dan “orang fasik” mempertahankan kontras moral teks. Konjungsi “tetapi” menampilkan pembalikan antarklausa secara alami tanpa menambahkan hubungan sebab-akibat.
