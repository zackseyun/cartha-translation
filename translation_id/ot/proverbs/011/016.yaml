translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada amsal. Konjungsi 'tetapi' dipakai untuk menampilkan kontras antara kehormatan yang diperoleh melalui sifat luhur dan kekayaan yang diperoleh orang kejam. Penanda catatan kaki [a] ditempatkan sesudah 'kehormatan'.
