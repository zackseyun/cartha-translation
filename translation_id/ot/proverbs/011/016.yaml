  text: A gracious woman obtains honor[a], and ruthless men obtain wealth.
translation:
  language: id
  text: Seorang perempuan yang ramah memperoleh kehormatan[a], dan orang-orang kejam memperoleh kekayaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Seorang perempuan yang memiliki perkenanan berpegang teguh pada kehormatan ... dan orang-orang kejam berpegang teguh pada kekayaan.” Frasa Ibrani secara harfiah berarti “perempuan dari perkenanan/keanggunan.” Kata kerja Ibrani dalam kedua bagian secara harfiah berarti “memegang” atau “menopang,” tetapi di sini kemungkinan bermakna meraih atau memperoleh.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשֶׁת חֵן
  choice: perempuan yang murah hati
  rationale: Frasa konstruksi ini secara harfiah berarti 'perempuan yang memiliki חֵן'. Dalam konteks hikmat, חֵן dapat menunjuk pada sifat yang mendatangkan perkenanan, bukan sekadar daya tarik lahiriah. 'Murah hati' menyampaikan sifat baik itu dalam bahasa Indonesia yang alami, meskipun nuansa 'anggun/menawan' tetap mungkin.
- source_word: תִּתְמֹךְ
  choice: memperoleh
  rationale: Makna dasar תמך ialah 'memegang, menopang, mempertahankan'. Dalam kesejajaran amsal ini, kata tersebut kemungkinan menggambarkan tindakan meraih atau mengamankan sesuatu; 'memperoleh' mengungkapkan hasilnya dengan wajar.
- source_word: כָּבוֹד
  choice: kehormatan
  rationale: Di sini כָּבוֹד paling wajar menunjuk pada kehormatan atau penghargaan sosial, bukan kemuliaan yang tampak.
- source_word: עָרִיצִים
  choice: orang-orang kejam
  rationale: Kata ini menunjuk pada orang yang kejam, bengis, atau menindas. Pilihan ini tidak mempersempit maknanya menjadi penguasa politik saja dan tidak menambahkan jenis kelamin yang tidak dinyatakan secara gramatikal.
- source_word: יִתְמְכוּ
  choice: memperoleh
  rationale: Kata kerja yang sama digunakan pada klausa pertama. Pengulangan 'memperoleh' mempertahankan kesejajaran, sementara catatan kaki menyimpan arti harfiahnya, 'memegang erat/mempertahankan'.
- source_word: עֹשֶׁר
  choice: kekayaan
  rationale: Padanan baku dan jelas untuk kelimpahan materi serta membentuk kontras yang alami dengan 'kehormatan'.
