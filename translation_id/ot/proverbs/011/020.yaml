source:
  edition: WLC
  text: תּוֹעֲבַ֣ת יְ֭הוָה עִקְּשֵׁי לֵ֑ב וּ֝/רְצוֹנ֗/וֹ תְּמִ֣ימֵי דָֽרֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/020.yaml
  text: The crooked in heart are an abomination to Yahweh[b][a], but those blameless in their way are his delight.
translation:
  language: id
  text: Orang-orang yang hatinya bengkok[a] adalah kejijikan bagi Yahweh, tetapi orang-orang yang jalannya tidak bercela[b] adalah kesukaan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang hatinya menyimpang.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang-orang yang utuh jalannya,” yaitu mereka yang perilaku atau jalan hidupnya berintegritas dan lurus.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: kejijikan
  rationale: Kata benda ini menyatakan sesuatu yang sangat dibenci atau dianggap menjijikkan secara moral. “Kejijikan” mempertahankan kekuatan dan keringkasan ungkapan Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh” agar nama pribadi Allah dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: עִקְּשֵׁי לֵב
  choice: orang-orang yang hatinya bengkok
  rationale: עִקֵּשׁ menggambarkan kebengkokan atau penyimpangan moral, sedangkan “hati” dalam sastra hikmat mencakup pusat batin, pikiran, kehendak, dan watak. Pilihan ini mempertahankan metafora sumber dengan bahasa Indonesia yang jelas.
- source_word: וּרְצוֹנוֹ
  choice: adalah kesukaan-Nya
  rationale: רָצוֹן dapat berarti kesukaan, perkenanan, atau sesuatu yang menyenangkan. “Kesukaan-Nya” mempertahankan bentuk nominal klausa Ibrani dan kontrasnya dengan “kejijikan.”
- source_word: תְּמִימֵי דָרֶךְ
  choice: orang-orang yang jalannya tidak bercela
  rationale: תָּמִים menyatakan keutuhan, integritas, atau keadaan tidak bercela; דֶּרֶךְ dalam Amsal sering menunjuk pada jalan hidup atau perilaku. Ungkapan ini mempertahankan citra “jalan” sekaligus menyampaikan makna moralnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. Transliterasi “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan sebuah gelar.
- issue: Makna antropologis לֵב (“hati”)
  choice: Mempertahankan kata “hati”
  alternative: batin; pikiran
  rationale: Dalam hikmat Ibrani, “hati” mencakup pusat moral dan intelektual manusia, bukan emosi saja. Mempertahankan citra ini menghindari penyempitan makna.
- issue: Cakupan תָּמִים dalam frasa תְּמִימֵי דָרֶךְ
  choice: tidak bercela
  alternative: berintegritas; lurus; utuh
  rationale: “Tidak bercela” menyatakan keutuhan moral dalam jalan hidup tanpa menyiratkan kesempurnaan mutlak atau tanpa dosa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hikmat. Kesejajaran antarkedua bagian dipertahankan melalui pola “orang-orang yang ... adalah ...”, sementara metafora “hati” dan “jalan” dari bahasa Ibrani tetap digunakan. Kapitalisasi “-Nya” mengikuti kebiasaan Indonesia untuk rujukan kepada Allah.
