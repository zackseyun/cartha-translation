  yaml_path: translation/ot/proverbs/011/006.yaml
  text: The righteousness of the upright rescues them[a], but the treacherous are caught by their own desire.
translation:
  language: id
  text: Kebenaran orang yang jujur menyelamatkan mereka, tetapi orang yang berbuat khianat terjerat oleh keinginan mereka sendiri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang berbuat khianat terjerat dalam kehancuran mereka” atau “oleh kehancuran mereka.” Nomina Ibrani ini dapat berarti hasrat atau keinginan yang merusak, atau malapetaka maupun kehancuran; teks utama memahaminya sebagai keinginan dalam diri mereka yang menjerat mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקַת
  choice: Kebenaran
  rationale: Bentuk konstruk dari צְדָקָה di sini menunjuk pada sifat atau perilaku yang benar secara moral. “Kebenaran” mempertahankan istilah etis khas sastra hikmat; “keadilan” terlalu mempersempit makna pada ranah yudisial, sedangkan “integritas” lebih sempit.
- source_word: יְשָׁרִים
  choice: orang-orang yang lurus
  rationale: Kata ini menunjuk pada orang yang lurus secara moral. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran dasar tentang kelurusan.
- source_word: תַּצִּילֵם
  choice: menyelamatkan mereka
  rationale: Bentuk hifil dari נצל berarti melepaskan atau menyelamatkan dari bahaya. “Menyelamatkan” jelas dan wajar dalam konteks akibat moral praktis peribahasa ini.
- source_word: וּבְהַוַּת
  choice: oleh hasrat mereka sendiri
  rationale: Nomina הַוָּה dapat menunjuk pada hasrat atau keinginan yang menjerumuskan, tetapi juga dapat berarti malapetaka atau kehancuran. Teks utama mengambil makna hasrat sebagai sarana yang menjerat mereka; kata “sendiri” menyatakan secara alami bahwa hasrat itu milik subjek, sebagaimana tersirat dalam konteks. Kemungkinan makna lain dipertahankan dalam catatan kaki.
- source_word: בֹּגְדִים
  choice: orang-orang yang berkhianat
  rationale: Partisip dari בגד menggambarkan orang yang berlaku khianat atau tidak setia. “Orang-orang yang berkhianat” tidak membatasi maknanya hanya pada pengkhianatan politik atau kemurtadan perjanjian.
- source_word: יִלָּכֵדוּ
  choice: tertangkap
  rationale: Bentuk nifal dari לכד menyatakan bahwa mereka tertangkap atau terjerat. “Tertangkap” ringkas dan mempertahankan bentuk pasif teks Ibrani.
