translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur perbandingan aforistis dipertahankan dengan "Seperti ..., demikianlah ...". Istilah "akal budi" dipilih agar dimensi pertimbangan moral dan intelektual tetap terdengar bagi pembaca umum.
