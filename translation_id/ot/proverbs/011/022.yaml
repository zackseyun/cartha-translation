  text: Like a gold ring in a pig’s snout is a beautiful woman who lacks discretion[a].
translation:
  language: id
  text: Seperti cincin hidung emas pada moncong babi, demikianlah perempuan cantik yang menyimpang dari pertimbangan yang baik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perempuan cantik yang tidak memiliki pertimbangan yang baik.”'
    reason: Ungkapan Ibrani וְסָרַת טָעַם secara harfiah menggambarkan seseorang yang menyimpang atau berpaling dari pertimbangan yang baik; alternatif ini menyatakan hasil maknanya secara lebih idiomatis.
lexical_decisions:
- source_word: נֶזֶם
  choice: anting-anting
  rationale: Kata ini menunjuk pada perhiasan berbentuk cincin, sering kali yang dikenakan pada hidung. Dalam bahasa Indonesia, "anting-anting" dapat merujuk pada perhiasan hidung, sementara frasa berikutnya memperjelas letaknya pada moncong babi.
- source_word: זָהָב
  choice: emas
  rationale: Padanan langsung yang mempertahankan kontras antara benda berharga dan moncong babi.
- source_word: בְּאַף חֲזִיר
  choice: pada moncong babi
  rationale: אַף di sini berarti hidung, bukan amarah. "Moncong babi" merupakan ungkapan anatomis yang alami dan jelas dalam bahasa Indonesia.
- source_word: אִשָּׁה יָפָה
  choice: perempuan cantik
  rationale: Tidak ada konteks perkawinan yang menuntut arti "istri"; frasa ini secara umum menggambarkan seorang perempuan yang elok secara fisik.
- source_word: וְסָרַת טָעַם
  choice: yang tidak berakal budi
  rationale: Secara harfiah ungkapan ini menggambarkan orang yang menyimpang atau menjauh dari טַעַם. Dalam sastra hikmat, טַעַם mencakup pertimbangan, kebijaksanaan praktis, dan pengertian yang baik; "tidak berakal budi" menyampaikan kekurangan moral-intelektual itu secara alami.
