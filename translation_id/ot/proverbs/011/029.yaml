  text: Whoever troubles his own house will inherit wind[b][a], and the fool will be a servant to the wise of heart.
translation:
  language: id
  text: Siapa yang mendatangkan kesusahan bagi rumah tangganya[a] akan mewarisi angin[b], dan orang bodoh akan menjadi hamba bagi orang yang bijaksana hatinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumahnya”; kata Ibrani ini dapat menunjuk kepada seisi rumah atau keluarganya, bukan hanya tempat tinggal.
    reason: lexical_alternative
  - marker: b
    text: “Angin” merupakan metafora untuk sesuatu yang kosong, tidak berarti, atau sia-sia; maksudnya dapat diterjemahkan “tidak mendapat apa-apa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹכֵר
  choice: menimbulkan kesusahan
  rationale: Partisip ini menunjuk kepada orang yang mendatangkan kesusahan atau malapetaka. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna aktif tanpa mempersempitnya menjadi kehancuran total.
- source_word: בֵּיתוֹ
  choice: rumah tangganya
  rationale: Dalam konteks ini, 'rumah' dapat mencakup keluarga dan seisi rumah, bukan hanya bangunan. 'Rumah tangganya' menyampaikan cakupan sosial tersebut secara alami.
- source_word: יִנְחַל
  choice: akan mewarisi
  rationale: 'Kata kerja ini lazim berarti menerima milik sebagai warisan. Pilihan ini mempertahankan ironi pepatah: hasil yang diperoleh sebagai ''warisan'' hanyalah angin.'
- source_word: רוּחַ
  choice: angin
  rationale: Metafora Ibrani dipertahankan karena menggambarkan sesuatu yang tidak berisi, tidak dapat digenggam, atau sia-sia; maknanya dijelaskan dalam catatan kaki.
- source_word: וְעֶבֶד
  choice: akan menjadi hamba
  rationale: Klausa tanpa verba menyiratkan keadaan atau akibat. 'Akan menjadi hamba' merupakan predikasi Indonesia yang alami dan tidak secara berlebihan menetapkan status perbudakan tertentu.
- source_word: אֱוִיל
  choice: orang bodoh
  rationale: Istilah hikmat ini menggambarkan orang yang tidak berakal secara moral dan praktis. 'Orang bodoh' jelas, wajar, dan cocok dengan gaya pepatah Indonesia.
- source_word: לַחֲכַם־לֵב
  choice: orang yang bijaksana hatinya
  rationale: Pilihan ini mempertahankan unsur 'hati' sebagai pusat pemahaman dan watak dalam antropologi Ibrani, sambil tetap terdengar alami dalam bahasa Indonesia.
