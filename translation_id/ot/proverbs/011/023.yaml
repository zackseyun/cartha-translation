  text: תַּאֲוַ֣ת צַדִּיקִ֣ים אַךְ ט֑וֹב תִּקְוַ֖ת רְשָׁעִ֣ים עֶבְרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/023.yaml
  text: The desire of the righteous is only good[b][a], but the hope of the wicked is wrath.
translation:
  language: id
  text: Keinginan orang-orang benar hanyalah kebaikan, tetapi harapan[a] orang-orang fasik adalah murka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ekspektasi.”
    reason: lexical_alternative
  - marker: b
    text: Atau “amarah besar.” Bahasa Ibrani tidak menyatakan secara eksplisit murka siapa yang dimaksud; ini dapat menunjuk pada harapan penuh amarah dari orang-orang fasik atau pada murka yang menimpa mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: תַּאֲוַת
  choice: keinginan
  rationale: Nomina ini berarti keinginan atau kerinduan. “Keinginan” paling alami dan ringkas dalam konteks peribahasa ini.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Kata sifat jamak ini dipakai sebagai nomina untuk menyebut golongan yang hidup benar; bentuk ini jelas dan wajar dalam bahasa Indonesia.
- source_word: אַךְ
  choice: hanyalah
  rationale: Partikel ini membatasi isi atau hasil keinginan orang benar pada kebaikan saja, sekaligus mempertahankan keringkasan bahasa Ibrani.
- source_word: טוֹב
  choice: kebaikan
  rationale: Pilihan ini mengungkapkan טוֹב sebagai nomina abstrak dalam konstruksi tanpa verba dan terdengar alami sesudah “hanyalah”.
- source_word: תִּקְוַת
  choice: harapan
  rationale: Nomina ini dapat berarti harapan atau penantian/ekspektasi. “Harapan” merupakan padanan Indonesia yang paling umum dan mempertahankan kesejajaran dengan keinginan pada baris pertama.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Kata sifat jamak yang dipakai sebagai nomina ini menunjuk kepada golongan yang jahat secara moral. “Orang-orang fasik” merupakan ungkapan ringkas dan lazim dalam register Alkitab Indonesia.
- source_word: עֶבְרָה
  choice: murka
  rationale: Kata ini menyatakan murka, amarah besar, atau kegusaran. “Murka” mempertahankan bobot moral dan keringkasan ungkapan Ibrani tanpa menentukan pemilik murka itu.
theological_decisions:
- issue: Makna klausa terakhir
  choice: Harapan orang-orang fasik adalah murka.
  alternative: Harapan orang-orang fasik berakhir dalam murka Allah; atau harapan mereka sendiri merupakan amarah besar.
  rationale: Teks Ibrani hanya menyandingkan “harapan orang-orang fasik” dengan “murka” dan tidak menyebut siapa yang murka. Terjemahan utama mempertahankan ketegangan dan ambiguitas itu serta tidak menambahkan Allah sebagai subjek yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur tanpa verba “hanyalah” dan “adalah” dipertahankan agar kesejajaran serta ketegasan aforistik teks Ibrani tetap terasa. Semua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
