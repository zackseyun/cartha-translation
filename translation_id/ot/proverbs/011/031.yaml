base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/031.yaml
  text: Look[a], if the righteous is repaid on earth, how much more the wicked and the sinner.
translation:
  language: id
  text: Sesungguhnya, orang benar pun mendapat balasan di bumi[a]; terlebih lagi orang fasik dan orang berdosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sesungguhnya, orang benar pun mendapat balasan di negeri” atau “di tanah.” Kata Ibrani yang diterjemahkan “di bumi” juga dapat berarti “di negeri” atau “di tanah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sesungguhnya
  rationale: Partikel ini menegaskan pernyataan. “Sesungguhnya” terdengar wajar dan bermartabat dalam bahasa Indonesia serta tidak memaksakan fungsi sebagai seruan untuk melihat.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva maskulin tunggal yang digunakan secara substantival menunjuk kepada sosok perwakilan; “orang benar” merupakan padanan alami tanpa penekanan gender yang tidak perlu.
- source_word: בָּאָרֶץ
  choice: di bumi
  rationale: אָרֶץ dapat berarti bumi atau negeri/tanah. Dalam pernyataan hikmat yang bersifat umum ini, “di bumi” paling sesuai, sambil mencatat alternatifnya.
- source_word: יְשֻׁלָּם
  choice: mendapat balasan
  rationale: Bentuk Pual dari שלם menyatakan penerimaan ganjaran atau pembalasan yang setimpal. Ungkapan ini sengaja tetap netral dan tidak membatasi maknanya pada pahala ataupun hukuman.
- source_word: אַף כִּי
  choice: terlebih lagi
  rationale: 'Gabungan ini menyatakan penalaran a fortiori: jika hal pertama berlaku, hal berikutnya lebih-lebih lagi berlaku.'
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Padanan baku dalam sastra hikmat bagi orang yang bertentangan dengan jalan kebenaran.
- source_word: וְחוֹטֵא
  choice: dan orang berdosa
  rationale: Partisipel yang dipakai secara substantival menunjuk kepada orang yang bercirikan perbuatan dosa; padanan ini mempertahankan pasangan dengan “orang fasik.”
theological_decisions:
- issue: Sifat balasan yang diterima orang benar
  choice: Ayat menyatakan bahwa orang benar pun menerima balasan di bumi, tanpa menentukan apakah balasan itu pahala, penderitaan disipliner, atau keduanya.
  alternative: Menerjemahkannya secara khusus sebagai “diberi pahala” atau “dihukum.”
  rationale: Kata kerja Ibrani memungkinkan arti luas berupa ganjaran atau pembalasan. Terjemahan netral mempertahankan ketegangan teologis dan struktur a fortiori ayat.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bernada hikmat. Partikel “pun” menolong menampilkan daya a fortiori dari teks, sedangkan “mendapat balasan” mempertahankan keluasan makna verba Ibrani.
