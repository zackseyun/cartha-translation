source:
  edition: WLC
  text: יָ֣ד לְ֭/יָד לֹא יִנָּ֣קֶה רָּ֑ע וְ/זֶ֖רַע צַדִּיקִ֣ים נִמְלָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/021.yaml
  text: Hand to hand[a], the evil will not go unpunished, but the offspring of the righteous will escape.
translation:
  language: id
  text: Tangan ke tangan[a], orang jahat tidak akan luput dari hukuman, tetapi keturunan orang-orang benar akan luput.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tangan ke tangan.” Ungkapan Ibrani ini mungkin berarti “sungguh” atau menegaskan bahwa hal itu pasti terjadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָד לְיָד
  choice: Tangan dengan tangan
  rationale: Mempertahankan gambaran harfiah ungkapan Ibrani yang maknanya tidak sepenuhnya pasti. Bentuk ini cukup dapat dibaca dalam bahasa Indonesia, sedangkan kemungkinan makna penegasan dijelaskan dalam catatan kaki.
- source_word: יִנָּקֶה
  choice: tidak akan luput dari hukuman
  rationale: Bentuk Nifal dari נקה di sini menyatakan bebas atau terlepas dari hukuman. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan konteks akibat moral.
- source_word: רָע
  choice: orang jahat
  rationale: Adjektiva tunggal ini dipakai secara substantival untuk menunjuk seseorang yang jahat. Bahasa Indonesia tidak menandai gender gramatikal, sehingga 'orang jahat' menyampaikan rujukan personal tanpa menambahkan unsur yang tidak dinyatakan secara leksikal.
- source_word: וְזֶרַע
  choice: tetapi keturunan
  rationale: זֶרַע menunjuk pada anak cucu atau keturunan, bukan benih harfiah. ו diterjemahkan secara adversatif karena kedua bagian amsal mempertentangkan nasib orang jahat dengan keturunan orang benar.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Bentuk jamak substantival dipertahankan secara jelas sebagai orang-orang yang benar.
- source_word: נִמְלָט
  choice: akan terlepas
  rationale: Bentuk Nifal dari מלט dapat berarti lolos, terlepas, atau diselamatkan. 'Terlepas' mempertahankan keterbukaan mengenai apakah yang dimaksud ialah terlepas dari hukuman, malapetaka, atau nasib orang jahat.
theological_decisions:
- issue: Makna ungkapan יָד לְיָד
  choice: Gambaran harfiah dipertahankan dalam teks utama
  alternative: Sungguh; dapat dipastikan
  rationale: Ungkapan ini sukar dipastikan maknanya dan tampaknya menyatakan kepastian. Mempertahankan citranya menghindari penetapan satu tafsiran secara diam-diam, sedangkan catatan kaki membantu pembaca.
- issue: Rujukan personal רָע
  choice: orang jahat
  alternative: si jahat; kejahatan
  rationale: Bentuk maskulin tunggal berfungsi sebagai nomina bagi seorang pelaku kejahatan, bukan sebagai konsep abstrak 'kejahatan'. 'Orang jahat' merupakan padanan personal yang alami dalam bahasa Indonesia.
- issue: Cakupan keselamatan dalam נִמְלָט
  choice: akan terlepas
  alternative: akan diselamatkan; akan lolos
  rationale: Teks tidak menyebut secara eksplisit sumber atau sarana pelepasan. Padanan ini menjaga pernyataan tetap ringkas dan tidak mempersempitnya menjadi suatu mekanisme keselamatan tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bercorak amsal. Paralelisme antarkedua bagian dipertahankan; istilah teknis dan bahasa denominasi dihindari.
