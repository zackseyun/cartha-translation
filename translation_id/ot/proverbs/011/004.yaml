  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹא יוֹעִ֣יל ה֭וֹן בְּ/י֣וֹם עֶבְרָ֑ה וּ֝/צְדָקָ֗ה תַּצִּ֥יל מִ/מָּֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/004.yaml
  text: Wealth is of no use on the day of wrath[c][b][a], but righteousness delivers from death.
translation:
  language: id
  text: Kekayaan tidak berguna pada hari kemurkaan[a], tetapi kebenaran[b] menyelamatkan dari kematian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hari kemurkaan” dapat menunjuk secara luas pada waktu penghakiman atau bencana; peribahasa ini tidak menjelaskannya lebih lanjut.
    reason: alternative_reading
  - marker: b
    text: “Kebenaran” juga dapat diterjemahkan “keadilan” atau “perilaku yang benar” dalam konteks sastra hikmat.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: kekayaan
  rationale: Kata ini menunjuk pada harta atau kekayaan materi. “Kekayaan” merupakan padanan Indonesia modern yang luas dan alami.
- source_word: יוֹעִיל
  choice: tidak berguna
  rationale: Bentuk Hifil dari יעל berarti memberi manfaat, berguna, atau mendatangkan keuntungan. “Tidak berguna” menyampaikan ketidakmampuan kekayaan untuk menolong dalam situasi yang dimaksud.
- source_word: בְּיוֹם עֶבְרָה
  choice: pada hari kemurkaan
  rationale: Frasa ini secara harfiah menunjuk pada waktu kemurkaan atau amarah yang meluap. Bentuk definit “hari kemurkaan” dipertahankan tanpa mempersempitnya menjadi peristiwa eskatologis tertentu.
- source_word: צְדָקָה
  choice: kebenaran
  rationale: Dalam sastra hikmat, kata ini dapat mencakup kebenaran, keadilan, dan perilaku yang benar. “Kebenaran” mempertahankan istilah teologis yang umum, sedangkan cakupan etikanya dijelaskan dalam catatan kaki.
- source_word: תַּצִּיל
  choice: menyelamatkan
  rationale: Bentuk Hifil dari נצל berarti melepaskan, menyelamatkan, atau membebaskan dari bahaya. “Menyelamatkan” alami dalam bahasa Indonesia dan mempertahankan daya pernyataannya.
- source_word: מִמָּוֶת
  choice: dari kematian
  rationale: Padanan langsung frasa Ibrani ini adalah “dari kematian”. Ungkapan tersebut tidak dipersempit menjadi sekadar bahaya maut.
theological_decisions:
- issue: Makna “hari kemurkaan”
  choice: Suatu waktu penghakiman atau bencana yang menentukan, tanpa menetapkan kerangka doktrinal yang lebih khusus.
  alternative: Hari bencana manusiawi; atau hari penghakiman ilahi pada akhir zaman.
  rationale: Peribahasa ini memungkinkan latar penghakiman, tetapi tidak menjelaskan lebih lanjut siapa yang murka atau apakah hari itu bersifat eskatologis. Terjemahan mempertahankan keterbukaan tersebut.
- issue: Makna “kebenaran menyelamatkan dari kematian”
  choice: Kebenaran dinyatakan memiliki daya menyelamatkan dari kematian dalam kerangka teologi hikmat.
  alternative: Perilaku lurus menjaga seseorang dari akibat yang mematikan; atau kebenaran dalam hubungan perjanjian mendatangkan pembebasan ilahi.
  rationale: Ayat ini menegaskan nilai kebenaran yang memelihara kehidupan, tetapi tidak boleh dijadikan pernyataan teknis tentang perdebatan soteriologis yang muncul kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Paralelisme antarkedua bagian dipertahankan. Istilah “kemurkaan” dipilih karena sesuai dengan bobot עֶבְרָה, sedangkan “kematian” mempertahankan ungkapan Ibrani secara langsung.
