  text: By the blessing of the upright a city is exalted[b][a], but by the mouth of the wicked it is torn down.
translation:
  language: id
  text: Berkat orang-orang yang lurus hati meninggikan sebuah kota,[a] tetapi oleh perkataan[b] orang-orang fasik kota itu dirobohkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Melalui berkat orang-orang yang lurus hati, sebuah kota bangkit.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “oleh mulut orang-orang fasik”; ungkapan ini menyoroti daya rusak ucapan mereka.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּבִרְכַּת
  choice: Berkat
  rationale: Preposisi בְּ menyatakan sarana. Susunan ini secara alami menyampaikan arti 'melalui berkat' dalam bahasa Indonesia, sambil membiarkan בִרְכָּה mencakup ucapan berkat maupun pengaruh yang mendatangkan kebaikan.
- source_word: יְשָׁרִים
  choice: orang-orang yang lurus hati
  rationale: יָשָׁר menunjuk pada kelurusan watak moral. 'Lurus hati' alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi sekadar kejujuran verbal.
- source_word: תָּרוּם
  choice: membuat ... ditinggikan
  rationale: Bentuk Qal dari רוּם secara harfiah berarti kota itu 'menjadi tinggi/ditinggikan'. Konstruksi kausatif alami dalam bahasa Indonesia tetap menyatakan bahwa berkat orang lurus menjadi sarana peninggian kota.
- source_word: קָרֶת
  choice: sebuah kota
  rationale: קָרֶת berarti kota atau permukiman; 'kota' merupakan padanan baku dan sesuai dengan cakupan sosial peribahasa ini.
- source_word: וּבְפִי
  choice: tetapi perkataan
  rationale: Secara harfiah berarti 'tetapi oleh mulut'. Metonimia 'mulut' menunjuk pada ucapan; 'perkataan' menyampaikan fungsi sarana itu secara alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan gambaran Ibraninya.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: רָשָׁע dalam sastra hikmat menunjuk pada orang yang secara moral jahat. 'Fasik' merupakan istilah Indonesia yang ringkas, bermartabat, dan lazim dalam konteks Alkitab.
- source_word: תֵּהָרֵס
  choice: merobohkannya
  rationale: Nifal dari הרס berarti 'dirobohkan' atau 'diruntuhkan'. Bentuk aktif idiomatis ini membuat perkataan orang fasik menjadi sarana perobohan, sesuai בְּ instrumental, dan akhiran '-nya' jelas merujuk kepada kota.
