  register: Bahasa Indonesia baku, modern, dan bernada hikmat. Paralelisme antitetis dipertahankan. 'Lurus hati' dipilih agar etika יָשָׁר mudah dipahami, sedangkan 'fasik' mempertahankan bobot moral רָשָׁע. Penanda catatan kaki ditempatkan tepat setelah klausa atau kata yang dijelaskan.
