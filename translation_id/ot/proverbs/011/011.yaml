  naturalness: “Berkat orang-orang yang lurus hati meninggikan sebuah kota” dan “oleh perkataan orang-orang fasik kota itu dirobohkan” adalah bahasa Indonesia baku, jelas, dan bernada hikmat. Pengulangan “kota itu” pada klausa kedua membantu kejelasan rujukan dan mempertahankan struktur pasif.
  terminology: “Berkat,” “orang-orang yang lurus hati,” “kota,” dan “orang-orang fasik” layak dipertahankan. “Perkataan” adalah metonimia alami untuk פִּי (“mulut”), dengan gambaran harfiahnya dipelihara dalam catatan kaki.
