  - severity: low
    issue: “Membuat sebuah kota ditinggikan” bersifat berbelit dan kurang dekat dengan predikasi Ibrani.
    rationale: Klausa Ibrani menyatakan bahwa berkat orang lurus adalah sarana bagi peninggian kota. “Berkat ... meninggikan sebuah kota” lebih ringkas dan idiomatis.
