  text: בָּֽא זָ֭דוֹן וַ/יָּבֹ֣א קָל֑וֹן וְֽ/אֶת צְנוּעִ֥ים חָכְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/002.yaml
  text: When arrogance comes[a], disgrace comes also, but with the humble is wisdom.
translation:
  language: id
  text: Ketika keangkuhan datang, datang pula kehinaan[a], tetapi hikmat ada pada orang-orang yang rendah hati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ketika kesombongan datang, datanglah aib.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא
  choice: datang
  rationale: Bentuk perfektif Qal dari בוא dipakai secara umum dalam pepatah; bentuk kini bahasa Indonesia menyampaikan kebenaran yang berlaku umum.
- source_word: זָדוֹן
  choice: keangkuhan
  rationale: Kata ini menunjuk pada kesombongan yang lancang atau merasa diri tinggi; 'keangkuhan' menegaskan sifat buruk tersebut dengan jelas.
- source_word: וַיָּבֹא
  choice: datang pula
  rationale: 'Ungkapan ini mempertahankan kaitan erat dalam paralelisme: kehinaan menyertai datangnya keangkuhan.'
- source_word: קָלוֹן
  choice: kehinaan
  rationale: Kata ini mencakup aib, malu, dan hilangnya kehormatan; 'kehinaan' cocok dengan pasangan kontras keangkuhan dalam pepatah ini.
- source_word: וְאֶת
  choice: tetapi ... pada
  rationale: Dalam konstruksi ini אֶת menyatakan kebersamaan atau hubungan. 'Tetapi ... ada pada' mengungkapkan kontras dan menghasilkan bahasa Indonesia yang alami.
- source_word: צְנוּעִים
  choice: orang-orang yang rendah hati
  rationale: Istilah ini merujuk kepada orang yang bersahaja, tidak menonjolkan diri, dan rendah hati; pilihan ini membentuk kontras etis yang jelas dengan keangkuhan.
- source_word: חָכְמָה
  choice: hikmat
  rationale: Ini adalah istilah baku sastra hikmat untuk kebijaksanaan dalam hidup; klausa nominal diterjemahkan 'hikmat ada pada' agar alami dan tetap ringkas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada pepatah. Struktur paralel serta kontras antara keangkuhan dan kerendahan hati dipertahankan.
