id: PRO.11.27
reference: Proverbs 11:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שֹׁ֣חֵֽר ט֭וֹב יְבַקֵּ֣שׁ רָצ֑וֹן וְ/דֹרֵ֖שׁ רָעָ֣ה תְבוֹאֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/027.yaml
  text: Whoever diligently seeks good seeks favor[c][b][a], but evil comes to the one who searches for it.
translation:
  language: id
  text: Siapa yang bersungguh-sungguh[a] mencari apa yang baik, mencari perkenanan[b], tetapi siapa yang mengejar kejahatan, kejahatan itu akan datang kepadanya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sejak dini”; kata Ibrani ini dapat menyatakan pencarian yang sungguh-sungguh atau yang dimulai sejak awal.
    reason: lexical_alternative
  - marker: b
    text: “Perkenanan” dapat berarti penerimaan atau iktikad baik, baik dari Allah, dari manusia, maupun dari keduanya.
    reason: lexical_alternative
  - marker: c
    text: Atau “kejahatan itu akan menimpanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחֵר
  choice: bersungguh-sungguh mencari
  rationale: Partisipel ini menyatakan pencarian yang tekun, giat, atau dilakukan sejak dini. Ungkapan “bersungguh-sungguh mencari” menyampaikan intensitasnya secara wajar dalam bahasa Indonesia tanpa memberi kesan bahwa waktunya harus pagi-pagi.
- source_word: טוֹב
  choice: apa yang baik
  rationale: Kata sifat ini dipakai sebagai nomina dan menunjuk secara luas pada hal yang baik, baik secara moral maupun praktis.
- source_word: יְבַקֵּשׁ
  choice: mencari
  rationale: Pilihan ini mempertahankan pengulangan tindakan mencari dalam baris pertama dan tidak mengubahnya menjadi hasil yang pasti diperoleh.
- source_word: רָצוֹן
  choice: perkenanan
  rationale: Kata ini dapat berarti perkenanan, penerimaan, atau iktikad baik. “Perkenanan” mempertahankan cakupan luasnya tanpa menentukan apakah sumbernya Allah, manusia, atau keduanya.
- source_word: וְדֹרֵשׁ
  choice: tetapi siapa yang mengejar
  rationale: Walaupun וְ secara bentuk berarti “dan”, paralelisme antitesis mendukung “tetapi”. דֹרֵשׁ menyatakan pencarian atau pengejaran yang disengaja.
- source_word: רָעָה
  choice: kejahatan
  rationale: Kata ini dapat mencakup keburukan moral serta malapetaka yang merugikan. “Kejahatan” mempertahankan dimensi moral pada sesuatu yang dikejar dan akibat buruk yang kembali kepada pengejarnya.
- source_word: תְבוֹאֶנּוּ
  choice: kejahatan itu akan datang kepadanya
  rationale: Bentuk verba berarti “akan datang” atau “datang”, dengan sufiks orang ketiga tunggal maskulin, “kepadanya”. Subjeknya dinyatakan kembali dari רָעָה agar jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan רָצוֹן (“perkenanan”)
  choice: Dibiarkan luas sebagai “perkenanan” tanpa menyebut sumbernya.
  alternative: Perkenanan Allah; perkenanan manusia; penerimaan.
  rationale: Teks Ibrani tidak menyatakan siapa yang memberikan perkenanan. Terjemahan ini mempertahankan keterbukaan tersebut dan tidak mempersempitnya menjadi klaim teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hikmat. Pengulangan “mencari” dipertahankan karena mencerminkan susunan Ibrani; antitesis diperjelas dengan “tetapi”. Istilah “perkenanan” dipilih karena bermartabat dan cukup luas, sedangkan semua alternatif penting dicatat tanpa menyelesaikan ambiguitas sumber.
