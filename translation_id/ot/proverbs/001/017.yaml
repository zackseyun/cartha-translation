  text: כִּֽי חִ֭נָּם מְזֹרָ֣ה הָ/רָ֑שֶׁת בְּ֝/עֵינֵ֗י כָל בַּ֥עַל כָּנָֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/017.yaml
  text: For the net is spread in vain in the sight of any bird[a].
translation:
  language: id
  text: Sebab percuma jaring dibentangkan di depan mata setiap burung[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “setiap pemilik sayap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan yang menjelaskan peringatan pada ayat sebelumnya; “Sebab” menyatakan hubungan tersebut secara alami.
- source_word: חִנָּם
  choice: percuma
  rationale: Dalam gambaran ini, kata tersebut menunjukkan kesia-siaan tindakan memasang jaring ketika burung melihatnya. “Percuma” alami dalam bahasa Indonesia modern.
- source_word: מְזֹרָה
  choice: dibentangkan
  rationale: Bentuk pasif dari זרה di sini menggambarkan jaring yang dibuka atau dihamparkan untuk menangkap burung; “dibentangkan” sesuai dengan objek “jaring”.
- source_word: הָרָשֶׁת
  choice: jaring
  rationale: רֶשֶׁת menunjuk pada jaring yang digunakan sebagai perangkap; “jaring” merupakan padanan yang jelas dan ringkas.
- source_word: בְּעֵינֵי
  choice: di depan mata
  rationale: Ungkapan Ibrani ini secara harfiah berarti “di mata” dan dalam konteks menekankan bahwa pemasangan jaring terlihat oleh burung.
- source_word: כָל
  choice: setiap
  rationale: Kata ini memberi cakupan umum kepada ungkapan tunggal berikutnya; “setiap burung” wajar dan mempertahankan daya generalisasinya.
- source_word: בַּעַל כָּנָף
  choice: burung
  rationale: Secara harfiah berarti “pemilik sayap,” sebuah ungkapan bagi makhluk bersayap. Dalam konteks jaring penangkap, “burung” merupakan padanan alami; bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bernada amsal. Susunan “di depan mata” mempertahankan citra penglihatan dalam teks Ibrani tanpa terasa kaku.
