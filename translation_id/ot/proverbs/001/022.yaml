source:
  edition: WLC
  text: עַד מָתַ֣י פְּתָיִם֮ תְּֽאֵהֲב֫וּ פֶ֥תִי וְ/לֵצִ֗ים לָ֭צוֹן חָמְד֣וּ לָ/הֶ֑ם וּ֝/כְסִילִ֗ים יִשְׂנְאוּ דָֽעַת־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/022.yaml
  text: How long[a], O simple ones[b], will you love simplicity? How long will scoffers delight in scoffing and fools hate knowledge?
translation:
  language: id
  text: Berapa lama lagi, hai orang-orang naif[a], kalian akan mencintai kenaifan? Berapa lama lagi para pencemooh akan menggemari cemoohan, dan orang-orang bebal akan membenci pengetahuan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani untuk “orang-orang naif” dan “kenaifan” berasal dari akar yang sama. Yang dimaksud ialah orang yang mudah diperdaya dan belum terbentuk dalam hikmat.
    reason: lexical_wordplay
lexical_decisions:
- source_word: פְּתָיִם / פֶתִי
  choice: orang-orang naif / kenaifan
  rationale: Pasangan ini mempertahankan permainan kata Ibrani dan menunjuk kepada orang yang mudah diperdaya serta belum terbentuk dalam hikmat, bukan sekadar orang yang kurang cerdas.
- source_word: תְּאֵהֲבוּ
  choice: kalian akan mencintai
  rationale: Bentuk imperfek dalam pertanyaan teguran menyatakan sikap yang terus berlangsung; 'akan mencintai' cocok dengan ungkapan 'berapa lama lagi'.
- source_word: לֵצִים / לָצוֹן
  choice: para pencemooh / cemoohan
  rationale: Kata-kata serumpun dalam bahasa Indonesia mempertahankan hubungan leksikal Ibrani dan menggambarkan orang yang dengan angkuh merendahkan hikmat serta teguran.
- source_word: חָמְדוּ
  choice: akan menyukai
  rationale: Dalam konteks ini verba tersebut menyatakan hasrat atau kesenangan terhadap perilaku mencemooh. 'Menyukai' alami dalam bahasa Indonesia tanpa melemahkan unsur kehendak.
- source_word: לָהֶם
  choice: tidak dinyatakan secara terpisah
  rationale: Pronomina datif ini bersifat idiomatis dan menyiratkan bahwa cemoohan itu mereka ingini bagi diri mereka sendiri; menerjemahkannya secara harfiah akan terasa janggal dan berpotensi memberi penekanan yang tidak dimaksudkan.
- source_word: כְסִילִים
  choice: orang-orang bebal
  rationale: Dalam sastra hikmat, istilah ini merupakan kategori moral dan rohani, bukan penilaian atas kecerdasan semata. 'Bebal' menyampaikan sikap keras kepala terhadap hikmat.
- source_word: יִשְׂנְאוּ
  choice: akan membenci
  rationale: Terjemahan ini mempertahankan kekuatan verba Ibrani yang menyatakan penolakan dan kebencian aktif.
- source_word: דָעַת
  choice: pengetahuan
  rationale: Padanan langsung ini sesuai dengan pemakaian istilah tersebut dalam Amsal untuk pengetahuan yang selaras dengan hikmat.
theological_decisions:
- issue: Kategori moral dalam sastra hikmat
  choice: 'Mempertahankan tiga kategori berbeda: orang-orang naif, para pencemooh, dan orang-orang bebal.'
  alternative: Meratakannya menjadi sebutan psikologis umum seperti orang yang kurang tahu, orang yang suka mengejek, dan orang bodoh.
  rationale: Ketiga istilah itu berfungsi sebagai tipe etis yang berulang dalam Amsal. Pembedaan ini perlu dipertahankan tanpa menganggapnya semata-mata sebagai tingkat kecerdasan.
- issue: Cakupan frasa tanya עַד מָתַי
  choice: Mengulang 'Berapa lama lagi' pada klausa kedua agar cakupannya atas ketiga kelompok jelas dalam bahasa Indonesia.
  alternative: Menyebut 'Berapa lama lagi' hanya sekali dan menghubungkan semua klausa secara harfiah.
  rationale: Bahasa Ibrani hanya menyatakannya sekali, tetapi secara sintaksis pertanyaan itu mencakup ketiga klausa. Pengulangan memperjelas cakupan tanpa mengubah makna.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan 'hai' mempertahankan daya seru bentuk vokatif. 'Kalian' dipakai karena verba Ibrani pada klausa pertama berbentuk orang kedua jamak, sedangkan dua klausa berikutnya berbentuk orang ketiga jamak.
