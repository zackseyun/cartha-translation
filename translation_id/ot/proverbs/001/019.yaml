  text: כֵּ֗ן אָ֭רְחוֹת כָּל בֹּ֣צֵֽעַ בָּ֑צַע אֶת נֶ֖פֶשׁ בְּעָלָ֣י/ו יִקָּֽח־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/019.yaml
  text: Such are the paths of everyone who gains unjust profit[a]; it takes away the life of its possessors.
translation:
  language: id
  text: Demikianlah jalan setiap orang yang memperoleh keuntungan secara tidak jujur[a]; keuntungan itu merenggut nyawa orang yang memilikinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Demikianlah jalan setiap orang yang tamak akan keuntungan; keuntungan itu merenggut nyawa orang yang memilikinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Demikianlah
  rationale: Merangkum dan membandingkan uraian sebelumnya secara alami, sambil mempertahankan daya tunjuk ungkapan Ibrani.
- source_word: אָרְחוֹת
  choice: jalan
  rationale: Mempertahankan metafora konkret tentang jalan atau pola hidup yang lazim dalam sastra hikmat; bentuk tunggal kolektif lebih alami dalam bahasa Indonesia pada konstruksi ini.
- source_word: כָּל
  choice: setiap orang yang
  rationale: Dengan partisipel sesudahnya, ungkapan ini bersifat distributif dan menunjuk kepada semua orang dalam golongan tersebut.
- source_word: בֹּצֵעַ בָּצַע
  choice: memperoleh keuntungan secara tidak jujur
  rationale: Konstruksi partisipel dengan nomina serumpun menekankan pengejaran keuntungan yang tamak dan tercela; konteks perampokan serta penumpahan darah mendukung nuansa keuntungan tidak jujur.
- source_word: נֶפֶשׁ
  choice: nyawa
  rationale: Dalam konteks ini menunjuk kepada kehidupan yang direnggut, bukan secara khusus kepada unsur nonjasmani manusia.
- source_word: בְּעָלָיו
  choice: orang yang memilikinya
  rationale: Akhiran pronominal paling wajar merujuk kepada keuntungan itu; frasa Indonesia ini jelas dan tidak kaku.
- source_word: יִקָּח
  choice: merenggut
  rationale: Menyampaikan tindakan mengambil nyawa dengan daya destruktif yang tersirat dalam konteks, tanpa menambahkan pelaku baru.
theological_decisions:
- issue: Subjek tersirat dari יִקָּח dan acuan akhiran pada בְּעָלָיו
  choice: Keuntungan itu merenggut nyawa orang yang memilikinya
  alternative: Orang yang mengejar keuntungan itu merenggut nyawa para pemiliknya
  rationale: Susunan pepatah paling alami memahami keuntungan tercela sebagai subjek yang akhirnya membinasakan pemiliknya. Pilihan ini juga mempertahankan ironi moral ayat tanpa mengubahnya menjadi pernyataan tentang korban perampokan.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Metafora “jalan” dipertahankan, sedangkan pengulangan eksplisit “keuntungan itu” dipakai untuk memperjelas subjek dalam klausa kedua.
