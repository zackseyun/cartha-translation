  source_fidelity: Terjemahan setia pada teks Ibrani. “Aku pun” menyampaikan גם dengan penegasan tambahan; “menertawakan malapetaka kalian” dan “mengejek ketika ketakutan kalian datang” mempertahankan dua klausa paralel, verba העתיד, serta nada keras dari שׂחק dan לעג. “Ketakutan kalian” bersama verba “datang” membiarkan ambiguitas פַחְדְּכֶם antara rasa takut/kengerian dan perkara yang ditakuti.
