base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/026.yaml
  text: I also will laugh at your calamity[a]; I will mock when your dread comes,
translation:
  language: id
  text: Aku pun akan menertawakan malapetaka kalian; aku akan mengejek ketika ketakutan kalian datang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketika kengerian kalian datang” atau “ketika apa yang kalian takuti datang.” Kata Ibrani ini dapat menunjuk pada rasa takut atau kengerian itu sendiri maupun pada hal atau peristiwa menakutkan yang datang.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Aku pun
  rationale: Partikel גַּם menyatakan tambahan sekaligus penegasan, sedangkan pronomina eksplisit אֲנִי menekankan subjek. Susunan “Aku pun” alami dalam bahasa Indonesia dan mempertahankan daya balasan dalam konteks.
- source_word: בְּאֵידְכֶם
  choice: malapetaka kalian
  rationale: אֵיד menunjuk pada bencana, kehancuran, atau malapetaka. “Malapetaka” mempertahankan bobot ancamannya, dan dengan verba “menertawakan” preposisi Ibrani בְּ dapat disampaikan secara idiomatis tanpa kata depan tersendiri.
- source_word: אֶשְׂחָק
  choice: akan menertawakan
  rationale: Bentuk Qal dari שׂחק berarti tertawa. Dalam konstruksi ini, “menertawakan” secara alami menyatakan bahwa malapetaka mereka menjadi sasaran tawa, tanpa menambah intensitas yang tidak ada dalam sumber.
- source_word: אֶלְעַג
  choice: akan mengejek
  rationale: לעג berarti mengejek, mencemooh, atau memperolok. “Mengejek” jelas bagi pembaca modern dan mempertahankan kesejajaran dengan “menertawakan”.
- source_word: בְּבֹא
  choice: ketika ... datang
  rationale: Infinitif konstruktus בוא dengan prefiks בְּ berfungsi temporal. “Ketika ... datang” merupakan padanan Indonesia yang langsung dan alami.
- source_word: פַחְדְּכֶם
  choice: ketakutan kalian
  rationale: פחד dapat menunjuk baik pada rasa takut atau kengerian maupun pada sesuatu yang ditakuti. “Ketakutan kalian” mempertahankan kemungkinan makna psikologis, sementara verba “datang” membiarkan kemungkinan bahwa yang dimaksud ialah peristiwa yang ditakuti; catatan kaki menjelaskan ambiguitasnya.
theological_decisions:
- issue: Nada tanggapan Hikmat yang dipersonifikasikan terhadap orang yang menolak didikan
  choice: Mempertahankan verba kuat “menertawakan” dan “mengejek” secara langsung
  alternative: Melunakkannya menjadi “tersenyum” atau mengubahnya menjadi “bersukacita atas”
  rationale: Teks Ibrani memakai verba tawa dan ejekan dalam konteks penghakiman menurut sastra hikmat. Pelunakan akan mengurangi kerasnya peringatan, sedangkan “bersukacita” akan menambahkan gagasan yang tidak dinyatakan. Ketegangan teologis dalam ucapan Hikmat dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Sapaan jamak “kalian” mempertahankan akhiran orang kedua jamak dalam bahasa Ibrani. Huruf kecil pada “aku” sesuai karena penuturnya adalah Hikmat yang dipersonifikasikan, bukan penyebutan langsung nama atau gelar ilahi.
