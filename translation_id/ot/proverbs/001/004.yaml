id: PRO.1.4
reference: Proverbs 1:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לָ/תֵ֣ת לִ/פְתָאיִ֣ם עָרְמָ֑ה לְ֝/נַ֗עַר דַּ֣עַת וּ/מְזִמָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/004.yaml
  text: to give prudence to the simple[a], knowledge and discretion to the young man.
translation:
  language: id
  text: untuk memberikan kecerdikan kepada orang yang tak berpengalaman, pengetahuan dan pertimbangan matang kepada seorang pemuda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang muda”. Kata Ibrani yang dipakai berbentuk maskulin tunggal (“pemuda”), tetapi dalam pengajaran hikmat dapat berfungsi secara representatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָתֵת
  choice: untuk memberikan
  rationale: Infinitif konstruk נתן dengan prefiks ל melanjutkan pernyataan tujuan dari ayat sebelumnya; bentuk ini alami dalam bahasa Indonesia dan mempertahankan hubungan sintaksis tersebut.
- source_word: לִפְתָאיִם
  choice: kepada orang yang tak berpengalaman
  rationale: פְּתָאִים menunjuk pada orang polos, belum berpengalaman, dan mudah dipengaruhi, bukan orang yang kurang cerdas. Ungkapan ini menyampaikan maknanya dengan jelas tanpa nada merendahkan yang dapat muncul dari kata 'orang bodoh'.
- source_word: עָרְמָה
  choice: kecerdikan
  rationale: Dalam konteks positif Amsal, עָרְמָה berarti kecakapan praktis untuk bertindak dengan hati-hati dan tidak mudah diperdaya. 'Kecerdikan' mempertahankan daya semantis kata itu, termasuk nuansa ketajaman berpikir, tanpa menjadikannya kelicikan.
- source_word: לְנַעַר
  choice: kepada seorang pemuda
  rationale: נַעַר berbentuk maskulin tunggal dan di sini secara wajar berarti pemuda. Pilihan ini mempertahankan bentuk sumber, sementara kemungkinan fungsi representatifnya dijelaskan dalam catatan kaki.
- source_word: דַּעַת
  choice: pengetahuan
  rationale: דַּעַת secara langsung berarti pengetahuan dalam kosakata sastra hikmat dan mempertahankan kaitannya dengan tema pendidikan pada bagian ini.
- source_word: וּמְזִמָּה
  choice: dan pertimbangan matang
  rationale: מְזִמָּה dapat berarti rencana, kebijaksanaan dalam menimbang, atau kemampuan mengambil keputusan. Dalam konteks positif ini, 'pertimbangan matang' lebih alami dan lebih jelas daripada 'diskresi' dalam bahasa Indonesia umum.
theological_decisions:
- issue: Bentuk maskulin tunggal dalam pengajaran hikmat
  choice: seorang pemuda
  alternative: orang muda
  rationale: Teks Ibrani memakai נַעַר dalam bentuk maskulin tunggal. Teks utama mempertahankan bentuk itu tanpa mengharuskan kesimpulan bahwa sasaran pengajaran hanya laki-laki; kemungkinan pemakaiannya secara representatif dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Orang yang tak berpengalaman' dipilih untuk menghindari kesan bahwa פְּתָאִים menunjuk pada keterbatasan intelektual. Penanda catatan kaki ditempatkan sesudah 'pemuda', yaitu unsur yang diterangkan oleh catatan tersebut.
