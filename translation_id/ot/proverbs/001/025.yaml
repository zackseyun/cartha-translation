lexical_decisions:
- source_word: וַתִּפְרְעוּ
  choice: kalian mengabaikan
  rationale: Dalam konteks ini, פרע menyatakan tindakan membiarkan atau mengesampingkan sesuatu sehingga tidak dihiraukan. “Mengabaikan” menyampaikan pengabaian yang disengaja tanpa memberi kesan tindakan keras.
- source_word: כָל
  choice: segala
  rationale: כָל mencakup seluruh nasihat yang diberikan. “Segala” terdengar alami di depan kata benda tunggal kolektif “nasihat”.
- source_word: עֲצָתִי
  choice: nasihatku
  rationale: עֵצָה di sini berarti nasihat atau bimbingan bijaksana. “Nasihatku” jelas, alami, dan sesuai dengan konteks sastra hikmat.
- source_word: וְתוֹכַחְתִּי
  choice: teguranku
  rationale: תּוֹכַחַת menunjuk pada teguran yang dimaksudkan untuk mengoreksi. “Teguranku” mempertahankan unsur korektif dan lebih wajar dalam bahasa Indonesia modern daripada istilah yang terlalu teknis.
- source_word: לֹא אֲבִיתֶם
  choice: tidak mau menerima
  rationale: אָבָה dengan penyangkalan menekankan ketidakmauan atau penolakan batin. “Tidak mau menerima” mengungkapkan unsur kehendak itu sekaligus membuat hubungan dengan “teguranku” jelas dan alami.
