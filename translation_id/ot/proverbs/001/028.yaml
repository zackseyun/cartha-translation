  yaml_path: translation/ot/proverbs/001/028.yaml
  text: Then they will call on me[a], but I will not answer; they will seek me diligently, but they will not find me.
translation:
  language: id
  text: Pada waktu itu mereka akan berseru kepadaku, tetapi aku tidak akan menjawab; mereka akan mencari aku dengan sungguh-sungguh,[a] tetapi tidak akan menemukan aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mencari aku sejak dini” atau “mencari aku dengan tekun.” Kata kerja Ibrani ini dapat menyiratkan pencarian pada dini hari atau pencarian yang penuh kesungguhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Pada waktu itu
  rationale: Menandai saat terjadinya akibat dari penolakan yang dijelaskan sebelumnya; ungkapan ini alami dan mempertahankan urutan temporal.
- source_word: יִקְרָאֻנְנִי
  choice: mereka akan berseru kepadaku
  rationale: Kata קרא di sini menunjuk pada seruan yang mengharapkan tanggapan atau pertolongan; 'berseru kepadaku' menyampaikan desakan konteks dengan wajar.
- source_word: וְלֹא אֶעֱנֶה
  choice: tetapi aku tidak akan menjawab
  rationale: Walaupun ו secara formal berarti 'dan', hubungan antarklausa bersifat kontras; 'tetapi' mengungkapkannya secara alami dalam bahasa Indonesia.
- source_word: יְשַׁחֲרֻנְנִי
  choice: mereka akan mencari aku dengan sungguh-sungguh
  rationale: Bentuk Piel dari שׁחר dapat menyiratkan pencarian sejak dini, tekun, atau penuh kesungguhan. Dalam konteks ini, intensitas pencarian paling jelas diungkapkan dengan 'dengan sungguh-sungguh', sambil mempertahankan alternatif leksikal dalam catatan kaki.
- source_word: וְלֹא יִמְצָאֻנְנִי
  choice: tetapi tidak akan menemukan aku
  rationale: מצא berarti 'menemukan'; 'tetapi' menyatakan kontras dengan tindakan mencari, sedangkan subjek yang sama tetap jelas tanpa harus diulang.
theological_decisions:
- issue: Identitas penutur dalam konteks
  choice: Mempertahankan ujaran orang pertama dari Hikmat sebagai tokoh yang dipersonifikasikan dalam Amsal.
  alternative: Memahami penutur secara tipologis sebagai Hikmat ilahi yang menunjuk melampaui tokoh sastra langsung.
  rationale: Ayat ini berada dalam perkataan Hikmat di Amsal 1. Terjemahan mempertahankan suara sastra teks Ibrani tanpa menetapkan identifikasi kristologis atau penafsiran teologis lain dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel Ibrani dipertahankan secara alami; huruf kecil pada 'aku' mengikuti penutur langsung dalam konteks sastra tanpa memaksakan identifikasi teologis tertentu.
