  yaml_path: translation/ot/proverbs/001/024.yaml
  text: Because I called and you refused[a], I stretched out my hand and no one paid attention,
translation:
  language: id
  text: Karena aku memanggil dan kalian menolak, aku mengulurkan tanganku, tetapi tidak seorang pun memperhatikan,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן
  choice: Karena
  rationale: Mempertahankan fungsi kausal yang menjadi dasar bagi perkataan penghukuman berikutnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: קָרָאתִי
  choice: aku telah berseru
  rationale: Bentuk ini menyampaikan tindakan Hikmat yang memanggil dengan suara lantang dalam konteks seruan di tempat umum; 'berseru' lebih tepat daripada sekadar 'memanggil'.
- source_word: וַתְּמָאֵנוּ
  choice: tetapi kalian menolak
  rationale: Kata kerja מאן berarti menolak atau tidak bersedia. 'Tetapi' mengungkapkan pertentangan yang tersirat oleh konteks, sedangkan 'kalian' memperjelas bentuk orang kedua jamak Ibrani.
- source_word: נָטִיתִי
  choice: aku telah mengulurkan
  rationale: Mempertahankan gambaran konkret tindakan menjulurkan atau mengulurkan sesuatu sebagai isyarat ajakan atau peringatan.
- source_word: יָדִי
  choice: tanganku
  rationale: Terjemahan langsung yang mempertahankan gambaran jasmaniah dalam teks sumber.
- source_word: וְאֵין מַקְשִׁיב
  choice: tetapi tidak seorang pun memperhatikan
  rationale: קשב dalam bentuk Hifil menyatakan mendengarkan dengan penuh perhatian. 'Memperhatikan' alami dan tidak menambahkan nuansa ketaatan yang lebih kuat daripada makna leksikalnya.
