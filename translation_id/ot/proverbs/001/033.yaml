  text: וְ/שֹׁמֵ֣עַֽ לִ֭/י יִשְׁכָּן בֶּ֑טַח וְ֝/שַׁאֲנַ֗ן מִ/פַּ֥חַד רָעָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/033.yaml
  text: But whoever listens to me will dwell securely and be at ease[a], without fear of disaster.
translation:
  language: id
  text: Namun, siapa yang mendengarkan aku akan tinggal dengan aman dan hidup tenteram, tanpa takut akan malapetaka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Namun, orang yang mendengarkan aku akan berdiam dengan aman dan hidup tenang, tanpa rasa gentar terhadap bencana.”'
    reason: Alternatif ini mempertahankan secara lebih harfiah nuansa שׁכן sebagai “berdiam”, שׁאנ sebagai keadaan tenang, dan פחד sebagai rasa gentar terhadap bencana.
lexical_decisions:
- source_word: וְשֹׁמֵעַ
  choice: Namun, siapa yang mendengarkan
  rationale: Partisipel שׁמע menyatakan sikap mendengar yang disertai perhatian dan ketaatan, bukan sekadar menangkap bunyi. Konjungsi וְ dipahami secara adversatif karena ayat ini berlawanan dengan nasib orang yang menolak hikmat pada konteks sebelumnya.
- source_word: לִי
  choice: aku
  rationale: Preposisi ל dengan sufiks orang pertama secara alami diterjemahkan sebagai objek sesudah 'mendengarkan'. Huruf kecil dipertahankan karena pembicaranya adalah Hikmat yang dipersonifikasikan, tanpa menambahkan penafsiran ke dalam teks.
- source_word: יִשְׁכָּן
  choice: akan tinggal
  rationale: Kata שׁכן mengandung arti menetap atau berdiam; 'tinggal' alami dalam bahasa Indonesia dan mempertahankan nuansa kediaman.
- source_word: בֶּטַח
  choice: dengan aman
  rationale: בטח menunjukkan keadaan aman dan terlindung. Ungkapan 'tinggal dengan aman' jelas dan idiomatis dalam bahasa Indonesia modern.
- source_word: וְשַׁאֲנַן
  choice: dan hidup tenteram
  rationale: Bentuk dari שׁאנ menggambarkan ketenangan tanpa gangguan. 'Hidup tenteram' mengungkapkan keadaan positif tersebut tanpa nuansa negatif seperti sikap lengah atau berpuas diri.
- source_word: מִפַּחַד
  choice: tanpa takut akan
  rationale: מן bersama פחד dapat menyatakan keterpisahan atau kebebasan dari rasa gentar. 'Tanpa takut akan' menyampaikannya secara wajar dalam bahasa Indonesia.
- source_word: רָעָה
  choice: malapetaka
  rationale: Dalam konteks ini רעה menunjuk pada bencana atau kemalangan yang mengancam, bukan terutama kejahatan moral. 'Malapetaka' mempertahankan bobot ancamannya.
theological_decisions:
- issue: Cakupan gender pada subjek partisipial
  choice: siapa yang mendengarkan
  alternative: orang yang mendengarkan; siapa pun yang mendengarkan
  rationale: Walaupun partisipel Ibrani berbentuk maskulin tunggal, fungsinya generik dalam pengajaran hikmat. Bentuk ini tidak membatasi janji kepada laki-laki.
- issue: Hikmat yang dipersonifikasikan sebagai pembicara
  choice: Mempertahankan ujaran orang pertama 'aku' tanpa penjelasan tambahan
  alternative: mendengarkan Hikmat; mendengarkan aku, yaitu Hikmat
  rationale: Ayat ini melanjutkan perkataan langsung Hikmat dalam konteksnya. Menjaga kata ganti orang pertama menghindari perluasan interpretatif yang tidak terdapat dalam teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat alami bagi pembaca umum sambil mempertahankan paralelisme janji keamanan dan ketenteraman. Penanda catatan kaki [a] dicantumkan dalam teks utama.
