id: PRO.1.12
reference: Proverbs 1:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: נִ֭בְלָעֵ/ם כִּ/שְׁא֣וֹל חַיִּ֑ים וּ֝/תְמִימִ֗ים כְּ/י֣וֹרְדֵי בֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/012.yaml
  text: Let us swallow them alive like Sheol[a], and whole like those who go down to the pit[b];
translation:
  language: id
  text: Mari kita telan mereka hidup-hidup seperti Syeol[a], bulat-bulat seperti orang-orang yang turun ke liang kubur[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seperti dunia orang mati.” Syeol adalah sebutan bagi alam orang mati dalam pemikiran Ibrani.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “liang”; dalam puisi Ibrani, kata ini dapat merujuk pada kubur atau alam kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלָעֵם
  choice: Mari kita telan mereka
  rationale: Bentuk kohortatif orang pertama jamak dengan akhiran orang ketiga jamak menyatakan ajakan di antara para penutur. Pilihan ini mempertahankan metafora pemangsaan secara lugas dan alami.
- source_word: כִּשְׁאוֹל
  choice: seperti Syeol
  rationale: Nama Syeol dipertahankan agar gambaran Ibrani tentang dunia orang mati tidak dipersempit menjadi sekadar kubur atau kematian.
- source_word: חַיִּים
  choice: hidup-hidup
  rationale: Kata ini menerangkan keadaan para korban ketika ditelan. Bentuk idiomatis Indonesia 'hidup-hidup' menyampaikan makna tersebut dengan jelas.
- source_word: וּתְמִימִים
  choice: bulat-bulat
  rationale: Dalam konteks metafora menelan, תמים menunjuk pada keadaan utuh, bukan penilaian moral. 'Bulat-bulat' secara alami menggambarkan ditelan dalam keadaan utuh.
- source_word: כְּיֹרְדֵי בוֹר
  choice: seperti orang-orang yang turun ke liang kubur
  rationale: Frasa partisipial ini menggambarkan orang yang turun menuju alam kematian. 'Liang kubur' mempertahankan citra konkret בור sekaligus asosiasinya dengan kematian.
theological_decisions:
- issue: Penerjemahan שְׁאוֹל
  choice: Syeol
  alternative: kubur; dunia orang mati; kematian
  rationale: Mempertahankan 'Syeol' menjaga kekhasan konsep dan gambaran Ibrani tanpa menetapkannya secara terlalu sempit sebagai kubur fisik atau kematian semata.
- issue: Makna תְמִימִים dalam konteks
  choice: bulat-bulat
  alternative: utuh; tanpa cela; tidak terluka
  rationale: Konteksnya adalah gambaran penyergapan dan penelanan, bukan evaluasi moral. Pilihan ini mempertahankan arti keutuhan fisik dan menghindari kesan bahwa klausa ini terutama menegaskan ketidakbersalahan korban.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Pengulangan idiomatis 'hidup-hidup' dan 'bulat-bulat' mempertahankan daya gambar ayat serta kesejajaran puisinya. Tanda baca titik koma mengikuti kesinambungan ujaran dalam konteks.
