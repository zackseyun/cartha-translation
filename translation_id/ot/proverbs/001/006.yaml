  text: to understand a proverb and a saying[b][a], the words of the wise and their riddles.
translation:
  language: id
  text: untuk memahami amsal dan ungkapan[a], perkataan orang-orang bijak dan teka-teki mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tafsiran”. Istilah Ibrani ini dapat menunjuk pada ungkapan yang tajam atau indah dan, dalam konteks tertentu, pada ungkapan yang bersifat menafsirkan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “perkataan mereka yang penuh teka-teki”. Kata Ibrani ini dapat berarti teka-teki atau perkataan tersamar yang perlu direnungkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִין
  choice: untuk memahami
  rationale: Infinitif dengan לְ menyatakan tujuan dan melanjutkan rangkaian tujuan dari ayat-ayat sebelumnya. Pilihan ini mempertahankan makna kognitif בין secara alami.
- source_word: מָשָׁל
  choice: amsal
  rationale: Dalam kitab Amsal, kata ini lazim menunjuk pada amsal atau perkataan hikmat; “amsal” sesuai dengan genre dan konteks langsung.
- source_word: מְלִיצָה
  choice: ungkapan
  rationale: Istilah langka ini dapat menunjuk pada ungkapan yang tajam, indah, atau penuh arti. “Ungkapan” cukup luas dan alami serta tidak memaksakan arti teknis “tafsiran”.
- source_word: דִּבְרֵי
  choice: perkataan
  rationale: Bentuk jamak konstruksi dari דָּבָר. “Perkataan” menyampaikan maknanya secara langsung dan cocok dengan konteks sastra hikmat.
- source_word: חֲכָמִים
  choice: orang-orang bijak
  rationale: Kata sifat yang dipakai sebagai nomina ini menunjuk pada para pribadi yang bijak tanpa membatasi jenis kelamin mereka.
- source_word: חִידֹתָם
  choice: teka-teki mereka
  rationale: חִידָה dapat berarti teka-teki atau perkataan penuh rahasia yang menuntut perenungan. Pilihan ini ringkas, konkret, dan mempertahankan sufiks orang ketiga jamak.
