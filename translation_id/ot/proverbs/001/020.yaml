  source_fidelity: Teks Indonesia dengan setia mempertahankan Hikmat sebagai personifikasi feminin tunggal, dua ranah publik yang paralel, seruan yang nyaring, dan tindakan membuat suaranya terdengar. “Di jalan” untuk בַּחוּץ dan “di lapangan kota” untuk בָּרְחֹבוֹת membedakan ruang jalan/luar dari ruang terbuka yang luas tanpa memaksakan perbedaan yang lebih tajam daripada teks Ibrani.
