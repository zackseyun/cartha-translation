  text: חָ֭כְמוֹת בַּ/ח֣וּץ תָּרֹ֑נָּה בָּ֝/רְחֹב֗וֹת תִּתֵּ֥ן קוֹלָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/020.yaml
  text: Wisdom cries aloud in the street[a]; in the squares she raises her voice.
translation:
  language: id
  text: Hikmat berseru nyaring di jalan[a]; di lapangan kota ia memperdengarkan suaranya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di tempat terbuka”.
    reason: Alternatif leksikal bagi בַּחוּץ yang menekankan ruang publik di luar rumah, bukan jalan tertentu.
lexical_decisions:
- source_word: חָכְמוֹת
  choice: Hikmat
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, kata ini berfungsi sebagai abstraksi yang dipersonifikasikan sebagai tunggal, sebagaimana ditunjukkan oleh bentuk-bentuk verbal feminin tunggal yang mengikutinya. Huruf kapital dan kata ganti “ia” mempertahankan personifikasi tersebut.
- source_word: בַּחוּץ
  choice: di jalan
  rationale: Kata ini menunjuk ruang luar atau ruang publik, berlawanan dengan bagian dalam rumah. “Di jalan” alami dalam bahasa Indonesia dan cocok dengan kesejajaran lokasi publik pada baris berikutnya.
- source_word: תָּרֹנָּה
  choice: berseru nyaring
  rationale: Akar רנן dapat berarti mengeluarkan seruan yang terdengar jelas, bersorak, atau bernyanyi, bergantung pada konteks. Di sini konteks panggilan Hikmat di ruang publik mendukung “berseru nyaring”, tanpa memberi nuansa perayaan yang tidak pasti.
- source_word: בָּרְחֹבוֹת
  choice: di lapangan kota
  rationale: Bentuk ini merujuk pada tempat-tempat luas atau plaza di dalam permukiman. “Lapangan kota” menyampaikan ruang publik yang lapang secara wajar dalam bahasa Indonesia.
- source_word: תִּתֵּן קוֹלָהּ
  choice: ia memperdengarkan suaranya
  rationale: Secara harfiah ungkapan ini berarti “ia memberikan suaranya”. “Memperdengarkan suaranya” mempertahankan gagasan membuat suara terdengar sambil menghindari ungkapan harfiah yang kaku dalam bahasa Indonesia.
theological_decisions:
- issue: Personifikasi Hikmat
  choice: Mempertahankan Hikmat sebagai tokoh tunggal yang dipersonifikasikan.
  alternative: Menerjemahkannya semata-mata sebagai sifat abstrak tanpa menonjolkan personifikasi.
  rationale: Bentuk verbal feminin tunggal dan akhiran pronominal dalam bahasa Ibrani menampilkan Hikmat sebagai tokoh sastra yang berseru di depan umum. Terjemahan tidak mengidentifikasikannya dengan tokoh teologis lain di luar yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang tetap mudah dipahami. Kesejajaran dua lokasi publik dipertahankan; personifikasi ditandai melalui “Hikmat” dan kata ganti “ia” tanpa menambahkan identifikasi doktrinal.
