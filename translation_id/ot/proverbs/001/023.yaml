  text: תָּשׁ֗וּבוּ לְֽ/ת֫וֹכַחְתִּ֥/י הִנֵּ֤ה אַבִּ֣יעָה לָ/כֶ֣ם רוּחִ֑/י אוֹדִ֖יעָה דְבָרַ֣/י אֶתְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/023.yaml
  text: Turn at my rebuke[a]; behold, I will pour out my spirit to you[b]; I will make my words known to you.
translation:
  language: id
  text: Berbaliklah menanggapi teguranku[a]. Lihatlah, aku akan mencurahkan rohku kepada kalian[b]; aku akan menyatakan perkataanku kepada kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kembalilah kepada teguranku” atau “Bertobatlah ketika aku menegur kalian.”
    reason: lexical_alternative
  - marker: b
    text: “Rohku” juga dapat dipahami sebagai “batinku” atau “isi pikiranku”. Sebagian pembaca melihat gema yang lebih luas tentang Roh Allah, tetapi dalam konteks ayat ini Hikmat yang dipersonifikasikan sedang berbicara.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּשׁוּבוּ
  choice: Berbaliklah
  rationale: Bentuk dari שׁוב menyampaikan seruan untuk mengubah arah sebagai tanggapan terhadap koreksi. “Berbaliklah” mempertahankan metafora gerak dan daya moralnya tanpa langsung memberi muatan teologis yang lebih khusus seperti “bertobatlah”.
- source_word: לְתוֹכַחְתִּי
  choice: ketika aku menegur kalian
  rationale: תּוֹכַחַת berarti teguran, celaan, atau koreksi. Preposisi ל dalam konstruksi ini menyatakan tanggapan terhadap teguran; bentuk klausal ini terdengar alami dalam bahasa Indonesia dan tidak memaksakan hubungan semantis yang terlalu sempit.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Partikel ini menarik perhatian kepada janji yang menyusul. “Lihatlah” mempertahankan fungsi penegasnya dengan ragam yang wajar dan bermartabat.
- source_word: אַבִּיעָה
  choice: aku akan mencurahkan
  rationale: Kata kerja נבע menggambarkan sesuatu yang memancar, meluap, atau mengalir keluar. “Mencurahkan” mempertahankan citra keluarnya sesuatu secara berlimpah dan cocok dengan objek “rohku”.
- source_word: רוּחִי
  choice: rohku
  rationale: רוּחַ dapat berarti roh, napas, angin, atau batin/disposisi. “Rohku” mempertahankan keluasan makna istilah sumber; huruf kecil tidak menyamakan ungkapan ini secara langsung dengan Roh Allah, sebab dalam konteks langsung Hikmat yang dipersonifikasikan sedang berbicara.
- source_word: אוֹדִיעָה
  choice: aku akan memberitahukan
  rationale: Bentuk kausatif dari ידע berarti membuat seseorang tahu atau memberitahukan. Pilihan ini langsung, jelas, dan alami dalam bahasa Indonesia.
- source_word: דְבָרַי
  choice: perkataanku
  rationale: דָּבָר dapat berarti kata, perkataan, perkara, atau pesan. “Perkataanku” mempertahankan sifat verbal dan pengajaran dari ujaran Hikmat.
- source_word: לָכֶם ... אֶתְכֶם
  choice: kepada kalian ... kepada kalian
  rationale: Kedua bentuk pronominal menunjuk kepada orang kedua jamak. “Kalian” menyatakan kejamakan yang tampak dalam bahasa Ibrani dan mempertahankan sapaan langsung.
theological_decisions:
- issue: Makna “rohku” dalam perkataan Hikmat
  choice: “rohku” dengan huruf kecil, merujuk pada roh, batin, atau disposisi Hikmat yang dipersonifikasikan
  alternative: Dipahami sebagai bayangan atau gema kanonis tentang Roh Allah/Roh Kudus
  rationale: Pembicara dalam konteks langsung adalah Hikmat yang dipersonifikasikan, dan teks Ibrani tidak secara eksplisit mengidentifikasi רוּחִי sebagai Roh Allah. Terjemahan dengan huruf kecil mempertahankan makna sastra langsung serta membuka kemungkinan gema teologis yang lebih luas tanpa menetapkannya sebagai satu-satunya tafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada sastra hikmat yang bermartabat. Sapaan “kalian” dipakai untuk mempertahankan bentuk jamak Ibrani. Susunan kalimat dibuat alami tanpa menghilangkan citra pencurahan, seruan untuk berbalik, atau ambiguitas רוּחִי.
