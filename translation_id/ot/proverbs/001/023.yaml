  - severity: low
    issue: “Aku akan memberitahukan perkataanku kepada kalian” kurang idiomatis.
    rationale: Dalam bahasa Indonesia, seseorang lazim ‘memberitahukan sesuatu’ atau ‘memberi tahu’ seseorang, tetapi ‘menyatakan perkataan’ lebih alami serta cocok dengan makna ‘membuat kata-kataku diketahui’.
