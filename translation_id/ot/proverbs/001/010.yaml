  yaml_path: translation/ot/proverbs/001/010.yaml
  text: My son[a], if sinners entice you[b], do not consent.
translation:
  language: id
  text: Anakku,[a] jika orang-orang berdosa membujukmu, jangan setuju.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini berbentuk maskulin tunggal dan berarti “anakku” atau “putraku”; sapaannya bernada nasihat kebapakan.
    reason: cultural_note
  - marker: b
    text: Atau “jangan menyerah” atau “jangan bersedia.” Kata kerja Ibrani berarti bersedia atau menyetujui.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Anakku
  rationale: Sapaan tunggal maskulin dari seorang ayah atau guru hikmat kepada anak laki-laki; bentuk ini alami dalam bahasa Indonesia dan mempertahankan nuansa akrab serta kebapakan.
- source_word: אִם
  choice: jika
  rationale: Partikel syarat yang memperkenalkan kemungkinan atau situasi hipotetis.
- source_word: יְפַתּוּךָ
  choice: membujukmu
  rationale: Bentuk piel dari פתה menunjuk pada bujukan atau rayuan agar seseorang mengikuti suatu tindakan; 'membujuk' menyampaikan daya manipulatifnya tanpa memberi kesan seksual yang tidak diperlukan.
- source_word: חַטָּאִים
  choice: orang-orang berdosa
  rationale: Nomina substantival jamak yang menunjuk kepada orang-orang yang dicirikan oleh dosa; ungkapan ini langsung dan wajar dalam bahasa Indonesia.
- source_word: אַל
  choice: jangan
  rationale: Partikel larangan yang secara alami diterjemahkan 'jangan' dalam bahasa Indonesia.
- source_word: תֹּבֵא
  choice: setuju
  rationale: Dari אבה, 'bersedia, menyetujui'; dalam konteks ini larangan diarahkan pada persetujuan atau kesediaan mengikuti bujukan mereka.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. 'Anakku' mempertahankan sapaan kebapakan, sedangkan 'jangan setuju' menyatakan larangan terhadap persetujuan batin maupun kesediaan mengikuti ajakan.
