lexical_decisions:
- source_word: לָדַעַת
  choice: untuk mengetahui
  rationale: Prefiks ל pada bentuk infinitif menyatakan tujuan dalam rangkaian pembukaan ini. “Untuk mengetahui” mempertahankan bentuk dan fungsi tersebut secara alami dalam bahasa Indonesia.
- source_word: חָכְמָה
  choice: hikmat
  rationale: “Hikmat” merupakan padanan baku yang mencakup kecakapan hidup serta pengertian moral, bukan sekadar kecerdasan.
- source_word: מוּסָר
  choice: didikan
  rationale: “Didikan” mencakup pengajaran yang membentuk perilaku dan tetap membuka nuansa disiplin atau koreksi yang terdapat dalam kata Ibrani.
- source_word: לְהָבִין
  choice: untuk memahami
  rationale: Bentuk infinitif kedua ini sejajar dengan לָדַעַת dan kembali menyatakan tujuan. “Memahami” adalah padanan modern yang wajar.
- source_word: אִמְרֵי
  choice: perkataan
  rationale: Bentuk jamak konstruksi ini menunjuk pada ungkapan atau tuturan. Dalam bahasa Indonesia, nomina kolektif “perkataan” menyampaikan makna jamak secara alami tanpa harus memakai bentuk ulang.
- source_word: בִינָה
  choice: penuh pengertian
  rationale: Konstruksi “perkataan yang penuh pengertian” menyampaikan bahwa perkataan tersebut mengandung wawasan atau daya membedakan, sekaligus menghindari pengulangan kaku “memahami ... pengertian”.
