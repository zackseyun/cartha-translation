base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/011.yaml
  text: If they say[a], “Come with us, let us lie in wait for blood[b]; let us ambush the innocent without cause,”
translation:
  language: id
  text: Jika mereka berkata, “Mari ikut kami! Mari kita mengadang untuk menumpahkan darah; mari kita bersembunyi[a] untuk menghadang orang yang tidak bersalah tanpa alasan,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mari kita menyembunyikan diri.” Dalam konteks ini, maksudnya ialah bersembunyi untuk menghadang atau menyergap.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֹאמְרוּ
  choice: Jika mereka berkata
  rationale: Mempertahankan bentuk pengandaian langsung dalam nasihat sang ayah; kala kini alami dalam bahasa Indonesia untuk skenario umum.
- source_word: לְכָה אִתָּנוּ
  choice: Mari ikut kami!
  rationale: Mengungkapkan ajakan untuk bergabung secara alami dan jelas, tanpa menghilangkan unsur 'bersama kami'.
- source_word: נֶאֶרְבָה לְדָם
  choice: Mari kita mengadang untuk menumpahkan darah
  rationale: Menggabungkan gagasan bersembunyi menunggu sasaran dengan maksud kekerasan mematikan; 'menumpahkan darah' menjelaskan ungkapan Ibrani ringkas 'untuk darah'.
- source_word: נִצְפְּנָה
  choice: mari kita mengintai
  rationale: Dalam konteks serangan tersembunyi dan sejajar dengan נֶאֶרְבָה, kata ini menyatakan tindakan bersembunyi sambil menunggu korban, bukan sekadar menyembunyikan diri.
- source_word: לְנָקִי
  choice: orang yang tidak bersalah
  rationale: Adjektiva substantival ini menunjuk kepada korban yang tidak bersalah; bentuk ini lebih alami daripada 'yang tidak bersalah' sebagai nomina mandiri.
- source_word: חִנָּם
  choice: tanpa alasan
  rationale: Menyatakan tidak adanya sebab atau pembenaran bagi serangan itu, sekaligus mempertahankan kecaman moral teks.
theological_decisions:
- issue: Karakter moral korban dalam pengajaran hikmat
  choice: orang yang tidak bersalah
  alternative: orang yang tak bercela
  rationale: Teks mengecam kekerasan yang tidak adil dengan menyatakan bahwa sasarannya tidak bersalah. Pilihan ini tidak memperluasnya menjadi klaim mengenai kesempurnaan moral korban.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Seruan 'Mari ikut kami!' menangkap ajakan kelompok secara idiomatis. Ungkapan 'menumpahkan darah' mempertahankan citra darah sekaligus memperjelas maksud kekerasan mematikan. Penanda catatan kaki [a] dicantumkan pada frasa yang memiliki alternatif leksikal.
