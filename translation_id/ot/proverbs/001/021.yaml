  yaml_path: translation/ot/proverbs/001/021.yaml
  text: 'At the head of the noisy streets she cries out[c][b][a]; at the entrances of the gates in the city she speaks her words:'
translation:
  language: id
  text: 'Di tempat terdepan di tengah keramaian ia berseru[a]; di pintu-pintu gerbang kota[b] ia menyampaikan perkataannya[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Di bagian paling atas tempat-tempat yang riuh ia berseru.” Ungkapan Ibrani dapat menunjuk pada lokasi yang paling terkemuka atau pada bagian yang tinggi atau terdepan di tengah keramaian umum.'
    reason: lexical_alternative
  - marker: b
    text: Gerbang kota merupakan tempat utama orang berkumpul untuk berdagang, menangani perkara hukum, dan menjalankan urusan masyarakat.
    reason: cultural_note
  - marker: c
    text: 'Secara harfiah: “ia mengatakan perkataannya,” yaitu ungkapan untuk berbicara di depan umum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹאשׁ הֹמִיּוֹת
  choice: Di tempat terdepan di tengah keramaian
  rationale: רֹאשׁ menunjuk pada bagian terdepan, utama, atau paling menonjol, sedangkan הֹמִיּוֹת menggambarkan tempat yang riuh dan penuh kesibukan. Frasa ini mempertahankan unsur lokasi menonjol serta suasana keramaian tanpa menambahkan kata 'jalan' yang tidak tersurat dalam bahasa Ibrani.
- source_word: תִּקְרָא
  choice: ia berseru
  rationale: קרא berarti memanggil atau berseru. 'Berseru' sesuai dengan gambaran Hikmat yang menyampaikan seruan secara terbuka dan lantang.
- source_word: בְּפִתְחֵי שְׁעָרִים
  choice: di pintu-pintu gerbang
  rationale: פֶּתַח berarti bukaan atau jalan masuk, sedangkan שַׁעַר berarti gerbang. Bentuk jamak dipertahankan, dan ungkapan ini menunjuk pada area masuk kompleks gerbang kota.
- source_word: בָּעִיר
  choice: kota
  rationale: Kata ini menerangkan bahwa gerbang-gerbang tersebut adalah gerbang kota. Dalam bahasa Indonesia, 'pintu-pintu gerbang kota' lebih alami daripada mengulang 'di' dalam 'gerbang-gerbang di kota'.
- source_word: אֲמָרֶיהָ תֹאמֵר
  choice: ia menyampaikan perkataannya
  rationale: Secara harfiah ungkapan ini berarti 'ia mengatakan perkataannya'. 'Menyampaikan perkataannya' mempertahankan objek eksplisit sekaligus menghindari pengulangan yang kaku dalam bahasa Indonesia.
theological_decisions:
- issue: Personifikasi Hikmat sebagai pembicara feminin
  choice: Memakai kata ganti 'ia' yang merujuk kepada Hikmat yang dipersonifikasikan dalam konteks
  alternative: Mengulang 'Sang Hikmat' atau memakai ungkapan feminin seperti 'perempuan itu'
  rationale: Bentuk verba dan sufiks Ibrani adalah feminin tunggal dan melanjutkan personifikasi Hikmat dari ayat sebelumnya. Bahasa Indonesia tidak membedakan gender pada kata ganti orang ketiga; 'ia' mempertahankan rujukan personal secara alami tanpa menambahkan penyebutan gender yang tidak dapat dinyatakan melalui sistem pronomina Indonesia.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan paralel Ibrani dipertahankan. Kata 'ia' dipilih sebagai kata ganti yang lebih sesuai untuk ragam sastra daripada 'dia'. Tanda titik dua dipertahankan karena ayat berikutnya memuat isi seruan Hikmat.
