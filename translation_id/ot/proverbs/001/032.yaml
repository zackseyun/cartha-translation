  text: For the turning away of the simple will kill them[a], and the complacency of fools will destroy them.
translation:
  language: id
  text: Sebab sikap berpaling orang yang tak berpengalaman akan membunuh mereka, dan rasa puas diri orang bodoh akan membinasakan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata yang diterjemahkan “rasa puas diri” juga dapat berarti “ketenangan”, “kemudahan hidup”, atau “rasa aman”. Dalam konteks ini, maknanya dapat mencakup rasa aman yang membuat lengah.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan yang menjelaskan peringatan sebelumnya; “Sebab” mempertahankan hubungan penjelas itu secara alami dalam bahasa Indonesia.
- source_word: מְשׁוּבַת
  choice: karena berpaling
  rationale: Nomina Ibrani ini menyatakan tindakan berbalik atau menyimpang. Bentuk verbal “berpaling” jelas dan alami, tanpa memasukkan nuansa doktrinal khusus seperti kemurtadan.
- source_word: פְּתָיִם
  choice: orang yang tak berpengalaman
  rationale: Dalam Amsal, istilah ini menunjuk pada orang yang belum matang, mudah dipengaruhi, atau kurang pertimbangan, bukan semata-mata kurang cerdas. Pilihan ini mempertahankan kategori hikmat tersebut tanpa memberi kesan menghina.
- source_word: תַּהַרְגֵם
  choice: akan terbunuh
  rationale: Verba הרג menyatakan kematian secara tegas. Susunan pasif dengan keterangan sebab menghasilkan bahasa Indonesia yang lebih alami sambil mempertahankan akibat mematikan dari tindakan berpaling mereka.
- source_word: וְשַׁלְוַת
  choice: dan ... karena rasa puas diri mereka
  rationale: שַׁלְוָה dapat berarti ketenangan, keamanan, kemudahan hidup, atau rasa aman yang membuat lengah. Dalam konteks orang bodoh yang mengabaikan hikmat, “rasa puas diri” menyampaikan nuansa ketenteraman yang berbahaya.
- source_word: כְּסִילִים
  choice: orang bodoh
  rationale: Ini adalah istilah khas sastra hikmat untuk orang yang keras kepala dan menolak didikan secara moral, bukan sekadar orang yang kurang pandai. “Orang bodoh” merupakan padanan yang lugas dan dikenal.
- source_word: תְּאַבְּדֵם
  choice: akan binasa
  rationale: Bentuk Piel dari אבד menyatakan menyebabkan kehancuran atau kebinasaan. Susunan “akan binasa karena” mengungkapkan hubungan kausal secara alami dan mempertahankan kerasnya akibat tersebut.
