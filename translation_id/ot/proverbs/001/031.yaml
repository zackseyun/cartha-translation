  text: So they will eat from the fruit of their way[b][a], and be filled with their own counsels.
translation:
  language: id
  text: Maka mereka akan memakan buah dari jalan hidup mereka[a] dan menjadi kenyang dengan rencana mereka sendiri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “memakan dari buah jalan mereka.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dipuaskan oleh pertimbangan mereka sendiri” atau “mendapat sampai puas dari rencana mereka sendiri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאכְלוּ
  choice: Maka mereka akan memakan
  rationale: Kata penghubung וְ dalam konteks ini menyatakan akibat dari penolakan pada ayat-ayat sebelumnya. “Maka” mengungkapkan hubungan tersebut secara wajar, sedangkan bentuk mendatang verba tetap dipertahankan.
- source_word: מִפְּרִי דַרְכָּם
  choice: buah dari jalan hidup mereka
  rationale: Ungkapan ini mempertahankan metafora hikmat tentang “buah” sebagai akibat yang dihasilkan oleh jalan atau pola hidup seseorang. “Jalan hidup” lebih alami dan jelas dalam bahasa Indonesia modern daripada “jalan mereka” tanpa mengubah metaforanya.
- source_word: וּמִמֹּעֲצֹתֵיהֶם
  choice: oleh rencana-rencana mereka sendiri
  rationale: מֹעֵצָה dapat berarti nasihat, pertimbangan, atau rencana. “Rencana-rencana” sesuai dengan konteks tindakan yang mereka pilih sendiri, sementara “sendiri” menyatakan akhiran posesif dan menonjolkan akibat dari pilihan mereka tanpa menambahkan penilaian yang tidak tersurat.
- source_word: יִשְׂבָּעוּ
  choice: menjadi kenyang
  rationale: Verba ini berarti menjadi kenyang atau mendapat sampai puas. “Menjadi kenyang” mempertahankan gambaran makan pada paruh pertama dan ironi bahwa mereka dipenuhi oleh hasil rencana mereka sendiri.
theological_decisions:
- issue: Gambaran akibat moral dalam penghakiman hikmat
  choice: Ayat diterjemahkan sebagai akibat yang patut dari jalan hidup dan rencana mereka sendiri.
  alternative: Mempertahankan kata penghubung umum “dan” sehingga hubungan akibat hanya tersirat.
  rationale: Konteks dan gambaran memakan buah sendiri menunjukkan konsekuensi moral dari pilihan mereka. Terjemahan ini menyatakannya secara alami tanpa memasukkan kategori doktrinal lain atau menentukan lebih jauh mekanisme penghakiman tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora “buah,” “jalan hidup,” dan “kenyang” dipertahankan agar hubungan puitis kedua bagian ayat tetap terlihat; pilihan “rencana-rencana” menghindari konotasi negatif tambahan yang akan timbul dari “siasat-siasat.”
