id: PRO.1.8
reference: Proverbs 1:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שְׁמַ֣ע בְּ֭נִ/י מוּסַ֣ר אָבִ֑י/ךָ וְ/אַל תִּ֝טֹּ֗שׁ תּוֹרַ֥ת אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/008.yaml
  text: Hear[a], my son, your father's instruction[b], and do not forsake your mother's teaching.
translation:
  language: id
  text: Dengarkanlah, anakku, didikan[a] ayahmu, dan jangan tinggalkan ajaran[b] ibumu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “disiplin”; מוּסָר mencakup didikan yang membentuk watak melalui pengajaran, koreksi, dan latihan.
    reason: lexical_alternative
  - marker: b
    text: Atau “petunjuk” atau “hukum”; di sini תּוֹרָה berarti ajaran berwibawa dari seorang ibu, bukan suatu kumpulan hukum formal.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Dengarkanlah
  rationale: Bentuk imperatif ini meminta perhatian sungguh-sungguh dan dapat menyiratkan ketaatan. “Dengarkanlah” mempertahankan arti dasarnya tanpa mempersempitnya menjadi “taatilah”.
- source_word: בְּנִי
  choice: anakku
  rationale: Ungkapan Ibrani berbentuk maskulin tunggal dengan akhiran orang pertama tunggal. Dalam bahasa Indonesia, “anakku” alami untuk sapaan orang tua kepada anak dan tidak perlu menambahkan kata “laki-laki”; konteks sastra tetap mempertahankan sapaan kepada seorang putra.
- source_word: מוּסַר
  choice: didikan
  rationale: Kata ini mencakup pengajaran yang membentuk watak, termasuk disiplin dan koreksi. “Didikan” lebih luas dan alami daripada “hukuman” serta tetap menyampaikan unsur pembentukan.
- source_word: אָבִיךָ
  choice: ayahmu
  rationale: Bentuk posesif ini diterjemahkan secara alami sebagai “ayahmu” dalam frasa “didikan ayahmu”.
- source_word: וְאַל
  choice: dan jangan
  rationale: Gabungan konjungsi dan partikel larangan mengoordinasikan perintah kedua secara langsung dengan perintah pertama.
- source_word: תִּטֹּשׁ
  choice: tinggalkan
  rationale: Kata kerja ini berarti meninggalkan atau menelantarkan. “Jangan tinggalkan” alami dalam bahasa Indonesia dan mempertahankan bobot tindakan penolakan tanpa memakai ungkapan yang terlalu arkais.
- source_word: תּוֹרַת
  choice: ajaran
  rationale: Dalam konteks keluarga ini, תּוֹרָה menunjuk pada pengajaran berwibawa seorang ibu, bukan terutama kumpulan hukum resmi. “Ajaran” mempertahankan arti tersebut.
- source_word: אִמֶּךָ
  choice: ibumu
  rationale: Bentuk posesif diterjemahkan secara idiomatis sebagai “ibumu” dan mempertahankan kesejajaran dengan “ayahmu”.
theological_decisions:
- issue: Sapaan kepada anak dalam sastra hikmat
  choice: anakku
  alternative: anakku laki-laki / hai anak
  rationale: Teks Ibrani menyapa seorang putra secara maskulin tunggal. “Anakku” adalah sapaan langsung yang wajar dalam bahasa Indonesia; bentuk ini tidak mengubah sapaan menjadi jamak atau universal, sementara penambahan “laki-laki” akan terdengar kaku dan tidak diperlukan.
- issue: Arti תּוֹרָה dalam konteks rumah tangga, bukan konteks hukum Musa
  choice: ajaran
  alternative: hukum / petunjuk
  rationale: Di sini kata tersebut berada dalam kesejajaran dengan didikan ayah dan menunjuk pada pengajaran ibu yang berwibawa. “Ajaran” menghindari kesan bahwa yang dimaksud ialah suatu kitab hukum formal.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan dua bagian yang sejajar dipertahankan. “Dengarkanlah” dan “jangan tinggalkan” memberi nada nasihat hikmat yang tegas tetapi tetap alami.
