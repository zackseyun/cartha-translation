  text: My son[a], do not walk in the way with them; keep your foot from their path.
translation:
  language: id
  text: Anakku, janganlah berjalan di jalan bersama mereka; jauhkan kakimu dari jalur mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jangan pergi di jalan bersama mereka.” Bahasa Ibrani memakai gambaran “jalan,” yang dalam sastra hikmat dapat menunjuk bukan hanya jalan harfiah, tetapi juga arah atau cara hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Anakku
  rationale: Sapaan maskulin tunggal dengan sufiks orang pertama tunggal. “Anakku” alami dalam bahasa Indonesia dan mempertahankan bingkai pengajaran ayah kepada anak laki-laki.
- source_word: אַל תֵּלֵךְ
  choice: jangan berjalan
  rationale: Partikel larangan אַל dengan bentuk verba berikutnya menyatakan larangan. “Berjalan” mempertahankan kemungkinan makna harfiah sekaligus kiasan tentang perilaku atau jalan hidup.
- source_word: בְּדֶרֶךְ אִתָּם
  choice: di jalan bersama mereka
  rationale: דֶּרֶךְ dapat berarti jalan secara harfiah maupun arah hidup secara kiasan; frasa ini mempertahankan kedua nuansa tersebut, sedangkan אִתָּם diterjemahkan langsung sebagai “bersama mereka”.
- source_word: מְנַע
  choice: tahanlah
  rationale: Bentuk imperatif ini menyerukan tindakan menahan atau mencegah. “Tahanlah” mempertahankan daya perintah dan gambaran sengaja tidak melangkahkan kaki ke jalur mereka.
- source_word: רַגְלְךָ
  choice: kakimu
  rationale: Nomina tunggal dengan sufiks orang kedua maskulin tunggal diterjemahkan dalam bentuk tunggal, sesuai gambaran Ibrani.
- source_word: מִנְּתִיבָתָם
  choice: dari jalur mereka
  rationale: נְתִיבָה menunjuk jalan kecil, jalur, atau lintasan. “Jalur” membedakannya dari דֶּרֶךְ sambil mempertahankan paralelisme dan preposisi “dari”.
