  text: יִשְׁמַ֣ע חָ֭כָם וְ/י֣וֹסֶף לֶ֑קַח וְ֝/נָב֗וֹן תַּחְבֻּל֥וֹת יִקְנֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/005.yaml
  text: Let the wise man hear and increase in learning[b][a], and the discerning man acquire guidance.
translation:
  language: id
  text: Hendaklah orang bijak mendengarkan dan bertambah dalam pengetahuan,[a] dan hendaklah orang berpengertian memperoleh tuntunan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Orang bijak akan mendengarkan dan bertambah dalam pengetahuan”; kata-kata kerja imperfek Ibrani juga dapat dibaca secara deskriptif, tetapi di sini diterjemahkan sebagai ajakan sesuai dengan konteks pengajaran.
    reason: alternative_reading
  - marker: b
    text: “Tuntunan” menerjemahkan kata yang juga dapat berarti “nasihat bijaksana”, “pengarahan”, atau, secara lebih harfiah, “kemahiran mengemudikan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע
  choice: hendaklah ... mendengarkan
  rationale: Bentuk imperfek orang ketiga tunggal dapat dibaca secara deskriptif, tetapi dalam konteks pengajaran ini wajar dipahami sebagai ajakan. 'Hendaklah' mempertahankan daya hortatifnya.
- source_word: חָכָם
  choice: orang bijak
  rationale: Nomina tunggal ini menunjuk kepada pribadi yang bijak. Bahasa Indonesia memakai 'orang bijak' secara alami tanpa harus menandai gender gramatikal Ibrani.
- source_word: וְיֹסֶף
  choice: dan bertambah
  rationale: Kata kerja יסף berarti menambah atau bertambah. Dengan pelengkap 'dalam pengetahuan', 'bertambah' menyatakan perkembangan secara alami.
- source_word: לֶקַח
  choice: pengetahuan
  rationale: Dalam konteks menerima pengajaran, לֶקַח menunjuk pada pelajaran atau pengetahuan yang diperoleh. 'Pengetahuan' cocok dengan konstruksi 'bertambah dalam', sambil mempertahankan gagasan hasil belajar.
- source_word: נָבוֹן
  choice: orang berpengertian
  rationale: Bentuk ini menunjuk kepada orang yang memiliki kemampuan memahami atau membedakan. 'Orang berpengertian' merupakan ungkapan Indonesia yang alami dan bermartabat.
- source_word: תַּחְבֻּלוֹת
  choice: tuntunan
  rationale: Istilah ini dapat berarti pengarahan, nasihat yang cakap, atau secara harfiah seni mengemudikan. 'Tuntunan' mempertahankan gagasan pengarahan tanpa mempersempitnya menjadi strategi militer.
- source_word: יִקְנֶה
  choice: memperoleh
  rationale: קנה berarti mendapatkan atau memperoleh. 'Memperoleh' sesuai untuk sesuatu yang bernilai seperti tuntunan dan tidak memberi kesan transaksi pembelian.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hikmat yang bermartabat dan mudah dipahami. Paralelisme kedua bagian dipertahankan melalui pengulangan 'hendaklah', sedangkan bentuk maskulin tunggal Ibrani diterjemahkan secara representatif dan alami sebagai 'orang'.
