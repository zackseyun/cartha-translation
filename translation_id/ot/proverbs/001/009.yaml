  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י לִוְיַ֤ת חֵ֓ן הֵ֬ם לְ/רֹאשֶׁ֑/ךָ וַ֝/עֲנָקִ֗ים לְ/גַרְגְּרֹתֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/009.yaml
  text: for they are a graceful wreath for your head and necklaces for your neck[a][b].
translation:
  language: id
  text: Sebab semuanya itu adalah rangkaian bunga yang indah bagi kepalamu[a] dan kalung-kalung bagi lehermu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karangan yang mendatangkan perkenanan bagi kepalamu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “rantai-rantai bagi lehermu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menghubungkan ayat tersebut dengan nasihat pada ayat sebelumnya dan memperkenalkan alasannya.
- source_word: לִוְיַת
  choice: rangkaian bunga
  rationale: Nomina ini menunjuk pada sesuatu yang dililitkan atau dianyam sebagai hiasan kepala; “rangkaian bunga” alami dan mudah dipahami dalam bahasa Indonesia.
- source_word: חֵן
  choice: yang indah
  rationale: Dalam konteks perhiasan, kata ini menyatakan keelokan atau daya tarik, bukan istilah teologis teknis tentang anugerah.
- source_word: הֵם
  choice: semuanya itu adalah
  rationale: Kata ganti jamak ini merujuk kembali pada didikan ayah dan ajaran ibu dalam ayat 8; “semuanya itu” memperjelas rujukan jamaknya secara alami.
- source_word: לְרֹאשֶׁךָ
  choice: bagi kepalamu
  rationale: Preposisi ל menyatakan hubungan atau tujuan sebagai perhiasan; pilihan ini mempertahankan bentuk ungkapan sumber tanpa menutup kemungkinan nuansa “di atas kepala.”
- source_word: וַעֲנָקִים
  choice: dan kalung-kalung
  rationale: Bentuk jamak Ibrani dipertahankan, sedangkan “kalung” menyampaikan fungsi perhiasannya dengan lebih jelas daripada “rantai.”
- source_word: לְגַרְגְּרֹתֶיךָ
  choice: bagi lehermu
  rationale: Walaupun bentuk Ibrani secara harfiah dapat menunjuk pada bagian tenggorokan atau leher, “leher” merupakan ungkapan Indonesia yang wajar untuk tempat kalung dikenakan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Metafora perhiasan dipertahankan, bentuk jamak pada “kalung-kalung” mengikuti teks Ibrani, dan rujukan הֵם dibuat jelas tanpa mengubah makna.
