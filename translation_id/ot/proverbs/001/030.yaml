  text: לֹא אָב֥וּ לַ/עֲצָתִ֑/י נָ֝אֲצ֗וּ כָּל תּוֹכַחְתִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/030.yaml
  text: They were unwilling to accept my counsel[b][a]; they despised all my reproof.
translation:
  language: id
  text: Mereka tidak mau menerima nasihatku; mereka meremehkan semua teguranku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menolak semua koreksiku” atau “memandang hina semua kecamanku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אָבוּ
  choice: tidak mau menerima
  rationale: Gabungan negasi dan אָבוּ menyatakan ketidakmauan atau penolakan. Frasa ini mempertahankan nuansa kehendak tanpa memperkerasnya menjadi tindakan penolakan yang lebih tegas.
- source_word: לַעֲצָתִי
  choice: nasihatku
  rationale: עֵצָה berarti nasihat atau pertimbangan. Kata 'menerima' dibuat tersurat sebagai pelengkap idiomatis bagi 'tidak mau', sesuai dengan maksud konteks.
- source_word: נָאֲצוּ
  choice: meremehkan
  rationale: Kata kerja ini menyatakan sikap menghina atau menolak dengan memandang rendah. 'Meremehkan' alami dalam bahasa Indonesia dan tetap mempertahankan daya evaluatifnya.
- source_word: כָּל
  choice: semua
  rationale: Padanan langsung dan alami untuk kuantor yang mencakup keseluruhan.
- source_word: תּוֹכַחְתִּי
  choice: teguranku
  rationale: תּוֹכַחַת dapat berarti teguran, koreksi, atau kecaman. 'Teguran' cocok dengan ragam sastra hikmat dan jelas bagi pembaca modern.
