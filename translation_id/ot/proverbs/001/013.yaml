source:
  edition: WLC
  text: כָּל ה֣וֹן יָקָ֣ר נִמְצָ֑א נְמַלֵּ֖א בָתֵּ֣י/נוּ שָׁלָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/013.yaml
  text: We will find all precious wealth[b][a]; we will fill our houses with plunder.
translation:
  language: id
  text: Kita akan menemukan segala harta berharga[a]; kita akan memenuhi rumah-rumah kita dengan barang rampasan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala kekayaan yang bernilai” atau “segala kekayaan yang mahal.”
    reason: lexical_alternative
  - marker: b
    text: Atau “hasil jarahan”; kata Ibrani שָׁלָל menunjuk pada barang yang diambil sebagai rampasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: segala
  rationale: Mempertahankan cakupan menyeluruh dari kata Ibrani ini dan menyampaikan nada sesumbar dalam ajakan para pendosa.
- source_word: הוֹן יָקָר
  choice: harta berharga
  rationale: הוֹן menunjuk pada kekayaan atau harta benda, sedangkan יָקָר menyatakan nilainya yang tinggi. Gabungan “harta berharga” alami dalam bahasa Indonesia dan tetap dekat dengan susunan Ibrani.
- source_word: נִמְצָא
  choice: kita akan menemukan
  rationale: Mempertahankan arti dasar מצא, “menemukan,” serta bentuk orang pertama jamak yang dalam konteks ini menyatakan keyakinan tentang hasil perampokan mereka.
- source_word: נְמַלֵּא
  choice: kita akan memenuhi
  rationale: Menyampaikan tindakan orang pertama jamak sebagai kelanjutan dari pernyataan yakin sebelumnya, tanpa menghilangkan kemungkinan nuansa ajakan yang melekat pada bentuk kohortatif.
- source_word: בָתֵּינוּ
  choice: rumah-rumah kita
  rationale: Terjemahan konkret dan langsung yang sesuai dengan gambaran rumah-rumah sebagai tempat menyimpan hasil rampasan.
- source_word: שָׁלָל
  choice: barang rampasan
  rationale: Menjelaskan bahwa yang dimaksud ialah barang yang dirampas atau dijarah, dengan ungkapan yang jelas dan bermartabat dalam bahasa Indonesia modern.
theological_decisions: []
