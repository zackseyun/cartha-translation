  text: Throw in your lot among us[b][a]; we will all have one purse.
translation:
  language: id
  text: Lemparkanlah undimu ke tengah-tengah kami[a]; satu kantong uang akan menjadi milik kita semua[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Campakkanlah undimu di antara kami.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “kita semua akan memiliki satu kantong uang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוֹרָלְךָ
  choice: undimu
  rationale: Secara harfiah גּוֹרָל berarti undi dan dapat menunjuk pada bagian yang ditentukan melalui undi. Pilihan ini mempertahankan gambaran konkret dalam teks Ibrani, sementara konteks menunjukkan ajakan untuk menyatukan bagian atau nasib dengan kelompok itu.
- source_word: תַּפִּיל
  choice: Lemparkanlah
  rationale: Bentuk Hifil dari נפל secara harfiah berarti 'membuat jatuh' dan bersama גּוֹרָל menggambarkan tindakan melempar undi. Bentuk perintah ini mempertahankan kekuatan ajakan langsung dalam sumber.
- source_word: בְּתוֹכֵנוּ
  choice: ke tengah-tengah kami
  rationale: Frasa ini secara harfiah berarti 'di/ke tengah kami'. Dengan verba gerak 'lemparkanlah', 'ke tengah-tengah kami' alami dalam bahasa Indonesia dan tetap mempertahankan citra sumber.
- source_word: כִּיס
  choice: kantong uang
  rationale: כִּיס menunjuk pada kantong atau pundi tempat menyimpan uang. 'Kantong uang' jelas bagi pembaca modern dan tidak membiarkan 'kantong' dipahami terlalu umum.
- source_word: אֶחָד
  choice: satu
  rationale: אֶחָד berarti 'satu' dan menekankan bahwa hasil atau harta kelompok itu akan ditempatkan dalam satu wadah bersama.
- source_word: יִהְיֶה לְכֻלָּנוּ
  choice: akan menjadi milik kita semua
  rationale: Secara harfiah, frasa ini berarti 'akan ada/menjadi bagi kita semua'. Terjemahan ini menyampaikan kepemilikan bersama dengan jelas tanpa menghilangkan bentuk futur sumber.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia modern yang lugas dan bermartabat. Metafora undi dipertahankan dalam teks utama, sedangkan makna idiomatisnya dijelaskan sebagai alternatif. Kata ganti dibedakan secara alami: ''kami'' dalam ajakan kelompok kepada orang luar, lalu ''kita'' ketika orang yang diajak sudah termasuk dalam kepemilikan bersama.'
