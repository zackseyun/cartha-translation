  text: תַּ֭חַת כִּי שָׂ֣נְאוּ דָ֑עַת וְ/יִרְאַ֥ת יְ֝הֹוָ֗ה לֹ֣א בָחָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/029.yaml
  text: Because they hated knowledge and did not choose the fear of Yahweh[b][a],
translation:
  language: id
  text: Sebab mereka membenci pengetahuan dan tidak memilih untuk takut kepada Yahweh[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “takut kepada Yahweh” mencakup rasa gentar yang penuh hormat, bukan sekadar ketakutan.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani memakai nama ilahi יְהוָה (YHWH), yang di sini diterjemahkan “Yahweh”.
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחַת כִּי
  choice: Sebab
  rationale: Gabungan ini menyatakan alasan bagi penghukuman dalam konteks sekitar. “Sebab” menyampaikan hubungan kausal itu secara ringkas dan wajar.
- source_word: שָׂנְאוּ
  choice: mereka membenci
  rationale: Kata kerja שׂנא secara langsung berarti “membenci” dan mempertahankan kuatnya penolakan moral dalam teks.
- source_word: דָעַת
  choice: pengetahuan
  rationale: דָעַת merupakan istilah penting dalam sastra hikmat untuk pengetahuan yang berkaitan dengan pengajaran moral dan pengenalan akan Allah; “pengetahuan” adalah padanan langsung dan konsisten.
- source_word: יִרְאַת יְהוָה
  choice: takut akan Yahweh
  rationale: Ungkapan pokok dalam Amsal ini sengaja mempertahankan unsur takut, yang mencakup rasa gentar, hormat, dan kesungguhan moral, bukan sekadar ketakutan biasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: לֹא בָחָרוּ
  choice: tidak memilih
  rationale: בָּחַר berarti “memilih”. Terjemahan ini mempertahankan penekanan pada kehendak mereka tanpa memperluasnya menjadi “menolak”, meskipun penolakan tersirat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi ilahi alih-alih menggantinya dengan gelar.
- issue: Makna יִרְאַת יְהוָה
  choice: takut akan Yahweh
  alternative: hormat kepada Yahweh; rasa takut kepada Yahweh
  rationale: 'Terjemahan ini mempertahankan ketegangan teologis ungkapan hikmat tersebut: rasa gentar yang sungguh-sungguh sekaligus hormat dan ketundukan, tanpa mereduksinya menjadi sekadar “hormat” atau menafsirkannya sebagai teror semata.'
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan “memilih untuk takut akan Yahweh” dipakai agar hubungan kata kerja “memilih” dengan ungkapan infinitival terdengar alami bagi pembaca Indonesia. Tanda koma akhir dipertahankan karena ayat ini secara sintaksis melanjutkan alasan menuju ayat berikutnya.
