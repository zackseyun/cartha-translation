  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Ungkapan “bertindak bijaksana” dipakai untuk menonjolkan dimensi praktis הַשְׂכֵּל, sedangkan tiga istilah etis Ibrani dipertahankan sebagai “kebenaran, keadilan, dan kelurusan” agar perbedaannya tidak melebur.
