  text: to receive instruction in wise dealing[a], righteousness, justice[c][b], and equity.
translation:
  language: id
  text: untuk menerima didikan dalam bertindak bijaksana[a], dalam kebenaran, keadilan, dan kelurusan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam kebijaksanaan praktis.” Frasa Ibrani ini menunjuk pada kecakapan bertindak dengan bijaksana, bukan sekadar pemahaman intelektual.
    reason: lexical_alternative
  - marker: b
    text: Atau “kejujuran” atau “sikap tidak berat sebelah.” Kata Ibraninya secara harfiah berkaitan dengan apa yang lurus.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַחַת
  choice: menerima
  rationale: Dalam rangkaian tujuan pada Amsal 1:2–3, kata ini secara harfiah dapat berarti “mengambil”, tetapi bersama מוּסַר secara idiomatis berarti menerima atau menyambut didikan.
- source_word: מוּסַר
  choice: didikan
  rationale: Kata ini mencakup pengajaran, disiplin, dan koreksi yang membentuk watak. “Didikan” mempertahankan keluasan makna itu tanpa memberi kesan hukuman semata.
- source_word: הַשְׂכֵּל
  choice: bertindak bijaksana
  rationale: Bentuk ini menunjuk pada kecakapan atau kebijaksanaan praktis dalam menjalani hidup, bukan sekadar pemahaman intelektual.
- source_word: צֶדֶק
  choice: kebenaran
  rationale: Dalam deretan etis ini, “kebenaran” menyatakan apa yang benar dan patut serta tetap membedakannya dari מִשְׁפָּט, “keadilan”.
- source_word: מִשְׁפָּט
  choice: keadilan
  rationale: Di sini kata tersebut menunjuk pada keputusan atau tatanan yang adil dalam ranah etis dan sosial.
- source_word: מֵישָׁרִים
  choice: kelurusan
  rationale: Bentuk jamak ini secara harfiah berkaitan dengan keadaan lurus dan secara etis berarti kelurusan atau kejujuran; “kelurusan” mempertahankan citra dasar Ibraninya.
