  terminology: “Darah” dan “nyawa” tepat bagi דם dan נפשות dalam konteks kekerasan. Pengulangan “mereka sendiri” dengan tepat mempertahankan ironi sufiks orang ketiga jamak. Tidak ada persoalan teologis atau nama diri.
