  text: But they lie in wait for their own blood[b][a]; they set an ambush for their own lives.
translation:
  language: id
  text: Namun, mereka mengintai darah mereka sendiri[a]; mereka bersembunyi untuk mengincar nyawa mereka sendiri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “darah mereka.” Kata “darah” dipertahankan sebagai gambaran konkret bagi kematian akibat kekerasan dan menegaskan ironi bahwa kekerasan mereka berbalik kepada diri mereka sendiri.
    reason: lexical_alternative
  - marker: b
    text: Atau, “mereka memasang penyergapan terhadap nyawa mereka sendiri.” Kata Ibrani yang digunakan pada dasarnya berarti “menyembunyikan” atau “bersembunyi,” tetapi dalam konteks ini kemungkinan menunjuk pada penyergapan tersembunyi.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵם
  choice: Namun, mereka
  rationale: Kata penghubung dan pronomina mandiri menandai kontras dengan gambaran burung pada ayat sebelumnya; “Namun” menyampaikan pertentangan itu secara wajar.
- source_word: לְדָמָם
  choice: darah mereka sendiri
  rationale: דָּם secara konkret berarti “darah” dan di sini dapat menunjuk pada kematian akibat kekerasan. Bentuk konkret dipertahankan agar ironi bahwa kekerasan mereka berbalik kepada diri sendiri tetap terasa.
- source_word: יֶאֱרֹבוּ
  choice: menghadang
  rationale: ארב berarti menunggu secara tersembunyi untuk menyerang atau menyergap. “Menghadang” menyampaikan tindakan mengintai korban tanpa menyamakan kata ini sepenuhnya dengan verba paralelnya.
- source_word: יִצְפְּנוּ
  choice: memasang penyergapan
  rationale: צפן pada dasarnya berarti menyembunyikan atau bersembunyi. Dalam paralelisme ini, konteksnya adalah tindakan tersembunyi untuk menyerang, sehingga “memasang penyergapan” menyampaikan daya ungkap kontekstualnya; arti yang lebih harfiah dicatat dalam catatan kaki.
- source_word: לְנַפְשֹׁתָם
  choice: terhadap nyawa mereka sendiri
  rationale: נֶפֶשׁ dapat berarti nyawa, diri, atau jiwa. Karena konteksnya menyangkut kekerasan yang mematikan, “nyawa” paling sesuai, sedangkan “sendiri” menonjolkan ironi refleksif.
