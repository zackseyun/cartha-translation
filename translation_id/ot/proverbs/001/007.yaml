  text: יִרְאַ֣ת יְ֭הוָה רֵאשִׁ֣ית דָּ֑עַת חָכְמָ֥ה וּ֝/מוּסָ֗ר אֱוִילִ֥ים בָּֽזוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/007.yaml
  text: The fear of Yahweh is the beginning of knowledge[b][a]; fools despise wisdom and discipline.
translation:
  language: id
  text: Takut akan Yahweh[a] adalah permulaan pengetahuan; orang bodoh meremehkan hikmat dan didikan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hormat kepada Yahweh” atau “gentar di hadapan Yahweh.” Ungkapan Ibrani ini mencakup rasa hormat, gentar, dan takut yang disertai ketundukan kepada Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau “pengajaran” atau “koreksi.” Istilah Ibrani ini menunjuk pada pembentukan yang dapat mencakup teguran dan koreksi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: takut akan
  rationale: Ungkapan ini mempertahankan bobot harfiah dan etis dari istilah Ibrani, yang mencakup rasa takut, hormat, gentar, dan ketundukan kepada Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan agar nama pribadi dalam teks Ibrani tetap terlihat dan tidak diganti dengan gelar.
- source_word: רֵאשִׁית
  choice: permulaan
  rationale: Pilihan ini alami dalam bahasa Indonesia dan mempertahankan kemungkinan makna sebagai titik awal sekaligus dasar utama, tanpa mempersempitnya menjadi tafsiran tertentu.
- source_word: דָּעַת
  choice: pengetahuan
  rationale: Padanan langsung yang sesuai dengan pemakaian kata ini dalam sastra hikmat dan dapat dibedakan dari istilah Ibrani lain untuk pengertian.
- source_word: חָכְמָה
  choice: hikmat
  rationale: Istilah baku dan bermartabat dalam konteks Amsal, mencakup kecakapan menjalani hidup dengan benar.
- source_word: מוּסָר
  choice: didikan
  rationale: Kata ini menyampaikan proses pembentukan melalui pengajaran dan koreksi, bukan sekadar hukuman; bentuknya juga alami ketika dipasangkan dengan 'hikmat'.
- source_word: אֱוִילִים
  choice: orang bodoh
  rationale: Dalam Amsal, sebutan ini menunjukkan golongan moral yang menolak hikmat, bukan hanya orang yang kurang cerdas.
- source_word: בָּזוּ
  choice: meremehkan
  rationale: Kata ini menyatakan sikap memandang rendah dan menolak dengan penghinaan; 'meremehkan' terdengar alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna 'takut akan Yahweh' dalam teologi hikmat
  choice: Mempertahankan ungkapan 'takut akan Yahweh' dalam teks utama.
  alternative: hormat kepada Yahweh; gentar di hadapan Yahweh
  rationale: Ungkapan Ibrani ini bersifat programatis dalam Amsal serta mencakup rasa hormat, gentar, dan ketundukan moral. Padanan yang hanya menonjolkan rasa hormat atau kekaguman akan mempersempit ketegangan maknanya.
- issue: Hubungan רֵאשִׁית dengan pengetahuan
  choice: permulaan pengetahuan
  alternative: dasar utama pengetahuan; prinsip pertama pengetahuan
  rationale: '''Permulaan'' mempertahankan kemungkinan bahwa takut akan Yahweh merupakan titik awal sekaligus landasan pengetahuan, tanpa menetapkan salah satu penafsiran secara berlebihan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan paralel pepatah dipertahankan. 'Yahweh' digunakan sebagai transliterasi nama ilahi; 'orang bodoh' dipahami sebagai kategori moral dalam sastra hikmat.
