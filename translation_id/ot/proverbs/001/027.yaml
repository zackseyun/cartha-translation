base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/027.yaml
  text: when your dread comes like a storm[a], and your calamity arrives like a whirlwind, when distress and anguish come upon you.
translation:
  language: id
  text: ketika ketakutan kalian datang seperti badai[a], dan malapetaka kalian tiba seperti angin puyuh, ketika kesusahan dan kesesakan menimpa kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seperti kehancuran”; kata Ibrani ini dapat menekankan kehancuran yang membinasakan maupun daya hantam badai.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֹא
  choice: ketika ... datang
  rationale: Preposisi ב dengan bentuk infinitif konstruk בוא membentuk klausa waktu; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nilai temporalnya.
- source_word: כְשָׁאוָה
  choice: seperti badai kehancuran
  rationale: Nomina ini dapat menunjuk pada kehancuran atau daya hantam yang membinasakan. Pilihan ini mempertahankan citra badai dalam paralelisme sekaligus menampilkan unsur kehancurannya.
- source_word: פַּחְדְּכֶם
  choice: apa yang kalian takuti
  rationale: פַּחַד dapat berarti rasa takut maupun objek yang ditakuti. Dalam konteks sesuatu yang 'datang', ungkapan ini menyampaikan objek ketakutan secara alami tanpa meniadakan nuansa rasa gentar.
- source_word: וְאֵידְכֶם
  choice: dan malapetaka kalian
  rationale: אֵיד menunjuk pada bencana atau malapetaka; 'malapetaka' sesuai dengan ragam sastra hikmat yang luhur tetapi tetap mudah dipahami.
- source_word: כְּסוּפָה
  choice: seperti angin puyuh
  rationale: סוּפָה menunjuk pada badai angin yang dahsyat; 'angin puyuh' mempertahankan kekuatan citra dan perbandingan dengan כ.
- source_word: יֶאֱתֶה
  choice: tiba
  rationale: Verba ini berarti datang atau tiba. 'Tiba' alami dalam bahasa Indonesia dan memberi variasi puitis tanpa menambah makna.
- source_word: עֲלֵיכֶם
  choice: menimpa kalian
  rationale: Dalam konteks kesusahan, עַל menggambarkan sesuatu yang datang atas seseorang; 'menimpa' menyampaikan relasi adversatif itu secara idiomatis.
- source_word: צָרָה
  choice: kesesakan
  rationale: צָרָה menggambarkan kesusahan atau keadaan terjepit. 'Kesesakan' mempertahankan metafora tekanan dan sesuai dengan paralelismenya.
- source_word: וְצוּקָה
  choice: dan tekanan batin
  rationale: צוּקָה mengandung gagasan tekanan, keadaan terjepit, atau penderitaan batin. 'Tekanan batin' membedakannya dari צָרָה sambil mempertahankan tumpang tindih makna pasangan puitis ini.
