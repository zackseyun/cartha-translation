  text: כִּ֣י רַ֭גְלֵי/הֶם לָ/רַ֣ע יָר֑וּצוּ וִֽ֝/ימַהֲר֗וּ לִ/שְׁפָּךְ דָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/016.yaml
  text: For their feet run to evil[b][a], and they hurry to shed blood.
translation:
  language: id
  text: Sebab kaki mereka berlari menuju kejahatan,[a] dan mereka bergegas untuk menumpahkan darah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepada kejahatan”; dapat juga dipahami sebagai “untuk berbuat jahat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi peringatan sebelumnya dan mempertahankan hubungan penjelas antarayat.
- source_word: רַגְלֵיהֶם
  choice: kaki mereka
  rationale: Mempertahankan gambaran konkret bahasa Ibrani tentang gerak yang menunjukkan hasrat dan kesiapan.
- source_word: לָרַע
  choice: menuju kejahatan
  rationale: Preposisi ל dapat menyatakan arah atau tujuan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kemungkinan bahwa mereka bergerak menuju kejahatan, tanpa secara eksplisit menambahkan kata 'melakukan'.
- source_word: יָרוּצוּ
  choice: berlari
  rationale: Mempertahankan arti dasar dan metafora gerak cepat dalam teks sumber.
- source_word: וִימַהֲרוּ
  choice: dan mereka bergegas
  rationale: Menyampaikan tindakan tergesa-gesa serta penguatan paralel terhadap 'berlari'.
- source_word: לִשְׁפָּךְ
  choice: untuk menumpahkan
  rationale: Dalam kolokasi dengan darah, 'menumpahkan darah' merupakan padanan Indonesia yang wajar dan tepat.
- source_word: דָּם
  choice: darah
  rationale: Padanan langsung yang mempertahankan ungkapan Ibrani bagi tindakan kekerasan yang menyebabkan pertumpahan darah.
