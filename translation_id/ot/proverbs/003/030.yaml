  text: Do not contend with a man without cause[b][a], if he has done you no harm.
translation:
  language: id
  text: Jangan berselisih dengan seseorang tanpa alasan, jika ia tidak berbuat jahat kepadamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Jangan berselisih dengan seseorang tanpa dasar, jika ia tidak merugikanmu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Jangan
  rationale: Partikel אַל dengan bentuk verba berikutnya menyatakan larangan; “Jangan” adalah padanan Indonesia yang langsung dan wajar.
- source_word: תרוב
  choice: bertengkar
  rationale: ריב dapat menunjuk pada pertengkaran, perselisihan, atau perkara hukum. “Bertengkar” alami bagi pembaca umum, sementara kemungkinan cakupan yang lebih luas dicatat dalam catatan kaki.
- source_word: עִם
  choice: dengan
  rationale: Padanan langsung עִם dan membentuk ungkapan Indonesia yang alami, “bertengkar dengan”.
- source_word: אָדָם
  choice: seseorang
  rationale: Dalam pepatah ini אָדָם menunjuk secara generik kepada seorang manusia, bukan khusus laki-laki; “seseorang” mempertahankan bentuk tunggal dan fungsi generiknya.
- source_word: חִנָּם
  choice: tanpa alasan
  rationale: Mengungkapkan tindakan tanpa sebab atau dasar yang sah dalam bahasa Indonesia modern.
- source_word: אִם לֹא
  choice: jika ... tidak
  rationale: Mempertahankan bentuk syarat Ibrani tanpa mengubahnya menjadi pernyataan sebab atau pengecualian yang lebih tegas.
- source_word: גְמָלְךָ
  choice: berbuat ... kepadamu
  rationale: Dalam konstruksi dengan רָעָה, גמל menyatakan perlakuan atau tindakan terhadap orang yang disapa; ungkapan ini alami dalam bahasa Indonesia.
- source_word: רָעָה
  choice: jahat
  rationale: רָעָה dapat berarti kejahatan, keburukan, atau bahaya. “Berbuat jahat kepadamu” mempertahankan bobot moral kata tersebut sekaligus jelas dalam konteks antarpribadi.
