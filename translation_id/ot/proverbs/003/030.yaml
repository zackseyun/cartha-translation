  register: Bahasa Indonesia baku, modern, dan ringkas dalam gaya nasihat hikmat. “Seseorang” digunakan karena אָדָם berfungsi generik. Tanda koma tidak dipakai sebelum klausa syarat agar kalimat mengalir alami.
