  text: מְאֵרַ֣ת יְ֭הוָה בְּ/בֵ֣ית רָשָׁ֑ע וּ/נְוֵ֖ה צַדִּיקִ֣ים יְבָרֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/033.yaml
  text: Yahweh’s curse is on the house of the wicked[b][a], but he blesses the dwelling of the righteous.
translation:
  language: id
  text: Kutuk Yahweh menimpa rumah orang fasik[a], tetapi Ia memberkati kediaman[b] orang-orang benar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “ada di dalam rumah orang fasik.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tempat tinggal” atau “rumah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאֵרַת
  choice: kutuk
  rationale: Nomina ini menyatakan kutuk atau keadaan terkutuk; “kutuk” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּבֵית
  choice: menimpa rumah
  rationale: Preposisi ב secara harfiah dapat berarti “di/dalam”, tetapi bersama “kutuk” ungkapan “menimpa rumah” secara alami menyampaikan bahwa kutuk itu berada atas rumah tangga tersebut.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Bentuk tunggal ini bersifat generik dalam pepatah dan menunjuk pada golongan yang hidup dalam kefasikan.
- source_word: וּנְוֵה
  choice: tetapi ... kediaman
  rationale: נָוֶה berarti tempat tinggal atau kediaman; waw dipahami secara adversatif karena pertentangan antara kedua klausa.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Adjektiva jamak yang digunakan secara substantival ini menunjuk pada mereka yang benar.
- source_word: יְבָרֵךְ
  choice: Ia memberkati
  rationale: Bentuk imperfek menyatakan kebenaran umum atau kebiasaan dalam gaya amsal, bukan semata-mata tindakan masa depan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri Allah; transliterasi “Yahweh” mempertahankan fungsi nama tersebut.
- issue: Bentuk tunggal generik רָשָׁע
  choice: orang fasik
  alternative: seorang fasik; orang jahat
  rationale: Bentuk tunggal Ibrani mewakili suatu golongan dalam pernyataan hikmat. “Orang fasik” mempertahankan bentuk kategori tanpa membatasinya pada satu individu tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. Paralelisme antitetis dipertahankan melalui “tetapi”; kapitalisasi “Ia” dipakai untuk memperjelas bahwa subjek klausa kedua adalah Yahweh.
