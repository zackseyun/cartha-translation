  text: כִּ֤י אֶ֥ת אֲשֶׁ֣ר יֶאֱהַ֣ב יְהוָ֣ה יוֹכִ֑יחַ וּ֝/כְ/אָ֗ב אֶת בֵּ֥ן יִרְצֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/012.yaml
  text: For Yahweh reproves the one he loves[b][a], as a father the son in whom he delights.
translation:
  language: id
  text: Sebab Yahweh menegur[a] orang yang dikasihi-Nya, seperti seorang ayah menegur anak laki-laki yang disayanginya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengoreksi”. Kata kerja Ibrani menekankan teguran atau koreksi, meskipun dalam konteks ini menjadi bagian dari tema disiplin Yahweh yang lebih luas.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “dan seperti seorang ayah terhadap anak laki-laki yang disayanginya.” Teks Ibrani bersifat eliptis; kata “menegur” pada klausa kedua dipahami dari klausa pertama.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memberikan alasan bagi nasihat pada ayat sebelumnya; “Sebab” mengalir wajar dalam bahasa Indonesia.
- source_word: אֶת אֲשֶׁר יֶאֱהַב
  choice: orang yang dikasihi-Nya
  rationale: Konstruksi penanda objek dan partikel relatif menunjuk kepada seseorang sebagai objek kasih Yahweh. Bentuk pasif ini alami dalam bahasa Indonesia dan tetap mempertahankan acuan personal tunggal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang secara langsung terdapat dalam teks Ibrani.
- source_word: יוֹכִיחַ
  choice: menegur
  rationale: Bentuk Hifil dari יכח menekankan teguran atau koreksi. “Menegur” mempertahankan inti leksikalnya tanpa memperluasnya menjadi seluruh cakupan disiplin pada konteks ayat-ayat sekitar.
- source_word: וּכְאָב
  choice: seperti seorang ayah
  rationale: Kata depan perbandingan memperkenalkan perumpamaan. Konjungsi ו tidak perlu dinyatakan tersendiri agar kalimat Indonesia tetap alami.
- source_word: בֵּן
  choice: anak
  rationale: Dalam hubungan dengan “ayah”, kata Indonesia “anak” secara alami menerjemahkan בֵּן tanpa harus menambahkan kepunyaan yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: יִרְצֶה
  choice: yang disayanginya
  rationale: Dalam konteks hubungan ayah-anak, רצה menyatakan perkenanan atau rasa senang. “Disayanginya” secara alami menyampaikan perkenanan penuh kasih, sementara kemungkinan terjemahan yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian tersebut.
- issue: Gambaran orang tua dan anak yang berjenis kelamin maskulin
  choice: seorang ayah ... anak
  alternative: orang tua ... anak
  rationale: “Ayah” dipertahankan karena אָב secara eksplisit maskulin. Bahasa Indonesia tidak membedakan “anak laki-laki” dan “anak” secara wajib; “anak” tetap tepat bagi בֵּן dalam konstruksi relasional ini tanpa mengubah maksud menjadi gambaran netral yang berbeda.
- issue: Cakupan tindakan korektif ilahi
  choice: menegur
  alternative: mengoreksi; mendisiplinkan
  rationale: Kata kerja langsung menekankan teguran atau koreksi, sedangkan gagasan disiplin yang lebih luas berasal dari konteks sebelumnya. Pilihan ini tidak mempersempit kasih menjadi hukuman ataupun memperluas kata kerja melampaui daya leksikalnya.
- issue: Elipsis dalam perbandingan ayah dan anak
  choice: 'mengulang “menegur” secara implisit: “seperti seorang ayah menegur ...”'
  alternative: “dan seperti seorang ayah terhadap anak yang diperkenankannya”
  rationale: Teks Ibrani bersifat eliptis dan memungkinkan tindakan pada klausa pertama dipahami kembali dalam perbandingan. Pengulangan “menegur” menghasilkan bahasa Indonesia yang jelas, sedangkan bentuk yang lebih eliptis dan kedekatannya dengan susunan Ibrani dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat lugas bagi pembaca umum. Akhiran “-Nya” mengacu kepada Yahweh; pengulangan “menegur” melengkapi elipsis Ibrani tanpa mengubah hubungan logis ayat.
