id: PRO.3.11
reference: Proverbs 3:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מוּסַ֣ר יְ֭הוָה בְּנִ֣/י אַל תִּמְאָ֑ס וְ/אַל תָּ֝קֹ֗ץ בְּ/תוֹכַחְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/011.yaml
  text: My son[a], do not despise Yahweh’s discipline, and do not loathe his reproof.
translation:
  language: id
  text: Anakku, janganlah meremehkan didikan Yahweh, dan janganlah merasa muak terhadap teguran-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “janganlah menjadi jemu atau tidak sabar terhadap teguran-Nya.” Kata kerja Ibraninya dapat menyatakan rasa muak, kejenuhan, atau ketidaksabaran.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּסַר
  choice: didikan
  rationale: Dalam sastra hikmat, kata ini menunjuk pada pembentukan yang mencakup pengajaran dan koreksi. “Didikan” alami dalam bahasa Indonesia dan mempertahankan cakupan formatifnya tanpa memberi kesan hukuman semata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּנִי
  choice: Anakku
  rationale: Sapaan tunggal maskulin ini secara harfiah berarti “anakku” dan cocok dengan latar nasihat seorang ayah dalam sastra hikmat.
- source_word: אַל תִּמְאָס
  choice: janganlah meremehkan
  rationale: Kata kerja מָאַס dapat menyatakan penolakan yang disertai sikap menghina atau memandang rendah. “Meremehkan” mempertahankan unsur sikap tersebut dalam ungkapan Indonesia yang wajar.
- source_word: תָּקֹץ
  choice: janganlah merasa muak terhadap
  rationale: קוּץ dapat menyatakan rasa muak atau jijik, tetapi juga kejenuhan dan ketidaksabaran. Teks utama memakai arti kuat yang sesuai dengan paralelismenya, sedangkan kemungkinan arti lainnya dipertahankan dalam catatan kaki.
- source_word: בְּתוֹכַחְתּוֹ
  choice: teguran-Nya
  rationale: תּוֹכַחַת menunjuk pada koreksi atau kecaman verbal. “Teguran” membedakannya dari cakupan “didikan” yang lebih luas dan terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama ilahi tersebut alih-alih menggantinya dengan gelar.
- issue: Cakupan makna קוּץ
  choice: merasa muak terhadap
  alternative: menjadi jemu atau tidak sabar terhadap
  rationale: Konteks paralel dengan “meremehkan” mendukung nuansa keengganan emosional yang kuat, tetapi kata Ibraninya juga memungkinkan nuansa jemu atau tidak sabar; ambiguitas itu tidak dihapus dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “janganlah” mempertahankan nada nasihat yang sungguh-sungguh; “Anakku” tetap akrab dan sesuai dengan latar sastra hikmat. Akhiran pronominal ilahi ditulis “-Nya” mengikuti kebiasaan ortografis Indonesia.
