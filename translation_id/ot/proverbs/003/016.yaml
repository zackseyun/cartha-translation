  text: אֹ֣רֶךְ יָ֭מִים בִּֽ/ימִינָ֑/הּ בִּ֝/שְׂמֹאולָ֗/הּ עֹ֣שֶׁר וְ/כָבֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/016.yaml
  text: Length of days is in her right hand[a]; in her left hand are riches and honor.
translation:
  language: id
  text: Umur panjang ada di tangan kanannya[a]; di tangan kirinya ada kekayaan dan kehormatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: panjangnya hari-hari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ יָמִים
  choice: umur panjang
  rationale: Ungkapan ini secara harfiah berarti ‘panjangnya hari-hari’, tetapi dalam bahasa Indonesia modern ‘umur panjang’ menyampaikan idiom Ibrani itu secara alami dan tepat.
- source_word: בִּימִינָהּ
  choice: di tangan kanannya
  rationale: Preposisi ב paling wajar dipahami sebagai ‘di/dalam’; bahasa Indonesia lazim memakai ‘di tangan’ untuk menggambarkan Hikmat yang dipersonifikasikan sedang memegang karunia ini.
- source_word: בִּשְׂמֹאולָהּ
  choice: di tangan kirinya
  rationale: Pilihan ini mempertahankan kesejajaran puitis dengan ‘di tangan kanannya’ dan sufiks feminin yang merujuk kepada Hikmat.
- source_word: עֹשֶׁר
  choice: kekayaan
  rationale: ‘Kekayaan’ merupakan padanan alami dalam bahasa Indonesia untuk kelimpahan harta dan cocok dipasangkan dengan ‘kehormatan’.
- source_word: כָבוֹד
  choice: kehormatan
  rationale: Dalam konteks sastra hikmat, kata ini menunjuk pada martabat atau penghargaan sosial; ‘kehormatan’ lebih tepat daripada ‘kemuliaan’ di sini.
theological_decisions:
- issue: Rujukan sufiks feminin
  choice: Kata ganti posesif ‘-nya’ merujuk kepada Hikmat yang dipersonifikasikan dalam konteks terdekat.
  alternative: Memahami bentuk feminin itu sebagai pernyataan tentang suatu sosok ilahi feminin.
  rationale: Amsal menggambarkan Hikmat secara sastrawi sebagai seorang perempuan yang memegang berbagai karunia. Terjemahan mempertahankan personifikasi tersebut tanpa mengubahnya menjadi pernyataan ontologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan puitis. Susunan dua klausa mempertahankan kesejajaran tangan kanan dan tangan kiri; ‘kanannya/kirinya’ secara alami merujuk kepada Hikmat dalam konteks.
