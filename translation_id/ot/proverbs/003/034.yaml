id: PRO.3.34
reference: Proverbs 3:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם לַ/לֵּצִ֥ים הֽוּא יָלִ֑יץ ו/ל/עניים יִתֶּן חֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/034.yaml
  text: Surely he scoffs at scoffers[a], but gives favor[b] to the humble[c].
translation:
  language: id
  text: Sungguh, Ia mencemooh para pencemooh[a], tetapi mengaruniakan perkenanan[b] kepada orang-orang yang rendah hati[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengejek para pengejek.” Bahasa Ibrani mengulang akar kata yang sama pada kedua kata itu.
    reason: lexical_alternative
  - marker: b
    text: Atau “anugerah.”
    reason: lexical_alternative
  - marker: c
    text: Atau “orang-orang miskin” atau “orang-orang tertindas.” Istilah ini dapat menggambarkan orang yang rendah kedudukan atau keadaannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Sungguh
  rationale: Di sini אִם berfungsi sebagai penegas, bukan pembuka kalimat bersyarat; tidak ada klausa akibat, dan pepatah ini menyatakan pola tindakan Allah.
- source_word: לַלֵּצִים ... יָלִיץ
  choice: mencemooh para pencemooh
  rationale: Pilihan ini mempertahankan pengulangan akar לוץ dan simetri pembalasan dalam bahasa Ibrani, sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: הוּא
  choice: Ia
  rationale: Pronomina eksplisit dipertahankan tanpa menambahkan nama Allah; konteks sebelumnya menentukan rujukannya.
- source_word: וְלַעֲנִיִּים
  choice: tetapi ... kepada orang-orang yang rendah hati
  rationale: Dalam pertentangan dengan para pencemooh, makna sikap rendah hati paling sesuai, sementara kemungkinan makna miskin atau tertindas tetap dicatat.
- source_word: יִתֶּן
  choice: mengaruniakan
  rationale: Bentuk imperfek menyatakan tindakan khas atau umum dalam gaya pepatah; kala kini generik tersirat secara alami dalam bahasa Indonesia.
- source_word: חֵן
  choice: perkenanan
  rationale: חֵן dapat berarti perkenanan atau anugerah. 'Perkenanan' sesuai dengan konteks hikmat dan tidak mempersempitnya pada pengertian teologis yang lebih khusus.
theological_decisions:
- issue: Rujukan pronomina הוּא
  choice: Subjek diterjemahkan sebagai 'Ia', dengan Allah dipahami dari konteks.
  alternative: Menambahkan 'TUHAN' atau 'Allah' secara eksplisit.
  rationale: Teks Ibrani memakai pronomina, bukan nama ilahi. Mempertahankan pronomina menghormati bentuk sumber tanpa mengaburkan rujukan kontekstualnya.
- issue: Makna עֲנִיִּים dalam konteks ini
  choice: orang-orang yang rendah hati
  alternative: orang-orang miskin; orang-orang tertindas; orang-orang rendah
  rationale: Pertentangan dengan para pencemooh terutama menunjuk pada sikap atau kedudukan yang rendah, tetapi cakupan sosial dan keadaan sulit dari istilah ini tetap mungkin dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'mencemooh—pencemooh' sengaja dipertahankan untuk mencerminkan permainan kata Ibrani; 'Ia' ditulis dengan huruf kapital sesuai kebiasaan bahasa Indonesia ketika merujuk kepada Allah.
