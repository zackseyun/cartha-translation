id: PRO.3.1
reference: Proverbs 3:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּ֭נִ/י תּוֹרָתִ֣/י אַל תִּשְׁכָּ֑ח וּ֝/מִצְוֺתַ֗/י יִצֹּ֥ר לִבֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/001.yaml
  text: My son[a], do not forget my instruction[b], and let your heart keep my commandments.
translation:
  language: id
  text: Anakku, jangan lupakan ajaranku[a], dan hendaklah hatimu memelihara perintah-perintahku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “petunjukku.” Kata Ibrani torah di sini menunjuk pada ajaran atau didikan, bukan hanya hukum dalam arti sempit.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menjaga perintah-perintahku.” Kata kerjanya mengandung arti menjaga dengan saksama.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Anakku
  rationale: Sapaan tunggal maskulin dengan akhiran orang pertama; bentuk ini mempertahankan latar wejangan seorang ayah kepada anak laki-lakinya dalam kitab Amsal.
- source_word: תּוֹרָתִי
  choice: ajaranku
  rationale: Dalam konteks didikan hikmat orang tua, torah berarti ajaran atau petunjuk, bukan terutama hukum dalam arti yuridis yang sempit.
- source_word: אַל תִּשְׁכָּח
  choice: jangan lupakan
  rationale: Larangan langsung ini disampaikan secara alami dan tetap mempertahankan daya imperatif bentuk Ibraninya.
- source_word: וּמִצְוֺתַי
  choice: perintah-perintahku
  rationale: Bentuk jamak ini menunjuk pada berbagai perintah yang berwibawa; pengulangan kata mempertahankan kejelasan bentuk jamak dalam bahasa Indonesia.
- source_word: יִצֹּר
  choice: memelihara
  rationale: Kata kerja natsar mengandung arti menjaga dengan saksama dan menaatinya; 'memelihara' lebih kuat daripada sekadar mengingat.
- source_word: לִבֶּךָ
  choice: hatimu
  rationale: Dalam pemikiran Ibrani, hati merupakan pusat pikiran, kehendak, dan sikap batin; terjemahan harfiah ini mempertahankan keluasan maknanya.
theological_decisions:
- issue: Sapaan bergender dalam didikan hikmat
  choice: Mempertahankan bentuk maskulin tunggal sebagai 'Anakku'
  alternative: Anak-Ku atau anakku yang netral menurut konteks pembaca
  rationale: Teks Ibrani secara eksplisit memakai bentuk maskulin tunggal dan mencerminkan pola sastra wejangan ayah kepada anak laki-laki; bentuk itu tidak dinetralkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bersahaja. 'Jangan lupakan' dipilih sebagai larangan yang langsung dan alami; 'hendaklah' mempertahankan daya nasihat pada klausa kedua. Penanda catatan kaki ditempatkan tepat sesudah unsur yang diterangkan.
