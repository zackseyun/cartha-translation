  text: It will be healing to your body and refreshment to your bones[a][b].
translation:
  language: id
  text: Itu akan menjadi kesembuhan bagi tubuhmu[a] dan kesegaran bagi tulang-tulangmu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagi pusarmu.” Kata Ibrani ini dapat secara khusus menunjuk pada pusar, meskipun dalam konteks ini kemungkinan besar melambangkan kesejahteraan jasmani secara lebih luas.
    reason: lexical_alternative
  - marker: b
    text: Atau “kelembapan” atau “minuman” bagi tulang-tulangmu.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִפְאוּת
  choice: kesembuhan
  rationale: Nomina ini menunjuk pada pemulihan kesehatan atau kesembuhan. Pilihan ini mempertahankan gambaran jasmani dan nuansa hasil yang timbul dari nasihat pada ayat sebelumnya.
- source_word: תְּהִי
  choice: akan menjadi
  rationale: Bentuk feminin tunggal ini bersesuaian dengan רִפְאוּת. Dalam konteks, bentuk tersebut paling wajar menyatakan akibat dari tindakan yang dinasihatkan sebelumnya.
- source_word: לְשָׁרֶּךָ
  choice: bagi tubuhmu
  rationale: Kata Ibrani ini secara tradisional dapat menunjuk pada pusar, tetapi dalam konteks ini tampaknya mewakili kesejahteraan jasmani secara lebih luas. 'Tubuhmu' menyampaikan maksud itu secara alami tanpa menghilangkan alternatif harfiahnya, yang dicatat dalam catatan kaki.
- source_word: וְשִׁקּוּי
  choice: dan kesegaran
  rationale: Nomina ini berasal dari gagasan memberi minum atau membasahi. Dalam kesejajaran dengan kesembuhan dan tulang-tulang, 'kesegaran' menyampaikan daya pemulihan sambil mempertahankan citra metaforisnya.
- source_word: לְעַצְמוֹתֶיךָ
  choice: bagi tulang-tulangmu
  rationale: Terjemahan langsung ini mempertahankan gambaran konkret Ibrani; tulang-tulang juga dapat menggambarkan kerangka dan daya hidup seseorang.
