  yaml_path: translation/ot/proverbs/003/024.yaml
  text: If you lie down[a], you will not be afraid; when you lie down, your sleep will be pleasant.
translation:
  language: id
  text: Jika engkau berbaring, engkau tidak akan takut; ketika engkau berbaring, tidurmu akan terasa manis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidurmu akan menyenangkan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Mempertahankan daya dasar partikel kondisional Ibrani, meskipun konteksnya juga menggambarkan keadaan yang umum.
- source_word: תִּשְׁכַּב
  choice: engkau berbaring
  rationale: Secara dekat menerjemahkan verba שׁכב dan dalam konteks ini secara alami menunjuk pada berbaring untuk tidur.
- source_word: לֹא תִפְחָד
  choice: engkau tidak akan takut
  rationale: Menyampaikan jaminan hasil atau keadaan mendatang tanpa mengubahnya menjadi perintah.
- source_word: וְשָׁכַבְתָּ
  choice: ketika engkau berbaring
  rationale: Mengungkapkan nuansa temporal dari kelanjutan kalimat sambil mempertahankan pengulangan yang terdapat dalam bahasa Ibrani.
- source_word: וְעָרְבָה
  choice: akan nyenyak
  rationale: Dalam hubungan dengan tidur, ungkapan Indonesia 'tidurmu akan nyenyak' merupakan padanan alami untuk gagasan tidur yang menyenangkan atau manis.
- source_word: שְׁנָתֶךָ
  choice: tidurmu
  rationale: Padanan langsung, jelas, dan lazim dalam bahasa Indonesia modern.
