translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “engkau” dipakai untuk menjaga nada sastra hikmat, sedangkan dialog tetap alami. Tanda baca memisahkan dua perintah waktu tanpa mengubah hubungan maknanya.
