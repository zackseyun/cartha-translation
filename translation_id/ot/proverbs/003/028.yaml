  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַל תֹּ֘אמַ֤ר ל/רעי/ך לֵ֣ךְ וָ֭/שׁוּב וּ/מָחָ֥ר אֶתֵּ֗ן וְ/יֵ֣שׁ אִתָּֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/028.yaml
  text: Do not say to your neighbor[a], “Go, and come back[b], and tomorrow I will give,” when you have it with you.
translation:
  language: id
  text: Jangan berkata kepada sesamamu, “Pergilah dan datang kembali[a]. Besok akan kuberikan,” padahal engkau memilikinya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kembalilah.”
    reason: lexical_alternative
  - marker: b
    text: Klausa terakhir berarti bahwa orang itu sudah memiliki apa yang diperlukan untuk memberi, sehingga ia tidak seharusnya menunda.
    reason: cultural_note
lexical_decisions:
- source_word: רֵעַ
  choice: sesama
  rationale: Dalam konteks Amsal, kata ini menunjuk kepada orang lain yang berada dalam lingkungan sosial seseorang, tidak harus sahabat akrab. “Sesama” mempertahankan keluasan dan daya etis istilah tersebut.
- source_word: לֵךְ
  choice: Pergilah
  rationale: Bentuk perintah ini sederhana dan langsung; “pergilah” merupakan padanan Indonesia yang alami.
- source_word: שׁוּב
  choice: datang kembali
  rationale: Dalam ucapan langsung kepada orang yang disuruh pergi, “datang kembali” terdengar alami dan mempertahankan gagasan kembali ke tempat pembicara. Alternatif yang lebih ringkas dicatat dalam catatan kaki.
- source_word: מָחָר
  choice: Besok
  rationale: Ini adalah keterangan waktu biasa tanpa nuansa khusus yang perlu diperluas.
- source_word: אֶתֵּן
  choice: akan kuberikan
  rationale: Kata kerja “memberi” diterjemahkan langsung, sedangkan benda yang diberikan tetap tidak disebutkan secara eksplisit sebagaimana dalam bahasa Ibrani.
- source_word: יֵשׁ אִתָּךְ
  choice: padahal engkau memilikinya
  rationale: Ungkapan ini menyatakan bahwa sesuatu yang dapat diberikan itu sudah tersedia pada orang tersebut. “Padahal” menampilkan pertentangan moral dalam konteks, dan “memilikinya” merupakan ungkapan Indonesia yang alami.
- source_word: אַל
  choice: Jangan
  rationale: Larangan Ibrani ini cukup dinyatakan dengan “jangan” tanpa menambahkan penekanan seperti “jangan pernah”.
