  text: Do not withhold good from those to whom it is due when it is in your power to do it[a][b].
translation:
  language: id
  text: Jangan menahan kebaikan dari orang yang berhak menerimanya, apabila engkau mampu melakukannya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari pemiliknya”; maksudnya dapat menunjuk kepada orang yang mempunyai hak atas kebaikan itu.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “ketika ada kuasa pada tanganmu untuk melakukannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּמְנַע
  choice: Jangan menahan
  rationale: Partikel larangan אַל dan verba מנע menyatakan larangan untuk menahan atau tidak memberikan sesuatu; ungkapan ini alami dan tetap dekat dengan bentuk Ibrani.
- source_word: טוֹב
  choice: kebaikan
  rationale: Kata ini sengaja bermakna luas, mencakup hal yang baik, manfaat, atau pertolongan tanpa membatasinya pada satu jenis tindakan.
- source_word: מִבְּעָלָיו
  choice: dari orang yang berhak menerimanya
  rationale: Secara harfiah berarti 'dari pemiliknya', tetapi dalam konstruksi ini menunjuk kepada orang yang mempunyai hak atau klaim atas kebaikan tersebut. Terjemahan utama menyampaikan makna idiomatis, sedangkan bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: בִּהְיוֹת
  choice: apabila
  rationale: Infinitif היה dengan prefiks ב menyatakan keadaan atau waktu; 'apabila' secara wajar menghubungkan kewajiban itu dengan adanya kemampuan untuk bertindak.
- source_word: לְאֵל יָדֶךָ
  choice: engkau mampu
  rationale: Ungkapan harfiah tentang 'kuasa tanganmu' merupakan idiom bagi kemampuan atau kuasa seseorang. Terjemahan utama menyampaikan maknanya dalam bahasa Indonesia modern.
- source_word: לַעֲשׂוֹת
  choice: melakukannya
  rationale: Verba עשה berarti 'melakukan/mengerjakan'; akhiran '-nya' secara alami merujuk pada pemberian kebaikan yang disebut sebelumnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hikmat. Sapaan tunggal 'engkau' mempertahankan bentuk orang kedua tunggal dalam bahasa Ibrani. Makna luas 'kebaikan' serta gambaran harfiah tentang pemilik dan kuasa tangan dijaga melalui catatan kaki.
