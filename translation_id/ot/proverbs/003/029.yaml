translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hikmat yang ringkas dan bermartabat. Struktur larangan dipertahankan, sedangkan susunan klausa dibuat alami bagi pembaca umum. Penanda catatan kaki [a] hadir dalam teks utama.
