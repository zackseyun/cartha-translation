  terminology: “Sesamamu” sesuai untuk cakupan etis רֵעֲךָ, tanpa membatasi maknanya pada sahabat akrab. “Kejahatan” dapat mewakili רָעָה dalam larangan ini, sedangkan catatan kaki dengan tepat menyediakan alternatif yang lebih konkret, “mencelakakan.”
