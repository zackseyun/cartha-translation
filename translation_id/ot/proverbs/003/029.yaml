  source_fidelity: Teks Indonesia secara setia mencerminkan larangan Ibrani untuk tidak merancang רָעָה terhadap רֵעַ seseorang, dengan arah permusuhan yang tepat dalam “terhadap sesamamu.” “Tinggal dengan aman bersamamu” menerjemahkan יוֹשֵׁב לָבֶטַח אִתָּךְ tanpa mempersempit אִתָּךְ hanya pada kedekatan fisik.
