  text: אַל תַּחֲרֹ֣שׁ עַל רֵעֲ/ךָ֣ רָעָ֑ה וְ/הֽוּא יוֹשֵׁ֖ב לָ/בֶ֣טַח אִתָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/029.yaml
  text: Do not devise harm against your neighbor while he dwells securely with you[a].
translation:
  language: id
  text: Jangan merencanakan kejahatan terhadap sesamamu, ketika ia tinggal dengan aman bersamamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Jangan merancang untuk mencelakakan sesamamu, ketika ia tinggal dengan tenteram di dekatmu.”'
    reason: Alternatif ini menampilkan nuansa konkret רָעָה sebagai tindakan mencelakakan, תַּחֲרֹשׁ sebagai merancang, dan kemungkinan nuansa kedekatan pada אִתָּךְ.
lexical_decisions:
- source_word: תַּחֲרֹשׁ
  choice: merencanakan
  rationale: Dalam ungkapan ini, חרשׁ berarti merancang atau merencanakan sesuatu, bukan secara harfiah 'membajak'. 'Merencanakan' menyampaikan unsur kesengajaan batin secara alami dalam bahasa Indonesia.
- source_word: עַל
  choice: terhadap
  rationale: Bersama חרשׁ רעה, preposisi ini menunjukkan arah permusuhan kepada sasaran tindakan; 'terhadap' merupakan padanan Indonesia yang wajar.
- source_word: רֵעֲךָ
  choice: sesamamu
  rationale: רֵעַ dapat berarti kawan, sahabat, atau orang dekat. Dalam nasihat etis ini, 'sesamamu' mempertahankan cakupan sosial-moral tanpa mengharuskan adanya persahabatan akrab.
- source_word: רָעָה
  choice: kejahatan
  rationale: רָעָה dapat menunjuk pada kejahatan atau hal buruk yang dirancang terhadap orang lain. 'Kejahatan' mempertahankan bobot moral istilah Ibrani, sedangkan 'mencelakakan' menjadi alternatif yang lebih konkret.
- source_word: יוֹשֵׁב
  choice: tinggal
  rationale: Partisipel ישׁב menunjukkan keadaan menetap atau berdiam yang berkelanjutan. 'Tinggal' alami dalam bahasa Indonesia modern dan dekat dengan makna sumber.
- source_word: לָבֶטַח
  choice: dengan aman
  rationale: בֶּטַח menyatakan keamanan atau keadaan tanpa rasa terancam. 'Dengan aman' mempertahankan fungsi adverbialnya dan tidak memaksakan nuansa 'percaya' yang hanya tersirat oleh konteks.
- source_word: אִתָּךְ
  choice: bersamamu
  rationale: אִתָּךְ secara langsung berarti 'denganmu/bersamamu' dan dapat mencakup kedekatan tempat maupun pergaulan. 'Bersamamu' mempertahankan keluasan ini tanpa mempersempitnya menjadi sekadar 'di dekatmu'.
