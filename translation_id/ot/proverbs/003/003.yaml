source:
  edition: WLC
  text: חֶ֥סֶד וֶ/אֱמֶ֗ת אַֽל יַעַ֫זְבֻ֥/ךָ קָשְׁרֵ֥/ם עַל גַּרְגְּרוֹתֶ֑י/ךָ כָּ֝תְבֵ֗/ם עַל ל֥וּחַ לִבֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/003.yaml
  text: Let steadfast love and faithfulness not forsake you[a]; bind them around your neck; write them on the tablet of your heart.
translation:
  language: id
  text: Janganlah kasih setia dan kesetiaan meninggalkanmu[a]; ikatkanlah keduanya pada lehermu; tuliskanlah keduanya pada loh hatimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “belas kasih dan kebenaran.” Pasangan kata Ibrani ini sering menyatakan kasih yang loyal dan sifat dapat dipercaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: kasih setia
  rationale: Ungkapan ini mencakup kasih yang diwujudkan dalam loyalitas dan kebaikan yang teguh; lebih utuh daripada sekadar “kebaikan” atau “belas kasih”.
- source_word: אֱמֶת
  choice: kesetiaan
  rationale: Dalam pasangan חֶסֶד וֶאֱמֶת, kata ini terutama menunjuk pada sifat dapat dipercaya dan teguh, bukan hanya kebenaran dalam arti gagasan yang benar.
- source_word: אַל יַעַזְבֻךָ
  choice: Janganlah ... meninggalkanmu
  rationale: Susunan ini mempertahankan kedua sifat tersebut sebagai subjek yang dipersonifikasikan sekaligus menyampaikan daya nasihat dari konstruksi Ibrani.
- source_word: קָשְׁרֵם
  choice: ikatkanlah keduanya
  rationale: Kata perintah konkret ini menggambarkan tindakan sengaja untuk terus melekatkan dan mengingat kedua sifat tersebut.
- source_word: גַּרְגְּרוֹתֶיךָ
  choice: pada lehermu
  rationale: Walaupun dapat menunjuk pada daerah tenggorokan atau leher, konteksnya menggambarkan sesuatu yang diikat dan dikenakan pada leher.
- source_word: כָּתְבֵם
  choice: tuliskanlah keduanya
  rationale: Pilihan ini mempertahankan gambaran penulisan sebagai tindakan menghayati kedua sifat itu secara mendalam.
- source_word: לוּחַ לִבֶּךָ
  choice: loh hatimu
  rationale: “Loh” mempertahankan gambaran konkret tentang permukaan tempat menulis, sedangkan “hati” menunjuk pada batin, pikiran, dan kehendak.
theological_decisions:
- issue: Penerjemahan pasangan חֶסֶד וֶאֱמֶת
  choice: kasih setia dan kesetiaan
  alternative: belas kasih dan kebenaran
  rationale: Pilihan utama menyampaikan dimensi relasional berupa loyalitas penuh kasih dan sifat dapat dipercaya tanpa membatasi ungkapan itu pada suatu rumusan doktrinal tertentu. Alternatif tradisional tetap dicatat karena kedua kata Ibrani memiliki rentang makna tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “janganlah,” “ikatkanlah,” dan “tuliskanlah” menjaga nada nasihat hikmat; “loh hatimu” mempertahankan metafora sumber tanpa menjadi sukar dipahami.
