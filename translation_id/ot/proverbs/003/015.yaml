  text: יְקָ֣רָה הִ֭יא מ/פניים וְ/כָל חֲ֝פָצֶ֗י/ךָ לֹ֣א יִֽשְׁווּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/015.yaml
  text: She is more precious than jewels[a], and none of your delights can compare with her.
translation:
  language: id
  text: Ia lebih berharga daripada permata[a], dan tidak ada satu pun dari segala yang kauinginkan yang sebanding dengannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “batu delima”; kata Ibrani ini mungkin secara lebih umum menunjuk kepada batu-batu berharga atau permata, dan jenis tepatnya tidak dapat dipastikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקָרָה
  choice: lebih berharga
  rationale: Kata sifat ini menyatakan nilai atau keberhargaan yang tinggi; preposisi perbandingan מִן menuntut bentuk komparatif “lebih berharga daripada” dalam bahasa Indonesia.
- source_word: הִיא
  choice: Ia
  rationale: Pronomina feminin tunggal ini merujuk kepada hikmat yang dipersonifikasikan dalam konteks. Bahasa Indonesia tidak membedakan gender pada pronomina, tetapi “Ia” tetap mempertahankan rujukan personal dengan ragam yang bermartabat.
- source_word: מִפְּנִינִים
  choice: daripada permata
  rationale: Jenis benda berharga yang dimaksud oleh פְּנִינִים tidak dapat dipastikan. “Permata” menyampaikan makna umumnya tanpa membatasi kata itu pada batu delima, mutiara, atau batu karang.
- source_word: וְכָל חֲפָצֶיךָ
  choice: dan segala sesuatu yang kauinginkan
  rationale: חֵפֶץ dapat menunjuk kepada apa yang diinginkan atau dianggap menyenangkan. Ungkapan ini mempertahankan cakupan כָּל dan lebih jelas menunjuk kepada hal-hal yang diinginkan, bukan hanya hasrat batin.
- source_word: לֹא יִשְׁווּ בָהּ
  choice: tidak sebanding dengannya
  rationale: שׁוה di sini berarti menyamai atau memiliki nilai yang setara, sedangkan בָּהּ menandai pihak yang dibandingkan. “Tidak sebanding dengannya” alami dalam bahasa Indonesia dan mempertahankan perbandingan tersebut.
theological_decisions:
- issue: Personifikasi hikmat dalam bentuk feminin
  choice: Menggunakan pronomina personal “Ia” yang merujuk kepada hikmat
  alternative: Mengulang “hikmat” atau memakai “itu”
  rationale: Teks Ibrani memakai pronomina feminin karena hikmat dipersonifikasikan dan kata חָכְמָה berjenis feminin. Karena bahasa Indonesia tidak memiliki pronomina bergender, “Ia” mempertahankan sifat personal tanpa menambahkan identifikasi teologis yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kauinginkan” dipilih sebagai sapaan orang kedua tunggal yang ringkas dan alami. Susunan “segala sesuatu ... tidak sebanding” mempertahankan bentuk menyeluruh yang dinegasikan dalam bahasa Ibrani sekaligus tetap jelas bagi pembaca umum.
