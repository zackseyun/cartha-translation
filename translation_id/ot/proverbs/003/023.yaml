  text: אָ֤ז תֵּלֵ֣ךְ לָ/בֶ֣טַח דַּרְכֶּ֑/ךָ וְ֝/רַגְלְ/ךָ֗ לֹ֣א תִגּֽוֹף׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/023.yaml
  text: Then you will walk securely on your way[a], and your foot will not stumble.
translation:
  language: id
  text: Maka engkau akan berjalan dengan aman[a] di jalanmu, dan kakimu tidak akan tersandung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “dalam keadaan aman.” Ungkapan Ibrani ini menekankan keamanan atau keselamatan dalam perjalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Maka
  rationale: Menandai hasil atau konsekuensi dari nasihat sebelumnya; “maka” alami dalam bahasa Indonesia dan tetap mempertahankan hubungan urutannya.
- source_word: תֵּלֵךְ
  choice: engkau akan berjalan
  rationale: Kata הלך berarti berjalan atau pergi. “Berjalan” mempertahankan gambaran perjalanan hidup yang khas dalam sastra hikmat.
- source_word: לָבֶטַח
  choice: dengan aman
  rationale: Bentuk adverbial ini menyatakan keadaan aman atau terlindung, bukan terutama perasaan percaya diri. “Dengan aman” jelas dan wajar dalam bahasa Indonesia.
- source_word: דַּרְכֶּךָ
  choice: di jalanmu
  rationale: דֶּרֶךְ dapat menunjuk pada jalan secara harfiah maupun cara hidup secara kiasan; “jalanmu” mempertahankan kedua kemungkinan tersebut.
- source_word: וְרַגְלְךָ
  choice: dan kakimu
  rationale: Teks Ibrani memakai bentuk tunggal dengan akhiran orang kedua tunggal; bentuk tunggal “kakimu” mempertahankan gambaran sumber.
- source_word: לֹא תִגּוֹף
  choice: tidak akan tersandung
  rationale: Dalam konteks berjalan, נגף menggambarkan kaki yang membentur sesuatu sehingga orang tersandung. Terjemahan ini alami sekaligus mempertahankan citranya.
theological_decisions: []
