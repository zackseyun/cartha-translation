  yaml_path: translation/ot/proverbs/003/006.yaml
  text: In all your ways acknowledge him[a], and he will make your paths straight.
translation:
  language: id
  text: Dalam segala jalanmu, akuilah Dia, dan Dia akan meluruskan jalan-jalanmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dia akan mengarahkan jalan-jalanmu.” Secara lebih harfiah, bahasa Ibrani mengatakan bahwa Dia akan membuat jalan-jalanmu lurus.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל
  choice: Dalam segala
  rationale: Gabungan preposisi ב dengan כָּל menyatakan cakupan menyeluruh. “Dalam segala” terdengar wajar dan bermartabat dalam bahasa Indonesia serta mempertahankan arti totalnya.
- source_word: דְּרָכֶיךָ
  choice: jalanmu
  rationale: דֶּרֶךְ dapat menunjuk pada jalan harfiah maupun cara hidup. Bentuk tunggal kolektif “jalanmu” alami dalam bahasa Indonesia dan tetap mempertahankan keluasan metaforanya.
- source_word: דָעֵהוּ
  choice: kenallah Dia
  rationale: Imperatif יָדַע dengan sufiks orang ketiga maskulin tunggal secara harfiah berarti “kenallah dia” dan dalam konteks ini mencakup pengenalan relasional serta kesadaran aktif akan Allah dalam seluruh kehidupan. Pilihan ini tidak mempersempit makna menjadi pengakuan lisan semata.
- source_word: וְהוּא
  choice: dan Dia
  rationale: Konjungsi dan pronomina mandiri menyebut subjek secara tegas. Huruf kapital memperjelas bahwa pronomina itu merujuk kepada Allah, tanpa menambahkan penekanan yang tidak ada dalam teks.
- source_word: יְיַשֵּׁר
  choice: akan meluruskan
  rationale: Bentuk Piel dari יָשַׁר berarti membuat lurus atau meratakan. “Akan meluruskan” mempertahankan gambaran Ibrani dan tidak menggantinya dengan penafsiran yang lebih sempit seperti “akan menunjukkan arah”.
- source_word: אֹרְחֹתֶיךָ
  choice: jalan-jalanmu
  rationale: אֹרַח berarti jalan atau lintasan, baik secara harfiah maupun kiasan. Bentuk ulang menampilkan jamak Ibrani dan mempertahankan metafora tentang berbagai lintasan kehidupan.
theological_decisions:
- issue: Sifat tindakan Allah terhadap jalan manusia
  choice: Dia akan meluruskan jalan-jalanmu
  alternative: Dia akan mengarahkan jalan-jalanmu
  rationale: Teks Ibrani menggambarkan Allah membuat lintasan menjadi lurus, bukan hanya memberi petunjuk arah. Terjemahan utama mempertahankan gambaran dan janji tersebut, sedangkan kemungkinan makna “mengarahkan” dicatat sebagai penafsiran yang lazim.
- issue: Makna perintah untuk mengetahui Allah
  choice: kenallah Dia
  alternative: akuilah Dia
  rationale: “Kenallah Dia” lebih dekat dengan bentuk leksikal יָדַע dan menjaga cakupan relasionalnya. “Akuilah Dia” dapat menyampaikan penerapan kontekstual, tetapi berisiko dipahami hanya sebagai pengakuan verbal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas, puitis, dan bermartabat. Paralelisme serta metafora jalan dipertahankan; “Dia” memakai huruf kapital untuk rujukan ilahi.
