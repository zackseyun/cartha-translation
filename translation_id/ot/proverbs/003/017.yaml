source:
  edition: WLC
  text: דְּרָכֶ֥י/הָ דַרְכֵי נֹ֑עַם וְֽ/כָל נְתִ֖יבוֹתֶ֣י/הָ שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/017.yaml
  text: Her ways are ways of pleasantness[a], and all her paths are peace.
translation:
  language: id
  text: Jalan-jalannya adalah jalan yang menyenangkan, dan semua lintasannya adalah damai sejahtera.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “kesejahteraan” atau “keutuhan” untuk “damai sejahtera” (Ibrani: shalom).'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכֶיהָ
  choice: jalan-jalannya
  rationale: דֶּרֶךְ dapat berarti jalan secara konkret maupun cara hidup secara kiasan. Bentuk dengan akhiran pronominal diterjemahkan dengan “-nya”, yang secara alami merujuk kembali kepada hikmat tanpa menambahkan gender yang tidak ditandai dalam bahasa Indonesia.
- source_word: דַרְכֵי
  choice: jalan
  rationale: Bentuk konstruksi ini mengulangi דֶּרֶךְ. Pengulangan “jalan-jalannya adalah jalan” dipertahankan sejauh masih wajar dalam bahasa Indonesia agar penekanan dan susunan puitis Ibrani tidak hilang.
- source_word: נֹעַם
  choice: yang menyenangkan
  rationale: נֹעַם menunjuk pada kesenangan, keelokan, atau sifat yang menyukakan. Ungkapan adjektival ini terdengar alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi kenikmatan indrawi.
- source_word: וְכָל
  choice: dan semua
  rationale: Terjemahan ini mempertahankan kata sambung serta cakupan menyeluruh dari כָּל.
- source_word: נְתִיבוֹתֶיהָ
  choice: lintasannya
  rationale: נְתִיבָה berarti lintasan atau jalan setapak dan menjadi pasangan puitis bagi דֶּרֶךְ. “Lintasan” mempertahankan variasi citra jalan dalam baris kedua.
- source_word: שָׁלוֹם
  choice: damai sejahtera
  rationale: שָׁלוֹם mencakup kedamaian, kesejahteraan, keadaan utuh, dan ketenteraman. “Damai sejahtera” merupakan ungkapan Indonesia yang alami dan cukup luas untuk membawa lebih dari sekadar ketiadaan konflik.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Paralelisme serta pengulangan sumber dipertahankan tanpa membuat kalimat terlalu kaku. Penanda catatan kaki ditempatkan sesudah “damai sejahtera” karena catatan menerangkan שָׁלוֹם.
