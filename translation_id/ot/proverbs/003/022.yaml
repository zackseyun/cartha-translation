  text: and they will be life to your soul and grace to your neck[a][b].
translation:
  language: id
  text: maka semuanya itu akan menjadi kehidupan bagi jiwamu[a] dan keanggunan bagi lehermu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani untuk “jiwa” juga dapat berarti hidup, diri, atau batin seseorang.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “keanggunan” juga dapat berarti perkenanan, anugerah, atau pesona. Ungkapan ini memakai gambaran sesuatu yang menghiasi leher.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִהְיוּ
  choice: maka semuanya itu akan menjadi
  rationale: Bentuk imperfek Qal orang ketiga jamak merujuk pada hikmat dan kebijaksanaan dalam ayat sebelumnya. Dalam konteks, bentuk ini paling wajar dipahami sebagai pernyataan hasil; “semuanya itu” memperjelas rujukan jamaknya dalam bahasa Indonesia.
- source_word: חַיִּים
  choice: kehidupan
  rationale: Walaupun bentuk Ibraninya jamak, kata ini lazim berfungsi sebagai nomina abstrak yang berarti kehidupan.
- source_word: לְנַפְשֶׁךָ
  choice: bagi dirimu
  rationale: נֶפֶשׁ dapat berarti nyawa, kehidupan, diri, atau batin. “Dirimu” alami dalam bahasa Indonesia dan mempertahankan cakupan yang menyeluruh tanpa membatasinya pada jiwa sebagai bagian nonjasmani.
- source_word: וְחֵן
  choice: dan perhiasan indah
  rationale: חֵן mencakup keelokan, daya tarik, dan sesuatu yang mendatangkan perkenanan. Bersama gambaran leher, ungkapan ini menyatakan kualitas yang menghiasi seseorang; “perhiasan indah” menyampaikan metafora tersebut secara alami.
- source_word: לְגַרְגְּרֹתֶיךָ
  choice: pada lehermu
  rationale: Kata ini menunjuk daerah tenggorokan atau leher. Dalam gambaran tentang sesuatu yang dikenakan sebagai hiasan, “leher” merupakan padanan Indonesia yang paling wajar.
theological_decisions:
- issue: Cakupan antropologis נֶפֶשׁ
  choice: dirimu
  alternative: jiwamu; nyawamu
  rationale: Terjemahan ini tidak memaksakan dikotomi tubuh-jiwa dan tetap membuka cakupan kata Ibrani yang dapat menunjuk pada diri atau kehidupan seseorang.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Paralelisme kedua larik dipertahankan, sedangkan metafora hiasan pada leher dibuat jelas tanpa menghilangkan alternatif harfiahnya dalam catatan kaki.
