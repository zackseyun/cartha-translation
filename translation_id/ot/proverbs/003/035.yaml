  text: כָּ֭בוֹד חֲכָמִ֣ים יִנְחָ֑לוּ וּ֝/כְסִילִ֗ים מֵרִ֥ים קָלֽוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/035.yaml
  text: The wise will inherit honor, but fools lift up disgrace.
translation:
  language: id
  text: Orang bijak akan mewarisi kehormatan, tetapi orang bodoh meninggikan kehinaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani ini secara harfiah dapat dipahami sebagai “orang bodoh meninggikan kehinaan”; sebagian orang memahami bentuk katanya sebagai “kehinaan meninggikan orang bodoh.”
    reason: Konstruksi bagian kedua sulit dan memungkinkan analisis gramatikal yang berbeda; catatan mempertahankan ambiguitas sumber.
lexical_decisions:
- source_word: כָּבוֹד
  choice: kehormatan
  rationale: Menyampaikan makna kemuliaan, kehormatan, atau martabat yang menjadi bagian orang bijak dalam konteks ini.
- source_word: חֲכָמִים
  choice: orang bijak
  rationale: Padanan alami bagi bentuk jamak yang menunjuk kepada mereka yang memiliki hikmat.
- source_word: יִנְחָלוּ
  choice: akan mewarisi
  rationale: Mempertahankan citra memperoleh sesuatu sebagai milik atau bagian warisan.
- source_word: כְסִילִים
  choice: orang bodoh
  rationale: Padanan baku dalam sastra hikmat bagi orang yang menolak hikmat, bukan sekadar kurang cerdas.
- source_word: מֵרִים
  choice: meninggikan
  rationale: Mencerminkan bentuk partisip dari רום, 'mengangkat/meninggikan', tanpa menggantinya dengan gagasan 'menanggung'.
- source_word: קָלוֹן
  choice: kehinaan
  rationale: Menyatakan aib atau keadaan tercela sebagai kebalikan dari kehormatan.
theological_decisions:
- issue: Hubungan orang bodoh dengan kehinaan dalam frasa וּכְסִילִים מֵרִים קָלוֹן
  choice: orang bodoh meninggikan kehinaan
  alternative: kehinaan meninggikan orang bodoh / orang bodoh memperoleh kehinaan
  rationale: Teks Masoret secara harfiah menempatkan 'orang bodoh' bersama bentuk 'meninggikan' dan 'kehinaan'. Terjemahan utama mempertahankan susunan dan ketegangan metaforisnya; kemungkinan analisis alternatif dicatat tanpa menetapkan penafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bernada sastra hikmat. Paralel antara “kehormatan” dan “kehinaan” serta citra “mewarisi” dan “meninggikan” dipertahankan.
