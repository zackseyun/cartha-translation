  text: בְּטַ֣ח אֶל יְ֭הוָה בְּ/כָל לִבֶּ֑/ךָ וְ/אֶל בִּֽ֝ינָתְ/ךָ֗ אַל תִּשָּׁעֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/005.yaml
  text: Trust in Yahweh with all your heart[a], and do not lean on your own understanding.
translation:
  language: id
  text: Percayalah kepada Yahweh dengan segenap hatimu, dan jangan bersandar[a] pada pengertianmu sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jangan mengandalkan pengertianmu sendiri.” Kata kerja Ibrani ini secara harfiah berarti “bersandar” atau “menopang diri” pada sesuatu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטַח
  choice: Percayalah
  rationale: Bentuk imperatif orang kedua tunggal maskulin dari בטח menyampaikan perintah langsung untuk menaruh kepercayaan. “Percayalah” alami, ringkas, dan mempertahankan gagasan ketergantungan relasional.
- source_word: אֶל יְהוָה
  choice: kepada Yahweh
  rationale: Dengan verba בטח, אֶל menyatakan arah atau sasaran kepercayaan; “percaya kepada” merupakan ungkapan Indonesia yang alami. Nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks tetap tampak.
- source_word: בְּכָל לִבֶּךָ
  choice: dengan segenap hatimu
  rationale: Ungkapan ini menyatakan totalitas manusia batiniah. “Segenap hati” merupakan padanan Indonesia yang wajar dan cukup luas untuk mencakup pikiran, kehendak, dan perasaan, tanpa mempersempit לֵב pada emosi saja.
- source_word: וְאֶל בִּינָתְךָ
  choice: dan ... pada pengertianmu sendiri
  rationale: בִּינָה menunjuk pada pengertian, pemahaman, atau daya membedakan. “Pengertianmu sendiri” membuat sufiks posesif dan kontras dengan kepercayaan kepada Yahweh terdengar alami dalam bahasa Indonesia.
- source_word: אַל תִּשָּׁעֵן
  choice: jangan bersandar
  rationale: אַל dengan bentuk verba berikutnya menyatakan larangan. Nifal dari שׁען secara konkret berarti bersandar atau menopang diri pada sesuatu; “jangan bersandar” mempertahankan metafora Ibraninya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. Transliterasi “Yahweh” mempertahankan nama pribadi yang tampil dalam sumber, bukan menggantinya dengan gelar.
- issue: Hubungan antara percaya kepada Yahweh dan pengertian manusia
  choice: Mempertahankan dua perintah yang disejajarkan tanpa menambahkan penjelasan
  alternative: Menafsirkan ayat sebagai larangan memakai akal atau pengertian sama sekali
  rationale: Teks melarang menjadikan pengertian sendiri sebagai sandaran, tetapi tidak secara eksplisit menolak penggunaan pengertian. Terjemahan tidak memperluas larangan melampaui bentuk Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Segenap hatimu” dipilih sebagai ungkapan yang mudah dipahami sekaligus mempertahankan cakupan antropologis “hati” dalam sastra hikmat. Metafora “bersandar” dipertahankan dalam teks utama, sedangkan padanan maknawi “mengandalkan” dicatat dalam catatan kaki.
