  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַשְׁרֵ֣י אָ֭דָם מָצָ֣א חָכְמָ֑ה וְ֝/אָדָ֗ם יָפִ֥יק תְּבוּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/013.yaml
  text: Blessed is the man who finds wisdom[a], and the man who obtains understanding.
translation:
  language: id
  text: Berbahagialah orang yang menemukan hikmat, dan orang yang memperoleh pengertian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Ungkapan pembuka ucapan bahagia ini menyatakan keadaan yang patut dianggap sangat baik dan didambakan. “Berbahagialah” alami, ringkas, dan tetap bernada luhur dalam sastra hikmat.
- source_word: אָדָם
  choice: orang
  rationale: Di sini אָדָם dipakai secara tunggal dan generik untuk manusia mana pun. Bahasa Indonesia “orang” secara alami mempertahankan cakupan universal tanpa menambahkan jenis kelamin yang tidak dinyatakan secara leksikal oleh kata ini.
- source_word: מָצָא
  choice: menemukan
  rationale: Bentuk qatal dalam ucapan hikmat ini menyampaikan kebenaran umum; bentuk Indonesia “menemukan” cocok untuk pembacaan gnomic dan mempertahankan gambaran memperoleh sesuatu yang dicari atau dijumpai.
- source_word: חָכְמָה
  choice: hikmat
  rationale: “Hikmat” adalah padanan baku dan tepat bagi istilah utama חָכְמָה dalam kitab Amsal.
- source_word: וְאָדָם
  choice: dan orang
  rationale: Pengulangan “orang” mempertahankan kesejajaran kedua bagian kalimat Ibrani.
- source_word: יָפִיק
  choice: memperoleh
  rationale: Dalam kesejajaran dengan “menemukan hikmat”, kata kerja ini paling wajar dipahami sebagai berhasil mendapatkan atau memperoleh pengertian. “Memperoleh” tetap membuka nuansa hasil aktif tanpa memakai ungkapan Indonesia yang janggal.
- source_word: תְּבוּנָה
  choice: pengertian
  rationale: “Pengertian” merupakan padanan lazim bagi תְּבוּנָה dan berpasangan secara alami dengan “hikmat” dalam puisi kebijaksanaan.
theological_decisions:
- issue: Cakupan generik אָדָם dalam ucapan bahagia hikmat
  choice: Menerjemahkan dengan “orang” sebagai sebutan generik bagi siapa pun
  alternative: “laki-laki” atau “manusia”
  rationale: אָדָם di sini merujuk secara representatif kepada setiap manusia, bukan secara khusus kepada laki-laki. “Orang” menyampaikan cakupan itu secara tepat dan alami dalam bahasa Indonesia tanpa menghapus unsur makna yang ada dalam sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur paralel Ibrani dipertahankan melalui pengulangan “orang”, sedangkan “Berbahagialah” menjaga corak ucapan bahagia dalam sastra hikmat.
