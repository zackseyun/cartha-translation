  yaml_path: translation/ot/proverbs/003/026.yaml
  text: For Yahweh will be your confidence[a], and he will keep your foot from being caught.
translation:
  language: id
  text: Sebab Yahweh akan menjadi keyakinanmu[a] dan menjaga kakimu agar tidak terjerat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan berada di sisimu”; ungkapan Ibrani ini dapat dipahami secara lebih harfiah, meskipun di sini kemungkinan besar dipakai secara kiasan dengan arti keyakinan atau rasa aman.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan yang mendasari nasihat dan janji sebelumnya; bentuk ini ringkas serta alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה, bukan menggantinya dengan sebuah gelar.
- source_word: יִהְיֶה בְכִסְלֶךָ
  choice: akan menjadi keyakinanmu
  rationale: כֶּסֶל dapat menunjuk secara harfiah pada pinggang/sisi tubuh atau secara kiasan pada keyakinan dan rasa aman. Dalam konteks perlindungan ilahi, makna kiasan paling sesuai, sementara alternatif harfiahnya dipertahankan dalam catatan kaki.
- source_word: וְשָׁמַר
  choice: dan menjaga
  rationale: Menyampaikan tindakan melindungi atau mengawasi secara alami dan ringkas.
- source_word: רַגְלְךָ
  choice: kakimu
  rationale: Mempertahankan bentuk tunggal Ibrani dan gambaran konkret tentang kaki seseorang.
- source_word: מִלָּכֶד
  choice: agar tidak tertangkap
  rationale: Mengungkapkan pencegahan terhadap keadaan tertangkap atau terjerat tanpa menambahkan benda konkret seperti 'perangkap', yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri; transliterasi 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Arti בְכִסְלֶךָ
  choice: menjadi keyakinanmu
  alternative: berada di sisimu
  rationale: Konteks menjadikan Yahweh dasar keamanan pembaca, tetapi ungkapan Ibrani memungkinkan pemahaman yang lebih harfiah; ambiguitas itu dicatat, bukan dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hikmat yang ringkas dan bermartabat. Susunan kalimat mempertahankan hubungan alasan, nama ilahi, serta gambaran kaki yang terhindar dari jerat.
