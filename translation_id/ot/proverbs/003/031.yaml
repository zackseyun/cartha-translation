  yaml_path: translation/ot/proverbs/003/031.yaml
  text: Do not envy a violent man[a], and do not choose any of his ways.
translation:
  language: id
  text: Jangan iri kepada orang yang melakukan kekerasan,[a] dan jangan memilih satu pun dari jalan-jalannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jangan cemburu terhadap orang yang melakukan kekerasan.” Kata kerja Ibrani yang digunakan dapat menyatakan rasa iri atau cemburu, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: Jangan iri
  rationale: אַל dengan bentuk imperfek menyatakan larangan, sedangkan קנא di sini menunjuk pada rasa iri terhadap orang lain. Ungkapan ini alami dan langsung dalam bahasa Indonesia.
- source_word: בְּאִישׁ חָמָס
  choice: kepada orang yang suka melakukan kekerasan
  rationale: Secara harfiah frasa ini berarti 'orang kekerasan'. Bentuk deskriptif ini menyampaikan bahwa orang tersebut bercirikan tindakan kekerasan atau kelaliman, tanpa membatasi maknanya pada satu tindakan saja.
- source_word: וְאַל תִּבְחַר
  choice: dan jangan memilih
  rationale: Konjungsi mempertahankan kesejajaran kedua larangan, dan בחר secara langsung berarti memilih.
- source_word: בְּכָל דְּרָכָיו
  choice: satu pun dari jalan-jalannya
  rationale: Dalam konteks larangan, כָּל dapat dinyatakan secara idiomatis sebagai 'satu pun'. 'Jalan-jalan' mempertahankan metafora hikmat bagi pola hidup atau perilaku.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk 'orang' dipilih karena אִישׁ di sini menggambarkan tipe manusia secara umum. Metafora 'jalan-jalannya' dipertahankan sebagai ungkapan khas sastra hikmat.
