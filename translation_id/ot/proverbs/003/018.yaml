  yaml_path: translation/ot/proverbs/003/018.yaml
  text: She is a tree of life to those who take hold of her[b][a], and those who hold her fast are blessed.
translation:
  language: id
  text: Ia adalah pohon kehidupan bagi mereka yang berpegang padanya[b], dan mereka yang memegangnya erat-erat berbahagia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan mereka yang menopangnya berbahagia.” Kata kerja Ibrani dapat berarti “menopang”, “memegang teguh”, atau “memegang erat”.
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa Ibrani, kata ganti feminin ini merujuk kepada hikmat yang dipersonifikasikan dalam konteks sekitarnya.
    reason: cultural_note
lexical_decisions:
- source_word: עֵץ חַיִּים
  choice: pohon kehidupan
  rationale: Frasa konstruksi ini secara harfiah berarti 'pohon kehidupan'. Bentuk tanpa artikel dipertahankan secara alami dalam bahasa Indonesia dan tidak disamakan secara eksplisit dengan pohon tertentu di Eden.
- source_word: הִיא
  choice: Ia adalah
  rationale: Pronomina feminin tunggal merujuk kepada hikmat yang dipersonifikasikan. 'Ia' mempertahankan personifikasi secara wajar tanpa menandai gender gramatikal yang tidak dimiliki bahasa Indonesia.
- source_word: לַמַּחֲזִיקִים בָּהּ
  choice: bagi mereka yang berpegang padanya
  rationale: Ungkapan ini menyampaikan tindakan menggenggam atau berpegang pada hikmat. 'Berpegang padanya' konkret, alami, dan sesuai dengan nada nasihat.
- source_word: וְתֹמְכֶיהָ
  choice: dan mereka yang memegangnya erat-erat
  rationale: Kata תמך dapat berarti menopang, mempertahankan, atau memegang erat. Dalam kesejajaran dengan klausa sebelumnya, pilihan ini menyampaikan keterikatan yang teguh sambil mencatat kemungkinan makna lain.
- source_word: מְאֻשָּׁר
  choice: diberkati
  rationale: Bentuk ini menggambarkan keadaan bahagia, mujur, atau patut disebut berbahagia. 'Diberkati' cocok dengan ragam hikmat yang bermartabat, meski bentuk Ibraninya juga dapat dipahami sebagai 'berbahagia'.
theological_decisions:
- issue: Personifikasi hikmat
  choice: Memakai pronomina personal 'Ia' dan '-nya' untuk hikmat
  alternative: Memakai rujukan impersonal atau mengulang kata 'hikmat'
  rationale: Teks Ibrani memakai bentuk feminin tunggal dan konteksnya mempersonifikasikan hikmat. Bahasa Indonesia tidak membedakan gender pada pronomina, tetapi 'Ia' tetap mempertahankan sifat personal dalam gambaran tersebut tanpa menambahkan klaim teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan citra tindakan fisik dipertahankan untuk mencerminkan kesejajaran puisi Ibrani; penanda catatan kaki ditempatkan pada unsur yang dijelaskannya.
