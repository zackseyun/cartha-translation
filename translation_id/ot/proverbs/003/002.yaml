  text: for they will add to you length of days and years of life and peace[a].
translation:
  language: id
  text: Sebab semua itu akan memperpanjang umurmu, menambah tahun-tahun kehidupanmu, dan memberimu damai sejahtera[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “damai sejahtera” juga dapat berarti kesejahteraan atau keutuhan hidup, bukan hanya tidak adanya konflik.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan ayat ini sebagai alasan bagi nasihat pada ayat sebelumnya; bentuk ini alami dan jelas dalam bahasa Indonesia.
- source_word: אֹרֶךְ יָמִים
  choice: memperpanjang umurmu
  rationale: Mengungkapkan idiom Ibrani ‘panjangnya hari-hari’ secara alami dalam bahasa Indonesia tanpa memberi kesan bahwa setiap hari terasa panjang.
- source_word: וּשְׁנוֹת חַיִּים
  choice: menambah tahun-tahun kehidupanmu
  rationale: Mempertahankan kesejajaran puitis dengan frasa sebelumnya dan gagasan tentang bertambahnya masa hidup.
- source_word: וְשָׁלוֹם
  choice: damai sejahtera
  rationale: Ungkapan Indonesia ini mencakup kedamaian sekaligus keadaan baik dan utuh, sehingga lebih luas daripada sekadar ketiadaan konflik.
- source_word: יוֹסִיפוּ
  choice: akan memperpanjang … menambah … dan memberi
  rationale: Satu verba Ibrani menaungi tiga unsur. Dalam bahasa Indonesia, verba tersebut diungkapkan sesuai tiap objek agar kalimat alami, sambil mempertahankan gagasan bahwa semuanya dianugerahkan atau ditambahkan kepada pembaca.
- source_word: לָךְ
  choice: -mu / memberimu
  rationale: Akhiran dan bentuk verba Indonesia menyampaikan penerima orang kedua tunggal secara alami.
