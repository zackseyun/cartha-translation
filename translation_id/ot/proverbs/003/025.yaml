  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַל תִּ֭ירָא מִ/פַּ֣חַד פִּתְאֹ֑ם וּ/מִ/שֹּׁאַ֥ת רְ֝שָׁעִ֗ים כִּ֣י תָבֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/025.yaml
  text: Do not fear sudden terror[a], or the ruin of the wicked when it comes[b],
translation:
  language: id
  text: Jangan takut pada kengerian yang datang tiba-tiba, ataupun pada kehancuran[a] orang-orang fasik[b] ketika itu datang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “kebinasaan” atau “malapetaka yang menghancurkan” (Ibrani: שֹׁאָה).'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “kehancuran orang-orang fasik” dapat berarti kehancuran yang menimpa orang-orang fasik atau kehancuran yang berkaitan dengan mereka; bahasa Ibraninya ringkas dan tidak menjelaskan hubungan itu sepenuhnya.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Jangan takut
  rationale: Partikel larangan אַל dengan bentuk verba תִּירָא menyatakan larangan. “Jangan takut” merupakan padanan Indonesia yang alami dan ringkas.
- source_word: מִפַּחַד פִּתְאֹם
  choice: pada kengerian yang datang tiba-tiba
  rationale: פַּחַד berarti kengerian atau kedahsyatan yang menimbulkan rasa takut, sedangkan פִּתְאֹם menunjukkan sesuatu yang mendadak atau tidak terduga. Klausa relatif ini terdengar alami dalam bahasa Indonesia dan mempertahankan sifat mendadaknya.
- source_word: וּמִשֹּׁאַת
  choice: ataupun pada kehancuran
  rationale: שֹׁאָה dapat menunjuk pada kehancuran, kebinasaan, atau malapetaka yang menghancurkan. “Kehancuran” mempertahankan cakupan umum istilah itu dan cocok dengan kesejajaran baris.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Bentuk jamak ini menunjuk kepada orang yang bersalah atau jahat secara moral. “Orang-orang fasik” merupakan istilah Indonesia yang ringkas dan lazim dalam sastra hikmat.
- source_word: כִּי תָבֹא
  choice: ketika itu datang
  rationale: כִּי di sini paling wajar dipahami secara temporal. Verba feminin tunggal תָבֹא merujuk kembali kepada שֹׁאָה, sehingga kata ganti “itu” mempertahankan hubungan tersebut.
theological_decisions:
- issue: Hubungan konstruksi antara שֹׁאַת dan רְשָׁעִים
  choice: kehancuran orang-orang fasik
  alternative: kehancuran yang menimpa orang-orang fasik; kehancuran yang ditimbulkan orang-orang fasik
  rationale: Bahasa Ibrani tidak menjelaskan apakah orang fasik menjadi korban, penyebab, atau sekadar pihak yang dikaitkan dengan kehancuran itu. Terjemahan utama mempertahankan kepadatan dan ambiguitas tersebut, sedangkan catatan kaki menjelaskannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan kesejajaran kedua objek ketakutan. Istilah “orang-orang fasik” dipilih karena sesuai dengan ragam sastra hikmat, sedangkan ambiguitas hubungan genitif dijaga dalam teks utama dan diterangkan dalam catatan kaki.
