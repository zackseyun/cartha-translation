source:
  edition: WLC
  text: בְּ֭/דַעְתּ/וֹ תְּהוֹמ֣וֹת נִבְקָ֑עוּ וּ֝/שְׁחָקִ֗ים יִרְעֲפוּ טָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/020.yaml
  text: By his knowledge the depths were split open[b][a], and the clouds drip dew.
translation:
  language: id
  text: Dengan pengetahuan-Nya, samudra raya terbelah[a], dan awan-awan[b] menitikkan embun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “air yang dalam” atau “kedalaman-kedalaman”.
    reason: lexical_alternative
  - marker: b
    text: Atau “langit”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדַעְתּוֹ
  choice: Dengan pengetahuan-Nya
  rationale: Preposisi בְּ menyatakan sarana, sedangkan דַּעַת berarti pengetahuan. Bentuk ini mempertahankan makna instrumental dan merujuk secara alami kepada TUHAN dalam konteks ayat sebelumnya.
- source_word: תְּהוֹמוֹת
  choice: samudra raya
  rationale: Bentuk jamak Ibrani ini menunjuk pada air dalam atau kedalaman purba. 'Samudra raya' merupakan ungkapan kolektif yang alami dalam bahasa Indonesia dan mempertahankan gambaran kosmisnya.
- source_word: נִבְקָעוּ
  choice: terbelah
  rationale: Bentuk Nifal menggambarkan keadaan pasif atau refleksif ketika air dalam itu dibelah atau terbuka. 'Terbelah' ringkas dan tetap menghadirkan gambaran fisik yang kuat.
- source_word: וּשְׁחָקִים
  choice: dan awan-awan
  rationale: שְׁחָקִים dapat berarti langit atau awan. Karena klausa berikutnya berbicara tentang embun yang menitik, 'awan-awan' paling sesuai dengan gambaran meteorologis langsung, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: יִרְעֲפוּ
  choice: menitikkan
  rationale: Kata kerja ini menyatakan tetesan atau curahan lembut. 'Menitikkan' alami dalam bahasa Indonesia dan cocok dengan embun, tanpa memberi kesan hujan deras.
- source_word: טָל
  choice: embun
  rationale: Padanan baku dan langsung bagi טָל dalam konteks ini.
theological_decisions:
- issue: Gambaran kosmis tentang penciptaan dan pemeliharaan
  choice: Ayat ini menggambarkan pengetahuan Allah sebagai sarana penataan dunia melalui gambaran samudra raya dan awan yang membawa embun.
  alternative: Ayat ini dapat pula menyoroti pemeliharaan Allah yang terus berlangsung atas cuaca dan siklus air, bukan hanya tindakan penciptaan pada mulanya.
  rationale: Konteks Amsal 3:19–20 menekankan penataan ciptaan oleh hikmat dan pengetahuan Allah. Terjemahan mempertahankan gambaran puitis tersebut tanpa memaksakan kosmologi teknis atau meniadakan makna pemeliharaan yang berkelanjutan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. 'Samudra raya' dipakai sebagai nomina kolektif meskipun bentuk Ibraninya jamak. Kapitalisasi pronomina '-Nya' mengikuti rujukan kepada Allah dalam konteks.
