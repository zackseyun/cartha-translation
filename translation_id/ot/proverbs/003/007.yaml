  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַל תְּהִ֣י חָכָ֣ם בְּ/עֵינֶ֑י/ךָ יְרָ֥א אֶת יְ֝הוָ֗ה וְ/ס֣וּר מֵ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/007.yaml
  text: Do not be wise in your own eyes[c][b][a]; fear Yahweh and turn away from evil.
translation:
  language: id
  text: Janganlah menganggap dirimu sendiri bijak[a]; takutlah kepada Yahweh[b] dan jauhilah kejahatan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Janganlah bijak di matamu sendiri”; bentuk Ibraninya juga dapat dipahami, “Janganlah menjadi bijak menurut pandanganmu sendiri.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “hormatilah Yahweh dengan penuh takjub.” Kata kerja Ibrani ini dapat menyatakan rasa takut yang disertai hormat dan takjub di hadapan Allah.
    reason: lexical_alternative
  - marker: c
    text: Atau, “berpalinglah dari kejahatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהִי
  choice: Janganlah
  rationale: Partikel larangan אַל dengan bentuk yiqtol/jusif תְּהִי menyatakan larangan. Bahasa Indonesia secara alami mengungkapkannya dengan “janganlah”; nuansa “menjadi” tetap dicatat dalam catatan kaki.
- source_word: חָכָם בְּעֵינֶיךָ
  choice: menganggap dirimu sendiri bijak
  rationale: Secara harfiah ungkapan ini berarti “bijak di matamu sendiri,” yaitu bijak menurut penilaian diri sendiri. Pilihan ini menyampaikan idiom Ibrani secara wajar tanpa mengubah teguran terhadap kepercayaan pada kebijaksanaan diri.
- source_word: יְרָא
  choice: takutlah kepada
  rationale: Bentuk imperatif ירא mencakup rasa takut yang penuh hormat dan takjub di hadapan Allah. “Takutlah” mempertahankan bobot istilah Ibrani, sedangkan nuansa penghormatan dijelaskan dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh,” bukan diganti dengan sebuah gelar.
- source_word: וְסוּר
  choice: dan jauhilah
  rationale: Imperatif סור berarti berbalik, menyimpang, atau menjauh. “Jauhilah” adalah ungkapan Indonesia yang alami untuk tindakan sengaja meninggalkan dan menghindari sesuatu.
- source_word: מֵרָע
  choice: kejahatan
  rationale: Dalam konteks hikmat ini רָע menunjuk pada apa yang jahat secara moral. “Kejahatan” mempertahankan cakupan etisnya tanpa membatasinya pada perbuatan tertentu.
theological_decisions:
- issue: Makna takut kepada Allah
  choice: takutlah kepada Yahweh
  alternative: hormatilah Yahweh dengan penuh takjub
  rationale: Kata ירא dapat mencakup takut, hormat, dan takjub. Teks utama mempertahankan “takut” agar daya teologis dan ketegangan istilah sumber tidak dilemahkan; catatan kaki menjelaskan jangkauan maknanya.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi יהוה. Transliterasi “Yahweh” mempertahankannya sebagai nama, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Partikel “-lah” mempertahankan nada nasihat yang tegas. Idiom “di matamu sendiri” dialihkan secara alami sebagai “menganggap dirimu sendiri bijak,” sementara bentuk harfiahnya dipertahankan dalam catatan kaki.
