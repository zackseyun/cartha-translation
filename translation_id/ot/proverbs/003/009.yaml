  yaml_path: translation/ot/proverbs/003/009.yaml
  text: Honor Yahweh with your wealth and with the firstfruits of all your produce[a][b].
translation:
  language: id
  text: Hormatilah Yahweh dengan hartamu[a] dan dengan hasil pertama[b] dari seluruh panenmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari hartamu”; preposisi Ibrani yang dipakai setelah “hormatilah” dapat diterjemahkan dengan kedua cara tersebut.
    reason: lexical_alternative
  - marker: b
    text: “Hasil pertama” adalah bagian awal dan terbaik dari panen yang diberikan untuk menghormati Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: כַּבֵּד
  choice: Muliakanlah
  rationale: Bentuk imperatif Piel dari כבד berarti menghormati atau memberi bobot kehormatan kepada seseorang. Dalam konteks penghormatan kepada Allah melalui harta dan hasil panen, “muliakanlah” terdengar alami dan bermartabat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan suatu gelar.
- source_word: מֵהוֹנֶךָ
  choice: dengan hartamu
  rationale: הוֹן berarti harta, kekayaan, atau milik. Setelah perintah “muliakanlah”, preposisi מִן dapat menyatakan sarana sehingga wajar diterjemahkan “dengan”; kemungkinan arti “dari” dipertahankan dalam catatan kaki.
- source_word: וּמֵרֵאשִׁית
  choice: dan dengan hasil pertama
  rationale: רֵאשִׁית secara harfiah menunjuk pada bagian awal atau pertama. Dalam konteks hasil pertanian, “hasil pertama” menyampaikan gagasan buah sulung tanpa memakai ungkapan yang kurang lazim bagi pembaca modern.
- source_word: כָּל
  choice: seluruh
  rationale: כָּל mencakup keseluruhan hasil panen dan secara alami diterjemahkan “seluruh” di depan nomina tunggal kolektif.
- source_word: תְּבוּאָתֶךָ
  choice: panenmu
  rationale: תְּבוּאָה berarti hasil, hasil bumi, atau panen. “Panenmu” mempertahankan latar pertanian dan mudah dipahami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. Transliterasi “Yahweh” mempertahankan nama pribadi Allah dan tidak menggantinya dengan gelar.
- issue: Sifat pemberian hasil pertama
  choice: hasil pertama
  alternative: buah sulung
  rationale: Teks menyebut bagian pertama dari hasil panen sebagai cara memuliakan Yahweh, tetapi tidak merinci tata cara persembahannya dalam ayat ini. “Hasil pertama” menjaga cakupan ungkapan Ibrani tanpa menambahkan rincian ritual yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada hikmat. Bentuk imperatif “muliakanlah” mempertahankan kekuatan nasihat, sedangkan “harta” dan “panen” mudah dipahami pembaca umum.
