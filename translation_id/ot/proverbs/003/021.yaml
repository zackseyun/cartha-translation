  text: בְּ֭נִ/י אַל יָלֻ֣זוּ מֵ/עֵינֶ֑י/ךָ נְצֹ֥ר תֻּ֝שִׁיָּ֗ה וּ/מְזִמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/021.yaml
  text: My son[a], do not let them depart from your eyes[b]; guard sound wisdom and discretion.
translation:
  language: id
  text: Anakku, jangan biarkan hal-hal itu luput dari pandanganmu[a]; jagalah hikmat yang sehat[b] dan pertimbangan yang matang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jangan biarkan hal-hal itu menyimpang dari matamu.” Bentuk jamak ini menunjuk kepada ajaran atau sifat-sifat dalam konteks sekitar.
    reason: lexical_alternative
  - marker: b
    text: “Hikmat yang sehat” dapat juga diterjemahkan “penilaian yang tepat” atau “kecakapan praktis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Anakku
  rationale: Sapaan tunggal maskulin dalam kerangka nasihat ayah atau guru kepada seorang anak laki-laki; bentuk sumber dipertahankan tanpa dibuat netral.
- source_word: אַל יָלֻזוּ
  choice: jangan biarkan semuanya luput
  rationale: Bentuk verba jamak memerlukan acuan jamak yang tersirat. Ungkapan ini menyampaikan larangan agar hal-hal yang dimaksud tidak bergeser atau hilang dari perhatian, tanpa menetapkan acuannya secara lebih tegas daripada teks Ibrani.
- source_word: מֵעֵינֶיךָ
  choice: dari pandanganmu
  rationale: Padanan idiomatis alami bagi ungkapan harfiah 'dari matamu', dengan tetap mempertahankan gambaran tentang perhatian yang terus-menerus.
- source_word: נְצֹר
  choice: jagalah
  rationale: Bentuk imperatif ini menuntut pemeliharaan yang aktif dan waspada; 'jagalah' lebih kuat daripada sekadar 'simpanlah'.
- source_word: תֻּשִׁיָּה
  choice: hikmat yang andal
  rationale: Istilah ini menunjuk pada hikmat atau penilaian yang kukuh dan efektif dalam praktik. 'Andal' mempertahankan daya praktisnya tanpa membatasinya hanya pada kecerdikan atau keberhasilan.
- source_word: וּמְזִמָּה
  choice: dan pertimbangan yang matang
  rationale: Dalam konteks positif kitab Amsal, kata ini menyatakan kebijaksanaan dalam menimbang dan merencanakan, bukan siasat jahat.
theological_decisions:
- issue: Sapaan kepada anak yang bergender
  choice: Anakku
  alternative: Anak-Ku atau anakku dalam arti netral gender
  rationale: Bahasa Ibrani memakai bentuk tunggal maskulin dalam wacana ayah kepada anak laki-laki. Terjemahan mempertahankan ciri tersebut tanpa menggeneralisasikannya.
- issue: Acuan subjek jamak yang tersirat
  choice: semuanya
  alternative: keduanya; hal-hal itu
  rationale: Bentuk jamak Ibrani dapat menunjuk kepada ajaran atau sifat-sifat dalam konteks sekitar. 'Semuanya' mempertahankan kelonggaran acuan itu dan tidak memaksanya hanya kepada dua nomina yang langsung menyusul.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang hangat dan bermartabat. Susunan dibuat alami bagi pembaca umum, sementara bentuk sapaan maskulin, acuan jamak yang tidak sepenuhnya tegas, dan daya praktis istilah hikmat tetap dipertahankan.
