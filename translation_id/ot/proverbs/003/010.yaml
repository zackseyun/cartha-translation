  text: then your barns will be filled with abundance[a], and your vats will burst with new wine.
translation:
  language: id
  text: maka lumbung-lumbungmu akan dipenuhi dengan hasil yang berlimpah, dan bak-bak anggurmu akan meluap[a] dengan anggur baru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kata Ibrani ini menggambarkan tindakan “menerobos” atau “menyembur keluar”; di sini maksudnya bak-bak itu meluap karena sangat penuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּלְאוּ
  choice: akan dipenuhi
  rationale: 'Bentuk nifal imperfek dari מלא menyatakan keadaan hasil yang pasif: lumbung-lumbung itu menjadi penuh.'
- source_word: אֲסָמֶיךָ
  choice: lumbung-lumbungmu
  rationale: Kata אֹסֶם menunjuk pada bangunan penyimpanan hasil pertanian; “lumbung” alami dan mempertahankan gambaran agraris.
- source_word: שָׂבָע
  choice: dengan hasil yang berlimpah
  rationale: Nomina ini menyatakan kelimpahan atau kepuasan karena kecukupan. Penambahan “hasil” membuat ungkapan alami dalam bahasa Indonesia sekaligus menjaga konteks panen.
- source_word: תִירוֹשׁ
  choice: anggur baru
  rationale: תִּירוֹשׁ lazim menunjuk pada anggur baru atau hasil anggur segar, sehingga pembedaan dari istilah umum untuk anggur tetap terpelihara.
- source_word: יְקָבֶיךָ
  choice: bak-bak anggurmu
  rationale: יֶקֶב menunjuk pada bak atau tempat dalam proses pemerasan dan penampungan anggur. “Bak-bak anggur” ringkas, konkret, dan sejajar dengan “lumbung-lumbung”.
- source_word: יִפְרֹצוּ
  choice: akan meluap
  rationale: פרץ secara kuat menggambarkan menerobos atau menyembur keluar. Dalam konteks bak yang dipenuhi anggur baru, “meluap” menyampaikan akibat kelimpahan tanpa menyiratkan bahwa baknya rusak.
theological_decisions:
- issue: Sifat gambaran kemakmuran yang dijanjikan
  choice: Mempertahankan gambaran konkret tentang kelimpahan hasil pertanian.
  alternative: Menggeneralisasikannya sebagai berkat rohani atau berkat secara umum.
  rationale: Teks Ibrani secara nyata menyebut lumbung, bak anggur, dan hasil bumi. Terjemahan tidak menentukan lebih jauh apakah gambaran hikmat ini bersifat universal, mekanis, simbolis, atau terbatas oleh konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan gambaran agraris yang konkret. “Maka” mempertahankan hubungan akibat dengan ayat sebelumnya. Pengulangan nomina dipakai secara alami untuk menandai bentuk jamak.
