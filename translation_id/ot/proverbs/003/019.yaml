  text: יְֽהוָ֗ה בְּ/חָכְמָ֥ה יָֽסַד אָ֑רֶץ כּוֹנֵ֥ן שָׁ֝מַ֗יִם בִּ/תְבוּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/019.yaml
  text: Yahweh founded the earth by wisdom[a]; he established the heavens by understanding.
translation:
  language: id
  text: Yahweh meletakkan dasar bumi dengan hikmat[a]; Ia menegakkan langit dengan pengertian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melalui hikmat” ... “melalui pengertian.” Kata depan Ibrani dapat menyatakan sarana atau penyertaan; dalam konteks ini, sarana dalam penciptaan tampaknya paling sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung, bukan menggantinya dengan gelar.
- source_word: בְּחָכְמָה
  choice: dengan hikmat
  rationale: Kata depan ב paling wajar menyatakan sarana dalam konteks penciptaan, sedangkan bentuk 'dengan' tetap mempertahankan kemungkinan nuansa penyertaan.
- source_word: יָסַד
  choice: meletakkan dasar
  rationale: Mempertahankan metafora bangunan yang terkandung dalam verba Ibrani dan terdengar alami dengan objek 'bumi'.
- source_word: אָרֶץ
  choice: bumi
  rationale: Konteks kosmis dan kesejajarannya dengan langit menunjuk kepada bumi, bukan suatu wilayah tertentu.
- source_word: כּוֹנֵן
  choice: menegakkan
  rationale: Menyampaikan tindakan menetapkan dengan kokoh sekaligus membedakannya dari metafora peletakan dasar pada larik pertama.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Dalam bahasa Indonesia, 'langit' merupakan padanan kolektif alami bagi bentuk Ibrani yang merujuk pada ranah langit dalam pasangan kosmis bumi–langit.
- source_word: בִּתְבוּנָה
  choice: dengan pengertian
  rationale: Mempertahankan istilah utama dalam kosakata hikmat Amsal dan kesejajarannya dengan 'hikmat'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; bentuk 'Yahweh' mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan kedua larik mempertahankan paralelisme Ibrani, sedangkan 'meletakkan dasar' dan 'menegakkan' menjaga perbedaan citra kedua verba.
