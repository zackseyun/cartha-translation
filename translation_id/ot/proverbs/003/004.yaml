  text: וּ/מְצָא חֵ֖ן וְ/שֵֽׂכֶל ט֑וֹב בְּ/עֵינֵ֖י אֱלֹהִ֣ים וְ/אָדָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/004.yaml
  text: Then you will find favor and good sense in the eyes of God and man[a].
translation:
  language: id
  text: Maka engkau akan mendapat perkenanan dan pengertian yang baik[a] di mata Allah dan manusia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akal budi yang baik”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְצָא
  choice: Maka engkau akan mendapat
  rationale: Bentuk imperatif yang dihubungkan dengan waw meneruskan nasihat ayat sebelumnya dan secara wajar menyatakan hasil yang diharapkan. Dalam bahasa Indonesia, bentuk ini lebih alami sebagai pernyataan akibat daripada perintah harfiah “dan temukanlah”.
- source_word: חֵן
  choice: perkenanan
  rationale: חֵן menunjuk pada penerimaan atau sikap baik yang diberikan kepada seseorang. “Perkenanan” sesuai dengan ungkapan “di mata” dan tidak membawa muatan teologis khusus seperti yang mungkin ditimbulkan oleh “anugerah”.
- source_word: וְשֵׂכֶל טוֹב
  choice: dan pengertian yang baik
  rationale: שֵׂכֶל dapat berarti pengertian, kebijaksanaan praktis, atau penilaian yang baik. Pilihan ini mempertahankan unsur kognitif-etis dan tidak menutup kemungkinan nuansa penghargaan atau keberhasilan yang melekat pada ungkapan tersebut.
- source_word: בְּעֵינֵי
  choice: di mata
  rationale: Ungkapan ini secara harfiah berarti “di mata” dan mengacu pada penilaian atau pandangan. Idiom yang sama alami dan mudah dipahami dalam bahasa Indonesia.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini אֱלֹהִים menunjuk kepada Allah yang esa.
- source_word: וְאָדָם
  choice: dan manusia
  rationale: אָדָם di sini mewakili manusia secara umum sebagai pasangan kontras dengan Allah, bukan seorang laki-laki tertentu. “Manusia” mempertahankan bentuk kolektif dan kontras ilahi-manusia secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan אָדָם dalam kontras dengan Allah
  choice: manusia
  alternative: orang-orang; umat manusia
  rationale: Kata ini merujuk kepada pihak manusia secara umum, bukan khusus kepada laki-laki. “Manusia” paling langsung mempertahankan kontras antara penilaian Allah dan penilaian manusia.
- issue: Makna שֵׂכֶל טוֹב
  choice: pengertian yang baik
  alternative: nama baik; penghargaan yang baik; kebijaksanaan yang baik
  rationale: Frasa Ibrani dapat menekankan kualitas pengertian yang dinilai baik atau penghargaan baik yang dihasilkan olehnya. Teks utama mempertahankan makna dasar שֵׂכֶל, sedangkan catatan kaki mengakui nuansa alternatif tanpa memaksakan satu penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “engkau” mempertahankan sapaan tunggal dalam nasihat seorang ayah kepada anaknya. Idiom “di mata” dipertahankan karena alami dalam bahasa Indonesia dan dekat dengan citra Ibrani.
