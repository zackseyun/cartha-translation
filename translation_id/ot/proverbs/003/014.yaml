translation:
  language: id
  text: Sebab labanya lebih baik daripada laba perak,[a] dan hasilnya lebih baik daripada emas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "perniagaannya" atau "keuntungannya"; bahasa Ibrani memakai gambaran perdagangan untuk menyatakan nilai yang dihasilkan hikmat.
    reason: lexical_alternative
  - marker: b
    text: Atau "emas murni" atau "emas pilihan"; istilah Ibrani dapat menunjuk pada emas yang sangat berharga atau yang telah dimurnikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: sebab
  rationale: Menghubungkan ayat ini dengan pujian terhadap hikmat dalam konteks sebelumnya dan memperkenalkan alasannya.
- source_word: טוֹב
  choice: lebih baik
  rationale: Bentuk dasarnya berarti 'baik', tetapi konstruksi perbandingan dengan מִן menuntut ungkapan komparatif yang alami.
- source_word: סַחְרָהּ
  choice: keuntungan darinya
  rationale: Mempertahankan metafora perdagangan sekaligus menjelaskan bahwa akhiran feminin menunjuk kepada hikmat yang dipersonifikasikan.
- source_word: מִסְּחַר כָּסֶף
  choice: daripada keuntungan dari perak
  rationale: Mempertahankan pengulangan gagasan keuntungan dan citra komersial dalam teks Ibrani, bukan menyederhanakannya hanya menjadi 'daripada perak'.
- source_word: וּמֵחָרוּץ
  choice: daripada emas murni
  rationale: חָרוּץ menunjuk pada emas dan dapat membawa nuansa emas pilihan atau yang telah dimurnikan; 'emas murni' menyampaikan nilai istimewanya secara wajar.
- source_word: תְּבוּאָתָהּ
  choice: hasilnya
  rationale: Menyampaikan sesuatu yang dihasilkan atau diperoleh dari hikmat; kata ini cukup luas untuk mempertahankan gema hasil panen tanpa membuat ungkapan Indonesia terasa kaku.
