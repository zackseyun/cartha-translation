translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang sederhana dan bermartabat. Personifikasi feminin dalam bahasa Ibrani tidak ditandai dengan pronomina bergender dalam bahasa Indonesia; 'darinya' dan '-nya' secara alami tetap merujuk kepada hikmat dalam konteks.
