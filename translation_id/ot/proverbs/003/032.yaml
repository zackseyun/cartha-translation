  text: כִּ֤י תוֹעֲבַ֣ת יְהוָ֣ה נָל֑וֹז וְֽ/אֶת יְשָׁרִ֥ים סוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/032.yaml
  text: For the crooked person is an abomination to Yahweh[a], but his counsel is with the upright.
translation:
  language: id
  text: Sebab orang yang menyimpang adalah kekejian bagi Yahweh, tetapi rahasia-Nya[a] ada pada orang-orang yang lurus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “rahasia” juga dapat berarti “nasihat rahasia” atau “persekutuan akrab”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menunjukkan alasan bagi nasihat sebelumnya dan merupakan penghubung yang alami dalam sastra hikmat Indonesia.
- source_word: תוֹעֲבַת
  choice: kekejian
  rationale: Mempertahankan bobot moral yang kuat dari kata Ibrani, yaitu sesuatu yang sangat menjijikkan atau dibenci di hadapan Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH secara langsung.
- source_word: נָלוֹז
  choice: orang yang menyimpang
  rationale: Menggambarkan orang yang menyimpang dari jalan yang lurus secara moral; ungkapan ini alami dalam bahasa Indonesia tanpa menghilangkan citra dasarnya.
- source_word: וְאֶת
  choice: tetapi ... dengan
  rationale: Kata penghubung secara harfiah berarti 'dan', tetapi susunan amsal ini bersifat antitetis sehingga 'tetapi' menyampaikan pertentangannya dengan jelas; penanda objek tersebut berkaitan dengan pihak yang bersama-Nya.
- source_word: יְשָׁרִים
  choice: orang-orang yang lurus
  rationale: Mempertahankan metafora moral 'lurus' yang berlawanan dengan orang yang menyimpang.
- source_word: סוֹדוֹ
  choice: hubungan akrab-Nya
  rationale: סוֹד dapat menunjuk pada lingkungan atau persekutuan akrab yang di dalamnya rahasia dan nasihat dipercayakan. Pilihan ini menjaga dimensi relasional, sedangkan keluasan maknanya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna סוֹד dalam hubungan Yahweh dengan orang-orang yang lurus
  choice: hubungan akrab-Nya adalah dengan orang-orang yang lurus
  alternative: rahasia-Nya ada pada orang-orang yang lurus; nasihat rahasia-Nya diberikan kepada orang-orang yang lurus
  rationale: Teks dapat menekankan persekutuan dekat, rahasia yang dipercayakan, atau nasihat dalam lingkaran akrab. Terjemahan utama mengungkapkan kedekatan relasional tanpa meniadakan aspek kerahasiaan dan nasihat, yang dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan antitetis amsal dipertahankan, demikian pula kontras antara penyimpangan dan kelurusan moral.
