  text: בֵּ֣ית צַ֭דִּיק חֹ֣סֶן רָ֑ב וּ/בִ/תְבוּאַ֖ת רָשָׁ֣ע נֶעְכָּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/006.yaml
  text: In the house of the righteous there is great wealth[b][a], but in the income of the wicked there is trouble.
translation:
  language: id
  text: Di rumah orang benar ada harta berlimpah, tetapi hasil[a] orang fasik diliputi kesusahan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “panen” atau “pendapatan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “diganggu” atau “dirusakkan”; kata kerja Ibrani dapat menyatakan kesusahan, kekacauan, atau kehancuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית צַדִּיק
  choice: di rumah orang benar
  rationale: Bentuk konstruksi ini secara konkret berarti rumah milik orang benar, sekaligus dapat mencakup rumah tangga dan segala miliknya. Bentuk tunggal dipertahankan secara generik dan tanpa penandaan gender.
- source_word: חֹסֶן רָב
  choice: harta berlimpah
  rationale: חֹסֶן dapat menunjuk pada harta, kekayaan, atau sumber daya, sedangkan רָב menyatakan kelimpahan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran kemakmuran materi.
- source_word: וּבִתְבוּאַת
  choice: tetapi hasil
  rationale: Konjungsi ו dipahami secara adversatif karena paralelisme yang mempertentangkan orang benar dengan orang fasik. תְבוּאָה secara dasar adalah hasil atau panen, dan dapat meluas kepada pendapatan; 'hasil' mempertahankan keluasan makna itu.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Adjektiva ini dipakai secara substantival untuk pribadi yang jahat secara moral dan menjadi lawan צַדִּיק. 'Orang fasik' merupakan padanan Alkitabiah yang tetap dikenal dalam bahasa Indonesia modern.
- source_word: נֶעְכָּרֶת
  choice: diliputi kesusahan
  rationale: Bentuk dari עכר dapat menyatakan diganggu, dikacaukan, atau dirusakkan. 'Diliputi kesusahan' menyampaikan bahwa hasil orang fasik tidak bebas dari gangguan atau malapetaka tanpa menetapkan bahwa hasil itu pasti musnah sama sekali.
theological_decisions:
- issue: Hubungan antara kefasikan dan hasil materi
  choice: Hasil orang fasik digambarkan diliputi kesusahan.
  alternative: Hasil orang fasik mendatangkan kesusahan.
  rationale: Bentuk Ibrani lebih dekat pada keadaan pasif hasil itu—diganggu, dikacaukan, atau dirusakkan—daripada pernyataan kausatif bahwa hasil tersebut menimbulkan kesusahan. Pilihan ini menjaga ketegangan pepatah tanpa menambahkan hubungan sebab-akibat yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada hikmat. 'Harta berlimpah' dan 'diliputi kesusahan' mudah dipahami pembaca modern, sedangkan 'orang benar' dan 'orang fasik' mempertahankan pasangan moral khas sastra Amsal.
