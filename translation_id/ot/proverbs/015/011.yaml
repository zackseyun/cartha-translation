id: PRO.15.11
reference: Proverbs 15:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שְׁא֣וֹל וַ֭/אֲבַדּוֹן נֶ֣גֶד יְהוָ֑ה אַ֝֗ף כִּֽי לִבּ֥וֹת בְּֽנֵי אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/011.yaml
  text: Sheol and Abaddon lie open before Yahweh[b][a]; how much more the hearts of the sons of man.
translation:
  language: id
  text: Sheol dan Abadon[a] terbuka di hadapan Yahweh; apalagi hati manusia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kebinasaan.” “Abadon” dapat berarti kebinasaan atau ranah/tempat kebinasaan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak manusia,” sebuah ungkapan Ibrani yang berarti manusia pada umumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: Syeol
  rationale: Bentuk transliterasi Indonesia ini mempertahankan konsep Ibrani tentang alam orang mati tanpa mempersempitnya menjadi sekadar kubur atau memasukkan gambaran akhirat yang lebih khusus.
- source_word: אֲבַדּוֹן
  choice: Abadon
  rationale: Dipertahankan sebagai nama yang ditransliterasikan karena dalam pasangan dengan Syeol istilah ini menunjuk pada kebinasaan atau ranah kebinasaan dengan daya seperti nama diri.
- source_word: נֶגֶד
  choice: terbuka di hadapan
  rationale: Secara harfiah berarti 'di hadapan', tetapi dalam konteks ini menyatakan bahwa Syeol dan Abadon sepenuhnya terlihat dan tidak tersembunyi dari Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai Yahweh, sesuai dengan bentuk nama perjanjian dalam teks Ibrani.
- source_word: אַף כִּי
  choice: terlebih lagi
  rationale: 'Ungkapan ini menyampaikan penalaran a fortiori: jika ranah kematian pun terbuka di hadapan Yahweh, hati manusia jauh lebih demikian.'
- source_word: לִבּוֹת
  choice: hati
  rationale: Metafora sumber dipertahankan; dalam antropologi Ibrani, hati mencakup pikiran, kehendak, niat, dan batin seseorang.
- source_word: בְּנֵי אָדָם
  choice: anak-anak manusia
  rationale: Terjemahan ini mempertahankan idiom Ibrani secara cukup formal, sementara catatan kaki menjelaskan bahwa acuannya adalah manusia pada umumnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; bentuk Yahweh mempertahankan rujukan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Apakah שְׁאוֹל dan אֲבַדּוֹן dijadikan istilah umum
  choice: Syeol dan Abadon
  alternative: alam orang mati dan kebinasaan
  rationale: Mempertahankan kedua istilah Ibrani menjaga kekuatan pasangan puitis dan tidak memaksakan skema akhirat yang lebih khusus daripada yang dinyatakan teks.
- issue: Makna umum idiom בְּנֵי אָדָם
  choice: anak-anak manusia
  alternative: umat manusia atau manusia
  rationale: Bentuk idiomatis sumber dipertahankan dalam teks, sedangkan cakupannya yang umum diperjelas melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan ringkas mempertahankan paralelisme amsal serta penalaran dari ranah kematian yang tersembunyi menuju batin manusia.
source_grounding:
  english_pob_role: consult_only
