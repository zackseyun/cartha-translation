id: PRO.15.29
reference: Proverbs 15:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רָח֣וֹק יְ֭הוָה מֵ/רְשָׁעִ֑ים וּ/תְפִלַּ֖ת צַדִּיקִ֣ים יִשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/029.yaml
  text: Yahweh is far from the wicked[a], but he hears the prayer of the righteous.
translation:
  language: id
  text: 'Yahweh[a] jauh dari orang-orang fasik,

    tetapi Ia mendengar doa orang-orang benar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: יהוה (YHWH), nama ilahi yang secara tradisional diterjemahkan “TUHAN”.'
    reason: Memberi tahu pembaca tentang bentuk Ibrani dan padanan tradisional bagi nama ilahi.
lexical_decisions:
- source_word: רָחוֹק
  choice: jauh dari
  rationale: Adjektiva predikatif ini menyatakan jarak moral dan relasional, bukan semata-mata jarak tempat. Ungkapan “jauh dari” mempertahankan bentuk dan kontras pepatah Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani dipertahankan dan tidak diganti dengan gelar.
- source_word: מֵרְשָׁעִים
  choice: dari orang-orang fasik
  rationale: Bentuk jamak רְשָׁעִים menunjuk kepada orang-orang yang bercirikan kejahatan moral. “Orang-orang fasik” merupakan istilah yang wajar dan bermartabat dalam sastra hikmat Indonesia.
- source_word: וּתְפִלַּת
  choice: tetapi ... doa
  rationale: Waw secara bentuk berarti “dan”, tetapi hubungan kedua larik jelas bersifat antitesis; “tetapi” menyampaikan kontras itu secara alami. תְּפִלָּה diterjemahkan langsung sebagai “doa”.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Bentuk jamak ini menunjuk kepada kelompok yang bercirikan kebenaran. Pilihan ini mempertahankan kategori moral khas sastra hikmat.
- source_word: יִשְׁמָע
  choice: Ia mendengar
  rationale: Kata שׁמע berarti “mendengar” atau “mendengarkan”. Dalam konteks doa, kata ini dapat menyiratkan perhatian yang berkenan, tetapi “mendengar” tidak menambahkan gagasan bahwa setiap doa otomatis dijawab sesuai permintaan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. Transliterasi “Yahweh” mempertahankan nama ilahi, sedangkan catatan kaki memberitahukan padanan tradisional kepada pembaca.
- issue: Makna bahwa Yahweh “jauh” dari orang fasik
  choice: Jarak moral dan relasional
  alternative: Ketidakhadiran secara ruang atau ketidakmampuan untuk mendengar sama sekali
  rationale: רָחוֹק dalam paralelisme ini berlawanan dengan tindakan mendengar doa orang benar. Karena itu, pernyataan tersebut menyampaikan keterpisahan moral dan tidak adanya perhatian yang berkenan, tanpa menegaskan bahwa Allah tidak hadir atau tidak mengetahui orang fasik.
- issue: Makna “mendengar” doa orang benar
  choice: Mendengar dengan perhatian yang berkenan, tanpa memperluasnya menjadi janji eksplisit bahwa semua permintaan dikabulkan
  alternative: Mengabulkan setiap doa secara otomatis
  rationale: Verba יִשְׁמָע secara leksikal berarti “ia mendengar”. Implikasi penerimaan dalam konteks doa dibiarkan tetap ada tanpa mengganti verba itu dengan “mengabulkan”.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan dua larik mempertahankan paralelisme antitetis pepatah. “Ia” dipakai sebagai pronomina ilahi yang lazim dalam ragam Alkitabiah tanpa menambahkan keterangan yang tidak terdapat dalam teks.
