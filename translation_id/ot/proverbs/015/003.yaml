source:
  edition: WLC
  text: בְּֽ/כָל מָ֭קוֹם עֵינֵ֣י יְהוָ֑ה צֹ֝פ֗וֹת רָעִ֥ים ו/טוֹבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/003.yaml
  text: In every place the eyes of Yahweh watch over the evil and the good[a].
translation:
  language: id
  text: Di setiap tempat, mata Yahweh[a] mengawasi orang jahat dan orang baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”; secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber dan padanan tradisionalnya.
lexical_decisions:
- source_word: בְּכָל מָקוֹם
  choice: Di setiap tempat
  rationale: Mempertahankan ungkapan distributif Ibrani secara cukup formal dan tetap alami dalam bahasa Indonesia.
- source_word: עֵינֵי יְהוָה
  choice: mata Yahweh
  rationale: Mempertahankan hubungan konstruksi dan gambaran antropomorfis dalam teks Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: צֹפוֹת
  choice: mengawasi
  rationale: Partisip Ibrani menyatakan tindakan yang berlangsung terus; 'mengawasi' menyampaikan pengamatan aktif dan berkelanjutan secara wajar.
- source_word: רָעִים וְטוֹבִים
  choice: orang jahat dan orang baik
  rationale: Kedua adjektiva dipakai secara substantival dan mengacu kepada orang; penambahan 'orang' membuat maksudnya jelas dalam bahasa Indonesia tanpa mengubah kontrasnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan nama tersebut, sedangkan kebiasaan tradisional menggantinya dengan gelar 'TUHAN' dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan citra puitis 'mata Yahweh' serta kesejajaran antara orang jahat dan orang baik.
