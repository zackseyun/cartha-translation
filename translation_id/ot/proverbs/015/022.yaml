  text: הָפֵ֣ר מַ֭חֲשָׁבוֹת בְּ/אֵ֣ין ס֑וֹד וּ/בְ/רֹ֖ב יוֹעֲצִ֣ים תָּקֽוּם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/022.yaml
  text: Plans fail for lack of counsel[a], but with many advisers they stand.
translation:
  language: id
  text: 'Rencana gagal tanpa perundingan,[a]

    tetapi dengan banyak penasihat rencana itu menjadi mantap.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Rencana digagalkan tanpa perundingan, tetapi dengan banyak penasihat rencana itu ditegakkan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפֵר
  choice: gagal
  rationale: Bentuk Hifil dari פרר menyatakan digagalkan atau dibuat tidak terlaksana. Dengan "rencana" sebagai subjek, "gagal" menyampaikan hasilnya secara alami dalam bahasa Indonesia.
- source_word: מַחֲשָׁבוֹת
  choice: rencana
  rationale: Dalam konteks nasihat dan keberhasilan pelaksanaan, kata ini menunjuk pada rancangan atau maksud yang dipikirkan, bukan sekadar pikiran.
- source_word: בְּאֵין
  choice: tanpa
  rationale: Ungkapan ini menyatakan ketiadaan; "tanpa" ringkas dan alami, dengan hubungan sebab-akibat yang tersirat dari struktur amsal.
- source_word: סוֹד
  choice: pertimbangan bersama
  rationale: סוֹד dapat berarti pembicaraan rahasia, perundingan, atau lingkaran penasihat. Di sini paralelnya dengan banyak penasihat terutama menekankan proses berunding, sehingga "pertimbangan bersama" mempertahankan unsur deliberasi.
- source_word: וּבְרֹב
  choice: tetapi ... dengan banyak
  rationale: Waw menandai pertentangan antarbait, sedangkan רֹב menyatakan banyaknya pihak yang terlibat.
- source_word: יוֹעֲצִים
  choice: penasihat
  rationale: Partisip aktif dari יעץ menunjuk kepada orang-orang yang memberikan nasihat; "penasihat" merupakan padanan modern dan langsung.
- source_word: תָּקוּם
  choice: terlaksana
  rationale: קום dapat berarti berdiri, ditegakkan, atau menjadi mantap. Dalam kaitannya dengan rencana, "terlaksana" menyampaikan bahwa rencana itu berhasil diwujudkan, sementara makna lebih harfiah dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bernada amsal. Baris paralel dipertahankan. "Pertimbangan bersama" dipilih untuk membedakan סוֹד dari nasihat individual dan menangkap nuansa perundingan; alternatif yang lebih formal dan harfiah disediakan dalam catatan kaki.
