  text: The way of the lazy is like a hedge of thorns[a], but the path of the upright is a raised highway.
translation:
  language: id
  text: 'Jalan orang malas seperti pagar duri,

    tetapi jalan orang benar adalah jalan raya yang ditinggikan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jalan orang benar rata” atau “jalan orang benar lancar.” Kata Ibraninya dapat menggambarkan jalan yang ditimbun atau dibangun, dan dengan demikian jalan yang bebas dari penghalang.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: jalan
  rationale: Istilah umum untuk jalan, yang dalam amsal ini juga melambangkan arah hidup atau perilaku seseorang.
- source_word: עָצֵל
  choice: orang malas
  rationale: Menunjuk pada orang yang biasa bermalas-malasan; ungkapan ini alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: כִּמְשֻׂכַת חָדֶק
  choice: seperti pagar duri
  rationale: Prefiks כ menyatakan perbandingan, sedangkan frasa bendanya menggambarkan pagar atau penghalang dari tumbuhan berduri.
- source_word: אֹרַח
  choice: jalan
  rationale: Sinonim dekat דֶּרֶךְ; pengulangan 'jalan' terdengar wajar dalam paralelisme amsal Indonesia dan mempertahankan bidang metafora yang sama.
- source_word: יְשָׁרִים
  choice: orang jujur
  rationale: Secara harfiah menunjuk pada orang-orang yang lurus; dalam konteks moral, 'orang jujur' menyampaikan integritas tanpa mempersempitnya menjadi status forensik.
- source_word: סְלֻלָה
  choice: jalan raya yang ditinggikan
  rationale: Bentuk pasif dari סלל menggambarkan jalan yang ditimbun, dibangun, atau dipersiapkan sehingga bebas dari penghalang; pilihan ini mempertahankan gambaran konkret jalan yang ditinggikan.
theological_decisions:
- issue: Makna moral יְשָׁרִים
  choice: orang jujur
  alternative: orang lurus; orang benar
  rationale: Pilihan ini mempertahankan orientasi etis kata tersebut tanpa memasukkan pengertian teologis atau forensik yang lebih khusus.
- issue: Nuansa סְלֻלָה
  choice: jalan raya yang ditinggikan
  alternative: jalan yang rata/lancar
  rationale: Teks dapat menekankan jalan yang dibangun atau ditinggikan dan, sebagai akibatnya, tidak terhalang. Terjemahan utama menjaga citra fisiknya, sedangkan catatan mempertahankan kemungkinan nuansa hasilnya.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat, dengan paralelisme antarkedua larik dipertahankan. Istilah konkret dipilih agar gambaran pagar duri dan jalan yang dibangun tetap terasa.
