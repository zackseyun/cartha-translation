  naturalness: “Lidah yang membawa kesembuhan” dan “pohon kehidupan” alami dalam bahasa Indonesia baku. “Kebengkokan di dalamnya” agak harfiah, tetapi masih dapat diterima dalam register hikmat. “Kehancuran bagi batin” lebih idiomatis daripada “patahan pada roh” untuk teks utama sambil menjaga struktur nominal dan metafora dampak batiniah.
  terminology: “Batin” pada klausa kedua secara jelas mengacu pada kehidupan batin manusia tanpa mengesankan Roh ilahi atau sekadar suasana hati sesaat. Catatan kaki mempertahankan “roh” sebagai pilihan yang lebih dekat dengan רוּחַ. Alternatif untuk מַרְפֵּא diperbaiki menjadi “menyehatkan”, bukan “sehat”, karena yang dimaksud ialah sifat/peran perkataan yang memulihkan.
