  text: A healing tongue is a tree of life[b][a], but perverseness in it is a breaking of the spirit.
translation:
  language: id
  text: Lidah yang membawa kesembuhan adalah pohon kehidupan,[a] tetapi kebengkokan di dalamnya adalah kehancuran bagi batin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Lidah yang menyehatkan adalah pohon kehidupan”; מַרְפֵּא dapat berarti kesembuhan, kesehatan, atau sesuatu yang menyehatkan.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “tetapi kebengkokan di dalamnya adalah patahan pada roh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְפֵּא
  choice: membawa kesembuhan
  rationale: Nomina ini menyatakan kesembuhan, obat, atau kesehatan. Ungkapan “membawa kesembuhan” mempertahankan daya pemulihannya dan lebih alami dalam bahasa Indonesia daripada “lidah kesembuhan”.
- source_word: לָשׁוֹן
  choice: lidah
  rationale: Secara harfiah berarti “lidah” dan di sini menjadi metonimia untuk perkataan. Bentuk harfiah mempertahankan citra pepatah Ibrani serta tetap mudah dipahami.
- source_word: עֵץ חַיִּים
  choice: pohon kehidupan
  rationale: Frasa konstruksi ini mempertahankan gambaran khas sastra hikmat dan gaung antarteksnya tanpa secara tegas menyamakannya dengan satu pohon tertentu di Eden.
- source_word: סֶלֶף
  choice: kebengkokan
  rationale: Kata ini menunjuk pada sesuatu yang bengkok, menyimpang, atau rusak, khususnya dalam perkataan. “Kebengkokan” mempertahankan metafora bentuk yang menyimpang dan cakupan moral-verbalnya.
- source_word: בָּהּ
  choice: di dalamnya
  rationale: Akhiran feminin tunggal paling wajar merujuk kembali kepada “lidah”. Bentuk pronominal ini mempertahankan kaitan tersebut tanpa menambahkan penafsiran.
- source_word: שֶׁבֶר
  choice: meremukkan
  rationale: Nomina Ibrani berarti patahan, keretakan, atau kehancuran. Dalam bahasa Indonesia, bentuk verbal “meremukkan” menyampaikan dampaknya secara alami sambil mempertahankan kekuatan metafora.
- source_word: בְּרוּחַ
  choice: semangat
  rationale: Dalam konteks pengalaman manusia ini, רוּחַ menunjuk pada batin atau daya hidup seseorang. “Semangat” menghasilkan ungkapan Indonesia yang wajar dan tidak mengarah kepada Roh ilahi.
theological_decisions:
- issue: Rujukan רוּחַ
  choice: semangat atau batin manusia
  alternative: Roh ilahi
  rationale: Kontrasnya adalah antara perkataan yang memulihkan dan perkataan yang merusak batin manusia. Konteks pepatah mendukung rujukan kepada roh atau semangat manusia, bukan Roh Kudus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada luhur. Citra “lidah” dan “pohon kehidupan” dipertahankan, sedangkan klausa penutup dibuat idiomatis tanpa menghilangkan metafora kerusakan batin.
