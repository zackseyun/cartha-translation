  yaml_path: translation/ot/proverbs/015/031.yaml
  text: An ear that listens to life-giving rebuke will remain among the wise[a][b].
translation:
  language: id
  text: Telinga yang mendengarkan teguran yang membawa kepada hidup akan tinggal di tengah orang-orang bijak.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Telinga yang mendengar teguran kehidupan akan bermalam di tengah orang-orang bijak.” Kata kerja Ibraninya secara harfiah berarti “bermalam” atau “menumpang”, dan di sini dipakai sebagai gambaran untuk tinggal atau menetap bersama orang-orang bijak.'
    reason: lexical_alternative
  - marker: b
    text: “Teguran yang membawa kepada hidup” menerjemahkan ungkapan Ibrani yang juga dapat diterjemahkan “teguran kehidupan” atau “teguran untuk hidup”, yaitu koreksi yang menuntun kepada atau memelihara kehidupan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹזֶן
  choice: telinga
  rationale: 'Mempertahankan metonimia Ibrani: telinga mewakili orang yang bersedia menerima dan menaati nasihat. Metafora ini tetap wajar dan jelas dalam bahasa Indonesia.'
- source_word: שֹׁמַעַת
  choice: yang mendengarkan
  rationale: Partisip ini menggambarkan sikap terus-menerus untuk menyimak dengan terbuka, bukan sekadar mendengar bunyi.
- source_word: תּוֹכַחַת
  choice: teguran
  rationale: Dalam sastra hikmat, kata ini menunjuk pada teguran atau koreksi moral. 'Teguran' alami dalam bahasa Indonesia dan mempertahankan ketegasan istilah sumber.
- source_word: חַיִּים
  choice: yang membawa kepada hidup
  rationale: Frasa konstruksi תּוֹכַחַת חַיִּים dapat berarti teguran yang menghasilkan, memelihara, atau menuntun kepada hidup. Rumusan ini komunikatif tanpa menutup kemungkinan hubungan makna tersebut.
- source_word: בְּקֶרֶב
  choice: di tengah
  rationale: Terjemahan ini mempertahankan gambaran berada di dalam lingkungan atau persekutuan suatu kelompok; 'di antara' juga mungkin.
- source_word: חֲכָמִים
  choice: orang-orang bijak
  rationale: Adjektiva jamak ini dipakai secara substantival dan tidak menentukan gender. Bentuk Indonesia ini jelas dan alami.
- source_word: תָּלִין
  choice: akan tinggal
  rationale: Kata kerja ini secara harfiah dapat berarti bermalam atau menumpang. Dalam konteks pepatah, 'akan tinggal' mempertahankan citra menetap sekaligus menyampaikan persekutuan yang berkelanjutan.
theological_decisions:
- issue: Hubungan antara teguran dan hidup dalam תּוֹכַחַת חַיִּים
  choice: teguran yang membawa kepada hidup
  alternative: teguran kehidupan; teguran untuk hidup
  rationale: Bentuk Ibrani ringkas dan memungkinkan hubungan genitif atau tujuan/hasil. Terjemahan utama menyampaikan makna yang paling mungkin—teguran yang menuntun kepada hidup—sementara catatan kaki mempertahankan alternatif formalnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat khas pepatah. Metafora 'telinga' dan citra 'tinggal' dipertahankan, sedangkan hubungan padat antara 'teguran' dan 'hidup' dibuat alami dalam teks utama serta dijelaskan dalam catatan.
