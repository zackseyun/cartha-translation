translation_notes:
  register: Bahasa Indonesia baku modern dengan irama peribahasa yang ringkas dan bermartabat. Pasangan “kemurkaan” dan “amarah” mempertahankan variasi dua istilah Ibrani, sedangkan struktur antitetis kedua baris dijaga.
