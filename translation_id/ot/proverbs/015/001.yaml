source:
  edition: WLC
  text: מַֽעֲנֶה רַּ֭ךְ יָשִׁ֣יב חֵמָ֑ה וּ/דְבַר עֶ֝֗צֶב יַעֲלֶה אָֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/001.yaml
  text: A gentle answer turns away wrath[a], but a painful word stirs up anger.
translation:
  language: id
  text: Jawaban yang lembut meredakan kemurkaan, tetapi perkataan yang menyakitkan[a] membangkitkan amarah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkataan yang melukai” atau “perkataan yang keras.” Ungkapan Ibrani ini secara harfiah berarti “perkataan kesakitan/dukacita” dan dapat menggambarkan ucapan yang menyakiti sehingga memancing kemarahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲנֶה
  choice: jawaban
  rationale: Nomina ini menunjuk pada jawaban atau tanggapan dalam percakapan; “jawaban” paling ringkas dan alami dalam bentuk peribahasa.
- source_word: רַךְ
  choice: yang lembut
  rationale: Adjektiva ini berarti lembut atau lunak. Dalam konteks hubungan antarmanusia, “lembut” menyampaikan sikap dan cara berbicara secara wajar.
- source_word: יָשִׁיב
  choice: meredakan
  rationale: Bentuk kausatif dari שוב berarti membuat sesuatu berbalik atau menjauh. Dengan kemurkaan sebagai objek, “meredakan” menyampaikan hasil berupa surutnya kemarahan dalam bahasa Indonesia yang alami.
- source_word: חֵמָה
  choice: kemurkaan
  rationale: Kata ini menggambarkan kemarahan yang membara dan kuat; “kemurkaan” mempertahankan intensitasnya serta cocok dengan ragam bahasa hikmat yang bermartabat.
- source_word: דְבַר
  choice: perkataan
  rationale: Dalam konstruksi ini kata tersebut menunjuk pada sesuatu yang diucapkan. “Perkataan” alami dalam bahasa Indonesia dan sesuai dengan kesejajaran antardua baris.
- source_word: עֶצֶב
  choice: yang menyakitkan
  rationale: Nomina ini dapat menunjuk pada rasa sakit, luka batin, atau dukacita. Ungkapan “yang menyakitkan” mempertahankan gagasan bahwa perkataan itu menimbulkan rasa sakit tanpa membatasinya hanya pada nada yang keras.
- source_word: יַעֲלֶה
  choice: membangkitkan
  rationale: Bentuk kausatif dari עלה secara harfiah berarti membuat naik. Bersama “amarah”, “membangkitkan” merupakan padanan idiomatis yang tetap mempertahankan daya kausatifnya.
- source_word: אָף
  choice: amarah
  rationale: Walaupun arti harfiahnya dapat merujuk pada hidung, kata ini lazim menjadi idiom bagi kemarahan. “Amarah” menyampaikan makna kontekstualnya dengan jelas.
