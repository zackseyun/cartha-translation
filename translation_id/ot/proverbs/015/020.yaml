    rationale: Dalam ayat ini בֵּן berarti “putra/anak laki-laki,” bukan istilah netral bagi anak secara umum. “Putra” menyampaikan makna itu secara jelas dalam bahasa Indonesia baku.
  - severity: medium
    issue: “Menghina” kurang tepat bagi בּוֹזֶה.
    rationale: בּוֹזֶה menekankan sikap menghina dalam arti memandang rendah, meremehkan, atau mencemooh; “memandang rendah” lebih mencakup makna sikap karakteristik partisip tersebut tanpa membatasinya pada penghinaan verbal.
