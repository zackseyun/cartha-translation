  text: A wise son brings joy to his father[a], but a foolish man despises his mother.
translation:
  language: id
  text: Putra yang bijaksana menyukakan hati ayahnya, tetapi orang bodoh memandang rendah ibunya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּן
  choice: anak
  rationale: Dalam bahasa Indonesia, "anak" secara alami dapat menunjuk kepada anak laki-laki dalam hubungan dengan ayah dan ibu; konteks paralelnya tetap dipertahankan tanpa menambahkan unsur yang tidak dinyatakan secara eksplisit.
- source_word: חָכָם
  choice: yang bijaksana
  rationale: Dalam sastra hikmat, kata ini menunjuk pada kebijaksanaan praktis dan moral; "bijaksana" merupakan padanan Indonesia yang alami dan konsisten.
- source_word: יְשַׂמַּח
  choice: mendatangkan sukacita bagi
  rationale: Bentuk Piel menyatakan tindakan menyebabkan seseorang bersukacita. Ungkapan ini mempertahankan daya kausatifnya dalam bahasa Indonesia yang wajar.
- source_word: אָב
  choice: ayahnya
  rationale: Akhiran posesif tidak tertulis pada kata Ibrani ini, tetapi relasi dengan "anak" membuat bentuk posesif alami dan jelas dalam bahasa Indonesia.
- source_word: כְסִיל אָדָם
  choice: orang bodoh
  rationale: Gabungan ini menunjuk pada seorang individu yang bebal secara moral. "Orang bodoh" mempertahankan maknanya secara alami; menerjemahkannya sebagai "laki-laki bodoh" akan memberi penekanan gender yang kurang diperlukan dalam idiom Indonesia.
- source_word: בּוֹזֶה
  choice: menghina
  rationale: Partisip ini menggambarkan tindakan atau sikap khas yang memandang rendah. "Menghina" ringkas dan cukup kuat.
- source_word: אִמּוֹ
  choice: ibunya
  rationale: Akhiran orang ketiga maskulin tunggal dinyatakan secara eksplisit dalam bahasa Ibrani dan dipertahankan dengan bentuk posesif "-nya".
