  - severity: low
    issue: '"keluarganya" mempersempit citra "rumahnya."'
    rationale: בֵּיתוֹ dapat mencakup keluarga atau rumah tangga, tetapi "seisi rumahnya" lebih mempertahankan keluasan citra Ibrani.
  revised_text: Orang yang tamak akan keuntungan mendatangkan kesusahan bagi seisi rumahnya, tetapi orang yang membenci suap[a] akan hidup.
