review_pass:
  verdict: revise
  source_fidelity: Frasa "keuntungan haram" menambahkan kualifikasi eksplisit yang tidak dinyatakan oleh בָּצַע. Kata tersebut dapat berkonotasi keuntungan yang tercela dalam pemakaian tertentu, tetapi pepatah ini tidak perlu mempersempitnya dengan "haram". "Tamak akan keuntungan" mempertahankan intensifikasi gagasan mencari keuntungan tanpa penambahan tersebut. "Seisi rumahnya" lebih dekat dengan citra בֵּיתוֹ sambil tetap mencakup rumah tangga.
  naturalness: Revisi ini memakai susunan pepatah yang baku, ringkas, dan alami dalam bahasa Indonesia modern. "Mendatangkan kesusahan bagi seisi rumahnya" jelas dan idiomatis.
  terminology: '"Suap" adalah pemaknaan kontekstual yang layak untuk מַתָּנוֹת; catatan kaki mempertahankan arti leksikal yang lebih luas, "pemberian-pemberian."'
