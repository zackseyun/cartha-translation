  text: עֹכֵ֣ר בֵּ֭ית/וֹ בּוֹצֵ֣עַ בָּ֑צַע וְ/שׂוֹנֵ֖א מַתָּנֹ֣ת יִחְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/027.yaml
  text: Whoever is greedy for gain troubles his own house[a], but he who hates bribes will live.
translation:
  language: id
  text: Orang yang tamak akan keuntungan mendatangkan kesusahan bagi seisi rumahnya, tetapi orang yang membenci suap[a] akan hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “pemberian-pemberian”; dalam konteks ini kemungkinan besar yang dimaksud adalah suap.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹכֵר
  choice: mendatangkan kesusahan
  rationale: Partisipel dari עכר menyatakan tindakan menimbulkan kesusahan atau malapetaka. Pilihan ini alami dalam bahasa Indonesia dan tidak melebihkan maknanya menjadi kehancuran total.
- source_word: בֵּיתוֹ
  choice: atas keluarganya
  rationale: בַּיִת dapat menunjuk rumah, seisi rumah, atau keluarga. Dalam konteks akibat perilaku seseorang, 'keluarganya' menyampaikan lingkup rumah tangga yang terkena dampak secara jelas dan wajar.
- source_word: בּוֹצֵעַ בָּצַע
  choice: serakah akan keuntungan haram
  rationale: Gabungan verba dan nomina seakar menekankan nafsu memperoleh keuntungan, dengan konotasi keuntungan yang tidak sah atau tidak jujur. 'Serakah akan keuntungan haram' mempertahankan unsur kerakusan dan celaan moral dalam ungkapan Ibrani.
- source_word: וְשׂוֹנֵא
  choice: tetapi orang yang membenci
  rationale: וְ secara bentuk berarti 'dan', tetapi paralelisme antitetis ayat ini paling alami dinyatakan dengan 'tetapi' dalam bahasa Indonesia.
- source_word: מַתָּנוֹת
  choice: suap
  rationale: Secara leksikal kata ini berarti 'pemberian-pemberian', tetapi dalam konteks keuntungan tercela dan perilaku yang mengancam hidup, pemberian yang dimaksud paling mungkin adalah suap. Makna harfiahnya dipertahankan dalam catatan kaki.
- source_word: יִחְיֶה
  choice: akan hidup
  rationale: Bentuk imperfek dari חיה dibiarkan ringkas sebagai 'akan hidup', sehingga cakupannya—bertahan hidup, menikmati kehidupan, atau mengalami kesejahteraan dalam kerangka hikmat—tidak dipersempit.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan pepatah yang ringkas dan bermartabat. 'Keluarganya' dipilih daripada 'rumahnya' agar dampak sosialnya langsung dipahami, sedangkan 'akan hidup' mempertahankan keluasan dan ketegangan ungkapan hikmat Ibrani.
