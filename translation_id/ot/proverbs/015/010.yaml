  yaml_path: translation/ot/proverbs/015/010.yaml
  text: Harsh discipline is for one who forsakes the path[b][a]; whoever hates reproof will die.
translation:
  language: id
  text: Didikan keras bagi orang yang meninggalkan jalan[a]; siapa yang membenci teguran akan mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cara hidup.” Kata Ibrani ini secara harfiah berarti “jalan” dan dalam sastra hikmat sering menjadi gambaran bagi arah moral kehidupan seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּסָר רָע
  choice: didikan keras
  rationale: מוּסָר menunjuk pada didikan yang mengoreksi atau disiplin, sedangkan רָע di sini paling wajar menyatakan berat atau menyakitkannya didikan itu. Frasa 'didikan keras' alami dalam bahasa Indonesia dan tidak menyiratkan bahwa didikan tersebut jahat secara moral.
- source_word: לְעֹזֵב
  choice: menanti orang yang meninggalkan
  rationale: Preposisi לְ menyatakan peruntukan atau hubungan, dan partisip עֹזֵב menggambarkan orang yang meninggalkan. 'Menanti' membuat hubungan predikatif dalam klausa nominal Ibrani jelas tanpa mengubah akibatnya menjadi perintah.
- source_word: אֹרַח
  choice: jalan
  rationale: Dalam sastra hikmat, אֹרַח lazim menjadi metafora bagi arah atau perilaku hidup. 'Jalan' mempertahankan metafora itu dengan ungkapan Indonesia yang alami.
- source_word: שׂוֹנֵא
  choice: siapa membenci
  rationale: Partisip ini berfungsi secara umum atau gnomic. 'Siapa membenci' menyampaikan cakupan umum secara ringkas dan tidak membatasi jenis kelamin.
- source_word: תוֹכַחַת
  choice: teguran
  rationale: תוֹכַחַת adalah koreksi atau kecaman verbal. 'Teguran' merupakan istilah Indonesia yang lazim dan tetap dapat dibedakan dari מוּסָר, yaitu didikan atau disiplin korektif.
- source_word: יָמוּת
  choice: akan mati
  rationale: Bentuk imperfek menyatakan hasil atau konsekuensi umum. 'Akan mati' mempertahankan ketegasan kata מות tanpa mempersempit jenis kematian yang dimaksud.
theological_decisions:
- issue: Hakikat kematian yang diancamkan
  choice: akan mati
  alternative: akan binasa; akan mengalami kehancuran; akan mati secara jasmani
  rationale: Teks memakai מות tanpa menjelaskan apakah kematian itu jasmani, moral, atau bersifat akhir. Terjemahan mempertahankan istilah langsung dan ambiguitas teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada hikmat. Paralelisme dua klausa dipertahankan. 'Didikan keras' dipilih daripada 'disiplin yang buruk' agar konteks korektif jelas tanpa memberi penilaian bahwa didikan itu jahat.
