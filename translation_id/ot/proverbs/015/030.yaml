  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Paralelisme dua bagian dipertahankan dengan titik koma. Gambaran “cahaya mata” dipertahankan, sedangkan idiom yang sangat asing tentang tulang dialihkan secara optimal menjadi “menyegarkan tulang-tulang” dan bentuk harfiahnya dijelaskan dalam catatan kaki.
