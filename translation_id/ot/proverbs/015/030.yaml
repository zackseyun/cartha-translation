  text: מְֽאוֹר עֵ֭ינַיִם יְשַׂמַּֽח לֵ֑ב שְׁמוּעָ֥ה ט֝וֹבָ֗ה תְּדַשֶּׁן עָֽצֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/030.yaml
  text: The light of the eyes gladdens the heart[b][a]; good news fattens the bones.
translation:
  language: id
  text: Sorot mata yang cerah[a] menggembirakan hati; kabar baik menyegarkan tulang-tulang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “cahaya” atau “kecerahan mata”; ungkapan ini menunjuk pada sorot atau raut yang cerah dan riang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “membuat tulang menjadi gemuk”; ungkapan ini menggambarkan kesegaran dan kekuatan yang meresap ke seluruh tubuh.
    reason: cultural_note
lexical_decisions:
- source_word: מְאוֹר
  choice: cahaya
  rationale: Kata benda ini berarti cahaya atau kecerahan. “Cahaya” mempertahankan gambaran konkret Ibrani sekaligus membuka kemungkinan makna tatapan atau wajah yang cerah.
- source_word: עֵינַיִם
  choice: mata
  rationale: Bentuk rangkaian dengan מְאוֹר diterjemahkan secara dekat sebagai “cahaya mata”, tanpa membatasi ungkapan itu hanya pada ekspresi riang.
- source_word: יְשַׂמַּח
  choice: menggembirakan
  rationale: Bentuk piel dari שׂמח menyatakan tindakan yang menyebabkan sukacita; “menggembirakan” alami dan mempertahankan daya kausatifnya.
- source_word: לֵב
  choice: hati
  rationale: “Hati” merupakan padanan lazim yang mempertahankan gambaran antropologis Ibrani tentang batin manusia.
- source_word: שְׁמוּעָה
  choice: kabar
  rationale: Kata ini dapat berarti kabar atau laporan. Bersama טוֹבָה, “kabar baik” merupakan ungkapan Indonesia yang alami.
- source_word: טוֹבָה
  choice: baik
  rationale: Kata sifat ini secara langsung menerangkan שְׁמוּעָה; “baik” adalah padanan yang jelas dan wajar.
- source_word: תְּדַשֶּׁן
  choice: menyegarkan
  rationale: Secara harfiah kata kerja ini berarti membuat gemuk atau subur, dan secara kiasan menyatakan pemulihan serta vitalitas. “Menyegarkan” menyampaikan fungsi idiomnya dalam bahasa Indonesia, sementara metafora harfiahnya dicatat dalam catatan kaki.
- source_word: עָצֶם
  choice: tulang-tulang
  rationale: Walaupun berbentuk tunggal dalam bahasa Ibrani, kata ini berfungsi secara kolektif. Bentuk jamak Indonesia mempertahankan gambaran jasmani tentang kekuatan yang mendalam.
