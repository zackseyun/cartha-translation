  text: Folly is joy to one lacking sense[a], but a man of understanding makes his path straight.
translation:
  language: id
  text: Kebodohan adalah sukacita bagi orang yang kurang akal sehat[a], tetapi orang yang berpengertian meluruskan langkahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang kekurangan hati”; dalam bahasa Ibrani, ini adalah ungkapan bagi orang yang kurang akal sehat atau pertimbangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִוֶּלֶת
  choice: Kebodohan
  rationale: Nomina abstrak ini menyatakan sifat atau perilaku bodoh dan membentuk kontras langsung dengan pengertian.
- source_word: שִׂמְחָה
  choice: adalah sukacita
  rationale: Mempertahankan konstruksi predikat nominal dan bentuk pepatah Ibrani yang ringkas.
- source_word: לַחֲסַר לֵב
  choice: bagi orang yang kurang berakal
  rationale: Secara harfiah berarti 'yang kekurangan hati', tetapi dalam sastra hikmat ungkapan ini menunjuk pada kekurangan akal sehat atau pertimbangan, bukan kekurangan emosi.
- source_word: אִישׁ תְּבוּנָה
  choice: orang yang berpengertian
  rationale: Mengungkapkan pribadi yang memiliki pengertian atau daya memahami; bahasa Indonesia tidak perlu menandai gender gramatikal seperti bentuk maskulin Ibrani.
- source_word: יְיַשֶׁר
  choice: meluruskan
  rationale: Bentuk piel dari ישר memiliki daya kausatif, yakni membuat lurus atau mengarahkan secara lurus.
- source_word: לָכֶת
  choice: jalan hidupnya
  rationale: Infinitif 'berjalan/pergi' dipakai secara idiomatis bagi perilaku atau arah kehidupan; 'jalan hidupnya' mempertahankan metafora berjalan dengan jelas.
theological_decisions:
- issue: Bahasa maskulin representatif
  choice: orang yang kurang berakal ... orang yang berpengertian
  alternative: laki-laki yang kurang berakal ... laki-laki yang berpengertian
  rationale: Bentuk maskulin tunggal Ibrani berfungsi secara representatif dalam sastra hikmat. Kata 'orang' menyampaikan cakupan generik secara alami dalam bahasa Indonesia tanpa menghapus perbedaan makna yang relevan.
- issue: Daya kausatif יְיַשֶׁר
  choice: meluruskan jalan hidupnya
  alternative: berjalan lurus
  rationale: Pilihan ini mempertahankan gagasan bahwa orang berpengertian secara sengaja membuat atau mengarahkan jalan hidupnya menjadi lurus, bukan sekadar menyatakan bahwa ia berjalan lurus.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada hikmat. Paralelisme antarkedua bagian dipertahankan; 'sukacita' dipilih untuk nuansa שמחה, sedangkan 'jalan hidupnya' membuat metafora לכת wajar dan jelas bagi pembaca umum.
