  text: תּוֹעֲבַ֣ת יְ֭הוָה דֶּ֣רֶךְ רָשָׁ֑ע וּ/מְרַדֵּ֖ף צְדָקָ֣ה יֶאֱהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/009.yaml
  text: The way of the wicked is an abomination to Yahweh[b][a], but he loves the one who pursues righteousness.
translation:
  language: id
  text: Jalan orang fasik adalah kekejian bagi Yahweh, tetapi Dia mengasihi orang yang mengejar kebenaran[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang yang mengejar keadilan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: sesuatu yang menjijikkan
  rationale: Nomina ini menyatakan sesuatu yang sangat dibenci atau dianggap keji. Ungkapan ini mempertahankan daya evaluatif yang kuat sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap dipertahankan.
- source_word: דֶּרֶךְ
  choice: jalan
  rationale: Dalam Amsal, kata ini dapat menunjuk pada jalan hidup atau perilaku. 'Jalan' mempertahankan metafora khas sastra hikmat.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Bentuk tunggal ini bersifat generik. 'Orang fasik' menyampaikan sosok yang bercirikan kefasikan tanpa membatasinya pada jenis kelamin tertentu.
- source_word: מְרַדֵּף
  choice: orang yang mengejar
  rationale: Partisipel ini menggambarkan ciri atau tindakan yang terus-menerus. 'Orang yang mengejar' alami dalam bahasa Indonesia dan mempertahankan sifat generiknya.
- source_word: צְדָקָה
  choice: kebenaran
  rationale: Dalam konteks Amsal, kata ini mencakup kelurusan moral dan tatanan yang benar. 'Kebenaran' mempertahankan keluasan etis-teologisnya; 'keadilan' juga mungkin.
- source_word: יֶאֱהָב
  choice: Dia mengasihi
  rationale: Bentuk imperfek menyatakan kebenaran umum, bukan terutama waktu mendatang. Kala kini tersirat secara alami dalam ungkapan Indonesia ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi dan tidak menggantinya dengan gelar.
- issue: Cakupan צְדָקָה
  choice: kebenaran
  alternative: keadilan; apa yang benar
  rationale: Konteks hikmat memungkinkan nuansa kelurusan moral maupun keadilan. Teks utama memakai istilah yang lebih luas, sementara alternatif dicatat agar ketegangan leksikal tidak dihapus.
- issue: Ungkapan maskulin generik
  choice: orang fasik / orang yang mengejar kebenaran
  alternative: laki-laki fasik / laki-laki yang mengejar kebenaran
  rationale: Bentuk maskulin tunggal Ibrani berfungsi secara representatif dan tidak membatasi pernyataan ini hanya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme antitetis dipertahankan; pronomina 'Dia' merujuk kepada Yahweh. Penanda catatan kaki [a] tercantum dalam teks utama.
