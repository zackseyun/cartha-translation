translation:
  language: id
  text: Lebih baik hidangan sayuran yang disertai kasih daripada seekor lembu tambun yang di dalamnya ada kebencian[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lembu dari kandang”; ungkapan Ibrani dapat menekankan pemberian makan di kandang atau keadaan tambun yang dihasilkannya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan kebencian di dalamnya”; kemungkinan yang dimaksud ialah hidangan atau lingkungan rumah tangga yang diliputi kebencian.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Lebih baik
  rationale: Dalam peribahasa komparatif dengan מִן, טוֹב berfungsi sebagai ungkapan perbandingan, yaitu “lebih baik ... daripada ...”.
- source_word: אֲרֻחַת יָרָק
  choice: seporsi sayuran
  rationale: אֲרֻחָה menunjuk pada porsi atau hidangan makanan, sedangkan יָרָק menunjuk pada tumbuhan hijau yang dimakan; “seporsi sayuran” ringkas, wajar, dan mempertahankan gambaran hidangan sederhana.
- source_word: וְאַהֲבָה שָׁם
  choice: di tempat ada kasih
  rationale: Terjemahan ini mempertahankan unsur lokatif שָׁם (“di sana”) sambil mengungkapkannya secara alami dalam bahasa Indonesia.
- source_word: מִשּׁוֹר אָבוּס
  choice: daripada seekor lembu tambun
  rationale: שׁוֹר berarti lembu, sedangkan אָבוּס dapat menggambarkan hewan yang diberi makan di kandang atau hasilnya, yaitu menjadi tambun. Pilihan utama menonjolkan kelimpahan hidangan, sementara alternatif leksikal dicatat dalam catatan kaki.
- source_word: וְשִׂנְאָה בוֹ
  choice: yang disertai kebencian
  rationale: Ungkapan ini menyampaikan kontras antara jamuan mewah dan suasana penuh kebencian secara alami, tanpa memaksakan acuan pronomina בוֹ yang dapat menunjuk pada hidangan atau lingkungan rumah tangga.
