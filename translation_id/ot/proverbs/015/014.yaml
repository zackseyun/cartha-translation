  yaml_path: translation/ot/proverbs/015/014.yaml
  text: The heart of the discerning seeks knowledge[a], but the face of fools feeds on folly.
translation:
  language: id
  text: 'Hati orang yang berpengertian mencari pengetahuan,

    tetapi wajah[a] orang-orang bebal memakan kebodohan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani berbunyi “wajah orang-orang bebal memakan kebodohan.” Sebagian terjemahan memakai “mulut orang-orang bebal” agar gambaran tentang makan lebih jelas.
    reason: alternative_reading
lexical_decisions:
- source_word: לֵב
  choice: hati
  rationale: Dalam sastra hikmat Ibrani, kata ini menunjuk pada batin sebagai pusat pikiran, kehendak, dan pertimbangan; “hati” mempertahankan metafora sumber.
- source_word: נָבוֹן
  choice: orang yang berpengertian
  rationale: Bentuk ini menggambarkan orang yang memiliki daya memahami dan membedakan; ungkapan Indonesia ini jelas dan bermartabat.
- source_word: יְבַקֶּשׁ
  choice: mencari
  rationale: Kata kerja ini menyatakan usaha aktif untuk memperoleh sesuatu; “mencari” ringkas dan alami.
- source_word: דָּעַת
  choice: pengetahuan
  rationale: Ini adalah padanan langsung yang lazim dalam konteks hikmat dan mempertahankan kaitannya dengan pembelajaran serta pengenalan yang benar.
- source_word: וּפְנֵי
  choice: tetapi wajah
  rationale: Teks Masoret secara langsung berbunyi “wajah”; pilihan ini mempertahankan gambaran Ibrani yang tidak biasa alih-alih diam-diam menggantinya dengan “mulut”.
- source_word: כְסִילִים
  choice: orang-orang bebal
  rationale: “Bebal” menyampaikan kategori moral dan intelektual khas Amsal, bukan sekadar kekurangan kecerdasan.
- source_word: יִרְעֶה
  choice: memakan
  rationale: Kata ini secara harfiah berkaitan dengan merumput atau makan seperti ternak. “Memakan” mempertahankan citra konsumsi dan lebih alami dengan objek abstrak dalam bahasa Indonesia.
- source_word: אִוֶּלֶת
  choice: kebodohan
  rationale: Padanan ini menyatakan kebalikan moral-intelektual dari hikmat dalam Amsal dan mudah dipahami pembaca modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan puitis. Paralelisme dua baris dipertahankan. Ungkapan “wajah ... memakan” sengaja dibiarkan agak ganjil karena mengikuti Teks Masoret; catatan kaki memberi alternatif “mulut” tanpa memasukkannya ke dalam teks utama.
