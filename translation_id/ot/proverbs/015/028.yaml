source:
  edition: WLC
  text: לֵ֣ב צַ֭דִּיק יֶהְגֶּ֣ה לַ/עֲנ֑וֹת וּ/פִ֥י רְ֝שָׁעִ֗ים יַבִּ֥יעַ רָעֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/028.yaml
  text: The heart of the righteous considers how to answer[a], but the mouth of the wicked pours out evil things.
translation:
  language: id
  text: Hati orang benar memikirkan bagaimana menjawab[a], tetapi mulut orang-orang fasik mencurahkan hal-hal jahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “merenung sebelum menjawab.” Kata kerja Ibrani dapat berarti merenung atau menimbang-nimbang; frasa ini secara lebih harfiah dapat diterjemahkan “merenung untuk menjawab.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: hati
  rationale: Dalam sastra hikmat Ibrani, “hati” mencakup batin, pikiran, dan pertimbangan. Pilihan ini mempertahankan gambaran Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Kata sifat ini dipakai sebagai nomina untuk seorang yang hidup benar. “Orang benar” alami, ringkas, dan tidak mempersempit maknanya berdasarkan gender.
- source_word: יֶהְגֶּה
  choice: memikirkan
  rationale: Kata kerja ini dapat berarti merenung, memikirkan, atau menimbang-nimbang. Dalam kaitannya dengan tindakan menjawab, “memikirkan” menyampaikan pertimbangan yang mendahului ucapan tanpa terlalu menafsirkan caranya.
- source_word: לַעֲנוֹת
  choice: bagaimana menjawab
  rationale: Infinitif dengan ל menyatakan arah atau tujuan pertimbangan itu. Penambahan “bagaimana” menghasilkan ungkapan Indonesia yang alami dan menunjukkan proses mempertimbangkan jawaban.
- source_word: וּפִי
  choice: tetapi mulut
  rationale: Konjungsi Ibrani secara harfiah berarti “dan”, tetapi paralelisme antitesis di sini menunjukkan pertentangan; “tetapi” menyatakannya secara alami.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Bentuk jamak substantival ini menunjuk pada golongan orang yang bersalah atau jahat secara moral. “Orang-orang fasik” mempertahankan jumlah jamak dan kontras hikmat dengan “orang benar”.
- source_word: יַבִּיעַ
  choice: mencurahkan
  rationale: Bentuk ini menggambarkan sesuatu yang dibuat memancar, meluap, atau mengalir keluar. “Mencurahkan” mempertahankan gambaran ucapan yang keluar dengan deras.
- source_word: רָעוֹת
  choice: hal-hal jahat
  rationale: Bentuk jamak ini dapat menunjuk pada berbagai perkara, ucapan, atau akibat yang jahat. “Hal-hal jahat” mempertahankan keluasan dan bentuk jamaknya.
