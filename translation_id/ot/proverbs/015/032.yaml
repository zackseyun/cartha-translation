  text: פּוֹרֵ֣עַ מ֭וּסָר מוֹאֵ֣ס נַפְשׁ֑/וֹ וְ/שׁוֹמֵ֥עַ תּ֝וֹכַ֗חַת ק֣וֹנֶה לֵּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/032.yaml
  text: Whoever ignores discipline despises himself, but he who listens to reproof gains understanding.
translation:
  language: id
  text: Orang yang mengabaikan didikan membenci dirinya sendiri, tetapi orang yang mendengarkan teguran memperoleh pengertian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פּוֹרֵעַ מוּסָר
  choice: yang mengabaikan didikan
  rationale: פּוֹרֵעַ dalam konteks ini berarti menolak atau mengabaikan, sedangkan מוּסָר mencakup didikan yang membentuk dan mengoreksi. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya moral teks.
- source_word: מוֹאֵס נַפְשׁוֹ
  choice: membenci dirinya sendiri
  rationale: נֶפֶשׁ di sini menunjuk pada diri atau kehidupan orang itu sendiri, bukan hanya 'jiwa' sebagai bagian nonjasmani. Terjemahan ini mempertahankan ungkapan tajam dari teks Ibrani.
- source_word: שׁוֹמֵעַ תּוֹכַחַת
  choice: mendengarkan teguran
  rationale: שׁמע mengandung arti mendengar dengan sikap menerima atau mengindahkan; 'mendengarkan' menyampaikan respons yang disengaja. תּוֹכַחַת berarti teguran atau koreksi.
- source_word: קֹנֶה לֵב
  choice: memperoleh pengertian
  rationale: Secara harfiah ungkapan ini berarti 'memperoleh hati'. Dalam antropologi Ibrani, לֵב merupakan pusat pemikiran dan pertimbangan; 'memperoleh pengertian' menyampaikan idiom tersebut secara alami tanpa membatasi maknanya pada emosi.
theological_decisions:
- issue: Arti נַפְשׁוֹ dalam pernyataan akibat menolak didikan
  choice: dirinya sendiri
  alternative: jiwanya sendiri / hidupnya sendiri
  rationale: Pilihan ini tidak mengimpor dikotomi tubuh-jiwa dan menjaga cakupan Ibrani yang menunjuk pada keseluruhan diri.
- issue: Arti idiom קֹנֶה לֵב
  choice: memperoleh pengertian
  alternative: memperoleh hati / menjadi bijaksana
  rationale: Terjemahan ini mempertahankan hasil kognitif dan moral dari menerima teguran tanpa memperluasnya secara khusus menjadi 'kebijaksanaan' atau mempertahankan idiom yang kabur dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada hikmat. Paralelisme antarkedua klausa dipertahankan; 'tetapi' menandai kontras. Tidak diperlukan catatan kaki.
