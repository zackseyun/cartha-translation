id: PRO.15.25
reference: Proverbs 15:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בֵּ֣ית גֵּ֭אִים יִסַּ֥ח יְהוָ֑ה וְ֝/יַצֵּ֗ב גְּב֣וּל אַלְמָנָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/025.yaml
  text: Yahweh tears down the house of the proud[b][a], but he sets firm the boundary of the widow.
translation:
  language: id
  text: Yahweh merobohkan rumah orang-orang sombong[a], tetapi Ia menegakkan batas tanah seorang janda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mencabut rumah orang-orang sombong.” Kata kerja Ibraninya dapat berarti menyingkirkan atau mencabut, bukan hanya merobohkan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “meneguhkan garis batas milik seorang janda.” Gambaran ini berkaitan dengan perlindungan atas tanah dan hak milik seorang janda.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית
  choice: rumah
  rationale: Mempertahankan gambaran konkret rumah, sambil tetap memungkinkan pengertian yang lebih luas, yaitu rumah tangga atau seluruh milik orang tersebut.
- source_word: גֵּאִים
  choice: orang-orang sombong
  rationale: Bentuk jamak ini menunjuk kepada orang yang congkak atau tinggi hati; pilihan ini alami dalam bahasa Indonesia dan sesuai dengan pertentangan khas sastra hikmat.
- source_word: יִסַּח
  choice: merobohkan
  rationale: Kata kerja ini menyatakan tindakan menyingkirkan, mencabut, atau meruntuhkan. Dengan objek 'rumah', 'merobohkan' menyampaikan daya penghancurnya secara alami tanpa meniadakan kemungkinan nuansa 'mencabut'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh' agar nama pribadi yang terdapat dalam teks Ibrani dipertahankan, bukan diganti dengan gelar.
- source_word: וְיַצֵּב
  choice: tetapi Ia menegakkan
  rationale: Bentuk kausatif dari יצב berarti membuat teguh atau menetapkan. Kata sambung diterjemahkan 'tetapi' karena kedua bagian amsal membentuk pertentangan antara penghukuman orang sombong dan perlindungan terhadap janda.
- source_word: גְּבוּל
  choice: batas tanah
  rationale: Kata ini berarti batas, perbatasan, atau garis batas. Dalam konteks kepemilikan janda, 'batas tanah' memperjelas gambaran hak milik tanpa mengubah isinya menjadi istilah hukum yang lebih khusus.
- source_word: אַלְמָנָה
  choice: seorang janda
  rationale: Ungkapan tunggal ini mewakili golongan janda sebagai kelompok rentan. 'Seorang janda' terdengar alami dalam bahasa Indonesia dan tetap mempertahankan penggambaran individual dalam teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu sebagai nama pribadi dan tidak menggantinya dengan sebuah gelar.
- issue: Fungsi kata sambung ו sebelum יַצֵּב
  choice: tetapi
  alternative: dan
  rationale: 'Secara bentuk, ו dapat berarti ''dan'', tetapi paralelisme amsal ini bersifat antitetis: rumah orang sombong disingkirkan, sedangkan batas tanah janda dibuat teguh. ''Tetapi'' menyatakan fungsi wacananya tanpa menambah gagasan baru.'
- issue: Cakupan perlindungan terhadap janda
  choice: menegakkan batas tanah seorang janda
  alternative: menetapkan wilayah janda
  rationale: Terjemahan mempertahankan citra batas kepemilikan dan menyiratkan perlindungan Yahweh terhadap hak orang rentan, tanpa memperluas teks menjadi pernyataan hukum yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua klausa dibuat ringkas agar daya kontras amsal tetap terasa. Pronomina 'Ia' dipakai untuk merujuk kembali kepada Yahweh dengan jelas; tidak ada penjelasan doktrinal tambahan yang dimasukkan ke dalam teks utama.
