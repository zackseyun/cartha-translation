  yaml_path: translation/ot/proverbs/015/012.yaml
  text: A mocker does not love one who corrects him[a]; he will not go to the wise.
translation:
  language: id
  text: 'Pencemooh tidak mengasihi orang yang menegurnya;

    ia tidak akan mendatangi orang-orang bijak.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵץ
  choice: pencemooh
  rationale: Kata ini menunjuk pada orang yang bersikap menghina dan memperolok dalam sastra hikmat. “Pencemooh” alami dalam bahasa Indonesia modern dan mempertahankan sifat aktifnya.
- source_word: יֶאֱהַב
  choice: tidak mengasihi
  rationale: Kata kerja Ibrani ini adalah kata umum untuk “mengasihi”. Terjemahan langsung mempertahankan ketajaman pernyataan tanpa melebihkannya menjadi “membenci” atau melemahkannya menjadi sekadar “tidak suka”.
- source_word: הוֹכֵחַ לוֹ
  choice: orang yang menegurnya
  rationale: Partisip ini menunjuk pada orang yang memberikan teguran untuk memperbaiki. “Menegur” menyampaikan unsur koreksi dengan wajar tanpa harus memberi kesan yang terlalu keras.
- source_word: אֶל חֲכָמִים
  choice: mendatangi orang-orang bijak
  rationale: Preposisi אֶל bersama kata kerja gerak menyatakan arah atau pendekatan kepada orang-orang bijak. “Mendatangi” mengungkapkan gerak mendekat secara alami, sedangkan bentuk jamak dipertahankan.
- source_word: לֹא יֵלֵךְ
  choice: ia tidak akan mendatangi
  rationale: Dalam konteks ini הלך berarti pergi atau datang mendekat. Bentuk “tidak akan” menonjolkan keengganan khas si pencemooh, sebagaimana lazim dalam pernyataan amsal.
theological_decisions:
- issue: Cakupan gender חֲכָמִים
  choice: orang-orang bijak
  alternative: laki-laki bijak
  rationale: Walaupun bentuk Ibraninya maskulin jamak secara gramatikal, dalam sastra hikmat bentuk ini lazim menunjuk secara umum kepada orang yang bijak, bukan hanya laki-laki. Bahasa Indonesia dapat mempertahankan cakupan umum itu secara alami.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Paralelisme dua baris dipertahankan. “Pencemooh” cocok dengan ragam sastra hikmat, sedangkan “menegurnya” dan “mendatangi” tetap mudah dipahami pembaca umum.
