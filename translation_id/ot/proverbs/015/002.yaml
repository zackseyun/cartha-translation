source:
  edition: WLC
  text: לְשׁ֣וֹן חֲ֭כָמִים תֵּיטִ֣יב דָּ֑עַת וּ/פִ֥י כְ֝סִילִ֗ים יַבִּ֥יעַ אִוֶּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/002.yaml
  text: The tongue of the wise makes knowledge good[b][a], but the mouth of fools pours out folly.
translation:
  language: id
  text: Lidah orang bijak menyajikan pengetahuan dengan baik[a], tetapi mulut orang bebal mencurahkan kebodohan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “membuat pengetahuan menjadi baik.” Dapat juga berarti “menggunakan pengetahuan dengan baik,” “memperindah pengetahuan,” atau “membuat pengetahuan menarik.” Kata kerja Ibraninya berbentuk kausatif dan dapat menunjuk pada penggunaan pengetahuan yang bermanfaat atau pada cara menyampaikannya dengan baik.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “memancarkan” atau “menyemburkan.” Kata kerja Ibraninya menggambarkan sesuatu yang keluar dengan deras dan berlimpah.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשׁוֹן
  choice: lidah
  rationale: Mempertahankan gambaran konkret anggota tubuh sebagai kiasan bagi perkataan, sekaligus berpadanan dengan “mulut” pada baris kedua.
- source_word: חֲכָמִים
  choice: orang bijak
  rationale: Bentuk jamak substantival ini menunjuk pada suatu golongan tanpa perlu membatasi jenis kelamin.
- source_word: תֵּיטִיב
  choice: menyajikan ... dengan baik
  rationale: Bentuk kausatif dari יטב menyatakan membuat sesuatu menjadi baik. Dalam konteks perkataan, ungkapan ini secara alami mencakup penggunaan atau penyampaian pengetahuan secara baik, sementara kemungkinan maknanya yang lain dicatat dalam catatan kaki.
- source_word: דָּעַת
  choice: pengetahuan
  rationale: Padanan lazim dalam sastra hikmat yang mempertahankan pertentangan antara pengetahuan dan kebodohan.
- source_word: וּפִי
  choice: tetapi mulut
  rationale: Waw diterjemahkan secara adversatif karena baris kedua berlawanan tajam dengan baris pertama; “mulut” mempertahankan gambaran tubuh dalam teks Ibrani.
- source_word: כְסִילִים
  choice: orang bebal
  rationale: “Orang bebal” merupakan istilah alami dan bermuatan moral-intelektual dalam konteks Amsal, bukan sekadar orang yang kurang cerdas.
- source_word: יַבִּיעַ
  choice: mencurahkan
  rationale: Kata kerja ini menggambarkan sesuatu yang memancar atau mengalir keluar dengan deras dan berlimpah; “mencurahkan” mempertahankan gambaran tersebut dalam bahasa Indonesia yang wajar.
- source_word: אִוֶּלֶת
  choice: kebodohan
  rationale: Menunjuk pada sifat maupun ungkapan perilaku bebal; padanan ini jelas dan lazim dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas dan puitis. Paralelisme konkret “lidah ... mulut” dipertahankan. “Orang bijak” dan “orang bebal” dipilih sebagai kategori umum yang tidak membatasi jenis kelamin. Penanda catatan kaki ditempatkan pada klausa yang benar sesuai persoalan leksikal masing-masing.
