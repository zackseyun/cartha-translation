  text: תּוֹעֲבַ֣ת יְ֭הוָה מַחְשְׁב֣וֹת רָ֑ע וּ֝/טְהֹרִ֗ים אִמְרֵי נֹֽעַם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/026.yaml
  text: Evil plans are an abomination to Yahweh[b][a], but pleasant words are pure.
translation:
  language: id
  text: Rancangan[a] jahat adalah kekejian bagi Yahweh, tetapi perkataan yang menyenangkan adalah murni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pikiran” atau “rencana.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan murni perkataan yang menyenangkan.”
    reason: source_structure
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: kekejian
  rationale: Bentuk konstruk ini menyatakan sesuatu yang sangat menjijikkan atau tidak berkenan bagi Yahweh. “Kekejian” mempertahankan bobot moral yang kuat dalam sastra hikmat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Menerjemahkan nama ilahi יהוה sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: מַחְשְׁבוֹת
  choice: rancangan
  rationale: Kata ini dapat berarti pikiran, maksud, rencana, atau siasat. Dalam konteks ini, “rancangan” mencakup niat batin sekaligus rencana yang dipikirkan dan terdengar alami dalam bahasa Indonesia.
- source_word: רָע
  choice: jahat
  rationale: Kata sifat ini menerangkan rancangan tersebut tanpa menyisipkan pelaku yang tidak disebutkan dalam teks Ibrani.
- source_word: וּטְהֹרִים
  choice: tetapi ... itu murni
  rationale: Waw dipahami secara adversatif karena paralelisme antitetis. Susunan kata Ibrani menempatkan “murni” lebih dahulu, tetapi susunannya dibalik agar alami dalam bahasa Indonesia.
- source_word: אִמְרֵי
  choice: perkataan
  rationale: Bentuk jamak konstruk ini menunjuk pada ucapan atau kata-kata yang diucapkan; “perkataan” sesuai dengan gaya ringkas pepatah.
- source_word: נֹעַם
  choice: yang menyenangkan
  rationale: Nomina ini menyatakan kesenangan, kemanisan, atau keelokan. Frasa ini mempertahankan makna umum tanpa mempersempitnya menjadi istilah teologis seperti “penuh anugerah”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama pribadi Allah dalam bentuk transliterasi yang lazim secara akademis.
- issue: Hubungan antarkedua baris pepatah
  choice: Kontras antara rancangan jahat dan perkataan yang menyenangkan serta murni
  alternative: Menghubungkan “murni” dengan orang-orang murni
  rationale: Secara gramatikal, טְהֹרִים paling wajar berfungsi sebagai predikat jamak bagi אִמְרֵי נֹעַם. Terjemahan tidak menambahkan subjek manusia yang tidak dinyatakan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur paralel pepatah dipertahankan, dengan penataan ulang klausa kedua agar alami bagi pembaca modern.
