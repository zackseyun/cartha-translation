  text: A fool despises his father's discipline[a], but whoever heeds reproof is prudent.
translation:
  language: id
  text: Orang bodoh meremehkan didikan ayahnya, tetapi siapa yang mengindahkan teguran[a] menjadi bijaksana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tetapi orang yang memelihara teguran bertindak dengan cerdik.” Kata Ibrani yang diterjemahkan “mengindahkan” secara harfiah berarti “menjaga” atau “memelihara”; kata kerja terakhir dapat berarti “menjadi bijaksana” atau “bertindak dengan cerdik.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִיל
  choice: orang bodoh
  rationale: Istilah hikmat ini menunjuk pada orang yang bodoh secara moral dan praktis, bukan sekadar kurang cerdas.
- source_word: יִנְאַץ
  choice: meremehkan
  rationale: Kata kerja ini menyatakan penolakan yang disertai penghinaan; 'meremehkan' alami dalam bahasa Indonesia dan mempertahankan unsur sikap menghina.
- source_word: מוּסַר
  choice: didikan
  rationale: Dalam Amsal, istilah ini mencakup pembinaan, disiplin, dan koreksi. 'Didikan' sesuai dengan konteks ayah-anak dan tidak terbatas pada hukuman.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Teks Ibrani secara khusus menyebut ayah, sehingga unsur gender dipertahankan.
- source_word: וְשֹׁמֵר
  choice: tetapi siapa yang mengindahkan
  rationale: Secara harfiah berarti 'menjaga' atau 'memelihara', tetapi dalam konteks teguran menyatakan menerima dan menaatinya; 'mengindahkan' menyampaikan respons aktif itu secara alami.
- source_word: תּוֹכַחַת
  choice: teguran
  rationale: Kata benda ini menunjuk pada koreksi atau teguran lisan. 'Teguran' merupakan padanan Indonesia yang umum dan tepat bagi laras sastra hikmat.
- source_word: יַעְרִם
  choice: menjadi bijaksana
  rationale: Bentuk verba dapat berarti menjadi atau menunjukkan kecerdikan/kebijaksanaan praktis. 'Menjadi bijaksana' mempertahankan nuansa hasil atau perkembangan tanpa memberi kesan kelicikan.
theological_decisions:
- issue: Bahasa orang tua yang bergender
  choice: ayahnya
  alternative: orang tuanya
  rationale: Bahasa Ibrani secara eksplisit menyebut ayah; terjemahan tidak menetralkan rujukan tersebut.
- issue: Nuansa moral יַעְרִם
  choice: menjadi bijaksana
  alternative: menjadi cerdik
  rationale: '''Bijaksana'' menghindari kemungkinan konotasi negatif ''cerdik'' dalam bahasa Indonesia, sambil mempertahankan gagasan kecakapan praktis yang dihargai dalam konteks ini.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras ringkas dan bermartabat khas amsal. Paralelisme antitesis dipertahankan. Penanda catatan kaki ditempatkan sesudah klausa yang diterangkannya.
