  yaml_path: translation/ot/proverbs/015/013.yaml
  text: A joyful heart makes the face cheerful[b][a], but by the sorrow of the heart the spirit is crushed.
translation:
  language: id
  text: Hati yang gembira membuat wajah berseri[a], tetapi karena kesedihan hati, semangat menjadi hancur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “membuat wajah menjadi baik”; maksudnya juga dapat diterjemahkan “mencerahkan wajah.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “roh menjadi remuk.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב שָׂמֵחַ
  choice: hati yang gembira
  rationale: לֵב menunjuk pada batin manusia, sedangkan שָׂמֵחַ menyatakan kegembiraan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran serta kesejajaran Ibrani.
- source_word: יֵיטִב פָּנִים
  choice: membuat wajah berseri
  rationale: Bentuk kausatif יֵיטִב secara harfiah berarti 'membuat baik'; dengan פָּנִים, maksud idiomatisnya ialah kegembiraan batin memperbaiki atau mencerahkan raut wajah.
- source_word: וּבְעַצְּבַת לֵב
  choice: tetapi karena kepedihan hati
  rationale: Waw berfungsi secara antitetis, sehingga diterjemahkan 'tetapi'. Prefiks בְּ dapat menyatakan sebab, dan עַצְּבַת mencakup kepedihan, kesedihan, atau dukacita.
- source_word: רוּחַ
  choice: semangat
  rationale: Dalam konteks ini רוּחַ menunjuk pada daya atau keadaan batin seseorang, bukan angin atau napas harfiah. 'Semangat' merupakan padanan Indonesia yang alami tanpa meniadakan nuansa batin.
- source_word: נְכֵאָה
  choice: menjadi patah
  rationale: Kata sifat ini menggambarkan keadaan terpukul, remuk, atau patah. Konstruksi Indonesia memakai 'menjadi' untuk mengungkapkan hasil yang dalam Ibrani dinyatakan tanpa kopula eksplisit.
theological_decisions:
- issue: Makna antropologis רוּחַ
  choice: semangat
  alternative: roh
  rationale: Ayat ini berbicara tentang kondisi batin atau daya hidup emosional manusia. 'Semangat' paling alami dalam konteks pepatah, sementara alternatif 'roh' dicatat agar keluasan istilah Ibrani tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada hikmat. Kesejajaran antara hati yang gembira dan kepedihan hati dipertahankan; 'wajah berseri' menyampaikan idiom Ibrani secara alami.
