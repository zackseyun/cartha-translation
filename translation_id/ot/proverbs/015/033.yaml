id: PRO.15.33
reference: Proverbs 15:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יִרְאַ֣ת יְ֭הוָה מוּסַ֣ר חָכְמָ֑ה וְ/לִ/פְנֵ֖י כָב֣וֹד עֲנָוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/033.yaml
  text: The fear of Yahweh is instruction in wisdom[a], and humility comes before honor.
translation:
  language: id
  text: Takut akan Yahweh adalah didikan dalam hikmat[a], dan kerendahan hati mendahului kehormatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Takut akan Yahweh adalah disiplin hikmat.” Kata Ibrani yang diterjemahkan “didikan” juga dapat mengandung arti disiplin atau koreksi yang membentuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: takut akan Yahweh
  rationale: 'Frasa konstruksi ini menyatakan rasa takut yang tertuju kepada Yahweh. Kata “takut” dipertahankan karena dalam sastra hikmat cakupannya lebih luas daripada sekadar rasa hormat: takut yang disertai kekaguman dan ketundukan.'
- source_word: מוּסַר
  choice: didikan
  rationale: Dalam Amsal, istilah ini mencakup pengajaran yang membentuk, termasuk teguran dan disiplin korektif. “Didikan” alami dalam bahasa Indonesia dan tetap membuka nuansa tersebut.
- source_word: חָכְמָה
  choice: hikmat
  rationale: Padanan baku dan sesuai dengan tema utama kitab Amsal.
- source_word: וְלִפְנֵי
  choice: dan ... mendahului
  rationale: Konstruksi ini menunjukkan urutan waktu atau logis. Kata kerja “mendahului” melengkapi klausa nominal Ibrani secara alami tanpa mengubah hubungan antargagasannya.
- source_word: כָבוֹד
  choice: kehormatan
  rationale: Dalam konteks etis dan sosial ini, kata tersebut menunjuk pada martabat atau penghargaan, sehingga “kehormatan” lebih tepat daripada “kemuliaan”.
- source_word: עֲנָוָה
  choice: kerendahan hati
  rationale: Padanan Indonesia yang alami untuk sikap rendah hati atau kerendahan diri yang dimaksud dalam pepatah ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Hubungan antara takut akan Yahweh, didikan, dan hikmat
  choice: didikan dalam hikmat
  alternative: disiplin hikmat; didikan menuju hikmat
  rationale: Susunan nominal Ibrani ringkas dan dapat dipahami sebagai didikan yang berkaitan dengan, membentuk, atau mengantar kepada hikmat. Pilihan utama mempertahankan keluasan hubungan itu, sedangkan catatan kaki menjelaskan nuansa disiplin korektif.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bernada pepatah. “Mendahului” dipakai agar klausa kedua yang tanpa kata kerja dalam bahasa Ibrani terdengar wajar. Nama ilahi ditransliterasikan sebagai “Yahweh” sesuai keputusan teologis yang diberikan.
