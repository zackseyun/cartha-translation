id: PRO.15.8
reference: Proverbs 15:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: זֶ֣בַח רְ֭שָׁעִים תּוֹעֲבַ֣ת יְהוָ֑ה וּ/תְפִלַּ֖ת יְשָׁרִ֣ים רְצוֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/008.yaml
  text: The sacrifice of the wicked is an abomination to Yahweh[a], but the prayer of the upright is his delight.
translation:
  language: id
  text: Kurban orang fasik adalah kekejian bagi Yahweh, tetapi doa orang yang lurus adalah kesukaan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mendapat perkenanan-Nya” atau “berkenan kepada-Nya.” Kata Ibrani yang dipakai dapat berarti kesukaan, perkenanan, atau penerimaan.
    reason: Alternatif leksikal untuk רְצוֹנוֹ dipertahankan karena kata tersebut memiliki rentang makna yang tidak seluruhnya terwakili oleh satu padanan Indonesia.
lexical_decisions:
- source_word: זֶבַח
  choice: kurban
  rationale: Kata ini menunjuk pada persembahan kurban. “Kurban” merupakan padanan Indonesia yang alami dan tetap mempertahankan latar ibadah dalam kontras dengan doa.
- source_word: רְשָׁעִים
  choice: orang fasik
  rationale: Bentuk jamak ini menunjuk pada orang-orang yang bersalah secara moral. “Orang fasik” mempertahankan kategori moral yang kuat dalam gaya hikmat.
- source_word: תּוֹעֲבַת
  choice: kekejian
  rationale: Istilah ini menyatakan sesuatu yang sangat dibenci atau menjijikkan bagi Allah. “Kekejian” mempertahankan daya ungkap kuat dari teks Ibrani dan cocok dengan klausa nominal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan secara langsung sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: תְפִלַּת
  choice: doa
  rationale: Bentuk konstruk tunggal berarti “doa ...”; bentuk tunggal representatif sesuai dengan gaya amsal.
- source_word: יְשָׁרִים
  choice: orang yang lurus
  rationale: Kata ini menggambarkan mereka yang lurus secara moral. Pilihan ini menjaga nuansanya dan tidak menyamakannya begitu saja dengan istilah Ibrani lain yang lazim diterjemahkan “benar”.
- source_word: רְצוֹנוֹ
  choice: kesukaan-Nya
  rationale: Nomina ini dapat menyatakan kesukaan, perkenanan, atau penerimaan. “Kesukaan-Nya” menghasilkan antitesis yang jelas dengan “kekejian” tanpa meniadakan keluasan maknanya, yang dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Daya ungkap klausa kedua
  choice: adalah kesukaan-Nya
  alternative: berkenan kepada-Nya atau mendapat perkenanan-Nya
  rationale: Klausa nominal Ibrani tidak menyatakan kopula secara eksplisit. Rumusan ini mempertahankan antitesis kuat dengan “kekejian”, sedangkan kemungkinan nuansa perkenanan atau penerimaan tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur antitetis amsal dipertahankan secara ringkas. “Kekejian” dipilih karena kuat dan dikenal dalam ragam Alkitab, sedangkan “orang yang lurus” tetap mudah dipahami oleh pembaca umum.
