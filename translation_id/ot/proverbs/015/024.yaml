  text: אֹ֣רַח חַ֭יִּים לְ/מַ֣עְלָ/ה לְ/מַשְׂכִּ֑יל לְמַ֥עַן ס֝֗וּר מִ/שְּׁא֥וֹל מָֽטָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/024.yaml
  text: The path of life leads upward for the prudent, so that he may turn away from Sheol below.
translation:
  language: id
  text: Jalan kehidupan menuju ke atas bagi orang yang berpengertian, supaya ia menjauh dari Syeol[a] di bawah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Syeol adalah istilah Ibrani untuk tempat atau dunia orang mati.
    reason: Istilah sumber tidak memiliki padanan Indonesia tunggal yang mencakup seluruh rentang maknanya; penjelasan ini membantu pembaca tanpa menyelesaikan ambiguitas secara berlebihan.
lexical_decisions:
- source_word: אֹרַח חַיִּים (ʾoraḥ ḥayyîm)
  choice: jalan kehidupan
  rationale: Mempertahankan metafora jalan serta arti harfiah ‘kehidupan’; dalam konteks sastra hikmat, frasa ini menunjuk pada jalan hidup yang membawa kepada kehidupan.
- source_word: לְמַעְלָה (ləmaʿlâ)
  choice: menuju ke atas
  rationale: Menyatakan arah ke atas dan mempertahankan kontras spasial dengan מַטָּה, ‘di bawah’, tanpa mempersempitnya menjadi tafsiran teologis tertentu.
- source_word: לְמַשְׂכִּיל (ləmaśkîl)
  choice: bagi orang yang berpengertian
  rationale: Partisipel ini menggambarkan orang yang bertindak dengan pengertian atau kebijaksanaan praktis; pilihan ini alami dalam bahasa Indonesia dan tidak sekadar menunjuk kecerdasan intelektual.
- source_word: סוּר (sûr)
  choice: menjauh
  rationale: Dalam konstruksi dengan מִן, verba ini berarti menyimpang, berpaling, atau menjauh dari sesuatu; ‘menjauh’ sesuai dengan citra dua arah yang berlawanan.
- source_word: שְׁאוֹל (šəʾôl)
  choice: Syeol
  rationale: Nama Ibrani dipertahankan karena cakupannya tidak selalu sama persis dengan ‘neraka’ atau ‘kubur’; catatan kaki memberi penjelasan singkat tanpa menghapus ambiguitasnya.
theological_decisions:
- issue: Hubungan לְמַעַן dengan klausa sebelumnya
  choice: supaya
  alternative: sehingga
  rationale: לְמַעַן lazim menyatakan tujuan, tetapi dapat menyentuh hasil. ‘Supaya’ mengikuti arah tujuan dalam ayat ini tanpa menambahkan pelaku atau kepastian yang tidak dinyatakan.
- issue: Makna Syeol
  choice: Mempertahankan istilah ‘Syeol’
  alternative: dunia orang mati; alam maut; neraka; kubur
  rationale: Teks menyandingkan jalan kehidupan ke atas dengan Syeol di bawah. Transliterasi menjaga gambaran kosmologis dan ketegangan teologis sumber tanpa menyamakan Syeol secara otomatis dengan neraka, kubur individual, atau suatu doktrin akhirat tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bersahaja. Paralel arah ‘menuju ke atas’ dan ‘di bawah’ dipertahankan karena merupakan unsur utama gambaran puitis ayat.
