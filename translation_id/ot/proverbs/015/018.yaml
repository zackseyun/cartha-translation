  text: A hot-tempered man stirs up strife[c][b][a], but one who is slow to anger quiets a dispute.
translation:
  language: id
  text: Orang yang pemarah menimbulkan pertengkaran, tetapi orang yang lambat marah meredakan perselisihan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ חֵמָה
  choice: orang yang pemarah
  rationale: Ungkapan ini secara harfiah berarti 'orang yang penuh murka/panas'. 'Orang yang pemarah' menyampaikan tipe watak yang dimaksud secara alami dalam bahasa Indonesia tanpa mengurangi kekuatan maknanya.
- source_word: יְגָרֶה
  choice: membangkitkan
  rationale: Bentuk Piel dari גרה berarti mengobarkan, memancing, atau menimbulkan. 'Membangkitkan' cocok dengan objek berupa pertengkaran dan mempertahankan daya kausatifnya.
- source_word: מָדוֹן
  choice: pertengkaran
  rationale: Kata ini menunjuk pada pertikaian atau perselisihan. 'Pertengkaran' alami dalam gaya amsal dan menampilkan konflik yang dikobarkan oleh si pemarah.
- source_word: אֶרֶך אַפַּיִם
  choice: orang yang lambat marah
  rationale: Secara harfiah idiom ini berarti 'panjang hidung', yakni tidak lekas marah. Terjemahan ini mempertahankan hubungan eksplisit dengan kemarahan dan membentuk kesejajaran yang jelas dengan 'orang yang pemarah'.
- source_word: יַשְׁקִיט
  choice: meredakan
  rationale: Bentuk Hifil dari שקט berarti membuat tenang atau diam. Dalam konteks konflik, 'meredakan' merupakan padanan Indonesia yang wajar dan jelas bersifat kausatif.
- source_word: רִיב
  choice: perselisihan
  rationale: Kata ini dapat berarti pertengkaran, sengketa, atau perkara hukum. 'Perselisihan' mempertahankan cakupan umum tanpa membatasi ayat pada konteks hukum.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat dengan kesejajaran antarbait yang jelas. Pilihan 'orang' menyampaikan tipe manusia secara umum sesuai fungsi proverbial אִישׁ, sedangkan 'lambat marah' menerjemahkan idiom Ibrani secara transparan.
