  text: שִׂמְחָ֣ה לָ֭/אִישׁ בְּ/מַעֲנֵה פִ֑י/ו וְ/דָבָ֖ר בְּ/עִתּ֣/וֹ מַה טּֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/023.yaml
  text: A man has joy in the answer of his mouth[b][a], and a word in its time—how good it is!
translation:
  language: id
  text: Seseorang bersukacita karena jawaban dari mulutnya[a], dan perkataan pada waktu yang tepat[b]—betapa baiknya!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagi seseorang ada sukacita dalam jawaban mulutnya.” Susunan bahasa Ibrani memungkinkan terjemahan yang lebih harfiah ini.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pada waktunya”; dapat juga diterjemahkan “pada saat yang sesuai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחָה
  choice: bersukacita
  rationale: Nomina Ibrani menyatakan sukacita atau kegembiraan. Dalam bahasa Indonesia, konstruksi verbal “bersukacita” secara alami mengungkapkan bahwa seseorang mengalami sukacita.
- source_word: לָאִישׁ
  choice: seseorang
  rationale: אִישׁ berbentuk maskulin tunggal, tetapi dalam amsal ini berfungsi secara representatif bagi siapa pun. “Seseorang” mempertahankan ketunggalan dan terdengar alami tanpa membatasi penerapannya pada laki-laki.
- source_word: בְּמַעֲנֵה
  choice: karena jawaban
  rationale: מַעֲנֶה berarti jawaban atau tanggapan. Preposisi ב dapat menunjukkan hal yang menjadi dasar atau sebab sukacita; “karena jawaban” menyampaikan hubungan itu secara wajar.
- source_word: פִיו
  choice: dari mulutnya
  rationale: Secara harfiah berarti “mulutnya.” Ungkapan “dari mulutnya” mempertahankan citra tubuh dalam bahasa sumber sekaligus memperjelas bahwa jawaban itu diucapkan olehnya.
- source_word: וְדָבָר
  choice: dan perkataan
  rationale: Dalam kesejajaran dengan jawaban yang keluar dari mulut, דָבָר paling wajar menunjuk pada ucapan. “Perkataan” lebih alami daripada “sebuah kata” untuk suatu ujaran dalam bahasa Indonesia.
- source_word: בְּעִתּוֹ
  choice: pada waktu yang tepat
  rationale: Secara harfiah, frasa ini berarti “pada waktunya,” dengan nuansa waktu yang sesuai. “Pada waktu yang tepat” menyatakan implikasi ketepatan waktu secara alami.
- source_word: מַה־טּוֹב
  choice: betapa baiknya
  rationale: Ungkapan seruan ini memuji kebaikan perkataan yang tepat waktu. “Betapa baiknya!” mempertahankan daya serunya.
