  text: All the days of the afflicted are bad[b][a], but a cheerful heart is a continual feast.
translation:
  language: id
  text: Hari-hari orang yang menderita[a] semuanya buruk, tetapi hati yang gembira[b] merupakan perjamuan yang terus-menerus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "orang miskin" atau "orang yang tertindas"; kata Ibrani עָנִי dapat menunjuk pada orang yang miskin, menderita, atau tertindas.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "hati yang baik"; dalam konteks ini ungkapan Ibrani ini menunjuk pada sikap batin yang gembira atau sejahtera.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: Setiap hari
  rationale: Ungkapan ini menyampaikan cakupan seluruh hari secara alami dalam bahasa Indonesia sambil mempertahankan gambaran hari-hari kehidupan.
- source_word: עָנִי
  choice: orang yang menderita
  rationale: Kata Ibrani ini dapat menunjuk pada orang miskin, tertindas, atau mengalami penderitaan. Pilihan ini mempertahankan cakupan luasnya tanpa membatasi makna pada keadaan ekonomi.
- source_word: רָעִים
  choice: hari yang buruk
  rationale: Adjektiva ini menggambarkan mutu atau pengalaman hari-hari tersebut. 'Buruk' mempertahankan sifat umum istilah Ibrani dan tidak mengubahnya menjadi kejahatan moral.
- source_word: וְטוֹב לֵב
  choice: tetapi orang yang berhati gembira
  rationale: Secara harfiah ungkapan ini berarti 'baik hati/baik dalam hati', tetapi dalam konteks ini menunjuk pada keadaan batin yang riang atau sejahtera. Bentuk personal ini alami dalam bahasa Indonesia dan selaras dengan klausa berikutnya.
- source_word: מִשְׁתֶּה תָמִיד
  choice: selalu berpesta
  rationale: Ungkapan tersebut secara harfiah menggambarkan 'perjamuan terus-menerus'. Bentuk verbal ini alami dalam bahasa Indonesia dan mempertahankan gambaran kehidupan sebagai pesta yang berkelanjutan.
