  terminology: '"Orang yang menderita" merupakan pilihan yang aman untuk עָנִי, dengan alternatif leksikal dipertahankan dalam catatan. "Hati yang gembira" menyampaikan טוֹב לֵב secara alami; catatan harfiahnya perlu memakai "hati yang baik," bukan "berhati baik," karena yang terakhir dalam bahasa Indonesia terutama berarti dermawan atau baik kepada orang lain.'
