  text: שִׂפְתֵ֣י חֲ֭כָמִים יְזָ֣רוּ דָ֑עַת וְ/לֵ֖ב כְּסִילִ֣ים לֹא כֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/007.yaml
  text: The lips of the wise spread knowledge[b][a], but the heart of fools is not so.
translation:
  language: id
  text: Bibir orang bijak menaburkan pengetahuan,[a] tetapi hati orang bebal tidak demikian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “menaburkan” juga dapat berarti “menyerakkan” atau “menyebarkan”.
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibraninya ringkas: secara harfiah, “tetapi hati orang bebal, tidak demikian.” Maksudnya, hati orang bebal tidak menyebarkan pengetahuan seperti bibir orang bijak.'
    reason: elliptical_clause
lexical_decisions:
- source_word: שִׂפְתֵי
  choice: Bibir
  rationale: Mempertahankan gambaran konkret anggota tubuh dalam bentuk konstruksi “bibir orang bijak”, bukan memparafrasakannya sebagai perkataan atau ucapan.
- source_word: חֲכָמִים
  choice: orang bijak
  rationale: Adjektiva jamak yang dipakai sebagai nomina menunjuk pada golongan orang-orang yang bijak; bentuk ini alami, inklusif, dan tidak terlalu menentukan gender.
- source_word: יְזָרוּ
  choice: menaburkan
  rationale: Verba זרה pada dasarnya menggambarkan tindakan menyerakkan, menampi, atau menaburkan. “Menaburkan” mempertahankan metafora penyebaran sekaligus terdengar wajar dengan objek “pengetahuan”.
- source_word: דָעַת
  choice: pengetahuan
  rationale: Padanan langsung dan lazim bagi דַּעַת dalam sastra hikmat, serta sesuai dengan kontras dalam pepatah ini.
- source_word: לֵב
  choice: hati
  rationale: Mempertahankan istilah kunci sastra hikmat yang menunjuk batin, termasuk pikiran dan kecenderungan moral, tanpa mempersempitnya menjadi “akal” saja.
- source_word: כְּסִילִים
  choice: orang bebal
  rationale: Dalam Amsal, כְּסִיל menunjuk bukan sekadar orang yang kurang cerdas, melainkan orang yang tumpul dan keras kepala secara moral. “Orang bebal” membawa nuansa etis itu dalam bahasa Indonesia yang bermartabat.
- source_word: לֹא כֵן
  choice: tidak demikian
  rationale: Mempertahankan ungkapan Ibrani yang ringkas dan eliptis tanpa menambahkan tindakan tertentu ke dalam teks utama.
theological_decisions:
- issue: Subjek klausa kedua dan elipsis predikat
  choice: “hati orang bebal tidak demikian”
  alternative: “orang bebal tidak menaburkan pengetahuan”
  rationale: Teks Ibrani secara eksplisit menyebut “hati” dan hanya berkata “tidak demikian”. Terjemahan mempertahankan metafora hati serta ketegangan eliptisnya; penjelasan maksud diberikan dalam catatan kaki, bukan dimasukkan ke teks.
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. “Menaburkan” mempertahankan citra verba Ibrani, sedangkan “tidak demikian” menjaga keringkasan dan ambiguitas klausa kedua. Semua penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
