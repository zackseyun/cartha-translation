  source_fidelity: 'Teks Indonesia menyampaikan perbandingan Ibrani dengan tepat: sedikit harta yang menyertai takut akan Yahweh dikontraskan dengan harta berlimpah yang menyertai kekacauan. Penambahan "harta" pada "sedikit" adalah pelengkapan implisit yang wajar dalam konteks kontras dengan אוֹצָר (harta/simpanan) dan tidak mengubah makna.'
