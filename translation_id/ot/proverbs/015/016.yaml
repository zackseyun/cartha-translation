  text: טוֹב מְ֭עַט בְּ/יִרְאַ֣ת יְהוָ֑ה מֵ/אוֹצָ֥ר רָ֝֗ב וּ/מְה֥וּמָה בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/016.yaml
  text: Better is a little with the fear of Yahweh than great treasure with turmoil[a].
translation:
  language: id
  text: Lebih baik sedikit harta disertai rasa takut akan Yahweh daripada harta berlimpah disertai kekacauan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dan kesusahan bersamanya” atau “dan kebingungan di dalamnya.” Kata Ibrani yang dipakai dapat berarti kekacauan, gangguan, kegaduhan, atau kebingungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב מְעַט
  choice: Lebih baik sedikit harta
  rationale: Dalam peribahasa komparatif ini, טוֹב berarti idiomatis 'lebih baik'. Kata 'harta' ditambahkan secara wajar untuk memperjelas bahwa מְעַט menunjuk pada sedikit milik atau kekayaan, sesuai kontras dengan אוֹצָר רָב.
- source_word: בְּיִרְאַת יְהוָה
  choice: disertai rasa takut akan Yahweh
  rationale: Preposisi ב menyatakan keadaan yang menyertai. 'Rasa takut akan Yahweh' mempertahankan ungkapan hikmat yang mencakup gentar, hormat, dan kesalehan tanpa mempersempitnya menjadi sekadar ketakutan atau penghormatan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dialihaksarakan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: מֵאוֹצָר רָב
  choice: daripada harta berlimpah
  rationale: מִן menandai perbandingan, אוֹצָר berarti harta atau kekayaan tersimpan, dan רָב menyatakan kelimpahan.
- source_word: וּמְהוּמָה בּוֹ
  choice: disertai kekacauan
  rationale: מְהוּמָה dapat berarti kekacauan, kegaduhan, gangguan, atau kebingungan. בּוֹ secara harfiah dapat dipahami 'di dalamnya' atau secara idiomatis sebagai keadaan yang menyertai harta itu; 'disertai' menghasilkan bahasa Indonesia yang alami, sedangkan alternatifnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna 'takut akan Yahweh' dalam sastra hikmat
  choice: rasa takut akan Yahweh
  alternative: hormat kepada Yahweh; rasa gentar terhadap Yahweh
  rationale: Ungkapan teologis utama dalam Amsal ini dipertahankan agar gaung kanonik dan rentang maknanya tidak dipersempit. Dalam konteks hikmat, ungkapan tersebut mencakup rasa gentar, hormat, dan kesetiaan kepada Allah.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bernada hikmat. Susunan paralel 'disertai ... daripada ... disertai ...' memperjelas kontras. Kata 'harta' pada klausa pertama merupakan pelengkap implisit yang diperlukan agar perbandingan terdengar alami dalam bahasa Indonesia.
