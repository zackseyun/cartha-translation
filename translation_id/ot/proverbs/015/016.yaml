  terminology: '"Yahweh" sesuai dengan kebijakan transliterasi nama ilahi. "Rasa takut akan Yahweh" mempertahankan istilah hikmat yang luas tanpa menguranginya menjadi sekadar teror atau hormat. "Kekacauan" merupakan padanan yang layak bagi מְהוּמָה; catatan kaki dengan tepat mencatat alternatif leksikal dan kemungkinan relasi "bersamanya/di dalamnya".'
