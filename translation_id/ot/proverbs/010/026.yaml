  text: כַּ/חֹ֤מֶץ לַ/שִּׁנַּ֗יִם וְ/כֶ/עָשָׁ֥ן לָ/עֵינָ֑יִם כֵּ֥ן הֶ֝/עָצֵ֗ל לְ/שֹׁלְחָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/026.yaml
  text: Like vinegar to the teeth and smoke to the eyes[a], so is the sluggard to those who send him.
translation:
  language: id
  text: Seperti cuka bagi gigi dan asap bagi mata, demikianlah si pemalas bagi orang-orang yang mengutusnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֹמֶץ
  choice: cuka
  rationale: Kata ini menunjuk pada cairan asam, lazimnya cuka. Padanan ini alami dalam bahasa Indonesia dan mempertahankan gambaran tentang dampak tajam yang tidak menyenangkan pada gigi.
- source_word: לַשִּׁנַּיִם
  choice: bagi gigi
  rationale: Preposisi ל menyatakan hubungan atau dampak. 'Bagi gigi' mempertahankan susunan perbandingan Ibrani dan sejajar dengan 'bagi mata'.
- source_word: עָשָׁן
  choice: asap
  rationale: Padanan langsung yang mempertahankan gambaran iritasi pada mata.
- source_word: לָעֵינַיִם
  choice: bagi mata
  rationale: Padanan ini menyatakan dampak asap pada mata sekaligus mempertahankan kesejajaran dengan 'bagi gigi'.
- source_word: כֵּן
  choice: demikianlah
  rationale: Partikel perbandingan ini memperkenalkan penerapan dari dua gambaran sebelumnya; 'demikianlah' alami dan bernada amsal dalam bahasa Indonesia.
- source_word: הֶעָצֵל
  choice: si pemalas
  rationale: Adjektiva yang digunakan secara substantival ini menunjuk pada tipe orang yang terbiasa malas. 'Si pemalas' ringkas, alami, dan mempertahankan corak tokoh dalam sastra hikmat.
- source_word: לְשֹׁלְחָיו
  choice: bagi orang-orang yang mengutusnya
  rationale: Bentuk partisip dengan akhiran orang ketiga tunggal berarti orang-orang yang mengutus dia. Terjemahan ini mempertahankan pengutus jamak dan orang yang diutus tunggal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat, dengan paralelisme serta daya sindir amsal dipertahankan. Tidak diperlukan catatan kaki karena 'cuka' merupakan padanan Indonesia yang langsung dan memadai untuk חֹמֶץ.
