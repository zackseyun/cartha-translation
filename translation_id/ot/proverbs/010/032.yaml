  yaml_path: translation/ot/proverbs/010/032.yaml
  text: The lips of the righteous know what is acceptable[b][a], but the mouth of the wicked speaks perversity.
translation:
  language: id
  text: Bibir orang benar mengetahui apa yang patut[a], tetapi mulut orang fasik mengucapkan kata-kata yang menyimpang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “apa yang menyenangkan,” “apa yang dapat diterima,” atau “perkenanan.” Kata Ibrani ini dapat menunjuk pada perkenanan, niat baik, atau sesuatu yang menyenangkan dan patut.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tetapi mulut orang-orang fasik—hal-hal yang menyimpang.” Kata “mengucapkan” ditambahkan agar maksudnya jelas dalam bahasa Indonesia; “kata-kata” memperjelas bahwa konteksnya adalah perkataan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי
  choice: Bibir
  rationale: Mempertahankan gambaran anggota tubuh dan kesejajaran puitis dengan 'mulut'; ungkapan ini tetap alami dalam bahasa Indonesia.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Bentuk tunggal Ibrani dipakai secara generik. 'Orang benar' adalah padanan lazim dan tidak menekankan jenis kelamin.
- source_word: יֵדְעוּן
  choice: tahu
  rationale: Mempertahankan arti dasar verba 'mengetahui'; dalam konteks, kata ini menyiratkan kemampuan membedakan perkataan yang berkenan tanpa menjabarkan implikasi itu di dalam teks.
- source_word: רָצוֹן
  choice: apa yang berkenan
  rationale: Nomina ini dapat berarti perkenanan, hal yang menyenangkan, atau hal yang dapat diterima. Dalam konteks perkataan, 'apa yang berkenan' alami sekaligus mempertahankan keluasan maknanya.
- source_word: וּפִי
  choice: tetapi mulut
  rationale: Konjungsi menunjukkan pertentangan, sedangkan 'mulut' mempertahankan kesejajaran konkret dengan 'bibir'.
- source_word: רְשָׁעִים
  choice: orang fasik
  rationale: Bentuk jamak menunjuk golongan orang yang jahat secara moral; 'orang fasik' merupakan istilah hikmat yang ringkas dan mapan.
- source_word: תַּהְפֻּכוֹת
  choice: hal-hal yang menyimpang
  rationale: Bentuk jamak ini menunjuk hal-hal yang bengkok, terbalik, atau menyimpang, khususnya dalam perkataan. Padanan ini mempertahankan nuansa jamak dan menghindari abstraksi yang kaku.
