translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat khas amsal. Citra ‘hati’ dipertahankan; idiom ‘bibir’ dialihkan secara alami menjadi ‘banyak bicara’. Penanda catatan kaki ditempatkan setelah klausa yang dijelaskannya.
