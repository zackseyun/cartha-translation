  yaml_path: translation/ot/proverbs/010/008.yaml
  text: A wise-hearted man accepts commands[a], but a foolish man of lips will come to ruin.
translation:
  language: id
  text: Orang yang bijaksana hatinya menerima perintah-perintah, tetapi orang bodoh yang banyak bicara akan jatuh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “akan dijatuhkan.” Kata kerja terakhir ini jarang dipakai dan dapat berarti dijatuhkan atau mengalami kebinasaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם לֵב
  choice: orang yang berhati bijaksana
  rationale: Ungkapan Ibrani ini secara harfiah berarti ‘bijaksana dalam hati’. Pilihan ini mempertahankan gambaran ‘hati’ sebagai pusat pikiran dan kehendak, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: יִקַּח
  choice: menerima
  rationale: Secara dasar berarti ‘mengambil’, tetapi dengan objek ‘perintah-perintah’ kata ini menyatakan penerimaan atau kesediaan menyambut arahan yang berwenang.
- source_word: מִצְוֺת
  choice: perintah-perintah
  rationale: Bentuk jamak ini menunjuk pada arahan yang berwenang. ‘Perintah-perintah’ mempertahankan unsur kewajiban dan jumlah jamaknya.
- source_word: אֱוִיל
  choice: orang bodoh
  rationale: Istilah ini menggambarkan orang yang bodoh secara moral dan praktis, bukan sekadar kurang cerdas.
- source_word: שְׂפָתַיִם
  choice: yang banyak bicara
  rationale: Secara harfiah berarti ‘berbibir’ atau ‘dari bibir’. Dalam paralel ini ungkapan tersebut mencirikan orang bodoh melalui banyaknya perkataan; terjemahan ini menyampaikan idiom itu secara wajar tanpa menambahkan gagasan tentang isi ucapannya.
- source_word: יִלָּבֵט
  choice: akan jatuh binasa
  rationale: Kata kerja Nifal yang langka ini tampaknya menyatakan dijatuhkan atau mengalami kehancuran. ‘Akan jatuh binasa’ mempertahankan gagasan kejatuhan dan akibat akhirnya, sementara ketidakpastian leksikal dijelaskan dalam catatan kaki.
