source:
  edition: WLC
  text: מְגוֹרַ֣ת רָ֭שָׁע הִ֣יא תְבוֹאֶ֑/נּוּ וְ/תַאֲוַ֖ת צַדִּיקִ֣ים יִתֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/024.yaml
  text: What the wicked dreads will come upon him[b][a], but the desire of the righteous will be granted.
translation:
  language: id
  text: Apa yang ditakuti orang fasik akan menimpanya[a], tetapi keinginan orang-orang benar akan dikabulkan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kengerian orang fasik—itulah yang akan datang kepadanya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ia akan memberi.” Subjeknya tidak disebutkan dalam bahasa Ibrani.
    reason: alternative_reading
lexical_decisions:
- source_word: מְגוֹרַת
  choice: apa yang ditakuti
  rationale: Nomina ini dapat menunjuk pada rasa takut atau hal yang ditakuti. Dalam konstruksi dengan רָשָׁע, ungkapan alami “apa yang ditakuti orang fasik” menyampaikan objek ketakutan tanpa menghilangkan nuansa dasarnya.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Adjektiva tunggal ini dipakai secara substantival dan bersifat representatif. “Orang fasik” wajar dalam peribahasa Indonesia serta tidak menambahkan penandaan gender.
- source_word: הִיא תְבוֹאֶנּוּ
  choice: akan menimpanya
  rationale: Pronomina feminin merujuk kembali kepada מְגוֹרַת, sedangkan בוא dengan sufiks pronominal berarti hal itu datang kepadanya. “Menimpanya” secara idiomatis menyatakan datangnya perkara buruk yang ditakuti.
- source_word: וְתַאֲוַת
  choice: tetapi keinginan
  rationale: תַּאֲוָה berarti keinginan atau kerinduan. Konjungsi וְ diterjemahkan “tetapi” karena kedua bagian ayat membentuk paralelisme antitetis.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Bentuk jamak substantival ini menunjuk pada golongan orang benar. “Orang-orang benar” mempertahankan bentuk jamak dan jelas bagi pembaca Indonesia modern.
- source_word: יִתֵּן
  choice: akan dikabulkan
  rationale: Secara harfiah verba aktif tunggal ini berarti “ia akan memberikan,” tetapi subjeknya tidak disebutkan. Bentuk pasif “akan dikabulkan” menyampaikan terpenuhinya keinginan tanpa menetapkan siapa pemberinya.
theological_decisions:
- issue: Subjek tersirat dari יִתֵּן
  choice: Pemberi tetap tidak dinyatakan melalui bentuk pasif “akan dikabulkan.”
  alternative: “Ia akan memberikannya,” atau “Allah akan mengabulkannya.”
  rationale: Teks Ibrani tidak menyebut Allah secara eksplisit. Walaupun tindakan ilahi mungkin tersirat dalam sastra hikmat, menyebut Allah dalam teks utama akan menuntaskan ambiguitas yang dibiarkan oleh sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada peribahasa. “Orang fasik” dan “orang-orang benar” mempertahankan kontras moral teks; bentuk pasif pada klausa kedua menjaga ambiguitas sumber mengenai sang pemberi.
