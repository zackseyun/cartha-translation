  yaml_path: translation/ot/proverbs/010/020.yaml
  text: The tongue of the righteous is choice silver[a]; the heart of the wicked is of little worth.
translation:
  language: id
  text: Lidah orang benar adalah perak pilihan, tetapi hati orang-orang fasik hanya sedikit nilainya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak seberapa nilainya,” “hanya sedikit,” atau “hampir tidak berarti.” Ungkapan Ibrani כִּמְעָט sangat ringkas dan dapat menyatakan nilai yang kecil atau keadaan yang nyaris tidak berarti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף
  choice: perak
  rationale: Makna konkretnya adalah logam perak. Pilihan ini mempertahankan gambaran nilai dalam peribahasa, bukan mengabstraksikannya menjadi “uang”.
- source_word: נִבְחָר
  choice: pilihan
  rationale: Partisip ini menyatakan mutu yang unggul atau terpilih. “Perak pilihan” menyampaikan nilai tinggi tanpa memastikan proses pemurnian yang tidak dinyatakan secara eksplisit.
- source_word: לְשׁוֹן
  choice: lidah
  rationale: 'Terjemahan harfiah ini mempertahankan metonimia konkret bahasa Ibrani: lidah mewakili perkataan seseorang.'
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva substantival tunggal ini menunjuk kepada seseorang yang benar dan dapat berfungsi secara umum; “orang benar” alami dalam bahasa Indonesia dan tidak membatasi rujukannya pada laki-laki.
- source_word: לֵב
  choice: hati
  rationale: “Hati” mempertahankan citra Ibrani dan mencakup batin, pikiran, kehendak, serta watak moral, bukan hanya perasaan.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Bentuk jamak substantival dipertahankan. “Fasik” menyatakan kategori moral orang yang jahat tanpa mempersempitnya menjadi suatu tindak kejahatan tertentu.
- source_word: כִּמְעָט
  choice: hanya sedikit nilainya
  rationale: Ungkapan ringkas ini dapat menyatakan kecilnya nilai atau hampir tidak berartinya sesuatu. Dalam konteks perbandingan dengan perak pilihan, “hanya sedikit nilainya” membuat gagasan nilai yang tersirat menjadi alami dalam bahasa Indonesia sambil mempertahankan kadar ungkapan yang tidak mutlak.
theological_decisions:
- issue: Hubungan antara “lidah” dan “hati” dengan kategori moral pemiliknya
  choice: Mempertahankan kontras puitis antara perkataan orang benar dan batin orang-orang fasik
  alternative: Menjelaskan “lidah” sebagai ajaran atau “hati” sebagai emosi semata
  rationale: Teks menyajikan metonimia dan antropologi yang luas tanpa membatasi lidah pada pengajaran atau hati pada perasaan. Terjemahan tidak menambahkan penafsiran teologis yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada hikmat. Susunan paralel serta metafora “lidah,” “perak,” dan “hati” dipertahankan; kata “tetapi” memperjelas pertentangan yang tersirat dalam penjajaran kedua klausa Ibrani.
