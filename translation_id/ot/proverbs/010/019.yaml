  text: When words are many[a], transgression does not cease[b], but whoever restrains his lips is prudent.
translation:
  language: id
  text: 'Jika kata-kata banyak, pelanggaran tidak terelakkan,

    tetapi orang yang menjaga mulutnya bertindak bijaksana.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרֹב דְּבָרִים
  choice: Dalam banyaknya kata-kata
  rationale: Ungkapan בְּרֹב menyatakan keadaan atau kelimpahan, sedangkan דְּבָרִים dalam konteks ini menunjuk pada ucapan. Terjemahan ini mempertahankan bentuk padat dan hubungan kuantitatif dalam pepatah Ibrani.
- source_word: לֹא יֶחְדַּל
  choice: tidak akan berhenti
  rationale: Kata kerja חדל berarti berhenti atau berakhir. Dengan penyangkalan, frasa ini menyatakan bahwa pelanggaran tidak berhenti di tengah banyaknya ucapan.
- source_word: פָּשַׁע
  choice: pelanggaran
  rationale: פֶּשַׁע membawa bobot moral berupa pelanggaran atau pemberontakan. 'Pelanggaran' alami dalam bahasa Indonesia dan tidak mempersempit maknanya secara denominatif.
- source_word: וְחֹשֵׂךְ
  choice: tetapi orang yang menahan
  rationale: Partisipel חשׂך berarti menahan atau membatasi. Konjungsi ו diterjemahkan 'tetapi' karena baris kedua berlawanan dengan baris pertama.
- source_word: שְׂפָתָיו
  choice: bibirnya
  rationale: Terjemahan harfiah ini mempertahankan metafora tubuh dalam bahasa Ibrani untuk pengendalian ucapan dan tetap wajar dalam bahasa Indonesia.
- source_word: מַשְׂכִּיל
  choice: bertindak bijaksana
  rationale: Partisipel Hifil dari שׂכל dapat menyatakan bertindak dengan pengertian atau kebijaksanaan. 'Bertindak bijaksana' mempertahankan nuansa tindakan, bukan sekadar sifat bawaan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, padat, dan bermartabat, dengan paralelisme antitetis serta metafora 'menahan bibir' dipertahankan. Bentuk 'orang yang' menyampaikan fungsi generik partisipel maskulin Ibrani tanpa membatasi pepatah pada laki-laki.
