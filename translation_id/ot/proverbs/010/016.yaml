  text: פְּעֻלַּ֣ת צַדִּ֣יק לְ/חַיִּ֑ים תְּבוּאַ֖ת רָשָׁ֣ע לְ/חַטָּֽאת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/016.yaml
  text: The labor of the righteous leads to life[c][b][a]; the produce of the wicked leads to sin.
translation:
  language: id
  text: Pekerjaan orang benar membawa kepada kehidupan[a]; hasil[b] orang fasik membawa kepada dosa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk kehidupan” atau “menghasilkan kehidupan”. Kata depan Ibrani dapat menyatakan tujuan atau hasil.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibraninya dapat berarti “hasil”, “pendapatan”, atau “panen”.
    reason: lexical_alternative
  - marker: c
    text: Kata Ibrani yang sama dapat berarti “kurban penghapus dosa” dalam konteks ibadah, tetapi di sini artinya “dosa”.
    reason: alternative_reading
lexical_decisions:
- source_word: פְּעֻלַּת
  choice: pekerjaan
  rationale: Kata פְּעֻלָּה dapat menunjuk pada pekerjaan, jerih payah, atau hasil/upah pekerjaan. “Pekerjaan” mempertahankan cakupan yang luas dan sesuai dengan kesejajaran yang membandingkan apa yang berasal dari orang benar dan orang fasik.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Bentuk tunggal yang dipakai sebagai nomina ini menggambarkan tipe orang secara umum. “Orang benar” merupakan padanan Indonesia yang alami dan tidak menambahkan penandaan gender.
- source_word: לְחַיִּים
  choice: membawa kepada kehidupan
  rationale: Preposisi לְ dapat menyatakan arah, tujuan, atau hasil. Ungkapan ini mempertahankan daya arah/hasil tanpa memastikan secara berlebihan apakah yang terutama dimaksud ialah tujuan atau akibat.
- source_word: תְּבוּאַת
  choice: hasil yang diperoleh
  rationale: תְּבוּאָה dapat berarti hasil bumi, panen, pendapatan, atau hasil yang masuk dari suatu kegiatan. “Hasil yang diperoleh” alami dalam konteks ini dan tidak mempersempit maknanya hanya pada pertanian atau uang.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Bentuk tunggal substantival ini mewakili suatu golongan moral. “Orang fasik” mempertahankan pertentangan khas kitab Amsal dengan “orang benar”.
- source_word: לְחַטָּאת
  choice: membawa kepada dosa
  rationale: Dalam konteks amsal moral ini, חַטָּאת berarti “dosa”. “Membawa kepada” mencerminkan konstruksi resultatif atau terarah yang sejajar dengan לְחַיִּים.
theological_decisions:
- issue: Makna חַטָּאת
  choice: dosa
  alternative: kurban penghapus dosa
  rationale: חַטָּאת dapat berarti “kurban penghapus dosa” dalam konteks ibadah, tetapi di sini tidak ada konteks ritual. Pertentangan hikmat antara kehidupan dan dosa mendukung makna moral “dosa”.
- issue: Nuansa preposisi לְ dalam kedua bagian ayat
  choice: membawa kepada
  alternative: untuk / menghasilkan
  rationale: לְ dapat mengungkapkan tujuan maupun hasil. Terjemahan “membawa kepada” menjaga hubungan arah dan akibat dalam kedua bagian tanpa meniadakan ketegangan antara kedua nuansa itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Struktur antitetis kedua bagian dipertahankan melalui pengulangan “membawa kepada”. “Orang benar” dan “orang fasik” mempertahankan kategori moral khas sastra hikmat tanpa penandaan gender yang tidak diperlukan.
