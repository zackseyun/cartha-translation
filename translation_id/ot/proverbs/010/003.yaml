id: PRO.10.3
reference: Proverbs 10:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹֽא יַרְעִ֣יב יְ֭הוָה נֶ֣פֶשׁ צַדִּ֑יק וְ/הַוַּ֖ת רְשָׁעִ֣ים יֶהְדֹּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/003.yaml
  text: Yahweh will not let the righteous person go hungry[a], but he drives away the craving of the wicked.
translation:
  language: id
  text: Yahweh tidak akan membiarkan orang benar kelaparan, tetapi Ia menepis hasrat orang fasik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tetapi Ia menepis kehancuran orang fasik.” Kata benda Ibrani yang diterjemahkan “hasrat” juga dapat dipahami sebagai “kehancuran” atau “malapetaka.”
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יַרְעִיב
  choice: tidak akan membiarkan ... kelaparan
  rationale: Bentuk kausatif יַרְעִיב berarti menyebabkan lapar. Ungkapan ini menyampaikan makna kausatif secara wajar tanpa melebihkannya menjadi ‘membiarkan mati kelaparan’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan sebuah gelar.
- source_word: נֶפֶשׁ צַדִּיק
  choice: orang benar
  rationale: Dalam konteks ini נֶפֶשׁ menunjuk kepada diri atau pribadi yang hidup, sedangkan צַדִּיק dipakai secara substantival. ‘Orang benar’ menyampaikan keseluruhan pribadi secara alami tanpa menyiratkan bahwa yang dimaksud hanya jiwa sebagai unsur tak berjasmani.
- source_word: הַוַּת
  choice: hasrat
  rationale: Dalam antitesis dengan kelaparan, kata ini paling mungkin menunjuk kepada hasrat atau keinginan orang fasik. Kemungkinan makna ‘kehancuran/malapetaka’ tetap dicatat dalam catatan kaki.
- source_word: רְשָׁעִים
  choice: orang fasik
  rationale: Bentuk jamak substantival ini menunjuk kepada orang-orang yang jahat secara moral; ‘orang fasik’ merupakan padanan ringkas dan lazim dalam ragam Alkitab Indonesia.
- source_word: יֶהְדֹּף
  choice: menepis
  rationale: Kata kerja ini menggambarkan tindakan mendorong atau menolak sesuatu menjauh. ‘Menepis’ mempertahankan citra tersebut dan cocok dengan hasrat yang tidak dibiarkan terwujud.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama perjanjian itu secara langsung; transliterasi mempertahankan nama pribadi tersebut dan tidak menggantinya dengan gelar.
- issue: Makna נֶפֶשׁ dalam konteks ini
  choice: orang
  alternative: jiwa, hidup, atau selera
  rationale: Ayat ini berbicara tentang orang benar sebagai pribadi seutuhnya dan tidak harus sedang mengajarkan pemisahan teknis antara jiwa dan tubuh.
- issue: Makna הַוַּת רְשָׁעִים
  choice: hasrat orang fasik
  alternative: kehancuran atau malapetaka orang fasik
  rationale: Paralelisme dengan kelaparan mendukung makna hasrat, tetapi polisemi kata Ibrani itu tidak cukup pasti untuk meniadakan pembacaan ‘kehancuran’; karena itu alternatifnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur antitesis Ibrani dipertahankan dengan ‘tetapi’. ‘Orang benar’ dan ‘orang fasik’ dipakai sebagai kategori moral yang bersifat umum, bukan pembatasan berdasarkan jenis kelamin.
