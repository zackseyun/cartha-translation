  text: אֹ֣רַח לְ֭/חַיִּים שׁוֹמֵ֣ר מוּסָ֑ר וְ/עוֹזֵ֖ב תּוֹכַ֣חַת מַתְעֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/017.yaml
  text: Whoever keeps discipline is on the path to life[a], but whoever forsakes reproof leads others astray.
translation:
  language: id
  text: Siapa yang mengindahkan didikan berada di jalan menuju kehidupan[a], tetapi siapa yang mengabaikan teguran menyesatkan orang lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “adalah jalan menuju kehidupan.” Ungkapan Ibraninya ringkas; “jalan menuju kehidupan” dapat dipahami sebagai predikat.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרַח
  choice: jalan
  rationale: Kata ini menunjuk pada jalan atau arah hidup. “Jalan” alami dalam bahasa Indonesia dan mempertahankan metafora moral kitab Amsal.
- source_word: לְחַיִּים
  choice: menuju kehidupan
  rationale: Preposisi לְ di sini dapat menyatakan arah atau hasil. “Menuju kehidupan” menyampaikan daya arah ungkapan Ibrani dengan jelas.
- source_word: שׁוֹמֵר
  choice: menjaga
  rationale: Partisip ini berarti menjaga, memelihara, atau menaati. “Menjaga didikan” mempertahankan gambaran tindakan berkelanjutan dalam teks.
- source_word: מוּסָר
  choice: didikan
  rationale: Dalam Amsal, kata ini mencakup pengajaran yang membentuk sekaligus koreksi disipliner. “Didikan” cukup luas dan wajar bagi pembaca Indonesia.
- source_word: וְעוֹזֵב
  choice: tetapi siapa meninggalkan
  rationale: Kata sambung berfungsi kontras dalam struktur paralel, sedangkan עזב berarti meninggalkan atau mengabaikan. “Meninggalkan” mempertahankan bobot kesengajaan tindakan tersebut.
- source_word: תּוֹכַחַת
  choice: teguran
  rationale: Kata ini menunjuk pada koreksi atau celaan secara verbal. “Teguran” merupakan padanan modern dan alami dalam konteks hikmat.
- source_word: מַתְעֶה
  choice: menyesatkan orang lain
  rationale: 'Bentuk Hifil partisip dari תעה bersifat kausatif: menyebabkan tersesat. Objek tidak dinyatakan dalam bahasa Ibrani; “orang lain” ditambahkan agar konstruksi transitifnya alami dalam bahasa Indonesia.'
theological_decisions:
- issue: Hubungan sintaksis antara “jalan menuju kehidupan” dan orang yang menjaga didikan
  choice: “berada di jalan menuju kehidupan”
  alternative: “adalah jalan menuju kehidupan”
  rationale: Bahasa Ibrani bersifat ringkas dan tidak memiliki verba eksplisit, sehingga dapat menggambarkan orang itu sebagai berada pada jalan menuju kehidupan atau sebagai jalan menuju kehidupan bagi orang lain. Teks utama memilih bacaan yang paling alami secara kontekstual, sementara alternatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Paralelisme antarkedua bagian dipertahankan, dan ambiguitas sintaksis Ibrani dicatat tanpa diputuskan secara dogmatis.
