id: PRO.10.28
reference: Proverbs 10:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: תּוֹחֶ֣לֶת צַדִּיקִ֣ים שִׂמְחָ֑ה וְ/תִקְוַ֖ת רְשָׁעִ֣ים תֹּאבֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/028.yaml
  text: The expectation of the righteous is joy[a], but the hope of the wicked will perish.
translation:
  language: id
  text: 'Penantian[a] orang benar adalah sukacita,

    tetapi harapan orang fasik akan lenyap.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “harapan”. Bahasa Ibrani memakai kata benda yang berbeda dari kata “harapan” pada baris kedua, meskipun maknanya bertumpang tindih.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹחֶלֶת
  choice: penantian
  rationale: Kata ini menunjuk pada penantian yang disertai pengharapan. “Penantian” mempertahankan perbedaan kosakata dengan תִקְוָה pada baris kedua tanpa menghilangkan nuansa harapannya.
- source_word: צַדִּיקִים
  choice: orang benar
  rationale: Bentuk jamak substantival ini menyebut golongan orang yang hidup benar. “Orang benar” alami dalam bahasa Indonesia dan mempertahankan kontras dengan “orang fasik”.
- source_word: שִׂמְחָה
  choice: sukacita
  rationale: Kata benda ini berarti kegembiraan atau sukacita. “Sukacita” ringkas, wajar, dan bermartabat dalam konteks amsal.
- source_word: תִקְוַת
  choice: harapan
  rationale: Kata ini lazim berarti “harapan”. Pilihan ini menghasilkan ungkapan Indonesia yang alami sekaligus membedakannya dari תּוֹחֶלֶת pada baris pertama.
- source_word: רְשָׁעִים
  choice: orang fasik
  rationale: Bentuk jamak substantival ini menunjuk kepada orang-orang yang jahat secara moral. “Orang fasik” merupakan istilah ringkas dan mapan dalam sastra hikmat serta berlawanan dengan “orang benar”.
- source_word: תֹּאבֵד
  choice: akan lenyap
  rationale: Bentuk dari אבד ini dapat berarti binasa, hilang, atau lenyap. Karena subjek langsungnya adalah “harapan”, “akan lenyap” paling alami dan tidak mengalihkan kebinasaan itu kepada orang fasik sendiri.
theological_decisions:
- issue: Hal yang lenyap pada baris kedua
  choice: Harapan orang fasiklah yang secara langsung dinyatakan akan lenyap.
  alternative: Baris ini dapat dipahami lebih luas sebagai isyarat bahwa orang fasik akan runtuh bersama harapan mereka.
  rationale: Kata kerja feminin tunggal תֹּאבֵד bersesuaian dengan תִקְוַת, “harapan”. Karena itu, terjemahan tidak menambahkan kesimpulan tentang nasib akhir orang fasik yang tidak dinyatakan secara langsung oleh sintaksis ayat ini.
- issue: Hubungan antara penantian dan sukacita pada baris pertama
  choice: 'Mempertahankan konstruksi nominal: “Penantian ... adalah sukacita.”'
  alternative: “Penantian orang benar menghasilkan sukacita” atau “akan berujung pada sukacita.”
  rationale: Teks Ibrani tidak menyertakan kata kerja eksplisit. Rumusan nominal mempertahankan kepadatan dan kemungkinan nuansa bahwa penantian itu bercirikan sukacita atau berakhir dalam sukacita, tanpa menetapkan hubungan kausal yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bercorak amsal. Paralelisme antitetis dipertahankan, dengan variasi “penantian” dan “harapan” untuk mencerminkan dua kata benda Ibrani yang berbeda.
