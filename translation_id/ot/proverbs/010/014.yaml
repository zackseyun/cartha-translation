  text: Wise men store up knowledge[c][b][a], but the mouth of a fool is near ruin.
translation:
  language: id
  text: Orang-orang bijak menyimpan pengetahuan[a], tetapi[b] mulut orang bodoh berada dekat dengan kehancuran[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Menyimpan” juga dapat diterjemahkan “menimbun sebagai harta” atau “menyembunyikan”; maksudnya ialah menjaga dan menghimpun pengetahuan dengan bijaksana.
    reason: lexical_alternative
  - marker: b
    text: Kata penghubung Ibrani juga dapat diterjemahkan “dan”; konteks paralelisme mendukung kontras “tetapi”.
    reason: lexical_alternative
  - marker: c
    text: “Kehancuran” juga dapat diterjemahkan “kebinasaan”, “kengerian”, atau “kegentaran”. Ungkapan Ibraninya juga dapat dipahami bahwa mulut orang bodoh mendekatkan atau mendatangkan kehancuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכָמִים
  choice: orang bijak
  rationale: Bentuk jamak substantival ini berarti orang-orang yang bijaksana. Dalam bahasa Indonesia, “orang bijak” dapat berfungsi secara generik dan tetap alami dalam gaya amsal.
- source_word: יִצְפְּנוּ
  choice: menyimpan
  rationale: Kata kerja צפן mencakup arti menyembunyikan, menyimpan, atau menimbun sebagai harta. Dalam konteks hikmat, “menyimpan” menyampaikan tindakan menjaga dan menghimpun pengetahuan dengan bijaksana tanpa menyiratkan penyembunyian yang menipu.
- source_word: דָעַת
  choice: pengetahuan
  rationale: Padanan langsung dan lazim bagi דָעַת dalam sastra Amsal, serta mempertahankan kontras antara pengetahuan orang bijak dan ucapan orang bodoh.
- source_word: וּפִי
  choice: tetapi mulut
  rationale: Waw secara dasar dapat berarti “dan”, tetapi paralelisme antitetis di sini mendukung hubungan kontras, sehingga “tetapi” paling jelas dalam bahasa Indonesia.
- source_word: אֱוִיל
  choice: orang bodoh
  rationale: Istilah hikmat ini menunjuk kepada orang yang bebal secara moral atau keras kepala. “Orang bodoh” adalah ungkapan Indonesia yang wajar dan tidak menambahkan penafsiran khusus.
- source_word: מְחִתָּה
  choice: kehancuran
  rationale: Nomina ini dapat berarti kehancuran, kebinasaan, kengerian, atau kegentaran. Dalam hubungan dengan mulut orang bodoh dan sifat “dekat”, “kehancuran” paling sesuai dengan gambaran bencana yang mengancam.
- source_word: קְרֹבָה
  choice: dekat dengan
  rationale: Adjektiva predikatif ini berarti “dekat”. Rumusan tersebut mempertahankan gambaran Ibrani tentang kehancuran yang berada dekat tanpa mengubahnya menjadi pernyataan sebab-akibat yang lebih tegas daripada teks sumber.
