  text: מָע֣וֹז לַ֭/תֹּם דֶּ֣רֶךְ יְהוָ֑ה וּ֝/מְחִתָּ֗ה לְ/פֹ֣עֲלֵי אָֽוֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/029.yaml
  text: The way of Yahweh is a stronghold for the blameless[b][a], but destruction for those who do evil.
translation:
  language: id
  text: Jalan Yahweh[a] adalah benteng bagi orang yang berintegritas, tetapi kehancuran[b] bagi para pelaku kejahatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani ini dapat berarti cara Yahweh sendiri bertindak atau jalan yang Yahweh tetapkan bagi manusia.
    reason: lexical_alternative
  - marker: b
    text: Atau “keruntuhan” atau “kengerian”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעוֹז
  choice: benteng
  rationale: Kata ini menunjuk pada tempat atau sumber perlindungan dan kekuatan. “Benteng” mempertahankan metafora konkret Ibrani serta terdengar alami dalam bahasa Indonesia.
- source_word: לַתֹּם
  choice: bagi orang yang tulus
  rationale: תֹּם berarti ketulusan, keutuhan moral, atau keadaan tak bercela. Ungkapan personal ini sesuai dengan kontras terhadap para pelaku kejahatan tanpa menyiratkan kesempurnaan mutlak.
- source_word: דֶּרֶךְ יְהוָה
  choice: Jalan Yahweh
  rationale: Terjemahan harfiah ini mempertahankan keluasan frasa Ibrani, yang dapat menunjuk pada cara Yahweh bertindak maupun jalan yang Ia tetapkan bagi manusia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: וּמְחִתָּה
  choice: tetapi kehancuran
  rationale: מְחִתָּה dapat berarti kehancuran, keruntuhan, atau kedahsyatan yang menimbulkan ketakutan. “Kehancuran” membentuk antitesis yang kuat dengan “benteng”; ו diterjemahkan secara adversatif sebagai “tetapi” karena struktur amsal menyatakan kontras.
- source_word: לְפֹעֲלֵי אָוֶן
  choice: bagi para pelaku kejahatan
  rationale: Frasa ini secara harfiah berarti orang-orang yang melakukan kejahatan atau kefasikan. “Para pelaku kejahatan” jelas, ringkas, dan mempertahankan unsur tindakan dalam bentuk partisipelnya.
theological_decisions:
- issue: Cakupan makna “Jalan Yahweh”
  choice: Mempertahankan frasa luas “Jalan Yahweh” tanpa menentukan satu makna saja.
  alternative: “cara Yahweh bertindak” atau “jalan yang Yahweh perintahkan”
  rationale: Susunan Ibrani memungkinkan kedua nuansa tersebut. Membiarkan frasanya tetap luas menjaga ambiguitas dan ketegangan teologis asli.
- issue: Makna etis תֹּם
  choice: “orang yang tulus”
  alternative: “orang yang tak bercela” atau “orang yang berintegritas”
  rationale: “Tulus” mengungkapkan keutuhan moral tanpa mengharuskan pembaca memahami tokoh tersebut sebagai manusia yang sama sekali tanpa dosa.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur antitetis amsal dipertahankan; istilah “benteng” menjaga citra konkret teks sumber, sedangkan “orang yang tulus” dan “para pelaku kejahatan” mudah dipahami pembaca umum.
