  text: The mouth of the righteous bears wisdom as fruit[b][a], but the tongue of perversity will be cut off.
translation:
  language: id
  text: Mulut orang benar menghasilkan hikmat,[a] tetapi lidah yang mengucapkan hal-hal menyimpang akan dipotong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bertunas dengan hikmat” atau “mengeluarkan hikmat.” Kata kerja Ibrani membangkitkan gambaran tunas yang tumbuh atau pohon yang menghasilkan buah.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: mulut
  rationale: Mempertahankan gambaran konkret Ibrani tentang mulut sebagai sumber perkataan dan menyejajarkannya dengan 'lidah' pada baris kedua.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva tunggal ini berfungsi substantival sebagai wakil suatu golongan; 'orang benar' merupakan ungkapan Indonesia yang alami dan tidak membatasi penerapannya pada satu jenis kelamin.
- source_word: יָנוּב
  choice: menghasilkan ... seperti buah
  rationale: Kata kerja ini menggambarkan tumbuhnya tunas atau keluarnya buah. Terjemahan ini mempertahankan metafora organiknya sekaligus terdengar jelas dalam bahasa Indonesia.
- source_word: חָכְמָה
  choice: hikmat
  rationale: Mempertahankan nomina abstrak sumber tanpa mempersempitnya menjadi sekadar 'perkataan bijak'.
- source_word: לְשׁוֹן
  choice: lidah
  rationale: Metonimia konkret bagi perkataan ini mempertahankan kesejajaran dengan 'mulut'.
- source_word: תַּהְפֻּכוֹת
  choice: yang mengucapkan hal-hal sesat
  rationale: Bentuk jamak menunjuk pada berbagai ungkapan atau hal yang bengkok dan menyimpang. Perluasan ringan ini menyampaikan hubungan idiomatis dengan 'lidah' dan menjaga nuansa jamaknya.
- source_word: תִּכָּרֵת
  choice: akan dipotong
  rationale: Mempertahankan bentuk pasif dan kerasnya metafora Ibrani tanpa menentukannya hanya sebagai 'dibungkam' atau 'disingkirkan'.
