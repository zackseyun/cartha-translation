  text: 'The proverbs of Solomon: a wise son makes a father glad[a], but a foolish son is the grief of his mother.'
translation:
  language: id
  text: 'Amsal Salomo:


    Anak laki-laki yang bijaksana menggembirakan ayah,

    tetapi anak laki-laki yang bodoh menjadi dukacita bagi ibunya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁלֵי
  choice: Amsal-amsal
  rationale: Bentuk jamak konstruksi dari מָשָׁל berfungsi sebagai judul kumpulan. “Amsal-amsal” mempertahankan makna jamak dan sesuai dengan istilah baku kitab hikmat ini.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Nama diri ini memakai bentuk yang sudah mapan dalam bahasa Indonesia.
- source_word: בֵּן
  choice: anak
  rationale: Dalam konteks hubungan dengan ayah dan ibu, “anak” merupakan padanan Indonesia yang alami. Walaupun bentuk Ibraninya maskulin tunggal dan dapat diterjemahkan “anak laki-laki”, maskulinitas itu tidak perlu diperjelas karena nas ini menyatakan pengamatan umum tentang seorang anak.
- source_word: חָכָם
  choice: yang bijaksana
  rationale: Dalam Amsal, kata ini menunjuk pada hikmat moral dan praktis, bukan sekadar kecakapan teknis. Bentuk “yang bijaksana” alami sebagai pewatas “anak”.
- source_word: יְשַׂמַּח
  choice: menggembirakan
  rationale: Bentuk kausatif verba ini berarti menyebabkan seseorang bersukacita. “Menggembirakan” ringkas, wajar, dan mempertahankan daya kausatifnya.
- source_word: אָב
  choice: ayah
  rationale: Teks Ibrani tidak memakai akhiran posesif. Bentuk tanpa “-nya” mempertahankan sifat umum peribahasa ini dan tetap alami dalam bahasa Indonesia.
- source_word: וּבֵן
  choice: tetapi anak
  rationale: Walaupun waw pada dasarnya berarti “dan”, hubungan antitetis antara dua baris paling jelas dan alami diungkapkan dengan “tetapi”.
- source_word: כְּסִיל
  choice: yang bodoh
  rationale: Dalam sastra hikmat, kata ini menggambarkan kebodohan moral dan praktis, bukan semata-mata rendahnya kecerdasan. “Bodoh” mempertahankan kontras langsung dengan “bijaksana”.
- source_word: תּוּגַת
  choice: menjadi dukacita bagi
  rationale: Nomina konstruksi ini berarti dukacita atau kesedihan. Ungkapan “menjadi dukacita bagi” mempertahankan bentuk nominal sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: אִמּוֹ
  choice: ibunya
  rationale: Akhiran orang ketiga maskulin tunggal dinyatakan secara eksplisit dengan akhiran “-nya”.
