base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/023.yaml
  text: Doing wickedness is like a joke to a fool[a], but wisdom is for a man of understanding.
translation:
  language: id
  text: Melakukan kejahatan adalah seperti permainan bagi orang bodoh[a], tetapi hikmat bagi orang yang berpengertian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Melakukan rencana jahat adalah hiburan bagi orang bodoh.” Kata Ibrani yang diterjemahkan “kejahatan” juga dapat menunjuk pada perbuatan yang tidak tahu malu atau keterlaluan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׂחוֹק
  choice: seperti permainan
  rationale: Prefiks כְּ menyatakan perbandingan, sedangkan שְׂחוֹק dapat berarti tawa, hiburan, atau permainan. Frasa ini secara alami menyampaikan bahwa orang bodoh menganggap kejahatan sebagai sesuatu yang menghibur atau menyenangkan.
- source_word: לִכְסִיל
  choice: bagi orang bodoh
  rationale: 'Preposisi לְ di sini menandai sudut pandang atau hubungan: demikianlah orang bodoh memandang perbuatan itu.'
- source_word: עֲשׂוֹת
  choice: Melakukan
  rationale: Bentuk infinitif berfungsi sebagai pokok klausa dan dapat diterjemahkan secara alami dengan verba nominal 'Melakukan'.
- source_word: זִמָּה
  choice: kejahatan
  rationale: זִמָּה dapat menunjuk pada rencana jahat, perbuatan tidak tahu malu, atau kebejatan. 'Kejahatan' mempertahankan bobot moralnya tanpa mempersempitnya pada makna seksual.
- source_word: וְחָכְמָה
  choice: tetapi hikmat
  rationale: Walaupun וְ secara dasar berarti 'dan', paralelisme antitetis antara orang bodoh dan orang berpengertian mendukung terjemahan adversatif 'tetapi'.
- source_word: לְאִישׁ תְּבוּנָה
  choice: bagi orang yang berpengertian
  rationale: Secara harfiah frasa ini berarti 'bagi seorang yang berpengertian'. Klausa Ibrani menghilangkan predikat, sehingga terjemahan mempertahankan bentuk ringkas dan keterbukaan hubungan antara hikmat dan orang berpengertian.
theological_decisions:
- issue: Bahasa maskulin representatif dalam אִישׁ
  choice: orang yang berpengertian
  alternative: laki-laki yang berpengertian
  rationale: Walaupun אִישׁ berbentuk maskulin tunggal, dalam pepatah hikmat ini pemakaiannya bersifat representatif dan berlaku umum. Bahasa Indonesia alami memakai 'orang' tanpa mengubah cakupan pernyataan.
- issue: Elipsis pada klausa kedua
  choice: 'mempertahankan klausa tanpa predikat eksplisit: ''tetapi hikmat bagi orang yang berpengertian'''
  alternative: tetapi hikmat merupakan kesukaan orang yang berpengertian
  rationale: Teks Ibrani tidak menyatakan bahwa hikmat adalah 'kesukaan' atau mengulang secara eksplisit gagasan 'permainan'. Mempertahankan elipsis menghindari penyelesaian tafsir yang terlalu pasti dan menjaga ketegangan paralelismenya.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bernada hikmat. 'Seperti permainan' dipilih daripada 'seperti lelucon' karena mencakup nuansa hiburan atau kesenangan dalam שְׂחוֹק dan terdengar alami. Elipsis klausa kedua sengaja dipertahankan.
