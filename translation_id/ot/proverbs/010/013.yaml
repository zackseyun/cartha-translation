  text: בְּ/שִׂפְתֵ֣י נָ֭בוֹן תִּמָּצֵ֣א חָכְמָ֑ה וְ֝/שֵׁ֗בֶט לְ/גֵ֣ו חֲסַר לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/013.yaml
  text: On the lips of a discerning man wisdom is found[a], but a rod is for the back of one who lacks sense.
translation:
  language: id
  text: Pada bibir orang yang berpengertian terdapat hikmat, tetapi tongkat bagi punggung orang yang tidak berakal budi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kekurangan hati”, sebuah ungkapan Ibrani yang berarti tidak memiliki pengertian atau pertimbangan yang baik.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׂפְתֵי
  choice: Pada bibir
  rationale: Mempertahankan gambaran Ibrani bahwa hikmat hadir dalam perkataan seseorang, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: נָבוֹן
  choice: orang yang berpengertian
  rationale: Menunjuk kepada orang yang memiliki daya memahami dan membedakan dengan tepat; bentuk ini juga menyampaikan fungsi pepatah yang berlaku umum.
- source_word: תִּמָּצֵא
  choice: terdapat
  rationale: Bentuk pasif ini menyatakan kebenaran umum dalam pepatah, bukan peristiwa yang hanya akan terjadi pada masa depan.
- source_word: חָכְמָה
  choice: hikmat
  rationale: Padanan baku dan sesuai konteks sastra hikmat.
- source_word: וְשֵׁבֶט
  choice: tetapi tongkat
  rationale: Kata penghubung dipahami sebagai pertentangan antara perkataan orang berpengertian dan hukuman bagi orang yang tidak berakal budi; 'tongkat' mempertahankan gambaran alat disiplin atau hukuman.
- source_word: לְגֵו
  choice: tersedia bagi punggung
  rationale: גֵו dapat berarti punggung atau tubuh; dalam hubungan dengan tongkat, 'punggung' adalah makna yang paling tepat. Kata 'tersedia' melengkapi klausa tanpa verba dan menunjukkan peruntukan.
- source_word: חֲסַר לֵב
  choice: orang yang tidak berakal budi
  rationale: Ungkapan Ibrani ini secara harfiah berarti 'kekurangan hati', tetapi 'hati' di sini menunjuk pada pengertian dan pertimbangan. 'Tidak berakal budi' menyampaikan makna idiomatisnya dengan bahasa Indonesia yang jelas dan bermartabat.
