  text: The memory of the righteous is a blessing[a], but the name of the wicked will rot.
translation:
  language: id
  text: Kenangan akan orang benar adalah berkat,[a] tetapi nama orang-orang fasik akan membusuk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kenangan akan orang benar adalah untuk berkat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֵכֶר
  choice: kenangan tentang
  rationale: Nomina ini dapat berarti ingatan, kenangan, atau penyebutan. 'Kenangan tentang' terdengar alami dalam bahasa Indonesia dan menunjuk pada apa yang tetap diingat mengenai seseorang.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva ini dipakai secara substantival untuk orang yang hidup benar. Bentuk tunggal generik dipertahankan tanpa menambahkan penandaan gender.
- source_word: לִבְרָכָה
  choice: mendatangkan berkat
  rationale: Secara harfiah berarti 'untuk berkat'. Ungkapan 'mendatangkan berkat' menyampaikan fungsi predikatifnya secara alami sambil tetap membuka kemungkinan bahwa kenangan itu menjadi sumber atau sarana berkat.
- source_word: שֵׁם
  choice: nama
  rationale: '''Nama'' mempertahankan citra dan idiom Ibrani yang mencakup reputasi serta warisan seseorang tanpa mempersempitnya menjadi salah satu nuansa saja.'
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Bentuk jamak substantival ini menunjuk pada golongan orang yang jahat secara moral. 'Orang-orang fasik' ringkas, lazim dalam bahasa Alkitab Indonesia, dan mempertahankan kontras etis dengan 'orang benar'.
- source_word: יִרְקָב
  choice: akan membusuk
  rationale: Kata kerja ini secara konkret berarti membusuk. Pilihan ini mempertahankan gambaran tajam tentang nama atau peninggalan orang fasik yang mengalami kebusukan, bukan sekadar terlupakan.
theological_decisions:
- issue: Hubungan לִבְרָכָה dengan זֵכֶר צַדִּיק
  choice: mendatangkan berkat
  alternative: menjadi berkat / diperuntukkan bagi berkat
  rationale: Konstruksi berpreposisi ל dapat dipahami sebagai penilaian atau hasil. Terjemahan utama dibuat idiomatis tanpa menetapkan secara sempit apakah kenangan itu sendiri adalah berkat atau digunakan dalam ucapan berkat; alternatif yang lebih harfiah dicatat.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bernada hikmat. Paralelisme serta citra konkret 'nama ... membusuk' dipertahankan. 'Fasik' dipilih sebagai istilah moral yang mapan dan bermartabat; struktur jamak Ibrani pada bagian kedua tetap tampak.
