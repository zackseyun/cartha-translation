id: PRO.10.2
reference: Proverbs 10:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹא י֭וֹעִילוּ אוֹצְר֣וֹת רֶ֑שַׁע וּ֝/צְדָקָ֗ה תַּצִּ֥יל מִ/מָּֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/002.yaml
  text: Treasures of wickedness do not profit[b][a], but righteousness delivers from death.
translation:
  language: id
  text: Harta yang diperoleh dengan kefasikan[a] tidak berguna, tetapi kebenaran[b] menyelamatkan dari maut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Harta kefasikan”; konstruksi Ibrani dapat menunjuk pada harta yang berkaitan dengan atau diperoleh melalui kefasikan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “keadilan”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹצְרוֹת
  choice: harta
  rationale: Dalam konstruksi ini, kata tersebut menunjuk pada kekayaan atau barang berharga yang terkumpul, bukan terutama bangunan tempat penyimpanan. “Harta” alami dan ringkas dalam peribahasa Indonesia.
- source_word: רֶשַׁע
  choice: yang diperoleh dengan kefasikan
  rationale: Konstruksi harfiahnya adalah “harta kefasikan”. Ungkapan ini kemungkinan besar menunjuk pada harta yang diperoleh melalui perbuatan fasik; catatan kaki mempertahankan bentuk konstruksi yang lebih formal dan ambiguitasnya.
- source_word: יֹועִילוּ
  choice: tidak berguna
  rationale: Bentuk Hifil dari יעל menyatakan kegunaan atau manfaat. “Tidak berguna” ringkas, wajar, dan mempertahankan daya ungkap pepatah.
- source_word: וּצְדָקָה
  choice: tetapi kebenaran
  rationale: Waw diterjemahkan “tetapi” karena paralelisme antitetis. “Kebenaran” di sini berarti kelurusan moral atau hidup benar; “keadilan” tetap merupakan kemungkinan leksikal.
- source_word: תַּצִּיל
  choice: menyelamatkan
  rationale: Bentuk Hifil dari נצל berarti melepaskan, menolong, atau menyelamatkan dari bahaya. “Menyelamatkan” alami dalam bahasa Indonesia dan tidak membatasi cara pelepasannya.
- source_word: מִמָּוֶת
  choice: dari maut
  rationale: Terjemahan langsung yang mempertahankan keluasan ungkapan, baik kematian secara harfiah maupun ancaman maut dalam cakrawala sastra hikmat.
theological_decisions:
- issue: Makna צְדָקָה
  choice: kebenaran
  alternative: keadilan
  rationale: Dalam konteks hikmat ini, kata tersebut terutama menggambarkan kelurusan moral dan perilaku yang benar sebagai lawan kefasikan. Namun, nuansa keadilan tidak ditiadakan dan dicantumkan dalam catatan kaki.
- issue: Cakupan ungkapan “menyelamatkan dari maut”
  choice: mempertahankan pernyataan umum tanpa menjelaskan jenis kematian atau mekanisme penyelamatan
  alternative: menafsirkan sebagai lolos dari bahaya maut atau sebagai keselamatan rohani
  rationale: Teks Ibrani tidak menentukan apakah maut dimaksudkan hanya secara fisik, sebagai bahaya mematikan, atau dengan cakupan teologis yang lebih luas. Terjemahan tidak menyelesaikan ketegangan itu secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada peribahasa. “Maut” dipilih alih-alih “kematian” untuk menjaga keagungan dan kepadatan puitis, sedangkan struktur antitetis ayat dipertahankan.
