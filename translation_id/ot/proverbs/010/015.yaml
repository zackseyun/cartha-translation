  text: ה֣וֹן עָ֭שִׁיר קִרְיַ֣ת עֻזּ֑/וֹ מְחִתַּ֖ת דַּלִּ֣ים רֵישָֽׁ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/015.yaml
  text: A rich man's wealth is his fortified city[b][a]; the ruin of the poor is their poverty.
translation:
  language: id
  text: Harta orang kaya adalah kota yang kuat baginya[a]; kemiskinan orang miskin adalah kehancuran mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kota kekuatannya”; dapat juga diterjemahkan “kota berbenteng baginya.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “kehancuran” juga dapat berarti “kebinasaan” atau, meski kurang mungkin di sini, “kengerian” atau “ketakutan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: harta
  rationale: Menunjuk pada kekayaan atau milik materi; “harta” alami dalam bahasa Indonesia dan mempertahankan kontras ekonomi ayat ini.
- source_word: עָשִׁיר
  choice: orang kaya
  rationale: Adjektiva yang dipakai sebagai nomina; bentuk ini wajar dan tetap mempertahankan acuan tunggal dalam klausa pertama.
- source_word: קִרְיַת עֻזּוֹ
  choice: kota bentengnya
  rationale: Secara harfiah berarti “kota kekuatannya”; “kota bentengnya” menyampaikan metafora sebuah kota yang kuat dan terlindung tanpa menghilangkan citra kota.
- source_word: מְחִתַּת
  choice: kehancuran
  rationale: Dapat berarti kehancuran, kebinasaan, atau kengerian. Dalam kesejajaran dengan keamanan yang diberikan harta, “kehancuran” paling sesuai, sambil mencatat ambiguitas leksikal.
- source_word: דַּלִּים
  choice: orang miskin
  rationale: Mengacu kepada orang-orang miskin atau lemah; dalam kontras ekonomi ini, “orang miskin” paling tepat dan alami.
- source_word: רֵישָׁם
  choice: kemiskinan mereka
  rationale: Berarti kemiskinan atau kekurangan; terjemahan langsung ini mempertahankan hubungan antara keadaan miskin dan kehancuran dalam pepatah.
