  text: The blessing of the LORD makes rich, and he adds no sorrow with it.
translation:
  language: id
  text: 'Berkat TUHANlah yang menjadikan kaya,

    dan Ia tidak menambahkan kesusahan bersama berkat itu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּרְכַּת יְהוָה
  choice: Berkat TUHANlah
  rationale: Konstruksi ini berarti 'berkat TUHAN'. Partikel -lah memberi penekanan alami pada berkat TUHAN sebagai pokok utama; nama perjanjian יהוה ditampilkan menurut konvensi Indonesia sebagai TUHAN.
- source_word: תַעֲשִׁיר
  choice: menjadikan kaya
  rationale: Bentuk kausatif dari עשׁר menyatakan bahwa berkat itu membuat atau menjadikan seseorang kaya.
- source_word: עֶצֶב
  choice: kesusahan
  rationale: Kata ini dapat menunjuk pada kesusahan, kepedihan, atau jerih payah yang menyakitkan. 'Kesusahan' mempertahankan keluasan maknanya tanpa mempersempitnya menjadi emosi saja.
- source_word: עִמָּהּ
  choice: bersamanya
  rationale: Pronomina feminin merujuk secara gramatikal kepada 'berkat'; pilihan ini mempertahankan rujukan tersebut secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Subjek tersirat pada יוֹסִף
  choice: Dia, yaitu TUHAN, tidak menambahkan kesusahan
  alternative: berkat itu tidak menambahkan kesusahan / jerih payah tidak menambah apa pun kepadanya
  rationale: Bentuk maskulin tunggal paling wajar merujuk kepada TUHAN, bukan kepada בִּרְכַּת yang feminin. Namun, susunan Ibrani juga memungkinkan pemahaman lain atas hubungan unsur-unsur kalimat, sehingga alternatif penting dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat, dengan paralelisme puitis dua baris. Kapitalisasi TUHAN mengikuti kebiasaan penerjemahan nama יהוה.
