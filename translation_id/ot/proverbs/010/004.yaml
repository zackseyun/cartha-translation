source:
  edition: WLC
  text: רָ֗אשׁ עֹשֶׂ֥ה כַף רְמִיָּ֑ה וְ/יַ֖ד חָרוּצִ֣ים תַּעֲשִֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/004.yaml
  text: A slack hand makes one poor[a], but the hand of the diligent makes rich.
translation:
  language: id
  text: 'Tangan yang malas[a] membuat orang miskin,

    tetapi tangan orang rajin menjadikannya kaya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “curang”. Kata Ibrani רְמִיָּה di tempat lain dapat mengandung arti penipuan, tetapi dalam amsal tentang pekerjaan ini konteks lebih mendukung arti “malas” atau “lalai”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשׁ
  choice: miskin
  rationale: Kata ini menyatakan hasil yang berlawanan dengan menjadi kaya pada baris kedua. Bentuk adjektiva “miskin” mempertahankan gambaran keadaan ekonomi seseorang.
- source_word: עֹשֶׂה
  choice: membuat orang
  rationale: Partisipel עשה di sini menyatakan akibat yang ditimbulkan. Ungkapan “membuat orang miskin” alami dalam bahasa Indonesia dan mempertahankan daya kausatifnya.
- source_word: כַף
  choice: tangan
  rationale: Walaupun כַף secara khusus dapat berarti “telapak tangan”, di sini kata itu menunjuk tangan sebagai alat untuk bekerja. “Tangan” juga mempertahankan gambaran konkret dan kesejajaran dengan יָד.
- source_word: רְמִיָּה
  choice: malas
  rationale: Dalam konteks amsal tentang kerja, kata ini paling mungkin menggambarkan kelalaian atau kemalasan, bukan penipuan. “Malas” jelas dan wajar bagi pembaca Indonesia modern.
- source_word: יָד
  choice: tangan
  rationale: Pilihan ini mempertahankan pengulangan citra anggota tubuh dan pertentangan puitis dengan baris pertama.
- source_word: חָרוּצִים
  choice: orang rajin
  rationale: Bentuk jamak substantival ini menunjuk orang-orang yang tekun dan giat. “Orang rajin” merupakan padanan Indonesia yang ringkas dan alami.
- source_word: תַּעֲשִׁיר
  choice: menjadikannya kaya
  rationale: Bentuk Hifil dari עשר bersifat kausatif, yaitu “membuat menjadi kaya”. Pilihan ini mempertahankan kesejajaran dengan “membuat orang miskin” tanpa pengulangan yang kaku.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang modern, lugas, dan bernada amsal. Susunan dua baris mempertahankan paralelisme antitesis teks Ibrani; “menjadikannya” menghindari pengulangan yang kaku sekaligus mempertahankan hubungan kausatif.
