  text: He who gathers in summer is a prudent son[b][a], but he who sleeps during harvest is a son who brings shame.
translation:
  language: id
  text: Orang yang mengumpulkan hasil pada musim panas adalah putra yang bijaksana[a], tetapi orang yang tidur pada musim panen adalah putra[b] yang mendatangkan malu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menyimpan hasil pada musim panas.”'
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai bentuk maskulin tunggal, “putra”; dalam Amsal bentuk ini sering berfungsi secara representatif sambil mempertahankan corak pengajaran dari ayah kepada putra.
    reason: cultural_note
lexical_decisions:
- source_word: אֹגֵר
  choice: mengumpulkan hasil
  rationale: Partisip ini menunjuk pada tindakan mengumpulkan hasil bumi. Penambahan 'hasil' membuat objek tersiratnya jelas secara alami tanpa mempersempitnya menjadi tindakan menyimpan.
- source_word: בַּקַּיִץ
  choice: pada musim panas
  rationale: Ungkapan ini menandai musim yang tepat untuk mengumpulkan hasil; terjemahan ini langsung dan wajar dalam bahasa Indonesia.
- source_word: בֵּן
  choice: anak
  rationale: Dalam bahasa Indonesia, 'anak' merupakan padanan alami bagi relasi keturunan ini dan tidak menambahkan penandaan jenis kelamin yang tidak diwajibkan oleh tata bahasa Indonesia; konteks Amsal tetap mempertahankan corak didikan orang tua kepada anak.
- source_word: מַשְׂכִּיל
  choice: bijaksana
  rationale: Bentuk partisip ini menggambarkan orang yang menunjukkan pengertian praktis melalui tindakan tepat waktu. 'Bijaksana' alami dan mudah dipahami dalam konteks sastra hikmat.
- source_word: נִרְדָּם
  choice: tidur
  rationale: Partisip Nifal menggambarkan orang yang tidur pada saat ia seharusnya bekerja; bentuk sederhana ini mempertahankan ketajaman paralel pepatah.
- source_word: בַּקָּצִיר
  choice: pada musim panen
  rationale: Frasa ini menandai waktu genting ketika pekerjaan panen harus dilakukan. 'Pada musim panen' jelas dan idiomatis.
- source_word: מֵבִישׁ
  choice: mendatangkan malu
  rationale: 'Partisip Hifil bersifat kausatif: anak itu menyebabkan rasa malu atau aib. ''Mendatangkan malu'' mempertahankan nuansa kausatif tersebut.'
