  text: שִׂפְתֵ֣י צַ֭דִּיק יִרְע֣וּ רַבִּ֑ים וֶֽ֝/אֱוִילִ֗ים בַּ/חֲסַר לֵ֥ב יָמֽוּתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/021.yaml
  text: The lips of the righteous feed many[b][a], but fools die for lack of sense.
translation:
  language: id
  text: Bibir orang benar memberi makan banyak orang[a], tetapi orang bodoh mati karena kurang pengertian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memelihara banyak orang” atau “menggembalakan banyak orang”; kata kerja Ibrani juga dapat berarti membawa ternak ke padang rumput.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “karena kekurangan hati”; dalam bahasa Ibrani, “hati” sering menunjuk pada pengertian atau pertimbangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי צַדִּיק
  choice: Bibir orang benar
  rationale: Mempertahankan gambaran harfiah “bibir” sebagai metonimia untuk perkataan. Bentuk tunggal צַדִּיק dipahami secara generik sebagai orang yang benar, tanpa penambahan penanda gender.
- source_word: יִרְעוּ
  choice: memberi makan
  rationale: Kata kerja רעה berarti menggembalakan, membawa ke padang rumput, atau memberi makan. Dengan “bibir” sebagai subjek, “memberi makan” mempertahankan metafora bahwa perkataan orang benar menghidupi orang lain dan tetap jelas dalam bahasa Indonesia.
- source_word: רַבִּים
  choice: banyak orang
  rationale: Secara harfiah berarti “banyak.” Penambahan “orang” memperjelas objek insani yang tersirat dan menghasilkan bahasa Indonesia yang alami.
- source_word: אֱוִילִים
  choice: orang bodoh
  rationale: Istilah khas sastra hikmat bagi orang yang bebal secara moral dan tidak mau menerima hikmat, bukan semata-mata orang yang kurang cerdas.
- source_word: בַּחֲסַר לֵב
  choice: karena kurang pengertian
  rationale: Ungkapan ini secara harfiah berarti “karena kekurangan hati.” Dalam pemikiran Ibrani, “hati” juga merupakan pusat pemahaman dan pertimbangan; “kurang pengertian” menyampaikan maksud idiom itu secara alami.
- source_word: יָמוּתוּ
  choice: mati
  rationale: Mempertahankan arti langsung kata kerja מות, bukan melemahkannya menjadi sekadar “binasa” atau “jatuh dalam kehancuran.” Bentuk kini sesuai dengan pernyataan amsal yang bersifat umum.
