  text: שִׂ֭נְאָה תְּעוֹרֵ֣ר מְדָנִ֑ים וְ/עַ֥ל כָּל פְּ֝שָׁעִ֗ים תְּכַסֶּ֥ה אַהֲבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/012.yaml
  text: Hatred stirs up conflicts[b][a], but love covers all transgressions.
translation:
  language: id
  text: Kebencian membangkitkan pertengkaran, tetapi kasih menutupi segala pelanggaran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menutupi segala pelanggaran.” Gambaran ini menunjukkan bahwa kasih tidak mengumbar atau terus memperbesar kesalahan; ini tidak berarti bahwa kasih harus menyembunyikan ketidakadilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂנְאָה
  choice: Kebencian
  rationale: Nomina abstrak ini menjadi subjek dan membentuk pertentangan langsung dengan אַהֲבָה, ‘kasih’.
- source_word: תְּעוֹרֵר
  choice: membangkitkan
  rationale: Bentuk Polel imperfek feminin tunggal dari עור memiliki arti kausatif, yaitu menyebabkan pertengkaran timbul atau berkobar.
- source_word: מְדָנִים
  choice: pertengkaran
  rationale: Nomina jamak ini menunjuk pada perselisihan atau pertikaian. ‘Pertengkaran’ alami dalam bahasa Indonesia dan cocok dengan konteks hubungan antarmanusia.
- source_word: וְ/עַל
  choice: tetapi
  rationale: Secara harfiah unsur ini berarti ‘dan/atas’, tetapi dalam paralelisme antitetis, ‘tetapi’ menyampaikan hubungan kontras secara wajar tanpa mengubah maksudnya.
- source_word: כָּל
  choice: segala
  rationale: Kuantor ini mencakup keseluruhan pelanggaran; ‘segala’ terdengar alami sebelum nomina tak tentu.
- source_word: פְּשָׁעִים
  choice: pelanggaran
  rationale: פשׁע dapat menyatakan pelanggaran, kesalahan berat, atau pemberontakan. ‘Pelanggaran’ mempertahankan bobot moralnya tanpa mempersempit konteks.
- source_word: תְּכַסֶּה
  choice: menutupi
  rationale: Bentuk Piel imperfek feminin tunggal dari כסה mempertahankan gambaran konkret ‘menutupi’; terjemahan ini tidak secara diam-diam menggantinya dengan tafsiran seperti ‘mengampuni’ atau ‘mengabaikan’.
- source_word: אַהֲבָה
  choice: kasih
  rationale: Padanan langsung dan bermartabat bagi nomina abstrak ini serta membentuk kontras utama dengan ‘kebencian’.
theological_decisions:
- issue: Makna ‘kasih menutupi segala pelanggaran’
  choice: Mempertahankan metafora bahwa kasih menutupi pelanggaran.
  alternative: ‘Kasih mengampuni segala dosa’ atau ‘kasih menyembunyikan setiap kesalahan’.
  rationale: 'Bahasa Ibrani memakai kata ‘menutupi’, bukan istilah eksplisit untuk pengampunan. Metafora ini dibiarkan terbuka: dalam kontras dengan kebencian yang membangkitkan pertengkaran, kasih tidak mengumbar atau terus memperbesar pelanggaran. Terjemahan juga tidak menyiratkan bahwa kasih wajib menyembunyikan ketidakadilan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada hikmat. Paralelisme antitetis dipertahankan. ‘Kasih’ dipilih daripada ‘cinta’ karena lebih sesuai dengan register etis yang luas, sedangkan metafora ‘menutupi’ dipertahankan agar ambiguitas sumber tidak diselesaikan secara berlebihan.
