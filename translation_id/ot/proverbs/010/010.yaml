  text: Whoever winks the eye causes grief[a], and a fool of lips will come to ruin.
translation:
  language: id
  text: 'Orang yang mengedipkan mata mendatangkan kesedihan,[a]

    dan orang bodoh dalam berkata-kata akan hancur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Orang yang mengedipkan mata mendatangkan kesedihan, dan orang bodoh yang banyak bicara akan hancur.” Secara harfiah, bagian kedua berbunyi “orang bodoh [yang berciri] bibir akan hancur”; makna tepat verba Ibrani untuk “akan hancur” tidak pasti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵץ עַיִן
  choice: Orang yang mengedipkan mata
  rationale: Partisipel קֹרֵץ dipakai secara substantival untuk menyatakan orang secara umum, sedangkan עַיִן menjadi objeknya. Ungkapan ini dipertahankan tanpa menambahkan motif jahat yang tidak dinyatakan secara eksplisit.
- source_word: יִתֵּן
  choice: mendatangkan
  rationale: 'Secara harfiah berarti ''memberikan'', tetapi bersama עַצָּבֶת maknanya idiomatis: menyebabkan atau mendatangkan kesedihan.'
- source_word: עַצָּבֶת
  choice: kesedihan
  rationale: Kata ini dapat menunjuk pada rasa sakit, dukacita, atau kesusahan. 'Kesedihan' alami dalam bahasa Indonesia dan cukup luas untuk mencakup luka emosional yang dimaksud.
- source_word: וֶאֱוִיל שְׂפָתַיִם
  choice: dan orang bodoh dalam perkataannya
  rationale: Secara harfiah frasa ini berbunyi 'orang bodoh pada bibir', yaitu orang yang kebodohannya tampak atau bekerja melalui ucapannya. Terjemahan ini mempertahankan kaitannya dengan perkataan tanpa menghasilkan frasa Indonesia yang janggal.
- source_word: יִלָּבֵט
  choice: akan jatuh binasa
  rationale: Bentuk Nifal yang jarang ini sulit dipastikan nuansa tepatnya, tetapi dalam konteks menyatakan kejatuhan atau kebinasaan. 'Jatuh binasa' mempertahankan gambaran keruntuhan sekaligus hasil akhirnya.
