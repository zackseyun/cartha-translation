  register: Bahasa Indonesia modern, wajar, dan bermartabat. Baris kedua memakai 'orang bodoh dalam perkataannya' sebagai padanan idiomatis bagi frasa Ibrani yang secara harfiah berarti 'orang bodoh pada bibir'; bentuk harfiahnya dicatat dalam catatan kaki agar kesulitan teks tetap terlihat.
