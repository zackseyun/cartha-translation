base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/025.yaml
  text: When the storm passes[a], the wicked are no more[b], but the righteous are an everlasting foundation.
translation:
  language: id
  text: Ketika badai berlalu[a], orang fasik tidak ada lagi[b], tetapi orang benar adalah dasar yang kekal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Ketika angin puyuh berlalu” atau “Sementara badai berlalu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah dalam bahasa Ibrani, “dan tidak ada orang fasik.” Maksudnya, orang fasik lenyap atau binasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּעֲבוֹר
  choice: Ketika ... berlalu
  rationale: Prefiks כ dengan infinitif konstruk עבר membentuk keterangan waktu atau perbandingan. Dalam konteks ini, “Ketika ... berlalu” menyampaikan gambaran peristiwa secara alami tanpa menghilangkan kemungkinan nuansa “pada saat” atau “sementara” yang dicatat dalam catatan kaki.
- source_word: סוּפָה
  choice: badai
  rationale: Kata ini menunjuk pada badai hebat, prahara, atau angin pusar. “Badai” merupakan padanan Indonesia modern yang jelas dan tetap mempertahankan daya rusak dalam gambaran tersebut.
- source_word: וְאֵין
  choice: tidak ada lagi
  rationale: Secara harfiah frasa ini berarti “dan tidak ada.” Dalam konteks akibat badai, “tidak ada lagi” secara wajar mengungkapkan bahwa orang fasik lenyap atau binasa, tanpa menentukan lebih jauh caranya.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Bentuk tunggal maskulin ini bersifat representatif dalam pepatah dan menunjuk pada golongan orang yang fasik, bukan hanya pada seorang laki-laki tertentu.
- source_word: וְצַדִּיק
  choice: tetapi orang benar
  rationale: Kata penghubung ו menyatakan kontras dalam paralelisme sehingga diterjemahkan “tetapi.” Bentuk tunggalnya bersifat representatif dan wajar diterjemahkan “orang benar.”
- source_word: יְסוֹד
  choice: dasar
  rationale: Kata ini berarti dasar atau fondasi. “Dasar” adalah padanan langsung dan alami dalam susunan “dasar yang kekal”; unsur keteguhannya sudah tersirat oleh עוֹלָם.
- source_word: עוֹלָם
  choice: yang kekal
  rationale: Di sini kata tersebut menerangkan keberlangsungan dan ketahanan dasar itu. “Yang kekal” mempertahankan pernyataan kuat tentang sifat yang terus bertahan.
theological_decisions:
- issue: Bentuk tunggal maskulin yang representatif dalam sastra hikmat
  choice: 'Menerjemahkan רָשָׁע dan צַדִּיק sebagai sebutan golongan yang berlaku umum: “orang fasik” dan “orang benar.”'
  alternative: “laki-laki fasik ... laki-laki benar” atau “seorang yang fasik ... seorang yang benar”
  rationale: Bentuk maskulin tunggal Ibrani menyatakan tipe manusia secara umum dalam pepatah, bukan membatasi penerapannya pada laki-laki. Terjemahan ini mempertahankan kontras moral tanpa menambahkan pembatasan gender.
- issue: Sifat metaforis orang benar sebagai dasar
  choice: 'Mempertahankan predikasi langsung: “orang benar adalah dasar yang kekal.”'
  alternative: “orang benar tetap teguh untuk selama-lamanya”
  rationale: Teks Ibrani secara langsung menyebut orang benar sebagai יְסוֹד עוֹלָם. Mempertahankan metafora “dasar” menghindari penggantian citra sumber dengan penjelasan interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur antitesis pepatah dipertahankan; istilah “fasik,” “benar,” dan metafora “dasar yang kekal” menjaga bobot moral serta citra teks sumber.
