id: PRO.10.30
reference: Proverbs 10:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: צַדִּ֣יק לְ/עוֹלָ֣ם בַּל יִמּ֑וֹט וּ֝/רְשָׁעִ֗ים לֹ֣א יִשְׁכְּנוּ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/030.yaml
  text: The righteous will never be shaken[a], but the wicked will not dwell in the land.
translation:
  language: id
  text: Orang benar tidak akan pernah goyah, tetapi orang-orang fasik tidak akan mendiami negeri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: bumi.'
    reason: 'Alternatif leksikal: kata Ibrani אֶרֶץ dapat berarti suatu negeri atau bumi secara lebih luas.'
lexical_decisions:
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva tunggal yang berfungsi sebagai nomina ini menunjuk secara umum kepada orang yang hidup benar. Bentuk 'orang benar' alami dalam bahasa Indonesia dan tidak menentukan gender.
- source_word: לְעוֹלָם ... בַּל
  choice: tidak akan pernah
  rationale: Gabungan keterangan waktu 'untuk selamanya' dengan partikel negatif puitis menyatakan penyangkalan yang terus berlaku. 'Tidak akan pernah' menyampaikan daya ungkap itu secara alami.
- source_word: יִמּוֹט
  choice: goyah
  rationale: Bentuk Nifal dari מוט menggambarkan keadaan terguncang, bergeser, atau kehilangan kestabilan. 'Goyah' mempertahankan metafora kestabilan tanpa memperkuatnya menjadi 'ditumbangkan'.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Adjektiva jamak substantival ini menunjuk kepada golongan orang yang jahat secara moral. 'Orang-orang fasik' ringkas, lazim dalam ragam Alkitab Indonesia, dan mempertahankan bentuk jamaknya.
- source_word: יִשְׁכְּנוּ
  choice: akan mendiami
  rationale: Kata kerja שכן berarti tinggal, menetap, atau berdiam. 'Mendiami' menonjolkan kediaman yang menetap dan cocok dengan objek wilayah.
- source_word: אָרֶץ
  choice: negeri
  rationale: Kata אֶרֶץ dapat menunjuk kepada suatu negeri atau kepada bumi secara lebih luas. 'Negeri' sesuai dengan gambaran mendiami wilayah dan tetap membuka kemungkinan gema tanah perjanjian; alternatif yang lebih luas dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan makna אָרֶץ
  choice: negeri
  alternative: bumi
  rationale: Amsal ini membandingkan kestabilan orang benar dengan tidak adanya tempat tinggal menetap bagi orang fasik. 'Negeri' mempertahankan kemungkinan gema wilayah atau tanah perjanjian, sedangkan 'bumi' tetap mungkin bila pernyataan ini dipahami secara universal. Ambiguitas tersebut dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat khas amsal. Struktur antitesis dipertahankan, dan ungkapan idiomatis 'tidak akan pernah goyah' dipakai agar gabungan negasi Ibrani terdengar alami.
