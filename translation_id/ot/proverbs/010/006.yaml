id: PRO.10.6
reference: Proverbs 10:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּ֭רָכוֹת לְ/רֹ֣אשׁ צַדִּ֑יק וּ/פִ֥י רְ֝שָׁעִ֗ים יְכַסֶּ֥ה חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/006.yaml
  text: Blessings are on the head of the righteous, but the mouth of the wicked covers violence.
translation:
  language: id
  text: 'Berkat ada di atas kepala orang benar,

    tetapi mulut orang fasik menutupi kekerasan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini dapat berarti bahwa perkataan orang fasik menyembunyikan kekerasan. Sebagian orang memahami susunannya sebagai “kekerasan menutupi mulut orang fasik.”
    reason: Menjelaskan ungkapan Ibrani yang padat dan ambigu tanpa menghilangkan ketegangannya dari teks utama.
lexical_decisions:
- source_word: בְּרָכוֹת
  choice: Berkat
  rationale: Bentuk jamak Ibrani menyatakan berkat-berkat atau kelimpahan berkat; bahasa Indonesia lazim memakai nomina kolektif "berkat".
- source_word: לְרֹאשׁ
  choice: di atas kepala
  rationale: Mempertahankan citra konkret Ibrani tentang berkat yang datang atau berdiam di atas kepala seseorang.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Padanan umum dan bermartabat bagi pribadi yang hidup benar atau adil.
- source_word: רְשָׁעִים
  choice: orang fasik
  rationale: Menunjukkan orang-orang yang bersalah secara moral, bukan sekadar orang yang kurang bijaksana.
- source_word: יְכַסֶּה
  choice: menutupi
  rationale: Mempertahankan arti dasar verba "menutupi" serta ambiguitas hubungan antara mulut orang fasik dan kekerasan.
- source_word: חָמָס
  choice: kekerasan
  rationale: Dalam konteks ini menunjuk pada kekerasan atau kelaliman yang merusak; "kekerasan" paling langsung.
theological_decisions:
- issue: Ambiguitas frasa "mulut orang fasik menutupi kekerasan"
  choice: Mempertahankan susunan bahwa mulut menjadi subjek yang menutupi kekerasan
  alternative: '"kekerasan menutupi mulut orang fasik" atau "mulut orang fasik menyembunyikan kekerasan"'
  rationale: Teks konsonantal dan vokalisasi Masoret mendukung mulut sebagai subjek, tetapi ungkapan itu tetap sukar dan dapat menyiratkan penyembunyian atau peliputan oleh kekerasan. Terjemahan utama tidak memaksakan satu tafsir.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan puitis sesuai bentuk amsal. Paralelisme antarklausa dipertahankan; "orang fasik" dipilih sebagai istilah yang bermartabat dan mudah dikenali dalam register Alkitab.
