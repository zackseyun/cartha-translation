source:
  edition: WLC
  text: יִרְאַ֣ת יְ֭הוָה תּוֹסִ֣יף יָמִ֑ים וּ/שְׁנ֖וֹת רְשָׁעִ֣ים תִּקְצֹֽרְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/027.yaml
  text: The fear of Yahweh adds days[a], but the years of the wicked will be cut short.
translation:
  language: id
  text: Takut akan Yahweh memperpanjang umur[a], tetapi tahun-tahun orang fasik akan diperpendek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “menambah hari-hari.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: Takut akan
  rationale: Bentuk konstruk יִרְאָה dengan nama ilahi menunjuk pada rasa takut yang penuh hormat dan ketaatan. Ungkapan “takut akan” mempertahankan idiom serta bobot teologis Ibrani tanpa mereduksinya menjadi sekadar rasa hormat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga identitasnya sebagai nama pribadi Allah Israel tetap tampak.
- source_word: תּוֹסִיף יָמִים
  choice: memperpanjang umur
  rationale: Secara harfiah berarti “menambah hari-hari”. Dalam bahasa Indonesia, “memperpanjang umur” menyampaikan makna idiomatisnya dengan alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וּ/שְׁנוֹת
  choice: tetapi tahun-tahun
  rationale: Waw secara bentuk berarti “dan”, tetapi paralelisme antitetis memberi hubungan pertentangan; “tetapi” mengungkapkannya secara wajar dalam bahasa Indonesia.
- source_word: רְשָׁעִים
  choice: orang fasik
  rationale: Istilah baku dalam sastra hikmat untuk orang yang jahat secara moral dan menentang tatanan benar Allah; bentuk ini menjaga nuansa etis-religiusnya.
- source_word: תִּקְצֹרְנָה
  choice: akan diperpendek
  rationale: Bentuk feminin jamak ini sesuai dengan “tahun-tahun” dan menyatakan bahwa tahun-tahun tersebut menjadi pendek. “Akan diperpendek” mempertahankan kesejajaran dengan klausa pertama tanpa menambahkan pelaku yang tidak disebutkan.
theological_decisions:
- issue: Sifat pernyataan tentang panjang umur
  choice: Diterjemahkan sebagai pernyataan hikmat yang lugas tanpa menambahkan penanda bahwa ini merupakan jaminan mutlak.
  alternative: Menafsirkannya secara eksplisit sebagai janji tanpa pengecualian bahwa setiap orang yang takut akan Allah pasti panjang umur dan setiap orang fasik pasti mati muda.
  rationale: 'Amsal menyatakan pola moral umum: takut akan Yahweh mengarah pada umur panjang, sedangkan kefasikan mengarah pada umur yang lebih pendek. Terjemahan mempertahankan ketegasan teks sekaligus tidak memasukkan doktrin mekanistis atau tanpa pengecualian.'
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Memperpanjang umur” dipilih sebagai ungkapan alami bagi תּוֹסִיף יָמִים, sementara bentuk konkret bahasa Ibrani dipertahankan dalam catatan kaki. Paralelisme antara “umur” dan “tahun-tahun” tetap jelas.
