source:
  edition: WLC
  text: מְק֣וֹר חַ֭יִּים פִּ֣י צַדִּ֑יק וּ/פִ֥י רְ֝שָׁעִ֗ים יְכַסֶּ֥ה חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/011.yaml
  text: The mouth of the righteous is a fountain of life[a], but the mouth of the wicked conceals violence.
translation:
  language: id
  text: Mulut orang benar adalah mata air kehidupan, tetapi mulut orang fasik menyembunyikan kekerasan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menutupi kekerasan.” Kata kerja Ibrani dapat berarti menutupi secara fisik atau menyembunyikan secara kiasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹר
  choice: mata air
  rationale: Kata ini menunjuk pada sumber air yang mengalir. “Mata air” mempertahankan gambaran konkret tentang ucapan yang memberi kehidupan dan lebih alami dalam bahasa Indonesia daripada “sumber air kehidupan”.
- source_word: חַיִּים
  choice: kehidupan
  rationale: Bentuk jamak Ibrani ini lazim dipakai dengan makna abstrak tunggal, yaitu “kehidupan”.
- source_word: פִּי צַדִּיק
  choice: mulut orang benar
  rationale: Terjemahan ini mempertahankan gambaran konkret “mulut” dan memahami bentuk tunggal “orang benar” sebagai pernyataan umum, tanpa membatasi jenis kelamin.
- source_word: וּפִי רְשָׁעִים
  choice: tetapi mulut orang fasik
  rationale: Kata penghubung secara bentuk berarti “dan”, tetapi paralelisme antitesis mendukung “tetapi”. Nomina “orang fasik” berbentuk jamak dalam bahasa Ibrani, sedangkan “mulut” berbentuk tunggal dan berfungsi secara kolektif; bahasa Indonesia dapat menyatakannya secara alami sebagai “mulut orang fasik”.
- source_word: יְכַסֶּה
  choice: menyembunyikan
  rationale: Kata kerja ini secara dasar berarti “menutupi” dan juga dapat berarti menyembunyikan. Dalam konteks ini, “menyembunyikan” menyampaikan bahwa ucapan orang fasik menutupi atau menyamarkan kekerasan, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: חָמָס
  choice: kekerasan
  rationale: Kata ini mencakup kekerasan, kebrutalan, dan perbuatan zalim. “Kekerasan” merupakan padanan ringkas yang sesuai dengan pertentangan moral dalam amsal ini.
theological_decisions:
- issue: Hubungan mulut orang fasik dengan kekerasan
  choice: Mulut orang fasik dipahami sebagai subjek yang menyembunyikan kekerasan.
  alternative: Ungkapan dapat dipertahankan secara lebih harfiah sebagai “menutupi kekerasan”.
  rationale: Urutan dan tata bahasa klausa ini menjadikan “mulut orang fasik” subjek dari kata kerja. Terjemahan tidak menentukan apakah kekerasan itu niat, tindakan, atau akibat ucapan mereka; ketegangan tersebut dibiarkan terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hikmat. “Mata air kehidupan” mempertahankan metafora sumber air yang memberi hidup; “orang benar” dan “orang fasik” memakai istilah moral yang umum dan ringkas.
