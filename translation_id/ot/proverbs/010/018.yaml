  text: Lying lips conceal hatred[b][a], and whoever spreads slander is a fool.
translation:
  language: id
  text: Orang yang menyembunyikan kebencian memiliki bibir dusta[a], dan orang yang menyebarkan fitnah[b] adalah orang bebal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bibir dusta menyembunyikan kebencian.” Susunan bahasa Ibrani memungkinkan “bibir dusta” dipahami sebagai subjek kalimat.
    reason: syntactic_alternative
  - marker: b
    text: Atau, “mengedarkan laporan buruk.” Ungkapan Ibrani ini dapat menunjuk lebih luas pada penyebaran laporan yang merugikan, bukan hanya fitnah dalam arti sempit.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַסֶּה
  choice: yang menyembunyikan
  rationale: Partisipel dari כסה berarti menutupi atau menyembunyikan. Bentuk ini secara wajar menyatakan orang yang menyimpan kebencian agar tidak terlihat.
- source_word: שִׂנְאָה
  choice: kebencian
  rationale: Nomina ini berarti kebencian atau permusuhan; “kebencian” merupakan padanan abstrak yang langsung dan alami dalam bahasa Indonesia.
- source_word: שִׂפְתֵי שָׁקֶר
  choice: berbibir dusta
  rationale: Secara harfiah frasa konstruksi ini berarti “bibir-bibir kedustaan.” “Berbibir dusta” mempertahankan citra bibir sebagai alat ucapan palsu serta cocok dengan pembacaan bahwa orang yang menyembunyikan kebencian mempunyai tutur dusta.
- source_word: וּמוֹצִא
  choice: dan orang yang menyebarkan
  rationale: Partisipel Hifil dari יצא secara harfiah berarti “membawa keluar.” Bersama דבה, bentuk ini menunjuk pada mengeluarkan lalu mengedarkan suatu laporan; “menyebarkan” mengungkapkan fungsi idiomatis tersebut.
- source_word: דִבָּה
  choice: fitnah
  rationale: Kata ini menunjuk pada laporan buruk atau merugikan, sering kali bernuansa mencemarkan nama. “Fitnah” menangkap daya moral ungkapan itu, sedangkan cakupan “laporan buruk” yang lebih luas dicatat dalam catatan kaki.
- source_word: הוּא כְסִיל
  choice: adalah orang bebal
  rationale: כְּסִיל adalah istilah khas sastra hikmat bagi orang yang tumpul secara moral, bukan sekadar kurang cerdas. “Orang bebal” mempertahankan kategori moral itu dan sesuai dengan ragam Amsal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada hikmat. “Berbibir dusta” sengaja mempertahankan metafora Ibrani, sedangkan “orang bebal” menjaga bobot moral istilah khas Amsal. Penanda catatan kaki ditempatkan langsung setelah ungkapan yang dijelaskan.
