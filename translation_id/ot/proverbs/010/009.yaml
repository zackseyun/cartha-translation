  text: Whoever walks in integrity walks securely[a], but he who makes his ways crooked will be found out.
translation:
  language: id
  text: Siapa yang berjalan dengan integritas berjalan dengan aman, tetapi siapa yang membengkokkan jalan-jalannya akan diketahui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan dikenal” atau “akan terbongkar.” Bahasa Ibrani dapat berarti bahwa orang yang membengkokkan jalan-jalannya akan dikenali sebagaimana adanya, atau bahwa perbuatannya akan tersingkap.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: Siapa yang berjalan
  rationale: Partisipel ini bersifat umum dan proverbial, bukan menunjuk kepada seorang laki-laki tertentu. Pilihan ini mempertahankan kiasan berjalan sebagai cara hidup.
- source_word: בַּתֹּם
  choice: dengan integritas
  rationale: תֹּם menyatakan keutuhan, ketulusan, dan kelurusan watak. 'Integritas' menyampaikan mutu moral itu secara alami tanpa memberi kesan kesempurnaan mutlak.
- source_word: יֵלֶךְ
  choice: berjalan
  rationale: Pengulangan 'berjalan' mempertahankan permainan kata dan kiasan yang terdapat dalam bahasa Ibrani.
- source_word: בֶּטַח
  choice: dengan aman
  rationale: בֶּטַח menunjuk pada keamanan atau keselamatan, bukan terutama perasaan percaya diri. Bentuk ini alami dalam bahasa Indonesia.
- source_word: וּמְעַקֵּשׁ
  choice: tetapi siapa yang membengkokkan
  rationale: Bentuk dari עקשׁ menyatakan tindakan membuat bengkok, memutarbalikkan, atau menyimpangkan. 'Membengkokkan' mempertahankan citra jalan yang berlawanan dengan berjalan dalam integritas.
- source_word: דְּרָכָיו
  choice: jalan-jalannya
  rationale: Bentuk jamak dan kiasan jalan sebagai perilaku hidup dipertahankan secara langsung.
- source_word: יִוָּדֵעַ
  choice: akan ketahuan
  rationale: Bentuk Nifal dari ידע dapat berarti dikenal, menjadi diketahui, atau terbongkar. 'Akan ketahuan' menyampaikan akibat bahwa orang yang membengkokkan jalannya tidak akan tetap tersembunyi, sambil mencatat keluasan maknanya dalam catatan kaki.
