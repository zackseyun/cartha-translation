  text: The one who turns away in heart will be filled with his own ways[b][a], and a good man with what comes from himself.
translation:
  language: id
  text: Orang yang hatinya menyimpang akan dipuaskan oleh perilakunya sendiri, dan orang baik oleh apa yang berasal dari dirinya sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baris kedua dalam bahasa Ibrani sulit dan eliptis. Dapat juga diterjemahkan, “Orang yang hatinya menyimpang akan dipuaskan dari jalan-jalannya sendiri, dan orang baik dari perbuatannya sendiri.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִדְּרָכָיו
  choice: oleh jalan-jalannya sendiri
  rationale: 'Preposisi מִן menandai sumber: orang itu menuai kepuasan atau akibat yang berasal dari perilakunya. Ungkapan ini mempertahankan metafora ''jalan'' tanpa menambahkan kata ''buah'' yang tidak tersurat.'
- source_word: יִשְׂבַּע
  choice: akan dipuaskan
  rationale: Kata kerja ini berarti menjadi kenyang, penuh, atau puas. Bentuk pasif ini dapat dipahami pada kedua bagian ayat dan mempertahankan gambaran bahwa perilaku seseorang menghasilkan balasan baginya.
- source_word: סוּג לֵב
  choice: orang yang hatinya menyimpang
  rationale: סוּג menyatakan tindakan berbalik atau menjauh, sedangkan לֵב menunjuk pusat batin dan orientasi moral. Pilihan ini alami dalam bahasa Indonesia dan tidak memasukkan istilah teologis yang lebih khusus seperti 'murtad'.
- source_word: וּמֵעָלָיו
  choice: dan orang baik oleh apa yang berasal dari dirinya sendiri
  rationale: Frasa Ibrani ini sulit dan eliptis. Dalam kesejajaran dengan מִדְּרָכָיו, frasa tersebut paling mungkin menunjukkan sumber yang berkaitan dengan orang baik itu sendiri, yakni apa yang timbul dari perilaku atau karakternya.
- source_word: אִישׁ טוֹב
  choice: orang baik
  rationale: אִישׁ secara gramatikal maskulin, tetapi dalam pepatah ini berfungsi representatif. 'Orang baik' terdengar alami, tetap setia pada makna, dan tidak membatasi penerapannya hanya kepada laki-laki.
theological_decisions:
- issue: Hubungan antara perilaku dan balasan
  choice: Mempertahankan gambaran bahwa masing-masing orang dipuaskan oleh apa yang bersumber dari jalan atau dirinya sendiri.
  alternative: Menjelaskan secara eksplisit sebagai ganjaran ilahi atas perbuatan.
  rationale: Teks menyatakan akibat moral secara proverbial, tetapi tidak secara eksplisit menyebut pelaku pemberi balasan. Terjemahan tidak boleh menambahkan mekanisme teologis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk pepatah dan kesejajaran kedua baris dipertahankan sejauh mungkin; ketidakjelasan asli pada וּמֵעָלָיו dijelaskan dalam catatan kaki tanpa dipaksakan menjadi tafsiran yang terlalu spesifik.
