  text: One who is slow to anger has great understanding[a], but one who is quick-tempered exalts folly.
translation:
  language: id
  text: Orang yang lambat menjadi marah memiliki pengertian yang besar, tetapi orang yang cepat marah[a] meninggikan kebodohan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pendek roh”; maksudnya, tidak sabar atau lekas marah.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶךְ אַפַּיִם
  choice: lambat marah
  rationale: Ungkapan Ibrani yang secara harfiah berarti ‘panjang hidung’ menyatakan kesabaran atau kelambatan untuk menjadi marah. ‘Lambat marah’ menyampaikan maknanya dengan jelas sambil mempertahankan kontras dengan קְצַר רוּחַ.
- source_word: רַב תְּבוּנָה
  choice: sangat berpengertian
  rationale: רַב menyatakan kelimpahan atau kebesaran, sedangkan תְּבוּנָה berarti pengertian, pemahaman, atau daya membedakan. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan penekanan pada besarnya pengertian.
- source_word: קְצַר רוּחַ
  choice: pendek kesabarannya
  rationale: Ungkapan ini secara harfiah berarti ‘pendek roh’ dan menggambarkan orang yang tidak sabar atau lekas marah. ‘Pendek kesabarannya’ mempertahankan sebagian citra kependekan sekaligus dapat dipahami pembaca modern; arti harfiahnya dijelaskan dalam catatan kaki.
- source_word: מֵרִים
  choice: meninggikan
  rationale: Bentuk Hifil dari רום berarti mengangkat atau meninggikan. ‘Meninggikan’ mempertahankan metafora Ibrani tanpa membatasi maknanya hanya pada ‘memamerkan’ atau ‘menampakkan’.
- source_word: אִוֶּלֶת
  choice: kebodohan
  rationale: Dalam Amsal, kata ini menunjuk pada kebodohan sebagai kegagalan moral sekaligus intelektual. ‘Kebodohan’ merupakan padanan Indonesia yang jelas dan lazim.
