    rationale: רַב תְּבוּנָה menyatakan bahwa seseorang memiliki banyak atau besar pemahaman. “Memiliki pengertian yang besar” mengekspresikan predikasi ini dengan lebih jelas.
  - severity: medium
    issue: “Pendek kesabarannya” tidak merupakan ungkapan Indonesia baku yang alami untuk orang yang tidak sabar atau lekas marah.
    rationale: קְצַר רוּחַ secara idiomatis menunjuk kepada orang yang cepat marah/tidak sabar. Padanan utama yang idiomatis perlu dipakai, sedangkan bentuk harfiah dijelaskan dalam catatan kaki.
