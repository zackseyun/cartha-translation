  text: יֵ֤שׁ דֶּ֣רֶךְ יָ֭שָׁר לִ/פְנֵי אִ֑ישׁ וְ֝/אַחֲרִיתָ֗/הּ דַּרְכֵי מָֽוֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/012.yaml
  text: There is a way that seems right to a man[a], but its end is the ways of death.
translation:
  language: id
  text: Ada jalan yang tampak benar bagi seseorang,[a] tetapi kesudahannya ialah jalan-jalan maut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “lurus di hadapan seseorang”; ungkapan Ibrani ini berarti bahwa jalan itu tampak benar menurut pandangannya sendiri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Ada
  rationale: Partikel eksistensial ini memperkenalkan suatu kebenaran umum; “Ada” alami dan ringkas dalam peribahasa Indonesia.
- source_word: דֶּרֶךְ
  choice: jalan
  rationale: Kata ini dapat menunjuk jalan secara harfiah sekaligus kiasan bagi arah hidup atau perilaku.
- source_word: יָשָׁר
  choice: benar
  rationale: Dalam konteks ini maknanya adalah penilaian bahwa suatu jalan tepat, bukan sekadar lurus secara fisik.
- source_word: לִפְנֵי אִישׁ
  choice: tampak ... bagi seseorang
  rationale: Secara harfiah berarti “di hadapan seseorang,” tetapi idiom ini menyatakan apa yang tampak benar menurut pandangannya sendiri. “Seseorang” mempertahankan fungsi generik אִישׁ secara alami dalam bahasa Indonesia.
- source_word: וְאַחֲרִיתָהּ
  choice: tetapi pada akhirnya jalan itu
  rationale: Konjungsi menyatakan kontras, sedangkan אַחֲרִית menunjuk akhir atau kesudahan. Penyebutan ulang “jalan itu” memperjelas rujukan pronomina feminin Ibrani secara alami.
- source_word: דַּרְכֵי
  choice: jalan-jalan
  rationale: Bentuk jamak dipertahankan dan sekaligus menjaga pengulangan leksikal dengan דֶּרֶךְ pada bagian pertama.
- source_word: מָוֶת
  choice: maut
  rationale: “Maut” menyampaikan kematian dengan nada ringkas, kuat, dan sesuai dengan ragam sastra hikmat.
theological_decisions:
- issue: Fungsi generik אִישׁ
  choice: seseorang
  alternative: seorang laki-laki; manusia
  rationale: אִישׁ berbentuk maskulin tunggal tetapi di sini berfungsi representatif dan umum. Bahasa Indonesia tidak memerlukan penandaan gender untuk mempertahankan fungsi tersebut.
- issue: Cakupan makna מָוֶת
  choice: maut
  alternative: kematian; kebinasaan
  rationale: Terjemahan mempertahankan istilah kematian tanpa membatasinya hanya pada kematian jasmani atau memperluasnya menjadi kebinasaan secara interpretatif.
- issue: Bentuk jamak דַּרְכֵי
  choice: jalan-jalan maut
  alternative: jalan menuju maut
  rationale: Bentuk jamak Ibrani dipertahankan agar kejanggalan dan daya tekan ungkapan sumber tidak dihapus, tanpa menetapkan apakah jamak itu bersifat intensif atau merujuk pada beragam kesudahan yang mematikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Struktur antitesis peribahasa dipertahankan; ungkapan idiomatis diterjemahkan secara alami, sedangkan bentuk jamak “jalan-jalan maut” sengaja dipertahankan untuk mencerminkan teks Ibrani.
