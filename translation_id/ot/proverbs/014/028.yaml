  text: In a multitude of people is a king’s splendor[a], but without people, a ruler’s ruin.
translation:
  language: id
  text: Banyaknya rakyat adalah kemegahan seorang raja, tetapi tanpa rakyat, kehancuran seorang penguasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kengerian” atau “kegentaran.” Kata Ibrani ini dapat menunjuk pada ketakutan atau pada kehancuran yang dialami seorang penguasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָב עָם
  choice: Banyaknya rakyat
  rationale: Frasa ini menyatakan keadaan berupa jumlah penduduk yang besar. “Rakyat” mempertahankan cakupan kolektif-politis tanpa menyiratkan negara-bangsa modern.
- source_word: הַדְרַת
  choice: kemegahan
  rationale: Kata ini dapat menunjuk pada semarak, kehormatan, atau keagungan. “Kemegahan” alami dalam konteks kerajaan dan cocok dengan jumlah rakyat sebagai hal yang mengangkat kedudukan raja.
- source_word: מֶלֶךְ
  choice: seorang raja
  rationale: Bentuk konstruksi menyatakan bahwa kemegahan itu berkaitan dengan atau menjadi milik raja; susunan dengan “seorang” terdengar alami sebagai pernyataan umum.
- source_word: וּבְאֶפֶס לְאֹם
  choice: tetapi tanpa rakyat
  rationale: אֶפֶס menyatakan ketiadaan, sedangkan לְאֹם menunjuk pada suatu kaum atau populasi. Pengulangan “rakyat” memperjelas antitesis dan menghindari kesan negara-bangsa formal.
- source_word: מְחִתַּת
  choice: runtuh
  rationale: Nomina ini dapat menyatakan kedahsyatan, kengerian, kehancuran, atau keruntuhan. Bentuk predikatif “runtuh” menghasilkan bahasa Indonesia yang ringkas dan memperlihatkan lawan dari kemegahan.
- source_word: רָזוֹן
  choice: seorang penguasa
  rationale: Istilah ini menunjuk kepada orang yang memegang kuasa, seperti penguasa atau pembesar. “Penguasa” cukup luas dan tidak memaksakan perbedaan khusus dari “raja” pada baris pertama.
