  text: בָּז לְ/רֵעֵ֥/הוּ חוֹטֵ֑א וּ/מְחוֹנֵ֖ן עניים אַשְׁרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/021.yaml
  text: Whoever despises his neighbor sins[a], but blessed is he who is gracious to the poor.
translation:
  language: id
  text: Siapa yang menghina sesamanya berbuat dosa, tetapi berbahagialah orang yang bermurah hati kepada orang miskin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini menyatakan keadaan sejahtera atau diberkati, bukan sekadar perasaan senang. Dapat juga diterjemahkan, “diberkatilah dia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז
  choice: menghina
  rationale: Partisipel ini menggambarkan sikap memperlakukan seseorang dengan hina atau memandangnya rendah; “menghina” ringkas, alami, dan mempertahankan daya moral ungkapan Ibrani.
- source_word: לְרֵעֵהוּ
  choice: sesamanya
  rationale: רֵעַ menunjuk kepada orang lain dalam lingkup relasi sosial. “Sesamanya” alami dalam bahasa Indonesia dan mencakup makna tetangga, rekan, atau orang dekat tanpa mempersempitnya pada penghuni yang tinggal berdekatan.
- source_word: חוֹטֵא
  choice: berbuat dosa
  rationale: Partisipel ini berfungsi sebagai predikat dan menyatakan kategori moral-teologis secara eksplisit. “Berbuat dosa” lebih alami daripada “berdosa” dalam susunan kalimat ini dan tidak melemahkannya menjadi sekadar berbuat salah.
- source_word: וּמְחוֹנֵן
  choice: bermurah hati kepada
  rationale: Bentuk dari חנן berarti menunjukkan kemurahan atau kebaikan hati. “Bermurah hati kepada” menyampaikan tindakan memberi kebaikan secara nyata tanpa menggeser makna terutama ke rasa iba.
- source_word: עניים
  choice: orang miskin
  rationale: Dalam kontras etis ayat ini, istilah tersebut terutama menunjuk kepada orang yang miskin atau rentan secara sosial-ekonomi. Bentuk kolektif diterjemahkan secara alami sebagai “orang miskin”.
- source_word: אַשְׁרָיו
  choice: berbahagialah orang
  rationale: Ungkapan hikmat ini menyatakan keadaan sejahtera, mujur, atau diberkati, bukan sekadar emosi sesaat. “Berbahagialah orang” merupakan formula hikmat yang wajar dan bermartabat dalam bahasa Indonesia; rujukan maskulin tunggal Ibrani dipahami secara representatif.
theological_decisions:
- issue: Makna formula hikmat אַשְׁרָיו
  choice: berbahagialah orang
  alternative: diberkatilah dia
  rationale: “Berbahagialah” mempertahankan pernyataan tentang keadaan hidup yang baik dan patut disebut mujur tanpa secara eksplisit menambahkan pelaku ilahi yang tidak disebutkan dalam teks Ibrani. Catatan kaki menjelaskan bahwa maknanya lebih luas daripada perasaan senang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hikmat. Struktur antitesis dipertahankan dengan “tetapi”. “Sesamanya” dipilih agar cakupan רֵעַ tidak dipersempit menjadi tetangga tempat tinggal, sedangkan “orang miskin” mempertahankan fokus konkret pada kelompok rentan.
