  text: Will not those who devise evil go astray? But steadfast love and faithfulness belong to those who devise good[a].
translation:
  language: id
  text: Bukankah orang yang merancang kejahatan akan tersesat? Namun, kasih setia dan kesetiaan ada bagi orang yang merancang kebaikan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebaikan dan kebenaran,” atau “belas kasih dan kesetiaan.” Pasangan kata Ibrani ini sering menunjuk pada kasih yang setia bersama keterandalan atau kebenaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: Bukankah
  rationale: Menandai pertanyaan retoris yang mengharapkan jawaban ya, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: יִתְעוּ
  choice: akan tersesat
  rationale: Mempertahankan gambaran menyimpang dari jalan yang benar dan nuansa moral khas sastra hikmat.
- source_word: חֹרְשֵׁי רָע
  choice: orang yang merancang kejahatan
  rationale: Bentuk partisip dari חרשׁ menunjukkan tindakan merencanakan atau mereka-reka dengan sengaja, bukan sekadar melakukan kejahatan.
- source_word: רָע
  choice: kejahatan
  rationale: Menjaga pertentangan etis dengan טוֹב secara jelas dan ringkas.
- source_word: חֶסֶד
  choice: kasih setia
  rationale: Ungkapan ini mencakup kasih, kebaikan, dan loyalitas yang teguh, lebih luas daripada sekadar 'kebaikan hati'.
- source_word: אֱמֶת
  choice: kesetiaan
  rationale: Dalam pasangan חֶסֶד וֶאֱמֶת, kata ini lazim mengandung arti keterandalan atau kesetiaan, meskipun secara leksikal juga dapat berarti kebenaran.
- source_word: חֹרְשֵׁי טוֹב
  choice: orang yang merancang kebaikan
  rationale: Pengulangan 'merancang' mencerminkan verba Ibrani yang sama dan mempertahankan kesejajaran dengan orang yang merancang kejahatan.
- source_word: טוֹב
  choice: kebaikan
  rationale: Nomina abstrak ini alami dalam bahasa Indonesia dan mempertahankan kontras moral dengan 'kejahatan'.
theological_decisions:
- issue: Predikat yang tidak dinyatakan sesudah 'kasih setia dan kesetiaan'
  choice: ada pada orang yang merancang kebaikan
  alternative: menyertai orang yang merancang kebaikan; menjadi milik orang yang merancang kebaikan
  rationale: Teks Ibrani tidak menyertakan verba. 'Ada pada' menghasilkan kalimat Indonesia yang wajar tanpa memastikan secara berlebihan apakah sifat-sifat itu dimiliki, ditunjukkan oleh, atau dialami oleh orang yang merancang kebaikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Struktur antitesis serta pertanyaan retoris dipertahankan; pengulangan 'merancang' menampilkan kesejajaran puitis sumber.
