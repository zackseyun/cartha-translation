  yaml_path: translation/ot/proverbs/014/013.yaml
  text: Even in laughter the heart may ache[b][a], and the end of joy is grief.
translation:
  language: id
  text: Bahkan di tengah tawa hati dapat terasa pedih[a], dan akhir sukacita adalah dukacita[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bahkan di tengah tawa hati terasa pedih.” Bentuk imperfek Ibrani dapat menyatakan keadaan umum dalam bahasa pepatah.
    reason: lexical_alternative
  - marker: b
    text: Atau, “hasil akhir sukacita adalah dukacita” atau “sesudah sukacita datanglah dukacita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Bahkan
  rationale: 'Menyampaikan daya konsesif dan penekanan: rasa pedih dapat hadir sekalipun ada tawa.'
- source_word: בִּשְׂחוֹק
  choice: di tengah tawa
  rationale: Mempertahankan gambaran konkret tentang tawa sekaligus menghasilkan ungkapan Indonesia yang alami untuk keadaan yang menyertai.
- source_word: יִכְאַב
  choice: dapat terasa pedih
  rationale: Bentuk imperfek dalam pepatah dapat menyatakan kebenaran umum atau kemungkinan; 'dapat' mempertahankan keluwesan itu, sedangkan 'terasa pedih' alami dengan subjek hati.
- source_word: לֵב
  choice: hati
  rationale: Padanan baku dan jelas bagi pusat batin serta perasaan dalam sastra hikmat.
- source_word: וְאַחֲרִיתָהּ
  choice: dan akhir
  rationale: Mempertahankan gagasan akhir atau hasil terakhir; sufiks feminin dipahami merujuk pada sukacita.
- source_word: שִׂמְחָה
  choice: sukacita
  rationale: Padanan modern dan bermartabat yang menyatakan kegembiraan mendalam serta membentuk kontras yang jelas dengan dukacita.
- source_word: תוּגָה
  choice: dukacita
  rationale: Menyampaikan kesedihan berat dan mempertahankan kesejajaran bunyi serta makna dengan 'sukacita'.
