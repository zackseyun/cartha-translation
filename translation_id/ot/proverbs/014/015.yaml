  yaml_path: translation/ot/proverbs/014/015.yaml
  text: A simple man believes every word[a], but a prudent man considers his steps.
translation:
  language: id
  text: Orang yang naif memercayai setiap perkataan,[a] tetapi orang yang cermat mempertimbangkan langkahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memercayai segala sesuatu” atau “memercayai setiap perkara.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּתִי
  choice: orang yang naif
  rationale: Dalam Amsal, kata ini menunjuk kepada orang yang belum berpengalaman dan mudah dipengaruhi, bukan semata-mata kurang cerdas. 'Orang yang naif' menyampaikan kategori hikmat ini secara alami dalam bahasa Indonesia modern.
- source_word: יַאֲמִין
  choice: percaya kepada
  rationale: Bentuk ini berarti menerima sesuatu sebagai benar atau dapat dipercaya. 'Percaya kepada' sesuai dengan objek berupa setiap perkataan yang didengar.
- source_word: לְכָל דָּבָר
  choice: setiap perkataan
  rationale: דָּבָר dapat berarti 'perkataan', 'hal', atau 'perkara'. 'Setiap perkataan' mempertahankan gambaran orang yang menerima tanpa menilai apa pun yang dikatakan kepadanya, sementara keluasan maknanya dicatat dalam catatan kaki.
- source_word: עָרוּם
  choice: orang yang bijaksana
  rationale: 'Dalam konteks hikmat Amsal, kata ini memiliki arti positif: cermat, arif, atau berhati-hati, bukan licik. ''Bijaksana'' membentuk kontras yang jelas dan wajar dengan orang yang naif.'
- source_word: יָבִין
  choice: memperhatikan
  rationale: Kata kerja ini menyatakan pengertian dan pertimbangan yang penuh daya membedakan. Dengan objek 'langkahnya', 'memperhatikan' mengungkapkan tindakan menimbang arah hidup dengan saksama.
- source_word: לַאֲשֻׁרוֹ
  choice: langkahnya
  rationale: Kata benda ini berarti langkah atau arah perjalanan dan secara kiasan menunjuk pada tindakan serta jalan hidup seseorang. 'Langkahnya' mempertahankan citra konkret teks Ibrani.
