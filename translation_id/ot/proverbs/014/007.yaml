  text: Go from the presence of a foolish man[a], for you do not perceive lips of knowledge.
translation:
  language: id
  text: Pergilah dari hadapan orang bebal, sebab engkau tidak akan menemukan ucapan yang mengandung pengetahuan darinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “... sebab engkau tidak mengenali ucapan yang mengandung pengetahuan.” Secara harfiah, “dan engkau tidak mengetahui bibir-bibir pengetahuan”; “bibir” di sini merupakan ungkapan untuk ucapan.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: לֵךְ
  choice: Pergilah
  rationale: Bentuk imperatif orang kedua tunggal ini menyampaikan nasihat langsung dan ringkas.
- source_word: מִנֶּגֶד
  choice: dari hadapan
  rationale: Ungkapan ini memiliki nuansa ruang, yaitu menjauh dari posisi di depan atau dalam kehadiran seseorang. Pilihan ini mempertahankan gambaran Ibrani sambil tetap wajar dalam bahasa Indonesia.
- source_word: לְאִישׁ כְּסִיל
  choice: orang bebal
  rationale: כְּסִיל adalah istilah khas sastra hikmat bagi orang yang menolak hikmat dan hidup tanpa pertimbangan moral. 'Orang bebal' lebih tepat daripada sekadar 'orang bodoh', yang dalam bahasa Indonesia dapat hanya menunjuk keterbatasan kecerdasan.
- source_word: וּבַל יָדַעְתָּ
  choice: sebab engkau tidak akan menemukan
  rationale: Partikel negatif puitis בַּל dan bentuk perfektum יָדַעְתָּ dapat dipahami sebagai alasan atau hasil umum dari perintah sebelumnya. Dalam konteks ini, 'tidak akan menemukan' menyampaikan bahwa perkataan berpengetahuan tidak didapati pada orang bebal, tanpa menjadikan bentuk Ibraninya lebih pasti daripada yang ada.
- source_word: שִׂפְתֵי דָעַת
  choice: perkataan yang berpengetahuan
  rationale: Secara harfiah ungkapan ini berarti 'bibir-bibir pengetahuan', dengan 'bibir' sebagai metonimia untuk ucapan. Mengalihkannya sebagai 'perkataan yang berpengetahuan' menyampaikan makna dengan alami dalam bahasa Indonesia.
