translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. 'Orang bebal' mempertahankan istilah moral-hikmat, sedangkan metafora 'bibir' dijelaskan dalam catatan kaki agar teks utama tetap alami. Penanda catatan kaki ditempatkan setelah keseluruhan kalimat karena catatan membahas klausa kedua dan hubungan sintaksisnya dengan klausa pertama.
