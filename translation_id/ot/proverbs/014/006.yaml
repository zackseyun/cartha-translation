id: PRO.14.6
reference: Proverbs 14:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בִּקֶּשׁ לֵ֣ץ חָכְמָ֣ה וָ/אָ֑יִן וְ/דַ֖עַת לְ/נָב֣וֹן נָקָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/006.yaml
  text: A scoffer seeks wisdom and there is none[b][a], but knowledge comes easily to one who has understanding.
translation:
  language: id
  text: Seorang pencemooh mencari hikmat, tetapi tidak mendapatkannya[a]; sedangkan pengetahuan mudah diperoleh orang yang berpengertian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dan tidak ada.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּקֶּשׁ
  choice: mencari
  rationale: Bentuk qatal dalam amsal menyatakan kebenaran umum; bentuk kini bahasa Indonesia tidak perlu ditandai secara khusus. 'Mencari' mempertahankan tindakan aktif untuk memperoleh hikmat.
- source_word: לֵץ
  choice: pencemooh
  rationale: Kata ini menunjuk kepada orang yang dengan angkuh mencemooh hikmat atau teguran. 'Pencemooh' alami dalam bahasa Indonesia modern dan mempertahankan bobot moralnya.
- source_word: חָכְמָה
  choice: hikmat
  rationale: '''Hikmat'' merupakan padanan baku dalam sastra Amsal dan mencakup kecakapan hidup yang berlandaskan pengertian moral, bukan sekadar kecerdasan.'
- source_word: וָאָיִן
  choice: tetapi tidak mendapatkannya
  rationale: Secara harfiah ungkapan Ibrani berbunyi 'dan tidak ada'. Dalam konteks tindakan mencari, terjemahan ini menyampaikan secara alami bahwa pencarian itu gagal, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וְדַעַת
  choice: pengetahuan
  rationale: Padanan ini membedakannya dari 'hikmat' pada klausa pertama dan menunjuk pada pengetahuan atau wawasan yang dipahami.
- source_word: לְנָבוֹן
  choice: orang yang berpengertian
  rationale: Bentuk maskulin tunggal Ibrani berfungsi secara pepatah untuk siapa pun yang bercirikan daya memahami. Bahasa Indonesia secara alami memakai 'orang' tanpa menghilangkan fungsi representatif tersebut.
- source_word: נָקָל
  choice: mudah diperoleh
  rationale: Kata ini menyatakan kemudahan atau kesiapan. 'Mudah diperoleh' membentuk kontras yang jelas dengan pencarian sia-sia si pencemooh dan tetap dekat dengan predikasi Ibrani.
theological_decisions:
- issue: Maskulin representatif dalam sastra hikmat
  choice: orang yang berpengertian
  alternative: laki-laki yang berpengertian
  rationale: נָבוֹן berbentuk maskulin tunggal secara gramatikal, tetapi di sini berfungsi sebagai gambaran umum tentang pribadi yang memiliki pengertian. Karena kata 'orang' dalam bahasa Indonesia tidak menandai gender dan menyampaikan fungsi pepatah itu dengan tepat, pilihan ini tidak mempersempit cakupan teks.
- issue: Hubungan antara pencemooh dan tidak adanya hikmat
  choice: tidak mendapatkannya
  alternative: tidak ada
  rationale: Teks tidak menjelaskan secara doktrinal mengapa pencemooh gagal. Terjemahan hanya menyatakan hasil pencariannya dan tidak menambahkan klaim bahwa hikmat pada hakikatnya mustahil tersedia baginya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada pepatah. Paralelisme antarklausa dipertahankan dengan kontras 'tetapi ...; sedangkan ...'. Istilah 'hikmat', 'pengetahuan', dan 'pengertian' dibedakan agar jaringan kosakata hikmat Ibrani tetap terlihat.
