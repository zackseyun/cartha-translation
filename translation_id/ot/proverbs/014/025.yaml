  yaml_path: translation/ot/proverbs/014/025.yaml
  text: A truthful witness rescues lives[c][b][a], but one who breathes out lies is deceitful.
translation:
  language: id
  text: Saksi yang jujur menyelamatkan nyawa[a], tetapi orang yang mengembuskan kebohongan[b] penuh tipu daya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Saksi yang benar melepaskan orang-orang.” Kata Ibrani yang diterjemahkan “nyawa” di sini berarti hidup atau pribadi manusia, bukan secara khusus jiwa yang tak berjasad.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mengembuskan kebohongan.” Ungkapan Ibrani ini memakai gambaran napas untuk tindakan mengucapkan dusta.
    reason: lexical_alternative
  - marker: c
    text: Bagian akhir ini dapat diterjemahkan lebih harfiah, “orang yang mengembuskan kebohongan adalah tipu daya,” atau dipahami sebagai keterangan cara, “mengembuskan kebohongan dengan penuh tipu daya.”
    reason: alternative_reading
lexical_decisions:
- source_word: מַצִּיל
  choice: menyelamatkan
  rationale: Bentuk partisip Hifil dari נצל menyatakan tindakan melepaskan atau menyelamatkan dari bahaya. “Menyelamatkan” alami dalam bahasa Indonesia dan cocok dengan peranan praktis seorang saksi.
- source_word: נְפָשׁוֹת
  choice: nyawa
  rationale: Dalam konteks ini נֶפֶשׁ menunjuk kepada hidup atau pribadi manusia, bukan secara khusus jiwa tak berjasad. “Nyawa” menonjolkan bahwa kesaksian yang benar dapat menghindarkan orang dari bahaya atau kematian.
- source_word: עֵד אֱמֶת
  choice: saksi yang jujur
  rationale: Frasa ini menunjuk kepada saksi yang bercirikan kebenaran. “Saksi yang jujur” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וְיָפִחַ
  choice: tetapi orang yang mengembuskan
  rationale: Kata פוח secara harfiah menggambarkan mengembuskan atau meniupkan sesuatu dan secara kiasan dipakai untuk mengucapkan perkataan. Citra Ibrani dipertahankan, sedangkan waw diterjemahkan “tetapi” karena hubungan antarkedua bagian bersifat kontras.
- source_word: כְּזָבִים
  choice: kebohongan
  rationale: Bentuk jamak ini menunjuk kepada pernyataan-pernyataan palsu. Dalam bahasa Indonesia, “kebohongan” dapat dipakai secara kolektif dan terdengar lebih alami daripada pengulangan bentuk jamak.
- source_word: מִרְמָה
  choice: penuh tipu daya
  rationale: Nomina ini muncul secara ringkas sebagai pelengkap bagian kedua. “Penuh tipu daya” menghasilkan predikat yang alami tanpa menghapus gagasan bahwa si saksi palsu dicirikan oleh penipuan.
