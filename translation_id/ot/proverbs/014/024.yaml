  text: עֲטֶ֣רֶת חֲכָמִ֣ים עָשְׁרָ֑/ם אִוֶּ֖לֶת כְּסִילִ֣ים אִוֶּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/024.yaml
  text: The crown of the wise is their wealth[a], but the folly of fools is folly.
translation:
  language: id
  text: Mahkota orang bijak adalah kekayaan mereka, tetapi kebodohan orang bebal adalah kebodohan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut sebagian versi kuno dan penafsir, “kekayaan orang bebal adalah kebodohan.” Teks Masoret secara harfiah berbunyi, “kebodohan orang bebal adalah kebodohan.”
    reason: alternative_reading
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: mahkota
  rationale: Kata ini menunjuk pada mahkota atau rangkaian bunga sebagai lambang kehormatan. “Mahkota” mempertahankan metafora tentang sesuatu yang menjadi kehormatan dan ciri nyata seseorang.
- source_word: חֲכָמִים
  choice: orang bijak
  rationale: Bentuk jamak ini menunjuk kepada orang-orang yang berhikmat secara umum. “Orang bijak” alami dalam bahasa Indonesia dan tidak membatasi rujukannya pada laki-laki.
- source_word: עָשְׁרָם
  choice: kekayaan mereka
  rationale: Nomina עֹשֶׁר berarti kekayaan atau kemakmuran, dengan akhiran orang ketiga jamak “mereka”. “Kekayaan mereka” menyampaikan bentuk dan maknanya secara langsung.
- source_word: אִוֶּלֶת
  choice: kebodohan
  rationale: Istilah ini menyatakan kebodohan sebagai sifat moral dan intelektual. “Kebodohan” jelas, wajar, dan memungkinkan pengulangan kata Ibrani tetap terlihat.
- source_word: כְּסִילִים
  choice: orang bebal
  rationale: Dalam sastra hikmat, kata ini menunjuk kepada orang yang tumpul secara moral dan intelektual, bukan sekadar kurang cerdas. “Orang bebal” mempertahankan nuansa tersebut dan membedakannya dari nomina abstrak “kebodohan”.
- source_word: אִוֶּלֶת כְּסִילִים אִוֶּלֶת
  choice: kebodohan orang bebal adalah kebodohan
  rationale: Teks Masoret mengulang אִוֶּלֶת sehingga menghasilkan pernyataan tautologis yang menegaskan bahwa ciri orang bebal tidak lain adalah kebodohan. Pengulangan sengaja dipertahankan tanpa diperhalus.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas dan bermartabat yang sesuai untuk amsal. Metafora “mahkota” serta pengulangan yang mencolok dalam Teks Masoret dipertahankan; “orang bebal” digunakan dalam arti khas sastra hikmat.
