  text: יִרְאַ֣ת יְ֭הוָה מְק֣וֹר חַיִּ֑ים לָ֝/ס֗וּר מִ/מֹּ֥קְשֵׁי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/027.yaml
  text: The fear of Yahweh is a fountain of life[b][a], to turn one away from the snares of death.
translation:
  language: id
  text: Takut akan Yahweh adalah sumber[a] kehidupan, yang membuat orang berpaling dari jerat-jerat maut.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mata air.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “untuk berpaling dari jerat-jerat maut.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: takut akan
  rationale: 'Mempertahankan ungkapan utama sastra hikmat Ibrani beserta ketegangannya: rasa gentar yang mencakup hormat dan sikap taat, tanpa mempersempitnya menjadi sekadar penghormatan.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: מְקוֹר
  choice: sumber
  rationale: Dalam konteks metaforis ini menunjuk pada mata air atau sumber yang memberi kehidupan; 'sumber kehidupan' alami dan bermartabat dalam bahasa Indonesia.
- source_word: חַיִּים
  choice: kehidupan
  rationale: Bentuk jamak Ibrani di sini berfungsi sebagai nomina abstrak dan wajar diterjemahkan dalam bentuk tunggal.
- source_word: לָסוּר
  choice: yang menjauhkan orang
  rationale: Menyampaikan daya tujuan/hasil dari infinitif berprefiks ל secara alami, sekaligus mempertahankan kemungkinan bahwa takut akan Yahweh berfungsi menjauhkan seseorang.
- source_word: מִמֹּקְשֵׁי
  choice: dari jerat-jerat
  rationale: Bentuk jamak dan metafora perangkap tersembunyi dipertahankan secara jelas.
- source_word: מָוֶת
  choice: maut
  rationale: '''Maut'' cocok dengan ragam sastra hikmat dan mempertahankan keluasan makna kematian maupun kebinasaan tanpa menjelaskannya secara berlebihan.'
theological_decisions:
- issue: Makna 'takut akan Yahweh' dalam sastra hikmat
  choice: Mempertahankan kata 'takut'.
  alternative: '''Hormat kepada Yahweh'' atau ''takzim kepada Yahweh''.'
  rationale: Ungkapan Ibrani mencakup kegentaran, rasa hormat, dan ketaatan. 'Takut' menjaga ketegangan teologis itu dan tidak melunakkannya secara interpretatif.
- issue: Daya infinitif לָסוּר
  choice: 'Merendernya sebagai klausa relatif hasil/fungsi: ''yang menjauhkan orang''.'
  alternative: '''untuk menjauh dari'' atau ''agar orang menjauh dari''.'
  rationale: Konstruksi Ibrani dapat menyatakan tujuan atau hasil. Teks utama dibuat alami tanpa menutup alternatif bahwa subjek tersiratnya adalah orang yang menjauh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernuansa sastra hikmat. 'Takut akan' dipilih sebagai ungkapan yang lazim dan teologis; 'maut' menjaga martabat puitis. Penanda catatan kaki [a] ditempatkan dalam teks utama.
