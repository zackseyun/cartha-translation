  text: חַיֵּ֣י בְ֭שָׂרִים לֵ֣ב מַרְפֵּ֑א וּ/רְקַ֖ב עֲצָמ֣וֹת קִנְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/030.yaml
  text: A tranquil heart is life to the body[b][a], but jealousy is rottenness to the bones.
translation:
  language: id
  text: Hati yang tenang[a] adalah kehidupan bagi tubuh, tetapi iri hati[b] adalah kebusukan bagi tulang-tulang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hati yang sehat” atau “hati yang membawa kesembuhan.” Kata Ibrani ini secara lebih harfiah berkaitan dengan kesembuhan atau kesehatan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “kecemburuan.” Kata Ibrani ini dapat berarti iri hati, kecemburuan, atau semangat yang menyala, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֵּי
  choice: kehidupan
  rationale: Bentuk jamak konstruktus dari חַיִּים dipakai secara idiomatis dengan arti ‘kehidupan’. Dalam pepatah tanpa verba ini, ‘adalah kehidupan’ menyampaikan fungsi predikatifnya secara wajar.
- source_word: בְשָׂרִים
  choice: tubuh
  rationale: Secara harfiah berarti ‘daging’, tetapi dalam konteks antropologis ini menunjuk pada tubuh jasmani secara keseluruhan. ‘Tubuh’ lebih alami dalam bahasa Indonesia dan menghindari kesan bahwa yang dimaksud hanya jaringan daging.
- source_word: לֵב
  choice: hati
  rationale: Mempertahankan metafora antropologis Ibrani bagi pusat batin, sikap, dan emosi; ‘hati’ juga lazim dan mudah dipahami dalam bahasa Indonesia.
- source_word: מַרְפֵּא
  choice: tenang
  rationale: Kata ini pada dasarnya berkaitan dengan kesembuhan, kesehatan, atau pemulihan. Dalam kaitannya dengan ‘hati’ dan kontras dengan iri hati, ‘tenang’ menyampaikan keadaan batin yang sehat dan menyejahterakan, sementara arti yang lebih harfiah dicatat dalam catatan kaki.
- source_word: וּרְקַב
  choice: tetapi ... adalah kebusukan
  rationale: Konjungsi ו dipahami secara adversatif karena kedua baris berlawanan. רֶקֶב berarti kebusukan atau pembusukan; bentuk nomina ‘kebusukan’ mempertahankan kesejajaran dengan ‘kehidupan’.
- source_word: עֲצָמוֹת
  choice: tulang-tulang
  rationale: Terjemahan konkret dipertahankan. Bentuk ulang menyatakan jamak secara alami dan menjaga gambaran kerangka jasmani atau daya hidup terdalam.
- source_word: קִנְאָה
  choice: iri hati
  rationale: Kata ini dapat berarti iri hati, kecemburuan, atau semangat yang menyala. Konteks negatif berupa ‘kebusukan bagi tulang-tulang’ paling mendukung ‘iri hati’, tanpa meniadakan kemungkinan ‘kecemburuan’.
theological_decisions: []
translation_notes:
