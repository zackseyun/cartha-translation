  text: הוֹלֵ֣ךְ בְּ֭/יָשְׁר/וֹ יְרֵ֣א יְהוָ֑ה וּ/נְל֖וֹז דְּרָכָ֣י/ו בּוֹזֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/002.yaml
  text: Whoever walks in uprightness fears Yahweh[b][a], but the one whose ways are crooked despises him.
translation:
  language: id
  text: Orang yang hidup dalam kelurusannya takut kepada Yahweh, tetapi orang yang jalannya bengkok meremehkan-Nya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata ganti dalam “-Nya” paling wajar merujuk kepada Yahweh; sebagian memahaminya secara lebih umum.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: hidup
  rationale: Secara harfiah berarti “berjalan”, tetapi dalam sastra hikmat kata ini lazim menggambarkan cara hidup atau perilaku; “hidup” menyampaikan idiom itu secara alami dalam bahasa Indonesia.
- source_word: בְּיָשְׁרוֹ
  choice: dalam kelurusan
  rationale: Mempertahankan gambaran Ibrani tentang sesuatu yang lurus sebagai integritas moral; akhiran orang ketiga dipahami bersama subjek tanpa bentuk posesif yang kaku dalam bahasa Indonesia.
- source_word: יְרֵא יְהוָה
  choice: takut kepada Yahweh
  rationale: Menjaga ungkapan teologis baku dalam Amsal dan bobot moral kata ירא, tanpa melunakkannya menjadi sekadar “menghormati”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: וּנְלוֹז דְּרָכָיו
  choice: tetapi orang yang menyimpang dalam jalan-jalannya
  rationale: נלוז menggambarkan sesuatu yang bengkok atau menyimpang, sedangkan bentuk jamak דְּרָכָיו menunjuk pola perilakunya. Susunan ini alami sekaligus dekat dengan struktur Ibrani.
- source_word: בּוֹזֵהוּ
  choice: menghina Dia
  rationale: בזה berarti memandang hina atau meremehkan. Sufiks maskulin tunggal paling wajar merujuk kepada Yahweh dalam antitesis antara takut kepada-Nya dan menghina-Nya.
theological_decisions:
- issue: Rujukan sufiks pronominal dalam בּוֹזֵהוּ
  choice: 'Sufiks dipahami merujuk kepada Yahweh: “menghina Dia”.'
  alternative: Sufiks dapat dipahami secara lebih umum sebagai merujuk kepada orang lurus atau tatanan moral hikmat.
  rationale: 'Yahweh adalah anteseden eksplisit terdekat, dan pembacaan ini menghasilkan antitesis yang kuat: orang lurus takut kepada Yahweh, sedangkan orang yang menyimpang menghina-Nya. Kemungkinan lain tetap dicatat agar ambiguitas tidak dihapus.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Hidup” mengalihkan idiom berjalan secara wajar; “kelurusan” mempertahankan citra konkret teks Ibrani. Kapitalisasi “Dia” membantu menunjukkan rujukan yang dipilih tanpa menghilangkan alternatif dalam catatan kaki.
