id: PRO.14.8
reference: Proverbs 14:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: חָכְמַ֣ת עָ֭רוּם הָבִ֣ין דַּרְכּ֑/וֹ וְ/אִוֶּ֖לֶת כְּסִילִ֣ים מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/008.yaml
  text: The wisdom of the prudent is to understand his way[b][a], but the folly of fools is deceit.
translation:
  language: id
  text: Hikmat orang arif ialah memahami jalannya[a], tetapi kebodohan orang bebal adalah tipu daya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Hikmat orang cerdik ialah mencermati jalan yang ditempuhnya.”
    reason: Alternatif ini menampilkan nuansa kecerdikan praktis pada עָרוּם, daya membedakan pada הָבִין, dan arti kiasan דֶּרֶךְ sebagai arah hidup.
  - marker: b
    text: “Tipu daya” dapat menunjuk pada perilaku menipu atau pada penipuan diri yang menjadi ciri kebodohan orang bebal.
    reason: מִרְמָה tidak menjelaskan secara tegas sasaran atau arah penipuannya; kedua kemungkinan patut dipertahankan.
lexical_decisions:
- source_word: חָכְמַת
  choice: Hikmat
  rationale: Bentuk konstruk menyatakan hikmat yang dimiliki atau menjadi ciri orang arif; susunan “Hikmat orang arif” mempertahankan hubungan tersebut secara alami dalam bahasa Indonesia.
- source_word: עָרוּם
  choice: orang arif
  rationale: Dalam konteks Amsal, kata ini menunjuk pada orang yang cerdik, berhati-hati, dan mampu menilai keadaan secara positif. “Orang arif” mempertahankan pujian moral tanpa nuansa negatif “licik”.
- source_word: הָבִין
  choice: ialah memahami
  rationale: Bentuk ini menjelaskan hakikat hikmat orang arif, bukan sekadar melaporkan satu tindakan. “Ialah memahami” mempertahankan daya definisional pepatah tersebut.
- source_word: דַּרְכּוֹ
  choice: jalannya
  rationale: Kata דֶּרֶךְ dapat menunjuk pada jalan, perilaku, atau arah kehidupan seseorang. “Jalannya” ringkas dan tetap membuka keluasan makna itu.
- source_word: וְאִוֶּלֶת
  choice: tetapi kebodohan
  rationale: Kata penghubung membentuk pertentangan antarkedua bagian ayat; “tetapi” menyatakan hubungan adversatif itu dengan jelas.
- source_word: כְּסִילִים
  choice: orang bebal
  rationale: “Orang bebal” merupakan istilah konkret dan bermuatan moral yang sesuai bagi tokoh khas sastra hikmat, bukan sekadar orang yang kurang pengetahuan.
- source_word: מִרְמָה
  choice: tipu daya
  rationale: Istilah ini dapat berarti penipuan, kelicikan, atau keadaan tertipu. “Tipu daya” alami dan padat, sementara catatan kaki mempertahankan kemungkinan bahwa kebebalan itu juga mencakup penipuan diri.
theological_decisions:
- issue: Nuansa moral עָרוּם
  choice: Diterjemahkan secara positif sebagai “orang arif”.
  alternative: orang cerdik; orang licik
  rationale: Pertentangan dengan kebodohan orang bebal menunjukkan bahwa sifat ini dipuji. “Orang licik” akan membalikkan polaritas etis pepatah tersebut.
- issue: Akhiran maskulin tunggal pada דַּרְכּוֹ
  choice: Diterjemahkan “jalannya”.
  alternative: jalan orang itu; jalan mereka
  rationale: Bahasa Indonesia tidak menandai gender pada akhiran pronominal -nya. Bentuk ini secara alami mempertahankan acuan tunggal dan fungsi representatif teks Ibrani tanpa menambahkan jenis kelamin yang tidak perlu dalam bahasa sasaran.
- issue: Cakupan makna מִרְמָה
  choice: Dibiarkan sebagai “tipu daya”, dengan ambiguitas dijelaskan dalam catatan kaki.
  alternative: penipuan terhadap orang lain; penipuan diri
  rationale: Teks Ibrani tidak menentukan apakah yang dimaksud terutama perilaku menipu atau keadaan menipu diri sendiri. Terjemahan utama tidak memilih salah satu secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pepatah yang ringkas dan bermartabat. “Ialah” dipakai untuk menyatakan definisi secara alami; “orang arif” dan “orang bebal” menjaga kontras khas sastra hikmat. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
