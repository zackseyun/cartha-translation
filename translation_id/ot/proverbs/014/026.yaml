source:
  edition: WLC
  text: בְּ/יִרְאַ֣ת יְ֭הוָה מִבְטַח עֹ֑ז וּ֝/לְ/בָנָ֗י/ו יִהְיֶ֥ה מַחְסֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/026.yaml
  text: In the fear of Yahweh there is strong confidence[a], and for his children there will be a refuge.
translation:
  language: id
  text: Dalam takut akan Yahweh ada keyakinan yang kuat, dan bagi anak-anaknya[a] akan ada tempat perlindungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, meskipun kurang mungkin, “bagi anak-anak-Nya akan ada tempat perlindungan,” jika “-Nya” merujuk kepada Yahweh, bukan kepada orang yang takut akan Dia.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/יִרְאַת
  choice: Dalam takut akan
  rationale: Preposisi ב dengan bentuk konstruksi יִרְאַת menyatakan ranah atau keadaan hidup dalam sikap takut yang penuh hormat. Ungkapan ini mempertahankan idiom Ibrani tanpa mempersempitnya menjadi sekadar alat atau sebab.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
- source_word: מִבְטַח עֹז
  choice: keyakinan yang kuat
  rationale: מִבְטַח menunjuk pada keyakinan, kepercayaan, atau rasa aman, sedangkan עֹז menerangkan kekuatannya. “Keyakinan yang kuat” alami dalam bahasa Indonesia dan membedakannya dari gambaran tempat perlindungan pada klausa berikut.
- source_word: וּ/לְ/בָנָי/ו
  choice: dan bagi anak-anaknya
  rationale: בָּנִים dapat berarti anak-anak, bukan hanya anak laki-laki. Preposisi ל dipertahankan dengan “bagi”. Akhiran pronominal dalam teks utama dipahami merujuk kepada orang yang takut akan Yahweh, sementara kemungkinan bahwa akhiran itu merujuk kepada Yahweh dicatat dalam catatan kaki.
- source_word: יִהְיֶה
  choice: akan ada
  rationale: Bentuk verba ini menyatakan keberadaan perlindungan dalam klausa tersebut. “Akan ada” mempertahankan nuansa prospektif tanpa menambahkan subjek yang tidak dinyatakan secara eksplisit.
- source_word: מַחְסֶה
  choice: tempat perlindungan
  rationale: מַחְסֶה berarti tempat berlindung atau perlindungan. “Tempat perlindungan” mempertahankan citra protektif yang konkret dan mudah dipahami.
theological_decisions:
- issue: Rujukan akhiran pronominal pada בָנָיו (“anak-anaknya”)
  choice: 'Dalam teks utama, akhiran itu merujuk kepada orang yang takut akan Yahweh: anak-anak orang tersebut akan memperoleh tempat perlindungan.'
  alternative: 'Akhiran itu dapat dipahami merujuk kepada Yahweh: “bagi anak-anak-Nya akan ada tempat perlindungan.”'
  rationale: Alur pepatah lebih alami bila orang yang takut akan Yahweh memiliki keyakinan kuat dan anak-anaknya turut mendapat perlindungan. Namun, secara gramatikal rujukan kepada Yahweh tetap mungkin, sehingga alternatif tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Frasa “dalam takut akan Yahweh” sengaja mempertahankan idiom teologis Ibrani, sedangkan susunan klausa kedua mempertahankan preposisi ל dan nuansa keberadaan/prospektif dari יִהְיֶה.
