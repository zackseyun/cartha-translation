  yaml_path: translation/ot/proverbs/014/003.yaml
  text: In the mouth of a fool is a rod of pride[b][a], but the lips of the wise will guard them.
translation:
  language: id
  text: Di mulut orang bebal ada tongkat keangkuhan[a], tetapi bibir orang bijak akan melindungi mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tunas keangkuhan.” Kata Ibrani yang diterjemahkan “tongkat” juga dapat berarti “tunas” atau “cabang.” Makna tepat metafora ini tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Kata “mereka” kemungkinan menunjuk kepada orang-orang bijak; maksudnya, bibir orang bijak melindungi pemiliknya.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפִי
  choice: Di mulut
  rationale: Mempertahankan gambaran lokatif Ibrani tentang sesuatu yang terdapat dalam atau keluar melalui perkataan orang bebal.
- source_word: אֱוִיל
  choice: orang bebal
  rationale: Dalam sastra hikmat, istilah ini menunjuk pada orang yang tumpul dan keras kepala secara moral, bukan sekadar kurang cerdas; “orang bebal” mempertahankan nuansa tersebut.
- source_word: חֹטֶר
  choice: tongkat
  rationale: Kata ini juga dapat berarti “tunas” atau “cabang”, tetapi dalam konteks ini “tongkat” lebih kuat menggambarkan perkataan angkuh sebagai alat yang memukul atau mendatangkan hukuman.
- source_word: גַּאֲוָה
  choice: keangkuhan
  rationale: Mengungkapkan kesombongan yang meninggikan diri dan sesuai dengan sifat negatif perkataan orang bebal dalam konteks ini.
- source_word: וְשִׂפְתֵי
  choice: tetapi bibir
  rationale: Kata penghubung diterjemahkan secara adversatif karena baris kedua berlawanan dengan baris pertama; “bibir” dipertahankan agar kesejajaran puitis dengan “mulut” tetap tampak.
- source_word: חֲכָמִים
  choice: orang bijak
  rationale: Adjektiva jamak ini dipakai sebagai nomina kolektif. Bahasa Indonesia tidak wajib menandai bentuk jamak secara eksplisit setelah nomina berkategori umum.
- source_word: תִּשְׁמוּרֵם
  choice: akan menjaga mereka
  rationale: Mempertahankan makna dasar verba “menjaga/melindungi” dan sufiks orang ketiga jamak “mereka” tanpa secara diam-diam menentukan antesedennya.
theological_decisions:
- issue: Anteseden sufiks “mereka” dalam תִּשְׁמוּרֵם
  choice: Mempertahankan pronomina “mereka” dalam teks utama
  alternative: Menerjemahkan secara eksplisit “akan melindungi orang bijak itu sendiri”
  rationale: Secara makna, sufiks itu kemungkinan besar menunjuk kepada orang-orang bijak sebagai pemilik bibir tersebut, tetapi teks Ibrani tetap ringkas dan tidak menyebut antesedennya secara eksplisit. Ambiguitas asli dipertahankan dan kemungkinan rujukannya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada sastra hikmat. Metafora “mulut”, “tongkat”, dan “bibir” dipertahankan, sedangkan “orang bebal” dipilih untuk menyampaikan dimensi moral istilah hikmat Ibrani.
