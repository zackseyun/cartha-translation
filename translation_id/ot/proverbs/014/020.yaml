translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya amsal yang ringkas dan bermartabat. Susunan pasif pada klausa pertama dipertahankan, sedangkan klausa kedua ditata secara alami dalam bahasa Indonesia tanpa menghilangkan sifat verbal 'mengasihi'.
