  yaml_path: translation/ot/proverbs/014/020.yaml
  text: A poor person is hated even by his neighbor[a], but those who love the rich are many.
translation:
  language: id
  text: Orang miskin dibenci bahkan oleh tetangganya[a], tetapi banyak orang mengasihi orang kaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bahkan oleh kawannya” atau “bahkan oleh sahabatnya”; kata Ibrani ini dapat berarti tetangga, kawan, atau sahabat.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: bahkan
  rationale: 'Partikel ini memperkuat pahitnya keadaan: penolakan terhadap orang miskin datang bahkan dari orang yang dekat dengannya.'
- source_word: לְרֵעֵהוּ
  choice: oleh sesamanya
  rationale: Dengan verba pasif, preposisi menandai pelaku. 'Sesamanya' mempertahankan cakupan luas רֵעַ, yang juga dapat merujuk kepada kawan atau sahabat.
- source_word: יִשָּׂנֵא
  choice: dibenci
  rationale: Bentuk Nifal bersifat pasif; terjemahan ini mempertahankan orang miskin sebagai subjek yang mengalami kebencian.
- source_word: רָשׁ
  choice: orang miskin
  rationale: Nomina ini menunjuk kepada seseorang yang berkekurangan; bentuk Indonesia ini alami dan bersifat umum.
- source_word: וְאֹהֲבֵי
  choice: tetapi banyak orang mengasihi
  rationale: Partisipelnya dipertahankan secara verbal sebagai orang-orang yang mengasihi, sedangkan konjungsi diterjemahkan 'tetapi' untuk menyatakan kontras antarklausa.
- source_word: עָשִׁיר
  choice: orang kaya
  rationale: Nomina tunggal ini menunjuk secara umum kepada seorang kaya; bahasa Indonesia tidak memerlukan artikel.
- source_word: רַבִּים
  choice: banyak orang
  rationale: Makna jumlah yang besar dinyatakan secara alami dalam susunan Indonesia 'banyak orang', tanpa mengubah pelaku tindakan mengasihi.
