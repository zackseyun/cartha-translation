  text: A short-tempered man acts foolishly[b][a], and a man of schemes is hated.
translation:
  language: id
  text: Orang yang lekas marah[a] bertindak bodoh, dan orang yang suka bersiasat[b] dibenci.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cepat marah.”
    reason: lexical_alternative
  - marker: b
    text: Atau “orang yang merancang kejahatan”; kata Ibrani untuk “siasat/rencana” dapat bernuansa negatif dalam sastra hikmat.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצַר אַפַּיִם
  choice: lekas marah
  rationale: Ungkapan Ibrani ini secara harfiah berarti ‘pendek hidung/amarah’ dan menunjuk pada orang yang cepat tersulut amarah. ‘Lekas marah’ alami dan jelas dalam bahasa Indonesia modern.
- source_word: יַעֲשֶׂה
  choice: bertindak
  rationale: Kata kerja umum ‘melakukan/membuat’ dipadukan secara alami dengan אִוֶּלֶת sebagai ‘bertindak bodoh’, tanpa mengubah maknanya.
- source_word: אִוֶּלֶת
  choice: bodoh
  rationale: Nomina Ibrani berarti ‘kebodohan’; dalam konstruksi bahasa Indonesia, bentuk adverbial ‘bertindak bodoh’ menyampaikan perilaku bodoh secara wajar.
- source_word: אִישׁ
  choice: orang
  rationale: Dalam amsal ini אִישׁ menggambarkan suatu tipe manusia secara umum. ‘Orang’ adalah padanan Indonesia yang alami dan tidak menghilangkan fungsi representatif ungkapan tersebut.
- source_word: מְזִמּוֹת
  choice: penuh siasat
  rationale: Kata ini dapat berarti rencana, siasat, atau rancangan, dan sering bernuansa negatif dalam sastra hikmat. ‘Penuh siasat’ mempertahankan nuansa mencurigakan tanpa secara mutlak menambahkan ‘jahat’ ke dalam teks utama.
- source_word: יִשָּׂנֵא
  choice: dibenci
  rationale: Bentuk Nifal paling langsung diterjemahkan sebagai pasif. Bentuk kini cocok dengan sifat amsal yang menyatakan kebenaran umum.
theological_decisions:
- issue: Nuansa moral מְזִמּוֹת
  choice: penuh siasat
  alternative: merancang kejahatan
  rationale: Teks Ibrani tidak menyebut ‘jahat’ secara eksplisit, walaupun konteks dan pemakaian kata dapat memberi nuansa negatif. Teks utama mempertahankan ruang makna itu, sedangkan alternatif yang lebih tegas dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada amsal. Konjungsi וְ diterjemahkan ‘tetapi’ karena baris kedua berfungsi sebagai perbandingan kontras. Semua penanda catatan kaki ditempatkan langsung sesudah ungkapan yang dijelaskan.
