source:
  edition: WLC
  text: רְֽצוֹן מֶ֭לֶךְ לְ/עֶ֣בֶד מַשְׂכִּ֑יל וְ֝/עֶבְרָת֗/וֹ תִּהְיֶ֥ה מֵבִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/035.yaml
  text: A king’s favor is toward a servant who acts wisely[b][a], but his wrath is against one who brings shame.
translation:
  language: id
  text: Raja berkenan kepada hamba yang bertindak bijaksana,[a] tetapi murkanya tertuju kepada orang yang mendatangkan malu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada hamba yang berakal budi” atau “kepada hamba yang cakap.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tetapi murkanya akan ada bagi/terhadap orang yang mendatangkan malu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצוֹן
  choice: berkenan
  rationale: Dalam konteks istana, רָצוֹן menyatakan sikap senang atau perkenanan raja. Konstruksi verbal “Raja berkenan” alami dalam bahasa Indonesia dan mempertahankan arah sikap kepada hambanya.
- source_word: מֶלֶךְ
  choice: raja
  rationale: Padanan langsung bagi kata benda umum yang berarti penguasa laki-laki.
- source_word: לְעֶבֶד
  choice: kepada hamba
  rationale: Preposisi לְ menandai orang yang menjadi sasaran perkenanan. “Hamba” sesuai dengan konteks pelayanan di lingkungan kerajaan tanpa menonjolkan status perbudakan yang tidak menjadi pokok amsal ini.
- source_word: מַשְׂכִּיל
  choice: yang bertindak bijaksana
  rationale: Partisip Hifil dari שׂכל dapat menunjuk pada tindakan yang berwawasan, cakap, atau berhasil. “Bertindak bijaksana” mempertahankan daya verbalnya dan cocok dengan hikmat praktis Amsal.
- source_word: וְעֶבְרָתוֹ
  choice: tetapi murkanya
  rationale: עֶבְרָה menyatakan kemarahan yang kuat, sehingga “murka” lebih tepat daripada “marah”. Konjungsi diterjemahkan “tetapi” untuk menampilkan pertentangan kedua baris.
- source_word: תִּהְיֶה
  choice: tertuju
  rationale: Kata kerja היה secara harfiah berarti “ada/akan ada”; dalam bahasa Indonesia hubungan yang tersirat dengan objek kemarahan paling alami dinyatakan dengan “tertuju”, tanpa menekankan waktu mendatang.
- source_word: מֵבִישׁ
  choice: orang yang mendatangkan malu
  rationale: Partisip Hifil dari בוש dipahami secara kausatif, yaitu orang yang menyebabkan rasa malu atau aib.
theological_decisions: []
