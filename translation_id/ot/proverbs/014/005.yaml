source:
  edition: WLC
  text: עֵ֣ד אֱ֭מוּנִים לֹ֣א יְכַזֵּ֑ב וְ/יָפִ֥יחַ כְּ֝זָבִ֗ים עֵ֣ד שָֽׁקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/005.yaml
  text: A faithful witness does not lie[a], but a false witness breathes out lies.
translation:
  language: id
  text: Saksi yang dapat dipercaya tidak berdusta, tetapi saksi palsu mengembuskan kebohongan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengucapkan berbagai dusta.” Kata kerja Ibrani menggambarkan kesaksian palsu sebagai sesuatu yang diembuskan atau dicurahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד
  choice: saksi
  rationale: Kata ini menunjuk kepada orang yang memberikan kesaksian; “saksi” merupakan istilah hukum dan moral yang alami dalam bahasa Indonesia dan cocok pada kedua bagian ayat.
- source_word: אֱמוּנִים
  choice: yang dapat dipercaya
  rationale: Bentuk ini menyatakan sifat andal atau setia. “Yang dapat dipercaya” secara alami menerangkan integritas saksi tanpa mempersempit maknanya.
- source_word: לֹא יְכַזֵּב
  choice: tidak berdusta
  rationale: Dalam konteks kesaksian, bentuk Piel dari כזב berarti mengatakan sesuatu yang tidak benar. “Tidak berdusta” jelas, ringkas, dan bermartabat.
- source_word: וְיָפִיחַ
  choice: tetapi ... mengembuskan
  rationale: Konjungsi diterjemahkan secara adversatif karena bagian kedua berlawanan dengan bagian pertama. “Mengembuskan” mempertahankan gambaran hidup dari verba Ibrani tentang mengeluarkan perkataan seperti napas.
- source_word: כְּזָבִים
  choice: kebohongan
  rationale: Kata ini menyatakan berbagai perkataan dusta. Dalam bahasa Indonesia, nomina massal “kebohongan” terdengar lebih alami dengan “mengembuskan” sambil tetap menyampaikan gagasan dusta yang dikeluarkan.
- source_word: עֵד שָׁקֶר
  choice: saksi palsu
  rationale: Frasa ini adalah ungkapan baku bagi orang yang memberikan kesaksian tidak benar; “saksi palsu” alami dan dikenal luas dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan paralel yang ringkas. Diksi “berdusta” mempertahankan nada hikmat yang bermartabat, sedangkan “mengembuskan” menjaga metafora Ibrani. Penanda catatan kaki [a] ditempatkan setelah frasa yang dijelaskan.
