  text: The heart knows the bitterness of its soul[b][a], and no stranger shares in its joy.
translation:
  language: id
  text: Hati mengenal kepahitan jiwanya,[a] dan orang luar tidak ikut mengambil bagian dalam sukacitanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepahitan jiwanya.” “Jiwa” di sini menunjuk pada diri atau kehidupan batin, bukan dengan sendirinya merupakan pernyataan teknis tentang susunan manusia.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang luar tidak mencampuri sukacitanya” atau “tidak ikut serta dalam sukacitanya.” Kata kerja Ibrani dapat berarti menjadi terlibat dalam atau turut mengambil bagian dalam sesuatu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: hati
  rationale: Dalam Amsal, kata ini menunjuk pada batin sebagai pusat pikiran dan perasaan. “Hati” alami dalam bahasa Indonesia dan mempertahankan gambaran Ibraninya.
- source_word: יֹדֵעַ
  choice: mengenal
  rationale: Kata ini menyatakan pengetahuan batiniah yang dialami secara pribadi. “Mengenal” menonjolkan pengenalan berdasarkan pengalaman, bukan sekadar mengetahui fakta.
- source_word: מָרַת
  choice: kepahitan
  rationale: Pilihan ini mempertahankan metafora Ibrani dan tidak mempersempit maknanya menjadi hanya kesedihan atau dukacita.
- source_word: נַפְשׁוֹ
  choice: jiwanya sendiri
  rationale: נפש di sini mengacu pada diri atau kehidupan batin. “Jiwanya sendiri” mempertahankan ungkapan sumber, sedangkan “sendiri” memperjelas sifat personal pengalaman tersebut.
- source_word: וּבְשִׂמְחָתוֹ
  choice: sukacitanya
  rationale: שִׂמְחָה berarti kegembiraan atau sukacita. “Sukacita” sesuai dengan ragam bahasa yang bermartabat dan mudah dipahami.
- source_word: יִתְעָרַב
  choice: ikut merasakan
  rationale: Bentuk kata kerja ini dapat berarti mencampuri, terlibat, atau mengambil bagian. Dalam konteks pengalaman batin, “ikut merasakan” menyampaikan partisipasi dalam sukacita secara alami tanpa meniadakan alternatif leksikal.
- source_word: זָר
  choice: orang luar
  rationale: Di sini זָר bukan terutama orang asing secara etnis, melainkan seseorang yang berada di luar pengalaman batin pribadi tersebut. “Orang luar” menyatakan kontras itu dengan jelas.
