  yaml_path: translation/ot/proverbs/014/034.yaml
  text: Righteousness exalts a nation[a], but sin is a disgrace to peoples.
translation:
  language: id
  text: Kebenaran meninggikan suatu bangsa, tetapi dosa adalah aib bagi bangsa-bangsa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baris kedua dalam bahasa Ibrani sulit. Secara tradisional baris itu dipahami berarti bahwa dosa menjadi aib atau cela bagi bangsa-bangsa. Namun, kata yang diterjemahkan “aib” biasanya berarti “kasih setia,” “kebaikan,” atau “kesetiaan”; di sini kata itu mungkin dipakai dalam arti langka “cela” atau “aib.” Karena itu, susunan dan hubungan kata-kata dalam baris ini juga telah ditafsirkan dengan cara lain.
    reason: alternative_reading
lexical_decisions:
- source_word: צְדָקָה
  choice: Kebenaran
  rationale: Kata ini menunjuk pada apa yang benar dan adil dalam kehidupan moral dan sosial. “Kebenaran” mempertahankan keluasan maknanya, meskipun “keadilan” atau “perilaku benar” juga mungkin dalam konteks ini.
- source_word: תְרוֹמֵם
  choice: meninggikan
  rationale: Bentuk dari רום menyatakan tindakan mengangkat atau membuat tinggi. “Meninggikan” mempertahankan gambaran ketinggian sekaligus makna kiasan tentang kehormatan dan kedudukan suatu bangsa.
- source_word: גּוֹי
  choice: suatu bangsa
  rationale: Di sini istilah tersebut secara umum menunjuk pada suatu komunitas bangsa, bukan secara khusus bangsa-bangsa bukan Israel. Kata “suatu” sesuai dengan bentuk tunggal tak tentu dalam pepatah umum ini.
- source_word: חֶסֶד
  choice: aib
  rationale: Walaupun kata ini biasanya berarti kasih setia, kebaikan, atau kesetiaan, dalam klausa yang sulit ini kata tersebut secara tradisional dipahami memiliki arti langka yang negatif, yaitu cela atau aib. Dalam susunan klausa, “aib” dipahami sebagai predikat bagi “dosa”.
- source_word: לְאֻמִּים
  choice: bagi bangsa-bangsa
  rationale: Bentuk jamak ini merujuk pada kelompok-kelompok bangsa. “Bangsa-bangsa” mempertahankan bentuk jamak dan kesejajaran puitis dengan “suatu bangsa” pada baris pertama.
- source_word: חַטָּאת
  choice: dosa
  rationale: Makna dasarnya adalah dosa atau pelanggaran. Menjadikannya subjek klausa—“dosa adalah aib”—menghasilkan pertentangan yang wajar dengan “kebenaran” tanpa menghilangkan ketegangan dalam teks Ibrani.
theological_decisions:
- issue: Penafsiran klausa kedua וְחֶסֶד לְאֻמִּים חַטָּאת
  choice: “tetapi dosa adalah aib bagi bangsa-bangsa”
  alternative: Secara lebih harfiah kata-katanya dapat dipahami sebagai “tetapi kasih setia/kebaikan kepada bangsa-bangsa adalah dosa”; חֶסֶד juga pernah dipahami dalam arti langka “cela” atau “aib.”
  rationale: Klausa Ibraninya sulit karena חֶסֶד biasanya bermakna positif. Namun, kesejajaran yang berlawanan dengan baris pertama dan pemakaian yang secara tradisional diterima mendukung pengertian bahwa dosa membawa atau merupakan aib bagi bangsa-bangsa. Catatan kaki mempertahankan ambiguitas tekstual dan leksikal yang nyata.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada pepatah. “Kebenaran” dipilih untuk cakupan moral-sosial yang luas; “meninggikan” mempertahankan metafora Ibrani; “aib” lebih alami dan bermartabat daripada ungkapan yang terlalu panjang. Penanda catatan kaki [a] ditempatkan tepat setelah klausa yang dipersoalkan.
