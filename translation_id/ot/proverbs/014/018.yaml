source:
  edition: WLC
  text: נָחֲל֣וּ פְתָאיִ֣ם אִוֶּ֑לֶת וַֽ֝/עֲרוּמִ֗ים יַכְתִּ֥רוּ דָֽעַת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/018.yaml
  text: The simple inherit folly[a], but the prudent are crowned with knowledge.
translation:
  language: id
  text: Orang yang tak berpengalaman mewarisi kebodohan, tetapi orang arif dimahkotai dengan pengetahuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang arif menjadikan pengetahuan mahkota mereka.” Kata kerja Ibrani dapat dipahami secara aktif (“memahkotai”) atau sebagai gambaran bahwa mereka dihiasi atau dimahkotai dengan pengetahuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחֲלוּ
  choice: mewarisi
  rationale: Kata kerja נחל menggambarkan menerima atau memperoleh sebagai milik pusaka. “Mewarisi” mempertahankan metafora bahwa kebodohan menjadi bagian milik orang yang tak berpengalaman.
- source_word: פְתָאיִם
  choice: orang yang tak berpengalaman
  rationale: Dalam Amsal, פתי menunjuk kepada orang yang belum matang dan mudah dipengaruhi, bukan semata-mata orang bodoh. Ungkapan ini menyampaikan makna tersebut tanpa memberi kesan positif yang mungkin timbul dari “lugu”.
- source_word: אִוֶּלֶת
  choice: kebodohan
  rationale: Istilah hikmat ini mencakup kebodohan moral maupun praktis. “Kebodohan” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: עֲרוּמִים
  choice: orang arif
  rationale: Dalam konteks ini, ערומים berkontras dengan orang yang tak berpengalaman dan merujuk kepada mereka yang memiliki pertimbangan matang. “Orang arif” mempertahankan nuansa positif tanpa konotasi licik yang dapat melekat pada “cerdik”.
- source_word: יַכְתִּרוּ
  choice: dimahkotai dengan
  rationale: Bentuk dari כתר dapat menggambarkan tindakan memahkotai atau keadaan dihiasi seperti dengan mahkota. Bentuk pasif ini alami dalam bahasa Indonesia dan menyampaikan gambaran pengetahuan sebagai mahkota, sementara kemungkinan pemahaman aktif dicatat dalam catatan kaki.
- source_word: דָעַת
  choice: pengetahuan
  rationale: דעת adalah istilah utama dalam sastra hikmat untuk pengetahuan yang disertai pengenalan dan daya membedakan. “Pengetahuan” adalah padanan paling langsung di sini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hikmat. Susunan dua klausa mempertahankan kesejajaran antitetis teks Ibrani; “tak berpengalaman” dipilih demi kejelasan bagi pembaca umum, sedangkan “orang arif” menjaga nada yang bermartabat.
