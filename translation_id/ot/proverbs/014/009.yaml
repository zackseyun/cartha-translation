  text: אֱ֭וִלִים יָלִ֣יץ אָשָׁ֑ם וּ/בֵ֖ין יְשָׁרִ֣ים רָצֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/009.yaml
  text: Fools mock guilt[b][a], but among the upright there is favor.
translation:
  language: id
  text: Orang-orang bodoh mencemooh kesalahan[a], tetapi di antara orang benar terdapat perkenanan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “korban penebus salah.” Kata Ibrani אָשָׁם dapat berarti “kesalahan” atau, dalam konteks korban, “korban penebus salah.”
    reason: alternative_reading
  - marker: b
    text: Atau “penerimaan” atau “iktikad baik.” Teks Ibrani tidak menyebutkan perkenanan siapa yang dimaksud.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִלִים
  choice: orang-orang bodoh
  rationale: Nomina jamak ini menunjuk kepada orang yang bodoh secara moral, suatu kategori khas dalam sastra hikmat. Bentuk ini jelas dan alami dalam bahasa Indonesia.
- source_word: יָלִיץ
  choice: mencemooh
  rationale: Bentuk Hifil dari לוץ lazim menyatakan tindakan mengejek atau mencemooh. “Mencemooh” menyampaikan sikap merendahkan dan menganggap enteng.
- source_word: אָשָׁם
  choice: kesalahan
  rationale: Kata ini dapat berarti kesalahan atau keadaan bersalah, dan dalam konteks ibadah juga dapat berarti persembahan penebus salah. Dalam konteks hikmat etis ini, “kesalahan” paling alami tanpa menghilangkan alternatif ritual yang dicatat dalam catatan kaki.
- source_word: וּבֵין
  choice: tetapi di antara
  rationale: Kata sambung dan preposisi ini membuka bagian kedua yang berlawanan dengan bagian pertama; “tetapi di antara” menyatakan paralelisme antitetis secara alami.
- source_word: יְשָׁרִים
  choice: orang-orang jujur
  rationale: Istilah hikmat ini menunjuk kepada mereka yang lurus secara moral. “Orang-orang jujur” mudah dipahami dan mencakup makna integritas, bukan sekadar kejujuran dalam ucapan.
- source_word: רָצוֹן
  choice: perkenanan
  rationale: Kata ini dapat berarti perkenanan, penerimaan, atau iktikad baik. “Perkenanan” mempertahankan ketidakjelasan mengenai apakah sumbernya Allah, manusia, atau keduanya.
theological_decisions:
- issue: Makna אָשָׁם dalam konteks hikmat nonritual
  choice: kesalahan
  alternative: persembahan penebus salah
  rationale: Konteksnya membandingkan perilaku moral orang bodoh dan orang jujur, bukan menjelaskan tata cara korban. Makna abstrak paling sesuai, sedangkan kemungkinan makna ritual tetap dicantumkan dalam catatan kaki.
- issue: Sumber atau pemilik רָצוֹן
  choice: dibiarkan luas sebagai “perkenanan”
  alternative: perkenanan Allah; iktikad baik manusia; penerimaan
  rationale: Teks Ibrani tidak menyebutkan siapa yang memberikan perkenanan. Terjemahan tidak mempersempitnya pada sumber ilahi atau manusiawi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua bagian dipertahankan secara ringkas agar bentuk amsal tetap terasa; istilah “perkenanan” sengaja dibiarkan cukup luas untuk mempertahankan ambiguitas teks sumber.
