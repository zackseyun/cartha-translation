id: PRO.14.1
reference: Proverbs 14:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: חַכְמ֣וֹת נָ֭שִׁים בָּנְתָ֣ה בֵיתָ֑/הּ וְ֝/אִוֶּ֗לֶת בְּ/יָדֶ֥י/הָ תֶהֶרְסֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/001.yaml
  text: The wisest of women builds her house[b][a], but a foolish woman tears it down with her own hands.
translation:
  language: id
  text: Perempuan yang paling bijaksana membangun rumahnya[a][b], tetapi perempuan bodoh merobohkannya dengan tangannya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Setiap perempuan bijaksana membangun rumahnya.” Ungkapan pembuka dalam bahasa Ibrani juga dapat dipahami sebagai pernyataan umum tentang semua perempuan bijaksana, bukan sebagai ungkapan superlatif.
    reason: lexical_alternative
  - marker: b
    text: “Rumah” juga dapat mencakup arti “rumah tangga” atau “keluarga”, bukan hanya bangunan tempat tinggal.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַכְמוֹת נָשִׁים
  choice: perempuan yang paling bijaksana
  rationale: Ungkapan jamak ini, yang diikuti verba feminin tunggal, dapat dipahami sebagai konstruksi idiomatis dengan nuansa superlatif. Pilihan ini juga mempertahankan kesejajaran dengan sosok perempuan bodoh pada baris kedua.
- source_word: בָּנְתָה
  choice: membangun
  rationale: Walaupun bentuk Ibraninya perfektif, dalam amsal bentuk itu menyatakan kebenaran umum; kala kini tanpa penanda waktu paling alami dalam bahasa Indonesia.
- source_word: בֵיתָהּ
  choice: rumahnya
  rationale: Kata בַּיִת dapat menunjuk pada bangunan rumah maupun rumah tangga atau keluarga. 'Rumahnya' mempertahankan gambaran konkret sekaligus keluasan metaforanya.
- source_word: אִוֶּלֶת
  choice: perempuan bodoh
  rationale: Nomina feminin ini dipahami secara personal berdasarkan verba feminin tunggal dan kontrasnya dengan perempuan bijaksana pada baris pertama.
- source_word: בְּיָדֶיהָ
  choice: dengan tangannya sendiri
  rationale: Frasa instrumental ini menekankan bahwa kehancuran tersebut merupakan akibat perbuatannya sendiri. Bentuk tunggal 'tangannya' lebih idiomatis dalam bahasa Indonesia untuk tindakan pelaku.
- source_word: תֶהֶרְסֶנּוּ
  choice: merobohkannya
  rationale: Kata kerja הרס berarti meruntuhkan atau merobohkan. 'Merobohkannya' mempertahankan pertentangan konkret dengan 'membangun', sedangkan akhiran '-nya' merujuk kembali kepada rumah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Diksi 'membangun' dan 'merobohkan' mempertahankan metafora serta kontras puitis teks Ibrani; 'dengan tangannya sendiri' menyampaikan penekanan pada tanggung jawab pribadi secara alami.
