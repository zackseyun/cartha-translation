  text: בְּ/לֵ֣ב נָ֭בוֹן תָּנ֣וּחַ חָכְמָ֑ה וּ/בְ/קֶ֥רֶב כְּ֝סִילִ֗ים תִּוָּדֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/033.yaml
  text: Wisdom rests in the heart of a discerning man[a], but in the midst of fools it makes itself known.
translation:
  language: id
  text: Hikmat berdiam dalam hati orang yang berpengertian, tetapi di tengah orang-orang bodoh hikmat menjadi nyata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hikmat diketahui.”'
    reason: Bentuk Nifal תִּוָּדֵעַ dapat diterjemahkan secara inkoatif, 'menjadi nyata', atau secara pasif, 'diketahui'.
lexical_decisions:
- source_word: בְּלֵב
  choice: dalam hati
  rationale: Mempertahankan gambaran konkret Ibrani tentang hati sebagai pusat pikiran, kehendak, dan batin manusia, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: נָבוֹן
  choice: orang yang berpengertian
  rationale: Menunjuk kepada seseorang yang memiliki pengertian dan daya membedakan. Ungkapan ini alami dan tidak menambahkan penekanan gender yang tidak perlu dalam bahasa Indonesia.
- source_word: תָּנוּחַ
  choice: berdiam
  rationale: Kata kerja dari נוח menggambarkan keadaan menetap atau beristirahat dengan tenang. 'Berdiam' mempertahankan gambaran bahwa hikmat menetap dalam batin orang yang berpengertian.
- source_word: חָכְמָה
  choice: Hikmat
  rationale: Merupakan subjek kedua klausa. Bentuk 'Hikmat' mempertahankan istilah utama sastra hikmat tanpa memaksakan personifikasi penuh.
- source_word: וּבְקֶרֶב
  choice: tetapi di tengah
  rationale: Kata penghubung dipahami secara adversatif karena klausa kedua dikontraskan dengan hikmat yang berdiam tenang dalam hati orang berpengertian. 'Di tengah' mempertahankan citra ruang dari קֶרֶב.
- source_word: כְּסִילִים
  choice: orang-orang bodoh
  rationale: Istilah baku dalam sastra hikmat bagi mereka yang tumpul secara moral maupun intelektual; bentuk jamak sumber dipertahankan.
- source_word: תִּוָּדֵעַ
  choice: menjadi nyata
  rationale: Bentuk Nifal ידע dapat berarti 'diketahui' atau bernuansa inkoatif/refleksif, 'menjadi nyata'. Pilihan ini menghasilkan kontras alami dengan hikmat yang berdiam dalam hati, tanpa memastikan secara berlebihan bagaimana hikmat tampak di kalangan orang bodoh.
theological_decisions:
- issue: Cara hikmat hadir di tengah orang-orang bodoh
  choice: hikmat menjadi nyata
  alternative: hikmat diketahui
  rationale: Teks Ibrani menyatakan bahwa hikmat diketahui atau menjadi nyata di tengah orang-orang bodoh, tetapi tidak menjelaskan apakah hal itu terjadi melalui pengakuan mereka, melalui kontras dengan kebodohan mereka, atau dengan cara lain. Terjemahan tidak menentukan penjelasan teologis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hikmat. Pengulangan 'hikmat' pada klausa kedua menghindari pronomina yang dapat menimbulkan personifikasi lebih kuat daripada yang diwajibkan teks Ibrani.
