  text: חָכָ֣ם יָ֭רֵא וְ/סָ֣ר מֵ/רָ֑ע וּ֝/כְסִ֗יל מִתְעַבֵּ֥ר וּ/בוֹטֵֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/016.yaml
  text: A wise man fears and turns away from evil[a], but a fool is reckless and confident.
translation:
  language: id
  text: Orang bijak takut dan menjauhi kejahatan, tetapi orang bodoh nekat[a] dan percaya diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi marah” atau “melampaui batas”; verba Ibrani ini sulit ditafsirkan, tetapi di sini tampaknya menggambarkan tindakan nekat yang tidak terkendali.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם
  choice: orang bijak
  rationale: Adjektiva substantival maskulin tunggal ini menunjuk kepada seorang individu, tetapi berfungsi secara umum dalam pepatah. “Orang bijak” alami dan inklusif dalam bahasa Indonesia tanpa menghilangkan sifat individualnya.
- source_word: יָרֵא
  choice: takut
  rationale: Makna dasar verba ini ialah takut. Dalam konteks hikmat, rasa takut itu mendorong kewaspadaan terhadap kejahatan; terjemahan langsung mempertahankan daya leksikal dan tidak menjadikannya secara eksplisit takut akan Allah karena objek tersebut tidak disebutkan.
- source_word: וְסָר
  choice: dan menjauhi
  rationale: Verba סור berarti menyimpang, berbalik, atau menjauh. “Menjauhi” merupakan ungkapan Indonesia yang wajar dengan objek “kejahatan” dan menyampaikan tindakan menghindar.
- source_word: מֵרָע
  choice: kejahatan
  rationale: רַע dapat berarti kejahatan moral maupun sesuatu yang buruk atau mencelakakan. Kontras etis antara orang bijak dan orang bodoh mendukung “kejahatan”, sambil tetap memungkinkan implikasi akibat buruk.
- source_word: כְסִיל
  choice: orang bodoh
  rationale: Istilah hikmat yang lazim bagi pribadi yang bodoh secara moral dan intelektual. “Orang bodoh” jelas, alami, dan sesuai dengan pola “orang bijak”.
- source_word: מִתְעַבֵּר
  choice: bertindak tanpa kendali
  rationale: Bentuk hitpael yang sulit ini dapat berkaitan dengan meluap dalam kemarahan atau melampaui batas. Dalam kontras dengan rasa takut dan tindakan menjauhi kejahatan, frasa ini menyampaikan perilaku nekat yang tidak menahan diri, tanpa menutup alternatif leksikalnya.
- source_word: וּבוֹטֵחַ
  choice: dan merasa aman
  rationale: בטח berarti percaya, yakin, atau merasa aman. Karena tidak ada objek yang disebutkan, “merasa aman” mempertahankan ketaksaan antara keyakinan dan rasa aman, sedangkan konteks negatif menunjukkan bahwa rasa aman itu tidak pada tempatnya.
theological_decisions:
- issue: Apakah יָרֵא secara khusus berarti takut akan Allah
  choice: takut, tanpa objek eksplisit
  alternative: takut akan Allah atau bersikap waspada
  rationale: Teks Ibrani tidak menyebut objek rasa takut. Terjemahan tidak menambahkan Allah dan tidak mereduksi kata itu menjadi sekadar kehati-hatian.
- issue: Sifat keyakinan pada וּבוֹטֵחַ
  choice: merasa aman
  alternative: percaya diri atau mengandalkan diri sendiri
  rationale: Konteks menilai sikap orang bodoh secara negatif, tetapi teks tidak menyebut dirinya sebagai objek kepercayaan. Pilihan ini mempertahankan ketegangan antara makna leksikal yang biasanya positif dan pemakaiannya yang negatif di sini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya pepatah yang ringkas dan bermartabat. Paralel “orang bijak ... orang bodoh” dipertahankan. Penanda catatan kaki [a] ditempatkan tepat setelah ungkapan yang menerjemahkan verba Ibrani yang sulit.
