source:
  edition: WLC
  text: עֹ֣שֵֽׁק דָּ֭ל חֵרֵ֣ף עֹשֵׂ֑/הוּ וּ֝/מְכַבְּד֗/וֹ חֹנֵ֥ן אֶבְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/031.yaml
  text: Whoever oppresses the poor insults his Maker[a], but whoever is gracious to the needy honors him.
translation:
  language: id
  text: Siapa menindas orang miskin menghina Penciptanya, tetapi siapa bermurah hati kepada orang yang berkekurangan menghormati-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tetapi siapa menghormatinya bermurah hati kepada orang yang berkekurangan.” Kata ganti Ibrani dalam “menghormati-Nya” dapat merujuk kepada Pencipta atau kepada orang miskin. Teks utama memahaminya sebagai rujukan kepada Allah berdasarkan kesejajaran kedua bagian ayat.
    reason: alternative_reading
lexical_decisions:
- source_word: עֹשֵׁק
  choice: Siapa menindas
  rationale: Partisipel Qal berfungsi secara substantival dan menyatakan pelaku secara umum. Bentuk “Siapa menindas” alami untuk gaya amsal dan mempertahankan gagasan penindasan atau pemerasan yang tidak adil.
- source_word: דָּל
  choice: orang miskin
  rationale: Kata ini dapat menunjuk kepada orang miskin, lemah, atau tidak berdaya secara sosial. “Orang miskin” paling jelas dalam konteks ini, sekaligus tetap menyiratkan kerentanan.
- source_word: חֵרֵף
  choice: menghina
  rationale: Verba ini berarti mencela, menista, atau memperlakukan dengan penghinaan. “Menghina” menyampaikan bahwa penindasan terhadap orang miskin merupakan penghinaan terhadap Allah.
- source_word: עֹשֵׂהוּ
  choice: Penciptanya
  rationale: 'Akhiran pronominal paling wajar merujuk kepada orang miskin: orang yang menindasnya menghina Pencipta orang itu. “Penciptanya” ringkas, jelas, dan sesuai dengan bahasa hikmat.'
- source_word: וּמְכַבְּדוֹ
  choice: tetapi ... menghormati-Nya
  rationale: Akhiran pronominal dapat merujuk kepada Pencipta atau kepada orang miskin. Teks utama mengikuti kesejajaran antitetis dan memahaminya sebagai rujukan kepada Allah; ambiguitas tekstual dicatat dalam catatan kaki.
- source_word: חֹנֵן
  choice: bermurah hati kepada
  rationale: Partisipel ini menyatakan tindakan menunjukkan kemurahan, belas kasihan, atau kebaikan. “Bermurah hati kepada” alami dalam bahasa Indonesia dan cocok dengan tindakan terhadap orang berkekurangan.
- source_word: אֶבְיוֹן
  choice: orang yang berkekurangan
  rationale: Kata ini menekankan keadaan membutuhkan atau kekurangan. Pilihan ini mempertahankan perbedaan nuansa dari דָּל, yang diterjemahkan “orang miskin” pada bagian pertama.
theological_decisions:
- issue: Rujukan akhiran pronominal dalam וּמְכַבְּדוֹ
  choice: Akhiran itu dipahami merujuk kepada Allah, yaitu Pencipta orang miskin; bermurah hati kepada orang berkekurangan berarti menghormati-Nya.
  alternative: 'Akhiran itu dapat dipahami merujuk kepada orang miskin: “siapa menghormatinya bermurah hati kepada orang yang berkekurangan.”'
  rationale: Kesejajaran antitetis mendukung hubungan antara menghina Pencipta melalui penindasan dan menghormati Pencipta melalui kemurahan hati. Namun, karena bentuk Ibrani secara gramatikal juga memungkinkan rujukan kepada orang miskin, bacaan alternatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hikmat. Struktur kalimat dibuat ringkas seperti amsal. Bentuk “-Nya” pada teks utama menandai rujukan yang dipilih kepada Allah, sedangkan kemungkinan rujukan lain dijelaskan dalam catatan kaki.
