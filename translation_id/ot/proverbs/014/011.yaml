  text: The house of the wicked will be destroyed[a], but the tent of the upright will flourish.
translation:
  language: id
  text: 'Rumah orang fasik akan dihancurkan,

    tetapi kemah orang yang hidup lurus akan berkembang.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan bertunas” atau “akan berbunga”; kata kerja Ibrani membangkitkan gambaran pertumbuhan yang mulai bersemi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית
  choice: rumah
  rationale: Bentuk konstruk ini menghubungkan ‘rumah’ dengan ‘orang fasik’. ‘Rumah’ mempertahankan gambaran tempat tinggal sekaligus dapat menyiratkan seisi rumah atau garis keluarga.
- source_word: רְשָׁעִים
  choice: orang fasik
  rationale: Istilah ini menunjuk kepada orang-orang yang secara moral jahat atau bersalah. ‘Orang fasik’ mempertahankan kontras etis yang kuat dan lazim dipahami dalam ragam Alkitab Indonesia.
- source_word: יִשָּׁמֵד
  choice: akan dibinasakan
  rationale: Bentuk Nifal dari שׁמד menyatakan bahwa sesuatu dihancurkan atau dilenyapkan. ‘Akan dibinasakan’ menyampaikan ancaman kehancuran tanpa harus menambahkan gagasan pemusnahan mutlak.
- source_word: אֹהֶל
  choice: kemah
  rationale: Arti harfiahnya adalah ‘kemah’. Istilah ini dipertahankan agar kontras antara rumah orang fasik dan kemah sederhana milik orang yang hidup lurus tetap tampak.
- source_word: יְשָׁרִים
  choice: orang yang hidup lurus
  rationale: Kata ini menunjuk kepada mereka yang lurus secara moral. Frasa ‘hidup lurus’ terdengar alami dalam bahasa Indonesia dan tidak mempersempit maknanya hanya pada kejujuran dalam berkata-kata.
- source_word: יַפְרִיחַ
  choice: akan berkembang
  rationale: Bentuk Hifil dari פרח membangkitkan gambaran tumbuhan yang bertunas atau berbunga dan, secara kiasan, keadaan yang maju atau sejahtera. ‘Akan berkembang’ menyampaikan makna kiasannya sambil memungkinkan citra pertumbuhan dijelaskan dalam catatan kaki.
