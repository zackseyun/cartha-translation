  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Paralelisme serta kontras konkret antara ‘rumah’ dan ‘kemah’ dipertahankan; larik kedua memakai ungkapan alami ‘orang yang hidup lurus’ untuk menyatakan integritas moral.
