  text: In all labor there is profit[a], but mere talk leads only to lack.
translation:
  language: id
  text: 'Segala jerih payah mendatangkan keuntungan,

    tetapi kata-kata belaka hanya mendatangkan kekurangan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kemiskinan.” Kata Ibrani מַחְסוֹר dapat berarti kekurangan, keadaan berkekurangan, atau kemiskinan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/כָל עֶצֶב
  choice: Segala jerih payah
  rationale: עֶצֶב di sini menunjuk pada kerja yang menuntut usaha atau susah payah, bukan terutama kesedihan. Ungkapan “segala jerih payah” alami dalam bahasa Indonesia dan menyampaikan prinsip umum yang dinyatakan בְּכָל.
- source_word: יִהְיֶה מוֹתָר
  choice: mendatangkan keuntungan
  rationale: Bentuk imperfek יִהְיֶה menyatakan kebenaran umum, sedangkan מוֹתָר berarti kelebihan, hasil, manfaat, atau keuntungan. “Mendatangkan keuntungan” mengungkapkan hubungan hasil secara wajar tanpa membatasinya hanya pada laba uang.
- source_word: וּ/דְבַר שְׂפָתַיִם
  choice: tetapi kata-kata belaka
  rationale: Secara harfiah frasa ini berarti “perkataan bibir,” sebuah ungkapan untuk ucapan atau pembicaraan. “Kata-kata belaka” mempertahankan kontras antara usaha nyata dan ucapan tanpa tindakan.
- source_word: אַךְ לְ/מַחְסוֹר
  choice: hanya mendatangkan kekurangan
  rationale: אַךְ membatasi hasilnya dengan arti “hanya,” sedangkan מַחְסוֹר dapat berarti kekurangan, kebutuhan, atau kemiskinan. “Kekurangan” mempertahankan keluasan makna Ibrani dan berlawanan secara tepat dengan “keuntungan.”
