  text: Where there are no oxen[a], the manger is clean[b], but abundant crops come by the strength of an ox.
translation:
  language: id
  text: Tanpa lembu, palungan bersih[a], tetapi hasil panen yang melimpah diperoleh berkat kekuatan lembu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kosong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵין
  choice: Tanpa
  rationale: Gabungan ב dengan אֵין menyatakan keadaan ketika sesuatu tidak ada. “Tanpa” ringkas, alami, dan mempertahankan bentuk pepatah.
- source_word: אֲלָפִים
  choice: lembu
  rationale: Bentuk jamak ini dapat menunjuk pada ternak sapi, khususnya hewan pekerja dalam konteks pertanian. Bahasa Indonesia lazim memakai bentuk nomina tanpa penanda jamak ketika maknanya umum.
- source_word: אֵבוּס
  choice: palungan
  rationale: Kata ini menunjuk pada tempat atau wadah pakan hewan. “Palungan” tepat, ringkas, dan sesuai dengan latar pertanian.
- source_word: בָּר
  choice: tetap bersih
  rationale: Dalam konteks ini kata tersebut menggambarkan palungan yang bersih atau tidak berantakan karena tidak ada lembu. “Tetap” membuat implikasi praktisnya alami dalam bahasa Indonesia tanpa mengubah pertentangan pepatah.
- source_word: וְרָב
  choice: tetapi ... yang melimpah
  rationale: וְ menyatakan pertentangan dalam susunan pepatah ini, sedangkan רָב berarti banyak atau berlimpah. “Tetapi” dan “yang melimpah” menyampaikan kontras secara alami.
- source_word: תְּבוּאוֹת
  choice: hasil panen
  rationale: Kata ini menunjuk pada hasil atau produksi pertanian. “Hasil panen” jelas bagi pembaca modern dan mempertahankan gambaran agraris.
- source_word: בְּכֹחַ
  choice: diperoleh berkat kekuatan
  rationale: Preposisi ב menandai sarana atau penyebab. “Berkat kekuatan” menyatakan bahwa tenaga lembu menghasilkan produktivitas, sementara “diperoleh” melengkapi kalimat Indonesia secara alami.
- source_word: שׁוֹר
  choice: lembu
  rationale: Bentuk tunggal ini dipakai secara generik untuk hewan sapi pekerja. “Lembu” mempertahankan hubungan leksikal dan gambaran tenaga pengolah lahan dengan klausa pertama.
