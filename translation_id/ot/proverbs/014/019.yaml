  yaml_path: translation/ot/proverbs/014/019.yaml
  text: The evil bow down before the good[b][a], and the wicked at the gates of the righteous.
translation:
  language: id
  text: 'Orang jahat sujud di hadapan orang baik[a],

    dan orang fasik sujud di gerbang orang benar.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “sujud” dapat berarti membungkuk sangat rendah atau meniarapkan diri di hadapan seseorang.
    reason: lexical_alternative
  - marker: b
    text: Berada di gerbang orang benar dapat menyiratkan ketergantungan, permohonan, atau pengakuan terhadap kedudukannya, tetapi maksud itu tidak dinyatakan secara eksplisit.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁחוּ (שׁחה)
  choice: sujud
  rationale: Kata kerja ini menggambarkan membungkuk sangat rendah atau merebahkan diri. “Sujud” mempertahankan kuatnya gambaran perendahan diri, tanpa memastikan apakah tindakan itu sukarela atau terpaksa.
- source_word: רָעִים
  choice: orang jahat
  rationale: Kata sifat jamak ini dipakai sebagai nomina untuk menyebut orang-orang yang jahat. Ungkapan ini alami dalam bahasa Indonesia dan tetap bersifat umum seperti pepatah Ibrani.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Preposisi ini berarti berada di depan atau dalam kehadiran seseorang; “di hadapan” sesuai dengan adegan bersujud.
- source_word: טוֹבִים
  choice: orang baik
  rationale: Kata sifat jamak substantival ini merujuk kepada orang-orang baik dan mempertahankan pertentangan langsung dengan “orang jahat”.
- source_word: וּרְשָׁעִים
  choice: dan orang fasik
  rationale: Dalam sastra hikmat, istilah ini lazim menunjuk kepada orang yang bersalah atau hidup dalam kefasikan. “Orang fasik” mempertahankan bobot moral istilah sumber.
- source_word: עַל
  choice: berada di
  rationale: Dengan “gerbang”, preposisi ini menunjukkan lokasi, yakni di atau dekat gerbang. Penambahan “berada” menghasilkan klausa Indonesia yang lengkap tanpa menentukan lebih jauh tujuan kedatangan mereka.
- source_word: שַׁעֲרֵי
  choice: gerbang
  rationale: Bentuk sumber secara harfiah jamak dalam konstruksi, tetapi ungkapan Indonesia “di gerbang” lebih alami untuk tempat masuk kediaman atau kawasan seseorang. Makna spasial dan sosialnya dipertahankan.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Kata sifat tunggal substantival ini menunjuk kepada seorang yang benar sebagai tipe representatif; “orang benar” merupakan padanan yang jelas dan lazim dalam sastra hikmat.
theological_decisions:
- issue: Sifat ketundukan orang jahat
  choice: Tidak menentukan apakah sujud itu sukarela atau terpaksa
  alternative: Menafsirkan tindakan itu sebagai permohonan sukarela atau penaklukan yang dipaksakan
  rationale: Bentuk Ibrani menyatakan tindakan merendahkan diri, tetapi konteks ayat tidak menjelaskan penyebab atau kadar kesukarelaannya.
- issue: Makna orang fasik di gerbang orang benar
  choice: Mempertahankan gambaran lokasi tanpa menjelaskan maksud kedatangan
  alternative: Menambahkan bahwa mereka datang memohon, bergantung, atau mengakui kedudukan orang benar
  rationale: Nuansa tersebut mungkin tersirat secara budaya, tetapi tidak dinyatakan secara eksplisit dalam teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas dan bermartabat. Paralelisme antitetis dipertahankan dalam dua baris. “Orang jahat/orang baik” dipilih untuk kejelasan umum, sedangkan “orang fasik/orang benar” mempertahankan kosakata moral khas sastra hikmat.
