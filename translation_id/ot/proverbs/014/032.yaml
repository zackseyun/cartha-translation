  text: בְּֽ֭/רָעָת/וֹ יִדָּחֶ֣ה רָשָׁ֑ע וְ/חֹסֶ֖ה בְ/מוֹת֣/וֹ צַדִּֽיק׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/032.yaml
  text: By his evil the wicked is driven away[c][b][a], but the righteous finds refuge in his death.
translation:
  language: id
  text: Oleh kejahatannya, orang fasik dihalau[a], tetapi orang benar mendapat perlindungan dalam kematiannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dalam malapetakanya, orang fasik dihalau.” Kata Ibrani yang diterjemahkan “kejahatannya” juga dapat berarti “malapetakanya” atau “bencananya”.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dalam kematiannya”; dapat juga dipahami “pada saat kematiannya” atau “ketika ia mati”. Sebagian terjemahan menafsirkannya sebagai “mempunyai harapan pada saat kematiannya”, tetapi kata “harapan” tidak disebutkan secara langsung dalam bahasa Ibrani.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרָעָתוֹ
  choice: Karena kejahatannya
  rationale: רָעָה dapat berarti kejahatan moral atau malapetaka. Dalam pertentangan antara orang fasik dan orang benar, makna moral cocok; בְּ dipahami sebagai penanda sebab. Alternatif berupa malapetaka tetap dicatat.
- source_word: יִדָּחֶה
  choice: tersingkir
  rationale: Bentuk pasif ini menyatakan bahwa orang fasik didorong keluar, dijatuhkan, atau disingkirkan. 'Tersingkir' mempertahankan nuansa pasif dan keluasan maknanya dalam bahasa Indonesia yang alami.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Adjektiva tunggal yang digunakan sebagai nomina menunjuk pada tipe orang dalam amsal. 'Orang fasik' adalah padanan Indonesia yang wajar dan mempertahankan pertentangan etis ayat ini.
- source_word: וְחֹסֶה
  choice: tetapi ... berlindung
  rationale: חסה berarti mencari atau mendapatkan perlindungan. 'Berlindung' mempertahankan bentuk aktif-partisipial tanpa menambahkan objek perlindungan yang tidak disebutkan dalam teks.
- source_word: בְמוֹתוֹ
  choice: dalam kematiannya
  rationale: Terjemahan ini mengikuti bentuk ringkas bahasa Ibrani secara dekat dan tidak membatasi relasinya hanya pada waktu kematian. Alternatif temporal dijelaskan dalam catatan kaki.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva substantival ini menunjuk pada orang benar sebagai tipe dalam amsal; padanan ini alami dalam bahasa Indonesia dan sejajar dengan 'orang fasik'.
theological_decisions:
- issue: Apakah klausa kedua menyatakan keyakinan sesudah kematian atau hanya perlindungan pada saat kematian
  choice: Mempertahankan ungkapan 'berlindung dalam kematiannya' tanpa menambahkan 'harapan'.
  alternative: Orang benar aman ketika ia mati; orang benar mempunyai harapan pada saat kematiannya.
  rationale: Teks Ibrani tidak secara eksplisit menyebut harapan dan tidak menjelaskan sifat perlindungan itu. Rumusan utama mempertahankan ketegangan teologis dan ambiguitas asli.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada hikmat. Struktur antitesis dipertahankan. Ungkapan sulit pada klausa kedua sengaja tidak diperjelas secara berlebihan agar ambiguitas sumber tetap terjaga.
