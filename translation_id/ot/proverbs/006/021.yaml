  yaml_path: translation/ot/proverbs/006/021.yaml
  text: Bind them on your heart continually[b][a]; tie them around your neck.
translation:
  language: id
  text: Ikatkanlah semuanya itu pada hatimu senantiasa; kalungkanlah semuanya itu pada lehermu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָשְׁרֵם
  choice: Ikatkanlah semuanya itu
  rationale: Imperatif Qal dengan sufiks objek jamak memerintahkan agar ajaran yang disebut sebelumnya diikatkan. Bentuk ini mempertahankan citra konkret teks Ibrani.
- source_word: לִבְּךָ
  choice: pada hatimu
  rationale: לֵב menunjuk pada batin, termasuk pikiran dan kehendak; 'hati' mempertahankan antropologi dan citra Ibrani secara wajar dalam bahasa Indonesia.
- source_word: תָמִיד
  choice: senantiasa
  rationale: Adverbia ini menyatakan keberlangsungan atau kebiasaan yang tetap. 'Senantiasa' alami, ringkas, dan sesuai dengan register hikmat yang bermartabat.
- source_word: עָנְדֵם
  choice: kalungkanlah semuanya itu
  rationale: Verba ענד berarti memasang atau mengenakan sesuatu seperti perhiasan. Dalam hubungan dengan leher, 'kalungkanlah' menyampaikan tindakan tersebut secara alami dan membedakannya dari verba pertama.
- source_word: גַּרְגְּרֹתֶךָ
  choice: lehermu
  rationale: Walaupun dapat menunjuk pada daerah tenggorokan, dalam idiom tentang sesuatu yang dikenakan, 'leher' adalah padanan kontekstual yang paling alami.
