  edition: WLC
  text: בְּ/הִתְהַלֶּכְ/ךָ֨ תַּנְחֶ֬ה אֹתָ֗/ךְ בְּֽ֭/שָׁכְבְּ/ךָ תִּשְׁמֹ֣ר עָלֶ֑י/ךָ וַ֝/הֲקִיצ֗וֹתָ הִ֣יא תְשִׂיחֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/022.yaml
  text: When you walk[a], it will guide you; when you lie down, it will watch over you; and when you awake, it will speak with you.
translation:
  language: id
  text: Ketika engkau berjalan, ia[a] akan menuntunmu; ketika engkau berbaring, ia akan menjagamu; dan ketika engkau bangun, ia akan berbicara denganmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata ganti dalam bahasa Ibrani berbentuk feminin dan merujuk pada perintah atau ajaran dalam konteks. Bahasa Indonesia tidak membedakan gender dalam kata ganti “ia”.
    reason: Menjelaskan personifikasi dan ciri gramatikal Ibrani yang tidak dapat ditampilkan secara langsung dalam bahasa Indonesia.
lexical_decisions:
- source_word: בְּהִתְהַלֶּכְךָ
  choice: ketika engkau berjalan
  rationale: Preposisi ב dengan infinitif konstruk hitpael dari הלך dan sufiks orang kedua maskulin tunggal menyatakan waktu. Bentuknya dapat mencakup kegiatan atau perjalanan hidup, tetapi kesejajarannya dengan berbaring dan terbangun mendukung terjemahan alami ini.
- source_word: תַּנְחֶה אֹתָךְ
  choice: akan menuntunmu
  rationale: Bentuk Hifil dari נחה berarti memimpin atau menuntun. “Menuntun” alami dalam bahasa Indonesia dan sesuai dengan gambaran ajaran yang mengarahkan jalan hidup.
- source_word: בְּשָׁכְבְּךָ
  choice: ketika engkau berbaring
  rationale: Preposisi temporal ב dengan infinitif konstruk שכב menunjuk pada tindakan berbaring, bukan hanya keadaan tidur.
- source_word: תִּשְׁמֹר עָלֶיךָ
  choice: akan menjagamu
  rationale: שׁמר dengan עַל menyampaikan makna menjaga atau melindungi seseorang.
- source_word: וַהֲקִיצוֹתָ
  choice: ketika engkau terbangun
  rationale: Bentuk dari יקץ/קיץ berarti bangun atau terjaga. Dalam rangkaian ini, bentuk tersebut berfungsi sebagai penanda waktu yang sejajar dengan dua anak kalimat sebelumnya.
- source_word: הִיא
  choice: ia
  rationale: Kata ganti feminin tunggal merujuk pada perintah atau ajaran dalam konteks. “Ia” mempertahankan personifikasi dan tetap wajar dalam bahasa Indonesia, meskipun bahasa Indonesia tidak menandai gender pada kata ganti.
- source_word: תְשִׂיחֶךָ
  choice: akan berbicara denganmu
  rationale: שׂיח dapat berarti berbicara, bercakap, atau merenung. Dengan subjek feminin dan objek orang kedua tunggal di sini, “berbicara denganmu” paling baik mempertahankan nuansa komunikasi yang menyertai dan membimbing.
theological_decisions:
- issue: Personifikasi perintah atau ajaran sebagai subjek feminin
  choice: Memakai “ia” dalam teks utama dan menjelaskan bentuk feminin Ibrani dalam catatan kaki
  alternative: Memakai “ajaran itu”, yang lebih eksplisit tetapi mengurangi personifikasi; atau “dia”, yang juga tidak menunjukkan gender dalam bahasa Indonesia
  rationale: Teks Ibrani secara eksplisit memakai kata ganti feminin dan konteks Amsal sering mempersonifikasikan hikmat atau ajaran. “Ia” mempertahankan daya personifikasi tanpa menentukan bahwa yang dimaksud adalah tokoh tersendiri atau memasukkan tafsiran teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. “Engkau” dipilih agar sapaan hikmat orang tua kepada anak tetap personal dan bermartabat. Tiga anak kalimat paralel dipertahankan untuk mencerminkan irama teks Ibrani.
