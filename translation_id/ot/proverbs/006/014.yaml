  register: Bahasa Indonesia baku, modern, dan ringkas dengan kesejajaran tiga klausa yang mengikuti susunan pepatah Ibrani. Tanda titik koma mempertahankan irama serta hubungan antarklausa. Penanda catatan kaki ditempatkan pada frasa yang dijelaskannya.
