  text: Perversity is in his heart[a]; he devises evil at all times; he sends out strife.
translation:
  language: id
  text: Kelicikan ada dalam hatinya; ia merancang kejahatan setiap saat; ia menebarkan perselisihan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ia menimbulkan perselisihan.” Secara harfiah, bahasa Ibrani berbunyi “ia mengirimkan perselisihan,” suatu ungkapan yang berarti menyebabkan atau menyebarkan konflik.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּהְפֻּכוֹת
  choice: kelicikan
  rationale: Kata benda jamak abstrak ini menunjuk pada watak atau hal-hal yang bengkok dan menyimpang secara moral. “Kelicikan” menyampaikan sifat batin yang menyimpang dengan bahasa Indonesia yang alami.
- source_word: בְּלִבּוֹ
  choice: ada dalam hatinya
  rationale: Frasa preposisional ini berfungsi sebagai predikat dalam klausa tanpa verba. “Ada dalam hatinya” mempertahankan gambaran tentang kecenderungan batin.
- source_word: חֹרֵשׁ רָע
  choice: ia merancang kejahatan
  rationale: Walaupun חֹרֵשׁ secara harfiah berkaitan dengan membajak atau mengukir, dalam konteks sastra hikmat kata ini berarti merancang atau merencanakan. Pilihan ini mempertahankan unsur kesengajaan.
- source_word: בְּכָל עֵת
  choice: setiap saat
  rationale: Frasa ini menyatakan tindakan yang terus-menerus atau menjadi kebiasaan. “Setiap saat” dekat dengan bentuk Ibrani dan wajar dalam bahasa Indonesia.
- source_word: מְדָנִים
  choice: perselisihan
  rationale: Bentuk jamak ini mengacu pada pertikaian atau konflik. “Perselisihan” jelas, umum, dan dapat mencakup konflik yang berulang.
- source_word: יְשַׁלֵּחַ
  choice: ia menebarkan
  rationale: Bentuk Piel dari שלח berarti mengirimkan atau melepaskan ke luar. “Menebarkan” mempertahankan gambaran penyebaran konflik sekaligus terdengar alami dengan objek “perselisihan”.
