  yaml_path: translation/ot/proverbs/006/033.yaml
  text: He will find injury and disgrace[b][a], and his reproach will not be wiped away.
translation:
  language: id
  text: Ia akan mendapat luka dan kehinaan[a], dan aibnya tidak akan terhapus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pukulan dan kehinaan”; kata Ibrani pertama dapat berarti pukulan, luka, atau penderitaan.
    reason: lexical_alternative
  - marker: b
    text: Atau “cela yang menimpanya tidak akan dihapus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: luka
  rationale: Kata ini dapat menunjuk pada pukulan, luka, atau penderitaan. “Luka” mempertahankan gambaran akibat yang konkret tanpa membatasinya pada penyakit.
- source_word: קָלוֹן
  choice: kehinaan
  rationale: Kata ini menyatakan hilangnya kehormatan dan rasa malu di hadapan umum. “Kehinaan” alami dalam bahasa Indonesia dan cocok dipasangkan dengan “luka”.
- source_word: יִמְצָא
  choice: akan mendapat
  rationale: Secara harfiah berarti “akan menemukan”, tetapi dalam konteks ini menunjuk pada akibat yang menimpa seseorang. “Akan mendapat” menyampaikan idiom tersebut dengan wajar.
- source_word: חֶרְפָּתוֹ
  choice: aibnya
  rationale: Kata ini dapat berarti cela, cercaan, atau kehinaan yang melekat pada seseorang. “Aibnya” menonjolkan noda sosial yang terus diingat orang lain.
- source_word: לֹא תִמָּחֶה
  choice: tidak akan terhapus
  rationale: Bentuk ini berarti tidak dihapus, dilenyapkan, atau disingkirkan. “Tidak akan terhapus” mempertahankan metafora Ibrani dan menegaskan sifat aib itu yang menetap.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas dan bernada hikmat. Terjemahan mempertahankan kesejajaran antara kerugian konkret (“luka”) dan kerugian sosial (“kehinaan”, “aib”) tanpa mempersempit akibatnya.
