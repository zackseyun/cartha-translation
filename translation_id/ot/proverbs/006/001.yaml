  yaml_path: translation/ot/proverbs/006/001.yaml
  text: My son[a], if you have gone surety for your neighbor, if you have struck your hands in pledge to a stranger[b],
translation:
  language: id
  text: Anakku, jika engkau telah menjadi penjamin bagi sesamamu[a], jika engkau telah menepukkan telapak tanganmu kepada orang asing[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagi temanmu” atau “bagi rekanmu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “telah menepukkan telapak tanganmu kepada orang asing.” Tindakan ini merupakan cara untuk mengesahkan suatu janji atau jaminan.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנִי
  choice: Anakku
  rationale: Sapaan tunggal seorang ayah atau guru kepada anak laki-laki; “Anakku” alami, ringkas, dan mempertahankan hubungan yang dinyatakan teks.
- source_word: אִם
  choice: jika
  rationale: Memperkenalkan keadaan bersyarat. Kata ini diulang pada anak kalimat kedua agar susunan kalimat Indonesia jelas, sebagaimana hubungan antarbagiannya.
- source_word: עָרַבְתָּ
  choice: telah menjadi penjamin
  rationale: Dalam konteks ini verba tersebut berarti menanggung utang atau kewajiban orang lain sebagai penjamin. Pilihan ini menyampaikan nuansa hukum-keuangan secara jelas.
- source_word: לְרֵעֶךָ
  choice: bagi sesamamu
  rationale: רֵעַ dapat berarti teman, rekan, tetangga, atau sesama. “Sesamamu” mempertahankan keluasan maknanya tanpa mengharuskan hubungan persahabatan dekat.
- source_word: תָּקַעְתָּ ... כַּפֶּיךָ
  choice: telah mengikat janji dengan berjabat tangan
  rationale: Ungkapan harfiahnya menggambarkan menepukkan atau menggenggam tangan sebagai tindakan yang mengesahkan suatu jaminan. Terjemahan ini mempertahankan tindakan tangan sekaligus menjelaskan fungsinya bagi pembaca modern.
- source_word: לַזָּר
  choice: dengan orang asing
  rationale: זָר menunjuk kepada orang asing atau orang luar. Preposisi diterjemahkan secara idiomatis sesuai tindakan berjabat tangan, tanpa menghilangkan identitas pihak tersebut sebagai orang asing.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Istilah “penjamin” mempertahankan konteks hukum-keuangan, sedangkan ungkapan berjabat tangan menyampaikan kebiasaan kuno secara alami. Tanda koma pada akhir ayat dipertahankan karena kalimat bersyarat berlanjut ke ayat berikutnya.
