  text: אָדָ֣ם בְּ֭לִיַּעַל אִ֣ישׁ אָ֑וֶן ה֝וֹלֵ֗ךְ עִקְּשׁ֥וּת פֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/012.yaml
  text: A worthless man[a], a man of wickedness, walks with a perverse mouth.
translation:
  language: id
  text: Seorang yang tak berguna, seorang yang jahat, berjalan dengan tutur kata yang menyimpang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan kebengkokan mulut”; dapat juga diterjemahkan, “dengan mulut yang bengkok.”
    reason: Ungkapan Ibrani memakai citra konkret mulut untuk menunjuk pada tutur kata yang menyimpang atau serong.
lexical_decisions:
- source_word: אָדָם
  choice: orang
  rationale: Menunjuk kepada seorang individu sebagai contoh dalam sastra hikmat. “Orang” alami dalam bahasa Indonesia modern dan tidak mengubahnya menjadi pernyataan tentang umat manusia secara umum.
- source_word: בְּלִיַּעַל
  choice: tak berguna
  rationale: Dalam konstruksi ini kata tersebut mencirikan keburukan atau ketidakberhargaan moral; transliterasi “Belial” dapat keliru dipahami sebagai nama diri.
- source_word: אִישׁ
  choice: orang
  rationale: Diungkapkan sebagai “orang” dalam frasa “orang jahat” agar paralelisme dengan אָדָם tetap jelas dan kalimat tetap alami.
- source_word: אָוֶן
  choice: jahat
  rationale: Kata ini di sini menyatakan watak moral yang buruk. Bentuk adjektival “jahat” merupakan padanan alami bagi konstruksi Ibrani “orang kejahatan”.
- source_word: הוֹלֵךְ
  choice: berkeliaran
  rationale: Partisip ini dapat berarti berjalan atau pergi ke sana kemari. “Berkeliaran” mempertahankan gambaran gerak dan cocok dengan penggambaran perilaku orang tersebut.
- source_word: עִקְּשׁוּת פֶּה
  choice: mengucapkan perkataan yang menyimpang
  rationale: Ungkapan harfiahnya menggambarkan kebengkokan mulut, yakni perkataan yang menyimpang secara moral. Terjemahan utama menyampaikan maksud itu secara alami, sementara citra konkretnya dicatat dalam catatan kaki.
