  text: which has no chief[a], officer, or ruler,
translation:
  language: id
  text: yang tidak mempunyai pemimpin[a], pejabat, ataupun penguasa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepala, pengawas, ataupun penguasa.”
    reason: Alternatif ini mempertahankan kemungkinan arti קָצִין sebagai “kepala” dan nuansa pengawasan yang mungkin pada שֹׁטֵר, sementara teks utama memakai “pejabat” sebagai padanan yang lebih netral bagi fungsi administratifnya.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang
  rationale: Memperkenalkan klausa relatif yang menerangkan semut pada ayat sebelumnya; “yang” merupakan padanan alami dalam bahasa Indonesia.
- source_word: אֵין לָהּ
  choice: tidak mempunyai
  rationale: 'Konstruksi eksistensial dengan ל dan sufiks pronominal secara alami menyatakan kepemilikan: semut itu tidak mempunyai otoritas-otoritas yang disebutkan.'
- source_word: קָצִין
  choice: pemimpin
  rationale: קָצִין menunjuk kepada seorang kepala atau pemimpin. “Pemimpin” jelas bagi pembaca modern dan tetap dibedakan dari מֹשֵׁל, “penguasa”.
- source_word: שֹׁטֵר
  choice: pengawas
  rationale: שֹׁטֵר dapat menunjuk kepada pejabat yang menjalankan fungsi administratif atau pengawasan. “Pengawas” sesuai dengan konteks kerja semut dan tidak menyamakan istilah ini dengan pemimpin atau penguasa.
- source_word: וּמֹשֵׁל
  choice: ataupun penguasa
  rationale: מֹשֵׁל berarti orang yang memerintah. Dalam rangkaian yang dinafikan, waw diterjemahkan secara idiomatis sebagai “ataupun” untuk menunjukkan bahwa semut tidak mempunyai satu pun dari ketiga jenis otoritas tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Bentuk feminin pada לָהּ tidak ditandai secara gramatikal dalam bahasa Indonesia; acuannya tetap jelas dari semut pada ayat sebelumnya.
