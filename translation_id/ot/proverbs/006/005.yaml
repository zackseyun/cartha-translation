  text: Rescue yourself like a gazelle from the hand[c][b][a], and like a bird from the hand of the fowler.
translation:
  language: id
  text: Selamatkanlah dirimu[a] seperti kijang[b] dari tangan, dan seperti burung dari tangan penjerat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Bebaskanlah dirimu” atau “Luputlah.” Bentuk perintah Ibraninya menyatakan desakan untuk segera membebaskan diri.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibraninya dapat merujuk pada “gazel,” “rusa,” atau secara tradisional “kijang.”
    reason: lexical_alternative
  - marker: c
    text: Penjerat adalah orang yang memasang jerat atau perangkap. Pada baris pertama, teks Ibrani hanya berbunyi “dari tangan”; pelakunya tidak disebutkan.
    reason: textual_clarity
lexical_decisions:
- source_word: הִנָּצֵל
  choice: Lepaskanlah dirimu
  rationale: Bentuk perintah Nifal orang kedua tunggal maskulin dari נצל di sini mendesak orang yang disapa agar membebaskan dirinya dari bahaya. Pilihan ini mempertahankan daya perintah dan nuansa refleksifnya.
- source_word: כִּצְבִי
  choice: seperti kijang
  rationale: צְבִי lazim menunjuk pada gazel atau kijang, dan prefiks כ menyatakan perbandingan. “Kijang” merupakan padanan Indonesia yang alami dan mudah dipahami dalam gambaran ini.
- source_word: מִיָּד
  choice: dari tangan
  rationale: יָד secara harfiah berarti “tangan” dan secara kiasan dapat berarti kuasa atau cengkeraman. Terjemahan harfiah mempertahankan gambaran konkret serta kesejajaran kedua baris.
- source_word: וּכְצִפּוֹר
  choice: dan seperti burung
  rationale: צִפּוֹר adalah sebutan umum bagi burung dan tidak cukup khusus untuk diterjemahkan sebagai jenis burung tertentu.
- source_word: מִיַּד יָקוּשׁ
  choice: dari tangan pemikat burung
  rationale: יָקוּשׁ menunjuk kepada orang yang memasang jerat. Karena mangsanya dalam konteks ini adalah burung, “pemikat burung” menyampaikan pelaku yang dimaksud secara alami tanpa mengubahnya menjadi alat berupa jerat.
