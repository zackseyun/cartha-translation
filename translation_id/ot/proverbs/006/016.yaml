  text: שֶׁשׁ הֵ֭נָּה שָׂנֵ֣א יְהוָ֑ה וְ֝/שֶׁ֗בַע תועבות נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/016.yaml
  text: 'There are six things that Yahweh hates[a], seven that are an abomination to him:'
translation:
  language: id
  text: Ada enam hal yang dibenci Yahweh, bahkan tujuh yang menjadi kekejian bagi-Nya:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tujuh kekejian bagi jiwa-Nya,” yaitu tujuh hal yang sangat menjijikkan bagi-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁשׁ הֵנָּה
  choice: Ada enam hal
  rationale: Ungkapan Ibrani secara harfiah berarti kira-kira 'enam, inilah semuanya'; dalam pepatah bilangan, bahasa Indonesia alami memakai konstruksi eksistensial 'ada enam hal'.
- source_word: שָׂנֵא
  choice: dibenci
  rationale: Mempertahankan daya langsung verba yang menyatakan kebencian atau penolakan kuat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagaimana terdapat dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: וְשֶׁבַע
  choice: bahkan tujuh
  rationale: Menandai pola bilangan x/x+1 dalam puisi hikmat; 'bahkan' mengungkapkan peningkatan retoris tanpa menjadikannya pertentangan jumlah.
- source_word: תועבות
  choice: yang menjijikkan
  rationale: Bentuk jamak menunjuk pada hal-hal yang sangat dibenci atau dianggap keji; klausa relatif ini terdengar alami setelah angka tujuh.
- source_word: נַפְשׁוֹ
  choice: bagi-Nya
  rationale: Nefesy di sini secara idiomatis menunjuk pada diri atau pribadi Yahweh, sehingga 'bagi-Nya' menyampaikan makna tanpa memaksakan antropologi tubuh-jiwa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung; bentuk 'Yahweh' mempertahankan nama pribadi itu.
- issue: Ungkapan antropomorfis תועבות נפשו
  choice: yang menjijikkan bagi-Nya
  alternative: kekejian bagi jiwa-Nya; yang dibenci oleh jiwa-Nya
  rationale: Terjemahan utama menyampaikan nefesy sebagai diri pribadi, sedangkan bentuk harfiahnya dicatat agar citra bahasa sumber tetap dapat diperiksa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pepatah bilangan dipertahankan dengan 'enam ... bahkan tujuh', dan ungkapan idiomatis Ibrani dibuat jelas tanpa menghilangkan bentuk harfiahnya dari catatan kaki.
