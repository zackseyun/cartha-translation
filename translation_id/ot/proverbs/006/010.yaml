  text: A little sleep[a], a little slumber, a little folding of the hands to lie down—
translation:
  language: id
  text: Sedikit tidur, sedikit terlelap, sedikit melipat tangan untuk berbaring—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְעַט
  choice: sedikit
  rationale: Diulang tiga kali untuk mempertahankan irama retoris yang ringkas dan bernada pepatah.
- source_word: שֵׁנוֹת
  choice: tidur
  rationale: Walaupun bentuk Ibraninya secara gramatikal jamak, bahasa Indonesia secara alami memakai nomina tanpa penandaan jamak dalam ungkapan ini.
- source_word: תְּנוּמוֹת
  choice: terlelap
  rationale: Membedakannya dari 'tidur' sambil mempertahankan paralelisme puitis dan gagasan tidur ringan atau singkat.
- source_word: חִבֻּק יָדַיִם
  choice: melipat tangan
  rationale: Secara harfiah menggambarkan 'pelukan/rangkulan tangan'; dalam konteks ini, 'melipat tangan' menyampaikan sikap beristirahat atau bermalas-malasan dengan wajar dalam bahasa Indonesia.
- source_word: לִשְׁכָּב
  choice: untuk berbaring
  rationale: Mempertahankan arti infinitif 'berbaring' dan tidak meleburkannya dengan kosakata tidur yang telah muncul sebelumnya.
