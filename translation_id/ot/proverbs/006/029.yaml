base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/029.yaml
  text: So is the one who goes in to his neighbor’s wife[b][a]; everyone who touches her will not go unpunished.
translation:
  language: id
  text: Demikianlah orang yang mendatangi istri sesamanya; setiap orang yang menyentuhnya[b] tidak akan luput dari hukuman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak akan dinyatakan bebas” atau “tidak akan dianggap tidak bersalah.”
    reason: lexical_alternative
  - marker: b
    text: “Menyentuhnya” di sini kemungkinan menunjuk pada kontak seksual terlarang, bukan sekadar sentuhan fisik yang tidak disengaja.
    reason: cultural_note
lexical_decisions:
- source_word: כֵּן
  choice: Demikianlah
  rationale: Menarik kesimpulan perbandingan dari gambaran pada ayat sebelumnya dengan ungkapan Indonesia yang wajar.
- source_word: הַבָּא
  choice: orang yang mendatangi
  rationale: Partisip berartikel berfungsi sebagai nomina. Dalam konteks perzinaan, “mendatangi” mempertahankan ungkapan halus sumber tanpa menjadikannya sekadar tindakan datang secara ruang maupun mengeksplisitkannya sebagai persetubuhan.
- source_word: אֶל אֵשֶׁת רֵעֵהוּ
  choice: istri sesamanya
  rationale: “Sesamanya” mempertahankan dimensi hubungan dan kewajiban etis dalam רֵעַ serta terdengar alami dalam bahasa Indonesia modern.
- source_word: לֹא יִנָּקֶה
  choice: tidak akan luput dari hukuman
  rationale: Bentuk Nifal dari נקה di sini menyatakan bahwa pelaku tidak akan lolos dari hukuman atau dinyatakan bebas; pilihan ini jelas dan alami.
- source_word: כָּל
  choice: setiap orang
  rationale: Menyampaikan cakupan distributif dan universal dari כָּל dengan jelas.
- source_word: הַנֹּגֵעַ בָּהּ
  choice: yang menyentuhnya
  rationale: Mempertahankan verba luas dan bersahaja “menyentuh” dari teks Ibrani, sementara konteks kemungkinan besar menunjuk pada kontak seksual terlarang.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada peribahasa. Ungkapan “mendatangi” dan “menyentuhnya” mempertahankan kesantunan serta keluasan retoris teks Ibrani tanpa mengaburkan konteks perzinaan.
