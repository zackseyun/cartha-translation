  text: it prepares its food in summer[b][a]; it gathers its provisions at harvest.
translation:
  language: id
  text: Ia menyiapkan makanannya[a] pada musim panas dan mengumpulkan persediaannya pada musim panen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rotinya”; di sini kemungkinan berarti makanan atau bekalnya secara umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּכִין
  choice: menyiapkan
  rationale: Bentuk hifil dari כון di sini berarti membuat sesuatu siap; “menyiapkan” alami dalam konteks kerajinan semut.
- source_word: בַּקַּיִץ
  choice: pada musim panas
  rationale: Preposisi ב menandai waktu berlangsungnya tindakan.
- source_word: לַחְמָהּ
  choice: makanannya
  rationale: לֶחֶם secara harfiah dapat berarti “roti”, tetapi juga dipakai lebih luas untuk makanan atau nafkah; bagi semut, “makanan” menyampaikan maksudnya secara wajar.
- source_word: אָגְרָה
  choice: mengumpulkan
  rationale: אגר menunjuk pada tindakan menghimpun, dengan nuansa menyimpan yang tersirat dari konteks.
- source_word: בַּקָּצִיר
  choice: pada musim panen
  rationale: Frasa ini menunjuk pada masa panen; bentuk ini jelas dan alami dalam bahasa Indonesia.
- source_word: מַאֲכָלָהּ
  choice: persediaannya
  rationale: מַאֲכָל berarti sesuatu yang dimakan atau makanan. “Persediaan” mempertahankan variasi dari לַחְמָהּ dan menyampaikan bahwa makanan itu dihimpun untuk digunakan kemudian.
