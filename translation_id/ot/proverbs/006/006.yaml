  text: לֵֽךְ אֶל נְמָלָ֥ה עָצֵ֑ל רְאֵ֖ה דְרָכֶ֣י/הָ וַ/חֲכָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/006.yaml
  text: Go to the ant[a], you sluggard[b]; consider her ways and become wise.
translation:
  language: id
  text: Pergilah kepada semut, hai pemalas; perhatikanlah jalan-jalannya dan jadilah bijaksana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ אֶל
  choice: Pergilah kepada
  rationale: Imperatif Qal orang kedua tunggal maskulin dengan preposisi arah. Ungkapan ini mempertahankan desakan langsung dan terdengar wajar dalam bahasa Indonesia baku.
- source_word: נְמָלָה
  choice: semut
  rationale: Nomina tunggal dipakai sebagai contoh umum dari jenis semut. Bahasa Indonesia tidak memakai artikel, sehingga 'semut' secara alami dapat menyatakan anggota jenis secara generik.
- source_word: עָצֵל
  choice: hai pemalas
  rationale: Sapaan langsung kepada orang yang malas. 'Hai' menandai vokatif dengan jelas, sedangkan 'pemalas' mempertahankan teguran tajam tanpa membatasi rujukan pada laki-laki dalam terjemahan Indonesia.
- source_word: רְאֵה
  choice: perhatikanlah
  rationale: Secara dasar berarti 'lihatlah', tetapi dalam konteks sastra hikmat menunjuk pada pengamatan saksama untuk belajar. 'Perhatikanlah' mempertahankan unsur pengamatan sekaligus daya reflektifnya.
- source_word: דְרָכֶיהָ
  choice: jalan-jalannya
  rationale: Bentuk jamak 'jalan-jalan' dalam sastra hikmat menunjuk pada pola tindakan atau perilaku. Akhiran persona feminin Ibrani tidak perlu diberi gender dalam bahasa Indonesia; '-nya' mempertahankan rujukan kepada semut secara alami.
- source_word: וַחֲכָם
  choice: dan jadilah bijaksana
  rationale: Bentuk imperatif ini merupakan hasil yang diharapkan dari pengamatan. 'Jadilah bijaksana' mempertahankan perintah dan nuansa pencapaian hikmat, bukan sekadar keadaan statis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bernada hikmat. Partikel '-lah' mempertahankan gaya nasihat imperatif yang tegas namun wajar. Tidak diperlukan catatan kaki karena gender gramatikal semut dalam bahasa Ibrani tidak menimbulkan persoalan dalam bahasa Indonesia, dan pergeseran 'lihatlah' menjadi 'perhatikanlah' langsung mewakili fungsi kontekstual kata tersebut.
