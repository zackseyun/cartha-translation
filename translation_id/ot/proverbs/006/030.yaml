  text: לֹא יָב֣וּזוּ לַ֭/גַּנָּב כִּ֣י יִגְנ֑וֹב לְ/מַלֵּ֥א נַ֝פְשׁ֗/וֹ כִּ֣י יִרְעָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/030.yaml
  text: People do not despise a thief if he steals to satisfy himself when he is hungry[a][b].
translation:
  language: id
  text: Orang tidak memandang hina seorang pencuri jika ia mencuri untuk mengenyangkan dirinya ketika ia lapar.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk memuaskan nafsu makannya”; secara harfiah, “untuk memenuhi jiwa/diriya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “karena ia lapar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָב֣וּזוּ
  choice: meremehkan
  rationale: Kata בוז menyatakan sikap memandang hina atau rendah. Dalam konteks penilaian sosial, “meremehkan” alami dalam bahasa Indonesia dan tidak menyiratkan persetujuan terhadap pencurian.
- source_word: לַגַּנָּב
  choice: pencuri
  rationale: Walaupun bentuk Ibraninya memakai penanda definit, konteks amsal bersifat umum; bahasa Indonesia dapat memakai “pencuri” tanpa artikel untuk seorang wakil dari golongan tersebut.
- source_word: כִּי יִגְנ֑וֹב
  choice: yang mencuri
  rationale: כִּי memperkenalkan keadaan yang dimaksud. Klausa relatif “yang mencuri” mengungkapkan kasus pencuri yang sedang dinilai secara alami, tanpa memaksakan nuansa sebab.
- source_word: לְמַלֵּ֥א נַפְשׁוֹ
  choice: untuk mengenyangkan dirinya
  rationale: Secara harfiah berarti “untuk memenuhi diri/jiwanya.” Dalam konteks lapar, “mengenyangkan dirinya” menyampaikan pemenuhan kebutuhan makan sambil mempertahankan unsur refleksif.
- source_word: נַפְשׁוֹ
  choice: dirinya
  rationale: נֶפֶשׁ dapat berarti diri, nyawa, jiwa, atau selera makan. “Dirinya” menjaga keluasan ungkapan Ibrani; kemungkinan khusus “seleranya” dicatat dalam catatan kaki.
- source_word: כִּי יִרְעָב
  choice: ketika ia lapar
  rationale: Klausa ini dapat menunjukkan keadaan saat pencurian dilakukan atau alasannya. “Ketika ia lapar” mempertahankan pembacaan situasional, sementara pembacaan kausal dicatat sebagai alternatif.
theological_decisions:
- issue: Apakah amsal membenarkan pencurian karena lapar
  choice: Terjemahan mempertahankan pernyataan tentang penilaian sosial tanpa menambahkan bahasa pembenaran moral.
  alternative: Menambahkan bahwa pencurian tersebut dapat dibenarkan atau dimaafkan.
  rationale: Teks hanya menyatakan bahwa orang tidak memandang hina pencuri dalam keadaan ini; ayat berikutnya tetap menyebut kewajiban mengganti. Karena itu, terjemahan tidak boleh mengubah pengertian menjadi persetujuan etis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan ringkas mempertahankan gaya amsal. Semua penanda catatan kaki ditempatkan dalam teks utama.
