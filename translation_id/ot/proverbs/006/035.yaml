translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. Pronomina ‘ia’ dan ‘engkau’ menjaga alur nasihat hikmat serta rujukan orang ketiga dan kedua tunggal dalam bahasa sumber. Susunan kalimat mempertahankan ketegasan penolakan dan ambiguitas wajar pada לֹא יֹאבֶה.
