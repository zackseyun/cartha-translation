  text: He will accept no ransom[a] and will not be persuaded, no matter how large the bribe.
translation:
  language: id
  text: Ia tidak akan menerima uang tebusan apa pun[a] dan tidak akan dapat dibujuk, betapapun besar suap yang engkau berikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “uang ganti rugi.” Secara harfiah, bahasa Ibrani menyatakan bahwa ia tidak akan “mengangkat muka” terhadap uang tebusan apa pun, sebuah ungkapan yang di sini berarti menolak pembayaran yang dimaksudkan untuk memperoleh kelonggaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִשָּׂא פְּנֵי
  choice: tidak akan menerima
  rationale: Ungkapan harfiah ‘tidak akan mengangkat muka’ dalam konteks ini menyatakan penolakan untuk memberi kelonggaran dengan menerima pembayaran; ‘tidak akan menerima’ menyampaikan maksudnya secara alami.
- source_word: כָל כֹּפֶר
  choice: uang tebusan apa pun
  rationale: כֹּפֶר adalah pembayaran untuk membebaskan seseorang atau menghindarkan akibat. ‘Uang tebusan’ mempertahankan daya istilah itu, sedangkan kemungkinan arti yang lebih luas dicatat dalam catatan kaki.
- source_word: לֹא יֹאבֶה
  choice: tidak akan bersedia
  rationale: Kata kerja ini terutama menyatakan kemauan atau kesediaan. Terjemahan ini mempertahankan unsur volisional tanpa menggesernya menjadi kepuasan emosional atau secara khusus menafsirkan apa yang tidak bersedia ia lakukan.
- source_word: כִּי תַרְבֶּה שֹׁחַד
  choice: sekalipun engkau memperbesar suap
  rationale: Klausa ini bersifat konsesif; bentuk verba orang kedua tunggal dan nomina ‘suap’ yang tunggal dipertahankan. ‘Memperbesar suap’ menyampaikan peningkatan jumlah atau nilainya.
