translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bernada pepatah. Kesejajaran antara “kemiskinanmu” dan “kekuranganmu” dipertahankan, begitu pula dua gambaran tentang ancaman yang datang. Ambiguitas כִמְהַלֵּךְ tidak dipersempit menjadi “pengintai” dalam teks utama.
