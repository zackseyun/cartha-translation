translation:
  language: id
  text: maka kemiskinanmu akan datang seperti orang yang berkeliaran[a], dan kekuranganmu seperti seorang laki-laki bersenjata[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “seperti orang yang berjalan ke sana kemari”; mungkin juga, “seperti seorang pengembara” atau “seperti seorang gelandangan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, secara lebih harfiah, “seperti seorang laki-laki dengan perisai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: maka ... akan datang
  rationale: Bentuk perfektum dalam rangkaian pepatah ini menyatakan akibat yang akan terjadi; “maka” menghubungkannya secara alami dengan nasihat pada ayat sebelumnya.
- source_word: כִמְהַלֵּךְ
  choice: seperti orang yang berkeliaran
  rationale: Partisipel הלך dengan prefiks perbandingan menggambarkan seseorang yang berjalan ke sana kemari. Pilihan ini mempertahankan citra gerak tanpa memastikan bahwa tokoh itu pengintai, pengembara, atau gelandangan.
- source_word: רֵאשֶׁךָ
  choice: kemiskinanmu
  rationale: Nomina ini menunjuk pada kemelaratan atau keadaan miskin; “kemiskinan” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וּמַחְסֹרְךָ
  choice: dan kekuranganmu
  rationale: מַחְסוֹר berarti kekurangan atau kebutuhan yang tidak terpenuhi. “Kekurangan” menjaga kesejajaran ringkas dengan “kemiskinanmu”.
- source_word: כְּאִישׁ
  choice: seperti seorang
  rationale: Kata Ibrani menunjuk kepada seorang laki-laki dalam perumpamaan, tetapi dalam bahasa Indonesia nomina “seorang” dapat berdiri secara alami sebelum sifat “bersenjata” tanpa menambahkan unsur yang tidak diperlukan.
- source_word: מָגֵן
  choice: bersenjata
  rationale: Secara leksikal kata ini berarti “perisai”, sedangkan gabungan אִישׁ מָגֵן menggambarkan orang yang diperlengkapi dan mengancam. “Seorang bersenjata” menyampaikan daya ancam itu; bentuk yang lebih harfiah dicatat dalam catatan kaki.
