base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/003.yaml
  text: 'Do this[a], then, my son, and deliver yourself, for you have come into the palm of your neighbor: go, humble yourself[c][b], and press your plea with your neighbors.'
translation:
  language: id
  text: 'Maka lakukanlah ini, anakku, dan bebaskanlah dirimu, sebab engkau telah masuk ke dalam telapak tangan rekanmu[a]: pergilah, rendahkanlah dirimu[b], dan desaklah rekan-rekanmu[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke dalam telapak tangan rekanmu,” yaitu berada dalam kuasa atau kendalinya.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang jarang dipakai ini juga dapat berarti “menjatuhkan diri” atau “tundukkanlah dirimu.”
    reason: lexical_alternative
  - marker: c
    text: Teks Ibrani berbentuk jamak, “rekan-rekanmu,” meskipun banyak orang memahami maksudnya sebagai bentuk tunggal, “rekanmu,” selaras dengan frasa sebelumnya.
    reason: textual_variant
lexical_decisions:
- source_word: עֲשֵׂה זֹאת אֵפוֹא
  choice: Maka lakukanlah ini
  rationale: Imperatif dan partikel wacana diterjemahkan secara alami sebagai kesimpulan mendesak dari keadaan yang dijelaskan sebelumnya.
- source_word: בְּנִי
  choice: anakku
  rationale: Sapaan maskulin tunggal dalam sastra hikmat; bahasa Indonesia lazim memakai bentuk ini tanpa perlu menambahkan penanda gender.
- source_word: וְהִנָּצֵל
  choice: dan lepaskanlah dirimu
  rationale: Imperatif nifal menyampaikan tindakan membebaskan atau meluputkan diri dari keadaan yang mengikat.
- source_word: כִּי בָאתָ
  choice: sebab engkau telah masuk
  rationale: כִּי memberi alasan bagi perintah, sedangkan bentuk perfektif menunjukkan bahwa orang yang disapa sudah masuk ke dalam keadaan tersebut.
- source_word: בְכַף רֵעֶךָ
  choice: ke dalam telapak tangan rekanmu
  rationale: Mempertahankan citra konkret כַּף, ‘telapak tangan’, dan hubungan sosial yang dinyatakan oleh רֵעַ; arti idiomatisnya dijelaskan dalam catatan kaki.
- source_word: לֵךְ
  choice: pergilah
  rationale: Imperatif sederhana yang mengawali rangkaian tindakan mendesak.
- source_word: הִתְרַפֵּס
  choice: rendahkanlah dirimu
  rationale: Kata langka ini kemungkinan menyatakan tindakan merendahkan atau menundukkan diri di hadapan orang lain tanpa memastikan adanya gerakan fisik tertentu.
- source_word: וּרְהַב
  choice: dan desaklah
  rationale: Dalam konteks ini imperatif tersebut kemungkinan berarti mendesak atau memohon dengan sangat kuat. ‘Desaklah’ mempertahankan kekuatan tindakan tanpa menambahkan objek seperti ‘permohonan’ yang tidak tersurat.
- source_word: רֵעֶיךָ
  choice: rekan-rekanmu
  rationale: Bentuk teks Masoret adalah jamak dan dipertahankan dalam teks utama meskipun bentuk tunggal sebelumnya membuat bacaan ini sulit.
