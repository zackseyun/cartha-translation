  text: For jealousy is a man's fury, and he will show no mercy on the day of vengeance.
translation:
  language: id
  text: Sebab kecemburuan merupakan amarah seorang laki-laki, dan ia tidak akan berbelas kasih pada hari pembalasan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִנְאָה
  choice: kecemburuan
  rationale: Dalam konteks istri yang berzina dan suami yang dirugikan (ay. 32–35), kata ini menunjuk pada kecemburuan relasional, bukan sekadar iri hati.
- source_word: חֲמַת
  choice: membangkitkan amarah
  rationale: Nomina ini menyatakan murka atau amarah yang berkobar. Konstruksi Ibrani yang padat, secara harfiah kira-kira 'kecemburuan adalah amarah seorang laki-laki', diungkapkan secara alami dalam bahasa Indonesia tanpa mengurangi daya ungkapnya.
- source_word: גָּבֶר
  choice: seorang suami
  rationale: Secara leksikal berarti laki-laki atau pria, tetapi konteks perzinaan dan kecemburuan pasangan menunjukkan bahwa laki-laki yang dimaksud adalah suami yang dikhianati.
- source_word: יַחְמוֹל
  choice: akan berbelaskasihan
  rationale: Kata kerja ini berarti mengasihani, menyayangkan, atau menahan tindakan karena belas kasihan; bentuk negatifnya menegaskan bahwa ia tidak akan menunjukkan belas kasihan.
- source_word: בְּיוֹם נָקָם
  choice: pada hari pembalasan
  rationale: Ungkapan ini menunjuk pada saat pembalasan dilakukan, bukan harus berarti satu hari kalender tertentu.
theological_decisions:
- issue: Sifat 'pembalasan' dalam ayat ini
  choice: Mempertahankan 'pembalasan' sebagai tindakan suami yang dikhianati dalam gambaran hikmat ini
  alternative: Menafsirkan 'hari pembalasan' sebagai penghakiman ilahi atau sebagai persetujuan normatif atas balas dendam pribadi
  rationale: Konteks langsung membicarakan reaksi suami terhadap pezina. Ayat ini menggambarkan akibat berbahaya dari perzinaan, tanpa secara eksplisit menetapkan balas dendam pribadi sebagai perintah moral.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Suami' dipilih untuk menjernihkan rujukan kontekstual גָּבֶר, sementara intensitas חֲמַת dipertahankan melalui frasa 'membangkitkan amarah'.
