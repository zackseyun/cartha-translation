  yaml_path: translation/ot/proverbs/006/032.yaml
  text: He who commits adultery with a woman lacks sense[a]; he who does it destroys himself.
translation:
  language: id
  text: Orang yang berzina dengan seorang perempuan tidak berakal budi[a]; orang yang melakukannya membinasakan dirinya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "Orang yang berzina dengan seorang istri tidak berpengertian; siapa yang melakukannya menghancurkan hidupnya sendiri."
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹאֵף
  choice: berzina
  rationale: Partisipel ini menyatakan tindakan melakukan zina. Ungkapan verbal "berzina" alami, ringkas, dan mempertahankan sifat tindakannya.
- source_word: אִשָּׁה
  choice: dengan seorang perempuan
  rationale: Kata אִשָּׁה dapat berarti "perempuan" atau "istri". Pilihan utama mempertahankan arti yang lebih luas, sedangkan unsur perzinaannya sudah dinyatakan oleh verba; kemungkinan "istri" dicatat dalam catatan kaki.
- source_word: חֲסַר לֵב
  choice: tidak berakal budi
  rationale: Secara harfiah berarti "kekurangan hati", tetapi dalam sastra Amsal ungkapan ini menunjuk pada kurangnya pengertian dan pertimbangan yang bijaksana, bukan kurangnya emosi.
- source_word: מַשְׁחִית
  choice: membinasakan
  rationale: Bentuk Hifil menyatakan tindakan menyebabkan kehancuran. "Membinasakan" mempertahankan kekuatan dan keringkasan pernyataan Ibrani.
- source_word: נַפְשׁוֹ
  choice: dirinya sendiri
  rationale: נֶפֶשׁ di sini menunjuk pada diri atau kehidupan orang itu, bukan secara khusus jiwa yang terpisah dari tubuh. Bentuk refleksif ini paling alami dalam bahasa Indonesia.
- source_word: הוּא יַעֲשֶׂנָּה
  choice: orang yang melakukannya
  rationale: Pronomina yang ditekankan dan verba dengan sufiks feminin merujuk kembali pada tindakan zina. Terjemahan ini menyampaikan rujukan tersebut secara alami tanpa menambah penafsiran.
