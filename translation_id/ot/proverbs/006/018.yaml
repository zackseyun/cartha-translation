lexical_decisions:
- source_word: לֵב
  choice: hati
  rationale: Mempertahankan gambaran antropologis Ibrani tentang batin sebagai pusat pikiran dan niat; dalam bahasa Indonesia, 'hati' wajar dalam konteks moral ini.
- source_word: חֹרֵשׁ
  choice: merancang
  rationale: Dalam pemakaian kiasan ini, verba tersebut berarti menyusun atau merencanakan. 'Merancang' menyampaikan tindakan batin yang disengaja tanpa memperkuatnya secara berlebihan.
- source_word: מַחְשְׁבוֹת
  choice: rencana-rencana
  rationale: Nomina jamak ini dapat berarti pikiran, rancangan, atau rencana. 'Rencana-rencana' mempertahankan bentuk jamak dan menonjolkan unsur kesengajaan.
- source_word: אָוֶן
  choice: jahat
  rationale: Dalam konteks ini kata tersebut menunjukkan kebusukan moral yang mencirikan rencana-rencana itu. 'Jahat' alami dan tidak mengulang kata 'kejahatan' secara persis.
- source_word: רַגְלַיִם
  choice: kaki
  rationale: Gambaran anggota tubuh dipertahankan secara harfiah sebagai alat yang bergerak menuju kejahatan.
- source_word: מְמַהֲרוֹת
  choice: bergegas
  rationale: Partisip ini menyatakan ketergesaan dan kesiapan yang kuat. 'Bergegas' ringkas, alami, dan sesuai dengan gambaran gerak.
- source_word: לָרוּץ
  choice: lari
  rationale: Infinitif ini diterjemahkan langsung dan mempertahankan intensitas gerak dalam teks Ibrani.
- source_word: לָרָעָה
  choice: menuju kejahatan
  rationale: Frasa preposisional Ibrani secara harfiah menunjukkan arah menuju yang jahat. 'Menuju kejahatan' mempertahankan kekompakan dan tidak menambahkan gagasan verbal 'melakukan' yang tidak dinyatakan.
