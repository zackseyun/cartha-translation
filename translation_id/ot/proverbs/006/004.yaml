  text: אַל תִּתֵּ֣ן שֵׁנָ֣ה לְ/עֵינֶ֑י/ךָ וּ֝/תְנוּמָ֗ה לְ/עַפְעַפֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/004.yaml
  text: Do not give sleep to your eyes[a], nor slumber to your eyelids.
translation:
  language: id
  text: Jangan biarkan matamu tidur, dan jangan biarkan kelopak matamu terlelap.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengantuk” untuk “terlelap”. Kata Ibrani ini menggambarkan tidur ringan atau keadaan terangguk-angguk karena kantuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Jangan
  rationale: Dengan bentuk imperfek, אַל menyatakan larangan. “Jangan” adalah padanan imperatif negatif yang wajar tanpa menambahkan penekanan.
- source_word: תִּתֵּן
  choice: biarkan
  rationale: Secara harfiah berarti “memberikan”, tetapi dalam ungkapan ini bahasa Indonesia alami memakai “biarkan”. Pengulangan pada baris kedua memperjelas paralelisme.
- source_word: שֵׁנָה
  choice: tidur
  rationale: Kata ini secara umum berarti “tidur”; konteks tidak menuntut makna kiasan.
- source_word: לְעֵינֶיךָ
  choice: matamu
  rationale: Preposisi ל menandai penerima dalam ungkapan Ibrani “memberikan tidur kepada mata”. Dalam susunan Indonesia dengan “biarkan”, bentuk langsung “matamu” lebih alami.
- source_word: וּתְנוּמָה
  choice: dan jangan ... terlelap
  rationale: תְּנוּמָה menunjuk pada tidur ringan atau keadaan mulai tertidur. “Terlelap” mempertahankan perbedaan puitis dari “tidur”; larangan diulang agar hubungan koordinatif negatifnya jelas dalam bahasa Indonesia.
- source_word: לְעַפְעַפֶּיךָ
  choice: kelopak matamu
  rationale: עַפְעַף berarti “kelopak mata”. Pilihan ini langsung dan mempertahankan paralelisme anggota tubuh.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan puitis. Ungkapan harfiah Ibrani “memberikan tidur kepada mata” dialihkan menjadi “membiarkan mata tidur” agar alami, sedangkan paralelisme mata/kelopak mata dan tidur/terlelap tetap dipertahankan.
