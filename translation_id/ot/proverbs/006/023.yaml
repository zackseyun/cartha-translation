base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/023.yaml
  text: For the commandment is a lamp[a], and the instruction is light[b], and the reproofs of discipline are the way of life.
translation:
  language: id
  text: Sebab perintah itu adalah pelita, dan ajaran itu adalah terang, dan teguran yang mendisiplinkan adalah jalan kehidupan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “teguran-teguran disiplin adalah jalan kehidupan.” Ungkapan Ibrani ini menggabungkan teguran atau koreksi verbal dengan disiplin yang membentuk seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi nasihat sebelumnya; “sebab” menyatakan hubungan penjelas secara alami.
- source_word: נֵר
  choice: pelita
  rationale: Menunjuk pada benda konkret yang memancarkan cahaya, bukan cahaya secara abstrak, sehingga kesejajarannya dengan אוֹר tetap terpelihara.
- source_word: מִצְוָה
  choice: perintah
  rationale: Menyampaikan tuntutan yang berwibawa dan mengikat dalam konteks didikan orang tua, dengan bahasa Indonesia yang wajar.
- source_word: תּוֹרָה
  choice: ajaran
  rationale: Dalam konteks sastra hikmat, istilah ini menunjuk pada pengajaran yang berwibawa dan tidak harus secara khusus berarti hukum Musa.
- source_word: אוֹר
  choice: terang
  rationale: Mempertahankan gambaran penerangan dan bimbingan serta membentuk pasangan puitis dengan “pelita”.
- source_word: דֶרֶךְ חַיִּים
  choice: jalan kehidupan
  rationale: Mempertahankan metafora jalan dan kemungkinan makna suatu jalan yang bercirikan kehidupan maupun yang menuntun kepada kehidupan.
- source_word: תּוֹכְחוֹת מוּסָר
  choice: teguran yang mendidik
  rationale: Mengungkapkan secara alami gabungan teguran verbal dan disiplin formatif tanpa menghasilkan frasa Indonesia yang kaku.
theological_decisions:
- issue: Makna תּוֹרָה dalam sastra hikmat
  choice: ajaran
  alternative: hukum; pengajaran
  rationale: “Ajaran” sesuai dengan konteks didikan hikmat dan mempertahankan kewibawaannya tanpa mempersempit rujukannya secara tidak perlu kepada Taurat Musa.
- issue: Arah makna דֶרֶךְ חַיִּים
  choice: jalan kehidupan
  alternative: jalan menuju kehidupan
  rationale: 'Bentuk ini mempertahankan ambiguitas konstruksi Ibrani: jalan tersebut dapat dipahami sebagai jalan yang menghasilkan kehidupan atau sebagai cara hidup yang sejati.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Paralelisme puitis “pelita/terang” dipertahankan; “teguran yang mendidik” dipilih agar gabungan gagasan koreksi dan pembentukan terdengar alami.
