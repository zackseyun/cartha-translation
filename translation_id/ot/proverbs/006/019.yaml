  text: a false witness who breathes out lies[b][a], and one who sends out strife among brothers.
translation:
  language: id
  text: saksi palsu yang mengembuskan kebohongan[a], dan orang yang menyebarkan perselisihan di antara saudara-saudara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “saksi yang berdusta dan mengucapkan dusta.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di antara saudara-saudara.” Ungkapan ini dapat merujuk kepada saudara kandung atau, secara lebih luas, anggota-anggota suatu komunitas yang dekat.
    reason: cultural_note
lexical_decisions:
- source_word: יָפִיחַ
  choice: mengembuskan
  rationale: Bentuk Hifil dari פוח menggambarkan keluarnya napas dan secara idiomatis mengacu pada pengucapan kata-kata. Pilihan ini mempertahankan gambaran hidup dalam bahasa Ibrani.
- source_word: כְּזָבִים
  choice: kebohongan
  rationale: Nomina jamak ini berarti berbagai dusta atau kepalsuan. 'Kebohongan' merupakan padanan Indonesia modern yang alami dan tegas.
- source_word: עֵד שָׁקֶר
  choice: saksi palsu
  rationale: Ungkapan ini secara harfiah berarti 'saksi kepalsuan' dan memiliki nuansa hukum-moral. 'Saksi palsu' adalah ungkapan baku dan jelas dalam bahasa Indonesia.
- source_word: וּמְשַׁלֵּחַ
  choice: dan orang yang menyebarkan
  rationale: Partisipel dari שלח secara dasar berarti 'mengirimkan' atau 'melepaskan'. Bersama 'perselisihan', 'menyebarkan' menyampaikan tindakan aktif meluaskan konflik tanpa memakai ungkapan Indonesia yang janggal.
- source_word: מְדָנִים
  choice: perselisihan
  rationale: Kata ini menunjuk pada pertengkaran, pertikaian, atau keadaan berselisih. 'Perselisihan' alami dalam bahasa Indonesia dan mencakup baik konflik lisan maupun perpecahan yang lebih luas.
- source_word: בֵּין אַחִים
  choice: di antara saudara-saudara
  rationale: Padanan ini dekat dengan bentuk harfiah 'di antara saudara-saudara' serta tetap memungkinkan rujukan kepada kerabat atau anggota komunitas yang dekat.
theological_decisions:
- issue: Cakupan istilah relasional אַחִים
  choice: saudara-saudara
  alternative: saudara-saudara laki-laki; sesama anggota komunitas
  rationale: Bentuk Ibraninya maskulin jamak, tetapi dapat menunjuk baik kepada saudara kandung laki-laki maupun, secara lebih luas, orang-orang yang terikat dekat dalam suatu komunitas. Teks utama mempertahankan istilah relasional yang alami dan catatan kaki menjaga rentang maknanya.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Metafora 'mengembuskan kebohongan' dipertahankan, sedangkan 'menyebarkan perselisihan' menyampaikan daya kausatif verba kedua secara alami. Ayat ini merupakan lanjutan dari daftar pada konteks sebelumnya, sehingga bentuknya tetap berupa frasa, bukan kalimat mandiri.
