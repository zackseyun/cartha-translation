  text: נְצֹ֣ר בְּ֭נִ/י מִצְוַ֣ת אָבִ֑י/ךָ וְ/אַל תִּ֝טֹּ֗שׁ תּוֹרַ֥ת אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/020.yaml
  text: Keep[a], my son, your father's commandment, and do not forsake your mother's instruction.
translation:
  language: id
  text: Hai anakku, peganglah perintah ayahmu dan jangan tinggalkan ajaran ibumu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְצֹר
  choice: peganglah
  rationale: Imperatif נצר berarti menjaga atau memelihara dengan saksama. Dalam konteks nasihat orang tua, “peganglah” secara alami menyampaikan gagasan mempertahankan sekaligus menaati, tanpa melemahkannya menjadi sekadar “ikuti”.
- source_word: בְּנִי
  choice: anakku
  rationale: Bentuk Ibrani secara eksplisit berarti “anakku” dengan nomina maskulin tunggal dan akhiran orang pertama tunggal. Pilihan ini mempertahankan sapaan seorang ayah kepada anak laki-lakinya dan tetap alami dalam bahasa Indonesia.
- source_word: מִצְוַת
  choice: perintah
  rationale: מִצְוָה menunjuk pada perintah atau ketetapan. “Perintah” adalah padanan Indonesia yang jelas, berbobot, dan wajar untuk amanat orang tua dalam sastra hikmat.
- source_word: אָבִיךָ
  choice: ayahmu
  rationale: Rangkaian konstruksi Ibrani paling alami diterjemahkan sebagai frasa posesif “perintah ayahmu”, yang mempertahankan acuan orang tua laki-laki.
- source_word: תִּטֹּשׁ
  choice: jangan tinggalkan
  rationale: נטש berarti meninggalkan atau menelantarkan. “Jangan tinggalkan” mempertahankan keseriusan larangan sekaligus terdengar lebih alami dalam bahasa Indonesia modern daripada bentuk yang lebih sastra seperti “jangan abaikan” atau “jangan telantarkan”.
- source_word: תּוֹרַת
  choice: ajaran
  rationale: Dalam konteks pendidikan keluarga ini, תּוֹרָה berarti pengajaran formatif, bukan terutama hukum yang dikodifikasikan. “Ajaran” jelas dan alami serta menjaga kesejajaran dengan “perintah”.
- source_word: אִמֶּךָ
  choice: ibumu
  rationale: Bentuk konstruksi dengan akhiran orang kedua maskulin tunggal secara alami menjadi “ajaran ibumu”, mempertahankan kesejajaran ayah dan ibu.
theological_decisions: []
