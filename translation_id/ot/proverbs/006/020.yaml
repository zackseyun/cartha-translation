  source_fidelity: 'Teks Indonesia dengan tepat mempertahankan dua imperatif Ibrani: נְצֹר sebagai “peganglah” dalam arti memegang teguh/menaati, dan אַל־תִּטֹּשׁ sebagai “jangan tinggalkan.” Hubungan posesif serta paralelisme “perintah ayahmu” dan “ajaran ibumu” juga akurat. “Anakku” merupakan sapaan Indonesia yang idiomatis untuk בְּנִי dalam register hikmat, meskipun bahasa Indonesia tidak menandai gender gramatikal seperti bentuk Ibrani.'
