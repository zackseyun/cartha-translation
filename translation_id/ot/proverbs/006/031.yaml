  text: Yet if he is found[a], he must repay sevenfold; he must give all the wealth of his house.
translation:
  language: id
  text: Namun, jika tertangkap, ia harus membayar ganti rugi tujuh kali lipat[a]; ia harus menyerahkan seluruh harta rumah tangganya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tujuh kali.” Ungkapan Ibrani ini dapat berarti ganti rugi tujuh kali lipat atau pembayaran sejumlah tujuh kali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִמְצָא
  choice: Namun, jika tertangkap
  rationale: Bentuk Nifal dari מצא dalam konteks pencuri berarti ditemukan atau tertangkap. “Namun” menandai peralihan kontras dari rasa maklum pada ayat sebelumnya, sedangkan “jika” menyampaikan nuansa bersyarat yang wajar dalam bahasa Indonesia.
- source_word: יְשַׁלֵּם
  choice: ia harus mengganti
  rationale: Bentuk Piel dari שלם di sini menunjuk pada pembayaran ganti rugi. “Harus mengganti” menyampaikan kewajiban hukum secara alami dan jelas.
- source_word: שִׁבְעָתָיִם
  choice: tujuh kali lipat
  rationale: Ungkapan bilangan ini menyatakan penggantian berlipat tujuh; pilihan ini ringkas dan lazim dalam bahasa Indonesia, sambil mempertahankan alternatif harfiah dalam catatan kaki.
- source_word: אֶת כָּל הוֹן בֵּיתוֹ
  choice: seluruh harta rumahnya
  rationale: הוֹן berarti kekayaan, harta, atau milik. Frasa ini mempertahankan cakupan total dan hubungan dengan rumah tangga si pencuri tanpa mempersempitnya menjadi jenis barang tertentu.
- source_word: יִתֵּן
  choice: harus ia serahkan
  rationale: נתן secara dasar berarti memberi, tetapi dalam konteks pembayaran seluruh harta, “serahkan” lebih alami dan konkret. Susunan ini mempertahankan tekanan pada seluruh harta sebagai objek yang diberikan.
