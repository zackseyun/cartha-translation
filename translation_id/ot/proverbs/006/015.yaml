  text: Therefore his disaster will come suddenly[a]; in an instant he will be broken[b], and there will be no healing.
translation:
  language: id
  text: Karena itu, malapetakanya akan datang tiba-tiba[a]; dalam sekejap ia akan dihancurkan, dan tidak ada kesembuhan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bencananya akan datang” atau “kehancurannya akan datang.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak ada obat” atau “tanpa kesembuhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Frasa ini menyatakan akibat dari gambaran tentang orang jahat dalam ayat-ayat sebelumnya. “Karena itu” alami dalam bahasa Indonesia dan mempertahankan daya simpulannya.
- source_word: פִּתְאֹם
  choice: dengan tiba-tiba
  rationale: Keterangan ini menyatakan datangnya sesuatu secara mendadak. Ungkapan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: יָבֹוא אֵידוֹ
  choice: malapetakanya akan datang
  rationale: אֵידוֹ berarti malapetaka, bencana, atau kehancuran yang menimpanya. “Malapetakanya” sesuai dengan nada peringatan sastra hikmat tanpa mempersempit maknanya.
- source_word: פֶּתַע
  choice: dalam sekejap
  rationale: Istilah kedua yang menyatakan kemendadakan ini memperkuat baris sebelumnya. “Dalam sekejap” mempertahankan variasi dan intensifikasi puitis.
- source_word: יִשָּׁבֵר
  choice: ia akan dihancurkan
  rationale: Bentuk nifal dari שׁבר menyatakan bahwa ia akan dibuat hancur atau remuk. “Akan dihancurkan” mempertahankan sifat pasif dan beratnya keruntuhan yang dimaksud.
- source_word: וְאֵין מַרְפֵּא
  choice: dan tidak ada pemulihan
  rationale: מַרְפֵּא dapat berarti kesembuhan, obat, atau pemulihan. “Pemulihan” mempertahankan gambaran restorasi sekaligus terdengar alami bagi kehancuran seseorang.
