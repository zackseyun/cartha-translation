  text: haughty eyes, a lying tongue, and hands that shed innocent blood,
translation:
  language: id
  text: mata yang angkuh, lidah yang berdusta, dan tangan yang menumpahkan darah orang yang tidak bersalah,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינַיִם רָמוֹת
  choice: mata yang angkuh
  rationale: Mempertahankan citra harfiah 'mata' dan menyampaikan makna moral רָמוֹת, yaitu kesombongan, bukan ketinggian fisik. Ungkapan ini juga menjaga rangkaian anggota tubuh dalam puisi Ibrani.
- source_word: לְשׁוֹן שָׁקֶר
  choice: lidah yang berdusta
  rationale: Mempertahankan 'lidah' sebagai metonimia bagi perkataan, sedangkan 'yang berdusta' menyampaikan tindakan mengatakan kebohongan secara alami dalam bahasa Indonesia.
- source_word: יָדַיִם
  choice: tangan
  rationale: Bentuk ini mempertahankan anggota tubuh sebagai gambaran alat tindakan jahat; bahasa Indonesia lazim memakai 'tangan' tanpa penandaan jamak eksplisit dalam konteks umum seperti ini.
- source_word: שֹׁפְכוֹת
  choice: yang menumpahkan
  rationale: Klausa relatif menyampaikan bentuk partisipial yang menggambarkan tindakan khas atau berkelanjutan, sekaligus menghasilkan susunan Indonesia yang alami.
- source_word: דָּם נָקִי
  choice: darah orang yang tidak bersalah
  rationale: 'Ungkapan ini menjelaskan metonimia Ibrani secara wajar: darah tersebut adalah darah milik orang yang tidak bersalah dalam perkara itu. Pilihan ini lebih jelas bagi pembaca modern daripada ''darah yang tidak bersalah''.'
