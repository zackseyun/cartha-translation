  yaml_path: translation/ot/proverbs/006/025.yaml
  text: Do not desire her beauty in your heart[b][a], and do not let yourself be captured by her eyelashes.
translation:
  language: id
  text: Jangan mengingini kecantikannya dalam hatimu,[a] dan jangan biarkan dia memikatmu dengan kelopak matanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jangan mendambakan kecantikannya dalam hatimu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “jangan sampai dia mengambilmu dengan kelopak matanya”; gambarannya ialah daya pikat pandangan yang menggoda.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְמֹד
  choice: mengingini
  rationale: Kata חמד menyatakan hasrat batin yang dapat bernuansa mengingini atau mendambakan. “Mengingini” mempertahankan daya larangan itu tanpa mempersempitnya menjadi nafsu seksual secara eksplisit.
- source_word: יָפְיָהּ
  choice: kecantikannya
  rationale: יֹפִי secara langsung menunjuk pada kecantikan atau keelokan; “kecantikannya” alami dan tepat dalam konteks ini.
- source_word: בִּלְבָבֶךָ
  choice: dalam hatimu
  rationale: Ungkapan ini mempertahankan idiom Ibrani tentang hati sebagai pusat hasrat dan niat batin.
- source_word: תִּקָּחֲךָ
  choice: biarkan dia memikatmu
  rationale: Secara harfiah לקח berarti “mengambil”, tetapi di sini menggambarkan perempuan itu menguasai atau menawan seseorang melalui daya tariknya. “Memikatmu” menyampaikan hasil seduktif tersebut secara wajar dalam bahasa Indonesia.
- source_word: בְּעַפְעַפֶּיהָ
  choice: dengan kelopak matanya
  rationale: עַפְעַף terutama berarti kelopak mata dan dapat terkait bulu mata. Pilihan ini mempertahankan gambaran tubuh yang konkret serta fungsi instrumental preposisi בְּ.
