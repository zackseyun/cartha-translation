  source_fidelity: Teks Indonesia dengan tepat menerjemahkan אַל־תַּחְמֹד sebagai “Jangan mengingini,” יָפְיָהּ sebagai “kecantikannya,” dan בִּלְבָבֶךָ sebagai “dalam hatimu.” Klausa kedua secara wajar menyampaikan larangan agar pembaca tidak ditawan/dipikat oleh daya tarik perempuan itu, sambil mempertahankan sarana konkret “dengan kelopak matanya.”
