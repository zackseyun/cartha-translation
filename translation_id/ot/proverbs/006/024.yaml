  text: לִ֭/שְׁמָרְ/ךָ מֵ/אֵ֣שֶׁת רָ֑ע מֵֽ֝/חֶלְקַ֗ת לָשׁ֥וֹן נָכְרִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/024.yaml
  text: to keep you from the evil woman[b][a], from the smooth tongue of the foreign woman.
translation:
  language: id
  text: untuk menjagamu dari perempuan jahat, dari lidah licin perempuan asing[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lidah yang merayu”; secara harfiah, “lidah yang licin”.
    reason: lexical_alternative
  - marker: b
    text: Atau “perempuan yang asing”; sebagian orang memahaminya secara lebih khusus sebagai “pezina”.
    reason: alternative_reading
lexical_decisions:
- source_word: לִשְׁמָרְךָ
  choice: untuk menjagamu
  rationale: Bentuk infinitif dengan prefiks ל menyatakan tujuan atau hasil yang terkait dengan ayat sebelumnya. “Menjagamu” mempertahankan makna perlindungan dengan bahasa Indonesia yang alami.
- source_word: מֵאֵשֶׁת רָע
  choice: dari perempuan jahat
  rationale: אֵשֶׁת dapat berarti “perempuan” atau “istri”, tetapi dalam konteks peringatan hikmat ini “perempuan” lebih luas dan tidak memasukkan status perkawinan yang tidak dinyatakan. רָע menyatakan keburukan moral.
- source_word: מֵחֶלְקַת לָשׁוֹן
  choice: dari lidah licin
  rationale: חֶלְקַת menyampaikan gambaran kelicinan atau kehalusan; bersama “lidah”, ungkapan ini menunjuk pada tutur kata yang memikat atau merayu. “Lidah licin” mempertahankan metafora Ibrani dan tetap mudah dipahami.
- source_word: נָכְרִיָּה
  choice: perempuan asing itu
  rationale: Kata ini pada dasarnya berarti perempuan asing atau perempuan dari luar. Pilihan ini mempertahankan arti leksikal tanpa mempersempitnya menjadi “pezina”, meskipun konteks Amsal memberi nuansa bahaya seksual dan moral.
theological_decisions:
- issue: Penafsiran נָכְרִיָּה dalam sastra hikmat
  choice: Menerjemahkannya secara leksikal sebagai “perempuan asing” dalam teks utama.
  alternative: “perempuan yang bukan milikmu” atau, secara lebih khusus, “pezina”
  rationale: Makna dasarnya adalah asing atau dari luar. Dalam Amsal, istilah ini dapat mengandung konotasi ketidaksetiaan seksual atau pelanggaran batas perjanjian, tetapi konteks tidak mengharuskan terjemahan utama mempersempitnya menjadi “pezina”.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan paralel Ibrani dipertahankan, demikian pula metafora “lidah licin”. Kata “itu” membantu membuat frasa “perempuan asing” terdengar alami dalam konteks peringatan tertentu tanpa menambahkan identitas yang tidak dinyatakan.
