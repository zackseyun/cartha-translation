translation:
  language: id
  text: mengedipkan matanya, memberi isyarat dengan kakinya[a], menunjuk dengan jari-jarinya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menggeser-geser/menggaruk dengan kakinya,” atau secara lebih umum, “membuat tanda dengan kakinya.” Kata Ibrani מֹלֵל jarang dipakai dan gerakan tepat yang dimaksud tidak pasti, tetapi konteksnya jelas menunjukkan pemberian isyarat secara diam-diam melalui gerak tubuh.
    reason: lexical_alternative
  - marker: b
    text: Atau “mengarahkan dengan jari-jarinya.” Kata Ibrani ini juga dapat berarti “mengajar,” tetapi di sini “menunjuk” dipilih karena ayat ini menyebut rangkaian gerak tubuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵץ
  choice: mengedipkan
  rationale: Partisip ini menggambarkan gerak mata yang diam-diam untuk memberi isyarat; “mengedipkan” merupakan padanan Indonesia yang alami dalam konteks ini.
- source_word: בְּעֵינָיו
  choice: matanya
  rationale: Bentuk Ibrani memakai nomina jamak dengan sufiks orang ketiga maskulin tunggal, tetapi bahasa Indonesia secara idiomatis memakai bentuk tunggal kolektif “matanya” untuk gerakan ini.
- source_word: מֹלֵל
  choice: memberi isyarat
  rationale: Kata ini langka dan makna tepat gerakannya tidak pasti. Paralelisme dengan mata dan jari menunjukkan komunikasi melalui gerak tubuh secara diam-diam, sehingga padanan ini mempertahankan fungsi tanpa menentukan gerakan tertentu.
- source_word: בְּרַגְלוֹ
  choice: dengan kakinya
  rationale: Teks Ibrani berbentuk tunggal; terjemahan mempertahankannya dan tetap alami dalam bahasa Indonesia.
- source_word: מֹרֶה
  choice: menunjuk
  rationale: Walaupun verba ini dapat berarti “mengajar” atau “mengarahkan”, penyebutan jari-jari dan rangkaian gerak tubuh mendukung arti gestural “menunjuk”.
- source_word: בְּאֶצְבְּעֹתָיו
  choice: dengan jari-jarinya
  rationale: Nomina Ibrani berbentuk jamak dengan sufiks orang ketiga maskulin tunggal; bentuk Indonesia ini mempertahankan jumlah dan fungsi instrumentalnya.
