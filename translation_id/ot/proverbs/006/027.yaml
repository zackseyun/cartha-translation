  verdict: revise
  source_fidelity: Draf menangkap pertanyaan retoris, subjek maskulin tunggal generik, api, dan akibat pakaian terbakar. Namun, “dalam dekapan bajunya” kurang tepat untuk בְּחֵיקוֹ, yang menunjuk pada pangkuan/dada atau lipatan pakaian dekat tubuh, bukan ‘dekapan’ yang dilakukan oleh pakaian. Frasa “tanpa membuat” juga menambahkan konstruksi kausatif yang tidak dinyatakan secara langsung dalam bentuk pasif Ibrani.
  naturalness: “Dalam lipatan bajunya” adalah ungkapan Indonesia modern yang jelas dan alami untuk gambaran membawa sesuatu dekat tubuh di dalam pakaian. Klausa “dan pakaiannya tidak terbakar?” mempertahankan bentuk pertanyaan retoris serta hubungan koordinatif sumber tanpa kausativisasi tambahan.
  terminology: “Seorang laki-laki,” “api,” dan “pakaian” sesuai dengan istilah sumber dan register amsal. Catatan kaki mempertahankan rentang makna חֵיק tanpa memaksakan satu lokasi anatomi secara sempit.
  issues:
