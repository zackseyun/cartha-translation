translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pertanyaan retoris serta gambaran bahaya yang tak terelakkan dipertahankan; “dekapan bajunya” dipilih agar pembaca memahami hubungan antara api, tubuh, dan pakaian.
