translation:
  language: id
  text: Dapatkah seorang laki-laki membawa api dalam lipatan bajunya, dan pakaiannya tidak terbakar?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di pangkuannya” atau “di dadanya”; kata Ibrani ini menunjuk pada daerah dada atau pangkuan, mungkin termasuk lipatan pakaian tempat sesuatu dapat dibawa dekat tubuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְתֶּה
  choice: membawa
  rationale: Kata kerja חתה dapat berarti mengambil atau mengumpulkan bara/api. Dalam gambaran ini, api itu diambil lalu dibawa dekat pada tubuh; “membawa” menyampaikan tindakan dan bahayanya secara alami.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Nomina Ibrani ini berbentuk maskulin tunggal dan dalam konteks amsal merujuk secara umum, tetapi konteks dekatnya secara khusus memperingatkan seorang laki-laki tentang perzinaan. Terjemahan ini mempertahankan bentuk dan konteks tersebut.
- source_word: אֵשׁ
  choice: api
  rationale: Padanan langsung dan wajar dalam bahasa Indonesia.
- source_word: בְּחֵיקוֹ
  choice: dalam dekapan bajunya
  rationale: חֵיק menunjuk pada daerah dada atau pangkuan tempat sesuatu didekap dekat, termasuk lipatan pakaian. Ungkapan ini mempertahankan kedekatan dengan tubuh sekaligus membuat gambaran pakaiannya jelas.
- source_word: וּבְגָדָיו
  choice: pakaiannya
  rationale: Padanan modern dan alami untuk bentuk jamak בְּגָדִים, yang dapat dinyatakan sebagai nomina kolektif dalam bahasa Indonesia.
- source_word: לֹא תִשָּׂרַפְנָה
  choice: tanpa membuat pakaiannya terbakar
  rationale: Bentuk Nifal menyatakan bahwa pakaian mengalami pembakaran. Susunan “tanpa membuat ... terbakar” menghasilkan pertanyaan retoris yang alami sambil mempertahankan akibat pasifnya.
