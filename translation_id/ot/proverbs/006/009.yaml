  text: עַד מָתַ֖י עָצֵ֥ל תִּשְׁכָּ֑ב מָ֝תַ֗י תָּק֥וּם מִ/שְּׁנָתֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/009.yaml
  text: How long[a], sluggard, will you lie there? When will you rise from your sleep?
translation:
  language: id
  text: Sampai kapan kamu akan berbaring, hai pemalas[a]? Kapan kamu akan bangun dari tidurmu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang malas.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: Sampai kapan
  rationale: Ungkapan tanya Ibrani ini menanyakan lamanya suatu keadaan. “Sampai kapan” alami dalam bahasa Indonesia dan mempertahankan nada teguran.
- source_word: עָצֵל
  choice: pemalas
  rationale: Kata ini merupakan istilah khas sastra hikmat bagi orang yang terbiasa malas. “Pemalas” ringkas, representatif, dan lebih tepat daripada sekadar sifat “malas”.
- source_word: תִּשְׁכָּב
  choice: kamu akan berbaring
  rationale: Verba ini berarti berbaring atau merebahkan diri; dalam konteksnya, orang tersebut terus berada di tempat tidur. Terjemahan ini mempertahankan gambaran konkret tanpa menambahkan unsur yang tidak dinyatakan.
- source_word: מָתַי
  choice: Kapan
  rationale: Adverbia tanya sederhana ini paling langsung dan alami diterjemahkan “Kapan”.
- source_word: תָּקוּם
  choice: kamu akan bangun
  rationale: Dalam konteks bangkit dari tidur, “bangun” merupakan padanan Indonesia yang paling alami bagi verba yang berarti bangkit atau berdiri.
- source_word: מִשְּׁנָתֶךָ
  choice: dari tidurmu
  rationale: Frasa ini secara langsung menyatakan “dari tidurmu,” dengan akhiran orang kedua tunggal dipertahankan melalui bentuk “-mu”.
theological_decisions: []
translation_notes:
  register: Bahasa dibuat lugas, bernada teguran, dan tetap bernuansa sastra hikmat. Sapaan “hai pemalas” mempertahankan seruan langsung kepada tokoh representatif dalam bentuk maskulin tunggal Ibrani tanpa membatasi penerapannya hanya kepada laki-laki.
