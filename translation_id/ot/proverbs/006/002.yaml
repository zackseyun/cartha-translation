  text: you have been snared by the words of your mouth[a]; you have been caught by the words of your mouth.
translation:
  language: id
  text: Engkau telah terjerat oleh perkataan mulutmu[a]; engkau telah tertangkap oleh perkataan mulutmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “engkau terjerat oleh perkataan mulutmu.” Bentuk perfektif Ibrani dapat dipahami sebagai tindakan yang hasilnya masih berlangsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹקַשְׁתָּ
  choice: engkau telah terjerat
  rationale: Bentuk Nifal dari יקש menyatakan keadaan terkena jerat. “Telah terjerat” mempertahankan gambaran konkret tentang jerat dan mengungkapkan aspek perfektif Ibrani secara wajar.
- source_word: בְאִמְרֵי
  choice: oleh perkataan
  rationale: Preposisi ב berfungsi instrumental, yaitu menunjukkan sarana yang menyebabkan seseorang terjerat. Bentuk jamak konstruksi אִמְרֵי secara alami diterjemahkan “perkataan” dalam konteks ini.
- source_word: פִיךָ
  choice: mulutmu
  rationale: Terjemahan harfiah “mulutmu” mempertahankan ungkapan konkret Ibrani bagi ucapan serta pengulangan paralel dalam ayat ini.
- source_word: נִלְכַּדְתָּ
  choice: engkau telah tertangkap
  rationale: Bentuk Nifal dari לכד berarti tertangkap atau tertawan. “Telah tertangkap” membentuk paralel sinonim dengan “telah terjerat” tanpa menghapus perbedaan gambarnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Pronomina “engkau” sesuai dengan sapaan tunggal dalam wacana hikmat. Pengulangan “perkataan mulutmu” dipertahankan untuk mencerminkan paralelisme dan penekanan teks Ibrani.
