  text: For because of a prostitute one is reduced to a loaf of bread[c][b][a], but a married woman hunts a precious life.
translation:
  language: id
  text: Sebab, seseorang dapat jatuh miskin karena seorang pelacur sampai tinggal sepotong roti;[a] tetapi istri orang[b] memburu nyawa yang berharga.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “Sebab, oleh karena seorang pelacur—sampai kepada sepotong roti.” Bahasa Ibraninya padat dan eliptis; banyak penafsir memahami baris ini sebagai pernyataan bahwa seseorang dapat jatuh miskin.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “istri seorang laki-laki”; dalam konteks ini yang dimaksud ialah istri orang lain dalam hubungan perzinaan.
    reason: lexical_alternative
  - marker: c
    text: Atau “jiwa yang berharga” atau “diri yang berharga”. Kata Ibrani נֶפֶשׁ dapat berarti jiwa, diri, atau nyawa; dalam konteks peringatan ini, “nyawa” paling sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi peringatan dalam ayat-ayat sebelumnya. Bentuk ini alami dalam bahasa Indonesia tanpa menggandakan penanda sebab.
- source_word: בְעַד
  choice: karena
  rationale: Dalam konteks ini menyatakan sebab atau akibat yang timbul karena keterlibatan dengan perempuan tersebut.
- source_word: אִשָּׁה זוֹנָה
  choice: seorang pelacur
  rationale: זוֹנָה menunjuk pada perempuan yang melacurkan diri; 'pelacur' merupakan padanan modern, jelas, dan tidak arkais.
- source_word: עַד כִּכַּר לָחֶם
  choice: dapat jatuh miskin hingga hanya memiliki sepotong roti
  rationale: Ungkapan Ibrani ini sangat padat dan eliptis. Terjemahan utama menyatakan pemiskinan yang lazim dipahami sebagai maksudnya, sedangkan bentuk yang lebih harfiah dan ambiguitasnya dipertahankan dalam catatan kaki.
- source_word: וְאֵשֶׁת אִישׁ
  choice: tetapi istri orang
  rationale: Secara harfiah berarti 'istri seorang laki-laki'. 'Istri orang' alami dalam bahasa Indonesia dan dalam konteks menunjukkan perempuan yang berselingkuh dengan laki-laki lain, tanpa menggantinya dengan label yang lebih interpretatif.
- source_word: נֶפֶשׁ יְקָרָה
  choice: nyawa yang berharga
  rationale: נֶפֶשׁ dapat berarti nyawa, diri, atau jiwa. 'Nyawa' paling sesuai dengan konteks ancaman terhadap kehidupan, sementara kemungkinan makna lain dicatat.
- source_word: תָצוּד
  choice: memburu
  rationale: Mempertahankan metafora hidup tentang berburu atau menangkap mangsa dan sesuai dengan subjek feminin tunggal.
theological_decisions:
- issue: Cakupan ancaman dalam נֶפֶשׁ יְקָרָה
  choice: nyawa yang berharga
  alternative: jiwa yang berharga / diri yang berharga
  rationale: Konteks hikmat menekankan bahaya yang mengancam seluruh kehidupan seseorang. 'Nyawa' menyampaikan ancaman maut tanpa mengharuskan pemisahan teologis antara tubuh dan jiwa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hikmat yang lugas dan bermartabat. Struktur sebab-akibat dibuat alami, sementara kepadatan dan ambiguitas klausa Ibrani pertama dijelaskan dalam catatan kaki. Metafora berburu dipertahankan.
