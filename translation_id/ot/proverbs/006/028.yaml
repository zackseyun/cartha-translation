  text: Can a man walk on coals and his feet not be scorched?[a]
translation:
  language: id
  text: Dapatkah seseorang berjalan di atas bara api tanpa kakinya terbakar?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika seseorang berjalan di atas bara api, masakan kakinya tidak terbakar?” Teks Ibrani diawali dengan אִם (“jika”), tetapi di sini kata itu memperkenalkan pertanyaan retoris yang sejajar dengan ayat sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Dapatkah
  rationale: אִם biasanya berarti “jika”, tetapi dalam rangkaian pertanyaan retoris pada Amsal 6:27–28 kata ini memperkenalkan keadaan hipotetis. “Dapatkah” menyampaikan daya retorisnya secara alami dalam bahasa Indonesia.
- source_word: יְהַלֵּךְ
  choice: berjalan
  rationale: Bentuk dari הלך di sini menyatakan tindakan berjalan atau bergerak; “berjalan” paling tepat bagi gambaran menginjak bara.
- source_word: אִישׁ
  choice: seseorang
  rationale: Walaupun bentuk Ibraninya maskulin tunggal, dalam pepatah ini אִישׁ menunjuk secara umum kepada siapa pun. “Seseorang” mempertahankan fungsi generiknya dalam bahasa Indonesia modern tanpa mengubah maksud.
- source_word: עַל הַגֶּחָלִים
  choice: di atas bara api
  rationale: עַל menyatakan posisi atau kontak di atas permukaan, sedangkan גֶּחָלִים menunjuk pada bara yang menyala. “Bara api” merupakan ungkapan Indonesia yang jelas dan alami.
- source_word: וְרַגְלָיו
  choice: tanpa kakinya
  rationale: Secara harfiah berarti “dan kakinya”. Dalam konstruksi pertanyaan retoris bahasa Indonesia, “tanpa kakinya” secara alami menghubungkan tindakan dengan akibat yang mustahil dihindari.
- source_word: לֹא תִכָּוֶינָה
  choice: tidak terbakar
  rationale: כוה dalam bentuk nifal berarti mengalami luka bakar atau terbakar. “Tidak terbakar” jelas, wajar, dan tidak menentukan derajat luka melebihi teks.
