  yaml_path: translation/ot/proverbs/017/001.yaml
  text: Better is a dry crust with peace than a house full of sacrificial feasts with strife[a].
translation:
  language: id
  text: Lebih baik sepotong roti kering disertai ketenangan daripada rumah penuh dengan jamuan kurban disertai pertengkaran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "kurban-kurban"; kata Ibrani ini dapat menunjuk pada kurban sembelihan atau, dalam konteks ini, makanan berlimpah dalam perjamuan yang berkaitan dengan kurban.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Lebih baik
  rationale: Mempertahankan rumus perbandingan khas amsal secara alami dalam bahasa Indonesia.
- source_word: פַּת חֲרֵבָה
  choice: sepotong roti kering
  rationale: פַּת menunjuk pada sepotong atau sesuap roti, sedangkan חֲרֵבָה menekankan keadaan kering dan kesederhanaan makanan; ungkapan ini lebih alami daripada menerjemahkannya sebagai 'kerak'.
- source_word: וְשַׁלְוָה בָהּ
  choice: disertai ketenangan
  rationale: שַׁלְוָה berarti ketenangan atau ketenteraman. 'Disertai' menyampaikan hubungan keadaan itu dengan makanan/situasi tanpa memaksakan rujukan pronomina yang canggung dalam bahasa Indonesia.
- source_word: מִבַּיִת מָלֵא
  choice: daripada rumah penuh dengan
  rationale: מִן menyatakan perbandingan, sedangkan 'rumah' mempertahankan latar domestik konkret teks Ibrani.
- source_word: זִבְחֵי
  choice: jamuan kurban
  rationale: Bentuk jamak זֶבַח dapat menunjuk pada kurban sembelihan maupun makanan perjamuan yang terkait dengannya. Pilihan ini mempertahankan latar pengurbanan sekaligus gambaran makanan berlimpah.
- source_word: רִיב
  choice: pertengkaran
  rationale: Menyatakan konflik antarpribadi secara jelas dan alami serta membentuk kontras dengan 'ketenangan'.
theological_decisions:
- issue: Cakupan makna זִבְחֵי
  choice: jamuan kurban
  alternative: kurban-kurban
  rationale: Konteks amsal membandingkan makanan sederhana dengan kelimpahan dalam sebuah rumah; 'jamuan kurban' mempertahankan unsur kultis tanpa menghilangkan gambaran perjamuan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama amsal yang ringkas dan bermartabat. Susunan paralel 'disertai ketenangan ... disertai pertengkaran' memperjelas kontras tanpa menghilangkan kekonkretan roti dan rumah.
