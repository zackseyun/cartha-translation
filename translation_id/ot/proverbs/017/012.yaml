  text: פָּג֬וֹשׁ דֹּ֣ב שַׁכּ֣וּל בְּ/אִ֑ישׁ וְ/אַל כְּ֝סִ֗יל בְּ/אִוַּלְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/012.yaml
  text: Better to meet a bear robbed of her cubs than a fool in his folly.
translation:
  language: id
  text: Lebih baik berhadapan dengan beruang yang kehilangan anak-anaknya daripada dengan orang bebal dalam kebodohannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּגוֹשׁ
  choice: berhadapan dengan
  rationale: Infinitif absolut ini berfungsi secara imperatif atau sebagai perbandingan eliptis; dalam bahasa Indonesia, frasa ini menyampaikan perjumpaan langsung yang berbahaya secara alami.
- source_word: דֹּב שַׁכּוּל
  choice: beruang yang kehilangan anak-anaknya
  rationale: שַׁכּוּל berarti kehilangan anak atau dibuat tak beranak. Ungkapan ini mempertahankan gambaran induk beruang yang amat berbahaya tanpa menambahkan unsur 'dirampas' yang tidak dinyatakan secara eksplisit.
- source_word: כְּסִיל
  choice: orang bebal
  rationale: Istilah hikmat Ibrani ini menunjuk orang yang keras kepala dan menolak hikmat, bukan sekadar orang yang kurang cerdas.
- source_word: אִוַּלְתּוֹ
  choice: kebodohannya
  rationale: Padanan ini mempertahankan hubungan leksikal dengan 'orang bebal' serta mencakup perilaku dan sikap bodoh yang menjadi cirinya.
theological_decisions:
- issue: Bentuk perbandingan eliptis
  choice: Lebih baik berhadapan ... daripada ...
  alternative: Biarlah seseorang bertemu ... dan jangan dengan ...
  rationale: Teks Ibrani secara harfiah memakai bentuk 'bertemulah ... dan jangan ...', tetapi maksud pepatahnya adalah membandingkan dua bahaya. Bentuk 'lebih baik ... daripada ...' menyampaikan fungsi tersebut dengan alami tanpa mengurangi daya peringatannya.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada amsal. 'Orang bebal' dipilih sebagai istilah hikmat yang bermartabat dan mudah dipahami; pengulangan 'bebal/kebodohan' mempertahankan daya retoris teks sumber.
