  text: Whoever repays evil for good[a], evil will not depart from his house.
translation:
  language: id
  text: 'Siapa yang membalas kebaikan dengan kejahatan,

    kejahatan[a] tidak akan meninggalkan rumahnya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “malapetaka tidak akan meninggalkan rumahnya.” Kata Ibrani yang kedua kali diterjemahkan “kejahatan” dapat berarti kejahatan moral ataupun akibat buruk atau bencana; teks utama mempertahankan pengulangan dalam bahasa Ibrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵשִׁיב
  choice: membalas
  rationale: Partisipel Hifil dari שוב di sini menyatakan tindakan memberikan sesuatu sebagai balasan; “membalas” alami dalam bahasa Indonesia dan mempertahankan daya timbal balik pepatah ini.
- source_word: רָעָה (pertama)
  choice: kejahatan
  rationale: Kemunculan pertama menunjuk pada perlakuan buruk secara moral sebagai balasan atas hal yang baik. “Kejahatan” mempertahankan pertentangan tegas dengan “kebaikan.”
- source_word: תַּחַת
  choice: dengan
  rationale: Preposisi ini menandai pertukaran atau penggantian. Dalam konstruksi Indonesia “membalas kebaikan dengan kejahatan,” pilihan ini paling wajar dan tetap menyampaikan pertukaran yang dimaksud.
- source_word: טוֹבָה
  choice: kebaikan
  rationale: Kata ini dapat berarti hal yang baik, kebaikan, atau manfaat. “Kebaikan” cukup luas dan membentuk pasangan yang alami dengan “kejahatan” tanpa mempersempit maknanya menjadi satu jenis perbuatan tertentu.
- source_word: לֹא תמיש
  choice: tidak akan beranjak
  rationale: Bentuk dari מוש menyatakan tidak berpindah atau tidak meninggalkan. “Tidak akan beranjak” mempertahankan gambaran bahwa kejahatan atau malapetaka terus melekat pada rumah orang itu.
- source_word: רָעָה (kedua)
  choice: kejahatan
  rationale: Kemunculan kedua dapat menunjuk pada kejahatan atau pada akibat buruk berupa malapetaka. Teks utama mengulang “kejahatan” untuk mempertahankan pengulangan dan simetri leksikal Ibrani; kemungkinan makna konsekuensial dicatat dalam catatan kaki.
- source_word: מִבֵּיתוֹ
  choice: dari rumahnya
  rationale: בַּיִת dapat berarti rumah, seisi rumah, atau keluarga. “Rumahnya” adalah padanan langsung yang tetap dapat mencakup lingkungan rumah tangga secara lebih luas.
- source_word: subjek tersirat dalam partisipel
  choice: Siapa
  rationale: Bahasa Ibrani memakai partisipel substantival tanpa pronomina eksplisit. “Siapa” menyampaikan subjek generik secara ringkas, alami, dan tidak arkais.
theological_decisions:
- issue: Makna רָעָה pada klausa akibat
  choice: Mempertahankan “kejahatan” dalam teks utama
  alternative: “malapetaka” atau “bencana”
  rationale: Kata Ibrani yang sama dipakai dua kali. Pengulangan dalam teks utama menjaga bentuk retoris dan ketegangan antara kejahatan moral dan akibat buruk, sementara catatan kaki menyatakan kemungkinan makna konsekuensial tanpa menentukannya secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis dua baris. Diksi dibuat ringkas dan bermartabat; pengulangan “kejahatan” dipertahankan untuk mencerminkan simetri pepatah Ibrani. Penanda catatan kaki [a] ditempatkan pada akhir ayat karena catatan menjelaskan kemunculan kedua kata tersebut.
