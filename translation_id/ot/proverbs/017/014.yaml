  yaml_path: translation/ot/proverbs/017/014.yaml
  text: The beginning of strife is like letting out water[b][a]; so abandon the quarrel before it breaks out.
translation:
  language: id
  text: Awal perselisihan adalah seperti melepas air[a]; karena itu, tinggalkanlah pertengkaran itu sebelum pertengkaran itu pecah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Awal perselisihan adalah seperti orang yang melepas air.” Gambaran Ibraninya mungkin menunjuk pada pembukaan celah pada bendungan atau saluran; setelah air mulai mengalir, alirannya sulit dihentikan.
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Ibrani ini sulit dipastikan; kemungkinan lain ialah “menyembur keluar”, “tersingkap”, atau “meningkat”. Maksudnya, perselisihan harus dihentikan sebelum menjadi terbuka dan tidak terkendali.
    reason: lexical_alternative
lexical_decisions:
- source_word: פּוֹטֵר
  choice: melepas
  rationale: Partisip ini menggambarkan tindakan membuka atau membiarkan sesuatu yang tertahan keluar. Bersama מַיִם, frasa ini mempertahankan gambaran konkret air yang mulai dilepas melalui suatu bukaan.
- source_word: מַיִם
  choice: air
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, dalam konteks ini kata tersebut adalah nomina massa dan secara alami diterjemahkan 'air'.
- source_word: רֵאשִׁית
  choice: awal
  rationale: Kata ini menunjuk pada permulaan atau tahap pertama; 'awal' ringkas dan wajar dalam gaya amsal.
- source_word: מָדוֹן
  choice: perselisihan
  rationale: Kata ini menyatakan pertentangan atau konflik. 'Perselisihan' cukup luas untuk mencakup konflik yang baru mulai berkembang.
- source_word: וְלִפְנֵי
  choice: karena itu ... sebelum
  rationale: Secara harfiah unsur ini berarti 'dan sebelum'. Dalam bahasa Indonesia, 'karena itu' menyatakan hubungan nasihat dengan gambaran pada klausa pertama secara alami, sedangkan 'sebelum' mempertahankan hubungan waktunya.
- source_word: הִתְגַּלַּע
  choice: pecah
  rationale: Verba yang sulit ini dapat menyiratkan pecah, menyembur keluar, tersingkap, atau meningkat. 'Pecah' alami untuk pertengkaran dalam bahasa Indonesia dan tetap beresonansi dengan gambaran air yang menerobos keluar.
- source_word: הָרִיב
  choice: pertengkaran
  rationale: Kata ini menunjuk pada sengketa atau pertengkaran. Pilihan ini cocok dengan konflik antarmanusia dan membedakannya secara wajar dari מָדוֹן pada klausa pertama.
- source_word: נְטוֹשׁ
  choice: tinggalkanlah
  rationale: Bentuk imperatif ini memerintahkan orang untuk berhenti terlibat atau melepaskan sengketa. 'Tinggalkanlah' mempertahankan daya perintah tanpa terdengar terlalu sehari-hari.
