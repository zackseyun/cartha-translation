  text: An evildoer listens to wicked lips[a]; a liar gives ear to a destructive tongue.
translation:
  language: id
  text: Orang yang berbuat jahat mendengarkan bibir yang jahat[a]; seorang pendusta memasang telinga pada lidah yang merusak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Orang yang berbuat jahat mendengarkan bibir kejahatan; kepalsuan memasang telinga pada lidah kehancuran.” Bahasa Ibrani memungkinkan terjemahan yang lebih harfiah, dengan “kepalsuan” dipahami secara abstrak, bukan sebagai “seorang pendusta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרַע
  choice: orang yang berbuat jahat
  rationale: Bentuk substantival ini menunjuk kepada orang yang bercirikan kejahatan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya moral istilah Ibrani.
- source_word: מַקְשִׁיב עַל
  choice: mendengarkan
  rationale: Kata kerja קשׁב menyatakan mendengarkan atau memperhatikan dengan saksama, sedangkan עַל menandai hal yang didengarkan. Konteks menyiratkan penerimaan yang patut dipersalahkan.
- source_word: שְׂפַת אָוֶן
  choice: bibir yang fasik
  rationale: Metafora 'bibir' dipertahankan sebagai sebutan bagi perkataan. אָוֶן di sini mengandung arti kejahatan atau kefasikan; 'fasik' ringkas dan sesuai dengan register sastra hikmat.
- source_word: שֶׁקֶר
  choice: seorang pendusta
  rationale: Walaupun bentuknya secara harfiah berarti 'dusta' atau 'kepalsuan', kesejajarannya dengan מֵרַע mendukung pemahaman substantival sebagai orang yang bercirikan dusta. Ambiguitas formalnya dicatat dalam catatan kaki.
- source_word: מֵזִין
  choice: memasang telinga kepada
  rationale: Bentuk Hifil dari אזן berarti memberi telinga atau mendengarkan. Ungkapan ini mempertahankan citra tubuh dan membedakannya secara puitis dari kata kerja pada baris pertama.
- source_word: לְשׁוֹן הַוֺּת
  choice: lidah yang merusak
  rationale: '''Lidah'' dipertahankan sebagai metonimia bagi perkataan, sedangkan הַוֺּת menunjuk pada kehancuran, malapetaka, atau tindakan merusak. Pilihan ini menyampaikan daya aktif perkataan yang mencelakakan.'
