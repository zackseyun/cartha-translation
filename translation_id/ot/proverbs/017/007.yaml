id: PRO.17.7
reference: Proverbs 17:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹא נָאוָ֣ה לְ/נָבָ֣ל שְׂפַת יֶ֑תֶר אַ֝֗ף כִּֽי לְ/נָדִ֥יב שְׂפַת שָֽׁקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/007.yaml
  text: Excellent speech is not fitting for a fool[b][a]; how much less are lying lips for a noble man.
translation:
  language: id
  text: 'Perkataan luhur tidak pantas bagi orang bebal[a];

    apalagi bibir dusta bagi orang mulia[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkataan tinggi” atau “perkataan muluk-muluk.” Ungkapan Ibrani ini dapat menekankan perkataan yang luhur, berlebihan, atau megah.
    reason: lexical_alternative
  - marker: b
    text: Atau “seorang bangsawan,” “seorang pemimpin,” atau “orang yang murah hati.” Kata Ibrani נָדִיב dapat menunjuk pada kedudukan mulia atau watak yang luhur.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוָה
  choice: tidak pantas
  rationale: Mengungkapkan bahwa sesuatu tidak sesuai atau tidak patut bagi seseorang, dengan bahasa Indonesia yang alami.
- source_word: נָבָל
  choice: orang bebal
  rationale: Dalam sastra hikmat, istilah ini menunjuk pada orang yang kurang akal sekaligus bercela secara moral; 'orang bebal' mempertahankan corak khas Amsal.
- source_word: שְׂפַת יֶתֶר
  choice: perkataan luhur
  rationale: Secara harfiah berarti 'bibir/perkataan yang unggul atau berlebih'. 'Perkataan luhur' menyampaikan gagasan tentang tuturan yang tinggi atau bermutu sambil mempertahankan kemungkinan nuansa lain dalam catatan kaki.
- source_word: אַף כִּי
  choice: apalagi
  rationale: 'Dalam konteks negatif, ungkapan ini menyatakan perbandingan yang diperkuat: jika hal pertama saja tidak pantas, hal kedua jauh lebih tidak pantas.'
- source_word: נָדִיב
  choice: orang mulia
  rationale: Pilihan ini dapat mencakup kemuliaan watak maupun kedudukan dan membentuk kontras yang wajar dengan 'orang bebal', tanpa membatasi makna hanya pada kebangsawanan.
- source_word: שְׂפַת שָׁקֶר
  choice: bibir dusta
  rationale: Mempertahankan gambaran konkret Ibrani, secara harfiah 'bibir kepalsuan', dalam ungkapan Indonesia yang ringkas dan puitis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada hikmat. Paralelisme kedua baris dipertahankan; 'apalagi' menyampaikan daya perbandingan אַף כִּי secara alami. Semua penanda catatan kaki ditempatkan langsung sesudah ungkapan yang dijelaskan.
