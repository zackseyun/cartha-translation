  text: עִקֶּשׁ לֵ֭ב לֹ֣א יִמְצָא ט֑וֹב וְ/נֶהְפָּ֥ךְ בִּ֝/לְשׁוֹנ֗/וֹ יִפּ֥וֹל בְּ/רָעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/020.yaml
  text: A crooked heart does not find good, and one who is twisted in his tongue falls into trouble.
translation:
  language: id
  text: Orang yang hatinya bengkok tidak akan menemukan kebaikan, dan orang yang lidahnya berbelit-belit akan jatuh ke dalam malapetaka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִקֶּשׁ לֵב
  choice: orang yang hatinya bengkok
  rationale: Ungkapan Ibrani secara harfiah menunjuk pada hati yang bengkok atau menyimpang. Susunan ini mempertahankan gambaran sumber sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: לֹא יִמְצָא טוֹב
  choice: tidak akan menemukan kebaikan
  rationale: Kata טוֹב dapat menunjuk pada kebaikan, hal yang baik, atau kesejahteraan. 'Kebaikan' mempertahankan keluasan maknanya tanpa mempersempitnya menjadi keberuntungan semata.
- source_word: וְנֶהְפָּךְ בִּלְשׁוֹנוֹ
  choice: dan orang yang lidahnya berbelit-belit
  rationale: נֶהְפָּךְ menggambarkan sesuatu yang terbalik, menyimpang, atau berbelit. Ungkapan ini menyampaikan tutur kata yang tidak lurus tanpa menambahkan motif khusus yang tidak dinyatakan teks.
- source_word: יִפּוֹל בְּרָעָה
  choice: akan jatuh ke dalam malapetaka
  rationale: רָעָה di sini dapat berarti kejahatan, kesusahan, atau malapetaka. Dalam konstruksi 'jatuh ke dalam', 'malapetaka' paling alami dan mempertahankan akibat buruk yang dimaksud.
theological_decisions:
- issue: Hubungan antara kebengkokan batin, tutur kata, dan akibat buruk
  choice: Mempertahankan dua pernyataan paralel tanpa menjelaskan apakah malapetaka merupakan hukuman ilahi langsung atau akibat moral yang wajar.
  alternative: Menafsirkan akibat itu secara eksplisit sebagai hukuman Allah.
  rationale: Teks menyatakan hubungan hikmat antara watak atau ucapan yang menyimpang dan kegagalan atau malapetaka, tetapi tidak menyebut pelaku penghukuman.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Paralelisme ayat dipertahankan; 'hati bengkok' dan 'lidah berbelit-belit' menjaga citra konkret teks Ibrani.
