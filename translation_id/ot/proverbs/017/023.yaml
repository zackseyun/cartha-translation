  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Metafora konkret tentang lipatan pakaian serta bentuk jamak “jalan-jalan keadilan” dipertahankan, sementara “menerima suap” dipilih sebagai kolokasi Indonesia yang lebih alami daripada “mengambil suap”.
