  text: שֹׁ֣חַד מֵ֭/חֵיק רָשָׁ֣ע יִקָּ֑ח לְ֝/הַטּ֗וֹת אָרְח֥וֹת מִשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/023.yaml
  text: A wicked man takes a bribe from the bosom to pervert the paths of justice[a][b].
translation:
  language: id
  text: Orang fasik menerima suap dari lipatan pakaian[a] untuk membelokkan jalan-jalan keadilan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dapat diterjemahkan “dari dada” atau “dari pangkuan”; gambaran Ibrani kemungkinan merujuk pada sesuatu yang dikeluarkan dari lipatan pakaian secara tersembunyi.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “jalannya keadilan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  choice: suap
  rationale: Kata ini menunjuk pada pemberian tidak sah yang dimaksudkan untuk memengaruhi keputusan atau tindakan; “suap” adalah padanan Indonesia yang paling jelas dalam konteks hukum.
- source_word: מֵחֵיק
  choice: dari lipatan pakaian
  rationale: חֵיק secara harfiah dapat berarti dada atau pangkuan dan juga merujuk pada bagian pakaian yang terlipat, tempat sesuatu dapat disembunyikan. Pilihan ini mempertahankan gambaran konkret sekaligus menyampaikan kesan transaksi rahasia tanpa sekadar memparafrasakannya sebagai “secara diam-diam”.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Bentuk ini menunjuk pada seorang yang jahat atau bersalah secara moral. “Orang fasik” mempertahankan corak hikmat Alkitab dan berfungsi secara representatif tanpa menambahkan penekanan gender yang tidak diperlukan dalam bahasa Indonesia.
- source_word: יִקָּח
  choice: menerima
  rationale: לקח secara dasar berarti “mengambil”, tetapi dalam konteks suap bahasa Indonesia secara alami memakai “menerima suap”. Pilihan ini mempertahankan tindakan penerima suap tanpa terasa kaku.
- source_word: לְהַטּוֹת
  choice: untuk membelokkan
  rationale: נטה menggambarkan tindakan membuat sesuatu menyimpang dari arah yang benar. “Membelokkan” mempertahankan metafora arah yang berpasangan dengan “jalan-jalan”.
- source_word: אָרְחוֹת
  choice: jalan-jalan
  rationale: Bentuk jamak ini secara harfiah berarti jalan-jalan atau jalur-jalur. Bentuk jamak dipertahankan agar metafora Ibrani tetap tampak.
- source_word: מִשְׁפָּט
  choice: keadilan
  rationale: Dalam konteks penyuapan dan penyimpangan hukum, kata ini menunjuk pada keadilan atau proses penghakiman yang benar; “keadilan” paling tepat menyatakan pokok moral ayat.
- source_word: אָרְחוֹת מִשְׁפָּט
  choice: jalan-jalan keadilan
  rationale: Ungkapan ini mempertahankan gambaran jamak dalam bahasa Ibrani tentang jalur-jalur yang seharusnya ditempuh keadilan, meskipun “jalannya keadilan” lebih lazim dalam bahasa Indonesia.
theological_decisions: []
