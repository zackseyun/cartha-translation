  text: לָ/מָּה זֶּ֣ה מְחִ֣יר בְּ/יַד כְּסִ֑יל לִ/קְנ֖וֹת חָכְמָ֣ה וְ/לֶב אָֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/016.yaml
  text: Why is there a price in the hand of a fool to buy wisdom when he has no heart for it?[a]
translation:
  language: id
  text: Untuk apa ada uang di tangan orang bebal untuk membeli hikmat, padahal ia tidak berakal budi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan tidak ada hati.” Dalam bahasa Ibrani, “hati” dapat menunjuk pada pusat pengertian, pertimbangan, atau kemauan seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה זֶּה
  choice: Untuk apa ada
  rationale: Ungkapan ini membuka pertanyaan retoris. “Untuk apa ada” terdengar alami dalam bahasa Indonesia dan menyoroti kesia-siaan keadaan yang digambarkan.
- source_word: מְחִיר
  choice: uang
  rationale: Kata ini menunjuk pada harga atau sarana untuk melakukan pembelian. Dalam gambaran sesuatu yang berada “di tangan,” “uang” menyampaikan metafora perdagangan secara lebih alami daripada “harga.”
- source_word: בְּיַד
  choice: di tangan
  rationale: Mempertahankan gambaran konkret bahasa Ibrani sekaligus dapat dipahami sebagai sesuatu yang dimiliki atau dikuasai.
- source_word: כְּסִיל
  choice: orang bebal
  rationale: Istilah khas sastra hikmat bagi orang yang keras kepala secara moral dan tidak mau menerima kebijaksanaan; “orang bebal” merupakan padanan Indonesia yang mapan dan bermartabat.
- source_word: לִקְנוֹת
  choice: untuk membeli
  rationale: Dalam konteks adanya uang, verba ini membawa arti komersial yang langsung dan mempertahankan permainan gagasan bahwa hikmat tidak sungguh-sungguh dapat diperoleh hanya dengan daya beli.
- source_word: חָכְמָה
  choice: hikmat
  rationale: Dalam Amsal, kata ini terutama menunjuk pada kecakapan moral dan praktis untuk hidup dengan benar; “hikmat” adalah padanan baku yang sesuai.
- source_word: וְלֶב אָיִן
  choice: padahal ia tidak berakal budi
  rationale: Secara harfiah, frasa ini berbunyi “dan tidak ada hati.” Dalam antropologi Ibrani, “hati” mencakup pengertian, pertimbangan, dan kemauan. “Tidak berakal budi” menyampaikan kekurangan batin yang dimaksud tanpa menyiratkan sekadar ketiadaan emosi.
theological_decisions:
- issue: Apakah orang bebal tidak memiliki kemampuan atau tidak memiliki kemauan untuk memperoleh hikmat
  choice: Tidak dipersempit pada salah satu kemungkinan; “tidak berakal budi” menyatakan kekurangan batin secara umum.
  alternative: “Tidak berniat memperolehnya” atau “tidak mampu memahaminya.”
  rationale: Kata “hati” dalam bahasa Ibrani dapat meliputi pengertian, penilaian, dan kehendak. Teks tidak secara tegas membatasi maksudnya pada ketidakmampuan ataupun ketidakmauan saja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak sastra hikmat yang ringkas dan bermartabat. “Orang bebal” mempertahankan istilah tradisional yang masih jelas, sedangkan “uang” membuat gambaran komersial alami dalam bahasa Indonesia.
