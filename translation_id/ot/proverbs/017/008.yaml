  text: A bribe is a charm-stone in the eyes of its owner[a]; wherever he turns[b], he prospers.
translation:
  language: id
  text: Suap adalah batu pembawa keberuntungan di mata pemiliknya[a]; ke mana pun ia berpaling, ia berhasil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “batu kemurahan” atau “batu perkenanan”; mungkin juga berarti “batu berharga” atau semacam benda pembawa keberuntungan.
    reason: lexical_alternative
  - marker: b
    text: Atau “ia memperoleh keberhasilan.” Kata Ibrani ini juga dapat mengandung nuansa bertindak dengan bijaksana atau efektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶבֶן חֵן
  choice: batu pembawa keberuntungan
  rationale: Secara harfiah berarti “batu kemurahan/perkenanan.” Dalam konteks ini, ungkapan tersebut secara metaforis menggambarkan benda yang dianggap mendatangkan perkenanan atau keberhasilan. Pilihan ini mempertahankan citra batu tanpa menyiratkan bahwa amsal membenarkan suap.
- source_word: הַשֹּׁחַד
  choice: suap
  rationale: Kata benda ini lazim menunjuk pada pemberian yang dimaksudkan untuk memengaruhi keputusan secara tidak patut, bukan sekadar pemberian netral.
- source_word: בְּעֵינֵי בְעָלָיו
  choice: bagi orang yang memilikinya
  rationale: Ungkapan Ibrani “di mata pemiliknya” menyatakan sudut pandang. Bentuk Indonesia ini alami dan memperjelas bahwa penilaian tersebut berasal dari pemegang atau pemberi suap.
- source_word: אֶל כָּל אֲשֶׁר יִפְנֶה
  choice: ke mana pun ia berpaling
  rationale: Terjemahan ini mempertahankan idiom arah yang mencakup setiap tempat atau usaha yang dituju orang tersebut.
- source_word: יַשְׂכִּיל
  choice: ia berhasil
  rationale: Bentuk hifil dari שׂכל dapat menyatakan bertindak dengan bijaksana atau efektif, berhasil, maupun memperoleh keberhasilan. Dalam konteks suap, hasil praktis lebih menonjol daripada kebijaksanaan moral.
theological_decisions:
- issue: Apakah amsal ini memuji atau sekadar mengamati daya guna suap
  choice: Dipertahankan sebagai pengamatan dari sudut pandang pemilik suap, tanpa tambahan kecaman atau persetujuan eksplisit.
  alternative: Menambahkan bahwa keberhasilan itu hanya tampak atau bersifat jahat.
  rationale: Teks menyebut bagaimana suap dipandang oleh pemiliknya dan hasil yang dialaminya, tetapi tidak secara eksplisit memberi penilaian moral dalam ayat ini. Menambahkan kecaman atau pembenaran akan melampaui bunyi teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada amsal yang ringkas dan bermartabat. “Bagaikan” menyampaikan metafora secara alami; “batu pembawa keberuntungan” mempertahankan citra konkret sekaligus diberi catatan untuk menjaga ambiguitas leksikal sumber.
