source:
  edition: WLC
  text: מַצְדִּ֣יק רָ֭שָׁע וּ/מַרְשִׁ֣יעַ צַדִּ֑יק תּוֹעֲבַ֥ת יְ֝הוָ֗ה גַּם שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/015.yaml
  text: The one who acquits the wicked and the one who condemns the righteous—both alike are an abomination to Yahweh[a].
translation:
  language: id
  text: Orang yang membebaskan orang fasik dan orang yang menyatakan orang benar bersalah—keduanya adalah kekejian bagi Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Orang yang membenarkan orang fasik dan orang yang menyatakan orang benar bersalah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַצְדִּיק
  choice: orang yang membebaskan
  rationale: Partisipel Hifil dari צדק digunakan secara forensik dan berhadapan dengan tindakan menyatakan bersalah. “Membebaskan” menyampaikan putusan hukum yang melepaskan terdakwa, tanpa muatan teologis tambahan yang dapat muncul pada “membenarkan”.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Menunjuk kepada orang yang bersalah secara moral. “Orang fasik” mempertahankan cakupan etis Ibrani dan tidak mempersempitnya menjadi status hukum semata.
- source_word: וּמַרְשִׁיעַ
  choice: dan orang yang menyatakan ... bersalah
  rationale: Partisipel Hifil dari רשע dalam konteks pengadilan berarti menjatuhkan putusan bersalah. Ungkapan ini memperjelas tindakan yudisial dan membentuk kontras tepat dengan “membebaskan”.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Istilah ini mencakup orang yang benar secara moral sekaligus berada di pihak yang benar dalam perkara. “Orang benar” menjaga kedua resonansi itu, sedangkan “orang tidak bersalah” lebih sempit.
- source_word: תּוֹעֲבַת
  choice: menjijikkan
  rationale: Menyampaikan penolakan moral yang sangat kuat di hadapan Allah dengan bahasa Indonesia modern dan alami; bentuk predikatif ini sesuai dengan konstruksi nominal Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: גַּם שְׁנֵיהֶם
  choice: keduanya sama-sama
  rationale: Menangkap penekanan bahwa kedua pelaku tersebut, tanpa perbedaan, merupakan kejijikan bagi Yahweh.
theological_decisions:
- issue: Makna forensik atau transformatif dari verba צדק dan רשע
  choice: 'Bahasa pengadilan: “membebaskan” dan “menyatakan ... bersalah”'
  alternative: Makna moral yang lebih umum, seperti “menganggap benar” dan “menganggap fasik”
  rationale: Kedua partisipel Hifil membentuk antitesis yudisial. Terjemahan forensik mempertahankan kecaman terhadap pemutarbalikan keadilan tanpa memasukkan pengertian doktrinal yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada amsal. Istilah “orang fasik” dan “orang benar” mempertahankan dimensi moral sumber, sementara verba putusannya dibuat eksplisit secara yudisial.
