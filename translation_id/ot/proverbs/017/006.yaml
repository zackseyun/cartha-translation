id: PRO.17.6
reference: Proverbs 17:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עֲטֶ֣רֶת זְ֭קֵנִים בְּנֵ֣י בָנִ֑ים וְ/תִפְאֶ֖רֶת בָּנִ֣ים אֲבוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/006.yaml
  text: Grandchildren are the crown of the aged[b][a], and the glory of children is their fathers.
translation:
  language: id
  text: 'Cucu[a] adalah mahkota orang lanjut usia,[b]

    dan kemuliaan anak-anak adalah ayah mereka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak dari anak-anak.”
    reason: lexical_alternative
  - marker: b
    text: Atau “orang-orang tua”; kata Ibrani ini menunjuk kepada orang yang telah tua, bukan khusus kepada penatua sebagai pemegang jabatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: mahkota
  rationale: Mempertahankan metafora mahkota sebagai lambang kehormatan dan kebanggaan, sekaligus membentuk kesejajaran dengan "kemuliaan" pada baris kedua.
- source_word: זְקֵנִים
  choice: orang lanjut usia
  rationale: Menunjuk kepada orang yang telah tua, bukan khusus para penatua yang memegang jabatan. Ungkapan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: בְּנֵי בָנִים
  choice: cucu
  rationale: Frasa harfiahnya berarti "anak-anak dari anak-anak", tetapi secara idiomatis menunjuk kepada cucu. Bahasa Indonesia tidak wajib menandai bentuk jamak di sini.
- source_word: תִפְאֶרֶת
  choice: kemuliaan
  rationale: Maknanya mencakup kemegahan, keindahan, dan kehormatan. "Kemuliaan" menjaga gaya luhur serta kesejajaran dengan "mahkota".
- source_word: בָּנִים
  choice: anak-anak
  rationale: Walaupun bentuk Ibraninya maskulin jamak, dalam amsal keluarga ini kata tersebut dapat mewakili anak-anak secara umum.
- source_word: אֲבוֹתָם
  choice: ayah mereka
  rationale: Teks Ibrani secara khusus memakai istilah maskulin "ayah", bukan istilah umum "orang tua" atau "leluhur"; unsur gender sumber dipertahankan.
theological_decisions:
- issue: Istilah keluarga bergender dalam pernyataan amsal yang bersifat umum
  choice: Menerjemahkan בָּנִים sebagai "anak-anak", tetapi mempertahankan אֲבוֹתָם sebagai "ayah mereka".
  alternative: Menerjemahkan keduanya secara lebih harfiah sebagai "anak-anak lelaki" dan "ayah mereka", atau menggeneralisasi baris kedua menjadi "anak-anak" dan "orang tua mereka".
  rationale: Amsal ini berbicara secara umum tentang kehormatan antargenerasi. בָּנִים dapat berfungsi secara representatif, sedangkan אֲבוֹתָם secara eksplisit menyebut ayah. Pilihan ini tidak mempersempit anak menjadi putra saja dan tidak menghapus istilah maskulin yang nyata pada sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada luhur sesuai bentuk amsal. Baris puitis serta kesejajaran "mahkota—kemuliaan" dipertahankan. Bentuk tunggal tak bertanda pada "cucu" dipakai secara generik dan alami dalam bahasa Indonesia.
