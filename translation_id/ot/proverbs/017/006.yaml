  source_fidelity: 'Terjemahan secara tepat mengikuti kedua klausa nominal dalam teks Ibrani: בְּנֵי בָנִים diterjemahkan idiomatis sebagai “cucu”, זְקֵנִים sebagai “orang lanjut usia” tanpa menyiratkan jabatan penatua, dan אֲבוֹתָם tetap sebagai “ayah mereka”, bukan “orang tua mereka”. Metafora kehormatan dalam “mahkota” dan תִפְאֶרֶת sebagai “kemuliaan” dipertahankan.'
