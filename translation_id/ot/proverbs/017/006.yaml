  terminology: “Mahkota”, “kemuliaan”, “anak-anak”, dan “ayah mereka” konsisten dengan makna leksikal dan register hikmat. “Orang lanjut usia” merupakan padanan modern yang jelas bagi זְקֵנִים dan menghindari ambiguitas “orang tua” yang dalam bahasa Indonesia juga dapat berarti parents.
