  yaml_path: translation/ot/proverbs/017/028.yaml
  text: Even a fool who keeps silent is considered wise; one who closes his lips[a], discerning.
translation:
  language: id
  text: Bahkan orang bodoh yang berdiam diri dianggap bijaksana; orang yang mengatupkan bibirnya dianggap berpengertian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם
  choice: Bahkan
  rationale: 'Menandai perluasan yang mengejutkan atau konsesif: orang bodoh sekalipun dapat dipandang bijaksana dalam keadaan ini.'
- source_word: אֱוִיל
  choice: orang bodoh
  rationale: Padanan baku dan wajar bagi istilah sastra hikmat yang menunjuk pada kekurangan moral sekaligus intelektual.
- source_word: מַחֲרִישׁ
  choice: yang berdiam diri
  rationale: Partisip ini menggambarkan keadaan atau tindakan menahan diri dari berbicara; ungkapan ini alami dalam bahasa Indonesia.
- source_word: חָכָם יֵחָשֵׁב
  choice: dianggap bijaksana
  rationale: Bentuk pasif יֵחָשֵׁב menyatakan bahwa seseorang dinilai atau dipandang sebagai bijaksana.
- source_word: אֹטֵם
  choice: yang mengatupkan
  rationale: Mempertahankan gambaran konkret tindakan menutup bibir sambil menyiratkan pengendalian ucapan.
- source_word: שְׂפָתָיו
  choice: bibirnya
  rationale: Terjemahan harfiah mempertahankan citraan tubuh dalam paralelisme Ibrani.
- source_word: נָבוֹן
  choice: berpengertian
  rationale: Menyatakan orang yang memiliki pemahaman atau daya membedakan; cocok sebagai pasangan puitis bagi 'bijaksana'.
