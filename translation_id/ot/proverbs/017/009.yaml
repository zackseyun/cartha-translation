  text: Whoever covers over an offense seeks love[c][b][a], but he who repeats a matter separates close friends.
translation:
  language: id
  text: Orang yang menutupi pelanggaran[a] mencari kasih, tetapi orang yang mengungkit kembali suatu perkara[b] memisahkan sahabat karib.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menutupi pemberontakan.” Bahasa Ibrani mempertahankan kiasan menutupi dan tidak secara eksplisit mengatakan “mengampuni.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “mengulangi suatu perkara.” Maksudnya dapat berupa membawa atau mengungkit kembali kesalahan yang telah terjadi, alih-alih membiarkannya berlalu.
    reason: lexical_alternative
  - marker: c
    text: Bahasa Ibrani memakai bentuk tunggal, “seorang sahabat karib.” Dalam bahasa Indonesia, “sahabat karib” dapat dipahami secara umum tanpa harus menentukan tunggal atau jamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַסֶּה
  choice: menutupi
  rationale: Partisipel dari כסה mempertahankan gambaran konkret ‘menutupi’ dan dalam konteks ini berarti tidak membongkar atau terus mempermasalahkan kesalahan orang lain; terjemahan ini tidak mempersempit maknanya menjadi ‘mengampuni’.
- source_word: פֶּשַׁע
  choice: pelanggaran
  rationale: פשע dapat berarti pemberontakan atau pelanggaran. Dalam konteks hubungan antarmanusia ini, ‘pelanggaran’ cukup luas, wajar, dan tetap mempertahankan bobot moral kata Ibraninya.
- source_word: מְבַקֵּשׁ
  choice: mencari
  rationale: ‘Mencari’ merupakan padanan langsung dan alami bagi partisipel בקש serta mempertahankan hubungan sebab-akibat yang ringkas dalam amsal ini.
- source_word: אַהֲבָה
  choice: kasih
  rationale: ‘Kasih’ menerjemahkan makna luas אַהֲבָה tanpa membatasinya hanya pada persahabatan atau rasa suka.
- source_word: שֹׁנֶה
  choice: mengungkit kembali
  rationale: שנה berarti mengulangi atau melakukan lagi. Bersama בְדָבָר, konteksnya menunjuk pada membawa kembali suatu persoalan yang seharusnya dibiarkan berlalu; ‘mengungkit kembali’ menyampaikan maksud ini secara alami dalam bahasa Indonesia.
- source_word: בְדָבָר
  choice: suatu perkara
  rationale: דבר dapat berarti perkataan, hal, atau perkara. ‘Suatu perkara’ mempertahankan keluasan makna dan cocok dengan konteks perselisihan.
- source_word: מַפְרִיד
  choice: memisahkan
  rationale: Bentuk Hifil ini menyatakan tindakan menyebabkan perpisahan; ‘memisahkan’ adalah padanan langsung yang tetap kuat dan ringkas.
- source_word: אַלּוּף
  choice: sahabat karib
  rationale: Dalam sastra hikmat, אַלּוּף menunjuk pada rekan atau sahabat yang dekat. ‘Sahabat karib’ menyampaikan tingkat keakraban tersebut; bahasa Indonesia tidak wajib menandai jumlah sehingga bentuk ini juga dapat membawa daya umum amsal.
