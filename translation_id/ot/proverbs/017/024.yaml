base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/024.yaml
  text: Wisdom is before the face of a discerning man[c][b][a], but the eyes of a fool are at the ends of the earth.
translation:
  language: id
  text: Hikmat ada di hadapan orang yang berpengertian[a][b], tetapi mata orang bodoh melayang sampai ke ujung bumi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di depan wajah orang yang berpengertian”; ungkapan Ibrani ini juga dapat berarti “di hadapan” atau “dekat dengan”.
    reason: lexical_alternative
  - marker: b
    text: Bentuk Ibraninya maskulin tunggal, tetapi dipakai sebagai gambaran umum untuk siapa saja yang berpengertian.
    reason: lexical_alternative
  - marker: c
    text: Atau “negeri”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת פְּנֵי
  choice: di hadapan
  rationale: Gabungan ini dipahami secara preposisional, yakni “di hadapan” atau “dekat pada”, bukan dengan אֶת sebagai penanda objek langsung. Pilihan ini menyampaikan bahwa hikmat tersedia dekat bagi orang yang berpengertian, sekaligus mempertahankan citra kehadiran yang terkandung dalam kata “wajah”.
- source_word: מֵבִין
  choice: orang yang berpengertian
  rationale: Partisip ini menunjuk kepada seseorang yang memiliki pengertian atau daya membedakan. Bahasa Indonesia secara alami memakai bentuk generik tanpa menambahkan jenis kelamin yang tidak perlu.
- source_word: חָכְמָה
  choice: Hikmat
  rationale: Nomina abstrak ini menjadi subjek klausa. Huruf kapital hanya mengikuti posisinya pada awal kalimat dan tidak menyiratkan personifikasi teologis.
- source_word: וְעֵינֵי
  choice: tetapi mata
  rationale: Walaupun וְ secara dasar berarti “dan”, hubungan antarklausa jelas bersifat kontras sehingga “tetapi” paling tepat dalam bahasa Indonesia.
- source_word: כְסִיל
  choice: orang bodoh
  rationale: Dalam Amsal, istilah ini menunjuk kepada orang yang bodoh secara moral dan intelektual, bukan sekadar kurang cerdas.
- source_word: בִּקְצֵה אָרֶץ
  choice: ke ujung-ujung bumi
  rationale: Ungkapan ini menggambarkan perhatian yang mengembara sangat jauh. “Tertuju ke ujung-ujung bumi” alami dalam bahasa Indonesia dan mempertahankan hiperbola Ibrani.
theological_decisions:
- issue: Subjek peribahasa yang berbentuk maskulin
  choice: orang yang berpengertian
  alternative: laki-laki yang berpengertian
  rationale: Bentuk Ibrani adalah maskulin tunggal, tetapi berfungsi sebagai tipe manusia secara umum. Kata “orang” menyampaikan cakupan generik itu secara alami tanpa mengubah makna.
- issue: Personifikasi hikmat
  choice: Hikmat sebagai nomina abstrak
  alternative: Hikmat sebagai sosok yang dipersonifikasikan
  rationale: Ayat ini tidak mengharuskan personifikasi teologis. Terjemahan mempertahankan hikmat sebagai kualitas yang tersedia di hadapan orang berpengertian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada peribahasa. “Di hadapan” dipilih daripada ungkapan harfiah “di depan wajah” agar alami, sedangkan “tertuju ke ujung-ujung bumi” mempertahankan kontras antara hikmat yang dekat dan perhatian orang bodoh yang mengembara jauh.
