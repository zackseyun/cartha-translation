translation:
  language: id
  text: 'Siapa yang mencintai pelanggaran mencintai pertengkaran;

    siapa yang membuat pintunya tinggi mencari kehancuran.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “siapa yang meninggikan pintu atau jalan masuknya mencari keruntuhan.” Gambaran ini dapat menyiratkan kesombongan atau tindakan meninggikan diri, bangunan yang dibuat mencolok, atau sikap yang mengundang malapetaka. Kata terakhir juga dapat diterjemahkan “keruntuhan” atau “kebinasaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: mencintai
  rationale: Partisipel Qal dari אָהַב menyatakan kasih atau kegemaran yang menetap. “Mencintai” mempertahankan daya moral dan pengulangan dalam kedua bagian baris pertama.
- source_word: פֶּשַׁע
  choice: pelanggaran
  rationale: Kata ini menunjuk pada pelanggaran yang disengaja atau pemberontakan, bukan sekadar kekeliruan. “Pelanggaran” alami dalam bahasa Indonesia dan tetap mempertahankan bobot etisnya.
- source_word: מַצָּה
  choice: pertengkaran
  rationale: Nomina ini berarti perselisihan atau pertikaian. “Pertengkaran” mudah dipahami dan cocok dengan hubungan sebab-akibat yang tersirat dalam pepatah.
- source_word: מַגְבִּיהַּ
  choice: meninggikan
  rationale: Partisipel Hifil dari גבה berarti membuat tinggi atau meninggikan. Bentuk ini mempertahankan gambaran konkret dan kemungkinan makna kiasannya.
- source_word: פִּתְחוֹ
  choice: pintu rumahnya
  rationale: פֶּתַח dapat berarti bukaan, jalan masuk, atau pintu. “Pintu rumahnya” terdengar alami dan memperjelas gambaran bangunan tanpa mempersempitnya menjadi gerbang kota.
- source_word: מְבַקֶּשׁ
  choice: mencari
  rationale: Partisipel dari בקש secara langsung berarti mencari. Dalam konteks pepatah, ungkapan ini secara ironis menyiratkan tindakan yang mengundang akibat buruk.
- source_word: שָׁבֶר
  choice: kehancuran
  rationale: שֶׁבֶר dapat berarti pecah, keruntuhan, kebinasaan, atau malapetaka. “Kehancuran” menyampaikan beratnya akibat sambil tetap cukup luas untuk mencakup keruntuhan harfiah maupun kiasan.
