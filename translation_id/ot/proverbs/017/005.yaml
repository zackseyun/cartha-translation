source:
  edition: WLC
  text: לֹעֵ֣ג לָ֭/רָשׁ חֵרֵ֣ף עֹשֵׂ֑/הוּ שָׂמֵ֥חַ לְ֝/אֵ֗יד לֹ֣א יִנָּקֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/005.yaml
  text: Whoever mocks the poor insults his Maker[c][b][a]; he who rejoices at calamity will not go unpunished.
translation:
  language: id
  text: Siapa mencemooh orang miskin menghina Penciptanya; siapa bergembira atas kemalangan tidak akan luput dari hukuman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak akan dinyatakan tidak bersalah” atau “tidak akan dibebaskan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹעֵג
  choice: mencemooh
  rationale: Partisipel ini menyatakan ejekan yang merendahkan. “Mencemooh” alami dalam bahasa Indonesia dan mempertahankan unsur penghinaan aktif.
- source_word: לָרָשׁ
  choice: orang miskin
  rationale: רָשׁ menunjuk kepada orang yang miskin atau berkekurangan. Bentuk tunggal “orang miskin” mempertahankan rujukan personal yang kemudian diacu oleh akhiran pada עֹשֵׂהוּ.
- source_word: חֵרֵף
  choice: menghina
  rationale: Kata kerja ini berarti mencela atau memperlakukan dengan hina. “Menghina” menyampaikan daya interpersonalnya tanpa mempersempit makna menjadi penghujatan kultis.
- source_word: עֹשֵׂהוּ
  choice: Penciptanya
  rationale: Secara harfiah berarti “dia yang menjadikannya,” dengan akhiran yang secara alami mengacu kepada orang miskin. “Penciptanya” ringkas, bermartabat, dan mempertahankan relasi personal itu.
- source_word: שָׂמֵחַ
  choice: bergembira
  rationale: Bentuk ini menyatakan sikap merasa senang. “Bergembira” sesuai dengan gaya amsal dan mempertahankan bobot moral dari sikap tersebut.
- source_word: לְאֵיד
  choice: atas kemalangan
  rationale: אֵיד berarti bencana, kehancuran, atau malapetaka. “Kemalangan” cukup luas untuk mencakup nasib buruk yang menimpa orang lain dan alami dengan “bergembira atas.”
- source_word: לֹא יִנָּקֶה
  choice: tidak akan luput dari hukuman
  rationale: Bentuk Nifal dari נקה dapat berarti tidak dinyatakan bebas, tidak dianggap tak bersalah, atau tidak dibiarkan tanpa hukuman. Pilihan ini mengungkapkan akibat moral-yudisial secara jelas sambil mempertahankan keniscayaannya.
theological_decisions:
- issue: Acuan akhiran dalam “Penciptanya”
  choice: 'Akhiran mengacu kepada orang miskin: mencemooh orang miskin berarti menghina Allah yang menciptakannya.'
  alternative: Menerjemahkan secara lebih umum sebagai “Sang Pencipta” tanpa menonjolkan hubungan posesif.
  rationale: Akhiran orang ketiga tunggal pada עֹשֵׂהוּ paling alami kembali kepada רָשׁ, “orang miskin.” Terjemahan mempertahankan dasar teologis martabat manusia dalam tindakan Allah sebagai Pencipta tanpa menambahkan penjelasan ke dalam ayat.
- issue: Cakupan ungkapan maskulin generik
  choice: Menggunakan “siapa” untuk kedua klausa sehingga berlaku umum tanpa menambah penandaan gender yang tidak diperlukan dalam bahasa Indonesia.
  alternative: Menggunakan “orang yang” atau “ia yang.”
  rationale: Bentuk Ibrani secara gramatikal maskulin tunggal tetapi berfungsi generik dalam gaya amsal. “Siapa” mempertahankan keumuman dan kesejajaran dengan alami dalam bahasa Indonesia.
- issue: Sifat hukuman dalam לֹא יִנָּקֶה
  choice: Menyatakan kepastian bahwa pelaku tidak luput dari hukuman, tanpa menentukan bentuk, waktu, atau sarana hukuman.
  alternative: “Tidak akan dinyatakan tidak bersalah” atau “tidak akan dibebaskan.”
  rationale: Teks menegaskan akibat yudisial-moral tetapi tidak menjelaskan bagaimana atau kapan akibat itu dijalankan. Terjemahan tidak menambahkan mekanisme penghukuman tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada amsal. Paralelisme “Siapa ...; siapa ...” dipertahankan. Huruf kapital pada “Penciptanya” menandai rujukan kepada Allah, sedangkan akhiran -nya mempertahankan kaitannya dengan orang miskin.
