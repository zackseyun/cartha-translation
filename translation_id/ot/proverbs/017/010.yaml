  text: A rebuke goes deeper into a man of understanding than a hundred blows into a fool[a].
translation:
  language: id
  text: Teguran lebih meresap ke dalam diri orang yang berpengertian daripada seratus kali memukul orang bebal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֵּחַת
  choice: lebih meresap ke dalam diri
  rationale: Bentuk dari נחת menyatakan turun atau masuk secara mendalam. Dalam konteks amsal ini, ungkapan tersebut menggambarkan teguran yang memberi dampak batin yang lebih dalam; kata "lebih" juga menyatakan perbandingan dengan frasa berikutnya.
- source_word: גְּעָרָה
  choice: teguran
  rationale: Kata benda ini menunjuk pada koreksi verbal yang tegas. "Teguran" alami, ringkas, dan bermartabat dalam bahasa Indonesia.
- source_word: בְמֵבִין
  choice: ke dalam diri orang yang berpengertian
  rationale: Partisipel tunggal ini berarti orang yang memahami atau mampu membedakan dengan bijaksana. "Orang yang berpengertian" mempertahankan sifat representatif ungkapan hikmat tanpa menambahkan unsur yang tidak dinyatakan teks.
- source_word: מֵהַכּוֹת
  choice: daripada ... pukulan kepada
  rationale: Prefiks מ menandai perbandingan, sedangkan bentuk infinitif נכה berarti memukul. Susunan ini mempertahankan kontras antara dampak teguran dan dampak pemukulan.
- source_word: כְּסִיל
  choice: orang bebal
  rationale: Dalam Amsal, istilah ini menunjuk pada orang yang keras kepala secara moral dan tidak mau menerima hikmat, bukan sekadar orang yang kurang cerdas. "Orang bebal" merupakan padanan Indonesia yang mapan dan tepat.
- source_word: מֵאָה
  choice: seratus
  rationale: Bilangan ini menajamkan kontras secara hiperbolis dan diterjemahkan langsung.
theological_decisions: []
