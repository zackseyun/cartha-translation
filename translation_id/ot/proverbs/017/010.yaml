  register: Bahasa Indonesia baku modern dengan corak amsal yang ringkas dan bermartabat. Ungkapan "lebih meresap" dipilih agar gambaran penetrasi batin terdengar alami, sedangkan "orang bebal" mempertahankan istilah khas sastra hikmat.
