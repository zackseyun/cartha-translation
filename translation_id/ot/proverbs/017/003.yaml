source:
  edition: WLC
  text: מַצְרֵ֣ף לַ֭/כֶּסֶף וְ/כ֣וּר לַ/זָּהָ֑ב וּ/בֹחֵ֖ן לִבּ֣וֹת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/003.yaml
  text: The crucible is for silver[a], and the furnace for gold[b], but Yahweh tests hearts.
translation:
  language: id
  text: Cawan peleburan untuk perak dan tanur untuk emas, dan Yahweh menguji hati.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַצְרֵף
  choice: cawan peleburan
  rationale: Menunjuk pada wadah untuk melebur dan memurnikan logam; pilihan ini mempertahankan gambaran metalurgis dan membedakannya dari tanur pada baris sejajar.
- source_word: לַכֶּסֶף
  choice: untuk perak
  rationale: Prefiks ל menyatakan kegunaan atau peruntukan; bentuk tanpa kata sandang sesuai dengan sifat umum peribahasa.
- source_word: כּוּר
  choice: tanur
  rationale: Menunjuk pada tungku untuk melebur atau memurnikan logam; 'tanur' ringkas, lazim dalam ragam Alkitab Indonesia, dan sejajar dengan 'cawan peleburan'.
- source_word: לַזָּהָב
  choice: untuk emas
  rationale: Prefiks ל menyatakan kegunaan atau peruntukan, dan ungkapan ini mempertahankan kesejajaran dengan 'untuk perak'.
- source_word: וּבֹחֵן
  choice: tetapi ... menguji
  rationale: Partisipel בחן menyatakan tindakan memeriksa atau menguji untuk menyingkapkan mutu sejati. Konjungsi diterjemahkan 'tetapi' untuk menyampaikan kontras implisit antara alat penguji logam dan Yahweh sebagai penguji batin manusia.
- source_word: לִבּוֹת
  choice: hati
  rationale: Dalam antropologi Ibrani, 'hati' mencakup pikiran, kehendak, dan niat batin; metafora sumber dipertahankan tanpa mempersempitnya menjadi emosi saja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi, sedangkan 'TUHAN' merupakan penggantian tradisional dengan gelar.
- issue: Daya makna בחן terhadap batin manusia
  choice: menguji hati
  alternative: memeriksa hati
  rationale: '''Menguji'' mempertahankan hubungan metaforis dengan pemurnian logam dan gagasan penyingkapan mutu sejati, tanpa menentukan apakah pengujian itu terutama psikologis, moral, atau yudisial.'
- issue: Hubungan antarklausa yang ditandai וּ
  choice: tetapi
  alternative: dan
  rationale: 'Secara bentuk, וּ dapat diterjemahkan ''dan''; dalam peribahasa ini terdapat kontras semantis: logam memiliki sarana penguji, sedangkan hati diuji oleh Yahweh. ''Tetapi'' membuat kontras itu alami dalam bahasa Indonesia tanpa mengubah pokok perbandingan.'
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur paralel puisi Ibrani dipertahankan. Istilah 'cawan peleburan' dan 'tanur' menjaga pembedaan kedua alat metalurgi, sedangkan bentuk tunggal kolektif 'hati' terdengar alami dalam pepatah Indonesia.
