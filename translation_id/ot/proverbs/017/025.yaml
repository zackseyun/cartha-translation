  text: A foolish son is grief to his father[b][a], and bitterness to the woman who bore him.
translation:
  language: id
  text: Anak yang bebal mendatangkan kesusahan bagi ayahnya[a], dan kepahitan bagi perempuan yang melahirkannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mendatangkan kejengkelan bagi ayahnya” atau “mendatangkan dukacita bagi ayahnya.” Kata Ibrani ini dapat berarti kemarahan, kejengkelan, atau dukacita; di sini maksudnya kemungkinan besar adalah kesusahan batin yang ditimbulkan oleh anak itu.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “bagi orang yang melahirkannya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּעַס
  choice: kesusahan
  rationale: Nomina ini dapat menunjuk pada kemarahan, kejengkelan, atau dukacita. Dalam paralelisme ayat ini, yang ditekankan adalah tekanan batin yang ditimbulkan anak bebal pada ayahnya; “kesusahan” mempertahankan keluasan makna itu secara alami dalam bahasa Indonesia.
- source_word: לְאָבִיו
  choice: bagi ayahnya
  rationale: Preposisi לְ menyatakan pihak yang mengalami akibat. “Bagi ayahnya” wajar dalam struktur peribahasa Indonesia.
- source_word: בֵּן כְּסִיל
  choice: anak yang bebal
  rationale: כְּסִיל adalah istilah khas sastra hikmat bagi orang yang gagal secara moral dan praktis, bukan sekadar kurang cerdas. “Bebal” menyampaikan kategori hikmat tersebut.
- source_word: וּמֶמֶר
  choice: dan kepahitan
  rationale: Nomina langka ini paling mungkin berarti kepahitan atau dukacita pahit, selaras dengan כַּעַס pada baris pertama. Terjemahan literal “kepahitan” menjaga gambaran emosional teks.
- source_word: לְיוֹלַדְתּוֹ
  choice: bagi perempuan yang melahirkannya
  rationale: Bentuk partisipelnya secara harfiah menunjuk kepada orang yang melahirkannya. Ungkapan ini mempertahankan gambaran maternal yang lebih spesifik daripada sekadar “ibunya”.
