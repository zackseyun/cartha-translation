  text: אָדָ֣ם חֲסַר לֵ֭ב תּוֹקֵ֣עַ כָּ֑ף עֹרֵ֥ב עֲ֝רֻבָּ֗ה לִ/פְנֵ֥י רֵעֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/018.yaml
  text: A man lacking sense shakes hands[c][b][a], pledging security before his neighbor.
translation:
  language: id
  text: Orang yang tidak berpengertian[a] berjabat tangan[b] dan menjadi penjamin[c] di hadapan sesamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kekurangan hati”; dalam sastra hikmat Ibrani, hati dapat menunjuk pada pengertian dan pertimbangan.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan ini secara harfiah menggambarkan tindakan menepukkan telapak tangan, suatu gerak adat untuk mengikat janji atau kesanggupan sebagai penjamin.
    reason: cultural_note
  - marker: c
    text: Atau, “menanggung jaminan”. Maksudnya ialah menjamin kewajiban pihak lain.
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: Orang
  rationale: Nomina tunggal ini menunjuk kepada seorang individu sebagai contoh dalam pepatah hikmat. “Orang” mempertahankan daya representatifnya secara alami dalam bahasa Indonesia tanpa mengartikannya sebagai umat manusia secara umum.
- source_word: חֲסַר לֵב
  choice: tidak berpengertian
  rationale: Secara harfiah berarti “kekurangan hati”, tetapi dalam sastra hikmat Ibrani, “hati” sering menunjuk pada pengertian dan pertimbangan. Pilihan ini menyampaikan idiom tersebut dengan jelas tanpa memberi kesan gangguan jiwa seperti yang mungkin ditimbulkan oleh “tidak berakal sehat”.
- source_word: תּוֹקֵעַ כָּף
  choice: berjabat tangan
  rationale: Ungkapan harfiahnya adalah memukul atau menepukkan telapak tangan, yakni gerak adat untuk mengikat suatu janji atau kesanggupan. “Berjabat tangan” merupakan padanan Indonesia yang alami; fungsi hukum-keuangannya dijelaskan oleh frasa berikutnya dan catatan kaki.
- source_word: עֹרֵב עֲרֻבָּה
  choice: menjadi penjamin
  rationale: Pasangan kata kerja dan nomina serumpun ini menyatakan tindakan menanggung jaminan bagi kewajiban pihak lain. “Menjadi penjamin” mempertahankan makna hukum-keuangan tanpa menyiratkan bahwa orang itu menyerahkan barang jaminan.
- source_word: לִפְנֵי רֵעֵהוּ
  choice: di hadapan sesamanya
  rationale: לִפְנֵי paling langsung berarti “di hadapan”. Terjemahan ini tidak memutuskan apakah sesama itu penerima manfaat, kreditur, atau saksi dalam transaksi tersebut.
theological_decisions:
- issue: Identitas dan peran רֵעֵהוּ dalam tindakan penjaminan
  choice: di hadapan sesamanya
  alternative: bagi sesamanya
  rationale: Teks memakai לִפְנֵי, bukan preposisi yang secara tegas berarti “bagi”. Karena itu, terjemahan mempertahankan ketaksaan mengenai apakah sesama tersebut adalah pihak yang dijamin, kreditur, atau saksi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan kalimat menjaga bentuk pepatah yang ringkas. “Sesamanya” dipilih untuk רֵעֵהוּ karena cukup luas dan tidak menentukan hubungan hukum pihak tersebut secara berlebihan.
