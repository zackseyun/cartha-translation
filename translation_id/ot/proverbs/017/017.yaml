source:
  edition: WLC
  text: בְּ/כָל עֵ֭ת אֹהֵ֣ב הָ/רֵ֑עַ וְ/אָ֥ח לְ֝/צָרָ֗ה יִוָּלֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/017.yaml
  text: A friend loves at all times[a], and a brother is born for adversity.
translation:
  language: id
  text: Seorang sahabat mengasihi setiap waktu, dan seorang saudara dilahirkan untuk kesusahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan seorang saudara dilahirkan untuk masa kesusahan.”'
    reason: Alternatif ini membuat צָרָה dipahami sebagai masa atau keadaan kesusahan, tanpa mengubah metafora “dilahirkan”.
lexical_decisions:
- source_word: בְּכָל עֵת
  choice: setiap waktu
  rationale: Gabungan ב dengan כָּל dan עֵת menyatakan cakupan waktu yang menyeluruh. “Setiap waktu” mempertahankan bentuk ringkas dan klaim universal pepatah Ibrani.
- source_word: אֹהֵב
  choice: mengasihi
  rationale: Partisipel Qal ini menyatakan tindakan atau sifat yang menjadi ciri tetap. “Mengasihi” menerjemahkan maknanya secara langsung tanpa menambahkan cara kasih itu dinyatakan.
- source_word: הָרֵעַ
  choice: seorang sahabat
  rationale: Walaupun nomina Ibrani memakai artikel, dalam gaya pepatah artikel itu dapat menunjuk pada suatu golongan. “Seorang sahabat” menyampaikan maksud umum dan nuansa relasional dengan wajar.
- source_word: וְאָח
  choice: dan seorang saudara
  rationale: אָח pada dasarnya berarti “saudara” dan dapat pula menyiratkan solidaritas seperti kerabat dekat. Pilihan ini mempertahankan istilah sumber dan kesejajaran antarkedua larik.
- source_word: לְצָרָה
  choice: untuk kesusahan
  rationale: צָרָה berarti kesusahan, keadaan terjepit, atau kemalangan. Preposisi לְ dapat menyatakan tujuan atau keterarahan; terjemahan ringkas ini mempertahankan keluwesan hubungan tersebut.
- source_word: יִוָּלֵד
  choice: dilahirkan
  rationale: Bentuk Nifal dari ילד secara harfiah berarti “dilahirkan.” Pilihan ini mempertahankan metafora kuat dalam teks, tanpa menggantinya dengan tafsiran seperti “menjadi saudara.”
theological_decisions:
- issue: Hubungan antara kelahiran seorang saudara dan kesusahan
  choice: Mempertahankan ungkapan metaforis “dilahirkan untuk kesusahan” dalam teks utama
  alternative: Menafsirkannya sebagai “menjadi saudara pada masa kesusahan” atau “dilahirkan untuk menghadapi kesusahan”
  rationale: Bahasa Ibrani dapat dipahami sebagai tujuan/peranan saudara dalam kesusahan, tetapi bentuk harfiahnya tidak menjelaskan secara tegas apakah yang ditekankan adalah tujuan, kesempatan, atau peranan yang terwujud pada masa sulit. Teks utama menjaga ketegangan itu.
translation_notes:
  register: Bahasa dibuat ringkas, bermartabat, dan bercorak pepatah. “Setiap waktu” dipilih daripada “selalu” agar kesejajaran dan bentuk temporal teks Ibrani tetap terasa; “kesusahan” cukup luas untuk mencakup tekanan, kemalangan, dan penderitaan.
