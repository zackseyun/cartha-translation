  yaml_path: translation/ot/proverbs/017/027.yaml
  text: Whoever restrains his words has knowledge[b][a], and a man of understanding is cool in spirit.
translation:
  language: id
  text: 'Orang yang menahan kata-katanya berpengetahuan,

    dan laki-laki yang berpengertian[b] berjiwa sejuk.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tenang batinnya.” Secara harfiah, bahasa Ibrani mengatakan “sejuk/dingin dalam roh,” dengan memakai gambaran suhu untuk penguasaan diri.
    reason: lexical_alternative
  - marker: b
    text: Bentuk maskulin tunggal dalam bahasa Ibrani dipakai secara pepatah bagi seseorang yang bercirikan pengertian.
    reason: cultural_note
lexical_decisions:
- source_word: חוֹשֵׂךְ
  choice: menahan
  rationale: Partisipel ini menyatakan tindakan membatasi atau tidak mengumbar ucapan. “Menahan” alami dalam bahasa Indonesia dan mempertahankan penekanan pada pengendalian diri.
- source_word: אֲמָרָיו
  choice: kata-katanya
  rationale: Bentuk ini menunjuk pada perkataan atau ucapan seseorang; “kata-katanya” merupakan padanan langsung dan wajar.
- source_word: יוֹדֵעַ דָּעַת
  choice: memiliki pengetahuan
  rationale: Ungkapan Ibrani yang secara harfiah menyerupai “mengetahui pengetahuan” menggambarkan orang yang berpengetahuan. Padanan ini menyampaikan maksudnya tanpa menghasilkan ungkapan Indonesia yang janggal.
- source_word: וְקַר
  choice: sejuk
  rationale: Kata קַר secara konkret berarti “sejuk/dingin” dan di sini menjadi gambaran bagi ketenangan serta penguasaan diri. “Sejuk” mempertahankan citra suhu dalam teks sumber.
- source_word: רוּחַ
  choice: jiwanya
  rationale: רוּחַ di sini menunjuk pada keadaan batin atau watak. “Jiwanya” mempertahankan bahasa antropologis teks dan dapat dipahami secara alami dalam frasa ini.
- source_word: אִישׁ תְּבוּנָה
  choice: laki-laki yang berpengertian
  rationale: אִישׁ berbentuk maskulin tunggal dan תְּבוּנָה menyatakan pengertian atau daya membedakan. Terjemahan ini mempertahankan bentuk gender sumber, sementara catatan menjelaskan fungsi pepatah yang umum.
theological_decisions:
- issue: Ungkapan bergender dalam pepatah hikmat
  choice: laki-laki yang berpengertian
  alternative: orang yang berpengertian
  rationale: Teks Ibrani memakai אִישׁ, kata benda maskulin tunggal yang eksplisit. Bentuk itu dipertahankan tanpa menyimpulkan bahwa kebenaran pepatah hanya berlaku bagi laki-laki; penggunaan proverbialnya dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada hikmat. Paralelisme kedua baris dipertahankan. Ungkapan “sejuk jiwanya” sengaja mempertahankan citra suhu dari bahasa Ibrani, dengan alternatif idiomatis dijelaskan dalam catatan.
