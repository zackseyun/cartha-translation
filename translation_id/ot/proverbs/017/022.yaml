base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/022.yaml
  text: A joyful heart promotes healing[a], but a crushed spirit dries up the bones.
translation:
  language: id
  text: Hati yang gembira mendatangkan kesembuhan[a], tetapi semangat yang remuk mengeringkan tulang-tulang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkhasiat sebagai obat.” Kata Ibrani גֵּהָה dapat berarti kesembuhan, pemulihan, atau obat; teks utama memakai arti yang lebih luas, “kesembuhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: hati
  rationale: Dalam Amsal, kata ini menunjuk pada batin manusia, termasuk perasaan dan kehendak. “Hati” alami dalam bahasa Indonesia dan mempertahankan gambaran antropologisnya.
- source_word: שָׂמֵחַ
  choice: yang gembira
  rationale: Kata sifat ini menyatakan kegembiraan atau sukacita. “Hati yang gembira” merupakan ungkapan Indonesia yang wajar dan bermartabat.
- source_word: יֵיטִב
  choice: mendatangkan
  rationale: Bentuk Hifil dari יטב berarti membuat baik atau berbuat baik. Bersama גֵּהָה, “mendatangkan kesembuhan” menyampaikan daya penyebab atau manfaatnya secara alami tanpa menjadikannya klaim mekanis.
- source_word: גֵּהָה
  choice: kesembuhan
  rationale: Nomina langka ini dapat menunjuk pada kesembuhan, pemulihan, atau obat. “Kesembuhan” mempertahankan pengertian yang luas dan sesuai dengan kontras kerusakan tubuh pada baris kedua.
- source_word: רוּחַ
  choice: semangat
  rationale: Dalam konteks ini kata tersebut menunjuk pada daya batin atau keadaan batin seseorang. “Semangat” alami dalam bahasa Indonesia dan mempertahankan paralelnya dengan “hati”, tanpa mengharuskan arti Roh sebagai entitas terpisah.
- source_word: נְכֵאָה
  choice: yang remuk
  rationale: Kata ini menggambarkan keadaan yang terpukul, patah, atau hancur secara batin. “Remuk” mempertahankan kekuatan metaforanya.
- source_word: תְּיַבֶּשׁ
  choice: mengeringkan
  rationale: Bentuk Piel menyatakan tindakan membuat kering secara kuat. “Mengeringkan” langsung dan mempertahankan gambaran konkret teks.
- source_word: גָּרֶם
  choice: tulang-tulang
  rationale: Walaupun berbentuk tunggal, kata ini dapat dipakai secara kolektif. Bentuk jamak “tulang-tulang” terdengar alami dalam bahasa Indonesia dan menyatakan keseluruhan kerangka tubuh.
theological_decisions:
- issue: Hubungan antara keadaan batin dan kesehatan jasmani
  choice: Diterjemahkan sebagai pernyataan hikmat umum, bukan janji mutlak bahwa kegembiraan selalu menghasilkan kesembuhan fisik.
  alternative: Menafsirkan ayat sebagai jaminan langsung atau mekanis tentang penyembuhan jasmani.
  rationale: Genre amsal menyampaikan pengamatan umum tentang kehidupan. Terjemahan mempertahankan kaitan kuat dalam teks tanpa menambahkan kepastian teologis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas, puitis, dan mudah dipahami. Paralelisme “hati yang gembira” dan “semangat yang remuk” serta citra tubuh pada “tulang-tulang” dipertahankan.
