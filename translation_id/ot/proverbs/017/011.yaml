  text: אַךְ מְרִ֥י יְבַקֶּשׁ רָ֑ע וּ/מַלְאָ֥ךְ אַ֝כְזָרִ֗י יְשֻׁלַּח בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/011.yaml
  text: A rebellious man seeks only evil[a], and a cruel messenger will be sent against him.
translation:
  language: id
  text: Seorang pemberontak hanya mencari kejahatan, dan utusan[a] yang kejam akan dikirim melawannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “malaikat yang kejam akan dikirim melawannya.” Kata Ibrani yang digunakan dapat berarti “utusan” atau “malaikat.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: hanya
  rationale: Kata ini berfungsi membatasi atau menegaskan bahwa yang dicari orang yang memberontak itu hanyalah kejahatan.
- source_word: מְרִי
  choice: orang yang memberontak
  rationale: Walaupun secara bentuk dapat berarti pemberontakan, konteks dengan verba dan pronomina tunggal maskulin mendukung pengertian personal, yaitu seorang pemberontak; frasa ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: יְבַקֶּשׁ
  choice: mencari
  rationale: Bentuk piel dari בקש lazim berarti mencari atau mengusahakan; 'mencari' ringkas dan sesuai dengan konteks.
- source_word: רָע
  choice: kejahatan
  rationale: Kata רָע dapat berarti kejahatan, malapetaka, atau bahaya. Di sini 'kejahatan' menonjolkan sasaran moral dari orang yang memberontak tanpa menghapus akibat penghukuman pada baris kedua.
- source_word: מַלְאָךְ
  choice: utusan
  rationale: Istilah ini dapat menunjuk kepada utusan manusia maupun malaikat. 'Utusan' mempertahankan keluasan maknanya dan tidak menentukan identitas adikodrati yang tidak ditegaskan oleh ayat.
- source_word: אַכְזָרִי
  choice: yang kejam
  rationale: Pilihan ini menyampaikan sifat keras dan tanpa belas kasihan secara langsung dan alami.
- source_word: יְשֻׁלַּח
  choice: akan dikirim
  rationale: Bentuk pual bersifat pasif, dan bentuk mendatang cocok untuk menyatakan akibat yang akan menimpa pelaku.
- source_word: בּוֹ
  choice: untuk melawannya
  rationale: Dalam konteks permusuhan dan penghukuman, preposisi ini paling wajar diungkapkan sebagai arah tindakan yang menentang orang tersebut.
theological_decisions:
- issue: Apakah מַלְאָךְ menunjuk kepada malaikat adikodrati atau utusan secara umum
  choice: utusan
  alternative: malaikat
  rationale: Ayat ini tidak secara eksplisit menyatakan bahwa pelaksana hukuman itu makhluk surgawi. 'Utusan' mempertahankan ambiguitas leksikal Ibrani, sedangkan kemungkinan 'malaikat' dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis yang ringkas. Ungkapan 'orang yang memberontak' dipilih agar jelas bagi pembaca umum, sedangkan 'utusan' menjaga ambiguitas asli mengenai pelaksana hukuman.
