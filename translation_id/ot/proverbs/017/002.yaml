source:
  edition: WLC
  text: עֶֽבֶד מַשְׂכִּ֗יל יִ֭מְשֹׁל בְּ/בֵ֣ן מֵבִ֑ישׁ וּ/בְ/ת֥וֹךְ אַ֝חִ֗ים יַחֲלֹ֥ק נַחֲלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/002.yaml
  text: A prudent servant will rule over a son who brings shame[b][a], and among brothers he will share the inheritance.
translation:
  language: id
  text: Budak[a] yang bijaksana akan berkuasa atas anak yang mendatangkan malu, dan di antara saudara-saudara laki-laki[b] ia akan mendapat bagian dari warisan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamba” atau “pelayan.” Kata Ibrani עֶבֶד dapat memiliki arti-arti tersebut; “budak” dipakai di sini karena pembalikan kedudukan sosial merupakan bagian penting dari ketajaman amsal ini.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, istilah Ibrani ini berarti “saudara-saudara laki-laki” dan dalam konteks ini menunjuk pada para ahli waris keluarga.
    reason: gendered_familial_language
lexical_decisions:
- source_word: עֶבֶד
  choice: budak
  rationale: 'Kata ini dapat berarti hamba atau pelayan, tetapi dalam amsal ini status terikat dan rendah tokoh tersebut mempertajam pembalikan sosial: seorang budak yang bijaksana dapat berkuasa atas anak keluarga yang mendatangkan malu.'
- source_word: מַשְׂכִּיל
  choice: yang bijaksana
  rationale: Partisip dari שכל menunjuk pada orang yang bertindak dengan pengertian dan kebijaksanaan praktis; ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan corak sastra Amsal.
- source_word: יִמְשֹׁל בְּ
  choice: akan berkuasa atas
  rationale: Konstruksi ini menyatakan pelaksanaan kekuasaan atas seseorang dan mempertahankan pembalikan status yang menjadi inti amsal.
- source_word: בֵן מֵבִישׁ
  choice: anak yang mendatangkan malu
  rationale: Partisip מֵבִישׁ memiliki daya verbal, yaitu menyebabkan atau mendatangkan malu, bukan sekadar menyebut anak itu 'memalukan'.
- source_word: וּבְתוֹךְ אַחִים
  choice: dan di antara saudara-saudara laki-laki
  rationale: Terjemahan ini mempertahankan istilah kekerabatan maskulin dalam bahasa Ibrani sekaligus menyatakan bahwa budak tersebut ditempatkan di tengah para ahli waris keluarga.
- source_word: יַחֲלֹק נַחֲלָה
  choice: ia akan mendapat bagian dari warisan
  rationale: Dalam konteks warisan, חלק menyatakan turut menerima suatu bagian atau jatah. Rumusan ini lebih jelas dan alami daripada 'membagi warisan', yang dapat disalahpahami sebagai bertindak sebagai pembagi.
theological_decisions:
- issue: Bahasa kekerabatan bergender
  choice: saudara-saudara laki-laki
  alternative: saudara-saudara
  rationale: Bentuk Ibrani אַחִים secara eksplisit maskulin. Teks utama mempertahankan rincian itu tanpa memutuskan bahwa cakupan penerapan amsal harus dibatasi melampaui gambaran keluarga dan ahli waris yang dipakai teks.
- issue: Kedudukan עֶבֶד dalam pembalikan sosial
  choice: budak
  alternative: hamba atau pelayan
  rationale: 'Pemilihan ''budak'' mempertahankan ketegangan amsal: seorang bawahan yang terikat tetapi bijaksana dapat melampaui anak kandung yang mendatangkan malu. Terjemahan ini tidak dimaksudkan untuk memberi penilaian teologis atas lembaga perbudakan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dua klausa paralel dipertahankan. 'Mendapat bagian dari warisan' dipilih demi kejelasan makna hukum-keluarga, sedangkan 'berkuasa atas' mempertahankan daya pembalikan sosial teks Ibrani.
