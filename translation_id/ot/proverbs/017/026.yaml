  text: Also[a], to punish a righteous man is not good[b], nor to strike nobles for their uprightness.
translation:
  language: id
  text: 'Menghukum orang benar pun tidak baik,

    begitu juga memukul para bangsawan[a] karena kelurusan mereka.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: para pemimpin atau para pemuka. Kata Ibrani ini dapat menunjuk kepada orang-orang yang berkedudukan tinggi.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: memukul para bangsawan secara tidak adil. Frasa Ibrani ini dapat berarti bahwa mereka dipukul karena kelurusan mereka atau bahwa pemukulan itu dilakukan bertentangan dengan apa yang benar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: pun ... demikian pula
  rationale: Partikel ini menambahkan dan menghubungkan dua tindakan yang dinilai tidak patut. Susunan ini alami dalam bahasa Indonesia sekaligus mempertahankan daya aditifnya.
- source_word: עֲנוֹשׁ
  choice: menghukum
  rationale: Kata ini menunjuk pada pemberian hukuman atau sanksi secara umum; 'mendenda' akan mempersempit maknanya.
- source_word: לַצַּדִּיק
  choice: orang benar
  rationale: Ungkapan ini mempertahankan kategori moral dalam bahasa Ibrani dan memakai bentuk representatif yang wajar dalam bahasa Indonesia.
- source_word: לֹא טוֹב
  choice: tidak baik
  rationale: Terjemahan langsung ini mempertahankan ungkapan penilaian Ibrani tanpa mempersempitnya menjadi sekadar tidak sah atau tidak pantas.
- source_word: לְהַכּוֹת
  choice: memukul
  rationale: Kata kerja Ibrani memiliki arti luas 'memukul/menghantam'. Pilihan ini tidak menambahkan bentuk atau tingkat hukuman fisik yang tidak dinyatakan oleh teks.
- source_word: נְדִיבִים
  choice: para bangsawan
  rationale: Dalam konteks sosial dan hukum ini, kata tersebut paling mungkin menunjuk kepada orang-orang berkedudukan tinggi. Kemungkinan 'para pemimpin' dicatat dalam catatan kaki.
- source_word: עַל יֹשֶׁר
  choice: karena kelurusan mereka
  rationale: עַל dapat menyatakan alasan atau dasar tindakan, sehingga para bangsawan dipukul karena kelurusan mereka. Kemungkinan idiomatis 'bertentangan dengan keadilan' tetap dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Hubungan עַל יֹשֶׁר dengan tindakan memukul
  choice: 'Dipahami sebagai alasan: mereka dipukul karena kelurusan mereka.'
  alternative: 'Dipahami secara adverbial: memukul mereka dengan bertentangan dengan keadilan.'
  rationale: Makna kausal merupakan pembacaan leksikal yang langsung, tetapi konstruksinya sungguh memungkinkan pembacaan tentang tindakan yang bertentangan dengan apa yang benar. Ambiguitas ini tidak diputuskan secara dogmatis dan dicatat bagi pembaca.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat yang sesuai dengan amsal. Paralelisme kedua baris dipertahankan, dan istilah moral 'orang benar', 'baik', serta 'kelurusan' dibiarkan saling beresonansi.
