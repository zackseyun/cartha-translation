base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/021.yaml
  text: He who fathers a fool does so to his own grief[b][a], and the father of a fool has no joy.
translation:
  language: id
  text: Orang yang memperanakkan seorang bodoh mendatangkan dukacita bagi dirinya[a]; ayah orang keji tidak akan bersukacita[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Orang yang memperanakkan seorang bodoh, untuk dukacita bagi dirinya.” Susunan Ibraninya padat; ungkapan itu menyatakan bahwa kelahiran tersebut mendatangkan dukacita kepada sang ayah.'
    reason: lexical_alternative
  - marker: b
    text: “Orang keji” menerjemahkan kata Ibrani nābāl, yaitu orang yang hina atau tercela secara moral, bukan sekadar orang yang kurang cerdas.
    reason: cultural_note
lexical_decisions:
- source_word: יֹלֵד
  choice: menjadi ayah dari
  rationale: Partisipel Qal ini berarti orang yang memperanakkan atau menjadi ayah. Paralel dengan אֲבִי pada baris kedua menegaskan sudut pandang ayah; pilihan ini lebih alami dalam bahasa Indonesia modern daripada “memperanakkan”.
- source_word: כְּסִיל
  choice: anak bodoh
  rationale: כְּסִיל adalah istilah hikmat bagi orang yang bodoh sekaligus keras kepala secara moral, bukan sekadar kurang cerdas. “Anak bodoh” sesuai dengan relasi ayah-anak yang tersirat dalam konteks.
- source_word: לְתוּגָה לוֹ
  choice: akan berdukacita karenanya
  rationale: תּוּגָה menyatakan dukacita atau kesedihan, sedangkan לוֹ mengarahkan akibat itu kepada sang ayah. Terjemahan ini menyampaikan hasilnya secara wajar tanpa menentukan lebih jauh sebab khusus dukacita tersebut.
- source_word: וְלֹא יִשְׂמַח
  choice: tidak akan bersukacita
  rationale: Bentuk imperfek menyatakan akibat umum dalam pepatah. “Tidak akan bersukacita” mempertahankan bentuk verbal dan corak gnomicnya.
- source_word: אֲבִי
  choice: ayah
  rationale: Bentuk konstruksi ini berarti “ayah dari”; dalam susunan Indonesia, “ayah orang keji” sudah menyatakan hubungan tersebut dengan ringkas.
- source_word: נָבָל
  choice: orang keji
  rationale: נָבָל menunjuk kepada orang yang hina, tercela, atau rusak secara moral, bukan hanya orang yang kurang cerdas. “Orang keji” mempertahankan dimensi etis dan membedakannya dari כְּסִיל pada baris pertama.
theological_decisions:
- issue: Pembedaan antara כְּסִיל dan נָבָל
  choice: “anak bodoh” untuk כְּסִיל dan “orang keji” untuk נָבָל
  alternative: Menerjemahkan keduanya sebagai “orang bodoh”
  rationale: Bahasa Ibrani memakai dua istilah berbeda. Pembedaan ini menjaga tekanan hikmat dan moral teks tanpa memasukkan kategori teologis tambahan seperti “fasik” atau “tidak beribadah”.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bernada pepatah. Tanda titik koma mempertahankan kesejajaran kedua baris. Istilah “bersukacita” dipilih karena tetap wajar dalam register Alkitab yang bermartabat, sedangkan catatan kaki menjelaskan kepadatan bentuk Ibrani dan perbedaan dua istilah hikmat.
