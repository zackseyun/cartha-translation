source:
  edition: WLC
  text: בִּ/רְצ֣וֹת יְ֭הוָה דַּרְכֵי אִ֑ישׁ גַּם א֝וֹיְבָ֗י/ו יַשְׁלִ֥ם אִתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/007.yaml
  text: When a man's ways please Yahweh[a], he makes even his enemies be at peace with him.
translation:
  language: id
  text: Ketika jalan hidup seseorang berkenan kepada TUHAN[a], Ia membuat bahkan musuh-musuhnya hidup damai dengannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, nama pribadi Allah, yang juga dapat ditulis Yahweh.'
    reason: Menjelaskan bahwa "TUHAN" menerjemahkan nama ilahi, bukan sekadar gelar.
lexical_decisions:
- source_word: בִּרְצוֹת
  choice: Ketika ... berkenan kepada
  rationale: Preposisi ב dengan infinitif konstruk רצה membentuk klausa waktu atau keadaan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gagasan bahwa perilaku orang itu menyenangkan hati Allah.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Bentuk huruf kapital mengikuti kebiasaan Alkitab bahasa Indonesia untuk membedakan nama ilahi YHWH dari gelar umum 'Tuhan'.
- source_word: דַּרְכֵי אִישׁ
  choice: jalan hidup seseorang
  rationale: דֶּרֶךְ dalam bentuk jamak menunjuk pada cara hidup atau perilaku. אִישׁ bersifat generik di sini; 'seseorang' menyampaikan cakupan itu secara alami tanpa membatasi makna pada laki-laki.
- source_word: גַּם
  choice: bahkan ... pun
  rationale: 'Pasangan ''bahkan ... pun'' menyampaikan daya penegas גַּם: pengaruh perkenanan TUHAN menjangkau bahkan para musuh.'
- source_word: אֹיְבָיו
  choice: musuh-musuhnya
  rationale: Padanan langsung dan alami bagi nomina jamak dengan sufiks milik orang ketiga tunggal.
- source_word: יַשְׁלִם אִתּוֹ
  choice: dibuat-Nya hidup damai dengannya
  rationale: 'Bentuk Hifil dari שלם menyatakan sebab: TUHAN menyebabkan musuh-musuh orang itu berada dalam keadaan damai dengannya. Konstruksi pasif berpelaku ''-Nya'' mempertahankan TUHAN sebagai penyebab tanpa menghasilkan susunan Indonesia yang kaku.'
theological_decisions:
- issue: Cakupan generik אִישׁ
  choice: seseorang
  alternative: seorang laki-laki
  rationale: Dalam pepatah ini, bentuk tunggal maskulin mewakili manusia secara umum, bukan seorang pria tertentu. 'Seseorang' mempertahankan cakupan generiknya dalam bahasa Indonesia modern.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: TUHAN
  alternative: Yahweh
  rationale: Bentuk 'TUHAN' mengikuti konvensi mapan Alkitab bahasa Indonesia, sementara catatan kaki menjelaskan bahwa teks Ibrani memuat nama ilahi YHWH.
- issue: Pelaku יַשְׁלִם
  choice: TUHAN sebagai pihak yang membuat para musuh hidup damai
  alternative: orang itu membuat musuh-musuhnya hidup damai
  rationale: Subjek tersirat verba itu paling wajar kembali kepada יְהוָה dalam klausa sebelumnya; sufiks pada אֹיְבָיו dan אִתּוֹ merujuk kepada orang yang jalan hidupnya berkenan.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada hikmat. 'Jalan hidup' dipilih daripada bentuk harfiah 'jalan-jalan' agar makna perilaku atau pola hidup jelas. Kapitalisasi pronomina '-Nya' membantu menunjukkan bahwa TUHAN adalah pelaku tindakan.
