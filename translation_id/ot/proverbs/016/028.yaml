  yaml_path: translation/ot/proverbs/016/028.yaml
  text: A perverse man stirs up strife[c][b][a], and a whisperer separates close friends.
translation:
  language: id
  text: Orang yang berwatak bengkok[a] menimbulkan pertengkaran, dan seorang penggunjing[b] membuat sahabat karib berpisah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang yang penuh kebengkokan”; dapat juga diterjemahkan “orang yang suka melakukan penyelewengan.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “orang yang suka berbisik-bisik,” “penyebar gosip,” atau “pemfitnah.” Istilah Ibraninya menunjuk kepada orang yang berbicara secara terselubung sehingga merusak hubungan.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “memisahkan seorang sahabat karib.” Bentuk umum dalam bahasa Indonesia menyatakan akibatnya bagi hubungan antarsahabat.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ תַּהְפֻּכוֹת
  choice: orang yang berwatak bengkok
  rationale: Ungkapan Ibrani secara harfiah menunjuk kepada ‘orang yang penuh kebengkokan/penyelewengan’. Pilihan ini menyampaikan watak moral yang menyimpang secara alami dalam bahasa Indonesia tanpa membatasinya pada penyimpangan seksual.
- source_word: יְשַׁלַּח מָדוֹן
  choice: menimbulkan pertengkaran
  rationale: Kata kerja יְשַׁלַּח secara harfiah berarti ‘mengirimkan’ atau ‘melepaskan’, tetapi bersama מָדוֹן ungkapan ini berarti memicu atau menggerakkan perselisihan. ‘Menimbulkan pertengkaran’ jelas dan wajar dalam bahasa Indonesia modern.
- source_word: נִרְגָּן
  choice: seorang penggunjing
  rationale: Istilah ini menggambarkan orang yang menyampaikan perkataan secara terselubung atau dari belakang sehingga merusak hubungan. ‘Penggunjing’ mempertahankan unsur pembicaraan buruk tentang orang lain tanpa memastikan bahwa semua perkataannya merupakan fitnah.
- source_word: מַפְרִיד אַלּוּף
  choice: membuat sahabat karib berpisah
  rationale: אַלּוּף dalam konteks ini berarti sahabat atau teman dekat, bukan pemimpin. Bentuk verbal Indonesia ini mengungkapkan perpecahan hubungan secara alami dan mempertahankan tindakan ‘memisahkan’ dalam teks Ibrani.
