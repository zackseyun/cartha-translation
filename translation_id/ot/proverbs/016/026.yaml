translation:
  language: id
  text: Nafsu makan pekerja itu membuatnya bekerja,[a] sebab mulutnya mendesaknya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Nafsu makan seorang pekerja bekerja baginya.” Teks Ibrani memakai kata yang sama akarnya untuk “pekerja” dan “bekerja”; “baginya” juga dapat dipahami “untuk dirinya sendiri.” Kata Ibrani yang diterjemahkan “nafsu makan” juga dapat berarti “jiwa”, “kehidupan”, atau “keinginan”.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “mulutnya mendorongnya,” “menekannya,” atau “memaksanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: nafsu makan
  rationale: Dalam konteks ini נֶפֶשׁ menunjuk pada selera atau kebutuhan jasmani; penyebutan “mulutnya” pada bagian kedua mendukung arti ini, bukan pengertian teologis “jiwa”.
- source_word: עָמֵל
  choice: seorang pekerja
  rationale: Kata ini menunjuk kepada orang yang bekerja keras. “Pekerja” alami dalam bahasa Indonesia dan memungkinkan hubungan akar katanya dengan verba berikut tetap tampak.
- source_word: עָמְלָה
  choice: bekerja
  rationale: Pilihan ini mempertahankan permainan kata Ibrani antara “pekerja” dan “bekerja” tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: לּוֹ
  choice: bagi dirinya
  rationale: Secara bentuk berarti “baginya”; dalam konteks ini hubungan tersebut paling alami dipahami secara refleksif, yakni bahwa nafsu makan orang itu bekerja demi kepentingan dirinya sendiri. Alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: כִּי
  choice: karena
  rationale: Partikel ini memperkenalkan alasan yang mendorong kerja sang pekerja.
- source_word: אָכַף עָלָיו
  choice: mendesak dia untuk terus bekerja
  rationale: Ungkapan ini menyatakan tekanan atau dorongan kuat terhadap orang tersebut. Tambahan “untuk terus bekerja” membuat arah desakannya jelas dari konteks baris pertama.
- source_word: פִּיהוּ
  choice: mulutnya
  rationale: 'Terjemahan harfiah ini mempertahankan personifikasi dalam teks Ibrani: mulut, sebagai gambaran kebutuhan makan, mendesak orang itu.'
