  yaml_path: translation/ot/proverbs/016/018.yaml
  text: Pride comes before destruction[a], and a haughty spirit before a fall.
translation:
  language: id
  text: 'Keangkuhan mendahului kehancuran,

    dan kesombongan hati mendahului kejatuhan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Sebelum kehancuran ada keangkuhan, dan sebelum tersandung ada ketinggian roh.”'
    reason: Mencatat susunan nominal teks Ibrani serta padanan yang lebih harfiah bagi כִּשָּׁלוֹן dan גֹּבַהּ רוּחַ.
lexical_decisions:
- source_word: לִפְנֵי
  choice: mendahului
  rationale: 'Dalam konteks ini, ungkapan tersebut menunjukkan urutan: sifat buruk yang disebutkan datang sebelum akibatnya. Bentuk verbal “mendahului” menghasilkan pepatah yang alami dan ringkas dalam bahasa Indonesia.'
- source_word: שֶׁבֶר
  choice: kehancuran
  rationale: Kata ini secara harfiah berkaitan dengan pecah atau remuk, tetapi dalam sastra hikmat menunjuk pada kebinasaan atau keruntuhan; “kehancuran” mempertahankan daya metaforis dan kesejajarannya dengan “kejatuhan”.
- source_word: גָּאוֹן
  choice: keangkuhan
  rationale: Walaupun dapat berarti kemegahan atau keagungan dalam konteks lain, kesejajarannya dengan akibat buruk di sini menuntut arti negatif. “Keangkuhan” menyatakan kebanggaan diri yang berlebihan secara jelas.
- source_word: וְלִפְנֵי
  choice: dan ... mendahului
  rationale: Pengulangan ini mempertahankan struktur seimbang kedua baris pepatah, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: כִּשָּׁלוֹן
  choice: kejatuhan
  rationale: Kata ini menunjuk pada tindakan tersandung atau keadaan jatuh. “Kejatuhan” dapat mencakup kegagalan atau keruntuhan tanpa membatasi maknanya pada jatuh secara fisik.
- source_word: גֹּבַהּ רוּחַ
  choice: kesombongan hati
  rationale: Secara harfiah frasa ini berarti “ketinggian roh”. Dalam bahasa Indonesia, “kesombongan hati” secara alami menyampaikan sikap batin yang meninggikan diri. Catatan kaki mempertahankan metafora dan unsur “roh” dari teks sumber.
theological_decisions:
- issue: Watak moral גָּאוֹן dan גֹּבַהּ רוּחַ
  choice: Kedua ungkapan diterjemahkan secara negatif sebagai “keangkuhan” dan “kesombongan hati”.
  alternative: גָּאוֹן dapat berarti “keagungan” dalam konteks lain, dan גֹּבַהּ רוּחַ dapat diterjemahkan lebih harfiah sebagai “ketinggian roh”.
  rationale: Paralelisme menghubungkan keduanya dengan kehancuran dan kejatuhan, sehingga nuansa etis negatif ditentukan oleh konteks, bukan oleh penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bernada pepatah. Paralelisme kedua baris dipertahankan melalui pengulangan “mendahului”. “Kesombongan hati” dipilih sebagai ungkapan Indonesia yang wajar, sedangkan metafora Ibrani yang lebih harfiah dicatat dalam catatan kaki.
