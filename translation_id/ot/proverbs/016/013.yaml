source:
  edition: WLC
  text: רְצ֣וֹן מְ֭לָכִים שִׂפְתֵי צֶ֑דֶק וְ/דֹבֵ֖ר יְשָׁרִ֣ים יֶאֱהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/013.yaml
  text: Righteous lips are the delight of kings[b][a], and he loves one who speaks what is upright.
translation:
  language: id
  text: Bibir yang berkata benar adalah kesukaan raja-raja[a], dan seorang raja mengasihi orang yang mengatakan apa yang lurus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bibir yang berkata benar adalah perkenanan raja-raja.” Kata Ibrani רְצוֹן dapat berarti “kesukaan,” “kesenangan,” atau “perkenanan,” sedangkan צֶדֶק dapat menunjuk pada kebenaran atau keadilan.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang yang mengatakan apa yang benar.” Ungkapan Ibraninya secara harfiah memakai bentuk jamak, “hal-hal yang lurus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצוֹן
  choice: kesukaan
  rationale: Kata ini dapat menyatakan kesenangan, perkenanan, atau sesuatu yang berkenan. “Kesukaan” alami dalam bahasa Indonesia dan mempertahankan fungsi predikatif frasa itu.
- source_word: מְלָכִים
  choice: raja-raja
  rationale: Bentuk jamak konkret dipertahankan sesuai latar kerajaan dalam sastra hikmat.
- source_word: שִׂפְתֵי צֶדֶק
  choice: bibir yang berkata benar
  rationale: Ungkapan harfiah “bibir kebenaran/keadilan” memakai bibir sebagai metonimia untuk perkataan. Bentuk ini mempertahankan gambaran bibir sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: וְדֹבֵר
  choice: dan ... orang yang mengatakan
  rationale: Partisipel tersebut dipakai secara substantival untuk menyebut seseorang yang berbicara.
- source_word: יְשָׁרִים
  choice: apa yang lurus
  rationale: Bentuk jamak adjektival ini dipakai secara substantival dan menunjuk pada hal-hal yang lurus, jujur, atau benar. “Apa yang lurus” mempertahankan citra moral kata Ibrani.
- source_word: יֶאֱהָב
  choice: seorang raja mengasihi
  rationale: Kata kerja ini berbentuk orang ketiga tunggal. Karena klausa sebelumnya menyebut raja-raja, “seorang raja” menyatakan subjek generik tunggal secara alami tanpa mengubah bentuk Ibrani menjadi jamak.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Citra “bibir” dipertahankan, tetapi konstruksi diperjelas menjadi “bibir yang berkata benar.” Pergeseran dari “raja-raja” pada klausa pertama ke “seorang raja” pada klausa kedua mencerminkan verba tunggal Ibrani dan dipahami secara generik.
