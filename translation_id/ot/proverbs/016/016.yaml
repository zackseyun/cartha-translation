  text: קְֽנֹה חָכְמָ֗ה מַה טּ֥וֹב מֵ/חָר֑וּץ וּ/קְנ֥וֹת בִּ֝ינָ֗ה נִבְחָ֥ר מִ/כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/016.yaml
  text: To acquire wisdom—how much better than gold! And to acquire understanding is to be chosen over silver.
translation:
  language: id
  text: Memperoleh hikmat—betapa jauh lebih baik daripada emas! Dan memperoleh pengertian lebih patut dipilih daripada perak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְנֹה / וּקְנוֹת
  choice: memperoleh
  rationale: Infinitif absolut dari קנה menyatakan tindakan mendapatkan atau memperoleh; bentuk Indonesia ini alami dan mempertahankan kesejajaran kedua bagian.
- source_word: חָכְמָה
  choice: hikmat
  rationale: Padanan baku dan bermartabat untuk hikmat praktis-moral dalam sastra Amsal.
- source_word: מַה טּוֹב
  choice: betapa jauh lebih baik
  rationale: מַה memberi seruan penegas, sedangkan konstruksi komparatif dengan מִן menyatakan keunggulan atas emas.
- source_word: חָרוּץ
  choice: emas
  rationale: Dalam konteks perbandingan dengan perak, istilah ini merujuk pada emas, kemungkinan emas bermutu.
- source_word: בִּינָה
  choice: pengertian
  rationale: Menyampaikan daya memahami atau membedakan, serasi dengan hikmat tanpa menyamakannya sepenuhnya.
- source_word: נִבְחָר
  choice: lebih patut dipilih
  rationale: Nifal partisipial dari בחר menyatakan sesuatu yang dipilih atau lebih layak dipilih; bentuk ini mempertahankan nuansa evaluatif dan pasif tanpa menjadi kaku.
- source_word: כָּסֶף
  choice: perak
  rationale: Arti konkret yang sesuai dengan paralelisme terhadap emas.
theological_decisions:
- issue: Keunggulan hikmat dan pengertian atas kekayaan
  choice: Mempertahankan perbandingan nilai secara langsung tanpa menjadikannya larangan mutlak terhadap kekayaan.
  alternative: Menafsirkan ayat sebagai penolakan terhadap kepemilikan emas dan perak.
  rationale: Teks menegaskan prioritas hikmat dan pengertian, bukan secara eksplisit mengutuk logam mulia atau kepemilikan harta.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, puitis, dan bermartabat. Tanda pisah serta tanda seru mempertahankan daya seruan pada מַה טּוֹב; paralelisme dua klausa tetap jelas.
