  source_fidelity: Terjemahan dengan setia mencerminkan kedua klausa Ibrani. “Jalan raya orang-orang yang hidup lurus ialah menjauh dari kejahatan” menyampaikan hubungan predikatif padat antara מְסִלַּת יְשָׁרִים dan סוּר מֵרָע tanpa memaksakan satu analisis sintaktis yang tidak perlu. Klausa kedua mempertahankan hubungan antara menjaga hidup/diri dan menjaga arah hidupnya.
