source:
  edition: WLC
  text: מְסִלַּ֣ת יְ֭שָׁרִים ס֣וּר מֵ/רָ֑ע שֹׁמֵ֥ר נַ֝פְשׁ֗/וֹ נֹצֵ֥ר דַּרְכּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/017.yaml
  text: The highway of the upright turns away from evil[b][a]; he who guards his life watches over his way.
translation:
  language: id
  text: Jalan raya orang-orang yang hidup lurus ialah menjauh dari kejahatan[a]; siapa menjaga hidupnya[b] mengawasi jalan yang ditempuhnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jalan raya orang-orang yang hidup lurus menjauhi kejahatan.” Bahasa Ibrani memakai ungkapan nominal yang padat dan dapat diterjemahkan dengan susunan yang lebih verbal.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “jiwanya”; dalam konteks ini נֶפֶשׁ kemungkinan berarti “hidupnya” atau “dirinya sendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְסִלַּת
  choice: jalan raya
  rationale: Kata מְסִלָּה biasanya menunjuk pada jalan yang dibangun atau ditinggikan, bukan sekadar jalan setapak. “Jalan raya” mempertahankan gambaran yang khas itu.
- source_word: יְשָׁרִים
  choice: orang-orang yang hidup lurus
  rationale: Bentuk ini menunjuk pada orang yang lurus secara moral. Ungkapan “hidup lurus” menyampaikan makna etis dengan wajar tanpa menyamakannya begitu saja dengan istilah Ibrani lain yang biasa diterjemahkan “benar”.
- source_word: סוּר מֵרָע
  choice: menjauh dari kejahatan
  rationale: Infinitif ini menggambarkan jalan orang yang hidup lurus sebagai tindakan meninggalkan atau menghindari kejahatan. “Menjauh” mempertahankan daya verbalnya.
- source_word: רָע
  choice: kejahatan
  rationale: Dalam konteks etis Amsal, kata ini menunjuk pada apa yang jahat secara moral, bukan terutama kemalangan atau bahaya.
- source_word: שֹׁמֵר נַפְשׁוֹ
  choice: menjaga hidupnya
  rationale: נֶפֶשׁ di sini paling mungkin berarti hidup atau diri seseorang secara utuh, bukan “jiwa” sebagai istilah antropologis teknis.
- source_word: נֹצֵר דַּרְכּוֹ
  choice: mengawasi jalan yang ditempuhnya
  rationale: נצר menyatakan penjagaan yang penuh perhatian. Pilihan “mengawasi” membedakannya dari שׁמר pada klausa sebelumnya, sedangkan “jalan yang ditempuhnya” menyampaikan metafora hikmat tentang perilaku dan arah hidup.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam konteks hikmat
  choice: hidup seseorang, bukan “jiwa” sebagai istilah antropologis teknis
  alternative: jiwanya
  rationale: Amsal ini membahas perilaku moral dan pemeliharaan diri. “Hidupnya” tidak memasukkan dikotomi tubuh-jiwa yang tidak dituntut oleh teks Ibrani.
- issue: Hubungan sintaksis antara מְסִלַּת יְשָׁרִים dan סוּר מֵרָע
  choice: klausa nominal yang menerangkan bahwa jalan orang lurus terdiri dalam tindakan menjauh dari kejahatan
  alternative: jalan raya orang lurus menjauh dari kejahatan
  rationale: Bahasa Ibrani memungkinkan ungkapan nominal yang padat. Terjemahan utama mempertahankan hubungan predikatif itu tanpa menentukan mekanisme moral atau teologis lebih jauh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hikmat. “Orang-orang yang hidup lurus” dipilih agar makna moral יְשָׁרִים jelas bagi pembaca umum. Paralelisme dipertahankan dengan “menjaga” dan “mengawasi” sebagai dua verba yang berdekatan makna tetapi tidak identik.
