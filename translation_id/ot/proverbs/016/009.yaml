source:
  edition: WLC
  text: לֵ֣ב אָ֭דָם יְחַשֵּׁ֣ב דַּרְכּ֑/וֹ וַֽ֝/יהוָ֗ה יָכִ֥ין צַעֲדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/009.yaml
  text: A man's heart plans his way[a], but Yahweh establishes his steps.
translation:
  language: id
  text: 'Hati manusia merencanakan jalannya,

    tetapi Yahweh meneguhkan langkahnya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengarahkan langkahnya.” Kata kerja Ibrani dapat berarti “membuat teguh,” “meneguhkan,” atau, dalam konteks ini, “mengarahkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: hati
  rationale: Mempertahankan gambaran Ibrani tentang batin sebagai pusat pikiran, kehendak, dan niat; dalam bahasa Indonesia, “hati” tetap alami dalam ungkapan hikmat.
- source_word: אָדָם
  choice: manusia
  rationale: Bentuk tunggal ini digunakan secara generik untuk seorang manusia sebagai wakil umat manusia. “Manusia” menyampaikan cakupan umum itu secara wajar dalam bahasa Indonesia.
- source_word: יְחַשֵּׁב
  choice: merencanakan
  rationale: Bentuk piel dari חשׁב di sini menyatakan penyusunan rencana atau pertimbangan yang disengaja; “merencanakan” ringkas dan sesuai dengan gaya amsal.
- source_word: דַּרְכּוֹ
  choice: jalannya
  rationale: דֶּרֶךְ dapat menunjuk pada jalan secara konkret maupun arah hidup. “Jalannya” mempertahankan metafora tersebut dan berpasangan alami dengan “langkahnya” pada baris kedua.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: יָכִין
  choice: meneguhkan
  rationale: Bentuk hiphil dari כון berarti membuat teguh, menetapkan, atau menjadikan mantap. “Meneguhkan” mempertahankan nuansa kausatif dan tidak mempersempit makna hanya menjadi pengarahan.
- source_word: צַעֲדוֹ
  choice: langkahnya
  rationale: Nomina tunggal dengan sufiks ini dapat berfungsi secara kolektif untuk gerak atau langkah-langkah seseorang. Bentuk “langkahnya” alami dalam bahasa Indonesia dan dekat dengan bentuk sumber.
theological_decisions:
- issue: Kedaulatan ilahi dan perencanaan manusia
  choice: Mempertahankan perencanaan manusia yang sungguh-sungguh sekaligus tindakan Yahweh yang menentukan keteguhan langkahnya.
  alternative: “Yahweh mengarahkan langkahnya” atau “Yahweh menentukan langkahnya.”
  rationale: Penjajaran kedua klausa dalam bahasa Ibrani mempertahankan ketegangan antara niat manusia dan tindakan berdaulat Yahweh. “Meneguhkan” menghindari pembatasan pada bimbingan saja maupun penafsiran deterministik yang terlalu tegas.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan dua baris mempertahankan paralelisme antitetis khas amsal; “hati,” “jalan,” dan “langkah” mempertahankan jaringan metafora sumber.
