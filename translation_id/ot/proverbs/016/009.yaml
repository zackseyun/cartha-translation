  source_fidelity: 'Terjemahan dengan setia merepresentasikan struktur dan makna Ibrani: לֵב אָדָם sebagai “Hati manusia,” יְחַשֵּׁב sebagai “merencanakan,” דַּרְכּוֹ sebagai “jalannya,” serta pertentangan dengan tindakan Yahweh yang יָכִין, “meneguhkan,” langkah manusia. Bentuk tunggal “langkahnya” wajar untuk nomina kolektif Ibrani צַעֲדוֹ. Pilihan “meneguhkan” mempertahankan arti kausatif ‘membuat teguh/menetapkan’ tanpa memaksakan makna deterministik atau semata-mata bimbingan.'
