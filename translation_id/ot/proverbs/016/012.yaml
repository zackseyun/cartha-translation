  text: תּוֹעֲבַ֣ת מְ֭לָכִים עֲשׂ֣וֹת רֶ֑שַׁע כִּ֥י בִ֝/צְדָקָ֗ה יִכּ֥וֹן כִּסֵּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/012.yaml
  text: It is an abomination for kings to do wickedness[a], for a throne is established by righteousness.
translation:
  language: id
  text: Melakukan kejahatan adalah kekejian bagi raja-raja, sebab takhta ditegakkan oleh keadilan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kebenaran.”'
    reason: Alternatif leksikal bagi צְדָקָה, yang dapat mencakup kebenaran atau kelurusan moral selain keadilan dalam pemerintahan.
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: kekejian
  rationale: Kata ini menyatakan sesuatu yang sangat dibenci dan tercela secara moral. “Kekejian” mempertahankan bobot moral serta keringkasan ungkapan Ibrani.
- source_word: מְלָכִים
  choice: raja-raja
  rationale: Bentuk jamak ini secara langsung berarti “raja-raja” dan di sini merujuk secara umum kepada para penguasa kerajaan.
- source_word: עֲשׂוֹת
  choice: melakukan
  rationale: Bentuk infinitif dari עשה menyatakan tindakan melakukan sesuatu; “melakukan” alami dalam bahasa Indonesia dan dekat dengan bentuk sumber.
- source_word: רֶשַׁע
  choice: kefasikan
  rationale: Kata ini mencakup kejahatan atau perbuatan salah yang bersifat moral. “Kefasikan” mempertahankan daya moral khas sastra hikmat, lebih kuat daripada sekadar “kesalahan”.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan dasar bagi pernyataan pertama. “Sebab” sesuai dengan gaya pepatah yang ringkas dan bermartabat.
- source_word: בִצְדָקָה
  choice: oleh kebenaran
  rationale: Preposisi ב menandai sarana atau dasar, sedangkan צְדָקָה mencakup kelurusan moral dan, dalam konteks kerajaan, pemerintahan yang adil. “Oleh kebenaran” mempertahankan cakupan moral yang luas.
- source_word: יִכּוֹן
  choice: ditegakkan
  rationale: Bentuk Nifal dari כון menyatakan dibuat teguh, dikukuhkan, atau dijadikan stabil. “Ditegakkan” cocok dengan gambaran takhta dan menyampaikan kestabilan pemerintahan.
- source_word: כִּסֵּא
  choice: takhta
  rationale: Nomina tunggal ini dipakai secara generik dalam pepatah. Bahasa Indonesia tidak memerlukan kata sandang, sehingga “takhta” tetap dapat dipahami sebagai takhta kerajaan pada umumnya.
theological_decisions:
- issue: Pemaknaan צְדָקָה dalam konteks hikmat kerajaan
  choice: kebenaran
  alternative: keadilan
  rationale: “Kebenaran” mempertahankan mutu moral yang luas sebagai dasar kukuhnya pemerintahan. Namun, karena konteksnya adalah perilaku dan pemerintahan raja, “keadilan” juga merupakan pemaknaan yang sah dan dicantumkan dalam catatan kaki tanpa mempersempit teks utama.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada pepatah. Susunan klausa mempertahankan hubungan alasan dalam teks Ibrani. Penanda catatan kaki ditempatkan setelah “kebenaran,” yaitu kata yang memiliki alternatif leksikal.
