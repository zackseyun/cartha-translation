  text: ט֤וֹב אֶ֣רֶךְ אַ֭פַּיִם מִ/גִּבּ֑וֹר וּ/מֹשֵׁ֥ל בְּ֝/רוּח֗/וֹ מִ/לֹּכֵ֥ד עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/032.yaml
  text: Better is one who is slow to anger than a mighty man[b][a], and one who rules his spirit than one who captures a city.
translation:
  language: id
  text: Orang yang lambat marah[a] lebih baik daripada orang perkasa, dan orang yang menguasai rohnya[b] daripada orang yang merebut kota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang sabar”; secara harfiah, “panjang lubang hidung,” suatu ungkapan Ibrani yang berarti tidak lekas marah.
    reason: lexical_alternative
  - marker: b
    text: Atau “amarahnya” atau “dirinya sendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: lebih baik
  rationale: Dalam peribahasa hikmat Ibrani, טוֹב bersama מִן menyatakan perbandingan. Bentuk “lebih baik daripada” menyampaikan hubungan itu secara jelas dan alami dalam bahasa Indonesia.
- source_word: אֶרֶךְ אַפַּיִם
  choice: orang yang lambat marah
  rationale: Ungkapan Ibrani ini secara harfiah berarti “panjang hidung,” tetapi secara idiomatis menunjuk pada kesabaran atau tidak lekas marah. “Lambat marah” mempertahankan nuansa khusus tentang pengendalian amarah.
- source_word: מִגִּבּוֹר
  choice: daripada orang perkasa
  rationale: גִּבּוֹר menunjuk pada orang yang kuat, gagah, atau tangguh dan sering bernuansa militer. “Orang perkasa” mempertahankan keluasan maknanya tanpa membatasinya hanya pada prajurit.
- source_word: וּמֹשֵׁל
  choice: dan orang yang menguasai
  rationale: Partisipel ini menggambarkan ciri atau tindakan yang berkelanjutan. “Menguasai” cocok dengan objek batiniah dan mempertahankan kesejajaran dengan penaklukan kota.
- source_word: בְּרוּחוֹ
  choice: rohnya
  rationale: רוּחַ dapat berarti roh, napas, angin, atau kecenderungan batin. Dalam konteks ini kata tersebut menunjuk pada dorongan atau watak batin yang dikendalikan. “Rohnya” tetap dekat dengan bahasa sumber dan mempertahankan keluasan maknanya.
- source_word: מִלֹּכֵד עִיר
  choice: daripada orang yang merebut sebuah kota
  rationale: לכד berarti menangkap, merebut, atau menaklukkan, khususnya dalam konteks militer. “Merebut sebuah kota” jelas dan hidup serta mempertahankan kontras antara kemenangan lahiriah dan penguasaan batin.
theological_decisions:
- issue: Makna antropologis רוּחַ dalam konteks sastra hikmat
  choice: “rohnya,” yang menunjuk pada kecenderungan atau dorongan batin seseorang yang harus dikuasai
  alternative: “dirinya sendiri” sebagai parafrasa yang lebih luas, atau “amarahnya” sebagai penafsiran yang lebih sempit
  rationale: Peribahasa ini membandingkan penguasaan kehidupan batin dengan penaklukan militer. “Rohnya” mempertahankan keluasan istilah Ibrani dan tidak mempersempitnya hanya menjadi amarah ataupun memperluasnya tanpa penanda menjadi seluruh diri.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya peribahasa yang ringkas dan bermartabat. Pengulangan “lebih baik daripada” pada bagian kedua menjelaskan elipsis Ibrani secara alami. “Orang perkasa” mempertahankan nuansa kekuatan tanpa terlalu mempersempitnya menjadi gelar militer, sedangkan “merebut sebuah kota” menjaga gambaran penaklukan.
