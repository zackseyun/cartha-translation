  text: There is a way that seems right before a man, but its end is the ways of death.
translation:
  language: id
  text: Ada jalan yang tampak lurus bagi seseorang, tetapi ujungnya adalah jalan-jalan yang menuju kematian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵשׁ דֶּרֶךְ
  choice: Ada jalan
  rationale: Mencerminkan konstruksi eksistensial Ibrani secara langsung dan alami.
- source_word: יָשָׁר לִפְנֵי אִישׁ
  choice: yang lurus menurut pandangan seseorang
  rationale: יָשָׁר berarti 'lurus/benar', sedangkan לִפְנֵי secara harfiah 'di hadapan'; dalam konteks penilaian manusia, ungkapan ini berarti jalan itu dipandang lurus oleh orang tersebut. 'Menurut pandangan' mempertahankan unsur perspektif tanpa menyatakan bahwa jalan itu sungguh benar.
- source_word: וְאַחֲרִיתָהּ
  choice: tetapi akhirnya
  rationale: אַחֲרִית menunjuk hasil atau kesudahan suatu jalan; konjungsi diterjemahkan 'tetapi' untuk menyatakan pertentangan yang jelas.
- source_word: דַּרְכֵי מָוֶת
  choice: jalan-jalan kematian
  rationale: Mempertahankan bentuk jamak דַּרְכֵי dan metafora 'kematian', termasuk peralihan mencolok dari satu jalan ke beberapa jalan.
theological_decisions:
- issue: Perbedaan antara penilaian manusia dan hasil akhir
  choice: Jalan itu disebut lurus hanya 'menurut pandangan seseorang'.
  alternative: Ada jalan yang tampaknya benar bagi seseorang.
  rationale: 'Pilihan ini menjaga ketegangan teks: penilaian manusia dapat menganggap suatu jalan lurus, sedangkan kesudahannya mengarah kepada kematian, tanpa menambahkan penjelasan doktrinal.'
- issue: Bentuk jamak pada kesudahan jalan
  choice: jalan-jalan kematian
  alternative: jalan menuju kematian
  rationale: Bentuk jamak sumber dipertahankan karena dapat menyiratkan banyak lintasan atau manifestasi yang berujung pada kematian; mengubahnya menjadi tunggal akan meratakan citra puitis.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bernada hikmat. 'Seseorang' dipilih untuk אִישׁ agar berlaku umum dan alami; susunan paralel serta peralihan dari 'jalan' tunggal ke 'jalan-jalan' jamak dipertahankan.
