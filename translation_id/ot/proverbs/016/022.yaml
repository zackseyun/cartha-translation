base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/022.yaml
  text: Understanding is a fountain of life to its possessor[b][a], but the discipline of fools is folly.
translation:
  language: id
  text: Akal budi adalah mata air kehidupan bagi orang yang memilikinya,[a] tetapi didikan orang bodoh adalah kebodohan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Akal budi adalah sumber kehidupan bagi orang yang mempunyainya.”'
    reason: lexical_alternative
  - marker: b
    text: “Didikan” juga dapat diterjemahkan “disiplin,” “teguran,” atau “koreksi.” Frasa Ibraninya ringkas; “orang bodoh” dapat dipahami sebagai pihak yang memiliki, memberi, atau menjadi sasaran didikan itu, tetapi penutupnya menyatakan bahwa didikan tersebut adalah kebodohan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹר
  choice: mata air
  rationale: Kata ini menunjuk pada mata air, pancuran, atau sumber. “Mata air” mempertahankan gambaran konkret tentang air yang terus memberi kehidupan dan terdengar alami dalam bahasa Indonesia.
- source_word: חַיִּים
  choice: kehidupan
  rationale: Walaupun bentuk Ibraninya jamak, kata ini lazim berfungsi sebagai nomina abstrak yang berarti “hidup” atau “kehidupan”; dalam metafora ini, “kehidupan” paling alami.
- source_word: שֵׂכֶל
  choice: akal budi
  rationale: Dalam Amsal, kata ini menyatakan pengertian praktis, kebijaksanaan bertindak, atau pertimbangan yang baik. “Akal budi” mencakup unsur pemahaman dan kecakapan hidup.
- source_word: בְּעָלָיו
  choice: orang yang memilikinya
  rationale: Secara harfiah berarti “pemiliknya.” Ungkapan ini mempertahankan hubungan tunggal dengan “akal budi” sambil terdengar lebih wajar daripada “pemiliknya” dalam bahasa Indonesia.
- source_word: מוּסַר
  choice: didikan
  rationale: Kata ini dapat berarti didikan, disiplin, teguran, atau koreksi. “Didikan” cukup luas untuk mempertahankan ketaksaan frasa dan cocok dengan kosakata sastra hikmat.
- source_word: אֱוִלִים
  choice: orang bodoh
  rationale: Ini adalah sebutan khas dalam Amsal bagi orang yang tumpul secara moral dan menolak hikmat; “orang bodoh” jelas dan alami.
- source_word: אִוֶּלֶת
  choice: kebodohan
  rationale: Nomina abstrak ini menunjuk pada sifat atau perilaku khas orang bodoh. “Kebodohan” menghasilkan penutup pepatah yang tajam dan mempertahankan kaitan kata dengan “orang bodoh.”
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat khas pepatah. Metafora “mata air kehidupan” dipertahankan, sedangkan “orang yang memilikinya” dipilih agar hubungan gramatikalnya jelas bagi pembaca umum. Ketaksaan pada מוּסַר אֱוִלִים tidak diselesaikan secara dogmatis dan dijelaskan dalam catatan kaki.
