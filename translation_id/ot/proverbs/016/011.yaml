source:
  edition: WLC
  text: פֶּ֤לֶס וּ/מֹאזְנֵ֣י מִ֭שְׁפָּט לַֽ/יהוָ֑ה מַ֝עֲשֵׂ֗/הוּ כָּל אַבְנֵי כִֽיס׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/011.yaml
  text: A just balance and scales belong to Yahweh[a]; all the weights in the bag are his work.
translation:
  language: id
  text: Neraca dan timbangan yang adil adalah milik Yahweh; segala batu timbangan dalam kantong[a] adalah buatan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “segala batu dalam kantong.” Yang dimaksud ialah batu-batu yang digunakan sebagai anak timbangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּלֶס
  choice: neraca
  rationale: Menunjuk pada alat untuk menimbang. “Neraca” wajar dalam bahasa Indonesia dan tetap membedakannya dari istilah paralel berikutnya.
- source_word: וּמֹאזְנֵי מִשְׁפָּט
  choice: dan timbangan yang adil
  rationale: מִשְׁפָּט menerangkan alat timbang sebagai sesuai dengan keadilan; frasa ini menyampaikan gambaran perdagangan yang jujur secara alami.
- source_word: לַיהוָה
  choice: adalah milik Yahweh
  rationale: Prefiks ל menyatakan kepunyaan atau keterkaitan. Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: מַעֲשֵׂהוּ
  choice: adalah buatan-Nya
  rationale: Kata benda tunggal dengan sufiks orang ketiga maskulin menyatakan apa yang dibuat atau dikerjakan oleh-Nya. “Buatan-Nya” mempertahankan gambaran konkret tanpa mempersempit klaim moral ayat.
- source_word: כָּל אַבְנֵי כִיס
  choice: segala batu timbangan dalam kantong
  rationale: Secara harfiah berarti “segala batu kantong”, tetapi konteks penimbangan menunjukkan batu-batu yang dipakai sebagai anak timbangan. Terjemahan utama mempertahankan unsur “batu” sekaligus memperjelas fungsinya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Makna klaim mengenai alat dan batu timbangan
  choice: Standar penimbangan yang adil berada dalam tatanan dan kewenangan Yahweh.
  alternative: Ayat ini hanya menyatakan bahwa Allah menciptakan benda-benda fisik tersebut; atau bahwa Allah menyetujui semua standar pasar yang ada.
  rationale: Kehadiran מִשְׁפָּט (“keadilan”) dalam medan makna penimbangan menunjukkan tuntutan moral mengenai perdagangan yang jujur, sedangkan “buatan-Nya” dibiarkan cukup luas untuk mempertahankan ketegangan ungkapan Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme antara “neraca” dan “timbangan” dipertahankan, sedangkan istilah teknis kuno dijelaskan secara singkat melalui “batu timbangan” dan catatan kaki.
