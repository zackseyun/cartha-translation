  text: In the light of a king’s face there is life[b][a], and his favor is like a cloud of spring rain.
translation:
  language: id
  text: Dalam cahaya wajah raja ada kehidupan[a], dan perkenannya seperti awan hujan akhir musim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “cahaya wajah raja” menggambarkan wajah atau kehadiran raja yang berkenan; perkenannya mendatangkan kehidupan dan kebaikan.
    reason: cultural_note
  - marker: b
    text: Secara lebih harfiah, “seperti awan hujan akhir.” Yang dimaksud ialah hujan pada penghujung musim hujan di lingkungan agraris Israel, yang bermanfaat bagi tanaman menjelang panen.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/אוֹר
  choice: Dalam cahaya
  rationale: Mempertahankan gambaran konkret Ibrani tentang cahaya, dengan bentuk yang alami dalam bahasa Indonesia.
- source_word: פְּנֵי
  choice: wajah
  rationale: Arti harfiahnya ialah “wajah”; dalam konteks ini, wajah raja menjadi tanda yang terlihat dari sikap baik dan perkenannya.
- source_word: מֶלֶךְ
  choice: raja
  rationale: Padanan langsung dan wajar bagi מֶלֶךְ.
- source_word: חַיִּים
  choice: ada kehidupan
  rationale: Klausa Ibrani tidak memakai verba. Penambahan “ada” menghasilkan kalimat Indonesia yang alami tanpa mengubah arti kata חַיִּים.
- source_word: וּ/רְצוֹנ/וֹ
  choice: dan perkenannya
  rationale: רָצוֹן dapat berarti perkenan, kerelaan, atau sikap baik. “Perkenan” sesuai dengan konteks kerajaan dan mempertahankan hubungan dengan persetujuan raja.
- source_word: כְּ/עָב
  choice: seperti awan yang membawa
  rationale: כ memperkenalkan perbandingan, sedangkan עָב berarti awan tebal. Ungkapan verbal “yang membawa” membuat hubungan awan dan hujan jelas serta alami dalam bahasa Indonesia.
- source_word: מַלְקוֹשׁ
  choice: hujan akhir musim
  rationale: מַלְקוֹשׁ menunjuk pada hujan pada penghujung musim hujan, yang penting bagi pematangan tanaman. “Hujan akhir musim” lebih tepat bagi konteks agraris Israel daripada “hujan musim semi” bagi pembaca Indonesia.
