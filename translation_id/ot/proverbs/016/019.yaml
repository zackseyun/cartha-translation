  text: Better to be lowly in spirit with the poor than to divide plunder with the proud[a].
translation:
  language: id
  text: Lebih baik bersikap rendah hati bersama orang miskin[a] daripada membagi jarahan bersama orang sombong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "bersama orang tertindas." Sebagian menerjemahkan "bersama orang rendah hati." Kata Ibrani עניים terutama dapat merujuk kepada orang miskin atau tertindas, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Lebih baik
  rationale: Menandai penilaian komparatif dan mempertahankan gaya pepatah yang ringkas serta alami dalam bahasa Indonesia.
- source_word: שְׁפַל רוּחַ
  choice: rendah hati
  rationale: Ungkapan Ibrani ini secara harfiah menunjuk pada kerendahan roh; dalam bahasa Indonesia modern, 'rendah hati' secara wajar menyampaikan sikap batin tersebut tanpa memberi kesan kelemahan semata.
- source_word: אֶת עניים
  choice: bersama orang miskin
  rationale: אֶת dipahami secara asosiatif, yakni 'bersama'. עניים dapat berarti orang miskin, tertindas, atau rendah hati; 'orang miskin' cocok dengan kontras sosial terhadap mereka yang membagi jarahan.
- source_word: מֵחַלֵּק
  choice: daripada membagi
  rationale: Prefiks מִן menyatakan perbandingan sesudah טוֹב. Bentuk 'daripada membagi' alami dan tetap dekat dengan struktur perbandingan Ibrani.
- source_word: שָׁלָל
  choice: jarahan
  rationale: Menunjuk pada barang rampasan yang diperoleh dalam penjarahan atau kemenangan; 'jarahan' jelas dan lazim dalam bahasa Indonesia modern.
- source_word: אֶת גֵּאִים
  choice: bersama orang sombong
  rationale: אֶת kembali bersifat asosiatif. גֵּאִים menunjuk kepada orang yang congkak atau angkuh; 'orang sombong' memberi lawan yang jelas dan mudah dipahami bagi 'rendah hati'.
