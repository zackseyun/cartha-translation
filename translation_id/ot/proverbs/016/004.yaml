id: PRO.16.4
reference: Proverbs 16:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כֹּ֤ל פָּעַ֣ל יְ֭הוָה לַֽ/מַּעֲנֵ֑/הוּ וְ/גַם רָ֝שָׁ֗ע לְ/י֣וֹם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/004.yaml
  text: Yahweh has made everything for its purpose[b][a], even the wicked for the day of disaster.
translation:
  language: id
  text: Yahweh telah membuat segala sesuatu untuk tujuannya[a], bahkan orang fasik untuk hari malapetaka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “untuk diri-Nya sendiri.” Frasa Ibrani ini juga dapat dipahami: “Yahweh telah membuat segala sesuatu untuk diri-Nya sendiri.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk hari bencana” atau “untuk hari kemalangan.” Kata yang secara harfiah dapat berarti “kejahatan” di sini menunjuk pada malapetaka atau kehancuran, bukan kejahatan moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: segala sesuatu
  rationale: Kata ini mencakup keseluruhan. “Segala sesuatu” merupakan ungkapan Indonesia yang alami dan mempertahankan cakupan menyeluruhnya.
- source_word: פָּעַל
  choice: telah membuat
  rationale: Verba ini dapat berarti melakukan, mengerjakan, atau membuat. Dengan Yahweh sebagai subjek dan “segala sesuatu” sebagai objek, “telah membuat” paling alami untuk menyatakan tindakan Allah yang bertujuan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan dengan transliterasi “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: לַמַּעֲנֵהוּ
  choice: untuk tujuannya
  rationale: Frasa Ibrani ini sulit dan dapat berkaitan dengan jawaban, hasil, atau tujuan. Dalam konteks amsal ini, “untuk tujuannya” menyampaikan bahwa segala sesuatu memiliki kesudahan yang sesuai, sementara catatan kaki mempertahankan kemungkinan “untuk diri-Nya sendiri”.
- source_word: וְגַם
  choice: bahkan
  rationale: Gabungan partikel ini memberi penegasan dan memperluas pernyataan umum kepada contoh yang mengejutkan, yaitu orang fasik.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Bentuk tunggal ini dipakai secara substantival dan generik. “Orang fasik” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: לְיוֹם רָעָה
  choice: untuk hari malapetaka
  rationale: Di sini רָעָה menunjuk pada kemalangan, kehancuran, atau malapetaka, bukan kejahatan moral. “Hari malapetaka” mempertahankan nuansa hari hukuman tanpa menyiratkan bahwa Allah menciptakan orang fasik untuk melakukan kejahatan moral.
theological_decisions:
- issue: Apakah ayat ini menyatakan bahwa Allah membuat segala sesuatu, termasuk orang fasik, dengan suatu kesudahan tanpa menjadikan Allah sumber kejahatan moral
  choice: Ayat menyatakan kedaulatan Yahweh dalam mengarahkan segala sesuatu kepada tujuan atau kesudahannya; orang fasik pun menghadapi hari malapetaka.
  alternative: Ayat dapat dipahami, “Yahweh telah membuat segala sesuatu untuk diri-Nya sendiri, bahkan orang fasik untuk hari kejahatan.”
  rationale: Teks Ibrani menegaskan tata tujuan ilahi, tetapi tidak mengharuskan kesimpulan bahwa Allah menciptakan kejahatan moral. Terjemahan “malapetaka” dan catatan atas “tujuannya” mempertahankan kekuatan serta ketegangan teologis teks tanpa menyelesaikan ambiguitas secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Struktur paralel amsal dipertahankan, sedangkan istilah yang berpotensi disalahpahami dijelaskan melalui catatan kaki.
