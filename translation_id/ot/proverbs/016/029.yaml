  text: A violent man entices his neighbor and leads him in a way that is not good[a][b].
translation:
  language: id
  text: Orang yang melakukan kekerasan membujuk sesamanya[a] dan menuntunnya di jalan yang tidak baik.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kawannya”, “sahabatnya”, atau “tetangganya”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di jalan tidak baik”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חָמָס
  choice: orang yang kejam
  rationale: Ungkapan ini menunjuk kepada seseorang yang dicirikan oleh kekerasan. Dalam bahasa Indonesia, “orang yang kejam” menyampaikan watak brutal secara alami tanpa membatasi pepatah umum ini hanya kepada laki-laki.
- source_word: יְפַתֶּה
  choice: membujuk
  rationale: Bentuk Piel dari פתה dapat berarti membujuk, memikat, atau memperdaya. “Membujuk” mempertahankan gagasan memengaruhi seseorang agar mengikuti arah yang salah tanpa memastikan adanya tipu daya.
- source_word: רֵעֵהוּ
  choice: sesamanya
  rationale: רֵעַ mencakup sesama, kawan, sahabat, atau tetangga. “Sesamanya” mempertahankan cakupan hubungan antarorang tanpa menyiratkan keakraban tertentu.
- source_word: וְהוֹלִיכוֹ
  choice: dan menuntunnya
  rationale: Bentuk Hifil dari הלך bersifat kausatif, yakni menyebabkan seseorang berjalan atau membawanya. “Menuntunnya” alami dalam bahasa Indonesia dan mempertahankan gambaran arah yang disengaja.
- source_word: בְּדֶרֶךְ
  choice: di jalan
  rationale: דֶּרֶךְ secara harfiah berarti jalan dan dalam Amsal juga melambangkan arah atau cara hidup. “Di jalan” mempertahankan metafora sumber.
- source_word: לֹא טוֹב
  choice: yang tidak baik
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani yang sengaja bersifat litotes, tanpa mempertajamnya secara interpretatif menjadi “jahat” atau “buruk”.
