  text: לְ/אָדָ֥ם מַֽעַרְכֵי לֵ֑ב וּ֝/מֵ/יְהוָ֗ה מַעֲנֵ֥ה לָשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/001.yaml
  text: The plans of the heart belong to man[b][a], but the answer of the tongue is from Yahweh.
translation:
  language: id
  text: Rancangan hati adalah milik manusia[b][a], tetapi jawaban lidah berasal dari Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Penataan” atau “persiapan hati adalah bagi manusia.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “manusia” adalah bentuk tunggal yang mewakili manusia pada umumnya.
    reason: cultural_note
lexical_decisions:
- source_word: לְאָדָם
  choice: Manusia menyusun
  rationale: Prefiks ל menyatakan bahwa penataan batin itu merupakan ranah atau bagian manusia. Klausa nominal Ibrani diungkapkan sebagai klausa verbal yang alami dalam bahasa Indonesia, tanpa mengubah manusia menjadi sumber yang ditandai dengan מִן seperti pada klausa kedua.
- source_word: מַעַרְכֵי
  choice: rencana
  rationale: Bentuk dari ערך menunjuk pada penataan atau penyusunan. Dalam hubungan dengan hati, “rencana” menyampaikan penataan maksud batin secara jelas dan wajar.
- source_word: לֵב
  choice: dalam hati
  rationale: לֵב mencakup pikiran, kehendak, dan maksud batin. “Hati” mempertahankan citra khas sastra hikmat Ibrani, sedangkan “dalam” membuat hubungannya dengan kegiatan merencanakan lebih alami dalam bahasa Indonesia.
- source_word: וּמֵיְהוָה
  choice: tetapi ... berasal dari Yahweh
  rationale: ו secara bentuk dapat berarti “dan”, tetapi paralelisme di sini menonjolkan kontras antara penataan manusia dan jawaban yang berasal dari Yahweh. “Tetapi” menyatakan kontras itu tanpa memperluas makna ayat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: מַעֲנֵה
  choice: jawaban
  rationale: Kata benda ini berarti jawaban atau tanggapan. “Jawaban” merupakan padanan langsung dan sesuai dengan gaya pepatah yang ringkas.
- source_word: לָשׁוֹן
  choice: lidah
  rationale: “Lidah” mempertahankan citra konkret Ibrani dan berfungsi sebagai metonimia untuk perkataan yang diucapkan.
theological_decisions:
- issue: Maksud manusia dan kedaulatan ilahi dalam paralelisme pepatah
  choice: Manusia sungguh menyusun rencana batin, sedangkan jawaban yang terucap berasal dari Yahweh.
  alternative: Ayat ini dapat dipahami lebih luas sebagai kontras antara perencanaan manusia dan kendali Allah atas hasil, atau lebih khusus sebagai penegasan bahwa perkataan manusia pun berada di bawah pemerintahan Yahweh.
  rationale: Terjemahan mempertahankan penjajaran teks antara rencana dalam hati dan jawaban lidah. Rumusan ini tidak mengubah pepatah menjadi sistem deterministis dan tidak pula melemahkan peran ilahi menjadi sekadar pemeliharaan umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada hikmat. Struktur verbal pada klausa pertama dipilih agar alami bagi pembaca umum, sedangkan citra “hati” dan “lidah” dipertahankan untuk menjaga kekonkretan puisi Ibrani.
