base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/031.yaml
  text: Gray hair is a crown of glory[b][a]; it is found in the way of righteousness.
translation:
  language: id
  text: Rambut beruban adalah mahkota kemuliaan[b]; rambut itu didapati di jalan kebenaran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini dapat juga diterjemahkan, “di jalan hidup yang benar.” Ungkapan tersebut menggambarkan arah kehidupan yang ditandai oleh perilaku benar.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, rambut beruban merupakan kehormatan apabila menyertai kehidupan yang benar. Amsal ini menyatakan prinsip hikmat yang umum, bukan janji mutlak bahwa setiap orang benar akan berumur panjang.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: mahkota
  rationale: Nomina ini menunjuk pada mahkota atau perhiasan yang melingkari. “Mahkota” mempertahankan metafora kehormatan secara alami dalam bahasa Indonesia.
- source_word: תִּפְאֶרֶת
  choice: kemuliaan
  rationale: Kata ini dapat berarti keindahan, semarak, kehormatan, atau kemuliaan. “Kemuliaan” menyampaikan nuansa luhur dalam frasa konstruksi “mahkota kemuliaan” tanpa mereduksinya menjadi keindahan lahiriah.
- source_word: שֵׂיבָה
  choice: rambut beruban
  rationale: Nomina ini secara konkret menunjuk pada rambut putih atau beruban, dan secara metonimis pada usia lanjut. “Rambut beruban” mempertahankan gambaran konkret Ibrani dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: בְּדֶרֶךְ
  choice: di jalan
  rationale: Gabungan preposisi dan “jalan” merupakan idiom Ibrani untuk arah atau pola hidup. “Di jalan” mempertahankan metafora sumber, sedangkan catatan kaki menjelaskan makna idiomatisnya.
- source_word: צְדָקָה
  choice: kebenaran
  rationale: Dalam konteks ini kata tersebut menunjuk pada kehidupan yang benar secara moral. “Kebenaran” sesuai dengan ungkapan Indonesia “jalan kebenaran” dan tetap cukup luas untuk mencakup kelurusan serta perilaku benar.
- source_word: תִּמָּצֵא
  choice: itu ditemukan
  rationale: Bentuk Nifal dari מצא secara dekat berarti “ditemukan”. Terjemahan ini mempertahankan bentuk pasif dan ambiguitas mengenai apakah rambut beruban dijumpai, diperoleh, atau secara khas terdapat pada jalan hidup yang benar.
theological_decisions:
- issue: Daya pernyataan larik kedua
  choice: Mempertahankan pernyataan bahwa rambut beruban ditemukan di jalan kebenaran sebagai prinsip hikmat umum.
  alternative: Menjadikannya janji mutlak bahwa hidup benar selalu menjamin umur panjang, atau pernyataan bahwa setiap orang lanjut usia pasti benar.
  rationale: Pepatah hikmat lazim mengungkapkan pola umum kehidupan, bukan jaminan mekanis tanpa pengecualian. Bentuk terjemahan yang dekat dengan teks menjaga ketegangan itu, sementara catatan menjelaskan hubungan kehormatan dengan kehidupan benar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua larik serta metafora mahkota dan jalan dipertahankan. Pronomina “itu” merujuk pada rambut beruban dan menjaga bentuk pasif teks Ibrani.
