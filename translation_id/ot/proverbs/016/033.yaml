source:
  edition: WLC
  text: בַּ֭/חֵיק יוּטַ֣ל אֶת הַ/גּוֹרָ֑ל וּ֝/מֵ/יְהוָ֗ה כָּל מִשְׁפָּטֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/033.yaml
  text: The lot is cast into the lap[a], but its every decision is from Yahweh.
translation:
  language: id
  text: Undi dilempar ke pangkuan, tetapi setiap keputusannya[a] berasal dari Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap putusannya” atau “setiap penghakimannya”. Istilah Ibrani yang dipakai dapat bernuansa hukum atau peradilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֵיק
  choice: ke pangkuan
  rationale: חֵיק dapat berarti dada, pangkuan, atau lipatan pakaian. Dalam konteks pengundian, frasa ini mempertahankan gambaran konkret tentang tempat undi dilemparkan tanpa menentukan bentuk bendanya secara berlebihan.
- source_word: יוּטַל
  choice: dilempar
  rationale: Bentuk Hofal menyatakan tindakan pasif, yaitu undi dibuat atau dibiarkan jatuh melalui pelemparan. 'Dilempar' ringkas, alami, dan sesuai dengan praktik pengundian.
- source_word: הַגּוֹרָל
  choice: undi
  rationale: גּוֹרָל menunjuk pada benda atau sarana yang dipakai untuk menentukan keputusan maupun pembagian. 'Undi' adalah padanan Indonesia yang langsung dan tidak mempersempit praktik kuno itu menjadi dadu.
- source_word: וּמֵיְהוָה
  choice: tetapi ... berasal dari Yahweh
  rationale: 'Walaupun ו pada dasarnya dapat berarti ''dan'', hubungan antarklausa bersifat kontras: manusia melempar undi, tetapi keputusan undi itu berasal dari Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: כָּל
  choice: setiap
  rationale: Dengan nomina tunggal, כָּל memiliki nuansa distributif dan mencakup tiap keputusan yang dihasilkan oleh undi.
- source_word: מִשְׁפָּטוֹ
  choice: keputusannya
  rationale: מִשְׁפָּט dapat berarti keputusan, putusan, penghakiman, atau ketetapan. Dalam konteks pengundian, 'keputusannya' alami dalam bahasa Indonesia sekaligus mempertahankan gagasan bahwa undi menghasilkan penentuan.
theological_decisions:
- issue: Kedaulatan ilahi atas hasil yang tampak acak
  choice: Teks menyatakan bahwa manusia melempar undi, tetapi setiap keputusan undi itu berasal dari Yahweh.
  alternative: Ayat ini dapat dipahami secara lebih terbatas sebagai pernyataan mengenai pengundian sakral, atau secara lebih umum sebagai pernyataan mengenai pemeliharaan ilahi atas segala hasil.
  rationale: Terjemahan mempertahankan kontras eksplisit antara tindakan manusia dan sumber keputusan tanpa memperluas pepatah ini menjadi pernyataan sistematis yang melampaui kata-kata Ibraninya.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bernada hikmat. 'Pangkuan' mempertahankan citra kuno, sedangkan 'keputusannya' mudah dipahami oleh pembaca umum. Penanda catatan ditempatkan sesudah kata yang dijelaskannya.
