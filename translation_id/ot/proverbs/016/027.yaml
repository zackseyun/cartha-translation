  text: A worthless man digs up evil[b][a], and on his lips is a scorching fire.
translation:
  language: id
  text: Orang bejat menggali kejahatan,[a] dan bibirnya seperti api yang menghanguskan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menggali malapetaka.” Kata Ibrani dapat menunjuk pada kejahatan moral ataupun kerusakan yang ditimbulkan seseorang.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dan pada bibirnya seperti api yang menghanguskan.” Dalam bahasa Ibrani, kata kerja penghubung tidak dinyatakan.'
    reason: literal_rendering
lexical_decisions:
- source_word: אִישׁ בְּלִיַּעַל
  choice: orang bejat
  rationale: Ungkapan ini menggambarkan seorang tipe yang rusak secara moral, bukan nama diri. 'Orang bejat' alami dalam bahasa Indonesia dan mempertahankan penilaian moral yang kuat.
- source_word: כֹּרֶה
  choice: menggali
  rationale: Partisip dari כרה secara harfiah berarti 'menggali'. Pilihan ini mempertahankan metafora tindakan aktif untuk menghasilkan atau merencanakan kejahatan.
- source_word: רָעָה
  choice: kejahatan
  rationale: Kata ini dapat menunjuk pada kejahatan moral maupun malapetaka atau kerugian yang ditimbulkan; 'kejahatan' mempertahankan cakupan moral yang luas.
- source_word: שפתיו
  choice: pada bibirnya
  rationale: Terjemahan harfiah ini mempertahankan citra anggota tubuh dalam puisi Ibrani dan menunjuk pada perkataan orang itu.
- source_word: כְאֵשׁ צָרָבֶת
  choice: seperti api yang menghanguskan
  rationale: כְּ menandai perbandingan, sedangkan kata langka צָרָבֶת menyampaikan panas yang membakar atau menghanguskan. Frasa ini mempertahankan simile dan daya rusaknya.
- source_word: וְעַל
  choice: dan pada
  rationale: Konjungsi dan preposisi diterjemahkan secara langsung untuk mempertahankan kesejajaran kedua klausa.
theological_decisions:
- issue: Cakupan רָעָה
  choice: kejahatan
  alternative: malapetaka atau celaka
  rationale: Konteks dapat menekankan keburukan moral maupun kerusakan yang ditimbulkan. Teks utama memakai istilah luas, sementara catatan kaki menjaga alternatif kausal/destruktif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. 'Orang bejat' tegas tetapi tetap wajar; metafora menggali dan api dipertahankan. Klausa kedua menambahkan 'ada sesuatu' untuk kelancaran bahasa Indonesia tanpa menentukan secara eksplisit apakah yang dibandingkan adalah perkataan atau bibir.
