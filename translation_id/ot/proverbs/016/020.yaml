source:
  edition: WLC
  text: מַשְׂכִּ֣יל עַל דָּ֭בָר יִמְצָא ט֑וֹב וּ/בוֹטֵ֖חַ בַּ/יהוָ֣ה אַשְׁרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/020.yaml
  text: Whoever gives careful attention to a matter will find good[b][a], and blessed is he who trusts in Yahweh.
translation:
  language: id
  text: Orang yang memperhatikan suatu perkara dengan bijaksana akan menemukan kebaikan[a], dan berbahagialah orang yang percaya kepada Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bertindak bijaksana dalam suatu perkara” atau “bersikap arif mengenai suatu perkara.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “berbahagialah dia.” Bentuk tunggal maskulin dalam bahasa Ibrani dipakai secara umum dan mengacu kepada siapa pun yang percaya kepada Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל עַל־דָּבָר
  choice: memperhatikan suatu perkara dengan bijaksana
  rationale: Bentuk partisip Hifil מַשְׂכִּיל dapat menunjuk pada bertindak dengan pengertian, mempertimbangkan secara bijaksana, atau berhasil karena kebijaksanaan. Bersama עַל־דָּבָר, ungkapan ini paling wajar menyatakan perhatian yang arif dan praktis terhadap suatu perkara.
- source_word: דָּבָר
  choice: perkara
  rationale: Kata ini dapat berarti “perkataan”, “hal”, atau “perkara”. Konteks amsal mendukung arti umum “perkara” tanpa membatasinya pada ucapan.
- source_word: יִמְצָא־טוֹב
  choice: akan menemukan kebaikan
  rationale: Terjemahan ini mempertahankan arti dasar מצא, “menemukan”, dan keluasan טוֹב, yang dapat mencakup hal baik, manfaat, atau kesejahteraan tanpa menyempitkannya menjadi kemakmuran materi.
- source_word: וּבוֹטֵחַ בַּיהוָה
  choice: dan ... orang yang percaya kepada Yahweh
  rationale: Partisip Qal בּוֹטֵחַ digunakan secara umum bagi siapa pun yang menaruh kepercayaan. “Percaya kepada” merupakan ungkapan Indonesia yang alami dalam konteks ini, sedangkan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: אַשְׁרָיו
  choice: berbahagialah orang
  rationale: Ungkapan אַשְׁרֵי menyatakan keadaan bahagia, mujur, atau sejahtera karena berkat, bukan sekadar perasaan senang. Bentuk “berbahagialah orang” mempertahankan corak ucapan bahagia dan secara alami bersifat generik dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi itu, bukan menggantinya dengan gelar.
- issue: Makna אַשְׁרָיו
  choice: berbahagialah orang
  alternative: orang itu diberkati; sungguh mujur orang itu
  rationale: Pilihan ini mempertahankan bentuk ucapan bahagia tanpa secara eksplisit menjadikannya tindakan pasif Allah, sesuatu yang tidak dinyatakan secara gramatikal dalam kata Ibrani tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak ringkas dan bermartabat khas amsal. Susunan paralel dipertahankan, sementara “orang yang” mengungkapkan fungsi generik partisip Ibrani tanpa penandaan gender yang tidak alami dalam bahasa Indonesia.
