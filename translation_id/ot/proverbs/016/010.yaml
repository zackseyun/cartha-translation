  yaml_path: translation/ot/proverbs/016/010.yaml
  text: A divine verdict is on the lips of a king[b][a]; his mouth does not betray justice.
translation:
  language: id
  text: Putusan ilahi ada pada bibir seorang raja[a]; ketika mengadili[b], ucapannya tidak curang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani qesem biasanya berarti “tenungan” dan juga dapat berarti ucapan orakular. Di sini diterjemahkan “putusan ilahi” karena konteksnya adalah perkataan raja dalam penghakiman.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam penghakiman”; kata Ibrani yang dipakai juga dapat berarti “keadilan” atau “keputusan hukum”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶסֶם
  choice: putusan ilahi
  rationale: Kata ini biasanya menunjuk pada tenungan atau ucapan orakular. Dalam konteks perkataan raja dan penghakiman, “putusan ilahi” mempertahankan bobot adikodrati atau orakularnya tanpa memberi kesan bahwa ayat ini menganjurkan praktik tenung.
- source_word: עַל שִׂפְתֵי מֶלֶךְ
  choice: ada pada bibir seorang raja
  rationale: Frasa nominal dan gambaran lokatif Ibrani dipertahankan secara wajar; “seorang raja” menjaga sifat umum peribahasa ini.
- source_word: בְּמִשְׁפָּט
  choice: dalam penghakiman
  rationale: Ungkapan ini dapat menunjuk pada ranah maupun tindakan menjatuhkan keputusan hukum. Terjemahan ini mempertahankan bentuk yang cukup luas dan tidak membatasinya hanya pada konsep abstrak “keadilan”.
- source_word: לֹא יִמְעַל
  choice: tidak berlaku curang
  rationale: Verba ini menyatakan tindakan tidak setia, berkhianat, atau melanggar kepercayaan. Dalam konteks keputusan hukum, “berlaku curang” alami dalam bahasa Indonesia dan mempertahankan unsur ketidaksetiaan terhadap kewajiban menghakimi dengan benar.
- source_word: פִּיו
  choice: mulutnya
  rationale: Terjemahan harfiah ini mempertahankan variasi antara “bibir” pada bagian pertama dan “mulut” pada bagian kedua serta tetap berfokus pada perkataan raja.
theological_decisions:
- issue: Apakah קֶסֶם harus diterjemahkan dengan arti negatifnya yang umum, yaitu “tenungan”, atau dengan arti positif yang disesuaikan dengan konteks peradilan
  choice: putusan ilahi
  alternative: tenungan; sabda orakular
  rationale: Paralelisme dengan penghakiman yang tidak curang menggambarkan secara ideal perkataan raja ketika menjalankan peradilan, bukan mendukung praktik ilmu gaib. Namun, rentang makna kata Ibraninya tetap dinyatakan dalam catatan kaki.
- issue: Apakah bagian kedua merupakan pernyataan faktual atau perintah tersirat kepada raja
  choice: 'Dipertahankan sebagai pernyataan: “tidak berlaku curang”'
  alternative: “tidak boleh berlaku curang”
  rationale: Bentuk Ibraninya secara langsung berupa negasi dengan verba imperfek, bukan larangan eksplisit. Terjemahan tidak mengubahnya menjadi perintah, meskipun peribahasa itu jelas menyajikan cita-cita perilaku raja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. Struktur dua bagian serta citra “bibir” dan “mulut” dipertahankan, sementara pilihan kata dibuat mudah dipahami pembaca umum.
