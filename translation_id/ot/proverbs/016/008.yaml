  text: Better a little with righteousness than great income without justice.
translation:
  language: id
  text: Lebih baik penghasilan sedikit disertai kebenaran daripada banyak penghasilan tanpa keadilan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב מְעַט
  choice: Lebih baik sedikit penghasilan
  rationale: Ungkapan perbandingan Ibrani secara harfiah berarti 'lebih baik sedikit'. Kata 'penghasilan' ditambahkan secara wajar dari konteks ekonomi pada pasangan ungkapan berikutnya agar kalimat Indonesia lengkap dan jelas.
- source_word: בִּצְדָקָה
  choice: dengan kebenaran
  rationale: צְדָקָה mencakup kelurusan moral dan perilaku yang benar; 'kebenaran' mempertahankan cakupan luas itu tanpa membatasinya hanya pada proses hukum.
- source_word: מֵרֹב תְּבוּאוֹת
  choice: daripada banyak pendapatan
  rationale: תְּבוּאוֹת secara dasar menunjuk hasil atau pemasukan yang diperoleh. 'Pendapatan' alami dalam konteks ekonomi dan tetap lebih luas daripada hasil panen.
- source_word: בְּלֹא מִשְׁפָּט
  choice: tanpa keadilan
  rationale: מִשְׁפָּט di sini menyatakan keadilan atau tindakan yang adil, bukan sekadar putusan pengadilan.
theological_decisions:
- issue: Hubungan antara kemakmuran dan hidup benar
  choice: 'Mempertahankan perbandingan hikmat: sedikit yang disertai kebenaran lebih baik daripada kelimpahan tanpa keadilan.'
  alternative: Menafsirkan ayat sebagai larangan mutlak terhadap kekayaan.
  rationale: Teks tidak mengecam banyaknya pendapatan itu sendiri, melainkan pendapatan yang tidak disertai keadilan.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bernada peribahasa. Paralelisme antara 'sedikit penghasilan' dan 'banyak pendapatan' dibuat jelas tanpa menambah penjelasan doktrinal.
