source:
  edition: WLC
  text: כָּֽל דַּרְכֵי אִ֭ישׁ זַ֣ךְ בְּ/עֵינָ֑י/ו וְ/תֹכֵ֖ן רוּח֣וֹת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/002.yaml
  text: All a man's ways are pure in his own eyes[b][a], but Yahweh weighs the spirits.
translation:
  language: id
  text: Segala jalan seseorang murni menurut pandangannya sendiri[a], tetapi Yahweh menimbang roh manusia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Segala jalan seseorang bersih menurut pandangannya sendiri.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Yahweh memeriksa roh manusia” atau “Yahweh menilai motif manusia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: segala
  rationale: Kuantor ini mencakup seluruh jalan yang dimaksud; “segala jalan” alami dalam bahasa Indonesia dan sesuai dengan bentuk jamak Ibrani.
- source_word: דַּרְכֵי אִישׁ
  choice: jalan seorang laki-laki
  rationale: דֶּרֶךְ di sini menunjuk pada jalan hidup, perilaku, atau pola tindakan, bukan jalan harfiah. אִישׁ berbentuk maskulin tunggal dan dipakai secara representatif; terjemahan mempertahankan unsur tersebut tanpa membatasi penerapan umum amsal ini.
- source_word: זַךְ
  choice: murni
  rationale: Kata ini menyatakan kemurnian atau kebersihan, di sini sebagai penilaian moral seseorang atas perilakunya sendiri. “Murni” lebih alami daripada “bersih” dalam konteks ini dan tidak sekuat pengertian yuridis “tidak bersalah”.
- source_word: בְּעֵינָיו
  choice: dalam pandangannya sendiri
  rationale: Ungkapan harfiah “di matanya” berarti menurut penilaian atau sudut pandangnya sendiri. Bentuk ini menyampaikan idiom tersebut secara jelas dan alami.
- source_word: וְתֹכֵן
  choice: tetapi ... menimbang
  rationale: וְ berfungsi antitetis dalam amsal ini, sehingga diterjemahkan “tetapi”. תכן dapat berarti mengukur atau menimbang; “menimbang” mempertahankan metafora penilaian yang saksama.
- source_word: רוּחוֹת
  choice: roh-roh
  rationale: Bentuk jamak ini paling mungkin menunjuk pada roh atau watak batin manusia. Terjemahan formal “roh-roh” mempertahankan keluasan citra Ibrani dan tidak mempersempitnya menjadi “motif” saja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
theological_decisions:
- issue: Makna antropologis רוּחוֹת
  choice: roh-roh batin manusia yang dinilai Yahweh
  alternative: motif-motif atau kecenderungan-kecenderungan batin
  rationale: Dalam pertentangan antara penilaian diri manusia dan penilaian Yahweh, kata ini paling wajar merujuk pada batin manusia. “Motif” merupakan kemungkinan kontekstual, tetapi lebih sempit dan interpretatif.
- issue: Maskulin representatif אִישׁ
  choice: seorang laki-laki
  alternative: seseorang atau manusia
  rationale: Bentuk Ibrani adalah nomina maskulin tunggal yang berfungsi secara umum. Terjemahan mempertahankan bentuk bergender dari sumber, sedangkan cakupan pepatah tetap berlaku secara umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan antitetis amsal dipertahankan. Ungkapan “dalam pandangannya sendiri” menerjemahkan idiom Ibrani secara alami, sedangkan “menimbang roh-roh” sengaja mempertahankan metafora dan ketegangan antropologis teks sumber.
