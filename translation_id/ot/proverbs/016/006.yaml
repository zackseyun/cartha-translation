  text: בְּ/חֶ֣סֶד וֶ֭/אֱמֶת יְכֻפַּ֣ר עָוֺ֑ן וּ/בְ/יִרְאַ֥ת יְ֝הוָ֗ה ס֣וּר מֵ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/006.yaml
  text: By steadfast love and faithfulness iniquity is atoned for[b][a], and by the fear of Yahweh one turns away from evil.
translation:
  language: id
  text: Dengan kasih setia dan kesetiaan[a], kesalahan diampuni[b], dan dengan takut akan Yahweh orang menjauhi kejahatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebenaran”. Kata Ibrani אֱמֶת dapat berarti kebenaran maupun kesetiaan; dalam pasangan ini, maknanya sering mencakup sifat dapat dipercaya dan teguh.
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Ibrani ini berbentuk pasif dan tidak menyebutkan siapa yang mengadakan pendamaian atau pengampunan. Amsal ini tidak menjelaskan secara tegas apakah yang ditekankan ialah tindakan Allah, peranan kasih setia dan kesetiaan dalam kehidupan manusia, atau keduanya.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּחֶסֶד
  choice: dengan kasih setia
  rationale: חֶסֶד mencakup kasih, kebaikan, dan kesetiaan yang teguh dalam hubungan. “Kasih setia” merupakan ungkapan Indonesia yang wajar dan mempertahankan unsur kasih sekaligus loyalitas; prefiks ב dipahami secara instrumental.
- source_word: וֶאֱמֶת
  choice: dan kesetiaan
  rationale: אֱמֶת dapat berarti “kebenaran” atau “kesetiaan”. Dalam pasangan חֶסֶד וֶאֱמֶת, “kesetiaan” paling alami menyampaikan sifat dapat dipercaya dan teguh, sementara kemungkinan “kebenaran” dicatat dalam catatan kaki.
- source_word: יְכֻפַּר
  choice: pendamaian dilakukan atas
  rationale: Bentuk Pual dari כפר menyatakan bahwa pendamaian atau penghapusan kesalahan dilaksanakan tanpa menyebut pelakunya. Susunan ini mempertahankan makna pendamaian dan bentuk pasif sumber, meskipun lebih idiomatis dalam bahasa Indonesia daripada “kesalahan didamaikan”.
- source_word: עָוֺן
  choice: kesalahan
  rationale: עָוֺן dapat menunjuk pada kejahatan, kesalahan, atau keadaan bersalah. “Kesalahan” cukup luas untuk mencakup perbuatan menyimpang dan pertanggungjawabannya tanpa mempersempit makna hanya pada perasaan bersalah.
- source_word: וּבְיִרְאַת יְהוָה
  choice: dan karena takut akan Yahweh
  rationale: Dalam sastra hikmat, יִרְאַת יְהוָה adalah rasa takut yang hormat kepada Allah. “Takut akan Yahweh” mempertahankan ungkapan khas tersebut, sedangkan “karena” menyatakan sarana atau dorongan untuk menjauh dari kejahatan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: סוּר
  choice: orang menjauh
  rationale: Ungkapan verbal ini bersifat umum dalam gaya amsal. “Orang menjauh” menyampaikan subjek generik secara alami tanpa menentukan orang tertentu.
- source_word: מֵרָע
  choice: dari kejahatan
  rationale: Dalam konteks takut akan Yahweh, רָע terutama menunjuk pada kejahatan moral, bukan malapetaka atau bahaya.
theological_decisions:
- issue: Apakah bagian pertama mengajarkan jasa manusia sebagai penyebab pengampunan
  choice: Pelaku pendamaian tidak disebutkan; teks menyatakan bahwa pendamaian dilakukan dengan kasih setia dan kesetiaan.
  alternative: Pendamaian dilakukan semata-mata oleh kasih setia Allah, atau kesetiaan manusia memperoleh pengampunan.
  rationale: Bentuk pasif יְכֻפַּר tidak menyatakan pelaku. Terjemahan tidak menetapkan apakah sifat-sifat itu terutama milik Allah, manusia, atau mencakup keduanya, sehingga ketegangan teologis sumber tetap terpelihara.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Transliterasi “Yahweh” mempertahankan nama pribadi ilahi dalam teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hikmat yang ringkas dan bermartabat. Struktur dua bagian dipertahankan. Istilah “pendamaian dilakukan atas” dipilih untuk menjaga makna כפר dan ketidakjelasan pelaku, meskipun susunannya sedikit lebih formal daripada bahasa percakapan.
