  text: The heart of a wise man gives insight to his mouth[b][a], and adds learning to his lips.
translation:
  language: id
  text: Hati orang bijak membuat mulutnya berkata dengan arif[a], dan menambahkan pengajaran pada bibirnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membuat mulutnya berakal budi.” Kata kerja Ibrani dapat berarti menyebabkan seseorang atau sesuatu bertindak dengan arif atau berpengertian.
    reason: lexical_alternative
  - marker: b
    text: Atau, “menambah daya persuasif pada bibirnya.” Kata Ibrani לֶקַח dapat berarti pengajaran atau pelajaran dan, dalam konteks ini, mungkin juga menunjuk pada perkataan yang mendidik atau meyakinkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: hati
  rationale: Dalam bahasa Ibrani, kata ini mencakup batin, pikiran, dan pertimbangan. “Hati” mempertahankan gambaran antropologis teks sumber dan tetap wajar dalam bahasa Indonesia.
- source_word: חָכָם
  choice: orang bijak
  rationale: Adjektiva maskulin tunggal ini dipakai secara substantival. “Orang bijak” menyampaikan acuannya secara alami tanpa menghilangkan sifat representatif pepatah.
- source_word: יַשְׂכִּיל
  choice: membuat ... berkata-kata dengan arif
  rationale: 'Bentuk hifil dari שׂכל menyatakan sebab: hati yang bijak menjadikan perkataan seseorang arif atau berpengertian. Rumusan ini lebih alami daripada ungkapan harfiah “memberi pengertian kepada mulutnya”.'
- source_word: פִּיהוּ
  choice: mulutnya
  rationale: Terjemahan konkret ini mempertahankan citraan Ibrani dan kesejajarannya dengan “bibirnya” pada baris kedua.
- source_word: וְעַל
  choice: dan ... pada
  rationale: Konjungsi dan preposisi dipertahankan sejauh dapat diungkapkan secara alami dalam susunan puitis bahasa Indonesia.
- source_word: שְׂפָתָיו
  choice: bibirnya
  rationale: Citra konkret dipertahankan sebagai pasangan puitis bagi “mulutnya”.
- source_word: יֹסִיף
  choice: menambah
  rationale: Kata kerja ini secara langsung berarti menambah atau meningkatkan; “menambah” ringkas dan cocok dengan gaya amsal.
- source_word: לֶקַח
  choice: pengajaran
  rationale: Kata ini dapat menunjuk pada pengajaran atau pelajaran yang diterima. “Pengajaran” paling langsung secara leksikal, sementara kemungkinan nuansa persuasif dicatat dalam catatan kaki.
