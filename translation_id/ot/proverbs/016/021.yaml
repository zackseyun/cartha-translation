  text: The wise of heart is called discerning[a], and sweetness of lips increases learning.
translation:
  language: id
  text: Orang yang bijak hati disebut berpengertian, dan ucapan yang manis menambah daya meyakinkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menambah pembelajaran” atau “menambah pengajaran.” Kata Ibrani ini dapat berarti pelajaran yang diterima, pengajaran, atau daya meyakinkan yang dihasilkan oleh perkataan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֲכַם לֵב
  choice: Orang yang bijaksana hatinya
  rationale: Ungkapan ini mempertahankan gambaran Ibrani tentang hati sebagai pusat kebijaksanaan batin, sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: יִקָּרֵא
  choice: disebut
  rationale: Bentuk pasif ini menyatakan bagaimana orang tersebut dikenal atau dinilai; kala kini sesuai dengan gaya amsal yang bersifat umum.
- source_word: נָבוֹן
  choice: berpengertian
  rationale: Kata ini menunjuk kepada orang yang memiliki pemahaman dan daya membedakan. 'Berpengertian' mempertahankan nuansa tersebut tanpa membatasinya hanya pada kecerdasan.
- source_word: וּמֶתֶק שְׂפָתַיִם
  choice: dan tutur kata yang manis
  rationale: Terjemahan ini menyampaikan metafora harfiah 'kemanisan bibir' secara alami; 'bibir' di sini merupakan metonimia untuk perkataan.
- source_word: יֹסִיף
  choice: menambah
  rationale: Bentuk kausatif יסף secara langsung berarti menambahkan atau meningkatkan.
- source_word: לֶקַח
  choice: daya ajar
  rationale: Dalam konteks tutur kata yang menyenangkan, frasa ini dapat menunjuk pada kemampuan perkataan untuk menyampaikan pengajaran secara efektif. Pilihan ini mempertahankan hubungan dengan 'pengajaran' sekaligus membuka nuansa persuasif dari istilah Ibrani.
