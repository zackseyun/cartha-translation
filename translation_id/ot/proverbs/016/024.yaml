  text: Pleasant words are a honeycomb[b][a], sweet to the soul and healing to the bones.
translation:
  language: id
  text: Perkataan yang menyenangkan adalah sarang madu[a], manis bagi jiwa[b] dan obat bagi tulang-tulang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “madu sarang” atau “madu yang menetes”; ungkapan Ibrani ini dapat menunjuk pada sisiran madu atau madu yang mengalir darinya.
    reason: lexical_alternative
  - marker: b
    text: Kata “jiwa” di sini juga dapat berarti “hidup”, “diri”, atau “pribadi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: צוּף דְּבַשׁ
  choice: madu dari sarang
  rationale: Frasa ini menunjuk pada madu yang masih berkaitan dengan sarangnya. Pilihan ini mempertahankan gambaran konkret Ibrani dan lebih wajar dalam bahasa Indonesia daripada terjemahan harfiah yang kaku.
- source_word: אִמְרֵי נֹעַם
  choice: perkataan yang menyenangkan
  rationale: אִמְרֵי berarti perkataan atau ujaran, sedangkan נֹעַם menyatakan kesenangan atau keelokan. Terjemahan ini alami dan tidak mempersempit maknanya menjadi keramahan moral semata.
- source_word: מָתוֹק
  choice: manis
  rationale: Makna indrawi 'manis' dipertahankan agar metafora madu dan kesejajaran puisinya tetap jelas.
- source_word: לַנֶּפֶשׁ
  choice: bagi jiwa
  rationale: נֶפֶשׁ dapat berarti jiwa, hidup, diri, atau pribadi. 'Jiwa' mempertahankan citra antropologis dalam kesejajaran dengan tulang-tulang, sementara keluasan maknanya dijelaskan dalam catatan.
- source_word: וּמַרְפֵּא
  choice: dan menyembuhkan
  rationale: Walaupun bentuk Ibraninya berupa nomina yang dapat berarti kesembuhan atau obat, verba 'menyembuhkan' menghasilkan kalimat Indonesia yang alami dan menyampaikan daya pemulihan perkataan tersebut.
- source_word: לָעָצֶם
  choice: tulang-tulang
  rationale: Nomina tunggal Ibrani dapat dipakai secara kolektif. Bentuk jamak lebih idiomatis dalam bahasa Indonesia dan mempertahankan gambaran jasmani tanpa meratakannya menjadi 'tubuh'.
