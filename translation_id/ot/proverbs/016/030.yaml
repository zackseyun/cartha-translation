  naturalness: Teks draf umumnya baku dan mudah dipahami, tetapi rangkaian "Orang yang ..., dan yang ..., melaksanakan ..." kurang luwes karena "dan yang" seolah-olah memperkenalkan orang kedua. Relatif kedua tanpa "dan" lebih dekat pada struktur deskriptif Ibrani dan lebih alami dalam pepatah Indonesia.
