  yaml_path: translation/ot/proverbs/016/030.yaml
  text: He who shuts his eyes to devise perverse things[a], who purses his lips[b], has completed evil.
translation:
  language: id
  text: Orang yang memejamkan matanya untuk merancang rancangan-rancangan yang menyimpang, yang mengatupkan bibirnya[a], telah menuntaskan kejahatan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menekan bibirnya” atau “mengerucutkan bibirnya.” Kata Ibrani ini di tempat lain dapat merujuk pada kedipan, tetapi di sini yang disebut secara khusus adalah bibir.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “telah menuntaskan kejahatan” atau “telah menyelesaikan kejahatan.” Kata kerjanya menekankan bahwa kejahatan itu dibawa sampai pada akhirnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹצֶה עֵינָיו
  choice: memejamkan matanya
  rationale: Ungkapan ini menggambarkan tindakan menutup mata. “Memejamkan matanya” alami dalam bahasa Indonesia dan sesuai dengan gerak tubuh seseorang yang sedang merancang sesuatu.
- source_word: לַחְשֹׁב
  choice: untuk merancang
  rationale: Dalam konteks ini, חשב menunjuk pada pemikiran yang disengaja atau penyusunan rencana, bukan sekadar berpikir.
- source_word: תַּהְפֻּכוֹת
  choice: hal-hal yang menyimpang
  rationale: Bentuk jamak ini menunjuk pada berbagai hal atau rancangan yang bengkok secara moral. Pilihan ini mempertahankan keluasan maknanya tanpa membatasinya hanya pada tipu daya tertentu.
- source_word: קֹרֵץ שְׂפָתָיו
  choice: mengatupkan bibirnya
  rationale: Objek קרץ di sini adalah bibir, sehingga ungkapan ini menggambarkan gerakan menekan atau merapatkan bibir, bukan mengedipkan mata.
- source_word: כִּלָּה רָעָה
  choice: melaksanakan kejahatan sampai tuntas
  rationale: Piel כלה menekankan penyelesaian atau dibawanya suatu tindakan hingga akhir. Ungkapan ini lebih alami daripada “menyelesaikan kejahatan” dan tetap mempertahankan daya aspek hasilnya.
