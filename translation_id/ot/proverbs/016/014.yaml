source:
  edition: WLC
  text: חֲמַת מֶ֥לֶךְ מַלְאֲכֵי מָ֑וֶת וְ/אִ֖ישׁ חָכָ֣ם יְכַפְּרֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/014.yaml
  text: The wrath of a king is messengers of death[b][a], but a wise man will appease it.
translation:
  language: id
  text: Murka raja adalah utusan-utusan maut,[a] tetapi orang bijak akan meredakannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “utusan-utusan maut.” Kata Ibrani untuk “utusan” juga dapat berarti “malaikat,” tetapi di sini kemungkinan besar menunjuk kepada para pelaksana yang diutus oleh raja.
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Ibrani ini berasal dari akar kata yang juga sering diterjemahkan “mengadakan pendamaian.” Dalam konteks ini, artinya meredakan atau memalingkan murka raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: murka
  rationale: Kata ini menyatakan amarah yang menyala-nyala. “Murka” mempertahankan bobot dan ragam tinggi pepatah serta selaras dengan ancaman maut pada bagian berikutnya.
- source_word: מֶלֶךְ
  choice: raja
  rationale: Makna langsungnya ialah seorang raja; pilihan ini mempertahankan latar konkret kehidupan istana.
- source_word: מַלְאֲכֵי
  choice: utusan-utusan
  rationale: Istilah Ibrani ini dapat menunjuk kepada utusan manusia maupun malaikat. Dalam gambaran mengenai istana kerajaan, utusan atau pelaksana titah raja paling sesuai, tanpa memasukkan unsur adikodrati yang tidak dituntut konteks.
- source_word: מָוֶת
  choice: maut
  rationale: “Maut” mempertahankan gambaran puitis dan bernada berat dalam frasa “utusan-utusan maut.”
- source_word: וְאִישׁ חָכָם
  choice: tetapi orang bijak
  rationale: Kata sambung dipahami sebagai kontras antara bahaya murka raja dan tindakan orang berhikmat. “Orang bijak” wajar dalam bahasa Indonesia dan menyampaikan fungsi proverbial איש sebagai seorang manusia representatif tanpa menambahkan pembatasan yang tidak diperlukan konteks.
- source_word: יְכַפְּרֶנָּה
  choice: akan meredakannya
  rationale: Dalam konteks ini, objek akhiran femininnya mengacu kepada murka raja. “Meredakannya” menyampaikan tindakan menenangkan atau memalingkan murka, bukan tindakan ritual.
theological_decisions:
- issue: Apakah כפר diterjemahkan dengan istilah kultis mengenai pendamaian atau dengan istilah nonkultis mengenai peredaan murka
  choice: 'Nonkultis: “akan meredakannya”'
  alternative: “akan mengadakan pendamaian baginya” atau “akan menenangkannya”
  rationale: Konteks langsung membahas murka raja, bukan korban atau ibadah Bait Suci. Pilihan “meredakannya” mempertahankan gagasan memalingkan murka tanpa memasukkan teologi ritual yang tidak dinyatakan oleh pepatah, sedangkan hubungan leksikalnya dengan bahasa pendamaian dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada hikmat. Struktur metaforis “adalah utusan-utusan maut” dipertahankan tanpa mengubahnya menjadi perumpamaan eksplisit. Pronomina “-nya” merujuk kepada murka raja.
