  yaml_path: translation/ot/proverbs/016/003.yaml
  text: Commit your works to Yahweh[b][a], and your plans will be established.
translation:
  language: id
  text: Percayakanlah segala pekerjaanmu kepada Yahweh[a], maka rencana-rencanamu akan diteguhkan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Gulingkanlah segala pekerjaanmu kepada Yahweh”; ungkapan ini berarti menyerahkan atau memercayakannya kepada-Nya.
    reason: lexical_alternative
  - marker: b
    text: Atau “pikiran-pikiranmu” atau “maksud-maksudmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּל
  choice: Percayakanlah
  rationale: Secara harfiah verba ini berarti “gulingkanlah,” tetapi dalam ungkapan dengan אֶל יְהוָה maknanya ialah menyerahkan dengan penuh kepercayaan. “Percayakanlah” alami dalam bahasa Indonesia dan mempertahankan unsur kepercayaan tanpa menerjemahkan metafora secara kaku.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menunjukkan arah kepada Yahweh. Bersama “percayakanlah,” padanan Indonesia yang wajar ialah “kepada.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: מַעֲשֶׂיךָ
  choice: segala pekerjaanmu
  rationale: Kata ini mencakup perbuatan, pekerjaan, atau usaha seseorang. “Segala pekerjaanmu” jelas dan cukup luas dalam konteks nasihat hikmat.
- source_word: וְיִכֹּנוּ
  choice: maka ... akan diteguhkan
  rationale: Bentuk Nifal dari כון menyatakan keadaan dijadikan kukuh atau mantap. “Akan diteguhkan” mempertahankan nuansa pasif dan tidak dengan sendirinya menjanjikan keberhasilan materi.
- source_word: מַחְשְׁבֹתֶיךָ
  choice: rencana-rencanamu
  rationale: Kata ini dapat berarti pikiran, maksud, atau rencana. Dalam kesejajaran dengan pekerjaan, “rencana-rencanamu” paling alami, sementara keluasan maknanya dicatat dalam catatan kaki.
theological_decisions:
- issue: Hubungan antara tindakan manusia dan peneguhan ilahi
  choice: Ayat ini menyerukan agar manusia memercayakan pekerjaannya kepada Yahweh, dengan hasil bahwa rencananya diteguhkan.
  alternative: Ayat ini dapat dibaca secara deterministis seolah-olah Allah menetapkan semua rencana tanpa kaitan dengan respons manusia, atau secara berorientasi kemakmuran seolah-olah setiap usaha pasti berhasil.
  rationale: Teks Ibrani menyampaikan nasihat hikmat beserta hasilnya, tetapi tidak merumuskan doktrin providensi secara lengkap dan tidak secara khusus menjamin keberhasilan duniawi setiap usaha. Terjemahan mempertahankan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat khas sastra hikmat. Bentuk imperatif “Percayakanlah” mudah dipahami pembaca umum; nama Yahweh dipertahankan. Semua penanda catatan kaki terdapat dalam teks utama.
