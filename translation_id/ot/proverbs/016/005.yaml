  yaml_path: translation/ot/proverbs/016/005.yaml
  text: Everyone who is proud in heart is an abomination to Yahweh; hand to hand[a], he will certainly not go unpunished.
translation:
  language: id
  text: Setiap orang yang tinggi hati adalah kekejian bagi Yahweh; tangan ke tangan[a], orang itu pasti tidak akan luput dari hukuman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tangan ke tangan”, sebuah ungkapan Ibrani yang mungkin berarti “sungguh” atau “yakinlah”; mungkin juga berarti “sekalipun mereka bergandengan tangan” (yakni, bersekutu).
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: kekejian
  rationale: Kata benda ini menunjuk pada sesuatu yang sangat dibenci atau dianggap menjijikkan secara moral. “Kekejian” mempertahankan daya moral-religiusnya yang kuat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: כָּל גְּבַהּ לֵב
  choice: setiap orang yang tinggi hati
  rationale: Ungkapan ini secara harfiah menggambarkan orang yang “tinggi hatinya”, yaitu sombong atau angkuh dalam batin. “Tinggi hati” alami dan jelas dalam bahasa Indonesia.
- source_word: יָד לְיָד
  choice: tangan dengan tangan
  rationale: Ungkapan Ibrani ini sulit dan memiliki lebih dari satu kemungkinan tafsir. Terjemahan yang dekat dengan bentuk sumber mempertahankan ambiguitasnya, sedangkan kemungkinan maknanya dijelaskan dalam catatan kaki.
- source_word: לֹא יִנָּקֶה
  choice: pasti tidak akan luput dari hukuman
  rationale: Bentuk ini menyatakan bahwa orang tersebut tidak akan bebas dari akibat hukumannya. “Tidak akan luput dari hukuman” menyampaikan makna yudisial secara jelas; “pasti” mencerminkan kemungkinan fungsi penegasan dari ungkapan sebelumnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Penafsiran יָד לְיָד
  choice: Mempertahankan ungkapan “tangan dengan tangan” dalam teks utama dan menjelaskan kemungkinan maknanya dalam catatan kaki.
  alternative: Menerjemahkannya langsung sebagai “sungguh/pastikanlah” atau “sekalipun mereka bergandengan tangan”.
  rationale: Ungkapan ini benar-benar tidak pasti. Mempertahankan bentuknya dalam teks utama menghindari penetapan satu tafsir secara diam-diam, sementara catatan kaki memberi pembaca alternatif utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Tinggi hati” mudah dipahami sekaligus mempertahankan gambaran batiniah teks Ibrani. Susunan ungkapan yang tidak biasa “tangan dengan tangan” sengaja dipertahankan karena sumbernya ambigu dan diterangkan melalui catatan kaki.
