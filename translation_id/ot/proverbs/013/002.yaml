  naturalness: “Dari buah mulut seseorang” adalah idiom yang lebih lancar dan secara langsung mencerminkan konstruksi Ibrani. “Nafsu ... mengarah kepada kekerasan” lebih idiomatis daripada “nafsu ... menginginkan kekerasan,” tanpa menghilangkan kontras amsal.
