  text: מִ/פְּרִ֣י פִי אִ֭ישׁ יֹ֣אכַל ט֑וֹב וְ/נֶ֖פֶשׁ בֹּגְדִ֣ים חָמָֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/002.yaml
  text: From the fruit of a man's mouth he eats good[b][a], but the soul of the treacherous feeds on violence.
translation:
  language: id
  text: Dari buah mulut seseorang, ia memakan apa yang baik, tetapi nafsu[a] orang-orang yang berkhianat mengarah kepada kekerasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jiwa orang-orang yang berkhianat—kekerasan.” Kata Ibrani yang diterjemahkan “nafsu” juga dapat berarti “jiwa” atau “diri.” Klausa kedua tidak memiliki kata kerja tersurat; terjemahan lain ialah “jiwa orang-orang yang berkhianat [memakan] kekerasan.”
    reason: lexical_alternative_and_elliptical_clause
lexical_decisions:
- source_word: מִפְּרִי פִי אִישׁ
  choice: Dari buah mulutnya, seseorang
  rationale: Mempertahankan gambaran konkret Ibrani “buah mulut” sebagai hasil perkataan. אִישׁ bersifat generik dalam amsal ini, sehingga diterjemahkan “seseorang” dalam bahasa Indonesia modern.
- source_word: יֹאכַל טוֹב
  choice: memakan apa yang baik
  rationale: Bentuk imperfek menyatakan kebenaran umum. “Memakan” mempertahankan metafora yang berkaitan dengan “buah,” sedangkan “apa yang baik” menjaga keluasan makna טוֹב.
- source_word: וְנֶפֶשׁ
  choice: tetapi nafsu
  rationale: וְ dipahami sebagai kontras antarbait. נֶפֶשׁ dapat berarti jiwa, diri, hasrat, atau nafsu; dalam klausa eliptis ini “nafsu” menghasilkan bahasa Indonesia yang wajar tanpa menutup kemungkinan lain, yang dicatat dalam catatan kaki.
- source_word: בֹּגְדִים
  choice: orang-orang yang berkhianat
  rationale: Partisipel ini menggambarkan orang yang bertindak khianat atau tidak setia. Frasa verbal ini lebih alami dan jelas daripada nomina abstrak dalam bahasa Indonesia.
- source_word: חָמָס
  choice: kekerasan
  rationale: חָמָס lazim menunjuk pada kekerasan atau kejahatan dengan unsur kekerasan. “Kekerasan” merupakan padanan langsung dan transparan.
theological_decisions:
- issue: Klausa kedua tidak memiliki verba tersurat dan hubungan נֶפֶשׁ dengan חָמָס ambigu.
  choice: nafsu ... menginginkan kekerasan
  alternative: jiwa orang-orang yang berkhianat [memakan] kekerasan
  rationale: Terjemahan utama menghasilkan kalimat Indonesia yang alami dan mencerminkan kemungkinan bahwa נֶפֶשׁ berarti hasrat atau nafsu. Catatan kaki mempertahankan pembacaan yang lebih harfiah serta metafora makan yang mungkin diteruskan dari klausa pertama.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bernada amsal. Metafora “buah mulut” serta “memakan” dipertahankan, sementara elipsis pada bait kedua dijelaskan melalui catatan kaki.
