  text: Wealth from vanity dwindles[b][a], but whoever gathers little by little increases it.
translation:
  language: id
  text: Kekayaan yang diperoleh dengan cara yang sia-sia akan menyusut[a], tetapi orang yang mengumpulkannya sedikit demi sedikit[b] akan menambahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari uap/kehampaan”; ungkapan ini dapat menggambarkan kekayaan yang diperoleh melalui sesuatu yang fana, tidak kukuh, atau sia-sia.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di atas tangan”; ungkapan Ibrani ini kemungkinan berarti mengumpulkan secara bertahap atau dalam jumlah-jumlah kecil.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: kekayaan
  rationale: Kata ini menunjuk pada harta atau milik material; “kekayaan” merupakan padanan Indonesia yang luas, alami, dan sesuai dengan konteks.
- source_word: מֵהֶבֶל
  choice: yang berasal dari kesia-siaan
  rationale: הֶבֶל secara harfiah berarti “napas/uap” dan secara kiasan berarti kesia-siaan atau kehampaan. Terjemahan ini mempertahankan gambaran tentang sumber kekayaan yang tidak berbobot, tidak kukuh, atau cepat lenyap tanpa mempersempitnya menjadi sekadar perolehan yang tergesa-gesa atau tidak jujur.
- source_word: יִמְעָט
  choice: akan menyusut
  rationale: Kata kerja ini berarti menjadi sedikit atau berkurang; “menyusut” terdengar alami untuk kekayaan yang lambat laun berkurang.
- source_word: וְקֹבֵץ
  choice: tetapi orang yang mengumpulkannya
  rationale: Partisip ini menyatakan pelaku secara umum. Pronomina “-nya” memperjelas bahwa yang dikumpulkan adalah kekayaan yang sedang dibicarakan.
- source_word: עַל יָד
  choice: sedikit demi sedikit
  rationale: Ungkapan ini paling wajar dipahami sebagai pengumpulan secara bertahap, dalam bagian-bagian kecil. Padanan ini juga menyampaikan kontras utama peribahasa dengan jelas.
- source_word: יַרְבֶּה
  choice: akan membuatnya bertambah
  rationale: Bentuk Hifil dari רבה berarti membuat menjadi banyak atau menambah. “-nya” merujuk kembali kepada kekayaan.
