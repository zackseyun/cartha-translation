  text: רַק בְּ֭/זָדוֹן יִתֵּ֣ן מַצָּ֑ה וְ/אֶת נ֖וֹעָצִ֣ים חָכְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/010.yaml
  text: Only by arrogance comes strife[a], but wisdom is with those who take counsel.
translation:
  language: id
  text: Pertengkaran timbul hanya karena keangkuhan[a], tetapi hikmat ada pada orang yang menerima nasihat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Hanya dari kelancangan timbul perselisihan, tetapi hikmat ada pada orang yang bersedia dinasihati.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: hanya
  rationale: Mempertahankan daya pembatas yang tegas dalam pepatah ini.
- source_word: בְּזָדוֹן
  choice: karena keangkuhan
  rationale: זָדוֹן menunjuk pada kesombongan yang lancang atau sikap merasa diri lebih tinggi; frasa ini secara alami menyatakan sumber pertengkaran dalam bahasa Indonesia.
- source_word: יִתֵּן
  choice: timbul
  rationale: Secara harfiah berarti 'memberi', tetapi dalam susunan ini menyatakan bahwa pertengkaran muncul atau dihasilkan; 'timbul' menghasilkan ungkapan Indonesia yang wajar.
- source_word: מַצָּה
  choice: pertengkaran
  rationale: Kata ini mengacu pada perselisihan atau perbantahan; 'pertengkaran' jelas dan mudah dipahami dalam konteks hubungan antarmanusia.
- source_word: וְאֶת
  choice: tetapi ... ada pada
  rationale: Klausa kedua secara harfiah berbunyi 'dan pada orang-orang yang dinasihati [ada] hikmat'; 'tetapi' menampilkan pertentangan antarkedua baris secara alami.
- source_word: נוֹעָצִים
  choice: orang yang menerima nasihat
  rationale: Partisipel Nifal dari יעץ dapat menunjuk kepada mereka yang dinasihati atau bersedia menerima pertimbangan; pilihan ini mempertahankan nuansa penerimaan nasihat tanpa mempersempitnya menjadi tindakan konsultasi formal.
- source_word: חָכְמָה
  choice: hikmat
  rationale: Istilah baku dalam sastra Amsal untuk kebijaksanaan yang membimbing hidup dan tindakan.
