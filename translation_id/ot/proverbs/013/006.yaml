  text: צְ֭דָקָה תִּצֹּ֣ר תָּם דָּ֑רֶךְ וְ֝/רִשְׁעָ֗ה תְּסַלֵּ֥ף חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/006.yaml
  text: Righteousness guards the blameless in the way[a], but wickedness overturns sin.
translation:
  language: id
  text: Kebenaran menjaga orang yang tidak bercela dalam hidupnya, tetapi kefasikan merusak dosa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tetapi kefasikan merusak orang berdosa.” Kata Ibrani חַטָּאת di sini dapat dipahami sebagai dosa atau sebagai sebutan bagi orang yang berdosa.
    reason: alternative_reading
lexical_decisions:
- source_word: צְדָקָה
  choice: Kebenaran
  rationale: Dalam konteks amsal ini, kata tersebut menunjuk pada kelurusan moral yang melindungi; “kebenaran” lebih sesuai daripada “keadilan,” yang dalam bahasa Indonesia cenderung menonjolkan segi hukum atau sosial.
- source_word: תִּצֹּר
  choice: menjaga
  rationale: Menyampaikan makna melindungi, memelihara, atau mengawasi dengan ungkapan Indonesia yang ringkas dan alami.
- source_word: תָּם
  choice: orang yang tidak bercela
  rationale: Menunjuk pada pribadi yang utuh dan berintegritas dalam perilakunya, tanpa harus menyatakan bahwa ia sama sekali tidak berdosa.
- source_word: דָּרֶךְ
  choice: dalam jalan hidupnya
  rationale: Mempertahankan metafora “jalan” sebagai pola hidup atau perilaku. Pronomina “-nya” membuat hubungan sintaksis Ibrani yang padat menjadi wajar dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: וְרִשְׁעָה
  choice: tetapi kefasikan
  rationale: “Tetapi” menyatakan pertentangan antarkedua bagian amsal, sedangkan “kefasikan” mempertahankan gagasan kelaliman moral.
- source_word: תְּסַלֵּף
  choice: menjungkirbalikkan
  rationale: Bentuk intensif verba ini dapat berarti membengkokkan, merusak, atau menggulingkan. “Menjungkirbalikkan” mempertahankan gambaran pembalikan yang merusak.
- source_word: חַטָּאת
  choice: dosa
  rationale: Makna leksikal langsungnya adalah “dosa,” tetapi dalam konteks ini kata tersebut juga dapat dipahami sebagai sebutan bagi “orang berdosa.” Bacaan utama mempertahankan ketegangan teks, dan alternatifnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Acuan חַטָּאת pada bagian kedua
  choice: Diterjemahkan “dosa” dalam teks utama.
  alternative: '“orang berdosa,” sehingga bagiannya berbunyi: “tetapi kefasikan menjungkirbalikkan orang berdosa.”'
  rationale: Teks Ibrani sangat ringkas. Nomina ini secara langsung dapat berarti “dosa,” tetapi kesejajaran antitetisnya mungkin menunjuk pada orang yang dicirikan oleh dosa. Teks utama dan catatan kaki bersama-sama mempertahankan ambiguitas tersebut tanpa menetapkan satu tafsiran secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Metafora hikmat tentang “jalan hidup” dipertahankan, sedangkan susunan Ibrani yang padat diperjelas secukupnya agar mudah dipahami.
