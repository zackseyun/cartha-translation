revisions:
- from: Kebenaran menjaga orang yang tidak bercela dalam jalan hidupnya, tetapi kefasikan menjungkirbalikkan dosa.[a]
  to: Kebenaran menjaga orang yang tidak bercela dalam hidupnya, tetapi kefasikan merusak dosa.[a]
  rationale: Revisi ini memperbaiki kealamian bahasa Indonesia sambil mempertahankan keputusan audit untuk menerjemahkan חַטָּאת sebagai “dosa” dalam teks utama dan menyimpan pembacaan “orang berdosa” dalam catatan kaki. “Merusak” cukup luas untuk daya makna תְּסַלֵּף dan tidak menyelesaikan ambiguitas teks secara doktrinal atau interpretatif.
