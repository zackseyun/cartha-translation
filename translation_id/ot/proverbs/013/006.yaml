  verdict: revise
  source_fidelity: Bagian pertama menyampaikan צְדָקָה ... תָּם דָּרֶךְ dengan baik, tetapi frasa “dalam jalan hidupnya” menambahkan kepemilikan secara lebih eksplisit daripada yang perlu dan kurang idiomatis. Pada bagian kedua, חַטָּאת memang dapat dipertahankan sebagai “dosa” dalam teks utama bila ambiguitas hendak dijaga; catatan kaki dengan tepat mencatat kemungkinan “orang berdosa.”
  naturalness: “Menjungkirbalikkan dosa” sangat tidak alami dalam bahasa Indonesia modern dan menciptakan gambaran fisik yang janggal bagi objek abstrak. “Merusak dosa” juga sengaja mempertahankan ketegangan semantis teks, tetapi lebih lazim sebagai kolokasi bahasa Indonesia dan masih dapat mewakili daya rusak dari תְּסַלֵּף tanpa memutuskan bahwa חַטָּאת berarti seorang pendosa. “Dalam hidupnya” lebih alami daripada “dalam jalan hidupnya.”
  terminology: “Kebenaran,” “menjaga,” “orang yang tidak bercela,” dan “kefasikan” sesuai dengan register hikmat yang baku. “Kefasikan” tepat untuk רִשְׁעָה. Catatan kaki perlu memakai alternatif yang lebih alami, “merusak orang berdosa,” bukan gambaran “menjungkirbalikkan orang berdosa.”
  issues:
  - severity: medium
    issue: “menjungkirbalikkan dosa” tidak idiomatis dan terlalu harfiah secara gambarannya.
    rationale: Piel סלף menyatakan tindakan membengkokkan, merusak, atau menggulingkan; dengan “dosa” sebagai objek, “menjungkirbalikkan” terdengar tidak wajar dalam bahasa Indonesia. Penggantian dengan “merusak” mempertahankan pembacaan utama “dosa” dan ketegangannya, tanpa memaksakan pembacaan “orang berdosa.”
  - severity: low
    issue: “dalam jalan hidupnya” kurang alami dan memperjelas pronomina yang tidak tersurat.
    rationale: Ungkapan “dalam hidupnya” tetap mengungkap metafora perilaku/jalan dalam konstruksi Indonesia yang lebih wajar, dengan tambahan penafsiran yang lebih kecil.
  revised_text: Kebenaran menjaga orang yang tidak bercela dalam hidupnya, tetapi kefasikan merusak dosa.[a]
  revised_footnotes:
