  verdict: revise
  source_fidelity: 'Teks utama dengan tepat mencerminkan struktur antitetis dan makna pokok Ibrani: orang benar makan hingga cukup, sedangkan orang fasik berada dalam keadaan kekurangan. Namun, «nafsunya» tanpa penjelas dapat berarti hasrat secara umum, bukan khusus selera atau kebutuhan makan; dan «perut ... berkekurangan» kurang wajar dalam bahasa Indonesia.'
  naturalness: «Nafsu makannya» merupakan padanan yang lebih jelas dan alami bagi נַפְשׁוֹ dalam konteks makan. «Perut orang fasik selalu kekurangan» mempertahankan metafora konkret בֶּטֶן dan predikasi חָסֵר sambil lebih idiomatis daripada «berkekurangan».
  terminology: «Orang benar» dan «orang fasik» sesuai untuk צַדִּיק dan רְשָׁעִים dalam register sastra hikmat. Catatan kaki perlu mempertahankan kemungkinan «jiwanya» serta ejaan transliterasi Ibrani yang tepat, nefesh.
  issues:
  - severity: medium
    issue: «nafsunya» ambigu dalam bahasa Indonesia
    rationale: Dalam pemakaian modern, «nafsu» sering menunjuk pada dorongan atau hasrat umum, termasuk seksual. Dalam konteks ini, «nafsu makannya» dengan jelas menyampaikan pilihan leksikal ‘appetite’ untuk נֶפֶשׁ tanpa menghapus alternatif dalam catatan kaki.
  - severity: low
    issue: «perut orang-orang fasik berkekurangan» kurang idiomatis
    rationale: «Berkekurangan» lazimnya dipakai untuk orang atau keadaan hidup, bukan untuk «perut». «Perut orang fasik selalu kekurangan» tetap mempertahankan subjek metaforis Ibrani dan menyatakan keadaan kekurangan yang berkelanjutan dalam gaya amsal.
  - severity: low
    issue: Transliterasi «nefesy» tidak tepat
    rationale: Bentuk yang lazim dan sesuai dengan bentuk Ibrani נֶפֶשׁ adalah «nefesh».
