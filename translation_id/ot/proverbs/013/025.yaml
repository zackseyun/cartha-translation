  yaml_path: translation/ot/proverbs/013/025.yaml
  text: A righteous man eats to the satisfaction of his soul[a], but the belly of the wicked lacks.
translation:
  language: id
  text: Orang benar makan sampai nafsu makannya terpuaskan,[a] tetapi perut orang fasik selalu kekurangan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: "sampai jiwanya terpuaskan." Kata Ibrani נֶפֶשׁ (nefesh) dapat berarti "jiwa", "kehidupan", "diri", atau "nafsu makan", bergantung pada konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva tunggal ini berfungsi sebagai nomina dan menyatakan sosok representatif; 'orang benar' alami dalam bahasa Indonesia serta tidak menambahkan penekanan gender yang tidak diperlukan.
- source_word: אֹכֵל
  choice: makan
  rationale: Partisip ini menyatakan tindakan umum atau kebiasaan dalam gaya amsal; bentuk kini tanpa penanda waktu paling alami dalam bahasa Indonesia.
- source_word: לְשֹׂבַע נַפְשׁוֹ
  choice: sampai nafsunya terpuaskan
  rationale: Ungkapan ini menyatakan makan hingga mencapai kecukupan. Dalam konteks makan, נֶפֶשׁ secara wajar dapat menunjuk pada nafsu makan, sambil tetap diberi catatan mengenai rentang maknanya.
- source_word: וּבֶטֶן
  choice: tetapi perut
  rationale: Kata sambung bersifat kontras dalam konteks ini, sedangkan 'perut' mempertahankan gambaran konkret Ibrani dan berfungsi sebagai metonimia bagi kebutuhan jasmani.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Bentuk jamak substantival menunjuk pada golongan orang yang jahat secara moral; 'orang-orang fasik' adalah ungkapan ringkas dan lazim dalam sastra hikmat Indonesia.
- source_word: תֶּחְסָר
  choice: berkekurangan
  rationale: Verba ini berarti kekurangan, tidak memiliki cukup, atau berada dalam kebutuhan. 'Berkekurangan' menjaga kontras antara kepuasan orang benar dan kebutuhan orang fasik yang tidak terpenuhi.
theological_decisions:
- issue: Cakupan kepuasan yang dinyatakan oleh נֶפֶשׁ
  choice: Teks utama memakai 'nafsunya' dalam konteks makan, dengan catatan kemungkinan 'jiwanya'.
  alternative: jiwanya terpuaskan
  rationale: Konteks langsung mendukung arti nafsu makan, tetapi polisemi נֶפֶשׁ memungkinkan nuansa diri atau jiwa secara lebih luas; catatan kaki mempertahankan ambiguitas itu tanpa menjadikannya klaim antropologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bernada amsal. Struktur antitetis Ibrani dipertahankan; 'berkekurangan' dipilih agar baris kedua tetap ringkas dan tidak secara berlebihan menafsirkan kekurangan itu sebagai rasa lapar semata.
