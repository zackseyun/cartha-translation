  text: תַּאֲוָ֣ה נִ֭הְיָה תֶּעֱרַ֣ב לְ/נָ֑פֶשׁ וְ/תוֹעֲבַ֥ת כְּ֝סִילִ֗ים ס֣וּר מֵ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/019.yaml
  text: A desire fulfilled is sweet to the soul[a], but to turn away from evil is an abomination to fools.
translation:
  language: id
  text: Keinginan yang terpenuhi terasa manis bagi jiwa[a], tetapi menjauh dari kejahatan adalah kekejian bagi orang bodoh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Keinginan yang menjadi kenyataan menyenangkan jiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּאֲוָה
  choice: keinginan
  rationale: Kata ini menyatakan keinginan atau kerinduan. “Keinginan” cukup luas dan alami dalam bahasa Indonesia tanpa memperkuat maknanya secara berlebihan menjadi “nafsu” atau “hasrat yang menggebu”.
- source_word: נִהְיָה
  choice: yang terpenuhi
  rationale: Partisipel Nifal dari היה menggambarkan keinginan yang telah menjadi kenyataan. “Yang terpenuhi” merupakan pasangan idiomatis bagi “keinginan” dan menyatakan keadaan hasil.
- source_word: תֶּעֱרַב
  choice: terasa manis
  rationale: Kata kerja ערב di sini berarti menyenangkan atau manis. “Terasa manis” mempertahankan metafora konkret Ibrani sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: לְנָפֶשׁ
  choice: bagi jiwa
  rationale: נפש di sini menunjuk pada diri batin atau pribadi yang mengalami kepuasan. “Bagi jiwa” mempertahankan keluasan antropologis dan daya rasa ungkapan Ibrani.
- source_word: וְתוֹעֲבַת
  choice: tetapi ... adalah kekejian
  rationale: Waw menghubungkan dua bagian yang berlawanan, sehingga “tetapi” menyatakan hubungan adversatif dengan jelas. “Kekejian” mempertahankan kekuatan תועבה sebagai sesuatu yang dipandang sangat menjijikkan atau dibenci.
- source_word: כְּסִילִים
  choice: orang bodoh
  rationale: Dalam Amsal, כְּסִילִים menunjuk pada orang yang bebal secara moral dan intelektual, bukan sekadar kurang cerdas. “Orang bodoh” adalah padanan baku dalam sastra hikmat dan membiarkan konteks menyampaikan dimensi moralnya.
- source_word: סוּר
  choice: menjauh
  rationale: Infinitif ini menyatakan tindakan berpaling atau meninggalkan sesuatu. “Menjauh” alami dalam frasa “menjauh dari kejahatan” dan mempertahankan unsur keputusan moral.
- source_word: מֵרָע
  choice: dari kejahatan
  rationale: רָע dalam konteks hikmat ini terutama mengacu pada kejahatan moral, bukan sekadar kemalangan atau bahaya.
theological_decisions:
- issue: Hubungan antara kedua bagian pepatah
  choice: Mempertahankan kontras antara nikmatnya keinginan yang terpenuhi dan keengganan orang bodoh meninggalkan kejahatan
  alternative: Menafsirkan keinginan pada bagian pertama secara khusus sebagai keinginan baik atau jahat
  rationale: Teks Ibrani tidak menentukan nilai moral keinginan pada bagian pertama. Terjemahan tidak menambahkan penilaian teologis yang tidak dinyatakan, melainkan mempertahankan ketegangan pepatah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hikmat. Metafora “manis” serta istilah “jiwa” dipertahankan karena keduanya dapat dipahami pembaca umum dan mencerminkan citra serta keluasan makna teks Ibrani.
