  text: Poverty and disgrace come to one who ignores discipline[b][a], but whoever heeds reproof will be honored.
translation:
  language: id
  text: Kemiskinan dan kehinaan menimpa orang yang mengabaikan didikan,[a] tetapi siapa yang mengindahkan teguran akan dihormati.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melalaikan didikan” atau “membuang didikan.” Kata Ibrani ini dapat menyiratkan bahwa seseorang tidak memedulikan atau melepaskan didikan.
    reason: lexical_alternative
  - marker: b
    text: “Mengindahkan” secara harfiah berarti “menjaga” atau “memelihara,” yakni memperhatikan teguran dengan sungguh-sungguh dan berpegang padanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵישׁ
  choice: kemiskinan
  rationale: Kata benda ini menunjuk pada keadaan miskin atau kekurangan; “kemiskinan” merupakan padanan baku, jelas, dan sesuai dengan pernyataan akibat dalam amsal ini.
- source_word: קָלוֹן
  choice: kehinaan
  rationale: Istilah ini menyatakan aib atau hilangnya kehormatan di hadapan orang lain. “Kehinaan” mempertahankan nuansa sosialnya dan berpadanan secara kontras dengan “dihormati” pada baris kedua.
- source_word: פּוֹרֵעַ
  choice: orang yang mengabaikan
  rationale: Partisipel ini dalam konteks tersebut berarti melalaikan, melepaskan, atau menolak kekangan. “Mengabaikan” alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi penolakan yang selalu disengaja.
- source_word: מוּסָר
  choice: didikan
  rationale: Dalam Amsal, kata ini mencakup pengajaran yang membentuk, disiplin, dan koreksi. “Didikan” terdengar alami dan mempertahankan cakupan yang lebih luas daripada sekadar hukuman.
- source_word: שׁוֹמֵר
  choice: mengindahkan
  rationale: Secara harfiah berarti menjaga atau memelihara, tetapi di sini menyatakan memperhatikan dengan sungguh-sungguh dan berpegang pada koreksi. “Mengindahkan” menyampaikan fungsi kontekstual itu.
- source_word: תּוֹכַחַת
  choice: teguran
  rationale: Kata ini menunjuk pada koreksi atau kecaman secara verbal. “Teguran” merupakan padanan Indonesia yang wajar dan tetap membedakannya dari “didikan”.
- source_word: יְכֻבָּד
  choice: akan dihormati
  rationale: Bentuk pasif ini menyatakan bahwa seseorang menerima kehormatan atau penghargaan. “Akan dihormati” mempertahankan bentuk pasif dan akibat sosial yang dimaksud.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur antitetis amsal dipertahankan. “Didikan” dan “teguran” dipilih agar dua istilah Ibrani yang berkaitan tidak dilebur menjadi satu padanan, sedangkan “kehinaan” dan “dihormati” memperjelas kontras sosial tanpa menambahkan unsur teologis yang tidak dinyatakan teks.
