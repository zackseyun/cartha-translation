translation:
  language: id
  text: Orang benar membenci perkataan dusta,[a] tetapi orang fasik berbuat menjijikkan dan mendatangkan aib.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kebohongan.” Secara harfiah: “perkataan dusta.”'
    reason: lexical_alternative
  - marker: b
    text: Kedua kata kerja terakhir juga dapat dipahami sebagai “menjadi menjijikkan dan mendapat malu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר שֶׁקֶר
  choice: perkataan dusta
  rationale: Frasa konstruksi ini secara harfiah berarti 'perkataan dusta/kebohongan'. Pilihan ini mempertahankan bentuk konkret tunggal דְּבַר dan terdengar alami dalam bahasa Indonesia.
- source_word: יִשְׂנָא
  choice: membenci
  rationale: Padanan langsung dan wajar untuk bentuk Qal dari שׂנא, yang menyatakan penolakan moral yang kuat.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva maskulin tunggal yang dipakai secara substantival menunjuk tipe manusia dalam pepatah. 'Orang benar' adalah ungkapan Indonesia yang alami dan tidak memaksakan jenis kelamin biologis pada pemakaian representatif.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Substantiva maskulin tunggal yang berlawanan dengan צַדִּיק. 'Orang fasik' mempertahankan kesejajaran antitetis serta ragam hikmat yang bermartabat.
- source_word: יַבְאִישׁ
  choice: menjadi menjijikkan
  rationale: Bentuk Hifil dari באש berkaitan dengan menjadi atau membuat busuk, berbau, atau dibenci. Dalam konteks moral, 'menjadi menjijikkan' mempertahankan daya metaforis tanpa menghasilkan ungkapan Indonesia yang janggal.
- source_word: וְיַחְפִּיר
  choice: dan mendapat malu
  rationale: Bentuk ini dapat dipahami sebagai mengalami kehinaan atau bertindak/mendatangkan aib. 'Mendapat malu' menyajikan pembacaan intransitif yang wajar, sementara kemungkinan aktif dicatat dalam catatan kaki.
