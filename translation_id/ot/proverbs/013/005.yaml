  register: Bahasa Indonesia baku modern dengan gaya ringkas dan bermartabat khas sastra hikmat. Antitesis antara 'orang benar' dan 'orang fasik' dipertahankan. Ambiguitas dua kata kerja pada klausa kedua tidak dihapus, tetapi disajikan melalui catatan kaki.
