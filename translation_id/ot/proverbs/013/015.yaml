translation:
  language: id
  text: Akal budi yang baik mendatangkan perkenanan[a], tetapi jalan orang-orang khianat itu sukar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memberikan perkenanan”; dapat juga diterjemahkan, “Akal budi yang baik memperoleh perkenanan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “terjal” atau “keras.” Kata Ibrani yang diterjemahkan “sukar” juga dapat berarti “kukuh” atau “tetap”; maknanya dalam ayat ini diperdebatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׂכֶל טוֹב
  choice: akal budi yang baik
  rationale: Ungkapan ini menunjuk pada pengertian dan pertimbangan yang sehat dalam kehidupan praktis. “Akal budi yang baik” alami dalam bahasa Indonesia dan mempertahankan penekanan sastra hikmat.
- source_word: יִתֶּן
  choice: mendatangkan
  rationale: Secara harfiah berarti “memberikan”, tetapi dalam ungkapan ini menyatakan hasil yang ditimbulkan. “Mendatangkan” menyampaikan hubungan hasil secara alami tanpa mengubah maksudnya.
- source_word: חֵן
  choice: perkenanan
  rationale: Dalam konteks ini kata tersebut menunjuk pada penerimaan atau pandangan baik yang diterima seseorang, bukan secara khusus pada konsep teologis tentang anugerah.
- source_word: דֶרֶךְ
  choice: jalan
  rationale: Istilah baku dalam sastra hikmat untuk jalan hidup, perilaku, atau arah yang ditempuh seseorang; terjemahan harfiahnya juga wajar dalam bahasa Indonesia.
- source_word: בֹּגְדִים
  choice: orang-orang khianat
  rationale: Partisip ini menggambarkan orang yang bertindak tidak setia, curang, atau berkhianat. “Orang-orang khianat” ringkas dan sesuai dengan gaya pepatah.
- source_word: אֵיתָן
  choice: keras
  rationale: Dalam antitesis ayat ini, kata tersebut kemungkinan menggambarkan jalan yang berat, kasar, atau tidak mudah dilalui. “Keras” mempertahankan keluasan citra Ibraninya, sementara kemungkinan makna lain dicatat dalam catatan kaki.
