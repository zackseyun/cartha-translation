  text: A wicked messenger falls into trouble[b][a], but a faithful envoy brings healing.
translation:
  language: id
  text: Utusan yang jahat jatuh ke dalam kesulitan[a], tetapi duta[b] yang setia mendatangkan kesembuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “jatuh ke dalam kejahatan” atau “bahaya.” Frasa Ibrani ini dapat menunjuk pada keburukan, bahaya, atau kesusahan yang menimpanya.
    reason: lexical_alternative
  - marker: b
    text: Atau “utusan” atau “utusan resmi.” Bahasa Ibrani memakai dua kata yang berbeda untuk pembawa pesan dalam amsal ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָךְ
  choice: utusan
  rationale: Dalam konteks amsal sosial ini, kata tersebut menunjuk kepada manusia yang membawa pesan, bukan makhluk surgawi.
- source_word: רָשָׁע
  choice: yang jahat
  rationale: Ungkapan ini menggambarkan watak moral utusan tersebut dengan bahasa Indonesia yang lugas dan wajar.
- source_word: יִפֹּל
  choice: jatuh
  rationale: Bentuk yiqtol menyatakan kebenaran umum dalam gaya amsal; bentuk kini tanpa penanda waktu mempertahankan gambaran kejatuhan.
- source_word: בְּרָע
  choice: ke dalam malapetaka
  rationale: רָע di sini dapat menunjuk pada keburukan, bahaya, atau kesusahan yang menimpa; 'malapetaka' sesuai dengan akibat merusak yang dikontraskan dengan kesembuhan.
- source_word: צִיר
  choice: duta
  rationale: Kata ini dapat menunjuk kepada utusan resmi. 'Duta' membedakannya dari מַלְאָךְ sekaligus mempertahankan kesejajaran kedua jenis pembawa pesan.
- source_word: אֱמוּנִים
  choice: yang setia
  rationale: Bentuk ini menyatakan sifat dapat dipercaya atau kesetiaan; 'yang setia' ringkas dan alami.
- source_word: מַרְפֵּא
  choice: mendatangkan kesembuhan
  rationale: Nomina ini berarti kesembuhan atau pemulihan. Penambahan verba 'mendatangkan' membuat hubungan predikatif alami dalam bahasa Indonesia tanpa membatasi kesembuhan pada arti jasmani.
