  text: מִתְאַוָּ֣ה וָ֭/אַיִן נַפְשׁ֣/וֹ עָצֵ֑ל וְ/נֶ֖פֶשׁ חָרֻצִ֣ים תְּדֻשָּֽׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/004.yaml
  text: The sluggard craves[a], but has nothing; but the appetite of the diligent will be richly satisfied.
translation:
  language: id
  text: Si pemalas menginginkan sesuatu, tetapi tidak mendapat apa-apa; sedangkan hasrat orang rajin akan dipuaskan dengan berlimpah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “akan dibuat gemuk,” sebuah gambaran Ibrani tentang kelimpahan dan kepuasan penuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְאַוָּה
  choice: menginginkan sesuatu
  rationale: Bentuk Hitpael partisipel dari אוה menyatakan keinginan yang terus berlangsung. Penambahan objek tak tentu “sesuatu” membuat ungkapan ini alami dalam bahasa Indonesia tanpa menentukan apa yang diinginkan.
- source_word: וָאַיִן
  choice: tetapi tidak mendapat apa-apa
  rationale: Negasi eksistensial ini menunjukkan bahwa keinginan si pemalas tidak menghasilkan apa pun. Terjemahan ini menyampaikan maksud tersebut secara idiomatis.
- source_word: נַפְשׁוֹ
  choice: Si pemalas
  rationale: Dalam klausa pertama, נֶפֶשׁ menunjuk pada diri atau hasrat orang itu, bukan pada “jiwa” sebagai istilah teknis. Susunan idiomatis Indonesia memakai orangnya sebagai subjek.
- source_word: עָצֵל
  choice: si pemalas
  rationale: Istilah khas sastra hikmat untuk orang yang dicirikan oleh kemalasan. “Si pemalas” ringkas, jelas, dan sesuai dengan gaya peribahasa.
- source_word: וְנֶפֶשׁ
  choice: sedangkan hasrat
  rationale: Di sini נֶפֶשׁ menunjuk pada selera atau keinginan batin. “Hasrat” mempertahankan kesejajaran gagasan dengan keinginan pada klausa pertama tanpa memberi kesan antropologi teknis.
- source_word: חָרֻצִים
  choice: orang rajin
  rationale: Adjektiva jamak yang dipakai secara substantival merujuk kepada orang-orang yang tekun. Bentuk generik “orang rajin” alami dalam peribahasa Indonesia.
- source_word: תְּדֻשָּׁן
  choice: akan dipuaskan dengan berlimpah
  rationale: Bentuk Pual dari דשׁן secara harfiah menggambarkan keadaan “dibuat gemuk,” sebuah citra kelimpahan dan kepuasan penuh. Pilihan ini menyampaikan maknanya secara alami sambil mempertahankan unsur kelimpahan.
