id: PRO.13.22
reference: Proverbs 13:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: ט֗וֹב יַנְחִ֥יל בְּנֵֽי בָנִ֑ים וְ/צָפ֥וּן לַ֝/צַּדִּ֗יק חֵ֣יל חוֹטֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/022.yaml
  text: A good man leaves an inheritance to his grandchildren[b][a], but the wealth of a sinner is stored up for the righteous.
translation:
  language: id
  text: Orang baik meninggalkan warisan kepada cucu-cucunya,[a] tetapi kekayaan orang berdosa tersimpan bagi orang benar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak dari anak-anak.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tersembunyi” atau “dicadangkan bagi orang benar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: orang baik
  rationale: Adjektiva maskulin tunggal ini dipakai secara substantival untuk menyebut orang yang baik. Dalam bahasa Indonesia, “orang baik” alami dan tetap mempertahankan daya representatif pepatah tanpa membatasi maknanya hanya pada laki-laki.
- source_word: יַנְחִיל
  choice: meninggalkan warisan
  rationale: Bentuk Hifil dari נחל berarti menyebabkan seseorang mewarisi atau memberikan sebagai warisan. “Meninggalkan warisan” menyampaikan makna kausatif itu secara alami dalam konteks warisan antargenerasi.
- source_word: בְּנֵי בָנִים
  choice: cucu-cucunya
  rationale: Ungkapan harfiahnya “anak-anak dari anak-anak.” “Cucu-cucunya” merupakan padanan Indonesia yang ringkas dan jelas; sufiks posesif dipahami dari hubungan keluarga yang tersirat dalam pepatah.
- source_word: וְצָפוּן
  choice: tetapi ... tersimpan
  rationale: Bentuk pasif dari צפן dapat berarti disimpan, disembunyikan, atau dicadangkan. “Tersimpan” mempertahankan ketaksaan mengenai cara dan waktu kekayaan itu tersedia, sedangkan “tetapi” menyatakan pertentangan paralelisme secara alami.
- source_word: לַצַּדִּיק
  choice: bagi orang benar
  rationale: Preposisi ל menandai penerima atau pihak yang mendapat manfaat. “Orang benar” adalah ungkapan baku dan bermartabat untuk adjektiva substantival צַדִּיק.
- source_word: חֵיל
  choice: kekayaan
  rationale: Dalam konteks ini חֵיל menunjuk pada harta, sumber daya, atau kekayaan. “Kekayaan” paling jelas menghubungkan baris kedua dengan tema warisan pada baris pertama.
- source_word: חוֹטֵא
  choice: orang berdosa
  rationale: Partisipel substantival ini menggambarkan seseorang sebagai pelaku dosa secara representatif. “Orang berdosa” ringkas, alami, dan tidak menambahkan penilaian yang melampaui teks.
theological_decisions:
- issue: Jenis kelamin pada adjektiva substantival dalam pepatah
  choice: orang baik
  alternative: laki-laki yang baik
  rationale: Walaupun טוֹב berbentuk maskulin tunggal, bahasa Indonesia tidak menandai gender gramatikal pada “orang.” Terjemahan ini mempertahankan fungsi representatif pepatah dan tidak mempersempitnya secara tidak wajar menjadi khusus laki-laki.
- issue: Kepastian pemindahan kekayaan orang berdosa kepada orang benar
  choice: tersimpan bagi orang benar
  alternative: akan diberikan kepada orang benar
  rationale: Teks menyatakan keadaan “tersimpan/tercadang bagi,” tetapi tidak menjelaskan mekanisme atau waktu pemindahannya. Terjemahan tidak mengubahnya menjadi janji eksplisit tentang cara kekayaan itu kelak diberikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bercorak pepatah. Struktur antitetis dipertahankan dengan “tetapi.” Istilah “orang baik,” “orang berdosa,” dan “orang benar” mudah dipahami serta menjaga kesejajaran moral teks Ibrani.
