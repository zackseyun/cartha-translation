  text: רָב אֹ֭כֶל נִ֣יר רָאשִׁ֑ים וְ/יֵ֥שׁ נִ֝סְפֶּ֗ה בְּ/לֹ֣א מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/023.yaml
  text: The fallow ground of the poor[b][a] yields abundant food, but some are swept away for lack of justice.
translation:
  language: id
  text: Tanah garapan[a] orang miskin menghasilkan makanan berlimpah, tetapi ada yang binasa tanpa keadilan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah yang baru dibajak” atau “lahan yang dibiarkan tidak ditanami.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, baris kedua sangat ringkas: “tetapi ada yang binasa tanpa keadilan.” Subjeknya tidak disebutkan dalam bahasa Ibrani; “keadilan” juga dapat merujuk pada penghakiman atau keputusan hukum yang adil.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָב אֹכֶל
  choice: makanan berlimpah
  rationale: Ungkapan ini menyatakan banyaknya makanan atau hasil yang dapat dimakan; pilihan ini alami dalam bahasa Indonesia dan tidak membatasi maknanya pada jenis panen tertentu.
- source_word: נִיר
  choice: tanah garapan
  rationale: Kata ini menunjuk pada tanah yang dapat diolah, khususnya tanah yang baru dibajak atau sebelumnya dibiarkan tidak ditanami. “Tanah garapan” mempertahankan gambaran pertanian tanpa memaksakan satu keadaan lahan tertentu.
- source_word: רָאשִׁים
  choice: orang miskin
  rationale: Bentuk yang tidak lazim ini secara tradisional dipahami sebagai sebutan bagi orang miskin. Pilihan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וְיֵשׁ
  choice: tetapi ada yang
  rationale: Konstruksi eksistensial ini memperkenalkan keadaan yang berlawanan dengan kelimpahan pada baris pertama. “Ada yang” juga tidak menentukan secara eksplisit apakah yang dimaksud orang atau sesuatu.
- source_word: נִסְפֶּה
  choice: binasa
  rationale: Partisipel pasif ini dapat berarti disapu, dilenyapkan, atau binasa. “Binasa” mempertahankan akibat yang berat tanpa menentukan cara kehancurannya.
- source_word: בְּלֹא מִשְׁפָּט
  choice: karena tidak ada keadilan
  rationale: מִשְׁפָּט dapat berarti keadilan, keputusan hukum, atau tatanan yang benar. Dalam konteks ini, frasa tersebut paling wajar menyatakan ketiadaan keadilan sebagai penyebab kebinasaan.
theological_decisions:
- issue: Acuan pada baris kedua peribahasa
  choice: “Ada yang binasa” mempertahankan ungkapan Ibrani yang ringkas tanpa secara tegas menentukan subjeknya.
  alternative: 'Baris kedua dapat dipahami secara lebih impersonal: “ada sesuatu yang binasa tanpa keadilan,” atau sebagai pernyataan khusus tentang orang yang dirugikan oleh ketidakadilan.'
  rationale: Bahasa Ibraninya memakai konstruksi eksistensial dan partisipel tunggal tanpa menyebut subjek secara lengkap. Terjemahan tidak seharusnya menutup ambiguitas itu, meskipun מִשְׁפָּט dalam Kitab Amsal lazim memiliki bobot etis dan yudisial.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara “ada yang” mempertahankan kekompakan serta ketidakjelasan subjek dalam baris kedua.
