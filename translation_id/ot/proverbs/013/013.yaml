base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/013.yaml
  text: Whoever despises a word will be ruined by it[c][b][a], but he who fears the commandment will be rewarded.
translation:
  language: id
  text: Siapa meremehkan suatu perkataan[a] akan binasa karenanya[b], tetapi orang yang takut akan perintah dialah yang akan diberi ganjaran[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suatu perkara” atau “suatu hal.” Kata Ibrani דָבָר dapat berarti “perkataan,” “perkara,” atau “hal.”
    reason: lexical_alternative
  - marker: b
    text: Atau “akan menderita karenanya” atau “mendatangkan kebinasaan atas dirinya.” Ungkapan Ibrani ini menunjuk pada kerusakan, kerugian, atau kebinasaan yang menimpa orang tersebut.
    reason: lexical_alternative
  - marker: c
    text: Atau “akan diberi upah.” Secara lebih harfiah, kata Ibraninya berarti “akan dibalas” atau “akan diberi ganjaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז
  choice: meremehkan
  rationale: Partisipel ini menggambarkan sikap memandang rendah atau menghina. “Meremehkan” alami dalam bahasa Indonesia dan mempertahankan bobot moral ungkapan itu.
- source_word: לְדָבָר
  choice: suatu perkataan
  rationale: דָבָר dapat berarti “perkataan,” “perkara,” atau “hal.” “Suatu perkataan” mempertahankan bentuk leksikal dan keterbukaan pepatah tanpa membatasinya pada firman ilahi.
- source_word: יֵחָבֶל לוֹ
  choice: akan binasa karenanya
  rationale: Bentuk Nifal dari חבל di sini menunjuk pada mengalami kerusakan, kerugian, atau kebinasaan. Frasa “karenanya” menyatakan bahwa perkataan yang diremehkan menjadi sebab atau kesempatan kebinasaan itu, sambil menghindari penjelasan berlebihan.
- source_word: וִירֵא
  choice: orang yang takut
  rationale: Bentuk dari ירא menyatakan rasa takut yang mengandung hormat. “Takut” mempertahankan istilah Ibrani dan ketegangan khas sastra hikmat, alih-alih melunakkannya menjadi sekadar “menghormati” atau menafsirkannya sebagai “menaati.”
- source_word: מִצְוָה
  choice: perintah
  rationale: מִצְוָה paling langsung berarti “perintah” atau “ketetapan.” “Perintah” jelas dan alami serta tidak mempersempit pepatah ini menjadi rujukan yang secara khusus harus berarti satu perintah tertentu.
- source_word: הוּא
  choice: dialah
  rationale: Pronomina eksplisit הוּא memberi penekanan pada orang tersebut. “Dialah” mempertahankan penekanan ini dengan wajar dalam bahasa Indonesia.
- source_word: יְשֻׁלָּם
  choice: akan mendapat balasan
  rationale: Bentuk Pual dari שלם berarti diberi balasan atau ganjaran. Dalam konteks paralel ini balasannya positif, tetapi “mendapat balasan” tetap lebih luas daripada “diberkati” atau janji kemakmuran.
theological_decisions:
- issue: Apakah דָבָר harus dipahami secara khusus sebagai firman Allah
  choice: Mempertahankan arti terbuka dengan “suatu perkataan.”
  alternative: Menerjemahkan “firman” dan dengan demikian mengidentifikasinya secara khusus sebagai firman Allah.
  rationale: Teks Ibrani memakai kata luas דָבָר tanpa penanda eksplisit bahwa yang dimaksud khususnya firman Allah. Hubungannya dengan “perintah” pada baris kedua menunjukkan kewibawaan perkataan itu, tetapi tidak cukup untuk menutup ambiguitas leksikalnya.
- issue: Nuansa יְשֻׁלָּם sebagai balasan positif
  choice: Menerjemahkan “akan mendapat balasan.”
  alternative: Menerjemahkan secara lebih interpretatif “akan diberi upah” atau “akan diberkati.”
  rationale: Konteks mengarahkan pada ganjaran positif bagi orang yang takut akan perintah, tetapi istilah Ibrani pada dasarnya berarti dibalas atau diberi ganjaran. Terjemahan ini menjaga keluasan makna dan tidak memasukkan janji kemakmuran tertentu.
- issue: Rasa takut terhadap perintah
  choice: Mempertahankan “takut” tanpa mengubahnya menjadi sekadar ketaatan.
  alternative: Menerjemahkan “menaati perintah” atau “menghormati perintah.”
  rationale: Ketaatan mungkin tersirat sebagai hasil sikap tersebut, tetapi ירא secara langsung menyatakan takut atau gentar dengan unsur hormat. Terjemahan tidak boleh mengganti sikap batin itu dengan akibat praktisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada hikmat. Struktur dua bagian dipertahankan. “Dialah” mewakili penekanan pronomina Ibrani tanpa memakai bahasa bergender, karena bahasa Indonesia tidak menandai gender pada pronomina ini.
