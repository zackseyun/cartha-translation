  text: Whoever guards his mouth preserves his life[b][a]; whoever opens wide his lips comes to ruin.
translation:
  language: id
  text: Siapa menjaga mulutnya memelihara hidupnya[a], tetapi siapa membuka lebar bibirnya akan mengalami kehancuran.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hidupnya” (nefesh). Kata Ibrani ini juga dapat berarti “jiwanya” atau “dirinya”, tetapi di sini paling wajar menunjuk pada hidup seseorang.
    reason: lexical_alternative
  - marker: b
    text: Frasa Ibraninya ringkas dan juga dapat diterjemahkan “kehancuran menimpanya” atau “mendatangkan kehancuran atas dirinya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹצֵר
  choice: menjaga
  rationale: Partisip ini menyatakan tindakan menjaga atau mengawasi; "menjaga" alami dalam bahasa Indonesia dan mempertahankan gambaran pengendalian ucapan.
- source_word: פִּיו
  choice: mulutnya
  rationale: Padanan konkret bagi nomina dengan sufiks orang ketiga maskulin tunggal, sekaligus mempertahankan citra Ibrani.
- source_word: שֹׁמֵר
  choice: memelihara
  rationale: Verba ini pada dasarnya berarti menjaga; dalam hubungan dengan "hidupnya", "memelihara" menyampaikan hasil perlindungan tanpa menghilangkan hubungan leksikal dengan tindakan menjaga.
- source_word: נַפְשׁוֹ
  choice: hidupnya
  rationale: Dalam konteks hikmat ini, נֶפֶשׁ paling wajar menunjuk pada hidup atau diri seseorang, bukan secara khusus jiwa sebagai unsur tak berjasmani.
- source_word: פֹּשֵׂק
  choice: membuka lebar
  rationale: Pilihan ini mempertahankan metafora konkret tentang bibir yang dibuka lebar, yang menyiratkan ucapan tanpa kendali tanpa menggantinya dengan tafsiran eksplisit.
- source_word: שְׂפָתָיו
  choice: bibirnya
  rationale: Padanan harfiah ini mempertahankan kesejajaran puitis antara "mulut" dan "bibir".
- source_word: מְחִתָּה לוֹ
  choice: akan mengalami kehancuran
  rationale: Frasa Ibrani ini ringkas dan eliptis. Pilihan ini menyampaikan akibat buruk yang menimpa orang tersebut, sambil mempertahankan "kehancuran" sebagai nomina akibat.
