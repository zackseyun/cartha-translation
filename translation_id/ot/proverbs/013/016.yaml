source:
  edition: WLC
  text: כָּל עָ֭רוּם יַעֲשֶׂ֣ה בְ/דָ֑עַת וּ֝/כְסִ֗יל יִפְרֹ֥שׂ אִוֶּֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/016.yaml
  text: Every prudent man acts with knowledge[a], but a fool displays folly.
translation:
  language: id
  text: Setiap orang yang bijaksana bertindak berdasarkan pengetahuan, tetapi orang bodoh membeberkan[a] kebodohan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membentangkan” atau “menyingkapkan.” Kata kerja Ibrani ini menggambarkan tindakan membuat sesuatu terbuka atau terlihat.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Setiap
  rationale: 'Dipahami secara distributif sesuai gaya pepatah: setiap anggota kelompok memiliki ciri yang disebutkan.'
- source_word: עָרוּם
  choice: orang yang bijaksana
  rationale: Dalam konteks Amsal, kata ini menunjuk pada orang yang memiliki kecakapan praktis, kehati-hatian, dan pandangan ke depan; di sini nuansanya positif, bukan kelicikan.
- source_word: יַעֲשֶׂה
  choice: bertindak
  rationale: Kata kerja Ibrani ini luas maknanya; “bertindak” secara alami menyatakan perilaku yang menjadi kebiasaan dalam sebuah pepatah.
- source_word: בְדָעַת
  choice: berdasarkan pengetahuan
  rationale: 'Preposisi בְ dipahami sebagai dasar atau sarana tindakan: orang bijaksana bertindak dengan berpedoman pada apa yang diketahuinya.'
- source_word: וּכְסִיל
  choice: tetapi orang bodoh
  rationale: Walaupun וּ secara harfiah berarti “dan”, hubungan kedua bagian jelas bersifat kontras sehingga “tetapi” wajar dalam bahasa Indonesia.
- source_word: יִפְרֹשׂ
  choice: membeberkan
  rationale: Kata kerja ini secara konkret berarti membentangkan atau membuka sesuatu; dalam konteks ini orang bodoh membuat kebodohannya terbuka dan terlihat.
- source_word: אִוֶּלֶת
  choice: kebodohan
  rationale: Padanan langsung dan lazim bagi istilah abstrak dalam sastra hikmat ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan ringkas dengan kesejajaran antarklausa yang sesuai gaya pepatah. “Orang” mempertahankan daya berlaku umum dari bentuk maskulin tunggal Ibrani tanpa memberi batasan gender yang tidak diperlukan dalam bahasa sasaran.
