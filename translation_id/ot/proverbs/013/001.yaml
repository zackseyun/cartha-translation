  text: A wise son accepts a father's discipline[b][a], but a scoffer does not listen to rebuke.
translation:
  language: id
  text: Seorang putra yang bijak menerima didikan seorang ayah[a], tetapi seorang pencemooh[b] tidak mendengarkan teguran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga: “Seorang putra yang bijak mendengarkan didikan seorang ayah.” Dalam bahasa Ibrani, kata kerja pada klausa pertama tidak dinyatakan secara langsung; gagasan mendengar dapat mencakup menerima atau menaati.'
    reason: lexical_alternative
  - marker: b
    text: Atau “pengolok-olok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן
  choice: anak
  rationale: Kata benda ini berbentuk tunggal maskulin dan dalam gaya amsal menggambarkan seorang anak laki-laki sebagai contoh representatif. Dalam bahasa Indonesia, “anak” merupakan padanan alami yang tidak meniadakan hubungan anak dengan ayah.
- source_word: חָכָם
  choice: yang bijak
  rationale: Dalam sastra hikmat, kata ini menunjuk pada kebijaksanaan praktis dan ketajaman moral; “yang bijak” adalah ungkapan Indonesia yang alami.
- source_word: מוּסַר
  choice: didikan
  rationale: Dalam Amsal, kata ini mencakup pembentukan melalui pengajaran, koreksi, dan disiplin. “Didikan” paling alami dalam hubungan ayah dan anak serta lebih luas daripada sekadar informasi.
- source_word: אָב
  choice: seorang ayah
  rationale: Frasa konstruksi Ibrani tidak memakai akhiran posesif. Karena itu, “seorang ayah” mempertahankan ketidakspesifikan teks dan tidak menambahkan “ayahnya”.
- source_word: לֵץ
  choice: pencemooh
  rationale: Kata ini merupakan kategori moral dalam Amsal bagi orang yang dengan angkuh mencemooh dan menolak koreksi. “Pencemooh” mempertahankan sikap tersebut.
- source_word: שָׁמַע
  choice: menerima / tidak mendengarkan
  rationale: Kata kerja ini dapat berarti mendengar, mendengarkan, atau mengindahkan. Pada klausa pertama kata kerja tidak dinyatakan, tetapi makna menerima didikan tersirat; pada klausa kedua, “tidak mendengarkan” mempertahankan gambaran penolakan terhadap teguran.
- source_word: גְּעָרָה
  choice: teguran
  rationale: Kata benda ini menunjuk pada kecaman atau koreksi lisan. “Teguran” jelas, alami, dan sesuai dengan kontras terhadap didikan.
