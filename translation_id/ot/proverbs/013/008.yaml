  text: כֹּ֣פֶר נֶֽפֶשׁ אִ֣ישׁ עָשְׁר֑/וֹ וְ֝/רָ֗שׁ לֹא שָׁמַ֥ע גְּעָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/008.yaml
  text: A man's wealth is the ransom of his life[a], but a poor man does not hear a rebuke.
translation:
  language: id
  text: 'Kekayaan seseorang adalah tebusan bagi nyawanya,

    tetapi orang miskin tidak mendengar hardikan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ancaman” atau “teguran keras”. Maksud baris kedua mungkin bahwa orang miskin tidak menjadi sasaran pemerasan atau tuntutan uang tebusan karena ia tidak memiliki sesuatu untuk dibayarkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּפֶר
  choice: tebusan
  rationale: Kata ini menunjuk pada harga tebusan atau pembayaran untuk menghindarkan kerugian atau hukuman. “Tebusan” mempertahankan gambaran ekonomi dan hukum yang konkret.
- source_word: נֶפֶשׁ
  choice: nyawa
  rationale: Dalam konteks hikmat praktis ini, kata tersebut menunjuk pada hidup seseorang yang terancam, bukan secara khusus pada jiwa sebagai unsur tak berjasad.
- source_word: אִישׁ
  choice: seseorang
  rationale: Bentuk Ibrani adalah maskulin tunggal yang berfungsi secara representatif. “Seseorang” terdengar alami dalam pepatah Indonesia dan tidak membatasi maknanya pada laki-laki.
- source_word: עָשְׁרוֹ
  choice: kekayaan seseorang
  rationale: Nomina dengan akhiran posesif berarti “kekayaannya”. Susunan ini memperjelas acuan dalam bahasa Indonesia dan mempertahankan kontras dengan orang miskin.
- source_word: רָשׁ
  choice: orang miskin
  rationale: Kata ini berarti orang yang miskin atau berkekurangan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan bentuk tunggal dalam perbandingan antitetis.
- source_word: לֹא שָׁמַע
  choice: tidak mendengar
  rationale: Terjemahan harfiah ini mempertahankan citra Ibrani dan tidak menentukan apakah maksudnya tidak mengalami, tidak mengindahkan, atau tidak menjadi sasaran ucapan tersebut.
- source_word: גְּעָרָה
  choice: hardikan
  rationale: Kata ini berarti teguran keras atau hardikan dan dapat bernuansa ancaman. “Hardikan” mempertahankan daya keras ungkapan tanpa memasukkan tafsiran pemerasan langsung ke dalam teks.
theological_decisions:
- issue: Hubungan antara kekayaan, tebusan nyawa, dan keadaan orang miskin
  choice: Mempertahankan pernyataan ringkas dan kontras Ibrani tanpa menjelaskan mekanismenya di dalam teks utama.
  alternative: Menguraikan bahwa orang kaya dapat membayar tebusan sedangkan orang miskin tidak menjadi sasaran ancaman atau pemerasan.
  rationale: Teks Ibrani bersifat padat dan memungkinkan lebih dari satu nuansa. Penjelasan sosial yang mungkin ditempatkan dalam catatan agar ketegangan pepatah tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya pepatah yang ringkas dan bermartabat. “Nyawa” dipilih daripada “jiwa” untuk konteks bahaya dan tebusan; “hardikan” mempertahankan kekuatan גְּעָרָה serta ambiguitasnya.
