  text: Hope deferred makes the heart sick[a], but a desire fulfilled is a tree of life.
translation:
  language: id
  text: Harapan yang tertunda membuat hati sakit,[a] tetapi keinginan yang terpenuhi adalah pohon kehidupan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Harapan yang berkepanjangan adalah penyakit hati, dan keinginan yang datang adalah pohon kehidupan.”
    reason: alternatif leksikal
lexical_decisions:
- source_word: תּוֹחֶלֶת
  choice: harapan
  rationale: Nomina ini menunjuk pada penantian yang disertai harapan. “Harapan” alami dalam bahasa Indonesia dan sesuai dengan kontras terhadap keinginan yang terpenuhi.
- source_word: מְמֻשָּׁכָה
  choice: yang tertunda
  rationale: Secara harfiah berarti “yang ditarik panjang” atau “yang berkepanjangan.” “Yang tertunda” menyampaikan penantian yang berlangsung melampaui waktu yang diharapkan.
- source_word: מַחֲלָה לֵב
  choice: membuat hati sakit
  rationale: Bahasa Ibrani memakai klausa tanpa verba, secara harfiah “penyakit hati.” Bentuk verbal ini alami dalam bahasa Indonesia sambil mempertahankan metaforanya.
- source_word: וְעֵץ חַיִּים
  choice: tetapi ... pohon kehidupan
  rationale: Walaupun ו secara formal berarti “dan,” paralelisme antitetis mendukung “tetapi.” Ungkapan “pohon kehidupan” dipertahankan sebagai citra penting dalam Kitab Amsal.
- source_word: תַּאֲוָה
  choice: keinginan
  rationale: Kata ini dapat berarti keinginan atau kerinduan. “Keinginan” cukup luas dan netral untuk konteks hikmat ini.
- source_word: בָאָה
  choice: yang terpenuhi
  rationale: Secara harfiah berarti “yang datang” atau “telah datang.” Dalam konteks ini, yang dimaksud ialah keinginan yang mencapai kenyataan; “terpenuhi” mengungkapkannya secara idiomatis.
theological_decisions:
- issue: Pemaknaan kata penghubung ו sebelum עֵץ חַיִּים
  choice: tetapi
  alternative: dan
  rationale: Koordinasi sederhana dalam puisi hikmat Ibrani dapat menyatakan kontras. “Tetapi” memperjelas paralelisme antitetis tanpa mengubah makna.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, bermartabat, dan mudah dipahami. Struktur peribahasa serta metafora “hati” dan “pohon kehidupan” dipertahankan.
