  text: הלוך אֶת חֲכָמִ֣ים ו/חכם וְ/רֹעֶ֖ה כְסִילִ֣ים יֵרֽוֹעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/020.yaml
  text: Whoever walks with the wise will become wise[a], but a companion of fools will suffer harm.
translation:
  language: id
  text: 'Siapa bergaul dengan orang bijak akan menjadi bijak,

    tetapi siapa berteman dengan orang bodoh akan celaka.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָלוֹךְ אֶת חֲכָמִים
  choice: bergaul dengan orang bijak
  rationale: Ungkapan harfiah 'berjalan dengan' menggambarkan kebersamaan yang membentuk perilaku. Dalam bahasa Indonesia modern, 'bergaul dengan' menyampaikan hubungan berkelanjutan itu secara lebih alami.
- source_word: וַחֲכָם
  choice: akan menjadi bijak
  rationale: Bentuk ini menyatakan hasil dari pergaulan dengan orang bijak, bukan sekadar keadaan statis.
- source_word: וְרֹעֶה כְסִילִים
  choice: tetapi siapa berteman dengan orang bodoh
  rationale: Dalam konteks paralel ini, רעה berarti menyertai atau bergaul, bukan menggembalakan. 'Berteman dengan' alami dan mempertahankan kontras pergaulan.
- source_word: יֵרוֹעַ
  choice: akan celaka
  rationale: Bentuk nifal dari רעע menunjuk pada mengalami bahaya atau akibat buruk. 'Akan celaka' ringkas, lazim, dan tidak harus berarti kebinasaan total.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bernada pepatah. Paralelisme antara pergaulan dengan orang bijak dan orang bodoh dipertahankan; peralihan kontras dinyatakan dengan 'tetapi'.
