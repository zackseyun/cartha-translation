source:
  edition: WLC
  text: יֵ֣שׁ מִ֭תְעַשֵּׁר וְ/אֵ֣ין כֹּ֑ל מִ֝תְרוֹשֵׁ֗שׁ וְ/ה֣וֹן רָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/007.yaml
  text: There is one who pretends to be rich[a], yet has nothing; another pretends to be poor, yet has great wealth.
translation:
  language: id
  text: Ada orang yang berpura-pura kaya[a], padahal ia tidak memiliki apa-apa; ada pula yang berpura-pura miskin, padahal hartanya melimpah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ada orang yang menjadikan dirinya kaya, padahal ia tidak memiliki apa-apa; ada pula yang menjadikan dirinya miskin, padahal hartanya melimpah.” Kata kerja refleksif dalam bahasa Ibrani dapat menggambarkan penampilan diri ataupun tindakan benar-benar memperkaya atau memiskinkan diri. Teks utama memilih makna penampilan karena ironi tajam dalam amsal ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Ada orang yang
  rationale: Partikel eksistensial ini memperkenalkan pengamatan umum. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan corak amsal yang berlaku umum.
- source_word: מִתְעַשֵּׁר
  choice: berpura-pura kaya
  rationale: Bentuk Hitpael dari עשר dapat menunjuk pada tindakan menampilkan diri sebagai orang kaya atau menjadikan diri kaya. Kontras dengan tidak memiliki apa-apa mendukung makna penampilan diri dalam teks utama, tanpa meniadakan kemungkinan makna lainnya.
- source_word: וְאֵין כֹּל
  choice: padahal ia tidak memiliki apa-apa
  rationale: אֵין dengan כֹּל menyatakan ketiadaan mutlak. 'Padahal' mengungkapkan kontras tajam secara alami, sedangkan 'tidak memiliki apa-apa' mempertahankan kekuatan ungkapan Ibrani.
- source_word: מִתְרוֹשֵׁשׁ
  choice: berpura-pura miskin
  rationale: Bentuk refleksif ini dapat berarti menampilkan diri sebagai miskin atau menjadikan diri miskin. Dalam kesejajaran antitetis dengan מִתְעַשֵּׁר, makna penampilan diri paling sesuai untuk teks utama.
- source_word: וְהוֹן רָב
  choice: padahal hartanya melimpah
  rationale: הוֹן berarti harta atau kekayaan, sedangkan רָב berarti banyak atau berlimpah. Ungkapan ini ringkas, wajar, dan menyampaikan kelimpahan yang dimaksud.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan antitetis yang seimbang. 'Berpura-pura' mudah dipahami pembaca umum dan menonjolkan ironi, sementara catatan kaki mempertahankan ambiguitas leksikal bahasa Ibrani.
