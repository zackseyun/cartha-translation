  text: Whoever withholds his rod hates his son[b][a], but whoever loves him diligently seeks discipline.
translation:
  language: id
  text: Siapa yang menahan tongkatnya membenci putranya, tetapi siapa yang mengasihinya tekun mendisiplinkannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Ibrani yang diterjemahkan “tekun mendisiplinkannya” secara harfiah berhubungan dengan mencari sejak pagi. Dalam konteks ini ungkapan tersebut menekankan kesungguhan atau ketekunan dalam memberikan disiplin; juga dapat dipahami dengan nuansa mendisiplinkan sejak dini.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹשֵׂךְ
  choice: menahan
  rationale: Partisipel dari חשׂך menyatakan tindakan menahan atau tidak menggunakan sesuatu. “Menahan” mempertahankan daya ungkap aktif teks tanpa memberi kesan belas kasihan yang dapat muncul dari padanan seperti “menyayangkan”.
- source_word: שִׁבְטוֹ
  choice: tongkatnya
  rationale: שֵׁבֶט berarti tongkat, gada, atau lambang kekuasaan. Dalam konteks didikan keluarga, “tongkat” mempertahankan gambaran konkret Ibrani dan tidak mempersempit מוּסָר menjadi hukuman fisik semata.
- source_word: שׂוֹנֵא
  choice: membenci
  rationale: Kata kerja ini secara langsung berarti “membenci”. Ungkapan yang tajam dipertahankan karena merupakan bagian dari antitesis retoris amsal.
- source_word: בְנוֹ
  choice: anaknya
  rationale: בֵּן secara leksikal berarti “anak laki-laki/putra”, tetapi dalam bahasa Indonesia modern “anaknya” secara wajar dapat menunjuk anak laki-laki tanpa mengubah hubungan orang tua-anak yang menjadi pokok amsal. Padanan “putranya” dinilai lebih resmi dan kurang alami dalam kalimat ini.
- source_word: וְאֹהֲבוֹ
  choice: tetapi siapa yang mengasihinya
  rationale: Konjungsi diterjemahkan “tetapi” untuk menyatakan antitesis, sedangkan sufiks objek “-nya” tetap menunjuk kepada anak dalam klausa pertama.
- source_word: שִׁחֲרוֹ
  choice: dengan tekun mendisiplinkannya
  rationale: Bentuk piel שׁחר secara harfiah berkaitan dengan mencari sejak pagi atau sejak dini, lalu secara idiomatis menyatakan kesungguhan dan ketekunan. Dalam konstruksi bersama מוּסָר, terjemahan verbal ini menyampaikan bahwa orang tua sungguh-sungguh memberikan disiplin kepada anaknya.
- source_word: מוּסָר
  choice: mendisiplinkannya
  rationale: מוּסָר dalam Amsal mencakup didikan, koreksi, pembentukan moral, dan disiplin. “Mendisiplinkannya” alami dalam bahasa Indonesia dan tetap lebih luas daripada sekadar menghukum.
theological_decisions:
- issue: Apakah gambaran disiplin dengan tongkat perlu diperhalus
  choice: Mempertahankan kata konkret “tongkat” sekaligus menerjemahkan מוּסָר dengan istilah luas “mendisiplinkan”.
  alternative: Mengganti “tongkat” dengan “teguran”, “bimbingan”, atau “didikan”.
  rationale: Teks Ibrani secara eksplisit memakai שֵׁבֶט, sehingga gambaran konkretnya tidak boleh dihapus. Namun, מוּסָר mencakup pembentukan dan koreksi yang lebih luas daripada hukuman fisik; terjemahan tidak menentukan sendiri bagaimana gambaran itu harus diterapkan.
- issue: Kekuatan retoris kata “membenci”
  choice: Mempertahankan “membenci”.
  alternative: Melunakkannya menjadi “tidak menyayangi” atau “merugikan”.
  rationale: Amsal memakai antitesis tajam antara membenci dan mengasihi. Pelunakan akan mengurangi tekanan retoris teks dan menyelesaikan ketegangan yang sengaja dipertahankan oleh sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur antitesis serta gambaran konkret teks dipertahankan, sementara klausa kedua dibuat alami bagi pembaca umum. Penanda catatan kaki [a] dicantumkan dalam teks utama.
