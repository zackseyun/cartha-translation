translation:
  language: id
  text: Malapetaka mengejar orang-orang berdosa, tetapi kebaikan mengganjar orang-orang benar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָעָה
  choice: malapetaka
  rationale: Dalam paralelisme ini menunjuk pada keburukan yang menimpa atau bencana, bukan sekadar kejahatan moral; “malapetaka” mempertahankan daya konkret kalimat.
- source_word: תְּרַדֵּף
  choice: mengejar
  rationale: Menerjemahkan langsung gambaran personifikasi bahwa malapetaka memburu para pendosa.
- source_word: יְשַׁלֶּם
  choice: membalas
  rationale: Bentuk piel dari שלם dapat berarti membayar atau memberi balasan. “Membalas” mempertahankan gagasan ganjaran tanpa menambahkan pelaku yang tidak disebutkan.
- source_word: טוֹב
  choice: kebaikan
  rationale: Nomina/adjektiva substantival ini dibiarkan sebagai “kebaikan,” sehingga personifikasi dan ketidakjelasan mengenai apakah yang dimaksud ialah hal baik atau ganjaran baik tetap terpelihara.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Padanan Indonesia yang lazim bagi mereka yang hidup benar atau adil, tanpa mempersempitnya menjadi klaim kesempurnaan moral.
theological_decisions:
- issue: Pelaku dalam klausa kedua
  choice: 'Kebaikan menjadi subjek gramatikal: “kebaikan membalas orang-orang benar.”'
  alternative: “Orang-orang benar diberi ganjaran yang baik” atau “Allah mengganjar orang-orang benar dengan kebaikan.”
  rationale: Teks Ibrani menempatkan טוֹב sebagai subjek sesudah verba tunggal dan tidak menyebut Allah secara eksplisit. Terjemahan mempertahankan personifikasi serta tidak memasukkan pelaku ilahi yang tersirat tetapi tidak dinyatakan.
- issue: Sifat balasan bagi orang benar
  choice: “membalas”
  alternative: “memberi pahala” atau “mengganjar”
  rationale: “Membalas” mempertahankan nuansa pembayaran kembali dalam יְשַׁלֶּם dan ketegangan puitis dengan malapetaka yang mengejar para pendosa, tanpa memberi warna teknis-keagamaan tambahan.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada pepatah. Paralelisme serta personifikasi kedua klausa dipertahankan. Tidak ada penanda catatan kaki karena tidak diperlukan.
