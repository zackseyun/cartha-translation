source:
  edition: WLC
  text: אוֹר צַדִּיקִ֥ים יִשְׂמָ֑ח וְ/נֵ֖ר רְשָׁעִ֣ים יִדְעָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/009.yaml
  text: The light of the righteous rejoices[a], but the lamp of the wicked goes out.
translation:
  language: id
  text: 'Terang orang benar bersukacita,[a]

    tetapi pelita orang fasik akan padam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bergembira.” Kata kerja Ibrani ini biasanya berarti “bersukacita” atau “bergembira”; karena subjeknya adalah “terang”, sebagian orang memahaminya menurut konteks sebagai “bersinar terang”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: terang
  rationale: Kata ini lazim berarti 'terang' atau 'cahaya'. 'Terang' terdengar alami sebagai keadaan yang bercahaya dan mempertahankan kesejajaran puitis dengan 'pelita' pada baris kedua.
- source_word: צַדִּיקִים
  choice: orang benar
  rationale: Adjektiva jamak ini dipakai sebagai nomina kolektif. 'Orang benar' merupakan ungkapan ringkas dan mapan dalam sastra hikmat.
- source_word: יִשְׂמָח
  choice: bersukacita
  rationale: Bentuk dari שׂמח pada dasarnya berarti 'bersukacita' atau 'bergembira'. Pilihan ini mempertahankan personifikasi terang dalam bahasa Ibrani dan tidak diam-diam mengubah artinya menjadi 'bersinar terang'.
- source_word: נֵר
  choice: pelita
  rationale: Kata ini menunjuk pada lampu, biasanya lampu minyak, bukan secara khusus lilin. 'Pelita' mempertahankan citra dunia kuno dan kontras puitis dengan 'terang'.
- source_word: רְשָׁעִים
  choice: orang fasik
  rationale: Adjektiva jamak yang dipakai sebagai nomina kolektif ini menunjuk kepada mereka yang jahat secara moral. 'Orang fasik' ringkas, bermartabat, dan lazim dalam konteks sastra hikmat.
- source_word: יִדְעָךְ
  choice: akan padam
  rationale: Verba ini berarti padam atau dipadamkan, khususnya tentang pelita. 'Akan padam' alami dalam bahasa Indonesia dan tidak menentukan adanya pelaku yang memadamkannya.
- source_word: וְ
  choice: tetapi
  rationale: Walaupun bentuk dasarnya berarti 'dan', di sini kata penghubung tersebut menyatukan dua baris puisi yang berlawanan; 'tetapi' menyampaikan hubungan antitetis itu secara alami.
