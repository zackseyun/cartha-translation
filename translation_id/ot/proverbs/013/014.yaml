  text: תּוֹרַ֣ת חָ֭כָם מְק֣וֹר חַיִּ֑ים לָ֝/ס֗וּר מִ/מֹּ֥קְשֵׁי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/014.yaml
  text: The instruction of a wise man is a fountain of life[b][a], to turn one away from the snares of death.
translation:
  language: id
  text: Ajaran orang bijak adalah mata air kehidupan, yang membuat orang menjauh dari jerat-jerat maut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ajaran orang bijak adalah mata air kehidupan, untuk menjauh dari jerat-jerat maut.”'
    reason: Alternatif ini mempertahankan konstruksi infinitif Ibrani secara lebih langsung dan membiarkan subjek tersirat tetap terbuka.
lexical_decisions:
- source_word: תּוֹרַת
  choice: Ajaran
  rationale: Dalam sastra hikmat, תּוֹרָה menunjuk pada ajaran atau tuntunan, bukan secara khusus pada hukum tertulis. “Ajaran” alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: חָכָם
  choice: orang bijak
  rationale: חָכָם berbentuk tunggal dan menunjuk kepada pribadi yang bijaksana. “Orang bijak” mempertahankan ketunggalan tanpa menambahkan penandaan gender yang tidak perlu dalam bahasa Indonesia.
- source_word: מְקוֹר חַיִּים
  choice: mata air kehidupan
  rationale: מְקוֹר menunjuk pada sumber air atau mata air. Ungkapan “mata air kehidupan” mempertahankan citra puitis tentang sumber yang memberi hidup.
- source_word: לָסוּר
  choice: yang membuat orang menjauh
  rationale: Infinitif ini dapat menyatakan tujuan atau hasil. Rumusan ini menghubungkan ajaran dengan dampaknya secara alami, tanpa menentukan apakah subjek tersiratnya adalah sang bijak atau penerima ajaran.
- source_word: מִמֹּקְשֵׁי מָוֶת
  choice: dari jerat-jerat maut
  rationale: Bentuk jamak מֹקְשֵׁי dipertahankan dengan “jerat-jerat”; “maut” sesuai dengan register puitis dan metafora bahaya yang membawa kepada kematian.
theological_decisions:
- issue: Hubungan sintaksis לָסוּר dengan klausa pertama
  choice: “yang membuat orang menjauh” sebagai akibat atau fungsi ajaran
  alternative: “untuk menjauh dari” sebagai tujuan yang dapat dipahami merujuk kepada penerima ajaran
  rationale: Bahasa Ibrani tidak menyebutkan objek eksplisit setelah infinitif dan memungkinkan nuansa tujuan atau hasil. Terjemahan utama dibuat alami sambil tidak memasukkan pelaku tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat dengan citra hikmat yang puitis. Tanda catatan kaki [a] ditempatkan setelah seluruh kalimat karena catatan menjelaskan hubungan sintaksis pada bagian akhirnya.
