  text: Even one who is slack in his work is brother to a master of destruction[a].
translation:
  language: id
  text: Orang yang lalai dalam pekerjaannya pun adalah saudara seorang perusak[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “saudara bagi orang yang dicirikan oleh kehancuran.” Ungkapan Ibrani ini dapat menunjuk pada seorang perusak atau pada orang yang terkait dengan kehancuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: pun
  rationale: Partikel ini memberi tekanan sekaligus menambahkan perbandingan yang mengejutkan; penempatan “pun” setelah subjek terdengar alami dalam bahasa Indonesia.
- source_word: מִתְרַפֶּה
  choice: orang yang lalai
  rationale: Bentuk partisipel Hitpael dari רפה menggambarkan orang yang membiarkan dirinya mengendur dalam tanggung jawab. “Lalai” menyampaikan kelengahan atau ketidakseriusan, bukan sekadar ketidakmampuan.
- source_word: בִמְלַאכְתּוֹ
  choice: dalam pekerjaannya
  rationale: מְלָאכָה menunjuk pada pekerjaan atau tugas; frasa ini mempertahankan ranah tempat kelalaian itu terjadi.
- source_word: אָח הוּא
  choice: adalah saudara bagi
  rationale: Metafora kekerabatan dipertahankan untuk menyatakan kedekatan sifat atau kesamaan moral, tanpa meratakannya menjadi sekadar “sama seperti”.
- source_word: לְבַעַל מַשְׁחִית
  choice: bagi orang yang mendatangkan kehancuran
  rationale: Ungkapan ini menunjuk pada pribadi yang dicirikan oleh tindakan merusak atau kehancuran. Pilihan utama menyampaikan akibat aktifnya secara alami, sementara catatan kaki mempertahankan kemungkinan terjemahan yang lebih ringkas.
