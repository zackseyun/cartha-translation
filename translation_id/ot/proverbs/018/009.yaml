translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Metafora “saudara” dipertahankan karena menjadi inti perbandingan tajam dalam amsal ini; “lalai” dipilih daripada “malas” agar cakupan maknanya tidak dipersempit.
