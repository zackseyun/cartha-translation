translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. "Orang bebal" mempertahankan corak khas sastra hikmat, sedangkan "mendatangkan" dan "mengundang" membuat hubungan sebab-akibat kedua baris terdengar alami. Penanda catatan kaki [a] tercantum dalam teks utama.
