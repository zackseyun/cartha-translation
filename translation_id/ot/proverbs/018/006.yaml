  yaml_path: translation/ot/proverbs/018/006.yaml
  text: A fool’s lips enter into strife[b][a], and his mouth calls for blows.
translation:
  language: id
  text: 'Bibir orang bebal terlibat dalam pertengkaran,

    dan mulutnya mengundang pukulan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mulutnya memanggil pukulan.” Baris pertama juga dapat diterjemahkan: “Bibir orang bebal masuk ke dalam pertengkaran.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי
  choice: bibir
  rationale: Mempertahankan metonimia Ibrani yang hidup bagi perkataan serta kesejajarannya dengan "mulut" pada baris kedua.
- source_word: כְסִיל
  choice: orang bebal
  rationale: Istilah baku dan bermartabat dalam sastra hikmat untuk orang yang bodoh secara moral dan perilaku, bukan sekadar kurang cerdas.
- source_word: יָבֹאוּ בְרִיב
  choice: mendatangkan pertengkaran
  rationale: Secara harfiah konstruksi ini dapat berarti "masuk ke dalam pertengkaran", tetapi dalam bahasa Indonesia ungkapan tersebut kaku. "Mendatangkan pertengkaran" menyampaikan bahwa perkataan orang bebal membawa dirinya ke dalam konflik, sekaligus selaras dengan akibat pada baris kedua.
- source_word: פִיו
  choice: mulutnya
  rationale: Mempertahankan gambaran jasmani dan paralelisme puitis dengan "bibir".
- source_word: לְמַהֲלֻמוֹת
  choice: pukulan
  rationale: Kata ini menunjuk pada tindakan atau hantaman yang diterima; "pukulan" ringkas dan alami dalam bahasa Indonesia.
- source_word: יִקְרָא
  choice: mengundang
  rationale: Dalam konteks ini verba "memanggil" menyatakan bahwa perkataannya memancing atau mendatangkan pukulan; "mengundang" merupakan padanan idiomatis tanpa menjadikan akibat itu terlalu pasti.
