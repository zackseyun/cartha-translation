  text: He who finds a wife finds a good thing and obtains favor from Yahweh[a].
translation:
  language: id
  text: Siapa yang mendapat istri mendapat hal yang baik dan memperoleh perkenanan dari Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Orang yang mendapat istri mendapat hal yang baik dan memperoleh perkenanan dari Yahweh.” Bahasa Ibrani menggunakan bentuk maskulin tunggal dalam pengertian peribahasa yang mewakili.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָא
  choice: mendapat
  rationale: Bentuk perfektum Qal dipakai secara gnomic untuk menyatakan kebenaran umum. Dalam konteks memperoleh istri dan hal yang baik, “mendapat” lebih alami daripada “menemukan” dan memungkinkan pengulangan kata Ibrani tetap terdengar.
- source_word: אִשָּׁה
  choice: istri
  rationale: Dalam kolokasi hikmat ini, אִשָּׁה menunjuk kepada perempuan dalam hubungan pernikahan, bukan sekadar perempuan secara umum.
- source_word: טוֹב
  choice: sesuatu yang baik
  rationale: Kata sifat טוֹב berfungsi secara substantival. Ungkapan ini alami dalam bahasa Indonesia dan tidak mempersempit kebaikan yang dimaksud.
- source_word: וַיָּפֶק
  choice: memperoleh
  rationale: Dalam konteks ini verba tersebut berarti mendapatkan atau memperoleh; “memperoleh” sesuai dengan objek abstrak “perkenanan” dan menjaga kesejajaran dengan “mendapat” tanpa terdengar janggal.
- source_word: רָצוֹן
  choice: perkenanan
  rationale: Ketika berhubungan dengan Yahweh, רָצוֹן menyatakan penerimaan, kehendak baik, atau perkenanan. “Perkenanan” mempertahankan nuansa relasional tanpa menambahkan gagasan denominasi tertentu.
- source_word: מֵיְהוָה
  choice: dari Yahweh
  rationale: Preposisi מִן berarti “dari”, sedangkan nama ilahi יהוה ditransliterasikan sebagai “Yahweh” untuk mempertahankan nama perjanjian yang tampil dalam teks.
- source_word: subjek tersirat dari מָצָא
  choice: Siapa
  rationale: Bahasa Ibrani memakai bentuk maskulin tunggal secara representatif dalam pepatah. “Siapa” merupakan bentuk peribahasa yang alami dalam bahasa Indonesia; konteks “mendapat istri” tetap mencerminkan sudut pandang laki-laki dalam teks.
theological_decisions:
- issue: Subjek maskulin generik dalam pepatah
  choice: Siapa mendapat istri
  alternative: Orang yang mendapat istri
  rationale: Bahasa Indonesia tidak menandai gender pada pronomina relatif seperti bahasa Ibrani. “Siapa” menyampaikan daya umum pepatah secara alami tanpa menghapus sudut pandang laki-laki yang sudah nyata dari objek “istri”.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama ilahi dan membedakannya dari gelar umum untuk Tuhan.
- issue: Sifat kebaikan dan perkenanan dalam pernikahan
  choice: Pernyataan pepatah dipertahankan tanpa dijadikan janji mutlak
  alternative: Menjelaskan bahwa setiap pernikahan pasti menjamin keadaan baik
  rationale: Bentuknya adalah maksim sastra hikmat. Terjemahan tidak menambahkan pembatasan ataupun mengubahnya menjadi jaminan teologis yang lebih mutlak daripada bentuk pepatah sumber.
translation_notes:
  register: Bahasa dibuat ringkas, bermartabat, dan mudah dipahami. Pengulangan “mendapat ... mendapat” sengaja dipertahankan untuk mencerminkan pengulangan מָצָא dalam teks Ibrani. Ejaan modern “istri” digunakan.
