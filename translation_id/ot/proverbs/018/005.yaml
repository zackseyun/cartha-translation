  text: To show partiality to the wicked is not good[b][a], nor to deprive the righteous of justice.
translation:
  language: id
  text: Tidak baik memihak kepada orang fasik[a] atau merampas keadilan dari orang benar dalam peradilan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “mengangkat wajah orang fasik,” sebuah ungkapan yang berarti menunjukkan keberpihakan atau pilih kasih kepadanya.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menyimpangkan orang benar dalam peradilan”; maksudnya, membelokkan proses hukum sehingga merugikannya.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂאֵת פְּנֵי
  choice: memihak kepada
  rationale: Ungkapan ini secara harfiah berarti 'mengangkat wajah' dan dalam konteks hukum berarti memperlakukan seseorang dengan pilih kasih. 'Memihak kepada' menyampaikan makna idiomatisnya secara alami dalam bahasa Indonesia.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Adjektiva tunggal ini dipakai sebagai nomina. 'Orang fasik' mempertahankan kategori moralnya tanpa membatasinya pada arti hukum 'orang bersalah'.
- source_word: לֹא טוֹב
  choice: tidak baik
  rationale: Terjemahan langsung ini mempertahankan penilaian ringkas dalam bahasa Ibrani.
- source_word: לְהַטּוֹת
  choice: menyimpangkan
  rationale: Verba ini berarti membelokkan atau menyimpangkan. Dalam konteks peradilan, kata ini menggambarkan tindakan membelokkan keputusan sehingga merugikan orang yang benar, tanpa menentukan lebih jauh cara pelaksanaannya.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Istilah ini dapat menunjuk kepada orang yang benar secara moral atau pihak yang berada di pihak benar dalam perkara. 'Orang benar' mempertahankan keluasan makna moral-hukumnya.
- source_word: בַּמִּשְׁפָּט
  choice: dalam pengadilan
  rationale: Frasa ini menempatkan tindakan tersebut dalam ranah keputusan atau proses hukum. 'Dalam pengadilan' alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
