  text: מֵשִׁ֣יב דָּ֭בָר בְּ/טֶ֣רֶם יִשְׁמָ֑ע אִוֶּ֥לֶת הִיא ל֝֗/וֹ וּ/כְלִמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/013.yaml
  text: He who answers a matter before he hears it[a], it is folly and shame to him.
translation:
  language: id
  text: Orang yang menjawab suatu perkara sebelum mendengarnya—itu adalah kebodohan dan kehinaan baginya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Orang yang menjawab suatu perkataan atau kasus sebelum mendengarnya.” Kata Ibrani דָּבָר dapat berarti “perkataan,” “perkara,” atau “kasus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵשִׁיב
  choice: menjawab
  rationale: Bentuk partisip Hifil dari שוב di sini digunakan secara idiomatis dengan arti 'menjawab' atau 'menanggapi'.
- source_word: דָּבָר
  choice: suatu perkara
  rationale: דָּבָר memiliki cakupan arti yang luas, termasuk perkataan, hal, dan perkara. Dalam konteks mendengar sebelum menjawab, 'perkara' terdengar alami dan tetap mencakup pokok pembicaraan atau kasus yang sedang dipertimbangkan.
- source_word: בְּטֶרֶם
  choice: sebelum
  rationale: Padanan temporal yang langsung, jelas, dan alami dalam bahasa Indonesia.
- source_word: יִשְׁמָע
  choice: mendengarnya
  rationale: שמע dapat berarti mendengar atau menyimak. Bentuk ini mempertahankan tindakan menerima perkara yang dimaksud sebelum memberikan jawaban; akhiran '-nya' mengacu pada perkara tersebut.
- source_word: אִוֶּלֶת
  choice: kebodohan
  rationale: Istilah hikmat ini menunjuk bukan hanya kurangnya pengetahuan, tetapi sikap dan tindakan yang bodoh; 'kebodohan' merupakan padanan baku dan mudah dipahami.
- source_word: הִיא
  choice: itu adalah
  rationale: Klausa ini menunjuk kembali pada tindakan menjawab sebelum mendengar dan mempertahankan struktur penilaian tegas dalam bahasa Ibrani.
- source_word: לוֹ
  choice: baginya
  rationale: Preposisi ל menandai orang yang menanggung akibat atau penilaian tersebut; 'baginya' alami dalam pepatah Indonesia.
- source_word: וּכְלִמָּה
  choice: dan kehinaan
  rationale: כְּלִמָּה dapat berarti rasa malu, aib, atau kehinaan. 'Kehinaan' menjaga kesejajaran nominal dengan 'kebodohan' dan menekankan keadaan tercela yang menimpa orang itu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada pepatah. Bentuk 'orang yang' dipilih karena alami dan inklusif dalam bahasa Indonesia. Tanda pisah mempertahankan jeda serta penekanan antara tindakan dan penilaiannya. Penanda catatan kaki [a] ditempatkan setelah keseluruhan ayat karena menjelaskan keluasan makna 'suatu perkara' dalam klausa pertama.
