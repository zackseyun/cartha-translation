  text: לֵ֣ב נָ֭בוֹן יִקְנֶה דָּ֑עַת וְ/אֹ֥זֶן חֲ֝כָמִ֗ים תְּבַקֶּשׁ דָּֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/015.yaml
  text: An understanding heart acquires knowledge[b][a], and the ear of the wise seeks knowledge.
translation:
  language: id
  text: 'Hati yang berpengertian[a] memperoleh pengetahuan,

    dan telinga orang-orang bijak[b] mencari pengetahuan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Hati yang mampu membedakan memperoleh pengetahuan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “telinga orang-orang bijak.” Kata “telinga” berbentuk tunggal dan dipakai sebagai ungkapan kolektif/metaforis untuk kesiapan menerima pengajaran.
    reason: cultural_note
lexical_decisions:
- source_word: לֵב
  choice: hati
  rationale: Dalam sastra hikmat Ibrani, kata ini menunjuk pada pusat batin untuk berpikir, mempertimbangkan, dan berkehendak, bukan hanya perasaan. “Hati” mempertahankan metafora Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: נָבוֹן
  choice: yang berpengertian
  rationale: Kata ini menggambarkan kemampuan memahami dan membedakan dengan tepat. Ungkapan “hati yang berpengertian” mempertahankan hubungan atributif dengan “hati” serta nuansa daya pengamatan.
- source_word: יִקְנֶה
  choice: memperoleh
  rationale: Kata kerja קנה dapat berarti membeli, mendapatkan, atau memperoleh. Dalam konteks mengejar hikmat, “memperoleh” menyatakan pencapaian yang disengaja tanpa memberi kesan perdagangan.
- source_word: דָּעַת
  choice: pengetahuan
  rationale: Dalam Amsal, דַּעַת lazimnya mengacu pada pengetahuan yang mencakup pemahaman. Pengulangan “pengetahuan” pada kedua baris dipertahankan sebagai unsur paralelisme.
- source_word: אֹזֶן
  choice: telinga
  rationale: Bentuk tunggal ini merupakan gambaran anggota tubuh yang secara metaforis menyatakan kesiapan menerima pengajaran. Terjemahan harfiah mempertahankan citra dan paralelismenya dengan “hati”.
- source_word: חֲכָמִים
  choice: orang-orang bijak
  rationale: Bentuk jamak maskulin di sini bersifat umum dan tidak perlu dibatasi pada laki-laki. “Orang-orang bijak” mempertahankan makna jamak serta cakupan generiknya.
- source_word: תְּבַקֶּשׁ
  choice: mencari
  rationale: Bentuk piel dari בקש menyatakan tindakan aktif mencari. “Mencari” ringkas, alami, dan sejajar dengan “memperoleh” pada baris pertama.
