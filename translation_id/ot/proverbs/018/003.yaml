  text: בְּֽ/בוֹא רָ֭שָׁע בָּ֣א גַם בּ֑וּז וְֽ/עִם קָל֥וֹן חֶרְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/003.yaml
  text: When wickedness comes[a], contempt also comes, and with dishonor comes reproach.
translation:
  language: id
  text: Ketika orang fasik datang, penghinaan pun datang; dan bersama kehinaan datanglah celaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבוֹא רָשָׁע
  choice: Ketika orang fasik datang
  rationale: Preposisi ב dengan infinitif konstruktus בוא menyatakan keadaan waktu. רָשָׁע adalah bentuk tunggal maskulin yang dipakai secara substantival untuk orang yang fasik, bukan kata benda abstrak “kefasikan”.
- source_word: בָּא גַם בּוּז
  choice: penghinaan pun datang
  rationale: Kata kerja בוא diulangi dalam bahasa Ibrani; “datang” mempertahankan pengulangan itu. גַם diterjemahkan “pun” sebagai penanda tambahan yang ringkas, sedangkan בּוּז menyatakan penghinaan atau sikap meremehkan.
- source_word: קָלוֹן
  choice: kehinaan
  rationale: Kata ini menunjuk pada aib, rasa malu, atau keadaan tidak terhormat. “Kehinaan” mempertahankan bentuk abstrak dan membedakannya dari חֶרְפָּה.
- source_word: חֶרְפָּה
  choice: celaan
  rationale: Kata ini dapat berarti celaan, cercaan, atau aib yang ditimpakan kepada seseorang. “Celaan” menonjolkan segi publik dan relasionalnya serta membentuk pasangan alami dengan “kehinaan”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada amsal. Struktur paralel serta pengulangan kata “datang” dipertahankan tanpa mengabstrakkan רָשָׁע menjadi “kefasikan”.
