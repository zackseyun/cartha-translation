  text: צַדִּ֣יק הָ/רִאשׁ֣וֹן בְּ/רִיב֑/וֹ יבא רֵ֝עֵ֗/הוּ וַ/חֲקָרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/017.yaml
  text: The first to present his case seems right[a], until his neighbor comes and examines him.
translation:
  language: id
  text: Orang yang pertama mengajukan perkaranya tampak benar[a], sampai pihak yang lain datang dan memeriksanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Orang pertama dalam perselisihannya berada di pihak yang benar, sampai sesamanya datang dan memeriksanya.”'
    reason: Bahasa Ibrani secara harfiah dapat menyatakan bahwa orang pertama ‘benar’ atau ‘adil’; dalam konteks ini, maksudnya mungkin bahwa ia baru tampak benar sebelum keterangannya diuji. רֵעֵהוּ juga dapat diterjemahkan ‘sesamanya’ atau ‘rekannya’.
lexical_decisions:
- source_word: צַדִּיק
  choice: tampak benar
  rationale: Dalam konteks perselisihan atau perkara, kata ini menyatakan bahwa pihak pertama tampak berada di pihak yang benar. Kata “tampak” menyampaikan sifat sementara dari penilaian awal yang kemudian diuji oleh pemeriksaan pihak lain.
- source_word: הָרִאשׁוֹן
  choice: Orang yang pertama
  rationale: Menunjuk pada pihak yang lebih dahulu berbicara atau tampil dalam suatu perselisihan, tanpa membatasi konteksnya pada persidangan resmi.
- source_word: בְּרִיבוֹ
  choice: mengajukan perkaranya
  rationale: רִיב dapat berarti perselisihan, pertikaian, atau perkara hukum. Ungkapan ini secara alami menyampaikan tindakan pihak pertama dalam memaparkan kasusnya.
- source_word: יבא
  choice: datang
  rationale: Mempertahankan arti dasar verba ‘datang’ dan gerak pihak kedua memasuki pembicaraan.
- source_word: רֵעֵהוּ
  choice: pihak yang lain
  rationale: Secara harfiah dapat berarti sesama, rekan, atau tetangga, tetapi dalam konteks perselisihan kata ini menunjuk pada orang lain yang terkait dengan perkara. Pilihan ini menghindari kesan bahwa orang tersebut pasti sahabat atau tetangga tempat tinggal.
- source_word: וַחֲקָרוֹ
  choice: dan memeriksanya
  rationale: חקר berarti menyelidiki, meneliti, atau memeriksa dengan saksama. ‘Memeriksanya’ cukup luas untuk mencakup pengujian terhadap orang pertama maupun keterangannya tanpa memakai istilah hukum yang terlalu teknis.
