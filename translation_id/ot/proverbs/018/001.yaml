  yaml_path: translation/ot/proverbs/018/001.yaml
  text: Whoever isolates himself seeks his own desire[b][a]; he breaks out against all sound judgment.
translation:
  language: id
  text: 'Orang yang mengasingkan diri mengejar keinginannya sendiri;

    ia menentang segala pertimbangan yang sehat.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baris kedua dalam bahasa Ibrani sulit, khususnya verba langka yang diterjemahkan “menentang”. Terjemahan lain: “Orang yang memisahkan diri mencari keinginan; ia bertengkar dengan segala hikmat yang sehat.” “Pertimbangan yang sehat” juga dapat diterjemahkan “hikmat yang sehat” atau “akal sehat”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְתַאֲוָה
  choice: keinginannya sendiri
  rationale: Kata תַּאֲוָה berarti keinginan, hasrat, atau keinginan kuat. Dengan לְ dalam ungkapan padat ini, frasa tersebut menunjukkan tujuan atau dorongan. Kata “sendiri” menyatakan rujukan diri yang tersirat tanpa mempersempitnya menjadi jenis hasrat tertentu.
- source_word: יְבַקֵּשׁ
  choice: mengejar
  rationale: Bentuk piel dari בקש berarti mencari atau mengejar. “Mengejar” secara alami menyampaikan usaha yang digerakkan oleh keinginan dalam konteks ini.
- source_word: נִפְרָד
  choice: orang yang mengasingkan diri
  rationale: Partisipel nifal dari פרד menunjuk kepada orang yang terpisah atau memisahkan diri. Terjemahan ini mempertahankan sifat generik pepatah serta nuansa tindakan menjauh dari persekutuan dan nasihat.
- source_word: בְּכָל
  choice: segala
  rationale: Preposisi בְ terkait erat dengan verba yang sulit pada baris kedua. Dalam terjemahan utama, hubungan adversatif dinyatakan oleh verba “menentang”, sementara כָל diterjemahkan “segala”.
- source_word: תּוּשִׁיָּה
  choice: pertimbangan yang sehat
  rationale: Dalam sastra hikmat, תּוּשִׁיָּה dapat berarti hikmat yang mantap, akal sehat, atau kebijaksanaan praktis yang efektif. “Pertimbangan yang sehat” sesuai dengan konteks sosial-etis dan mudah dipahami.
- source_word: יִתְגַּלָּע
  choice: menentang
  rationale: Verba hitpael yang langka ini sangat sulit dipastikan maknanya. “Menentang” menyampaikan arah permusuhan atau pertikaian dalam konteks tanpa memasukkan gambaran etimologis yang belum pasti; ketidakpastiannya dicatat dalam catatan kaki.
