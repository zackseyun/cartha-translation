source:
  edition: WLC
  text: אָ֗ח נִפְשָׁ֥ע מִ/קִּרְיַת עֹ֑ז ו/מדונים כִּ/בְרִ֥יחַ אַרְמֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/019.yaml
  text: A brother offended is harder to win than a fortified city[b][a], and quarrels are like the bars of a citadel.
translation:
  language: id
  text: Saudara yang tersakiti[a] lebih sukar diraih kembali daripada kota berbenteng, dan pertengkaran seperti palang pintu sebuah puri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Saudara yang diperlakukan salah.” Kata Ibrani dapat menekankan orang yang tersinggung atau orang yang telah dirugikan.
    reason: lexical_alternative
  - marker: b
    text: Atau “seperti palang pintu sebuah istana.” Kata Ibrani dapat berarti puri atau istana; konteks pertahanan mendukung “puri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָח
  choice: saudara
  rationale: Kata Ibrani ini secara harfiah berarti saudara laki-laki, tetapi dalam amsal dapat menunjuk pada saudara atau orang yang memiliki hubungan dekat. “Saudara” mempertahankan gambaran relasional tanpa mempersempitnya secara tidak perlu.
- source_word: נִפְשָׁע
  choice: yang tersakiti
  rationale: Partisip dari פשע di sini menggambarkan orang yang mengalami pelanggaran atau keretakan hubungan. “Yang tersakiti” alami dalam bahasa Indonesia dan tetap membuka kemungkinan bahwa ia merasa disinggung atau benar-benar diperlakukan salah.
- source_word: מִקִּרְיַת עֹז
  choice: daripada kota berbenteng
  rationale: Preposisi komparatif מִן dan ungkapan “kota kekuatan” menyatakan perbandingan dengan kota yang kukuh atau berkubu. “Kota berbenteng” menyampaikan gambaran pertahanan dengan jelas.
- source_word: וּמְדֹנִים
  choice: dan pertengkaran
  rationale: Bentuk jamak ini menunjuk pada perselisihan atau pertikaian. “Pertengkaran” jelas, modern, dan cocok dengan gaya amsal.
- source_word: כִּבְרִיחַ
  choice: seperti palang pintu
  rationale: בְּרִיחַ ialah palang atau selot besar yang mengamankan pintu gerbang. “Palang pintu” mempertahankan gambaran sesuatu yang menutup dan menghalangi jalan masuk.
- source_word: אַרְמוֹן
  choice: sebuah puri
  rationale: Kata ini dapat berarti istana atau bangunan berkubu. Dalam rangkaian gambaran defensif, “puri” menyampaikan kediaman besar yang terlindungi sekaligus tidak meniadakan nuansa istana.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada amsal. Frasa “diraih kembali” membuat maksud perbandingan Ibrani yang sangat ringkas menjadi wajar dalam bahasa Indonesia, yakni sulitnya memulihkan hubungan dengan saudara yang tersakiti. Paralelisme dan gambaran pertahanan dipertahankan.
