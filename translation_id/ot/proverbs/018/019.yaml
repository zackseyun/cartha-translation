  source_fidelity: 'Teks Indonesia menyampaikan dua gambaran utama Ibrani dengan setia: seorang saudara yang mengalami pelanggaran/keretakan hubungan digambarkan sulit dimenangkan kembali, dan pertengkaran dibandingkan dengan palang pengaman sebuah bangunan kuat. Frasa tersirat dalam Ibrani mengenai sulitnya memperoleh kembali saudara tersebut diekspresikan secara wajar oleh “lebih sukar diraih kembali.”'
