  text: The words of a whisperer are like delicious morsels[b][a], and they go down into the inner chambers of the belly.
translation:
  language: id
  text: Kata-kata seorang penggunjing seperti suapan lezat[a]; kata-kata itu turun ke ruang-ruang terdalam di dalam perut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seperti potongan makanan yang nikmat”; istilah Ibrani yang langka ini juga dapat dipahami sebagai “seperti luka-luka” atau “seperti sesuatu yang ditelan dengan lahap.”
    reason: lexical_alternative
  - marker: b
