    reason: cultural_note
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Perkataan
  rationale: Bentuk konstruksi jamak dari דָּבָר menunjuk pada ucapan-ucapan; “perkataan” alami dan bermartabat dalam bahasa Indonesia.
- source_word: נִרְגָּן
  choice: seorang penggunjing
  rationale: Nomina ini menunjuk pada orang yang menyebarkan pembicaraan secara tersembunyi dan memecah belah. “Penggunjing” lebih wajar daripada terjemahan harfiah yang memakai gambaran berbisik, tanpa mempersempit maknanya menjadi fitnah semata.
- source_word: כְּמִתְלַהֲמִים
  choice: seperti suapan yang lezat
  rationale: Istilah langka ini diperdebatkan. Dalam Amsal 26:22, frasa yang sama lazim dipahami sebagai makanan kecil yang nikmat atau ditelan dengan lahap. Pilihan ini mempertahankan gambaran sesuatu yang memikat untuk dikonsumsi, sedangkan kemungkinan lain dicatat dalam catatan kaki.
- source_word: וְהֵם
  choice: semuanya
  rationale: Pronomina mandiri ini kembali kepada perkataan-perkataan tadi. “Semuanya” memperjelas rujukan jamak secara alami tanpa menambahkan gagasan baru.
- source_word: יָרְדוּ
  choice: turun
  rationale: Walaupun bentuk Ibraninya secara morfologis perfektif, konteks amsal menyatakan kebenaran umum; bentuk kini tanpa penanda waktu paling alami dalam bahasa Indonesia.
- source_word: חַדְרֵי בָטֶן
  choice: ruang-ruang terdalam dalam perut
  rationale: Secara harfiah berarti “ruang-ruang perut.” Terjemahan ini mempertahankan metafora spasial dan tubuh, sementara makna idiomatisnya bagi batin manusia dijelaskan dalam catatan kaki.
