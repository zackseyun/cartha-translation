  yaml_path: translation/ot/proverbs/018/007.yaml
  text: A fool’s mouth is his ruin[b][a], and his lips are a snare to his life.
translation:
  language: id
  text: 'Mulut orang bodoh adalah kehancuran bagi dirinya,

    dan bibirnya menjadi jerat bagi hidupnya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dirinya.” Secara harfiah, kata Ibrani yang diterjemahkan “hidupnya” dapat berarti “jiwanya” atau “dirinya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: mulut
  rationale: Mempertahankan gambaran konkret bahasa Ibrani; dalam pepatah, “mulut” secara alami mewakili perkataan seseorang.
- source_word: כְסִיל
  choice: orang bodoh
  rationale: Istilah baku dalam sastra hikmat yang menunjuk bukan hanya pada kurangnya kecerdasan, melainkan juga kebodohan moral dan perilaku.
- source_word: מְחִתָּה
  choice: kehancuran
  rationale: Dalam konteks ini menunjuk pada akibat mencelakakan yang didatangkan perkataan orang bodoh. “Kehancuran” mempertahankan bobot kata Ibrani dan sejajar dengan gambaran “jerat” pada baris kedua.
- source_word: לוֹ
  choice: atas dirinya
  rationale: 'Mengungkapkan relasi datif secara alami dalam bahasa Indonesia: mulutnya mendatangkan kehancuran kepada atau atas dirinya sendiri, tanpa mengubahnya menjadi kepemilikan semata.'
- source_word: וּשְׂפָתָיו
  choice: dan bibirnya
  rationale: Mempertahankan gambaran anggota tubuh dan paralelisme puitis dengan “mulut”.
- source_word: מוֹקֵשׁ
  choice: jerat
  rationale: Padanan metaforis yang lazim dan hidup dalam sastra hikmat untuk sesuatu yang menangkap serta mencelakakan.
- source_word: נַפְשׁוֹ
  choice: hidupnya
  rationale: נֶפֶשׁ di sini paling wajar merujuk pada hidup atau diri orang itu, bukan secara khusus pada jiwa tak berwujud.
theological_decisions:
- issue: Makna antropologis נַפְשׁוֹ
  choice: hidupnya
  alternative: jiwanya; dirinya
  rationale: “Hidupnya” menyampaikan pemakaian נֶפֶשׁ sebagai nyawa atau kehidupan seseorang dan menghindari pemaksaan dikotomi tubuh-jiwa yang tidak dituntut konteks.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bercorak pepatah. Paralelisme “mulut/bibir” dipertahankan. Frasa verbal “mendatangkan kehancuran atas dirinya” dipilih agar relasi לוֹ tetap jelas dan alami, sementara “menjadi” pada baris kedua melengkapi klausa nominal Ibrani secara wajar.
