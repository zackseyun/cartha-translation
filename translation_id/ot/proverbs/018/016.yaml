source:
  edition: WLC
  text: מַתָּ֣ן אָ֭דָם יַרְחִ֣יב ל֑/וֹ וְ/לִ/פְנֵ֖י גְדֹלִ֣ים יַנְחֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/016.yaml
  text: A man's gift makes room for him[b][a], and brings him before great men.
translation:
  language: id
  text: Hadiah seseorang membuka jalan baginya[a] dan membawanya[b] ke hadapan orang-orang besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “melapangkan baginya.”
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menuntunnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתָּן
  choice: hadiah
  rationale: Kata benda ini berarti hadiah atau pemberian. “Hadiah” jelas dan alami dalam bahasa Indonesia serta mempertahankan gagasan tentang sesuatu yang diberikan.
- source_word: אָדָם
  choice: seseorang
  rationale: Bentuk tunggal ini digunakan secara umum untuk seorang manusia. “Seseorang” menyampaikan cakupan generiknya secara alami tanpa mengubahnya menjadi pengertian kolektif.
- source_word: יַרְחִיב לוֹ
  choice: membuka jalan baginya
  rationale: Bentuk kausatif dari רחב secara harfiah berarti membuat luas atau lapang. Dalam konteks ini, “membuka jalan baginya” mempertahankan metafora ruang sekaligus menyatakan akses atau kesempatan secara wajar.
- source_word: וְלִפְנֵי גְדֹלִים
  choice: ke hadapan orang-orang besar
  rationale: לִפְנֵי berarti di atau ke hadapan seseorang, sedangkan גְדֹלִים menunjuk kepada orang-orang yang besar, terkemuka, atau berkuasa. Terjemahan ini mempertahankan ungkapan konkret dan keluasan maknanya.
- source_word: יַנְחֶנּוּ
  choice: membawanya
  rationale: Bentuk kausatif dari נחה berarti memimpin atau menuntun. “Membawanya” secara alami menyatakan hasil bahwa hadiah itu mengantar orang tersebut masuk ke hadapan tokoh-tokoh besar.
