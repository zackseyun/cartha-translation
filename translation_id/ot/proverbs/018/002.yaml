  source_fidelity: 'Terjemahan dengan tepat mempertahankan antitesis Ibrani: orang bebal tidak berkenan/menyenangi pengertian, melainkan berfokus pada penyingkapan batinnya sendiri. “Orang bebal,” “pengertian,” “mengungkapkan,” dan “isi hatinya” merupakan padanan yang setia bagi כְּסִיל, תְבוּנָה, הִתְגַּלּוֹת, dan לִבּוֹ. Kekuatan eksklusif כִּי אִם tersampaikan melalui “tetapi hanya.”'
