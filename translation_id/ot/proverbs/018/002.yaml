  terminology: “Orang bebal” adalah istilah hikmat yang mapan dan tidak mereduksi כְּסִיל menjadi keterbatasan intelektual semata. “Isi hatinya” adalah ungkapan Indonesia yang alami; catatan kaki dengan tepat menjelaskan bahwa “hati” mencakup pikiran serta kecenderungan batin, bukan emosi saja.
