  yaml_path: translation/ot/proverbs/018/002.yaml
  text: A fool does not delight in understanding[a], but only in revealing his heart.
translation:
  language: id
  text: Orang bebal tidak menyenangi pengertian, tetapi hanya senang mengungkapkan isi hatinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tetapi hanya senang menyingkapkan apa yang ada dalam hatinya.” Di sini “hati” menunjuk pada pikiran dan kecenderungan batin, bukan hanya perasaan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: tidak menyenangi / senang
  rationale: Kata חפץ menyatakan kesukaan, kesenangan, atau keinginan. Pengulangan bentuk "senang" dalam bahasa Indonesia mempertahankan pertentangan tersirat antara tidak menyukai pengertian dan menyukai pengungkapan diri.
- source_word: כְּסִיל
  choice: orang bebal
  rationale: Dalam Amsal, כְּסִיל menunjuk pada orang yang keras kepala secara moral dan intelektual, bukan sekadar kurang cerdas. "Orang bebal" merupakan padanan baku dan sesuai dengan ragam sastra hikmat.
- source_word: תְבוּנָה
  choice: pengertian
  rationale: תְבוּנָה dalam sastra hikmat berarti pengertian, daya memahami, atau kemampuan membedakan. "Pengertian" mempertahankan bentuk nomina dan cakupan maknanya.
- source_word: כִּי אִם
  choice: tetapi hanya
  rationale: Ungkapan ini membentuk pertentangan yang kuat sekaligus membatasi kesenangan orang bebal hanya pada tindakan mengungkapkan isi hatinya.
- source_word: בְּהִתְגַּלּוֹת
  choice: mengungkapkan
  rationale: Bentuk dari גלה menyampaikan gagasan membuka, menyingkapkan, atau membuat sesuatu diketahui. "Mengungkapkan" alami dalam konteks isi batin tanpa menghilangkan gambaran penyingkapan.
- source_word: לִבּוֹ
  choice: isi hatinya
  rationale: Dalam pemikiran Ibrani, לֵב mencakup batin, pikiran, niat, dan kecenderungan. "Isi hatinya" terdengar alami dalam bahasa Indonesia serta menghindari kesan bahwa yang dimaksud hanya emosi.
