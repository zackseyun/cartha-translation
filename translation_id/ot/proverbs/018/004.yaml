  text: מַ֣יִם עֲ֭מֻקִּים דִּבְרֵ֣י פִי אִ֑ישׁ נַ֥חַל נֹ֝בֵ֗עַ מְק֣וֹר חָכְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/004.yaml
  text: The words of a man's mouth are deep waters[b][a]; the fountain of wisdom is a flowing brook.
translation:
  language: id
  text: Perkataan dari mulut seseorang adalah air yang dalam;[a] sumber hikmat adalah aliran yang memancar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Perkataan dari mulut seseorang adalah air yang dalam, aliran yang memancar, sumber hikmat.” Teks Ibrani dapat dipahami sehingga kedua gambaran tentang air menerangkan perkataan itu sendiri, bukan menjadikan baris kedua sebagai pernyataan tersendiri tentang sumber hikmat.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַיִם עֲמֻקִּים
  choice: air yang dalam
  rationale: Bentuk jamak Ibrani מַיִם lazim bermakna kolektif dan secara alami diterjemahkan sebagai "air" dalam bahasa Indonesia. "Yang dalam" mempertahankan gambaran konkret tanpa mengubahnya menjadi penafsiran abstrak seperti "mendalam".
- source_word: דִּבְרֵי פִי אִישׁ
  choice: perkataan dari mulut seseorang
  rationale: '"Perkataan" menyampaikan bentuk jamak דִּבְרֵי secara wajar. אִישׁ berbentuk maskulin tunggal, tetapi dalam gaya amsal menunjuk kepada seorang individu; "seseorang" mempertahankan fungsi umum itu tanpa membuat kalimat Indonesia terasa terbatas pada laki-laki.'
- source_word: נַחַל נֹבֵעַ
  choice: aliran yang terus memancar
  rationale: נַחַל menunjuk aliran air atau sungai kecil, sedangkan נֹבֵעַ menggambarkan air yang memancar atau mengalir keluar. Pilihan ini menjaga gerak aktif dalam citra air dan terdengar alami dalam puisi Indonesia.
- source_word: מְקוֹר חָכְמָה
  choice: sumber hikmat
  rationale: מְקוֹר dapat berarti mata air atau sumber. "Sumber hikmat" tetap mengandung citra asal air melalui konteks "aliran" dan merupakan ungkapan Indonesia yang ringkas serta bermartabat.
theological_decisions:
- issue: Hubungan sintaksis antara kedua baris
  choice: 'Baris kedua dibaca sebagai pernyataan tersendiri: "sumber hikmat adalah aliran yang terus memancar."'
  alternative: 'Kedua gambaran air sama-sama dapat menerangkan perkataan: "Perkataan dari mulut seseorang adalah air yang dalam, aliran yang memancar, sumber hikmat."'
  rationale: Teks Ibrani tanpa kopula memungkinkan lebih dari satu pengelompokan sintaksis. Teks utama mengikuti paralelisme dua klausa yang umum, sementara catatan kaki mempertahankan pembacaan alternatif yang sungguh mungkin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang ringkas. Metafora air dipertahankan secara konkret, dan susunan dibuat mudah dipahami oleh pembaca umum. Penanda catatan kaki [a] ditempatkan pada titik ambiguitas sintaksis.
