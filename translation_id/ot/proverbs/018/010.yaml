id: PRO.18.10
reference: Proverbs 18:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִגְדַּל עֹ֭ז שֵׁ֣ם יְהוָ֑ה בּֽ/וֹ יָר֖וּץ צַדִּ֣יק וְ/נִשְׂגָּֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/010.yaml
  text: The name of Yahweh is a strong tower[c][b][a]; the righteous runs into it and is set securely on high.
translation:
  language: id
  text: Nama Yahweh[a] adalah menara yang kuat; orang benar[b] berlari ke dalamnya dan terlindung di tempat tinggi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani YHWH, nama ilahi yang secara tradisional diterjemahkan “TUHAN”.
    reason: alternative_reading
  - marker: b
    text: Bentuk Ibraninya tunggal dan secara representatif dapat berarti setiap orang yang benar.
    reason: lexical_alternative
  - marker: c
    text: Atau “menjadi aman” atau “dibuat tak terjangkau”; kata Ibraninya menggambarkan keadaan aman di tempat tinggi yang sulit dicapai.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֹז
  choice: menara yang kuat
  rationale: Ungkapan harfiahnya adalah 'menara kekuatan'. Bentuk 'menara yang kuat' wajar dalam bahasa Indonesia dan mempertahankan gambaran bangunan pertahanan.
- source_word: שֵׁם
  choice: nama
  rationale: Kata Ibrani secara langsung berarti 'nama'. Pilihan ini mempertahankan keluasan makna yang dapat mencakup pribadi, karakter, dan reputasi tanpa mempersempitnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan suatu gelar.
- source_word: בּוֹ
  choice: ke dalamnya
  rationale: Akhiran maskulin tunggal paling wajar merujuk kembali pada gambaran 'menara', yaitu nama Yahweh sebagai tempat perlindungan.
- source_word: יָרוּץ
  choice: berlari
  rationale: Kata kerja ini berarti 'berlari'; konteks memberi nuansa bergerak segera untuk mencari perlindungan.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva substantival tunggal ini menunjuk pada seseorang yang benar. 'Orang benar' alami dalam bahasa Indonesia dan tidak menambahkan kata 'laki-laki' yang tidak perlu.
- source_word: וְנִשְׂגָּב
  choice: dan terlindung di tempat tinggi
  rationale: Bentuk Niphal dari שׂגב menggambarkan keadaan tinggi yang sukar dijangkau dan karena itu aman. Terjemahan ini mempertahankan unsur perlindungan sekaligus citra ketinggian.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; transliterasi mempertahankan bahwa ini adalah nama pribadi, bukan sekadar gelar.
- issue: Daya cakup צַדִּיק dalam bentuk tunggal
  choice: orang benar
  alternative: orang-orang benar
  rationale: Bentuk tunggal dipertahankan sesuai gaya pepatah, tetapi secara representatif dapat berlaku bagi setiap orang yang benar.
- issue: Nuansa וְנִשְׂגָּב
  choice: terlindung di tempat tinggi
  alternative: menjadi aman / dibuat tak terjangkau
  rationale: Kata ini memadukan gagasan ketinggian dan keamanan. Terjemahan utama tidak menghapus citra vertikal, sedangkan catatan menyajikan padanan yang lebih ringkas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Struktur paralel pepatah dan metafora menara dipertahankan; pilihan kata dibuat mudah dipahami tanpa menghilangkan citra perlindungan di tempat tinggi.
