  text: Before destruction a man's heart is haughty[a], and before honor comes humility.
translation:
  language: id
  text: Sebelum kehancuran, hati seseorang menjadi angkuh; sebelum kehormatan, ada kerendahan hati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sebelum kehormatan, kerendahan hati.” Kata “ada” tersirat dalam klausa Ibrani. Dalam baris pertama, bentuk maskulin tunggal yang secara harfiah berarti “seorang laki-laki” dipakai secara umum dalam pepatah ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: sebelum / mendahului
  rationale: 'Preposisi ini menyatakan urutan waktu. Variasi alami dalam bahasa Indonesia mempertahankan kesejajaran: kesombongan muncul sebelum kehancuran, sedangkan kerendahan hati mendahului kehormatan.'
- source_word: שֶׁבֶר
  choice: kehancuran
  rationale: Dalam sastra hikmat, kata ini menunjuk pada keruntuhan atau kebinasaan, bukan sekadar patah secara harfiah.
- source_word: יִגְבַּהּ לֵב
  choice: hati ... meninggi
  rationale: Secara harfiah berarti hati menjadi tinggi dan secara idiomatis menyatakan keangkuhan. Ungkapan ini mempertahankan citra bahasa Ibrani serta tetap mudah dipahami.
- source_word: לֵב אִישׁ
  choice: hati seseorang
  rationale: אִישׁ berbentuk maskulin tunggal, tetapi dalam pepatah ini berfungsi secara generik. Bahasa Indonesia tidak mengharuskan penandaan gender, sehingga 'seseorang' menyampaikan cakupan umum tanpa mengubah makna.
- source_word: כָבוֹד
  choice: kehormatan
  rationale: Dalam konteks ini kata tersebut menunjuk pada kedudukan atau penghargaan terhormat, bukan kemuliaan ilahi.
- source_word: עֲנָוָה
  choice: kerendahan hati
  rationale: Padanan ini menyatakan sikap rendah hati secara jelas dan membentuk kontras etis yang alami dengan hati yang meninggi.
theological_decisions:
- issue: Cakupan generik אִישׁ dalam pernyataan pepatah
  choice: seseorang
  alternative: seorang laki-laki
  rationale: Bentuk Ibrani memang maskulin tunggal, tetapi pemakaiannya bersifat representatif dan berlaku umum. 'Seseorang' adalah padanan Indonesia alami yang tidak mempersempit pepatah hanya kepada laki-laki; catatan kaki mempertahankan informasi bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada pepatah. 'Hati meninggi' mempertahankan metafora sumber, sedangkan 'mendahului' menghasilkan klausa kedua yang alami dan tegas.
