  yaml_path: translation/ot/proverbs/018/020.yaml
  text: From the fruit of a man's mouth his stomach is satisfied[a]; he is satisfied by the produce of his lips.
translation:
  language: id
  text: Dari buah mulut seseorang, perutnya menjadi kenyang; oleh hasil bibirnya ia menjadi kenyang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dengan buah mulut seseorang, perutnya menjadi kenyang; oleh hasil bibirnya ia menjadi kenyang.”
    reason: Kata depan מִן pada awal ayat dapat menyatakan sumber (“dari”) atau sarana (“dengan”).
lexical_decisions:
- source_word: מִפְּרִי
  choice: Dari buah
  rationale: Kata depan מִן dapat menyatakan sumber atau sarana. “Dari buah” mempertahankan metafora dan nuansa sumber tanpa mempersempit artinya.
- source_word: פִי
  choice: mulut
  rationale: פֶּה berarti “mulut” dan di sini secara metonimis menunjuk pada perkataan; pilihan harfiah ini mempertahankan kesejajaran dengan “bibir”.
- source_word: אִישׁ
  choice: seseorang
  rationale: אִישׁ berbentuk maskulin tunggal, tetapi dalam amsal ini berfungsi secara umum untuk manusia mana pun. “Seseorang” menyampaikan fungsi generiknya secara alami dalam bahasa Indonesia tanpa mengubah maksud pepatah.
- source_word: תִּשְׂבַּע
  choice: dikenyangkan
  rationale: שׂבע berarti “menjadi kenyang, dipuaskan.” Bentuk ini mempertahankan gambaran perut yang menerima akibat dari perkataan.
- source_word: בִּטְנוֹ
  choice: perutnya
  rationale: בֶּטֶן secara harfiah berarti “perut” atau bagian dalam tubuh. “Perutnya” mempertahankan metafora jasmani dengan bahasa Indonesia yang wajar.
- source_word: תְּבוּאַת
  choice: hasil
  rationale: תְּבוּאָה berarti hasil, panen, atau produksi. “Hasil” mempertahankan metafora pertanian dan terdengar alami bersama “buah”.
- source_word: שְׂפָתָיו
  choice: bibirnya
  rationale: שָׂפָה secara harfiah berarti “bibir” dan secara metonimis menunjuk pada ucapan. Bentuk harfiah mempertahankan paralelisme “mulut” dan “bibir”.
- source_word: יִשְׂבָּע
  choice: ia dikenyangkan
  rationale: Pengulangan “dikenyangkan” mencerminkan pengulangan akar שׂבע dalam kedua bagian ayat dan menekankan akibat perkataan.
