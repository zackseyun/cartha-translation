  text: The poor man speaks with pleas[a], but the rich man answers harshly.
translation:
  language: id
  text: Orang miskin memohon-mohon[a], tetapi orang kaya menjawab dengan kasar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyampaikan permohonan-permohonan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחֲנוּנִים
  choice: dengan memohon-mohon
  rationale: Nomina jamak ini menyatakan permohonan sungguh-sungguh untuk memperoleh belas kasihan atau kemurahan. Ungkapan ini secara alami menyampaikan cara orang miskin berbicara sekaligus mempertahankan nada merendah dalam bahasa Ibrani.
- source_word: יְדַבֶּר
  choice: berbicara
  rationale: Bentuk Piel dari דבר di sini bermakna 'berbicara'. Bentuk kini cocok dengan sifat umum sebuah amsal.
- source_word: רָשׁ
  choice: orang miskin
  rationale: Bentuk substantival tunggal ini menunjuk kepada seorang yang miskin. Bahasa Indonesia secara alami memakai 'orang miskin' sebagai sosok perwakilan tanpa menambahkan jenis kelamin yang tidak perlu.
- source_word: וְעָשִׁיר
  choice: tetapi orang kaya
  rationale: Walaupun וְ secara formal berarti 'dan', susunan antitetis ayat ini menunjukkan pertentangan, sehingga 'tetapi' paling wajar. 'Orang kaya' mempertahankan bentuk tunggal representatif.
- source_word: יַעֲנֶה
  choice: menjawab
  rationale: Qal dari ענה lazim berarti 'menjawab' atau 'menanggapi'; 'menjawab' merupakan padanan langsung dan alami dalam konteks ini.
- source_word: עַזּוֹת
  choice: dengan kasar
  rationale: Bentuk jamak feminin ini berfungsi secara adverbial dan menggambarkan jawaban yang keras, tajam, atau kurang santun. 'Dengan kasar' menangkap kontras sosial ayat tanpa menafsirkannya sebagai keberanian yang terpuji.
