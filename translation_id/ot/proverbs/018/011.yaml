  text: ה֣וֹן עָ֭שִׁיר קִרְיַ֣ת עֻזּ֑/וֹ וּ/כְ/חוֹמָ֥ה נִ֝שְׂגָּבָ֗ה בְּ/מַשְׂכִּיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/011.yaml
  text: A rich man's wealth is his strong city[a], and like a high wall in his imagination.
translation:
  language: id
  text: 'Harta orang kaya adalah kota bentengnya,

    dan seperti tembok tinggi dalam bayangannya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam pikirannya,” “menurut pandangannya,” atau “dalam anggapannya.” Kata Ibrani ini menunjuk pada gambaran mental atau cara memandang sesuatu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: harta
  rationale: Menunjuk pada kekayaan atau milik material. “Harta” alami dalam bahasa Indonesia dan cocok dengan bentuk pepatah yang ringkas.
- source_word: עָשִׁיר
  choice: orang kaya
  rationale: Kata sifat ini dipakai sebagai nomina dan merujuk secara umum kepada seseorang yang kaya.
- source_word: קִרְיַת עֻזּוֹ
  choice: kota bentengnya
  rationale: Secara harfiah berarti “kota kekuatannya.” “Kota bentengnya” mempertahankan citra kota berkubu sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: וּכְחוֹמָה נִשְׂגָּבָה
  choice: dan seperti tembok tinggi
  rationale: Mempertahankan perbandingan eksplisit dan citra tembok yang menjulang, tanpa menambahkan gagasan “tak tertembus” yang hanya tersirat.
- source_word: בְּמַשְׂכִּיתוֹ
  choice: dalam bayangannya
  rationale: Nomina ini dapat menunjuk pada gambar, gambaran, atau citra mental. “Dalam bayangannya” mempertahankan unsur persepsi subjektif tanpa secara pasti menilainya sebagai kesombongan.
