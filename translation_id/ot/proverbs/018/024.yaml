  text: אִ֣ישׁ רֵ֭עִים לְ/הִתְרֹעֵ֑עַ וְ/יֵ֥שׁ אֹ֝הֵ֗ב דָּבֵ֥ק מֵ/אָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/024.yaml
  text: A man of many companions may come to ruin[a], but there is a friend who sticks closer than a brother.
translation:
  language: id
  text: Orang yang memiliki banyak kawan dapat mengalami kehancuran,[a] tetapi ada sahabat yang lebih erat melekat daripada saudara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Orang yang memiliki banyak kawan harus menunjukkan sikap bersahabat.” Kata kerja Ibrani לְהִתְרֹעֵעַ sulit dipastikan maknanya dan telah dipahami dengan lebih dari satu cara.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: Orang
  rationale: Dalam peribahasa ini, bentuk tunggal maskulin menyatakan manusia secara umum. 'Orang' terdengar alami dalam bahasa Indonesia dan tidak mengubahnya menjadi tokoh tertentu.
- source_word: רֵעִים
  choice: banyak kawan
  rationale: רֵעִים dapat berarti teman, kawan, atau rekan. 'Kawan' membedakan kelompok pergaulan yang banyak pada baris pertama dari 'sahabat' yang setia pada baris kedua.
- source_word: לְהִתְרֹעֵעַ
  choice: dapat mengalami kehancuran
  rationale: Bentuk Ibrani ini sulit dan dapat dihubungkan dengan gagasan mengalami kerusakan/kehancuran atau dengan bersikap ramah dan bergaul. Kontras dengan seorang sahabat yang setia mendukung bacaan kehancuran, sedangkan 'dapat' menghindari kesan bahwa akibat itu selalu tak terelakkan.
- source_word: וְיֵשׁ
  choice: tetapi ada
  rationale: 'Walaupun ו dapat berarti ''dan'', hubungan kedua baris bersifat kontras: banyak kawan dibandingkan dengan satu sahabat yang sangat setia.'
- source_word: אֹהֵב
  choice: sahabat
  rationale: Secara harfiah berarti 'orang yang mengasihi'; dalam konteks hikmat ini, 'sahabat' mengungkapkan hubungan penuh kasih dengan wajar dan membedakannya dari 'kawan' pada baris pertama.
- source_word: דָּבֵק
  choice: lebih erat melekat
  rationale: Partisip dari דבק menggambarkan keterikatan yang kuat dan terus bertahan. 'Lebih erat melekat' mempertahankan citra tersebut sekaligus menyatakan perbandingan dengan saudara.
- source_word: מֵאָח
  choice: daripada saudara
  rationale: Preposisi מִן berfungsi komparatif di sini, sehingga ungkapan itu berarti kedekatan yang melebihi ikatan dengan seorang saudara.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. Pilihan 'kawan' dan 'sahabat' mempertahankan kontras leksikal antara banyak relasi pergaulan dan seorang teman yang sungguh setia. Penanda catatan kaki [a] ditempatkan langsung setelah klausa yang dipersoalkan.
