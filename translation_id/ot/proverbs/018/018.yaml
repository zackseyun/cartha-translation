id: PRO.18.18
reference: Proverbs 18:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ֭דְיָנִים יַשְׁבִּ֣ית הַ/גּוֹרָ֑ל וּ/בֵ֖ין עֲצוּמִ֣ים יַפְרִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/018.yaml
  text: The lot puts an end to disputes[a], and separates between the mighty.
translation:
  language: id
  text: Undian mengakhiri perselisihan[a] dan memisahkan pihak-pihak yang berkuasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Undian menyelesaikan perselisihan dan memberi keputusan di antara pihak-pihak yang berkuasa.”
    reason: Alternatif ini mengungkapkan fungsi undian sebagai sarana penyelesaian dan keputusan, sedangkan teks utama mempertahankan gambaran konkret kata-kata Ibrani “mengakhiri” dan “memisahkan”.
lexical_decisions:
- source_word: מִדְיָנִים
  choice: perselisihan
  rationale: Bentuk jamak ini menunjuk pada pertikaian atau sengketa, baik antarpribadi maupun dalam perkara hukum. “Perselisihan” alami dan cukup luas dalam bahasa Indonesia modern.
- source_word: יַשְׁבִּית
  choice: mengakhiri
  rationale: Bentuk Hifil dari שבת menyatakan tindakan menyebabkan sesuatu berhenti. “Mengakhiri” mempertahankan daya kausatif itu tanpa menambahkan gagasan penyelesaian hukum secara eksplisit.
- source_word: הַגּוֹרָל
  choice: undian
  rationale: גורל menunjuk pada undi yang dipakai untuk mengambil keputusan. “Undian” merupakan padanan Indonesia yang ringkas, jelas, dan sesuai dengan gaya amsal.
- source_word: וּבֵין
  choice: dan ... pihak-pihak
  rationale: בֵּין menandai pihak-pihak yang dipisahkan satu dari yang lain. Susunan Indonesia dibuat alami dengan menyebut “pihak-pihak” secara eksplisit.
- source_word: עֲצוּמִים
  choice: pihak-pihak yang berkuasa
  rationale: Kata sifat substantival ini berarti orang-orang yang kuat atau berkuasa. “Pihak-pihak yang berkuasa” cocok dengan konteks perselisihan dan tidak membatasi rujukannya hanya kepada laki-laki.
- source_word: יַפְרִיד
  choice: memisahkan
  rationale: Bentuk Hifil dari פרד berarti memisahkan atau membagi. “Memisahkan” mempertahankan gambaran konkret bahasa Ibrani sambil membiarkan implikasi pengambilan keputusan tetap tersirat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya amsal yang ringkas dan bermartabat. Teks utama mempertahankan kesejajaran serta gambaran konkret bahasa Ibrani, sementara catatan kaki memberikan pembacaan fungsional yang lebih eksplisit.
