  text: מָ֣וֶת וְ֭/חַיִּים בְּ/יַד לָשׁ֑וֹן וְ֝/אֹהֲבֶ֗י/הָ יֹאכַ֥ל פִּרְיָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/021.yaml
  text: Death and life are in the power of the tongue[b][a], and those who love it will eat its fruit.
translation:
  language: id
  text: Maut dan hidup berada dalam kuasa lidah[a], dan orang-orang yang mencintainya[b] akan memakan buahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Maut dan hidup berada di tangan lidah.”'
    reason: lexical_alternative
  - marker: b
    text: “Orang-orang yang mencintainya” kemungkinan berarti mereka yang gemar menggunakan lidah; mereka akan mengalami akibat perkataan mereka, entah membawa maut atau hidup.
    reason: cultural_note
lexical_decisions:
- source_word: מָוֶת וְחַיִּים
  choice: Maut dan hidup
  rationale: Kedua nomina abstrak dipertahankan sebagai pasangan antitetis. “Maut” memberi kesejajaran yang ringkas dan bermartabat dengan “hidup” tanpa menyiratkan personifikasi.
- source_word: בְּיַד
  choice: berada dalam kuasa
  rationale: Secara harfiah berarti “di tangan,” tetapi dalam konteks ini merupakan idiom untuk kuasa atau kendali. Terjemahan ini menyampaikan maknanya secara alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לָשׁוֹן
  choice: lidah
  rationale: Citra anggota tubuh dalam bahasa Ibrani dipertahankan sebagai metonimia bagi perkataan, alih-alih diabstrakkan menjadi “ucapan.”
- source_word: אֹהֲבֶיהָ
  choice: orang-orang yang mencintainya
  rationale: Pronomina feminin paling wajar mengacu kepada “lidah.” Rumusan ini mempertahankan ketaksaan mengenai apakah yang dimaksud ialah menyukai lidah, banyak berbicara, atau gemar menggunakan daya perkataan.
- source_word: יֹאכַל
  choice: akan memakan
  rationale: Bentuk imperfek diterjemahkan sebagai akibat yang akan dialami dalam pernyataan amsal. Verba Ibrani tunggal yang mengikuti ungkapan partisipial jamak dipahami secara kolektif dan diterjemahkan wajar dalam bahasa Indonesia.
- source_word: פִּרְיָהּ
  choice: buahnya
  rationale: Metafora agraris bagi hasil atau konsekuensi dipertahankan secara ringkas dan alami.
theological_decisions:
- issue: Rujukan “-nya” dalam “mencintainya”
  choice: Dipertahankan sebagai pronomina yang mengacu paling wajar kepada lidah
  alternative: Diperjelas menjadi “orang-orang yang gemar berbicara”
  rationale: Teks Ibrani tidak secara eksplisit menjelaskan bentuk kecintaan itu. Mempertahankan pronomina mencegah penafsiran tertentu dimasukkan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bernada amsal. Citra “lidah” dan “buah” dipertahankan, sementara idiom “di tangan” disampaikan secara alami sebagai “dalam kuasa” dan bentuk harfiahnya diberikan dalam catatan kaki.
