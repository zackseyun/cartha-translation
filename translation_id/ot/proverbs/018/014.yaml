  text: A man's spirit can sustain him in sickness[b][a], but a crushed spirit—who can bear it?
translation:
  language: id
  text: Semangat seseorang dapat menopangnya ketika ia sakit[a], tetapi semangat yang patah—siapa sanggup menanggungnya?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menopang penyakitnya”; maksudnya, menopang orang itu ketika ia sakit.
    reason: lexical_alternative
  - marker: b
    text: Atau “siapa dapat mengangkatnya?” Akhiran feminin “-nya” merujuk kepada “semangat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: semangat
  rationale: Dalam konteks ini kata tersebut menunjuk pada daya batin atau keteguhan dalam diri seseorang, bukan angin atau napas. 'Semangat' secara alami dapat menopang seseorang dan juga dapat menjadi 'remuk' dalam bahasa Indonesia.
- source_word: אִישׁ
  choice: seseorang
  rationale: Walaupun bentuk Ibraninya maskulin tunggal, dalam peribahasa ini pemakaiannya bersifat mewakili manusia pada umumnya. 'Seseorang' menyampaikan cakupan generik itu secara alami dalam bahasa Indonesia.
- source_word: יְכַלְכֵּל
  choice: dapat menopangnya
  rationale: Bentuk ini menyatakan kemampuan untuk menopang atau mempertahankan. 'Dapat menopangnya' menangkap daya batin yang membuat seseorang bertahan selama sakit.
- source_word: מַחֲלֵהוּ
  choice: dalam sakit
  rationale: Nomina ini berarti sakit atau penyakit dengan akhiran 'miliknya'. Ungkapan 'menopangnya dalam sakit' lebih idiomatis daripada terjemahan harfiah 'menopang penyakitnya'.
- source_word: נְכֵאָה
  choice: remuk
  rationale: Kata sifat ini dapat berarti terpukul, patah, atau remuk. 'Remuk' mempertahankan gambaran kuat tentang daya batin yang telah hancur.
- source_word: מִי
  choice: siapa sanggup
  rationale: Kata tanya ini membuka pertanyaan retoris; 'sanggup' membuat unsur kemampuan yang terkandung dalam konteks menjadi jelas dan alami.
- source_word: יִשָּׂאֶנָּה
  choice: menanggungnya
  rationale: נשא dapat berarti mengangkat, membawa, atau menanggung. Di sini 'menanggungnya' paling wajar untuk menyatakan ketidakmampuan bertahan dengan semangat yang remuk; akhiran feminin merujuk kembali kepada רוּחַ.
