  yaml_path: translation/ot/proverbs/005/018.yaml
  text: Let your fountain be blessed[a], and rejoice in the wife of your youth.
translation:
  language: id
  text: Biarlah mata airmu diberkati[a], dan bersukacitalah karena istri masa mudamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sumber airmu.” Bahasa Ibrani mempertahankan metafora air, yang mungkin menyiratkan sumber kehidupan sekaligus kesuburan dalam perkawinan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Biarlah ... diberkati
  rationale: Bentuk yusif dari היה menyatakan harapan atau dorongan. “Biarlah” mempertahankan daya volitifnya secara alami dalam bahasa Indonesia.
- source_word: מְקוֹרְךָ
  choice: sumber airmu
  rationale: מָקוֹר menunjuk pada mata air, pancuran, atau sumber. “Sumber air” mempertahankan metafora air dan terdengar alami, sekaligus tidak mempersempit kemungkinan kiasannya pada kehidupan dan kesuburan perkawinan.
- source_word: בָרוּךְ
  choice: diberkati
  rationale: Terjemahan ini mempertahankan makna pasif/adjektival dari akar ברך tanpa menentukan secara berlebihan wujud berkat tersebut.
- source_word: וּשְׂמַח
  choice: dan bersukacitalah
  rationale: Bentuk ini meneruskan nada nasihat sebagai perintah positif dan menyampaikan kegembiraan yang aktif.
- source_word: מֵאֵשֶׁת
  choice: dengan istri
  rationale: Preposisi מן setelah שמח dapat menunjukkan sumber atau objek sukacita. “Bersukacitalah dengan” alami dalam bahasa Indonesia dan membiarkan konteks menyampaikan kenikmatan perkawinan tanpa uraian tambahan.
- source_word: נְעוּרֶיךָ
  choice: masa mudamu
  rationale: Ungkapan “istri masa mudamu” menunjuk pada istri yang dinikahi sejak masa muda dan mempertahankan bentuk ungkapan Ibraninya dengan jelas.
theological_decisions:
- issue: Cakupan metafora sumber air
  choice: Metafora dipertahankan tanpa dijelaskan di dalam ayat.
  alternative: Menafsirkannya secara eksplisit sebagai kesuburan, keturunan, atau seksualitas suami.
  rationale: Konteks perkawinan memberi nuansa seksual dan kesuburan, tetapi kata Ibrani itu sendiri tetap metaforis dan dapat mencakup sumber kehidupan serta berkat perkawinan secara lebih luas.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Sumber air” dipilih karena lebih mudah dipahami daripada “pancuran” dalam konteks kiasan, sementara catatan kaki mencatat alternatif harfiah “mata air.” Penanda catatan kaki ditempatkan langsung sesudah frasa yang diterangkannya.
