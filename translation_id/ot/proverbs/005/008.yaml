  text: הַרְחֵ֣ק מֵ/עָלֶ֣י/הָ דַרְכֶּ֑/ךָ וְ/אַל תִּ֝קְרַ֗ב אֶל פֶּ֥תַח בֵּיתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/008.yaml
  text: Keep your way far from her[a], and do not go near the entrance of her house.
translation:
  language: id
  text: Jauhkanlah jalanmu darinya[a], dan jangan mendekati pintu masuk rumahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tetaplah jauh darinya, dan jangan mendekati pintu masuk rumahnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְחֵק
  choice: Jauhkanlah
  rationale: Bentuk imperatif Hifil dari רחק menyampaikan perintah kausatif untuk membuat atau mempertahankan jarak; pilihan ini juga memungkinkan דַרְכֶּךָ tetap menjadi objek sebagaimana dalam bahasa Ibrani.
- source_word: מֵעָלֶיהָ
  choice: darinya
  rationale: Gabungan preposisi ini menyatakan pemisahan dari orang atau lingkungan di sekitarnya. Unsur jarak sudah dinyatakan oleh 'Jauhkanlah'.
- source_word: דַרְכֶּךָ
  choice: jalanmu
  rationale: דֶּרֶךְ dapat menunjuk pada jalan secara konkret maupun arah perilaku atau perjalanan hidup. 'Jalanmu' mempertahankan metafora khas sastra hikmat tanpa menentukan salah satu nuansa secara berlebihan.
- source_word: וְאַל תִּקְרַב
  choice: dan jangan mendekati
  rationale: Konstruksi negatif ini menyatakan larangan. 'Jangan mendekati' alami dalam bahasa Indonesia dan mempertahankan gambaran gerak menuju suatu tempat.
- source_word: אֶל פֶּתַח
  choice: pintu masuk
  rationale: פֶּתַח berarti bukaan, jalan masuk, atau ambang pintu. 'Pintu masuk' menandai akses ke rumah tanpa membatasi maknanya pada daun pintu.
- source_word: בֵּיתָהּ
  choice: rumahnya
  rationale: בַּיִת secara langsung berarti 'rumah'; bentuk bersufiks feminin merujuk pada rumah perempuan yang dibicarakan dalam konteks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan ringkas. Metafora 'jalanmu' dipertahankan karena dapat mencakup rute konkret sekaligus arah hidup atau perilaku, sedangkan catatan kaki memberikan ungkapan alternatif yang lebih idiomatis.
