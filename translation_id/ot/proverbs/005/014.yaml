translation:
  language: id
  text: Aku nyaris berada dalam segala macam kejahatan di tengah-tengah jemaah dan perhimpunan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku nyaris mengalami kehancuran total” atau “Aku hampir berada dalam segala kejahatan.” Frasa Ibrani ini ringkas dan dapat menekankan kejahatan moral ataupun malapetaka atau kehancuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט
  choice: nyaris
  rationale: Dalam konstruksi dengan הָיִיתִי, kata ini menyatakan kedekatan pada suatu keadaan, bukan lamanya waktu. “Nyaris” merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: הָיִיתִי
  choice: aku … terjerumus
  rationale: Secara harfiah berarti “aku berada/menjadi”. Dalam bahasa Indonesia, “terjerumus” membuat hubungan dengan frasa “ke dalam segala macam kejahatan” alami, sambil tetap menggambarkan keadaan yang nyaris dialami penutur.
- source_word: בְכָל רָע
  choice: ke dalam segala macam kejahatan
  rationale: Frasa Ibrani yang padat ini dapat menunjuk pada kejahatan secara menyeluruh atau pada malapetaka dan kehancuran total. Teks utama mempertahankan penekanan moral sesuai konteks Amsal 5, sedangkan kemungkinan makna kehancuran dicatat dalam catatan kaki.
- source_word: בְּתוֹךְ
  choice: di tengah-tengah
  rationale: Padanan ini mempertahankan gambaran spasial dan sifat terbuka atau publik dari keadaan tersebut.
- source_word: קָהָל
  choice: jemaah
  rationale: “Jemaah” menunjuk pada kelompok masyarakat yang berkumpul dan cocok dengan konteks komunitas, tanpa harus membatasi maknanya pada lingkungan ibadah.
- source_word: וְעֵדָה
  choice: dan perhimpunan
  rationale: Padanan ini mempertahankan dua istilah Ibrani yang hampir bersinonim dan menonjolkan latar publik, alih-alih meleburkannya menjadi satu istilah.
theological_decisions:
- issue: Apakah רָע menunjuk pada kejahatan moral atau kehancuran yang menimpa penutur
  choice: Teks utama memakai “segala macam kejahatan”.
  alternative: “kehancuran total” atau “segala malapetaka”.
  rationale: Konteks nasihat moral mendukung pengertian “kejahatan”, tetapi rentang makna רָע dan kepadatan susunan Ibraninya memungkinkan pengertian akibat buruk atau kehancuran. Ambiguitas ini dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Jemaah dan perhimpunan” mempertahankan pasangan istilah Ibrani serta nuansa bahwa aib atau kehancuran itu terjadi di hadapan komunitas.
