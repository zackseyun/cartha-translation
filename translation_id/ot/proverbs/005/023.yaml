  text: He dies for lack of discipline[a], and in the abundance of his folly he goes astray.
translation:
  language: id
  text: Ia mati karena kekurangan didikan[a], dan dalam kebodohannya yang begitu besar ia tersesat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia akan mati tanpa didikan, dan dalam kebodohannya yang begitu besar ia akan tersesat.”
    reason: Alternatif ini mempertahankan kemungkinan nilai futur dari kedua bentuk imperfek serta arti keadaan yang lebih harfiah dari בְּאֵין.
lexical_decisions:
- source_word: יָמוּת
  choice: mati
  rationale: Bentuk imperfek Qal orang ketiga tunggal dapat menyatakan akibat umum atau pasti dalam sastra hikmat. Bentuk kini tanpa penanda waktu cocok dengan gaya amsal Indonesia, sementara alternatif futur dicatat dalam catatan kaki.
- source_word: בְּאֵין
  choice: karena tidak mendapat
  rationale: Gabungan ב dengan אֵין menyatakan keadaan yang juga bernuansa sebab, yaitu ketiadaan sesuatu. Ungkapan ini alami dalam bahasa Indonesia dan tidak mengubahnya menjadi sekadar keterangan tempat atau keadaan.
- source_word: מוּסָר
  choice: didikan
  rationale: Dalam Amsal, מוּסָר menunjuk pada pembentukan melalui pengajaran, teguran, dan koreksi. 'Didikan' mempertahankan cakupan itu dengan bahasa yang wajar dan tidak terbatas pada disiplin diri.
- source_word: וּבְרֹב
  choice: dan karena ... yang begitu besar
  rationale: רֹב menyatakan besarnya atau banyaknya sesuatu. Susunan ini menyampaikan intensitas serta kemungkinan nuansa sebab dari preposisi ב secara alami dalam bahasa Indonesia.
- source_word: אִוַּלְתּוֹ
  choice: kebodohannya
  rationale: Istilah ini menunjuk pada kebodohan moral, kategori penting dalam sastra hikmat, bukan semata-mata kurangnya kecerdasan.
- source_word: יִשְׁגֶּה
  choice: ia tersesat
  rationale: Kata שׁגה dapat berarti menyimpang, mengembara, atau tersesat. Dalam konteks moral ini, 'tersesat' menyatakan penyimpangan yang membawa kebinasaan tanpa mempersempitnya menjadi sempoyongan secara fisik.
- source_word: הוּא
  choice: Ia
  rationale: Pronomina yang dinyatakan secara eksplisit dalam bahasa Ibrani dipertahankan sebagai subjek dan memberi kesinambungan dengan tokoh yang dibicarakan.
