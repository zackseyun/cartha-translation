  text: His iniquities will capture the wicked man[b][a], and he will be held fast in the cords of his sin.
translation:
  language: id
  text: Kejahatan-kejahatannya akan menangkap orang fasik itu, dan ia akan terikat erat oleh tali-tali dosanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַוּוֹנוֹתָיו
  choice: kejahatan-kejahatannya sendiri
  rationale: Bentuk jamak עָוֹן menunjuk pada berbagai kesalahan atau perbuatan jahat milik orang itu. Kata “sendiri” memperjelas sufiks kepunyaan dan hubungan sebab-akibat dalam gambaran puitis tanpa menambahkan pelaku dari luar.
- source_word: יִלְכְּדֻנוֹ
  choice: akan menangkap
  rationale: Kata לָכַד menggambarkan tindakan menangkap atau menawan; pilihan ini mempertahankan personifikasi bahwa kejahatan orang itu sendiri menjadi perangkap baginya.
- source_word: הָרָשָׁע
  choice: orang fasik itu
  rationale: Nomina substantival ini berbentuk tunggal dan menunjuk pada orang yang jahat. “Orang fasik” merupakan ungkapan Indonesia yang ringkas, bermartabat, dan lazim dalam konteks sastra hikmat.
- source_word: וּבְחַבְלֵי
  choice: dan ... oleh tali-tali
  rationale: חֶבֶל dapat berarti tali atau tambang. “Tali-tali” mempertahankan bentuk jamak serta gambaran pengekangan dan selaras dengan tindakan menangkap pada baris pertama.
- source_word: חַטָּאתוֹ
  choice: dosanya
  rationale: Bentuk tunggal חַטָּאת dengan sufiks orang ketiga dipertahankan sebagai “dosanya”; di sini dosa dapat dipahami secara kolektif sebagai sesuatu yang membelenggu pelakunya.
- source_word: יִתָּמֵךְ
  choice: ia akan tertahan erat
  rationale: Bentuk Nifal ini dalam konteks tali-tali menyatakan keadaan dipegang atau ditahan. “Tertahan erat” mempertahankan nuansa pasif dan kuatnya belenggu tanpa mengubahnya menjadi tindakan refleksif.
theological_decisions:
- issue: Gambaran sebab-akibat moral dan tanggung jawab manusia
  choice: Orang fasik ditangkap dan ditahan oleh kejahatan serta dosanya sendiri.
  alternative: Pernyataan umum bahwa perbuatan jahat mendatangkan akibat buruk, tanpa personifikasi sebagai perangkap.
  rationale: Paralelisme Ibrani secara konkret menjadikan kejahatan dan tali-tali dosa sebagai sarana penangkapan. Terjemahan mempertahankan gambaran bahwa kejahatan berbalik membelenggu pelakunya, tanpa menetapkan mekanisme doktrinal tambahan mengenai penghakiman atau determinisme.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada sastra hikmat. Struktur dua klausa paralel dipertahankan. Pengulangan “kejahatan-kejahatannya” sengaja dipakai untuk mencerminkan bentuk jamak Ibrani, sedangkan “dosanya” tetap tunggal. Tidak diperlukan catatan kaki karena pilihan leksikal utama dapat disampaikan secara wajar dalam teks.
