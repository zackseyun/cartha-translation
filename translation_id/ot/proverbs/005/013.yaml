  text: וְֽ/לֹא שָׁ֭מַעְתִּי בְּ/ק֣וֹל מוֹרָ֑/י וְ֝/לִֽ/מְלַמְּדַ֗/י לֹא הִטִּ֥יתִי אָזְנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/013.yaml
  text: and I did not listen to the voice of my instructors[a], nor did I incline my ear to my teachers.
translation:
  language: id
  text: Aku tidak mendengarkan perkataan para pembimbingku[a], dan tidak mencondongkan telingaku kepada para pengajarku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menaati perkataan para pembimbingku.” Dalam konteks sastra hikmat, kata kerja Ibrani ini dapat berarti mendengar dengan sikap taat.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: mendengarkan perkataan
  rationale: Ungkapan שׁמע בקול berarti mendengar, mendengarkan, atau menaati. Dalam bahasa Indonesia, “mendengarkan perkataan” secara alami menyiratkan kesediaan memperhatikan tanpa mempersempit maknanya menjadi ketaatan saja.
- source_word: מוֹרָי
  choice: para pembimbingku
  rationale: Bentuk dari ירה menunjuk kepada orang-orang yang memberi pengajaran atau arahan. “Para pembimbingku” mempertahankan nuansa pengarahan dan membedakannya secara wajar dari מְלַמְּדַי.
- source_word: מְלַמְּדַי
  choice: para pengajarku
  rationale: Partisipel dari למד berarti orang-orang yang mengajar. “Para pengajarku” merupakan padanan langsung dan tetap mempertahankan sedikit variasi leksikal dengan מוֹרָי.
- source_word: הִטִּיתִי אָזְנִי
  choice: mencondongkan telingaku
  rationale: Ungkapan ini menggambarkan tindakan memberi perhatian dengan sungguh-sungguh. Terjemahan tersebut mempertahankan metafora Ibrani dan tetap dapat dipahami dalam bahasa Indonesia yang bermartabat.
- source_word: וְ...וְלֹא
  choice: dan ... dan tidak
  rationale: Kedua klausa negatif dikoordinasikan oleh waw. Pengulangan “dan tidak” menghasilkan susunan Indonesia yang jelas dan dekat dengan bentuk sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sudut pandang orang pertama serta kesejajaran kedua klausa dipertahankan; variasi antara “pembimbing” dan “pengajar” mencerminkan dua istilah Ibrani yang berdekatan maknanya.
