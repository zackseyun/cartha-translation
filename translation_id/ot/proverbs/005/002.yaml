  text: so that you may keep discretion[b][a], and your lips may guard knowledge.
translation:
  language: id
  text: supaya engkau memelihara kebijaksanaan[a], dan bibirmu[b] menjaga pengetahuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "pertimbangan yang matang" atau "kearifan" untuk "kebijaksanaan".
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "bibirmu"; ungkapan ini menunjuk pada perkataan yang menjaga atau mengungkapkan pengetahuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹר
  choice: supaya engkau memelihara
  rationale: Infinitif berkonstruksi dengan ל menyatakan tujuan dalam konteks nasihat ayah yang berlanjut dari ayat sebelumnya. 'Supaya engkau memelihara' menyatakan hubungan tujuan secara alami dan mempertahankan arti menjaga atau mempertahankan.
- source_word: מְזִמּוֹת
  choice: kebijaksanaan
  rationale: Dalam sastra hikmat, bentuk ini dapat menunjuk pada pertimbangan yang bijaksana atau kecakapan menyusun rencana. Konteks positif mendukung 'kebijaksanaan', tanpa nuansa negatif seperti 'muslihat'.
- source_word: וְדַעַת
  choice: pengetahuan
  rationale: '''Pengetahuan'' mempertahankan padanan leksikal yang lazim dalam Amsal dan mencakup pengetahuan moral serta praktis tanpa mempersempitnya menjadi ''pengertian''.'
- source_word: שְׂפָתֶיךָ
  choice: bibirmu
  rationale: Terjemahan harfiah ini mempertahankan citraan tubuh dalam puisi Ibrani; secara metonimis, bibir menunjuk pada perkataan.
- source_word: יִנְצֹרוּ
  choice: menjaga
  rationale: '''Menjaga'' mempertahankan nuansa perlindungan dari נצר. Dalam rangkaian tujuan ayat ini, bentuk imperfek dipahami bergantung pada ''supaya'', sehingga bahasa Indonesia tidak memerlukan penanda masa depan tersendiri.'
