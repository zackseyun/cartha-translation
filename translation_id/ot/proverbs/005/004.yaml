  text: but in the end she is bitter like wormwood[a], sharp like a two-edged sword.
translation:
  language: id
  text: Namun, kesudahannya pahit seperti apsintus,[a] tajam seperti pedang bermata dua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Apsintus adalah sejenis tumbuhan yang sangat pahit, sering diidentifikasi sebagai wormwood; jenis tumbuhan yang tepat tidak pasti.
    reason: lexical_explanation
lexical_decisions:
- source_word: וְאַחֲרִיתָהּ
  choice: Namun, pada akhirnya dia
  rationale: אַחֲרִית dengan sufiks feminin tunggal dapat menunjuk pada akhir atau akibatnya. Ungkapan ini mempertahankan rujukan feminin dan menyampaikan kontras secara alami dalam bahasa Indonesia.
- source_word: מָרָה
  choice: pahit
  rationale: Adjektiva predikatif ini menggambarkan akibat yang menyakitkan atau getir; kopula tidak diperlukan dalam bahasa Indonesia.
- source_word: כַלַּעֲנָה
  choice: seperti apsintus
  rationale: לַעֲנָה menunjuk pada tumbuhan yang terkenal sangat pahit. 'Apsintus' mempertahankan gambaran konkret, sedangkan catatan kaki menjelaskan istilah yang mungkin kurang dikenal.
- source_word: חַדָּה
  choice: tajam
  rationale: Padanan langsung dan alami bagi adjektiva yang mengiringi perbandingan dengan pedang.
- source_word: כְּחֶרֶב פִּיּוֹת
  choice: seperti pedang bermata dua
  rationale: Secara harfiah berarti pedang dengan 'mulut-mulut' atau sisi-sisi tajam; ungkapan Indonesia 'pedang bermata dua' menyampaikan idiom Ibrani dengan jelas.
