base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/020.yaml
  text: Why[a], my son[b], should you go astray with a strange woman and embrace the bosom of a foreign woman?
translation:
  language: id
  text: Mengapa, anakku, engkau harus tergila-gila pada perempuan terlarang[a] dan memeluk dada[b] perempuan asing?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “perempuan asing.” Dalam konteks ini, yang dimaksud ialah perempuan di luar batas hubungan perkawinan yang sah, bukan sekadar perempuan yang berbeda bangsa.
    reason: lexical_alternative
  - marker: b
    text: Atau “pangkuan.” Kata Ibrani ini dapat menunjuk dada atau pangkuan dalam sebuah dekapan intim.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָה
  choice: Mengapa ... harus
  rationale: Kata tanya ini membuka pertanyaan retoris yang bernada teguran. Kata “harus” menyampaikan daya nasihatnya secara wajar dalam bahasa Indonesia.
- source_word: תִשְׁגֶּה
  choice: tersesat
  rationale: Kata kerja שׁגה dapat berarti menyimpang atau mengembara dan dalam konteks ini dapat pula menyiratkan keterpikatan. “Tersesat” mempertahankan gambaran penyimpangan moral tanpa mempersempitnya menjadi sekadar perasaan tergila-gila.
- source_word: בְנִי
  choice: anakku
  rationale: Akhiran orang pertama tunggal menuntut arti “anakku” dan mempertahankan bingkai pengajaran seorang ayah kepada anaknya.
- source_word: זָרָה
  choice: perempuan terlarang
  rationale: Dalam bahan peringatan Amsal, istilah ini menunjuk kepada perempuan di luar hubungan perkawinan yang patut, bukan terutama perempuan yang aneh atau berbeda etnis. “Perempuan terlarang” menyampaikan daya moral-relasionalnya dengan jelas.
- source_word: תְחַבֵּק
  choice: mendekap
  rationale: Padanan alami bagi חבק yang mempertahankan tindakan merangkul erat serta cocok dengan konteks intim dan ragam puitis.
- source_word: חֵק
  choice: dada
  rationale: חֵק dapat menunjuk dada atau pangkuan, yakni bagian tubuh yang direngkuh dalam dekapan. “Dada” mempertahankan gambaran konkret dan konteks intim.
- source_word: נָכְרִיָּה
  choice: perempuan asing
  rationale: Istilah ini berarti perempuan asing atau orang luar. Pilihan ini mempertahankan perbedaan leksikal dari זָרָה dan kesejajaran puitis, sementara konteks menunjukkan bahwa yang terutama dimaksud ialah orang luar dari hubungan yang sah, bukan etnisitas semata.
theological_decisions:
- issue: Cara menerjemahkan pasangan זָרָה dan נָכְרִיָּה dalam peringatan Amsal
  choice: “perempuan terlarang” dan “perempuan asing”
  alternative: “perempuan asing” untuk keduanya, atau “pezina” untuk keduanya
  rationale: Ayat ini memperingatkan hubungan seksual yang tidak sah, bukan terutama perkawinan lintas etnis. “Perempuan terlarang” menjelaskan daya moral istilah pertama, sedangkan “perempuan asing” mempertahankan perbedaan istilah kedua dan kesejajaran puisinya. “Pezina” akan lebih spesifik daripada yang dinyatakan kedua kata itu sendiri.
translation_notes:
  register: Bahasa Indonesia baku yang modern, lugas, dan tetap puitis. Sapaan “anakku” mempertahankan kehangatan serta kewibawaan nasihat orang tua. Pertanyaan retoris dipertahankan, dan istilah mengenai perempuan luar tidak diarahkan menjadi pernyataan etnis.
