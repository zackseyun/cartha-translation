id: PRO.5.3
reference: Proverbs 5:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י נֹ֣פֶת תִּ֭טֹּפְנָה שִׂפְתֵ֣י זָרָ֑ה וְ/חָלָ֖ק מִ/שֶּׁ֣מֶן חִכָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/003.yaml
  text: For the lips of a forbidden woman drip honey[b][a], and her palate is smoother than oil.
translation:
  language: id
  text: Sebab bibir perempuan terlarang[a] meneteskan madu, dan langit-langit mulutnya[b] lebih licin daripada minyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perempuan asing.” Dalam Kitab Amsal, istilah Ibrani ini sering menunjuk pada perempuan yang berada di luar batas hubungan seksual yang sah.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan ini dapat dipakai secara kiasan untuk mulut atau ucapannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan ayat ini dengan nasihat sebelumnya sebagai alasan atau dasar peringatan.
- source_word: נֹפֶת
  choice: madu
  rationale: Menunjuk pada madu, khususnya madu yang mengalir; gagasan mengalir sudah dinyatakan oleh verba berikutnya.
- source_word: תִּטֹּפְנָה
  choice: meneteskan
  rationale: Mempertahankan gambaran madu yang menetes dari bibir serta menghasilkan susunan yang alami dalam bahasa Indonesia.
- source_word: שִׂפְתֵי
  choice: bibir
  rationale: Mempertahankan citra tubuh dan bentuk konstruksi Ibrani dengan jelas.
- source_word: זָרָה
  choice: perempuan terlarang
  rationale: Dalam konteks Amsal, istilah ini biasanya menunjuk pada perempuan di luar batas hubungan seksual yang sah. Pilihan ini menyampaikan daya moral istilah tersebut tanpa mempersempitnya hanya kepada perempuan yang sudah menikah.
- source_word: וְחָלָק
  choice: dan ... lebih licin
  rationale: Adjektiva 'licin/halus' digunakan secara komparatif karena diikuti מִן; 'lebih licin' juga mempertahankan kemungkinan nuansa tutur yang memikat sekaligus berbahaya.
- source_word: מִשֶּׁמֶן
  choice: daripada minyak
  rationale: מִן menandai pembanding. 'Minyak' cukup mencerminkan teks tanpa menambahkan jenis minyak yang tidak dinyatakan.
- source_word: חִכָּהּ
  choice: langit-langit mulutnya
  rationale: Menerjemahkan arti anatomi harfiahnya dan mempertahankan kesejajaran citra tubuh dengan 'bibir', meskipun secara metonimis dapat menunjuk pada mulut atau ucapan.
theological_decisions:
- issue: Makna זָרָה dalam konteks sastra hikmat Amsal
  choice: perempuan terlarang
  alternative: perempuan asing; perempuan jalang; perempuan pezina
  rationale: Istilah itu membawa gagasan bahwa perempuan tersebut berada di luar batas hubungan seksual yang sah, tetapi bentuk Ibraninya tetap dapat berarti 'asing'. Terjemahan utama menyampaikan tekanan moral konteks, sedangkan catatan kaki mempertahankan alternatif leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Citra tubuh dari teks Ibrani dipertahankan, sedangkan istilah moral yang berpotensi ambigu dijelaskan melalui catatan kaki.
