id: PRO.5.5
reference: Proverbs 5:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רַ֭גְלֶי/הָ יֹרְד֣וֹת מָ֑וֶת שְׁ֝א֗וֹל צְעָדֶ֥י/הָ יִתְמֹֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/005.yaml
  text: Her feet go down to death[a]; her steps hold fast to Sheol.
translation:
  language: id
  text: Kakinya turun menuju maut; langkah-langkahnya berpegang erat pada Syeol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “kubur” atau “dunia orang mati”. Ibrani: Syeol.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֶיהָ
  choice: kakinya
  rationale: Bentuk jamak dengan akhiran orang ketiga feminin tunggal. Dalam bahasa Indonesia, “kakinya” secara alami dapat menunjuk pada kedua kaki sekaligus dan mempertahankan gambaran tubuh yang konkret.
- source_word: יֹרְדוֹת
  choice: turun
  rationale: Partisipel Qal feminin jamak dari ירד. “Turun” lugas dan alami serta mempertahankan arah gerak menuju kematian.
- source_word: מָוֶת
  choice: maut
  rationale: Makna leksikal langsungnya ialah kematian. “Maut” cocok dengan laras sastra hikmat yang bermartabat dan tidak memperlemah ungkapan menjadi sekadar bahaya atau kebinasaan.
- source_word: שְׁאוֹל
  choice: Syeol
  rationale: Transliterasi mempertahankan istilah Ibrani yang khas dan tidak menyempitkannya menjadi kubur ataupun menyamakannya dengan konsep neraka yang berkembang kemudian.
- source_word: צְעָדֶיהָ
  choice: langkah-langkahnya
  rationale: Bentuk jamak konkret ini mempertahankan kesejajaran puitis dengan “kakinya” pada baris pertama.
- source_word: יִתְמֹכוּ
  choice: berpegang erat pada
  rationale: Kata תמך membawa gagasan memegang, menopang, atau mencengkeram. Dalam konteks puitis ini, ungkapan tersebut menunjukkan bahwa langkah-langkahnya melekat kuat pada Syeol tanpa membuat bahasa Indonesia terasa kaku.
theological_decisions:
- issue: Penerjemahan שְׁאוֹל
  choice: Syeol
  alternative: kubur; dunia orang mati
  rationale: Istilah ini dalam sastra hikmat Ibrani menunjuk pada ranah kematian. Transliterasi menjaga ketegangan teologis teks dan menghindari penyempitan menjadi makam fisik maupun pengimporan konsep neraka dari perkembangan teologi kemudian. Catatan kaki menyediakan padanan penjelas.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan puitis. Titik koma mempertahankan kesejajaran kedua bagian ayat; “maut” memberi laras hikmat yang bermartabat tanpa menjadi arkais.
