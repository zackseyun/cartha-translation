source:
  edition: WLC
  text: פֶּן תִּתֵּ֣ן לַ/אֲחֵרִ֣ים הוֹדֶ֑/ךָ וּ֝/שְׁנֹתֶ֗י/ךָ לְ/אַכְזָרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/009.yaml
  text: lest you give your honor to others[b][a], and your years to the cruel one.
translation:
  language: id
  text: Jangan sampai kauserahkan kehormatanmu[a] kepada orang lain, dan tahun-tahun hidupmu kepada orang yang kejam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kemegahanmu” atau “kekuatanmu” untuk “kehormatanmu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “seorang yang kejam” atau “orang yang tidak mengenal belas kasihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Jangan sampai
  rationale: Ungkapan ini secara alami memperkenalkan akibat buruk yang diperingatkan dan mempertahankan daya nasihat ringkas dari bahasa Ibrani.
- source_word: תִּתֵּן
  choice: kauserahkan
  rationale: Makna dasarnya adalah 'memberikan', tetapi dalam konteks kehilangan milik atau martabat akibat kebodohan, 'menyerahkan' menyampaikan nuansa berpindahnya sesuatu kepada pihak lain tanpa melampaui makna sumber.
- source_word: לַאֲחֵרִים
  choice: kepada orang lain
  rationale: Bentuk jamaknya menunjuk kepada pihak-pihak lain. Bahasa Indonesia lazim memakai 'orang lain' sebagai ungkapan kolektif tanpa perlu menandai jamak secara eksplisit.
- source_word: הוֹדֶךָ
  choice: kehormatanmu
  rationale: הוֹד dapat berarti kehormatan, kemegahan, atau semarak. Dalam konteks kehancuran pribadi dan sosial akibat hubungan seksual terlarang, 'kehormatan' paling jelas, sementara alternatif leksikal tetap dicatat.
- source_word: וּשְׁנֹתֶיךָ
  choice: dan tahun-tahun hidupmu
  rationale: Terjemahan ini mempertahankan gambaran 'tahun-tahunmu' sekaligus memperjelas bahwa yang dimaksud ialah masa hidup seseorang.
- source_word: לְאַכְזָרִי
  choice: kepada orang yang kejam
  rationale: Kata sifat tunggal ini dipakai secara substantival. 'Orang yang kejam' alami dalam bahasa Indonesia dan tidak menentukan jenis kelamin atau identitas referennya.
theological_decisions:
- issue: Identitas pihak yang disebut אַכְזָרִי
  choice: Dibiarkan sebagai 'orang yang kejam' tanpa menentukan identitasnya.
  alternative: Menafsirkannya secara khusus sebagai suami perempuan itu, penagih utang, atau pihak tertentu lainnya.
  rationale: Teks Ibrani tidak menyebut identitas pihak tersebut; terjemahan mempertahankan keterbukaan referennya dan tidak memasukkan tafsiran khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hikmat. Bentuk 'kauserahkan' ringkas dan wajar untuk sapaan orang kedua tunggal; pengulangan 'kepada' mempertahankan kesejajaran dua baris Ibrani.
