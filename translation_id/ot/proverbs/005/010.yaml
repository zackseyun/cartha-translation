  source_fidelity: 'Draf secara umum mengikuti struktur peringatan פֶּן dan mempertahankan dua baris paralel. Namun, “orang yang bukan sebangsamu” mempersempit נָכְרִי menjadi perbedaan kebangsaan/etnis, padahal istilah itu lebih luas: orang asing atau pihak luar. “Dipuaskan dengan kekuatanmu” juga kurang jelas sebagai padanan יִשְׂבְּעוּ; bentuk refleksif lebih langsung menyatakan bahwa orang-orang asing itu memperoleh kepuasan/kelimpahan dari kekuatan penerima nasihat.'
