  terminology: “Orang-orang asing” untuk זָרִים dan “orang asing” untuk נָכְרִי tidak memaksakan batas kebangsaan modern. “Kekuatanmu” mempertahankan keluasan כֹּחֶךָ. “Jerih payahmu” mempertahankan ambiguitas עֲצָבֶיךָ antara kerja susah payah dan hasilnya; catatan kaki menjelaskan kemungkinan makna hasil kerja.
