  text: lest strangers be filled with your strength[b][a], and your labors go to the house of a foreigner.
translation:
  language: id
  text: Jangan sampai orang-orang asing mengenyangkan diri dengan kekuatanmu[a], dan jerih payahmu[b] masuk ke rumah orang asing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi puas dengan kekuatanmu.” Kata Ibrani yang dipakai dapat berarti menjadi penuh, kenyang, atau puas.
    reason: lexical_alternative
  - marker: b
    text: Atau “hasil jerih payahmu” atau “kekayaan yang kauperoleh dengan susah payah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Jangan sampai
  rationale: Mengungkapkan peringatan terhadap akibat yang tidak diinginkan secara ringkas dan alami dalam bahasa Indonesia.
- source_word: יִשְׂבְּעוּ
  choice: dipuaskan
  rationale: Mempertahankan gambaran dasar verba שבע, yaitu menjadi kenyang, penuh, atau puas, tanpa mengubahnya langsung menjadi gagasan memiliki atau menghabiskan.
- source_word: זָרִים
  choice: orang-orang asing
  rationale: Menunjuk kepada orang-orang di luar lingkup hubungan yang semestinya dan tetap sesuai dengan pemakaian istilah ini dalam sastra hikmat.
- source_word: כֹּחֶךָ
  choice: kekuatanmu
  rationale: Mempertahankan arti luas כֹּחַ sebagai kekuatan, daya, atau kemampuan; dalam konteks ini dapat mencakup daya produktif dan sumber ekonomi.
- source_word: וַעֲצָבֶיךָ
  choice: hasil jerih payahmu
  rationale: Nomina ini dapat menunjuk pada jerih payah yang berat maupun hasil yang diperoleh darinya. Dalam paralelisme tentang kerugian materi, 'hasil jerih payah' terdengar alami tanpa menutup alternatif leksikal.
- source_word: בְּבֵית
  choice: masuk ke rumah
  rationale: Bahasa Ibrani secara harfiah menyatakan keberadaan 'di rumah', tetapi paralelisme peringatan menyiratkan bahwa hasil kerja itu berpindah ke rumah pihak lain; 'masuk ke' menyatakan implikasi tersebut secara wajar.
- source_word: נָכְרִי
  choice: orang yang bukan sebangsamu
  rationale: Membedakan נָכְרִי dari זָרִים pada baris pertama dan mempertahankan nuansa seseorang yang berasal dari luar komunitas atau bangsa sendiri.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada peringatan yang ringkas dan bermartabat. Ungkapan 'dipuaskan dengan kekuatanmu' sengaja mempertahankan metafora Ibrani yang agak mencolok, sedangkan 'masuk ke rumah' memperjelas perpindahan yang tersirat dalam paralelisme.
