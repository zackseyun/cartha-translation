  text: Should your springs be scattered abroad[b][a], streams of water in the streets?
translation:
  language: id
  text: Haruskah mata airmu terpencar ke luar[b][a] sebagai aliran air di jalan-jalan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Biarlah mata airmu terpencar ke luar sebagai aliran air di jalan-jalan.” Bentuk Ibraninya dapat dibaca demikian, tetapi konteks yang lebih luas sangat mendukung pembacaan sebagai pertanyaan retoris.
    reason: alternative_reading
  - marker: b
    text: Dalam konteks kesetiaan perkawinan (lihat Ams. 5:15–18), gambaran air ini secara metaforis merujuk pada daya seksual dan keturunan seorang laki-laki.
    reason: cross_reference
lexical_decisions:
- source_word: יָפ֣וּצוּ
  choice: Haruskah ... tersebar
  rationale: Bentuk Qal dari פוץ berarti ‘tersebar’ atau ‘tercerai-berai’. Dalam alur nasihat ayat 15–17, pertanyaan retoris paling alami menyampaikan larangan tersirat tanpa menambahkan kata yang tidak terdapat dalam teks.
- source_word: מַעְיְנֹתֶיךָ
  choice: mata airmu
  rationale: מַעְיָן berarti mata air atau sumber air. ‘Mata air’ alami dalam bahasa Indonesia dan mempertahankan gambaran puitis tentang air.
- source_word: חוּצָה
  choice: ke luar
  rationale: Adverbia ini menunjukkan arah ke luar. ‘Ke luar’ mempertahankan unsur gerak menuju ruang di luar lingkup pribadi.
- source_word: בָּרְחֹבוֹת
  choice: di tempat-tempat umum
  rationale: רְחֹבוֹת menunjuk pada jalan-jalan lebar, lapangan, atau ruang terbuka publik. ‘Tempat-tempat umum’ mempertahankan kontras antara ranah pribadi dan publik tanpa membatasi gambaran hanya pada jalan.
- source_word: פַּלְגֵי מָיִם
  choice: aliran-aliran air
  rationale: פֶּלֶג dapat berarti saluran atau aliran air. ‘Aliran-aliran air’ jelas, alami, dan sejajar secara puitis dengan ‘mata air’.
theological_decisions:
- issue: Apakah baris ini merupakan pernyataan, seruan, atau pertanyaan retoris dalam nasihat tentang kesetiaan perkawinan
  choice: 'Diterjemahkan sebagai pertanyaan retoris: ‘Haruskah mata airmu tersebar ke luar ...?’'
  alternative: 'Dapat diterjemahkan lebih harfiah sebagai seruan/jusif: ‘Biarlah mata airmu tersebar ke luar ...,’ atau sebagai pernyataan.'
  rationale: Teks Ibrani tidak memuat partikel tanya sehingga bentuknya tetap ambigu. Namun, konteks Amsal 5:15–17 menekankan kenikmatan yang eksklusif dalam perkawinan, dan ayat 17 mengatakan bahwa semuanya itu harus menjadi milik sendiri, bukan milik orang asing. Pertanyaan retoris mempertahankan alur peringatan tanpa menyelesaikan ambiguitas secara diam-diam; bentuk alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Ungkapan ‘mata air’ serta ‘aliran-aliran air’ mempertahankan paralelisme Ibrani, sedangkan ‘tempat-tempat umum’ mencakup jalan lebar dan lapangan publik yang dapat dimaksud oleh רְחֹבוֹת.
