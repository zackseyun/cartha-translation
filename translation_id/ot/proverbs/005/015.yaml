  terminology: Istilah “sumur” untuk בְּאֵר tepat. “Tempat penampungan air” merupakan padanan aman bagi בּוֹר dalam konteks ini dan tidak memaksakan identifikasi teknis yang terlalu sempit. Kata “sendiri” secara memadai menyampaikan sufiks posesif serta penekanan kontekstual, tanpa menambahkan penafsiran seksual ke teks utama.
