  variant: modern standard Indonesian
source:
  edition: WLC
  text: שְׁתֵה מַ֥יִם מִ/בּוֹרֶ֑/ךָ וְ֝/נֹזְלִ֗ים מִ/תּ֥וֹךְ בְּאֵרֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/015.yaml
  text: Drink water from your own cistern[a], and flowing water from your own well.
translation:
  language: id
  text: Minumlah air dari tempat penampungan airmu sendiri, dan air yang mengalir dari dalam sumurmu sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan apa yang mengalir dari dalam sumurmu sendiri.” Partisipel Ibrani dapat diterjemahkan lebih harfiah tanpa melengkapi kata “air”.
    reason: Alternatif leksikal yang mempertahankan bentuk eliptis bahasa Ibrani.
lexical_decisions:
- source_word: שְׁתֵה
  choice: Minumlah
  rationale: Bentuk imperatif Qal orang kedua tunggal maskulin dari שׁתה. Akhiran -lah menyampaikan perintah secara wajar dan bermartabat dalam bahasa Indonesia.
- source_word: מַיִם
  choice: air
  rationale: Makna lazim kata ini adalah air; bentuk jamak morfologis Ibrani diterjemahkan secara idiomatis sebagai nomina tak terhitung dalam bahasa Indonesia.
- source_word: מִבּוֹרֶךָ
  choice: dari tempat penampungan airmu sendiri
  rationale: בּוֹר dapat berarti lubang atau tempat penampungan air. Pilihan ini membedakannya dari בְּאֵר, ‘sumur’, dan tetap mudah dipahami pembaca modern. ‘Sendiri’ menonjolkan kepunyaan dan sifat eksklusif yang tersirat dalam konteks.
- source_word: וְנֹזְלִים
  choice: dan air yang mengalir
  rationale: Partisipel נזל berarti ‘mengalir’. Kata ‘air’ dilengkapi dari kesejajaran dengan klausa pertama agar ungkapannya alami tanpa mengubah citra konkret.
- source_word: מִתּוֹךְ
  choice: dari dalam
  rationale: תּוֹךְ menunjuk bagian dalam atau tengah. ‘Dari dalam’ mempertahankan gagasan asal aliran secara langsung.
- source_word: בְּאֵרֶךָ
  choice: sumurmu sendiri
  rationale: בְּאֵר biasanya berarti ‘sumur’. Citra konkret dipertahankan, sedangkan ‘sendiri’ menyampaikan penekanan kepunyaan yang sesuai dengan konteks.
theological_decisions:
- issue: Apakah metafora tentang kesetiaan perkawinan perlu dijelaskan secara eksplisit dalam teks utama
  choice: Mempertahankan gambaran harfiah tentang air, tempat penampungan, dan sumur
  alternative: Menerjemahkan secara interpretatif, misalnya ‘Nikmatilah istrimu sendiri’
  rationale: Bahasa sumber sengaja memakai metafora, sementara konteks di sekitarnya menjelaskan penerapannya. Mengeksplisitkan makna perkawinan di dalam ayat ini akan mengubah penerjemahan menjadi tafsiran dan menghilangkan daya sastranya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. ‘Tempat penampungan air’ dipilih alih-alih istilah yang lebih arkais seperti ‘kulah’ atau ‘perigi’, sekaligus menjaga pembedaan antara בּוֹר dan בְּאֵר. Paralelisme dan metafora sumber dipertahankan.
