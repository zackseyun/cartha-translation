  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lalu engkau akan berkata”; bentuk perfektif Ibrani di sini dapat dipahami dengan makna futur atau akibat dalam rangkaian peringatan sang ayah.
