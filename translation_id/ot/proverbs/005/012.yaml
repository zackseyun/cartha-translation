lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: lalu engkau berkata
  rationale: Bentuk perfektif orang kedua tunggal maskulin dengan penghubung, dalam rangkaian peringatan ini, menyatakan akibat yang dibayangkan secara hidup. Bentuk kini naratif bahasa Indonesia mempertahankan daya langsungnya; kemungkinan makna futur dicatat dalam catatan kaki.
- source_word: אֵיךְ
  choice: Betapa
  rationale: Kata ini membuka seruan penyesalan, bukan pertanyaan yang meminta informasi. “Betapa” menyampaikan tekanan emosional itu secara alami.
- source_word: שָׂנֵאתִי
  choice: aku membenci
  rationale: Bentuk perfektif orang pertama tunggal merupakan pengakuan retrospektif. Dalam kutipan langsung bahasa Indonesia, bentuk verba tanpa penandaan waktu eksplisit tetap alami dan konteks menunjukkan penyesalan atas sikap lampau.
- source_word: מוּסָר
  choice: didikan
  rationale: Dalam Amsal, kata ini mencakup pembentukan, pengajaran, dan disiplin yang mengoreksi. “Didikan” paling alami dalam bahasa Indonesia dan tetap memuat unsur pembentukan.
- source_word: וְתוֹכַחַת
  choice: teguran
  rationale: Nomina ini menunjuk pada koreksi verbal atau kecaman yang bertujuan meluruskan. “Teguran” jelas, modern, dan sesuai dengan register sastra hikmat.
- source_word: נָאַץ
  choice: meremehkan
  rationale: Verba ini menyatakan penghinaan atau penolakan dengan sikap merendahkan. “Meremehkan” cocok dengan subjek “hatiku” dan mempertahankan paralelisme dengan “membenci” tanpa menyamakan kedua verba.
- source_word: לִבִּי
  choice: hatiku
  rationale: Ungkapan harfiah dipertahankan karena “hati” dalam bahasa Ibrani menunjuk pada batin, kehendak, dan pikiran, sekaligus memberi kekuatan puitis.
