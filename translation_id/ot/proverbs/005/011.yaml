  text: dan engkau mengerang[a] pada kesudahanmu[b], ketika dagingmu dan tubuhmu habis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “engkau merintih”; kata kerja Ibrani ini menggambarkan seruan penderitaan yang terdengar.
    reason: lexical_alternative
  - marker: b
