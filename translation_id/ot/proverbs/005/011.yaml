    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָהַמְתָּ
  choice: dan engkau mengerang
  rationale: Kata kerja נהם menggambarkan suara berat yang terdengar karena kesusahan. “Mengerang” menyampaikan penyesalan penuh derita secara alami dalam bahasa Indonesia.
- source_word: בְאַחֲרִיתֶךָ
  choice: pada akhir hidupmu
  rationale: אַחֲרִית dapat menunjuk pada akhir kehidupan maupun kesudahan atau hasil akhir. Ungkapan ini alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan kemungkinan makna yang lebih luas.
- source_word: בִּכְלוֹת
  choice: ketika ... habis binasa
  rationale: Infinitif dari כלה menyatakan keadaan atau waktu ketika sesuatu menjadi habis. Dalam kaitannya dengan daging dan tubuh, “habis binasa” mengungkapkan kerusakan jasmani yang tuntas.
- source_word: בְּשָׂרְךָ
  choice: daging
  rationale: בשר secara konkret berarti “daging”; mempertahankannya menjaga gambaran Ibrani serta perbedaannya dari unsur paralel berikutnya.
- source_word: וּשְׁאֵרֶךָ
  choice: dan tubuhmu
  rationale: Dalam paralel dengan בשר dan konteks kehancuran jasmani, שאר paling wajar dipahami sebagai tubuh atau raga. “Tubuh” jelas dan alami bagi pembaca modern.
theological_decisions:
- issue: Cakupan makna אַחֲרִיתֶךָ
  choice: Teks utama memakai “akhir hidupmu”, dengan catatan bahwa maknanya juga dapat mencakup kesudahan atau hasil akhir.
  alternative: pada kesudahanmu
  rationale: Bahasa Ibrani dapat menunjuk sekaligus pada tahap akhir kehidupan dan akibat terakhir dari jalan yang dipilih. Catatan kaki menghindari pembatasan tafsir secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “engkau” sesuai dengan sapaan langsung dalam sastra hikmat. Urutan penanda [a][b] mengikuti kemunculan unsur yang dijelaskan dalam teks.
