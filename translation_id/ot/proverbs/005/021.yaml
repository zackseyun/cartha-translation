  text: כִּ֤י נֹ֨כַח עֵינֵ֣י יְ֭הוָה דַּרְכֵי אִ֑ישׁ וְֽ/כָל מַעְגְּלֹתָ֥י/ו מְפַלֵּֽס׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/021.yaml
  text: For a man's ways are before the eyes of Yahweh[a], and he watches all his paths.
translation:
  language: id
  text: Sebab jalan-jalan seseorang ada di depan mata Yahweh, dan Dia menimbang semua lintasannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “menimbang” dapat pula dipahami sebagai “mengukur” atau “menilai”; dalam konteks lain, kata ini dapat berarti “meratakan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai bahwa ayat ini memberikan alasan bagi peringatan sebelumnya; “Sebab” mempertahankan hubungan penjelas itu secara alami.
- source_word: נֹכַח עֵינֵי יְהוָה
  choice: ada di depan mata Yahweh
  rationale: Mempertahankan gambaran antropomorfis bahwa seluruh perilaku manusia tampak di hadapan Yahweh, tanpa mereduksinya menjadi pernyataan abstrak tentang pengetahuan-Nya.
- source_word: דַּרְכֵי אִישׁ
  choice: jalan-jalan seseorang
  rationale: אִישׁ dipakai secara generik. Bahasa Indonesia tidak menandai gender gramatikal pada “seseorang”, sehingga pilihan ini menyampaikan cakupan umum tanpa menambah atau menghilangkan kontras gender yang tidak berfungsi dalam konteks.
- source_word: מַעְגְּלֹתָיו
  choice: setiap jejak langkahnya
  rationale: Ungkapan ini mempertahankan citra perjalanan hidup dan membedakannya secara wajar dari דְּרָכִים, sambil menunjuk pada seluruh perilaku orang tersebut.
- source_word: מְפַלֵּס
  choice: menimbang
  rationale: Bentuk partisipel ini dapat menggambarkan tindakan mengukur atau menilai suatu jalan. “Menimbang” mempertahankan metafora evaluatif dan lebih dekat pada cakupan leksikal verba daripada sekadar “mengamati”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; “Yahweh” mempertahankan nama diri itu dan sesuai dengan kebijakan proyek.
- issue: Subjek tersirat pada מְפַלֵּס
  choice: Dia, yaitu Yahweh
  alternative: tanpa menyatakan ulang subjek
  rationale: Secara sintaksis, Yahweh adalah subjek yang paling wajar bagi verba pada klausa kedua. “Dia” membuat kesinambungan subjek jelas dalam bahasa Indonesia tanpa menambahkan gagasan teologis baru.
- issue: Daya nilai metafora מְפַלֵּס
  choice: Yahweh menimbang jalan manusia
  alternative: Yahweh mengamati jalan manusia; Yahweh meratakan jalan manusia
  rationale: Konteks menekankan bahwa tingkah laku manusia berada dalam pengawasan dan penilaian ilahi. Namun, karena verba tersebut memiliki rentang makna yang nyata, kemungkinan lain dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme puitis dipertahankan melalui “jalan-jalan” dan “jejak langkah”, sedangkan nama ilahi ditransliterasikan sebagai “Yahweh”.
