  yaml_path: translation/ot/proverbs/005/006.yaml
  text: Lest she should level the path of life[a], her tracks wander[b]; she does not know it.
translation:
  language: id
  text: Supaya engkau tidak mempertimbangkan jalan kehidupan[a], jalur-jalurnya tidak menentu; ia sendiri tidak menyadarinya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jangan sampai ia meratakan jalan kehidupan.” Verba Ibrani ini dapat dipahami dengan subjek perempuan itu; kata kerjanya juga dapat berarti “meratakan” atau “meluruskan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “engkau tidak mengetahuinya,” jika klausa terakhir dipahami sebagai sapaan kepada pendengar, bukan sebagai gambaran tentang perempuan itu.
    reason: alternative_reading
lexical_decisions:
- source_word: אֹרַח חַיִּים
  choice: jalan kehidupan
  rationale: אֹרַח berarti jalan atau jalur, sedangkan חַיִּים berarti kehidupan. Pilihan ini mempertahankan metafora perjalanan dan terdengar wajar dalam bahasa Indonesia.
- source_word: פֶּן
  choice: jangan sampai
  rationale: פֶּן lazim memperkenalkan maksud atau kemungkinan negatif. 'Jangan sampai' menyampaikan nuansa pencegahan secara alami dalam bahasa Indonesia modern.
- source_word: תְּפַלֵּס
  choice: meratakan
  rationale: Bentuk piel dari פלס dapat berarti meratakan atau meluruskan, juga menimbang atau mempertimbangkan. 'Meratakan' mempertahankan gambaran konkret tentang jalan tanpa menutup kemungkinan analisis lain, yang dicatat dalam catatan kaki.
- source_word: נָעוּ
  choice: mengembara
  rationale: Kata kerja ini menggambarkan gerak yang goyah, menyimpang, atau tidak tetap. 'Mengembara' cocok dengan metafora jejak yang tidak mengikuti arah tetap.
- source_word: מַעְגְּלֹתֶיהָ
  choice: jejak-jejaknya
  rationale: מַעְגָּל menunjuk pada lintasan, jalur, atau jejak. 'Jejak-jejaknya' membedakannya dari אֹרַח sambil mempertahankan metafora perjalanan.
- source_word: לֹא תֵדָע
  choice: ia tidak mengetahuinya
  rationale: Dalam konteks ayat 3–6, subjek feminin paling wajar merujuk kepada perempuan yang sedang digambarkan. Akhiran '-nya' menyatakan objek tersirat tanpa menentukan secara berlebihan apa tepatnya yang tidak ia ketahui.
theological_decisions:
- issue: Subjek klausa terakhir
  choice: 'Klausa terakhir tetap menggambarkan perempuan itu: ''ia tidak mengetahuinya.'''
  alternative: '''Engkau tidak mengetahuinya,'' dengan klausa terakhir ditujukan kepada pendengar.'
  rationale: Konteks sekitar memakai orang ketiga feminin untuk menggambarkan perempuan tersebut. Namun, karena bentuk dan tradisi pembacaan dapat dipahami sebagai sapaan kepada pendengar, kemungkinan itu dipertahankan dalam catatan kaki.
- issue: Hubungan sintaksis klausa pertama
  choice: פֶּן תְּפַלֵּס dipahami sebagai 'jangan sampai ia meratakan.'
  alternative: '''Ia tidak mempertimbangkan jalan kehidupan,'' atau ''Janganlah engkau mempertimbangkan jalan kehidupan; jalan-jalannya mengembara.'''
  rationale: Bahasa Ibrani ayat ini sangat padat, dan פלס memiliki rentang makna dari meratakan hingga menimbang atau mempertimbangkan. Teks utama mempertahankan metafora jalan menurut pembacaan yang diaudit, sedangkan alternatif penting dicatat tanpa memaksakan penyelesaian.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Metafora jalan dan jejak dipertahankan. Susunan kalimat sengaja tetap agak padat untuk mencerminkan kepadatan dan ambiguitas teks Ibrani, dengan dua kemungkinan utama dijelaskan dalam catatan kaki.
