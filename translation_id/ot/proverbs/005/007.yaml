source:
  edition: WLC
  text: וְ/עַתָּ֣ה בָ֭נִים שִׁמְעוּ לִ֑/י וְ/אַל תָּ֝ס֗וּרוּ מֵ/אִמְרֵי פִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/007.yaml
  text: And now[a], sons, listen to me, and do not turn aside from the words of my mouth.
translation:
  language: id
  text: Dan sekarang, hai anak-anak lelaki,[a] dengarkanlah aku, dan jangan menyimpang dari perkataan mulutku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "anak-anak". Kata Ibrani yang digunakan berbentuk jamak maskulin ("anak-anak lelaki").
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Dan sekarang
  rationale: Gabungan kata penghubung dan keterangan waktu menandai kesinambungan sekaligus peralihan menuju nasihat baru.
- source_word: בָנִים
  choice: anak-anak lelaki
  rationale: Bentuk Ibrani ini adalah jamak maskulin dan secara harfiah berarti 'anak-anak lelaki'; sapaan 'hai' membuat bentuk vokatifnya alami dalam bahasa Indonesia tanpa menambahkan kata milik 'ku' yang tidak terdapat dalam ayat ini.
- source_word: שִׁמְעוּ לִי
  choice: dengarkanlah aku
  rationale: Ungkapan ini memerintahkan pendengaran penuh perhatian dan dapat menyiratkan ketaatan; 'dengarkanlah' mempertahankan makna dasarnya tanpa mempersempitnya menjadi 'taatilah'.
- source_word: וְאַל תָּסוּרוּ
  choice: dan jangan menyimpang
  rationale: Kata kerja סור menggambarkan tindakan berbelok atau menyimpang, sesuai dengan gambaran jalan yang lazim dalam sastra hikmat.
- source_word: מֵאִמְרֵי פִי
  choice: dari perkataan mulutku
  rationale: Terjemahan ini mempertahankan ungkapan tubuh dalam bahasa Ibrani beserta nuansa retorisnya, tetapi tetap jelas dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Partikel -lah mempertahankan nada nasihat yang sungguh-sungguh; ungkapan 'perkataan mulutku' sengaja dipertahankan karena jelas dan mencerminkan gaya puitis sumber.
