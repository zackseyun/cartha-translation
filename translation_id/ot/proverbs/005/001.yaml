  text: My son[a], pay attention to my wisdom; incline your ear to my understanding[b],
translation:
  language: id
  text: Anakku, perhatikanlah hikmatku; arahkanlah telingamu kepada pengertianku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנִי
  choice: Anakku
  rationale: Sapaan ini secara gramatikal berbentuk maskulin tunggal dan secara harfiah berarti “anakku” atau “putraku”. “Anakku” alami dalam bahasa Indonesia dan mempertahankan hubungan ayah/guru dengan anak laki-laki tanpa mempersempitnya menjadi istilah biologis yang lebih kaku.
- source_word: לְחָכְמָתִי
  choice: hikmatku
  rationale: חָכְמָה berarti “hikmat”. Bentuk nomina dipertahankan, sedangkan prefiks ל dipahami sebagai penanda sasaran perhatian setelah הַקְשִׁיבָה.
- source_word: הַקְשִׁיבָה
  choice: perhatikanlah
  rationale: Imperatif ini menyatakan tindakan mendengarkan dengan sungguh-sungguh. “Perhatikanlah” merupakan ungkapan Indonesia yang alami dan mencakup unsur perhatian penuh.
- source_word: לִתְבוּנָתִי
  choice: kepada pengertianku
  rationale: תְּבוּנָה dapat berarti pengertian, daya memahami, atau kebijaksanaan praktis. “Pengertianku” mempertahankan bentuk nomina abstrak dan kesejajarannya dengan “hikmatku” tanpa menambahkan tafsiran.
- source_word: הַט
  choice: arahkanlah
  rationale: Imperatif נטה secara harfiah berarti mengarahkan, mencondongkan, atau membentangkan. Bersama “telinga”, kata ini membentuk metafora untuk mendengarkan dengan penuh perhatian; “arahkanlah” mempertahankan gambaran itu secara alami.
- source_word: אָזְנֶךָ
  choice: telingamu
  rationale: Bentuk Ibrani tunggal dipertahankan. Dalam bahasa Indonesia, “arahkanlah telingamu” dapat dipahami sebagai gambaran mendengarkan dengan saksama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme dua larik Ibrani dipertahankan melalui pasangan “perhatikanlah” dan “arahkanlah telingamu”, serta “hikmatku” dan “pengertianku”. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan ambiguitas penting yang harus dipertahankan bagi pembaca.
