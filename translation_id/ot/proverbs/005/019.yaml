  text: a loving doe[a], a graceful mountain goat—may her breasts satisfy you at all times[b]; be intoxicated always with her love.
translation:
  language: id
  text: Rusa betina yang penuh kasih, kambing gunung[a] yang anggun—kiranya buah dadanya memuaskanmu setiap saat; hendaklah engkau senantiasa dimabukkan oleh cintanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani untuk “kambing gunung” menunjuk pada kambing liar pegunungan, kemungkinan ibeks.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “dimabukkan” biasanya dapat berarti “menyimpang” atau “tersesat”; di sini kata itu dipakai secara positif untuk keadaan terbawa oleh cinta.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֶּלֶת אֲהָבִים
  choice: rusa betina yang penuh kasih
  rationale: אַיֶּלֶת berarti rusa betina, sedangkan אֲהָבִים menggambarkannya sebagai sosok yang berkaitan dengan kasih atau cinta. Ungkapan ini mempertahankan metafora hewani dan nada kasih dalam pernikahan.
- source_word: וְיַעֲלַת חֵן
  choice: kambing gunung yang anggun
  rationale: יַעֲלָה menunjuk pada kambing liar pegunungan, kemungkinan ibeks, dan חֵן menyatakan keelokan atau keanggunan. Pilihan ini jelas bagi pembaca umum serta mempertahankan kesejajaran puitis.
- source_word: דַּדֶּיהָ
  choice: buah dadanya
  rationale: Kata ini secara konkret berarti payudara. 'Buah dadanya' merupakan ungkapan Indonesia yang wajar dan tetap eksplisit sesuai konteks kenikmatan seksual dalam pernikahan.
- source_word: יְרַוֻּךָ
  choice: biarlah ... memuaskanmu
  rationale: Bentuk dari רוה menyampaikan gagasan minum sampai puas, dipenuhi, atau dipuaskan secara berlimpah. Dalam konteks ini, 'memuaskanmu' menyampaikan kenikmatan sensual dengan alami.
- source_word: בְכָל עֵת
  choice: setiap waktu
  rationale: Terjemahan langsung dan idiomatis untuk frasa temporal yang berarti pada segala waktu atau senantiasa.
- source_word: בְאַהֲבָתָהּ
  choice: oleh cintanya
  rationale: Preposisi ב dapat menunjukkan sarana atau penyebab. 'Oleh cintanya' menyatu secara alami dengan gambaran dimabukkan dan tetap berpusat pada cinta sang istri.
- source_word: תִּשְׁגֶּה
  choice: hendaklah engkau ... dimabukkan
  rationale: שׁגה biasanya dapat berarti menyimpang atau tersesat, tetapi di sini dipakai secara positif untuk keadaan terbawa atau dikuasai oleh cinta. 'Dimabukkan' mempertahankan daya metaforis dan kesejajaran dengan kepuasan pada baris sebelumnya.
- source_word: תָמִיד
  choice: senantiasa
  rationale: Kata keterangan ini menyatakan keberlangsungan terus-menerus. 'Senantiasa' sesuai dengan laras puitis yang bermartabat.
theological_decisions:
- issue: Gambaran erotis dalam pernikahan pada sastra hikmat
  choice: Mempertahankan gambaran seksual dalam pernikahan secara konkret tanpa mengaburkannya.
  alternative: Melunakkan ungkapan menjadi 'pelukannya' atau sekadar 'kasih sayangnya'.
  rationale: Konteks Amsal 5 menganjurkan kenikmatan bersama istri sebagai kebalikan dari perzinaan. Kejelasan anatomi dan sensualitas ayat mencerminkan teks Ibrani tanpa memasukkan sikap malu yang tidak terdapat di dalamnya.
- issue: Nuansa positif dari verba שׁגה
  choice: Menerjemahkannya sebagai 'dimabukkan' dan mencatat arti dasarnya dalam catatan kaki.
  alternative: Menerjemahkannya secara harfiah sebagai 'tersesat' atau secara lebih lunak sebagai 'terpesona'.
  rationale: Konteks mengubah verba yang lazimnya negatif menjadi gambaran positif tentang terbawa oleh cinta. Catatan kaki menjaga ketegangan leksikal tersebut tanpa membuat teks utama janggal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama puitis yang tetap mudah dipahami. Bentuk 'hendaklah' mempertahankan daya anjuran yang kuat, sementara 'buah dadanya' menjaga kejelasan erotis teks dalam laras yang bermartabat.
