  yaml_path: translation/ot/proverbs/005/017.yaml
  text: Let them be for you alone[a], and not for strangers with you.
translation:
  language: id
  text: Biarlah semuanya itu menjadi milikmu seorang[a], dan jangan dibagikan kepada orang-orang asing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Biarlah semuanya itu hanya untukmu, dan bukan untuk orang-orang asing bersamamu.” “Orang-orang asing” di sini menunjuk kepada pihak di luar ikatan perkawinan, bukan terutama orang asing secara etnis. Ayat ini melanjutkan metafora mata air dan aliran air dalam konteks sebelumnya serta menekankan kesetiaan eksklusif dalam perkawinan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Biarlah semuanya itu menjadi
  rationale: Bentuk imperfek Qal orang ketiga jamak berfungsi sebagai jusif dalam rangkaian nasihat; “Biarlah” menyampaikan daya kehendak itu secara alami.
- source_word: לְךָ לְבַדֶּךָ
  choice: milikmu seorang
  rationale: Gabungan לְךָ dengan לְבַדֶּךָ menyatakan kepemilikan atau peruntukan yang eksklusif. “Milikmu seorang” alami dalam bahasa Indonesia dan mempertahankan penekanannya.
- source_word: וְאֵין
  choice: dan jangan
  rationale: Negasi eksistensial dalam konteks nasihat menyampaikan pengecualian atau larangan; “dan jangan” mengungkapkan daya tersebut dengan jelas.
- source_word: לְזָרִים
  choice: dengan orang-orang lain
  rationale: זָרִים di sini menunjuk kepada pihak di luar ikatan yang dimaksud, bukan khusus orang asing secara etnis. “Orang-orang lain” menyampaikan makna relasional itu tanpa konotasi etnis.
- source_word: אִתָּךְ
  choice: dibagi dengan
  rationale: Secara harfiah berarti “bersamamu”; dalam konstruksi negatif ini maksudnya ialah bahwa pihak lain tidak turut memiliki atau menikmati apa yang diperuntukkan bagi sang penerima nasihat.
theological_decisions:
- issue: Eksklusivitas dalam metafora mata air dan aliran air
  choice: Mempertahankan penekanan pada kepemilikan eksklusif tanpa menjelaskan metafora di dalam ayat
  alternative: Menambahkan secara eksplisit bahwa ayat ini berbicara tentang kesetiaan dalam perkawinan
  rationale: Konteks mengarah pada kesetiaan perkawinan, tetapi ayat ini sendiri meneruskan metafora sebelumnya. Penjelasan ditempatkan dalam catatan kaki agar ketegangan puitis teks tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. “Milikmu seorang” mempertahankan tekanan ganda pada kepemilikan dan eksklusivitas; “orang-orang lain” menghindari salah tafsir etnis dari זָרִים.
