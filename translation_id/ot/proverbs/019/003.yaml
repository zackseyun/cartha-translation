id: PRO.19.3
reference: Proverbs 19:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִוֶּ֣לֶת אָ֭דָם תְּסַלֵּ֣ף דַּרְכּ֑/וֹ וְ/עַל יְ֝הוָ֗ה יִזְעַ֥ף לִבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/003.yaml
  text: A man's folly ruins his way[b][a], and his heart rages against Yahweh.
translation:
  language: id
  text: Kebodohan seseorang[a] merusak jalan hidupnya[b], tetapi hatinya geram terhadap Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai bentuk tunggal generik yang menunjuk kepada seseorang pada umumnya.
    reason: cultural_note
  - marker: b
    text: Secara lebih harfiah, “membengkokkan jalannya”; dapat juga diterjemahkan “menyimpangkan jalan hidupnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִוֶּלֶת
  choice: kebodohan
  rationale: Menunjukkan sifat atau keadaan bodoh dan mempertahankan pertentangan khas sastra hikmat antara kebodohan dan hikmat.
- source_word: אָדָם
  choice: seseorang
  rationale: Nomina tunggal ini digunakan secara generik untuk seorang manusia pada umumnya. “Seseorang” mempertahankan bentuk individual peribahasa secara alami dalam bahasa Indonesia.
- source_word: תְּסַלֵּף
  choice: merusak
  rationale: Bentuk piel dari סלף berarti membuat bengkok, menyimpangkan, atau mengacaukan. Dalam konteks perjalanan hidup, “merusak” menyampaikan akibat praktisnya dengan jelas, sedangkan citra harfiahnya dicatat dalam catatan kaki.
- source_word: דַּרְכּוֹ
  choice: jalan hidupnya
  rationale: “Jalan” merupakan metafora sastra hikmat untuk perilaku dan arah kehidupan. “Jalan hidup” membuat makna metaforis itu jelas tanpa menghilangkan citra dasarnya.
- source_word: וְעַל
  choice: tetapi ... terhadap
  rationale: 'Waw secara bentuk adalah penghubung, tetapi hubungan antarklausa bersifat kontras: orang itu merusak jalannya sendiri, namun menjadi geram terhadap Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה secara langsung dan membedakannya dari gelar “Tuhan”.
- source_word: יִזְעַף
  choice: geram
  rationale: Kata kerja ini menyatakan kemarahan atau kejengkelan yang kuat. “Geram” alami dalam bahasa Indonesia dan mempertahankan intensitas reaksi batin tersebut.
- source_word: לִבּוֹ
  choice: hatinya
  rationale: Mempertahankan ungkapan antropologis Ibrani, dengan hati sebagai pusat pikiran, kehendak, dan emosi batin.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar.
- issue: Cakupan generik אָדָם
  choice: seseorang
  alternative: seorang laki-laki atau manusia
  rationale: Di sini bentuk tunggal אָדָם menunjuk secara umum kepada setiap individu, bukan secara khusus kepada laki-laki. “Seseorang” menyatakan cakupan itu secara wajar dan tidak mempersempit makna sumber.
- issue: Hubungan antara kebodohan manusia dan kemarahan terhadap Allah
  choice: tetapi
  alternative: dan
  rationale: 'Waw memungkinkan koordinasi sederhana, tetapi konteks peribahasa menonjolkan ironi dan kontras: manusia merusak jalannya sendiri, lalu hatinya memusuhi Yahweh. “Tetapi” menyatakan hubungan pragmatis ini tanpa mengubah pihak yang bertanggung jawab.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan ringkas dengan gaya peribahasa yang berwibawa. “Jalan hidup” mempertahankan metafora hikmat sekaligus mudah dipahami pembaca umum; “geram” menjaga intensitas emosi tanpa terdengar arkais.
