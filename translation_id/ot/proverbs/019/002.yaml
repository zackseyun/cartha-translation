base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/002.yaml
  text: Also[a], without knowledge, desire is not good, and whoever hurries with his feet sins.
translation:
  language: id
  text: Juga, tanpa pengetahuan, keinginan tidaklah baik,[a] dan orang yang tergesa-gesa dalam melangkah berbuat dosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Orang tanpa pengetahuan tidaklah baik.” Frasa Ibrani yang memakai נֶפֶשׁ dapat dipahami dengan lebih dari satu cara; dalam teks utama kata itu dipahami secara idiomatis sebagai “keinginan” atau “hasrat”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Juga
  rationale: Mempertahankan daya aditif kata Ibrani dan kaitannya dengan pengamatan hikmat di sekitarnya.
- source_word: בְּלֹא דַעַת
  choice: tanpa pengetahuan
  rationale: Merupakan padanan langsung yang tetap membuka cakupan moral dan intelektual דַעַת dalam sastra hikmat.
- source_word: נֶפֶשׁ
  choice: keinginan
  rationale: Dalam konteks ini נֶפֶשׁ paling wajar dipahami secara idiomatis sebagai dorongan batin atau hasrat, bukan sebagai istilah teknis untuk jiwa.
- source_word: לֹא טוֹב
  choice: tidaklah baik
  rationale: Mempertahankan kesederhanaan predikat Ibrani serta nada amsal yang tegas dan bermartabat.
- source_word: וְאָץ
  choice: orang yang tergesa-gesa
  rationale: Bentuk partisip menyatakan orang yang bertindak dengan tergesa-gesa sebagai ciri atau kebiasaan.
- source_word: בְּרַגְלַיִם
  choice: melangkahkan kaki
  rationale: Menjaga gambaran konkret tentang kaki sambil menghasilkan ungkapan Indonesia yang alami; frasa ini menggambarkan tindakan yang dilakukan secara terburu-buru.
- source_word: חוֹטֵא
  choice: berbuat dosa
  rationale: Menjaga bobot moral akar חטא, yang di sini dapat mencakup tindakan salah dan kegagalan praktis.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam klausa pertama
  choice: Dipahami secara idiomatis sebagai “keinginan”.
  alternative: Klausa dapat dipahami sebagai “orang tanpa pengetahuan tidaklah baik”.
  rationale: Susunan Ibrani memungkinkan lebih dari satu hubungan sintaksis. Teks utama mengikuti pembacaan yang menekankan bahaya dorongan batin tanpa pengetahuan, sedangkan catatan kaki mempertahankan pembacaan alternatif tanpa memutuskannya secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Susunan awal mempertahankan penekanan sumber pada “tanpa pengetahuan”. Ungkapan “melangkahkan kaki” mempertahankan citraan tubuh Ibrani tanpa terdengar kaku.
