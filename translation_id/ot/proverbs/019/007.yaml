  text: כָּ֥ל אֲחֵי רָ֨שׁ שְֽׂנֵאֻ֗/הוּ אַ֤ף כִּ֣י מְ֭רֵעֵ/הוּ רָחֲק֣וּ מִמֶּ֑/נּוּ מְרַדֵּ֖ף אֲמָרִ֣ים לא הֵֽמָּה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/007.yaml
  text: All the brothers of a poor man hate him[a]; how much more do his friends keep far from him! He pursues words[b], but they are not there.
translation:
  language: id
  text: Semua saudara orang miskin membencinya[a]; terlebih lagi sahabat-sahabatnya menjauh darinya! Ia mengejar kata-kata, tetapi semua itu tidak ada.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “saudara” berbentuk maskulin; dalam latar sosial amsal ini, istilah tersebut menunjuk kepada anggota keluarga.
    reason: cultural_note
  - marker: b
    text: Atau, “Ia mengejar kata-kata yang tidak berarti,” atau “Ia mengejar janji-janji, tetapi semuanya tidak ada.” Klausa terakhir ini sulit ditafsirkan dari segi teks dan susunan bahasa Ibrani.
    reason: alternative_reading
lexical_decisions:
- source_word: רָשׁ
  choice: orang miskin
  rationale: Menunjuk kepada seseorang yang miskin atau berkekurangan. Bahasa Indonesia tidak perlu menandai gender gramatikal maskulin pada nomina ini.
- source_word: אֲחֵי
  choice: saudara
  rationale: Mempertahankan hubungan kekeluargaan yang dinyatakan secara langsung oleh bentuk Ibrani, tanpa memperluasnya menjadi sekadar kenalan atau kerabat jauh.
- source_word: שְׂנֵאֻהוּ
  choice: membencinya
  rationale: Menerjemahkan kekuatan lazim verba שׂנא secara langsung, tanpa melunakkannya menjadi sekadar meremehkan atau tidak menyukai.
- source_word: אַף כִּי
  choice: terlebih lagi
  rationale: 'Menyampaikan hubungan a fortiori: jika saudara-saudaranya saja membencinya, sahabat-sahabatnya lebih-lebih lagi menjauh.'
- source_word: מְרֵעֵהוּ
  choice: sahabat-sahabatnya
  rationale: Mengungkapkan para teman atau rekan dekat dan mempertahankan kontras dengan saudara sebagai keluarga.
- source_word: רָחֲקוּ מִמֶּנּוּ
  choice: menjauh darinya
  rationale: Ungkapan alami dalam bahasa Indonesia untuk tindakan mengambil jarak secara relasional.
- source_word: מְרַדֵּף
  choice: Ia mengejar
  rationale: Partisipel ini sulit secara sintaksis, tetapi paling mungkin meneruskan gambaran tentang orang miskin sebagai subjek. Bentuk verbal ini alami sekaligus tidak menambahkan objek yang tidak dinyatakan.
- source_word: אֲמָרִים
  choice: kata-kata
  rationale: Mempertahankan arti dasar nomina, sementara kemungkinan makna kontekstual seperti janji atau ucapan kosong dicatat dalam catatan kaki.
- source_word: לֹא הֵמָּה
  choice: semua itu tidak ada
  rationale: Mencerminkan ungkapan penutup yang singkat dan sulit, dengan anteseden jamak yang paling wajar adalah kata-kata yang dikejarnya.
