  text: ה֗וֹן יֹ֭סִיף רֵעִ֣ים רַבִּ֑ים וְ֝/דָ֗ל מֵרֵ֥ע/הוּ יִפָּרֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/004.yaml
  text: Wealth adds many friends[a], but a poor man is separated from his friend.
translation:
  language: id
  text: Kekayaan menambah banyak teman, tetapi orang miskin terpisah dari temannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ditinggalkan oleh temannya.” Kata kerja Ibrani dapat menggambarkan perpisahan tanpa menyebutkan apakah orang miskin itu menjauh atau ditinggalkan; konteksnya kuat mengarah pada pengabaian sosial.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: kekayaan
  rationale: Kata ini menunjuk pada kekayaan atau harta benda secara umum, bukan hanya uang.
- source_word: יֹסִיף
  choice: menambah
  rationale: Bentuk kausatif dari יסף berarti ‘menambah’ atau ‘memperbanyak’; pilihan ini mempertahankan gambaran bahwa kekayaan meningkatkan jumlah teman.
- source_word: רֵעִים רַבִּים
  choice: banyak teman
  rationale: רֵעִים dapat berarti teman, kawan, atau rekan. ‘Banyak teman’ alami dalam bahasa Indonesia dan sesuai dengan hubungan sosial yang dimaksud.
- source_word: דָל
  choice: orang miskin
  rationale: דָל menunjuk pada orang yang miskin, lemah, atau berkedudukan rendah. ‘Orang miskin’ jelas, wajar, dan tidak membatasi ungkapan ini pada laki-laki saja meskipun bentuk Ibraninya tunggal maskulin.
- source_word: מֵרֵעֵהוּ
  choice: dari temannya
  rationale: Preposisi מִן dengan רֵעַ dan sufiks orang ketiga tunggal secara harfiah menyatakan ‘dari temannya’; bentuk tunggal dipertahankan.
- source_word: יִפָּרֵד
  choice: terpisah
  rationale: Bentuk Niphal dari פרד dapat menyatakan keadaan terpisah tanpa menentukan apakah orang miskin itu menjauh atau ditinggalkan. ‘Terpisah’ mempertahankan ambiguitas tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang modern, ringkas, dan bernada amsal. Pengulangan ‘teman/temannya’ mempertahankan kaitan leksikal antara kedua bagian ayat.
