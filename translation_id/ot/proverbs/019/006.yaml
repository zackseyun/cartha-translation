  text: Many seek the favor of a noble man[b][a], and everyone is a friend to a man who gives gifts.
translation:
  language: id
  text: Banyak orang mencari perkenanan orang terpandang,[a] dan setiap orang bersahabat dengan orang yang memberi hadiah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang murah hati” atau “bangsawan.” Kata Ibrani נָדִיב dapat menunjuk orang yang luhur atau terpandang, dan juga orang yang murah hati.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dan setiap [orang] adalah sahabat bagi seorang laki-laki hadiah.” Ungkapan Ibrani ini berarti seorang yang memberi hadiah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: Banyak orang
  rationale: Menyatakan jumlah yang besar; penambahan “orang” membuat subjek tersiratnya jelas dan alami dalam bahasa Indonesia.
- source_word: יְחַלּוּ פְנֵי
  choice: berusaha mendapatkan perkenanan
  rationale: Ungkapan Ibrani harfiahnya berkaitan dengan “memohon wajah,” tetapi secara idiomatis berarti memohon atau mencari perkenanan seseorang.
- source_word: נָדִיב
  choice: orang yang murah hati
  rationale: Kata ini dapat menunjuk kepada orang terpandang atau bangsawan, tetapi juga berarti orang yang murah hati. Paralel dengan pemberian hadiah pada baris kedua mendukung nuansa kemurahan hati, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: וְכָל
  choice: dan setiap orang
  rationale: Mempertahankan cakupan universal ungkapan Ibrani dalam bentuk yang alami.
- source_word: הָרֵעַ
  choice: menjadi sahabat
  rationale: Bentuk teksnya padat dan dapat dipahami sebagai pernyataan bahwa setiap orang adalah atau menjadi kawan; “menjadi sahabat” menyampaikan kecenderungan sosial yang digambarkan amsal ini.
- source_word: לְאִישׁ מַתָּן
  choice: orang yang suka memberi hadiah
  rationale: Secara harfiah berarti “orang pemberian/hadiah”; terjemahan ini mengungkapkan maksud idiomatisnya secara alami tanpa menyiratkan bahwa ia hanya memiliki hadiah.
