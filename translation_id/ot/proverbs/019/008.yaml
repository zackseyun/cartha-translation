  yaml_path: translation/ot/proverbs/019/008.yaml
  text: Whoever gains sense loves his own life[b][a]; whoever keeps understanding will find good.
translation:
  language: id
  text: Orang yang memperoleh akal budi mengasihi hidupnya sendiri[a]; orang yang memelihara pengertian akan menemukan kebaikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memperoleh hati.” Dalam sastra hikmat Ibrani, “hati” sering menunjuk pada pikiran atau kemampuan untuk menimbang dan memahami. Ungkapan “hidupnya sendiri” juga dapat diterjemahkan “dirinya sendiri” atau “nyawanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹנֶה
  choice: memperoleh
  rationale: Partisipel Qal dari קנה berarti memperoleh atau mendapatkan. 'Memperoleh' terdengar alami dengan objek abstrak dan tidak menyiratkan transaksi pembelian.
- source_word: לֵּב
  choice: akal budi
  rationale: Secara harfiah berarti 'hati', tetapi dalam sastra hikmat Ibrani kata ini kerap menunjuk pada kemampuan berpikir dan menimbang. 'Akal budi' menyampaikan fungsi kognitif tersebut dalam bahasa Indonesia yang wajar.
- source_word: אֹהֵב נַפְשׁוֹ
  choice: mengasihi hidupnya sendiri
  rationale: נפשׁ di sini dapat menunjuk pada hidup atau diri seseorang, bukan hanya 'jiwa' dalam pengertian sempit. Pilihan ini sesuai dengan konteks hikmat tentang bertindak demi kebaikan hidup sendiri.
- source_word: שֹׁמֵר
  choice: memelihara
  rationale: Partisipel ini menyatakan tindakan menjaga dengan penuh perhatian dan mempertahankan. 'Memelihara' cocok untuk pengertian yang terus dijaga.
- source_word: תְּבוּנָה
  choice: pengertian
  rationale: Istilah hikmat ini menunjuk pada pemahaman, wawasan, atau daya membedakan. 'Pengertian' jelas dan alami bagi pembaca Indonesia.
- source_word: לִמְצֹא טוֹב
  choice: akan menemukan kebaikan
  rationale: Bentuk infinitif dengan ל dalam susunan pepatah ini menyatakan hasil atau tujuan. 'Akan menemukan kebaikan' mempertahankan ungkapan Ibrani tanpa mempersempit 'baik' menjadi hanya keberhasilan atau keuntungan.
theological_decisions: []
