  yaml_path: translation/ot/proverbs/019/005.yaml
  text: A false witness will not go unpunished[b][a], and one who breathes out lies will not escape.
translation:
  language: id
  text: Saksi dusta tidak akan bebas dari hukuman[a], dan orang yang mengembuskan dusta[b] tidak akan luput.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak akan dinyatakan tidak bersalah” atau “tidak akan dibebaskan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mengembuskan dusta,” suatu gambaran tentang orang yang mengucapkan dusta dengan leluasa atau terus-menerus; dapat juga diterjemahkan “mengucapkan dusta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד שְׁקָרִים
  choice: saksi dusta
  rationale: Frasa konstruksi ini menunjuk pada saksi yang kesaksiannya bercirikan kepalsuan. “Saksi dusta” alami dalam bahasa Indonesia, tetap bernuansa hukum, dan lebih tepat daripada “saksi kebohongan” yang kaku.
- source_word: יִנָּקֶה
  choice: tidak akan bebas dari hukuman
  rationale: Bentuk Nifal dari נקה dapat berarti bebas dari hukuman atau dinyatakan tidak bersalah. Dalam konteks hukum-moral amsal ini, ungkapan ini menyampaikan akibatnya secara jelas tanpa membatasi makna pada putusan pengadilan formal.
- source_word: וְיָפִיחַ כְּזָבִים
  choice: dan orang yang mengembuskan kebohongan
  rationale: Bentuk Hifil dari פוח secara harfiah menggambarkan mengembuskan atau meniupkan sesuatu, lalu digunakan secara kiasan untuk mengucapkan perkataan. Terjemahan ini mempertahankan gambaran Ibrani tentang kebohongan yang keluar dengan mudah atau terus-menerus.
- source_word: כְּזָבִים
  choice: kebohongan
  rationale: Nomina jamak ini menunjuk pada pernyataan-pernyataan palsu. Bahasa Indonesia lazim memakai bentuk tunggal kolektif “kebohongan” di sini; bentuk ulang akan terasa berat.
- source_word: יִמָּלֵט
  choice: tidak akan luput
  rationale: Bentuk Nifal dari מלט berarti meloloskan diri atau diselamatkan. “Tidak akan luput” ringkas, alami, dan mempertahankan ketidakjelasan mengenai hal atau hukuman yang tidak dapat dihindari.
