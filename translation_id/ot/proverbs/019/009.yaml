  text: עֵ֣ד שְׁ֭קָרִים לֹ֣א יִנָּקֶ֑ה וְ/יָפִ֖יחַ כְּזָבִ֣ים יֹאבֵֽד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/009.yaml
  text: A false witness will not go unpunished[b][a], and one who breathes out lies will perish.
translation:
  language: id
  text: Saksi dusta tidak akan bebas dari hukuman[a], dan orang yang mengembuskan kebohongan[b] akan binasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak akan dinyatakan tidak bersalah” atau “tidak akan lolos tanpa hukuman.” Kata kerja Ibrani dapat menekankan tidak adanya pembebasan maupun kepastian hukuman.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mengembuskan kebohongan.” Ungkapan ini menggambarkan kebohongan yang keluar semudah napas.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד שְׁקָרִים
  choice: saksi dusta
  rationale: Frasa konstruksi ini secara harfiah menunjuk pada 'saksi kebohongan'; 'saksi dusta' merupakan ungkapan Indonesia yang alami dan mempertahankan nuansa hukum atau kesaksian.
- source_word: לֹא יִנָּקֶה
  choice: tidak akan bebas dari hukuman
  rationale: Bentuk Nifal dari נקה dapat berarti dinyatakan bersih, dianggap tidak bersalah, atau lolos tanpa hukuman. Pilihan ini menyampaikan kepastian akibat hukum sambil tetap alami dalam bahasa Indonesia.
- source_word: וְיָפִיחַ
  choice: dan orang yang mengembuskan
  rationale: Bentuk Hifil dari פוח menggambarkan tindakan mengembuskan atau mengeluarkan sesuatu seperti napas. Terjemahan ini mempertahankan gambaran hidup dari teks Ibrani.
- source_word: כְּזָבִים
  choice: kebohongan
  rationale: Nomina jamak ini berarti dusta atau kepalsuan. 'Kebohongan' jelas dan alami, sedangkan makna jamaknya dapat dipahami secara kolektif dalam bahasa Indonesia.
- source_word: יֹאבֵד
  choice: akan binasa
  rationale: Bentuk Qal dari אבד berarti binasa, lenyap, atau menuju kehancuran. 'Akan binasa' ringkas, bermartabat, dan mempertahankan kekuatan peringatan dalam paralelisme ayat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan ringkas, dengan nada hikmat yang tegas. Metafora Ibrani pada bagian kedua dipertahankan, sedangkan ungkapan hukum pada bagian pertama dibuat alami bagi pembaca umum.
