base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/001.yaml
  text: Better is a poor man who walks in his integrity than one who is crooked in his speech and is a fool[a][b].
translation:
  language: id
  text: Lebih baik orang miskin yang hidup dengan integritas daripada orang yang bengkok dalam ucapannya dan bodoh.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “daripada orang bodoh yang bengkok dalam ucapannya.” Susunan bahasa Ibrani memungkinkan frasa terakhir, “dan ia bodoh,” mengidentifikasi orang yang dibandingkan secara lebih padat.'
    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah: “berjalan dalam integritasnya.” Dalam bahasa Ibrani, “berjalan” merupakan metafora bagi cara seseorang menjalani hidup.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Lebih baik
  rationale: Dalam rumusan perbandingan amsal, kata ini menyatakan bahwa keadaan pertama lebih patut dipilih daripada keadaan kedua.
- source_word: רָשׁ
  choice: orang miskin
  rationale: Bentuk ini menunjuk kepada seseorang yang miskin; bahasa Indonesia tidak perlu menandai gender gramatikalnya.
- source_word: הוֹלֵךְ
  choice: yang hidup
  rationale: Secara harfiah berarti 'berjalan', tetapi di sini merupakan metafora Ibrani bagi cara menjalani hidup; 'hidup' menyampaikan maknanya secara alami.
- source_word: בְּתֻמּוֹ
  choice: dengan tulus
  rationale: תֹּם/תֻּם menunjuk pada keutuhan dan integritas watak, bukan keadaan tanpa dosa; 'dengan tulus' alami dalam bahasa Indonesia dan tidak melebihkan maknanya.
- source_word: מֵעִקֵּשׁ
  choice: daripada orang yang bengkok
  rationale: מִן menyatakan perbandingan sesudah 'lebih baik', sedangkan עִקֵּשׁ menggambarkan kebengkokan moral.
- source_word: שְׂפָתָיו
  choice: perkataannya
  rationale: Secara harfiah 'bibirnya', sebuah metonimia bagi ucapan. 'Perkataannya' mempertahankan fokus pada apa yang diucapkan dengan bahasa Indonesia yang alami.
- source_word: וְהוּא כְסִיל
  choice: dan bodoh
  rationale: Terjemahan ini mempertahankan koordinasi langsung dalam teks Ibrani dan membiarkan frasa tersebut mencirikan orang yang perkataannya bengkok.
theological_decisions:
- issue: Hubungan sintaksis וְהוּא כְסִיל dengan orang pembanding
  choice: dan bodoh
  alternative: daripada orang bodoh yang bengkok perkataannya
  rationale: Urutan Ibrani paling langsung dibaca sebagai keterangan tambahan tentang orang yang perkataannya bengkok, tetapi susunannya juga memungkinkan pengungkapan yang lebih padat; alternatif dicatat tanpa mengubah pokok perbandingan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hikmat. Terjemahan utama memakai ungkapan alami, sedangkan metafora harfiah 'berjalan' dipertahankan dalam catatan kaki. Semua penanda catatan kaki dicantumkan dalam teks utama.
