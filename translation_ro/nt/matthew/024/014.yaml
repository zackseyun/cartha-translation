  terminology: Opțiunile terminologice sunt consecvente și justificate. „Împărăției” păstrează formularea tradițional-inteligibilă pentru βασιλεία, iar „popoarele” este o redare naturală și largă pentru ἔθνη; alternativa „națiunile” este oferită corect în notă. Notele [a]–[c] sunt ancorate corespunzător la termenii vizați.
