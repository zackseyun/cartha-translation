id: MAT.24.14
reference: Matthew 24:14
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ κηρυχθήσεται τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας ἐν ὅλῃ τῇ οἰκουμένῃ εἰς μαρτύριον πᾶσιν τοῖς ἔθνεσιν, καὶ τότε ἥξει τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/014.yaml
  text: And this good news of the kingdom will be proclaimed throughout the whole world as a testimony to all the nations[c][b][a], and then the end will come.
translation:
  language: ro
  text: Și această veste bună a împărăției[a] va fi proclamată în întreaga lume[b], ca mărturie pentru toate popoarele[c], și atunci va veni sfârșitul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Evanghelie a împărăției”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „în întreaga lume locuită”.'
    reason: lexical_alternative
  - marker: c
    text: 'Sau: „pentru toate națiunile”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθήσεται
  choice: va fi proclamată
  rationale: Viitorul pasiv exprimă vestirea publică și autorizată. „Va fi proclamată” păstrează această forță fără a limita verbul la predicarea bisericească.
- source_word: εὐαγγέλιον
  choice: veste bună
  rationale: Redă transparent sensul de bază al termenului grec și rămâne firesc pentru cititorul modern; alternativa tradițională „Evanghelie” este păstrată în nota [a].
- source_word: τῆς βασιλείας
  choice: a împărăției
  rationale: Păstrează construcția genitivală și ambiguitatea firească dintre vestea care aparține împărăției și vestea despre împărăție.
- source_word: ἐν ὅλῃ τῇ οἰκουμένῃ
  choice: în întreaga lume
  rationale: Formulare românească naturală pentru lumea locuită, fără a restrânge referința la o anumită arie istorică; sensul mai literal apare în nota [b].
- source_word: εἰς μαρτύριον
  choice: ca mărturie
  rationale: Păstrează valoarea de scop sau rezultat și nu precizează dacă mărturia este în favoarea ori împotriva celor care o aud.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: pentru toate popoarele
  rationale: „Popoarele” redă aici în mod natural grupurile umane în ansamblu și evită sensul predominant politico-statal pe care îl poate avea „națiunile”; alternativa mai formală este indicată în nota [c].
- source_word: ἥξει
  choice: va veni
  rationale: Este echivalentul românesc direct și firesc în acest context eshatologic.
- source_word: τὸ τέλος
  choice: sfârșitul
  rationale: Redă simplu termenul grec, fără a introduce un cadru tehnic precum „vremea sfârșitului” sau o interpretare specifică a împlinirii.
theological_decisions:
- issue: Întinderea lui οἰκουμένη și ἔθνη într-o afirmație eshatologică
  choice: 'Limbaj cu sferă universală: „în întreaga lume” și „pentru toate popoarele”.'
  alternative: „În întreaga lume locuită” și/sau „pentru toate națiunile”.
  rationale: Textul afirmă răspândirea universală a proclamării înainte de „sfârșit”. Formularea nu decide dacă referința trebuie limitată la lumea romană din secolul I și nici nu impune o schemă misiologică sau un calendar eshatologic ulterior.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. „Veste bună” evită jargonul bisericesc, iar „va fi proclamată” păstrează caracterul public al acțiunii. Litera mică în „împărăției” urmează uzul comun și nu adaugă o distincție grafică absentă din sensul construcției grecești.
