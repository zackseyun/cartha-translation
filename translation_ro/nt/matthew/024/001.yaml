  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ὁ Ἰησοῦς ⸂ἀπὸ τοῦ ἱεροῦ ἐπορεύετο⸃, καὶ προσῆλθον οἱ μαθηταὶ αὐτοῦ ἐπιδεῖξαι αὐτῷ τὰς οἰκοδομὰς τοῦ ἱεροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/001.yaml
  text: And Jesus went out from the temple and was going away[a], and his disciples came to show him the buildings of the temple.
translation:
  language: ro
  text: După ce Isus a ieșit din templu[a], pe când pleca, ucenicii Lui s-au apropiat de El ca să-I arate clădirile templului.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Termenul grec tradus prin „templu” se referă la întregul complex sau la incintele templului, nu în mod specific la sanctuarul interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: a ieșit
  rationale: 'Participiul aorist exprimă o acțiune anterioară verbului principal: Isus a ieșit, apoi Se îndepărta. Redarea păstrează sensul direcțional fără a-l extinde interpretativ.'
- source_word: ἱεροῦ
  choice: templu
  rationale: Ἱερόν desemnează aici întregul complex al templului, nu numai sanctuarul interior. „Templu” este redarea românească firească, iar precizarea semantică este păstrată în nota de subsol.
- source_word: ἐπορεύετο
  choice: Se îndepărta
  rationale: Imperfectul indică o deplasare în desfășurare. „Se îndepărta” păstrează atât aspectul imperfectiv, cât și ideea plecării din zona templului.
- source_word: προσῆλθον
  choice: s-au apropiat
  rationale: Aoristul lui προσέρχομαι indică apropierea ucenicilor de Isus și este redat natural și precis în română.
- source_word: ἐπιδεῖξαι
  choice: ca să-I arate
  rationale: Infinitivul exprimă scopul venirii ucenicilor. Construcția finală cu „ca să” este idiomatică în româna modernă.
- source_word: οἰκοδομὰς
  choice: clădirile
  rationale: În context, termenul se referă la edificiile sau construcțiile complexului templului; „clădirile” este direct și ușor de înțeles.
- source_word: τοῦ ἱεροῦ
  choice: templului
  rationale: Genitivul precizează că edificiile aparțineau complexului templului. Repetarea termenului păstrează formularea și accentul textului grec.
theological_decisions:
- issue: Redarea lui ἱερόν în contrast cu ναός
  choice: templu
  alternative: complexul templului / incinta templului
  rationale: Textul folosește ἱερόν, termen care cuprinde ansamblul și incintele templului, nu doar sanctuarul interior. Forma uzuală „templu” păstrează naturalețea textului, iar nota evită confundarea termenilor fără a introduce o interpretare confesională.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Pronumele referitoare la Isus sunt scrise cu majusculă conform unei convenții românești răspândite, fără a adăuga conținut absent din textul grec.
