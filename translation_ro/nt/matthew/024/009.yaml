id: MAT.24.9
reference: Matthew 24:9
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τότε παραδώσουσιν ὑμᾶς εἰς θλῖψιν καὶ ἀποκτενοῦσιν ὑμᾶς, καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων τῶν ἐθνῶν διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/009.yaml
  text: Then they will hand you over to affliction and kill you[c][b][a], and you will be hated by all the nations because of my name.
translation:
  language: ro
  text: Atunci vă vor preda necazului și vă vor ucide, iar toate popoarele vă vor urî din cauza numelui Meu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „vă vor preda asupririi” sau „vă vor preda strâmtorării”. Termenul grecesc poate desemna necaz, apăsare, asuprire sau strâmtorare.'
    reason: lexical_alternative
  - marker: b
    text: 'Literal: „din cauza numelui Meu”. În uz biblic, „numele” poate desemna persoana și autoritatea pe care o reprezintă.'
    reason: clarification
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Redă firesc adverbul temporal și păstrează succesiunea profetică a discursului.
- source_word: παραδώσουσιν ὑμᾶς εἰς θλῖψιν
  choice: vă vor da pe mâna celor ce vă vor asupri
  rationale: „A da pe mâna” exprimă predarea sub puterea altora, iar formularea cu „asupri” redă concret θλῖψις în contextul ostilității și al uciderii, fără a-i impune un sens escatologic tehnic.
- source_word: ἀποκτενοῦσιν ὑμᾶς
  choice: vă vor ucide
  rationale: Echivalent direct, clar și actual al viitorului activ grecesc.
- source_word: ἔσεσθε μισούμενοι
  choice: vă vor urî
  rationale: Pasivul grecesc este redat prin activul românesc cu subiectul „toate popoarele”, o construcție mai naturală care păstrează sensul.
- source_word: ὑπὸ πάντων τῶν ἐθνῶν
  choice: toate popoarele
  rationale: În acest context, ἔθνη indică amploarea universală a ostilității; „popoarele” este mai firesc aici decât „națiunile” și nu restrânge sensul la neevrei.
- source_word: διὰ τὸ ὄνομά μου
  choice: din cauza numelui Meu
  rationale: Păstrează formularea concretă și încărcătura biblică a „numelui”, care reprezintă persoana și autoritatea lui Isus.
theological_decisions:
- issue: Sensul lui θλῖψις în discursul escatologic
  choice: asupri
  alternative: necaz; persecuție; strâmtorare
  rationale: Contextul descrie o predare ostilă ce duce la moarte. „Asupri” comunică limpede opresiunea, fără a transforma termenul într-o etichetă tehnică pentru o anumită schemă escatologică.
- issue: Sensul lui ἔθνη
  choice: popoarele
  alternative: națiunile; neamurile; neevreii
  rationale: Sintagma πάντων τῶν ἐθνῶν are aici cel mai probabil întindere universală. Alegerea păstrează această amploare fără a introduce nejustificat contrastul iudei–neevrei.
- issue: Semnificația expresiei „din cauza numelui Meu”
  choice: păstrarea expresiei literale în text
  alternative: din cauza credinței în Mine; pentru că Îmi sunteți devotați
  rationale: Textul leagă ura de numele lui Isus. Păstrarea metaforei conservă densitatea teologică și nu reduce sensul la o singură explicație.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Construcția „a da pe mâna” este idiomatică, iar „a asupri” păstrează gravitatea contextului fără jargon confesional. Majuscula reverențială din „Meu” urmează uzul biblic românesc.
