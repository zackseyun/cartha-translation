  text: τότε ⸂δύο ἔσονται⸃ ἐν τῷ ἀγρῷ, ⸀εἷς παραλαμβάνεται καὶ ⸁εἷς ἀφίεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/040.yaml
  text: Then two men will be in the field; one is taken and one is left.
translation:
  language: ro
  text: 'Atunci doi bărbați vor fi la câmp: unul va fi luat[a], iar unul va fi lăsat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „va fi luat cu sine”. Verbul nu precizează prin el însuși dacă luarea este pentru salvare sau pentru judecată.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Redă firesc adverbul temporal și leagă afirmația de contextul escatologic precedent.
- source_word: δύο ἔσονται
  choice: doi bărbați vor fi
  rationale: Greaca spune literal „doi vor fi”; numeralul și pronumele următoare sunt masculine, iar paralela feminină din versetul următor susține explicitarea referenților masculini în română.
- source_word: ἐν τῷ ἀγρῷ
  choice: la câmp
  rationale: Formulare românească naturală pentru prezența și activitatea într-un ogor, fără a adăuga detalii absente din text.
- source_word: εἷς
  choice: unul
  rationale: Păstrează contrastul concis și masculin dintre cei doi.
- source_word: παραλαμβάνεται
  choice: va fi luat
  rationale: Pasivul prezent apare într-o scenă viitoare; viitorul românesc este firesc, iar „luat” nu decide dacă acțiunea înseamnă salvare sau judecată.
- source_word: ἀφίεται
  choice: va fi lăsat
  rationale: Redă direct pasivul fără nuanța teologic încărcată a expresiei „lăsat în urmă” și fără intensificarea implicată de „abandonat”.
theological_decisions:
- issue: Dacă παραλαμβάνεται indică salvare sau judecată
  choice: Formularea neutră „va fi luat”
  alternative: „va fi luat la adăpost” ori „va fi luat pentru judecată”
  rationale: Verbul și contextul permit dezbatere; traducerea nu trebuie să impună un anumit sistem escatologic.
- issue: Explicitarea referinței masculine
  choice: „doi bărbați”
  alternative: „doi”
  rationale: Formele masculine εἷς ... εἷς și paralela cu femeile din versetul următor indică o scenă cu doi bărbați; explicitarea este naturală și clară în română.
translation_notes:
  register: Română standard modernă, concisă și demnă. S-a preferat „la câmp”, idiomatic în română, și s-a evitat expresia interpretativ încărcată „lăsat în urmă”.
