lexical_decisions:
- source_word: τότε
  choice: atunci
  rationale: Adverb temporal care marchează succesiunea în discurs; „atunci” este forma românească firească și concisă.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: cei din Iudeea
  rationale: Articolul urmat de sintagma prepozițională are funcție substantivală și îi desemnează pe oamenii aflați în Iudeea. În română, „cei din Iudeea” exprimă natural această localizare, fără precizări suplimentare.
- source_word: Ἰουδαίᾳ
  choice: Iudeea
  rationale: Forma consacrată în română a numelui geografic.
- source_word: φευγέτωσαν
  choice: să fugă
  rationale: Imperativ prezent activ, persoana a treia plural. Construcția românească „să fugă” redă direct și firesc porunca, inclusiv caracterul ei urgent în context.
- source_word: ἐπὶ τὰ ὄρη
  choice: la munți
  rationale: Cu un verb de mișcare, ἐπί cu acuzativul indică destinația. „La munți” este o formulare românească directă, iar „munți” păstrează sensul lui ὄρη fără a-l slăbi la „dealuri”.
theological_decisions:
- issue: Forța imperativului într-un avertisment escatologic
  choice: 'Poruncă directă: „să fugă”'
  alternative: 'Formulare de obligație: „trebuie să fugă”'
  rationale: Conjunctivul cu valoare imperativă este idiomatic în română și păstrează porunca urgentă din text, fără a adăuga o interpretare escatologică sau doctrinară.
translation_notes:
  register: Română standard modernă, concisă și demnă. Formularea păstrează ordinea și caracterul direct al textului grecesc; nu este necesară o notă, deoarece „să fugă” redă în mod normal imperativul de persoana a treia în română.
