id: MAT.24.45
reference: Matthew 24:45
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τίς ἄρα ἐστὶν ὁ πιστὸς δοῦλος καὶ φρόνιμος ὃν κατέστησεν ὁ ⸀κύριος ἐπὶ τῆς ⸀οἰκετείας αὐτοῦ τοῦ ⸀δοῦναι αὐτοῖς τὴν τροφὴν ἐν καιρῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/045.yaml
  text: Who then is the faithful and wise servant[b][a], whom the master has appointed over his household to give them their food at the proper time?
translation:
  language: ro
  text: Cine este deci sclavul[a] credincios și înțelept, pe care stăpânul[b] l-a pus peste cei din casa lui, ca să le dea hrana la timpul potrivit?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „slujitorul”. Termenul grecesc poate desemna un sclav sau, în anumite contexte, un slujitor; aici „sclavul” păstrează mai clar ideea unei persoane aflate sub autoritatea stăpânului.
    reason: lexical_alternative
  - marker: b
    text: Sau „Domnul”. În imaginea gospodăriei, termenul grecesc este redat prin „stăpânul”, potrivit relației sociale descrise.
    reason: alternative_reading
lexical_decisions:
- source_word: Τίς ἄρα
  choice: Cine este deci
  rationale: Întrebarea retorică și particula ἄρα trag o concluzie din îndemnul precedent; „deci” redă firesc această legătură în româna actuală.
- source_word: πιστὸς
  choice: credincios
  rationale: În context, termenul indică un om demn de încredere și statornic în îndeplinirea însărcinării; „credincios” păstrează atât sensul practic, cât și rezonanța morală.
- source_word: δοῦλος
  choice: sclav
  rationale: Termenul desemnează aici o persoană aflată sub autoritatea deplină a unui stăpân. „Sclav” păstrează mai clar decât „slujitor” statutul social din imagine, iar alternativa mai tradițională este consemnată în notă.
- source_word: φρόνιμος
  choice: înțelept
  rationale: Termenul exprimă înțelepciune practică, chibzuință și discernământ; „înțelept” este natural și corespunde uzului recurent din Matei.
- source_word: κατέστησεν
  choice: l-a pus
  rationale: Verbul indică așezarea sau numirea cuiva într-o poziție de răspundere; formularea este limpede și idiomatică.
- source_word: κύριος
  choice: stăpânul
  rationale: În cadrul imaginii gospodărești, termenul denumește stăpânul sclavului și al casei; această redare păstrează planul imediat al comparației.
- source_word: οἰκετείας
  choice: cei din casa lui
  rationale: Substantivul se referă la colectivul gospodăriei, îndeosebi la personalul casei. Formularea redă natural referentul uman cerut de pronumele plural αὐτοῖς, fără a-l restrânge excesiv.
- source_word: τοῦ δοῦναι
  choice: ca să le dea
  rationale: Infinitivul articular exprimă scopul numirii; construcția românească „ca să” îl redă direct și firesc.
- source_word: τροφὴν
  choice: hrana
  rationale: Termenul înseamnă hrană sau alimente; articolul hotărât este firesc în română în această construcție, fără a adăuga ideea mai specifică de rație.
- source_word: ἐν καιρῷ
  choice: la timpul potrivit
  rationale: καιρός indică momentul adecvat sau cuvenit, nu doar timpul cronologic; expresia păstrează această nuanță.
theological_decisions:
- issue: Redarea lui κύριος în cadrul imaginii despre gospodărie
  choice: stăpânul
  alternative: Domnul
  rationale: Sensul imediat este relația socială dintre stăpân și sclav în gospodărie. „Stăpânul” păstrează această imagine fără a elimina posibilitatea ca, la nivelul aplicării parabolei, personajul să îl reprezinte pe Domnul.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Sintaxa păstrează forma de întrebare retorică și relațiile logice ale textului grec, evitând atât formulările arhaice, cât și explicitările interpretative.
