    rationale: Nota privește omisiunea cuvintelor „nici Fiul”; marcajul trebuie atașat acestei expresii pentru o referință transparentă.
  - severity: low
    issue: „Ziua și ora aceea” poate fi citit sintactic ca și cum „aceea” ar determina numai „ora”.
    rationale: 'Greaca are un singur demonstrativ pentru grupul coordonat, dar româna standard este mai clară prin repetarea lui: „ziua aceea și ora aceea”.'
  revised_text: Dar, despre ziua aceea și ora aceea, nu știe nimeni — nici măcar îngerii cerurilor, nici Fiul[a] —, ci numai Tatăl.
