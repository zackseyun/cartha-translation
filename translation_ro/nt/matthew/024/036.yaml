  source_fidelity: Revizuire necesară pentru a reda mai explicit valoarea emfatică a lui οὐδέ înainte de „îngerii cerurilor” și pentru a ancora nota textuală la expresia variantă „nici Fiul”. Repetarea demonstrativului în română evită ambiguitatea sintactică a formulării „ziua și ora aceea”.
  naturalness: „Dar, despre ziua aceea și ora aceea, nu știe nimeni” este română standard, clară și naturală. Secvența cu linii de pauză evidențiază adaosurile negative fără a încărca fraza.
  terminology: „Îngerii cerurilor”, „Fiul” și „Tatăl” păstrează termenii și registrul biblic, precum și caracterul titular al ultimilor doi termeni. „Nici măcar” redă firesc accentul lui οὐδέ.
