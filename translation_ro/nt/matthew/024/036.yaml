  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης καὶ ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν ⸂οὐδὲ ὁ υἱός⸃, εἰ μὴ ὁ ⸀πατὴρ μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/036.yaml
  text: But concerning that day and hour[a], no one knows—not even the angels of heaven, nor the Son—except the Father alone.
translation:
  language: ro
  text: Dar, despre ziua aceea și ora aceea, nu știe nimeni — nici măcar îngerii cerurilor, nici Fiul[a] —, ci numai Tatăl.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Unele manuscrise omit cuvintele „nici Fiul”. Textul principal urmează lectura SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Dar despre
  rationale: περί cu genitivul introduce tema, iar δέ marchează o tranziție cu ușoară nuanță adversativă. „Dar despre” le redă firesc pe amândouă.
- source_word: τῆς ἡμέρας ἐκείνης καὶ ὥρας
  choice: ziua și ora aceea
  rationale: Unicul demonstrativ ἐκείνης determină în mod firesc grupul coordonat în ansamblu. Formularea românească păstrează atât specificitatea, cât și exprimarea concisă a sursei.
- source_word: οὐδεὶς οἶδεν
  choice: nu știe nimeni
  rationale: οὐδείς exprimă negația universală, iar οἶδα are aici sens prezent, „a ști”. Ordinea aleasă este cea mai firească în româna actuală.
- source_word: οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν
  choice: nici îngerii cerurilor
  rationale: οὐδέ adaugă un alt termen negat, iar pluralul τῶν οὐρανῶν este păstrat prin „cerurilor”, formulare biblică inteligibilă și fidelă.
- source_word: οὐδὲ ὁ υἱός
  choice: nici Fiul
  rationale: Sintagma este coordonată cu elementul negativ precedent. Articolul indică titlul recunoscut, redat prin majusculă.
- source_word: εἰ μὴ
  choice: ci numai
  rationale: După afirmația negativă, εἰ μή introduce excepția. În română, construcția „nu... ci numai” exprimă natural și precis această exclusivitate.
- source_word: ὁ πατὴρ μόνος
  choice: numai Tatăl
  rationale: μόνος limitează cunoașterea exclusiv la Tatăl; „numai Tatăl” este clar, natural și păstrează valoarea titlului divin.
theological_decisions:
- issue: Implicația hristologică a expresiei „nici Fiul”
  choice: Păstrarea fără atenuare sau explicație a expresiei „nici Fiul” în textul principal.
  alternative: Omiterea expresiei pe baza variantei manuscrise sau parafrazarea ei pentru a diminua tensiunea teologică.
  rationale: Textul SBLGNT furnizat include οὐδὲ ὁ υἱός. Traducerea păstrează afirmația și tensiunea ei teologică, fără a o armoniza prin adaos, omisiune ori parafrază.
translation_notes:
  register: Română standard modernă, clară și demnă. Sintaxa este naturală, iar formularea rămâne apropiată de structura greacă fără a deveni rigidă.
