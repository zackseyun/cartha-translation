base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/008.yaml
  text: But all these things are the beginning of birth pains[a].
translation:
  language: ro
  text: Dar toate acestea sunt începutul durerilor nașterii[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „durerilor facerii” ori „durerilor de naștere”. Termenul grecesc evocă durerile nașterii ca imagine pentru etapa de început a necazurilor care urmează.
    reason: alternativă lexicală
lexical_decisions:
- source_word: πάντα
  choice: toate
  rationale: Împreună cu ταῦτα formează expresia „toate acestea”, care se referă firesc la evenimentele menționate anterior.
- source_word: δὲ
  choice: Dar
  rationale: Marchează o ușoară opoziție sau trecere de la enumerarea precedentă la evaluarea ei; „Dar” redă bine această schimbare de perspectivă.
- source_word: ταῦτα
  choice: acestea
  rationale: Pronumele demonstrativ trimite la evenimentele enumerate anterior, iar „toate acestea” este formularea românească naturală și concisă.
- source_word: ἀρχὴ
  choice: începutul
  rationale: În construcția predicativă, „sunt începutul” exprimă natural ideea unei etape inițiale, fără a sugera că evenimentele constituie deja sfârșitul.
- source_word: ὠδίνων
  choice: durerilor nașterii
  rationale: Termenul denumește durerile asociate nașterii. Formularea păstrează limpede metafora și are un registru modern, demn și ușor de înțeles.
theological_decisions:
- issue: Forța metaforică a termenului ὠδίνων
  choice: Păstrarea metaforei nașterii prin „durerilor nașterii”.
  alternative: „durerilor facerii”, „durerilor de naștere” sau generalizarea prin „suferințelor”
  rationale: Textul prezintă tulburările precedente drept etapa inițială a unui proces, nu drept sfârșitul însuși. Păstrarea imaginii nașterii conservă tensiunea escatologică fără a impune o schemă doctrinară mai precisă decât afirmă versetul.
translation_notes:
  register: Română standard modernă, cu sintaxă directă și registru demn. Metafora concretă a nașterii este păstrată, iar nota oferă alternative românești fără a o explica excesiv.
