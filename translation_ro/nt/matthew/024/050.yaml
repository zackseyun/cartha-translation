  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/050.yaml
  text: the master of that servant will come on a day he does not expect and at an hour he does not know[b][a],
translation:
  language: ro
  text: stăpânul[a] acelui sclav[b] va veni într-o zi când acesta nu se așteaptă la el și la o oră pe care nu o cunoaște.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „domnul”; grecescul kyrios poate însemna „domn” sau „stăpân”. Aici desemnează superiorul uman din pildă.
    reason: lexical_alternative
  - marker: b
    text: Sau „rob” ori „slujitor”. Grecescul doulos desemnează o persoană aflată într-un raport de servitute.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξει
  choice: va veni
  rationale: Viitorul verbului ἥκω exprimă venirea sau sosirea; „va veni” este formularea românească firească în contextul întoarcerii neașteptate a stăpânului.
- source_word: κύριος
  choice: stăpânul
  rationale: În cadrul imediat al pildei, termenul desemnează superiorul uman al sclavului, nu funcționează direct ca titlu divin.
- source_word: δούλου
  choice: sclav
  rationale: Termenul indică o persoană aflată într-un raport de servitute; în această relație explicită stăpân–sclav, „sclav” păstrează mai bine realitatea socială decât termenul mai atenuat „slujitor”.
- source_word: ἐκείνου
  choice: acelui
  rationale: Demonstrativul trimite la sclavul despre care este vorba și este redat direct și idiomatic.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: într-o zi la care acesta nu se așteaptă
  rationale: Formularea păstrează caracterul nedefinit al zilei și sensul de așteptare al lui προσδοκάω; „acesta” clarifică firesc faptul că subiectul este sclavul.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: la o oră pe care nu o știe
  rationale: Redarea păstrează paralelismul retoric dintre „zi” și „oră”, precum și sensul simplu al lui γινώσκω.
theological_decisions:
- issue: Sensul lui κύριος în cadrul pildei
  choice: stăpânul
  alternative: domnul
  rationale: Contextul gospodăresc indică un superior uman. „Stăpânul” păstrează imaginea pildei fără a transforma în mod nejustificat substantivul într-un titlu cristologic explicit, deși pilda are o semnificație escatologică.
- issue: Redarea lui δοῦλος
  choice: sclav
  alternative: rob sau slujitor
  rationale: Relația de autoritate și servitute este pregnantă în context; „sclav” comunică limpede statutul social, în timp ce alternativele pot fie suna arhaic, fie atenua raportul exprimat de text.
translation_notes:
  register: Română standard modernă, cu formulare simplă și demnă. „Sclav” este ales pentru precizia socială, iar „acesta” evită ambiguitatea referentului fără a adăuga o interpretare teologică.
