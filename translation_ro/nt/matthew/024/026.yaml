id: MAT.24.26
reference: Matthew 24:26
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐὰν οὖν εἴπωσιν ὑμῖν· Ἰδοὺ ἐν τῇ ἐρήμῳ ἐστίν, μὴ ἐξέλθητε· Ἰδοὺ ἐν τοῖς ταμείοις, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/026.yaml
  text: Therefore[a], if they say to you, ‘Look, he is in the wilderness,’ do not go out; ‘Look[c][b], he is in the inner rooms,’ do not believe it.
translation:
  language: ro
  text: 'Așadar, dacă vă spun: „Iată, este în pustiu!”, să nu ieșiți; „Iată, este în încăperile dinăuntru!”, să nu credeți.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „în odăile interioare”, „în cămări” ori „în încăperile ascunse”. Termenul grecesc poate desemna încăperi interioare, private sau folosite pentru păstrarea lucrurilor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Așadar, dacă
  rationale: Redă atât legătura concluzivă marcată de οὖν, cât și condiția introdusă prin ἐάν, într-o formulare românească firească.
- source_word: εἴπωσιν ὑμῖν
  choice: vă spun
  rationale: Păstrează pluralul nedefinit al verbului și dativul destinatarului, fără a identifica vorbitorii.
- source_word: Ἰδοὺ
  choice: Iată
  rationale: Este un semnal de atragere a atenției, actual și demn în română, corespunzător valorii deictice a lui ἰδού.
- source_word: ἐν τῇ ἐρήμῳ
  choice: în pustiu
  rationale: „Pustiu” poate desemna un ținut nelocuit ori arid și evită restrângerea obligatorie la imaginea unui deșert nisipos.
- source_word: ἐστίν
  choice: este
  rationale: Româna permite subiectul subînțeles; contextul indică persoana despre care se pretinde că s-ar afla acolo, fără a fi necesară adăugarea unui titlu.
- source_word: μὴ ἐξέλθητε
  choice: să nu ieșiți
  rationale: Redă direct interdicția exprimată prin μή cu conjunctivul aorist și păstrează ideea deplasării în afară.
- source_word: ἐν τοῖς ταμείοις
  choice: în încăperile dinăuntru
  rationale: Redă sensul de încăperi interioare sau private fără a impune exclusiv sensul de magazii ori ideea interpretativă de ascunzători secrete.
- source_word: μὴ πιστεύσητε
  choice: să nu credeți
  rationale: În română, verbul poate rămâne fără obiect exprimat, iar afirmația care nu trebuie crezută este limpede din context.
theological_decisions:
- issue: Referentul subînțeles al lui ἐστίν
  choice: 'Subiectul rămâne neexprimat în română: „este”.'
  alternative: „el este” sau „Mesia este”
  rationale: Textul grec nu numește aici subiectul. Româna permite păstrarea acestei elipse, evitând adăugarea unui titlu și conservând tensiunea contextuală.
- issue: Relația dintre cele două afirmații citate
  choice: Cele două scenarii sunt juxtapuse cu punct și virgulă, fără introducerea lui „sau”.
  alternative: Introducerea conjuncției „sau” înaintea celei de-a doua afirmații
  rationale: Greaca repetă Ἰδού și prezintă două afirmații paralele, dar nu conține o conjuncție disjunctivă explicită.
translation_notes:
  register: Română literară modernă, clară și demnă. Formularea păstrează paralelismul și concizia greacă; „Iată” menține tonalitatea biblică fără arhaism excesiv.
