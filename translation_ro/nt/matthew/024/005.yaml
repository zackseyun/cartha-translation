id: MAT.24.5
reference: Matthew 24:5
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες· Ἐγώ εἰμι ὁ χριστός, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/005.yaml
  text: For many will come in my name[a], saying, ‘I am the Messiah,’ and they will lead many astray.
translation:
  language: ro
  text: 'Căci mulți vor veni în numele Meu, spunând: „Eu sunt Mesia[a]”, și îi vor duce în rătăcire pe mulți.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Eu sunt Cristosul.” Titlul grecesc este ὁ χριστός.'
    reason: Oferă echivalentul tradițional mai formal al titlului grecesc și face vizibilă alternativa lexicală.
lexical_decisions:
- source_word: πολλοὶ
  choice: mulți
  rationale: Redă direct și firesc adjectivul cantitativ, fără intensificare nejustificată.
- source_word: γὰρ
  choice: căci
  rationale: Păstrează legătura explicativă cu avertismentul din versetul precedent într-un registru biblic actual și demn.
- source_word: ἐλεύσονται
  choice: vor veni
  rationale: Este echivalentul românesc firesc al viitorului lui ἔρχομαι.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: în numele Meu
  rationale: Expresia românească consacrată păstrează referirea la asumarea numelui, identității ori autorității lui Isus, fără a restrânge sensul la o singură nuanță.
- source_word: λέγοντες
  choice: spunând
  rationale: Redă participiul fără a introduce evaluarea suplimentară implicată de «pretinzând».
- source_word: Ἐγώ εἰμι ὁ χριστός
  choice: Eu sunt Mesia
  rationale: Articolul și contextul indică un titlu mesianic; «Mesia» comunică limpede afirmația falșilor pretendenți și evită tratarea lui Χριστός ca nume propriu.
- source_word: πλανήσουσιν
  choice: îi vor duce în rătăcire
  rationale: Păstrează atât ideea înșelării, cât și imaginea abaterii de la calea dreaptă, prezentă în πλανάω.
- source_word: πολλοὺς
  choice: pe mulți
  rationale: Obiectul personal este exprimat natural în română prin construcția cu «pe», iar reluarea pronominală face enunțul fluent.
theological_decisions:
- issue: Redarea titlului Χριστός în afirmația unor falși pretendenți
  choice: Mesia
  alternative: Cristos
  rationale: În acest context, termenul este în mod clar un titlu revendicat, nu un nume propriu; «Mesia» face transparent sensul titlului, în timp ce nota păstrează echivalentul tradițional «Cristos».
- issue: Forța expresiei ἐπὶ τῷ ὀνόματί μου
  choice: în numele Meu
  alternative: sub numele Meu
  rationale: Formularea păstrează ambiguitatea autentică dintre invocarea autorității lui Isus și revendicarea identității asociate numelui Său, fără a decide inutil între ele.
translation_notes:
  register: Română standard modernă, clară și demnă. «Căci» păstrează explicit relația explicativă; «îi vor duce în rătăcire pe mulți» este idiomatic și conservă metafora verbului grec. Majuscula reverențială din «Meu» urmează uzul editorial românesc, fără implicație în textul grec.
