source:
  edition: SBLGNT
  text: διὰ τοῦτο καὶ ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ⸂οὐ δοκεῖτε ὥρᾳ⸃ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/044.yaml
  text: For this reason[a], you also must be ready, because the Son of Man is coming at an hour you do not expect.
translation:
  language: ro
  text: De aceea, fiți și voi gata, pentru că Fiul Omului vine la o oră la care nu vă așteptați.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, mai literal: „la o oră la care nu socotiți că va veni”. Verbul grec poate însemna „a socoti” sau „a presupune”; în acest context, are sensul de „a se aștepta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: De aceea
  rationale: Redă concis și firesc legătura cauzal-inferențială cu avertismentul anterior.
- source_word: καὶ ὑμεῖς
  choice: și voi
  rationale: Păstrează includerea și accentul exprimate prin καί și pronumele explicit.
- source_word: γίνεσθε ἕτοιμοι
  choice: fiți gata
  rationale: Imperativul prezent cere o stare continuă de pregătire; formularea este idiomatică și păstrează direct forța poruncii.
- source_word: ὅτι
  choice: pentru că
  rationale: Introduce motivul poruncii și are aici valoare cauzală.
- source_word: ᾗ οὐ δοκεῖτε ὥρᾳ
  choice: la o oră la care nu vă așteptați
  rationale: Redă idiomul temporal și sensul contextual al lui δοκεῖτε, fără a pierde alternativa lexicală «credeți/socotiți», indicată în notă.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Păstrează titlul cristologic consacrat, formularea greacă și rezonanța sa biblică.
- source_word: ἔρχεται
  choice: vine
  rationale: Păstrează prezentul viu al textului grec, care poate avea referire viitoare, fără a-l transforma explicit în viitor.
theological_decisions:
- issue: Redarea titlului cristologic ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  alternative: Omul / Cel omenesc
  rationale: Forma consacrată și literală păstrează caracterul de titlu, fundalul semitic și posibila rezonanță din Daniel, fără a reduce ambiguitatea teologică prin parafrazare.
- issue: Valoarea temporală a prezentului ἔρχεται
  choice: vine
  alternative: va veni
  rationale: Prezentul românesc păstrează vividitatea și tensiunea textului grec; referirea viitoare rămâne clară din context.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. Topica este firească, iar titlul „Fiul Omului” este păstrat în forma biblică consacrată. Nota este plasată după expresia pe care o explică.
