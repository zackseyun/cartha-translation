  text: ἀμὴν λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/047.yaml
  text: Truly I say to you that he will appoint him over all his possessions[a].
translation:
  language: ro
  text: Adevărat vă spun că îl va pune peste toate bunurile sale.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „peste tot ce are”.'
    reason: Alternativă lexicală care redă explicit expresia grecească pentru toate lucrurile aflate în posesia stăpânului.
lexical_decisions:
- source_word: ἀμὴν
  choice: Adevărat
  rationale: Redă formula solemnă și autoritativă printr-o expresie consacrată și firească în româna biblică modernă.
- source_word: λέγω ὑμῖν
  choice: vă spun
  rationale: Este o redare directă și naturală a verbului la prezent și a pronumelui la dativ, păstrând caracterul formulei rostite de Isus.
- source_word: ὅτι
  choice: că
  rationale: Introduce explicit și firesc în română propoziția care exprimă conținutul declarației.
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: peste toate averile sale
  rationale: Prepoziția ἐπί cu dativul indică sfera responsabilității, iar substantivizarea lui ὑπάρχω desemnează bunurile aflate în posesia stăpânului. „Averile” este concis și natural; alternativa mai transparentă lexical este păstrată în notă.
- source_word: καταστήσει
  choice: îl va pune
  rationale: În context, verbul înseamnă a așeza sau a rândui pe cineva într-o poziție de răspundere. „Îl va pune peste” este idiomatic în română și păstrează imaginea parabolei fără a o transforma într-un termen administrativ prea tehnic.
- source_word: αὐτόν
  choice: îl
  rationale: Pronumele masculin singular se referă la robul sau slujitorul credincios și înțelept din contextul anterior și este păstrat ca atare.
theological_decisions:
- issue: Natura răsplătirii sau a responsabilității încredințate de stăpân
  choice: Afirmația este redată direct ca punere a slujitorului peste bunurile stăpânului, în cadrul logicii parabolei.
  alternative: Interpretarea explicită drept autoritate eclezială ori drept răsplată cerească de la sfârșitul vremurilor.
  rationale: Versetul descrie extinderea responsabilității slujitorului, dar nu precizează aici aplicarea teologică exactă. Traducerea nu trebuie să introducă o sistematizare absentă din text.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formula „Adevărat vă spun” păstrează solemnitatea enunțului, iar „îl va pune peste” este naturală și potrivită imaginii de administrare din parabolă.
