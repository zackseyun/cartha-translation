id: MAT.24.3
reference: Matthew 24:3
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν προσῆλθον αὐτῷ οἱ μαθηταὶ κατ’ ἰδίαν λέγοντες· Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον τῆς σῆς παρουσίας ⸀καὶ συντελείας τοῦ αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/003.yaml
  text: As he was sitting on the Mount of Olives[a], the disciples came to him privately, saying, “Tell us, when will these things be[b], and what will be the sign of your coming and of the end of the age?”
translation:
  language: ro
  text: 'Pe când ședea pe Muntele Măslinilor, ucenicii s-au apropiat de el în particular și i-au zis: „Spune-ne, când se vor întâmpla aceste lucruri și care va fi semnul venirii[a] tale și al sfârșitului veacului[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „prezenței” ori „sosirii”.
    reason: lexical_alternative
  - marker: b
    text: Sau „încheierii veacului”; tradițional, „sfârșitului lumii”.
    reason: alternative_reading
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: Pe când ședea
  rationale: Construcția de genitiv absolut are sens temporal și descrie o acțiune în desfășurare. Formularea este firească și păstrează tonul narativ demn.
- source_word: Ὄρους τῶν Ἐλαιῶν
  choice: Muntele Măslinilor
  rationale: Este denumirea geografică consacrată în limba română și redă limpede expresia grecească.
- source_word: προσῆλθον αὐτῷ
  choice: s-au apropiat de el
  rationale: Redă mișcarea ucenicilor către Isus într-o formulare românească naturală.
- source_word: κατ’ ἰδίαν
  choice: în particular
  rationale: Arată că discuția a avut loc separat de ceilalți, fără a adăuga că ucenicii ar fi fost neapărat singuri cu Isus.
- source_word: Εἰπὸν ἡμῖν
  choice: Spune-ne
  rationale: Echivalent idiomatic și direct al imperativului aorist grecesc.
- source_word: πότε ταῦτα ἔσται
  choice: când se vor întâmpla aceste lucruri
  rationale: În context, verbul εἰμί indică producerea evenimentelor pomenite anterior; formularea românească este mai naturală decât o redare literală cu „vor fi”.
- source_word: σημεῖον
  choice: semnul
  rationale: Este echivalentul românesc standard și potrivit contextului escatologic.
- source_word: παρουσίας
  choice: venirii
  rationale: În întrebarea orientată spre viitor, termenul denumește venirea sau sosirea așteptată. Alternativele lexicale „prezență” și „sosire” sunt păstrate în notă.
- source_word: συντελείας τοῦ αἰῶνος
  choice: sfârșitului veacului
  rationale: Redă încheierea epocii sau veacului, fără a transforma expresia într-o afirmație explicită despre dispariția lumii fizice.
theological_decisions:
- issue: Sensul lui παρουσία în discursul escatologic
  choice: venirea
  alternative: prezența; sosirea
  rationale: „Venirea” exprimă firesc orientarea viitoare a întrebării, dar nota păstrează aria semantică a termenului grec fără a fixa detalii despre natura sau cronologia evenimentului.
- issue: Sensul expresiei συντελείας τοῦ αἰῶνος
  choice: sfârșitul veacului
  alternative: încheierea veacului; sfârșitul lumii
  rationale: Textul grec vorbește despre ajungerea veacului la capăt, nu explicit despre sfârșitul lumii materiale. Varianta tradițională este menționată în notă, fără a fi introdusă în text.
- issue: Legătura dintre venire și sfârșitul veacului
  choice: și al sfârșitului veacului
  alternative: și al încheierii veacului
  rationale: Conjuncția este păstrată, iar formularea nu stabilește dincolo de text dacă cele două expresii desemnează același moment sau evenimente strâns asociate.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. „Ședea” păstrează nuanța poziției corporale fără greoaia formulare „stătea așezat”, iar „veacului” menține distincția dintre αἰών și lumea fizică.
