id: MAT.24.41
reference: Matthew 24:41
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: δύο ἀλήθουσαι ἐν τῷ ⸀μύλῳ, μία παραλαμβάνεται καὶ μία ἀφίεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/041.yaml
  text: Two women will be grinding at the mill[c][b][a]; one is taken and one is left.
translation:
  language: ro
  text: Două femei vor măcina la moară[a][b]; una este luată, iar cealaltă este lăsată.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, „Două [femei] măcinând la moară”; participiul grecesc este la feminin plural, indicând că este vorba despre femei.
    reason: lexical_alternative
  - marker: b
    text: Sau „la râșniță” ori „cu piatra de moară”; termenul grecesc poate desemna mai precis instalația sau piatra folosită la măcinat.
    reason: lexical_alternative
  - marker: c
    text: Textul grecesc spune doar că una „este luată”, iar cealaltă „este lăsată”, fără să precizeze aici dacă luarea este spre salvare sau spre judecată.
    reason: alternative_reading
lexical_decisions:
- source_word: δύο ἀλήθουσαι
  choice: Două femei vor măcina
  rationale: Participiul prezent activ ἀλήθουσαι este feminin plural și implică în mod explicit două femei. Viitorul progresiv contextual este redat firesc în română prin „vor măcina”.
- source_word: ἐν τῷ μύλῳ
  choice: la moară
  rationale: μύλος poate desemna moara ori piatra de moară; „la moară” este o formulare românească naturală și nu precizează excesiv tipul uneltei.
- source_word: μία παραλαμβάνεται
  choice: una este luată
  rationale: Redarea directă păstrează pasivul și nu stabilește dacă luarea este spre salvare sau spre judecată.
- source_word: καὶ μία ἀφίεται
  choice: iar cealaltă este lăsată
  rationale: „Iar” exprimă contrastul firesc dintre cele două situații fără a accentua excesiv opoziția; „este lăsată” redă direct pasivul lui ἀφίημι.
theological_decisions:
- issue: Identitatea feminină a persoanelor care macină
  choice: Subiectul implicit este exprimat prin „femei”
  alternative: „Două vor măcina la moară”
  rationale: Forma feminină plurală a participiului grec cere ca referirea la femei să fie vizibilă și în traducere.
- issue: Semnificația escatologică a verbelor „este luată” și „este lăsată”
  choice: Sensul rămâne neprecizat
  alternative: Explicitarea luării ca salvare ori ca judecată
  rationale: Versetul descrie separarea, dar nu identifică explicit aici destinul favorabil sau nefavorabil al fiecărei femei; traducerea păstrează tensiunea interpretativă.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea evită atât arhaismele, cât și interpretarea doctrinară adăugată textului; „iar cealaltă” este idiomatic în română și menține contrastul distributiv.
