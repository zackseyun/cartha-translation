id: MAT.24.11
reference: Matthew 24:11
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ψευδοπροφῆται ἐγερθήσονται καὶ πλανήσουσιν πολλούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/011.yaml
  text: And many false prophets will arise and will lead many astray[a][b].
translation:
  language: ro
  text: Și se vor ridica mulți profeți falși și îi vor duce în rătăcire pe mulți.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „îi vor amăgi pe mulți”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „vor fi ridicați”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: mulți
  rationale: Redă direct și firesc adjectivul cantitativ grec, fără intensificare nejustificată.
- source_word: ψευδοπροφῆται
  choice: profeți falși
  rationale: Echivalent consacrat și clar pentru termenul compus care desemnează profeți mincinoși sau neautentici.
- source_word: ἐγερθήσονται
  choice: se vor ridica
  rationale: Păstrează forma pasivă/reflexivă și sensul contextual de apariție pe scena publică, fără a sugera în mod necesar învierea.
- source_word: πλανήσουσιν
  choice: îi vor duce în rătăcire
  rationale: Păstrează metafora rătăcirii cuprinsă în verbul grec și nu limitează abaterea la un domeniu exclusiv doctrinar, moral sau escatologic.
- source_word: πολλούς
  choice: pe mulți
  rationale: Redare directă și naturală a complementului direct; pronumele „îi” asigură construcția românească firească.
- source_word: καὶ ... καὶ
  choice: Și ... și
  rationale: Menține coordonarea cumulativă simplă a celor două acțiuni viitoare.
theological_decisions:
- issue: Natura rătăcirii exprimate prin πλανήσουσιν
  choice: Versetul avertizează că profeții falși îi vor abate pe mulți, fără a preciza mecanismul ori domeniul exact al rătăcirii.
  alternative: Rătăcirea este în primul rând doctrinară; sau este în primul rând morală ori escatologică.
  rationale: Verbul grec are un sens suficient de larg pentru a cuprinde amăgirea și abaterea spirituală, doctrinară ori morală; traducerea nu restrânge această ambiguitate.
- issue: Valoarea formei ἐγερθήσονται
  choice: „se vor ridica”, în sensul contextual că vor apărea sau se vor manifesta
  alternative: „vor fi ridicați”
  rationale: Forma greacă este pasivă, dar în context poate funcționa idiomatic cu sensul „vor apărea”. Textul principal rămâne natural, iar nota păstrează alternativa formală.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formularea păstrează paralelismul grec și metafora rătăcirii; „profeți” este preferat formei mai arhaice „proroci” pentru claritate contemporană.
