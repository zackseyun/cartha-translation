id: MAT.24.27
reference: Matthew 24:27
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ἀστραπὴ ἐξέρχεται ἀπὸ ἀνατολῶν καὶ φαίνεται ἕως δυσμῶν, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/027.yaml
  text: For just as the lightning comes from the east and is seen as far as the west[a], so will the coming of the Son of Man be.
translation:
  language: ro
  text: Căci, așa cum fulgerul pornește de la răsărit și se vede până la apus, tot așa va fi venirea Fiului Omului.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „prezența”. Termenul grecesc παρουσία poate însemna „prezență” sau „sosire”, dar aici, în context, se referă la venirea viitoare a Fiului Omului.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Căci, așa cum
  rationale: Redă atât legătura explicativă γάρ, cât și comparația introdusă de ὥσπερ, într-o formulare românească firească.
- source_word: ἀστραπή
  choice: fulgerul
  rationale: Termenul denumește în mod obișnuit fulgerul, fenomenul vizibil aflat în centrul comparației.
- source_word: ἐξέρχεται
  choice: pornește
  rationale: Verbul înseamnă literal „iese” sau „vine din”; despre fulger, „pornește de la” redă natural ideea originii și a propagării, fără a-l confunda cu simpla apariție.
- source_word: ἀπὸ ἀνατολῶν
  choice: de la răsărit
  rationale: În opoziție cu δυσμῶν, pluralul indică direcția estului; „răsărit” păstrează și imaginea etimologică, fiind idiomatic în română.
- source_word: φαίνεται
  choice: se vede
  rationale: Redă forma medio-pasivă și accentuează caracterul vizibil al fulgerului, fără a adăuga sensul mai specific „strălucește”.
- source_word: ἕως δυσμῶν
  choice: până la apus
  rationale: ἕως exprimă întinderea până la limita vestică, iar „apus” formează în română perechea direcțională firească „răsărit–apus”.
- source_word: οὕτως ἔσται
  choice: tot așa va fi
  rationale: Păstrează structura comparativă și valoarea de viitor a enunțului.
- source_word: παρουσία
  choice: venirea
  rationale: În acest context escatologic, termenul indică venirea sau sosirea viitoare a Fiului Omului. Alternativa lexicală „prezența” este păstrată în notă.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Fiului Omului
  rationale: Este redarea consacrată a expresiei titulare și păstrează rezonanța ei intertextuală, inclusiv legătura cu Daniel 7.
theological_decisions:
- issue: Redarea lui παρουσία într-o afirmație escatologică
  choice: venirea
  alternative: prezența; sosirea
  rationale: Comparația cu fulgerul prezintă o manifestare viitoare, vizibilă și evidentă. „Venirea” comunică cel mai bine aici sensul evenimențial, fără a impune o schemă doctrinară mai îngustă; sensul lexical „prezență” rămâne consemnat în notă.
translation_notes:
  register: Română standard modernă, clară și demnă. Perechea „răsărit–apus” este naturală și păstrează imaginea direcțională a textului grec; formularea evită atât arhaismele inutile, cât și explicitările doctrinare.
