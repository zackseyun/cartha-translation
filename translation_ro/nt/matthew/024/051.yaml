id: MAT.24.51
reference: Matthew 24:51
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ὑποκριτῶν θήσει· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/051.yaml
  text: and will cut him in two and assign his place with the hypocrites[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: ro
  text: și îl va tăia în două[a] și îi va rândui locul printre ipocriți[b]. Acolo va fi plânsul și scrâșnirea dinților.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau, în sens idiomatic, „îl va pedepsi aspru”. Verbul grec înseamnă literalmente „a tăia în două”.
    reason: lexical_alternative
  - marker: b
    text: Literal, „îi va rândui partea cu ipocriții”. „Partea” poate desemna soarta sau locul care îi este atribuit.
    reason: lexical_alternative
lexical_decisions:
- source_word: διχοτομήσει
  choice: îl va tăia în două
  rationale: Păstrează sensul lexical concret și imaginea puternică a verbului grec, fără a o reduce în text la o parafrază despre pedepsire.
- source_word: μέρος
  choice: partea
  rationale: Redă direct sensul de «parte» sau «soartă alocată» și păstrează deschisă nuanța exactă a expresiei judiciare.
- source_word: ὑποκριτῶν
  choice: ipocriții
  rationale: Este echivalentul românesc consacrat și păstrează consecvența tematică a termenului în Matei.
- source_word: ἐκεῖ
  choice: Acolo
  rationale: Redă firesc adverbul de loc și îl leagă de soarta tocmai menționată.
- source_word: κλαυθμὸς
  choice: plânsul
  rationale: Este redarea firească și tradițional inteligibilă a formulei repetate în Matei.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: scrâșnirea dinților
  rationale: Expresie românească vie și consacrată, care reproduce fidel imaginea greacă.
theological_decisions:
- issue: Dacă διχοτομήσει trebuie atenuat într-o formulă figurată despre pedeapsă
  choice: Se păstrează formularea concretă «îl va tăia în două» în textul principal.
  alternative: «îl va pedepsi aspru»
  rationale: Sensul lexical concret și forța avertismentului trebuie păstrate; nota indică posibilitatea înțelegerii idiomatice fără a o impune.
- issue: Cum trebuie exprimată soarta indicată de τὸ μέρος αὐτοῦ ... θήσει
  choice: «îi va rândui partea împreună cu ipocriții»
  alternative: «îi va rândui locul printre ipocriți»
  rationale: «Partea» urmează mai îndeaproape substantivul grec și nu precizează excesiv dacă este vorba despre loc, lot sau destin; «a rândui» exprimă atribuirea.
translation_notes:
  register: Română standard modernă, demnă și directă. Formularea păstrează imaginile concrete și formula mateiană consacrată, evitând totodată explicarea doctrinară a naturii pedepsei.
