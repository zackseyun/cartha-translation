id: MAT.24.6
reference: Matthew 24:6
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: μελλήσετε δὲ ἀκούειν πολέμους καὶ ἀκοὰς πολέμων· ὁρᾶτε, μὴ θροεῖσθε· δεῖ ⸀γὰρ γενέσθαι, ἀλλ’ οὔπω ἐστὶν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/006.yaml
  text: And you are going to hear of wars and reports of wars. See that you are not alarmed[a], for it must happen, but the end is not yet.
translation:
  language: ro
  text: Veți auzi de războaie și de vești despre războaie.[a] Aveți grijă să nu vă tulburați, căci trebuie să se întâmple, dar încă nu este sfârșitul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „zvonuri despre războaie”. Expresia grecească poate însemna vești, relatări sau zvonuri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μελλήσετε ἀκούειν
  choice: Veți auzi
  rationale: Construcția exprimă un viitor așteptat sau apropiat. Viitorul simplu este firesc în româna actuală și, în acest context, păstrează suficient valoarea prospectivă.
- source_word: πολέμους
  choice: războaie
  rationale: πόλεμος denumește în mod obișnuit războiul, nu doar o bătălie sau un conflict izolat.
- source_word: ἀκοὰς πολέμων
  choice: vești despre războaie
  rationale: ἀκοή poate desemna ceea ce se aude, o veste sau o relatare. „Vești” nu implică automat că informația este falsă, iar alternativa tradițională este păstrată în notă.
- source_word: ὁρᾶτε, μὴ θροεῖσθε
  choice: Aveți grijă să nu vă înspăimântați
  rationale: Imperativul ὁρᾶτε introduce un avertisment, iar θροεῖσθε descrie tulburarea sau alarma puternică. Formularea este naturală și redă îndemnul fără a-l atenua.
- source_word: δεῖ γὰρ γενέσθαι
  choice: căci trebuie să se întâmple
  rationale: δεῖ exprimă necesitatea, iar γενέσθαι înseamnă aici „să se întâmple”. Subiectul rămâne neexprimat, ca în greacă, evitând adăugarea explicită a lui „aceste lucruri”.
- source_word: ἀλλ’ οὔπω ἐστὶν τὸ τέλος
  choice: dar încă nu este sfârșitul
  rationale: Redarea urmează îndeaproape formularea greacă și păstrează caracterul larg al expresiei τὸ τέλος.
theological_decisions:
- issue: Sensul escatologic al expresiei τὸ τέλος
  choice: sfârșitul
  alternative: împlinirea finală
  rationale: „Sfârșitul” păstrează formularea generală a textului grec și nu o restrânge la o schemă escatologică confesională.
- issue: Subiectul neexprimat al lui δεῖ γενέσθαι
  choice: trebuie să se întâmple
  alternative: trebuie să se întâmple aceste lucruri
  rationale: Construcția impersonală păstrează concizia și ambiguitatea gramaticală a sursei, fără a introduce un subiect explicit.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Aveți grijă” redă firesc funcția de avertisment a imperativului, iar „vești” evită ideea neobligatorie de informație falsă asociată uneori cu „zvonuri”.
