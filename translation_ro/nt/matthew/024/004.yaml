  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/004.yaml
  text: And Jesus answered them[a], “See that no one leads you astray.”
translation:
  language: ro
  text: 'Isus le-a răspuns: „Aveți grijă să nu vă ducă nimeni în rătăcire.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „să nu vă înșele nimeni”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: le-a răspuns
  rationale: Construcția greacă este o formulă narativă care exprimă răspunsul și actul vorbirii. Româna firească le redă împreună prin „le-a răspuns”, evitând redundanța „răspunzând, le-a zis”.
- source_word: Βλέπετε
  choice: Aveți grijă
  rationale: Imperativul prezent plural are aici sensul idiomatic de vigilență și precauție. „Aveți grijă” este natural în româna actuală și introduce limpede propoziția preventivă cu μή.
- source_word: μή τις
  choice: să nu ... nimeni
  rationale: 'După imperativ, μή cu conjunctivul exprimă prevenirea. Structura românească „să nu ... nimeni” redă clar ideea: vegheați ca nimeni să nu facă acest lucru.'
- source_word: πλανήσῃ
  choice: vă ducă ... în rătăcire
  rationale: Verbul poate desemna inducerea în eroare, amăgirea sau abaterea de la calea dreaptă. Expresia aleasă păstrează atât ideea înșelării, cât și pe cea a abaterii.
theological_decisions:
- issue: Natura avertismentului exprimat prin πλανήσῃ
  choice: „să nu vă ducă nimeni în rătăcire”, ca avertisment larg împotriva amăgirii și abaterii
  alternative: „să nu vă înșele nimeni”, cu accent mai direct pe înșelare
  rationale: În contextul afirmațiilor escatologice false, verbul nu trebuie restrâns la o eroare pur intelectuală. Formularea principală păstrează tensiunea dintre a fi înșelat și a fi abătut de la calea dreaptă.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea este naturală în vorbirea adresată unui grup, fără arhaisme; „în rătăcire” păstrează metafora și amploarea semantică a verbului grec.
