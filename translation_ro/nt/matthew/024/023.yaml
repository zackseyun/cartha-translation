id: MAT.24.23
reference: Matthew 24:23
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τότε ἐάν τις ὑμῖν εἴπῃ· Ἰδοὺ ὧδε ὁ χριστός, ἤ· Ὧδε, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/023.yaml
  text: Then if anyone says to you[a], ‘Look, here is the Messiah!’ or[b], ‘There he is!’ do not believe it.
translation:
  language: ro
  text: 'Atunci, dacă vă spune cineva: „Iată, aici este Mesia[a]!” sau: „Aici!”[b], să nu credeți.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Cristosul”.'
    reason: Variantă de redare a titlului grec ὁ χριστός.
  - marker: b
    text: 'Subînțeles: „Este aici!” sau „Iată-l aici!”'
    reason: Greaca are aici numai adverbul „aici”, într-o formulare eliptică.
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Redă firesc adverbul temporal și păstrează legătura cu desfășurarea discursului precedent.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: dacă vă spune cineva
  rationale: Construcția condițională și subiectul nehotărât sunt exprimate natural în româna actuală, fără restrângerea referentului.
- source_word: Ἰδοὺ
  choice: Iată
  rationale: Interjecție deictică demnă și încă vie în română, potrivită pentru atragerea atenției.
- source_word: ὧδε
  choice: aici
  rationale: Păstrează sensul local direct al ambelor ocurențe ale adverbului grec.
- source_word: ὁ χριστός
  choice: Mesia
  rationale: Articolul și contextul identificării pretinsului eliberator arată că termenul funcționează aici ca titlu mesianic, nu ca nume propriu.
- source_word: ἤ· Ὧδε
  choice: 'sau: „Aici!”'
  rationale: Păstrează elipsa abruptă a grecei și evită introducerea în text a unui verb ori a unui pronume absent; nota oferă forma explicitată.
- source_word: μὴ πιστεύσητε
  choice: să nu credeți
  rationale: Redă natural în română interdicția cu μή și conjunctivul aorist; obiectul afirmației se înțelege din context și nu trebuie adăugat.
theological_decisions:
- issue: Redarea lui Χριστός
  choice: Mesia
  alternative: Cristosul
  rationale: În acest context, termenul desemnează titlul celui uns și așteptat. „Mesia” face transparent acest sens, iar alternativa tradițională este păstrată în notă.
- issue: Referentul elipsei Ὧδε
  choice: 'Elipsa este păstrată: „Aici!”'
  alternative: „Este aici!” / „Iată-l aici!”
  rationale: Textul grec conține numai adverbul local; păstrarea formei eliptice evită să precizeze mai mult decât sursa, fără a face replica de neînțeles în română.
translation_notes:
  register: Română standard modernă, clară și demnă. „Iată” păstrează forța de indicare fără arhaizare excesivă, iar elipsa celei de-a doua replici este menținută pentru fidelitate față de textul grec.
