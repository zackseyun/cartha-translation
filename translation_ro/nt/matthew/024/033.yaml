id: MAT.24.33
reference: Matthew 24:33
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ⸂πάντα ταῦτα⸃, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/033.yaml
  text: So also you[a], when you see all these things, know that it is near, at the doors.
translation:
  language: ro
  text: Tot așa și voi, când veți vedea toate acestea, să știți că este aproape, chiar la uși.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „el este aproape”. În greacă, subiectul nu este exprimat explicit.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Tot așa și voi
  rationale: Redă comparația cu pilda smochinului și păstrează accentul pus pe destinatari într-o formulare românească firească.
- source_word: ὅταν ἴδητε
  choice: când veți vedea
  rationale: Construcția temporală cu conjunctiv aorist privește aici spre un moment viitor; viitorul românesc exprimă natural sensul.
- source_word: πάντα ταῦτα
  choice: toate acestea
  rationale: Păstrează explicit pluralul neutru fără a preciza interpretativ că ar fi vorba numai despre evenimente.
- source_word: γινώσκετε
  choice: să știți
  rationale: Redă direct forța imperativă, într-o formă idiomatică în română, fără a o transforma în «înțelegeți» sau «recunoașteți».
- source_word: ἐγγύς ἐστιν
  choice: este aproape
  rationale: Româna permite omiterea subiectului, păstrând astfel ambiguitatea autentică a grecei mai bine decât introducerea explicită a lui «el» sau «acest lucru».
- source_word: ἐπὶ θύραις
  choice: chiar la uși
  rationale: Păstrează pluralul grecesc și redă valoarea idiomatică de apropiere nemijlocită; «chiar» face firească și clară intensificarea în română.
theological_decisions:
- issue: Subiectul implicit al expresiei ἐγγύς ἐστιν
  choice: 'Subiect neexprimat: «este aproape»'
  alternative: «el este aproape» sau «acest lucru este aproape»
  rationale: Textul grec nu exprimă subiectul, iar referentul poate fi înțeles drept Fiul Omului sau realitatea/evenimentul apropiat. Româna poate conserva ambiguitatea fără un pronume introdus de traducător.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea «Tot așa și voi» leagă versetul de comparația precedentă, iar «chiar la uși» păstrează imaginea și pluralul sursei.
