reference: Matthew 24:22
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ἐκολοβώθησαν αἱ ἡμέραι ἐκεῖναι, οὐκ ἂν ἐσώθη πᾶσα σάρξ· διὰ δὲ τοὺς ἐκλεκτοὺς κολοβωθήσονται αἱ ἡμέραι ἐκεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/022.yaml
  text: And if those days had not been cut short[a], no flesh would have been saved; but for the sake of the elect[b], those days will be cut short.
translation:
  language: ro
  text: Și dacă zilele acelea nu ar fi fost scurtate[a], niciun om nu ar fi fost salvat[b]; dar de dragul celor aleși[c], zilele acelea vor fi scurtate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „curmate”. Verbul grecesc poate exprima scurtarea ori retezarea; aici se referă la reducerea duratei acelor zile.
    reason: lexical_alternative
  - marker: b
    text: Literal, „nu ar fi fost salvat niciun trup”. „Orice trup” este un idiom biblic pentru omenire; în context, salvarea are în vedere în primul rând păstrarea vieții.
    reason: idiom_and_semantic_range
  - marker: c
    text: Textul îi numește „cei aleși”, fără să precizeze aici mai îndeaproape identitatea acestui grup.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἐκολοβώθησαν / κολοβωθήσονται
  choice: nu ar fi fost scurtate / vor fi scurtate
  rationale: Verbul κολοβόω exprimă reducerea sau curmarea a ceva. Cu referire la zile, „scurtate” este formularea românească firească și păstrează ideea că durata lor este redusă.
- source_word: οὐκ ἂν ἐσώθη
  choice: nu ar fi fost salvat
  rationale: Construcția redă rezultatul contrar realității. „Salvat” păstrează aria semantică a lui σῴζω, în timp ce împrejurarea sugerează în primul rând păstrarea vieții fizice, fără a restrânge nejustificat sensul la „ar fi supraviețuit”.
- source_word: πᾶσα σάρξ
  choice: niciun om
  rationale: Expresia literală „orice trup” este un idiom biblic pentru omenire sau pentru ființele omenești. În propoziția negativă, „niciun om” redă clar și firesc sensul în româna actuală.
- source_word: διὰ δὲ τοὺς ἐκλεκτούς
  choice: dar, de dragul celor aleși
  rationale: διά cu acuzativul indică aici motivul sau beneficiul. „De dragul” redă această nuanță, iar „cei aleși” păstrează desemnarea grupului fără a-i defini identitatea mai mult decât o face textul.
- source_word: αἱ ἡμέραι ἐκεῖναι
  choice: zilele acelea
  rationale: Formulare directă și naturală, care păstrează valoarea demonstrativă a expresiei grecești.
- source_word: καὶ εἰ μὴ
  choice: Și, dacă ... nu
  rationale: Păstrează atât conjuncția de legătură, cât și structura condițională explicită a textului grecesc.
theological_decisions:
- issue: Identitatea „celor aleși” în discursul escatologic
  choice: Păstrarea expresiei „cei aleși” fără explicație identitară în text
  alternative: poporul ales al lui Dumnezeu; credincioșii; rămășița credincioasă
  rationale: Versetul numește grupul prin ἐκλεκτοί, dar nu precizează aici întregul său referent teologic. Formularea păstrează ambiguitatea reală și nu impune o schemă confesională.
- issue: Sensul lui σῴζω în context
  choice: „salvat”, cu o notă care recunoaște referința contextuală la păstrarea vieții
  alternative: ar fi supraviețuit; ar fi rămas în viață
  rationale: Contextul privește supraviețuirea unor zile de mare necaz, însă verbul grecesc are o arie mai largă decât simpla supraviețuire. „Salvat” păstrează această deschidere semantică fără a transforma automat afirmația într-una exclusiv soteriologică.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Sintaxa condițională și pasivul sunt păstrate aproape de greacă, iar idiomul πᾶσα σάρξ este redat firesc în text și explicat în notă.
