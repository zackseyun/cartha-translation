source:
  edition: SBLGNT
  text: ἐκεῖνο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ φυλακῇ ὁ κλέπτης ἔρχεται, ἐγρηγόρησεν ἂν καὶ οὐκ ἂν εἴασεν διορυχθῆναι τὴν οἰκίαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/043.yaml
  text: 'But know this: if the master of the house had known in what watch the thief was coming[b][a], he would have stayed awake and would not have let his house be broken into.'
translation:
  language: ro
  text: 'Să știți însă aceasta: dacă stăpânul casei ar fi știut în ce strajă a nopții vine hoțul, ar fi vegheat și nu ar fi lăsat să-i fie spartă casa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, „să i se sape prin casă”; verbul înseamnă „a săpa prin” și evocă pătrunderea prin zidul sau acoperișul unei case în lumea antică.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνο δὲ γινώσκετε
  choice: Dar să știți aceasta
  rationale: Redă natural în română valoarea imperativă a lui γινώσκετε și schimbarea de discurs marcată de δέ, păstrând adresarea directă.
- source_word: οἰκοδεσπότης
  choice: stăpânul casei
  rationale: Păstrează rolul social de cap al gospodăriei, fără presupunerea modernă implicată de „proprietarul casei”.
- source_word: ποίᾳ φυλακῇ
  choice: la ce strajă din noapte
  rationale: φυλακή denumește aici una dintre perioadele în care era împărțită noaptea; formularea păstrează particularitatea culturală și rămâne inteligibilă.
- source_word: ὁ κλέπτης ἔρχεται
  choice: vine hoțul
  rationale: Prezentul românesc se potrivește în propoziția completivă dependentă de condiționalul contrafactual și păstrează prezentul grecesc fără rigiditate.
- source_word: ἐγρηγόρησεν ἂν
  choice: ar fi vegheat
  rationale: Redă atât ideea de a rămâne treaz, cât și pe aceea de a sta de pază, potrivindu-se imaginii hoțului care vine noaptea.
- source_word: οὐκ ἂν εἴασεν
  choice: nu ar fi lăsat
  rationale: Este echivalentul românesc firesc al permisiunii negate în construcția contrafactuală.
- source_word: διορυχθῆναι τὴν οἰκίαν αὐτοῦ
  choice: să-i fie spartă casa
  rationale: Comunică idiomatic pătrunderea prin efracție, iar sensul literal al străpungerii prin săpare este păstrat în nota de subsol.
theological_decisions:
- issue: Redarea imaginii stăpânului gospodăriei
  choice: stăpânul casei
  alternative: proprietarul casei; capul gospodăriei
  rationale: Imaginea este ilustrativă, nu un titlu doctrinar. Alegerea păstrează nuanța socială a termenului grecesc fără a introduce concepții moderne despre proprietate.
- issue: Redarea imaginii antice a spargerii casei
  choice: să-i fie spartă casa
  alternative: să-i fie străpunsă casa; să-i fie săpată casa
  rationale: Textul principal exprimă firesc în română sensul contextual al pătrunderii hoțului, iar nota păstrează imaginea concretă a construcției antice.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Strajă din noapte” păstrează cadrul cultural antic, iar „ar fi vegheat” menține legătura cu îndemnul la veghere din context.
