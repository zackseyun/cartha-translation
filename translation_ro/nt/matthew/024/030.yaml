id: MAT.24.30
reference: Matthew 24:30
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ τότε φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν ⸀τῷ οὐρανῷ, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/030.yaml
  text: And then the sign of the Son of Man will appear in heaven[a], and then all the tribes of the earth will mourn[c][b], and they will see the Son of Man coming on the clouds of heaven with power and great glory.
translation:
  language: ro
  text: Atunci se va arăta în cer[a] semnul Fiului Omului și atunci toate triburile pământului[b] se vor tângui, iar ele Îl vor vedea pe Fiul Omului venind pe norii cerului[c], cu putere și cu mare slavă.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „pe cer”. Termenul grecesc οὐρανός poate desemna cerul ca locuință cerească sau bolta cerească.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „toate triburile țării”. Termenul grecesc γῆ poate însemna „pământ” sau „țară”.'
    reason: alternative_reading
  - marker: c
    text: Expresia „venind pe norii cerului” face trimitere la Daniel 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: φανήσεται
  choice: se va arăta
  rationale: Redă natural valoarea intranzitivă a formei grecești și ideea unei manifestări vizibile.
- source_word: τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: semnul Fiului Omului
  rationale: Păstrează construcția genitivală și ambiguitatea dacă semnul îi aparține Fiului Omului sau dacă el însuși este semnul.
- source_word: ἐν τῷ οὐρανῷ
  choice: în cer
  rationale: Păstrează registrul apocaliptic, fără a exclude sensul spațial „pe cer”, indicat în notă.
- source_word: κόψονται
  choice: se vor tângui
  rationale: În acest uz, verbul denumește lamentarea; formularea este demnă și redă mai precis nuanța decât termenul general „vor plânge”.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: toate semințiile pământului
  rationale: „Semințiile” păstrează sensul direct al lui φυλαί și rezonanța profetică, iar „pământului” este potrivit contextului cosmic, fără a elimina alternativa „țării”.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: pe norii cerului
  rationale: Redare directă a imaginii și a ecoului din Daniel 7:13.
- source_word: μετὰ δυνάμεως καὶ δόξης πολλῆς
  choice: cu putere și cu multă slavă
  rationale: Păstrează faptul că adjectivul grec determină direct „slava” și oferă o formulare românească firească.
theological_decisions:
- issue: Sensul expresiei „semnul Fiului Omului”
  choice: Este păstrată formularea genitivală „semnul Fiului Omului”.
  alternative: „semnul care îi aparține Fiului Omului” sau „semnul, adică Fiul Omului însuși”
  rationale: Textul grec nu impune una dintre aceste interpretări, astfel că traducerea nu rezolvă o chestiune escatologică disputată.
- issue: Întinderea sensului lui γῆ
  choice: „pământului” în textul principal
  alternative: „țării”
  rationale: Contextul cosmic favorizează sensul universal, însă aluzia profetică permite și o referire la țară, alternativă păstrată în notă.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Fiul Omului” păstrează titulatura biblică consacrată, iar „semințiile” menține rezonanța profetică fără a înlocui termenul cu o interpretare mai generală.
