  text: ἰδοὺ προείρηκα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/025.yaml
  text: Look, I have told you beforehand.
translation:
  language: ro
  text: Iată, v-am spus dinainte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: Iată
  rationale: Interjecție românească firească și demnă, care atrage atenția asupra avertizării ce urmează.
- source_word: προείρηκα
  choice: am spus dinainte
  rationale: Redă atât ideea de a spune, cât și prefixul temporal προ- («dinainte»); perfectul grec susține relevanța prezentă a avertizării deja rostite.
- source_word: ὑμῖν
  choice: v-am
  rationale: Pronumele la dativ plural este redat natural în română prin cliticul «v-», indicând destinatarii declarației.
theological_decisions:
- issue: Forța avertizării retrospective
  choice: «v-am spus dinainte»
  alternative: «v-am prevenit»
  rationale: Formularea aleasă păstrează sensul lexical explicit al lui προείρηκα fără a intensifica verbul prin interpretarea lui drept «a preveni», deși contextul are evident funcție de avertizare.
translation_notes:
  register: Română standard modernă, concisă și solemnă. «Iată» este preferat lui «Uitați» pentru a evita ambiguitatea formei verbale și pentru a păstra registrul biblic demn fără arhaizare excesivă.
