source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπὶ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, καὶ ἔσονται ⸀λιμοὶ καὶ σεισμοὶ κατὰ τόπους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/007.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom[b], and there will be famines and earthquakes in various places.
translation:
  language: ro
  text: Căci o națiune se va ridica împotriva altei națiuni și o împărăție împotriva altei împărății, și vor fi foamete și cutremure în diferite locuri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „pe alocuri” ori „din loc în loc”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: se va ridica
  rationale: Redă firesc viitorul formei pasive/mediale în construcția idiomatică de ostilitate, fără a introduce ideea explicită că Dumnezeu ar provoca ridicarea.
- source_word: γὰρ
  choice: Căci
  rationale: Păstrează legătura explicativă cu afirmația precedentă într-un registru biblic demn, dar încă ușor de înțeles.
- source_word: ἔθνος
  choice: națiune
  rationale: În paralel cu «împărăție», desemnează un popor privit ca entitate colectivă și politică; alegerea evită limitarea la sensul de «neam păgân».
- source_word: ἐπὶ ἔθνος
  choice: împotriva altei națiuni
  rationale: Prepoziția are aici sens ostil; adăugarea lui «altei» este cerută de exprimarea românească naturală și face limpede raportul reciproc fără a schimba sensul.
- source_word: βασιλεία
  choice: împărăție
  rationale: Termenul se referă aici la un teritoriu sau stat condus de un rege și păstrează registrul politic și apocaliptic.
- source_word: ἔσονται
  choice: vor fi
  rationale: Redă direct și natural folosirea existențială a verbului εἰμί.
- source_word: λιμοὶ
  choice: foamete
  rationale: În română, «foamete» poate avea valoare colectivă și redă lipsurile grave de hrană; forma «foamete» poate fi citită aici ca plural nearticulat, identic grafic cu singularul.
- source_word: σεισμοὶ
  choice: cutremure
  rationale: Este echivalentul românesc standard și neechivoc în acest context.
- source_word: κατὰ τόπους
  choice: pe alocuri
  rationale: 'Redă concis valoarea distributivă a expresiei: evenimentele se produc în diferite locuri, nu într-un singur loc.'
theological_decisions:
- issue: Sfera semantică a lui ἔθνος în descrierea conflictului escatologic
  choice: națiune
  alternative: popor; neam
  rationale: Paralelismul cu «împărăție» indică grupuri colective aflate în conflict. «Națiune» păstrează dimensiunea politico-socială fără a impune sensul restrâns de neam păgân.
- issue: Forța viitorului ἐγερθήσεται
  choice: se va ridica împotriva
  alternative: va fi ridicată împotriva; se va porni împotriva
  rationale: Construcția descrie izbucnirea ostilității. Forma reflexivă românească păstrează formularea evenimențială fără a presupune un agent divin nenumit.
- issue: Relația dintre calamități și locuri în κατὰ τόπους
  choice: pe alocuri
  alternative: în diferite locuri; din loc în loc
  rationale: Toate variantele păstrează distribuția geografică. Alegerea nu afirmă nici universalitatea simultană, nici o succesiune obligatorie a evenimentelor.
translation_notes:
  register: Română standard modernă, cu o ușoară demnitate biblică. «Căci» păstrează legătura argumentativă, iar construcțiile paralele conservă ritmul textului grec. Nota este plasată după expresia la care se referă.
