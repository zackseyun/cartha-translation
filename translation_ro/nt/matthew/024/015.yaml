id: MAT.24.15
reference: Matthew 24:15
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ὅταν οὖν ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου ⸀ἑστὸς ἐν τόπῳ ἁγίῳ, ὁ ἀναγινώσκων νοείτω,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/015.yaml
  text: So when you see the abomination of desolation spoken of through Daniel the prophet standing in a holy place—let the reader understand—[a][b]
translation:
  language: ro
  text: Așadar, când veți vedea „urâciunea pustiirii”, care a fost rostită prin profetul Daniel, stând într-un loc sfânt — cititorul să înțeleagă —[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, în formularea mai tradițională: „în locul sfânt”.'
    reason: alternative_reading
  - marker: b
    text: 'Sau: „urâciunea pustiitoare” ori „urâciunea care provoacă pustiirea”, expresie care face trimitere la Daniel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Așadar, când
  rationale: Redă legătura logică și tranziția marcată de οὖν, precum și împrejurarea viitoare introdusă de ὅταν, într-o formulare românească firească.
- source_word: ἴδητε
  choice: veți vedea
  rationale: Forma de persoana a doua plural este păstrată, iar viitorul românesc exprimă natural situația profetică avută în vedere de construcția grecească.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: urâciunea pustiirii
  rationale: Păstrează construcția genitivală și ecoul recognoscibil din Daniel, fără a preciza interpretativ dacă urâciunea produce pustiirea sau este caracterizată de ea.
- source_word: τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου
  choice: despre care s-a vorbit prin profetul Daniel
  rationale: Exprimă natural în română referirea la rostirea profetică și păstrează valoarea instrumentală sau de mijlocire a lui διά prin formularea „prin profetul Daniel”.
- source_word: ἑστὸς
  choice: stând
  rationale: Redă direct participiul lui ἵστημι fără a introduce ideea interpretativă de „așezat” sau „instalat”.
- source_word: ἐν τόπῳ ἁγίῳ
  choice: într-un loc sfânt
  rationale: Articolul nehotărât reflectă lipsa articolului în greacă și evită identificarea obligatorie a locului cu o anumită parte a templului.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: cititorul să înțeleagă
  rationale: Formulare românească scurtă și firească, ce păstrează îndemnul adresat celui care citește.
theological_decisions:
- issue: Caracterul definit al expresiei τόπῳ ἁγίῳ și eventuala identificare exclusivă cu templul
  choice: într-un loc sfânt
  alternative: în locul sfânt
  rationale: Deși contextul poate evoca templul sau un spațiu consacrat anume, formularea grecească fără articol nu impune această restrângere. Varianta tradițională și mai specifică este menționată în notă.
- issue: Sensul raportului genitival din βδέλυγμα τῆς ἐρημώσεως
  choice: urâciunea pustiirii
  alternative: urâciunea pustiitoare; urâciunea care provoacă pustiirea
  rationale: Formularea principală păstrează ambiguitatea expresiei și legătura verbală cu Daniel, fără a decide dacă genitivul descrie efectul produs sau o altă relație semantică.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Expresia consacrată „urâciunea pustiirii” este păstrată pentru ecoul ei biblic, iar propoziția parantetică este marcată prin linii de pauză.
