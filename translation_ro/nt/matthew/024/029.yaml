  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Εὐθέως δὲ μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς, καὶ οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ, καὶ αἱ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/029.yaml
  text: But immediately after the tribulation of those days[a], the sun will be darkened, and the moon will not give its light, and the stars will fall from heaven[b], and the powers of the heavens will be shaken.
translation:
  language: ro
  text: Dar imediat după necazul acelor zile, soarele se va întuneca, luna nu-și va da lumina, stelele vor cădea din cer[a], iar puterile cerurilor vor fi zguduite[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „din bolta cerească”. Termenul grecesc poate însemna atât „cer”, cât și „boltă cerească”.'
    reason: lexical_alternative
  - marker: b
    text: Expresia „puterile cerurilor” poate desemna forțe cosmice, corpuri cerești sau puteri cerești; formularea grecească rămâne largă.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐθέως δὲ
  choice: Dar imediat
  rationale: Redă atât tranziția ușor contrastivă marcată de δὲ, cât și sensul temporal puternic al lui Εὐθέως, într-o formulare românească firească.
- source_word: μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων
  choice: după necazul acelor zile
  rationale: „Necazul” păstrează gravitatea escatologică a lui θλῖψις fără a impune o interpretare tehnică, iar genitivul este redat direct prin „acelor zile”.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: soarele se va întuneca
  rationale: Construcția reflexiv-pasivă este idiomatică în româna actuală și redă viitorul pasiv grecesc fără formularea greoaie „va fi întunecat”.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: luna nu-și va mai da lumina
  rationale: Păstrează imaginea literală a lunii care nu își dă lumina; „mai” exprimă natural încetarea luminii în acest context.
- source_word: οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ
  choice: stelele vor cădea din cer
  rationale: Redare directă și naturală; „cer” conservă registrul biblic și permite atât sensul de boltă cerească, cât și rezonanța mai largă a lui οὐρανός.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: puterile cerurilor
  rationale: Păstrează pluralul grecesc și ambiguitatea expresiei, fără a decide dacă este vorba despre forțe cosmice, corpuri cerești sau puteri cerești.
- source_word: σαλευθήσονται
  choice: vor fi zguduite
  rationale: Redă limpede viitorul pasiv și forța verbului σαλεύω, fiind potrivit imagisticii cosmice și profetice.
theological_decisions:
- issue: Natura semnelor cosmice din discursul apocaliptic
  choice: Imaginile sunt păstrate fără explicarea lor ca fiind exclusiv literale sau exclusiv simbolice.
  alternative: Interpretarea explicită drept prăbușire astronomică literală ori drept simbol al unor tulburări politice și judiciare.
  rationale: Textul folosește imagini profetice și apocaliptice și nu precizează aici raportul dintre dimensiunea literală și cea simbolică; traducerea trebuie să păstreze această tensiune.
- issue: Referentul expresiei „puterile cerurilor”
  choice: Expresia largă este păstrată literal.
  alternative: Precizarea referentului ca îngeri, forțe cosmice sau corpuri cerești.
  rationale: Grecescul αἱ δυνάμεις τῶν οὐρανῶν nu identifică fără echivoc referentul, astfel că o precizare în text ar restrânge nejustificat sensul.
translation_notes:
  register: Română standard modernă, cu ton solemn și profetic, dar fără arhaisme. Coordonarea finală prin „iar” evită repetarea rigidă a lui „și”, păstrând succesiunea imaginilor. Marcajele notelor au fost așezate lângă expresiile pe care le explică.
