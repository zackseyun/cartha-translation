id: MAT.24.34
reference: Matthew 24:34
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα ταῦτα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/034.yaml
  text: Truly I tell you that this generation will certainly not pass away until all these things happen[a].
translation:
  language: ro
  text: Adevărat vă spun că generația aceasta nicidecum nu va trece până când se vor întâmpla toate acestea[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „acest popor” ori „acest neam”. Cuvântul grecesc poate fi înțeles și într-un sens mai larg, dar „generația” este redarea cea mai directă aici.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Adevărat
  rationale: În formula solemnă ἀμὴν λέγω ὑμῖν, „Adevărat” redă afirmația întărită într-o română firească și demnă, fără transliterarea mai puțin transparentă „Amin”.
- source_word: λέγω ὑμῖν
  choice: vă spun
  rationale: Redare directă și idiomatică a formulei de adresare, păstrând persoana întâi și pluralul destinatarilor.
- source_word: ὅτι
  choice: că
  rationale: Introduce explicit propoziția completivă după formula solemnă, potrivit sintaxei românești curente.
- source_word: οὐ μὴ παρέλθῃ
  choice: nicidecum nu va trece
  rationale: Construcția οὐ μή cu conjunctivul aorist exprimă o negație viitoare categorică; „nicidecum nu va trece” îi păstrează accentul fără formulare arhaică.
- source_word: ἡ γενεὰ αὕτη
  choice: generația aceasta
  rationale: „Generația” este echivalentul lexical cel mai direct în context și păstrează deschisă tensiunea interpretativă a discursului escatologic.
- source_word: ἕως ἂν
  choice: până când
  rationale: Redă limita temporală și caracterul viitor al evenimentelor indicate de construcția grecească.
- source_word: πάντα ταῦτα
  choice: toate acestea
  rationale: Păstrează explicit pluralul neutru și trimiterea la ansamblul evenimentelor menționate anterior.
- source_word: γένηται
  choice: se vor întâmpla
  rationale: În acest context, γίνομαι descrie producerea unor evenimente; viitorul este cerut firesc în română de cadrul propoziției.
theological_decisions:
- issue: Sensul expresiei ἡ γενεὰ αὕτη în discursul escatologic
  choice: generația aceasta
  alternative: acest popor; acest neam
  rationale: Redarea lexicală directă nu decide în favoarea unei scheme escatologice și nu restrânge ori lărgește interpretativ referentul dincolo de ceea ce spune termenul grec.
translation_notes:
  register: Română standard modernă, solemnă și accesibilă. Topica păstrează accentul negației categorice, iar formularea evită atât arhaismele, cât și explicarea confesională a expresiei disputate.
