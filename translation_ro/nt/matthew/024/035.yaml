  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσεται, οἱ δὲ λόγοι μου οὐ μὴ παρέλθωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/035.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: ro
  text: Cerul și pământul vor trece, dar cuvintele Mele nicidecum nu vor trece.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „nu vor trece niciodată”. În greacă, negația este emfatică (οὐ μή).'
    reason: alternativă lexicală și explicarea intensității negației
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: Cerul
  rationale: În asocierea escatologică cu γῆ, singularul desemnează cerul ca parte a ordinii create, nu doar bolta vizibilă. Formula românească firească este „cerul și pământul”.
- source_word: ἡ γῆ
  choice: pământul
  rationale: În expresia consacrată „cerul și pământul”, γῆ are sens cosmic, desemnând pământul, nu un ținut anume.
- source_word: παρελεύσεται
  choice: vor trece
  rationale: Verbul exprimă dispariția sau încetarea ordinii create prezente. „Vor trece” este sobru și păstrează imaginea originalului fără a preciza mecanismul.
- source_word: δὲ
  choice: dar
  rationale: Conjuncția introduce contrastul dintre caracterul trecător al cerului și al pământului și permanența cuvintelor lui Isus.
- source_word: οἱ λόγοι μου
  choice: cuvintele Mele
  rationale: λόγοι se referă aici la declarațiile și învățătura rostite de Isus. „Cuvintele Mele” este redarea directă și naturală.
- source_word: οὐ μὴ παρέλθωσιν
  choice: nicidecum nu vor trece
  rationale: Construcția οὐ μή cu conjunctivul aorist exprimă o negație categorică. „Nicidecum nu vor trece” îi păstrează accentul într-o română demnă și clară.
theological_decisions:
- issue: Forța afirmației lui Isus despre permanența cuvintelor Sale
  choice: Afirmația este redată ca un contrast categoric între ordinea creată, care va trece, și cuvintele lui Isus, care nicidecum nu vor trece.
  alternative: O formulare interpretativă care ar explicita implicațiile privind autoritatea divină sau ar reda negația prin „nu vor trece niciodată”.
  rationale: Textul afirmă direct și solemn permanența cuvintelor lui Isus. Traducerea păstrează această greutate teologică fără a adăuga o explicație doctrinară absentă din verset.
translation_notes:
  register: Română standard modernă, solemnă și accesibilă. Paralelismul celor două propoziții și repetarea verbului „vor trece” păstrează contrastul retoric al originalului. Majuscula reverențială din „Mele” urmează uzul biblic românesc, fără a modifica sensul.
