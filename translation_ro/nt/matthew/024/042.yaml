id: MAT.24.42
reference: Matthew 24:42
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε ποίᾳ ⸀ἡμέρᾳ ὁ κύριος ὑμῶν ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/042.yaml
  text: Therefore stay awake[c][b][a], because you do not know on what day your Lord is coming.
translation:
  language: ro
  text: Vegheați[a], așadar, pentru că nu știți în ce zi vine Domnul vostru.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „Rămâneți treji” ori „Fiți vigilenți”.
    reason: lexical_alternative
  - marker: b
    text: Sau „va veni Domnul vostru”. Greaca folosește aici o formă de prezent.
    reason: alternative_reading
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Vegheați
  rationale: Imperativul prezent, la plural, cere o vigilență continuă. „Vegheați” păstrează metafora stării de trezie și este firesc în registrul biblic românesc actual.
- source_word: οὖν
  choice: așadar
  rationale: Marchează concluzia care decurge din învățătura precedentă; poziția postverbală este naturală în română.
- source_word: ὅτι
  choice: pentru că
  rationale: Introduce motivul poruncii într-o formulare clară și contemporană.
- source_word: οὐκ οἴδατε
  choice: nu știți
  rationale: Redă direct verbul negat, fără adaosuri interpretative.
- source_word: ποίᾳ ἡμέρᾳ
  choice: în ce zi
  rationale: Dativul exprimă timpul; „în ce zi” este formularea idiomatică românească și păstrează caracterul necunoscut al zilei.
- source_word: ὁ κύριος ὑμῶν
  choice: Domnul vostru
  rationale: Redă natural articolul, substantivul și pronumele posesiv, păstrând titlul consacrat și ideea de autoritate.
- source_word: ἔρχεται
  choice: vine
  rationale: Prezentul românesc corespunde formei de prezent din greacă și poate avea în context valoare viitoare, fără a o explicita excesiv.
theological_decisions:
- issue: Forța escatologică a prezentului ἔρχεται
  choice: vine
  alternative: va veni
  rationale: Prezentul păstrează expresia vie și urgentă a textului grec, lăsând neprecizată relația exactă dintre prezent și viitor și evitând impunerea unei cronologii doctrinare.
translation_notes:
  register: Română standard modernă, clară și demnă. „Vegheați” păstrează metafora și tonul imperativ, iar „vine” conservă forma de prezent și tensiunea escatologică a originalului.
