id: MAT.24.21
reference: Matthew 24:21
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἔσται γὰρ τότε θλῖψις μεγάλη οἵα οὐ γέγονεν ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν οὐδ’ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/021.yaml
  text: For then there will be great tribulation[a], such as has not happened from the beginning of the world until now, and never will happen again.
translation:
  language: ro
  text: Căci atunci va fi o mare strâmtorare[a], cum n-a mai fost de la începutul lumii până acum și nici nu va mai fi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „un mare necaz”, „o mare suferință” ori „o mare apăsare”. Termenul grecesc poate desemna o încercare severă, presiune sau asuprire.
    reason: alternativă lexicală
lexical_decisions:
- source_word: γὰρ τότε
  choice: Căci atunci
  rationale: „Căci” păstrează legătura explicativă cu avertizarea anterioară, iar „atunci” redă direct reperul temporal.
- source_word: ἔσται ... θλῖψις μεγάλη
  choice: va fi o mare strâmtorare
  rationale: Construcția este firească în româna actuală. „Strâmtorare” exprimă o încercare apăsătoare și păstrează gravitatea și rezonanța escatologică a termenului, fără a-i impune o interpretare doctrinară mai precisă.
- source_word: οἵα οὐ γέγονεν
  choice: cum n-a mai fost
  rationale: Redă comparația calitativă și caracterul fără precedent al strâmtorării; formularea cu „a fost” este idiomatică în română pentru existența unei asemenea situații.
- source_word: ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν
  choice: de la începutul lumii până acum
  rationale: Traducere directă și naturală a expresiei temporale; „lumii” redă κόσμου fără extinderea interpretativă „creației”.
- source_word: οὐδ’ οὐ μὴ γένηται
  choice: și nici nu va mai fi
  rationale: Dubla formulare negativă românească transmite negația viitoare categorică; „mai” exprimă firesc faptul că o asemenea strâmtorare nu se va repeta.
theological_decisions:
- issue: Redarea termenului escatologic θλῖψις
  choice: strâmtorare
  alternative: necaz; suferință; apăsare
  rationale: „Strâmtorare” păstrează atât ideea de suferință severă și presiune, cât și rezonanța biblică a termenului, fără a identifica versetul cu o schemă escatologică confesională anume.
- issue: Forța afirmației finale
  choice: și nici nu va mai fi
  alternative: și nu se va mai întâmpla niciodată
  rationale: Formularea aleasă păstrează negația viitoare emfatică și paralelismul cu „n-a mai fost”, fără a adăuga explicit un verb evenimențial care nu este necesar în română.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Strâmtorare” este ușor elevat și biblic, dar rămâne inteligibil; restul frazei folosește o sintaxă curentă și clară.
