  text: ⸀ὡς γὰρ ἦσαν ἐν ταῖς ⸀ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ τρώγοντες καὶ πίνοντες, γαμοῦντες καὶ ⸀γαμίζοντες, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/038.yaml
  text: For as in the days before the flood they were eating and drinking[a], marrying and giving in marriage, until the day Noah entered the ark,
translation:
  language: ro
  text: Căci, așa cum în zilele dinaintea potopului oamenii mâncau și beau, se căsătoreau și dădeau în căsătorie[a], până în ziua când Noe a intrat în arcă,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greaca distinge între „se căsătoreau” și γαμίζοντες; acesta din urmă poate însemna „dădeau în căsătorie” sau „erau date în căsătorie”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς γὰρ
  choice: Căci, așa cum
  rationale: „Căci” păstrează rolul explicativ al lui γάρ, iar „așa cum” redă comparația introdusă de ὡς într-o formulare românească firească.
- source_word: ἦσαν ... τρώγοντες καὶ πίνοντες
  choice: oamenii mâncau și beau
  rationale: Imperfectul împreună cu participiile descrie activități aflate în desfășurare. Subiectul generic „oamenii” este exprimat pentru claritate în română, fără a restrânge referința.
- source_word: ἐν ταῖς ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ
  choice: în zilele dinaintea potopului
  rationale: Redare temporală naturală; „potop” este termenul românesc consacrat și clar în relatarea despre Noe.
- source_word: τρώγοντες καὶ πίνοντες
  choice: mâncau și beau
  rationale: Imperfectul românesc exprimă caracterul obișnuit și continuu al acțiunilor, fără a introduce ideea de exces sau vinovăție.
- source_word: γαμοῦντες
  choice: se căsătoreau
  rationale: Redă direct sensul obișnuit al verbului γαμέω și păstrează neutralitatea activității descrise.
- source_word: γαμίζοντες
  choice: dădeau în căsătorie
  rationale: Păstrează deosebirea lexicală față de γαμοῦντες și sensul activ de a da pe cineva în căsătorie, fără a introduce explicit un obiect absent din text.
- source_word: ἄχρι ἧς ἡμέρας
  choice: până în ziua când
  rationale: Marchează firesc în română limita temporală a activităților în desfășurare.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: Noe a intrat în arcă
  rationale: Perfectul compus redă evenimentul punctual, iar „arcă” păstrează termenul biblic consacrat pentru κιβωτός în narațiunea despre Noe.
theological_decisions:
- issue: Dacă activitățile enumerate trebuie prezentate ca excese păcătoase sau ca viață obișnuită desfășurată înaintea judecății
  choice: Activitățile sunt redate neutru, ca acțiuni omenești obișnuite.
  alternative: O formulare care ar sugera îmbuibare, beție ori nepăsare morală.
  rationale: Participiile grecești nu conțin calificative morale. În context, accentul cade pe continuarea vieții obișnuite până la venirea neașteptată a judecății, nu pe caracterul păcătos al mâncatului, băutului sau căsătoriei.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează paralelismul acțiunilor și tonul neutru al textului, iar virgula finală reflectă faptul că propoziția continuă în versetul următor.
