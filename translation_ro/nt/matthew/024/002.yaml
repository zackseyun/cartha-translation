id: MAT.24.2
reference: Matthew 24:2
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Οὐ βλέπετε ⸂ταῦτα πάντα⸃; ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀφεθῇ ὧδε λίθος ἐπὶ λίθον ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/002.yaml
  text: But he answered and said to them[a], “Do you not see all these things? Truly I tell you, not one stone here will be left upon another that will not be thrown down.”
translation:
  language: ro
  text: 'Iar el le-a răspuns: „Nu vedeți voi toate acestea? Adevărat vă spun: nu va rămâne nicidecum aici piatră pe piatră care să nu fie dărâmată[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „demolată” ori „distrusă”. Verbul grecesc poate desemna desfacerea sau demolarea unei construcții; „dărâmată” păstrează imaginea concretă a pietrelor scoase din loc.
    reason: alternativă lexicală
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: le-a răspuns
  rationale: Construcția grecească participiu + verb finit este redată prin formula românească firească „le-a răspuns”, care păstrează sensul replicii fără rigiditatea lui „răspunzând, le-a zis”.
- source_word: Οὐ βλέπετε
  choice: Nu vedeți voi
  rationale: Redă întrebarea retorică ce așteaptă confirmare; pronumele „voi” susține accentul fără a îngreuna formularea.
- source_word: ταῦτα πάντα
  choice: toate acestea
  rationale: Păstrează explicit pluralul neutru și trimiterea contextuală la clădirile templului.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Adevărat vă spun
  rationale: Formulă solemnă, clară și consacrată în româna biblică actuală, care redă forța lui ἀμήν.
- source_word: οὐ μὴ ἀφεθῇ
  choice: nu va rămâne nicidecum
  rationale: „Nicidecum” face perceptibilă negația grecească intensificată οὐ μή, iar „va rămâne” exprimă natural în română rezultatul pasivului „va fi lăsată”.
- source_word: ὧδε
  choice: aici
  rationale: Redare locativă directă, referitoare la locul templului aflat în discuție.
- source_word: λίθος ἐπὶ λίθον
  choice: piatră pe piatră
  rationale: Expresie românească naturală care păstrează imaginea arhitecturală și ideea demolării totale.
- source_word: καταλυθήσεται
  choice: va fi dărâmată
  rationale: În contextul unei construcții, verbul indică desfacerea sau demolarea; „dărâmată” păstrează imaginea concretă a pietrelor scoase din loc.
theological_decisions:
- issue: Întinderea și forța prezicerii lui Isus despre templu
  choice: O prezicere concretă a demolării totale a construcției
  alternative: O afirmație în primul rând simbolică despre judecată sau una încadrată explicit într-un anumit sistem escatologic
  rationale: Imaginea pietrelor care nu mai rămân una peste alta este concretă și arhitecturală. Traducerea îi păstrează forța fără a adăuga o schemă escatologică neexprimată în verset.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea evită atât calchierea rigidă a construcției grecești „răspunzând, a zis”, cât și atenuarea negației accentuate. Marcajul notei este așezat lângă termenul pe care îl explică.
