  text: ⸀ὅπου ἐὰν ᾖ τὸ πτῶμα, ἐκεῖ συναχθήσονται οἱ ἀετοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/028.yaml
  text: Wherever the corpse is[a], there the vultures will gather.
translation:
  language: ro
  text: Oriunde este cadavrul, acolo se vor aduna vulturii.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „acvile”. Termenul grecesc poate desemna acvile, dar contextul unui cadavru sugerează păsări care se hrănesc cu stârvuri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν ᾖ
  choice: Oriunde este
  rationale: Construcția cu ἐάν și conjunctivul exprimă un loc nedefinit; „oriunde” redă firesc această valoare în româna actuală.
- source_word: πτῶμα
  choice: cadavrul
  rationale: Termenul denumește un trup mort. „Cadavru” este precis și păstrează imaginea fără a presupune dacă este vorba despre un om sau un animal.
- source_word: συναχθήσονται
  choice: se vor aduna
  rationale: Deși forma greacă este pasivă, în context poate avea sens intranzitiv; formularea românească este naturală și păstrează ideea strângerii păsărilor într-un loc.
- source_word: ἀετοί
  choice: vulturii
  rationale: Grecescul ἀετός desemnează în mod obișnuit vulturi/acvile, iar termenul românesc „vulturi” poate reda lexemul fără a restrânge nejustificat specia; asocierea cu un cadavru sugerează păsări care se hrănesc cu stârvuri. Alternativa mai explicită „vulturii pleșuvi” este menționată în notă.
theological_decisions:
- issue: Interpretarea imaginii proverbiale
  choice: Imaginea este tradusă direct, fără identificarea simbolică a cadavrului sau a păsărilor.
  alternative: Explicarea ei ca judecată inevitabilă, ca vizibilitate a venirii Fiului Omului ori ca referire la distrugerea Ierusalimului sau la însemnele romane.
  rationale: Textul grecesc nu precizează referentul simbolic al imaginii; traducerea trebuie să păstreze ambiguitatea și tensiunea escatologică.
translation_notes:
  register: Română standard modernă, concisă și demnă. Ordinea propozițiilor urmărește paralelismul originalului, iar formularea nu adaugă o interpretare escatologică.
