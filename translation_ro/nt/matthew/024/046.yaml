  text: μακάριος ὁ δοῦλος ἐκεῖνος ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ⸂οὕτως ποιοῦντα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/046.yaml
  text: Blessed is that servant whom his lord, when he comes, will find doing so.
translation:
  language: ro
  text: Fericit este slujitorul acela pe care stăpânul lui, când va veni, îl va găsi făcând astfel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: Fericit
  rationale: Redă formula de binecuvântare prin echivalentul românesc consacrat și firesc.
- source_word: δοῦλος
  choice: slujitorul
  rationale: În contextul administrării casei, „slujitor” este natural și demn în româna actuală, păstrând relația de subordonare fără a impune inutil sensul social mai îngust „sclav”.
- source_word: κύριος
  choice: stăpânul
  rationale: În relație cu slujitorul și cu pronumele posesiv, „stăpânul lui” redă sensul contextual al autorității personale; minuscula nu transformă anticipat termenul într-un titlu divin explicit.
- source_word: οὕτως ποιοῦντα
  choice: făcând astfel
  rationale: Păstrează trimiterea anaforică la conduita descrisă anterior și urmează concizia greacă.
theological_decisions:
- issue: Valoarea lui κύριος în parabolă
  choice: stăpânul lui
  alternative: Domnul lui
  rationale: Textul vorbește direct despre stăpânul slujitorului din scenă, chiar dacă parabola are o aplicare cristologică. Traducerea păstrează nivelul narativ fără a elimina implicația teologică.
- issue: Forța semantică a lui δοῦλος
  choice: slujitorul
  alternative: sclavul
  rationale: „Slujitor” se potrivește rolului de administrator din context și evită restrângerea imaginii la statutul juridic modern sugerat de „sclav”, deși termenul grec poate include robia.
translation_notes:
  register: Română standard modernă, cu registru biblic demn și sintaxă limpede. Ordinea propoziției păstrează accentul inițial pe fericirea slujitorului credincios.
