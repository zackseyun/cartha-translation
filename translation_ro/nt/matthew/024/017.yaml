base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/017.yaml
  text: Let the one on the housetop not go down to take the things out of his house,[a]
translation:
  language: ro
  text: Cel care este pe acoperiș să nu coboare ca să ia lucrurile din casa lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Casele din acea vreme aveau de obicei acoperișuri plate, care puteau fi folosite ca spațiu de locuit sau de lucru.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: Cel care este pe acoperiș
  rationale: Redă construcția articulată cu valoare substantivală și păstrează singularul reprezentativ, într-o formulare românească firească.
- source_word: δώματος
  choice: acoperiș
  rationale: Termenul desemnează partea superioară a casei, în context un acoperiș plat și utilizabil; „acoperiș” este echivalentul modern cel mai limpede.
- source_word: μὴ καταβάτω
  choice: să nu coboare
  rationale: Subjonctivul românesc redă natural imperativul negativ grecesc și păstrează caracterul urgent al poruncii.
- source_word: ἆραι
  choice: ca să ia
  rationale: Infinitivul exprimă scopul coborârii; construcția finală românească redă clar această relație.
- source_word: τὰ ἐκ τῆς οἰκίας αὐτοῦ
  choice: lucrurile din casa lui
  rationale: Expresia grecească este eliptică și se referă la obiectele aflate în casă; „lucrurile” rămâne concret și mai puțin interpretativ decât „bunurile” sau „avutul”.
- source_word: οἰκίας
  choice: casa
  rationale: Păstrează sensul fizic al clădirii, relevant pentru coborârea de pe acoperiș.
- source_word: αὐτοῦ
  choice: lui
  rationale: Păstrează pronumele masculin singular al textului, folosit aici cu valoare reprezentativă.
theological_decisions:
- issue: Referința masculină reprezentativă
  choice: Păstrarea singularului masculin „lui”
  alternative: Formulare neutralizată, de tipul „din casă” sau plural generic
  rationale: Greaca folosește un subiect reprezentativ la singular și pronumele masculin αὐτοῦ. Redarea nu afirmă o limitare la bărbați, dar păstrează forma sursei fără neutralizare inutilă.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea este apropiată de structura greacă, dar evită rigiditatea; nota explică realitatea culturală necesară pentru înțelegerea scenei.
