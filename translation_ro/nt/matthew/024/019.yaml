  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/019.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a].
translation:
  language: ro
  text: Dar vai de cele însărcinate și de cele care alăptează în zilele acelea!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαί
  choice: vai
  rationale: Păstrează forța exclamativă și profetică a avertizării sau lamentației în fața unei nenorociri iminente.
- source_word: δὲ
  choice: Dar
  rationale: Marchează tranziția ușor contrastivă față de îndemnul precedent, fără a accentua excesiv opoziția.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: cele însărcinate
  rationale: Redă firesc în româna actuală idiomul grec «a avea în pântece» și păstrează referința feminină a construcției.
- source_word: ταῖς θηλαζούσαις
  choice: cele care alăptează
  rationale: Exprimă natural acțiunea de a hrăni la sân; obiectul rămâne implicit, ca în greacă, dar este limpede din uzul românesc.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: în zilele acelea
  rationale: Este o redare directă, idiomatică și demnă a expresiei temporale grecești.
theological_decisions:
- issue: Referentul formelor feminine la dativ și al participiilor
  choice: cele însărcinate și cele care alăptează
  alternative: femeile însărcinate și femeile care alăptează
  rationale: Formele grecești sunt explicit feminine, iar pronumele românesc «cele» păstrează această informație fără introducerea substantivului «femeile», absent din text. Accentul rămâne asupra vulnerabilității acestor stări în vremea necazului.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea este apropiată de structura sursei, dar evită literalismul nefiresc «cele care au în pântece». Semnul exclamării redă caracterul exclamativ al lui οὐαί.
