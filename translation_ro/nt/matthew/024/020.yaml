id: MAT.24.20
reference: Matthew 24:20
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: προσεύχεσθε δὲ ἵνα μὴ γένηται ἡ φυγὴ ὑμῶν χειμῶνος μηδὲ σαββάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/020.yaml
  text: But pray that your flight may not happen in winter or on a Sabbath[a].
translation:
  language: ro
  text: Dar rugați-vă ca fuga voastră să nu aibă loc iarna, nici într-o zi de sabat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „în ziua sabatului”.'
    reason: Redare alternativă posibilă pentru substantivul grecesc nearticulat σαββάτῳ.
lexical_decisions:
- source_word: προσεύχεσθε
  choice: rugați-vă
  rationale: Imperativul prezent, persoana a doua plural, este redat firesc prin imperativul românesc; aspectul continuu poate fi înțeles din context fără adaos explicit.
- source_word: δὲ
  choice: Dar
  rationale: Marchează o ușoară opoziție sau tranziție față de avertismentul anterior.
- source_word: ἵνα μὴ γένηται
  choice: ca ... să nu aibă loc
  rationale: Construcția cu ἵνα și conjunctiv exprimă conținutul rugăciunii, iar formularea românească redă natural sensul evenimențial al lui γίνομαι.
- source_word: ἡ φυγὴ ὑμῶν
  choice: fuga voastră
  rationale: Păstrează sensul direct de fugă sau plecare grăbită, fără a presupune că scăparea va reuși.
- source_word: χειμῶνος
  choice: iarna
  rationale: Genitivul temporal este redat idiomatic în română prin adverbul temporal „iarna”.
- source_word: μηδὲ σαββάτῳ
  choice: nici într-o zi de sabat
  rationale: Redă coordonarea negativă și păstrează caracterul nearticulat al substantivului grecesc, clarificând totodată că este vorba despre o zi.
theological_decisions:
- issue: Redarea lui σαββάτῳ cu sens definit sau nedefinit
  choice: într-o zi de sabat
  alternative: în ziua sabatului
  rationale: Substantivul grecesc nu are articol. Textul principal păstrează această nedeterminare formală, iar formularea tradițională, definită, este oferită în notă fără a soluționa forțat nuanța.
translation_notes:
  register: Română literară modernă, clară și demnă. „Sabat” este termenul consacrat și inteligibil; „într-o zi de sabat” evită atât arhaizarea, cât și impunerea nejustificată a determinării.
