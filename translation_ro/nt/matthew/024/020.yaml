  verdict: approve
  source_fidelity: 'Textul redă fidel imperativul plural προσεύχεσθε («rugați-vă»), conținutul rugăciunii introdus de ἵνα μὴ γένηται, «fuga voastră», precum și cele două circumstanțe temporale negative: iarna și într-o zi de sabat. «Să nu aibă loc» exprimă firesc sensul evenimențial al lui γένηται, fără adaos interpretativ.'
  naturalness: Formularea este clară, literară și firească în româna standard modernă. «Dar rugați-vă ca fuga voastră să nu aibă loc iarna, nici într-o zi de sabat» păstrează concizia și gravitatea contextului.
  terminology: «Sabat» este termenul românesc consacrat. Redarea nearticulată «într-o zi de sabat» este defensabilă pentru σαββάτῳ nearticulat; nota oferă, în mod corespunzător, alternativa idiomatică și tradițională «în ziua sabatului», fără a impune o soluție exegetică.
