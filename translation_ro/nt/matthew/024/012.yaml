id: MAT.24.12
reference: Matthew 24:12
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ διὰ τὸ πληθυνθῆναι τὴν ἀνομίαν ψυγήσεται ἡ ἀγάπη τῶν πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/012.yaml
  text: And because lawlessness will be multiplied[b][a], the love of many will grow cold.
translation:
  language: ro
  text: Și, pentru că fărădelegea se va înmulți, dragostea multora se va răci.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „dragostea celor mulți se va răci”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ πληθυνθῆναι
  choice: pentru că ... se va înmulți
  rationale: Construcția διά cu infinitivul articulat exprimă cauza, iar infinitivul aorist pasiv πληθυνθῆναι are aici orientare spre viitor. Formularea păstrează forța verbală și este firească în româna actuală.
- source_word: ἀνομίαν
  choice: fărădelegea
  rationale: ἀνομία desemnează nesocotirea sau încălcarea legii, îndeosebi a legii lui Dumnezeu. „Fărădelege” este termenul românesc direct, demn și inteligibil; „răutatea” ar fi mai larg și mai puțin precis.
- source_word: ψυγήσεται
  choice: se va răci
  rationale: Forma viitoare redă metaforic diminuarea iubirii. „Se va răci” este idiomatic în română și păstrează imaginea originalului.
- source_word: ἀγάπη
  choice: dragostea
  rationale: „Dragostea” redă natural substantivul ἀγάπη în acest context relațional, fără a-i restrânge sensul printr-o interpretare confesională.
- source_word: τῶν πολλῶν
  choice: multora
  rationale: Genitivul articulat are un domeniu larg, dar nedefinit. „Multora” este formularea românească naturală și nu transformă expresia într-o afirmație statistică precum „celor mai mulți”.
theological_decisions:
- issue: Domeniul expresiei „dragostea multora”
  choice: Formulare fără precizarea identității celor mulți
  alternative: „dragostea dintre credincioși” sau „dragostea oamenilor”
  rationale: Textul grec nu precizează dacă este vorba despre ucenici declarați, despre oameni în general ori despre un grup mixt. Traducerea păstrează această deschidere interpretativă.
- issue: Cauzalitatea dintre înmulțirea fărădelegii și răcirea dragostei
  choice: 'Legătură cauzală explicită: „pentru că”'
  alternative: „din cauza înmulțirii fărădelegii”
  rationale: διά cu infinitivul articulat exprimă explicit cauza. Varianta verbală păstrează și dinamismul lui πληθυνθῆναι.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Ordinea propozițiilor și metafora răcirii sunt păstrate, iar formularea evită atât arhaizarea excesivă, cât și explicitarea interpretativă a grupului desemnat prin τῶν πολλῶν.
