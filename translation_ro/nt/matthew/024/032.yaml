source:
  edition: SBLGNT
  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ἤδη ὁ κλάδος αὐτῆς γένηται ἁπαλὸς καὶ τὰ φύλλα ἐκφύῃ, γινώσκετε ὅτι ἐγγὺς τὸ θέρος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/032.yaml
  text: 'Learn the parable from the fig tree: as soon as its branch becomes tender and puts out leaves[c][b][a], you know that summer is near.'
translation:
  language: ro
  text: 'Învățați de la smochin această pildă[a]: când ramura lui devine deja fragedă și înfrunzește[b], știți că vara[c] este aproape.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „învățătura” ori „comparația”.
    reason: lexical_alternative
  - marker: b
    text: Sau „îi ies frunzele” ori „dă frunze”.
    reason: lexical_alternative
  - marker: c
    text: Termenul grecesc θέρος poate însemna „vară” și, în anumite contexte, vremea secerișului; aici sensul sezonier se potrivește cel mai bine imaginii smochinului.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: de la smochin
  rationale: Prepoziția ἀπό cu genitivul indică sursa învățăturii. Formularea românească păstrează această relație fără a introduce un adverb temporal care nu apare explicit în expresie.
- source_word: μάθετε
  choice: învățați
  rationale: Imperativul aorist al lui μανθάνω este redat printr-o poruncă directă; „învățați” păstrează ideea de a primi învățătură, nu doar rezultatul înțelegerii.
- source_word: τὴν παραβολήν
  choice: această pildă
  rationale: „Pildă” este termenul românesc consacrat și accesibil pentru παραβολή. Demonstrativul face construcția firească în română și indică ilustrația care urmează, fără a-i adăuga o interpretare.
- source_word: ὅταν ἤδη
  choice: când ... deja
  rationale: ὅταν introduce situația temporală generală, iar ἤδη marchează faptul că schimbarea a început deja; redarea separată păstrează ambele valori.
- source_word: ὁ κλάδος αὐτῆς γένηται ἁπαλὸς
  choice: ramura lui devine ... fragedă
  rationale: γένηται indică o schimbare de stare, iar ἁπαλός descrie frăgezimea sau suplețea creșterii noi. „Ramura” redă direct κλάδος.
- source_word: καὶ τὰ φύλλα ἐκφύῃ
  choice: și îi dau frunzele
  rationale: Expresia românească firească descrie apariția frunzelor și păstrează imaginea botanică a verbului ἐκφύω.
- source_word: γινώσκετε
  choice: știți
  rationale: 'Forma este indicativ prezent, persoana a doua plural, cu valoare generală: observarea semnului duce la cunoașterea apropierii verii.'
- source_word: ἐγγὺς τὸ θέρος
  choice: vara este aproape
  rationale: În contextul semnului sezonier oferit de smochin, θέρος denumește în primul rând vara, iar ἐγγύς exprimă apropierea ei.
theological_decisions:
- issue: Semnificația imaginii smochinului
  choice: Imaginea este redată ca o pildă sezonieră, fără identificarea explicită a smochinului cu Israel.
  alternative: Smochinul este interpretat în traducere fie ca simbol al lui Israel, fie doar ca exemplu generic din natură.
  rationale: Versetul prezintă observația naturii ca analogie pentru recunoașterea apropierii unui eveniment, dar nu explică aici o identitate simbolică a smochinului. Traducerea păstrează deschisă interpretarea contextului escatologic.
translation_notes:
  register: Română standard modernă, într-un registru demn și ușor de înțeles. Sintaxa rămâne apropiată de succesiunea ideilor din greacă, dar folosește expresii românești firești; „deja” păstrează explicit valoarea lui ἤδη.
