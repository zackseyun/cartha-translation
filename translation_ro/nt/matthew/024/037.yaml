  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ αἱ ἡμέραι τοῦ Νῶε, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/037.yaml
  text: For just as the days of Noah were[a], so the coming of the Son of Man will be.
translation:
  language: ro
  text: Căci, cum au fost zilele lui Noe, așa va fi și venirea[a] Fiului Omului.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „prezența”. Cuvântul grecesc poate însemna „prezență” ori „sosire”, dar aici se referă la venirea viitoare a Fiului Omului.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ
  choice: așa cum
  rationale: Introduce primul termen al comparației și se corelează firesc în română cu „tot așa”.
- source_word: γὰρ
  choice: Căci
  rationale: Păstrează legătura explicativă cu afirmația precedentă, într-un registru biblic demn, dar încă actual.
- source_word: αἱ ἡμέραι τοῦ Νῶε
  choice: au fost zilele lui Noe
  rationale: Greaca lasă predicatul neexprimat în primul termen al comparației; „au fost” îl completează minimal și firesc în română.
- source_word: Νῶε
  choice: Noe
  rationale: Folosește forma consacrată a numelui în limba română.
- source_word: οὕτως
  choice: tot așa
  rationale: Redă clar corelația comparativă ὥσπερ ... οὕτως prin construcția românească „așa cum ... tot așa”.
- source_word: ἔσται
  choice: va fi
  rationale: Redă direct viitorul verbului εἰμί, fără a adăuga o interpretare evenimențială verbului.
- source_word: παρουσία
  choice: venirea
  rationale: În acest context escatologic, termenul indică venirea viitoare a Fiului Omului; „venirea” este clar și natural, iar alternativa lexicală „prezența” este menționată în notă.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Fiului Omului
  rationale: Păstrează titlul consacrat și rezonanța lui biblică, inclusiv legătura cu Daniel.
theological_decisions:
- issue: Redarea lui παρουσία într-o afirmație escatologică
  choice: venirea
  alternative: prezența; sosirea
  rationale: Contextul indică manifestarea viitoare a Fiului Omului. „Venirea” comunică cel mai firesc sensul evenimențial în română, fără a ascunde faptul că termenul grec poate desemna și „prezența”.
translation_notes:
  register: Română standard modernă, clară și demnă. Construcția corelativă „așa cum ... tot așa” păstrează forma comparației grecești; majusculele din „Fiului Omului” marchează titlul consacrat.
