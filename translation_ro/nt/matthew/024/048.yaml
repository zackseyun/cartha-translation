  text: ἐὰν δὲ εἴπῃ ὁ κακὸς δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ⸂μου ὁ κύριος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/048.yaml
  text: But if that wicked servant says in his heart[b][a], ‘My master is delaying,’
translation:
  language: ro
  text: 'Dar dacă acel rob[a] rău spune în inima lui: „Stăpânul[b] meu întârzie”,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „acel slujitor rău”. Termenul grecesc doulos poate desemna un rob sau un slujitor, în funcție de context.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „Domnul meu întârzie”. Aici, „stăpânul” reflectă cadrul gospodăresc al parabolei; termenul grecesc este kyrios.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Dar, dacă
  rationale: Redă firesc atât contrastul ușor introdus de δέ, cât și condiția exprimată prin ἐὰν cu conjunctivul aorist.
- source_word: εἴπῃ
  choice: își zice
  rationale: În legătură cu expresia „în inima lui”, verbul descrie vorbirea lăuntrică; forma românească păstrează condiția și evită o formulare rigidă.
- source_word: ὁ κακὸς δοῦλος ἐκεῖνος
  choice: acel rob rău
  rationale: „Acel” păstrează valoarea demonstrativă a lui ἐκεῖνος, „rău” exprimă caracterizarea morală dată de κακός, iar „rob” redă direct statutul indicat de δοῦλος în cadrul gospodăriei.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: în inima lui
  rationale: Păstrează metafora grecească pentru gândirea lăuntrică și are un registru biblic firesc în româna modernă.
- source_word: Χρονίζει
  choice: întârzie
  rationale: Redă concis acțiunea prezentată ca prelungire a așteptării, fără a preciza motivul întârzierii.
- source_word: μου ὁ κύριος
  choice: Stăpânul meu
  rationale: În cadrul gospodăresc al parabolei, κύριος denumește superiorul robului; „stăpân” păstrează clar relația implicată de δοῦλος și nu elimină rezonanța mai largă a parabolei.
theological_decisions:
- issue: Redarea lui κύριος în cadrul gospodăresc al parabolei
  choice: stăpân
  alternative: domn / Domn
  rationale: Sensul imediat este cel al stăpânului unui rob. Forma „stăpân” redă relația narativă fără a impune în vorbirea personajului un titlu divin explicit, dar nici nu împiedică cititorul să recunoască referentul parabolic mai larg.
- issue: Redarea lui δοῦλος
  choice: rob
  alternative: slujitor
  rationale: „Rob” exprimă mai exact statutul social și relația de stăpânire presupuse de termenul grec. „Slujitor” este posibil contextual, dar poate estompa această dimensiune.
translation_notes:
  register: Română standard modernă, cu o formulare demnă și limpede. Metafora „în inima lui” este păstrată, iar perechea „rob–stăpân” redă coerent relația socială din parabolă. Marcajele notelor sunt plasate după citat, în ordinea [a][b].
