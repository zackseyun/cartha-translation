  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔγνωσαν ἕως ἦλθεν ὁ κατακλυσμὸς καὶ ἦρεν ἅπαντας, οὕτως ἔσται ⸀καὶ ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/039.yaml
  text: And they did not know until the flood came and swept them all away; so also will be the coming of the Son of Man.
translation:
  language: ro
  text: Și n-au știut nimic până când a venit potopul și i-a luat pe toți; tot așa va fi și venirea Fiului Omului.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: n-au știut nimic
  rationale: Redă firesc în română lipsa lor de conștientizare, fără a transforma verbul într-o afirmație despre imposibilitatea de a cunoaște.
- source_word: κατακλυσμός
  choice: potopul
  rationale: Termenul românesc consacrat și limpede pentru potopul din relatarea despre Noe.
- source_word: ἦρεν ἅπαντας
  choice: i-a luat pe toți
  rationale: Păstrează sensul de bază al lui αἴρω și ambiguitatea imaginii, fără intensificarea interpretativă „i-a măturat”.
- source_word: οὕτως ... καὶ
  choice: tot așa ... și
  rationale: Păstrează construcția comparativă și particula καί atestată în text.
- source_word: παρουσία
  choice: venirea
  rationale: În acest context escatologic, termenul desemnează sosirea/prezența Fiului Omului; „venirea” este formularea naturală și consacrată.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Redă titlul cristologic în forma românească tradițională și ușor de înțeles.
theological_decisions:
- issue: Cine este „luat” în comparația cu potopul
  choice: i-a luat pe toți
  alternative: i-a măturat pe toți
  rationale: Formularea nu deduce din verset o doctrină despre luarea credincioșilor sau a necredincioșilor, ci păstrează referirea directă la victimele potopului și sensul lexical al verbului.
- issue: Natura lui παρουσία
  choice: venirea Fiului Omului
  alternative: prezența Fiului Omului
  rationale: Contextul comparației cu venirea potopului favorizează ideea sosirii, fără a preciza aici detalii despre modul sau etapele evenimentului.
translation_notes:
  register: Română standard modernă, cu formulare demnă și accesibilă. Inversiunea ușoară „n-au știut” păstrează fluența biblică fără arhaizare; nu sunt necesare note de subsol.
