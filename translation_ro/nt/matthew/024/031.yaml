  text: καὶ ἀποστελεῖ τοὺς ἀγγέλους αὐτοῦ μετὰ ⸀σάλπιγγος μεγάλης, καὶ ἐπισυνάξουσιν τοὺς ἐκλεκτοὺς αὐτοῦ ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρων οὐρανῶν ἕως ⸀τῶν ἄκρων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/031.yaml
  text: And he will send out his angels with a loud trumpet[a], and they will gather his chosen ones from the four winds[d][c][b], from one end of the heavens to the other.
translation:
  language: ro
  text: Și îi va trimite pe îngerii săi cu o trâmbiță răsunătoare[a], iar ei îi vor aduna pe aleșii săi[b] din cele patru vânturi[c], de la o margine a cerurilor până la cealaltă[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „cu o trâmbiță mare” ori „cu sunet puternic de trâmbiță”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „pe cei aleși ai săi”.'
    reason: lexical_alternative
  - marker: c
    text: Expresia „cele patru vânturi” se referă la toate direcțiile, până în cele mai îndepărtate locuri.
    reason: cultural_note
  - marker: d
    text: 'Literal: „de la marginile cerurilor până la marginile lor”, expresie care înseamnă de la o extremitate la alta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: îi va trimite
  rationale: Viitorul verbului ἀποστέλλω exprimă trimiterea cu o însărcinare; formularea românească este firească și păstrează sensul fără solemnitate artificială.
- source_word: ἀγγέλους
  choice: îngerii
  rationale: În contextul escatologic sunt avute în vedere ființe cerești, nu mesageri omenești.
- source_word: μετὰ σάλπιγγος μεγάλης
  choice: cu sunet puternic de trâmbiță
  rationale: μετά cu genitivul indică însoțirea, iar μεγάλη poate sugera măreția sau intensitatea sonoră. Formularea redă natural în română semnalul trâmbiței, fără a pierde imaginea instrumentului; alternativele mai literale sunt consemnate în notă.
- source_word: ἐπισυνάξουσιν
  choice: îi vor aduna
  rationale: Verbul la viitor are ca subiect îngerii și indică strângerea laolaltă; în română, „a aduna” exprimă suficient ideea prefixului ἐπι-.
- source_word: ἐκλεκτούς
  choice: aleșii
  rationale: „Aleșii” este echivalentul românesc direct, consacrat și inteligibil al lui ἐκλεκτοί, fără a explica în text natura sau temeiul alegerii.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: din cele patru vânturi
  rationale: Păstrează imaginea biblică a celor patru vânturi și nu o înlocuiește în text cu parafraza interpretativă „din cele patru zări”.
- source_word: ἀπ’ ἄκρων οὐρανῶν ἕως τῶν ἄκρων αὐτῶν
  choice: de la o margine a cerurilor până la cealaltă
  rationale: Redă idiomatic întinderea totală exprimată de construcția greacă și păstrează pluralul οὐρανῶν prin „cerurilor”.
theological_decisions:
- issue: Redarea lui ἐκλεκτούς în context escatologic
  choice: aleșii
  alternative: cei aleși
  rationale: Textul îi identifică drept cei aleși ai Fiului Omului, fără să precizeze aici cadrul sistematic al alegerii. Substantivul „aleșii” păstrează concizia și tensiunea teologică a sursei.
- issue: Întinderea adunării
  choice: din cele patru vânturi, de la o margine a cerurilor până la cealaltă
  alternative: din cele patru zări, de la un capăt al cerului la celălalt
  rationale: Este păstrată imaginea cosmică și cuprinzătoare a textului, fără restrângerea ei la o geografie explicit pământească.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Formularea păstrează imaginile biblice „trâmbiță”, „cele patru vânturi” și pluralul „cerurilor”, explicând în note alternativele lexicale și caracterul idiomatic al expresiilor.
