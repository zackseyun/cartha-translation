  text: But the one who endures to the end will be saved[a][b].
translation:
  language: ro
  text: Dar cel care va răbda până la sfârșit[a] va fi mântuit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „până la capăt”.'
    reason: Alternativă lexicală pentru εἰς τέλος, care exprimă continuarea până la punctul final.
  - marker: b
    text: 'Sau: „va fi izbăvit”. Verbul grecesc poate avea sensul de „a mântui” sau „a izbăvi”; formularea din text păstrează sensul mai larg, deoarece contextul nu cere restrângerea lui.'
    reason: Lectură alternativă care păstrează amplitudinea semantică a verbului σῴζω.
lexical_decisions:
- source_word: ὁ ... ὑπομείνας
  choice: cel care va răbda
  rationale: Articolul împreună cu participiul aorist formează o expresie substantivală despre persoana care stăruie sub încercare. În română, propoziția relativă cu viitorul redă firesc perspectiva orientată spre împlinirea viitoare, fără a transforma aoristul într-o acțiune strict trecută.
- source_word: δὲ
  choice: Dar
  rationale: Conjuncția marchează contrastul moderat față de avertismentele anterioare despre abatere și răcirea dragostei.
- source_word: ὑπομείνας (ὑπομένω)
  choice: va răbda
  rationale: Verbul denotă rămânerea sub încercare, rezistența și perseverența. „Va răbda” este direct, accesibil și păstrează ideea de îndurare fără a adăuga o nuanță doctrinară.
- source_word: εἰς τέλος
  choice: până la sfârșit
  rationale: Expresia indică menținerea perseverenței până la punctul final; formularea românească este firească și nu precizează nejustificat natura exactă a acelui sfârșit.
- source_word: οὗτος
  choice: redat prin reluarea firească a subiectului în construcția „cel care ... va fi”
  rationale: Pronumele este emfatic și resumptiv în greacă. În româna modernă, sensul lui este transmis natural prin construcția corelativă, fără adaosul mai greoi „acela”.
- source_word: σωθήσεται
  choice: va fi mântuit
  rationale: Viitorul pasiv al lui σῴζω poate desemna atât salvarea, cât și izbăvirea. „Va fi mântuit” păstrează sensul larg, inclusiv dimensiunea escatologică, fără a-l reduce la o scăpare temporară.
theological_decisions:
- issue: Sensul lui „va fi mântuit” în contextul escatologic al perseverenței
  choice: Se păstrează formularea largă „va fi mântuit”.
  alternative: „va fi izbăvit”, cu accent posibil pe scăparea din necaz
  rationale: Versetul nu stabilește explicit dacă este vorba exclusiv despre mântuirea escatologică finală, despre izbăvirea din necaz sau despre ambele; traducerea păstrează această tensiune.
- issue: Natura „sfârșitului”
  choice: „până la sfârșit”, fără identificarea explicită a punctului final
  alternative: Precizarea sfârșitului vieții, al necazului sau al veacului
  rationale: Contextul permite discutarea mai multor referințe, dar propoziția însăși nu le delimitează suficient pentru ca traducerea să aleagă una.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Va răbda” păstrează concizia și forța expresiei grecești; ordinea propoziției este naturală în română, iar notele consemnează numai alternative reale ale sursei.
