  text: καὶ ὁ ἐν τῷ ἀγρῷ μὴ ἐπιστρεψάτω ὀπίσω ἆραι ⸂τὸ ἱμάτιον⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/018.yaml
  text: And let the one in the field not turn back to take his cloak[a].
translation:
  language: ro
  text: Iar cel care este la câmp să nu se întoarcă să-și ia mantia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „veșmântul” ori „veșmântul de deasupra”.
    reason: Alternativă lexicală pentru ἱμάτιον, care poate desemna generic un veșmânt sau, mai precis, haina exterioară.
lexical_decisions:
- source_word: ὁ ἐν τῷ ἀγρῷ
  choice: cel care este la câmp
  rationale: Redă construcția articulată substantivală ca referire generică la o persoană, păstrând singularul fără a limita nejustificat sensul la bărbați. În româna curentă, „la câmp” este firesc în acest context.
- source_word: μὴ ἐπιστρεψάτω ὀπίσω
  choice: să nu se întoarcă
  rationale: Conjunctivul cu valoare imperativă exprimă natural interdicția în română; verbul „a se întoarce” include aici sensul contextual al lui ὀπίσω, astfel că adăugarea lui „înapoi” ar fi redundantă.
- source_word: ἆραι
  choice: să-și ia
  rationale: Infinitivul exprimă scopul întoarcerii. „Să-și ia” este idiomatic și redă atât acțiunea de a lua, cât și posesia indicată de αὐτοῦ.
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: mantia
  rationale: ἱμάτιον desemnează adesea veșmântul exterior sau mantia. „Mantia” este precisă, inteligibilă și potrivită scenei unei plecări urgente; nota păstrează alternativa mai generală.
theological_decisions:
- issue: Reprezentarea genului în articolul masculin substantival
  choice: cel care este la câmp
  alternative: bărbatul care este la câmp
  rationale: Masculinul grecesc are aici valoare reprezentativă și generică. Formularea aleasă păstrează referirea individuală la singular fără a restrânge avertismentul numai la bărbați.
translation_notes:
  register: Română standard modernă, clară și demnă. Construcția „să nu se întoarcă să-și ia” păstrează urgența interdicției și exprimă firesc scopul acțiunii.
