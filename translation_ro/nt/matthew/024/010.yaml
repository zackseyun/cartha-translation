  text: καὶ τότε σκανδαλισθήσονται πολλοὶ καὶ ἀλλήλους παραδώσουσιν καὶ μισήσουσιν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/010.yaml
  text: And then many will fall away[b][a], and they will betray one another and hate one another.
translation:
  language: ro
  text: Și atunci mulți vor cădea[a], se vor trăda[b] unii pe alții și se vor urî unii pe alții.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „vor fi făcuți să se poticnească” ori „se vor simți ofensați”.
    reason: lexical_alternative
  - marker: b
    text: Sau „se vor da unii pe alții pe mâna altora”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: atunci
  rationale: Redă direct adverbul temporal și păstrează succesiunea din discurs.
- source_word: σκανδαλισθήσονται
  choice: vor cădea
  rationale: Exprimă o prăbușire spirituală sau o îndepărtare sub presiune, fără a introduce explicit un complement absent din greacă; nota păstrează sensurile alternative ale verbului.
- source_word: πολλοὶ
  choice: mulți
  rationale: Redare directă și firească a adjectivului folosit substantival.
- source_word: ἀλλήλους
  choice: unii pe alții
  rationale: Păstrează clar sensul reciproc al pronumelui în ambele apariții.
- source_word: παραδώσουσιν
  choice: se vor trăda
  rationale: În contextul persecuției și al ostilității dintre oameni, verbul are forța contextuală de a da pe cineva în mâna altora prin trădare.
- source_word: μισήσουσιν
  choice: se vor urî
  rationale: Redă simplu și direct ostilitatea activă exprimată de verb.
- source_word: καὶ τότε ... καὶ ... καὶ ...
  choice: Și atunci ... , ... și ...
  rationale: „Și atunci” păstrează legătura cu contextul anterior, iar coordonarea românească redă cursiv acumularea acțiunilor fără o repetare rigidă.
theological_decisions:
- issue: Sensul lui σκανδαλισθήσονται în contextul persecuției escatologice
  choice: vor cădea
  alternative: vor fi făcuți să se poticnească; se vor simți lezați și se vor îndepărta
  rationale: Alegerea păstrează gravitatea unei cedări sau îndepărtări spirituale sugerate de context, dar evită să precizeze o doctrină despre apostazie pe care formularea greacă nu o dezvoltă aici.
- issue: Forța contextuală a lui παραδώσουσιν
  choice: se vor trăda
  alternative: se vor da unii pe alții pe mâna altora
  rationale: „Se vor trăda” exprimă natural în română caracterul ostil și perfid al predării, iar nota păstrează imaginea mai literală.
translation_notes:
  register: Română standard modernă, cu formulare demnă și accesibilă. Repetarea expresiei „unii pe alții” păstrează reciprocitatea accentuată din greacă, iar succesiunea cădere–trădare–ură rămâne clară.
