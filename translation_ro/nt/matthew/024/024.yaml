  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε ⸀πλανῆσαι εἰ δυνατὸν καὶ τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/024.yaml
  text: For false messiahs and false prophets will arise[a], and they will perform great signs and wonders so as to lead astray, if possible[c][b], even the elect.
translation:
  language: ro
  text: Căci se vor ridica falși mesia[a] și falși profeți și vor face semne mari și minuni, ca să-i ducă în rătăcire[b], dacă este posibil[c], chiar și pe cei aleși.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „falși Hristoși”. Termenul grecesc folosește titlul Christos; aici este redat prin „mesia”, deoarece are valoare de titlu, nu de nume.'
    reason: alternative_reading
  - marker: b
    text: 'Sau: „să-i înșele”. Verbul poate însemna a face pe cineva să se abată ori să rătăcească.'
    reason: lexical_alternative
  - marker: c
    text: 'Sau: „dacă ar fi posibil”. Greaca spune simplu „dacă este posibil”, fără să precizeze implicația teologică.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: se vor ridica
  rationale: În acest context, forma pasivă viitoare este idiomatică pentru apariția unor persoane pe scena publică; formularea nu sugerează învierea.
- source_word: ψευδόχριστοι
  choice: falși mesia
  rationale: Χριστός are aici valoare de titlu, iar „mesia” păstrează contextul mesianic; prefixul ψευδο- este redat direct prin „falși”.
- source_word: ψευδοπροφῆται
  choice: falși profeți
  rationale: Redare directă, firească și consacrată a substantivului compus.
- source_word: δώσουσιν
  choice: vor face
  rationale: Deși sensul de bază este „vor da”, asocierea cu „semne și minuni” cere în română verbul idiomatic „a face”.
- source_word: σημεῖα μεγάλα καὶ τέρατα
  choice: semne mari și minuni
  rationale: Păstrează distincția dintre semne ca manifestări cu valoare indicatoare și minuni ca fapte uimitoare.
- source_word: ὥστε πλανῆσαι
  choice: ca să-i ducă în rătăcire
  rationale: Redă construcția cu infinitiv ca scop sau rezultat scontat, fără a fixa excesiv una dintre aceste nuanțe.
- source_word: εἰ δυνατὸν
  choice: dacă este posibil
  rationale: Urmează concizia expresiei grecești și nu introduce caracterul contrafactual mai pronunțat al formulării „dacă ar fi posibil”.
- source_word: καὶ τοὺς ἐκλεκτούς
  choice: chiar și pe cei aleși
  rationale: καί are aici valoare ascensivă, redată prin „chiar și”, iar ἐκλεκτούς este exprimat natural și transparent prin „cei aleși”.
theological_decisions:
- issue: Redarea lui ψευδόχριστοι
  choice: falși mesia
  alternative: falși cristoși
  rationale: Termenul desemnează aici pretendenți la titlul mesianic, nu folosirea lui „Cristos” ca nume; „mesia” păstrează mai limpede această funcție titulară.
- issue: Forța expresiei εἰ δυνατὸν
  choice: dacă este posibil
  alternative: dacă ar fi posibil
  rationale: Textul grec lasă condiția nerezolvată. Traducerea nu trebuie să decidă implicit disputa teologică privind posibilitatea înșelării celor aleși.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Formularea păstrează ordinea argumentului, paralelismul „falși mesia și falși profeți” și ambiguitatea teologică a condiției finale.
