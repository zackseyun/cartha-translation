  verdict: revise
  source_fidelity: Redarea lui ἄρξηται τύπτειν și a perechii ἐσθίῃ ... πίνῃ este fidelă. Totuși, „cei care sunt robi împreună cu el” este o construcție nenaturală în română; sensul lui συνδούλους αὐτοῦ este mai limpede redat prin indicarea celorlalți robi care au același statut ca el, fără a-i prezenta drept proprietatea lui.
  naturalness: Textul propus este inteligibil, dar formularea pentru συνδούλους este greoaie și calchiată. „Cei care se îmbată” este firesc și păstrează valoarea caracterizantă a participiului prezent.
  terminology: „Robi” redă adecvat familia δοῦλος în contextul gospodăriei parabolice. „Bețivii” rămâne o alternativă lexicală legitimă, dar textul principal poate păstra formularea participială mai puțin etichetantă.
  issues:
