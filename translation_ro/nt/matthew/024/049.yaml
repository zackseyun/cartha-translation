source:
  edition: SBLGNT
  text: καὶ ἄρξηται τύπτειν τοὺς συνδούλους ⸂αὐτοῦ, ἐσθίῃ δὲ καὶ πίνῃ⸃ μετὰ τῶν μεθυόντων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/049.yaml
  text: and begins to beat his fellow servants[a], and eats and drinks with drunkards[b],
translation:
  language: ro
  text: și începe să-i bată pe ceilalți robi, ca și el[a], și să mănânce și să bea cu cei care se îmbată[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grecescul înseamnă literal „pe robii împreună cu el”, adică pe ceilalți robi care se află, ca și el, sub același stăpân.
    reason: alternative_reading
  - marker: b
    text: 'Sau: „cu bețivii”. Participiul grecesc îi poate desemna pe cei caracterizați de beție.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρξηται τύπτειν
  choice: începe să-i bată
  rationale: Construcția cu ἄρξηται și infinitivul exprimă începutul acțiunii, iar τύπτειν sugerează aici lovire violentă, posibil repetată; „să-i bată” este firesc și păstrează forța avertismentului.
- source_word: τοὺς συνδούλους αὐτοῦ
  choice: pe cei care sunt robi împreună cu el
  rationale: σύνδουλος desemnează un rob aflat sub același stăpân. Formularea păstrează statutul comun fără a sugera greșit că aceștia i-ar aparține robului rău.
- source_word: ἐσθίῃ δὲ καὶ πίνῃ
  choice: și să mănânce și să bea
  rationale: Subjunctivele coordonate depind natural în română de „începe să”; δέ este aici o legătură slabă, redată firesc prin „și”.
- source_word: μετὰ τῶν μεθυόντων
  choice: cu cei care se îmbată
  rationale: Participiul prezent îi descrie pe cei care practică sau se dedau beției; formularea verbală evită eticheta mai interpretativă „bețivi” și păstrează aspectul dinamic.
theological_decisions:
- issue: Redarea termenului din familia δοῦλος în συνδούλους
  choice: cei care sunt robi împreună cu el
  alternative: tovarășii lui de slujbă / ceilalți slujitori
  rationale: În cadrul gospodăriei parabolice, statutul comun sub autoritatea aceluiași stăpân este semnificativ. „Robi împreună cu el” păstrează această realitate și evită să transforme αὐτοῦ într-un raport de proprietate.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Sintaxa continuă propoziția condițională începută în versetul anterior; virgula finală indică faptul că enunțul continuă.
