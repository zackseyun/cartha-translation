    issue: Formulare nenaturală pentru τοὺς συνδούλους αὐτοῦ
    rationale: „Pe cei care sunt robi împreună cu el” reproduce mecanic compunerea grecească și sună nefiresc. „Pe ceilalți robi, ca și el” exprimă statutul comun implicat de σύνδουλοι și evită sugestia că αὐτοῦ ar indica posesia lor de către administrator.
  - severity: low
    issue: Nota a propune o alternativă semantic mai slabă
    rationale: „Tovarășii lui de slujbă” poate atenua statutul de rob și nu redă explicit relația de co-robi sub același stăpân. Nota trebuie să explice sensul fără această alternativă imprecisă.
  revised_text: și începe să-i bată pe ceilalți robi, ca și el[a], și să mănânce și să bea cu cei care se îmbată[b],
