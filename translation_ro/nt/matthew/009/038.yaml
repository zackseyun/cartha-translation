review_pass:
  verdict: revise
  source_fidelity: Textul redă corect imperativul de cerere insistentă, inferența introdusă de οὖν, titlul neidentificat «Domnul secerișului», precum și lucrătorii și posesivul «său». Totuși, «la secerișul său» atenuează mișcarea/sfera exprimată de εἰς; «în secerișul său» o păstrează mai direct.
  naturalness: «Rugați-L deci stăruitor pe Domnul secerișului» este română standard firească, cu registru biblic modern. «În secerișul său» este deopotrivă natural și mai apropiat de imaginea greacă.
  terminology: «Domnul», «seceriș», «lucrători» și «a trimite» sunt alegeri potrivite. Nota trebuie să exprime mai idiomatic și mai exact nuanța energică a lui ἐκβάλῃ, fără a prezenta o formulare românească stângace drept alternativă principală.
  issues:
  - severity: low
    issue: Redarea lui εἰς prin «la secerișul său»
    rationale: «La» poate exprima destinația, însă «în» păstrează mai explicit mișcarea «în/înăuntrul» secerișului și se aliniază cu metafora din sursă și cu auditul englez.
  - severity: low
    issue: Formularea notei «să scoată cu putere lucrători»
    rationale: Este puțin idiomatică și poate sugera scoaterea lucrătorilor din seceriș. O notă cu «să-i trimită afară» explică mai limpede forța lui ἐκβάλλω în contextul trimiterii.
