  text: δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ἐκβάλῃ ἐργάτας εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/038.yaml
  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: ro
  text: Rugați-L deci stăruitor pe Domnul secerișului să trimită lucrători în secerișul său.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „să-i trimită afară pe lucrători”; verbul grecesc este mai energic decât simplul „a trimite”, deși aici se referă la trimiterea lucrătorilor în seceriș.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητε
  choice: Rugați-l stăruitor
  rationale: Imperativul exprimă o cerere insistentă. Formularea păstrează atât cadrul rugăciunii, cât și intensitatea verbului, într-o română actuală și firească.
- source_word: οὖν
  choice: deci
  rationale: Marchează concluzia care decurge din afirmația precedentă despre secerișul bogat și numărul mic de lucrători.
- source_word: κυρίου τοῦ θερισμοῦ
  choice: Domnul secerișului
  rationale: Păstrează titlul și imaginea autorității asupra secerișului fără a preciza mai mult decât spune textul.
- source_word: ὅπως
  choice: să
  rationale: Introduce natural în română conținutul cererii exprimate prin rugăciune.
- source_word: ἐκβάλῃ
  choice: să trimită
  rationale: În context, verbul desemnează trimiterea lucrătorilor la seceriș. Nuanța sa mai energică este păstrată într-o notă.
- source_word: ἐργάτας
  choice: lucrători
  rationale: Redă clar și firesc persoanele care muncesc la seceriș, păstrând metafora.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: la secerișul său
  rationale: Redă orientarea spre sfera și lucrarea secerișului, fără a adăuga substantivul «ogor», absent din greacă, și păstrează posesivul.
theological_decisions:
- issue: Identitatea «Domnului secerișului»
  choice: Titlul este redat fără identificarea explicită a referentului.
  alternative: Identificarea lui în mod specific cu Tatăl sau cu Isus.
  rationale: Versetul nu precizează identitatea dincolo de titlul «Domnul secerișului»; traducerea păstrează această deschidere teologică.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. «Stăruitor» comunică intensitatea rugăciunii fără formulări arhaice, iar metafora secerișului este păstrată.
