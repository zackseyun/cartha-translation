  text: καὶ ἐγερθεὶς ὁ Ἰησοῦς ⸀ἠκολούθει αὐτῷ καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/019.yaml
  text: And Jesus rose and followed him, and his disciples did too.
translation:
  language: ro
  text: Isus S-a ridicat și l-a urmat, iar ucenicii Lui l-au urmat și ei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: S-a ridicat
  rationale: Participiul aorist pasiv al lui ἐγείρω are aici sens intranzitiv și introduce acțiunea următoare. Formularea este firească în narațiunea românească și indică ridicarea pentru a porni la drum.
- source_word: ἠκολούθει
  choice: l-a urmat
  rationale: Imperfectul poate sugera desfășurarea acțiunii, însă perfectul compus redă natural succesiunea narativă în română. Verbul „a urma” păstrează sensul de deplasare în urma cuiva.
- source_word: αὐτῷ
  choice: l-
  rationale: Pronumele la dativ este complementul lui ἀκολουθέω și îl are ca antecedent pe conducătorul menționat în versetul anterior; în română, construcția firească este „l-a urmat”.
- source_word: μαθηταὶ
  choice: ucenicii
  rationale: „Ucenici” este echivalentul consacrat și contextual potrivit pentru μαθηταί în Evanghelii, păstrând relația dintre învățător și cei formați de el.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: iar ucenicii Lui au mers și ei
  rationale: Greaca omite verbul repetat. Româna cere o completare idiomatică; „au mers și ei” exprimă faptul că ucenicii L-au însoțit, fără repetarea greoaie a lui „l-au urmat”. Pronumele posesiv se referă la Isus.
theological_decisions: []
translation_notes:
  register: Română standard modernă, clară și demnă. Majusculele reverențiale din „S-a” și „Lui” urmează uzul editorial biblic românesc; ele nu rezolvă nicio ambiguitate a textului-sursă.
