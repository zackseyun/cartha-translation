id: MAT.9.28
reference: Matthew 9:28
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: ro
  text: 'Când a intrat în casă[a], orbii s-au apropiat de el, iar Isus le spune: „Credeți că pot face lucrul acesta?” Ei îi spun: „Da, Doamne[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „După ce a venit în casă, orbii au venit la el”.'
    reason: Redare mai formală a verbelor ἔρχομαι și προσέρχομαι, care păstrează repetarea apropiată din formularea tradițională.
  - marker: b
    text: 'Sau: „Domnule”. Grecescul κύριε poate fi o formulă respectuoasă de adresare; „Doamne” păstrează și posibila recunoaștere a autorității lui Isus.'
    reason: Ambiguitate lexicală și teologică autentică a vocativului κύριε în acest context.
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: Când a intrat în casă
  rationale: Participiul aorist introduce temporal următoarea acțiune. „A intrat în casă” redă firesc deplasarea în interior și evită repetarea verbului „a veni”.
- source_word: προσῆλθον αὐτῷ
  choice: s-au apropiat de el
  rationale: Redă direct sensul lui προσέρχομαι, acela de a veni spre cineva sau de a se apropia de el.
- source_word: οἱ τυφλοί
  choice: orbii
  rationale: Adjectivul articulat este substantivizat. Contextul imediat arată că este vorba despre bărbații orbi menționați anterior, fără a fi necesară adăugarea numărului „doi” în acest verset.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Isus le spune
  rationale: Prezentul istoric grecesc este păstrat în română pentru vivacitatea narațiunii; construcția este firească în relatarea narativă.
- source_word: Πιστεύετε
  choice: Credeți
  rationale: Verbul exprimă aici încrederea în puterea lui Isus de a împlini vindecarea cerută.
- source_word: ὅτι δύναμαι τοῦτο ποιῆσαι
  choice: că pot face lucrul acesta
  rationale: „Pot” redă natural capacitatea exprimată de δύναμαι, iar „lucrul acesta” indică fără explicitare suplimentară vindecarea avută în vedere.
- source_word: λέγουσιν αὐτῷ
  choice: Ei îi spun
  rationale: Este păstrat și aici prezentul istoric al originalului, în paralel cu „Isus le spune”.
- source_word: Ναί
  choice: Da
  rationale: Echivalentul românesc direct al particulei afirmative.
- source_word: κύριε
  choice: Doamne
  rationale: Vocativul consacrat pentru κύριος adresat lui Isus păstrează atât respectul, cât și posibila recunoaștere a autorității sale.
theological_decisions:
- issue: Redarea vocativului κύριε adresat lui Isus
  choice: Doamne
  alternative: Domnule
  rationale: „Doamne” păstrează sensul de adresare respectuoasă și posibila recunoaștere mai profundă a autorității lui Isus, fără a impune că vorbitorii formulează aici o mărturisire cristologică deplină.
- issue: Prezentul istoric λέγει / λέγουσιν
  choice: le spune / îi spun
  alternative: le-a spus / i-au spus
  rationale: Păstrarea prezentului istoric reflectă textura discursivă vie a textului grecesc și rămâne inteligibilă în româna narativă modernă.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea evită repetiția greoaie a verbului „a veni”, păstrează prezentul istoric al originalului și nu explicitează în text mai mult decât afirmă versetul.
