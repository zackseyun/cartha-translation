id: MAT.9.2
reference: Matthew 9:2
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: ro
  text: 'Și iată, au adus la el un paralizat întins pe un pat. Când Isus le-a văzut credința[a], i-a spus paralizatului: „Prinde curaj, copile! Păcatele îți sunt iertate[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: „credința lor”. Pluralul îi desemnează cel puțin pe cei care l-au adus, dar îl poate include și pe paralizat.'
    reason: alternative_reading
  - marker: b
    text: 'Sau: „Păcatele ți-au fost iertate”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: iată
  rationale: Păstrează marcatorul narativ care atrage atenția și este firesc în registrul biblic românesc actual.
- source_word: προσέφερον
  choice: au adus
  rationale: În acest context narativ, imperfectul grecesc este redat natural prin perfectul compus românesc; verbul exprimă aducerea persoanei la Isus, fără a impune lexical ideea de purtare.
- source_word: παραλυτικὸν
  choice: un paralizat
  rationale: Redă adjectivul substantivizat concis și fără a adăuga explicit «bărbat», absent din termenul grecesc.
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: care zăcea pe un pat
  rationale: Exprimă natural poziția și starea persoanei; «pat» este o redare sigură pentru κλίνη, fără particularizarea nesigură «targă» sau «rogojină».
- source_word: πίστιν
  choice: credința
  rationale: Este echivalentul românesc consacrat și adecvat aici pentru încrederea manifestată prin acțiune.
- source_word: Θάρσει
  choice: Prinde curaj
  rationale: Redă imperativul de încurajare direct și idiomatic; alternativa «Îndrăznește» poate sugera în româna actuală asumarea unui risc.
- source_word: τέκνον
  choice: copile
  rationale: Păstrează forma afectuoasă de adresare și nu introduce termenul mai specific «fiule».
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Păcatele îți sunt iertate
  rationale: Păstrează prezentul și construcția pasivă, lăsând agentul neexprimat ca în greacă.
theological_decisions:
- issue: Referentul expresiei τὴν πίστιν αὐτῶν
  choice: Pluralul este păstrat prin «le-a văzut ... credința», fără a preciza cine anume este inclus.
  alternative: Credința numai a celor care l-au adus sau credința paralizatului împreună cu a lor.
  rationale: Pronumele grecesc este plural, dar textul nu stabilește explicit dacă paralizatul este inclus; nota păstrează această ambiguitate.
- issue: Forța declarației de iertare
  choice: 'Declarație pasivă la prezent: «Păcatele îți sunt iertate».'
  alternative: «Păcatele ți-au fost iertate» sau o formulare care îl numește explicit pe Dumnezeu drept agent.
  rationale: Forma grecească anunță iertarea fără a numi agentul; traducerea nu explicitează o concluzie teologică pe care construcția o lasă implicită.
translation_notes:
  register: Română standard modernă, clară și demnă. «Iată» păstrează vivacitatea narativă; «Prinde curaj, copile!» este cald și accesibil. Ordinea enclitică «le-a văzut Isus credința» păstrează referința plurală, deși nota oferă forma literală pentru claritate.
