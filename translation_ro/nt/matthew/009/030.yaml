id: MAT.9.30
reference: Matthew 9:30
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί. καὶ ⸀ἐνεβριμήθη αὐτοῖς ὁ Ἰησοῦς λέγων· Ὁρᾶτε μηδεὶς γινωσκέτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/030.yaml
  text: And their eyes were opened[a]. And Jesus sternly warned them, saying[b], “See that no one knows.”
translation:
  language: ro
  text: 'Și li s-au deschis ochii. Isus i-a avertizat cu asprime[a], spunând: „Aveți grijă să nu afle nimeni[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „le-a poruncit cu fermitate” ori „i-a mustrat aspru”. Verbul grecesc exprimă o emoție puternică și fermitate în avertizare.'
    reason: lexical_alternative
  - marker: b
    text: 'Literal: „să nu știe nimeni”. Ceea ce nu trebuie făcut cunoscut rămâne neexprimat în greacă și se înțelege din contextul vindecării.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί
  choice: li s-au deschis ochii
  rationale: Construcția românească redă firesc pasivul grecesc și idiomul restaurării vederii, fără a adăuga explicit un agent.
- source_word: ἐνεβριμήθη
  choice: i-a avertizat cu asprime
  rationale: Verbul exprimă o reacție puternică și o poruncă fermă; formularea păstrează intensitatea fără a sugera neapărat o mustrare pentru o vină.
- source_word: Ὁρᾶτε
  choice: Aveți grijă
  rationale: Imperativul plural introduce idiomatic o poruncă de precauție; această formulare este naturală în româna actuală și păstrează forța îndemnului.
- source_word: μηδεὶς γινωσκέτω
  choice: să nu afle nimeni
  rationale: Imperativul prohibitiv la persoana a treia cere ca nimeni să nu ajungă să cunoască cele întâmplate. Verbul „afle” permite păstrarea obiectului neexprimat, așa cum este și în greacă.
- source_word: λέγων
  choice: spunând
  rationale: Participiul contemporan cu verbul principal leagă direct avertizarea de conținutul ei.
theological_decisions:
- issue: Forța poruncii lui Isus după vindecare
  choice: Isus le adresează o interdicție fermă de a face cunoscută vindecarea.
  alternative: Isus îi mustră sau le poruncește strict.
  rationale: Textul exprimă intensitate și fermitate, dar nu precizează motivul poruncii și nici nu cere concluzia că cei vindecați erau deja vinovați; traducerea nu adaugă o explicație teologică.
translation_notes:
  register: Română standard modernă, clară și demnă. „Li s-au deschis ochii” păstrează idiomul biblic într-o formă firească, iar „Aveți grijă să nu afle nimeni” redă natural porunca fără a explicita obiectul omis în textul grec.
