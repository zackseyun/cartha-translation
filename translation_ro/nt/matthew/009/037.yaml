source:
  edition: SBLGNT
  text: τότε λέγει τοῖς μαθηταῖς αὐτοῦ· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/037.yaml
  text: Then he says to his disciples[a], “The harvest indeed is plentiful[b], but the workers are few.”
translation:
  language: ro
  text: 'Atunci le spune[a] ucenicilor săi: „Secerișul este mare[b], dar lucrătorii sunt puțini.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greaca folosește prezentul istoric: „le spune”. Unele traduceri redau: „le-a spus”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „Secerișul este bogat”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Marchează succesiunea narațiunii într-o formă concisă și firească în româna modernă.
- source_word: λέγει
  choice: le spune
  rationale: Păstrează prezentul istoric grecesc și redă natural complementul indirect exprimat de τοῖς μαθηταῖς.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ucenicilor săi
  rationale: Redă atât termenul consacrat μαθηταῖς, cât și posesivul explicit αὐτοῦ.
- source_word: Ὁ μὲν ... οἱ δὲ
  choice: '... dar ...'
  rationale: Construcția μέν...δέ stabilește contrastul dintre mărimea secerișului și numărul mic al lucrătorilor; în română, „dar” exprimă firesc acest raport, fără formula rigidă „pe de o parte... pe de altă parte”.
- source_word: θερισμός
  choice: secerișul
  rationale: Păstrează metafora agricolă a textului și termenul românesc consacrat, fără a-i explicita referentul.
- source_word: πολύς
  choice: mare
  rationale: În asociere cu „secerișul”, „mare” exprimă cantitatea sau amploarea și rămâne aproape de formularea greacă; „bogat” este o alternativă idiomatică.
- source_word: ἐργάται
  choice: lucrătorii
  rationale: Termen modern, clar și potrivit imaginii muncii la seceriș.
- source_word: ὀλίγοι
  choice: puțini
  rationale: Redare directă a adjectivului predicativ, în contrast cu πολύς.
theological_decisions:
- issue: Forța metaforică a secerișului
  choice: Metafora agricolă este păstrată fără explicarea referentului ei misionar în text.
  alternative: Parafrazarea secerișului ca oameni pregătiți să primească mesajul sau lucrarea lui Isus.
  rationale: Versetul formulează metafora fără a o explica direct; explicitarea referentului ar introduce interpretare în text și ar restrânge sensul contextual.
translation_notes:
  register: Română standard modernă, cu formulare clară și demnă. Prezentul istoric este păstrat, iar metafora agricolă rămâne neexplicată. Ordinea propoziției este firească în română și menține contrastul explicit al originalului.
