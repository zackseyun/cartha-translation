base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/029.yaml
  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: ro
  text: 'Atunci le-a atins ochii, spunând: „Să vi se facă după credința voastră[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Să vi se întâmple potrivit încrederii voastre.” Termenul grecesc pistis poate fi redat și prin „încredere” sau, în anumite contexte, prin „credincioșie”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Marchează firesc următorul moment din succesiunea narativă.
- source_word: ἥψατο τῶν ὀφθαλμῶν αὐτῶν
  choice: le-a atins ochii
  rationale: Redă idiomatic în română atingerea fizică și relația exprimată în greacă prin genitiv.
- source_word: λέγων
  choice: și a spus
  rationale: Participiul contemporan este redat prin coordonare, o construcție mai firească în narațiunea românească actuală.
- source_word: Κατὰ τὴν πίστιν ὑμῶν
  choice: după credința voastră
  rationale: Păstrează ideea de corespondență sau măsură, fără a introduce explicit o cauzalitate mai puternică; „credința” este termenul românesc standard aici.
- source_word: γενηθήτω ὑμῖν
  choice: Să vi se facă
  rationale: Păstrează forța imperativului pasiv și dativul referitor la beneficiarii vindecării, într-o formulare românească demnă și inteligibilă.
theological_decisions:
- issue: Redarea lui πίστις în afirmația despre vindecare
  choice: credința
  alternative: încrederea
  rationale: Contextul indică încrederea celor doi în puterea lui Isus de a-i vindeca, dar „credința” păstrează termenul teologic și lexical consacrat fără a restrânge nejustificat sensul.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea „Să vi se facă” păstrează caracterul solemn și performativ al rostirii, fără a deveni arhaică.
