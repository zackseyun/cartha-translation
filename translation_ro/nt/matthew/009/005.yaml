source:
  edition: SBLGNT
  text: τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/005.yaml
  text: 'For which is easier: to say[a], ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?”'
translation:
  language: ro
  text: 'Căci ce este mai ușor: să spui: „Păcatele îți sunt iertate”[a], sau să spui: „Ridică-te și umblă”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Ți-au fost iertate păcatele.” Prezentul pasiv din greacă poate fi înțeles ca exprimând o stare rezultată.'
    reason: alternativă lexicală
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: Căci ce este mai ușor
  rationale: Pronumele τί împreună cu comparativul εὐκοπώτερον introduce alegerea dintre două formulări. „Căci” păstrează legătura explicativă marcată de γάρ cu versetul anterior.
- source_word: εἰπεῖν
  choice: să spui
  rationale: Infinitivul aorist al lui λέγω desemnează simplul act al rostirii; aceeași redare este păstrată în ambele propoziții pentru claritate și paralelism.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Păcatele îți sunt iertate
  rationale: Verbul este la indicativ prezent pasiv, iar „păcatele” este subiectul gramatical. Formularea românească redă firesc starea prezentă de iertare fără a preciza mai mult decât greaca momentul acțiunii.
- source_word: ἁμαρτίαι
  choice: păcatele
  rationale: Este echivalentul românesc standard și direct pentru termenul grecesc, fără extindere metaforică.
- source_word: Ἔγειρε
  choice: Ridică-te
  rationale: Imperativul aorist al lui ἐγείρω, într-un context de vindecare, poruncește persoanei să se scoale; „Ridică-te” este natural și demn în româna actuală.
- source_word: καὶ περιπάτει
  choice: și umblă
  rationale: Imperativul prezent al lui περιπατέω cere acțiunea de a merge după ridicare. „Umblă” păstrează concizia și caracterul direct al poruncii.
- source_word: σου
  choice: îți
  rationale: Genitivul pronumelui de persoana a doua singular indică posesia; construcția românească idiomatică este „păcatele îți sunt iertate”.
theological_decisions:
- issue: Redarea declarației lui Isus despre iertare
  choice: Păcatele îți sunt iertate
  alternative: Ți-au fost iertate păcatele
  rationale: Prezentul pasiv grecesc poate descrie o stare rezultată, însă nu impune o precizare suplimentară privind momentul iertării. Redarea principală păstrează forma prezentă și lasă afirmația despre autoritate să reiasă din context.
translation_notes:
  register: Română standard modernă, clară și demnă. Paralelismul celor două apariții ale formulei „să spui” este păstrat, iar adresarea rămâne la persoana a doua singular.
