  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
translation:
  language: ro
  text: Și iată, o femeie care suferea de sângerare de doisprezece ani, venind din spate, s-a atins de marginea[a] hainei lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „franjurele”, „ciucurele” sau „tivul”. Termenul grecesc poate desemna marginea ori franjurele/ciucurele unui veșmânt. Pentru contextul ciucurilor de la veșminte prescriși în legea dată lui Israel, vezi Numeri 15:38 și Deuteronomul 22:12.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Și iată
  rationale: Păstrează atât legătura narativă, cât și forța de atragere a atenției și nota de surpriză a expresiei grecești.
- source_word: γυνὴ
  choice: o femeie
  rationale: Redare directă și firească a referinței nehotărâte.
- source_word: αἱμορροοῦσα
  choice: care suferea de o hemoragie
  rationale: Exprimă o sângerare patologică persistentă; construcția cu «suferea» redă caracterul îndelungat al afecțiunii, fără a sugera doar un episod acut.
- source_word: δώδεκα ἔτη
  choice: de doisprezece ani
  rationale: Formula românească firească pentru durata unei stări care continua în acel moment.
- source_word: προσελθοῦσα ὄπισθεν
  choice: s-a apropiat de el pe la spate
  rationale: Redă apropierea de Isus dinspre partea din spate și transformă participiul grecesc într-o acțiune coordonată natural în română.
- source_word: ἥψατο
  choice: s-a atins
  rationale: Verbul pronominal românesc redă adecvat sensul contextual de atingere, fără a-l intensifica nejustificat ca apucare.
- source_word: τοῦ κρασπέδου
  choice: de ciucurele
  rationale: În acest context iudaic, termenul poate desemna ciucurele de la marginea veșmântului. Nota păstrează și alternativele lexicale «franjure» și «margine».
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: hainei lui
  rationale: «Haină» este o denumire românească largă și naturală, care nu precizează excesiv tipul veșmântului exterior.
theological_decisions:
- issue: Posibila semnificație iudaică a lui κράσπεδον, legată de ciucurii veșmintelor
  choice: «ciucurele» în textul principal, cu alternativele și contextul legal în notă
  alternative: «franjurele» sau «marginea hainei»
  rationale: Contextul iudaic face probabilă referirea la un ciucure prescris pentru veșminte, dar aria semantică a termenului nu exclude franjurele ori marginea. Nota evită transformarea probabilității într-o certitudine și nu atribuie gestului o semnificație teologică pe care versetul nu o explicitează.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. «Și iată» păstrează vivacitatea originalului, iar formulările medicale și vestimentare evită atât arhaismele, cât și precizările excesive.
