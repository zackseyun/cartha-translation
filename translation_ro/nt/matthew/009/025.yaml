  - severity: medium
    issue: Nota transformă alternativa pasivă într-o interpretare de „înviere”.
    rationale: „A fost înviată” explicitează readucerea la viață și nu este echivalentul cel mai direct al pasivului ἠγέρθη. „A fost ridicată” păstrează mai bine ambiguitatea de voce și de sens.
