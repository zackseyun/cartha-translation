  source_fidelity: 'Revizuire necesară: „după ce” accentuează o posterioritate pe care ὅτε o exprimă mai neutru prin „când”. De asemenea, ἠγέρθη este formal pasiv; redarea principală idiomatică „s-a ridicat” este acceptabilă, dar nota trebuie să ofere alternativa mai literală „a fost ridicată”, nu formularea interpretativ mai specifică „a fost înviată”.'
  naturalness: Textul este în general firesc în româna standard. „Când” este mai direct și mai apropiat de construcția narativă greacă decât „după ce”, iar evitarea repetării imediate a lui „fată” face fraza mai fluentă.
  terminology: „Mulțimea”, „a intrat”, „a luat-o de mână” și „fata” sunt alegeri potrivite. Alternativa din notă trebuie să păstreze valoarea pasivă a lui ἠγέρθη fără să introducă explicit conceptul de înviere.
