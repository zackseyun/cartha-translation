source:
  edition: SBLGNT
  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: ro
  text: Dar, când mulțimea a fost scoasă afară, el a intrat, a luat-o de mână, și fata s-a ridicat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „fata a fost ridicată”. Verbul grecesc este la diateza pasivă, dar poate fi redat idiomatic și prin „s-a ridicat”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Dar, după ce
  rationale: ὅτε introduce raportul temporal, iar δέ marchează o tranziție narativă ușoară. În română, „Dar, după ce” redă firesc succesiunea acțiunilor, inclusiv anterioritatea sugerată de context.
- source_word: ἐξεβλήθη
  choice: a fost scoasă afară
  rationale: Aoristul pasiv al lui ἐκβάλλω descrie îndepărtarea mulțimii. Formularea păstrează diateza pasivă fără nuanța excesiv de violentă pe care ar putea-o avea „a fost alungată”.
- source_word: ὁ ὄχλος
  choice: mulțimea
  rationale: Redare directă și firească în româna actuală pentru grupul de oameni adunat acolo.
- source_word: εἰσελθὼν
  choice: el a intrat
  rationale: Participiul aorist exprimă aici o acțiune anterioară sau succesivă față de verbul principal; coordonarea verbală este mai naturală în română.
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: a luat-o pe fată de mână
  rationale: κρατέω cu genitivul înseamnă „a apuca/a ține”. Expresia românească „a lua pe cineva de mână” redă gestul clar și natural; substantivul „fată” evită o succesiune mai puțin fluidă de pronume.
- source_word: ἠγέρθη
  choice: s-a ridicat
  rationale: Aoristul pasiv al lui ἐγείρω poate descrie ridicarea fetei fără a preciza explicit în română agentul sau fără a transforma formularea într-o declarație teologică mai explicită decât textul.
- source_word: τὸ κοράσιον
  choice: fata
  rationale: κοράσιον desemnează o fată tânără; „fata” este clar, actual și potrivit contextului.
theological_decisions:
- issue: Redarea lui ἠγέρθη în contextul readucerii fetei la viață
  choice: fata s-a ridicat
  alternative: fata a fost înviată
  rationale: „S-a ridicat” redă rezultatul în mod idiomatic și păstrează discreția formulării grecești. Pasivul „a fost înviată” este posibil în context și face mai explicită atât readucerea la viață, cât și acțiunea exercitată asupra fetei; alternativa este de aceea consemnată în notă.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. Topica și coordonarea verbală sunt naturale, iar formularea evită atât arhaismele, cât și explicitarea teologică necerută de construcția greacă.
