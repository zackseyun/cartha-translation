id: MAT.9.13
reference: Matthew 9:13
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/013.yaml
  text: 'But go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous[c][b][a], but sinners.'
translation:
  language: ro
  text: 'Dar duceți-vă și învățați ce înseamnă aceasta: „Milă doresc, nu jertfă.”[a] Căci n-am venit să-i chem pe cei drepți,[b] ci pe păcătoși.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Citat din Osea 6:6. Mai literal, introducerea citatului poate fi redată: „învățați ce este aceasta”.'
    reason: cross_reference_and_lexical_alternative
  - marker: b
    text: Sau, posibil, „pe cei care se cred drepți”; textul grecesc spune simplu „pe cei drepți”.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες
  choice: duceți-vă
  rationale: Participiul aorist este folosit idiomatic împreună cu imperativul următor; formularea românească redă firesc îndemnul, fără literalismul rigid „după ce vă veți fi dus”.
- source_word: μάθετε
  choice: învățați
  rationale: Păstrează atât ideea însușirii învățăturii, cât și tonul mustrător al poruncii.
- source_word: τί ἐστιν
  choice: ce înseamnă aceasta
  rationale: Redă idiomatic cererea de a înțelege semnificația citatului; sensul mai literal este consemnat în notă.
- source_word: ἔλεος
  choice: milă
  rationale: Echivalent consacrat și accesibil, care păstrează dimensiunea etică și rezonanța relațională a citatului din Osea.
- source_word: θέλω
  choice: doresc
  rationale: Redă voința exprimată de verb într-un registru demn, potrivit citatului scripturistic.
- source_word: θυσίαν
  choice: jertfă
  rationale: Termen românesc consacrat pentru sacrificiul cultic și corespunde singularului grecesc.
- source_word: ἦλθον
  choice: n-am venit
  rationale: Aoristul indică aici venirea și misiunea lui Isus; perfectul compus este forma firească în româna actuală.
- source_word: καλέσαι
  choice: să-i chem
  rationale: Păstrează sensul larg de chemare, fără a-l restrânge la simpla invitație sau la o chemare vocațională explicită.
- source_word: δικαίους
  choice: cei drepți
  rationale: Redă adjectivul substantivizat fără a preciza dacă referirea este la oameni cu adevărat drepți sau la cei care se consideră astfel.
- source_word: ἁμαρτωλούς
  choice: păcătoși
  rationale: Echivalentul direct și consacrat păstrează contrastul moral categoric al afirmației.
theological_decisions:
- issue: Forța citatului din Osea 6:6
  choice: „Milă doresc, nu jertfă.”
  alternative: O parafrază care ar afirma fie respingerea absolută a tuturor jertfelor, fie doar o preferință slabă și circumstanțială.
  rationale: 'Construcția profetică trebuie păstrată în tensiunea ei: mila este pusă înaintea jertfei, fără ca traducerea să introducă o doctrină mai amplă decât afirmă textul.'
- issue: Referința expresiei δικαίους
  choice: „cei drepți”
  alternative: „cei care se cred drepți” sau „cei neprihăniți în ochii lor”.
  rationale: Contextul poate permite o nuanță ironică, însă greaca spune simplu „cei drepți”; textul principal păstrează ambiguitatea reală, iar nota semnalează interpretarea posibilă.
translation_notes:
  register: Română standard modernă, cu formulare naturală și demnă. „Duceți-vă și învățați” păstrează caracterul proverbial și mustrător al expresiei, iar „milă” și „jertfă” mențin registrul scripturistic consacrat fără arhaizare excesivă.
