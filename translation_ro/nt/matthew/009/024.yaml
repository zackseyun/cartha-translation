  text: ⸀ἔλεγεν· Ἀναχωρεῖτε, οὐ γὰρ ἀπέθανεν τὸ κοράσιον ἀλλὰ καθεύδει· καὶ κατεγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/024.yaml
  text: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
translation:
  language: ro
  text: 'El le spunea: „Plecați, căci fata nu a murit, ci doarme.” Iar ei râdeau de el.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „își băteau joc de el”. Verbul grecesc poate desemna râsul batjocoritor sau ridiculizarea cuiva.'
    reason: Alternativă lexicală pentru κατεγέλων αὐτοῦ.
lexical_decisions:
- source_word: ἔλεγεν
  choice: le spunea
  rationale: Imperfectul grecesc sugerează o rostire în desfășurare sau repetată; imperfectul românesc „spunea” păstrează firesc acest aspect. Pronumele „le” face explicit destinatarul deja prezent în context, fără a schimba sensul.
- source_word: Ἀναχωρεῖτε
  choice: Plecați
  rationale: Imperativul la plural cere celor prezenți să se îndepărteze. „Plecați” este direct, actual și firesc în română.
- source_word: οὐ γὰρ ἀπέθανεν
  choice: căci ... nu a murit
  rationale: „Căci” redă valoarea explicativă a lui γάρ, iar perfectul compus redă moartea ca eveniment și formează un contrast natural cu prezentul „doarme”.
- source_word: τὸ κοράσιον
  choice: fata
  rationale: Termenul denumește o fată tânără; „fata” este redarea neutră și naturală, fără a adăuga accentul diminutival al formei „fetița”.
- source_word: ἀλλὰ καθεύδει
  choice: ci doarme
  rationale: „Ci” redă opoziția după negație, iar „doarme” păstrează simplu și literal formularea provocatoare a lui Isus.
- source_word: κατεγέλων αὐτοῦ
  choice: râdeau de el
  rationale: Imperfectul „râdeau” păstrează aspectul durativ, iar expresia redă imaginea lexicală a râsului îndreptat batjocoritor împotriva lui.
theological_decisions:
- issue: Afirmația că fata „nu a murit, ci doarme”
  choice: Păstrarea literală a contrastului „nu a murit, ci doarme”
  alternative: O formulare interpretativă precum „doar doarme” sau o explicație în text că somnul este o metaforă a morții
  rationale: Textul grecesc nu explică aici natura afirmației. Redarea literală păstrează tensiunea narativă și teologică, fără a hotărî dacă vorbirea este metaforică, anticipativă ori trebuie înțeleasă altfel.
translation_notes:
  register: Română standard modernă, clară și demnă. Imperfectele „spunea” și „râdeau” păstrează desfășurarea scenei; construcția directă evită atât arhaismele, cât și explicațiile interpretative introduse în text.
