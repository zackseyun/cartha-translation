  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἐσπλαγχνίσθη περὶ αὐτῶν ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι ⸀ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: ro
  text: Când a văzut mulțimile, I s-a făcut milă de ele, pentru că erau hărțuite și doborâte[a], ca niște oi fără păstor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „hărțuite și neajutorate”. Termenii grecești pot fi înțeleși și mai interpretativ, ca descriind mulțimile epuizate și incapabile să se îngrijească singure.'
    reason: Alternativă lexicală pentru ἐσκυλμένοι καὶ ἐρριμμένοι; păstrează traseul de audit fără a transforma interpretarea în textul principal.
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Când a văzut
  rationale: Participiul aorist este redat temporal, firesc în română; δέ este lăsat implicit, deoarece aici are doar rolul discret de a continua narațiunea.
- source_word: τοὺς ὄχλους
  choice: mulțimile
  rationale: Redă direct grupurile numeroase de oameni într-un limbaj actual și demn.
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: I s-a făcut milă de ele
  rationale: Exprimă limpede compasiunea profundă a lui Isus. Pronumele reverențial „I” păstrează referirea clară la Isus, iar „ele” se acordă cu „mulțimile”.
- source_word: ὅτι ἦσαν
  choice: pentru că erau
  rationale: ὅτι introduce cauza compasiunii, iar imperfectul indică starea în care se aflau mulțimile.
- source_word: ἐσκυλμένοι
  choice: necăjite
  rationale: Termenul poate descrie oameni tulburați, asupriți sau istoviți prin purtare rea; „necăjite” păstrează amplitudinea sensului fără a impune exclusiv ideea de hărțuire.
- source_word: καὶ ἐρριμμένοι
  choice: și doborâte
  rationale: Păstrează imaginea pasivă a celor aruncați la pământ sau ajunși într-o stare de prăbușire, evitând interpretarea mai îngustă „neajutorate”.
- source_word: ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα
  choice: ca niște oi fără păstor
  rationale: Redare idiomatică și fidelă a comparației pastorale și a vulnerabilității unor oi lipsite de păstor.
theological_decisions:
- issue: Intensitatea compasiunii lui Isus
  choice: I s-a făcut milă de ele
  alternative: a fost cuprins de milă față de ele
  rationale: Formularea aleasă este naturală în româna contemporană și comunică o reacție profundă de compasiune fără a deveni arhaică sau explicativă.
- issue: Starea mulțimilor
  choice: necăjite și doborâte
  alternative: hărțuite și neajutorate
  rationale: Alegerea păstrează atât suferința, cât și imaginea celor doborâți, fără a transforma participiul ἐρριμμένοι într-o concluzie interpretativă despre incapacitatea lor de a se îngriji singuri.
translation_notes:
  register: Română standard modernă, cu formulare clară, demnă și accesibilă. Metafora oilor fără păstor este păstrată integral, iar ambii participi grecești sunt redați prin termeni care conservă imaginea și tensiunea lexicală.
