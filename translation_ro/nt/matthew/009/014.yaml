id: MAT.9.14
reference: Matthew 9:14
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες· Διὰ τί ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν ⸀πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/014.yaml
  text: Then John's disciples came to him[a], saying, “Why do we and the Pharisees fast often, but your disciples do not fast?”
translation:
  language: ro
  text: 'Atunci ucenicii lui Ioan au venit la el și au zis: „De ce noi și fariseii postim adesea[a], dar ucenicii tăi nu postesc?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „postim mult” ori „postim de multe ori”; termenul grecesc folosit împreună cu „a posti” exprimă o practică frecventă.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Redă firesc marcatorul temporal care introduce următorul episod.
- source_word: προσέρχονται αὐτῷ
  choice: au venit la el
  rationale: Exprimă apropierea de Isus într-o formulare românească naturală; prezentul narativ grecesc este redat prin perfect compus.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: ucenicii lui Ioan
  rationale: Construcția cu genitiv este redată idiomatic și fără ambiguitate.
- source_word: λέγοντες
  choice: și au zis
  rationale: Coordonarea verbală este mai firească în română decât participiul literal, păstrând simultaneitatea acțiunii.
- source_word: Διὰ τί
  choice: De ce
  rationale: Echivalentul interogativ direct și uzual în româna modernă.
- source_word: ἡμεῖς καὶ οἱ Φαρισαῖοι
  choice: noi și fariseii
  rationale: Păstrează pronumele explicit și emfatic, precum și cele două grupuri comparate.
- source_word: νηστεύομεν
  choice: postim
  rationale: Termenul românesc consacrat pentru abținerea religioasă de la hrană.
- source_word: πολλά
  choice: adesea
  rationale: Folosit adverbial împreună cu verbul «a posti», indică frecvența practicii; alternativa mai literală este consemnată în notă.
- source_word: οἱ δὲ μαθηταί σου
  choice: dar ucenicii tăi
  rationale: «Dar» redă clar contrastul marcat de δέ.
- source_word: οὐ νηστεύουσιν
  choice: nu postesc
  rationale: Prezentul exprimă aici practica obișnuită, nu neapărat o acțiune limitată la momentul vorbirii.
theological_decisions:
- issue: Natura întrebării despre post
  choice: Întrebarea este redată drept o comparație între practici religioase obișnuite.
  alternative: O acuzație explicită că ucenicii lui Isus încalcă o obligație sau referirea exclusivă la un singur prilej de post.
  rationale: Verbele la prezent și πολλά sugerează un tipar repetat; traducerea păstrează tensiunea întrebării fără să adauge o judecată doctrinară.
translation_notes:
  register: Română standard modernă, clară și demnă. «Fariseii» este scris cu minusculă conform normelor curente pentru numele grupărilor religioase. Formularea evită arhaismele și păstrează contrastul direct al întrebării.
