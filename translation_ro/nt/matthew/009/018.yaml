id: MAT.9.18
reference: Matthew 9:18
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: ro
  text: 'În timp ce le spunea acestea, iată că a venit un conducător și s-a plecat înaintea lui, zicând: „Fiica mea tocmai a murit. Dar vino, pune-ți mâna peste ea și va trăi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: iată că
  rationale: Păstrează funcția de atragere a atenției într-o formulare românească firească.
- source_word: ἄρχων
  choice: conducător
  rationale: Termenul grecesc este nespecific aici; «conducător» păstrează generalitatea fără a introduce din relatările paralele o funcție anume.
- source_word: προσεκύνει
  choice: s-a plecat înaintea lui
  rationale: Redă gestul de profund respect sau omagiu fără a decide explicit că este vorba despre închinare cultică.
- source_word: ἄρτι ἐτελεύτησεν
  choice: tocmai a murit
  rationale: Redă direct atât caracterul recent exprimat de ἄρτι, cât și sensul contextual al verbului ἐτελεύτησεν.
- source_word: ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν
  choice: pune-ți mâna peste ea
  rationale: Formulare naturală care păstrează singularul «mâna» și ideea gestului cerut.
- source_word: ζήσεται
  choice: va trăi
  rationale: Păstrează afirmația sigură la viitor, fără adaos explicativ.
theological_decisions:
- issue: Natura gestului exprimat prin προσεκύνει
  choice: s-a plecat înaintea lui
  alternative: i s-a închinat
  rationale: Verbul poate indica închinare sau omagiu/prosternare; contextul nu obligă traducerea să stabilească explicit natura cultică a gestului.
translation_notes:
  register: Română standard modernă, clară și demnă. Ordinea propoziției este ușor adaptată pentru naturalețe, păstrând succesiunea și tensiunea textului grec.
