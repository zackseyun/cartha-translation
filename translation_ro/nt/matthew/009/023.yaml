id: MAT.9.23
reference: Matthew 9:23
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν τοῦ ἄρχοντος καὶ ἰδὼν τοὺς αὐλητὰς καὶ τὸν ὄχλον θορυβούμενον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/023.yaml
  text: And when Jesus came into the ruler's house and saw the flute players and the crowd making a commotion[c][b][a],
translation:
  language: ro
  text: Când Isus a intrat în casa conducătorului[a] și i-a văzut pe cei care cântau la fluier[b] și mulțimea care făcea zarvă[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „dregătorului”; prin comparație cu relatările paralele, „conducătorului sinagogii”. Aici, Matei spune doar „conducătorului”.
    reason: alternative_reading
  - marker: b
    text: În contextul funerar, puteau fi prezenți bocitori de profesie, inclusiv cântăreți la fluier.
    reason: cultural_note
  - marker: c
    text: Sau „era în mare agitație”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Când Isus a intrat
  rationale: Participiul aorist exprimă aici succesiunea temporală; formularea este firească în română și păstrează sensul «când/după ce a intrat».
- source_word: οἰκίαν
  choice: casa
  rationale: Redă direct sensul substantivului și se potrivește cadrului narativ.
- source_word: ἄρχοντος
  choice: conducătorului
  rationale: Păstrează caracterul general al termenului grec, fără a introduce din relatările paralele identificarea mai precisă drept conducător al sinagogii.
- source_word: ἰδὼν
  choice: i-a văzut
  rationale: Redare narativă directă și naturală a verbului de percepție.
- source_word: αὐλητὰς
  choice: cântăreții din fluier
  rationale: Indică limpede muzicanții care cântau la instrumente de tip fluier, prezenți în contextul doliului; formularea este inteligibilă în româna actuală.
- source_word: ὄχλον
  choice: mulțimea
  rationale: Echivalentul românesc obișnuit pentru ὄχλος în narațiune.
- source_word: θορυβούμενον
  choice: care făcea zarvă
  rationale: Surprinde zgomotul și agitația exprimate de participiu fără a preciza mai mult decât spune textul.
theological_decisions:
- issue: Identificarea stăpânului casei
  choice: conducătorului
  alternative: dregătorului; conducătorului sinagogii
  rationale: Matei folosește termenul general ἄρχων. Textul principal nu importă identificarea mai precisă din relatările paralele.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Sintaxa temporală este naturalizată, iar terminologia rămâne suficient de generală pentru a conserva formularea lui Matei. Versetul se încheie cu virgulă deoarece propoziția continuă în versetul următor.
