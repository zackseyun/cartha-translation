id: MAT.9.12
reference: Matthew 9:12
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: ro
  text: 'Dar Isus, când a auzit aceasta, a spus: „Nu cei sănătoși au nevoie de medic, ci cei bolnavi au nevoie.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἀκούσας
  choice: Dar Isus, auzind aceasta
  rationale: δέ introduce un contrast ușor, redat firesc prin „Dar”. Participiul aorist ἀκούσας este redat temporal prin gerunziu; obiectul implicit este exprimat prin „aceasta”. Numele „Isus” este recuperat din context pentru claritate în română.
- source_word: εἶπεν
  choice: a spus
  rationale: Redă direct verbul obișnuit al vorbirii, fără a introduce sensul mai explicit de „a răspuns”.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: Nu ... au nevoie
  rationale: Construcția românească este naturală și păstrează expresia nominală a nevoii.
- source_word: οἱ ἰσχύοντες
  choice: cei sănătoși
  rationale: Deși verbul poate însemna literal „a fi puternic”, opoziția medicală cu οἱ κακῶς ἔχοντες cere aici sensul idiomatic „cei sănătoși”.
- source_word: ἰατροῦ
  choice: de medic
  rationale: „Medic” este termenul modern, demn și curent pentru ἰατρός; după „au nevoie de”, româna nu cere articol nehotărât.
- source_word: οἱ κακῶς ἔχοντες
  choice: cei bolnavi
  rationale: Expresia idiomatică înseamnă în acest context „cei bolnavi”, în contrast direct cu cei sănătoși.
theological_decisions:
- issue: Sensul metaforic sau strict fizic al proverbului
  choice: Formularea rămâne în termeni medicali direcți.
  alternative: O redare interpretativă care ar menționa explicit păcătoșii sau boala spirituală.
  rationale: Contextul oferă aplicarea spirituală, însă versetul însuși formulează un proverb medical. Păstrarea imaginii lasă neexplicată în mod forțat tensiunea teologică.
translation_notes:
  register: Română standard modernă, clară și demnă. Ordinea propoziției este ușor adaptată uzului românesc, iar paralelismul concis al proverbului este păstrat.
