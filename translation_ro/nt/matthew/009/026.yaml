  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ἡ φήμη αὕτη εἰς ὅλην τὴν γῆν ἐκείνην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/026.yaml
  text: And this report went out into all that region[a].
translation:
  language: ro
  text: Și vestea aceasta s-a răspândit în toată regiunea aceea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „în tot ținutul acela” ori „în tot districtul acela”. Termenul grecesc γῆ poate însemna „pământ”, „ținut”, „teritoriu” sau „regiune”; aici se referă cel mai probabil la zona înconjurătoare, nu la întregul pământ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Și
  rationale: Păstrează legătura narativă simplă exprimată de καί.
- source_word: ἐξῆλθεν
  choice: s-a răspândit
  rationale: Deși verbul înseamnă literal „a ieșit”, împreună cu φήμη descrie idiomatic răspândirea unei vești; formularea este firească în româna actuală și păstrează sensul mișcării dinspre locul evenimentului.
- source_word: ἡ φήμη αὕτη
  choice: vestea aceasta
  rationale: „Veste” redă un raport ajuns la cunoștința publică fără conotația de nesiguranță pe care o poate avea „zvon”; demonstrativul αὕτη este redat direct prin „aceasta”.
- source_word: εἰς ὅλην τὴν γῆν ἐκείνην
  choice: în toată regiunea aceea
  rationale: În context, γῆ indică zona înconjurătoare, nu întregul pământ. „Regiunea” exprimă firesc întinderea geografică locală, iar „toată” redă ὅλην.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Construcția idiomatică „s-a răspândit” evită formularea nefiresc de literală „a ieșit”, fără a modifica sensul.
