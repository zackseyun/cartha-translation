  source_fidelity: „Și vestea aceasta s-a răspândit în toată regiunea aceea” redă fidel sensul propoziției grecești. „S-a răspândit” este o redare idiomatică și contextual exactă a lui ἐξῆλθεν cu φήμη, fără a impune un sens suplimentar. „Vestea aceasta” redă bine ἡ φήμη αὕτη, iar „în toată regiunea aceea” păstrează atât extensiunea lui ὅλην, cât și referința locală probabilă a lui γῆ ἐκείνη.
