  text: οἱ δὲ ἐξελθόντες διεφήμισαν αὐτὸν ἐν ὅλῃ τῇ γῇ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/031.yaml
  text: But after they went out[a], they spread the news about him throughout that whole region.
translation:
  language: ro
  text: Dar ei, după ce au ieșit, au răspândit vestea despre el în toată regiunea aceea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „în tot ținutul acela”. Termenul grecesc γῆ poate însemna „pământ”, „ținut” sau „regiune”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Dar
  rationale: Marchează contrastul ușor cu porunca de a păstra tăcerea din versetul anterior și redă firesc schimbarea de direcție narativă.
- source_word: ἐξελθόντες
  choice: după ce au ieșit
  rationale: Participiul aorist indică o acțiune anterioară verbului principal; formularea păstrează succesiunea temporală într-o română naturală.
- source_word: διεφήμισαν
  choice: au răspândit vestea
  rationale: Verbul exprimă publicizarea sau răspândirea largă a unei vești; expresia este actuală și clară.
- source_word: αὐτὸν
  choice: despre el
  rationale: Deși în greacă este obiect direct, construcția românească firească «au răspândit vestea despre el» redă relația semantică fără a suna forțat.
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: în toată regiunea aceea
  rationale: γῆ poate desemna pământul, ținutul sau o regiune; contextul local favorizează «regiunea», iar ὅλῃ este păstrat prin «toată».
theological_decisions:
- issue: Întinderea geografică desemnată de γῆ
  choice: regiunea
  alternative: ținutul
  rationale: Contextul descrie răspândirea locală a veștii despre Isus. «Regiunea» nu extinde nejustificat aria, păstrând totodată alternativa lexicală reală «ținutul» în notă.
translation_notes:
  register: Română standard modernă, clară și demnă. Ordinea propoziției este ușor adaptată pentru fluență, fără pierderea contrastului, a succesiunii temporale sau a ariei geografice.
