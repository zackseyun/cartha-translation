id: MAT.9.10
reference: Matthew 9:10
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου ἐν τῇ οἰκίᾳ, ⸀καὶ ἰδοὺ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ ἐλθόντες συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: ro
  text: Și, pe când el stătea întins la masă[a] în casă[b], iată că mulți colectori de taxe și păcătoși au venit și stăteau întinși la masă împreună cu Isus și ucenicii lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mai idiomatic: „lua masa”. Greaca spune mai precis că el stătea întins la masă, potrivit obiceiului din acea vreme.'
    reason: lexical_alternative
  - marker: b
    text: Textul spune doar „în casă” și nu precizează explicit, în acest verset, cui îi aparținea casa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγένετο
  choice: Și, pe când
  rationale: Construcția introduce și încadrează temporal scena; formularea românească redă firesc tranziția narativă fără calc-ul greoi „și s-a întâmplat”.
- source_word: ἀνακειμένου
  choice: stătea întins la masă
  rationale: Într-un context de ospăț, verbul indică postura culcată sau rezemată specifică mesei antice, nu simpla ședere.
- source_word: ἐν τῇ οἰκίᾳ
  choice: în casă
  rationale: Păstrează formularea concretă și definită din greacă, fără a preciza în mod nejustificat cui îi aparținea casa.
- source_word: ἰδοὺ
  choice: iată că
  rationale: Redă marcatorul discursiv care atrage atenția asupra apariției grupului și păstrează vivacitatea narațiunii.
- source_word: τελῶναι
  choice: colectori de taxe
  rationale: Este o formulare transparentă pentru cititorul modern și denumește funcția fiscală a persoanelor respective; contextul păstrează asocierea socială negativă.
- source_word: ἁμαρτωλοὶ
  choice: păcătoși
  rationale: Adjectivul este substantivizat și desemnează categoria social-religioasă numită astfel în text.
- source_word: ἐλθόντες
  choice: au venit
  rationale: Participiul aorist este redat idiomatic printr-un verb la mod personal, marcând venirea lor în scenă.
- source_word: συνανέκειντο
  choice: stăteau întinși la masă împreună cu
  rationale: Păstrează atât postura specifică mesei antice, cât și ideea de participare comună la masă.
- source_word: τῷ Ἰησοῦ
  choice: cu Isus
  rationale: Folosește forma consacrată a numelui în limba română.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ucenicii lui
  rationale: „Ucenici” este echivalentul românesc consacrat și adecvat pentru relația dintre învățător și cei care îl urmează.
theological_decisions:
- issue: Postura la masă și comuniunea de masă
  choice: Se păstrează explicit postura „stătea/stăteau întins/întinși la masă”.
  alternative: „mânca/mâncau” sau „lua/luau masa”
  rationale: Exprimarea concretă face vizibil cadrul ospățului antic și masa împărtășită, fără a adăuga o interpretare doctrinară.
- issue: Identitatea proprietarului casei
  choice: Textul spune numai „în casă”.
  alternative: „în casa lui” sau „în casa lui Matei”
  rationale: Versetul grecesc nu identifică explicit proprietarul; ambiguitatea autentică este păstrată.
translation_notes:
  register: Română standard modernă, clară și demnă. Sintagma mai puțin obișnuită „stătea întins la masă” este păstrată pentru precizia istorică și explicată în nota [a]. Pronumele „el” urmează structura sursei, iar numele „Isus” apare acolo unde este exprimat în greacă.
source_grounding:
  english_pob_role: consult_only
