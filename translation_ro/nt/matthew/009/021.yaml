  source_fidelity: 'Textul redă fidel toate elementele esențiale: imperfectul iterativ/durativ din ἔλεγεν („își spunea”), caracterul interior al expresiei ἐν ἑαυτῇ („în sinea ei”), condiția minimală din Ἐὰν μόνον, atingerea hainei și viitorul pasiv σωθήσομαι. „Voi fi salvată” păstrează deliberat amplitudinea lui σῴζω, iar nota semnalează sensul contextual de vindecare.'
  naturalness: Formularea este firească în româna standard modernă și are un registru narativ demn, accesibil. „Căci își spunea în sinea ei” și „Dacă mă voi atinge fie și numai de haina Lui” sunt idiomatice și păstrează accentul condiției minime.
