id: MAT.9.21
reference: Matthew 9:21
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ἐν ἑαυτῇ· Ἐὰν μόνον ἅψωμαι τοῦ ἱματίου αὐτοῦ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/021.yaml
  text: For she was saying to herself[a], “If only I touch his garment, I will be saved.”
translation:
  language: ro
  text: 'Căci își spunea în sinea ei: „Dacă mă voi atinge fie și numai de haina Lui, voi fi salvată.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „voi fi vindecată” ori „mă voi face bine”. În greacă apare verbul „a salva”, care, în acest context, poate desemna și vindecarea.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: își spunea
  rationale: Imperfectul sugerează o rostire lăuntrică în desfășurare sau repetată; formularea este firească în româna actuală.
- source_word: γὰρ
  choice: Căci
  rationale: Păstrează funcția explicativă a conjuncției în raport cu narațiunea înconjurătoare.
- source_word: ἐν ἑαυτῇ
  choice: în sinea ei
  rationale: Redă idiomatic vorbirea interioară, fără a o transforma explicit într-un simplu act de gândire.
- source_word: Ἐὰν μόνον
  choice: Dacă ... fie și numai
  rationale: Exprimă atât condiția, cât și accentul asupra gestului minim considerat suficient.
- source_word: ἅψωμαι
  choice: mă voi atinge
  rationale: Verbul ἅπτομαι are aici sensul de «a atinge»; viitorul românesc în propoziția condițională redă natural orientarea spre un eveniment viitor.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: de haina Lui
  rationale: ἱμάτιον desemnează o haină, adesea veșmântul exterior; «haina» evită o precizare mai îngustă decât cere textul.
- source_word: σωθήσομαι
  choice: voi fi salvată
  rationale: Păstrează sensul lexical larg al lui σῴζω și forma pasivă, în timp ce nota explică sensul contextual de vindecare.
theological_decisions:
- issue: Redarea lui σωθήσομαι într-un context de vindecare
  choice: voi fi salvată
  alternative: voi fi vindecată / mă voi face bine
  rationale: Contextul imediat este vindecarea trupească, dar greaca folosește verbul mai larg σῴζω. Textul principal îi păstrează amplitudinea și posibila rezonanță teologică, fără a exclude sensul medical, indicat în notă.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. «În sinea ei» este idiomatic, iar «fie și numai» conservă accentul condiției fără o formulare rigidă.
