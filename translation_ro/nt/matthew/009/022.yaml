source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: ro
  text: 'Iar Isus, întorcându-se și văzând-o[d], i-a spus: „Ai curaj[b], fiică; credința[c] ta te-a salvat[a].” Și femeia a fost vindecată din ceasul acela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „te-a vindecat” ori „te-a făcut sănătoasă”. Verbul grecesc poate însemna „a salva”, „a vindeca” sau „a face sănătos”; textul principal păstrează sensul mai larg al cuvintelor lui Isus.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „Îndrăznește”.'
    reason: lexical_alternative
  - marker: c
    text: În acest context, termenul grecesc poate fi redat și prin „încredere”.
    reason: alternative_reading
  - marker: d
    text: 'Construcția poate fi redată și: „S-a întors și a văzut-o”.'
    reason: previous_rendering
lexical_decisions:
- source_word: στραφεὶς
  choice: întorcându-se
  rationale: Redă valoarea participială și folosirea intranzitivă a verbului, fără a preciza o direcție pe care greaca nu o exprimă.
- source_word: ἰδὼν
  choice: văzând-o
  rationale: Păstrează construcția participială coordonată și referința feminină a pronumelui αὐτήν.
- source_word: Θάρσει
  choice: Ai curaj
  rationale: Este un îndemn direct, firesc în româna actuală, care exprimă încrederea și curajul cerute de imperativul grec.
- source_word: θύγατερ
  choice: fiică
  rationale: Păstrează adresarea familială și tandră fără adaosuri interpretative precum „dragă”.
- source_word: πίστις
  choice: credința
  rationale: Este echivalentul românesc consacrat și păstrează dimensiunea religioasă a termenului; nuanța contextuală de încredere este indicată în notă.
- source_word: σέσωκέν σε
  choice: te-a salvat
  rationale: Perfectul lui σῴζω poate desemna salvarea, vindecarea sau însănătoșirea. „Te-a salvat” păstrează în româna modernă sensul mai larg, în timp ce propoziția următoare explicitează vindecarea fizică.
- source_word: ἐσώθη
  choice: a fost vindecată
  rationale: În concluzia narativă, contextul indică limpede refacerea fizică a femeii; alegerea face inteligibil rezultatul imediat fără a restrânge formularea anterioară a lui Isus.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: din ceasul acela
  rationale: Redare apropiată de forma greacă, inteligibilă și demnă, care păstrează reperul temporal al narațiunii.
- source_word: γυνή
  choice: femeia
  rationale: Redarea firească a substantivului care o desemnează din nou pe femeia vindecată.
theological_decisions:
- issue: Redarea lui πίστις
  choice: credința
  alternative: încrederea
  rationale: „Credința” păstrează termenul teologic și uzul biblic larg, iar „încrederea” rămâne o nuanță contextuală legitimă, menționată în notă.
- issue: Redarea celor două forme ale lui σῴζω
  choice: „te-a salvat” în cuvintele lui Isus și „a fost vindecată” în concluzia naratorului
  alternative: „te-a vindecat” / „a fost vindecată” sau „te-a făcut sănătoasă” / „s-a făcut sănătoasă”
  rationale: Alternarea păstrează amplitudinea semantică și posibila rezonanță teologică a afirmației lui Isus, dar exprimă clar rezultatul fizic imediat relatat de narator.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Formularea evită arhaismele mai puțin transparente, dar păstrează concizia și ritmul solemn al versetului. Pronumele referitoare la Isus nu sunt capitalizate, conform ortografiei românești obișnuite și pentru a evita marcarea unei tradiții confesionale.
