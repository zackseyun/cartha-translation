  source_fidelity: Textul redă complet și exact succesiunea participiilor („întorcându-se și văzând-o”), adresarea directă, perfectul lui σῴζω din cuvintele lui Isus și vindecarea concretă din concluzia narativă. „Din ceasul acela” păstrează bine reperul temporal al grecei.
  naturalness: Româna este în general firească, cu un registru biblic modern adecvat. Este preferabil punct și virgulă între cele două propoziții rostite de Isus, corespunzând relației strânse din greacă. Nota d, în forma actuală, propune o construcție eliptică și nefirească în română.
  terminology: „Credința” este potrivit pentru πίστις, iar „te-a salvat” păstrează în mod util amplitudinea lui σέσωκέν σε; „a fost vindecată” exprimă clar rezultatul fizic al lui ἐσώθη. „Fiică” păstrează adresarea familială fără adaos interpretativ.
