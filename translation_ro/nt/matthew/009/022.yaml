    issue: Nota d are o formulare alternativă incompletă
    rationale: „S-a întors și, văzând-o” nu este o alternativă sintactică autosuficientă pentru segmentul adnotat. O redare cu două verbe finite, „S-a întors și a văzut-o”, este completă și fidelă.
