  source_fidelity: 'Textul redă fidel toate elementele esențiale ale grecei: propoziția de scop („ca să știți”), contrastul/tranziția lui δέ („Dar”), autoritatea legitimă (ἐξουσία), titlul „Fiul Omului”, sfera „pe pământ”, iertarea păcatelor, prezentul istoric („îi spune”) și cele trei porunci adresate paraliticului. „Du-te acasă” transmite idiomatic εἰς τὸν οἶκόν σου.'
  naturalness: Româna este standard, fluentă și are un registru demn, potrivit narațiunii. „Ridică-te, ia-ți patul și du-te acasă” este clar și natural. Secvența ghilimelelor și a liniei de întrerupere reflectă faptul că enunțul citat este întrerupt de intervenția narativă, așa cum indică textul-sursă și auditul englez.
  terminology: „Fiul Omului”, „autoritate” și „a ierta păcatele” sunt alegeri exacte și consecvente terminologic. Nota a păstrează atât titlul consacrat, cât și ambiguitatea lexicală, fără a transforma rezonanța din Daniel 7 într-o certitudine interpretativă. Nota b exprimă adecvat aria semantică a lui κλίνη.
