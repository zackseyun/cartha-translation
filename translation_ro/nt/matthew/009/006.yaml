id: MAT.9.6
reference: Matthew 9:6
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/006.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: ro
  text: 'Dar, ca să știți că Fiul Omului[a] are autoritate pe pământ să ierte păcatele” — atunci îi spune paraliticului: „Ridică-te, ia-ți patul[b] și du-te acasă!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „Fiul omului”. Scrierea cu majuscule evidențiază folosirea expresiei ca titlu al lui Isus și posibila ei rezonanță din Daniel 7.
    reason: lexical_alternative
  - marker: b
    text: Sau „targa” ori „rogojina”. Termenul grecesc κλίνη poate desemna un pat, un divan sau un așternut portabil.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: Dar, ca să știți
  rationale: Redă atât tranziția ușor contrastivă marcată de δέ, cât și scopul exprimat prin ἵνα, într-o formulare românească firească.
- source_word: ἐξουσίαν ἔχει
  choice: are autoritate
  rationale: ἐξουσία indică aici autoritatea sau dreptul legitim de a ierta, nu doar capacitatea ori puterea de a face aceasta.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Păstrează titlul consacrat folosit de Isus despre sine și posibila rezonanță din Daniel 7, fără a-l reduce la o parafrază interpretativă.
- source_word: ἐπὶ τῆς γῆς
  choice: pe pământ
  rationale: Este echivalentul românesc direct și natural pentru sfera în care Fiul Omului are autoritate.
- source_word: ἀφιέναι ἁμαρτίας
  choice: să ierte păcatele
  rationale: În acest context, ἀφίημι înseamnă a ierta sau a remite; formularea este clară și consacrată în română.
- source_word: τότε λέγει
  choice: atunci îi spune
  rationale: Păstrează prezentul istoric al verbului λέγει și vivacitatea narațiunii.
- source_word: τῷ παραλυτικῷ
  choice: paraliticului
  rationale: Adjectivul grecesc este substantivizat; „paraliticului” îl redă concis și exact, fără a adăuga substantivul „om”.
- source_word: Ἐγερθεὶς
  choice: Ridică-te
  rationale: Deși este formal un participiu aorist, în succesiunea poruncilor are valoare imperativă; „Ridică-te” este natural și demn.
- source_word: ἆρόν σου τὴν κλίνην
  choice: ia-ți patul
  rationale: αἴρω exprimă ridicarea și luarea obiectului, iar pronumele posesiv românesc redă natural σου. „Pat” păstrează sensul larg al lui κλίνη.
- source_word: ὕπαγε εἰς τὸν οἶκόν σου
  choice: du-te acasă
  rationale: Redă idiomatic în română porunca și destinația; „acasă” exprimă natural sensul contextual al lui οἶκος, fără a schimba referentul.
theological_decisions:
- issue: Titlul cristologic ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  alternative: Omul / Ființa umană
  rationale: Titlul tradițional păstrează autodesemnarea lui Isus și tensiunea intertextuală probabilă cu Daniel 7; alternativa ar putea estompa valoarea titulară.
- issue: Natura lui ἐξουσία în raport cu iertarea păcatelor
  choice: autoritate
  alternative: putere / drept
  rationale: Textul accentuează autoritatea legitimă de a ierta păcatele, nu numai capacitatea de a săvârși o minune; formularea nu extinde afirmația dincolo de ceea ce spune versetul.
translation_notes:
  register: Română standard modernă, clară și demnă. Prezentul istoric („îi spune”) păstrează vivacitatea grecei. „Du-te acasă” este preferat formei mai literale „du-te la casa ta”, care ar suna mai puțin natural. Punctuația păstrează ruptura narativă prin care vorbirea lui Isus este întreruptă înainte de porunca adresată paraliticului.
