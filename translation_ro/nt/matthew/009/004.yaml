id: MAT.9.4
reference: Matthew 9:4
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: ro
  text: 'Iar Isus, cunoscându-le gândurile, a zis: „De ce nutriți gânduri rele în inimile voastre?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδὼς
  choice: cunoscându-le
  rationale: Participiul exprimă faptul că Isus le cunoștea gândurile; forma cu pronume este firească în română și se leagă direct de „gândurile”.
- source_word: ἐνθυμήσεις
  choice: gândurile
  rationale: Termenul denumește reflecțiile sau deliberările lăuntrice; „gândurile” este echivalentul modern cel mai firesc.
- source_word: Ἱνατί
  choice: De ce
  rationale: Redă direct întrebarea privitoare la motiv.
- source_word: ἐνθυμεῖσθε
  choice: gândiți
  rationale: Verbul indică o activitate lăuntrică prezentă; „gândiți” păstrează și legătura lexicală cu substantivul anterior.
- source_word: πονηρὰ
  choice: lucruri rele
  rationale: Adjectivul neutru plural este folosit substantival; „lucruri rele” îi face explicită funcția fără a preciza mai mult decât textul.
- source_word: καρδίαις
  choice: inimile
  rationale: Păstrează metafora sursă pentru centrul vieții lăuntrice, inclusiv al gândirii și intenției.
theological_decisions:
- issue: Cunoașterea de către Isus a gândurilor nerostite
  choice: Isus, cunoscându-le gândurile
  alternative: Isus, percepându-le gândurile
  rationale: Textul afirmă direct că Isus era conștient de deliberările lor interioare; „cunoscând” păstrează afirmația și tensiunea ei cristologică fără explicații doctrinare suplimentare.
translation_notes:
  register: Română standard modernă, clară și demnă. „Iar” redă natural legătura narativă, iar repetarea „gândurile/gândiți” reflectă corespondența lexicală din greacă.
