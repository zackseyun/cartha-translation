  naturalness: „Iar Isus, cunoscându-le gândurile, a zis” este clar și potrivit registrului. În schimb, româna preferă „a nutri gânduri rele” pentru o dispoziție sau cugetare lăuntrică; formularea revizuită este mai naturală, păstrând tonul demn al pasajului.
