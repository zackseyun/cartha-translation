reference: Matthew 9:34
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἔλεγον· Ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/034.yaml
  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: ro
  text: 'Dar fariseii spuneau: „Cu ajutorul conducătorului demonilor îi alungă pe demoni.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Dar
  rationale: Marchează contrastul dintre reacția anterioară favorabilă și interpretarea ostilă a fariseilor.
- source_word: οἱ Φαρισαῖοι
  choice: fariseii
  rationale: Denumirea standard în română; articolul hotărât grecesc este redat prin forma articulată.
- source_word: ἔλεγον
  choice: spuneau
  rationale: Imperfectul românesc păstrează aspectul durativ sau repetat al imperfectului grecesc.
- source_word: Ἐν τῷ ἄρχοντι
  choice: Cu ajutorul conducătorului
  rationale: ἐν cu dativul are aici valoare instrumentală; formularea românească exprimă limpede sursa sau mijlocul puterii invocate în acuzație.
- source_word: ἄρχοντι
  choice: conducătorului
  rationale: Redă în limbaj modern ideea de autoritate a lui ἄρχων, fără conotația nobiliară posibilă a termenului „prinț”.
- source_word: ἐκβάλλει
  choice: îi alungă
  rationale: Redă natural în română scoaterea forțată a demonilor, sensul contextual al verbului ἐκβάλλω.
- source_word: τὰ δαιμόνια
  choice: pe demoni
  rationale: Păstrează referirea explicită la demoni și folosește marcarea firească a complementului direct personal în română.
theological_decisions:
- issue: Redarea lui δαιμόνια în contextul exorcizării
  choice: demoni
  alternative: duhuri rele
  rationale: Termenul grec este δαιμόνια, nu πνεύματα; „demoni” este echivalentul lexical mai precis și nu atenuează afirmația supranaturală.
- issue: Natura acuzației privind sursa puterii lui Isus
  choice: Cu ajutorul conducătorului demonilor
  alternative: În conducătorul demonilor
  rationale: Construcția greacă este instrumentală aici. Traducerea păstrează acuzația că alungarea demonilor ar fi făcută prin puterea conducătorului lor, fără a valida acuzația.
translation_notes:
  register: Română standard modernă, clară și demnă. „Spuneau” păstrează aspectul imperfectului, iar „conducătorul demonilor” evită arhaismul și ambiguitatea socială a lui „prințul demonilor”.
