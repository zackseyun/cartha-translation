id: MAT.9.11
reference: Matthew 9:11
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ Φαρισαῖοι ⸀ἔλεγον τοῖς μαθηταῖς αὐτοῦ· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίει ὁ διδάσκαλος ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/011.yaml
  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: ro
  text: 'Când au văzut aceasta[a], fariseii le spuneau ucenicilor lui: „De ce mănâncă învățătorul vostru cu colectorii de taxe și cu păcătoșii?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mai formal: „Văzând, fariseii le spuneau ucenicilor lui...” Participiul grecesc lasă neexprimat obiectul vederii, referindu-se în context la scena mesei.'
    reason: alternativă lexicală
lexical_decisions:
- source_word: ἰδόντες
  choice: Când au văzut aceasta
  rationale: Participiul aorist este redat temporal, firesc în română. Pronumele „aceasta” este adăugat pentru fluență și trimite la scena mesei din context, deși obiectul rămâne implicit în greacă.
- source_word: ἔλεγον
  choice: le spuneau
  rationale: Imperfectul românesc păstrează aspectul imperfectiv al formei grecești și exprimă vorbirea aflată în desfășurare.
- source_word: μαθηταῖς
  choice: ucenicilor
  rationale: „Ucenici” este termenul biblic consacrat și inteligibil pentru relația dintre învățător și cei care îl urmează și învață de la el.
- source_word: Διὰ τί
  choice: De ce
  rationale: Redare directă și idiomatică a întrebării cauzale.
- source_word: τελωνῶν
  choice: colectorii de taxe
  rationale: Redă ocupația stigmatizată social fără a introduce termenul tehnic și potențial neclar „arendași de taxe”.
- source_word: ἁμαρτωλῶν
  choice: păcătoșii
  rationale: Echivalent direct, care păstrează atât sensul moral, cât și caracterul de categorie socială atribuită în context.
- source_word: ἐσθίει
  choice: mănâncă
  rationale: Păstrează prezentul întrebării și sensul lexical simplu, fără a amplifica ideea prin „ia masa” sau „ospătează”.
- source_word: διδάσκαλος
  choice: învățătorul
  rationale: Redă transparent titlul și păstrează legătura lexicală și conceptuală cu „ucenicilor”.
theological_decisions:
- issue: Exprimarea obiectului implicit al verbului „au văzut”
  choice: S-a adăugat „aceasta” în text, cu notă explicativă.
  alternative: „Văzând, fariseii...” sau „Când au văzut, fariseii...”
  rationale: Greaca nu exprimă obiectul participiului, însă româna curentă cere de regulă un complement în această construcție. „Aceasta” indică situația mesei din context fără să adauge o interpretare teologică.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. „Fariseii” este scris cu minusculă conform normelor românești pentru numele membrilor unei grupări; formularea păstrează aspectul imperfectiv și evită arhaismele.
