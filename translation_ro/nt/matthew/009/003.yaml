source:
  edition: SBLGNT
  text: καὶ ἰδού τινες τῶν γραμματέων εἶπαν ἐν ἑαυτοῖς· Οὗτος βλασφημεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/003.yaml
  text: And behold[a], some of the scribes said among themselves, “This man is blaspheming.”
translation:
  language: ro
  text: 'Și iată, unii dintre cărturari și-au zis în sinea lor[a]: „Omul acesta blasfemiază.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „și-au spus între ei”. Expresia grecească poate indica fie o deliberare lăuntrică, fie o vorbire privată în cadrul grupului.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Și
  rationale: Păstrează conjuncția narativă simplă de la începutul versetului.
- source_word: ἰδού
  choice: iată
  rationale: Redă firesc în română marcatorul discursiv care atrage atenția și conferă vivacitate relatării.
- source_word: τινες τῶν γραμματέων
  choice: unii dintre cărturari
  rationale: Redă atât caracterul nedefinit al lui τινες, cât și partitivul τῶν; „cărturari” este termenul biblic românesc consacrat și suficient de clar în context.
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: și-au zis în sinea lor
  rationale: Păstrează verbul explicit „au zis” și caracterul lăuntric al expresiei, fără a o reduce neapărat la simplul „au gândit”.
- source_word: Οὗτος
  choice: Omul acesta
  rationale: Este o formulare românească naturală care redă demonstrativul și poate păstra nuanța contextuală de dezaprobare fără a o exagera.
- source_word: βλασφημεῖ
  choice: blasfemiază
  rationale: Redă direct prezentul verbului și acuzația religioasă, într-o formulare clară și actuală.
theological_decisions:
- issue: Redarea acuzației cărturarilor împotriva lui Isus
  choice: „Omul acesta blasfemiază.”
  alternative: „Acesta rostește blasfemii.”
  rationale: Formularea păstrează acuzația directă și tensiunea narativ-teologică, fără a introduce aici explicația motivului sau o evaluare a acuzației.
translation_notes:
  register: Română standard modernă, cu ton demn și narativ. „Iată” și „cărturari” păstrează continuitatea vocabularului biblic, iar construcția generală rămâne accesibilă cititorului contemporan.
