id: MAT.9.16
reference: Matthew 9:16
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οὐδεὶς δὲ ἐπιβάλλει ἐπίβλημα ῥάκους ἀγνάφου ἐπὶ ἱματίῳ παλαιῷ· αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/016.yaml
  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: ro
  text: Dar nimeni nu pune un petic din pânză nouă, care nu a intrat la apă[a], pe o haină veche, căci peticul se desprinde de haină și ruptura se face mai mare.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „pânză nepiuată”; grecescul se referă la pânză care nu fusese încă prelucrată prin piuare și, prin urmare, nu se contractase încă.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δὲ
  choice: Dar nimeni
  rationale: Redă subiectul negativ universal și tranziția ușor adversativă într-o formulare românească firească.
- source_word: ἐπιβάλλει ἐπίβλημα
  choice: pune un petic
  rationale: „Pune” păstrează sensul general al verbului, fără a introduce explicit coaserea, iar „petic” este termenul curent pentru bucata aplicată unei haine.
- source_word: ῥάκους ἀγνάφου
  choice: din pânză neintratată la apă
  rationale: Exprimă pentru cititorul modern efectul practic al unei pânze neprelucrate, care urmează să intre la apă; alternativa tehnică este păstrată în nota de subsol.
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: pe o haină veche
  rationale: „Haină” redă natural și suficient de larg termenul ἱμάτιον în această comparație.
- source_word: αἴρει ... ἀπὸ τοῦ ἱματίου
  choice: se desprinde de haină
  rationale: În context, verbul indică separarea peticului de haină și tensiunea care agravează ruptura, fără a preciza excesiv mecanismul.
- source_word: τὸ πλήρωμα αὐτοῦ
  choice: peticul
  rationale: Expresia literală „umplutura lui” desemnează aici bucata care acoperă ruptura; repetarea lui „peticul” este limpede și idiomatică.
- source_word: χεῖρον σχίσμα γίνεται
  choice: ruptura se face mai mare
  rationale: Redă comparativul χεῖρον ca agravare a rupturii într-o formulare românească naturală; în acest context, „mai mare” exprimă rezultatul concret.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Imaginea concretă a reparării unei haine este păstrată, iar termenul tehnic rar „nepiuată” este mutat în notă.
