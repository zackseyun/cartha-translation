id: MAT.9.1
reference: Matthew 9:1
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ ⸀ἐμβὰς ⸀εἰς πλοῖον διεπέρασεν καὶ ἦλθεν εἰς τὴν ἰδίαν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/001.yaml
  text: And after getting into a boat[a], he crossed over and came to his own city.
translation:
  language: ro
  text: Și, urcând într-o barcă, a trecut de cealaltă parte și a venit în cetatea sa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „orașul său”. Greaca spune literal „propria sa cetate”, referindu-se probabil la cetatea asociată cu Isus în această etapă a relatării, cel mai probabil Capernaum.
    reason: Alternativă lexicală și clarificarea unui referent lăsat implicit în textul grecesc.
lexical_decisions:
- source_word: ἐμβὰς εἰς πλοῖον
  choice: urcând într-o barcă
  rationale: Participiul aorist exprimă o acțiune anterioară verbelor principale. În româna narativă, „urcând într-o barcă” redă firesc intrarea la bord, fără a transforma construcția într-o propoziție coordonată.
- source_word: πλοῖον
  choice: o barcă
  rationale: Termenul desemnează în general o ambarcațiune; în contextul Mării Galileii, „barcă” este mai firesc și mai proporționat decât „corabie”.
- source_word: διεπέρασεν
  choice: a trecut de cealaltă parte
  rationale: Verbul indică traversarea dintr-o parte în alta, mai ales pe apă. Formularea păstrează explicit sensul direcțional.
- source_word: ἦλθεν
  choice: a venit
  rationale: Redă direct verbul ἔρχομαι și păstrează perspectiva narativă a textului.
- source_word: τὴν ἰδίαν πόλιν
  choice: cetatea sa
  rationale: ἴδιος exprimă apartenența sau asocierea personală. „Cetatea sa” este concis, demn și păstrează formularea neutră, fără a identifica explicit localitatea ori a o defini strict drept loc natal.
- source_word: Καὶ ... καὶ
  choice: Și ... și
  rationale: Repetiția leagă acțiunile într-o succesiune narativă simplă și reflectă stilul conectiv al lui Matei.
theological_decisions:
- issue: Identitatea expresiei „cetatea sa”
  choice: Formulare neutră, fără numirea cetății în textul principal
  alternative: Identificarea explicită drept Capernaum sau parafrazarea ca „orașul său de reședință”
  rationale: Textul grecesc nu numește cetatea. Contextul narativ indică probabil Capernaumul, dar traducerea păstrează ambiguitatea sursei și explică posibilitatea într-o notă.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. „Cetate” păstrează tonul biblic fără a deveni arhaic; nota oferă alternativa modernă „oraș”. Punctuația marchează participiul introductiv fără a încărca fraza.
