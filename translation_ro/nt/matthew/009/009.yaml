  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: ro
  text: 'Pe când Isus mergea mai departe de acolo, a văzut un om numit Matei, care ședea la punctul de colectare a taxelor, și i-a spus[a]: „Urmează-mă!” El s-a ridicat și l-a urmat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: „îi spune”; greaca folosește prezentul istoric pentru un efect de vivacitate narativă.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων ... ἐκεῖθεν
  choice: Pe când Isus pleca de acolo
  rationale: Construcția redă acțiunea în desfășurare a participiului prezent și mișcarea din locul anterior exprimată de ἐκεῖθεν, într-o română narativă firească.
- source_word: ἄνθρωπον
  choice: un om
  rationale: În context este vorba despre un bărbat anume; „un om” este formularea românească naturală și fidelă.
- source_word: Μαθθαῖον λεγόμενον
  choice: numit Matei
  rationale: Redă direct faptul că omul era cunoscut sub numele Matei, fără adaos interpretativ.
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: care ședea la punctul de încasare a taxelor
  rationale: Formularea descrie atât poziția lui Matei, cât și locul în care se încasau taxele ori taxele de trecere, fără a sugera nejustificat o instituție modernă.
- source_word: λέγει αὐτῷ
  choice: i-a spus
  rationale: Perfectul compus este timpul narativ firesc în româna modernă; prezentul istoric al textului grec este semnalat în nota de subsol.
- source_word: Ἀκολούθει μοι
  choice: Urmează-mă!
  rationale: Imperativul redă concis chemarea personală a lui Isus, păstrând atât sensul concret, cât și implicația uceniciei, fără parafrazare.
- source_word: ἀναστὰς
  choice: s-a ridicat
  rationale: Redă idiomatic acțiunea care precedă urmarea lui Isus.
- source_word: ἠκολούθησεν αὐτῷ
  choice: l-a urmat
  rationale: Păstrează formularea concretă și implicația uceniciei fără a o transforma într-o explicație teologică.
theological_decisions:
- issue: Natura chemării adresate lui Matei
  choice: „Urmează-mă!”
  alternative: „Vino și fii ucenicul Meu!”
  rationale: Textul implică intrarea în ucenicie, dar imperativul grec nu trebuie extins printr-o explicație doctrinară.
translation_notes:
  register: Română standard modernă, clară și demnă. „Punctul de încasare a taxelor” evită atât caracterul prea instituțional al lui „birou fiscal”, cât și restrângerea nejustificată la o vamă modernă. Narațiunea folosește perfectul compus, iar prezentul istoric grec este păstrat ca informație în notă.
