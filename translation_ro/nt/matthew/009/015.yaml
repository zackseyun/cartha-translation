id: MAT.9.15
reference: Matthew 9:15
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: ro
  text: 'Isus le-a zis: „Pot oare nuntașii[a] să jelească atâta timp cât mirele este cu ei? Dar vor veni zile când mirele va fi luat de la ei[b], și atunci vor posti.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: „fiii odăii de nuntă”, expresie pentru însoțitorii mirelui sau pentru cei care iau parte la nuntă.'
    reason: lexical_alternative
  - marker: b
    text: Sau „va fi îndepărtat de la ei”. Formularea pasivă sugerează mai mult decât o plecare obișnuită.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: nuntașii
  rationale: Expresia literală „fiii odăii de nuntă” este un idiom semitic pentru cei care iau parte la sărbătoarea nunții, îndeosebi însoțitorii mirelui. „Nuntașii” este firesc și limpede în româna actuală, iar nota păstrează sensul mai precis al rolului social.
- source_word: πενθεῖν
  choice: să jelească
  rationale: Verbul exprimă doliul și mâhnirea profundă; „a jeli” păstrează contrastul puternic cu bucuria prezenței mirelui și cu postul ulterior.
- source_word: ἐφ’ ὅσον
  choice: atâta timp cât
  rationale: Redă natural și exact durata indicată de expresia grecească.
- source_word: νυμφίος
  choice: mirele
  rationale: Este termenul românesc normal și păstrează nealterată imaginea nupțială și posibila ei rezonanță cristologică.
- source_word: ἀπαρθῇ
  choice: va fi luat de la ei
  rationale: Pasivul sugerează îndepărtarea mirelui, nu simpla lui plecare; formularea păstrează această nuanță fără a explicita interpretativ moartea lui Isus.
- source_word: νηστεύσουσιν
  choice: vor posti
  rationale: Redare directă și naturală a viitorului verbului „a posti”.
- source_word: Μὴ δύνανται ... ;
  choice: Pot oare ... să ...?
  rationale: Întrebarea retorică formulată cu μή așteaptă răspuns negativ. Construcția românească cu „oare” îi păstrează caracterul retoric fără o etichetă interogativă artificială.
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Dar vor veni zile
  rationale: Redă firesc expresia temporală și contrastul moderat introdus de δέ.
theological_decisions:
- issue: Semnificația cristologică posibilă a imaginii mirelui
  choice: Imaginea „mirelui” este păstrată fără identificare teologică explicită în traducere.
  alternative: O explicitare interpretativă care l-ar identifica pe Isus drept mirele mesianic.
  rationale: Textul permite cititorului să sesizeze implicația, dar nu o formulează direct; traducerea păstrează astfel metafora și tensiunea teologică proprie versetului.
- issue: Nuanța pasivului ἀπαρθῇ
  choice: „va fi luat de la ei”
  alternative: „va pleca de la ei” sau „va fi îndepărtat de la ei”
  rationale: Alegerea păstrează sugestia unei îndepărtări suferite, posibil cu valoare anticipativă, fără a preciza agentul sau evenimentul.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Nuntașii” evită calchierea obscură a idiomului, iar „să jelească” și „va fi luat” păstrează gravitatea și forța anticipativă ale textului.
