id: MAT.9.35
reference: Matthew 9:35
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: ro
  text: Isus străbătea toate cetățile și satele, învățând în sinagogile lor, proclamând vestea bună a Împărăției și vindecând orice boală și orice neputință.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „orice boală și orice infirmitate”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: străbătea
  rationale: Imperfectul descrie activitatea itinerantă continuă sau repetată a lui Isus; „străbătea” exprimă firesc deplasarea prin mai multe așezări.
- source_word: πόλεις πάσας καὶ τὰς κώμας
  choice: toate cetățile și satele
  rationale: Păstrează deosebirea dintre centrele urbane și așezările mai mici, într-o formulare românească naturală.
- source_word: διδάσκων
  choice: învățând
  rationale: Redă participiul prezent și caracterul concomitent, continuu al acțiunii.
- source_word: συναγωγαῖς αὐτῶν
  choice: sinagogile lor
  rationale: Păstrează termenul istoric-religios și pronumele din textul grecesc.
- source_word: κηρύσσων
  choice: proclamând
  rationale: Redă dimensiunea publică, de vestire, a verbului κηρύσσω fără a-l limita la sensul ecleziastic modern al predicării.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: vestea bună a Împărăției
  rationale: „Vestea bună” comunică transparent sensul lui εὐαγγέλιον, iar genitivul „a Împărăției” rămâne neexplicat, fără adaos interpretativ.
- source_word: θεραπεύων
  choice: vindecând
  rationale: Este echivalentul românesc firesc în contextul vindecărilor săvârșite de Isus.
- source_word: πᾶσαν νόσον
  choice: orice boală
  rationale: Redă distributiv πᾶσαν și termenul uzual pentru νόσος.
- source_word: πᾶσαν μαλακίαν
  choice: orice suferință
  rationale: În acest context, μαλακία denumește o stare de slăbiciune sau neputință trupească. „Suferință” oferă o distincție naturală față de „boală”, iar alternativa mai literală este păstrată în notă.
theological_decisions:
- issue: Redarea lui εὐαγγέλιον
  choice: vestea bună
  alternative: Evanghelia
  rationale: Alegerea exprimă sensul lexical într-un limbaj modern și accesibil, fără să schimbe conținutul teologic al vestirii.
- issue: Caracterul cuprinzător al expresiei πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: orice boală și orice suferință
  alternative: orice boală și orice neputință
  rationale: Repetarea lui πᾶσαν este păstrată pentru a reda întinderea afirmației, fără atenuare sau extindere doctrinară.
translation_notes:
  register: Română standard modernă, clară și demnă. Construcția cu trei participii păstrează succesiunea și simultaneitatea acțiunilor din greacă. Majuscula la „Împărăției” facilitează referirea la împărăția lui Dumnezeu fără a adăuga explicit cuvinte absente din verset.
