lexical_decisions:
- source_word: καὶ
  choice: Și
  rationale: Păstrează coordonarea simplă și cursul narativ al textului grec, fără a adăuga o nuanță temporală explicită.
- source_word: ἐγερθεὶς
  choice: s-a ridicat
  rationale: Redă natural în româna actuală participiul aorist folosit aici cu sens intranzitiv, fără formularea rigidă „ridicându-se”.
- source_word: ἀπῆλθεν
  choice: s-a dus
  rationale: Exprimă plecarea din locul respectiv într-o formulare românească firească; ideea îndepărtării este suficient de clară din context.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: acasă
  rationale: În acest context, românescul „acasă” redă idiomatic deplasarea spre propria locuință, implicată de pronumele αὐτοῦ, fără a schimba referentul.
