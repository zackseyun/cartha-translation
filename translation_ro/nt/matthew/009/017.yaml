id: MAT.9.17
reference: Matthew 9:17
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
translation:
  language: ro
  text: Nici nu pun vin nou în burdufuri vechi; altfel, burdufurile crapă, vinul se varsă, iar burdufurile se distrug. Ci pun vin nou în burdufuri noi[a] și amândouă se păstrează.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greaca folosește adjective diferite pentru „vin nou” (νέος, nou în timp) și „burdufuri noi” (καινός, noi ca stare, neuzate).
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Nici nu
  rationale: Leagă această a doua imagine negativă de afirmația precedentă și redă firesc valoarea aditiv-negativă a termenului grecesc.
- source_word: βάλλουσιν
  choice: pun
  rationale: În contextul umplerii și păstrării vinului, „pun” este echivalentul românesc firesc, fără ideea nepotrivită de aruncare.
- source_word: οἶνον νέον
  choice: vin nou
  rationale: Redă direct vinul făcut de curând și păstrează formularea tradițională, clară în română.
- source_word: ἀσκοὺς
  choice: burdufuri
  rationale: Denumirea românească consacrată și exactă pentru recipientele din piele folosite la păstrarea vinului.
- source_word: παλαιούς
  choice: vechi
  rationale: Păstrează contrastul direct cu burdufurile noi, sugerând recipiente îmbătrânite și mai puțin elastice fără a adăuga explicit această explicație.
- source_word: εἰ δὲ μή γε
  choice: altfel
  rationale: Redă idiomatic avertismentul condițional și introduce limpede consecințele practicii greșite.
- source_word: ῥήγνυνται
  choice: crapă
  rationale: Descrie natural ruperea burdufurilor sub presiune; este mai potrivit pentru piele decât o formulare care ar sugera explozia.
- source_word: ἐκχεῖται
  choice: se varsă
  rationale: Exprimă firesc pierderea neintenționată a vinului după crăparea recipientelor.
- source_word: ἀπόλλυνται
  choice: se distrug
  rationale: Arată că burdufurile devin inutilizabile, păstrând forța verbului fără a folosi nepotrivit „pier” pentru obiecte.
- source_word: ἀλλὰ
  choice: Ci
  rationale: Introduce corect alternativa pozitivă după negația de la începutul comparației.
- source_word: καινούς
  choice: noi
  rationale: „Burdufuri noi” este formularea naturală în română. Deosebirea lexicală grecească dintre νέος și καινός este indicată în nota de subsol, deoarece „burdufuri proaspete” ar suna nefiresc.
- source_word: ἀμφότεροι συντηροῦνται
  choice: amândouă se păstrează
  rationale: Se referă împreună la vin și la burdufuri și redă fără adaos ideea conservării ambelor.
theological_decisions:
- issue: Deosebirea dintre νέος și καινός în același verset
  choice: „vin nou” și „burdufuri noi”, cu explicarea deosebirii grecești într-o notă
  alternative: „vin nou” și „burdufuri proaspete”
  rationale: 'Greaca folosește adjective diferite: νέος pentru vin, cu accent pe noutatea în timp, și καινός pentru burdufuri, cu accent pe starea lor nouă și potrivită folosirii. Româna cere însă formularea idiomatică „burdufuri noi”; nota păstrează nuanța fără a produce o expresie artificială.'
translation_notes:
  register: Română standard modernă, clară și demnă. S-a păstrat imaginea istorică a burdufurilor, iar propozițiile au o curgere orală firească. Punctuația evidențiază consecința și contrastul fără a supraexplica metafora.
