id: MAT.9.8
reference: Matthew 9:8
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
translation:
  language: ro
  text: Dar mulțimile, când au văzut aceasta, s-au temut[a] și l-au glorificat pe Dumnezeu, care dăduse oamenilor[b] o asemenea autoritate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „au fost cuprinși de uimire reverențioasă”. Verbul grecesc înseamnă mai literal „s-au temut”, dar teama poate include aici respect și uimire.
    reason: lexical_alternative
  - marker: b
    text: Termenul grecesc poate însemna „oamenilor” sau „ființelor omenești”, desemnând omenirea în general.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: când au văzut aceasta
  rationale: 'Participiul aorist este redat firesc printr-o propoziție temporală. Pronumele demonstrativ exprimă obiectul subînțeles din context: vindecarea și manifestarea autorității lui Isus.'
- source_word: δὲ
  choice: Dar
  rationale: Marchează trecerea la reacția mulțimilor și păstrează ușoara nuanță de contrast din narațiune.
- source_word: οἱ ὄχλοι
  choice: mulțimile
  rationale: Păstrează pluralul grecesc într-o formulare românească actuală.
- source_word: ἐφοβήθησαν
  choice: s-au temut
  rationale: Redă sensul lexical direct al verbului φοβέομαι, fără a reduce teama la simplă uimire reverențioasă.
- source_word: ἐδόξασαν
  choice: l-au glorificat
  rationale: Păstrează sensul teologic și corespondența lexicală a verbului δοξάζω; construcția cu complement direct este firească în româna modernă.
- source_word: τὸν θεὸν
  choice: pe Dumnezeu
  rationale: Este complementul direct al verbului „a glorifica”; redare românească standard.
- source_word: τὸν δόντα
  choice: care dăduse
  rationale: Participiul aorist articulat este redat printr-o propoziție relativă, iar mai-mult-ca-perfectul indică firesc faptul că dăruirea autorității precedă reacția mulțimilor.
- source_word: ἐξουσίαν
  choice: autoritate
  rationale: Termenul indică autoritate sau drept legitim, nu doar putere ori capacitate.
- source_word: τοιαύτην
  choice: o asemenea
  rationale: Redă natural în română caracterizarea autorității prin τοιαύτην.
- source_word: τοῖς ἀνθρώποις
  choice: oamenilor
  rationale: Redă exact pluralul lui ἄνθρωπος și rămâne deschis atât referirii la oameni în general, cât și tensiunii narative create de autoritatea manifestată de Isus.
theological_decisions:
- issue: Dacă reacția mulțimilor trebuie redată drept teamă sau doar drept uimire reverențioasă
  choice: s-au temut
  alternative: au fost cuprinși de uimire reverențioasă
  rationale: Verbul grecesc denotă în mod direct teama. Contextul poate include respect și uimire, dar traducerea nu elimină tensiunea emoțională a formulării.
- issue: Domeniul de referință al expresiei τοῖς ἀνθρώποις
  choice: oamenilor
  alternative: ființelor omenești
  rationale: Pluralul grecesc poate avea sens reprezentativ, referindu-se la oameni în general. Formularea românească păstrează acest sens posibil fără a decide dacă mulțimile generalizează pornind de la autoritatea văzută la Isus.
translation_notes:
  register: Română standard modernă, cu ton demn și clar. S-a preferat „a glorifica” pentru consecvență lexicală și greutate teologică, iar sensurile alternative reale sunt păstrate în note.
