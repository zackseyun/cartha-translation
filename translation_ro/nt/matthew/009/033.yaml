id: MAT.9.33
reference: Matthew 9:33
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἐκβληθέντος τοῦ δαιμονίου ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι λέγοντες· Οὐδέποτε ἐφάνη οὕτως ἐν τῷ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: ro
  text: 'Și, după ce demonul a fost alungat, omul mut[a] a vorbit. Mulțimile au rămas uimite și au spus: „Niciodată nu s-a mai văzut așa ceva în Israel!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „omul surd”. Cuvântul grecesc poate însemna fie „surd”, fie „mut”; aici contextul favorizează „mut”, deoarece accentul cade pe faptul că omul a vorbit.'
    reason: alternativă lexicală
lexical_decisions:
- source_word: ἐκβληθέντος
  choice: după ce ... a fost alungat
  rationale: Participiul aorist pasiv din construcția genitivului absolut exprimă o acțiune anterioară verbului principal; formularea este firească în română și păstrează raportul temporal.
- source_word: τοῦ δαιμονίου
  choice: demonul
  rationale: În relatările evanghelice despre exorcizare, δαιμόνιον desemnează precis un demon; articolul hotărât este redat natural în română.
- source_word: ἐλάλησεν
  choice: a vorbit
  rationale: Aoristul simplu al lui λαλέω afirmă faptul vorbirii, fără a impune nuanța suplimentară „a început să vorbească”.
- source_word: ὁ κωφός
  choice: omul mut
  rationale: κωφός poate însemna „surd” sau „mut”, însă rezultatul imediat, „a vorbit”, arată că aici este evidențiată incapacitatea de a vorbi. „Omul” este explicitat firesc din context.
- source_word: ἐθαύμασαν
  choice: au rămas uimite
  rationale: Verbul exprimă uimire puternică; această formulare este actuală și idiomatică, fără arhaismul posibil al lui „s-au minunat”.
- source_word: οἱ ὄχλοι
  choice: mulțimile
  rationale: Păstrează pluralul substantivului grecesc și este forma românească standard.
- source_word: Οὐδέποτε
  choice: niciodată
  rationale: Redare directă și idiomatică a adverbului absolut de timp.
- source_word: ἐφάνη οὕτως
  choice: nu s-a mai văzut așa ceva
  rationale: Pasivul lui φαίνω poate avea sensul idiomatic „a fi văzut”, iar οὕτως indică felul evenimentului. Formularea românească exprimă natural caracterul fără precedent, fără a schimba sensul în „s-a întâmplat”.
- source_word: ἐν τῷ Ἰσραήλ
  choice: în Israel
  rationale: Redare concisă și standard, care poate desemna atât cadrul poporului, cât și sfera lui Israel.
theological_decisions:
- issue: Domeniul semantic al lui κωφός în contextul vindecării și al exorcizării
  choice: „omul mut”, cu alternativa lexicală menționată în notă
  alternative: „omul surd”
  rationale: Termenul grec admite ambele sensuri, dar afirmația imediată că omul a vorbit favorizează sensul „mut”. Nota păstrează ambiguitatea lexicală autentică fără a introduce în text o a doua dizabilitate.
- issue: Sensul lui ἐφάνη în exclamația mulțimilor
  choice: „nu s-a mai văzut așa ceva”
  alternative: „nu a mai apărut așa ceva”
  rationale: Forma pasivă poate fi înțeleasă idiomatic drept „a fost văzut”. În română, „s-a văzut” redă mai natural reacția la evenimentul observat, păstrând totodată ideea de manifestare fără precedent.
translation_notes:
  register: Română standard modernă, clară și demnă. Sintaxa evită atât literalismul greoi, cât și formulările confesionale. Exclamația finală redă firesc uimirea mulțimilor.
