id: MAT.9.27
reference: Matthew 9:27
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ παράγοντι ἐκεῖθεν τῷ Ἰησοῦ ἠκολούθησαν ⸀αὐτῷ δύο τυφλοὶ κράζοντες καὶ λέγοντες· Ἐλέησον ἡμᾶς, ⸀υἱὲ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: ro
  text: 'În timp ce Isus pleca de acolo, doi orbi l-au urmat, strigând: „Ai milă de noi, Fiul lui David!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Fiul lui David” este un titlu regal și mesianic, care îl identifică pe Isus drept moștenitorul promis din linia lui David.
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν τῷ Ἰησοῦ
  choice: În timp ce Isus pleca de acolo
  rationale: Participiul prezent exprimă o acțiune concomitentă cu urmarea lui Isus. „Pleca de acolo” redă firesc deplasarea mai departe din acel loc, fără a sugera doar că trecea pe lângă cei doi.
- source_word: ἠκολούθησαν αὐτῷ
  choice: l-au urmat
  rationale: În context, verbul indică în primul rând urmarea fizică a lui Isus; formularea românească este directă și idiomatică.
- source_word: δύο τυφλοὶ
  choice: doi orbi
  rationale: Adjectivul masculin plural este folosit substantival. „Doi orbi” este redarea firească și exactă în română.
- source_word: κράζοντες καὶ λέγοντες
  choice: strigând
  rationale: Construcția greacă folosește două participii, dar în româna actuală „strigând” introduce în mod natural și complet cuvintele rostite, păstrând intensitatea apelului fără formula redundantă „strigând și spunând”.
- source_word: Ἐλέησον ἡμᾶς
  choice: Ai milă de noi
  rationale: Redă imperativul ca rugăminte directă pentru intervenție milostivă și păstrează formularea consacrată, clară în română.
- source_word: υἱὲ Δαυίδ
  choice: Fiul lui David
  rationale: Păstrează titlul tradițional și rezonanța sa regal-mesianică, fără a-l reduce la simplul sens explicativ de „urmaș al lui David”.
theological_decisions:
- issue: Semnificația mesianică a expresiei υἱὲ Δαυίδ
  choice: Titlul este redat în text prin „Fiul lui David” și explicat succint în notă.
  alternative: O redare explicitantă precum „Urmașul mesianic al lui David”.
  rationale: Textul grecesc folosește titlul fără adaos explicativ. Păstrarea lui în text menține afirmația și tensiunea narativă ale lui Matei, iar nota oferă contextul necesar fără a introduce interpretarea în replica personajelor.
translation_notes:
  register: Română literară actuală, clară și demnă. Fraza păstrează dinamica narațiunii și intensitatea rugăminții, evitând atât arhaismele, cât și explicitările confesionale.
