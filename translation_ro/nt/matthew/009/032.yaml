id: MAT.9.32
reference: Matthew 9:32
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Αὐτῶν δὲ ἐξερχομένων ἰδοὺ προσήνεγκαν αὐτῷ ⸀ἄνθρωπον κωφὸν δαιμονιζόμενον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/032.yaml
  text: As they were going out[a], behold, they brought to him a mute[c][b], demon-possessed man.
translation:
  language: ro
  text: Pe când ieșeau ei, iată că au adus la el un om mut[a], stăpânit de demon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „surd”. Cuvântul grecesc poate avea ambele sensuri; faptul că în versetul următor omul vorbește susține aici traducerea „mut”.
    reason: lexical_alternative
  - marker: b
    text: Sau „demonizat”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτῶν δὲ ἐξερχομένων
  choice: Pe când ieșeau ei
  rationale: Redă firesc în română genitivul absolut cu sens temporal; δέ marchează discret trecerea la scena următoare și nu necesită aici un «dar» explicit.
- source_word: ἰδοὺ
  choice: iată că
  rationale: Păstrează funcția de atragere a atenției și vivacitatea narațiunii într-o formulare românească actuală și demnă.
- source_word: προσήνεγκαν αὐτῷ
  choice: au adus la el
  rationale: Redă explicit verbul προσφέρω și dativul αὐτῷ, indicând că omul a fost adus înaintea lui Isus.
- source_word: ἄνθρωπον
  choice: un om
  rationale: «Om» este echivalentul românesc direct și natural; contextul nu impune mai precis «bărbat».
- source_word: κωφὸν
  choice: mut
  rationale: Deși κωφός poate însemna surd sau mut, versetul următor evidențiază faptul că omul a început să vorbească, ceea ce susține sensul «mut» aici; ambiguitatea lexicală este păstrată în notă.
- source_word: δαιμονιζόμενον
  choice: stăpânit de demon
  rationale: Formulare românească limpede pentru afectarea demonică exprimată de participiu, fără a defini mai precis decât textul natura sau gradul acestei stăpâniri.
theological_decisions:
- issue: Redarea afectării demonice
  choice: stăpânit de demon
  alternative: demonizat
  rationale: Textul prezintă fără echivoc o afectare demonică reală, dar nu explică mecanismul ei. «Stăpânit de demon» este inteligibil și tradițional în română, în timp ce «demonizat» urmează mai îndeaproape forma greacă, dar este mai puțin firesc pentru publicul larg.
translation_notes:
  register: Română standard modernă, cu o formulare narativă naturală și demnă. «Iată că» păstrează marca discursivă a originalului fără arhaizare excesivă; structura evită formulări tehnice și nu dezvoltă o demonologie dincolo de afirmația textului.
