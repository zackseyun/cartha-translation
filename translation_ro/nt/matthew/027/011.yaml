source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς ⸀ἐστάθη ἔμπροσθεν τοῦ ἡγεμόνος· καὶ ἐπηρώτησεν αὐτὸν ὁ ἡγεμὼν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ Ἰησοῦς ⸀ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/011.yaml
  text: Jesus stood before the governor[a], and the governor questioned him, saying, “Are you the King of the Jews?” And Jesus said[b], “You say so.”
translation:
  language: ro
  text: 'Isus a stat înaintea guvernatorului, iar guvernatorul L-a întrebat: „Tu ești Regele iudeilor?[b]” Isus a spus: „Tu o spui.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Tu spui aceasta” ori „Este așa cum spui”. Răspunsul lui Isus este concis și oarecum eliptic în greacă.'
    reason: alternative_reading
  - marker: b
    text: Sau „iudeenilor” sau „celor din Iudeea”. Termenul grec poate desemna evreii în sens mai larg sau, în anumite contexte, locuitorii Iudeei.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστάθη
  choice: a stat
  rationale: Aoristul pasiv cu sens intranzitiv este redat firesc prin „a stat”; formularea nu introduce nici o durată accentuată, nici ideea că altcineva L-ar fi pus să stea.
- source_word: ἔμπροσθεν
  choice: înaintea
  rationale: Redare concisă și demnă, potrivită cadrului judiciar; exprimă atât poziția, cât și prezentarea în fața autorității.
- source_word: ἡγεμών / ἡγεμόνος
  choice: guvernator
  rationale: Este termenul românesc clar și uzual pentru oficialul roman din context; „prefect” ar fi mai tehnic, iar „conducător” prea general.
- source_word: ἐπηρώτησεν
  choice: L-a întrebat
  rationale: În româna actuală, „a întrebat” redă natural actul formal de chestionare fără a adăuga forța sugerată de „a interogat”.
- source_word: λέγων
  choice: redat prin introducerea directă a întrebării
  rationale: Participiul semitic „spunând” poate fi omis idiomatic în română, fără pierdere de conținut, prin folosirea celor două puncte înaintea vorbirii directe.
- source_word: βασιλεὺς
  choice: Împăratul
  rationale: În limbajul biblic românesc, „împărat” este echivalentul consacrat și inteligibil pentru titlul regal atribuit lui Isus; articolul hotărât reflectă ὁ.
- source_word: τῶν Ἰουδαίων
  choice: iudeilor
  rationale: „Iudeilor” este redarea românească tradițională și naturală în formula politică „Împăratul iudeilor”; poate desemna poporul evreu în ansamblu în acest context.
- source_word: ἔφη
  choice: i-a răspuns
  rationale: Deși verbul înseamnă literal „a spus”, „i-a răspuns” exprimă natural în română funcția replicii în dialog, fără a-i schimba conținutul.
- source_word: Σὺ λέγεις
  choice: Tu o spui
  rationale: Păstrează concizia, elipsa și caracterul reținut al expresiei grecești, fără a o transforma într-o afirmație complet explicită.
theological_decisions:
- issue: Nuanța răspunsului lui Isus, Σὺ λέγεις
  choice: „Tu o spui.”
  alternative: „Așa este cum spui” sau „Da, așa este”
  rationale: Formularea aleasă păstrează răspunsul măsurat, care nu neagă afirmația, dar nici nu adoptă fără calificare încadrarea politică a guvernatorului.
- issue: Sensul lui τῶν Ἰουδαίων
  choice: „iudeilor”
  alternative: „evreilor” sau, într-un sens geografic mai restrâns, „celor din Iudeea”
  rationale: În acuzația prezentată autorității romane, expresia funcționează ca o desemnare politico-etnică largă. „Iudeilor” păstrează termenul tradițional și lasă contextul să-i determine întinderea.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Sintaxa greacă este simplificată acolo unde o redare mecanică („spunând”) ar suna nefiresc. Pronumele referitor la Isus este scris cu majusculă conform uzului biblic românesc, fără a adăuga conținut semantic.
