  source_fidelity: Textul redă corect formula de împlinire, numele Ieremia, suma și dificultatea expresiei ἀπὸ υἱῶν Ἰσραήλ. Totuși, „prețuit” în româna actuală sugerează în primul rând apreciere sau afecțiune, nu stabilirea comercială a unei valori/preț; în acest context este mai exact „evaluat”.
  naturalness: Sintaxa este în general firească și are un registru biblic modern adecvat. „Celui evaluat, pe care l-au evaluat” este intenționat repetitiv, ca și greaca, dar rămâne inteligibil și exprimă mai clar ironia comercială decât „prețuit”.
  terminology: „Arginți”, „profetul Ieremia” și „s-a împlinit” sunt potrivite. „Evaluat” păstrează domeniul semantic comercial al lui τιμή/τιμάω fără a introduce o interpretare doctrinară. Nota despre Ieremia și Zaharia este echilibrată și nu rezolvă artificial problema de atribuire.
