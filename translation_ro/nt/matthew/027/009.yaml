source:
  edition: SBLGNT
  text: τότε ἐπληρώθη τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου λέγοντος· Καὶ ἔλαβον τὰ τριάκοντα ἀργύρια, τὴν τιμὴν τοῦ τετιμημένου ὃν ἐτιμήσαντο ἀπὸ υἱῶν Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/009.yaml
  text: Then what was spoken through Jeremiah the prophet was fulfilled[a], saying, ‘And they took the thirty pieces of silver, the price of the one who had been valued[b], whom they valued from among the sons of Israel,’
translation:
  language: ro
  text: 'Atunci s-a împlinit[a] ce fusese spus prin profetul Ieremia: „Și au luat cei treizeci de arginți, prețul celui evaluat[b], pe care l-au evaluat dintre fiii lui Israel,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Matei îi atribuie profetului Ieremia aceste cuvinte profetice. Formularea seamănă cel mai mult cu Zaharia 11:12–13. Explicațiile propuse includ un citat alcătuit din mai multe texte profetice, o trimitere la o colecție profetică asociată cu Ieremia sau o problemă apărută în transmiterea textului.
    reason: textual_variant
  - marker: b
    text: 'Expresia grecească este dificilă. Se mai poate traduce: „pe care unii dintre fiii lui Israel l-au evaluat” sau „pe care l-au evaluat de la fiii lui Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Marchează succesiunea în narațiune într-o formă românească firească și concisă.
- source_word: ἐπληρώθη
  choice: s-a împlinit
  rationale: Păstrează formula pasivă caracteristică citatelor de împlinire din Matei.
- source_word: τὸ ῥηθὲν
  choice: ce fusese spus
  rationale: Redă idiomatic participiul articulat și anterioritatea rostirii profetice.
- source_word: διὰ Ἰερεμίου τοῦ προφήτου
  choice: prin profetul Ieremia
  rationale: „Prin” redă rolul de mijlocitor al profetului exprimat de διά cu genitivul.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: cei treizeci de arginți
  rationale: Formulare românească consacrată și încă inteligibilă pentru piesele de bani din argint.
- source_word: τὴν τιμὴν τοῦ τετιμημένου
  choice: prețul celui ce fusese prețuit
  rationale: Păstrează contextul comercial și jocul lexical dintre τιμή și τιμάω, fără a elimina ironia expresiei.
- source_word: ὃν ἐτιμήσαντο
  choice: pe care l-au prețuit
  rationale: Repetă verbul „a prețui”, reflectând repetarea lui τιμάω în greacă.
- source_word: ἀπὸ υἱῶν Ἰσραήλ
  choice: dintre fiii lui Israel
  rationale: Redare apropiată de forma greacă dificilă; păstrează deschisă relația sintactică, explicată în nota de subsol.
theological_decisions:
- issue: Atribuirea citatului lui Ieremia, deși formularea este cea mai apropiată de Zaharia 11:12–13
  choice: Numele „Ieremia” este păstrat neschimbat în textul principal.
  alternative: Înlocuirea cu „Zaharia” sau armonizarea explicită a citatului.
  rationale: Textul grecesc SBLGNT îl numește explicit pe Ieremia; traducerea nu trebuie să rezolve prin modificare o dificultate textuală și interpretativă veche.
- issue: Relația sintactică a expresiei ἀπὸ υἱῶν Ἰσραήλ
  choice: dintre fiii lui Israel
  alternative: unii dintre fiii lui Israel; de la fiii lui Israel
  rationale: Construcția greacă este dificilă și admite mai multe explicații; textul principal păstrează ambiguitatea, iar nota oferă alternativele principale.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. Sintaxa formulei de împlinire este naturalizată moderat, iar repetiția „preț/prețuit” este păstrată pentru a reflecta legătura lexicală din greacă. „Arginți” menține rezonanța biblică fără a deveni neclar în context.
