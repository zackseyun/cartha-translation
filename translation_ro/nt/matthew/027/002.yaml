source:
  edition: SBLGNT
  text: καὶ δήσαντες αὐτὸν ἀπήγαγον καὶ ⸀παρέδωκαν Πιλάτῳ τῷ ἡγεμόνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/002.yaml
  text: And after binding him[b][a], they led him away and handed him over to Pilate the governor.
translation:
  language: ro
  text: Și, după ce l-au legat, l-au dus și l-au dat pe mâna lui Pilat, guvernatorul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „l-au predat lui Pilat, guvernatorul”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δήσαντες
  choice: după ce l-au legat
  rationale: Participiul aorist indică o acțiune anterioară verbelor principale; formularea redă firesc în română atât succesiunea, cât și sensul concret al legării.
- source_word: ἀπήγαγον
  choice: l-au dus de acolo
  rationale: Verbul exprimă ducerea unei persoane dintr-un loc; această redare este naturală în contextul transferului sub pază și păstrează elementul de îndepărtare.
- source_word: παρέδωκαν
  choice: l-au dat pe mâna
  rationale: Expresia românească redă limpede transferul în custodia și sub autoritatea lui Pilat, păstrând totodată rezonanța mai largă a verbului din narațiunea patimilor.
- source_word: Πιλάτῳ
  choice: Pilat
  rationale: Se folosește forma consacrată în limba română a numelui propriu.
- source_word: τῷ ἡγεμόνι
  choice: guvernatorului
  rationale: Termenul grecesc desemnează un conducător sau oficial guvernamental; «guvernator» este accesibil și nu precizează funcția mai îngust decât o face textul grec.
theological_decisions:
- issue: Redarea lui παραδίδωμι în narațiunea patimilor
  choice: l-au dat pe mâna
  alternative: l-au predat
  rationale: Varianta aleasă exprimă transferul juridic și custodial fără a reduce verbul la o simplă procedură administrativă; păstrează posibilitatea rezonanței teologice în contextul mai larg.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Coordonarea narativă inițială este păstrată prin «Și», iar topica «guvernatorului Pilat» urmează firesc dativul grec.
