  text: συμβούλιον δὲ λαβόντες ἠγόρασαν ἐξ αὐτῶν τὸν Ἀγρὸν τοῦ Κεραμέως εἰς ταφὴν τοῖς ξένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/007.yaml
  text: So after taking counsel[b][a], they bought the Potter’s Field with them as a burial place for foreigners.
translation:
  language: ro
  text: După ce s-au sfătuit, au cumpărat cu banii aceia[a] Ogorul Olarului, ca loc de înmormântare pentru străini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: „din ei”, cu referire la arginții amintiți în contextul precedent.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „pentru cei veniți din alte locuri”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβούλιον ... λαβόντες
  choice: După ce s-au sfătuit
  rationale: Redă idiomul participial „luând sfat” într-o română firească, păstrând ideea deliberării comune.
- source_word: δὲ
  choice: După ce
  rationale: δέ marchează aici continuarea narațiunii și nu cere un contrast puternic; curgerea este redată natural prin construcția temporală.
- source_word: ἠγόρασαν
  choice: au cumpărat
  rationale: Echivalent direct și firesc al aoristului lui ἀγοράζω.
- source_word: ἐξ αὐτῶν
  choice: cu ei
  rationale: Pronumele neutru plural se referă contextual la arginții din versetele precedente. Formularea păstrează referința pronominală a grecei, iar nota explică sensul monetar.
- source_word: τὸν Ἀγρὸν τοῦ Κεραμέως
  choice: Ogorul Olarului
  rationale: Redare consacrată și demnă a construcției genitivale, tratată în context ca desemnare a unui loc.
- source_word: εἰς ταφὴν
  choice: ca loc de înmormântare
  rationale: Exprimă limpede scopul pentru care a fost cumpărat ogorul.
- source_word: τοῖς ξένοις
  choice: pentru străini
  rationale: ξένοις poate desemna străini, venetici sau persoane din afara comunității locale; „străini” păstrează în română amplitudinea termenului.
theological_decisions:
- issue: Referentul pronumelui αὐτῶν
  choice: Pronumele este păstrat prin „cu ei” și înțeles contextual ca referindu-se la arginți.
  alternative: „cu banii aceia”
  rationale: Contextul imediat identifică arginții drept referent, dar textul principal nu înlocuiește pronumele grec cu o explicitare interpretativă; aceasta este oferită în notă.
- issue: Sensul lui ξένοις
  choice: „străini”
  alternative: „venetici” sau „cei veniți din alte locuri”
  rationale: Termenul poate indica persoane străine ori din afara locului; traducerea păstrează această deschidere fără a impune o categorie juridică sau etnică mai precisă.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. „Ogorul Olarului” păstrează rezonanța biblică fără formulări arhaice excesive.
