  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τότε ἰδὼν Ἰούδας ὁ ⸀παραδιδοὺς αὐτὸν ὅτι κατεκρίθη μεταμεληθεὶς ⸀ἔστρεψεν τὰ τριάκοντα ἀργύρια τοῖς ἀρχιερεῦσιν ⸀καὶ πρεσβυτέροις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/003.yaml
  text: Then Judas[a], who had betrayed him, seeing that he had been condemned[b], regretted it and returned the thirty pieces of silver to the chief priests and elders.
translation:
  language: ro
  text: Atunci Iuda, cel care îl trădase, când a văzut că fusese condamnat, a fost cuprins de remușcare și le-a înapoiat preoților de seamă și bătrânilor cele treizeci de monede de argint.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „cele treizeci de arginți”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Marcator temporal firesc în narațiune, care introduce următorul eveniment.
- source_word: ἰδὼν
  choice: când a văzut
  rationale: Redă natural în română valoarea temporală a participiului aorist.
- source_word: Ἰούδας
  choice: Iuda
  rationale: Forma consacrată în limba română a numelui biblic.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: cel care îl trădase
  rationale: Construcția relativă identifică rolul lui Iuda; mai-mult-ca-perfectul exprimă anterioritatea trădării, iar «a trăda» este sensul contextual consacrat, fără a exclude sensul lexical de predare.
- source_word: ὅτι κατεκρίθη
  choice: că Isus fusese condamnat
  rationale: Pasivul și anterioritatea sunt păstrate; numele «Isus» clarifică referentul pronumelui fără să schimbe sensul.
- source_word: μεταμεληθεὶς
  choice: a fost cuprins de remușcare
  rationale: Exprimă regretul moral puternic fără a afirma pocăința deplină, pe care termenul grec nu o impune.
- source_word: ἔστρεψεν
  choice: a înapoiat
  rationale: În contextul banilor, verbul are sensul firesc de a da înapoi.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: cele treizeci de monede de argint
  rationale: Redare modernă și transparentă pentru unitățile monetare de argint; alternativa tradițională este păstrată în notă.
- source_word: τοῖς ἀρχιερεῦσιν καὶ πρεσβυτέροις
  choice: celor mai de seamă preoți și bătrânilor
  rationale: Redă grupurile conducătoare iudaice prin terminologia românească biblică inteligibilă; «bătrânii» desemnează aici conducători ai poporului.
theological_decisions:
- issue: Sensul lui μεταμεληθεὶς în reacția lui Iuda
  choice: a fost cuprins de remușcare
  alternative: s-a pocăit; i-a părut rău; s-a răzgândit
  rationale: μεταμέλομαι indică regret sau remușcare și nu trebuie tradus într-un mod care să decidă implicit natura spirituală ori deplinătatea pocăinței lui Iuda.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Sintaxa participială greacă este transpusă printr-o propoziție temporală firească. Nota păstrează formularea tradițională și rezonanța ei intertextuală.
