  to: Atunci Iuda, cel care îl trădase, când a văzut că fusese condamnat, a fost cuprins de remușcare și le-a înapoiat preoților de seamă și bătrânilor cele treizeci de monede de argint.[a]
  rationale: Revizuirea înlocuiește numai formularea mai puțin idiomatică „celor mai de seamă preoți” cu „preoților de seamă”. Este păstrată exprimarea prudentă a remușcării și ancora notei rămâne atașată expresiei monetare la care se referă.
