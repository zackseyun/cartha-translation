    rationale: „Celor mai de seamă preoți” este inteligibil, dar „preoților de seamă” este expresia românească biblică mai naturală și mai stabilă pentru „chief priests”.
  revised_text: Atunci Iuda, cel care îl trădase, când a văzut că fusese condamnat, a fost cuprins de remușcare și le-a înapoiat preoților de seamă și bătrânilor cele treizeci de monede de argint.[a]
