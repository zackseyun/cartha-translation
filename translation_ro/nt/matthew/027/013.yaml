  text: τότε λέγει αὐτῷ ὁ Πιλᾶτος· Οὐκ ἀκούεις πόσα σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/013.yaml
  text: Then Pilate says to him[a], “Do you not hear how many things they are testifying against you?”
translation:
  language: ro
  text: 'Atunci Pilat îi spune: „Nu auzi câte mărturii depun ei împotriva ta?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „câte mărturisesc ei împotriva ta” sau „câte lucruri spun ei împotriva ta”. Verbul grecesc are un sens juridic, referindu-se la mărturia depusă împotriva cuiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Marchează succesiunea evenimentelor în narațiune, într-o formulare românească firească.
- source_word: λέγει
  choice: îi spune
  rationale: Păstrează prezentul istoric al narațiunii grecești și redă explicit complementul pronominal αὐτῷ.
- source_word: ὁ Πιλᾶτος
  choice: Pilat
  rationale: Articolul grecesc dinaintea numelui propriu nu se redă în româna standard.
- source_word: Οὐκ ἀκούεις
  choice: Nu auzi
  rationale: Păstrează forma de întrebare negativă și sensul de bază al verbului ἀκούω.
- source_word: πόσα
  choice: câte
  rationale: Pronumele neutru plural este lăsat nespecificat, ca în greacă, fără a-l transforma explicit în «acuzații».
- source_word: σου
  choice: împotriva ta
  rationale: În construcție cu καταμαρτυρέω, genitivul are aici sens adversativ, care trebuie exprimat explicit în română.
- source_word: καταμαρτυροῦσιν
  choice: mărturisesc ei împotriva ta
  rationale: Redă sensul juridic de a depune mărturie împotriva cuiva, fără a restrânge verbul la simplul «a acuza»; pronumele «ei» clarifică subiectul inclus în forma verbală grecească.
