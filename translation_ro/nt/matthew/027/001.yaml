revisions:
- from: Când s-a făcut dimineață[a], toți conducătorii preoților și bătrânii poporului s-au sfătuit[b] împotriva lui Isus, ca să-L dea la moarte.
  to: Când s-a făcut dimineață[a], toți marii preoți și bătrânii poporului s-au sfătuit[b] împotriva lui Isus, ca să-L omoare.
  rationale: Revizuirea înlocuiește termenul neidiomatic „conducătorii preoților” cu titulatura standard „marii preoți” și redă direct infinitivul θανατῶσαι prin „să-L omoare”, fără a introduce noțiunea de predare. Se păstrează deliberarea, opoziția față de Isus, caracterul cuprinzător al grupului și registrul narativ demn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:24:51Z'
review_pass:
  verdict: revise
  source_fidelity: Structura temporală, participarea tuturor grupurilor, orientarea ostilă față de Isus și scopul letal sunt redate corect în linii mari. Totuși, „să-L dea la moarte” poate sugera predarea lui către altă autoritate, sens care nu este exprimat de infinitivul θανατῶσαι („a omorî / a pune la moarte”).
  naturalness: Textul este fluent în româna standard modernă. „Când s-a făcut dimineață” și „s-au sfătuit” sunt naturale și potrivite registrului narativ.
  terminology: „Conducătorii preoților” nu este echivalentul terminologic românesc consacrat și limpede pentru οἱ ἀρχιερεῖς. „Marii preoți” este termenul standard pentru această categorie de conducători preoțești și nu implică în mod eronat mai mulți titulari simultani ai funcției unice de mare preot.
  issues:
  - severity: medium
    issue: „conducătorii preoților” pentru οἱ ἀρχιερεῖς
    rationale: Formularea este nenaturală ca titulatură și poate însemna conducători peste preoți în sens generic. „Marii preoți” este redarea românească standard a pluralului tehnic din Evanghelii.
  - severity: medium
    issue: „ca să-L dea la moarte” pentru ὥστε θανατῶσαι αὐτόν
    rationale: „A da la moarte” poate introduce ideea de predare, absentă aici. Verbul grec exprimă direct intenția de a-l omorî; această precizie trebuie păstrată.
  revised_text: Când s-a făcut dimineață[a], toți marii preoți și bătrânii poporului s-au sfătuit[b] împotriva lui Isus, ca să-L omoare.
  revised_footnotes:
