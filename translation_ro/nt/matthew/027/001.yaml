source:
  edition: SBLGNT
  text: Πρωΐας δὲ γενομένης συμβούλιον ἔλαβον πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ κατὰ τοῦ Ἰησοῦ ὥστε θανατῶσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/001.yaml
  text: When morning came[b][a], all the chief priests and the elders of the people took counsel against Jesus so as to put him to death.
translation:
  language: ro
  text: Când s-a făcut dimineață[a], toți marii preoți și bătrânii poporului s-au sfătuit[b] împotriva lui Isus, ca să-L omoare.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „În zori”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „au ținut sfat”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ γενομένης
  choice: Când s-a făcut dimineață
  rationale: Redă firesc în română genitivul absolut temporal și marchează trecerea la o nouă etapă a relatării; δέ este exprimat suficient prin tranziția frazei.
- source_word: συμβούλιον ἔλαβον
  choice: s-au sfătuit
  rationale: Expresie românească naturală care păstrează ideea deliberării comune, fără a adăuga explicit nuanța mai puternică de complot.
- source_word: πάντες
  choice: toți
  rationale: Păstrează explicit caracterul cuprinzător al participării conducerii menționate.
- source_word: οἱ ἀρχιερεῖς
  choice: conducătorii preoților
  rationale: Desemnează grupul conducător al preoțimii din Ierusalim și evită impresia greșită că ar fi existat simultan mai mulți titulari ai funcției unice de mare-preot.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: bătrânii poporului
  rationale: Păstrează titulatura formală a conducătorilor laici și construcția clară cu genitiv.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: împotriva lui Isus
  rationale: În contextul ostil, κατά cu genitivul are sens adversativ, nu doar sensul neutru „cu privire la”.
- source_word: ὥστε
  choice: ca să
  rationale: Redă natural în română rezultatul urmărit sau scopul deliberării, fără a decide rigid între aceste două nuanțe apropiate.
- source_word: θανατῶσαι αὐτόν
  choice: să-L dea la moarte
  rationale: Formulare demnă și potrivită contextului judiciar, care păstrează sensul provocării morții fără a preciza nejustificat procedura unei execuții.
theological_decisions:
- issue: Natura acțiunii conducătorilor împotriva lui Isus
  choice: 'Deliberare ostilă orientată spre moartea lui Isus: „s-au sfătuit împotriva lui Isus, ca să-L dea la moarte”'
  alternative: „s-au consultat cu privire la Isus” sau, mai accentuat, „au uneltit împotriva lui Isus”
  rationale: Textul grec indică limpede opoziția și intenția letală, însă nu impune termenul mai încărcat „au uneltit”. Redarea aleasă păstrează gravitatea și tensiunea textului fără amplificare confesională ori interpretativă.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. Formularea evită atât rigiditatea excesiv literală, cât și parafraza interpretativă; pronumele referitor la Isus este scris cu majusculă conform uzului biblic românesc răspândit.
