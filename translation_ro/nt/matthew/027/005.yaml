id: MAT.27.5
reference: Matthew 27:5
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ῥίψας τὰ ἀργύρια ⸂εἰς τὸν ναὸν⸃ ἀνεχώρησεν, καὶ ἀπελθὼν ἀπήγξατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/005.yaml
  text: And throwing the silver into the temple[a], he departed[b], and went and hanged himself.
translation:
  language: ro
  text: Și, aruncând arginții în sanctuar[a], a plecat; apoi s-a dus și s-a spânzurat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „în templu”; termenul grecesc naos desemnează adesea mai precis sanctuarul templului, nu întregul complex.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίψας
  choice: aruncând
  rationale: Participiul aorist exprimă o acțiune anterioară verbului principal; gerunziul românesc păstrează concizia și lasă succesiunea să reiasă natural din context.
- source_word: τὰ ἀργύρια
  choice: arginții
  rationale: Termenul se referă contextual la piesele de argint primite drept plată. „Arginții” este o formulare biblică bine cunoscută și încă inteligibilă, mai precisă aici decât simplul „argint”.
- source_word: εἰς τὸν ναὸν
  choice: în sanctuar
  rationale: ναός denumește de regulă clădirea sanctuarului, nu întregul complex al templului; „sanctuar” păstrează această precizie arhitecturală.
- source_word: ἀνεχώρησεν
  choice: a plecat
  rationale: Redă firesc sensul de îndepărtare sau retragere, într-o română modernă și demnă.
- source_word: ἀπελθὼν
  choice: apoi s-a dus
  rationale: Păstrează al doilea verb de mișcare fără redundanța greoaie „a plecat și, plecând”; „apoi” clarifică succesiunea narativă.
- source_word: ἀπήγξατο
  choice: s-a spânzurat
  rationale: Forma medie indică acțiunea îndreptată asupra propriei persoane, iar în context sensul firesc este sinuciderea prin spânzurare.
theological_decisions:
- issue: Sensul specific al lui ναός față de termenul mai larg pentru complexul templului
  choice: „sanctuar” în textul principal
  alternative: „templu” sau „sanctuarul templului”
  rationale: Alegerea păstrează distincția lexicală dintre sanctuarul propriu-zis și întregul complex al templului, fără a introduce o interpretare doctrinară.
translation_notes:
  register: Română standard modernă, cu ton narativ sobru. „Arginții” păstrează ecoul lexical și contextual tradițional, iar „sanctuar” redă mai exact termenul grec. Punctul și virgula evită o succesiune greoaie de conjuncții.
