source:
  edition: SBLGNT
  text: καὶ ἐν τῷ κατηγορεῖσθαι αὐτὸν ὑπὸ τῶν ἀρχιερέων ⸀καὶ πρεσβυτέρων οὐδὲν ἀπεκρίνατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/012.yaml
  text: And while he was being accused by the chief priests and elders[a], he answered nothing.
translation:
  language: ro
  text: Și, în timp ce era acuzat de preoții cei mai de seamă și de bătrâni, nu a răspuns nimic.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „nu a dat niciun răspuns”.'
    reason: Alternativă lexicală și idiomatică pentru οὐδὲν ἀπεκρίνατο.
lexical_decisions:
- source_word: ἐν τῷ κατηγορεῖσθαι
  choice: în timp ce era acuzat
  rationale: Construcția ἐν cu infinitiv articulat exprimă aici simultaneitatea; formularea păstrează atât desfășurarea acțiunii, cât și sensul pasiv.
- source_word: κατηγορεῖσθαι
  choice: era acuzat
  rationale: Verbul descrie acuzațiile aduse împotriva lui Isus într-un cadru juridic; „acuzat” este firesc și precis în româna actuală.
- source_word: ὑπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων
  choice: de preoții conducători și de bătrâni
  rationale: În Evanghelii, ἀρχιερεῖς desemnează conducerea preoțească, nu mai mulți titulari simultani ai funcției unice de mare-preot. „Preoții conducători” exprimă clar acest sens, iar „bătrâni” păstrează denumirea grupului de conducători.
- source_word: οὐδὲν
  choice: nimic
  rationale: Păstrează obiectul direct și formularea categorică a textului grec, fără a transforma enunțul într-o parafrază.
- source_word: ἀπεκρίνατο
  choice: a răspuns
  rationale: Este echivalentul românesc direct și natural al verbului deponent, fără adaos interpretativ.
- source_word: καὶ
  choice: Și
  rationale: Păstrează legătura narativă simplă cu versetul anterior, fără a introduce un contrast explicit care nu apare în greacă.
theological_decisions:
- issue: Tăcerea lui Isus înaintea acuzatorilor
  choice: 'Relatarea este redată simplu: „nu a răspuns nimic”.'
  alternative: O formulare interpretativă care ar accentua ecoul din Isaia 53, precum „nu le-a dat niciun răspuns”.
  rationale: Versetul descrie tăcerea lui Isus, dar nu formulează explicit aici o împlinire profetică; traducerea nu trebuie să adauge această interpretare.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Formularea „preoții conducători” evită impresia inexactă că ar fi existat simultan mai mulți mari-preoți titulari. Marcajul notei este plasat imediat după propoziția la care se referă.
