  verdict: revise
  source_fidelity: Construcția temporală „în timp ce era acuzat” redă fidel ἐν τῷ κατηγορεῖσθαι, inclusiv valoarea pasivă și durativă. „Nu a răspuns nimic” corespunde direct lui οὐδὲν ἀπεκρίνατο. Totuși, „preoții conducători” este o explicare funcțională mai puțin consacrată a lui ἀρχιερεῖς; „preoții cei mai de seamă” redă mai exact denumirea colectivă a grupului fără a sugera în mod inadecvat titulari multipli ai funcției de mare-preot.
  naturalness: Textul este fluent în româna standard modernă. „Preoții cei mai de seamă și bătrânii” este mai idiomatic în registrul biblic-narativ și mai ușor de recunoscut ca desemnare a grupurilor iudaice de conducere decât „preoții conducători și bătrâni”.
  terminology: Se recomandă „preoții cei mai de seamă” pentru ἀρχιερεῖς și „bătrânii” pentru πρεσβύτεροι. Această formulare păstrează caracterul de titlu/grup instituțional, fără a impune o interpretare confesională sau o reconstrucție istorică excesivă.
