  text: καὶ οὐκ ἀπεκρίθη αὐτῷ πρὸς οὐδὲ ἓν ῥῆμα, ὥστε θαυμάζειν τὸν ἡγεμόνα λίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/014.yaml
  text: And he did not answer him with even one word[b][a], so that the governor was greatly amazed.
translation:
  language: ro
  text: Și nu i-a răspuns nici măcar cu un singur cuvânt, încât guvernatorul se mira foarte mult.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: a răspuns
  rationale: Verbul deponent are sensul obișnuit „a răspunde”; împreună cu negația redă direct lipsa oricărui răspuns.
- source_word: αὐτῷ
  choice: i-
  rationale: Pronumele la dativ indică persoana căreia Isus nu i-a răspuns, adică guvernatorul/Pilat; cliticul românesc este forma firească.
- source_word: πρὸς οὐδὲ ἓν ῥῆμα
  choice: nici măcar cu un singur cuvânt
  rationale: Redă sensul comun al lui ῥῆμα, „cuvânt/rostire”, și păstrează accentul puternic al expresiei negative οὐδὲ ἕν.
- source_word: ὥστε
  choice: astfel că
  rationale: Introduce limpede rezultatul tăcerii lui Isus, fără a sugera neapărat un scop intenționat.
- source_word: θαυμάζειν
  choice: a rămas ... uimit
  rationale: Restructurarea cu verb finit este naturală în română și exprimă reacția de uimire rezultată.
- source_word: ἡγεμόνα
  choice: guvernatorul
  rationale: În contextul administrației provinciale romane, termenul îl desemnează precis pe guvernator, adică pe Pilat.
- source_word: λίαν
  choice: foarte
  rationale: Adverbul redă firesc în româna actuală gradul puternic al uimirii.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu formulare demnă și accesibilă. „Astfel că” păstrează valoarea consecutivă a lui ὥστε, iar „nici măcar cu un singur cuvânt” conservă emfaza originalului.
