- from: Dar nu i-a răspuns nici măcar cu un singur cuvânt, astfel că guvernatorul a rămas foarte uimit.
  to: Și nu i-a răspuns nici măcar cu un singur cuvânt, încât guvernatorul se mira foarte mult.
  rationale: Am înlocuit conjuncția adversativă nejustificată cu „Și” și am redat mai exact rezultatul exprimat de ὥστε θαυμάζειν, fără adaosul semantic din „a rămas”. Restul formulării a fost păstrat, deoarece este fidel și natural în româna standard modernă.
