id: MAT.27.6
reference: Matthew 27:6
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς λαβόντες τὰ ἀργύρια εἶπαν· Οὐκ ἔξεστιν βαλεῖν αὐτὰ εἰς τὸν κορβανᾶν, ἐπεὶ τιμὴ αἵματός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/006.yaml
  text: But the chief priests[a], taking the silver pieces, said, “It is not lawful to put them into the temple treasury[b], since they are the price of blood.”
translation:
  language: ro
  text: 'Dar preoții cei mai de seamă, luând monedele de argint, au spus: „Nu este îngăduit să le punem în vistieria templului[a], fiindcă sunt preț de sânge[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'În greacă: κορβανᾶν (korban), termen care se referă aici la vistieria sau la fondurile sacre ale templului.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „bani de sânge”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεῖς
  choice: preoții conducători
  rationale: Redă pluralul care desemnează autoritățile preoțești de rang înalt, fără a sugera că fiecare era individual mare-preot.
- source_word: λαβόντες
  choice: luând
  rationale: Participiul românesc păstrează firesc acțiunea însoțitoare și succesiunea implicită a participiului aorist.
- source_word: τὰ ἀργύρια
  choice: monedele de argint
  rationale: Contextul indică plata în argint menționată anterior; formularea este concretă și clară, fără a preciza un tip de monedă pe care greaca nu îl numește aici.
- source_word: Οὐκ ἔξεστιν
  choice: Nu este îngăduit
  rationale: Exprimă permisiunea legală și religioasă aflată în discuție, într-un registru românesc demn și natural.
- source_word: βαλεῖν
  choice: să le punem
  rationale: În contextul depunerii banilor într-o vistierie, „a pune” este sensul contextual firesc al verbului, fără forța inutilă a lui „a arunca”.
- source_word: κορβανᾶν
  choice: vistieria templului
  rationale: Comunică direct referirea la fondurile sacre ale templului; termenul transliterat este păstrat în nota de subsol.
- source_word: ἐπεὶ
  choice: fiindcă
  rationale: Introduce limpede motivul interdicției și se integrează natural în vorbirea directă.
- source_word: τιμὴ αἵματός
  choice: preț de sânge
  rationale: Păstrează expresia concisă și pregnantă a grecii, precum și tensiunea ei morală; alternativa idiomatică este oferită în notă.
theological_decisions:
- issue: Redarea lui κορβανᾶν fără a pierde cadrul sacru al templului
  choice: vistieria templului
  alternative: corbanul / vistieria
  rationale: Termenul se referă aici la vistieria sau fondurile sacre ale templului. Traducerea sensului este mai clară pentru cititorul modern, iar forma grecească este documentată în notă.
- issue: Redarea expresiei τιμὴ αἵματός
  choice: preț de sânge
  alternative: bani de sânge
  rationale: Formularea aleasă rămâne aproape de structura greacă și nu explicitează dacă sângele se referă la ucidere, vinovăție sau moarte; alternativa idiomatică apare în notă.
translation_notes:
  register: Română standard modernă, cu un registru demn și accesibil. „Preoții conducători” evită ambiguitatea pluralului „marii preoți”, iar „preț de sânge” păstrează concizia și tensiunea expresiei grecești.
