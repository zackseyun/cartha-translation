  text: διὸ ἐκλήθη ὁ ἀγρὸς ἐκεῖνος Ἀγρὸς Αἵματος ἕως τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/008.yaml
  text: Therefore that field has been called Field of Blood to this day.
translation:
  language: ro
  text: De aceea, ogorul acela a fost numit „Ogorul Sângelui” până în ziua de astăzi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: De aceea
  rationale: Redă clar și firesc legătura de consecință cu relatarea anterioară despre cumpărarea și denumirea ogorului.
- source_word: ἐκλήθη
  choice: a fost numit
  rationale: Redă direct aoristul pasiv al lui καλέω și actul istoric al atribuirii numelui; continuitatea folosirii lui este exprimată de sintagma temporală finală.
- source_word: ὁ ἀγρὸς ἐκεῖνος
  choice: ogorul acela
  rationale: „Ogor” este un echivalent natural pentru ἀγρός și permite păstrarea repetiției intenționate în numele locului.
- source_word: Ἀγρὸς Αἵματος
  choice: Ogorul Sângelui
  rationale: Păstrează structura cu genitiv a numelui și repetă termenul folosit pentru teren, menținând legătura narativă.
- source_word: ἕως τῆς σήμερον
  choice: până în ziua de astăzi
  rationale: Expresie românească firească, apropiată formal de greacă, indicând că numele era încă folosit în prezentul naratorului.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Formularea rămâne apropiată de structura greacă fără a deveni rigidă; ghilimelele marchează limpede numele locului.
