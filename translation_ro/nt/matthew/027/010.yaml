translation:
  language: ro
  text: Și i-au dat pentru ogorul olarului, așa cum mi-a poruncit Domnul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Textul grecesc păstrează aici persoana întâi, „mi-”, în această citare/aluzie profetică, fără a o adapta la contextul narativ. Verbul poate fi redat și „mi-a rânduit” sau „mi-a dat poruncă”.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ἔδωκαν
  choice: au dat
  rationale: Redă direct aoristul lui δίδωμι și evită interpretarea mai specifică „au plătit”.
- source_word: αὐτὰ
  choice: i-
  rationale: Pronumele românesc neaccentuat masculin plural se raportează firesc la arginții/banii din context; genul gramatical nu poate reproduce neutrul plural grecesc.
- source_word: εἰς τὸν ἀγρὸν
  choice: pentru ogorul
  rationale: În contextul folosirii banilor pentru dobândirea ogorului, „pentru” exprimă idiomatic valoarea lui εἰς fără a sugera că obiectele au fost aruncate fizic în ogor.
- source_word: τοῦ κεραμέως
  choice: olarului
  rationale: Genitivul posesiv este redat natural prin „ogorul olarului”.
- source_word: καθὰ
  choice: așa cum
  rationale: Păstrează raportul de corespondență și sună firesc în româna actuală.
- source_word: συνέταξέν
  choice: poruncise
  rationale: συντάσσω exprimă aici o dispoziție autoritativă; mai-mult-ca-perfectul românesc redă natural anterioritatea față de acțiunea principală.
- source_word: μοι
  choice: îmi
  rationale: Păstrează explicit persoana întâi și raportul datival al textului grec.
- source_word: κύριος
  choice: Domnul
  rationale: Echivalentul consacrat și adecvat contextual pentru κύριος; în română forma articulată este exprimată lexical prin „Domnul”.
theological_decisions:
- issue: Referința la vorbitor în citatul/aluzia profetică
  choice: Se păstrează persoana întâi „îmi”, exact ca în greacă.
  alternative: Adaptarea formulării la contextul narativ sau la textul veterotestamentar avut în vedere.
  rationale: Textul grec are μοι; păstrarea lui evită armonizarea și menține tensiunea autentică a modului în care Matei formulează citatul/aluzia.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Ogor” este preferat lui „câmp” deoarece denumește natural o parcelă de pământ și se potrivește contextului achiziției. Marcajul notei este plasat după propoziția la care se referă.
