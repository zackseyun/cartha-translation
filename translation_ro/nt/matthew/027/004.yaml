  text: λέγων· Ἥμαρτον παραδοὺς αἷμα ⸀ἀθῷον. οἱ δὲ εἶπαν· Τί πρὸς ἡμᾶς; σὺ ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/004.yaml
  text: saying, “I have sinned by betraying innocent blood.” But they said, “What is that to us? You will see to it.”
translation:
  language: ro
  text: 'spunând: „Am păcătuit, dând pe mâna altora sânge nevinovat.” Dar ei au zis: „Ce ne pasă nouă? Tu vezi de asta[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, păstrând mai îndeaproape forma de viitor: „Tu vei vedea.” Expresia este o respingere idiomatică: „ocupă-te tu de asta”; responsabilitatea este a ta.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἥμαρτον
  choice: Am păcătuit
  rationale: Perfectul compus exprimă firesc în româna actuală mărturisirea unei fapte trecute a cărei vinovăție este recunoscută în prezent.
- source_word: παραδοὺς
  choice: trădând
  rationale: Participiul aorist explică fapta prin care a păcătuit Iuda; „trădând” redă sensul contextual mai limpede decât literalul „dând pe mâna”.
- source_word: αἷμα ἀθῷον
  choice: sânge nevinovat
  rationale: Păstrează expresia biblică densă și referentul implicit, fără a adăuga „al unui om” sau numele lui Isus.
- source_word: Τί πρὸς ἡμᾶς;
  choice: Ce ne privește pe noi?
  rationale: Redă idiomatic și concis refuzul lor de a-și asuma răspunderea.
- source_word: σὺ ὄψῃ
  choice: Tu vei vedea
  rationale: Păstrează viitorul grecesc și pronumele accentuat, iar nota explică valoarea idiomatică, apropiată de un ordin disprețuitor.
theological_decisions:
- issue: Dacă referentul expresiei „sânge nevinovat” trebuie explicitat
  choice: Referentul rămâne implicit.
  alternative: „sângele unui om nevinovat” sau menționarea explicită a lui Isus
  rationale: Greaca nu numește aici persoana; formularea păstrează atât expresia juridico-morală biblică, cât și concizia sursei.
- issue: Forța lui σὺ ὄψῃ
  choice: Forma de viitor este păstrată în text, cu sensul idiomatic explicat în notă.
  alternative: „Vezi tu de asta!”
  rationale: Viitorul poate funcționa aici ca o respingere imperativă. Textul principal conservă forma, iar nota păstrează tensiunea dintre formă și funcție.
translation_notes:
  register: Română standard modernă, solemnă fără arhaisme. „Ce ne privește pe noi?” este o formulare firească și tăioasă; „Tu vei vedea” conservă deliberat forma viitorului și ambiguitatea ei idiomatică.
