    issue: Replica «Tu vei vedea» este nefiresc de eliptică și nu redă clar valoarea idiomatică a lui σὺ ὄψῃ.
    rationale: 'În context, expresia este o respingere: autoritățile refuză să preia responsabilitatea și îi spun lui Iuda să se ocupe el. Viitorul literal românesc, fără complement, nu transmite aceasta.'
  - severity: medium
    issue: «trădând sânge nevinovat» este o colocare nefirească în română.
    rationale: Deși greaca poate lega παραδοὺς direct de αἷμα ἀθῷον, româna nu folosește în mod normal «a trăda sânge». «Dând pe mâna altora sânge nevinovat» păstrează expresia «sânge nevinovat» și sensul de predare, fără a numi referentul.
  - severity: low
    issue: Nota a introduce «pe mâna lor», iar «după ce» nu este necesar ca alternativă a participiului.
    rationale: Textul grec nu precizează prin pronume destinatarii predării în această propoziție. Nota este eliminată, deoarece textul revizuit exprimă deja clar sensul participiului.
