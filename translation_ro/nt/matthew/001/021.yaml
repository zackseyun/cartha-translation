  source_fidelity: 'Textul redă corect viitorul nașterii, porunca de a-i da numele Isus, relația explicativă introdusă de γάρ și sensul lui σώσει. Este însă necesară corectarea posesivului final: αὐτῶν se referă la membrii poporului („păcatele lor”), nu la „poporul” ca substantiv colectiv formulat la singular.'
  naturalness: „Ea va naște un fiu și îi vei pune numele Isus” este română standard, firească și potrivită registrului. „El” exprimat explicit redă bine reliefarea lui αὐτός într-o limbă care admite omiterea subiectului. „De păcatele lor” este atât idiomatic după „a salva”, cât și neambiguu.
  terminology: „Isus”, „a salva” și „poporul lui” sunt alegeri adecvate. Nota trebuie să evite echivalarea numelui divin cu „DOMNUL”, care poate sugera un titlu în locul elementului teoforic divin; „Iahve salvează” redă mai precis asocierea lexicală indicată de jocul de cuvinte.
