source:
  edition: SBLGNT
  text: τέξεται δὲ υἱὸν καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν, αὐτὸς γὰρ σώσει τὸν λαὸν αὐτοῦ ἀπὸ τῶν ἁμαρτιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/021.yaml
  text: She will bear a son[a], and you shall call his name Jesus, for he will save his people from their sins.
translation:
  language: ro
  text: Ea va naște un fiu și îi vei pune numele Isus[a], căci el își va salva poporul de păcatele lor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Numele Isus este forma grecească corespunzătoare numelui ebraic/aramaic Ieșua (Iosua), asociat cu ideea „Iahve salvează”; explicația lui Matei, „căci el va salva”, reflectă acest joc de cuvinte.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέξεται
  choice: va naște
  rationale: Viitorul verbului τίκτω, în contextul nașterii unui copil; formularea este firească în româna actuală și păstrează valoarea predictivă.
- source_word: δὲ
  choice: —
  rationale: Conector discursiv slab; nu este redat separat, deoarece în română enunțul curge natural fără „iar” sau „dar”.
- source_word: υἱὸν
  choice: un fiu
  rationale: Substantivul nearticulat este redat idiomatic prin „un fiu” în această vestire a nașterii.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: îi vei pune numele
  rationale: Redă firesc în română formula de numire, păstrând referirea explicită la nume și pregătind explicația etimologică următoare.
- source_word: Ἰησοῦν
  choice: Isus
  rationale: Forma consacrată în româna modernă pentru numele persoanei din Noul Testament; nota explică legătura cu ebraicul/aramaicul Ieșua.
- source_word: αὐτὸς
  choice: el
  rationale: Pronumele subiect exprimă limpede că Isus este agentul salvării. Româna, care poate omite subiectul, păstrează pronumele explicit și astfel reflectă suficient reliefarea din greacă, fără adaosul mai apăsat „el însuși”.
- source_word: γὰρ
  choice: căci
  rationale: Introduce motivul numirii; „căci” este concis, demn și potrivit registrului explicativ.
- source_word: σώσει
  choice: va salva
  rationale: Redă direct sensul lui σῴζω în construcția cu „de păcatele lui”; păstrează atât ideea izbăvirii, cât și rezonanța teologică.
- source_word: τὸν λαὸν αὐτοῦ
  choice: poporul lui
  rationale: Păstrează relația posesivă și posibilele rezonanțe de legământ fără a limita sau extinde explicit referentul.
- source_word: ἀπὸ τῶν ἁμαρτιῶν αὐτῶν
  choice: de păcatele lui
  rationale: Prepoziția „de” este firească după „a salva” și exprimă separarea de păcate. Pronumele posesiv singular se raportează colectiv la „poporul”, conform acordului natural în română.
theological_decisions:
- issue: Reliefarea subiectului αὐτός în lucrarea salvatoare a lui Isus
  choice: Pronumele explicit „el”
  alternative: „el însuși” sau omiterea pronumelui subiect
  rationale: Întrucât româna permite subiectul neexprimat, „el” redă reliefarea lui αὐτός și identifică limpede agentul salvării, fără a intensifica textul prin „însuși”.
- issue: Sfera expresiei „poporul lui”
  choice: Formularea rămâne nedefinită suplimentar
  alternative: „poporul lui Israel” sau „toți cei care îi aparțin”
  rationale: Contextul imediat are rezonanțe iudaice și de legământ, dar versetul nu precizează aici întinderea expresiei; traducerea păstrează această deschidere interpretativă.
- issue: Legătura dintre numele Isus și verbul „va salva”
  choice: Păstrarea explicației în text și clarificarea jocului de cuvinte în notă
  alternative: Introducerea sensului numelui direct în text
  rationale: Textul grecesc oferă explicația prin γὰρ σώσει, fără să traducă formal numele; nota face accesibilă asocierea lingvistică fără a extinde corpul versetului.
translation_notes:
  register: Română standard modernă, cu un ton demn și accesibil. „Îi vei pune numele” este idiomatic, iar „căci” păstrează caracterul explicativ al enunțului. Marcajul notei este așezat după numele „Isus”, elementul explicat de notă.
