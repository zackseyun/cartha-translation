  - severity: low
    issue: Formularea „DOMNUL salvează” în nota lexicală
    rationale: Nota explică elementul teoforic al numelui. „DOMNUL” este de regulă un titlu convențional românesc; „Iahve salvează” este mai exact pentru asocierea etimologică, fără a modifica textul versetului.
