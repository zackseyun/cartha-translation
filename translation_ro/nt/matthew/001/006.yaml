  text: Ἰεσσαὶ δὲ ἐγέννησεν τὸν Δαυὶδ τὸν βασιλέα. Δαυὶδ ⸀δὲ ἐγέννησεν τὸν Σολομῶνα ἐκ τῆς τοῦ Οὐρίου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/006.yaml
  text: Jesse fathered David the king[a]. David fathered Solomon by the wife of Uriah,
translation:
  language: ro
  text: Iese a fost tatăl lui David, regele. David a fost tatăl lui Solomon din soția lui Urie,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'În greacă, literal: „din [cea] a lui Urie”, expresie eliptică în care este subînțeles „femeia/soția”. Matei nu o numește aici pe Bat-Șeba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: l-a născut pe
  rationale: În context genealogic, verbul indică descendența pe linie paternă. Formula românească tradițională și încă inteligibilă „l-a născut pe” păstrează concizia și paralelismul genealogiei, fără arhaismul mai pronunțat al lui „a zămislit”.
- source_word: βασιλέα
  choice: regele
  rationale: Articolul și apoziția îl identifică în mod distinct pe David drept „regele”, evidențiindu-i statutul regal.
- source_word: ἐκ τῆς τοῦ Οὐρίου
  choice: cu soția lui Urie
  rationale: Expresia grecească este eliptică, literal „din cea a lui Urie”, cu „femeia/soția” subînțeles. Redarea este firească în română, păstrează relația maternă în genealogie și nu introduce numele Bat-Șeba, absent din text.
- source_word: Ἰεσσαὶ
  choice: Iese
  rationale: Forma consacrată în tradiția biblică românească pentru numele Ἰεσσαί.
- source_word: Δαυὶδ
  choice: David
  rationale: Forma românească standard a numelui.
- source_word: Σολομῶνα
  choice: Solomon
  rationale: Forma românească standard a numelui.
- source_word: Οὐρίου
  choice: Urie
  rationale: Forma consacrată în limba română pentru numele Οὐρίας.
- source_word: δέ
  choice: —
  rationale: Particula este un conector slab în șirul genealogic; omiterea ei produce o română mai naturală, iar succesiunea rămâne limpede.
theological_decisions:
- issue: Referirea indirectă a lui Matei la Bat-Șeba
  choice: Păstrarea expresiei indirecte „cu soția lui Urie”
  alternative: „cu Bat-Șeba” sau „cu cea care fusese soția lui Urie”
  rationale: Textul o identifică deliberat prin relația cu Urie. Traducerea nu îi introduce numele și păstrează rezonanța narativă și morală a relatării din 2 Samuel, fără a preciza mai mult decât greaca.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. S-a păstrat formula genealogică scurtă „l-a născut pe”, uzuală în traducerile biblice românești; punctuația și repetarea numelor urmează structura solemnă a genealogiei.
