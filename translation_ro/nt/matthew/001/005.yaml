source:
  edition: SBLGNT
  text: Σαλμὼν δὲ ἐγέννησεν τὸν ⸂Βόες ἐκ τῆς Ῥαχάβ, Βόες⸃ δὲ ἐγέννησεν τὸν ⸂Ἰωβὴδ ἐκ τῆς Ῥούθ, Ἰωβὴδ⸃ δὲ ἐγέννησεν τὸν Ἰεσσαί,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/005.yaml
  text: Salmon fathered Boaz by Rahab[a], and Boaz fathered Obed by Ruth, and Obed fathered Jesse,
translation:
  language: ro
  text: Salmon l-a avut ca fiu pe Boaz din Rahav, Boaz l-a avut ca fiu pe Obed din Rut, iar Obed l-a avut ca fiu pe Isai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγέννησεν
  choice: l-a avut ca fiu pe
  rationale: În formula genealogică, verbul indică descendența pe linie paternă. Redarea este firească în româna actuală, păstrează explicit raportul tată–fiu și evită forma învechită „a născut” folosită despre un bărbat.
- source_word: ἐκ
  choice: cu
  rationale: Construcția ἐκ + numele mamei indică aici proveniența maternă. În formula românească „l-a avut ca fiu ... cu Rahav/Rut”, „cu” exprimă natural și explicit maternitatea, fără a sugera că femeia ar fi doar un mijloc al acțiunii.
- source_word: δὲ
  choice: — / iar
  rationale: δέ este un conector slab, neadversativ. Prima apariție este redată natural prin juxtapunere cu virgulă, iar ultima prin „iar”, pentru cursivitatea enumerării genealogice.
- source_word: Σαλμὼν
  choice: Salmon
  rationale: Forma tradițională și recognoscibilă în uzul biblic românesc.
- source_word: Βόες
  choice: Boaz
  rationale: Este forma consacrată în română pentru personajul veterotestamentar și menține continuitatea dintre testamente.
- source_word: Ῥαχάβ
  choice: Rahav
  rationale: Forma românească biblică uzuală, care permite recunoașterea personajului din Vechiul Testament.
- source_word: Ἰωβὴδ
  choice: Obed
  rationale: Forma consacrată în română pentru numele veterotestamentar.
- source_word: Ῥούθ
  choice: Rut
  rationale: Forma tradițională românească a numelui și a titlului cărții biblice.
- source_word: Ἰεσσαί
  choice: Isai
  rationale: Forma consacrată în tradiția biblică românească pentru tatăl lui David.
theological_decisions:
- issue: Formula genealogică și menționarea mamelor
  choice: Păstrarea explicită atât a descendenței paterne, prin „l-a avut ca fiu pe”, cât și a referințelor materne, prin „cu Rahav” și „cu Rut”.
  alternative: „a născut pe ... din Rahav/Rut” sau simpla formulă „a fost tatăl lui”, fără integrarea explicită a mamelor.
  rationale: Textul grec scoate în evidență în mod neobișnuit mamele prin ἐκ + genitiv. Formularea aleasă păstrează această particularitate și linia paternă, fără limbaj arhaic ori nefiresc.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formula repetitivă proprie genealogiei este păstrată, dar exprimată idiomatic; numele urmează formele biblice românești consacrate.
