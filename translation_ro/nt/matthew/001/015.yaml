id: MAT.1.15
reference: Matthew 1:15
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἐλιοὺδ δὲ ἐγέννησεν τὸν Ἐλεάζαρ, Ἐλεάζαρ δὲ ἐγέννησεν τὸν Ματθάν, Ματθὰν δὲ ἐγέννησεν τὸν Ἰακώβ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/015.yaml
  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: ro
  text: Eliud a fost tatăl lui Eleazar, Eleazar a fost tatăl lui Matan, iar Matan a fost tatăl lui Iacov.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: Eliud
  rationale: Numele propriu este redat prin forma consacrată și transparentă în română.
- source_word: δὲ
  choice: iar / juxtapunere
  rationale: În șirul genealogic, particula marchează o legătură ușoară și continuarea enumerării. Primele propoziții sunt legate natural prin juxtapunere, iar ultima prin „iar”, evitând repetarea greoaie.
- source_word: ἐγέννησεν
  choice: a fost tatăl lui
  rationale: În context genealogic, verbul indică paternitatea sau descendența. Formula este firească în româna actuală și păstrează posibilitatea ca genealogia să fie exprimată fără a insista neapărat asupra unei filiații imediate.
- source_word: τὸν
  choice: neredat separat
  rationale: Articolul grecesc marchează complementul direct înaintea numelui propriu; în această construcție româna nu cere un corespondent lexical separat.
- source_word: Ἐλεάζαρ
  choice: Eleazar
  rationale: Este folosită forma biblică românească consacrată.
- source_word: Ματθάν
  choice: Matan
  rationale: Transliterare adaptată fonologiei și ortografiei românești, cu un singur „t”, deoarece dublarea consoanei nu este necesară în forma românească.
- source_word: Ἰακώβ
  choice: Iacov
  rationale: Este folosită forma biblică tradițională și curentă în limba română.
theological_decisions:
- issue: Întinderea semantică a lui ἐγέννησεν în genealogie
  choice: a fost tatăl lui
  alternative: l-a născut / l-a zămislit
  rationale: Alegerea exprimă relația genealogică masculină într-o română demnă și actuală, fără formularea arhaică „a născut pe” și fără a impune mai multă precizie biologică decât cere genul genealogic.
translation_notes:
  register: Română standard modernă, cu formulare clară și demnă. Ritmul repetitiv al genealogiei este păstrat, dar conectorii sunt redați idiomatic pentru a evita rigiditatea.
source_grounding:
  english_pob_role: consult_only
