  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: ro
  text: 'Nașterea lui Isus Mesia[a] a avut loc astfel: mama lui, Maria, fusese logodită cu Iosif[b]; înainte ca ei să se unească[c], s-a aflat că era însărcinată de la Duhul Sfânt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „Isus Cristos”. Titlul grecesc Χριστός este redat aici prin „Mesia” pentru a-i păstra sensul.
    reason: alternative_reading
  - marker: b
    text: „Logodită” se referă la un angajament formal, recunoscut juridic, mai obligatoriu decât logodna obișnuită din societatea modernă.
    reason: cultural_note
  - marker: c
    text: Expresia „înainte ca ei să se unească” poate implica faptul că unirea lor conjugală nu fusese încă desăvârșită prin relații sexuale.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένεσις
  choice: nașterea
  rationale: În context, termenul introduce relatarea venirii pe lume a lui Isus; „nașterea” este redarea românească firească, fără a restrânge nejustificat sensul la o idee abstractă de „origine”.
- source_word: Ἰησοῦ χριστοῦ
  choice: lui Isus Mesia
  rationale: Χριστός funcționează aici ca titlu și este redat prin echivalentul său semantic „Mesia”, nu ca un nume de familie.
- source_word: οὕτως ἦν
  choice: a avut loc astfel
  rationale: Expresia introduce felul în care s-a petrecut evenimentul; formularea este naturală și păstrează funcția explicativă.
- source_word: μνηστευθείσης
  choice: fusese logodită
  rationale: Participiul indică o logodnă formală, recunoscută juridic; mai-mult-ca-perfectul redă anterioritatea față de cele relatate în propoziția principală.
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: înainte ca ei să fie împreună
  rationale: Formularea păstrează eufemismul și o anumită deschidere semantică a grecei, care în context poate include consumarea unirii conjugale, fără a o explicita în corpul textului.
- source_word: εὑρέθη
  choice: s-a aflat
  rationale: Construcția impersonal-reflexivă românească păstrează ideea pasivă de constatare, fără a preciza cine a făcut descoperirea.
- source_word: ἐν γαστρὶ ἔχουσα
  choice: era însărcinată
  rationale: Este echivalentul idiomatic și actual în română al expresiei grecești „având în pântece”.
- source_word: ἐκ πνεύματος ἁγίου
  choice: de la Duhul Sfânt
  rationale: „De la” păstrează valoarea de sursă sau origine a prepoziției ἐκ; majusculele indică referirea contextuală la Duhul Sfânt.
theological_decisions:
- issue: Redarea lui Χριστός
  choice: Mesia
  alternative: Cristos
  rationale: În această introducere narativă, termenul are valoare de titlu. „Mesia” îi comunică sensul, în timp ce „Cristos” poate fi perceput de cititorul modern drept parte a numelui.
- issue: Referentul expresiei πνεύματος ἁγίου
  choice: Duhul Sfânt
  alternative: un duh sfânt
  rationale: Contextul narațiunii indică Duhul Sfânt divin; lipsa articolului în greacă nu impune un referent nedefinit.
- issue: Sensul expresiei συνελθεῖν αὐτούς
  choice: să fie împreună
  alternative: să aibă relații conjugale
  rationale: Textul păstrează formularea discretă și nu transformă implicația contextuală într-o explicitare mai îngustă decât expresia grecească.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea evită atât arhaismele („zămislire”, „având în pântece”), cât și explicitarea excesivă a eufemismului grec. Marcajele notelor au fost așezate lângă termenii pe care îi explică.
