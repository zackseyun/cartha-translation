id: MAT.1.2
reference: Matthew 1:2
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἀβραὰμ ἐγέννησεν τὸν Ἰσαάκ, Ἰσαὰκ δὲ ἐγέννησεν τὸν Ἰακώβ, Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/002.yaml
  text: Abraham fathered Isaac[a], and Isaac fathered Jacob, and Jacob fathered Judah and his brothers,
translation:
  language: ro
  text: Avraam l-a zămislit pe Isaac[a], Isaac l-a zămislit pe Iacov, iar Iacov l-a zămislit pe Iuda și pe frații lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau, mai formal, „a devenit tatăl lui”. Verbul grecesc este folosit aici în sens genealogic; poate fi redat și prin „a fost tatăl lui”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: a fost tatăl lui
  rationale: În context genealogic, verbul indică paternitatea sau descendența pe linie paternă. Formularea este clară și firească în româna actuală, fără conotația predominant maternă pe care ar avea-o redarea literală „a născut”.
- source_word: δὲ
  choice: iar
  rationale: Aici δέ este un conector slab, care continuă succesiunea genealogică, nu exprimă un contrast puternic. „Iar” redă natural progresia de la o generație la alta.
- source_word: Ἰούδαν
  choice: Iuda
  rationale: Este patriarhul Iuda, fiul lui Iacov; „Iuda” este forma românească biblică consacrată pentru acest nume.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: fraților lui
  rationale: Substantivul este masculin și se referă la ceilalți fii ai lui Iacov, deci „fraților” este precis contextual.
- source_word: Ἀβραάμ / Ἰσαάκ / Ἰακώβ
  choice: Avraam / Isaac / Iacov
  rationale: Sunt folosite formele românești biblice consacrate ale numelor proprii.
theological_decisions:
- issue: Redarea verbului genealogic γεννάω
  choice: a fost tatăl lui
  alternative: l-a născut; l-a avut ca fiu; a devenit tatăl lui
  rationale: Alegerea păstrează accentul genealogic patern și este inteligibilă în româna modernă. Nu adaugă afirmații teologice despre mecanismul descendenței și evită impresia că bărbatul ar fi dat naștere în sens biologic matern.
translation_notes:
  register: Română standard modernă, cu ton demn și cursiv. Repetiția formulei genealogice este păstrată, iar „iar” marchează natural trecerea la următoarea generație.
