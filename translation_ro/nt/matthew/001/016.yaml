  source_fidelity: 'Textul redă corect structura greacă: δέ ca o continuare ușoară a genealogiei, paternitatea lui Iacov față de Iosif, sensul marital al lui ἀνήρ și schimbarea intenționată la „din care S-a născut Isus”, unde relativul feminin se referă la Maria. Nu introduce afirmația că Iosif L-ar fi zămislit pe Isus.'
