  terminology: „Soțul Mariei” redă exact sensul contextual al lui ἀνήρ. „Mesia” redă justificat valoarea titulară a lui χριστός, iar nota oferă transparent alternativa tradițională „Hristos”. Majusculele reverențiale sunt convenționale în registrul biblic românesc și nu modifică sensul.
