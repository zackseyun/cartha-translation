id: MAT.1.16
reference: Matthew 1:16
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: ro
  text: Iar Iacov a fost tatăl lui Iosif, soțul Mariei, din care S-a născut Isus, Cel numit Mesia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Cel numit Hristos”.'
    reason: Redarea alternativă tradițională a titlului grecesc Χριστός.
lexical_decisions:
- source_word: δὲ
  choice: Iar
  rationale: Conectorul continuă ușor genealogia, fără a introduce un contrast puternic.
- source_word: ἐγέννησεν
  choice: a fost tatăl lui
  rationale: În formula genealogică, verbul indică paternitatea și descendența. Formularea este firească în româna actuală și evită sensul modern predominant al lui „a naște”, asociat mamei.
- source_word: τὸν ἄνδρα Μαρίας
  choice: soțul Mariei
  rationale: În construcție cu numele Mariei, ἀνήρ are limpede sensul marital de „soț”.
- source_word: ἐξ ἧς
  choice: din care
  rationale: Pronumele relativ feminin singular se referă exclusiv la Maria, iar prepoziția „din” păstrează valoarea lui ἐκ și schimbarea deliberată față de formula genealogică anterioară.
- source_word: ἐγεννήθη
  choice: S-a născut
  rationale: Pasivul marchează trecerea de la paternitatea lui Iosif la nașterea lui Isus din Maria; „S-a născut” este formularea românească naturală.
- source_word: ὁ λεγόμενος
  choice: Cel numit
  rationale: Redă direct expresia de identificare și leagă firesc numele Isus de titlul care urmează.
- source_word: χριστός
  choice: Mesia
  rationale: Aici χριστός funcționează ca titlu în formula „Cel numit...”, astfel încât traducerea semantică „Mesia” îi păstrează sensul, în loc să îl trateze ca pe un al doilea nume.
theological_decisions:
- issue: Redarea lui Χριστός într-o formulă de identificare cristologică
  choice: Mesia
  alternative: Hristos
  rationale: Construcția îl prezintă pe χριστός ca titlu. „Mesia” face transparentă funcția titlului, iar alternativa tradițională este consemnată în notă.
- issue: Schimbarea formulei genealogice la nașterea lui Isus
  choice: Iosif este prezentat ca fiul lui Iacov, iar Isus ca fiind născut din Maria
  alternative: O formulare uniformă care l-ar prezenta pe Iosif drept cel care L-a zămislit pe Isus
  rationale: Textul grec trece intenționat de la activul ἐγέννησεν la pasivul ἐγεννήθη și folosește relativul feminin ἐξ ἧς, referitor la Maria. Traducerea păstrează această diferență fără explicații doctrinare adăugate.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. „A fost tatăl lui” evită atât arhaismul „a zămislit”, cât și formularea nefiresc de biologică „l-a născut”. Majusculele reverențiale din „S-a” și „Cel” se potrivesc registrului biblic românesc, fără a modifica sensul sursei.
