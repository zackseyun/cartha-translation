source:
  edition: SBLGNT
  text: ⸀ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου ἐποίησεν ὡς προσέταξεν αὐτῷ ὁ ἄγγελος κυρίου καὶ παρέλαβεν τὴν γυναῖκα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: ro
  text: Atunci Iosif, trezindu-se din somn, a făcut cum îi poruncise îngerul Domnului și a luat-o la el pe soția sa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „a primit-o pe soția sa” ori „a luat-o pe soția sa”. Verbul grecesc poate avea sensul de a lua sau a primi pe cineva în propria casă.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: trezindu-se
  rationale: Participiul redă succesiunea acțiunilor și sensul intransitiv al verbului în contextul explicit al somnului.
- source_word: δὲ
  choice: Atunci
  rationale: Aici marchează înaintarea narațiunii, nu un contrast puternic.
- source_word: ἀπὸ τοῦ ὕπνου
  choice: din somn
  rationale: Este formularea românească firească pentru revenirea din starea de somn, fără a adăuga un posesiv absent din greacă.
- source_word: ἐποίησεν ὡς
  choice: a făcut cum
  rationale: Redă simplu și direct conformarea lui Iosif cu porunca primită.
- source_word: προσέταξεν
  choice: îi poruncise
  rationale: Verbul exprimă o dispoziție autoritară; mai-mult-ca-perfectul românesc clarifică natural faptul că porunca precedă împlinirea ei.
- source_word: ὁ ἄγγελος κυρίου
  choice: îngerul Domnului
  rationale: Păstrează formula biblică consacrată și raportul genitival din greacă.
- source_word: παρέλαβεν
  choice: și-a luat ... la el
  rationale: Redă sensul de a primi sau a lua pe cineva la sine, adecvat contextului marital, fără a preciza în textul principal toate implicațiile gospodărești posibile.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: soția
  rationale: În cadrul juridic și social al logodnei iudaice, γυνή are aici sens marital; pronumele reflexiv posesiv din construcția românească redă αὐτοῦ.
theological_decisions:
- issue: Redarea lui γυνή înainte de consumarea căsătoriei
  choice: soția
  alternative: femeia lui
  rationale: Contextul o prezintă deja pe Maria în cadrul juridic-marital, iar «soția» nu afirmă prin sine consumarea căsătoriei, pe care versetul următor o tratează separat.
- issue: Redarea lui κύριος în expresia ἄγγελος κυρίου
  choice: Domnului
  alternative: lui Iahve
  rationale: «Îngerul Domnului» păstrează idiomul biblic transparent al textului grec și nu introduce în text o retroversiune interpretativă a numelui divin.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Formularea evită arhaismele, păstrează succesiunea participială și explică prin notă amplitudinea semantică a lui παραλαμβάνω.
