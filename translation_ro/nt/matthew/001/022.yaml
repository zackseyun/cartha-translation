  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/022.yaml
  text: All this happened so that what was spoken by the Lord through the prophet might be fulfilled[a], saying,
translation:
  language: ro
  text: 'Toate acestea[a] s-au întâmplat ca să se împlinească ceea ce fusese rostit de Domnul prin profetul care spune:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, „acest lucru în întregime”. Formularea grecească prezintă evenimentele descrise mai înainte ca un singur întreg și le subliniază totalitatea.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Toate acestea
  rationale: Expresia privește evenimentele precedente ca pe un întreg și le subliniază totalitatea. Pluralul românesc este forma firească pentru această referire colectivă; forța discretă de tranziție a lui δέ este redată prin curgerea propoziției, fără un „acum” temporal absent din greacă.
- source_word: γέγονεν
  choice: s-au întâmplat
  rationale: Perfectul lui γίνομαι descrie producerea evenimentelor menționate; perfectul compus este firesc în narațiunea românească actuală.
- source_word: ἵνα πληρωθῇ
  choice: ca să se împlinească
  rationale: Păstrează construcția finală/consecutivă și diateza pasivă, fără a decide exclusiv între scop și rezultat.
- source_word: τὸ ῥηθὲν
  choice: ceea ce fusese spus
  rationale: Redă participiul pasiv substantivizat ca referire la mesajul profetic anterior; mai-mult-ca-perfectul exprimă natural anterioritatea față de evenimentele relatate.
- source_word: ὑπὸ κυρίου
  choice: de Domnul
  rationale: Construcția cu ὑπό îl indică pe Domnul drept autorul ultim al cuvântului, fără adăugarea termenului „Dumnezeu”, care nu apare aici.
- source_word: διὰ τοῦ προφήτου
  choice: prin profet
  rationale: Redă διά cu genitiv și păstrează rolul profetului ca intermediar al rostirii.
- source_word: λέγοντος
  choice: care a zis
  rationale: Participiul introduce citatul din versetul următor și se leagă natural de substantivul apropiat „profet”.
theological_decisions:
- issue: Autoritatea și mijlocirea rostirii profetice
  choice: „spus de Domnul prin profet”
  alternative: „spus de profet din partea Domnului”
  rationale: Formele grecești disting între Domnul ca autor al rostirii (ὑπό) și profet ca mijlocitor (διά). Traducerea păstrează această distincție fără a dezvolta o doctrină dincolo de afirmația textului.
- issue: Formula împlinirii
  choice: „ca să se împlinească”
  alternative: „astfel încât s-a împlinit”
  rationale: ἵνα cu conjunctivul poate cuprinde atât ideea de scop, cât și pe cea de rezultat. Formula aleasă păstrează tensiunea teleologică a textului și nu o reduce la simplă consecință narativă.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Profet” este preferat formei mai arhaice „proroc”, iar „a zis” introduce concis și firesc citatul care urmează.
