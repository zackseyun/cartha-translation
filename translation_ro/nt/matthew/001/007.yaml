id: MAT.1.7
reference: Matthew 1:7
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Σολομὼν δὲ ἐγέννησεν τὸν Ῥοβοάμ, Ῥοβοὰμ δὲ ἐγέννησεν τὸν Ἀβιά, Ἀβιὰ δὲ ἐγέννησεν τὸν ⸂Ἀσάφ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/007.yaml
  text: Solomon fathered Rehoboam[a], Rehoboam fathered Abijah, and Abijah fathered Asaph.
translation:
  language: ro
  text: Solomon a fost tatăl lui Roboam, Roboam a fost tatăl lui Abia, iar Abia a fost tatăl lui Asaf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Unele manuscrise au „Asa”, numele regelui lui Iuda menționat în 1 Regi 15 și 2 Cronici 14–16; textul grec urmat aici are „Asaf”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγέννησεν
  choice: a fost tatăl lui
  rationale: În contextul genealogiei, verbul indică paternitatea și descendența. Formularea este firească și clară în româna modernă, evitând atât arhaismul „a zămislit”, cât și posibila impresie creată de formula literală „a născut” că bărbatul ar fi dat naștere.
- source_word: δὲ
  choice: iar / legătură redată prin punctuație
  rationale: Aici particula este un conector slab care continuă șirul genealogic, nu unul adversativ. Repetarea ei este redată natural prin virgulă, iar în ultima secvență prin „iar”.
- source_word: Σολομών
  choice: Solomon
  rationale: Forma consacrată în română a numelui biblic.
- source_word: Ῥοβοάμ
  choice: Roboam
  rationale: Forma consacrată în română a numelui biblic.
- source_word: Ἀβιά
  choice: Abia
  rationale: Forma românească uzuală, păstrând continuitatea cu numele regal din Vechiul Testament.
- source_word: Ἀσάφ
  choice: Asaf
  rationale: Redă direct forma din textul grec tipărit, fără armonizare tacită cu numele regelui Asa.
theological_decisions:
- issue: Dacă numele Ἀσάφ trebuie armonizat cu lista regilor din Vechiul Testament prin traducerea „Asa”
  choice: Asaf în textul principal
  alternative: Asa
  rationale: Textul grec SBLGNT oferit are Ἀσάφ, astfel că lectura este păstrată în textul principal. Varianta „Asa”, care corespunde regelui lui Iuda din 1 Regi 15 și 2 Cronici 14–16, este consemnată în nota de subsol pentru transparență textuală.
translation_notes:
  register: Română standard modernă, clară și demnă. Formula genealogică „a fost tatăl lui” este accesibilă cititorului obișnuit și se repetă pentru a păstra structura ritmică a originalului.
