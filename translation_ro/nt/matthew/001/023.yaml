id: MAT.1.23
reference: Matthew 1:23
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθ’ ἡμῶν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: ro
  text: '„Iată, fecioara[a] va fi însărcinată și va naște un fiu, iar ei îi vor pune numele Emanuel[b]”, care, tradus, înseamnă: „Dumnezeu cu noi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Termenul grecesc poate desemna, în anumite contexte, și o „tânără”; aici însă relatarea conceperii și nașterii susține sensul „fecioară”.
    reason: lexical_alternative
  - marker: b
    text: 'În greacă, verbul este la plural: „ei vor numi”; subiectul rămâne neprecizat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Iată
  rationale: Păstrează rolul de semnal solemn care atrage atenția în cadrul citatului profetic și este firesc în registrul biblic românesc.
- source_word: ἡ παρθένος
  choice: fecioara
  rationale: În greaca lui Matei, termenul indică în mod obișnuit o fecioară, iar relatarea imediată despre conceperea lui Isus susține clar acest sens. Articolul hotărât din greacă este păstrat.
- source_word: ἐν γαστρὶ ἕξει
  choice: va rămâne însărcinată
  rationale: Redă idiomatic expresia grecească literală «va avea în pântece», păstrând sensul viitor și referirea la concepere.
- source_word: τέξεται υἱόν
  choice: va naște un fiu
  rationale: Formulare românească directă și naturală, fidelă acțiunii nașterii și obiectului ei.
- source_word: καλέσουσιν τὸ ὄνομα αὐτοῦ
  choice: ei îi vor pune numele
  rationale: Păstrează pluralul neprecizat al verbului grecesc, dar redă expresia într-o română actuală și firească.
- source_word: Ἐμμανουήλ
  choice: Emanuel
  rationale: Forma consacrată și ușor de recunoscut în română pentru numele redat de textul grecesc.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: care se traduce
  rationale: Redare clară și concisă a participiului explicativ, fără o construcție greoaie sau o completare interpretativă.
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: Dumnezeu este cu noi
  rationale: Exprimă natural în română sensul numelui, făcând explicit verbul copulativ subînțeles în greacă, fără dezvoltare doctrinară suplimentară.
theological_decisions:
- issue: Sensul lui παρθένος într-un pasaj central pentru conceperea feciorelnică
  choice: fecioara
  alternative: tânăra
  rationale: Sensul obișnuit al termenului grecesc și contextul imediat din Matei 1 susțin «fecioara». Alternativa lexicală mai largă este menționată în notă, fără a slăbi sensul cerut de contextul lui Matei.
- issue: Explicarea numelui Emanuel
  choice: Dumnezeu este cu noi
  alternative: Cu noi este Dumnezeu
  rationale: Formularea aleasă este românească și limpede, păstrând greutatea teologică a explicației date chiar de verset, fără a o extinde într-o parafrază despre întrupare.
- issue: Subiectul neprecizat al lui καλέσουσιν
  choice: ei îi vor pune numele
  alternative: i se va pune numele
  rationale: Este păstrat pluralul activ neprecizat din greacă, evitând transformarea lui tacită într-un pasiv.
translation_notes:
  register: Română literară modernă, demnă și accesibilă. «Iată» păstrează tonul profetic, iar celelalte formulări evită atât arhaismele, cât și parafraza doctrinară.
