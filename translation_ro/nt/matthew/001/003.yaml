    issue: Redarea lui ἐκ τῆς Θαμάρ prin „născuți din Tamar”
    rationale: Deși sensul genealogic este înțeles, participiul se referă la Pereț și Zerah și estompează ușor verbul activ ἐγέννησεν atribuit lui Iuda. „Iuda i-a avut pe ... cu Tamar” redă mai direct relația genealogică.
  - severity: low
    issue: Formularea notei despre „Ram”
    rationale: „Ram” nu este o transliterare a formei grecești Ἀράμ. Nota ar trebui să îl prezinte drept o formă întâlnită în alte tradiții sau traduceri, păstrând lectura greacă drept bază a textului principal.
  revised_text: Iuda i-a avut pe Pereț și pe Zerah cu Tamar; Pereț a fost tatăl lui Hețron, iar Hețron a fost tatăl lui Aram.[a]
