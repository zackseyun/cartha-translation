id: MAT.1.3
reference: Matthew 1:3
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: ro
  text: Iuda i-a avut pe Pereț și pe Zerah cu Tamar; Pereț a fost tatăl lui Hețron, iar Hețron a fost tatăl lui Aram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Unele traduceri au aici „Ram”, urmând o altă tradiție de redare a numelui; textul grec folosit aici are „Aram”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: Iuda
  rationale: În acest context genealogic, numele îl desemnează pe patriarhul Iuda; forma românească consacrată păstrează continuitatea cu Vechiul Testament și evită asocierea cu personajele numite de obicei Iudas.
- source_word: δὲ
  choice: punctuație și „iar”
  rationale: Particula are aici rolul unui conector slab în succesiunea genealogică, nu exprimă un contrast puternic. Punctul și virgula și „iar” redau firesc această progresie în română.
- source_word: ἐγέννησεν
  choice: a fost tatăl lui
  rationale: În genealogie, verbul indică paternitatea sau descendența pe linie masculină. Formula este exactă, actuală și demnă, fără caracterul arhaic ori potențial ambiguu al expresiei „a născut” aplicate unui bărbat.
- source_word: Φαρὲς
  choice: Pereț
  rationale: Forma corespunde numelui ebraic פֶּרֶץ și menține continuitatea cu forma modernă a numelui din Vechiul Testament.
- source_word: Ζάρα
  choice: Zerah
  rationale: Forma redă numele ebraic זֶרַח și păstrează continuitatea canonică, în locul transliterării strict grecești „Zara”.
- source_word: ἐκ τῆς Θαμάρ
  choice: născuți din Tamar
  rationale: Construcția indică originea maternă. Redarea românească este naturală și păstrează menționarea explicită și semnificativă a mamei.
- source_word: Θαμάρ
  choice: Tamar
  rationale: Forma românească uzuală a numelui biblic.
- source_word: Ἑσρώμ
  choice: Hețron
  rationale: Forma corespunde numelui ebraic חֶצְרוֹן și păstrează continuitatea cu numele veterotestamentar.
- source_word: Ἀράμ
  choice: Aram
  rationale: Textul grec SBLGNT are explicit Ἀράμ. Traducerea urmează forma din sursa greacă, fără armonizare tacită cu tradiția genealogică în care apare „Ram”.
theological_decisions:
- issue: Armonizarea ultimului nume cu forma întâlnită în alte genealogii biblice
  choice: Aram
  alternative: Ram
  rationale: Prioritatea acordată textului grec impune redarea formei Ἀράμ ca „Aram”. Varianta familiară „Ram” este menționată în notă, fără a înlocui lectura sursei.
translation_notes:
  register: Română standard modernă, cu formulare genealogică limpede și demnă. Repetiția „a fost tatăl lui” păstrează structura deliberat repetitivă a originalului. Numele sunt redate în forme care susțin continuitatea cu Vechiul Testament, iar nota este plasată după „Aram”, numele la care se referă.
