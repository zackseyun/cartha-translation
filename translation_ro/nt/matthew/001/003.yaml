  source_fidelity: Textul redă corect succesiunea genealogică, numele și lectura greacă Ἀράμ („Aram”). Totuși, „născuți din Tamar” descrie mai direct copiii decât actul exprimat de ἐγέννησεν și poate fi înlocuit cu o formulare care păstrează explicit paternitatea lui Iuda și originea maternă.
  naturalness: Formularea este în general clară și modernă. „Iuda a fost tatăl lui Pereț și al lui Zerah, născuți din Tamar” este inteligibilă, dar construcția participială este mai puțin suplă decât o formulare genealogică directă.
  terminology: Iuda, Pereț, Zerah, Tamar, Hețron și Aram sunt forme consecvente și potrivite pentru româna biblică modernă. Nota trebuie să precizeze că „Ram” este o formă/tradiție alternativă, nu o transliterare a grecescului Ἀράμ.
  issues:
