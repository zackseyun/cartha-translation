  text: Ἑζεκίας δὲ ἐγέννησεν τὸν Μανασσῆ, Μανασσῆς δὲ ἐγέννησεν τὸν ⸂Ἀμώς, Ἀμὼς⸃ δὲ ἐγέννησεν τὸν Ἰωσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/010.yaml
  text: Hezekiah fathered Manasseh[a], Manasseh fathered Amos, and Amos fathered Josiah.
translation:
  language: ro
  text: Ezechia a fost tatăl lui Manase, Manase a fost tatăl lui Amos[a], iar Amos a fost tatăl lui Iosia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Unele traduceri redau aici „Amon”, armonizând numele cu cel al regelui lui Iuda din 2 Regi 21; textul grec al lui Matei are „Amos”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγέννησεν
  choice: l-a născut pe
  rationale: În genealogia pe linie paternă, verbul γεννάω descrie faptul de a da naștere unui urmaș, cu tatăl ca subiect. Formula românească tradițională și încă inteligibilă „l-a născut pe” este concisă și păstrează repetiția structurii grecești; în acest context nu sugerează că bărbatul a purtat sarcina.
- source_word: Ἑζεκίας
  choice: Ezechia
  rationale: Se folosește forma biblică românească consacrată a numelui regelui iudeu.
- source_word: Μανασσῆς
  choice: Manase
  rationale: Se folosește forma biblică românească standard a numelui.
- source_word: Ἀμώς
  choice: Amos
  rationale: Textul SBLGNT are Ἀμώς, redat direct prin „Amos”, fără armonizare tacită cu numele „Amon” din istoria regilor lui Iuda.
- source_word: Ἰωσίας
  choice: Iosia
  rationale: Se folosește forma biblică românească standard a numelui.
- source_word: δέ
  choice: iar
  rationale: În șirul genealogic, δέ leagă și înaintează succesiunea. Primele două apariții sunt redate firesc prin juxtapunere și punctuație, iar ultima prin „iar”, evitând o succesiune greoaie de conjuncții.
theological_decisions:
- issue: Diferența dintre numele din textul grec al lui Matei și numele regelui din 2 Regi 21
  choice: „Amos” în textul principal
  alternative: „Amon”, prin armonizare cu numele regelui iudeu din 2 Regi 21
  rationale: Textul grec furnizat citește Ἀμώς, nu Ἀμών. Traducerea urmează această formă în textul principal și păstrează diferența față de relatarea din Regi, explicând-o în notă fără a o soluționa prin emendare.
translation_notes:
  register: Română literară modernă, demnă și accesibilă. Se păstrează ritmul repetitiv al genealogiei și formele românești consacrate ale numelor biblice. Nota este atașată lui „Amos”, locul exact al variantei discutate.
