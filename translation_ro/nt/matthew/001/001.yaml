  text: Βίβλος γενέσεως Ἰησοῦ χριστοῦ υἱοῦ Δαυὶδ υἱοῦ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/001.yaml
  text: The book of the genealogy of Jesus the Messiah[a], the son of David[b], the son of Abraham.
translation:
  language: ro
  text: Cartea genealogiei[a] lui Isus Mesia[b], fiul lui David, fiul lui Avraam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Cartea originii” ori „Cartea nașterii”. Cuvântul grecesc poate avea sensul mai larg de „origine”, deși „genealogiei” se potrivește cel mai bine cu lista de neamuri care urmează.'
    reason: alternative_reading
  - marker: b
    text: „Mesia” redă aici titlul grecesc Χριστός, redat tradițional și prin „Cristos”.
    reason: alternative_reading
lexical_decisions:
- source_word: Βίβλος
  choice: Cartea
  rationale: Substantivul poate desemna o carte, un sul sau o consemnare scrisă. În această formulare de titlu, „Cartea” păstrează registrul solemn și corespunde firesc construcției grecești.
- source_word: γενέσεως
  choice: genealogiei
  rationale: Termenul poate însemna genealogie, origine sau naștere. Lista de neamuri care urmează favorizează aici „genealogiei”, fără a exclude rezonanța mai largă de origine, indicată în nota de subsol.
- source_word: Ἰησοῦ
  choice: Isus
  rationale: Este forma standard modernă în limba română pentru numele propriu Ἰησοῦς.
- source_word: χριστοῦ
  choice: Mesia
  rationale: Χριστός funcționează aici ca titlu și înseamnă „Unsul”; „Mesia” păstrează contextul iudaic, regal și mesianic al afirmației.
- source_word: υἱοῦ Δαυὶδ
  choice: fiul lui David
  rationale: Formularea literală păstrează atât idiomul genealogic, în care „fiu” poate însemna urmaș, cât și forța titlului mesianic „fiul lui David”.
- source_word: υἱοῦ Ἀβραάμ
  choice: fiul lui Avraam
  rationale: „Fiul” păstrează idiomul genealogic și legătura legământală cu Avraam, deși sensul contextual este acela de descendent.
theological_decisions:
- issue: Redarea lui Χριστός
  choice: Mesia
  alternative: Cristos
  rationale: În acest vers, termenul îl prezintă pe Isus prin titlul său mesianic, nu ca printr-un nume de familie. „Mesia” exprimă transparent această funcție; forma tradițională „Cristos” este menționată în notă.
- issue: Sensul lui γενέσεως în titlu
  choice: genealogiei
  alternative: originii sau nașterii
  rationale: Contextul imediat este o genealogie, dar aria semantică a termenului grec permite și o trimitere la origine ori naștere. Nota păstrează această ambiguitate posibil intenționată.
translation_notes:
  register: Română standard modernă, cu registru demn și formulare concisă de titlu. S-a păstrat idiomul biblic „fiul lui”, inteligibil aici în sens genealogic și mesianic.
