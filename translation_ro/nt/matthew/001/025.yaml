  text: καὶ οὐκ ἐγίνωσκεν αὐτὴν ἕως οὗ ἔτεκεν ⸀υἱόν· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
translation:
  language: ro
  text: Și nu a avut relații conjugale cu ea[a] până când ea a născut un fiu[b], iar el i-a pus numele Isus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, „nu o cunoștea”. În acest context, verbul grec „a cunoaște” este un eufemism pentru relații sexuale.
    reason: lexical_alternative
  - marker: b
    text: Expresia „până când” arată ce a fost adevărat până la nașterea lui Isus; prin ea însăși, nu stabilește ce s-a întâmplat după aceea.
    reason: alternative_reading
  - marker: c
    text: 'Literal, după expresia grecească: „i-a chemat numele Isus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: nu a avut relații conjugale
  rationale: În acest context, γινώσκω („a cunoaște”) este un eufemism pentru relații sexuale. Redarea explicită este firească și neechivocă în româna modernă, în timp ce formularea literală „nu a cunoscut-o” poate fi înțeleasă greșit ca lipsă de familiaritate.
- source_word: ἕως οὗ
  choice: până când
  rationale: Redare temporală standard, care indică situația existentă până la naștere fără să stabilească prin ea însăși ce s-a întâmplat după aceea.
- source_word: ἔτεκεν
  choice: a născut
  rationale: Echivalentul românesc actual și natural al verbului τίκτω.
- source_word: υἱόν
  choice: un fiu
  rationale: Substantivul grecesc este nearticulat și se redă firesc printr-o construcție nehotărâtă, fără a introduce un accent absent din text.
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν
  choice: i-a pus numele Isus
  rationale: Formulare idiomatică românească ce exprimă exact actul numirii, evitând calchierea rigidă „a chemat numele lui”.
- source_word: Ἰησοῦν
  choice: Isus
  rationale: Forma consacrată în româna modernă pentru numele personal din Noul Testament.
theological_decisions:
- issue: Implicația expresiei „până când” pentru relația ulterioară dintre Maria și Iosif
  choice: Expresia ἕως οὗ este redată simplu prin „până când”, fără a afirma ce s-a întâmplat ulterior.
  alternative: Unii cititori deduc că după naștere au început relațiile conjugale; alții consideră că expresia nu implică nicio schimbare ulterioară.
  rationale: Construcția grecească precizează ce era adevărat până la nașterea lui Isus, dar nu soluționează singură întrebarea despre perioada următoare. Nota păstrează această tensiune fără a impune o concluzie confesională.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Eufemismul grec a fost redat explicit pentru claritate, iar expresia semitizantă despre numire a fost formulată idiomatic. Marcajele notelor apar în text și sunt așezate lângă expresiile pe care le explică.
