id: MAT.1.17
reference: Matthew 1:17
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: ro
  text: Așadar, de la Avraam până la David au fost în total paisprezece generații; de la David până la deportarea în Babilon, paisprezece generații; iar de la deportarea în Babilon până la Mesia[a], paisprezece generații.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Cristos”. Termenul grecesc χριστός este un titlu care înseamnă „Unsul”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: Așadar, toate generațiile
  rationale: „Așadar” redă valoarea rezumativ-inferențială a lui οὖν, iar „toate generațiile” păstrează explicit Πᾶσαι și sensul genealogic al lui γενεαί.
- source_word: ἀπὸ ... ἕως
  choice: de la ... până la
  rationale: Formula românească redă firesc și exact limitele celor trei intervale genealogice.
- source_word: μετοικεσίας Βαβυλῶνος
  choice: deportarea în Babilon
  rationale: μετοικεσία desemnează mutarea forțată sau deportarea; formularea este clară în româna actuală și păstrează direcția către Babilon.
- source_word: τοῦ χριστοῦ
  choice: Mesia
  rationale: În punctul culminant al genealogiei, χριστός funcționează ca titlu; „Mesia” îi exprimă sensul, fără a-l trata doar ca nume propriu.
- source_word: γενεαὶ δεκατέσσαρες
  choice: paisprezece generații
  rationale: Sintagma repetată este păstrată în toate cele trei segmente, menținând structura numerică și retorică a textului grec.
theological_decisions:
- issue: Redarea titlului Χριστός
  choice: Mesia
  alternative: Cristos
  rationale: Articolul și poziția culminantă în genealogie susțin aici sensul titular. Nota păstrează la vedere redarea tradițională alternativă.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Punctuația cu punct și virgulă scoate în evidență cele trei perioade paralele, iar elipsa verbului din ultimele două segmente urmează concizia textului grec.
