id: MAT.1.9
reference: Matthew 1:9
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ὀζίας δὲ ἐγέννησεν τὸν Ἰωαθάμ, Ἰωαθὰμ δὲ ἐγέννησεν τὸν Ἀχάζ, Ἀχὰζ δὲ ἐγέννησεν τὸν Ἑζεκίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/009.yaml
  text: Uzziah fathered Jotham[a], and Jotham fathered Ahaz, and Ahaz fathered Hezekiah,
translation:
  language: ro
  text: Ozia a fost tatăl lui Iotam[a], Iotam a fost tatăl lui Ahaz, iar Ahaz a fost tatăl lui Ezechia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Verbul grec ἐγέννησεν este redat tradițional prin „a născut”; aici, „a fost tatăl lui” exprimă aceeași relație genealogică într-o română actuală și clară.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀζίας
  choice: Ozia
  rationale: Forma consacrată în uzul biblic românesc pentru regele iudeu la care se referă numele grec.
- source_word: δὲ
  choice: iar
  rationale: În șirul genealogic, δέ este un conector slab care continuă enumerarea; „iar” redă firesc succesiunea și evită repetarea greoaie a lui „și”.
- source_word: ἐγέννησεν
  choice: a fost tatăl lui
  rationale: În această genealogie, verbul indică descendența pe linie paternă. Formula este clară și actuală în română, păstrând totodată structura repetitivă a textului, fără caracterul arhaic sau potențial derutant al expresiei „a născut” folosite despre un bărbat.
- source_word: Ἰωαθάμ
  choice: Ioatam
  rationale: Transliterare apropiată de forma greacă și consacrată în tradiția biblică românească pentru acest rege al lui Iuda.
- source_word: Ἀχάζ
  choice: Ahaz
  rationale: Forma biblică românească uzuală, corespunzătoare numelui regelui iudeu.
- source_word: Ἑζεκίαν
  choice: Ezechia
  rationale: Forma consacrată în uzul biblic românesc pentru regele lui Iuda desemnat de numele grec.
theological_decisions:
- issue: Forța genealogică a verbului γεννάω
  choice: 'Formula este redată ca succesiune paternă directă: „a fost tatăl lui”.'
  alternative: „a fost strămoșul lui”
  rationale: Genealogia lui Matei folosește o formulă stilizată și repetitivă. Deși genealogiile biblice pot omite uneori generații, versetul prezintă aici succesiunea în termeni paterni direcți; traducerea nu extinde interpretativ sensul la „strămoș”.
translation_notes:
  register: Română standard modernă, clară și demnă. Repetiția formulei genealogice este păstrată intenționat, iar „iar” marchează natural înaintarea șirului.
