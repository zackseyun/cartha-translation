  text: Ἰωσίας δὲ ἐγέννησεν τὸν Ἰεχονίαν καὶ τοὺς ἀδελφοὺς αὐτοῦ ἐπὶ τῆς μετοικεσίας Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/011.yaml
  text: Josiah fathered Jeconiah and his brothers at the time of the deportation to Babylon[a].
translation:
  language: ro
  text: Iosia a fost tatăl lui Ieconia și al fraților lui pe vremea deportării în Babilon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „în timpul exilului în Babilon”. Termenul grecesc poate desemna strămutarea forțată ori exilul; „deportare” evidențiază caracterul coercitiv al evenimentului.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: l-a născut
  rationale: În formula genealogică, verbul indică descendența pe linie paternă. Construcția românească tradițională și concisă „l-a născut” păstrează formula repetitivă a genealogiei fără a impune în fiecare caz ideea unei succesiuni biologice nemijlocite.
- source_word: Ἰεχονίαν
  choice: Ieconia
  rationale: Forma „Ieconia” urmează convenția românească biblică recognoscibilă pentru numele grec Ἰεχονίας.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: frații lui
  rationale: Greaca folosește masculinul plural și se referă aici la rude de sex masculin; „frații lui” redă direct și firesc expresia.
- source_word: ἐπὶ τῆς μετοικεσίας Βαβυλῶνος
  choice: pe vremea deportării în Babilon
  rationale: μετοικεσία denumește strămutarea forțată, iar „deportare” îi păstrează caracterul coercitiv. „Pe vremea” redă valoarea temporală a lui ἐπί cu genitivul, iar „în Babilon” exprimă destinația.
- source_word: δὲ
  choice: '[neredat separat]'
  rationale: δέ este aici un conector slab în succesiunea genealogică; omiterea unui echivalent separat produce o frază românească naturală fără pierdere semantică.
theological_decisions:
- issue: Comprimarea genealogică în genealogia lui Matei
  choice: Formula genealogică este tradusă direct, fără armonizarea în text a dificultăților istorice.
  alternative: Redarea explicită prin „a fost strămoșul lui”, pentru a indica posibilitatea omiterii unor generații.
  rationale: γεννάω poate funcționa într-o genealogie care comprimă generații, însă textul trebuie să păstreze formularea și tensiunea sursei, fără să decidă în traducere dacă relația este în fiecare caz una paternă imediată.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. Formula „l-a născut” păstrează concizia și ritmul genealogiei; „pe vremea” este natural în româna curentă, fără a pierde valoarea temporală a expresiei grecești.
