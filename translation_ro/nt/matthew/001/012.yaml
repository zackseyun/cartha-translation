review_pass:
  verdict: revise
  source_fidelity: „După deportarea în Babilon” redă fidel valoarea temporală a lui Μετὰ și sensul de deportare/strămutare al lui μετοικεσία. Succesiunea genealogică și numele sunt păstrate. Totuși, „l-a născut pe” atribuit lui Ieconia nu este o formulare potrivită în româna standard modernă pentru un tată.
  naturalness: Textul este cursiv în ansamblu, dar „Ieconia l-a născut pe Șealtiel” sună neidiomatic și poate sugera că subiectul masculin a dat naștere. „A fost tatăl lui” este clar, modern și potrivit unei genealogii.
  terminology: „Deportarea” este o alegere bună pentru μετοικεσία. „Ieconia”, „Șealtiel” și „Zorobabel” sunt forme românești recognoscibile. Nota poate formula alternativa mai firesc ca „exilul în Babilon”, nu „exilarea în Babilon”.
  issues:
