    issue: „l-a născut pe” este folosit cu subiect masculin
    rationale: În româna standard modernă, „a naște” se aplică în mod normal mamei; aplicarea lui la Ieconia este arhaizantă și nenaturală. Formula genealogică trebuie redată printr-o expresie paternă clară.
  - severity: low
    issue: 'Alternativa din notă: „exilarea în Babilon”'
    rationale: Este inteligibilă, dar „exilul în Babilon” este formularea românească mai naturală pentru alternativa lexicală indicată de greacă și de pista de audit engleză.
  revised_text: După deportarea în Babilon[a], Ieconia a fost tatăl lui Șealtiel, iar Șealtiel a fost tatăl lui Zorobabel.
