id: MAT.1.12
reference: Matthew 1:12
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὴν μετοικεσίαν Βαβυλῶνος Ἰεχονίας ἐγέννησεν τὸν Σαλαθιήλ, Σαλαθιὴλ δὲ ἐγέννησεν τὸν Ζοροβαβέλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/012.yaml
  text: After the deportation to Babylon[a], Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.
translation:
  language: ro
  text: După deportarea în Babilon[a], Ieconia a fost tatăl lui Șealtiel, iar Șealtiel a fost tatăl lui Zorobabel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „exilul în Babilon”. Termenul grec se referă la strămutarea forțată a poporului în exilul babilonian.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: După
  rationale: μετά cu acuzativul indică succesiunea temporală, iar δέ este aici un conector slab, absorbit firesc în formularea românească.
- source_word: τὴν μετοικεσίαν Βαβυλῶνος
  choice: deportarea în Babilon
  rationale: μετοικεσία desemnează mutarea impusă a populației în exil; „deportarea” redă caracterul forțat, iar „în Babilon” indică destinația.
- source_word: Ἰεχονίας
  choice: Ieconia
  rationale: Forma românească biblică recognoscibilă păstrează identificarea numelui din tradiția veterotestamentară.
- source_word: ἐγέννησεν
  choice: l-a născut pe
  rationale: În formula genealogică, verbul românesc „a naște”, folosit tranzitiv despre tată, este consacrat și concis; exprimă descendența fără a impune în fiecare caz nemijlocirea biologică.
- source_word: Σαλαθιήλ
  choice: Șealtiel
  rationale: Forma românească apropiată de numele ebraic și recognoscibilă din uzul biblic.
- source_word: δὲ
  choice: iar
  rationale: Conectorul leagă două verigi succesive ale genealogiei; „iar” este natural și evită o opoziție nejustificată.
- source_word: Ζοροβαβέλ
  choice: Zorobabel
  rationale: Forma consacrată și ușor recognoscibilă în tradiția biblică românească.
theological_decisions:
- issue: Redarea lui γεννάω într-o genealogie
  choice: „l-a născut pe” ca formulă de descendență genealogică
  alternative: „a fost tatăl lui” / „a dat naștere lui”
  rationale: Formula păstrează succesiunea pe linie paternă și uzul genealogic, fără să afirme mai multă nemijlocire biologică decât permite convenția genealogiei.
translation_notes:
  register: Română standard modernă, cu ton demn și formulă genealogică biblică recognoscibilă. Numele proprii urmează forme românești uzuale; nota păstrează alternativa lexicală relevantă.
