  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: ro
  text: 'Dar, pe când se gândea la aceste lucruri, iată, un înger al Domnului i s-a arătat în vis și i-a zis: „Iosif, fiul lui David, nu te teme s-o iei la tine pe Maria, soția ta[a], căci ce a fost zămislit în ea este de la Duhul Sfânt.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „s-o iei pe Maria, soția ta”. Expresia grecească se referă aici la primirea ei în casă în cadrul căsătoriei.'
    reason: Alternativă lexicală care explică sensul marital și domestic al verbului παραλαμβάνω.
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: pe când se gândea
  rationale: Redă deliberarea interioară aflată în desfășurare, fără a o transforma într-o hotărâre deja luată.
- source_word: ἰδοὺ
  choice: iată
  rationale: Păstrează marcatorul discursiv care introduce viu și neașteptat apariția îngerului.
- source_word: ἄγγελος κυρίου
  choice: un înger al Domnului
  rationale: Lipsa articolului înainte de ἄγγελος susține forma nehotărâtă „un înger”, fără a impune identificarea cu formula veterotestamentară „Îngerul Domnului”.
- source_word: κατ’ ὄναρ
  choice: în vis
  rationale: Este echivalentul românesc firesc al expresiei grecești.
- source_word: ἐφάνη αὐτῷ
  choice: i s-a arătat
  rationale: Formulare narativă naturală pentru o apariție revelatoare.
- source_word: υἱὸς Δαυίδ
  choice: fiul lui David
  rationale: Păstrează referința genealogică și rezonanța davidică a adresării.
- source_word: μὴ φοβηθῇς
  choice: nu te teme
  rationale: Redare românească directă, actuală și demnă a interdicției.
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: s-o iei la tine pe Maria, soția ta
  rationale: „A lua la tine” exprimă primirea Mariei în casă în cadrul căsătoriei, iar apoziția „soția ta” păstrează explicit raportul deja formulat în greacă.
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: ce a fost zămislit în ea
  rationale: Păstrează forma neutră substantivată „ce” și exprimă natural conceperea prenatală fără a adăuga explicit „copilul”.
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: este de la Duhul Sfânt
  rationale: „De la” redă originea sau sursa indicată de ἐκ, iar „Duhul Sfânt” funcționează aici ca desemnare personală recunoscută.
theological_decisions:
- issue: Sensul lui κυρίου în ἄγγελος κυρίου
  choice: al Domnului
  alternative: al lui YHWH / Îngerul Domnului
  rationale: Redarea urmează sensul obișnuit al lui κύριος și nu transformă sintagma nearticulată într-o identificare teofanică mai precisă decât permite textul.
- issue: Referința expresiei πνεύματός ... ἁγίου
  choice: Duhul Sfânt
  alternative: un duh sfânt / puterea Duhului Sfânt
  rationale: În contextul narațiunii despre naștere, expresia indică sursa divină personală; nu este introdusă ideea suplimentară de „putere”.
- issue: Statutul Mariei în sintagma τὴν γυναῖκά σου
  choice: Maria, soția ta
  alternative: Maria ca soție
  rationale: Apoziția păstrează afirmația greacă potrivit căreia Maria este deja numită soția lui Iosif, evitând sugerarea unei schimbări de statut produse abia prin actul descris.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. „Iată” păstrează vivacitatea textului, iar „zămislit” este ușor elevat, dar curent în registrul biblic și precis în contextul prenatal.
