  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/014.yaml
  text: Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.
translation:
  language: ro
  text: Azor a fost tatăl lui Țadoc, Țadoc a fost tatăl lui Ahim, iar Ahim a fost tatăl lui Eliud.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: Azor
  rationale: Numele propriu este transliterat într-o formă firească și consacrată în română.
- source_word: δέ
  choice: iar
  rationale: În genealogie, particula are rol de legătură și continuare; „iar” redă natural ultima tranziție, în timp ce repetițiile anterioare sunt suficient marcate prin structura paralelă.
- source_word: ἐγέννησεν
  choice: l-a născut pe
  rationale: În formula genealogică, verbul indică faptul că bărbatul a fost tatăl sau strămoșul celui numit. Formula românească tradițională și concisă „l-a născut pe” păstrează expresia activă a grecei fără a impune că relația trebuie să fie în fiecare caz strict imediată.
- source_word: τὸν
  choice: l-… pe
  rationale: Articolul acuzativ grecesc nu se traduce separat înaintea numelor proprii; funcția sa de marcare a obiectului direct este redată idiomatic în română prin construcția „l-… pe”.
- source_word: Σαδώκ
  choice: Țadoc
  rationale: Formă românească biblică uzuală a numelui, adaptată fonologic și ortografic.
- source_word: Ἀχίμ
  choice: Ahim
  rationale: Transliterare firească în română, cu χ redat prin „h”.
- source_word: Ἐλιούδ
  choice: Eliud
  rationale: Transliterare firească și recognoscibilă în română.
theological_decisions:
- issue: Întinderea genealogică a verbului ἐγέννησεν
  choice: S-a păstrat formula genealogică „l-a născut pe”, fără adaos explicativ.
  alternative: „a fost tatăl lui” sau „a devenit strămoșul lui”
  rationale: Verbul poate descrie descendența genealogică fără să precizeze explicit dacă fiecare legătură este imediată. Traducerea păstrează formularea și tensiunea textului, fără a introduce o concluzie genealogică suplimentară.
translation_notes:
  register: Română standard modernă, cu ritm genealogic concis și demn. Numele sunt redate în forme biblice românești recognoscibile; nu sunt necesare note de subsol pentru acest verset.
