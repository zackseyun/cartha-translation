  text: Ἀρὰμ δὲ ἐγέννησεν τὸν Ἀμιναδάβ, Ἀμιναδὰβ δὲ ἐγέννησεν τὸν Ναασσών, Ναασσὼν δὲ ἐγέννησεν τὸν Σαλμών,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/004.yaml
  text: Aram fathered Amminadab[a], and Amminadab fathered Nahshon, and Nahshon fathered Salmon.
translation:
  language: ro
  text: Aram[a] a fost tatăl lui Aminadab, iar Aminadab a fost tatăl lui Naason, iar Naason a fost tatăl lui Salmon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „Ram”. Textul grecesc are „Aram” (Ἀρὰμ), în timp ce forma ebraică a numelui din genealogie este „Ram”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρὰμ
  choice: Aram
  rationale: Numele este transliterat direct după forma greacă Ἀράμ; forma alternativă „Ram”, cunoscută din genealogia ebraică, este păstrată în nota de subsol.
- source_word: δὲ
  choice: iar / conectare prin virgulă
  rationale: În această genealogie, δέ leagă și înaintează succesiunea, fără contrast puternic. Repetarea este redată firesc în română prin juxtapunere, iar la ultima verigă prin „iar”.
- source_word: ἐγέννησεν
  choice: a fost tatăl lui
  rationale: În context genealogic, verbul indică paternitatea sau descendența. Formularea este actuală și limpede, evitând atât arhaicul „a zămislit”, cât și exprimarea nefirească pentru un subiect masculin „a născut”.
- source_word: Ἀμιναδάβ
  choice: Aminadab
  rationale: Formă românească biblică recognoscibilă, apropiată de transliterarea numelui grecesc.
- source_word: Ναασσών
  choice: Naason
  rationale: Redare apropiată de forma greacă și consacrată în tradiția biblică românească.
- source_word: Σαλμών
  choice: Salmon
  rationale: Transliterare directă și formă biblică românească recognoscibilă.
theological_decisions: []
translation_notes:
  register: Română standard modernă, clară și demnă. Structura repetitivă a genealogiei este păstrată, dar conectivele sunt formulate firesc pentru cititorul contemporan.
