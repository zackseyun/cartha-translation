id: MAT.1.13
reference: Matthew 1:13
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/013.yaml
  text: Zerubbabel fathered Abiud[a], Abiud fathered Eliakim, and Eliakim fathered Azor.
translation:
  language: ro
  text: Zorobabel a fost tatăl lui Abiud[a], Abiud a fost tatăl lui Eliachim, iar Eliachim a fost tatăl lui Azor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „a devenit tatăl lui”; în genealogiile biblice, verbul repetat poate reda o linie de descendență în formă prescurtată.
    reason: alternativă lexicală și clarificarea caracterului posibil comprimat al genealogiei
lexical_decisions:
- source_word: Ζοροβαβέλ
  choice: Zorobabel
  rationale: Numele propriu este redat în forma consacrată în tradiția biblică românească modernă, apropiată de forma greacă.
- source_word: δέ
  choice: — / iar
  rationale: În această enumerare genealogică, particula are rol de legătură și de continuare, nu de contrast puternic. Repetarea ei nu este necesară în română; „iar” în ultima propoziție păstrează cursul cumulativ și natural.
- source_word: ἐγέννησεν
  choice: a fost tatăl lui
  rationale: Formula redă firesc în româna actuală relația genealogică exprimată de verbul γεννάω, evitând arhaicul „a născut pe” și păstrând posibilitatea unei genealogii comprimate, explicată în notă.
- source_word: Ἀβιούδ
  choice: Abiud
  rationale: Transliterare în forma biblică românească uzuală.
- source_word: Ἐλιακίμ
  choice: Eliachim
  rationale: Forma românească consacrată redă numele grecesc clar și natural.
- source_word: Ἀζώρ
  choice: Azor
  rationale: Transliterare simplă și lizibilă, conform uzului biblic românesc.
theological_decisions:
- issue: Redarea verbului genealogic γεννάω într-o genealogie care poate omite generații intermediare
  choice: a fost tatăl lui
  alternative: a fost strămoșul lui / l-a născut pe
  rationale: „A fost tatăl lui” păstrează formula genealogică directă și repetitivă fără a transforma explicit fiecare legătură într-una strict imediată. Varianta „a fost strămoșul lui” ar rezolva în mod nejustificat ambiguitatea, iar „l-a născut pe” este nefiresc și arhaizant pentru un subiect masculin în româna modernă.
translation_notes:
  register: Română standard modernă, cu ton demn și formulare accesibilă. Numele urmează formele biblice românești consacrate; repetiția structurii genealogice este păstrată, iar conectivul final „iar” asigură fluența.
