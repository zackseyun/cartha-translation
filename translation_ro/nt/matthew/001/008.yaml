id: MAT.1.8
reference: Matthew 1:8
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἀσὰφ⸃ δὲ ἐγέννησεν τὸν Ἰωσαφάτ, Ἰωσαφὰτ δὲ ἐγέννησεν τὸν Ἰωράμ, Ἰωρὰμ δὲ ἐγέννησεν τὸν Ὀζίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: ro
  text: Asaf[a] a fost tatăl lui Iosafat, Iosafat a fost tatăl lui Ioram, iar Ioram a fost tatăl lui Ozia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Unele manuscrise au „Asa” în loc de „Asaf”; „Asa” corespunde și numelui regelui lui Iuda din genealogia Vechiului Testament.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: Asaf
  rationale: Redă prin transliterare forma numelui din textul grec SBLGNT, fără armonizare tacită cu numele regelui Asa din genealogia Vechiului Testament.
- source_word: δὲ
  choice: ', / iar'
  rationale: În această genealogie, particula are rol de legătură ușoară, nu adversativă. Punctuația și „iar” redau firesc în română succesiunea celor trei enunțuri.
- source_word: ἐγέννησεν
  choice: a fost tatăl lui
  rationale: Exprimă clar și natural relația paternă genealogică. Evită caracterul arhaic și posibila impresie maternă pe care formularea literală „l-a născut” o poate produce în româna actuală.
- source_word: Ἰωσαφάτ
  choice: Iosafat
  rationale: Forma românească consacrată și ușor recognoscibilă a numelui regelui din Iuda.
- source_word: Ἰωράμ
  choice: Ioram
  rationale: Redă forma greacă scurtă și corespunde uzului românesc biblic.
- source_word: Ὀζίαν
  choice: Ozia
  rationale: Forma românească biblică recognoscibilă pentru regele din Iuda, preferabilă unei transliterări grecești mecanice.
theological_decisions:
- issue: Redarea succesiunii genealogice marcate prin repetarea lui δὲ și ἐγέννησεν
  choice: Păstrarea explicită a fiecărei legături tată–fiu, cu o formulare românească fluentă și cu „iar” înaintea ultimei propoziții.
  alternative: „Asaf l-a născut pe Iosafat, Iosafat l-a născut pe Ioram și Ioram l-a născut pe Ozia.”
  rationale: Alegerea este stilistică, nu doctrinară. Formularea păstrează integral ordinea genealogică, dar sună natural în româna modernă.
- issue: Dacă forma Ἀσὰφ trebuie armonizată în textul principal cu numele istoric Asa
  choice: Păstrarea formei „Asaf” în textul principal și menționarea formei „Asa” într-o notă.
  alternative: Folosirea formei „Asa” în textul principal, conform genealogiei din Vechiul Testament.
  rationale: Prioritatea textului-sursă cere redarea formei grecești atestate în ediția indicată. Nota păstrează transparent varianta manuscrisă și legătura cu genealogia vechi-testamentară, fără a corecta tacit textul principal.
translation_notes:
  register: Română standard modernă, clară și demnă. Numele urmează forme românești biblice recognoscibile, iar construcția „a fost tatăl lui” redă firesc relația genealogică paternă.
