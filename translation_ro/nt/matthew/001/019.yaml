id: MAT.1.19
reference: Matthew 1:19
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
translation:
  language: ro
  text: Iosif însă, soțul ei[a], fiind un om drept și nevrând s-o facă de rușine în public[b], a hotărât să divorțeze de ea în taină[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „logodnicul ei”. Textul grecesc spune literal „bărbatul/soțul ei”, reflectând caracterul obligatoriu juridic al logodnei iudaice.
    reason: lexical_alternative
  - marker: b
    text: Sau „s-o expună” ori „s-o dea de rușine”. Verbul grecesc poate avea sensul de a expune pe cineva ca exemplu, aducându-i rușine publică.
    reason: lexical_alternative
  - marker: c
    text: Sau „s-o trimită în ascuns”. În acest context, expresia se referă la desfacerea formală a logodnei prin divorț.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: soțul ei
  rationale: În acest context, ἀνήρ desemnează bărbatul aflat într-o relație conjugală recunoscută juridic. Logodna iudaică era obligatorie legal, iar ἀπολῦσαι arată că desfacerea ei necesita divorț. „Soțul ei” redă firesc această realitate, fără a ascunde etapa logodnei, precizată în nota de subsol.
- source_word: δίκαιος
  choice: un om drept
  rationale: „Drept” păstrează atât sensul moral, cât și rezonanța biblică a lui δίκαιος, fără a decide dacă accentul cade pe respectarea Legii, pe milă sau pe amândouă.
- source_word: δειγματίσαι
  choice: s-o facă de rușine în public
  rationale: Verbul indică expunerea unei persoane, cu rezultatul rușinării ei. Formularea românească este clară și redă dimensiunea publică implicată în context.
- source_word: ἐβουλήθη
  choice: a hotărât
  rationale: βούλομαι exprimă aici o intenție chibzuită sau o decizie. „A hotărât” este natural în narațiune și transmite caracterul deliberat al intenției.
- source_word: λάθρᾳ
  choice: în taină
  rationale: Adverbul desemnează o acțiune făcută fără expunere publică. „În taină” este o formulare românească firească și demnă, fără nuanța suspectă pe care o poate avea uneori „pe ascuns”.
- source_word: ἀπολῦσαι αὐτήν
  choice: să divorțeze de ea
  rationale: Deși ἀπολύω poate însemna literal „a trimite” sau „a lăsa să plece”, aici se referă la desfacerea formală a unei logodne obligatorii juridic. „Să divorțeze de ea” comunică limpede sensul legal cititorului modern.
- source_word: δὲ
  choice: însă
  rationale: δέ marchează o tranziție ușoară și un contrast narativ cu situația Mariei descrisă anterior. „Însă” redă această legătură în mod natural.
- source_word: ὢν καὶ μὴ θέλων
  choice: fiind ... și nevrând
  rationale: Construcția participială oferă fundalul hotărârii lui Iosif. Redarea păstrează structura și legătura dintre caracterul său drept și refuzul de a o rușina pe Maria.
theological_decisions:
- issue: Caracterizarea lui Iosif prin δίκαιος
  choice: „un om drept”, fără explicarea dreptății exclusiv ca strictețe juridică sau ca milă
  alternative: „un om just” ori o parafrază care ar pune accentul numai pe compasiune
  rationale: Textul leagă dreptatea lui Iosif de refuzul de a o expune pe Maria rușinii, dar nu definește mai precis raportul dintre respectarea Legii și îndurare. Traducerea păstrează această tensiune.
- issue: Statutul juridic al lui Iosif și al Mariei
  choice: „soțul ei” și „să divorțeze de ea” în textul principal
  alternative: „logodnicul ei” și „să rupă logodna” sau redarea literală „bărbatul ei” și „s-o trimită”
  rationale: Terminologia greacă și contextul logodnei iudaice indică o legătură recunoscută juridic, care necesita desfacere formală. Termenii aleși comunică această realitate, iar nota păstrează informația despre etapa logodnei.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. „În taină” evită rigiditatea juridică, iar „să divorțeze” clarifică efectul legal al acțiunii. Marcajele notelor sunt așezate imediat după expresiile pe care le explică.
