  text: καὶ πάντα ὅσα ⸀ἂν αἰτήσητε ἐν τῇ προσευχῇ πιστεύοντες λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/022.yaml
  text: And whatever you ask in prayer[a], believing[b], you will receive.
translation:
  language: ro
  text: Și orice[a] veți cere în rugăciune, crezând[b], veți primi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „tot ce veți cere” sau „toate lucrurile pe care le veți cere”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „având credință”; participiul grecesc exprimă faptul că credința însoțește rugăciunea.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: orice
  rationale: Îmbinarea are sens cuprinzător și nedefinit; „orice” este forma firească în română și păstrează sfera deschisă a expresiei grecești.
- source_word: ἂν αἰτήσητε
  choice: veți cere
  rationale: Construcția cu ἄν și conjunctivul aorist aparține propoziției relative nedefinite. Viitorul românesc se leagă firesc de „orice” și nu introduce o incertitudine absentă din sensul contextual.
- source_word: ἐν τῇ προσευχῇ
  choice: în rugăciune
  rationale: Redă direct și idiomatic sintagma prepozițională grecească, fără a transforma substantivul într-o propoziție temporală.
- source_word: πιστεύοντες
  choice: crezând
  rationale: Gerunziul păstrează valoarea participiului prezent și simultaneitatea credinței cu cererea, fără a formula o condiție explicită.
- source_word: λήμψεσθε
  choice: veți primi
  rationale: Este echivalentul românesc natural și demn al viitorului lui λαμβάνω; diateza medie nu cere aici o redare distinctă.
theological_decisions:
- issue: Relația dintre credință și ascultarea rugăciunii
  choice: „crezând”
  alternative: „dacă veți crede” / „cu condiția să credeți”
  rationale: Greaca folosește un participiu, nu o propoziție condițională explicită. Gerunziul păstrează legătura strânsă dintre rugăciune și credință fără a defini suplimentar mecanismul ori limitele promisiunii.
translation_notes:
  register: Română standard modernă, cu registru simplu și demn. Ordinea propoziției urmează îndeaproape greaca, dar rămâne naturală în română; formularea evită atât colocvialismele, cât și arhaismele.
