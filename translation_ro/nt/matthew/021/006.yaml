  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: πορευθέντες δὲ οἱ μαθηταὶ καὶ ποιήσαντες καθὼς ⸀συνέταξεν αὐτοῖς ὁ Ἰησοῦς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/006.yaml
  text: So the disciples went and did just as Jesus had instructed them[a].
translation:
  language: ro
  text: Ucenicii s-au dus și au făcut întocmai cum le poruncise Isus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „îi instruise”. Verbul grecesc poate desemna atât darea unei porunci, cât și a unor instrucțiuni.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθέντες
  choice: s-au dus
  rationale: Participiul aorist are valoare circumstanțială și precedă acțiunea următoare; coordonarea prin „s-au dus și au făcut” redă firesc succesiunea în narațiunea românească.
- source_word: δὲ
  choice: și
  rationale: Particula marchează continuarea narațiunii și legătura cu instrucțiunile precedente; în română, „și” păstrează curgerea firească fără a accentua excesiv consecința.
- source_word: οἱ μαθηταὶ
  choice: ucenicii
  rationale: „Ucenicii” este termenul românesc consacrat și contextual adecvat pentru cei care îl urmează pe Isus.
- source_word: ποιήσαντες
  choice: au făcut
  rationale: Al doilea participiu aorist este redat idiomatic printr-un verb coordonat, evitând construcția greoaie „după ce au făcut”.
- source_word: καθὼς
  choice: întocmai cum
  rationale: Expresia indică faptul că acțiunea ucenicilor corespunde indicației lui Isus; „întocmai cum” păstrează această nuanță clar și natural.
- source_word: συνέταξεν
  choice: le poruncise
  rationale: Aoristul lui συντάσσω poate desemna darea unei porunci sau a unor instrucțiuni. „Le poruncise” este concis, firesc și păstrează forța autoritativă a verbului, iar alternativa mai blândă este consemnată în notă.
- source_word: αὐτοῖς
  choice: le
  rationale: Pronumele la dativ este redat natural în română prin cliticul de dativ plural „le”.
- source_word: ὁ Ἰησοῦς
  choice: Isus
  rationale: Numele propriu cu articol este redat simplu, potrivit uzului românesc.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Construcția coordonată redă natural participiile grecești, iar nota păstrează deschisă nuanța lexicală a verbului συντάσσω.
