  text: ⸂προσελθὼν δὲ⸃ τῷ ⸀δευτέρῳ εἶπεν ὡσαύτως· ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Ἐγώ, κύριε· καὶ οὐκ⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/030.yaml
  text: Then he came to the second and said the same[a]. And he answered, ‘I will[b], sir,’ but he did not go.
translation:
  language: ro
  text: 'S-a apropiat apoi de al doilea și i-a spus același lucru[a]. Acesta i-a răspuns: „Mă voi duce[b], domnule[c]”, dar nu s-a dus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „i-a vorbit la fel”; sensul este că i-a adresat aceeași cerere.
    reason: lexical_alternative
  - marker: b
    text: 'Literal: „Eu”; un răspuns eliptic de acceptare, cu sensul „Mă voi duce” sau „Voi merge”.'
    reason: lexical_alternative
  - marker: c
    text: Grecescul κύριε poate fi redat și prin „Doamne” sau „stăpâne”; aici este o adresare respectuoasă către un tată omenesc.
    reason: alternative_reading
lexical_decisions:
- source_word: προσελθὼν
  choice: s-a dus la
  rationale: Participiul introduce apropierea tatălui de al doilea fiu; formularea este firească în narațiunea românească și păstrează mișcarea exprimată de verb.
- source_word: τῷ δευτέρῳ
  choice: la al doilea
  rationale: Greaca spune simplu „al doilea”; „fiu” rămâne implicit și este clar din context.
- source_word: ὡσαύτως
  choice: la fel
  rationale: Arată că tatăl i-a adresat celui de-al doilea aceeași cerere, într-o formulare românească scurtă și naturală.
- source_word: ἀποκριθεὶς εἶπεν
  choice: i-a răspuns
  rationale: Redă idiomatic formula grecească „răspunzând, a zis”, fără redundanță nenaturală în română.
- source_word: Ἐγώ
  choice: Mă duc
  rationale: Pronumele grecesc „eu” este un răspuns eliptic de acceptare; în română, „Mă duc” exprimă firesc verbul subînțeles, fără a pierde concizia.
- source_word: κύριε
  choice: domnule
  rationale: Vocativul exprimă aici respect față de tatăl omenesc, nu în mod necesar un titlu divin; „domnule” păstrează registrul respectuos.
- source_word: καὶ οὐκ ἀπῆλθεν
  choice: dar nu s-a dus
  rationale: Conjuncția adversativă românească scoate în evidență contrastul contextual dintre promisiune și faptă, deși greaca folosește literal „și”.
theological_decisions:
- issue: Redarea lui κύριε în adresarea către tată
  choice: domnule
  alternative: Doamne / stăpâne
  rationale: Contextul este o adresare respectuoasă către un tată omenesc. „Doamne” ar sugera în româna actuală o adresare divină, iar „stăpâne” ar introduce o relație de autoritate mai puternic marcată decât cere contextul.
- issue: Completarea răspunsului eliptic Ἐγώ
  choice: Mă duc
  alternative: Eu, domnule
  rationale: Textul grecesc păstrează elipsa „Eu”, dar sensul contextual este acceptarea poruncii. Verbul subînțeles este exprimat în text pentru claritate, iar forma literală este consemnată în notă pentru a păstra ambiguitatea formală a sursei.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Formularea evită atât arhaismul „stăpâne”, cât și conotația predominant divină a vocativului „Doamne” în acest context.
