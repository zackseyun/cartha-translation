review_pass:
  verdict: revise
  source_fidelity: 'Textul redă corect succesiunea narativă, «vremea roadelor», trimiterea slujitorilor și cultivatorii viei. Totuși, «ca să-i primească roadele» nu redă bine infinitivul λαβεῖν în acest context: slujitorii sunt trimiși să ia/preia roadele proprietarului, nu să le „primească” pentru el; formularea actuală este și sintactic ambiguă.'
  naturalness: «Dar, când s-a apropiat vremea roadelor» și «viticultori» sunt firești în româna standard modernă și se potrivesc registrului parabolei. «Ca să ia roadele lui» este mai limpede și mai idiomatic decât «ca să-i primească roadele».
  terminology: «Slujitorii» este o opțiune contextuală admisibilă pentru δούλους, cu alternativa «robii» păstrată în notă. «Viticultori» este justificat de contextul imediat al viei, deși γεωργοί are sensul de bază mai larg, «cultivatori/farmieri»; nota păstrează această informație. «Roade» redă potrivit καρποί în context agricol.
  issues:
  - severity: medium
    issue: Redarea lui λαβεῖν prin «să-i primească»
    rationale: λαμβάνειν în construcția «a trimis ... ca să ia roadele lui» exprimă obținerea/preluarea roadelor. «A primi» poate sugera că slujitorii le primesc de la proprietar sau că le primesc pentru acesta, iar cliticul «-i» nu exprimă limpede posesivul αὐτοῦ.
  revised_text: Dar, când s-a apropiat vremea roadelor, și-a trimis slujitorii[a] la viticultori[b] ca să ia roadele lui.
  revised_footnotes:
