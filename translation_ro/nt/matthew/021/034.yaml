    text: Sau „robii săi”. Termenul grec poate desemna atât robi, cât și slujitori; aici accentul cade pe rolul lor de trimiși ai proprietarului.
    reason: lexical_alternative
  - marker: b
    text: Sau „arendași”. Termenul grec desemnează cultivatori; în context, ei cultivau via altui proprietar.
    reason: lexical_alternative
