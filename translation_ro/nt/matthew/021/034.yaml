id: MAT.21.34
reference: Matthew 21:34
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὅτε δὲ ἤγγισεν ὁ καιρὸς τῶν καρπῶν, ἀπέστειλεν τοὺς δούλους αὐτοῦ πρὸς τοὺς γεωργοὺς λαβεῖν τοὺς καρποὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/034.yaml
  text: But when the season for the fruits had drawn near[b][a], he sent his servants to the tenant farmers to collect his fruits.
translation:
  language: ro
  text: Dar, când s-a apropiat vremea roadelor, și-a trimis slujitorii[a] la viticultori[b] ca să ia roadele lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „robii săi”. Termenul grec poate desemna atât robi, cât și slujitori; aici accentul cade pe rolul lor de trimiși ai proprietarului.
    reason: lexical_alternative
  - marker: b
    text: Sau „arendași”. Termenul grec desemnează cultivatori; în context, ei cultivau via altui proprietar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Dar, când
  rationale: ὅτε introduce propoziția temporală, iar δέ marchează o tranziție narativă ușor contrastivă; „Dar, când” le redă firesc pe amândouă.
- source_word: ἤγγισεν
  choice: s-a apropiat
  rationale: Aoristul lui ἐγγίζω indică apropierea momentului; perfectul compus este natural în narațiunea românească.
- source_word: ὁ καιρὸς τῶν καρπῶν
  choice: vremea roadelor
  rationale: καιρός desemnează timpul potrivit sau sezonul, iar formularea românească exprimă natural perioada în care proprietarul așteaptă rodul viei.
- source_word: τοὺς δούλους αὐτοῦ
  choice: slujitorii săi
  rationale: δοῦλος poate însemna „rob” sau „slujitor”; aici rolul lor de trimiși ai proprietarului este în prim-plan, fără a elimina alternativa lexicală.
- source_word: πρὸς τοὺς γεωργοὺς
  choice: la viticultori
  rationale: γεωργός înseamnă cultivator; contextul explicit al viei justifică „viticultori”, în timp ce statutul lor de arendași rămâne consemnat în notă.
- source_word: λαβεῖν
  choice: ca să-i primească
  rationale: λαμβάνω are sensul de a lua sau a primi; „să-i primească” păstrează sensul larg și evită să adauge explicit ideea unei datorii bănești.
- source_word: τοὺς καρποὺς αὐτοῦ
  choice: roadele sale
  rationale: Pluralul redă τοὺς καρπούς, iar posesivul păstrează αὐτοῦ și dreptul proprietarului asupra roadelor.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. „Vremea roadelor” păstrează imaginea agricolă, iar „viticultori” leagă termenul general de contextul viei.
