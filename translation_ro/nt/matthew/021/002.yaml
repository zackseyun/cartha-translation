  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· ⸀Πορεύεσθε εἰς τὴν κώμην τὴν ⸀κατέναντι ὑμῶν, καὶ ⸀εὐθέως εὑρήσετε ὄνον δεδεμένην καὶ πῶλον μετ’ αὐτῆς· λύσαντες ⸀ἀγάγετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/002.yaml
  text: saying to them[a], “Go into the village opposite you, and immediately you will find a donkey tied, and a colt with her[c][b]. Untie them and bring them to me.”
translation:
  language: ro
  text: 'spunându-le: „Mergeți în satul din fața voastră[a] și îndată veți găsi o măgăriță legată și un măgăruș cu ea. Dezlegați-i și aduceți-i la Mine.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „în satul de vizavi de voi”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literal: „dezlegându-i, aduceți-i la Mine”.'
    reason: source_form
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: spunându-le
  rationale: Păstrează participiul introductiv și legătura lui firească cu discursul direct.
- source_word: Πορεύεσθε
  choice: Mergeți
  rationale: Imperativul este redat prin forma curentă și demnă folosită pentru o poruncă de deplasare.
- source_word: κώμην
  choice: satul
  rationale: κώμη desemnează în mod obișnuit un sat, nu un oraș; articolul hotărât este firesc în română în această construcție.
- source_word: κατέναντι ὑμῶν
  choice: din fața voastră
  rationale: Redă sensul spațial al localității aflate în fața sau vizavi de ucenici, fără a preciza mai mult decât greaca.
- source_word: εὐθέως
  choice: îndată
  rationale: Păstrează caracterul imediat al acțiunii și se potrivește registrului narativ biblic actual.
- source_word: ὄνον δεδεμένην
  choice: o măgăriță legată
  rationale: Genul feminin al participiului arată că animalul este femelă; româna poate exprima natural această informație prin „măgăriță”.
- source_word: πῶλον μετ’ αὐτῆς
  choice: un măgăruș cu ea
  rationale: În context, πῶλος este puiul măgăriței. „Măgăruș” este mai explicit și mai natural în română decât termenul generic „mânz”.
- source_word: λύσαντες ἀγάγετέ μοι
  choice: Dezlegați-i și aduceți-i la Mine
  rationale: Participiul aorist urmat de imperativ exprimă o succesiune de acțiuni; două imperative coordonate redau idiomatic porunca în română. Pronumele plural se referă la ambele animale.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu ton narativ demn și clar. „Măgăriță” păstrează genul explicit din greacă, iar „măgăruș” clarifică specia puiului. Majuscula reverențială din „Mine” urmează uzul editorial românesc al proiectului, fără a modifica sensul textului-sursă.
