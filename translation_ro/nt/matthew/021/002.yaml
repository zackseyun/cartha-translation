  terminology: „Sat”, „măgăriță”, „măgăruș”, „dezlegați” și „aduceți” sunt alegeri clare și adecvate registrului. Majuscula reverențială din „Mine” ține de convenția editorială românească și nu schimbă sensul. Nota a păstrează alternativa spațială relevantă, iar nota b explică forma participială a originalului.
