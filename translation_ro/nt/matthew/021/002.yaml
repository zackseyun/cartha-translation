  source_fidelity: 'Textul redă fidel elementele principale ale grecei: participiul introductiv, imperativul de deplasare, satul aflat „în față/vizavi”, caracterul imediat al găsirii, măgărița legată, puiul împreună cu ea și succesiunea „dezlegați ... și aduceți ...”. „Măgăriță” exprimă în mod justificat femininul indicat de participiul δεδεμένην și de αὐτῆς. „Măgăruș” este potrivit contextual pentru πῶλον, fără a introduce o afirmație teologică sau istorică suplimentară.'
