  text: καὶ ἰδόντες οἱ μαθηταὶ ἐθαύμασαν λέγοντες· Πῶς παραχρῆμα ἐξηράνθη ἡ συκῆ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/020.yaml
  text: And when the disciples saw it[a], they marveled, saying, “How did the fig tree wither immediately?”
translation:
  language: ro
  text: 'Când au văzut aceasta, ucenicii s-au mirat și au zis: „Cum de s-a uscat smochinul îndată?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: Când au văzut
  rationale: Participiul aorist este redat temporal, în mod firesc în română. Greaca nu exprimă un complement direct, iar româna îl poate omite fără pierderea sensului contextual.
- source_word: ἐθαύμασαν
  choice: s-au mirat
  rationale: Redă natural uimirea exprimată de θαυμάζω, într-un registru demn și actual.
- source_word: λέγοντες
  choice: și au zis
  rationale: Participiul de vorbire este redat printr-un verb coordonat, formulare mai firească în româna narativă decât calchierea „zicând”.
- source_word: Πῶς
  choice: Cum de
  rationale: Introduce natural o întrebare marcată de surprindere, potrivită contextului, fără a adăuga o explicație cauzală.
- source_word: παραχρῆμα
  choice: îndată
  rationale: Păstrează direct sensul temporal de „imediat, pe loc” și registrul biblic demn, rămânând ușor de înțeles.
- source_word: ἐξηράνθη
  choice: s-a uscat
  rationale: Forma reflexivă redă firesc în română aoristul pasiv/intranzitiv contextual și descrie starea dobândită de pom fără a preciza agentul.
- source_word: ἡ συκῆ
  choice: smochinul
  rationale: Echivalentul românesc precis pentru arborele συκῆ; articolul hotărât este integrat morfologic.
theological_decisions: []
translation_notes:
  register: Română standard modernă, narativă și demnă. S-a evitat introducerea complementului „aceasta/acest lucru” după „au văzut”, deoarece originalul nu îl exprimă, iar româna permite construcția absolută. „Îndată” conservă forța temporală a lui παραχρῆμα.
