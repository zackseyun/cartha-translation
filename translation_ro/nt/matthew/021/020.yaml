  naturalness: '„Când au văzut ucenicii” este o inversiune nefiresc de eliptică în româna standard actuală: verbul „a vedea” reclamă în mod obișnuit un complement, iar plasarea subiectului după verb îngreunează lectura. „Când au văzut aceasta, ucenicii...” este fluent și păstrează referința contextuală la smochinul uscat.'
