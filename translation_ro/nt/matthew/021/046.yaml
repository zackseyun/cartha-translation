id: MAT.21.46
reference: Matthew 21:46
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ζητοῦντες αὐτὸν κρατῆσαι ἐφοβήθησαν τοὺς ὄχλους, ⸂ἐπεὶ εἰς⸃ προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/046.yaml
  text: And although they were seeking to arrest him[a], they feared the crowds, because they regarded him as a prophet.
translation:
  language: ro
  text: Deși căutau să-l aresteze, s-au temut de mulțimi, fiindcă mulțimile îl socoteau drept profet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „îl considerau un profet” ori „îl aveau drept profet”.'
    reason: Alternativă lexicală pentru construcția idiomatică εἰς προφήτην αὐτὸν εἶχον.
lexical_decisions:
- source_word: ζητοῦντες
  choice: deși căutau
  rationale: Participiul prezent exprimă o intenție în desfășurare; valoarea concesivă redă contrastul contextual dintre dorința de a-l prinde și teama care îi oprea.
- source_word: κρατῆσαι
  choice: să-l aresteze
  rationale: În contextul ostil, verbul se referă la prinderea și reținerea lui Isus, nu la o simplă atingere sau apucare; „să-l aresteze” exprimă firesc acțiunea intenționată.
- source_word: ἐφοβήθησαν
  choice: s-au temut
  rationale: Redare directă a aoristului, fără a impune o nuanță ingresivă care nu este necesară.
- source_word: τοὺς ὄχλους
  choice: de mulțimi
  rationale: Păstrează pluralul grecesc și desemnează grupurile de oameni adunate.
- source_word: ἐπεὶ εἰς
  choice: fiindcă
  rationale: Introduce limpede motivul temerii lor; construcția idiomatică următoare este redată separat.
- source_word: εἰς προφήτην αὐτὸν εἶχον
  choice: acestea îl socoteau drept profet
  rationale: Construcția idiomatică înseamnă că mulțimile îl considerau profet. Pronumele „acestea” clarifică în română că subiectul este „mulțimile”, nu conducătorii menționați implicit la începutul versetului.
- source_word: προφήτην
  choice: profet
  rationale: În construcția predicativă românească „a socoti drept profet”, substantivul fără articol este natural și păstrează încadrarea lui Isus în categoria profeților.
theological_decisions:
- issue: Redarea aprecierii mulțimilor despre Isus ca προφήτην fără a introduce sau a nega afirmații cristologice dincolo de verset
  choice: îl socoteau drept profet
  alternative: îl considerau un profet; îl aveau drept profet
  rationale: Formularea prezintă perspectiva mulțimilor, nu o definiție teologică exhaustivă a identității lui Isus; astfel, tensiunea narativă este păstrată fără a sugera că el era numai profet.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. „A socoti drept” este ușor elevat, dar curent și potrivit registrului biblic; „acestea” elimină o posibilă ambiguitate de subiect.
