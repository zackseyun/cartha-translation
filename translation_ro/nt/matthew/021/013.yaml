id: MAT.21.13
reference: Matthew 21:13
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Γέγραπται· Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται, ὑμεῖς δὲ αὐτὸν ⸀ποιεῖτε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/013.yaml
  text: And he says to them[a], “It is written[b], ‘My house will be called a house of prayer,’ but you are making it a den of robbers.”
translation:
  language: ro
  text: 'Și le spune: „Este scris[a]: «Casa Mea va fi numită casă de rugăciune», dar voi faceți din ea o peșteră de tâlhari[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isus îmbină aici Isaia 56:7 cu Ieremia 7:11.
    reason: cross_reference
  - marker: b
    text: Sau „bandiți”. Termenul grecesc poate însemna hoți sau bandiți violenți.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: le spune
  rationale: Păstrează prezentul istoric grecesc și vivacitatea narațiunii, într-o formulare românească firească.
- source_word: Γέγραπται
  choice: Este scris
  rationale: Redă formula scripturistică la perfect pasiv și caracterul durabil al celor scrise.
- source_word: Ὁ οἶκός μου
  choice: Casa Mea
  rationale: Păstrează sensul literal și denumirea scripturistică; „templul Meu” ar fi mai interpretativ și mai îngust.
- source_word: οἶκος προσευχῆς
  choice: casă de rugăciune
  rationale: Redare naturală a genitivului, care păstrează ecoul din Isaia 56:7.
- source_word: κληθήσεται
  choice: va fi numită
  rationale: Redă direct viitorul pasiv grecesc în româna contemporană.
- source_word: ποιεῖτε
  choice: faceți din ea
  rationale: Exprimă natural acțiunea prezentă prin care destinația casei este pervertită, fără a introduce explicit un verb precum „a transforma”.
- source_word: σπήλαιον
  choice: peșteră
  rationale: Păstrează imaginea concretă și formularea consacrată a aluziei la Ieremia 7:11; în context are sensul de ascunzătoare.
- source_word: λῃστῶν
  choice: tâlhari
  rationale: Termenul românesc poate desemna jefuitori violenți și păstrează forța acuzației profetice; alternativa „bandiți” rămâne posibilă.
theological_decisions:
- issue: Citarea și aluzia din Vechiul Testament
  choice: Formularea păstrează recognoscibile atât Isaia 56:7 («Casa Mea va fi numită casă de rugăciune»), cât și Ieremia 7:11 («peșteră de tâlhari»).
  alternative: O parafrază contemporană mai liberă, care ar estompa legăturile intertextuale.
  rationale: Afirmația lui Isus combină limbajul celor două texte profetice; păstrarea ecourilor lor face transparent temeiul scripturistic.
- issue: Sensul lui λῃστῶν
  choice: tâlhari
  alternative: bandiți
  rationale: „Tâlhari” este firesc în context și include ideea jafului violent, fără a restrânge termenul exclusiv la grupări insurgente.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Majuscula din „Casa Mea” marchează pronumele referitor la Dumnezeu conform unei convenții editoriale românești răspândite, fără a modifica sensul sursei. Marcajele notelor sunt plasate după verset deoarece nota [a] privește ansamblul citatelor, iar [b] explică ultimul termen.
