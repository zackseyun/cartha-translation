  text: καὶ καταλιπὼν αὐτοὺς ἐξῆλθεν ἔξω τῆς πόλεως εἰς Βηθανίαν, καὶ ηὐλίσθη ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/017.yaml
  text: And leaving them[a], he went out of the city to Bethany and stayed there overnight.
translation:
  language: ro
  text: Și, lăsându-i, a ieșit din cetate și s-a dus în Betania, unde a rămas peste noapte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλιπὼν
  choice: lăsându-i
  rationale: Participiul aorist indică o acțiune anterioară verbului principal; gerunziul românesc redă firesc succesiunea în context.
- source_word: αὐτοὺς
  choice: -i
  rationale: Pronumele îi desemnează direct pe interlocutorii menționați în context, fără precizări interpretative suplimentare.
- source_word: ἐξῆλθεν ἔξω τῆς πόλεως
  choice: a ieșit din cetate
  rationale: Redarea idiomatică păstrează ideea întărită de ieșire în afara cetății, evitând o redundanță nefirescă în română.
- source_word: πόλεως
  choice: cetate
  rationale: În context se referă la Ierusalim; „cetate” este o redare biblică demnă și încă inteligibilă, potrivită acestui oraș.
- source_word: εἰς Βηθανίαν
  choice: s-a dus în Betania
  rationale: Construcția direcțională este redată natural în română și face explicită deplasarea indicată de εἰς.
- source_word: ηὐλίσθη
  choice: a rămas peste noapte
  rationale: Verbul înseamnă a se găzdui sau a petrece noaptea; formularea aleasă este clară, modernă și păstrează nuanța temporală.
- source_word: ἐκεῖ
  choice: unde
  rationale: Adverbul locativ se referă la Betania; integrarea prin „unde” produce o frază românească fluentă fără a schimba referentul.
