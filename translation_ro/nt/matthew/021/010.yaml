id: MAT.21.10
reference: Matthew 21:10
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ εἰσελθόντος αὐτοῦ εἰς Ἱεροσόλυμα ἐσείσθη πᾶσα ἡ πόλις λέγουσα· Τίς ἐστιν οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/010.yaml
  text: And when he entered Jerusalem[a], the whole city was stirred up, saying, “Who is this?”
translation:
  language: ro
  text: 'Când a intrat în Ierusalim, întreaga cetate s-a tulburat[a], spunând: „Cine este acesta?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „s-a cutremurat”. Verbul grecesc poate descrie o zguduire fizică sau, ca aici, o puternică agitație publică.
    reason: alternativă lexicală
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: când a intrat
  rationale: Genitivul absolut este redat firesc printr-o propoziție temporală; pronumele subiect nu trebuie exprimat în română, fiind indicat de forma verbală și de context.
- source_word: Ἱεροσόλυμα
  choice: Ierusalim
  rationale: Forma consacrată în româna modernă pentru numele cetății.
- source_word: ἐσείσθη
  choice: s-a tulburat
  rationale: Verbul înseamnă literal „a scutura, a zgudui”, iar aici descrie figurat agitația colectivă provocată de intrarea lui Isus. „S-a tulburat” comunică limpede sensul contextual, iar nota păstrează metafora mai literală.
- source_word: πᾶσα ἡ πόλις
  choice: întreaga cetate
  rationale: Redare idiomatică a întregii comunități urbane; „cetate” se potrivește registrului narativ și contextului Ierusalimului.
- source_word: λέγουσα
  choice: spunând
  rationale: Păstrează participiul care se raportează gramatical la „cetate” și introduce direct întrebarea, fără a înlocui explicit actul vorbirii cu interpretativul „întrebând”.
- source_word: Τίς ἐστιν οὗτος;
  choice: Cine este acesta?
  rationale: Redare directă și firească; nu adaugă substantivul „om”, absent din greacă.
theological_decisions:
- issue: Forța literală sau figurată a reacției cetății
  choice: s-a tulburat
  alternative: s-a cutremurat / a fost zguduită
  rationale: Contextul indică agitația publică la intrarea lui Isus, nu afirmă explicit un cutremur fizic. Textul principal exprimă sensul contextual, iar nota semnalează imaginea puternică a verbului grec fără a elimina ambiguitatea lui lexicală.
translation_notes:
  register: Română standard modernă, clară și demnă. Sintaxa rămâne apropiată de succesiunea greacă, dar evită exprimările greoaie. Personificarea cetății din textul-sursă este păstrată.
