id: MAT.21.15
reference: Matthew 21:15
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὰ θαυμάσια ἃ ἐποίησεν καὶ τοὺς παῖδας ⸀τοὺς κράζοντας ἐν τῷ ἱερῷ καὶ λέγοντας· Ὡσαννὰ τῷ υἱῷ Δαυίδ ἠγανάκτησαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/015.yaml
  text: But when the chief priests and the scribes saw the wonderful things that he did[a], and the children crying out in the temple and saying[b], “Hosanna to the Son of David,” they were indignant.
translation:
  language: ro
  text: 'Dar, când preoții de seamă și cărturarii au văzut lucrurile minunate pe care le făcuse și pe copiii care strigau în templu[a]: „Osana[b] Fiului lui David!”, s-au indignat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Termenul grecesc ἱερόν se referă la întregul complex sau la incinta templului, nu în mod specific la sanctuarul interior.
    reason: cultural_note
  - marker: b
    text: „Osana” este o aclamație de origine ebraică, având sensul de bază „Mântuiește, te rugăm” sau „Mântuiește acum”; în vremea aceea funcționa și ca strigăt de laudă.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: când ... au văzut
  rationale: Participiul aorist exprimă împrejurarea temporală a verbului principal; construcția cu „când” este firească în română.
- source_word: ἀρχιερεῖς
  choice: preoții de seamă
  rationale: Pluralul îi desemnează pe conducătorii autorității preoțești, nu mai mulți titulari simultani ai funcției de mare-preot; formularea evită această confuzie.
- source_word: γραμματεῖς
  choice: cărturarii
  rationale: Redare consacrată și directă pentru specialiștii în Scriptură și Lege din contextul iudaic.
- source_word: τὰ θαυμάσια
  choice: lucrurile minunate
  rationale: Păstrează caracterul larg al expresiei substantivizate și nu o restrânge nejustificat la minuni în sens tehnic.
- source_word: ἐποίησεν
  choice: le făcuse
  rationale: Mai-mult-ca-perfectul românesc redă natural faptele deja săvârșite pe care conducătorii le-au văzut, fără a modifica referința aoristului.
- source_word: παῖδας
  choice: copiii
  rationale: În acest context, sensul cel mai probabil este cel de copii; „slujitorii” este improbabil, iar „băieții” ar restrânge nejustificat referința.
- source_word: κράζοντας ... καὶ λέγοντας
  choice: care strigau
  rationale: În română, verbul „a striga” include firesc rostirea cu glas tare, iar citatul redă conținutul spus, evitând o coordonare greoaie.
- source_word: ἐν τῷ ἱερῷ
  choice: în templu
  rationale: Este formularea românească naturală; sensul mai precis de complex sau incintă a templului este explicat în notă.
- source_word: Ὡσαννὰ
  choice: Osana
  rationale: Se păstrează aclamația ebraică preluată în greacă, împreună cu dubla ei rezonanță de rugăminte pentru izbăvire și strigăt de laudă.
- source_word: τῷ υἱῷ Δαυίδ
  choice: Fiului lui David
  rationale: Dativul este redat direct, iar titlul mesianic consacrat este păstrat literal.
- source_word: ἠγανάκτησαν
  choice: s-au indignat
  rationale: Redă direct reacția puternică de nemulțumire exprimată de verb.
theological_decisions:
- issue: Semnificația mesianică a expresiei „Fiul lui David”
  choice: Fiului lui David
  alternative: urmașului lui David
  rationale: Formularea literală păstrează titlul mesianic și legătura lui narativă cu tema davidică din Evanghelia după Matei.
- issue: Sensul aclamației Ὡσαννά
  choice: Osana în text, cu explicație în notă
  alternative: Mântuiește, te rugăm / Mântuiește acum
  rationale: Transliterarea păstrează atât originea de implorare a izbăvirii, cât și funcția deja dobândită de aclamație laudativă, fără a elimina tensiunea dintre cele două.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. „Preoții de seamă” evită ambiguitatea lui „marii preoți”, iar „Osana” și „Fiul lui David” păstrează rezonanța liturgică și mesianică a textului.
