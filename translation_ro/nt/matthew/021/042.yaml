id: MAT.21.42
reference: Matthew 21:42
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Λέγει αὐτοῖς ὁ Ἰησοῦς· Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας· παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/042.yaml
  text: 'Jesus said to them[a], “Have you never read in the Scriptures: ‘The stone that the builders rejected—this one has become the cornerstone. This came from the Lord[b], and it is marvelous in our eyes’?”'
translation:
  language: ro
  text: 'Isus le-a zis: „N-ați citit niciodată în Scripturi: «Piatra pe care au respins-o zidarii, aceasta a ajuns să fie piatra din capul unghiului[a]. De la Domnul a venit aceasta[b] și este minunată în ochii noștri»?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. „cap al unghiului”; expresia poate desemna „piatra unghiulară” sau, posibil, „cheia de boltă”.
    reason: lexical_alternative
  - marker: b
    text: 'Greacă: „de la Domnul”; în textul ebraic al citatului apare numele divin YHWH („DOMNUL”).'
    reason: source_language_background
lexical_decisions:
- source_word: Λέγει
  choice: a zis
  rationale: Prezentul istoric grecesc este redat firesc în narațiunea românească prin perfectul compus, fără schimbarea sensului.
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: N-ați citit niciodată
  rationale: Redarea păstrează forța întrebării retorice și intensificarea exprimată de Οὐδέποτε.
- source_word: γραφαῖς
  choice: Scripturi
  rationale: În context, termenul desemnează scrierile sacre ale lui Israel; formularea este consacrată și limpede în româna actuală.
- source_word: ἀπεδοκίμασαν
  choice: au respins-o
  rationale: Verbul indică respingerea pietrei ca nepotrivită după evaluare; pronumele clitic este cerut de sintaxa românească.
- source_word: οἱ οἰκοδομοῦντες
  choice: zidarii
  rationale: Participiul substantivizat îi desemnează pe cei care construiesc; „zidarii” păstrează concis și natural metafora construcției.
- source_word: οὗτος
  choice: aceasta
  rationale: Pronumele demonstrativ reia emfatic „piatra” și îi păstrează genul gramatical în română.
- source_word: ἐγενήθη εἰς
  choice: a ajuns
  rationale: Exprimă schimbarea de statut rezultată, într-o formulare românească firească.
- source_word: κεφαλὴν γωνίας
  choice: piatra din capul unghiului
  rationale: Redarea păstrează metafora și ambiguitatea expresiei grecești mai bine decât termenul interpretativ unic „piatra unghiulară”; alternativa arhitecturală este indicată în notă.
- source_word: παρὰ κυρίου
  choice: De la Domnul
  rationale: παρά cu genitiv exprimă aici sursa sau originea; „de la” reproduce direct această relație.
- source_word: θαυμαστὴ
  choice: minunată
  rationale: Termenul exprimă caracterul uimitor și vrednic de admirație, păstrând registrul elevat al citatului.
theological_decisions:
- issue: Redarea lui κύριος în citatul din Psalm
  choice: Domnul
  alternative: DOMNUL
  rationale: Textul grec are κυρίου, redat „Domnul”; nota semnalează transparent că sursa ebraică a citatului conține numele divin YHWH.
- issue: Aplicarea mesianică a imaginii pietrei
  choice: Metafora este păstrată fără explicație interpretativă în text
  alternative: Identificarea explicită a pietrei cu Mesia
  rationale: Contextul arată aplicarea făcută de Isus, însă citatul însuși nu include o asemenea glosă; traducerea nu adaugă ceea ce versetul nu spune explicit.
- issue: Identitatea arhitecturală a pietrei
  choice: piatra din capul unghiului
  alternative: piatra unghiulară sau cheia de boltă
  rationale: Expresia κεφαλὴ γωνίας poate fi înțeleasă în moduri arhitecturale diferite; textul principal rămâne aproape de imaginea sursă, iar nota păstrează alternativele reale.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Citatul păstrează paralelismul și registrul scripturistic fără arhaisme inutile; topica „De la Domnul a venit aceasta” menține accentul sursei asupra originii divine.
