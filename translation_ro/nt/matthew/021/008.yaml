  text: ὁ δὲ πλεῖστος ὄχλος ἔστρωσαν ἑαυτῶν τὰ ἱμάτια ἐν τῇ ὁδῷ, ἄλλοι δὲ ἔκοπτον κλάδους ἀπὸ τῶν δένδρων καὶ ἐστρώννυον ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/008.yaml
  text: Most of the crowd spread their garments on the road[b][a], and others were cutting branches from the trees and spreading them on the road.
translation:
  language: ro
  text: Cei mai mulți din mulțime[a] și-au așternut hainele[b] pe drum, iar alții tăiau ramuri din copaci și le așterneau pe drum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Cea mai mare parte a mulțimii”.'
    reason: lexical_alternative
  - marker: b
    text: Termenul „haine” poate fi redat și prin „mantii”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλεῖστος ὄχλος
  choice: Cea mai mare parte a mulțimii
  rationale: πλεῖστος cu substantivul colectiv ὄχλος indică majoritatea sau partea cea mai mare a mulțimii. Formularea românească este firească și păstrează nuanța cantitativă; δέ este redat prin curgerea narativă a frazei, fără un adverb temporal care nu apare explicit în sursă.
- source_word: ἔστρωσαν
  choice: și-a așternut
  rationale: Verbul exprimă întinderea sau așezarea hainelor pe suprafața drumului. Aoristul este redat prin perfectul compus, iar construcția reflexiv-posesivă românească leagă natural hainele de mulțime.
- source_word: ἑαυτῶν τὰ ἱμάτια
  choice: hainele
  rationale: ἱμάτια desemnează haine, adesea veșminte exterioare. În română, posesia subliniată de ἑαυτῶν este transmisă idiomatic prin „și-a ... hainele”, fără greoiul „propriile lor haine”.
- source_word: ἐν τῇ ὁδῷ
  choice: pe drum
  rationale: În acest context concret, obiectele sunt întinse pe suprafața drumului; „pe drum” este echivalentul românesc firesc.
- source_word: ἄλλοι δὲ
  choice: iar alții
  rationale: Expresia introduce o altă parte a mulțimii. „Iar” redă valoarea continuativă și ușor contrastivă a lui δέ fără a impune o opoziție puternică.
- source_word: ἔκοπτον
  choice: tăiau
  rationale: Imperfectul grec prezintă acțiunea în desfășurare; imperfectul românesc păstrează acest aspect.
- source_word: κλάδους ἀπὸ τῶν δένδρων
  choice: ramuri din copaci
  rationale: 'Redare directă și naturală: κλάδους înseamnă ramuri, iar ἀπὸ τῶν δένδρων indică proveniența lor din copaci.'
- source_word: καὶ ἐστρώννυον ἐν τῇ ὁδῷ
  choice: și le așterneau pe drum
  rationale: Imperfectul „așterneau” păstrează acțiunea în desfășurare și repetă în mod intenționat imaginea așternerii pe drum.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „A așterne” păstrează imaginea concretă și repetarea verbală din greacă, iar imperfectele redau caracterul continuu al acțiunilor celui de-al doilea grup.
