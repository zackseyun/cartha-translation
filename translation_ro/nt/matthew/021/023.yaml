id: MAT.21.23
reference: Matthew 21:23
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/023.yaml
  text: And when he came into the temple[a], the chief priests and the elders of the people came up to him while he was teaching and said, “By what authority are you doing these things? And who gave you this authority?”
translation:
  language: ro
  text: 'Când a intrat în templu[a], în timp ce învăța, s-au apropiat de el preoții cei mai de seamă și bătrânii poporului și i-au zis: „Cu ce autoritate faci aceste lucruri? Și cine ți-a dat această autoritate?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Termenul grecesc se referă la întregul complex al templului sau la curțile lui, nu în mod specific la sanctuarul interior.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: Când a intrat
  rationale: Genitivul absolut are aici valoare temporală; formularea redă firesc intrarea lui Isus și cadrul acțiunii următoare.
- source_word: ἱερὸν
  choice: templu
  rationale: ἱερόν desemnează ansamblul sau incinta templului, nu în mod specific sanctuarul interior; termenul românesc uzual este clarificat prin notă.
- source_word: προσῆλθον αὐτῷ
  choice: s-au apropiat de el
  rationale: Redă direct și natural ideea apropierii fizice exprimate de προσέρχομαι.
- source_word: διδάσκοντι
  choice: în timp ce îi învăța pe oameni
  rationale: Participiul prezent indică simultaneitatea cu apropierea conducătorilor; complementul «pe oameni» este implicit în folosirea absolută a verbului și face exprimarea firească în română.
- source_word: οἱ ἀρχιερεῖς
  choice: preoții de seamă
  rationale: Pluralul desemnează elita sacerdotală conducătoare, nu mai mulți titulari simultani ai funcției de mare-preot.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: bătrânii poporului
  rationale: Păstrează denumirea tradițională și inteligibilă a conducătorilor recunoscuți ai poporului.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: Cu ce autoritate
  rationale: Construcția contestă temeiul autorizării lui Isus; «cu ce autoritate» este idiomatic și păstrează această forță.
- source_word: ταῦτα ποιεῖς
  choice: faci aceste lucruri
  rationale: Prezentul grecesc este redat natural prin prezentul românesc, în cadrul confruntării despre acțiunile lui Isus.
- source_word: τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην
  choice: cine ți-a dat această autoritate
  rationale: Perfectul compus românesc redă firesc actul anterior al acordării autorității, relevant în momentul întrebării.
theological_decisions:
- issue: Sensul lui ἐξουσία în contestarea conducătorilor
  choice: autoritate
  alternative: drept; putere
  rationale: Contextul privește autorizarea legitimă a faptelor și învățăturii lui Isus, nu doar capacitatea sau forța sa; «autoritate» păstrează atât dimensiunea instituțională, cât și tensiunea teologică, fără a o soluționa prin traducere.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. «Preoții de seamă» evită impresia eronată că ar fi existat simultan mai mulți mari-preoți, iar «bătrânii poporului» păstrează denumirea istorică recognoscibilă.
