  to: 'Când a intrat în templu[a], în timp ce învăța, s-au apropiat de el preoții cei mai de seamă și bătrânii poporului și i-au zis: „Cu ce autoritate faci aceste lucruri? Și cine ți-a dat această autoritate?”'
  rationale: Revizuirea elimină completarea neexprimată „pe oameni”, păstrând participiul contemporan διδάσκοντι fără a adăuga informație. „Preoții cei mai de seamă” redă mai clar și mai idiomatic grupul desemnat de ἀρχιερεῖς. Restul textului, inclusiv nota ancorată la „templu”, corespunde fidel sursei și este natural în româna standard modernă.
