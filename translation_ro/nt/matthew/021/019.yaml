id: MAT.21.19
reference: Matthew 21:19
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν μίαν ἐπὶ τῆς ὁδοῦ ἦλθεν ἐπ’ αὐτήν, καὶ οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον, καὶ λέγει αὐτῇ· ⸀Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα· καὶ ἐξηράνθη παραχρῆμα ἡ συκῆ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/019.yaml
  text: And seeing a fig tree by the road[a], he came up to it and found nothing on it except leaves alone. And he said to it, “May there no longer ever be fruit from you.” And the fig tree withered at once.
translation:
  language: ro
  text: 'Și, văzând un smochin lângă drum, s-a apropiat de el și n-a găsit în el nimic, decât numai frunze. Și i-a zis: „Să nu mai iasă rod din tine niciodată!” Și smochinul s-a uscat îndată.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συκῆν μίαν
  choice: un smochin
  rationale: μίαν introduce aici în mod firesc un exemplar neprecizat; articolul nehotărât românesc redă sensul fără accentuarea inutilă a numeralului „unul”.
- source_word: ἐπὶ τῆς ὁδοῦ
  choice: lângă drum
  rationale: Construcția locativă indică poziția smochinului în vecinătatea drumului; formularea este firească și evită sugestia că pomul s-ar afla chiar pe carosabil.
- source_word: ἦλθεν ἐπ’ αὐτήν
  choice: s-a apropiat de el
  rationale: Redă mișcarea orientată spre pom mai limpede decât simplul „a venit la el”.
- source_word: οὐδὲν εὗρεν ἐν αὐτῇ
  choice: n-a găsit în el nimic
  rationale: Româna poate păstra firesc prepoziția sursei, deoarece rodul este căutat în coroana pomului; pronumele masculin corespunde substantivului românesc „smochin”.
- source_word: εἰ μὴ φύλλα μόνον
  choice: decât numai frunze
  rationale: 'Combinația păstrează accentul cumulativ al lui εἰ μή și μόνον: nu era nimic altceva în afară de frunze.'
- source_word: λέγει αὐτῇ
  choice: i-a zis
  rationale: Prezentul istoric grec este redat prin perfectul compus, timpul narativ obișnuit în româna modernă.
- source_word: Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα
  choice: Să nu mai iasă rod din tine niciodată!
  rationale: Construcția cu conjunctiv păstrează caracterul solemn de pronunțare, iar „să nu mai... niciodată” redă împreună Μηκέτι și εἰς τὸν αἰῶνα. „Să iasă rod din tine” conservă imaginea sursei fără a o reduce la idiomul mai interpretativ „să nu mai rodești”.
- source_word: ἐξηράνθη παραχρῆμα
  choice: s-a uscat îndată
  rationale: „S-a uscat” este echivalentul românesc natural pentru uscarea unui pom, iar „îndată” păstrează imediatitatea lui παραχρῆμα într-un registru demn și accesibil.
theological_decisions:
- issue: Forța rostirii lui Isus către smochin
  choice: 'O rostire prohibitivă/imprecatorie la conjunctiv: „Să nu mai iasă rod din tine niciodată!”'
  alternative: O declarație predictivă, precum „Nu va mai ieși rod din tine niciodată”, sau formularea idiomatică „Să nu mai rodești niciodată”.
  rationale: Μηκέτι urmat de γένηται, conjunctiv aorist, susține o pronunțare solemnă de încetare, nu impune transformarea ei într-o simplă predicție. Traducerea nu introduce în verset interpretarea simbolică a gestului.
translation_notes:
  register: Română standard modernă, narativă și demnă. Formularea păstrează repetiția deliberată a lui „smochin” și intensitatea construcției negative, fără arhaisme greu accesibile.
