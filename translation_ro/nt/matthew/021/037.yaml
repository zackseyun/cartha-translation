id: MAT.21.37
reference: Matthew 21:37
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὕστερον δὲ ἀπέστειλεν πρὸς αὐτοὺς τὸν υἱὸν αὐτοῦ λέγων· Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/037.yaml
  text: But later he sent his son to them[a], saying, ‘They will respect my son.’
translation:
  language: ro
  text: 'Dar, mai târziu, l-a trimis la ei pe fiul său, spunând: „Pe fiul meu îl vor respecta.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Pe fiul meu îl vor cinsti.” Verbul grecesc poate însemna a arăta respect sau considerație; în alte contexte poate avea și sensul „a se rușina”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: mai târziu
  rationale: Redă valoarea temporală „ulterior/după aceea” fără a introduce ideea mai puternică de act final, pe care ar putea-o sugera „în cele din urmă”.
- source_word: δὲ
  choice: Dar
  rationale: 'Marchează firesc contrastul și noua etapă a relatării: după trimiterea robilor, proprietarul îl trimite pe fiul său.'
- source_word: ἀπέστειλεν πρὸς αὐτοὺς
  choice: l-a trimis la ei
  rationale: Formulare românească naturală pentru acțiunea de a trimite o persoană către alte persoane, fără conotații tehnice suplimentare.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: pe fiul său
  rationale: Păstrează referința narativă obișnuită și nu adaugă adjective sau accentuări absente din greacă.
- source_word: λέγων
  choice: spunând
  rationale: Participiul introduce direct conținutul vorbirii și este redat transparent în română.
- source_word: Ἐντραπήσονται τὸν υἱόν μου
  choice: Pe fiul meu îl vor respecta
  rationale: Cu obiect direct, verbul exprimă aici acordarea de respect sau considerație. Antepunerea obiectului este idiomatică și păstrează accentul contextual asupra fiului.
theological_decisions:
- issue: Redarea fiului din parabolă fără explicitarea excesivă a referinței cristologice
  choice: fiul său / fiul meu
  alternative: Fiul său / Fiul meu; fiul său iubit
  rationale: Textul grecesc folosește substantivul obișnuit υἱός, fără ἀγαπητός și fără un semn gramatical care să impună transformarea lui într-un titlu. Litera mică păstrează forma parabolei, lăsând implicația cristologică să reiasă din context.
- issue: Nuanța lui ἐντρέπω
  choice: îl vor respecta
  alternative: îl vor cinsti; se vor rușina înaintea lui
  rationale: Construcția cu obiect direct favorizează sensul de a arăta respect sau considerație. Nota păstrează deschisă aria semantică mai largă fără a impune aici sensul „a se rușina”.
translation_notes:
  register: Română standard modernă, clară și demnă. Ordinea „Pe fiul meu îl vor respecta” sună firesc, evidențiază obiectul și evită atât arhaismul, cât și o nuanță de venerare religioasă mai puternică decât cere contextul.
