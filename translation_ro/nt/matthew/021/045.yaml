reference: Matthew 21:45
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ ἀκούσαντες οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι τὰς παραβολὰς αὐτοῦ ἔγνωσαν ὅτι περὶ αὐτῶν λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/045.yaml
  text: And when the chief priests and the Pharisees heard his parables[a], they knew that he was speaking about them.
translation:
  language: ro
  text: Când preoții conducători și fariseii au auzit pildele lui, și-au dat seama că vorbea despre ei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: când ... au auzit
  rationale: Participiul aorist este redat natural printr-o propoziție temporală, păstrând raportul de timp față de verbul principal.
- source_word: ἀρχιερεῖς
  choice: preoții conducători
  rationale: Sintagma desemnează conducerea preoțească, nu mai mulți deținători simultani ai funcției unice de mare-preot; formularea este clară pentru cititorul modern.
- source_word: Φαρισαῖοι
  choice: fariseii
  rationale: Este forma consacrată în română pentru numele acestei grupări iudaice.
- source_word: παραβολὰς
  choice: pildele
  rationale: Termen biblic consacrat și ușor de înțeles pentru relatările și imaginile figurate folosite de Isus.
- source_word: ἔγνωσαν
  choice: și-au dat seama
  rationale: În context, aoristul lui γινώσκω exprimă ajungerea la recunoașterea sensului, nu doar posedarea unei informații.
- source_word: περὶ αὐτῶν
  choice: despre ei
  rationale: Redă direct sensul obișnuit al construcției περί cu genitivul, fără a introduce în text sensul mai puternic «împotriva lor».
- source_word: λέγει
  choice: vorbea
  rationale: Prezentul grecesc din discursul indirect este redat idiomatic în română prin imperfect, exprimând faptul că pildele se refereau la ei.
theological_decisions:
- issue: Dacă afirmația trebuie formulată explicit ca o acuzație îndreptată împotriva conducătorilor
  choice: vorbea despre ei
  alternative: vorbea împotriva lor
  rationale: Contextul arată caracterul critic al pildelor, însă περί cu genitivul înseamnă aici «despre/cu privire la»; traducerea nu intensifică nejustificat adversitatea.
translation_notes:
  register: Română standard modernă, clară și demnă. «Preoții conducători» evită ambiguitatea expresiei «marii preoți», iar «și-au dat seama» redă firesc momentul recunoașterii.
