  source_fidelity: 'Textul redă fidel toate elementele esențiale: participiul temporal («Când ... au auzit»), grupurile vizate, «pildele lui», recunoașterea exprimată de ἔγνωσαν și sensul neintensificat al lui περὶ αὐτῶν («despre ei»). Imperfectul «vorbea» este idiomatic în română în această construcție și transmite adecvat prezentul λέγει raportat la momentul recunoașterii.'
  naturalness: Formularea este fluentă, clară și potrivită românei standard moderne. «Și-au dat seama» exprimă natural recunoașterea la care au ajuns. «Preoții conducători» este inteligibil și evită lectura instituțională prea îngustă a pluralului ἀρχιερεῖς.
  terminology: «Fariseii» și «pildele» sunt termeni românești biblici stabili și adecvați. Redarea «despre ei» păstrează valoarea obișnuită a lui περί cu genitivul, fără a introduce interpretativ «împotriva lor».
