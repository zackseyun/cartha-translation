  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι ἔλεγον· Οὗτός ἐστιν ⸂ὁ προφήτης Ἰησοῦς⸃ ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/011.yaml
  text: And the crowds were saying[a], “This is the prophet Jesus, from Nazareth in Galilee.”
translation:
  language: ro
  text: 'Iar mulțimile spuneau: „Acesta este profetul[a] Isus, cel din Nazaretul Galileii.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „un profet”. În greacă apare forma hotărâtă „profetul”, care poate reflecta faptul că mulțimile îl identificau pe Isus drept o figură profetică recunoscută.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: Iar mulțimile
  rationale: Pluralul ὄχλοι este redat firesc prin „mulțimile”, iar δέ prin conectivul narativ ușor „iar”, care păstrează legătura cu întrebarea din versetul anterior fără a introduce un contrast puternic.
- source_word: ἔλεγον
  choice: spuneau
  rationale: Imperfectul indică o rostire în desfășurare sau repetată; imperfectul românesc „spuneau” păstrează această valoare aspectuală în mod natural.
- source_word: Οὗτός ἐστιν
  choice: Acesta este
  rationale: Redare directă și idiomatică a construcției de identificare alcătuite din demonstrativ și copulă.
- source_word: ὁ προφήτης
  choice: profetul
  rationale: Articolul hotărât din greacă este păstrat, fără a explicita dacă mulțimea îl identifica pe Isus cu o figură profetică anume sau îl desemna ca profet cunoscut.
- source_word: Ἰησοῦς
  choice: Isus
  rationale: Numele propriu este redat în forma românească modernă consacrată în proiect.
- source_word: ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας
  choice: cel din Nazaretul Galileii
  rationale: Construcția articulară este reprezentată prin „cel din”, iar genitivul geografic τῆς Γαλιλαίας prin formula românească firească „Nazaretul Galileii”, care identifică localitatea și regiunea fără adaos explicativ.
theological_decisions:
- issue: Redarea hotărâtă sau nehotărâtă a expresiei ὁ προφήτης
  choice: profetul
  alternative: un profet
  rationale: Textul grec conține articolul hotărât. „Profetul” păstrează posibila rezonanță a unei figuri profetice recunoscute sau așteptate, fără să impună această interpretare; alternativa nehotărâtă este consemnată în notă pentru a păstra ambiguitatea pragmatică.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. „Iar” asigură continuitatea discursului, iar „Nazaretul Galileii” păstrează concizia și relația geografică a originalului.
