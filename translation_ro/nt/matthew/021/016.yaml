source:
  edition: SBLGNT
  text: καὶ εἶπαν αὐτῷ· Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς· Ναί. οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/016.yaml
  text: And they said to him[a], “Do you hear what these are saying?” But Jesus says to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies you have prepared praise’?”
translation:
  language: ro
  text: 'Și i-au zis: „Auzi ce spun aceștia?” Isus le spune: „Da. N-ați citit niciodată: «Din gura pruncilor și a sugarilor ai pregătit laudă»?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Isus citează Psalmul 8:2 potrivit tradiției scripturistice grecești. Textul ebraic este redat de obicei: „Din gura pruncilor și a sugarilor ai întemeiat putere.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούεις
  choice: Auzi
  rationale: Indicativul prezent din întrebarea directă este redat firesc și păstrează tonul provocator al interlocutorilor.
- source_word: τί οὗτοι λέγουσιν
  choice: ce spun aceștia
  rationale: Redarea păstrează prezentul și ușoara nuanță distantă a demonstrativului οὗτοι, fără a introduce un substantiv absent din greacă.
- source_word: λέγει
  choice: le-a răspuns
  rationale: În româna narativă, perfectul compus este mai natural decât prezentul istoric în acest context; sensul replicii este redat prin „a răspuns”, fără schimbarea conținutului.
- source_word: Ναί
  choice: Da
  rationale: Este echivalentul direct și firesc al răspunsului afirmativ.
- source_word: οὐδέποτε ἀνέγνωτε
  choice: N-ați citit niciodată
  rationale: Păstrează forma de întrebare retorică și tonul mustrător privind cunoașterea Scripturii.
- source_word: Ἐκ στόματος
  choice: Din gura
  rationale: Redă direct construcția prepozițională și sună natural într-un citat scripturistic românesc.
- source_word: νηπίων
  choice: copilașilor
  rationale: Termenul indică copii foarte mici; „copilași” îl distinge de participiul următor, care îi desemnează pe pruncii alăptați.
- source_word: θηλαζόντων
  choice: pruncilor care sug
  rationale: Redă explicit participiul prezent și păstrează imaginea concretă, într-o formulare modernă și demnă.
- source_word: κατηρτίσω
  choice: Ți-ai pregătit
  rationale: Verbul aorist este redat prin perfectul compus românesc; „a pregăti” reflectă aici formularea greacă citată de Matei, fără armonizare cu textul ebraic al psalmului.
- source_word: αἶνον
  choice: laudă
  rationale: Substantivul este redat firesc ca noțiune abstractă, potrivit sensului său direct.
theological_decisions:
- issue: Redarea citatului din Psalmul 8 în argumentul lui Isus
  choice: 'În textul principal se păstrează formularea greacă a lui Matei: „Ți-ai pregătit laudă”.'
  alternative: 'Textul ebraic al Psalmului 8:2 este redat de obicei: „ai întemeiat putere”.'
  rationale: Traducerea trebuie să redea citatul așa cum apare în textul grec al Evangheliei după Matei, fără a-l armoniza tacit cu formularea ebraică; diferența relevantă este semnalată în nota de subsol.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Dialogul este natural, iar citatul scripturistic păstrează paralelismul și formularea lui Matei. Marcajul notei este așezat după citatul la care se referă.
