- from: 'Și I-au zis: „Auzi ce spun aceștia?” Isus le-a răspuns: „Da. N-ați citit niciodată: «Din gura copilașilor și a pruncilor care sug Ți-ai pregătit laudă»?”[a]'
  to: 'Și i-au zis: „Auzi ce spun aceștia?” Isus le spune: „Da. N-ați citit niciodată: «Din gura pruncilor și a sugarilor ai pregătit laudă»?”[a]'
  rationale: Au fost corectate prezentul istoric al narațiunii și construcția verbală a citatului, precum și termenii pentru cele două categorii de copii. Nota rămâne ancorată după întrebarea care conține citatul și explică diferența relevantă dintre formularea greacă citată de Matei și redarea curentă a textului ebraic.
