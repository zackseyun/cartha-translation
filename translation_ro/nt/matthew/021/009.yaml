id: MAT.21.9
reference: Matthew 21:9
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι οἱ προάγοντες ⸀αὐτὸν καὶ οἱ ἀκολουθοῦντες ἔκραζον λέγοντες· Ὡσαννὰ τῷ υἱῷ Δαυίδ· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/009.yaml
  text: And the crowds going ahead of him and those following were crying out[a], saying[c][b], “Hosanna to the Son of David! Blessed is the one who comes in the name of the Lord! Hosanna in the highest!”
translation:
  language: ro
  text: 'Mulțimile care mergeau înaintea lui și cele care îl urmau strigau: „Osana[a] Fiului lui David![b] Binecuvântat este cel ce vine în numele Domnului![c] Osana în înălțimi!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Osana” este o aclamație provenită din ebraică, având la origine sensul „mântuiește, te rugăm” sau „mântuiește acum”; aici funcționează și ca strigăt de laudă.
    reason: lexical_alternative
  - marker: b
    text: „Fiul lui David” este un titlu regal mesianic.
    reason: cultural_note
  - marker: c
    text: Aceste cuvinte evocă Psalmul 118:26, unde „Domnul” redă în textul ebraic numele divin YHWH.
    reason: cross_reference
lexical_decisions:
- source_word: ὄχλοι
  choice: mulțimile
  rationale: Redă firesc grupurile numeroase de oameni și păstrează pluralul articulat al textului grec.
- source_word: προάγοντες αὐτὸν
  choice: care mergeau înaintea lui
  rationale: Descrie poziția lor în procesiune fără a sugera că îl conduceau în mod oficial.
- source_word: ἀκολουθοῦντες
  choice: cele care îl urmau
  rationale: Se corelează natural cu prima categorie a mulțimilor și păstrează imaginea procesiunii.
- source_word: ἔκραζον λέγοντες
  choice: strigau
  rationale: Imperfectul românesc exprimă acțiunea în desfășurare; introducerea vorbirii prin două puncte face inutilă formula mai greoaie „strigau, spunând”.
- source_word: Ὡσαννά
  choice: Osana
  rationale: Forma consacrată în română păstrează aclamația liturgică, iar sensul etimologic al cererii este explicat în notă.
- source_word: τῷ υἱῷ Δαυίδ
  choice: Fiului lui David
  rationale: Dativul românesc redă destinatarul aclamației și păstrează titlul davidic fără parafrază interpretativă.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Binecuvântat este cel ce vine
  rationale: Redare românească firească a participiului substantivizat, păstrând caracterul solemn al aclamației.
- source_word: ἐν ὀνόματι κυρίου
  choice: în numele Domnului
  rationale: Păstrează expresia greacă, aluzia scripturală și ideea venirii sub autoritatea Domnului fără a o explicita excesiv.
- source_word: ἐν τοῖς ὑψίστοις
  choice: în înălțimi
  rationale: Formulare concisă și solemnă care indică sfera cerească înaltă fără a preciza mai mult decât textul grec.
theological_decisions:
- issue: Titlul mesianic regal τῷ υἱῷ Δαυίδ
  choice: Fiului lui David
  alternative: lui Mesia
  rationale: Textul grec folosește explicit titlul davidic; păstrarea lui menține textura istorică și teologică fără a introduce o parafrază.
- issue: Redarea lui Ὡσαννά
  choice: Osana în text, cu explicarea sensului în notă
  alternative: Mântuiește-ne, te rugăm / Mântuiește acum
  rationale: În acest context, termenul funcționează ca aclamație liturgică și laudativă, deși provine dintr-o cerere de izbăvire; transliterarea păstrează ambele rezonanțe.
- issue: Referința lui κυρίου în citatul din Psalmul 118
  choice: Domnului
  alternative: DOMNULUI
  rationale: Se traduce direct grecescul κύριος, iar legătura cu numele divin YHWH din textul ebraic al psalmului este indicată în notă, fără a înlocui formularea greacă.
translation_notes:
  register: Română standard modernă, clară și solemnă. S-a evitat atât limbajul arhaizant, cât și parafraza explicativă în textul principal. Literele mici din „cel ce vine” și „numele” urmează forma gramaticală a sursei fără a introduce prin capitalizare o interpretare suplimentară.
