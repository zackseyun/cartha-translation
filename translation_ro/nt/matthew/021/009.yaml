  terminology: „Osana”, „Fiului lui David”, „Binecuvântat”, „Domnului” și „în înălțimi” sunt alegeri consacrate și exacte. Notele explică termenul ebraic, titlul regal mesianic și ecoul din Psalmul 118 fără a introduce interpretări doctrinare în text.
