id: MAT.21.3
reference: Matthew 21:3
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ τι, ἐρεῖτε ὅτι Ὁ κύριος αὐτῶν χρείαν ἔχει· ⸀εὐθὺς δὲ ⸀ἀποστελεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/003.yaml
  text: And if anyone says anything to you[a], you shall say[b], ‘The Lord has need of them,’ and he will send them at once.
translation:
  language: ro
  text: 'Dacă vă spune cineva ceva, să spuneți: „Domnul[a] are nevoie de ei”, iar îi va trimite[b] îndată.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Stăpânul”.'
    reason: alternative_reading
  - marker: b
    text: 'Subiectul nu este exprimat în greacă. Cel mai probabil este persoana care le vorbește ucenicilor; este posibilă și înțelegerea: „iar Domnul îi va trimite îndată”.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ τι
  choice: Dacă vă spune cineva ceva
  rationale: Redă condiția nedefinită și sensul larg al lui λέγω cu τι, fără a restrânge replica la o întrebare sau obiecție explicită. „Vă” păstrează adresarea la plural.
- source_word: ἐρεῖτε
  choice: să spuneți
  rationale: Viitorul grecesc are aici valoare de instrucțiune; conjunctivul românesc este direct, firesc și păstrează forța imperativă.
- source_word: Ὁ κύριος
  choice: Domnul
  rationale: Păstrează titlul κύριος și greutatea lui narativă și cristologică, fără a exclude complet sensul contextual de „stăpân”.
- source_word: αὐτῶν χρείαν ἔχει
  choice: are nevoie de ei
  rationale: Expresia românească este naturală și fidelă idiomului grecesc. Pronumele îi desemnează împreună pe măgăriță și pe mânz, grup mixt redat în română prin masculin plural.
- source_word: εὐθὺς
  choice: îndată
  rationale: Exprimă acțiunea imediată într-un registru demn, curent și concis.
- source_word: ἀποστελεῖ αὐτούς
  choice: îi va trimite
  rationale: Păstrează sensul simplu al verbului ἀποστέλλω și nu adaugă ideea de „înapoi”, care nu este exprimată explicit în text.
theological_decisions:
- issue: Sensul și referentul lui Ὁ κύριος
  choice: Domnul
  alternative: stăpânul
  rationale: „Domnul” păstrează posibilitatea ca Isus să vorbească despre sine cu autoritate și menține rezonanța cristologică a titlului. Nota consemnează sensul lexical contextual posibil, fără a-l impune textului.
- issue: Subiectul neexprimat al lui ἀποστελεῖ
  choice: el, adică persoana care îi oprește sau li se adresează ucenicilor
  alternative: Domnul îi va trimite
  rationale: Cel mai firesc antecedent contextual al verbului la persoana a treia este „cineva” din propoziția condițională. Greaca nu exprimă însă subiectul, astfel că nota păstrează ambiguitatea gramaticală.
translation_notes:
  register: Română standard modernă, clară și demnă. „Să spuneți” este mai firesc decât un viitor cu valoare imperativă, iar „îndată” păstrează concizia și tonul biblic fără a suna învechit.
