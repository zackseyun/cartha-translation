  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τί δὲ ὑμῖν δοκεῖ; ἄνθρωπος εἶχεν τέκνα δύο. ⸀προσελθὼν τῷ πρώτῳ εἶπεν· Τέκνον, ὕπαγε σήμερον ἐργάζου ἐν τῷ ⸀ἀμπελῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/028.yaml
  text: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
translation:
  language: ro
  text: 'Dar ce părere aveți? Un om avea doi copii[a]. S-a dus la primul și i-a spus: «Copile, du-te astăzi să lucrezi în vie.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, potrivit sensului cerut de context: „doi fii”. Termenul grecesc înseamnă literalmente „copii”.'
    reason: Precizează alternativa tradițională și contextuală, păstrând totodată sensul lexical mai larg al textului grec.
lexical_decisions:
- source_word: Τί δὲ ὑμῖν δοκεῖ;
  choice: Dar ce părere aveți?
  rationale: Redă firesc apelul adresat ascultătorilor pentru a-și exprima judecata, păstrând prin „Dar” ușoara forță conectivă a lui δέ.
- source_word: ἄνθρωπος
  choice: Un om
  rationale: În cadrul narațiunii, termenul desemnează în mod firesc un bărbat, tatăl copiilor, iar formularea este simplă și idiomatică în română.
- source_word: τέκνα δύο
  choice: doi copii
  rationale: τέκνα este termenul general pentru „copii”, nu termenul specific pentru „fii”; traducerea păstrează această lărgime lexicală.
- source_word: προσελθὼν τῷ πρώτῳ εἶπεν
  choice: S-a dus la primul și i-a spus
  rationale: Transformă participiul într-o succesiune verbală naturală în română, fără a pierde ideea apropierii urmate de vorbire.
- source_word: Τέκνον
  choice: Copile
  rationale: Vocativul românesc redă adresarea directă și păstrează termenul familial mai larg, fără a-l restrânge la „fiu”.
- source_word: ὕπαγε σήμερον ἐργάζου
  choice: du-te astăzi să lucrezi
  rationale: Construcția cu conjunctiv este echivalentul românesc firesc al celor două imperative grecești în această poruncă orientată spre scop.
- source_word: ἐν τῷ ἀμπελῶνι
  choice: în vie
  rationale: „Vie” este echivalentul curent și exact al lui ἀμπελών, iar „în” păstrează sensul locativ al prepoziției ἐν.
theological_decisions:
- issue: Dacă τέκνα/τέκνον trebuie restrâns la sensul tradițional „fii/fiu”
  choice: copii / Copile
  alternative: fii / Fiule
  rationale: Textul grec folosește termenii generali τέκνα și τέκνον, nu υἱοί și υἱέ. Traducerea nu introduce înainte de vreme o precizare de sex pe care formularea versetului nu o exprimă lexical.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Dialogul este natural, iar formele „Copile” și „vie” păstrează concizia și imaginea agricolă a originalului.
