id: MAT.21.12
reference: Matthew 21:12
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν ⸀Ἰησοῦς εἰς τὸ ⸀ἱερόν, καὶ ἐξέβαλεν πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας ἐν τῷ ἱερῷ καὶ τὰς τραπέζας τῶν κολλυβιστῶν κατέστρεψεν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστεράς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/012.yaml
  text: And Jesus entered the temple courts and drove out all those selling and buying in the temple courts[a], and he overturned the tables of the money changers and the seats of those selling doves.
translation:
  language: ro
  text: Și Isus a intrat în curțile templului și i-a alungat pe toți cei care vindeau și cumpărau acolo[a]. A răsturnat mesele schimbătorilor de bani și scaunele celor care vindeau porumbei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „în templu” ori „în incinta templului”; termenul grec se referă la ansamblul mai larg al templului, nu în mod specific la sanctuarul interior.
    reason: alternativă lexicală
lexical_decisions:
- source_word: ἱερόν
  choice: curțile templului
  rationale: Termenul desemnează ansamblul templului, nu în mod specific sanctuarul interior (ναός). Formularea indică zona în care putea avea loc activitatea comercială.
- source_word: ἐξέβαλεν
  choice: i-a alungat
  rationale: Verbul exprimă o îndepărtare hotărâtă și forțată; „a alungat” este firesc și clar în româna actuală.
- source_word: πάντας
  choice: pe toți
  rationale: Păstrează explicit sfera cuprinzătoare exprimată de adjectivul grec.
- source_word: τοὺς πωλοῦντας καὶ ἀγοράζοντας
  choice: cei care vindeau și cumpărau
  rationale: Redă natural participiile prezente substantivizate și activitățile desfășurate de acele persoane.
- source_word: τράπεζας
  choice: mesele
  rationale: Păstrează sensul obișnuit al substantivului, potrivit obiectelor folosite de schimbătorii de bani.
- source_word: κολλυβιστῶν
  choice: schimbătorilor de bani
  rationale: Desemnează persoanele care schimbau monede; expresia este clară și consacrată în română.
- source_word: κατέστρεψεν
  choice: a răsturnat
  rationale: În acest context, verbul descrie întoarcerea sau răsturnarea mobilierului, fără a presupune neapărat distrugerea lui.
- source_word: καθέδρας
  choice: scaunele
  rationale: Redă direct obiectele de șezut desemnate de substantivul grec.
- source_word: περιστεράς
  choice: porumbei
  rationale: Termenul grec poate desemna porumbei sau turturele; „porumbei” este termenul românesc firesc și adecvat contextului jertfelor.
theological_decisions:
- issue: Sfera termenului ἱερόν în raport cu acțiunea lui Isus
  choice: Isus a intrat în curțile templului, adică în complexul templului, nu în sanctuarul interior.
  alternative: Redarea generică „templu”, fără precizare spațială.
  rationale: Distincția este relevantă istoric și spațial. „Curțile templului” evită impresia că Isus ar fi intrat în locul sfânt propriu-zis, fără a adăuga o interpretare doctrinară.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Repetarea grecească a expresiei „în curțile templului” a fost redusă prin „acolo” pentru naturalețe, fără pierderea referentului; coordonarea amplă a frazei grecești a fost împărțită în două propoziții pentru claritate.
