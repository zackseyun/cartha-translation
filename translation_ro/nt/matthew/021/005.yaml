id: MAT.21.5
reference: Matthew 21:5
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Εἴπατε τῇ θυγατρὶ Σιών· Ἰδοὺ ὁ βασιλεύς σου ἔρχεταί σοι πραῢς καὶ ἐπιβεβηκὼς ἐπὶ ὄνον καὶ ⸀ἐπὶ πῶλον υἱὸν ὑποζυγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/005.yaml
  text: Tell the daughter of Zion[a], ‘Look, your king is coming to you, gentle and mounted on a donkey, and on a colt[b], the foal of a beast of burden.’
translation:
  language: ro
  text: 'Spuneți fiicei Sionului: „Iată, împăratul tău vine la tine, blând[a] și călare pe un măgar și pe un mânz[b], puiul unui animal de povară.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „smerit”. Grecescul πραΰς poate însemna „blând”, „smerit” sau „blajin” și trimite la Zaharia 9:9.
    reason: lexical_alternative
  - marker: b
    text: 'Matei păstrează formularea profetică prin două expresii legate: „pe un măgar și pe un mânz, puiul unui animal de povară”.'
    reason: cross_reference
lexical_decisions:
- source_word: Εἴπατε
  choice: Spuneți-i
  rationale: Imperativul aorist plural păstrează îndemnul adresat mai multor ascultători; pronumele datival redă firesc în română destinatarul.
- source_word: τῇ θυγατρὶ Σιών
  choice: fiicei Sionului
  rationale: Păstrează personificarea profetică, fără a o reduce la «locuitorii Sionului» sau «Ierusalimul».
- source_word: Ἰδοὺ
  choice: Iată
  rationale: Formulă românească actuală și demnă care păstrează chemarea de a acorda atenție.
- source_word: ὁ βασιλεύς σου
  choice: Împăratul tău
  rationale: Redare directă a construcției posesive și a titlului regal; majuscula contextuală semnalează referirea la regele mesianic fără a modifica sensul lexical.
- source_word: ἔρχεταί σοι
  choice: vine la tine
  rationale: Prezentul redă viu sosirea; formularea este naturală în română.
- source_word: πραῢς
  choice: blând
  rationale: «Blând» redă firesc ideea de caracter neagresiv și liniștit; sensul alternativ «smerit» este păstrat în notă.
- source_word: ἐπιβεβηκὼς
  choice: călare
  rationale: Participiul perfect descrie starea rezultată a celui care s-a urcat pe animal; «călare» este concis și idiomatic.
- source_word: ἐπὶ ὄνον
  choice: pe un măgar
  rationale: Redare directă și curentă a sintagmei prepoziționale.
- source_word: πῶλον
  choice: un mânz
  rationale: Termenul desemnează un animal tânăr, iar expresia următoare îi precizează apartenența.
- source_word: υἱὸν ὑποζυγίου
  choice: puiul unui animal de povară
  rationale: Redă idiomatic expresia semitică literală «fiul unui animal de povară», păstrând imaginea animalului folosit la purtarea sarcinilor.
theological_decisions:
- issue: Citarea mesianică din Zaharia 9:9 și posibila armonizare cu textul profetic
  choice: 'Este păstrată formularea greacă a lui Matei: «blând ... călare pe un măgar, pe un mânz, puiul unui animal de povară».'
  alternative: Folosirea lui «smerit» pentru πραῢς ori comprimarea celor două expresii despre animale într-o singură referire.
  rationale: Traducerea urmează textul lui Matei, nu o formă armonizată a citatului din Zaharia. Juxtapunerea celor două expresii despre animale este păstrată, dar punctuația evită să impună concluzia că ar fi în mod necesar două animale distincte.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Personificarea profetică «fiica Sionului» și paralelismul citatului sunt păstrate. S-a evitat atât arhaizarea excesivă, cât și explicitarea interpretativă a relației dintre măgar și mânz.
