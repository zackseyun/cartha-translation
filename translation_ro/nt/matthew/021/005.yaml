  to: 'Spuneți fiicei Sionului: „Iată, împăratul tău vine la tine, blând[a] și călare pe un măgar și pe un mânz[b], puiul unui animal de povară.”'
  rationale: 'Sunt făcute numai corecturi sigure de fidelitate și stil: este restaurat „și” din καί, este îmbunătățită formularea românească a introducerii, iar nota lexicală elimină o alternativă prea îndepărtată semantic. Formularea dublată despre animale rămâne intactă și nu decide dacă expresiile indică unul sau două animale.'
