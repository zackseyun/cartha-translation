  text: Τοῦτο ⸀δὲ γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/004.yaml
  text: 'This happened so that what was spoken through the prophet might be fulfilled[a], saying:'
translation:
  language: ro
  text: 'Iar acest lucru s-a întâmplat ca să se împlinească ceea ce a fost spus prin profet[a], care spune:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „de profet”. În greacă apare mai literal „prin profet”, formulare care evidențiază rolul profetului ca mijlocitor al mesajului.'
    reason: alternativă lexicală
lexical_decisions:
- source_word: Τοῦτο
  choice: acest lucru
  rationale: Demonstrativul neutru singular se referă la acțiunea imediat anterioară privită ca un întreg; formularea este firească în româna actuală.
- source_word: δὲ
  choice: iar
  rationale: Particula are aici o funcție ușor conectivă și continuativă, nu puternic adversativă; „iar” păstrează discret legătura narativă.
- source_word: γέγονεν
  choice: s-a întâmplat
  rationale: Perfectul lui γίνομαι descrie aici producerea evenimentului în formula de împlinire; perfectul compus românesc este natural și exact în context narativ.
- source_word: ἵνα πληρωθῇ
  choice: ca să se împlinească
  rationale: Redă firesc construcția finală cu ἵνα și aoristul pasiv conjunctiv, păstrând deschisă nuanța de scop și rezultat.
- source_word: τὸ ῥηθὲν
  choice: ceea ce fusese spus
  rationale: Participiul articulat este redat substantival, iar mai-mult-ca-perfectul indică limpede că rostirea profetică precedă evenimentul relatat.
- source_word: διὰ τοῦ προφήτου
  choice: prin profet
  rationale: „Prin” păstrează valoarea de mediere sau instrument a lui διά cu genitivul, fără a reduce expresia la simpla paternitate a cuvintelor.
- source_word: λέγοντος
  choice: care spune
  rationale: Participiul prezent se acordă cu „profet” și introduce citatul; prezentul „spune” păstrează forma sursei și sună natural pentru un text profetic citat.
theological_decisions:
- issue: Formula împlinirii și rolul profetului
  choice: „ceea ce fusese spus prin profet”
  alternative: „ceea ce fusese spus de profet”
  rationale: Formularea aleasă păstrează ideea că rostirea anterioară a fost transmisă prin intermediul profetului, fără a preciza explicit un vorbitor divin care nu este numit în verset.
- issue: Relația exprimată de ἵνα
  choice: „ca să se împlinească”
  alternative: „astfel încât să se împlinească”
  rationale: „Ca să” păstrează mai bine nuanța finală a construcției, fără a exclude componenta de rezultat caracteristică formulei de împlinire.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Construcția evită arhaisme precum „s-a făcut” sau „zicând” și păstrează formula profetică într-o formă naturală.
