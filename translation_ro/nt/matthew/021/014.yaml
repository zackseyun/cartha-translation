source:
  edition: SBLGNT
  text: Καὶ προσῆλθον αὐτῷ ⸂τυφλοὶ καὶ χωλοὶ⸃ ἐν τῷ ἱερῷ, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/014.yaml
  text: And the blind and the lame came to him in the temple[a], and he healed them.
translation:
  language: ro
  text: Și au venit la el, în Templu[a], orbi și șchiopi, iar el i-a vindecat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grecescul ἱερόν desemnează complexul sau incinta Templului, nu în mod specific sanctuarul interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: au venit la el
  rationale: Redă firesc în româna actuală apropierea de Isus exprimată prin verbul προσέρχομαι și dativul αὐτῷ; „s-au apropiat de el” ar fi de asemenea posibil, dar este puțin mai formal.
- source_word: τυφλοὶ καὶ χωλοὶ
  choice: niște orbi și șchiopi
  rationale: Adjectivele sunt folosite substantival și desemnează persoane. Articolul nehotărât „niște” este natural în română și evită impresia că ar fi vorba despre toți orbii și șchiopii.
- source_word: ἐν τῷ ἱερῷ
  choice: în curtea Templului
  rationale: ἱερόν desemnează ansamblul sau incinta Templului, nu sanctuarul interior; în context, formularea localizează scena în spațiul accesibil al incintei.
- source_word: ἐθεράπευσεν αὐτούς
  choice: i-a vindecat
  rationale: În relatările evanghelice despre minuni, θεραπεύω înseamnă în mod obișnuit „a vindeca”, iar pronumele îi include pe cei două categorii menționate.
theological_decisions:
- issue: Locul vindecării indicat de ἱερόν
  choice: Vindecarea are loc în curtea Templului, adică în incinta complexului sacru.
  alternative: „în Templu”, înțeles în sens larg
  rationale: Textul folosește ἱερόν, nu ναός; de aceea traducerea nu trebuie să sugereze că orbii și șchiopii au intrat în sanctuarul interior.
translation_notes:
  register: Română standard modernă, cu formulare simplă și demnă. Majuscula din „Templului” marchează Templul din Ierusalim. „Atunci” redă valoarea narativă contextuală a lui καί fără a încărca fraza prin repetarea lui „și”.
