    rationale: Καὶ leagă narativ propoziția și se redă adecvat prin „Și”; „Atunci” adaugă o nuanță temporală neexprimată aici.
  - severity: medium
    issue: „În curtea Templului” restrânge nejustificat sensul lui ἐν τῷ ἱερῷ.
    rationale: ἱερόν se referă la complexul sau incinta Templului și nu precizează o curte singulară. O notă poate păstra precizarea lexicală fără a introduce o localizare mai exactă.
  - severity: low
    issue: „Niște orbi și șchiopi” este mai puțin neutru decât necesar.
    rationale: Greaca are adjective substantivizate nearticulate; în română, „orbi și șchiopi” este natural și păstrează concizia fără a modifica referința.
  revised_text: Și au venit la el, în Templu[a], orbi și șchiopi, iar el i-a vindecat.
