id: MAT.21.24
reference: Matthew 21:24
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἐρωτήσω ὑμᾶς κἀγὼ λόγον ἕνα, ὃν ἐὰν εἴπητέ μοι κἀγὼ ὑμῖν ἐρῶ ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/024.yaml
  text: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
translation:
  language: ro
  text: 'Dar Isus le-a răspuns: „Vă voi pune și Eu o întrebare[a]. Dacă Îmi răspundeți, vă voi spune și Eu cu ce autoritate fac aceste lucruri.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „un lucru” ori, mai literal, „un cuvânt”; expresia grecească λόγον ἕνα poate desemna o întrebare sau o chestiune pusă în discuție.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Dar Isus le-a răspuns
  rationale: Construcția participiu plus verb de vorbire este redată idiomatic printr-un singur verb, păstrând caracterul de răspuns; δέ marchează aici un contrast ușor.
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: Vă voi pune și Eu
  rationale: Redarea firească în română pentru introducerea unei întrebări păstrează prin „și Eu” reciprocitatea accentuată de κἀγώ.
- source_word: λόγον ἕνα
  choice: o întrebare
  rationale: Deși λόγος poate însemna literal „cuvânt” sau „chestiune”, contextul schimbului de întrebări indică aici sensul idiomatic de „întrebare”.
- source_word: ὃν ἐὰν εἴπητέ μοι
  choice: Dacă Îmi răspundeți
  rationale: Sensul contextual este acela de a da răspuns la întrebarea pusă. Reformularea într-o propoziție separată este naturală în română și păstrează condiția.
- source_word: κἀγὼ ὑμῖν ἐρῶ
  choice: vă voi spune și Eu
  rationale: Păstrează paralelismul și reciprocitatea celei de-a doua apariții a lui κἀγώ.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: cu ce autoritate
  rationale: Este formula românească firească pentru temeiul sau competența autorizată în baza căreia acționează cineva.
- source_word: ταῦτα ποιῶ
  choice: fac aceste lucruri
  rationale: Păstrează pluralul demonstrativului și prezentul, care se referă la acțiunile lui Isus aflate în discuție.
theological_decisions: []
translation_notes:
  register: Română standard modernă, clară și demnă. Majusculele reverențiale din pronumele referitoare la Isus urmează o convenție editorială românească răspândită, fără a modifica sensul textului-sursă.
