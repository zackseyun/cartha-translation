  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ λαβόντες οἱ γεωργοὶ τοὺς δούλους αὐτοῦ ὃν μὲν ἔδειραν, ὃν δὲ ἀπέκτειναν, ὃν δὲ ἐλιθοβόλησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/035.yaml
  text: And the tenant farmers took his servants; one they beat[a], another they killed, and another they stoned.
translation:
  language: ro
  text: 'Iar arendașii au pus mâna pe robii lui[a]: pe unul l-au bătut, pe altul l-au omorât, iar în altul au aruncat cu pietre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „slujitorii”. Termenul grecesc poate desemna robi sau slujitori, în funcție de context.
    reason: Alternativă lexicală pentru δοῦλοι, care poate accentua fie statutul de dependență, fie rolul de slujire.
lexical_decisions:
- source_word: γεωργοὶ
  choice: arendașii
  rationale: În contextul parabolei, aceștia nu sunt simpli lucrători agricoli, ci oameni cărora proprietarul le-a dat via în arendă. „Arendașii” redă clar relația lor cu proprietarul, iar contextul imediat precizează că este vorba despre o vie.
- source_word: λαβόντες
  choice: i-au prins
  rationale: Participiul exprimă acțiunea anterioară agresiunilor. În română, „i-au prins” este firesc în acest context ostil și evită formularea rigidă „i-au luat”, fără a introduce explicit ideea mai puternică de arestare.
- source_word: δούλους
  choice: robii
  rationale: „Robii” păstrează statutul de subordonare și apartenență exprimat de δοῦλοι, fiind totodată o formulare românească demnă și bine înțeleasă în registrul biblic. Nota semnalează alternativa contextuală „slujitorii”.
- source_word: ἔδειραν
  choice: l-au bătut
  rationale: Redă direct și natural violența verbului δέρω, fără a preciza nejustificat metoda, ca în „l-au biciuit”.
- source_word: ἀπέκτειναν
  choice: l-au omorât
  rationale: Redare directă a verbului „a ucide/a omorî”; nu adaugă nuanța juridică a unei execuții și nici calificarea explicită de omor criminal.
- source_word: ἐλιθοβόλησαν
  choice: l-au împroșcat cu pietre
  rationale: Redă atacul cu pietre fără a afirma în mod nejustificat că victima a murit; verbul grec descrie lapidarea sau atacarea cu pietre, iar rezultatul fatal nu este exprimat aici în mod explicit.
- source_word: ὃν μὲν ... ὃν δὲ ... ὃν δὲ
  choice: pe unul ... pe altul ... iar pe altul
  rationale: Structura distributivă românească distinge limpede tratamentul aplicat fiecărui rob și păstrează succesiunea retorică a textului grec.
theological_decisions:
- issue: Redarea lui δοῦλος în narațiunea parabolică
  choice: robi
  alternative: slujitori
  rationale: „Robi” păstrează mai vizibil statutul de dependență față de stăpân, în timp ce „slujitori” poate descrie mai general funcția lor de trimiși. Ambiguitatea contextuală este păstrată prin nota de subsol, fără a transforma termenul într-un titlu eclezial.
- issue: Rezultatul lapidării
  choice: l-au împroșcat cu pietre
  alternative: l-au ucis cu pietre
  rationale: Textul grec numește actul lapidării, dar nu afirmă separat moartea celui de-al treilea rob. Traducerea nu adaugă un rezultat fatal, păstrând tensiunea și precizia narațiunii.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. „Arendașii” explicitează natural relația agrară din context; „robii” păstrează coloratura socială a termenului grec. Coordonarea cu două apariții ale lui „iar” susține ritmul enumerării fără rigiditate.
