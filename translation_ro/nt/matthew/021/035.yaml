    issue: „i-au prins” pentru λαβόντες
    rationale: Formularea este posibilă, dar poate sugera o capturare sau o urmărire care nu este exprimată. „Au pus mâna pe” redă mai direct acțiunea de a-i apuca/seiza înainte de maltratare.
  - severity: low
    issue: „l-au împroșcat cu pietre” pentru ἐλιθοβόλησαν
    rationale: Este comprehensibil, însă „a împroșca” este mai puțin direct pentru atacul prin aruncare de pietre. „Au aruncat cu pietre în el” este modern, precis și nu adaugă explicit moartea victimei.
