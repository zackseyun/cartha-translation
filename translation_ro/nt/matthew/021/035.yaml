  source_fidelity: Textul redă corect agenții, succesiunea celor trei tratamente și caracterul neletal neexplicit al ultimei acțiuni. Totuși, λαβόντες are aici sensul de „au pus mâna pe / au apucat”, nu neapărat „i-au prins”, care poate sugera capturarea după urmărire. „Au pus mâna pe” este mai apropiat de greacă și firesc în română.
  naturalness: „Arendașii”, „robii” și construcția distributivă sunt inteligibile și potrivite registrului narativ biblic. Pentru ultima acțiune, „au aruncat cu pietre în el” este mai idiomatic și mai transparent decât „l-au împroșcat cu pietre”, fără să implice că omul a murit.
  terminology: „Robii” redă în mod legitim δοῦλοι în acest cadru parabolic, unde subordonarea față de proprietar este relevantă. Nota alternativă „slujitorii” păstrează flexibilitatea lexicală necesară. „Arendașii” exprimă bine rolul lui γεωργοί în contextul viei date în arendă.
