id: MAT.21.21
reference: Matthew 21:21
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐὰν ἔχητε πίστιν καὶ μὴ διακριθῆτε, οὐ μόνον τὸ τῆς συκῆς ποιήσετε, ἀλλὰ κἂν τῷ ὄρει τούτῳ εἴπητε· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, γενήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/021.yaml
  text: But Jesus answered them[a], “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be taken up and thrown into the sea,’ it will happen.”
translation:
  language: ro
  text: 'Dar Isus le-a răspuns: „Adevărat vă spun: dacă aveți credință și nu vă îndoiți[a], nu numai că veți face ce s-a făcut smochinului, ci chiar dacă îi veți spune muntelui acestuia: «Fii ridicat și aruncat în mare!», se va întâmpla.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „nu șovăiți” ori „nu sunteți împărțiți lăuntric”.
    reason: Verbul διακρίνω poate descrie îndoiala, șovăirea sau o stare lăuntrică împărțită.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Dar Isus le-a răspuns
  rationale: Redă idiomatic participiul introductiv ἀποκριθείς și păstrează prin „Dar” tranziția ușor contrastivă marcată de δέ.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Adevărat vă spun
  rationale: Formulă românească firească și solemnă, care păstrează accentul afirmativ și autoritatea rostirii.
- source_word: ἐὰν ἔχητε πίστιν
  choice: dacă aveți credință
  rationale: În context, πίστις indică încrederea fermă în Dumnezeu, nu însușirea de a fi credincios.
- source_word: μὴ διακριθῆτε
  choice: nu vă îndoiți
  rationale: Redă sensul contextual de îndoială sau ezitare lăuntrică; nuanțele apropiate sunt consemnate în nota de subsol.
- source_word: οὐ μόνον τὸ τῆς συκῆς ποιήσετε
  choice: nu numai că veți face ce s-a făcut smochinului
  rationale: Explicitează elipsa grecească τὸ τῆς συκῆς prin trimitere la evenimentul tocmai relatat, fără a adăuga cauza sau mecanismul lui.
- source_word: κἂν τῷ ὄρει τούτῳ εἴπητε
  choice: ci chiar dacă îi veți spune muntelui acestuia
  rationale: „Chiar dacă” păstrează intensificarea introdusă de κἄν, iar demonstrativul este menținut.
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: Ridică-te și aruncă-te în mare!
  rationale: Formularea este o poruncă vie și naturală adresată muntelui. Reflexivul românesc exprimă idiomatic deplasarea cerută, deși greaca folosește două imperative pasive.
- source_word: γενήσεται
  choice: se va întâmpla
  rationale: Redare directă și actuală a viitorului lui γίνομαι, referitor la împlinirea celor poruncite.
theological_decisions:
- issue: Sensul lui πίστις într-o afirmație despre o acțiune extraordinară
  choice: credință
  alternative: încredere; credincioșie
  rationale: Contextul indică o încredere neșovăitoare, nu credincioșia ca trăsătură de caracter; termenul consacrat „credință” păstrează totodată deschiderea teologică a textului.
- issue: Natura afirmației despre mutarea muntelui
  choice: Păstrarea imaginii puternice fără a o limita explicit la un miracol literal sau la o simplă metaforă
  alternative: promisiune exclusiv literală; metaforă exclusivă pentru depășirea dificultăților
  rationale: Textul nu explică aici statutul imaginii. Traducerea îi păstrează forța și tensiunea interpretativă fără a impune o concluzie doctrinară.
translation_notes:
  register: Română standard modernă, clară și demnă. Discursul direct păstrează solemnitatea formulei lui Isus și caracterul viu al poruncii adresate muntelui; exprimările arhaice au fost evitate.
