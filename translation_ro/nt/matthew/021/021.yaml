review_pass:
  verdict: revise
  source_fidelity: Draftul redă corect structura condițională, accentul lui κἄν, elipsa referitoare la smochin și viitorul lui γενήσεται. Totuși, cele două imperative grecești sunt pasive (Ἄρθητι, βλήθητι), în timp ce „Ridică-te și aruncă-te” le transformă în imperative reflexive/active. O redare pasivă este posibilă în română și păstrează mai fidel formularea sursă.
  naturalness: Textul este în general firesc în româna standard modernă. „Fii ridicat și aruncat în mare” este mai solemn decât forma reflexivă, dar este inteligibil, idiomatic în registrul unei rostiri solemne și justificat de fidelitatea față de diateza sursei.
  terminology: „Isus”, „Adevărat vă spun”, „credință”, „nu vă îndoiți” și „mare” sunt potrivite. Nota păstrează bine alternativele semantice ale lui διακρίνω; „împărțiți lăuntric” este mai natural decât „împărțiți în sinea voastră”.
  issues:
  - severity: medium
    issue: Diateza imperativelor adresate muntelui
    rationale: 'Ἄρθητι și βλήθητι sunt imperative pasive: „Ridică-te și aruncă-te” exprimă în română o acțiune reflexivă a muntelui. „Fii ridicat și aruncat în mare” păstrează pasivul fără a interpreta agentul.'
