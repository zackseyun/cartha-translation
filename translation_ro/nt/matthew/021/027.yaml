id: MAT.21.27
reference: Matthew 21:27
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες τῷ Ἰησοῦ εἶπαν· Οὐκ οἴδαμεν. ἔφη αὐτοῖς καὶ αὐτός· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/027.yaml
  text: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
translation:
  language: ro
  text: 'Ei I-au răspuns lui Isus: „Nu știm.” Și El le-a spus: „Nici Eu nu vă spun cu ce autoritate fac aceste lucruri.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: I-au răspuns
  rationale: Participiul introduce replica lor; construcția românească firească exprimă clar răspunsul adresat lui Isus, fără a încărca formularea.
- source_word: Οὐκ οἴδαμεν
  choice: Nu știm
  rationale: Redare directă și idiomatică a negației verbului de cunoaștere.
- source_word: ἔφη
  choice: le-a spus
  rationale: Verbul de vorbire este redat neutru și natural, iar pronumele păstrează destinatarul exprimat în greacă.
- source_word: καὶ αὐτός
  choice: Atunci și El
  rationale: „Și El” păstrează reciprocitatea răspunsului; „Atunci” leagă firesc replica de răspunsul precedent, fără a-i schimba sensul.
- source_word: Οὐδὲ ἐγὼ λέγω ὑμῖν
  choice: Nici Eu nu vă spun
  rationale: Păstrează prezentul lui λέγω și paralelismul emfatic Οὐδὲ ἐγώ, lăsând afirmația să funcționeze contextual ca refuz de a dezvălui informația.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: cu ce autoritate
  rationale: În română, aceasta este formularea naturală pentru temeiul sau mandatul în virtutea căruia cineva acționează.
- source_word: ταῦτα ποιῶ
  choice: fac aceste lucruri
  rationale: Păstrează pluralul demonstrativului și prezentul verbului, referindu-se la acțiunile lui Isus aflate în discuție.
theological_decisions:
- issue: Sensul lui ἐξουσία în răspunsul lui Isus
  choice: autoritate
  alternative: drept; putere
  rationale: Contextul privește legitimitatea și sursa mandatului lui Isus, nu doar capacitatea Sa de a acționa. „Autoritate” păstrează atât dimensiunea juridică, cât și tensiunea teologică.
- issue: Valoarea temporală și pragmatică a lui λέγω
  choice: nu vă spun
  alternative: nu vă voi spune
  rationale: Textul grec folosește prezentul. Româna permite prezentul ca refuz actual și ferm, astfel că forma sursă poate fi păstrată fără a pierde sensul contextual.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Majusculele reverențiale pentru pronumele referitoare la Isus urmează o convenție editorială românească răspândită, fără a adăuga conținut doctrinar.
