  rationale: 'S-a eliminat numai „Atunci”, deoarece nu corespunde unui element din textul grec. Restul formulării este păstrat: „Și El” redă reciprocitatea marcată de καὶ αὐτός, iar refuzul, autoritatea și pluralul acțiunilor rămân fidele sursei.'
