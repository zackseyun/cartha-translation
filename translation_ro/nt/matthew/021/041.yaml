  text: λέγουσιν αὐτῷ· Κακοὺς κακῶς ἀπολέσει αὐτούς, καὶ τὸν ἀμπελῶνα ἐκδώσεται ἄλλοις γεωργοῖς, οἵτινες ἀποδώσουσιν αὐτῷ τοὺς καρποὺς ἐν τοῖς καιροῖς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/041.yaml
  text: They said to him[a], “He will miserably destroy those wretches, and he will lease the vineyard to other farmers[c][b], who will give him the fruits in their seasons.”
translation:
  language: ro
  text: 'I-au spus: „Îi va nimici cumplit pe acei oameni răi[a] și va da via în arendă altor viticultori[b], care îi vor da roadele la termenele cuvenite[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'În greacă apare un joc de cuvinte intensificator, aproximativ: „Pe cei răi îi va pierde rău”. Se poate reda și: „Le va aduce acelor ticăloși un sfârșit jalnic”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „altor arendași”.'
    reason: lexical_alternative
  - marker: c
    text: 'Sau: „care îi vor da recolta la vremea potrivită”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Ei i-au răspuns
  rationale: Prezentul grecesc are funcție de prezent istoric; perfectul compus este firesc în narațiunea românească. În context, vorbirea este un răspuns adresat lui Isus.
- source_word: Κακοὺς κακῶς
  choice: cumplit pe acei oameni răi
  rationale: Perechea adjectiv–adverb din aceeași rădăcină intensifică judecata. Româna nu poate reproduce natural jocul de cuvinte; „cumplit” redă forța, iar „oameni răi” păstrează evaluarea morală.
- source_word: ἀπολέσει
  choice: îi va nimici
  rationale: Verbul exprimă o distrugere hotărâtoare, fără a preciza în mod inutil mijlocul acesteia.
- source_word: τὸν ἀμπελῶνα
  choice: via
  rationale: „Vie” este echivalentul românesc firesc și păstrează imaginea agricolă a parabolei.
- source_word: ἐκδώσεται
  choice: va da ... în arendă
  rationale: În acest context, verbul descrie darea proprietății spre exploatare unor arendași; formularea este exactă și curentă în română.
- source_word: ἄλλοις γεωργοῖς
  choice: altor viticultori
  rationale: Termenul îi desemnează pe cei care cultivă terenul; „viticultori” se potrivește precis unei vii, iar relația de arendă este exprimată de verb.
- source_word: ἀποδώσουσιν αὐτῷ
  choice: îi vor da
  rationale: Verbul poate însemna a da, a restitui sau a achita ceea ce se datorează. Formularea simplă păstrează deschisă nuanța, în timp ce contextul indică obligația arendașilor.
- source_word: τοὺς καρποὺς
  choice: roadele
  rationale: „Roadele” păstrează atât imaginea agricolă, cât și posibila rezonanță figurată.
- source_word: ἐν τοῖς καιροῖς αὐτῶν
  choice: la vremea lor
  rationale: Expresia păstrează pluralitatea implicită a recoltelor și ideea momentelor potrivite pentru predarea roadelor.
theological_decisions:
- issue: Severitatea și natura judecății rostite asupra viticultorilor
  choice: Îi va nimici cumplit pe acei oameni răi
  alternative: Pe cei răi îi va pierde rău; le va aduce acelor ticăloși un sfârșit jalnic
  rationale: Textul grecesc exprimă emfază printr-un joc de cuvinte, nu printr-un termen teologic tehnic. Redarea păstrează gravitatea judecății fără a defini mai precis decât textul forma pedepsei.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Formularea evită atât literalismul nefiresc al jocului de cuvinte grecesc, cât și limbajul confesional specializat; notele păstrează alternativele lexicale relevante.
