  terminology: '„Vie”, „a da în arendă”, „viticultori” și „roade” sunt potrivite. Nota b trebuie corectată: alternativa actuală adaugă nejustificat propoziția „care o vor cultiva”, absentă din expresia alternativă vizată și din nota engleză de audit.'
