source:
  edition: SBLGNT
  text: ἤγαγον τὴν ὄνον καὶ τὸν πῶλον, καὶ ἐπέθηκαν ⸀ἐπ’ αὐτῶν τὰ ⸀ἱμάτια, καὶ ἐπεκάθισεν ἐπάνω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/007.yaml
  text: They brought the donkey and the colt[a], and put their cloaks on them, and he sat on them.
translation:
  language: ro
  text: Au adus măgărița și mânzul, și-au pus mantalele peste animale, iar el S-a așezat pe ele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pronumele final „ele” poate desemna fie animalele, fie, mai precis, mantalele așezate peste animale.
    reason: Păstrează și explică ambiguitatea referentului pluralului αὐτῶν din textul grec, fără a impune una dintre interpretări.
lexical_decisions:
- source_word: ἤγαγον
  choice: Au adus
  rationale: Aoristul lui ἄγω poate însemna „au adus” sau „au dus”; în acest context narativ, „au adus” exprimă firesc faptul că ucenicii au adus animalele la Isus.
- source_word: τὴν ὄνον
  choice: măgărița
  rationale: Substantivul ὄνος poate desemna un măgar în general, dar articolul feminin și asocierea cu mânzul susțin redarea explicită „măgărița”.
- source_word: τὸν πῶλον
  choice: mânzul
  rationale: πῶλος desemnează un animal tânăr; în context este puiul măgăriței. „Mânzul” este concis și firesc în română.
- source_word: τὰ ἱμάτια
  choice: mantalele
  rationale: ἱμάτια se referă aici la veșmintele exterioare ale ucenicilor. „Mantalele” este o redare actuală și potrivită scenei.
- source_word: ἐπ’ αὐτῶν
  choice: peste ei
  rationale: Primul pronume plural se referă în mod natural la cele două animale. Masculinul plural este forma românească obișnuită pentru un grup alcătuit dintr-o măgăriță și un mânz.
- source_word: ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: S-a așezat pe ele
  rationale: Pronumele grecesc este plural și poate avea drept antecedent fie animalele, fie mantalele. Femininul plural „ele” păstrează posibilitatea referirii la mantale, fără a face exprimarea să sugereze atât de direct că Isus S-a așezat simultan pe ambele animale; nota explică ambiguitatea.
theological_decisions:
- issue: Referentul pronumelui plural final αὐτῶν
  choice: 'Textul principal păstrează pronumele plural: „S-a așezat pe ele”.'
  alternative: Pronumele poate fi înțeles ca referindu-se mai precis la mantalele puse peste animale; gramatical, poate fi raportat și la animale.
  rationale: Ambiguitatea este sintactică și narativă, nu trebuie rezolvată tacit. Redarea la plural păstrează forma sursei, iar nota arată antecedentul probabil fără a-l impune în text.
translation_notes:
  register: Română standard modernă, cu formulare narativă demnă și accesibilă. Majuscula reverențială din „S-a” urmează uzul biblic românesc. Marcajul [a] apare în text, deși nota privește ambiguitatea din ultima propoziție, în acord cu poziționarea furnizată în stratul englezesc consultativ.
