  rationale: 'Revizuirea este limitată la forma necesară pentru fidelitatea sintactică: „peste animale” menține sensul primului plural și face posibil ca „ele” din propoziția finală să rămână ambiguu în română. Marcajul notei a fost mutat la pronumele pe care îl explică.'
