  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὅταν οὖν ἔλθῃ ὁ κύριος τοῦ ἀμπελῶνος, τί ποιήσει τοῖς γεωργοῖς ἐκείνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/040.yaml
  text: Therefore[a], when the owner of the vineyard comes[b], what will he do to those farmers?
translation:
  language: ro
  text: Așadar, când va veni stăpânul viei[a], ce le va face acelor cultivatori[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „proprietarul viei”. Termenul grecesc κύριος poate însemna și „domn”, dar aici îl desemnează pe cel care stăpânește via în cadrul parabolei.
    reason: lexical_alternative
  - marker: b
    text: Sau „arendașilor”. Contextul parabolei arată că acești cultivatori primiseră via în arendă, deși termenul grecesc înseamnă mai general „agricultori” sau „cultivatori”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: când
  rationale: Împreună cu conjunctivul ἔλθῃ introduce momentul viitor anticipat în parabolă; „când” este firesc și nu sugerează repetarea proprie lui „ori de câte ori”.
- source_word: οὖν
  choice: așadar
  rationale: Redă concluzia sau tranziția logică de la relatarea parabolei la întrebarea lui Isus.
- source_word: ἔλθῃ
  choice: va veni
  rationale: În română, construcția temporală orientată spre viitor se redă natural prin viitor, păstrând caracterul anticipat al venirii.
- source_word: κύριος
  choice: stăpânul
  rationale: În cadrul parabolei desemnează persoana care are autoritate asupra viei. „Stăpânul viei” este natural în română și nu transformă termenul într-un titlu divin explicit.
- source_word: ἀμπελῶνος
  choice: viei
  rationale: Genitivul românesc al lui „vie” redă concis și idiomatic sintagma „al viei”.
- source_word: τί ποιήσει
  choice: ce le va face
  rationale: Întrebarea cere acțiunea viitoare îndreptată asupra cultivatorilor; pronumele datival „le” redă firesc τοῖς γεωργοῖς.
- source_word: γεωργοῖς
  choice: cultivatorilor
  rationale: γεωργός denumește în sens larg un agricultor sau cultivator. Alegerea evită atât arhaismul „vieri”, cât și introducerea în text a ideii mai precise de arendă, care provine din context.
- source_word: ἐκείνοις
  choice: acelora
  rationale: Păstrează valoarea demonstrativă și ușoara distanțare a termenului grec.
theological_decisions:
- issue: Redarea lui κύριος în cadrul parabolei
  choice: stăpânul
  alternative: proprietarul; Domnul
  rationale: Referentul imediat este stăpânul omenesc al viei din lumea parabolei. „Stăpânul” păstrează autoritatea exprimată de κύριος fără a impune aici folosirea lui ca titlu divin; „proprietarul” este posibil, dar mai îngust juridic.
- issue: Statutul celor numiți γεωργοί
  choice: cultivatori
  alternative: arendași; lucrători ai viei
  rationale: Termenul grec exprimă direct ocupația de cultivatori, în timp ce statutul lor de arendași rezultă din contextul mai larg. Nota păstrează această distincție fără a elimina informația contextuală.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Așadar” păstrează legătura logică, iar ordinea propoziției urmează firesc sintaxa românească. Formularea evită atât terminologia excesiv de tehnică, cât și termeni percepuți astăzi drept arhaici.
