  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου πόθεν ἦν; ἐξ οὐρανοῦ ἢ ἐξ ἀνθρώπων; οἱ δὲ διελογίζοντο ⸀ἐν ἑαυτοῖς λέγοντες· Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ ἡμῖν· Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/025.yaml
  text: The baptism of John—from where was it? From heaven or from men? And they were reasoning among themselves[a], saying, “If we say, ‘From heaven,’ he will say to us[b], ‘Why then did you not believe him?’”
translation:
  language: ro
  text: '„Botezul lui Ioan — de unde era? Din cer sau de la oameni?” Ei discutau între ei[a], zicând: „Dacă spunem: «Din cer», ne va zice: «Atunci de ce nu l-ați crezut?»”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „deliberau între ei”. Expresia grecească poate descrie atât deliberarea, cât și discutarea între ei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: botezul
  rationale: Termenul denumește aici botezul practicat de Ioan, privit ca lucrare și autoritate, iar „botezul” este echivalentul românesc consacrat și firesc.
- source_word: τὸ Ἰωάννου
  choice: lui Ioan
  rationale: Genitivul arată asocierea cu Ioan; formularea românească este naturală și păstrează structura relațională a sursei.
- source_word: πόθεν
  choice: de unde era
  rationale: Adverbul întreabă despre originea sau sursa botezului; „de unde era” redă concis întrebarea în româna actuală.
- source_word: ἐξ οὐρανοῦ
  choice: din cer
  rationale: Păstrează expresia greacă și aluzia reverențială la originea și autorizarea divină, fără a înlocui explicit termenul cu „Dumnezeu”.
- source_word: ἐξ ἀνθρώπων
  choice: de la oameni
  rationale: ἀνθρώπων are sens generic, referindu-se la ființe umane, nu numai la bărbați; expresia indică o origine pur omenească în contrast cu cea cerească.
- source_word: διελογίζοντο ἐν ἑαυτοῖς
  choice: cugetau între ei
  rationale: Imperfectul exprimă o deliberare în desfășurare, iar expresia poate desemna atât reflecția, cât și consultarea lor reciprocă.
- source_word: Ἐὰν εἴπωμεν
  choice: Dacă spunem
  rationale: Redă firesc în română condiția ipotetică exprimată de conjunctivul aorist.
- source_word: ἐρεῖ ἡμῖν
  choice: ne va zice
  rationale: Păstrează introducerea directă a vorbirii și este idiomatic în context.
- source_word: Διὰ τί οὖν
  choice: Atunci de ce
  rationale: Redă forța inferențială a lui οὖν într-o ordine naturală în română.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: nu l-ați crezut
  rationale: Construcția cu dativul indică acceptarea mărturiei și mesajului lui Ioan; „a-l crede” este formularea românească directă.
theological_decisions:
- issue: Sensul expresiei „din cer”
  choice: Păstrarea formulării literale „din cer” în text
  alternative: „de la Dumnezeu”
  rationale: Expresia indică o origine sau autorizare divină, dar păstrarea metaforei sursei conservă formularea greacă și nu transformă aluzia într-o explicitare interpretativă.
- issue: Contrastul dintre οὐρανός și ἄνθρωποι
  choice: „din cer sau de la oameni”
  alternative: „de la Dumnezeu sau de la oameni”
  rationale: Redarea păstrează contrastul retoric original dintre originea cerească și cea omenească, fără a restrânge ἀνθρώπων la persoane de sex masculin.
- issue: Nuanța deliberării în διελογίζοντο ἐν ἑαυτοῖς
  choice: „cugetau între ei”
  alternative: „se sfătuiau între ei”
  rationale: Alegerea păstrează tensiunea dintre raționarea lăuntrică și consultarea reciprocă, fără a impune exclusiv una dintre nuanțe.
translation_notes:
  register: Română modernă standard, cu registru demn și accesibil. „Din cer” este păstrat pentru fidelitate față de idiomul sursei, iar „de la oameni” evită folosirea generică, astăzi ambiguă, a substantivului „bărbați” sau „oameni” în sens masculin.
