  text: πάλιν ἀπέστειλεν ἄλλους δούλους πλείονας τῶν πρώτων, καὶ ἐποίησαν αὐτοῖς ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/036.yaml
  text: Again he sent other servants[a], more than the first ones, and they did the same to them.
translation:
  language: ro
  text: Din nou, a trimis alți slujitori[a], mai mulți decât cei dintâi, iar ei le-au făcut și acestora la fel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „alți robi”. Termenul grecesc poate însemna „slujitori” sau „robi”, în funcție de context.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: din nou
  rationale: Redă firesc repetarea acțiunii în succesiunea narativă.
- source_word: ἀπέστειλεν
  choice: a trimis
  rationale: Echivalentul românesc simplu și exact al aoristului narativ; „a expediat” ar fi nefiresc aici.
- source_word: ἄλλους δούλους
  choice: alți slujitori
  rationale: În contextul parabolei, accentul cade pe rolul lor de trimiși ai stăpânului, nu pe statutul juridic; alternativa „robi” este păstrată în notă.
- source_word: πλείονας τῶν πρώτων
  choice: mai mulți decât cei dintâi
  rationale: Exprimă limpede faptul că al doilea grup era mai numeros decât primul.
- source_word: ἐποίησαν αὐτοῖς ὡσαύτως
  choice: le-au făcut la fel
  rationale: Păstrează formularea anaforică și lasă contextul versetului anterior să precizeze relele tratamente.
theological_decisions:
- issue: Redarea termenului δοῦλος în parabolă
  choice: slujitori
  alternative: robi
  rationale: „Slujitori” este natural în româna actuală și se potrivește rolului narativ al mesagerilor, fără a nega sensul posibil de persoane aflate în robie, consemnat în nota de subsol.
translation_notes:
  register: Română standard modernă, clară și demnă. „Cei dintâi” păstrează un ton biblic moderat, dar rămâne ușor de înțeles; topica evită ambiguitatea privind grupul mai numeros.
