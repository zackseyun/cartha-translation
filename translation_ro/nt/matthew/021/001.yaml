id: MAT.21.1
reference: Matthew 21:1
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤγγισαν εἰς Ἱεροσόλυμα καὶ ἦλθον εἰς Βηθφαγὴ ⸀εἰς τὸ Ὄρος τῶν Ἐλαιῶν, τότε ⸀Ἰησοῦς ἀπέστειλεν δύο μαθητὰς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/001.yaml
  text: And when they came near to Jerusalem and came to Bethphage[a], to the Mount of Olives, then Jesus sent two disciples
translation:
  language: ro
  text: Când s-au apropiat de Ierusalim și au ajuns la Betfaghe, la Muntele Măslinilor, atunci Isus a trimis doi ucenici.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγγισαν
  choice: s-au apropiat
  rationale: Redă firesc sensul spațial al aoristului lui ἐγγίζω și păstrează mișcarea către Ierusalim.
- source_word: Ἱεροσόλυμα
  choice: Ierusalim
  rationale: Forma consacrată în limba română pentru numele cetății.
- source_word: ἦλθον
  choice: au ajuns
  rationale: În contextul succesiunii geografice, exprimă atingerea localității Betfaghe și diferențiază natural al doilea verb de «s-au apropiat».
- source_word: Βηθφαγὴ
  choice: Betfaghe
  rationale: Transliterare românească recognoscibilă a numelui localității.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: la Muntele Măslinilor
  rationale: «La» redă idiomatic raportarea geografică a Betfaghei la munte, fără a sugera intrarea în munte; păstrează totodată direcția sau localizarea permisă de εἰς.
- source_word: τότε
  choice: atunci
  rationale: Marchează simplu și fidel tranziția narativă.
- source_word: ἀπέστειλεν
  choice: a trimis
  rationale: Redarea directă și firească a acțiunii prin care Isus le încredințează ucenicilor o însărcinare.
- source_word: δύο μαθητὰς
  choice: doi ucenici
  rationale: Echivalentul românesc uzual și exact în contextul narativ al Evangheliilor.
theological_decisions:
- issue: Subiectul verbelor la plural înainte ca Isus să fie numit
  choice: 'Păstrarea subiectului implicit: «s-au apropiat... au ajuns», iar Isus este numit acolo unde apare în greacă.'
  alternative: Explicitarea prin «Isus și ucenicii săi s-au apropiat...»
  rationale: Textul grec presupune grupul din context, dar nu îl numește explicit în acest vers; formularea aleasă păstrează economia narativă și evită adăugarea unui subiect.
- issue: Relația geografică exprimată de εἰς înainte de «Muntele Măslinilor»
  choice: «la Muntele Măslinilor»
  alternative: «spre Muntele Măslinilor» sau «pe Muntele Măslinilor»
  rationale: Construcția poate avea nuanță direcțională ori localizatoare. «La» păstrează o anumită deschidere și sună natural, fără să afirme mai precis decât textul dacă Betfaghe se afla propriu-zis pe munte.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Conjuncția inițială grecească este redată prin legătura temporală «Când», evitând un «Și» greoi la început, iar «atunci» este păstrat pentru τότε. Nu este necesară o notă de subsol, deoarece alternativa lexicală nu schimbă substanțial sensul și poate fi reprezentată adecvat în text.
