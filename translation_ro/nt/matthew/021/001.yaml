  verdict: approve
  source_fidelity: 'Textul redă fidel succesiunea greacă: apropierea de Ierusalim, sosirea la Betfaghe în raport cu Muntele Măslinilor și trimiterea a doi ucenici de către Isus. Subiectul plural rămâne implicit, ca în greacă. «La Muntele Măslinilor» păstrează prudent ambiguitatea relației geografice exprimate de εἰς.'
  naturalness: Formularea este firească în româna standard modernă. Construcția corelativă «Când ... atunci» este puțin mai solemnă, dar este naturală în registru narativ-biblic și reflectă bine ὅτε ... τότε.
  terminology: «Ierusalim», «Betfaghe», «Muntele Măslinilor», «Isus» și «ucenici» sunt forme românești consacrate și potrivite. Nu apar termeni teologici care să necesite precizare suplimentară.
