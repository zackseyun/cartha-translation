id: MAT.21.29
reference: Matthew 21:29
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Οὐ θέλω· ὕστερον δὲ μεταμεληθεὶς⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/029.yaml
  text: But he answered[b][a], ‘I do not want to.’ But later he changed his mind and went.
translation:
  language: ro
  text: 'El însă a răspuns: „Nu vreau.” Dar mai târziu s-a răzgândit[a] și s-a dus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „a regretat” ori „și-a schimbat hotărârea”. Verbul grecesc poate desemna regretul care duce la schimbarea hotărârii.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: a răspuns
  rationale: Formula narativă participială este redată firesc în română printr-un singur verb la mod personal, fără pierdere de sens.
- source_word: Οὐ θέλω
  choice: Nu vreau
  rationale: Redă direct voința și refuzul personal al fiului, într-o română actuală, fără a întări nejustificat sensul spre „Nu mă voi duce”.
- source_word: ὕστερον
  choice: mai târziu
  rationale: Exprimă limpede succesiunea temporală indicată de adverb.
- source_word: μεταμεληθεὶς
  choice: s-a răzgândit
  rationale: În context, participiul indică o schimbare a hotărârii, posibil însoțită de regret, care duce la o conduită diferită; formularea evită termenul teologic mai specific „s-a pocăit”.
- source_word: ἀπῆλθεν
  choice: s-a dus
  rationale: În contextul poruncii de a lucra în vie, verbul indică faptul că fiul s-a dus să împlinească cererea; aceasta este formularea românească cea mai firească.
theological_decisions:
- issue: Sensul lui μεταμεληθεὶς în cadrul pildei
  choice: s-a răzgândit
  alternative: i-a părut rău; s-a căit; s-a pocăit
  rationale: Textul accentuează trecerea de la refuz la ascultare. „S-a răzgândit” păstrează această schimbare de direcție și lasă deschisă nuanța regretului, fără a introduce în mod explicit un sens tehnic al pocăinței.
translation_notes:
  register: Română literară modernă, directă și demnă. Construcția participială grecească a fost transpusă prin verbe la mod personal pentru fluență, iar contrastul marcat de δέ a fost păstrat prin „însă” și „dar”.
