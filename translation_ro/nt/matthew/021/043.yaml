  terminology: „Împărăția lui Dumnezeu” este consacrat și adecvat. „Popor” este o redare modernă și neutră pentru ἔθνει; nota păstrează opțiunile „neam” și „națiune”, fără a identifica referentul cu un grup teologic determinat.
