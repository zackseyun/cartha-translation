id: MAT.21.43
reference: Matthew 21:43
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν ὅτι ἀρθήσεται ἀφ’ ὑμῶν ἡ βασιλεία τοῦ θεοῦ καὶ δοθήσεται ἔθνει ποιοῦντι τοὺς καρποὺς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/043.yaml
  text: Therefore I tell you[a], the kingdom of God will be taken away from you and given to a nation producing its fruits.
translation:
  language: ro
  text: De aceea vă spun că Împărăția lui Dumnezeu va fi luată de la voi și va fi dată unui popor[a] care produce roadele ei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „unui neam” sau „unei națiuni”. Termenul grecesc ἔθνος poate desemna un neam, o națiune sau un popor; aici este vorba despre o colectivitate recunoscută după roadele ei, fără ca identitatea acesteia să fie precizată mai îndeaproape.
    reason: alternativă lexicală și păstrarea ambiguității referentului
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: De aceea
  rationale: Introduce firesc concluzia trasă din parabola și citatul precedente și păstrează forța logică a expresiei.
- source_word: λέγω ὑμῖν
  choice: vă spun
  rationale: Formulă directă și naturală în româna contemporană, care păstrează adresarea personală la plural.
- source_word: ἀρθήσεται ἀφ’ ὑμῶν
  choice: va fi luată de la voi
  rationale: Redă viitorul pasiv și ideea de îndepărtare de la posesorii actuali, fără a intensifica sensul.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Împărăția lui Dumnezeu
  rationale: Formulare consacrată și exactă, care păstrează atât dimensiunea domniei, cât și pe cea a sferei acesteia.
- source_word: δοθήσεται
  choice: va fi dată
  rationale: Păstrează explicit viitorul pasiv și paralelismul cu „va fi luată”.
- source_word: ἔθνει
  choice: unui neam
  rationale: „Neam” poate desemna în română o colectivitate sau un popor și păstrează caracterul corporativ al destinatarului fără a-l identifica explicit cu neamurile, Biserica ori o anumită etnie.
- source_word: ποιοῦντι
  choice: care îi va aduce
  rationale: În asociere cu roadele, „a aduce roade” este idiomatic în română și exprimă producerea lor; viitorul se integrează natural în enunțul despre destinatarul viitor.
- source_word: τοὺς καρποὺς αὐτῆς
  choice: îi va aduce roadele
  rationale: Păstrează pluralul „roadele”, iar pronumele neaccentuat „îi” trimite la Împărăție, redând referința lui αὐτῆς fără o construcție greoaie.
theological_decisions:
- issue: Referentul lui ἔθνει
  choice: „unui neam”, fără identificare teologică mai îngustă
  alternative: „unui popor”; identificarea explicită drept Biserica, neamurile sau un Israel reînnoit
  rationale: Greaca indică un corp colectiv caracterizat prin rodire, dar nu impune în traducere una dintre identificările teologice ulterioare.
- issue: Sensul expresiei „Împărăția lui Dumnezeu” în această sentință de judecată
  choice: Păstrarea expresiei „Împărăția lui Dumnezeu”
  alternative: „domnia lui Dumnezeu” sau o parafrază precum „privilegiile Împărăției”
  rationale: Formularea păstrează întreaga amplitudine semantică și tensiunea teologică a expresiei grecești, fără să reducă Împărăția la un singur aspect.
- issue: Referința pronumelui αὐτῆς
  choice: 'Pronumele se referă la Împărăție: „îi va aduce roadele”'
  alternative: Înțelegerea roadelor ca aparținând neamului sau folosirea unei formulări fără referință explicită
  rationale: Acordul feminin singular indică în mod firesc βασιλεία, astfel că textul vorbește despre roadele Împărăției.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. „Împărăția lui Dumnezeu” păstrează formularea biblică bine cunoscută; „va fi luată… va fi dată” redă paralelismul pasivelor grecești. „Neam” este folosit în sens colectiv, iar nota oferă alternativa mai transparentă „popor”.
