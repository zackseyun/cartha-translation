id: MAT.21.38
reference: Matthew 21:38
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οἱ δὲ γεωργοὶ ἰδόντες τὸν υἱὸν εἶπον ἐν ἑαυτοῖς· Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτὸν καὶ ⸀σχῶμεν τὴν κληρονομίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/038.yaml
  text: But when the tenant farmers saw the son[a], they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’
translation:
  language: ro
  text: 'Dar arendașii, când l-au văzut pe fiu, și-au spus între ei: „Acesta este moștenitorul. Haideți să-l omorâm și să punem mâna pe moștenirea lui[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mai literal: „să avem moștenirea lui”; în context, sensul este „să intrăm în stăpânirea ei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: arendașii
  rationale: În context, aceștia nu sunt simpli lucrători agricoli, ci oameni cărora proprietarul le-a încredințat via în schimbul unei părți din rod. „Arendașii” exprimă firesc rolul lor social și juridic în româna actuală.
- source_word: ἰδόντες
  choice: când l-au văzut
  rationale: Participiul aorist este redat printr-o propoziție temporală idiomatică, păstrând succesiunea acțiunilor.
- source_word: τὸν υἱὸν
  choice: pe fiu
  rationale: Greaca are articolul hotărât, fără posesiv explicit. Formularea păstrează nivelul narativ al parabolei și nu explicitează în text identificarea cristologică.
- source_word: ἐν ἑαυτοῖς
  choice: între ei
  rationale: Expresia indică o deliberare în interiorul grupului; „între ei” este natural și limpede în română.
- source_word: κληρονόμος
  choice: moștenitorul
  rationale: Este echivalentul românesc standard, păstrând sensul juridic și legătura lexicală cu „moștenirea”.
- source_word: δεῦτε
  choice: Haideți
  rationale: În acest context, particula introduce un îndemn colectiv. „Haideți” redă natural forța exhortativă în româna modernă.
- source_word: ἀποκτείνωμεν
  choice: să-l omorâm
  rationale: Redă direct conjunctivul hortativ fără a adăuga nuanța juridică a lui „a executa” sau caracterizarea explicită implicată de „a asasina”.
- source_word: σχῶμεν
  choice: să punem mâna pe
  rationale: Deși verbul provine din ἔχω, „a avea”, contextul uciderii moștenitorului indică însușirea moștenirii. Expresia românească redă firesc intenția ostilă, iar sensul mai literal este păstrat în notă.
- source_word: κληρονομίαν αὐτοῦ
  choice: moștenirea lui
  rationale: Redă explicit pronumele αὐτοῦ și păstrează relația semantică directă cu „moștenitorul”.
theological_decisions:
- issue: Referința parabolică la fiu
  choice: „pe fiu”, fără identificarea explicită a acestuia cu Isus în textul versetului
  alternative: O formulare interpretativă care să semnaleze direct că fiul îl reprezintă pe Isus
  rationale: În narațiunea lui Matei, parabola trimite clar spre Isus, dar versetul rămâne la nivelul povestirii. Redarea simplă păstrează tensiunea teologică și nu introduce interpretarea în text.
translation_notes:
  register: Română standard modernă, clară și demnă. „Arendașii” precizează statutul personajelor fără o perifrază greoaie, iar „să punem mâna pe” păstrează caracterul direct și violent al planului lor. Marcajul notei este așezat lângă expresia pe care o explică.
