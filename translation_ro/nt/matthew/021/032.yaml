source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ⸂Ἰωάννης πρὸς ὑμᾶς⸃ ἐν ὁδῷ δικαιοσύνης, καὶ οὐκ ἐπιστεύσατε αὐτῷ· οἱ δὲ τελῶναι καὶ αἱ πόρναι ἐπίστευσαν αὐτῷ· ὑμεῖς δὲ ἰδόντες ⸀οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/032.yaml
  text: For John came to you in the way of righteousness[a], and you did not believe him; but the tax collectors and the prostitutes believed him. But even after seeing this[c][b], you did not afterward change your minds so as to believe him.
translation:
  language: ro
  text: Căci Ioan a venit la voi pe calea dreptății[a], iar voi nu l-ați crezut; însă colectorii de taxe și prostituatele l-au crezut. Dar voi, chiar și după ce ați văzut aceasta, nici măcar după aceea nu v-ați schimbat gândul ca să-l credeți.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „într-un mod drept” ori „pe calea dreptății”. Expresia grecească poate descrie atât felul drept în care a trăit și a slujit Ioan, cât și calea dreptății pe care a vestit-o.
    reason: lexical_alternative
  - marker: b
    text: Sau „nu v-ați căit nici după aceea, ca să vă încredeți în el”. Verbul grecesc de aici indică mai precis o schimbare a gândului sau regretul și nu este verbul redat de obicei prin „a se pocăi”; iar „a-l crede” poate avea și sensul de „a se încrede în el”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν γὰρ Ἰωάννης πρὸς ὑμᾶς
  choice: Căci Ioan a venit la voi
  rationale: Redă direct legătura explicativă introdusă de γάρ și sensul obișnuit al lui ἔρχομαι și πρός cu acuzativul.
- source_word: ἐν ὁδῷ δικαιοσύνης
  choice: pe calea dreptății
  rationale: Păstrează metafora căii și ambiguitatea dintre purtarea sau slujirea dreaptă a lui Ioan și calea dreaptă pe care a vestit-o.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ / ἐπίστευσαν αὐτῷ
  choice: nu l-ați crezut / l-au crezut
  rationale: Construcția πιστεύω cu dativul indică aici acceptarea ca adevărată a persoanei și a mesajului ei; formularea consecventă evită introducerea ideii mai specifice de „a crede în” cineva.
- source_word: οἱ τελῶναι
  choice: colectorii de taxe
  rationale: Echivalent modern și clar pentru persoanele care colectau taxele și dările în sistemul antic.
- source_word: αἱ πόρναι
  choice: prostituatele
  rationale: Echivalent lexical direct, care păstrează forța socială și morală a termenului în context.
- source_word: ἰδόντες
  choice: după ce ați văzut aceasta
  rationale: Participiul aorist este redat temporal, iar „aceasta” explicitează firesc răspunsul colectorilor de taxe și al prostituatelor.
- source_word: οὐδὲ μετεμελήθητε ὕστερον
  choice: nu v-ați schimbat nici după aceea gândul
  rationale: Păstrează valoarea lui μεταμέλομαι ca schimbare a gândului sau regret ulterior și redă atât οὐδέ, cât și ὕστερον, fără a-l confunda automat cu μετανοέω.
- source_word: τοῦ πιστεῦσαι αὐτῷ
  choice: ca să-l credeți
  rationale: Infinitivul articular exprimă rezultatul sau scopul schimbării care nu a avut loc.
theological_decisions:
- issue: Sensul expresiei ἐν ὁδῷ δικαιοσύνης
  choice: pe calea dreptății
  alternative: într-un mod drept; pe calea cea dreaptă
  rationale: Formularea păstrează imaginea biblică a căii și nu decide dacă accentul cade exclusiv pe viața și slujirea lui Ioan ori pe calea dreaptă vestită de el.
- issue: Sensul lui πιστεύω cu dativul αὐτῷ
  choice: a-l crede
  alternative: a se încrede în el; a crede în el
  rationale: Contextul privește răspunsul la Ioan și la mesajul lui. „A-l crede” conservă construcția relațională fără a importa o formulă teologică mai dezvoltată.
- issue: Distincția dintre μεταμέλομαι și μετανοέω
  choice: a-și schimba gândul
  alternative: a se pocăi; a regreta
  rationale: Alegerea păstrează nuanța lexicală proprie lui μεταμέλομαι, fără să elimine implicația morală a schimbării cerute de context.
translation_notes:
  register: Română standard modernă, clară și demnă. Sintaxa urmărește contrastul emfatic din greacă, iar repetiția lui „l-au/l-ați crezut” este păstrată pentru coeziune. „Colectorii de taxe” este preferat termenului istoric, dar astăzi mai puțin transparent, „vameșii”.
