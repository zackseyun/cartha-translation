source:
  edition: SBLGNT
  text: τίς ἐκ τῶν δύο ἐποίησεν τὸ θέλημα τοῦ πατρός; ⸀λέγουσιν· Ὁ ⸀πρῶτος. λέγει αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν λέγω ὑμῖν ὅτι οἱ τελῶναι καὶ αἱ πόρναι προάγουσιν ὑμᾶς εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/031.yaml
  text: Which of the two did the will of the father? They said[a], “The first.” Jesus said to them, “Truly I say to you, the tax collectors and the prostitutes are going ahead of you into the kingdom of God.”
translation:
  language: ro
  text: 'Care dintre cei doi a făcut voia tatălui? Ei au răspuns: „Cel dintâi.” Isus le-a zis: „Adevărat vă spun că vameșii și prostituatele vă merg înainte[a] în Împărăția lui Dumnezeu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „intră în Împărăția lui Dumnezeu înaintea voastră”. În greacă, expresia spune literal că „vă merg înainte” și subliniază precedența, fără a afirma neapărat excluderea lor definitivă.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐκ τῶν δύο
  choice: Care dintre cei doi
  rationale: Redare firească în română, păstrând sensul partitiv al construcției grecești.
- source_word: ἐποίησεν τὸ θέλημα τοῦ πατρός
  choice: a făcut voia tatălui
  rationale: Expresie românească naturală și apropiată formal de greacă; „tatălui” se referă aici la tatăl din parabolă.
- source_word: Ὁ πρῶτος
  choice: Cel dintâi
  rationale: Răspuns eliptic, clar și demn în româna actuală.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Adevărat vă spun
  rationale: Redă forța formulei solemne a lui Isus într-o formă consacrată și ușor de înțeles.
- source_word: τελῶναι
  choice: vameșii
  rationale: Echivalentul biblic românesc standard pentru agenții fiscali stigmatizați social din contextul evanghelic.
- source_word: πόρναι
  choice: prostituatele
  rationale: Termen modern, precis și ne-arhaic pentru femeile desemnate de substantivul grecesc.
- source_word: προάγουσιν ὑμᾶς
  choice: merg înaintea voastră
  rationale: Păstrează imaginea verbală și aspectul prezent al grecei, exprimând precedența fără a afirma explicit excluderea definitivă a interlocutorilor.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: în Împărăția lui Dumnezeu
  rationale: Formulare românească standard care păstrează direcția exprimată de εἰς și sintagma teologică deplină.
theological_decisions:
- issue: Forța expresiei προάγουσιν ὑμᾶς cu privire la intrarea în Împărăție
  choice: merg înaintea voastră în Împărăția lui Dumnezeu
  alternative: intră în Împărăția lui Dumnezeu înaintea voastră
  rationale: Verbul προάγω exprimă mersul înainte sau precedarea. Redarea aleasă păstrează avertismentul și prioritatea surprinzătoare, fără să transforme implicit precedența într-o afirmație categorică despre excluderea finală a conducătorilor religioși.
translation_notes:
  register: Română standard modernă, cu formulare demnă și accesibilă. „Cel dintâi” și „Adevărat vă spun” păstrează registrul biblic fără arhaisme greu de înțeles; punctuația dialogului urmează uzul editorial românesc.
