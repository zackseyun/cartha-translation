id: MAT.21.44
reference: Matthew 21:44
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ⸂Καὶ ὁ πεσὼν ἐπὶ τὸν λίθον τοῦτον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ λικμήσει αὐτόν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/044.yaml
  text: And the one who falls on this stone will be broken to pieces[a]; but on whomever it falls[b], it will crush him.
translation:
  language: ro
  text: Cel ce va cădea peste piatra aceasta va fi sfărâmat; iar pe cel peste care va cădea ea îl va zdrobi[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Verbul poate avea sensul mai viu de „îl va preface în pulbere” sau „îl va împrăștia ca pe pleavă”.
    reason: lexical_alternative
  - marker: b
    text: Versetul lipsește din unele manuscrise ale Evangheliei după Matei, dar are o paralelă în Luca 20:18.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ πεσὼν
  choice: cel ce va cădea
  rationale: Participiul articulat are valoare substantivală și generică. Formularea păstrează singularul și caracterul proverbial într-o română firească.
- source_word: ἐπὶ τὸν λίθον τοῦτον
  choice: peste piatra aceasta
  rationale: Redă relația spațială și păstrează imaginea concretă a pietrei din contextul imediat.
- source_word: συνθλασθήσεται
  choice: va fi sfărâmat
  rationale: Viitorul pasiv exprimă faptul că persoana va suferi o zdrobire gravă. „Sfărâmat” păstrează totodată o distincție lexicală față de λικμήσει.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: iar pe cel peste care va cădea ea
  rationale: Construcția relativă nedefinită este redată direct, iar pronumele „ea” clarifică firesc în română că piatra este subiectul căderii, fără adaos interpretativ.
- source_word: λικμήσει
  choice: îl va zdrobi
  rationale: Verbul descrie o nimicire prin zdrobire, putând sugera pulverizarea sau împrăștierea ca pleava. „Va zdrobi” este limpede și viguros, iar nuanța mai intensă este consemnată în nota de subsol.
- source_word: αὐτόν
  choice: îl
  rationale: Pronumele masculin singular reia persoana generică exprimată prin „cel” și păstrează numărul și forma reprezentativă a textului grec.
theological_decisions:
- issue: Imaginea pietrei și metafora judecății
  choice: Păstrarea limbajului concret despre piatră și a celor două acțiuni distincte, fără identificare explicită în verset
  alternative: Identificarea explicită a pietrei cu Isus/Mesia sau uniformizarea celor două verbe într-o singură formulare despre distrugere
  rationale: Contextul explică imaginea pietrei, însă versetul însuși o formulează proverbial. Traducerea păstrează tensiunea și gravitatea imaginii fără să introducă în text o interpretare teologică suplimentară.
- issue: Referința generică la masculin singular
  choice: „cel” și „îl”
  alternative: O formulare la plural sau una impersonală
  rationale: Greaca folosește o construcție generică la masculin singular; româna o poate reda natural și fidel prin „cel” și pronumele „îl”.
- issue: Prezența versetului în tradiția manuscrisă
  choice: Versetul este tradus în text, cu semnalarea variantei într-o notă
  alternative: Omiterea versetului din textul principal
  rationale: SBLGNT tipărește versetul între semne editoriale de incertitudine textuală. Nota păstrează transparent dovada manuscrisă divergentă și menționează paralela din Luca.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Sintaxa păstrează paralelismul sentențios al grecei, iar „ea” evită ambiguitatea referentului fără a explica metafora în text.
