id: MAT.21.33
reference: Matthew 21:33
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἀκούσατε. ⸀Ἄνθρωπος ἦν οἰκοδεσπότης ὅστις ἐφύτευσεν ἀμπελῶνα καὶ φραγμὸν αὐτῷ περιέθηκεν καὶ ὤρυξεν ἐν αὐτῷ ληνὸν καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/033.yaml
  text: 'Listen to another parable: There was a landowner who planted a vineyard and put a fence around it and dug a winepress in it and built a tower[a], and leased it to tenant farmers[c][b], and went away.'
translation:
  language: ro
  text: '„Ascultați o altă parabolă: Era un proprietar care a sădit o vie, a împrejmuit-o cu un gard[b], a săpat în ea un teasc și a construit un turn[a]. Apoi a dat-o în arendă unor viticultori[c] și a plecat.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Imaginea viei sădite și împrejmuite, cu un teasc săpat și un turn construit, evocă Isaia 5:1–2.
    reason: cross_reference
  - marker: b
    text: Sau „cu un gard viu”. Termenul grecesc poate desemna diferite feluri de bariere de împrejmuire, inclusiv un gard ori un gard viu.
    reason: lexical_alternative
  - marker: c
    text: Sau „a închiriat-o unor agricultori”. Expresia se referă la darea viei unor cultivatori care aveau să o lucreze.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἀκούσατε
  choice: Ascultați o altă parabolă
  rationale: Imperativul plural ἀκούσατε este redat firesc prin „Ascultați”, iar „parabolă” este termenul consacrat și precis în contextul învățăturii lui Isus.
- source_word: Ἄνθρωπος ἦν οἰκοδεσπότης
  choice: Era un proprietar
  rationale: οἰκοδεσπότης desemnează stăpânul sau proprietarul unei gospodării ori moșii; în cadrul agricol al pildei, „proprietar” exprimă natural rolul său, fără formularea rigidă „stăpân al casei”.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: a sădit o vie
  rationale: Redarea concretă păstrează atât sensul direct al verbului φυτεύω, cât și imaginea viticolă care evocă Isaia 5.
- source_word: φραγμὸν αὐτῷ περιέθηκεν
  choice: a împrejmuit-o cu un gard
  rationale: φραγμός indică o barieră de împrejmuire, care putea fi gard sau gard viu; formularea aleasă este clară și curentă, iar alternativa este consemnată în notă.
- source_word: ὤρυξεν ἐν αὐτῷ ληνὸν
  choice: a săpat în ea un teasc
  rationale: ληνός este un teasc pentru struguri, iar ὀρύσσω înseamnă „a săpa”; „teasc” păstrează concis imaginea agricolă tradițională și este inteligibil în româna actuală.
- source_word: ᾠκοδόμησεν πύργον
  choice: a construit un turn
  rationale: πύργος înseamnă „turn”. Funcția probabilă de supraveghere nu este explicitată în greacă și nu este introdusă în text.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: a dat-o în arendă unor viticultori
  rationale: Forma medie a lui ἐκδίδωμι exprimă darea în arendă, iar γεωργοί îi desemnează pe cultivatorii care urmau să lucreze via. „Viticultori” este contextual, iar nota păstrează alternativa mai explicit economică.
- source_word: ἀπεδήμησεν
  choice: a plecat
  rationale: ἀποδημέω arată plecarea de acasă sau într-o călătorie; „a plecat” redă sensul fără a adăuga o destinație ori ideea explicită a unei țări străine.
theological_decisions:
- issue: Ecoul imaginii viei din Isaia 5:1–2
  choice: Păstrarea imaginilor agricole concrete, cu trimiterea intertextuală într-o notă
  alternative: Folosirea în text a unor formulări mai arhaice sau explicite pentru a accentua aluzia
  rationale: Textul evocă puternic Isaia 5, dar traducerea nu trebuie să transforme aluzia în explicație. Limbajul concret o păstrează, iar nota îl ajută pe cititor să recunoască legătura.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. S-a păstrat succesiunea vie a acțiunilor și vocabularul agricol concret, evitându-se atât arhaismele inutile, cât și explicitările interpretative în textul principal.
