id: MAT.21.26
reference: Matthew 21:26
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, φοβούμεθα τὸν ὄχλον, πάντες γὰρ ⸂ὡς προφήτην ἔχουσιν τὸν Ἰωάννην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/026.yaml
  text: But if we say[a], ‘From men,’ we fear the crowd, for they all regard John as a prophet.
translation:
  language: ro
  text: 'Dar, dacă spunem: „De la oameni”[a], ne temem de mulțime, fiindcă toți îl socotesc pe Ioan drept profet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „De origine omenească”.'
    reason: Alternativă lexicală ce explicitează faptul că expresia indică sursa umană, în contrast cu cea cerească.
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: Dar, dacă spunem
  rationale: Construcția cu ἐὰν și conjunctivul aorist exprimă o posibilitate condițională în deliberarea vorbitorilor; formularea românească este firească și păstrează această nuanță.
- source_word: Ἐξ ἀνθρώπων
  choice: De la oameni
  rationale: Păstrează contrastul concis dintre originea cerească și cea omenească din versetul precedent; termenul se referă aici la sursa umană, nu exclusiv la persoane de sex masculin.
- source_word: φοβούμεθα τὸν ὄχλον
  choice: ne temem de mulțime
  rationale: Redă direct verbul cu sens activ și substantivul care desemnează grupul adunat.
- source_word: πάντες
  choice: toți
  rationale: Păstrează afirmația cuprinzătoare despre cei din mulțime, subiectul fiind ușor de recuperat din context.
- source_word: ὡς προφήτην ἔχουσιν τὸν Ἰωάννην
  choice: îl socotesc pe Ioan drept profet
  rationale: Redă idiomatic construcția ἔχω cu ὡς, care exprimă felul în care cineva este considerat.
theological_decisions:
- issue: Contrastul dintre sursa cerească și cea omenească
  choice: De la oameni
  alternative: De origine omenească
  rationale: Varianta din text păstrează forma scurtă și contrastul explicit al grecei, iar nota clarifică sensul posibil fără a-l impune în text.
- issue: Felul în care mulțimea îl privește pe Ioan
  choice: toți îl socotesc pe Ioan drept profet
  alternative: toți îl consideră pe Ioan un profet
  rationale: Formularea relatează convingerea mulțimii fără să adauge o evaluare doctrinară sau să extindă afirmația dincolo de context.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „A socoti drept” este o formulare curentă, dar suficient de elevată pentru narațiunea biblică.
source_grounding:
  english_pob_role: consult_only
