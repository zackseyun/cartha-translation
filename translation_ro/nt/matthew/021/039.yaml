  text: καὶ λαβόντες αὐτὸν ἐξέβαλον ἔξω τοῦ ἀμπελῶνος καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/039.yaml
  text: And they took him[a], threw him out of the vineyard, and killed him.
translation:
  language: ro
  text: Și l-au luat, l-au aruncat afară din vie și l-au omorât.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: punând mâna pe el
  rationale: Participiul aorist indică prinderea lui înaintea acțiunilor următoare. Expresia românească este firească în context și sugerează capturarea fără a intensifica nejustificat sensul până la „l-au înșfăcat”.
- source_word: ἐξέβαλον
  choice: l-au aruncat afară
  rationale: Verbul exprimă scoaterea fizică, energică, iar formularea redă natural atât acțiunea, cât și direcția indicată de ἔξω.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: afară din vie
  rationale: Construcția păstrează mișcarea din interiorul viei spre exterior și se leagă idiomatic de „l-au aruncat afară”.
- source_word: ἀμπελῶνος
  choice: vie
  rationale: „Vie” este termenul românesc standard, precis și firesc pentru ἀμπελών în acest context parabolic.
- source_word: ἀπέκτειναν
  choice: l-au omorât
  rationale: Redarea este directă și naturală, fără adaosul juridic din „l-au condamnat la moarte” sau accentuarea interpretativă din „l-au ucis mișelește”.
theological_decisions:
- issue: Ordinea scoaterii fiului din vie și a omorârii lui față de relatările paralele
  choice: Versetul afirmă că l-au aruncat afară din vie și apoi l-au omorât.
  alternative: Armonizarea cu Marcu și Luca prin sugerarea că l-au omorât înainte de a-l scoate afară.
  rationale: 'Succesiunea din textul grec al lui Matei este explicită: λαβόντες ... ἐξέβαλον ... καὶ ἀπέκτειναν. Traducerea păstrează relatarea proprie lui Matei, fără armonizare cu pasajele paralele.'
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Coordonarea simplă păstrează ritmul sobru și succesiunea acțiunilor din greacă.
