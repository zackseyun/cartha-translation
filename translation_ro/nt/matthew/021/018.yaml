  text: ⸀Πρωῒ δὲ ⸀ἐπανάγων εἰς τὴν πόλιν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/018.yaml
  text: Early in the morning, as he was returning to the city, he became hungry.
translation:
  language: ro
  text: Dis-de-dimineață, pe când se întorcea în cetate, i s-a făcut foame.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωῒ
  choice: Dis-de-dimineață
  rationale: Redă firesc adverbul temporal care indică partea timpurie a dimineții și păstrează accentul temporal.
- source_word: δὲ
  choice: nespecificat printr-un cuvânt separat
  rationale: Conjuncția are aici un rol narativ discret; în română, succesiunea este redată natural fără un «iar» sau «dar» care ar putea sugera un contrast prea puternic.
- source_word: ἐπανάγων
  choice: pe când se întorcea
  rationale: Construcția redă participiul prezent ca acțiune în desfășurare, contemporană cu verbul principal.
- source_word: εἰς τὴν πόλιν
  choice: în cetate
  rationale: εἰς exprimă deplasarea spre interiorul orașului; «cetate» este o denumire biblică românească firească pentru Ierusalim în acest context, fără a-l numi explicit.
- source_word: ἐπείνασεν
  choice: i s-a făcut foame
  rationale: 'Expresia românească idiomatică păstrează valoarea evențială, posibil ingresivă, a aoristului: foamea s-a manifestat atunci.'
theological_decisions:
- issue: Implicația cristologică a foamei lui Isus
  choice: Afirmația este redată direct ca experiență reală a foamei.
  alternative: «era flămând»
  rationale: Textul narativ afirmă umanitatea reală a lui Isus fără explicații doctrinare suplimentare; «i s-a făcut foame» păstrează atât caracterul concret, cât și dinamica verbală.
translation_notes:
  register: Română standard modernă, naturală și demnă. «Dis-de-dimineață» este curent și expresiv fără a fi colocvial, iar «cetate» păstrează registrul biblic familiar.
