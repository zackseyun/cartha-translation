id: MAT.11.3
reference: Matthew 11:3
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: εἶπεν αὐτῷ· Σὺ εἶ ὁ ἐρχόμενος ἢ ἕτερον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/003.yaml
  text: and said to him, “Are you the Coming One, or should we expect another?”
translation:
  language: ro
  text: 'și i-a zis: „Tu ești Cel care vine[a] sau să așteptăm pe altul?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „cel ce vine”. Expresia grecească poate funcționa ca un titlu mesianic.
    reason: alternativă lexicală și posibilă funcție titulară
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: și i-a zis
  rationale: Aoristul este redat firesc prin perfectul compus românesc; „și” leagă enunțul de narațiunea din versetul anterior.
- source_word: Σὺ εἶ
  choice: Tu ești
  rationale: Pronumele explicit σύ este păstrat pentru a reda accentul întrebării, într-o formulare românească naturală.
- source_word: ὁ ἐρχόμενος
  choice: Cel care vine
  rationale: Participiul prezent articulat este substantivizat și, în context, are rezonanță de titlu mesianic; formularea păstrează atât sensul verbal, cât și această posibilă funcție titulară.
- source_word: ἢ ἕτερον
  choice: sau ... pe altul
  rationale: Redă direct alternativa și sensul lui ἕτερον, fără a preciza mai mult decât textul-sursă.
- source_word: προσδοκῶμεν
  choice: să așteptăm
  rationale: Conjunctivul deliberativ este idiomatic în română și păstrează sensurile apropiate de a aștepta și a se aștepta la venirea cuiva.
theological_decisions:
- issue: Forța mesianică/titulară a expresiei ὁ ἐρχόμενος
  choice: Cel care vine
  alternative: cel ce avea să vină; Cel Așteptat
  rationale: Contextul susține o referire la figura mesianică așteptată, dar textul grec nu spune explicit „Mesia”. Traducerea păstrează expresia și tensiunea ei, fără a introduce o identificare mai explicită decât originalul.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Majuscula din „Cel” semnalează folosirea contextuală ca titlu, fără a înlocui expresia cu termenul interpretativ „Mesia”.
