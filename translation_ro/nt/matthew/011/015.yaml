  text: ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/015.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: ro
  text: Cel ce are urechi[a] să audă!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Cine are urechi să audă!” Greaca folosește o expresie generică la singular.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Cel ce are
  rationale: Articolul urmat de participiul prezent este substantivizat și desemnează generic orice persoană care are urechi. „Cel ce are” păstrează forma reprezentativă la singular și are un registru biblic demn, dar încă firesc în româna modernă.
- source_word: ὦτα
  choice: urechi
  rationale: Substantivul grecesc este la plural, iar „urechi” redă direct forma și păstrează idiomul chemării la înțelegere și luare-aminte.
- source_word: ἀκουέτω
  choice: să audă
  rationale: Imperativul prezent la persoana a treia este redat natural în română prin conjunctivul cu valoare imperativă. „Să audă” păstrează atât sensul propriu, cât și posibilitatea sensului mai larg de a lua aminte și a asculta.
theological_decisions:
- issue: Expresia generică la masculin singular
  choice: Cel ce are urechi să audă!
  alternative: Cine are urechi să audă!
  rationale: Construcția grecească este generică, dar are formă gramaticală masculină la singular. Redarea aleasă păstrează această formă fără a limita referința la bărbați; alternativa este mai neutră ca formulare, deși la fel de generică în sens.
translation_notes:
  register: Formulare concisă, solemnă și ușor de înțeles. Exclamația redă forța îndemnului imperativ, iar expresia tradițională „să audă” păstrează deschisă nuanța de auzire atentă și receptivă.
