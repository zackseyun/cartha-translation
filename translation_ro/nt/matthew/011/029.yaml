id: MAT.11.29
reference: Matthew 11:29
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/029.yaml
  text: Take my yoke upon you and learn from me[a], because I am gentle and humble in heart, and you will find rest for your souls.
translation:
  language: ro
  text: Luați jugul Meu asupra voastră și învățați de la Mine, pentru că Eu sunt blând și smerit în inimă[a], și veți găsi odihnă pentru sufletele voastre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „blajin și umil în inimă”.'
    reason: Alternativă lexicală pentru πραΰς ... ταπεινὸς τῇ καρδίᾳ; nota este ancorată la expresia pe care o explică.
lexical_decisions:
- source_word: ἄρατε
  choice: Luați
  rationale: Imperativul aorist plural al lui αἴρω, împreună cu imaginea jugului, exprimă asumarea lui; formularea este firească în româna actuală.
- source_word: τὸν ζυγόν μου ἐφ’ ὑμᾶς
  choice: jugul Meu asupra voastră
  rationale: Păstrează metafora concretă și sensul lui ἐπί cu acuzativul, fără a o transforma într-o explicație.
- source_word: μάθετε ἀπ’ ἐμοῦ
  choice: învățați de la Mine
  rationale: Redă direct imperativul și relația exprimată prin ἀπό, putând cuprinde atât primirea învățăturii, cât și urmarea Învățătorului.
- source_word: ὅτι
  choice: pentru că
  rationale: 'Redă limpede valoarea explicativ-cauzală: caracterul lui Isus arată de ce ucenicii pot învăța de la El.'
- source_word: πραΰς
  choice: blând
  rationale: „Blând” exprimă în româna contemporană lipsa asprimii și stăpânirea puterii, fără conotația posibilă de slăbiciune a altor echivalente.
- source_word: ταπεινὸς τῇ καρδίᾳ
  choice: smerit cu inima
  rationale: Păstrează descrierea dispoziției lăuntrice și ecoul biblic al inimii, într-o formulare românească demnă și inteligibilă.
- source_word: εὑρήσετε ἀνάπαυσιν
  choice: veți găsi odihnă
  rationale: Redă direct viitorul indicativ și substantivul ἀνάπαυσις, păstrând promisiunea și rezonanța scripturistică a odihnei.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: pentru sufletele voastre
  rationale: Dativul este redat idiomatic prin „pentru”, iar „sufletele” păstrează imaginea tradițională și sensul vieții lăuntrice/persoanei.
theological_decisions:
- issue: Autodescrierea lui Isus prin πραΰς καὶ ταπεινὸς τῇ καρδίᾳ
  choice: Eu sunt blând și smerit cu inima
  alternative: Eu sunt blajin și umil în inimă
  rationale: Sunt păstrate atât blândețea, cât și smerenia lăuntrică, fără a sugera slăbiciune, inferioritate ontologică sau o doctrină confesională suplimentară.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Metafora „jugului”, termenii „inima”, „odihnă” și „sufletele” sunt păstrați pentru claritate și rezonanță biblică; majusculele reverențiale urmează uzul românesc biblic.
