id: MAT.11.21
reference: Matthew 11:21
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: ro
  text: Vai de tine, Horazin! Vai de tine, Betsaida! Căci, dacă minunile[a] care au avut loc în mijlocul vostru ar fi avut loc în Tir și Sidon, cei de acolo s-ar fi pocăit de mult, în sac și cenușă.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „lucrările de putere”.
    reason: Alternativă lexicală ce păstrează mai literal legătura termenului grecesc cu ideea de putere.
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Vai de tine
  rationale: Păstrează atât tonul profetic de condamnare, cât și nuanța de durere, într-o formulare biblică firească în româna actuală.
- source_word: Χοραζίν / Βηθσαϊδά / Τύρῳ / Σιδῶνι
  choice: Horazin / Betsaida / Tir / Sidon
  rationale: Sunt folosite formele consacrate în limba română pentru aceste toponime biblice.
- source_word: αἱ δυνάμεις
  choice: minunile
  rationale: În contextul Evangheliilor, termenul desemnează fapte care manifestă putere supranaturală. „Minunile” este firesc și clar pentru cititorul modern, iar nota păstrează sensul lexical mai literal de „lucrări de putere”.
- source_word: ἐν ὑμῖν
  choice: în mijlocul vostru
  rationale: Redă sensul local al faptelor petrecute printre locuitorii cetăților, fără sugestia că acestea s-ar fi produs în interiorul lor.
- source_word: πάλαι
  choice: de mult
  rationale: Redă concis ideea că pocăința ar fi avut loc cu mult înainte.
- source_word: μετενόησαν
  choice: s-ar fi pocăit
  rationale: În acest context de avertizare și judecată, verbul indică pocăința, nu doar o schimbare neutră de opinie.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: în sac și cenușă
  rationale: Păstrează imaginea culturală și biblică a jelirii și pocăinței publice.
- source_word: Τύρῳ καὶ Σιδῶνι ... μετενόησαν
  choice: în Tir și Sidon, cei de acolo s-ar fi pocăit
  rationale: Greaca atribuie cetăților, prin metonimie, răspunsul locuitorilor lor. „Cei de acolo” face această referire firească în română fără să schimbe sensul.
theological_decisions:
- issue: Natura comparației lui Isus cu Tirul și Sidonul
  choice: O afirmație contrafactuală reală, care subliniază vina mai mare a cetăților ce au văzut minunile și nu s-au pocăit.
  alternative: O simplă exagerare retorică, fără o comparație reală în privința judecății.
  rationale: Construcția condițională prezintă pocăința Tirului și Sidonului ca rezultat ipotetic pentru a accentua răspunderea Horazinului și a Betsaidei. Traducerea păstrează această tensiune fără a adăuga concluzii doctrinare.
translation_notes:
  register: Română literară modernă, clară și demnă. Formularea păstrează tonul solemn al avertizării profetice, evitând atât arhaismele inutile, cât și parafraza doctrinară.
