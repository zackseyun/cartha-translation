id: MAT.11.22
reference: Matthew 11:22
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν, Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/022.yaml
  text: But I tell you[a], it will be more tolerable for Tyre and Sidon on the day of judgment than for you.
translation:
  language: ro
  text: 'Dar vă spun: în ziua judecății va fi mai ușor de îndurat[a] pentru Tir și Sidon decât pentru voi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „mai suportabil”.'
    reason: Alternativă lexicală pentru ἀνεκτότερον, care păstrează ideea a ceea ce poate fi îndurat.
lexical_decisions:
- source_word: πλὴν
  choice: Dar
  rationale: Introduce contrastul puternic față de mustrarea anterioară și sună firesc în româna actuală.
- source_word: λέγω ὑμῖν
  choice: vă spun
  rationale: Redă direct și idiomatic formula solemnă de adresare, păstrând persoana a doua plural.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: pentru Tir și Sidon
  rationale: Dativul asociat comparativului indică părțile pentru care judecata va fi mai ușor de îndurat.
- source_word: ἀνεκτότερον
  choice: mai ușor de îndurat
  rationale: Redă limpede sensul comparativ al adjectivului, referitor la ceea ce poate fi suportat, într-o formulare românească naturală și demnă.
- source_word: ἔσται
  choice: va fi
  rationale: Păstrează valoarea de viitor și construcția impersonală cerută firesc de limba română.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: în ziua judecății
  rationale: Redă expresia temporală în forma consacrată și clară, fără a adăuga detalii despre natura judecății.
- source_word: κρίσεως
  choice: judecății
  rationale: Păstrează sensul judiciar larg al termenului, fără a-l restrânge la rezultatul condamnării.
- source_word: ἢ ὑμῖν
  choice: decât pentru voi
  rationale: Încheie comparația și păstrează pluralul adresării fără explicitări inutile.
theological_decisions:
- issue: Natura judecății viitoare
  choice: ziua judecății
  alternative: o zi de judecată
  rationale: Deși expresia grecească este nearticulată, contextul mateian indică evenimentul escatologic recunoscut; formularea românească păstrează această forță fără a introduce precizări doctrinare suplimentare.
translation_notes:
  register: Română standard modernă, clară și demnă. Topica păstrează accentul pe „ziua judecății”, iar formularea evită atât arhaismele, cât și explicarea excesivă a implicațiilor teologice.
