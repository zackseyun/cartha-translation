id: MAT.11.13
reference: Matthew 11:13
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: πάντες γὰρ οἱ προφῆται καὶ ὁ νόμος ἕως Ἰωάννου ἐπροφήτευσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/013.yaml
  text: For all the prophets and the Law prophesied until John[a].
translation:
  language: ro
  text: Căci toți profeții și Legea au profețit până la Ioan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „până în vremea lui Ioan”. Expresia îl poate prezenta pe Ioan drept punctul culminant al mărturiei profetice sau drept hotarul care marchează o tranziție.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: toți
  rationale: Determină substantivul „profeții” și desemnează întregul grup în mod colectiv.
- source_word: γὰρ
  choice: căci
  rationale: Păstrează rolul explicativ al conjuncției față de afirmația precedentă, într-un registru românesc demn și firesc.
- source_word: οἱ προφῆται
  choice: profeții
  rationale: Este echivalentul standard și ușor de înțeles în româna modernă pentru cei care vorbesc profetic din partea lui Dumnezeu.
- source_word: ὁ νόμος
  choice: Legea
  rationale: Majuscula indică referirea la Legea lui Moise ca parte recunoscută a Scripturii, nu la lege în sens generic.
- source_word: ἕως Ἰωάννου
  choice: până la Ioan
  rationale: Redă concis limita temporală și păstrează ambiguitatea dacă Ioan este inclus ca punct culminant al mărturiei profetice sau marchează hotarul unei tranziții.
- source_word: ἐπροφήτευσαν
  choice: au profețit
  rationale: Redă direct aoristul activ și păstrează personificarea prin care atât profeții, cât și Legea aduc mărturie profetică.
theological_decisions:
- issue: Dacă ὁ νόμος trebuie redat generic sau ca denumire a unui corpus scripturistic
  choice: Legea
  alternative: legea
  rationale: În asocierea cu „profeții”, termenul se referă la Legea lui Moise ca mărturie scripturistică recunoscută; majuscula clarifică această referire fără a adăuga conținut.
- issue: Dacă ἕως Ἰωάννου îl include pe Ioan în perioada profetică sau îl prezintă numai ca punct final al ei
  choice: până la Ioan
  alternative: până în vremea lui Ioan
  rationale: Formularea greacă nu soluționează pe deplin întrebarea. Redarea aleasă păstrează limita temporală și tensiunea interpretativă, fără a impune o concluzie doctrinară.
translation_notes:
  register: Română standard modernă, clară și demnă. „Profeții” este preferat formei mai arhaice „prorocii”, iar „Căci” păstrează explicit legătura explicativă cu versetul anterior.
