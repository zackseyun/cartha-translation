id: MAT.11.10
reference: Matthew 11:10
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ⸀οὗτός ἐστιν περὶ οὗ γέγραπται· Ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/010.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
translation:
  language: ro
  text: 'Acesta este cel despre care este scris: „Iată, Eu îl trimit pe mesagerul Meu înaintea feței Tale[a], iar el Îți va pregăti calea înaintea Ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mai idiomatic: „înaintea Ta”. Greaca păstrează expresia concretă „înaintea feței Tale” din citatul scripturistic.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: Acesta este cel
  rationale: Redă identificarea emfatică exprimată de demonstrativ, într-o formulare românească firească și demnă.
- source_word: περὶ οὗ
  choice: despre care
  rationale: περί cu genitivul are aici sensul obișnuit „despre/cu privire la”; „despre care” este forma naturală în româna modernă.
- source_word: γέγραπται
  choice: este scris
  rationale: Păstrează formula consacrată de introducere a unui citat din Scriptură și valoarea rezultativă a perfectului pasiv.
- source_word: Ἰδοὺ
  choice: Iată
  rationale: Este echivalentul românesc firesc al formulei profetice de atragere a atenției și păstrează registrul solemn.
- source_word: ἀποστέλλω
  choice: îl trimit
  rationale: Prezentul românesc redă direct prezentul viu al citatului, care poate avea orientare iminentă sau viitoare.
- source_word: τὸν ἄγγελόν μου
  choice: pe mesagerul Meu
  rationale: ἄγγελος înseamnă aici trimis sau mesager, referindu-se la Ioan Botezătorul, nu la o ființă cerească.
- source_word: πρὸ προσώπου σου
  choice: înaintea feței Tale
  rationale: Păstrează expresia concretă a textului grecesc și textura citatului scripturistic; pronumele reverențiale sunt scrise cu majusculă conform uzului biblic românesc.
- source_word: κατασκευάσει
  choice: va pregăti
  rationale: Redă concis viitorul și sensul de a face gata, potrivindu-se imaginii căii.
- source_word: τὴν ὁδόν σου
  choice: calea
  rationale: „Cale” păstrează atât imaginea drumului, cât și rezonanța metaforică; posesia este exprimată natural prin pronumele datival „Îți”.
- source_word: ἔμπροσθέν σου
  choice: înaintea Ta
  rationale: Redă distinct a doua expresie prepozițională și păstrează paralelismul emfatic al citatului.
theological_decisions:
- issue: Păstrarea celor două expresii prepoziționale din citatul scripturistic
  choice: Au fost păstrate atât „înaintea feței Tale”, cât și „înaintea Ta”.
  alternative: Netezirea într-o singură formulare, precum „înaintea Ta” sau „înaintea venirii Tale”.
  rationale: Greaca are două expresii distincte, πρὸ προσώπου σου și ἔμπροσθέν σου. Menținerea ambelor evită comprimarea textului și conservă paralelismul citatului.
- issue: Identitatea lui ἄγγελος
  choice: mesager
  alternative: înger
  rationale: Contextul îl identifică pe trimis cu precursorul uman despre care vorbește Isus; alegerea păstrează sensul lexical fără a sugera o natură cerească.
translation_notes:
  register: Română standard modernă, cu registru demn și ușor solemn, adecvat unui citat profetic. Formularea concretă „înaintea feței Tale” este păstrată în text, dar explicată prin notă. Majusculele reverențiale clarifică referirea pronumelor din citat fără a modifica sensul sursei.
