id: MAT.11.4
reference: Matthew 11:4
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ ἀκούετε καὶ βλέπετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/004.yaml
  text: And Jesus answered them[a], “Go and report to John what you hear and see:”
translation:
  language: ro
  text: 'Iar Isus le-a răspuns[a]: „Duceți-vă și spuneți-i lui Ioan ce auziți și vedeți:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mai literal: „Și Isus, răspunzând, le-a spus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Iar
  rationale: Continuă relatarea și leagă răspunsul de context; „iar” este firesc în narațiunea românească fără a adăuga o nuanță temporală.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: le-a răspuns
  rationale: Formula narativă grecească „răspunzând, le-a spus” este redată idiomatic și complet funcțional în română prin „le-a răspuns”; destinatarul exprimat de αὐτοῖς este păstrat.
- source_word: Πορευθέντες
  choice: Duceți-vă
  rationale: Participiul aorist asociat imperativului următor are aici forță de poruncă și indică acțiunea premergătoare raportării.
- source_word: ἀπαγγείλατε
  choice: spuneți-i
  rationale: Verbul cere transmiterea către Ioan a celor constatate; „spuneți-i” este natural și clar în româna curentă, păstrând ideea de raportare.
- source_word: Ἰωάννῃ
  choice: lui Ioan
  rationale: Dativul indică destinatarul mesajului și este redat prin construcția românească cerută de pronumele reluat „-i”.
- source_word: ἃ ἀκούετε καὶ βλέπετε
  choice: ce auziți și vedeți
  rationale: Păstrează pronumele relativ neutru cu valoare de conținut, timpurile prezente și paralelismul senzorial al originalului.
theological_decisions:
- issue: Redarea formulei narative ἀποκριθεὶς ... εἶπεν
  choice: Iar Isus le-a răspuns
  alternative: Iar Isus, răspunzând, le-a spus
  rationale: Forma condensată este românească și naturală, fără pierdere de conținut sau implicație teologică; alternativa mai literală este consemnată în notă.
translation_notes:
  register: Română standard modernă, clară și demnă. Imperativul plural corespunde grupului de mesageri. S-a evitat formularea rigidă „mergeți și raportați”, preferându-se exprimarea firească „duceți-vă și spuneți-i”.
