source:
  edition: SBLGNT
  text: Τότε ⸀ἤρξατο ὀνειδίζειν τὰς πόλεις ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ, ὅτι οὐ μετενόησαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/020.yaml
  text: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not repent.
translation:
  language: ro
  text: Atunci a început să mustre cetățile în care avuseseră loc cele mai multe dintre faptele sale de putere[a], pentru că nu s-au pocăit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau „minunile sale” ori „lucrările sale de putere” (greacă: δυνάμεις).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Redă firesc marcatorul temporal care introduce următoarea etapă a relatării.
- source_word: ἤρξατο ὀνειδίζειν
  choice: a început să mustre
  rationale: Păstrează aspectul ingresiv al lui ἤρξατο, iar „a mustra” exprimă reproșul sever fără a introduce ideea unei condamnări judiciare formale.
- source_word: τὰς πόλεις ἐν αἷς
  choice: cetățile în care
  rationale: Redare transparentă și naturală a substantivului πόλεις și a construcției relative.
- source_word: ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ
  choice: avuseseră loc cele mai multe dintre lucrările lui pline de putere
  rationale: „Avuseseră loc” redă idiomatic acțiunile anterioare mustrării; „cele mai multe dintre” păstrează superlativul, iar formularea pentru δυνάμεις menține accentul lexical pe putere.
- source_word: ὅτι οὐ μετενόησαν
  choice: pentru că nu se pocăiseră
  rationale: Introduce explicit motivul mustrării și păstrează sensul moral-spiritual consacrat al lui μετανοέω; mai-mult-ca-perfectul exprimă anterioritatea răspunsului refuzat față de mustrare.
theological_decisions:
- issue: Redarea lui δυνάμεις în contextul faptelor miraculoase
  choice: lucrările lui pline de putere
  alternative: minunile lui; lucrările lui de putere
  rationale: Formularea păstrează referirea la faptele extraordinare ale lui Isus și accentul termenului grec asupra puterii, fără a-l restrânge nejustificat la o categorie modernă.
- issue: Redarea lui μετενόησαν
  choice: nu se pocăiseră
  alternative: nu se întorseseră; nu-și schimbaseră gândirea
  rationale: „A se pocăi” redă adecvat greutatea morală și spirituală a răspunsului cerut, fără a specifica o interpretare confesională a pocăinței.
translation_notes:
  register: Română literară modernă, demnă și accesibilă. Sintaxa urmează îndeaproape relațiile din greacă, dar evită formulările greoaie; nota păstrează alternativele legitime pentru δυνάμεις.
