source:
  edition: SBLGNT
  text: ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: ro
  text: 'Fiul Omului a venit mâncând și bând, iar ei spun: „Iată un mâncău și un bețiv, un prieten al vameșilor și al păcătoșilor!” Și înțelepciunea a fost dovedită dreaptă prin faptele ei.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „înțelepciunea a fost îndreptățită prin lucrările ei”.'
    reason: Alternativă mai literală pentru ἐδικαιώθη și ἔργων.
  - marker: b
    text: 'Unele manuscrise au „copiii” în loc de „faptele”: „înțelepciunea a fost dovedită dreaptă prin copiii ei”.'
    reason: Variantă textuală pentru lectura τέκνων în loc de ἔργων.
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Păstrează titlul consacrat și fundalul său semitic, fără a-l reduce la o simplă desemnare a unei ființe umane.
- source_word: ἐσθίων καὶ πίνων
  choice: mâncând și bând
  rationale: Redă direct activitățile obișnuite și păstrează contrastul contextual cu modul de viață ascetic al lui Ioan, fără a introduce ideea mai puternică de ospăț.
- source_word: Ἰδοὺ
  choice: Iată
  rationale: Echivalent românesc firesc și demn pentru particula exclamativă care atrage atenția asupra acuzației.
- source_word: φάγος καὶ οἰνοπότης
  choice: un om lacom și bețiv
  rationale: Redă caracterul peiorativ al celor două acuzații. „Bețiv” exprimă acuzația de consum excesiv, nu simplul fapt de a bea vin.
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: un prieten al vameșilor și al păcătoșilor
  rationale: Păstrează construcția și forța social-religioasă a etichetelor din context.
- source_word: ἐδικαιώθη
  choice: a fost dovedită dreaptă
  rationale: În acest proverb, verbul are sensul de a fi confirmat sau demonstrat ca drept. Formularea este naturală în română și păstrează ideea juridică a rădăcinii.
- source_word: ἡ σοφία
  choice: înțelepciunea
  rationale: Păstrează personificarea fără a identifica în mod explicit înțelepciunea cu Isus, cu planul lui Dumnezeu sau cu o altă realitate teologică.
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: prin faptele ei
  rationale: Exprimă faptul că dreptatea înțelepciunii este demonstrată pe baza rezultatelor sau acțiunilor ei și păstrează personificarea.
theological_decisions:
- issue: Identitatea „înțelepciunii” din propoziția finală
  choice: Expresia personificată „înțelepciunea” este păstrată fără identificare explicită.
  alternative: Înțelepciunea poate fi interpretată ca Isus însuși sau ca înțelepciunea și planul mântuitor al lui Dumnezeu.
  rationale: Textul formulează un proverb personificat și nu precizează referentul; traducerea nu trebuie să rezolve tensiunea teologică.
- issue: Forma textuală a propoziției finale
  choice: Textul principal urmează lectura ἔργων, „fapte”.
  alternative: Unele manuscrise au τέκνων, „copii”.
  rationale: SBLGNT oferit citește ἔργων; varianta bine atestată și cunoscută este consemnată în notă pentru transparență textuală.
translation_notes:
  register: Română standard modernă, clară și demnă. Acuzațiile rămân intenționat aspre, iar propoziția finală păstrează personificarea și ambiguitatea teologică a originalului.
