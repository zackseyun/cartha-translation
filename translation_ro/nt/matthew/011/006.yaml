  text: καὶ μακάριός ἐστιν ὃς ⸀ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/006.yaml
  text: And blessed is the one who is not offended by me[a].
translation:
  language: ro
  text: Și fericit este cel care nu se poticnește din cauza mea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „nu se simte ofensat de mine” ori „nu găsește în mine un prilej de cădere”.'
    reason: Alternativa explică aria semantică a verbului σκανδαλίζω și relația exprimată prin ἐν ἐμοί.
lexical_decisions:
- source_word: καί
  choice: Și
  rationale: Păstrează legătura directă a rostirii cu contextul precedent.
- source_word: μακάριος
  choice: fericit
  rationale: Este formularea românească consacrată pentru declarațiile de tipul fericirilor și păstrează sensul unei stări binecuvântate, nu doar al unei emoții trecătoare.
- source_word: ὃς ἐὰν μὴ
  choice: cel care nu
  rationale: Redă firesc în română referința generică și condițională la orice persoană aflată în această situație.
- source_word: σκανδαλισθῇ
  choice: nu se poticnește
  rationale: Păstrează metafora grecească a poticnirii, care poate implica atât ofensarea, cât și îndepărtarea ori căderea din cauza lui Isus.
- source_word: ἐν ἐμοί
  choice: din cauza mea
  rationale: În această construcție, Isus este prilejul sau cauza poticnirii; formularea este clară și idiomatică în româna actuală.
theological_decisions:
- issue: Forța lui σκανδαλισθῇ în raport cu Isus
  choice: Păstrarea metaforei prin „nu se poticnește din cauza mea”
  alternative: „nu se simte ofensat de mine” / „nu găsește în mine un prilej de cădere”
  rationale: 'Textul poate desemna mai mult decât o reacție afectivă de ofensare: include posibilitatea ca cineva să se împiedice spiritual de identitatea, cuvintele sau lucrările lui Isus. Metafora păstrează această amplitudine și tensiune.'
translation_notes:
  register: Română standard modernă, clară și demnă. Pronumele referitor la Isus este scris cu literă mică potrivit ortografiei curente, fără a introduce o convenție confesională de capitalizare.
