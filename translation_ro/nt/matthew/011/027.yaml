id: MAT.11.27
reference: Matthew 11:27
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: ro
  text: Toate Mi-au fost încredințate de Tatăl Meu și nimeni nu-L cunoaște pe Fiul decât Tatăl; nici pe Tatăl nu-L cunoaște nimeni decât Fiul și acela căruia Fiul vrea să i-L descopere.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα
  choice: Toate
  rationale: Pluralul neutru are un sens cuprinzător; „Toate” redă firesc amploarea fără a preciza nejustificat domeniul.
- source_word: μοι παρεδόθη
  choice: Mi-au fost încredințate
  rationale: Aoristul pasiv al lui παραδίδωμι exprimă transferul către Fiul. În context, „încredințate” este natural și evită asocierea nedorită a expresiei „date pe mâna” cu trădarea.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: de Tatăl Meu
  rationale: Redă agentul construcției pasive și relația personală exprimată de pronumele posesiv.
- source_word: ἐπιγινώσκει
  choice: cunoaște
  rationale: În acest context, verbul indică o cunoaștere personală și deplină, dar intensificarea prin „pe deplin” nu este lexical obligatorie; formularea simplă păstrează ambiguitatea și paralelismul.
- source_word: τὸν υἱὸν / τὸν πατέρα
  choice: pe Fiul / pe Tatăl
  rationale: Articolele și reciprocitatea relațională susțin folosirea ca titluri; construcția românească cere marcatorul personal „pe”.
- source_word: εἰ μὴ
  choice: decât
  rationale: După negație, „decât” este echivalentul românesc firesc pentru excludere.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς
  choice: acela căruia Fiul vrea
  rationale: βούλομαι exprimă voință sau alegere. „Vrea” este actual și direct, păstrând inițiativa volitivă a Fiului fără nuanța posibil arbitrară a lui „alege”.
- source_word: ἀποκαλύψαι
  choice: să I-L descopere
  rationale: „A descoperi” redă ideea de revelare sau dezvăluire; pronumele „I-L” face explicit, conform sintaxei românești, că Tatăl este cel descoperit acelei persoane.
theological_decisions:
- issue: Forța lui ἐπιγινώσκω în afirmațiile despre cunoașterea reciprocă
  choice: „cunoaște” în ambele propoziții
  alternative: „cunoaște pe deplin” / „cunoaște cu adevărat”
  rationale: Compusul poate avea în unele contexte o nuanță intensivă, însă aceasta nu trebuie impusă automat. „Cunoaște” păstrează exclusivitatea și profunzimea sugerate de context fără a adăuga explicit un grad pe care forma verbală nu îl cere neechivoc.
- issue: Voința Fiului în βούληται
  choice: „Fiul vrea”
  alternative: „Fiul alege” / „Fiul voiește”
  rationale: Formularea atribuie clar Fiului inițiativa revelației, rămâne naturală în româna modernă și nu transformă tensiunea teologică a textului într-o formulă confesională.
- issue: Referentul implicit al obiectului lui ἀποκαλύψαι
  choice: Tatăl, redat prin „I-L”
  alternative: 'Repetarea explicită: „să i-L descopere pe Tatăl”'
  rationale: Antecedentul imediat este Tatăl. Pronumele românesc păstrează coeziunea și evită repetarea, fără a schimba referentul.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Majusculele reverențiale sunt folosite consecvent pentru titlurile Tatăl și Fiul și pentru pronumele care se referă la Ei. Punctul și virgula păstrează echilibrul celor două afirmații paralele.
