  to: 'Pe când aceștia plecau, Isus a început să vorbească mulțimilor despre Ioan: „Ce ați ieșit în pustiu să priviți? O trestie clătinată de vânt?”[a]'
  rationale: 'Revizuirea este strict stilistică și sintactică: clarifică relația dintre „a ieșit” și „în pustiu” și simplifică exprimarea destinatarului vorbirii. Nu schimbă sensul, referentul contextual, metafora ori forța retorică a originalului.'
