source:
  edition: SBLGNT
  text: Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: ro
  text: 'Pe când aceștia plecau, Isus a început să vorbească mulțimilor despre Ioan: „Ce ați ieșit în pustiu să priviți? O trestie clătinată de vânt?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Imaginea trestiei clătinate de vânt poate sugera nestatornicie sau șovăire; întrebarea lui Isus așteaptă un răspuns negativ cu privire la Ioan.
    reason: cultural_note
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: Pe când aceștia plecau
  rationale: Construcția la genitiv absolut exprimă o acțiune concomitentă. Pronumele „aceștia” păstrează trimiterea contextuală la ucenicii lui Ioan fără a introduce explicit un substantiv absent din greacă.
- source_word: ἤρξατο ... λέγειν
  choice: a început să le vorbească
  rationale: Redă firesc construcția „a începe” + infinitiv; pronumele „le” exprimă destinatarul indicat de dativ.
- source_word: τοῖς ὄχλοις
  choice: mulțimilor
  rationale: Păstrează pluralul grecesc și folosește termenul curent și demn din româna modernă.
- source_word: περὶ Ἰωάννου
  choice: despre Ioan
  rationale: περί cu genitivul indică tema vorbirii; „despre” este echivalentul românesc natural.
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: Ce ați ieșit să priviți în pustiu?
  rationale: „Ce” păstrează întrebarea asupra obiectului, nu o transformă în „de ce”. Verbul „a privi” redă nuanța de observare intenționată a lui θεάομαι, iar ordinea este idiomatică în română.
- source_word: κάλαμον
  choice: o trestie
  rationale: Este sensul lexical obișnuit și păstrează imaginea la singular.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: clătinată de vânt
  rationale: Participiul pasiv este redat concis și natural; „clătinată” păstrează ideea mișcării și posibila sugestie de nestatornicie.
theological_decisions:
- issue: Referentul lui Τούτων („aceștia”)
  choice: Păstrarea formei „aceștia”, cu referentul stabilit de context
  alternative: Explicitarea prin „ucenicii lui Ioan” sau „acești oameni”
  rationale: Greaca folosește un pronume demonstrativ, iar contextul anterior identifică referentul. Forma românească păstrează coeziunea narativă fără o explicitare absentă din verset.
- issue: Forța imaginii trestiei clătinate de vânt
  choice: Păstrarea imaginii în text și explicarea sugestiei într-o notă
  alternative: Introducerea directă în text a ideii de nestatornicie
  rationale: Întrebarea retorică sugerează nestatornicia, dar nu o afirmă explicit; traducerea nu trebuie să înlocuiască metafora prin interpretarea ei.
translation_notes:
  register: Română standard modernă, cu formulare clară și demnă. „Pustiu” este preferat lui „deșert” pentru cadrul iudaic și pentru uzul biblic românesc încă natural. Marcajul notei este așezat după întrebarea care conține imaginea explicată.
