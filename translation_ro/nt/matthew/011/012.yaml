source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: ro
  text: Dar din zilele lui Ioan Botezătorul până acum, Împărăția cerurilor este supusă violenței[a], iar oamenii violenți o iau cu forța.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Împărăția cerurilor înaintează cu putere, iar oamenii care acționează cu forță pun stăpânire pe ea.” Verbul grecesc tradus prin „este supusă violenței” poate fi înțeles și cu sens mediu.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: Dar, din
  rationale: ἀπό indică punctul de început, iar δέ marchează o ușoară schimbare sau opoziție în discurs; formularea este firească în româna actuală.
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: zilele lui Ioan Botezătorul
  rationale: Păstrează idiomul temporal și construcția genitivală a grecei, într-o formă consacrată și ușor de înțeles.
- source_word: ἕως ἄρτι
  choice: până acum
  rationale: Redă natural continuitatea dintre vremea lui Ioan și momentul rostirii.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Împărăția cerurilor
  rationale: Este redarea românească consacrată a expresiei caracteristice lui Matei și păstrează pluralul grecesc τῶν οὐρανῶν.
- source_word: βιάζεται
  choice: este supusă violenței
  rationale: Redă sensul pasiv defensabil fără a sugera că Împărăția ar fi înfrântă; ambiguitatea față de sensul mediu/intranzitiv este păstrată în nota de subsol.
- source_word: βιασταὶ
  choice: oamenii violenți
  rationale: Exprimă persoane caracterizate prin forță sau violență. „Oamenii” este natural în română și nu transformă masculinul gramatical plural într-o afirmație restrictivă despre sex.
- source_word: ἁρπάζουσιν αὐτήν
  choice: pun mâna pe ea
  rationale: Redă idiomatic luarea prin forță implicată de ἁρπάζω, menținând legătura semantică cu violența din propoziția precedentă.
theological_decisions:
- issue: Sensul lui βιάζεται în raport cu Împărăția
  choice: 'Sens pasiv în textul principal: „Împărăția cerurilor este supusă violenței”'
  alternative: 'Sens mediu/intranzitiv: „Împărăția cerurilor înaintează cu putere”'
  rationale: Forma grecească admite ambele înțelegeri. Lectura pasivă se leagă firesc de βιασταὶ și ἁρπάζουσιν, dar lectura dinamică are sprijin lexical real; de aceea alternativa este consemnată explicit, fără a elimina tensiunea interpretativă.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Sintaxa rămâne apropiată de original, iar formulările evită atât arhaismele, cât și explicarea confesională a ambiguității.
