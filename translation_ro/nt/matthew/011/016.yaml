id: MAT.11.16
reference: Matthew 11:16
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τίνι δὲ ὁμοιώσω τὴν γενεὰν ταύτην; ὁμοία ἐστὶν παιδίοις ⸂καθημένοις ἐν ταῖς ἀγοραῖς ἃ προσφωνοῦντα τοῖς ἑτέροις⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/016.yaml
  text: But to what shall I compare this generation? It is like children sitting in the marketplaces[a], calling out to the others[b],
translation:
  language: ro
  text: 'Dar cu ce voi asemăna generația aceasta? Este asemenea unor copii care stau în piețe[a] și strigă către ceilalți[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „în piețele publice”. Termenul grecesc se referă la spațiile publice în care se făcea negoț și se adunau oamenii.
    reason: lexical_alternative
  - marker: b
    text: Sau „către ceilalți copii”. Textul grecesc spune doar „către ceilalți”; identitatea lor este subînțeleasă din contextul comparației.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνι
  choice: cu cine
  rationale: 'Dativul interogativ indică termenul comparației. În română, construcția firească și demnă este „cu cine voi asemăna”, iar referentul ulterior este personal: copiii.'
- source_word: δὲ
  choice: Dar
  rationale: Marchează o tranziție cu o ușoară nuanță de contrast; „Dar” păstrează bine schimbarea retorică.
- source_word: ὁμοιώσω
  choice: voi asemăna
  rationale: Viitorul indicativ are aici forță deliberativ-retorică; forma românească păstrează atât timpul, cât și ideea comparației.
- source_word: γενεὰν ταύτην
  choice: generația aceasta
  rationale: Redă direct expresia greacă și desemnează oamenii contemporani priviți ca un întreg caracteristic.
- source_word: ὁμοία ἐστὶν
  choice: Este asemenea
  rationale: Formulare naturală, ușor formală și potrivită registrului biblic modern, care exprimă simplu asemănarea.
- source_word: παιδίοις
  choice: unor copii
  rationale: Dativul plural este cerut în română de „asemenea”; „copii” nu accentuează inutil nuanța diminutivală.
- source_word: καθημένοις
  choice: care stau
  rationale: În context locativ, „stau în piețe” este mai firesc în româna actuală decât o redare rigidă precum „șezând”, fără a pierde scena continuă.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: în piețe
  rationale: ἀγορά desemnează piețele sau spațiile publice de târg și adunare. „Piețe” este concis și natural; nota clarifică sensul antic.
- source_word: ἃ
  choice: care
  rationale: Pronumele relativ neutru se acordă în greacă cu παιδίοις; româna folosește natural relativul personal invariabil „care”.
- source_word: προσφωνοῦντα
  choice: îi strigă
  rationale: Participiul descrie adresarea cu voce tare. „Îi strigă” redă caracterul audibil și direct al chemării în spațiul public.
- source_word: τοῖς ἑτέροις
  choice: pe ceilalți
  rationale: Păstrează referința eliptică din greacă fără a introduce în text substantivul „copii”, care este doar subînțeles din comparație.
theological_decisions: []
translation_notes:
  register: Română standard modernă, clară și demnă. Ordinea întrebării urmează idiomul românesc, iar imaginea copiilor rămâne vie și accesibilă. Două note păstrează extensia semantică a lui ἀγορά și elipsa lui τοῖς ἑτέροις.
