id: MAT.11.24
reference: Matthew 11:24
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν ὅτι γῇ Σοδόμων ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: ro
  text: Dar vă spun că, în ziua judecății, va fi mai ușor de îndurat pentru ținutul Sodomei decât pentru tine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: Dar
  rationale: Introduce firesc în româna actuală contrastul solemn cu afirmația anterioară.
- source_word: λέγω ὑμῖν
  choice: vă spun
  rationale: Redă idiomatic formula de adresare directă și păstrează pluralul destinatarilor.
- source_word: γῇ Σοδόμων
  choice: pentru ținutul Sodomei
  rationale: Păstrează substantivul explicit γῇ și indică teritoriul asociat Sodomei, nu doar numele cetății.
- source_word: ἀνεκτότερον
  choice: mai ușor de îndurat
  rationale: Redare naturală și clară în româna modernă a comparativului cu sensul «mai suportabil».
- source_word: ἔσται
  choice: va fi
  rationale: Redă direct viitorul copulativ.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: în ziua judecății
  rationale: Păstrează construcția temporală și formularea biblică limpede în română.
- source_word: ἢ σοί
  choice: decât pentru tine
  rationale: Păstrează dativul comparativ și singularul adresării către cetatea personificată.
theological_decisions:
- issue: Referentul pronumelui singular σοί
  choice: „pentru tine”, ca adresare singulară către cetatea personificată
  alternative: „pentru voi” sau „pentru locuitorii tăi”
  rationale: Textul grec are singularul și continuă adresarea profetică directă; traducerea nu explicitează interpretativ destinatarii.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formularea păstrează contrastul solemn, referința explicită la ținutul Sodomei și singularul retoric final.
