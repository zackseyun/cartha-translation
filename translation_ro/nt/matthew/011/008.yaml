id: MAT.11.8
reference: Matthew 11:8
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν ⸀μαλακοῖς ἠμφιεσμένον; ἰδοὺ οἱ τὰ μαλακὰ φοροῦντες ἐν τοῖς οἴκοις τῶν ⸀βασιλέων ⸀εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: ro
  text: Dar ce ați ieșit să vedeți? Un om îmbrăcat în haine fine[a]? Iată, cei care poartă haine fine se află în casele regilor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: „în lucruri moi”, adică în haine moi sau delicate; expresia se referă aici la îmbrăcăminte fină, luxoasă.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „în palate regale”. Greaca spune mai literal „în casele regilor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Dar
  rationale: Redă opoziția retorică față de întrebarea precedentă într-o formă firească și directă în româna actuală.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: ce ați ieșit să vedeți
  rationale: Păstrează pronumele interogativ τί și construcția de scop exprimată prin infinitivul ἰδεῖν.
- source_word: ἄνθρωπον
  choice: un om
  rationale: Redă substantivul masculin singular și se potrivește referirii imediate la Ioan Botezătorul.
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: îmbrăcat în haine fine
  rationale: Participiul indică starea de a fi îmbrăcat, iar „haine fine” exprimă natural în română sensul contextual al unor veșminte moi, delicate și luxoase, fără a supralicita ideea.
- source_word: ἰδοὺ
  choice: Iată
  rationale: Formulă românească actuală și demnă care păstrează rolul particulei de a atrage atenția.
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: cei care poartă haine fine
  rationale: Construcția cu participiu sugerează purtarea caracteristică sau obișnuită; repetarea expresiei păstrează legătura lexicală cu întrebarea anterioară.
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: se află în casele regilor
  rationale: Păstrează pluralul și imaginea concretă din greacă; „se află” este mai idiomatic aici decât simplul „sunt”.
theological_decisions: []
translation_notes:
  register: Română standard modernă, clară și demnă. „Haine fine” evită caracterul nefiresc al expresiei „haine moi”, iar nota păstrează formularea literală și conotația de lux. Repetiția termenului este menținută pentru a reda paralelismul retoric al textului grec.
