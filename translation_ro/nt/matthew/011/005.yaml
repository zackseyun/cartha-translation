id: MAT.11.5
reference: Matthew 11:5
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τυφλοὶ ἀναβλέπουσιν καὶ χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται καὶ κωφοὶ ἀκούουσιν, ⸀καὶ νεκροὶ ἐγείρονται καὶ πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: ro
  text: Orbii își recapătă vederea, șchiopii umblă, cei bolnavi de lepră sunt curățiți, surzii aud, morții sunt înviați și săracilor li se vestește vestea bună[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „săracilor li se predică Evanghelia”. Verbul grecesc este la diateza pasivă: săracii sunt cei cărora li se aduce vestea bună.'
    reason: lexical_alternative
  - marker: b
    text: Enumerarea evocă Isaia 35:5–6 și 61:1 și prezintă semne asociate lucrării lui Mesia.
    reason: cross_reference
lexical_decisions:
- source_word: τυφλοὶ
  choice: orbii
  rationale: Adjectiv substantivizat, redat concis și firesc ca o categorie de persoane.
- source_word: ἀναβλέπουσιν
  choice: își recapătă vederea
  rationale: În contextul vindecărilor, verbul indică primirea sau redobândirea vederii, nu simpla ridicare a privirii.
- source_word: χωλοὶ περιπατοῦσιν
  choice: șchiopii umblă
  rationale: Redare directă a substantivizării și a prezentului grecesc, păstrând stilul succint al enumerării.
- source_word: λεπροὶ καθαρίζονται
  choice: cei bolnavi de lepră sunt curățiți
  rationale: Formularea evită etichetarea persoanelor, iar „sunt curățiți” păstrează dimensiunea fizică și rituală a verbului καθαρίζω.
- source_word: κωφοὶ ἀκούουσιν
  choice: surzii aud
  rationale: Asocierea cu verbul „aud” stabilește aici sensul „surzi”, deși κωφός poate avea și sensul „mut” în alte contexte.
- source_word: νεκροὶ ἐγείρονται
  choice: morții sunt înviați
  rationale: Pasivul păstrează acțiunea exercitată asupra morților; „sunt înviați” este firesc și clar în româna biblică modernă.
- source_word: πτωχοὶ
  choice: săracilor
  rationale: Păstrează sensul socioeconomic de bază și rezonanța isaianică fără a-l restrânge prin interpretare.
- source_word: εὐαγγελίζονται
  choice: li se vestește vestea bună
  rationale: 'Construcția păstrează valoarea pasivă: săracii sunt destinatarii vestirii. „Vestea bună” evită impunerea în textul principal a unei terminologii ecleziastice tehnice ulterioare.'
theological_decisions:
- issue: Redarea lui εὐαγγελίζονται în raport cu terminologia Evangheliei
  choice: li se vestește vestea bună
  alternative: li se propovăduiește Evanghelia
  rationale: Redarea aleasă păstrează sensul verbal și pasivul grecesc, rămânând accesibilă cititorului modern și fără a restrânge expresia la uzul bisericesc tehnic.
- issue: Enumerarea minunilor ca dovadă a lucrării mesianice
  choice: Păstrarea afirmațiilor directe, fără adăugarea în text a unei formule explicite de împlinire
  alternative: Adăugarea unei precizări precum „împlinind profeția lui Isaia”
  rationale: Versetul evocă puternic texte din Isaia, dar nu conține el însuși o formulă explicită de împlinire; legătura este indicată în notă, nu introdusă în text.
translation_notes:
  register: Română standard modernă, clară și demnă. Enumerarea concisă și paralelismul originalului au fost păstrate; s-au evitat atât arhaismele precum „propovăduiește” în textul principal, cât și formulările stigmatizante pentru persoanele bolnave.
