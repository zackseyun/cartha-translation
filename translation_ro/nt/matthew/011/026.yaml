  text: ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/026.yaml
  text: Yes[a], Father, because this was pleasing in your sight.
translation:
  language: ro
  text: Da[a], Tată, căci așa Ți-a plăcut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Într-adevăr”; ori: „căci aceasta a fost buna Ta plăcere”.'
    reason: Alternativă lexicală pentru ναί și redare mai apropiată de substantivul εὐδοκία.
lexical_decisions:
- source_word: ναί
  choice: Da
  rationale: Redă direct asentimentul afirmativ în contextul rugăciunii.
- source_word: ὁ πατήρ
  choice: Tată
  rationale: Nominativ cu valoare de vocativ; forma nearticulată este adresarea firească în româna actuală.
- source_word: ὅτι
  choice: pentru că
  rationale: Păstrează sensul cauzal, introducând temeiul asentimentului exprimat prin «Da».
- source_word: οὕτως
  choice: așa
  rationale: Trimite la modul de acțiune descris în versetul anterior, fără să-l expliciteze excesiv.
- source_word: εὐδοκία ἐγένετο
  choice: a fost plăcut
  rationale: Redă idiomatic caracterul plăcut/aprobat al celor petrecute, fără a impune sensul mai tare de decret sau plan.
- source_word: ἔμπροσθέν σου
  choice: înaintea Ta
  rationale: Păstrează imaginea relațională și formularea apropiată de greacă; în română înseamnă ceea ce este plăcut în prezența sau în ochii Tatălui.
theological_decisions:
- issue: Dacă εὐδοκία trebuie redat ca hotărâre/scop divin sau ca plăcere/aprobare divină
  choice: a fost plăcut înaintea Ta
  alternative: aceasta a fost buna Ta plăcere / așa ai găsit Tu cu cale
  rationale: Formularea exprimă aprobarea și plăcerea Tatălui fără să restrângă termenul la ideea unui decret sau plan și păstrează tensiunea semantică a originalului.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Majuscula reverențială din «Ta» este folosită consecvent în adresarea directă către Tatăl; traducerea evită atât arhaismul, cât și formulările confesionale interpretative.
