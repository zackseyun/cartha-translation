id: MAT.11.1
reference: Matthew 11:1
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
translation:
  language: ro
  text: După ce Isus a terminat să le dea îndrumări celor doisprezece ucenici ai săi[a], a plecat de acolo ca să învețe și să predice în orașele lor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „să le dea porunci celor doisprezece ucenici ai săi”.'
    reason: lexical_alternative
  - marker: b
    text: Expresia „orașele lor” este ambiguă în greacă; se poate referi la orașele ucenicilor sau, mai general, la localitățile oamenilor din regiunea înconjurătoare.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: După ce
  rationale: Formula narativă semitizantă introduce aici relația temporală dintre încheierea cuvântării și plecarea lui Isus; redarea este firească în româna modernă și evită formularea greoaie „Și s-a întâmplat când”.
- source_word: ἐτέλεσεν
  choice: a terminat
  rationale: Exprimă încheierea acțiunii înaintea verbului principal „a plecat”; construcția românească „după ce ... a terminat” redă limpede succesiunea.
- source_word: διατάσσων
  choice: de dat îndrumări
  rationale: Participiul indică îndrumări cu autoritate în contextul trimiterii celor doisprezece. Formularea evită o nuanță inutil militară, iar sensul mai tare „porunci” este păstrat în notă.
- source_word: τοῖς δώδεκα μαθηταῖς αὐτοῦ
  choice: celor doisprezece ucenici ai săi
  rationale: „Ucenici” este termenul consacrat și inteligibil pentru μαθηταί, iar numeralul și posesivul sunt păstrate explicit.
- source_word: μετέβη ἐκεῖθεν
  choice: a plecat de acolo
  rationale: Redă natural deplasarea din locul anterior și progresia narațiunii.
- source_word: τοῦ διδάσκειν καὶ κηρύσσειν
  choice: ca să-i învețe pe oameni și să predice
  rationale: Infinitivele articulate exprimă scopul. Complementul „pe oameni” este adăugat idiomatic pentru ca verbul tranzitiv „a învăța” să nu fie confundat cu „a învăța ceva”, fără a identifica un grup anume.
- source_word: κηρύσσειν
  choice: să predice
  rationale: În contextul Evangheliilor, „a predica” redă firesc proclamarea publică și păstrează deosebirea față de activitatea de învățare.
- source_word: ἐν ταῖς πόλεσιν αὐτῶν
  choice: în cetățile lor
  rationale: Păstrează pronumele ambiguu αὐτῶν. „Cetăți” redă πόλεις într-un registru biblic moderat și poate desemna centre urbane de mărimi diferite.
theological_decisions:
- issue: Referentul pronumelui αὐτῶν din expresia ἐν ταῖς πόλεσιν αὐτῶν
  choice: Se păstrează formularea ambiguă „cetățile lor”.
  alternative: „cetățile ucenicilor”, „cetățile iudeilor” sau „cetățile din regiunea aceea”
  rationale: Textul grecesc nu precizează antecedentul pronumelui; traducerea nu trebuie să fixeze o interpretare pe care sursa o lasă deschisă.
- issue: Forța lui διατάσσων
  choice: „de dat îndrumări”, cu alternativa „porunci” în notă
  alternative: „de dat porunci”
  rationale: Contextul este cel al însărcinării celor doisprezece, iar verbul implică autoritate. Textul principal rămâne natural, în timp ce nota păstrează forța lexicală posibilă.
translation_notes:
  register: Română standard modernă, clară și demnă, cu un registru biblic moderat. Formularea evită arhaismele greoaie, păstrează distincția dintre a învăța și a predica și nu rezolvă referentul ambiguu al pronumelui final.
