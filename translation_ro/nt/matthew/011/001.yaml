review_pass:
  verdict: revise
  source_fidelity: Redarea surprinde corect succesiunea, instrucțiunile date celor doisprezece, plecarea și scopul dublu de a învăța și a predica. Totuși, „pe oameni” nu are corespondent explicit în greacă și introduce un complement care nu este necesar în română.
  naturalness: „După ce Isus a terminat să le dea îndrumări...” este mai firesc decât construcția „a terminat de dat îndrumări”. „Orașele lor” este uzual în româna standard modernă, păstrând totodată pronumele cu referent nedefinit.
  terminology: „Ucenici”, „îndrumări”, „a învăța” și „a predica” sunt potrivite. Nota pentru „porunci” păstrează alternativa mai imperativă a lui διατάσσω. Pronumele posesiv final trebuie să rămână ambiguu.
  issues:
