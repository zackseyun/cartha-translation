    rationale: τοῦ διδάσκειν nu exprimă aici un obiect direct. Adăugarea nu fixează un grup precis, dar extinde totuși formularea dincolo de sursă; româna permite simplu „să învețe și să predice”.
  - severity: low
    issue: Construcția „a terminat de dat îndrumări” este mai puțin naturală.
    rationale: Construcția cu conjunctivul, „a terminat să le dea îndrumări”, este idiomatică și exprimă clar acțiunea încheiată.
