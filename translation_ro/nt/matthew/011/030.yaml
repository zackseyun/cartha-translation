  text: ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: ro
  text: Căci jugul meu este bun, iar povara mea este ușoară.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρηστός
  choice: bun
  rationale: Redă sensul de „bun, binevoitor, folositor” fără a restrânge termenul la ideea de „ușor”; se păstrează astfel distincția față de ἐλαφρόν din a doua parte a versetului.
- source_word: ζυγός
  choice: jug
  rationale: Echivalentul românesc direct al metaforei despre supunere, îndrumare și sarcina purtată.
- source_word: φορτίον
  choice: povară
  rationale: Exprimă firesc în română o greutate purtată și păstrează sensul metaforic al termenului grec.
- source_word: ἐλαφρόν
  choice: ușoară
  rationale: Redă direct ideea unei poveri care nu apasă greu și se acordă cu substantivul feminin „povară”.
theological_decisions:
- issue: Raportul dintre χρηστός și ἐλαφρόν
  choice: „jugul meu este bun” și „povara mea este ușoară”
  alternative: „jugul meu este ușor” și „povara mea este ușoară”
  rationale: Traducerea evită să transforme cei doi termeni grecești diferiți în aceeași afirmație și păstrează tensiunea dintre caracterul bun al jugului și greutatea redusă a poverii.
translation_notes:
  register: Formulare modernă, clară și demnă. Pronumele referitoare la vorbitor sunt scrise cu literă mică, după uzul standard al limbii române, fără capitalizare confesională.
