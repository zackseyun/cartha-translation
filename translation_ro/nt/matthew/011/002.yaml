id: MAT.11.2
reference: Matthew 11:2
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰωάννης ἀκούσας ἐν τῷ δεσμωτηρίῳ τὰ ἔργα τοῦ χριστοῦ πέμψας ⸀διὰ τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/002.yaml
  text: When John heard in prison about the works of the Messiah[a], he sent word through his disciples
translation:
  language: ro
  text: Când Ioan a auzit în închisoare despre lucrările lui Mesia[a], a trimis vorbă prin ucenicii săi
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „lucrările lui Cristos”.'
    reason: Redare alternativă tradițională pentru τοῦ χριστοῦ.
lexical_decisions:
- source_word: δὲ
  choice: nespecificat separat
  rationale: Particula marchează o tranziție narativă ușoară; în română, legătura este redată firesc prin curgerea frazei, fără adăugarea unui «acum» temporal.
- source_word: ἀκούσας
  choice: Când Ioan a auzit
  rationale: Participiul aorist este redat printr-o propoziție temporală naturală, păstrând acțiunea anterioară trimiterii.
- source_word: ἐν τῷ δεσμωτηρίῳ
  choice: în închisoare
  rationale: Redare românească idiomatică și exactă a locului detenției.
- source_word: τὰ ἔργα
  choice: lucrările
  rationale: Păstrează sensul larg al faptelor și activității lui Isus, precum și corespondența lexicală cu ἔργα.
- source_word: τοῦ χριστοῦ
  choice: lui Mesia
  rationale: Χριστός funcționează aici ca titlu; «Mesia» îi păstrează sensul iudaic de Unsul.
- source_word: πέμψας
  choice: a trimis vorbă
  rationale: Complementul mesajului este implicit și apare în versetul următor; formularea românească exprimă natural trimiterea unui mesaj prin intermediari.
- source_word: διὰ τῶν μαθητῶν αὐτοῦ
  choice: prin ucenicii săi
  rationale: διά cu genitivul indică intermediarii prin care a fost transmis mesajul.
theological_decisions:
- issue: Redarea lui Χριστός
  choice: Mesia
  alternative: Cristos
  rationale: În acest context termenul este un titlu, nu doar o desemnare devenită nume; «Mesia» îi face transparent sensul, iar alternativa tradițională este consemnată în notă.
translation_notes:
  register: Română standard modernă, clară și demnă. Sintaxa urmează natural succesiunea participiilor grecești, fără a introduce un marcator temporal absent din sursă.
