  yaml_path: translation/nt/matthew/011/028.yaml
  text: Come to me[a], all who labor and are burdened[b], and I will give you rest.
translation:
  language: ro
  text: Veniți la Mine, voi toți care trudiți și sunteți împovărați[a], iar Eu vă voi da odihnă[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „ați fost încărcați cu poveri”. Participiul grecesc la perfect pasiv descrie oameni care au fost încărcați și au rămas în această stare.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „vă voi înviora”. Verbul grecesc poate însemna a face pe cineva să se odihnească sau a-l înviora.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε πρός με
  choice: Veniți la Mine
  rationale: Redă firesc și direct imperativul de invitație împreună cu mișcarea spre persoana vorbitorului.
- source_word: πάντες
  choice: voi toți
  rationale: Păstrează caracterul cuprinzător al invitației și face explicit pluralul într-o formulare românească naturală.
- source_word: οἱ κοπιῶντες
  choice: care trudiți
  rationale: Verbul „a trudi” păstrează sensul activ de muncă obositoare și are un registru demn, dar inteligibil.
- source_word: πεφορτισμένοι
  choice: sunteți împovărați
  rationale: Redă starea prezentă rezultată din faptul de a fi fost încărcați, exprimată de participiul perfect pasiv.
- source_word: κἀγὼ
  choice: iar Eu
  rationale: „Iar” redă legătura și ușorul contrast, iar pronumele explicit păstrează accentul asupra vorbitorului fără a-l exagera.
- source_word: ἀναπαύσω ὑμᾶς
  choice: vă voi da odihnă
  rationale: 'Este o formulare românească naturală care păstrează sensul cauzativ larg: a face pe cineva să se odihnească sau a-i oferi alinare.'
theological_decisions:
- issue: Natura odihnei promise prin ἀναπαύσω
  choice: vă voi da odihnă
  alternative: vă voi înviora
  rationale: Formularea rămâne suficient de largă pentru a nu limita odihna la sensul fizic, sufletesc, spiritual ori escatologic; versetul nu o definește mai precis aici.
translation_notes:
  register: Română standard modernă, cu ton direct, cald și demn. Majuscula reverențială din „Mine” și „Eu” urmează uzul biblic românesc curent fără a modifica sensul sursei.
