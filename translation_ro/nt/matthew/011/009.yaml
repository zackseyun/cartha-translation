  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε⸂; προφήτην ἰδεῖν⸃; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: ro
  text: Dar ce ați ieșit să vedeți? Un profet? Da, vă spun, și mai mult decât un profet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „unul mai mare decât un profet”. Greaca spune mai literal: „mai mult decât un profet”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Dar atunci
  rationale: Marchează contrastul și reluarea incisivă a șirului de întrebări retorice; formularea este firească în româna actuală.
- source_word: τί ἐξήλθατε
  choice: ce ați ieșit
  rationale: Păstrează τί ca pronume interogativ, „ce”, și evită transformarea lui în adverbialul interpretativ „de ce”.
- source_word: ἰδεῖν
  choice: să vedeți
  rationale: Redă natural infinitivul de scop dependent de verbul „a ieși”.
- source_word: προφήτην
  choice: un profet
  rationale: Substantivul singular nearticulat are aici sens indefinit în întrebarea retorică.
- source_word: ναί
  choice: Da
  rationale: Redă răspunsul afirmativ direct și clar.
- source_word: λέγω ὑμῖν
  choice: vă spun
  rationale: Formulă discursivă idiomatică, fidelă și naturală în română.
- source_word: καὶ περισσότερον προφήτου
  choice: și mai mult decât un profet
  rationale: Păstrează comparația eliptică și formularea deliberat neexplicitată a grecei, fără a introduce în text un subiect precum „unul” sau o explicație teologică.
theological_decisions:
- issue: Identitatea și statutul lui Ioan Botezătorul în afirmația lui Isus
  choice: „mai mult decât un profet”
  alternative: „unul mai mare decât un profet”
  rationale: Textul îl situează pe Ioan dincolo de categoria de profet, fără să explice în această propoziție în ce sens. Redarea aleasă păstrează tensiunea și elipsa originalului.
translation_notes:
  register: Română standard modernă, clară și demnă. Persoana a doua plural redă adresarea colectivă; ordinea întrebărilor păstrează ritmul retoric al originalului.
