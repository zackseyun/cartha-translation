  text: ⸀λέγουσιν· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκόψασθε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
translation:
  language: ro
  text: 'Ei spun: „V-am cântat din fluier și n-ați dansat; am cântat un cântec de jale și nu v-ați bocit[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mai literal: „nu v-ați lovit”, cu referire la gesturile obișnuite de doliu, precum lovirea pieptului.'
    reason: cultural_note
lexical_decisions:
- source_word: λέγουσιν
  choice: Ei spun
  rationale: Prezentul grecesc dă vivacitate scenei și este redat firesc prin prezentul românesc.
- source_word: Ηὐλήσαμεν
  choice: V-am cântat din fluier
  rationale: Verbul αὐλέω indică în mod specific cântatul la fluier; formularea românească păstrează atât instrumentul, cât și ideea unei interpretări adresate celorlalți.
- source_word: ὑμῖν
  choice: V-am
  rationale: Dativul indică destinatarii interpretării și se redă idiomatic în română prin pronumele neaccentuat.
- source_word: ὠρχήσασθε
  choice: n-ați dansat
  rationale: Forma medie are aici sensul firesc de a dansa, fără a necesita o nuanță reflexivă.
- source_word: ἐθρηνήσαμεν
  choice: am cântat un cântec de jale
  rationale: Verbul desemnează jelirea, adesea sub forma unei cântări funebre; această redare păstrează paralelismul performativ al scenei.
- source_word: ἐκόψασθε
  choice: nu v-ați bocit
  rationale: În context funerar, verbul se referă la manifestarea rituală a durerii, inclusiv lovirea pieptului; „a se boci” exprimă natural în română jelirea manifestă, iar gestul concret este explicat în notă.
theological_decisions: []
