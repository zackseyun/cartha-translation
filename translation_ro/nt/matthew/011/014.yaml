  text: καὶ εἰ θέλετε δέξασθαι, αὐτός ἐστιν Ἠλίας ὁ μέλλων ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/014.yaml
  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: ro
  text: Și, dacă vreți să acceptați aceasta[a], el este Ilie, cel care trebuie să vină.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „dacă sunteți dispuși să primiți aceasta”.'
    reason: lexical_alternative
  - marker: b
    text: Isus îl identifică aici pe Ioan Botezătorul cu Ilie, cel care trebuie să vină; vezi Maleahi 3:23 (4:5 în unele ediții) și Matei 17:10–13.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Și
  rationale: Păstrează legătura simplă cu afirmația precedentă, fără a preciza excesiv raportul discursiv.
- source_word: εἰ θέλετε δέξασθαι
  choice: dacă vreți să primiți lucrul acesta
  rationale: Construcția exprimă disponibilitatea de a primi sau accepta afirmația lui Isus. „Lucrul acesta” explicitează obiectul subînțeles într-o română firească, fără a-l defini mai mult decât permite contextul.
- source_word: αὐτός
  choice: el
  rationale: Pronumele se referă la Ioan Botezătorul; forma simplă și naturală „el” este suficientă, fără a impune emfaza posibilă „el însuși”.
- source_word: ἐστιν Ἠλίας
  choice: este Ilie
  rationale: Redă direct identificarea din greacă și folosește forma consacrată în română a numelui biblic.
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: care urma să vină
  rationale: Redă așteptarea profetică din perspectiva momentului vorbirii. Evită atât iminența prea accentuată, cât și reformularea interpretativă „cel asemenea lui Ilie”.
theological_decisions:
- issue: Identificarea lui Ioan Botezătorul cu Ilie
  choice: el este Ilie care urma să vină
  alternative: el împlinește rolul lui Ilie / el este asemenea lui Ilie
  rationale: Textul grec formulează identificarea direct, dar o încadrează prin apelul condițional la receptivitatea ascultătorilor. Traducerea păstrează această tensiune și nu o reduce la simplă asemănare.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formularea păstrează identificarea categorică și condiția receptivității, iar nota explică aluzia profetică fără a o introduce interpretativ în text.
