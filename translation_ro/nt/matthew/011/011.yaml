id: MAT.11.11
reference: Matthew 11:11
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/011.yaml
  text: Truly I say to you[a], among those born of women no one greater than John the Baptist has arisen[c][b]; yet the least in the kingdom of heaven is greater than he.
translation:
  language: ro
  text: 'Adevărat vă spun: dintre cei născuți din femei[b] nu s-a ridicat[a] niciunul mai mare decât Ioan Botezătorul; totuși, cel mai mic în Împărăția cerurilor este mai mare decât el.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „nu a fost ridicat”. Verbul grec poate însemna „s-a ridicat” ori „a fost ridicat”; aici pare să se refere la apariția cuiva pe scena istoriei, nu la înviere.'
    reason: lexical_alternative
  - marker: b
    text: Expresia „cei născuți din femei” este un mod semitic de a spune „oamenii”.
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Adevărat vă spun
  rationale: Redă natural și solemn formula autoritativă, fără transliterarea mai puțin transparentă „Amin”.
- source_word: οὐκ ἐγήγερται
  choice: nu s-a ridicat
  rationale: Păstrează imaginea verbului grec și sensul apariției în istorie, fără a impune aici ideea învierii; ambiguitatea este semnalată în nota [a].
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: dintre cei născuți din femei
  rationale: Păstrează expresia semitică într-o formă românească limpede; sensul ei este explicat în nota [b].
- source_word: μείζων Ἰωάννου τοῦ βαπτιστοῦ
  choice: niciunul mai mare decât Ioan Botezătorul
  rationale: Exprimă firesc în română comparația grecească și introduce subiectul cerut de claritate.
- source_word: τοῦ βαπτιστοῦ
  choice: Botezătorul
  rationale: Este desemnarea tradițională și imediat recognoscibilă în română pentru epitetul lui Ioan.
- source_word: ὁ δὲ μικρότερος
  choice: totuși, cel mai mic
  rationale: Comparativul grec poate desemna persoana cu rangul sau statutul cel mai mic; formularea românească redă firesc contrastul paradoxal.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: în Împărăția cerurilor
  rationale: Redă expresia caracteristică Evangheliei după Matei și păstrează pluralul grecesc într-o formulare consacrată în română.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: este mai mare decât el
  rationale: Păstrează direct comparația și referința pronominală la Ioan.
theological_decisions:
- issue: Raportul dintre măreția lui Ioan și a celui mai mic din Împărăție
  choice: Afirmația paradoxală este redată direct, fără explicarea temeiului comparației.
  alternative: Comparația ar putea fi explicată prin privilegiul istoric al celor din Împărăție, prin statutul în istoria mântuirii ori prin apartenența la noul legământ.
  rationale: Textul nu precizează în ce sens cel mai mic din Împărăție este mai mare decât Ioan; traducerea păstrează tensiunea teologică și nu impune o interpretare confesională.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. Formularea păstrează textura biblică a expresiei „născuți din femei” și contrastul neexplicat al versetului. Marcajele notelor sunt plasate după propoziția relevantă.
