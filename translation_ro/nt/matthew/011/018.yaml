  naturalness: «Nici mâncând, nici bând» este inteligibil, dar este o construcție participială eliptică mai puțin firească în româna standard contemporană după «a venit». «Fără să mănânce și fără să bea» păstrează concizia și paralelismul fără a adăuga obiecte precum pâine sau vin.
  terminology: «Ioan» și «demon» sunt termenii potriviți. «Are un demon» este formularea românească naturală și păstrează acuzația relatată; nota oferă alternativa interpretativă fără a o impune.
