  text: ἦλθεν γὰρ Ἰωάννης μήτε ἐσθίων μήτε πίνων, καὶ λέγουσιν· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/018.yaml
  text: For John came neither eating nor drinking[a], and they say, ‘He has a demon.’
translation:
  language: ro
  text: 'Căci Ioan a venit fără să mănânce și fără să bea, și ei spun: „Are un demon.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν
  choice: a venit
  rationale: Aoristul lui ἔρχομαι indică venirea sau apariția lui Ioan; „a venit” redă direct și firesc verbul.
- source_word: γὰρ
  choice: Căci
  rationale: Leagă versetul explicativ de afirmația precedentă și păstrează această relație în registru biblic modern.
- source_word: Ἰωάννης
  choice: Ioan
  rationale: Forma românească consacrată a numelui.
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: nici mâncând, nici bând
  rationale: Păstrează construcția participială comprimată și ascetismul sugerat, fără a adăuga pâine sau vin, care nu apar în textul grec al acestui verset.
- source_word: καὶ λέγουσιν
  choice: iar ei spun
  rationale: Prezentul „spun” păstrează caracterul viu și generalizator; „iar” exprimă natural legătura și contrastul contextual al lui καί.
- source_word: Δαιμόνιον ἔχει
  choice: Are demon
  rationale: Redă literal și natural expresia greacă, fără a o transforma în formularea mai interpretativă „este posedat de demon”.
theological_decisions:
- issue: Redarea acuzației Δαιμόνιον ἔχει
  choice: Are demon
  alternative: Este posedat de demon
  rationale: Textul relatează acuzația adversarilor, nu afirmația naratorului. Redarea literală păstrează formularea și tensiunea textului fără a preciza mai mult decât greaca.
translation_notes:
  register: Română standard modernă, concisă și demnă. Construcția „nici mâncând, nici bând” păstrează deliberat expresia eliptică a originalului; formularea nu trebuie înțeleasă în sens absolut, ci descrie felul ascetic de viață al lui Ioan.
