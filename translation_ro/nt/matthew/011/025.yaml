id: MAT.11.25
reference: Matthew 11:25
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: ro
  text: 'În vremea aceea, Isus a răspuns și a zis: „Te laud[a], Tată, Doamne al cerului și al pământului, pentru că ai ascuns aceste lucruri de cei înțelepți și pricepuți și le-ai descoperit copilașilor[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Îți mulțumesc”. Verbul grecesc poate exprima atât mulțumirea, cât și lauda ori recunoașterea deschisă.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „pruncilor”. Aici termenul are probabil un sens metaforic, referindu-se la cei asemenea copiilor în felul în care primesc revelația.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: În vremea aceea
  rationale: Formulare temporală firească în registrul narativ biblic românesc, fără a sugera o imediatitate mai precisă decât textul.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: a răspuns și a zis
  rationale: Păstrează ambele verbe ale formulei narative influențate semitic, chiar dacă nu este consemnată o întrebare explicită.
- source_word: Ἐξομολογοῦμαί σοι
  choice: Te laud
  rationale: În adresarea către Tatăl, verbul exprimă o recunoaștere deschisă cu nuanță de laudă sau mulțumire; alegerea redă tonul doxologic fără ideea nepotrivită de mărturisire a unui păcat.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: Tată, Doamne al cerului și al pământului
  rationale: Păstrează succesiunea vocativelor și exprimă limpede suveranitatea Tatălui.
- source_word: ὅτι
  choice: pentru că
  rationale: Redă firesc valoarea cauzală, prezentând temeiul laudei.
- source_word: ἔκρυψας
  choice: ai ascuns
  rationale: Redare directă a aoristului activ, fără atenuarea atribuirii acțiunii lui Dumnezeu.
- source_word: ταῦτα ... αὐτά
  choice: aceste lucruri ... le
  rationale: Menține deschis referentul expresiei grecești, iar pronumele românesc evită repetarea greoaie.
- source_word: ἀπὸ σοφῶν καὶ συνετῶν
  choice: de cei înțelepți și pricepuți
  rationale: Substantivizează natural adjectivele și păstrează perechea semantică dintre înțelepciune și capacitatea de înțelegere.
- source_word: ἀπεκάλυψας
  choice: le-ai descoperit
  rationale: „A descoperi” este o redare românească naturală a ideii de dezvăluire și păstrează sensul de comunicare divină.
- source_word: νηπίοις
  choice: copilașilor
  rationale: Păstrează imaginea celor foarte mici și permite sensul metaforic contextual, fără a-l înlocui cu o interpretare precum „celor smeriți”.
theological_decisions:
- issue: Acțiunea divină de a ascunde și a descoperi
  choice: ai ascuns ... și le-ai descoperit
  alternative: ai îngăduit ca aceste lucruri să rămână ascunse ... și le-ai făcut cunoscute
  rationale: Verbele grecești sunt active și îl au pe Tatăl drept subiect. Formularea păstrează atribuirea directă și tensiunea teologică, fără a introduce o explicație despre predestinare, împietrire sau simplă permisiune.
- issue: Sensul lui νηπίοις
  choice: copilașilor
  alternative: pruncilor; celor smeriți
  rationale: Termenul poate desemna literal prunci, dar aici are probabil o forță metaforică. „Copilașilor” păstrează metafora și contrastul cu cei considerați înțelepți și pricepuți, fără să reducă sensul la o categorie teologică explicită.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formula „a răspuns și a zis” păstrează textura sursei, iar „copilașilor” conservă metafora fără limbaj arhaic. Marcajele [a] și [b] apar în text la termenii corespunzători.
