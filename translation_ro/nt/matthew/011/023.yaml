id: MAT.11.23
reference: Matthew 11:23
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: ro
  text: Și tu, Capernaume, vei fi oare înălțat până la cer? Până în Hades[a] vei coborî! Căci, dacă faptele de putere săvârșite în tine ar fi avut loc în Sodoma, ea ar fi rămas până astăzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „tărâmul morților”. În greacă, „Hades”, nu „Gheena”.
    reason: Clarifică sensul lexical și evită confundarea a doi termeni grecești distincți.
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Capernaume
  rationale: Este folosită forma românească consacrată a toponimului, în vocativ, deoarece cetatea este adresată direct.
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: vei fi oare înălțat până la cer?
  rationale: μή împreună cu viitorul este redat ca întrebare retorică ce anticipează un răspuns negativ. „Înălțat” păstrează atât imaginea spațială, cât și posibila nuanță de statut.
- source_word: ἕως ᾅδου καταβήσῃ
  choice: Până în Hades vei coborî
  rationale: „Vei coborî” redă direct καταβήσῃ, iar „Hades” păstrează termenul grec și evită confundarea lui cu Gheena.
- source_word: δυνάμεις
  choice: faptele de putere
  rationale: Expresia păstrează atât ideea unor fapte concrete, cât și dimensiunea puterii, fără a restrânge nejustificat sensul la termenul modern „minuni”.
- source_word: γενόμεναι ἐν σοί
  choice: săvârșite în tine
  rationale: Formularea este naturală pentru fapte de putere și păstrează adresarea cetății ca loc în care acestea s-au petrecut.
- source_word: ἐγενήθησαν
  choice: ar fi avut loc
  rationale: Condiționalul perfect redă situația contrară faptelor din protaza greacă și se potrivește semantic cu evenimentele menționate.
- source_word: ἔμεινεν ἂν
  choice: ea ar fi rămas
  rationale: Condiționalul perfect redă apodoza ireală; pronumele singular se referă la cetatea Sodoma.
- source_word: μέχρι τῆς σήμερον
  choice: până astăzi
  rationale: Redare directă, clară și firească în româna actuală.
theological_decisions:
- issue: Redarea lui ᾅδης
  choice: Hades
  alternative: tărâmul morților; iad
  rationale: Transliterarea păstrează termenul grec și distincția sa față de Gheena, fără a introduce în text asocieri doctrinare mai târzii legate de „iad”.
- issue: Forța lui μή în întrebarea adresată Capernaumului
  choice: 'întrebare retorică: „vei fi oare înălțat...?”'
  alternative: 'afirmație negativă: „nu vei fi înălțat...”'
  rationale: Construcția poate fi redată firesc drept întrebare retorică ce așteaptă un răspuns negativ, păstrând forma și tensiunea textului grec.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Vocativul „Capernaume” este firesc în adresarea directă, iar inversiunea „Până în Hades vei coborî” păstrează accentul contrastiv al originalului.
