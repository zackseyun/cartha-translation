  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς πάλιν εἶπεν ⸂ἐν παραβολαῖς αὐτοῖς⸃ λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/001.yaml
  text: 'And Jesus answered and again spoke to them in parables[a], saying:'
translation:
  language: ro
  text: 'Isus a răspuns și le-a vorbit din nou în pilde[a], spunând:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Isus a răspuns și le-a spus din nou prin pilde”. În greacă apare idiomul narativ obișnuit „a răspuns”, chiar dacă imediat înainte nu este formulată nicio întrebare directă.'
    reason: Alternativă lexicală și clarificarea unui idiom narativ grecesc.
lexical_decisions:
- source_word: Καὶ
  choice: și
  rationale: Păstrează legătura narativă simplă, fără a introduce o nuanță temporală care nu este exprimată explicit.
- source_word: ἀποκριθεὶς
  choice: a răspuns
  rationale: Redă idiomul narativ grecesc obișnuit, chiar dacă imediat înainte nu este formulată o întrebare directă.
- source_word: ὁ Ἰησοῦς
  choice: Isus
  rationale: Forma modernă uzuală a numelui propriu; articolul grecesc nu se redă înaintea numelor personale în română.
- source_word: πάλιν
  choice: din nou
  rationale: Exprimă limpede repetarea acțiunii în desfășurarea discursului.
- source_word: εἶπεν
  choice: le-a vorbit
  rationale: Evită repetiția greoaie „a spus... spunând”, păstrând ideea adresării verbale și integrând firesc dativul αὐτοῖς.
- source_word: ἐν παραβολαῖς
  choice: în pilde
  rationale: Redă în mod consacrat și natural mijlocul sau maniera vorbirii; „pildă” este termenul românesc biblic clar pentru παραβολή.
- source_word: αὐτοῖς
  choice: le-
  rationale: Pronumele dativ indică persoanele cărora li se adresează Isus și este redat idiomatic prin cliticul românesc.
- source_word: λέγων
  choice: spunând
  rationale: Păstrează participiul care introduce conținutul discursului ce urmează.
theological_decisions:
- issue: Sensul idiomatic al lui ἀποκριθεὶς când nu precedă imediat o întrebare explicită
  choice: Se păstrează formularea „a răspuns”.
  alternative: „a reluat vorbirea” sau „a început iar să le vorbească”
  rationale: Construcția este un idiom narativ obișnuit, nu o afirmație teologică distinctă. Redarea literală păstrează continuitatea discursului și nu explicitează în mod nejustificat la ce anume răspunde Isus.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. Formularea păstrează structura și ușoara tensiune idiomatică a textului grecesc, dar evită repetiția nefirescă „a spus... spunând”.
