  text: Διδάσκαλε, ποία ἐντολὴ μεγάλη ἐν τῷ νόμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/036.yaml
  text: Teacher[a], which commandment is greatest in the Law?
translation:
  language: ro
  text: Învățătorule, care este cea mai mare poruncă din Lege?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Învățătorule
  rationale: Vocativ direct adresat lui Isus; redă firesc și standard sensul lui διδάσκαλος, fără nuanța ierarhică posibilă a lui „Stăpâne”.
- source_word: ποία
  choice: care
  rationale: Adjectiv interogativ care cere identificarea unei porunci dintre poruncile Legii; „care” este formularea românească naturală.
- source_word: ἐντολὴ
  choice: poruncă
  rationale: Termenul denumește aici o poruncă din cadrul Legii iudaice; „poruncă” este echivalentul românesc clar și consacrat.
- source_word: μεγάλη
  choice: cea mai mare
  rationale: Deși greaca folosește formal adjectivul la gradul pozitiv, construcția interogativă cu ποία și contextul selectării dintre mai multe porunci îi dau în română o forță superlativă idiomatică.
- source_word: ἐν τῷ νόμῳ
  choice: din Lege
  rationale: În română, „poruncă din Lege” exprimă natural apartenența la corpul Legii/Torei; majuscula indică referirea la Legea scripturistică.
theological_decisions:
- issue: Redarea adjectivului μεγάλη ca pozitiv sau superlativ
  choice: cea mai mare
  alternative: mare
  rationale: Forma grecească este pozitivă, dar întrebarea cere idiomatic identificarea poruncii aflate pe primul loc. Românescul „care este porunca mare” ar suna nefiresc și ar putea obscuriza sensul contextual; superlativul păstrează aici mai bine forța întrebării fără a introduce o doctrină distinctivă.
translation_notes:
  register: Română standard modernă, clară și demnă. Vocativul „Învățătorule” este firesc în adresare, iar „Lege” este scris cu majusculă pentru referentul scripturistic.
