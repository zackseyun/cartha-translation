id: MAT.22.9
reference: Matthew 22:9
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: πορεύεσθε οὖν ἐπὶ τὰς διεξόδους τῶν ὁδῶν, καὶ ὅσους ⸀ἐὰν εὕρητε καλέσατε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/009.yaml
  text: Therefore go to the street intersections[b][a], and invite to the wedding feast as many as you find.
translation:
  language: ro
  text: Așadar, mergeți la răspântiile drumurilor[a] și invitați la ospățul de nuntă[b] pe toți cei pe care îi veți găsi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „la intersecțiile drumurilor” ori „la ieșirile drumurilor”; expresia grecească se referă la locurile unde drumurile se despart, ies sau se întâlnesc.
    reason: lexical_alternative
  - marker: b
    text: În greacă, literal „la nunți”, expresie care desemnează celebrarea sau ospățul de nuntă.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: mergeți
  rationale: Imperativul prezent are aici forță directivă simplă; „mergeți” este forma firească și demnă în româna actuală.
- source_word: οὖν
  choice: așadar
  rationale: Redă legătura de concluzie sau rezultat cu ceea ce precedă, într-un registru natural și ușor solemn.
- source_word: ἐπὶ τὰς διεξόδους τῶν ὁδῶν
  choice: la răspântiile drumurilor
  rationale: Expresia indică locurile unde drumurile se despart, ies sau se întâlnesc. „Răspântiile drumurilor” păstrează imaginea fără a impune un cadru urban modern.
- source_word: ὅσους ἐὰν εὕρητε
  choice: pe toți cei pe care îi veți găsi
  rationale: Construcția exprimă caracter nedefinit și cuprinzător; această formulare românească redă firesc ideea de a-i invita pe oricâți vor găsi.
- source_word: καλέσατε
  choice: invitați
  rationale: În contextul ospățului, verbul înseamnă a chema ca oaspeți, nu doar a striga sau a convoca.
- source_word: εἰς τοὺς γάμους
  choice: la ospățul de nuntă
  rationale: Pluralul grecesc desemnează aici celebrarea nunții, în special ospățul, nu mai multe nunți.
theological_decisions: []
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează caracterul direct al poruncii și evită atât arhaismele, cât și precizarea excesivă a cadrului geografic.
