  text: εἰπὸν οὖν ἡμῖν τί σοι δοκεῖ· ἔξεστιν δοῦναι κῆνσον Καίσαρι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/017.yaml
  text: Tell us, then, what do you think? Is it lawful to give the poll tax to Caesar, or not?
translation:
  language: ro
  text: 'Spuneți-ne, deci, ce părere ai: este permis să-i dăm Cezarului birul sau nu?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί σοι δοκεῖ
  choice: ce părere ai
  rationale: Redă idiomatic întrebarea despre judecata sau opinia interlocutorului.
- source_word: ἔξεστιν
  choice: este permis
  rationale: Păstrează ideea de permisiune sau legitimitate fără a preciza în mod nejustificat dacă este vorba strict de Legea religioasă ori de dreptul civil.
- source_word: δοῦναι
  choice: să-i dăm
  rationale: Traduce direct verbul «a da», păstrând formularea sursei și tensiunea întrebării.
- source_word: κῆνσον
  choice: birul
  rationale: În context desemnează tributul/capitația datorată autorității romane; «birul» este concis, inteligibil și distinct de taxarea în general.
- source_word: Καίσαρι
  choice: Cezarului
  rationale: Folosește forma românească consacrată a titlului imperial și marchează corect destinatarul plății.
theological_decisions:
- issue: Natura permisiunii exprimate prin ἔξεστιν
  choice: este permis
  alternative: este îngăduit de Lege
  rationale: Textul grec nu menționează explicit Legea; formularea aleasă păstrează deschisă întrebarea privind legitimitatea religioasă, morală sau juridică.
translation_notes:
  register: Română standard modernă, clară și demnă. Ordinea este ușor naturalizată, iar punctuația scoate în evidență întrebarea principală.
