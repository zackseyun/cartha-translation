source:
  edition: SBLGNT
  text: ⸂ὁ δὲ βασιλεὺς⸃ ὠργίσθη, καὶ πέμψας τὰ στρατεύματα αὐτοῦ ἀπώλεσεν τοὺς φονεῖς ἐκείνους καὶ τὴν πόλιν αὐτῶν ἐνέπρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/007.yaml
  text: But the king became angry, and he sent his troops, destroyed those murderers, and burned their city.
translation:
  language: ro
  text: Dar regele s-a mâniat și și-a trimis trupele, i-a nimicit pe ucigașii aceia și le-a ars cetatea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθη
  choice: s-a mâniat
  rationale: Redă direct și demn reacția puternică de mânie a regelui.
- source_word: τὰ στρατεύματα αὐτοῦ
  choice: trupele sale
  rationale: Termenul se referă la forțele militare ale regelui; „trupele” este firesc în româna actuală.
- source_word: ἀπώλεσεν
  choice: i-a nimicit
  rationale: Păstrează forța verbului, care în context indică uciderea sau distrugerea totală a făptașilor.
- source_word: τὴν πόλιν αὐτῶν
  choice: cetatea lor
  rationale: În contextul antic, πόλις desemnează așezarea urbană organizată; „cetatea” se potrivește registrului narativ biblic fără a fi arhaic.
- source_word: ἐνέπρησεν
  choice: a ars
  rationale: Redare naturală a incendierii cetății, cu sens cauzativ clar în context.
theological_decisions:
- issue: Caracterul judiciar al acțiunii regelui în parabolă
  choice: 'Formularea păstrează succesiunea explicită: mânie, trimiterea trupelor, nimicirea ucigașilor și arderea cetății.'
  alternative: Atenuarea prin termeni precum „i-a pedepsit” sau „a distrus cetatea”.
  rationale: Textul grecesc descrie acțiuni violente concrete și nu trebuie spiritualizat ori atenuat; aplicarea teologică a parabolei rămâne deschisă contextului.
translation_notes:
  register: Română standard modernă, clară și demnă. Construcția coordonată urmărește ritmul textului grec, iar pronumele posesive sunt redate idiomatic prin „și-a” și „le-a”.
