id: MAT.22.13
reference: Matthew 22:13
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τότε ⸂ὁ βασιλεὺς εἶπεν⸃ τοῖς διακόνοις· Δήσαντες αὐτοῦ πόδας καὶ χεῖρας ⸂ἐκβάλετε αὐτὸν⸃ εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/013.yaml
  text: Then the king said to the attendants[a], ‘Bind his feet and hands and throw him out into the outer darkness. In that place there will be weeping and gnashing of teeth.’
translation:
  language: ro
  text: 'Atunci regele le-a spus slujitorilor: „Legați-i picioarele și mâinile și aruncați-l în întunericul de afară. Acolo va fi plânsul și scrâșnirea dinților.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Redă firesc adverbul temporal care introduce următoarea acțiune din narațiune.
- source_word: ὁ βασιλεὺς
  choice: regele
  rationale: Păstrează în mod direct cadrul regal al parabolei.
- source_word: τοῖς διακόνοις
  choice: slujitorilor
  rationale: În contextul ospățului, termenul îi desemnează pe cei aflați în serviciul regelui; „slujitori” este natural și nu impune un sens ecleziastic.
- source_word: Δήσαντες
  choice: Legați-i
  rationale: Participiul aorist anterior imperativului principal este redat idiomatic ca primul imperativ al unei succesiuni de porunci; „a lega” păstrează forța concretă a lui δέω.
- source_word: αὐτοῦ πόδας καὶ χεῖρας
  choice: picioarele și mâinile
  rationale: Păstrează ordinea neobișnuită, dar clară, a textului grec.
- source_word: ἐκβάλετε αὐτὸν
  choice: aruncați-l
  rationale: Exprimă expulzarea energică indicată de ἐκβάλλω, într-o română actuală.
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: în întunericul de afară
  rationale: Redă inteligibil contrastul spațial al expresiei mateene, fără a transforma metafora într-o explicație doctrinară.
- source_word: ἐκεῖ
  choice: Acolo
  rationale: Echivalent locativ direct și firesc în română.
- source_word: ἔσται
  choice: va fi
  rationale: Redare directă a viitorului verbului εἰμί.
- source_word: ὁ κλαυθμὸς
  choice: plânsul
  rationale: Păstrează substantivul articulat și formula consacrată în contextul mateean.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: scrâșnirea dinților
  rationale: Este echivalentul românesc consacrat și precis al expresiei, fără a decide dacă indică mai ales chin sau mânie.
theological_decisions:
- issue: Natura imaginii excluderii din parabolă
  choice: Este păstrată imaginea concretă a aruncării în „întunericul de afară”, fără explicație doctrinară adăugată.
  alternative: Identificarea explicită a locului cu iadul ori reducerea imaginii la simpla excludere de la ospăț.
  rationale: Greaca prezintă o imagine vie de judecată în cadrul parabolei, dar versetul nu o explică mai îngust; traducerea păstrează această tensiune.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formularea păstrează ordinea greacă „picioarele și mâinile” și evită atât arhaismele, cât și terminologia confesională.
