  terminology: „Înviere” este termenul consacrat și exact pentru ἀνάστασις în acest context. „Soție” este cerut de contextul matrimonial pentru γυνή. Nota explică responsabil că „au avut-o” se referă contextual la faptul că au avut-o ca soție, fără a înlocui în text exprimarea concisă a grecei.
