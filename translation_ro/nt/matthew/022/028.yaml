  text: ἐν τῇ ⸂ἀναστάσει οὖν⸃ τίνος τῶν ἑπτὰ ἔσται γυνή; πάντες γὰρ ἔσχον αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/028.yaml
  text: In the resurrection[a], then, whose wife of the seven will she be? For they all had her.
translation:
  language: ro
  text: La înviere, deci, a căruia dintre cei șapte va fi ea soție? Căci toți au avut-o.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mai explicit: „Căci toți șapte au avut-o de soție.” Greaca spune literal: „Căci toți au avut-o.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάσει
  choice: la înviere
  rationale: Construcția ἐν cu dativul are aici sens temporal/situațional. „La înviere” este formularea românească firească și păstrează referirea concretă la învierea viitoare a morților.
- source_word: οὖν
  choice: deci
  rationale: Marchează concluzia întrebării construite pe situația relatată anterior; „deci” redă limpede legătura logică.
- source_word: τίνος τῶν ἑπτὰ
  choice: a căruia dintre cei șapte
  rationale: Genitivul interogativ cere identificarea unuia din grupul celor șapte. Formularea este exactă și naturală în română.
- source_word: ἔσται γυνή
  choice: va fi ea soție
  rationale: În context matrimonial, γυνή înseamnă „soție”, nu doar „femeie”; viitorul ἔσται este redat direct prin „va fi”.
- source_word: πάντες γὰρ
  choice: căci toți
  rationale: γάρ introduce motivul întrebării, iar πάντες îi desemnează colectiv pe cei șapte frați. „Căci” păstrează tonul argumentativ și demn.
- source_word: ἔσχον αὐτήν
  choice: au avut-o
  rationale: Redarea păstrează formularea scurtă și intenționat tensionată a grecei. Contextul arată că este vorba despre faptul că fiecare a avut-o ca soție; nota oferă explicitarea.
theological_decisions:
- issue: Sensul lui ἀνάστασις în provocarea saducheilor
  choice: învierea viitoare a morților
  alternative: o existență vagă după moarte
  rationale: Contextul disputei și răspunsul imediat următor al lui Isus privesc învierea propriu-zisă. „La înviere” păstrează afirmația concretă fără adaos confesional.
- issue: Caracterul relației exprimate prin ἔσχον αὐτήν
  choice: păstrarea expresiei literale „au avut-o”, explicată în notă ca relație matrimonială
  alternative: redarea directă „s-au căsătorit cu ea” sau „au avut-o de soție”
  rationale: Originalul folosește verbul general „a avea”, iar contextul matrimonial îi precizează sensul. Redarea aleasă conservă concizia și tensiunea retorică fără a lăsa cititorul fără lămurire.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Inversiunea moderată „a căruia dintre cei șapte va fi ea soție?” păstrează accentul interogativ al originalului fără a suna arhaic. Nota este plasată la expresia pe care o explică.
