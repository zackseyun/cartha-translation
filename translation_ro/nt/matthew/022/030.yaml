  source_fidelity: Textul redă corect raportul explicativ al lui γάρ, opoziția dintre γαμοῦσιν și γαμίζονται și comparația, nu identificarea, cu îngerii. Totuși, „din cer” poate sugera proveniența îngerilor, pe când ἐν τῷ οὐρανῷ îi situează „în cer”.
  naturalness: „La înviere”, „se căsătoresc” și „sunt dați în căsătorie” sunt formulări firești în româna standard actuală. „Îngerii lui Dumnezeu în cer” este natural în registru biblic și redă mai exact locativul grecesc.
  terminology: „Înviere”, „căsătorie”, „îngerii lui Dumnezeu” și „cer” sunt termeni potriviți, transparenți și consecvenți cu registrul pasajului. Nota este ajustată pentru a evita formularea prea interpretativă „de după înviere”.
