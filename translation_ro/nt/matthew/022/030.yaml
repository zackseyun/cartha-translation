id: MAT.22.30
reference: Matthew 22:30
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐν γὰρ τῇ ἀναστάσει οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ ὡς ἄγγελοι ⸀θεοῦ ἐν ⸀τῷ οὐρανῷ εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/030.yaml
  text: For in the resurrection they neither marry nor are given in marriage[a], but are like the angels of God in heaven.
translation:
  language: ro
  text: Căci, la înviere[a], nici nu se căsătoresc, nici nu sunt dați în căsătorie, ci sunt ca îngerii lui Dumnezeu în cer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „în starea de înviere”.'
    reason: Expresia grecească poate desemna nu doar momentul învierii, ci și condiția vieții înviate.
lexical_decisions:
- source_word: ἐν ... τῇ ἀναστάσει
  choice: la înviere
  rationale: În româna actuală, „la înviere” redă firesc expresia grecească și poate indica atât momentul învierii, cât și existența inaugurată prin ea. Alternativa mai explicită este păstrată în notă.
- source_word: γαμοῦσιν
  choice: se căsătoresc
  rationale: Este echivalentul românesc general și actual pentru intrarea în căsătorie, fără a limita inutil verbul la bărbați.
- source_word: γαμίζονται
  choice: sunt dați în căsătorie
  rationale: Forma pasivă păstrează distincția față de verbul precedent și ideea că altcineva participă la aranjarea sau încheierea căsătoriei.
- source_word: ὡς
  choice: ca
  rationale: 'Introduce o comparație, nu o identificare: cei înviați sunt asemenea îngerilor în privința descrisă, nu devin îngeri.'
- source_word: ἄγγελοι θεοῦ
  choice: îngerii lui Dumnezeu
  rationale: Redă explicit genitivul θεοῦ și păstrează formularea demnă și transparentă a sursei.
- source_word: ἐν τῷ οὐρανῷ
  choice: din cer
  rationale: În această construcție românească, „din cer” identifică în mod firesc îngerii aflați în cer; sensul este locuința cerească, nu bolta fizică.
- source_word: γὰρ
  choice: Căci
  rationale: Păstrează legătura explicativă cu afirmația precedentă.
theological_decisions:
- issue: Natura asemănării cu îngerii
  choice: Cei înviați sunt comparați cu îngerii, în contextul lipsei căsătoriei.
  alternative: Formularea ar putea fi extinsă pentru a sugera că oamenii devin îngeri sau dobândesc în toate privințele un mod de existență îngeresc.
  rationale: ὡς exprimă asemănarea, nu identitatea, iar contextul imediat indică drept punct al comparației faptul că nu se mai încheie căsătorii.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. „Se căsătoresc” evită perechea tradițională marcată pe gen „se însoară/se mărită”, iar pasivul distinct „sunt dați în căsătorie” păstrează contrastul verbal al grecei.
