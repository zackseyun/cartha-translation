  text: λέγουσιν ⸀αὐτῷ· Καίσαρος. τότε λέγει αὐτοῖς· Ἀπόδοτε οὖν τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/021.yaml
  text: They said to him[a], “Caesar’s.” Then he said to them, “Therefore render to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: ro
  text: 'Ei i-au spus: „Ale Cezarului.” Atunci le-a zis: „Dați, așadar, Cezarului ce este al Cezarului[a], iar lui Dumnezeu ce este al lui Dumnezeu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Dați înapoi Cezarului ... iar lui Dumnezeu ...” Verbul grecesc poate însemna „a da înapoi”, „a plăti” sau „a da ceea ce se cuvine”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Ei i-au spus
  rationale: Prezentul istoric grecesc este redat prin perfectul compus, firesc în narațiunea românească; dativul αὐτῷ este păstrat prin pronumele „i-”.
- source_word: Καίσαρος
  choice: Ale Cezarului
  rationale: Genitivul răspunde eliptic la întrebarea anterioară despre chip și inscripție. Forma românească exprimă natural apartenența celor două elemente subînțelese.
- source_word: τότε λέγει αὐτοῖς
  choice: Atunci le-a zis
  rationale: „Atunci” păstrează succesiunea schimbului de replici, iar prezentul istoric λέγει este redat idiomatic la trecut.
- source_word: Ἀπόδοτε
  choice: Dați-i
  rationale: În context, verbul cere oferirea către fiecare a ceea ce îi aparține ori i se cuvine. Redarea evită atât arhaicul „dați tribut”, cât și restrângerea poruncii la plata taxei; alternativele lexicale sunt indicate în notă.
- source_word: οὖν
  choice: așadar
  rationale: Marchează concluzia trasă din răspunsul interlocutorilor și are un registru actual, demn.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: Cezarului ce este al Cezarului
  rationale: Construcția românească exprimă apartenența și păstrează clar destinatarul la dativ, fără a introduce o teorie politică absentă din text.
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: lui Dumnezeu ce este al lui Dumnezeu
  rationale: Păstrează paralelismul cu propoziția despre Cezar și revendicarea divină fără a-i preciza artificial întinderea.
theological_decisions:
- issue: Raportul dintre obligația civică și ceea ce îi aparține lui Dumnezeu
  choice: Porunca paralelă este păstrată fără explicații doctrinare suplimentare.
  alternative: Limitarea afirmației la plata impozitului sau interpretarea ei ca legitimare a unei autorități absolute a statului.
  rationale: Textul distinge între ceea ce este al Cezarului și ceea ce este al lui Dumnezeu, dar nu definește aici exhaustiv limitele fiecărei sfere; traducerea păstrează această tensiune.
translation_notes:
  register: Română standard modernă, cu formulare demnă și accesibilă. „Ale Cezarului” redă răspunsul eliptic în raport cu chipul și inscripția menționate în context, iar repetiția „Cezarului... al Cezarului / lui Dumnezeu... al lui Dumnezeu” conservă echilibrul retoric al originalului.
