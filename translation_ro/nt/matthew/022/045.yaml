id: MAT.22.45
reference: Matthew 22:45
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: εἰ οὖν Δαυὶδ καλεῖ αὐτὸν κύριον, πῶς υἱὸς αὐτοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/045.yaml
  text: If[a], then, David calls him Lord, how is he his son?
translation:
  language: ro
  text: Așadar, dacă David îl numește „Domn”[a], cum este el fiul lui?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, exprimând mai explicit sensul din context: „Așadar, dacă David îl numește pe Mesia «Domn», cum este el fiul lui?”'
    reason: Clarifică referentul pronumelui din context, fără a introduce această explicitare în textul principal.
lexical_decisions:
- source_word: εἰ οὖν
  choice: Așadar, dacă
  rationale: Păstrează atât caracterul condițional al lui εἰ, cât și legătura inferențială exprimată de οὖν, într-o ordine firească în româna modernă.
- source_word: Δαυὶδ
  choice: David
  rationale: Forma consacrată în limba română pentru numele propriu.
- source_word: καλεῖ
  choice: îl numește
  rationale: Redă sensul de a desemna sau a numi pe cineva într-un anumit fel; este mai precis aici decât simplul „îi spune”.
- source_word: αὐτὸν
  choice: îl / el
  rationale: Pronumele masculin îl indică pe referentul preluat din context, fără a introduce explicit termenul „Mesia”, absent din verset.
- source_word: κύριον
  choice: „Domn”
  rationale: „Domn” păstrează valoarea onorifică și rezonanța cristologică a lui κύριος în citarea Psalmului 110:1; ghilimelele marchează numirea predicativă.
- source_word: πῶς
  choice: cum
  rationale: Redă direct întrebarea privitoare la relația logică dintre cele două afirmații.
- source_word: υἱὸς αὐτοῦ
  choice: fiul lui
  rationale: Păstrează formularea familială și regal-mesianică, precum și tensiunea deliberată a întrebării; „urmașul lui” ar fi mai explicit, dar mai interpretativ.
- source_word: ἐστιν
  choice: este
  rationale: Redare directă și firească a copulei la prezent.
theological_decisions:
- issue: Forța mesianică și cristologică a faptului că David îl numește „Domn”
  choice: Se păstrează „Domn” și „fiul lui”, fără explicarea relației dintre ele în textul principal.
  alternative: „Așadar, dacă David îl numește pe Mesia «Domn», cum este Mesia fiul lui?”
  rationale: Textul grec folosește pronume și se sprijină pe contextul anterior. Introducerea explicită a lui „Mesia” ar clarifica referentul, dar ar adăuga un substantiv absent din verset și ar diminua ambiguitatea anaforică autentică. Formularea aleasă păstrează tensiunea dintre descendența davidică și domnia celui avut în vedere.
translation_notes:
  register: Română standard modernă, clară și demnă. Ordinea „Așadar, dacă” este idiomatică și păstrează structura argumentativă. Formularea evită atât arhaismele, cât și explicitările doctrinare care ar rezolva întrebarea retorică.
