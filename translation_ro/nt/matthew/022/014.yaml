  text: πολλοὶ γάρ εἰσιν κλητοὶ ὀλίγοι δὲ ἐκλεκτοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/014.yaml
  text: For many are called[b][a], but few are chosen.
translation:
  language: ro
  text: Căci mulți sunt chemați[a], dar puțini sunt aleși.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „invitați”; în contextul ospățului de nuntă, termenul poate desemna persoanele poftite la ospăț.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: mulți
  rationale: Adjectiv substantivizat la plural; redarea concisă „mulți” păstrează contrastul direct cu ὀλίγοι.
- source_word: γάρ
  choice: căci
  rationale: Introduce explicația concluzivă a afirmației precedente; „căci” păstrează legătura logică și registrul demn fără a o suprainterpreta.
- source_word: εἰσιν
  choice: sunt
  rationale: Echivalentul direct și firesc al prezentului verbului εἰμί.
- source_word: κλητοὶ
  choice: chemați
  rationale: Păstrează sensul lexical larg al termenului și contrastul consacrat cu ἐκλεκτοί. În contextul ospățului de nuntă poate însemna și „invitați”, alternativă indicată în notă.
- source_word: ὀλίγοι
  choice: puțini
  rationale: Echivalent direct care păstrează forma antitetică și concisă a sentinței.
- source_word: δὲ
  choice: dar
  rationale: Redă clar contrastul dintre cele două propoziții.
- source_word: ἐκλεκτοί
  choice: aleși
  rationale: Redă transparent sensul adjectivului grec fără a adăuga o formulare doctrinară mai tehnică; în română, „aleși” poate păstra și rezonanța teologică a termenului.
theological_decisions:
- issue: Redarea lui ἐκλεκτοί într-un text asociat dezbaterilor despre chemare și alegere
  choice: aleși
  alternative: cei aleși
  rationale: „Aleși” este echivalentul lexical direct, natural și suficient de deschis pentru a păstra tensiunea teologică a textului fără a impune un sistem doctrinar ulterior.
- issue: Redarea lui κλητοί în contextul pildei ospățului de nuntă
  choice: chemați
  alternative: invitați
  rationale: „Invitați” se potrivește foarte bine imaginii ospățului, însă „chemați” păstrează domeniul semantic mai larg și opoziția dintre κλητοί și ἐκλεκτοί. Nota face vizibilă nuanța contextuală legitimă.
translation_notes:
  register: Formulare scurtă, proverbială și demnă, în româna standard actuală. „Căci” păstrează funcția explicativă a lui γάρ, iar paralelismul „mulți… puțini” și contrastul „chemați… aleși” reproduc concizia și tensiunea textului grec.
