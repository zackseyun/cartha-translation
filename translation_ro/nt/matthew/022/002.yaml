  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ, ὅστις ἐποίησεν γάμους τῷ υἱῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/002.yaml
  text: The kingdom of heaven was compared to a king who gave a wedding feast for his son[a][b].
translation:
  language: ro
  text: Împărăția cerurilor a fost asemănată cu un împărat care a făcut ospăț de nuntă pentru fiul său[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „se poate asemăna cu”. Verbul grecesc este, literal, la forma „a fost asemănată cu” ori „a fost făcută asemenea”.'
    reason: lexical_alternative
  - marker: b
    text: În greacă, „nunți” este la plural, expresie care poate desemna festivitățile sau ospățul de nuntă.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡμοιώθη
  choice: a fost asemănată cu
  rationale: Redă aoristul pasiv indicativ fără a introduce nuanța modală a formulării „se poate asemăna”; expresia este firească în registrul parabolic românesc.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Împărăția cerurilor
  rationale: Păstrează expresia caracteristică lui Matei și lasă deschisă nuanța de domnie și de sferă a stăpânirii.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: cu un împărat
  rationale: În această construcție, ἀνθρώπῳ βασιλεῖ îl prezintă idiomatic pe personaj drept un om care era rege; românescul „un om, un împărat” ar fi greoi, iar „împărat” redă natural titlul regal în contextul unei nunți princiare.
- source_word: ὅστις
  choice: care
  rationale: Introduce simplu acțiunea împăratului, fără a accentua excesiv pronumele relativ.
- source_word: ἐποίησεν
  choice: a făcut
  rationale: Împreună cu γάμους, verbul are sensul idiomatic de a organiza sau a ține festivități de nuntă; „a făcut ospăț” este natural și apropiat de forma greacă.
- source_word: γάμους
  choice: ospăț de nuntă
  rationale: Pluralul grecesc desemnează festivitățile nunții sau banchetul de nuntă; singularul colectiv românesc comunică limpede scena ospățului.
- source_word: τῷ υἱῷ αὐτοῦ
  choice: pentru fiul său
  rationale: Păstrează valoarea dativului de interes/avantaj; caracterul nupțial este deja exprimat prin „ospăț de nuntă”.
theological_decisions:
- issue: Sensul expresiei „Împărăția cerurilor”
  choice: Păstrarea formulării mateene „Împărăția cerurilor”
  alternative: „Împărăția lui Dumnezeu” sau „domnia cerurilor”
  rationale: Nu armonizează expresia cu alte Evanghelii și nu restrânge sensul la o singură interpretare a împărăției ca domeniu ori domnie.
- issue: Formula introductivă a comparației
  choice: „a fost asemănată cu”
  alternative: „se poate asemăna cu” sau „este asemenea”
  rationale: Păstrează indicativul pasiv aorist și tensiunea formulării grecești, fără a adăuga o modalitate care nu este explicită.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. „Împărat” și „ospăț de nuntă” păstrează coloratura regală și festivă fără formulări arhaice excesive.
