id: MAT.22.4
reference: Matthew 22:4
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους λέγων· Εἴπατε τοῖς κεκλημένοις· Ἰδοὺ τὸ ἄριστόν μου ⸀ἡτοίμακα, οἱ ταῦροί μου καὶ τὰ σιτιστὰ τεθυμένα, καὶ πάντα ἕτοιμα· δεῦτε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/004.yaml
  text: Again he sent other servants[a], saying, ‘Tell those who have been invited, “Look, I have prepared my dinner; my oxen and my fattened cattle have been slaughtered, and everything is ready[c][b]. Come to the wedding feast.”’
translation:
  language: ro
  text: 'A trimis din nou alți robi[a], spunând: „Spuneți-le celor invitați: «Iată, mi-am pregătit masa; taurii mei și animalele îngrășate au fost înjunghiate și totul este gata. Veniți la nuntă[b]!»”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „alți slujitori”. Termenul grecesc poate desemna atât un rob, cât și un slujitor, în funcție de context.
    reason: lexical_alternative
  - marker: b
    text: Sau „la ospățul de nuntă”. Pluralul grecesc poate desemna festivitățile nunții în ansamblu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἀπέστειλεν
  choice: A trimis din nou
  rationale: Redă firesc repetarea acțiunii și aoristul narativ.
- source_word: ἄλλους δούλους
  choice: alți robi
  rationale: În cadrul gospodăriei regale din parabolă, „robi” păstrează statutul social exprimat de δοῦλοι; nota indică alternativa românească mai largă.
- source_word: Εἴπατε τοῖς κεκλημένοις
  choice: Spuneți-le celor invitați
  rationale: Participiul perfect pasiv îi desemnează pe cei care primiseră deja invitația; formularea românească este naturală și păstrează rezultatul prezent.
- source_word: Ἰδοὺ
  choice: Iată
  rationale: Formulă românească actuală și demnă pentru particula care atrage atenția.
- source_word: τὸ ἄριστόν μου ἡτοίμακα
  choice: mi-am pregătit masa
  rationale: ἄριστον denumește o masă pregătită, adesea masa de mai devreme a zilei; „masa” evită precizarea nesigură a orei și se potrivește contextului.
- source_word: οἱ ταῦροί μου καὶ τὰ σιτιστὰ
  choice: boii mei și vitele îngrășate
  rationale: „Boii” redă bovinele numite explicit, iar „vitele îngrășate” păstrează caracterul nespecific al adjectivului substantivizat τὰ σιτιστά fără a introduce „viței”.
- source_word: τεθυμένα
  choice: au fost tăiate
  rationale: În contextul pregătirii mesei, verbul se referă la tăierea animalelor; formularea evită sugestia unei jertfe cultice.
- source_word: δεῦτε εἰς τοὺς γάμους
  choice: Veniți la nuntă
  rationale: Pluralul grec poate desemna celebrarea nunții ca întreg; singularul colectiv este idiomatic în română, iar alternativa este consemnată în notă.
theological_decisions:
- issue: Redarea lui δοῦλος în gospodăria regală a parabolei
  choice: robi
  alternative: slujitori
  rationale: „Robi” păstrează mai clar raportul de stăpânire presupus de termen în acest cadru, fără a transforma personajele în simpli angajați; „slujitori” rămâne o alternativă lexicală legitimă.
- issue: Întinderea semantică a pluralului τοὺς γάμους
  choice: la nuntă
  alternative: la ospățul de nuntă
  rationale: Textul grec spune literal „la nunți”, un plural idiomatic pentru festivitățile nupțiale. „La nuntă” păstrează lărgimea expresiei, în timp ce alternativa explicitează aspectul ospățului.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. Punctuația urmărește clar nivelurile de citare, iar termenii evită atât arhaizarea inutilă, cât și explicitări care depășesc greaca.
