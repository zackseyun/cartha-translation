  to: 'A trimis din nou alți robi[a], spunând: „Spuneți-le celor invitați: «Iată, mi-am pregătit masa; taurii mei și animalele îngrășate au fost înjunghiate și totul este gata. Veniți la nuntă[b]!»”'
