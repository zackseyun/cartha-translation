  yaml_path: translation/nt/matthew/022/022.yaml
  text: And hearing this[a], they were amazed, and leaving him, they went away.
translation:
  language: ro
  text: Când au auzit[a], s-au mirat și, lăsându-l, au plecat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Auzind acestea”.'
    reason: Alternativă sintactică mai apropiată de forma participială grecească; „acestea” explicitează obiectul subînțeles din context.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Când au auzit
  rationale: Participiul aorist are aici valoare temporală și indică o acțiune anterioară verbului principal. Propoziția temporală este firească în româna actuală și nu introduce un obiect care lipsește din textul grecesc.
- source_word: ἐθαύμασαν
  choice: s-au mirat
  rationale: Verbul exprimă uimirea sau mirarea stârnită de răspunsul lui Isus. „S-au mirat” este clar, firesc și păstrează tonul narativ.
- source_word: ἀφέντες αὐτόν
  choice: lăsându-l
  rationale: Redarea directă păstrează participiul și sensul de a-l lăsa pe Isus și a se îndepărta de el, fără a adăuga ideea explicită de „singur”.
- source_word: ἀπῆλθαν
  choice: au plecat
  rationale: „Au plecat” redă natural sensul de îndepărtare al verbului ἀπέρχομαι și menține mișcarea simplă a narațiunii.
- source_word: καὶ ... καὶ
  choice: și ... și
  rationale: Coordonarea repetată păstrează succesiunea directă și ritmul alert al textului grecesc.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu formulare simplă și demnă. Ordinea acțiunilor și construcția participială din a doua parte sunt păstrate fără adaosuri interpretative.
