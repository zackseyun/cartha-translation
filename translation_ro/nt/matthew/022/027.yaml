lexical_decisions:
- source_word: ὕστερον
  choice: La urmă
  rationale: În construcția cu πάντων, indică ultimul moment din succesiunea relatată; „la urmă” redă firesc ideea de „în cele din urmă”.
- source_word: δὲ
  choice: și
  rationale: Conectorul slab continuă relatarea; în română, „și” leagă natural moartea femeii de morțile bărbaților menționați anterior.
- source_word: πάντων
  choice: de tot
  rationale: Împreună cu ὕστερον formează expresia „la urmă de tot”, care exprimă concis faptul că femeia a murit ultima dintre persoanele din relatare.
- source_word: ἀπέθανεν
  choice: a murit
  rationale: Redare directă și neutră a aoristului, fără eufemism.
- source_word: ἡ γυνή
  choice: femeia
  rationale: γυνή poate însemna „femeie” sau „soție”; aici, „femeia” păstrează formularea greacă și evită raportarea ei la un singur soț în acest context.
