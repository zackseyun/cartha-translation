  text: Last of all[a], the woman died.
translation:
  language: ro
  text: În cele din urmă[a], a murit și femeia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „La urmă de toți”; literal: „după toți”, adică după toți bărbații menționați.'
