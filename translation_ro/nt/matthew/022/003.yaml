source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τοὺς δούλους αὐτοῦ καλέσαι τοὺς κεκλημένους εἰς τοὺς γάμους, καὶ οὐκ ἤθελον ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/003.yaml
  text: And he sent his servants to call those who had been invited to the wedding feast[c][b][a], and they were unwilling to come.
translation:
  language: ro
  text: Și i-a trimis pe slujitorii săi[a] să-i cheme pe cei invitați[b] la ospățul de nuntă[c], dar ei n-au vrut să vină.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „sclavii săi”. Cuvântul grecesc poate desemna atât slujitori, cât și sclavi.'
    reason: lexical_alternative
  - marker: b
    text: 'Literal: „pe cei chemați”. În context, este vorba despre cei care fuseseră deja invitați.'
    reason: lexical_alternative
  - marker: c
    text: 'Sau: „la sărbătoarea nunții” ori „la nunți”. Pluralul grecesc desemnează aici celebrarea nunții, inclusiv ospățul.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: i-a trimis
  rationale: Aoristul indicativ este redat firesc prin perfectul compus românesc; pronumele anticipativ este idiomatic înaintea complementului direct personal.
- source_word: δούλους
  choice: slujitorii
  rationale: Termenul poate desemna sclavi sau slujitori. În această parabolă este evidențiat rolul lor de agenți ai regelui, nu statutul lor juridic, astfel că „slujitori” este alegerea contextuală cea mai naturală.
- source_word: καλέσαι
  choice: să-i cheme
  rationale: Infinitivul de scop este redat idiomatic prin conjunctiv. „Să-i cheme” păstrează, pe cât permite româna naturală, legătura lexicală cu participiul κεκλημένους.
- source_word: κεκλημένους
  choice: cei invitați
  rationale: Participiul perfect pasiv îi desemnează pe cei care primiseră deja invitația. „Cei invitați” exprimă clar situația rezultată, fără o perifrază greoaie.
- source_word: εἰς τοὺς γάμους
  choice: la ospățul de nuntă
  rationale: Pluralul γάμοι se referă aici la celebrarea nunții, în special la ospăț; formularea redă limpede cadrul social al parabolei.
- source_word: οὐκ ἤθελον ἐλθεῖν
  choice: n-au vrut să vină
  rationale: Construcția exprimă voința sau lipsa disponibilității. Formularea românească este directă și naturală, fără a întări sensul până la „au refuzat”.
theological_decisions:
- issue: Redarea lui δοῦλος într-o narațiune parabolică
  choice: slujitori
  alternative: sclavi
  rationale: Contextul pune accentul pe însărcinarea și acțiunea trimișilor regelui, nu pe condiția lor de oameni aflați în proprietatea lui. Nota păstrează însă alternativa lexicală reală.
- issue: Relația lexicală dintre καλέσαι și κεκλημένους
  choice: „să-i cheme pe cei invitați”
  alternative: „să-i cheme pe cei chemați”
  rationale: Redarea aleasă evită ambiguitatea nefirescă a expresiei „cei chemați” în contextul unui ospăț, iar nota semnalează repetiția aceleiași familii verbale din greacă.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Conjuncția adversativă „dar” redă natural contrastul contextual al celui de-al doilea καί, fără a schimba sensul propoziției. Marcajele notelor sunt grupate la finalul versetului și fiecare apare în text.
