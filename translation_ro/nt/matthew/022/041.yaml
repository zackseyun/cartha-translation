  text: Συνηγμένων δὲ τῶν Φαρισαίων ἐπηρώτησεν αὐτοὺς ὁ Ἰησοῦς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/041.yaml
  text: While the Pharisees were gathered together, Jesus asked them,
translation:
  language: ro
  text: 'Pe când fariseii erau adunați, Isus i-a întrebat:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνηγμένων
  choice: erau adunați
  rationale: Participiul aorist pasiv, într-o construcție de genitiv absolut, stabilește împrejurarea în care are loc întrebarea. Formularea „Pe când ... erau adunați” redă firesc în română sensul circumstanțial de fundal.
- source_word: δὲ
  choice: Pe când
  rationale: Particula marchează aici o tranziție narativă ușoară, fără contrast puternic. În română nu este nevoie de un corespondent lexical separat; legătura discursivă este integrată natural în propoziția circumstanțială.
- source_word: τῶν Φαρισαίων
  choice: fariseii
  rationale: Denumirea consacrată și clară a grupului; cazul genitiv din greacă este cerut de construcția absolută, nu de sintaxa românească.
- source_word: ἐπηρώτησεν
  choice: i-a întrebat
  rationale: Verbul introduce întrebarea adresată fariseilor. „A întrebat” este echivalentul modern și firesc, fără nuanța suplimentară, posibil adversativă, a lui „a chestionat”.
- source_word: αὐτοὺς
  choice: i-
  rationale: Pronumele românesc neaccentuat reia explicit grupul fariseilor ca obiect direct al verbului.
- source_word: ὁ Ἰησοῦς
  choice: Isus
  rationale: Redarea standard a numelui propriu; articolul grecesc dinaintea numelui nu se reproduce în acest context în română.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu formulare demnă și ușor de înțeles. Virgula finală din stratul englezesc este înlocuită cu două puncte, deoarece versetul introduce întrebarea directă din versetul următor; aceasta este punctuație editorială naturală, nu o adăugire de sens.
