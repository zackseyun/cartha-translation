base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/034.yaml
  text: But when the Pharisees heard that he had silenced the Sadducees[a], they gathered together.
translation:
  language: ro
  text: Dar fariseii, auzind că îi redusese la tăcere pe saduchei[a], s-au adunat laolaltă.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mai literal, verbul grecesc evocă ideea de „a pune botniță”. Este folosit aici figurat, cu sensul de a-i reduce la tăcere într-o dispută.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Dar
  rationale: Marchează tranziția și ușorul contrast cu episodul precedent, într-o formulare firească în română.
- source_word: Φαρισαῖοι
  choice: fariseii
  rationale: Denumirea consacrată în română pentru această grupare iudaică.
- source_word: ἀκούσαντες
  choice: auzind
  rationale: Participiul românesc redă natural participiul aorist și raportul temporal față de acțiunea principală.
- source_word: ἐφίμωσεν
  choice: îi închisese gura
  rationale: Redă idiomatic și sugestiv sensul figurat al verbului, care înseamnă literal «a pune botniță» și aici indică reducerea la tăcere într-o dispută.
- source_word: Σαδδουκαίους
  choice: saducheilor
  rationale: Denumirea consacrată în română pentru această grupare iudaică; dativul este cerut de expresia «a-i închide gura cuiva».
- source_word: συνήχθησαν
  choice: s-au adunat
  rationale: Redă valoarea intranzitivă a formei pasive, indicând reunirea grupului.
- source_word: ἐπὶ τὸ αὐτό
  choice: laolaltă
  rationale: Păstrează sensul idiomatic de reunire împreună, fără a preciza nejustificat locul sau scopul.
