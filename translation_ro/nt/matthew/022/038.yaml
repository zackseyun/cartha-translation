base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/038.yaml
  text: This is the great and first commandment[a].
translation:
  language: ro
  text: Aceasta este porunca cea mare și cea dintâi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Aceasta este porunca de căpetenie.” În greacă apar, mai literal, două caracterizări: „porunca cea mare și cea dintâi”.'
    reason: alternativă lexicală
lexical_decisions:
- source_word: αὕτη
  choice: Aceasta
  rationale: Pronumele demonstrativ trimite la porunca citată în versetul precedent și îi păstrează firesc valoarea anaforică.
- source_word: ἐστὶν
  choice: este
  rationale: Copulă simplă la indicativ prezent, redată direct.
- source_word: μεγάλη
  choice: cea mare
  rationale: Adjectivul pozitiv exprimă aici importanța sau rangul. „Cea mai mare” ar transforma nejustificat forma pozitivă într-un superlativ.
- source_word: πρώτη
  choice: cea dintâi
  rationale: Redă direct ideea de întâietate, fără a o contopi cu sensul adjectivului μεγάλη; formularea are un registru biblic demn și rămâne inteligibilă în româna actuală.
- source_word: ἐντολή
  choice: porunca
  rationale: În contextul Legii, „poruncă” este termenul românesc firesc și consacrat pentru ἐντολή.
theological_decisions:
- issue: Relația dintre μεγάλη și πρώτη în descrierea poruncii
  choice: 'Ambele adjective sunt redate coordonat: „porunca cea mare și cea dintâi”.'
  alternative: „cea mai importantă poruncă” / „cea mai mare și cea dintâi poruncă”
  rationale: Greaca folosește două adjective pozitive coordonate, nu un superlativ explicit. Redarea separată păstrează tensiunea dintre măreție și întâietate și evită reducerea lor la o singură idee interpretativă.
translation_notes:
  register: Română standard modernă, cu registru biblic demn. „Cea dintâi” păstrează distincția dintre cele două adjective grecești fără a suna obscur; articolul demonstrativ adjectival repetat susține coordonarea clară.
