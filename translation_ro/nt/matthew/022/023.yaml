id: MAT.22.23
reference: Matthew 22:23
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ἡμέρᾳ προσῆλθον αὐτῷ Σαδδουκαῖοι, ⸀λέγοντες μὴ εἶναι ἀνάστασιν, καὶ ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/023.yaml
  text: On that day Sadducees came to him[a], saying there is no resurrection, and they questioned him.
translation:
  language: ro
  text: În ziua aceea, au venit la el niște saduchei, care spun că nu există înviere,[a] și l-au întrebat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „spunând că nu există înviere”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: În ziua aceea
  rationale: Redă firesc în româna actuală expresia temporală grecească și păstrează referința narativă.
- source_word: προσῆλθον αὐτῷ
  choice: au venit la el
  rationale: προσέρχομαι poate însemna „a veni la” sau „a se apropia de”; formularea aleasă este naturală și fidelă contextului.
- source_word: Σαδδουκαῖοι
  choice: niște saduchei
  rationale: Folosește denumirea consacrată în română; articolul nehotărât redă caracterul nearticulat al substantivului grecesc fără a sugera neapărat întregul grup.
- source_word: λέγοντες μὴ εἶναι ἀνάστασιν
  choice: care spun că nu există înviere
  rationale: Participiul poate fi circumstanțial („spunând”) sau atributiv, descriind poziția caracteristică a saducheilor. În română, propoziția relativă exprimă limpede și natural această identificare.
- source_word: ἀνάστασιν
  choice: înviere
  rationale: Este termenul românesc consacrat pentru ridicarea morților și păstrează încărcătura teologică a termenului grec.
- source_word: ἐπηρώτησαν αὐτὸν
  choice: l-au întrebat
  rationale: Verbul înseamnă „a întreba/a pune o întrebare”; contextul următor introduce întrebarea directă, iar formularea românească este firească.
theological_decisions:
- issue: Redarea negării doctrinare a saducheilor
  choice: care spun că nu există înviere
  alternative: spunând că nu există înviere
  rationale: Construcția relativă prezintă credința caracteristică a grupului fără a o aproba și fără a adăuga precizări doctrinare absente din text. Nota păstrează și posibilitatea unei legături participiale mai directe cu acțiunea venirii.
translation_notes:
  register: Română standard modernă, clară și demnă. Două puncte la final anticipează întrebarea directă din versetul următor și redau funcția tranzitivă a verbului „l-au întrebat” în context.
