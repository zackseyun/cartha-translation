source:
  edition: SBLGNT
  text: τότε λέγει τοῖς δούλοις αὐτοῦ· Ὁ μὲν γάμος ἕτοιμός ἐστιν, οἱ δὲ κεκλημένοι οὐκ ἦσαν ἄξιοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/008.yaml
  text: Then he says to his servants[a], ‘The wedding feast is ready, but those who were invited were not worthy.’
translation:
  language: ro
  text: 'Atunci le spune slujitorilor săi: „Ospățul de nuntă este gata, dar cei invitați[a] nu erau vrednici.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „cei chemați”. Participiul grecesc poate fi redat mai literal astfel, dar, în acest context de ospăț, se referă la cei invitați la nuntă.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Redă firesc adverbul temporal și păstrează succesiunea narațiunii.
- source_word: λέγει
  choice: le spune
  rationale: Păstrează prezentul istoric grecesc și vivacitatea narațiunii; pronumele „le” exprimă natural în română destinatarul la dativ.
- source_word: δούλοις
  choice: slujitorilor
  rationale: În cadrul acestei parabole despre o curte regală, „slujitori” este o redare firească și contextual adecvată, fără a accentua inutil statutul juridic pe care îl poate desemna termenul δοῦλος.
- source_word: ὁ μὲν γάμος
  choice: Ospățul de nuntă
  rationale: În context, γάμος desemnează celebrarea sau ospățul nunții, pregătit pentru invitați. Contrastul μὲν...δὲ este redat prin structura propoziției și conjuncția „dar”.
- source_word: ἕτοιμός ἐστιν
  choice: este gata
  rationale: Redare directă și idiomatică a adjectivului predicativ împreună cu verbul copulativ.
- source_word: οἱ δὲ κεκλημένοι
  choice: dar cei invitați
  rationale: Participiul perfect pasiv al lui καλέω se referă aici la invitații la ospăț. „Invitați” exprimă limpede sensul contextual, iar alternativa mai literală este păstrată în nota de subsol.
- source_word: οὐκ ἦσαν ἄξιοι
  choice: nu erau vrednici
  rationale: Păstrează evaluarea exprimată de ἄξιοι fără a preciza în plus motivul nevredniciei.
theological_decisions:
- issue: Posibilele conotații teologice ale lui κεκλημένοι („chemați”) în contextul parabolei
  choice: cei invitați
  alternative: cei chemați
  rationale: Contextul imediat indică o invitație la ospățul de nuntă. Redarea principală evită introducerea nejustificată a unei categorii teologice tehnice, iar nota păstrează transparența față de formularea mai literală.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Prezentul istoric este păstrat, iar punctuația dialogului urmează uzul românesc actual.
