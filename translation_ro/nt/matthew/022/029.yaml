id: MAT.22.29
reference: Matthew 22:29
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/029.yaml
  text: But Jesus answered them[a], “You are mistaken, because you know neither the Scriptures nor the power of God.”
translation:
  language: ro
  text: 'Dar Isus le-a răspuns: „Vă înșelați[a], pentru că nu cunoașteți nici Scripturile, nici puterea lui Dumnezeu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Sunteți în rătăcire” ori „Vă amăgiți”.'
    reason: Alternativa lexicală păstrează gama semantică a verbului Πλανᾶσθε, care poate indica eroarea, rătăcirea sau amăgirea.
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Dar Isus le-a răspuns
  rationale: Redă firesc în română formula grecească de răspuns, evitând redundanța rigidă „răspunzând, le-a zis”; δέ marchează aici o tranziție ușor adversativă.
- source_word: Πλανᾶσθε
  choice: Vă înșelați
  rationale: Exprimă clar faptul că interlocutorii sunt în eroare, păstrând totodată posibilitatea semantică de rătăcire sau amăgire proprie verbului πλανάω.
- source_word: μὴ εἰδότες
  choice: pentru că nu cunoașteți
  rationale: Participiul circumstanțial indică în context cauza erorii; formularea este naturală în româna actuală.
- source_word: τὰς γραφὰς
  choice: Scripturile
  rationale: Pluralul desemnează scrierile sacre recunoscute în contextul iudaic; „Scripturile” este echivalentul românesc consacrat și precis.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: nici puterea lui Dumnezeu
  rationale: Păstrează coordonarea negativă și redă direct sintagma grecească, fără interpretări suplimentare.
theological_decisions:
- issue: Cauza erorii saducheilor
  choice: Necunoașterea atât a Scripturilor, cât și a puterii lui Dumnezeu este prezentată drept cauza erorii lor.
  alternative: Participiul ar putea fi redat mai formal prin „necunoscând”, lăsând relația sintactică mai puțin explicită.
  rationale: În context, μὴ εἰδότες explică în mod natural de ce se înșală; „pentru că” face această relație inteligibilă fără a adăuga o concluzie doctrinară.
translation_notes:
  register: Română standard modernă, demnă și directă. „Vă înșelați” este accesibil și polemic fără a suna arhaic; paralelismul „nici… nici…” păstrează structura și accentul enunțului grec.
