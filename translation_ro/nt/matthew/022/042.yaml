  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: λέγων· Τί ὑμῖν δοκεῖ περὶ τοῦ χριστοῦ; τίνος υἱός ἐστιν; λέγουσιν αὐτῷ· Τοῦ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/042.yaml
  text: saying[a], “What do you think about the Messiah? Whose son is he?” They said to him, “David’s.”
translation:
  language: ro
  text: 'zicând: „Ce credeți despre Mesia[a]? Al cui fiu este?” Ei i-au spus: „Al lui David.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „Cristos”. Titlul grecesc este Χριστός (Christos), folosit aici în sens mesianic.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: zicând
  rationale: Participiul prezent al lui λέγω introduce cuvintele lui Isus; „zicând” păstrează legătura sintactică și registrul narativ biblic fără adaos interpretativ.
- source_word: Τί ὑμῖν δοκεῖ
  choice: Ce credeți
  rationale: Expresia cere părerea sau judecata interlocutorilor; formularea este firească și clară în româna actuală.
- source_word: περὶ τοῦ χριστοῦ
  choice: despre Mesia
  rationale: Χριστός este folosit aici ca titlu în cadrul unei discuții mesianice iudaice; „Mesia” exprimă funcția titulară, nu un nume propriu.
- source_word: τίνος υἱός ἐστιν
  choice: Al cui fiu este?
  rationale: Redarea păstrează întrebarea directă despre descendență și ordinea idiomatică a limbii române.
- source_word: λέγουσιν αὐτῷ
  choice: Ei i-au răspuns
  rationale: Prezentul istoric grecesc este redat natural prin perfectul compus; în context, verbul „a spune” constituie un răspuns la întrebare, iar „i-au răspuns” face explicită această funcție fără a-i schimba sensul.
- source_word: Τοῦ Δαυίδ
  choice: Al lui David
  rationale: Genitivul eliptic reia substantivul „fiu” din întrebare. Româna permite aceeași elipsă prin formula firească „Al lui David”.
theological_decisions:
- issue: Redarea lui Χριστός
  choice: Mesia
  alternative: Cristos
  rationale: În acest context, termenul este un titlu mesianic aflat în centrul întrebării despre descendență. „Mesia” păstrează această funcție; alternativa tradițională „Cristos” este consemnată în notă.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează concizia dialogului grec și elipsa din răspuns; „zicând” oferă continuitate cu versetul anterior.
