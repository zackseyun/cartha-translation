  text: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς ὅλος ὁ νόμος ⸂κρέμαται καὶ οἱ προφῆται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/040.yaml
  text: On these two commandments hang the whole Law and the Prophets[a][b].
translation:
  language: ro
  text: De aceste două porunci atârnă toată Legea și Profeții.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expresia „Legea și Profeții” desemnează aici mărturia Scripturilor în ansamblu; imaginea arată că aceasta se sprijină pe cele două porunci.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς
  choice: De aceste două porunci
  rationale: În română, construcția „a atârna de” redă firesc metafora dependenței, chiar dacă prepoziția greacă ἐν are sensul de bază „în”.
- source_word: ὅλος ὁ νόμος
  choice: toată Legea
  rationale: Redă integralitatea exprimată de ὅλος, iar majuscula indică referirea la Legea/Tora ca parte a Scripturilor.
- source_word: κρέμαται
  choice: atârnă
  rationale: Păstrează imaginea concretă a verbului grec, fără a o reduce la parafraza interpretativă „depinde”.
- source_word: καὶ οἱ προφῆται
  choice: și Profeții
  rationale: Păstrează formula consacrată pentru mărturia scripturală, nu doar o referire generică la persoane profetice.
theological_decisions:
- issue: Sensul formulei „Legea și Profeții”
  choice: Formula scripturală este păstrată ca atare, indicând ansamblul mărturiei scripturale rezumat în cele două porunci ale iubirii.
  alternative: O referire mai restrânsă numai la învățătura etică legală și profetică.
  rationale: În Matei, „Legea și Profeții” funcționează ca formulă pentru Scripturi ori pentru mărturia lor autoritativă. Traducerea nu înlocuiește formula cu o explicație doctrinară.
translation_notes:
  register: Română standard modernă, concisă și demnă. Formularea „atârnă de” păstrează metafora greacă și este idiomatică; ordinea propoziției urmează accentul pus în sursă pe cele două porunci.
