source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ δοῦλοι ἐκεῖνοι εἰς τὰς ὁδοὺς συνήγαγον πάντας ⸀οὓς εὗρον, πονηρούς τε καὶ ἀγαθούς· καὶ ἐπλήσθη ὁ ⸀γάμος ἀνακειμένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/010.yaml
  text: And those servants went out into the roads and gathered everyone they found[a], both evil and good[c][b]; and the wedding hall was filled with guests reclining at the table.
translation:
  language: ro
  text: Și robii aceia au ieșit pe drumuri și au adunat pe toți cei pe care i-au găsit, deopotrivă răi și buni; și sala nunții[a] s-a umplut de oaspeți care stăteau întinși la masă[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'În greacă: „nunta”; termenul poate desemna ospățul de nuntă sau sala acestuia. În acest context, este descris ca fiind umplut de cei care stăteau întinși la masă.'
    reason: lexical_alternative
  - marker: b
    text: La mesele festive din acea vreme, oaspeții mâncau de obicei stând întinși.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλοι
  choice: robi
  rationale: Păstrează statutul de dependență și autoritatea stăpânului din cadrul parabolei, fără a îndulci termenul prin simplul „slujitori”.
- source_word: ὁδοὺς
  choice: drumuri
  rationale: Redă firesc sensul larg de căi publice, fără a restrânge scena la străzi urbane.
- source_word: συνήγαγον πάντας οὓς εὗρον
  choice: i-au adunat pe toți cei pe care i-au găsit
  rationale: Păstrează caracterul cuprinzător și personal al expresiei grecești într-o formulare românească naturală.
- source_word: πονηρούς τε καὶ ἀγαθούς
  choice: și răi, și buni
  rationale: Păstrează contrastul moral explicit, precum și construcția coordonatoare care include ambele categorii.
- source_word: γάμος
  choice: sala nunții
  rationale: Deși termenul înseamnă literal „nunta” sau celebrarea nunții, verbul „s-a umplut” și menționarea celor întinși la masă indică aici spațiul ospățului.
- source_word: ἐπλήσθη
  choice: s-a umplut
  rationale: Redare directă și idiomatică a pasivului grecesc.
- source_word: ἀνακειμένων
  choice: de oaspeți întinși la masă
  rationale: Exprimă postura obișnuită la mesele festive antice și face limpede că persoanele adunate participă la ospăț.
theological_decisions:
- issue: Caracterizarea morală a celor adunați
  choice: și răi, și buni
  alternative: și oameni răi, și oameni buni
  rationale: Menține caracterul nediscriminatoriu al adunării și tensiunea ulterioară a parabolei, fără a deduce că simpla prezență anulează orice deosebire morală.
- issue: Referentul lui γάμος
  choice: sala nunții
  alternative: ospățul de nuntă / nunta
  rationale: Contextul sugerează locul sau cadrul ospățului, dar nota păstrează sensul literal și ambiguitatea lexicală a termenului.
translation_notes:
  register: Română literară modernă, clară și demnă. „Robii” păstrează realitatea socială exprimată de δοῦλοι; „întinși la masă” redă concret obiceiul antic fără formulări arhaice.
