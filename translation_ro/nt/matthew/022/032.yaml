  text: Ἐγώ εἰμι ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ; οὐκ ἔστιν ⸂ὁ θεὸς⸃ νεκρῶν ἀλλὰ ζώντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/032.yaml
  text: I am the God of Abraham and the God of Isaac and the God of Jacob. He is not the God of the dead[a], but of the living.
translation:
  language: ro
  text: „Eu sunt Dumnezeul lui Avraam, Dumnezeul lui Isaac și Dumnezeul lui Iacov”? El nu este Dumnezeul celor morți, ci al celor vii.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Eu sunt
  rationale: Redă direct identificarea la timpul prezent și păstrează forma citatului pe care se întemeiază argumentul lui Isus.
- source_word: ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: Dumnezeul lui Avraam, Dumnezeul lui Isaac și Dumnezeul lui Iacov
  rationale: Păstrează repetarea explicită a lui θεός și greutatea retorică a construcției, într-o formulare românească firească.
- source_word: οὐκ ἔστιν ὁ θεὸς
  choice: El nu este Dumnezeul
  rationale: Pronumele reia natural în română referentul tocmai numit; sensul construcției grecești rămâne nealterat, fără repetarea mai greoaie „Dumnezeu nu este Dumnezeul”.
- source_word: νεκρῶν
  choice: celor morți
  rationale: Adjectivul plural substantivizat este redat concis și firesc, păstrând contrastul cu „celor vii”.
- source_word: ζώντων
  choice: celor vii
  rationale: Participiul prezent substantivizat este redat prin formula românească naturală și paralelă cu „celor morți”.
theological_decisions:
- issue: Implicația faptului că patriarhii sunt vii înaintea lui Dumnezeu în argumentul lui Isus despre înviere
  choice: Afirmația este redată direct, fără explicitarea unei doctrine despre înviere sau despre starea intermediară.
  alternative: „El nu este Dumnezeul celor morți, ci al celor care sunt încă vii înaintea lui.”
  rationale: Textul susține argumentul lui Isus, dar traducerea nu trebuie să adauge concluzii explicative care nu sunt formulate aici.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Repetarea lui „Dumnezeul” este păstrată pentru fidelitate și efect retoric; în a doua propoziție se folosește pronumele „El”, firesc în română. Semnul întrebării păstrează punctuația și funcția citatului în context.
