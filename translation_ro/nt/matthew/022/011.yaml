id: MAT.22.11
reference: Matthew 22:11
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: εἰσελθὼν δὲ ὁ βασιλεὺς θεάσασθαι τοὺς ἀνακειμένους εἶδεν ἐκεῖ ἄνθρωπον οὐκ ἐνδεδυμένον ἔνδυμα γάμου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/011.yaml
  text: But when the king came in to look at the guests reclining at the table[b][a], he saw there a man not dressed in wedding clothes.
translation:
  language: ro
  text: Dar, când regele a intrat ca să-i privească pe oaspeții întinși la masă[a], a văzut acolo un om care nu purta o haină de nuntă[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: În lumea antică, oaspeții de la un ospăț festiv mâncau de obicei stând întinși, rezemați în jurul mesei.
    reason: Notă culturală care explică postura exprimată de participiul grec.
  - marker: b
    text: 'Sau: „nu era îmbrăcat în haine de nuntă”.'
    reason: Alternativă lexicală ce redă expresia ca îmbrăcăminte potrivită unei nunți.
lexical_decisions:
- source_word: εἰσελθὼν δὲ
  choice: Dar, când ... a intrat
  rationale: Participiul aorist indică o acțiune anterioară verbului principal, iar δέ marchează trecerea narativă cu o ușoară opoziție. Construcția cu „când” este firească în româna actuală.
- source_word: ὁ βασιλεὺς
  choice: regele
  rationale: Echivalentul direct și firesc în contextul unei parabole regale.
- source_word: θεάσασθαι
  choice: ca să-i privească
  rationale: Infinitivul exprimă scopul intrării. „Să-i privească” păstrează ideea unei observări intenționate fără a impune sensul mai puternic de control oficial.
- source_word: τοὺς ἀνακειμένους
  choice: oaspeții întinși la masă
  rationale: Participiul îi desemnează pe cei care luau masa în postura obișnuită la un ospăț antic. „Oaspeții” explicitează rolul implicat de context, iar „întinși la masă” păstrează detaliul cultural.
- source_word: εἶδεν ἐκεῖ
  choice: a văzut acolo
  rationale: Redare directă a verbului narativ și a adverbului de loc.
- source_word: ἄνθρωπον
  choice: un om
  rationale: Substantivul masculin singular desemnează aici un individ de sex masculin din relatare.
- source_word: οὐκ ἐνδεδυμένον
  choice: nu purta
  rationale: Participiul perfect descrie starea prezentă a omului; în română, „nu purta” este o formulare naturală pentru lipsa veșmântului cerut.
- source_word: ἔνδυμα γάμου
  choice: o haină de nuntă
  rationale: Păstrează singularul substantivului grecesc și redă firesc îmbrăcămintea potrivită ospățului de nuntă, fără a preciza mai mult decât textul.
theological_decisions:
- issue: Imaginea ospățului și postura participanților
  choice: Se păstrează postura de a sta întins la masă și se explicitează că persoanele sunt oaspeți.
  alternative: „cei întinși” sau simplu „oaspeții”
  rationale: Formularea păstrează cadrul istoric al ospățului antic, dar rămâne ușor de înțeles pentru cititorul modern.
- issue: Sensul hainei de nuntă
  choice: 'Imaginea rămâne concretă: omul nu purta o haină de nuntă.'
  alternative: „nu era îmbrăcat în haine de nuntă”
  rationale: Textul nu explică aici simbolismul hainei; traducerea nu îl identifică cu vreo doctrină anume și păstrează tensiunea parabolei.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. Formularea evită arhaismele, păstrează detaliul cultural al mesei antice și nu explică alegoric haina de nuntă.
