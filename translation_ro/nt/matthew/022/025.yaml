  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἦσαν δὲ παρ’ ἡμῖν ἑπτὰ ἀδελφοί· καὶ ὁ πρῶτος ⸀γήμας ἐτελεύτησεν, καὶ μὴ ἔχων σπέρμα ἀφῆκεν τὴν γυναῖκα αὐτοῦ τῷ ἀδελφῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/025.yaml
  text: There were seven brothers among us[a]. The first married and died, and having no offspring[b], he left his wife to his brother.
translation:
  language: ro
  text: Erau la noi șapte frați. Cel dintâi s-a căsătorit și a murit și, neavând urmași[a], a lăsat-o pe soția sa fratelui său[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, „neavând sămânță”. Aici „sămânță” înseamnă urmași sau descendenți.
    reason: lexical_alternative
  - marker: b
    text: 'Formularea trimite la obiceiul căsătoriei de levirat: fratele unui bărbat decedat era chemat să se căsătorească cu văduva pentru a-i ridica urmași celui decedat; vezi Deuteronomul 25:5.'
    reason: cultural_note
lexical_decisions:
- source_word: παρ’ ἡμῖν
  choice: la noi
  rationale: Redă firesc în română asocierea sau prezența în cadrul comunității despre care vorbesc saducheii, fără a introduce o nuanță temporală absentă din text.
- source_word: ἑπτὰ ἀδελφοί
  choice: șapte frați
  rationale: În contextul căsătoriei de levirat, termenul îi desemnează clar pe frații de sex masculin.
- source_word: ὁ πρῶτος
  choice: cel dintâi
  rationale: Indică primul din succesiunea fraților, fără a afirma că era neapărat cel mai în vârstă.
- source_word: γήμας
  choice: s-a căsătorit
  rationale: Participiul aorist arată că încheierea căsătoriei a precedat moartea; formularea este naturală și păstrează succesiunea.
- source_word: ἐτελεύτησεν
  choice: a murit
  rationale: Redare directă și clară a verbului, fără eufemizare.
- source_word: μὴ ἔχων σπέρμα
  choice: neavând urmași
  rationale: σπέρμα înseamnă literal „sămânță”, dar aici are sens familial și juridic, desemnând descendenții.
- source_word: ἀφῆκεν τὴν γυναῖκα αὐτοῦ
  choice: i-a lăsat ... soția
  rationale: Verbul indică faptul că soția a rămas în urma lui la moarte, nu divorțul sau abandonul.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: fratelui său
  rationale: Dativul îl indică pe fratele supraviețuitor căruia îi este lăsată văduva, conform cadrului căsătoriei de levirat.
theological_decisions:
- issue: Dacă implicația căsătoriei de levirat trebuie explicitată în textul principal
  choice: Textul principal păstrează formularea implicită a grecei.
  alternative: „i-a lăsat fratelui său soția ca s-o ia de soție”
  rationale: Contextul juridic din Deuteronomul 25:5 presupune că fratele urma să se căsătorească cu văduva, dar textul grec nu exprimă aici în mod explicit această acțiune; explicația este oferită în notă.
translation_notes:
  register: Română standard modernă, clară și demnă. „Cel dintâi” păstrează ordinea fără a sugera vârsta, iar construcția „i-a lăsat fratelui său soția” menține concizia și caracterul implicit al originalului.
