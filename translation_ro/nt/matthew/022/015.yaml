id: MAT.22.15
reference: Matthew 22:15
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τότε πορευθέντες οἱ Φαρισαῖοι συμβούλιον ἔλαβον ὅπως αὐτὸν παγιδεύσωσιν ἐν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/015.yaml
  text: Then the Pharisees went and took counsel how they might trap him in his words[a].
translation:
  language: ro
  text: Atunci fariseii s-au dus și s-au sfătuit cum să-l prindă în capcană prin ceea ce avea să spună.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „să-l prindă în capcană prin vorbele lui”.'
    reason: Alternativă lexicală mai apropiată de formularea greacă ἐν λόγῳ.
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Marchează succesiunea narațiunii într-o formă românească firească și concisă.
- source_word: πορευθέντες
  choice: s-au dus
  rationale: Participiul aorist indică o acțiune anterioară verbului principal; redarea prin verb coordonat este naturală în româna narativă.
- source_word: οἱ Φαρισαῖοι
  choice: fariseii
  rationale: Denumirea consacrată și neutră a grupului religios; articolul hotărât este inclus firesc în forma românească.
- source_word: συμβούλιον ἔλαβον
  choice: s-au sfătuit
  rationale: Redă idiomul deliberativ fără a introduce aici, în mod redundant, ostilitatea deja exprimată de propoziția de scop.
- source_word: ὅπως
  choice: cum să
  rationale: Introduce în mod natural în română conținutul și scopul deliberării.
- source_word: αὐτὸν
  choice: să-l
  rationale: Pronumele se referă la Isus și este obiectul direct al verbului.
- source_word: παγιδεύσωσιν
  choice: prindă în capcană
  rationale: Păstrează metafora unei curse și exprimă limpede intenția ostilă.
- source_word: ἐν λόγῳ
  choice: prin ceea ce avea să spună
  rationale: În context, λόγος desemnează rostirea sau răspunsul urmărit; formularea românească arată că ei voiau să folosească împotriva lui ceva ce urma să spună, fără a schimba sensul instrumental al expresiei.
theological_decisions:
- issue: Gradul de ostilitate exprimat de συμβούλιον ἔλαβον
  choice: Expresia este redată neutru prin „s-au sfătuit”, iar intenția răuvoitoare este lăsată propoziției „cum să-l prindă în capcană”.
  alternative: „au uneltit”
  rationale: Textul indică fără echivoc intenția ostilă prin παγιδεύσωσιν, însă idiomul deliberativ nu trebuie încărcat separat cu aceeași nuanță.
- issue: Sensul expresiei ἐν λόγῳ
  choice: „prin ceea ce avea să spună”
  alternative: „în vorbire” sau „cu un cuvânt”
  rationale: Expresia poate fi redată mai formal, dar aici sensul contextual este că fariseii urmăreau să-l compromită printr-o afirmație obținută de la el. Nota păstrează o alternativă mai apropiată de forma idiomului.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Construcția „s-au dus și s-au sfătuit” evită participiul greoi, iar „a prinde în capcană” păstrează imaginea verbului grecesc fără arhaism.
