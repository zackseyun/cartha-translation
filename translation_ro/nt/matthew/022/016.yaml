revisions:
- from: 'Și îi trimit la el pe ucenicii lor împreună cu irodienii[a], spunând: „Învățătorule, știm că ești sincer și că îi înveți pe oameni calea lui Dumnezeu potrivit adevărului. Nu te lași influențat de nimeni, fiindcă nu cauți la fața oamenilor[b].”'
  to: 'Și îi trimit la el pe ucenicii lor împreună cu irodienii[a], spunând: „Învățătorule, știm că ești sincer și că înveți calea lui Dumnezeu potrivit adevărului. Nu ții seama de nimeni, fiindcă nu privești la fața oamenilor[b].”'
  rationale: S-a eliminat obiectul indirect explicitat, care nu apare în textul grec, și s-a înlocuit formularea mai puțin idiomatică „nu cauți la fața oamenilor” cu „nu privești la fața oamenilor”. „Nu ții seama de nimeni” redă concis independența față de persoane și statut, confirmată de propoziția cauzală următoare, fără a atribui lui Isus nepăsare față de oameni.
  reviewer_model: gpt-5.6-terra
