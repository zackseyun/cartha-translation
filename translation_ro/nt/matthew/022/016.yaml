id: MAT.22.16
reference: Matthew 22:16
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἀποστέλλουσιν αὐτῷ τοὺς μαθητὰς αὐτῶν μετὰ τῶν Ἡρῳδιανῶν ⸀λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ τὴν ὁδὸν τοῦ θεοῦ ἐν ἀληθείᾳ διδάσκεις, καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/016.yaml
  text: And they send to him their disciples along with the Herodians[a], saying, “Teacher, we know that you are true and teach the way of God in truth, and you do not care about anyone[b], for you do not look at the face of men.”
translation:
  language: ro
  text: 'Și îi trimit la el pe ucenicii lor împreună cu irodienii[a], spunând: „Învățătorule, știm că ești sincer și că înveți calea lui Dumnezeu potrivit adevărului. Nu ții seama de nimeni, fiindcă nu privești la fața oamenilor[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Irodienii erau susținători ai dinastiei lui Irod.
    reason: Clarificare istorică necesară pentru un nume de grup puțin cunoscut cititorului modern.
  - marker: b
    text: 'Expresie care înseamnă: „nu ești părtinitor față de oameni” sau „nu judeci după aparențe ori rang”.'
    reason: Clarifică idiomul grecesc păstrat în textul principal.
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: îi trimit
  rationale: Păstrează prezentul istoric grecesc, firesc și inteligibil și în narațiunea românească.
- source_word: μαθητὰς
  choice: ucenicii
  rationale: Termenul consacrat și natural în contextul evanghelic pentru adepți care învață de la un maestru.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: împreună cu irodienii
  rationale: Redă clar asocierea exprimată prin μετά cu genitivul, fără explicații istorice introduse în text.
- source_word: Διδάσκαλε
  choice: Învățătorule
  rationale: Formă românească demnă și curentă pentru adresarea către cineva care învață pe alții.
- source_word: ἀληθὴς
  choice: sincer
  rationale: În acest context descrie o persoană veridică, autentică și neprefăcută; «adevărat» ar suna mai puțin firesc despre caracterul unei persoane în româna actuală.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: calea lui Dumnezeu
  rationale: Păstrează metafora sursei și sensul larg al conduitei sau voii lui Dumnezeu.
- source_word: ἐν ἀληθείᾳ
  choice: potrivit adevărului
  rationale: Redă ideea conformității cu adevărul într-o formulare românească mai naturală decât literalul rigid «în adevăr».
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: Nu te lași influențat de nimeni
  rationale: 'Evită impresia greșită că lui Isus nu-i pasă de oameni și exprimă forța contextuală: nu este condiționat de statutul sau opinia nimănui.'
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: fiindcă nu cauți la fața oamenilor
  rationale: Păstrează expresia idiomatică și textura sursei, iar nota explică sensul de imparțialitate.
theological_decisions:
- issue: Expresia idiomatică despre imparțialitate
  choice: nu cauți la fața oamenilor
  alternative: nu ești părtinitor față de oameni; nu judeci după aparențe sau rang
  rationale: Formularea principală păstrează imaginea greacă, fără a restrânge sensul doar la aspectul fizic; nota clarifică faptul că este vorba despre lipsa favoritismului bazat pe statut.
- issue: Sensul afirmației οὐ μέλει σοι περὶ οὐδενός
  choice: Nu te lași influențat de nimeni
  alternative: nu-ți pasă de nimeni
  rationale: Varianta literală poate sugera indiferență morală, contrară forței contextuale. Alegerea exprimă independența față de presiunea și rangul oamenilor, fără a introduce o poziție doctrinară.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Prezentul istoric este păstrat. Sintaxa a fost ușor explicitată prin «îi înveți pe oameni» pentru naturalețe, fără schimbarea obiectului învățăturii.
