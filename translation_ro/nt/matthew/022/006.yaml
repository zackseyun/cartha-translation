id: MAT.22.6
reference: Matthew 22:6
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οἱ δὲ λοιποὶ κρατήσαντες τοὺς δούλους αὐτοῦ ὕβρισαν καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/006.yaml
  text: But the rest[a], seizing his servants, mistreated them and killed them.
translation:
  language: ro
  text: Dar ceilalți, punând mâna pe robii lui[a], i-au maltratat și i-au omorât.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „slujitorii lui”.'
    reason: Alternativă lexicală pentru grecescul δούλους.
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: Dar ceilalți
  rationale: „Ceilalți” îi desemnează pe invitații rămași, iar „dar” redă firesc ușoara opoziție exprimată de δέ față de reacția din versetul anterior.
- source_word: κρατήσαντες
  choice: punând mâna pe
  rationale: Redă idiomatic participiul aorist cu sensul de a prinde sau a captura, păstrând legătura circumstanțială cu verbele principale fără a impune explicit o relație temporală mai precisă.
- source_word: τοὺς δούλους αὐτοῦ
  choice: robii lui
  rationale: „Rob” păstrează statutul de dependență exprimat de δοῦλος și este potrivit registrului parabolic; alternativa mai generală „slujitorii lui” este consemnată în notă.
- source_word: ὕβρισαν
  choice: i-au batjocorit
  rationale: Verbul indică un tratament abuziv și umilitor, nu doar o insultă verbală. În context, „i-au batjocorit” exprimă concis această violență dezonorantă.
- source_word: ἀπέκτειναν
  choice: i-au omorât
  rationale: Este echivalentul direct și firesc al lui ἀποκτείνω, fără nuanța juridică suplimentară pe care ar putea-o introduce „i-au ucis” în anumite contexte.
theological_decisions:
- issue: Redarea lui δοῦλος în contextul parabolei
  choice: robii lui
  alternative: slujitorii lui
  rationale: „Robii” păstrează realitatea socială a persoanelor aflate în stăpânirea regelui, fără a introduce o interpretare teologică suplimentară. „Slujitorii” rămâne o redare contextual posibilă și este indicată în nota de subsol.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Construcția „punând mâna pe” este naturală și exprimă capturarea; „robii” păstrează precizia socială a termenului grec, cu alternativa uzuală în notă.
