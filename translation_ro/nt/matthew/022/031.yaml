  text: περὶ δὲ τῆς ἀναστάσεως τῶν νεκρῶν οὐκ ἀνέγνωτε τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/031.yaml
  text: Concerning the resurrection of the dead[a], have you not read what was spoken to you by God, saying,
translation:
  language: ro
  text: 'Cât despre învierea morților, n-ați citit ce v-a fost spus de Dumnezeu, care zice:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ δὲ
  choice: Cât despre
  rationale: Introduce firesc tema pusă în discuție și redă tranziția marcată de δέ fără a-i atribui o opoziție puternică sau un sens temporal.
- source_word: τῆς ἀναστάσεως τῶν νεκρῶν
  choice: învierea morților
  rationale: Redă direct construcția cu genitiv și desemnează învierea celor morți, subiectul disputei cu saducheii.
- source_word: οὐκ ἀνέγνωτε
  choice: n-ați citit
  rationale: Aoristul este redat prin perfectul compus românesc, potrivit întrebării retorice despre citirea Scripturii.
- source_word: τὸ ῥηθὲν ὑμῖν
  choice: ce v-a fost spus
  rationale: Păstrează participiul substantivizat, diateza pasivă și dativul destinatarului într-o formulare românească naturală.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: de Dumnezeu
  rationale: Redă explicit agentul construcției pasive.
- source_word: λέγοντος
  choice: care zice
  rationale: Participiul prezent se raportează gramatical la Dumnezeu și introduce citatul care urmează; prezentul păstrează caracterul viu al rostirii scripturale.
theological_decisions:
- issue: Dumnezeu ca autor al rostirii scripturale și ascultătorii ca destinatari
  choice: ce v-a fost spus de Dumnezeu
  alternative: ce v-a spus Dumnezeu
  rationale: Formularea păstrează atât pasivul textului grec, cât și ideea că rostirea lui Dumnezeu din Scriptură li se adresează ascultătorilor, fără a adăuga o teorie a inspirației.
- issue: Relația participiului λέγοντος cu Dumnezeu
  choice: Dumnezeu, care zice
  alternative: Dumnezeu, spunând
  rationale: Genitivul masculin singular leagă participiul de Dumnezeu. Propoziția relativă este mai firească în româna actuală și păstrează prezentul participiului.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formularea „Cât despre” marchează schimbarea de temă; „n-ați citit” păstrează forța întrebării retorice. Nu sunt necesare note de subsol pentru această redare.
