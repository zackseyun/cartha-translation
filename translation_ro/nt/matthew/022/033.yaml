  text: καὶ ἀκούσαντες οἱ ὄχλοι ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/033.yaml
  text: And when the crowds heard it[a], they were astonished at his teaching.
translation:
  language: ro
  text: Și, când au auzit aceasta[a], mulțimile erau uimite de învățătura lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „după ce au auzit” ori, mai literal, „auzind”.'
    reason: Alternativă lexicală pentru participiul ἀκούσαντες și pentru raportul său temporal cu verbul principal.
lexical_decisions:
- source_word: καὶ
  choice: Și
  rationale: Păstrează legătura narativă simplă cu episodul precedent.
- source_word: ἀκούσαντες
  choice: când au auzit aceasta
  rationale: Participiul aorist este redat firesc în română printr-o propoziție temporală; „aceasta” explicitează obiectul subînțeles, adică răspunsul anterior al lui Isus.
- source_word: οἱ ὄχλοι
  choice: mulțimile
  rationale: Păstrează pluralul articulat din greacă și este natural în româna contemporană.
- source_word: ἐξεπλήσσοντο
  choice: erau uimite
  rationale: Imperfectul redă reacția vie și continuă a mulțimilor; „uimite” exprimă intensitatea verbului fără exagerare.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: de învățătura lui
  rationale: În română, construcția „uimit de” exprimă firesc temeiul sau prilejul uimirii, iar „învățătura” redă διδαχή fără nuanța tehnică a termenului „doctrină”.
theological_decisions: []
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează pluralul grecesc „mulțimile” și evită termenul mai tehnic „doctrină”.
