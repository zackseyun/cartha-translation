id: MAT.22.46
reference: Matthew 22:46
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἐδύνατο ⸂ἀποκριθῆναι αὐτῷ⸃ λόγον, οὐδὲ ἐτόλμησέν τις ἀπ’ ἐκείνης τῆς ἡμέρας ἐπερωτῆσαι αὐτὸν οὐκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/046.yaml
  text: And no one was able to answer him a word[a], nor did anyone dare from that day on to question him any longer.
translation:
  language: ro
  text: Și nimeni n-a putut să-i răspundă nici măcar un cuvânt[a], iar din ziua aceea nimeni n-a mai îndrăznit să-i pună întrebări.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: „să-i răspundă un cuvânt”.'
    reason: Păstrează la vedere idiomul grecesc, în timp ce textul principal folosește o formulare românească naturală.
lexical_decisions:
- source_word: οὐδεὶς
  choice: nimeni
  rationale: Pronumele negativ exprimă absența totală a oricărei persoane capabile să răspundă; „nimeni” este echivalentul românesc direct și firesc.
- source_word: ἐδύνατο
  choice: n-a putut
  rationale: Redă clar incapacitatea exprimată de imperfectul lui δύναμαι; în româna narativă actuală, perfectul compus este mai firesc decât o redare mecanică prin imperfect.
- source_word: ἀποκριθῆναι αὐτῷ λόγον
  choice: să-i răspundă nici măcar un cuvânt
  rationale: Păstrează substantivul explicit λόγον și forța idiomului grecesc. „Nici măcar” face construcția negativă firească în română, fără a schimba sensul contextual.
- source_word: οὐδὲ
  choice: iar ... nimeni n-a mai
  rationale: Legătura dintre cele două propoziții negative este redată natural prin „iar”, împreună cu negația din a doua propoziție; un „nici” suplimentar ar îngreuna fraza.
- source_word: ἐτόλμησέν τις
  choice: nimeni n-a mai îndrăznit
  rationale: În contextul negației, τις are sensul „cineva/oricine”; formularea românească negativă cu „nimeni” este clară și idiomatică.
- source_word: ἀπ’ ἐκείνης τῆς ἡμέρας
  choice: din ziua aceea
  rationale: Indică punctul de început al situației ulterioare; continuitatea este exprimată și prin „n-a mai”.
- source_word: ἐπερωτῆσαι αὐτὸν
  choice: să-i pună întrebări
  rationale: Redă natural actul de a-l chestiona pe Isus în contextul unei dispute. „Să-l interogheze” ar fi prea puternic, iar „să-l întrebe” ar putea suna incomplet fără un complement adăugat.
- source_word: οὐκέτι
  choice: n-a mai
  rationale: Construcția românească „n-a mai” exprimă încetarea acțiunii din acel moment înainte și evită redundanța unei redări precum „nu ... niciodată de atunci”.
theological_decisions:
- issue: Forța narativă a tăcerii adversarilor după răspunsul lui Isus
  choice: Versetul afirmă simplu incapacitatea lor de a-i răspunde și lipsa curajului de a-l mai întreba.
  alternative: O formulare interpretativă care ar afirma explicit superioritatea înțelepciunii sau autorității lui Isus.
  rationale: Contextul sugerează victoria lui Isus în confruntare, dar versetul descrie numai reacția interlocutorilor. Traducerea nu adaugă o concluzie teologică neexprimată direct.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. Contracțiile „n-a” și construcția „n-a mai” sunt curente în proza românească și dau frazei naturalețe fără a-i diminua solemnitatea.
