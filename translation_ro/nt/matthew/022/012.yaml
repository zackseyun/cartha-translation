id: MAT.22.12
reference: Matthew 22:12
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἑταῖρε, πῶς εἰσῆλθες ὧδε μὴ ἔχων ἔνδυμα γάμου; ὁ δὲ ἐφιμώθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/012.yaml
  text: And he says to him[a], ‘Friend, how did you come in here without a wedding garment?’ But he was speechless.
translation:
  language: ro
  text: 'Și i-a zis: „Prietene, cum ai intrat aici fără haină de nuntă?” Dar el a rămas fără cuvinte.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau, mai literal, „a fost redus la tăcere”. Verbul grecesc poate însemna și „a pune botniță”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Prietene
  rationale: Vocativul românesc este firesc și păstrează politețea formală, dar și distanța implicită și tonul de mustrare din context, fără a introduce ostilitate explicită.
- source_word: πῶς
  choice: cum
  rationale: Redă întrebarea grecească privitoare la felul în care omul a putut intra, fără a o transforma într-o întrebare despre motiv.
- source_word: εἰσῆλθες ὧδε
  choice: ai intrat aici
  rationale: Redă direct actul încheiat al intrării și sensul local al lui ὧδε într-o formulare românească naturală.
- source_word: μὴ ἔχων
  choice: fără
  rationale: Construcția participială este exprimată firesc și concis în română, păstrând ideea lipsei veșmântului cerut.
- source_word: ἔνδυμα γάμου
  choice: haină de nuntă
  rationale: Păstrează singularul și asocierea cu nunta, fără a preciza nejustificat tipul exact de veșmânt.
- source_word: ἐφιμώθη
  choice: a rămas fără cuvinte
  rationale: Redă în româna curentă rezultatul contextual—incapacitatea omului de a răspunde—iar sensul pasiv și imaginea literală a verbului sunt consemnate în notă.
- source_word: λέγει
  choice: i-a zis
  rationale: Prezentul istoric grecesc este redat prin perfect compus, timpul narativ firesc în româna modernă, fără schimbarea succesiunii acțiunilor.
theological_decisions:
- issue: Tonul adresării gazdei către oaspetele îmbrăcat nepotrivit
  choice: „Prietene”, politicos la suprafață, dar mustrător și distanțat în context
  alternative: „Tovarășe” sau o formulă mai aspră
  rationale: Alegerea păstrează tensiunea narativă și ironia posibilă, fără a atribui termenului nici căldură deplină, nici dispreț explicit.
- issue: Sensul lui ἐφιμώθη
  choice: 'Formulare orientată spre rezultat: „a rămas fără cuvinte”'
  alternative: „a fost redus la tăcere” sau, literal, „i s-a pus botniță”
  rationale: Contextul indică faptul că omul nu poate răspunde. Nota păstrează pasivul și imaginea lexicală puternică, fără a produce în textul principal o expresie românească nenaturală ori excesiv de interpretativă.
translation_notes:
  register: Română standard modernă, cu ton demn și narativ. „Haină de nuntă” este limpede și nu precizează nejustificat natura veșmântului; „Prietene” păstrează formula tradițional inteligibilă și ambivalența tonului.
