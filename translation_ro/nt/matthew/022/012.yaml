  source_fidelity: 'Textul redă fidel toate elementele esențiale ale grecei: vocativul Ἑταῖρε („Prietene”), întrebarea despre modalitate πῶς („cum”), intrarea în locul respectiv, lipsa hainei de nuntă și incapacitatea omului de a răspunde exprimată de ἐφιμώθη. „A rămas fără cuvinte” este o redare contextuală fidelă și firească a rezultatului pasivului grec.'
  naturalness: Româna este modernă, fluentă și potrivită registrului narativ solemn. „Prietene”, „cum ai intrat aici” și „haină de nuntă” sunt formulări idiomatice și clare. Perfectul compus din „i-a zis” este normal pentru narațiunea românească.
  terminology: „Haină de nuntă” păstrează singularul lui ἔνδυμα și nu supraspecifică veșmântul. „Prietene” conservă politețea formală și distanța potențial ironică a lui Ἑταῖρε, fără a impune o interpretare. Nota oferă în mod adecvat alternativa mai literală pentru ἐφιμώθη și fundalul lexical al verbului.
