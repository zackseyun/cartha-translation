  text: λέγοντες· Διδάσκαλε, Μωϋσῆς εἶπεν· Ἐάν τις ἀποθάνῃ μὴ ἔχων τέκνα, ἐπιγαμβρεύσει ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα αὐτοῦ καὶ ἀναστήσει σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/024.yaml
  text: saying[a], “Teacher, Moses said, ‘If a man dies without having children, his brother shall marry his wife and raise up offspring for his brother.’”
translation:
  language: ro
  text: 'spunând: „Învățătorule, Moise a spus: «Dacă un bărbat moare fără să aibă copii, fratele lui să ia de soție pe văduva celui decedat și să ridice urmași pentru fratele său.»”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Învățătorule
  rationale: Formă firească și demnă de adresare către Isus ca învățător, fără ambiguitățile termenului „Stăpâne”.
- source_word: Ἐάν τις ἀποθάνῃ
  choice: Dacă un bărbat moare
  rationale: Contextul juridic și rolurile familiale masculine arată că τις se referă aici la un bărbat.
- source_word: μὴ ἔχων τέκνα
  choice: fără să aibă copii
  rationale: Redă natural participiul și păstrează sensul larg al pluralului τέκνα, fără a-l restrânge la fii.
- source_word: ἐπιγαμβρεύσει
  choice: să se căsătorească
  rationale: Exprimă clar acțiunea principală; sensul tehnic de căsătorie leviratică este explicat în nota de subsol.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: cu soția lui
  rationale: Păstrează referința directă a textului grec la soția bărbatului decedat; în context, ea este văduva lui.
- source_word: ἀναστήσει σπέρμα
  choice: să-i ridice urmași
  rationale: Păstrează idiomul biblic „a ridica” și redă σπέρμα prin termenul colectiv și firesc „urmași”.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: fratelui său
  rationale: Dativul indică persoana pentru care sunt ridicați urmașii, aceștia fiind socotiți în linia fratelui decedat.
theological_decisions:
- issue: Redarea în termeni masculini a cazului juridic
  choice: „un bărbat” și „fratele lui”
  alternative: „cineva” și o formulare neutră din punctul de vedere al genului
  rationale: Legea leviratului citată aici descrie roluri familiale specific masculine; formularea păstrează intenția și particularitatea textului-sursă.
- issue: Relația urmașilor cu fratele decedat
  choice: „să-i ridice urmași fratelui său”
  alternative: „să aibă urmași cu văduva fratelui său”
  rationale: 'Formularea aleasă păstrează tensiunea juridică și familială a textului: urmașii sunt ridicați pentru fratele decedat, nu doar prezentați ca descendenți biologici ai celui viu.'
translation_notes:
  register: Română standard modernă, cu registru biblic demn și accesibil. Construcția „să-i ridice urmași” păstrează ecoul juridic-scripturistic fără a folosi literalismul obscur „sămânță”.
