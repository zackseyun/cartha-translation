  to: 'spunând: „Învățătorule, Moise a spus: «Dacă un bărbat moare fără să aibă copii, fratele lui să ia de soție pe văduva celui decedat și să ridice urmași pentru fratele său.»”'
  rationale: 'Revizuirea păstrează sensul legal și familial al grecei, dar clarifică în română că femeia este văduva bărbatului care a murit, nu soția fratelui viu. „Pentru fratele său” redă dativul de beneficiu/referință: urmașii sunt socotiți pentru fratele decedat. Nota păstrează alternativa mai formală și explică termenul tehnic fără a introduce interpretări confesionale.'
