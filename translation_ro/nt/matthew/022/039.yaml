  naturalness: «Iar a doua este asemenea ei» este română standard, clară și păstrează registrul demn al contextului. «Iar a doua, asemenea ei» sună ca o fragmentare sintactică, nu ca o elipsă idiomatică potrivită aici.
  terminology: '«Aproapele tău» este termenul consacrat și exact pentru τὸν πλησίον σου. «Să-l iubești» redă adecvat forța poruncitoare a viitorului indicativ din citatul scriptural. Nu este necesară o notă pentru alternanța articolului: «o a doua» este mai puțin natural și poate sugera nejustificat «încă o a doua».'
