  text: Δευτέρα ⸀δὲ ὁμοία ⸀αὐτῇ· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/039.yaml
  text: 'And a second is like it: You shall love your neighbor as yourself[a].'
translation:
  language: ro
  text: 'Iar a doua este asemenea ei: „Să-l iubești pe aproapele tău ca pe tine însuți.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δευτέρα
  choice: a doua
  rationale: Adjectiv ordinal feminin fără articol, folosit substantival; în context desemnează a doua poruncă. Româna exprimă firesc ordinalul prin „a doua”, fără a adăuga substantivul implicit „poruncă”.
- source_word: δὲ
  choice: Iar
  rationale: Conector discursiv slab, care continuă enunțul fără un contrast puternic; „iar” leagă natural această poruncă de cea dintâi.
- source_word: ὁμοία αὐτῇ
  choice: asemenea ei
  rationale: Redă concis construcția cu dativul și trimite la prima poruncă; pronumele feminin corespunde substantivului implicit „poruncă”.
- source_word: Ἀγαπήσεις
  choice: Să-l iubești
  rationale: Viitorul indicativ are aici forță imperativă în citarea poruncii din Leviticul 19:18. Conjunctivul hortativ este formula poruncitoare firească și demnă în româna actuală.
- source_word: τὸν πλησίον σου
  choice: pe aproapele tău
  rationale: Expresia idiomatică înseamnă „aproapele tău”, nu doar o persoană aflată fizic în apropiere; marcarea cu „pe” este cerută de sintaxa românească.
- source_word: ὡς σεαυτόν
  choice: ca pe tine însuți
  rationale: Păstrează standardul comparației și referința reflexivă la subiect, într-o formulare românească consacrată și limpede.
theological_decisions:
- issue: Relația celei de-a doua porunci cu prima
  choice: a doua, asemenea ei
  alternative: o a doua este asemenea ei
  rationale: Greaca nu are articol la Δευτέρα, dar ordinalul substantivizat este identificabil contextual. Românescul „a doua” este idiomatic și păstrează comparația de natură sau rang fără a contopi cele două porunci; alternativa mai literală „o a doua” este posibilă, dar mai puțin firească.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Citatul este marcat prin ghilimele românești; formularea evită arhaismul „vei iubi”, dar păstrează forța de poruncă a originalului.
