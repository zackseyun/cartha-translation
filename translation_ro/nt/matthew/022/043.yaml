  text: λέγει αὐτοῖς· Πῶς οὖν Δαυὶδ ἐν πνεύματι ⸂καλεῖ αὐτὸν κύριον⸃ λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/043.yaml
  text: He said to them[a], “How then does David, in the Spirit, call him Lord[b], saying,”
translation:
  language: ro
  text: 'El le-a zis: „Cum, atunci, David, în Duhul[a], îl numește Domn[b], zicând:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „prin Duhul”. Expresia grecească poate indica atât sfera, cât și mijlocirea; „în Duhul” urmează mai îndeaproape formularea originală.
    reason: lexical_alternative
  - marker: b
    text: Sau „stăpân”. Titlul grecesc κύριος este redat de obicei prin „Domn”.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: El le-a zis
  rationale: Prezentul grecesc are aici valoare de prezent istoric; perfectul compus este firesc în narațiunea românească și păstrează funcția discursivă.
- source_word: Πῶς οὖν
  choice: Cum atunci
  rationale: Păstrează forța interogativă a lui πῶς și nuanța inferențială a lui οὖν într-o formulare românească naturală.
- source_word: Δαυὶδ
  choice: David
  rationale: Redarea consacrată în română a numelui propriu.
- source_word: ἐν πνεύματι
  choice: în Duhul
  rationale: Urmează îndeaproape prepoziția ἐν și păstrează deschisă nuanța de sferă, fără a exclude ideea de mijlocire sau lucrare a Duhului.
- source_word: καλεῖ αὐτὸν κύριον
  choice: îl numește «Domn»
  rationale: Verbul «a numi» redă natural καλεῖ în acest context, iar «Domn» păstrează titlul κύριος și legătura cu citatul scripturistic care urmează.
- source_word: λέγων
  choice: zicând
  rationale: Redă concis participiul și introduce direct citatul următor.
theological_decisions:
- issue: Referentul lui πνεῦμα în expresia ἐν πνεύματι
  choice: Duhul Sfânt este referentul probabil, indicat prin majusculă
  alternative: duhul lui David sau o stare spirituală
  rationale: Contextul vorbirii inspirate a lui David favorizează referirea la Duhul Sfânt; formularea «în Duhul» nu precizează însă mai mult decât greaca.
- issue: Redarea lui κύριος
  choice: Domn
  alternative: stăpân
  rationale: În argumentul mesianic întemeiat pe Psalmul 110, «Domn» păstrează cel mai bine valoarea titulară și legătura intertextuală, fără a explicita suplimentar identitatea referentului.
translation_notes:
  register: Română literară modernă, demnă și accesibilă. Formularea păstrează structura întrebării și caracterul ei scripturistic; ghilimelele pentru «Domn» clarifică faptul că termenul este titlul atribuit în enunț.
