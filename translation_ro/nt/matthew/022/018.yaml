id: MAT.22.18
reference: Matthew 22:18
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς τὴν πονηρίαν αὐτῶν εἶπεν· Τί με πειράζετε, ὑποκριταί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/018.yaml
  text: But Jesus[a], knowing their evil intent, said, “Why are you testing me[b], hypocrites?”
translation:
  language: ro
  text: 'Dar Isus, cunoscând răutatea lor, a zis: „De ce Mă puneți la încercare[a], ipocriților?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „De ce Mă ispitiți?” Verbul grecesc poate însemna „a pune la încercare”, „a testa” sau „a ispiti”, în funcție de context.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: cunoscând
  rationale: Participiul aorist al lui γινώσκω este redat concis și firesc, indicând că Isus le cunoștea răutatea înainte de a răspunde.
- source_word: δὲ
  choice: Dar
  rationale: Marchează contrastul dintre abordarea lor înșelătoare și discernământul lui Isus.
- source_word: πονηρίαν
  choice: răutatea
  rationale: Redă direct sensul moral al termenului și lasă contextul să arate că este vorba de intenția ostilă din spatele întrebării.
- source_word: εἶπεν
  choice: a zis
  rationale: Formulare narativă firească și demnă în româna biblică modernă.
- source_word: Τί
  choice: De ce
  rationale: În această construcție, pronumele interogativ are valoare idiomatică de întrebare asupra motivului.
- source_word: πειράζετε
  choice: Mă puneți la încercare
  rationale: Păstrează sensul contextual de testare ostilă fără a restrânge verbul la ispita morală interioară.
- source_word: ὑποκριταί
  choice: ipocriților
  rationale: Echivalentul românesc consacrat exprimă prefăcătoria celor care afișau sinceritate, dar urmăreau să-L prindă în cursă.
theological_decisions:
- issue: Cunoașterea de către Isus a motivului adversarilor
  choice: Isus este prezentat ca fiind conștient de răutatea lor.
  alternative: Isus le-a sesizat intenția rea sau viclenia.
  rationale: Formularea păstrează afirmația explicită a textului despre discernământul lui Isus, fără a o extinde într-o afirmație doctrinară mai amplă.
- issue: Sensul lui πειράζω în adresarea lui Isus
  choice: Mă puneți la încercare
  alternative: Mă ispitiți
  rationale: Contextul descrie o întrebare-capcană; alegerea păstrează însă prin nota de subsol posibilitatea lexicală «a ispiti».
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Majuscula din pronumele „Mă” urmează uzul reverențial românesc; termenul „ipocriților” păstrează forța adresării directe.
