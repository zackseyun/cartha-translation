  text: ἐπιδείξατέ μοι τὸ νόμισμα τοῦ κήνσου. οἱ δὲ προσήνεγκαν αὐτῷ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/019.yaml
  text: Show me the coin for the tax[a]. And they brought him a denarius.
translation:
  language: ro
  text: „Arătați-mi moneda pentru impozit[a].” Iar ei i-au adus un dinar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „impozitul pe cap de locuitor” ori „impozitul de recensământ”; termenul grecesc κῆνσος desemnează un impozit imperial roman.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδείξατέ
  choice: Arătați-mi
  rationale: Imperativul aorist, persoana a doua plural, cere ca moneda să fie arătată pentru examinare; formularea este firească în româna actuală și păstrează componenta vizuală a verbului.
- source_word: νόμισμα
  choice: moneda
  rationale: Termenul desemnează o monedă aflată în circulație. Articolul hotărât este firesc în construcția românească „moneda pentru impozit”.
- source_word: τοῦ κήνσου
  choice: pentru impozit
  rationale: κῆνσος este un împrumut din latină pentru impozitul imperial roman aflat în discuție. Redarea concisă nu precizează mai mult decât textul principal, iar variantele mai specifice sunt păstrate în notă.
- source_word: προσήνεγκαν
  choice: i-au adus
  rationale: În context narativ, „i-au adus” redă clar și natural acțiunea de a aduce obiectul la Isus.
- source_word: δηνάριον
  choice: un dinar
  rationale: „Dinar” este denumirea românească tradițională și inteligibilă a monedei romane denarius, păstrând specificitatea istorică.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu formulare directă și demnă. „Iar” marchează natural răspunsul narativ, fără a încărca stilul.
