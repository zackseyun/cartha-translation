id: MAT.22.5
reference: Matthew 22:5
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οἱ δὲ ἀμελήσαντες ἀπῆλθον, ⸀ὃς μὲν εἰς τὸν ἴδιον ἀγρόν, ⸁ὃς δὲ ⸀ἐπὶ τὴν ἐμπορίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/005.yaml
  text: But they paid no attention and went away[a], one to his own field, another to his business.
translation:
  language: ro
  text: Dar ei n-au dat nicio atenție și au plecat[a], unul la ogorul lui, iar altul la afacerea lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „nu au ținut seama de ea” ori „au neglijat-o”, referindu-se, în context, la invitația regelui.'
    reason: alternativă lexicală
lexical_decisions:
- source_word: ἀμελήσαντες
  choice: nu au dat atenție
  rationale: Redă firesc participiul cu sensul de nepăsare sau neglijare deliberată. Obiectul rămâne implicit în textul principal, ca în greacă, fiind clar din context că este vorba despre invitația regelui.
- source_word: ἀπῆλθον
  choice: au plecat
  rationale: Exprimă simplu și natural îndepărtarea lor ca răspuns la chemare, fără registrul mai solemn al lui „s-au îndepărtat”.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: unul ... iar altul
  rationale: Păstrează distribuția și contrastul construcției grecești μέν ... δέ într-o formulare românească firească.
- source_word: εἰς τὸν ἴδιον ἀγρόν
  choice: la ogorul lui
  rationale: „Ogor” redă concret terenul agricol indicat de ἀγρός, iar posesivul păstrează ideea lui ἴδιον. În română, posesia este suficient de clară fără repetarea emfatică „propriul”.
- source_word: ἐπὶ τὴν ἐμπορίαν αὐτοῦ
  choice: la afacerea lui
  rationale: ἐμπορία denumește activitatea comercială; „afacerea” este actual și inteligibil și menține contrastul cu munca agricolă.
theological_decisions:
- issue: Obiectul implicit al lui ἀμελήσαντες
  choice: 'Textul principal păstrează obiectul implicit: „nu au dat atenție”.'
  alternative: „au nesocotit invitația” / „nu au ținut seama de ea”
  rationale: Greaca nu exprimă obiectul, deși contextul îl identifică drept invitația regelui. Formularea aleasă păstrează această caracteristică și evită adăugarea unei precizări interpretative în text.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea evită atât arhaismele, cât și explicitarea inutilă a obiectului implicit; „ogor” păstrează cadrul agricol, iar „afacerea” redă activitatea comercială într-un limbaj actual.
