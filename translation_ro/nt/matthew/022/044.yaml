id: MAT.22.44
reference: Matthew 22:44
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/044.yaml
  text: The Lord said to my Lord[a], ‘Sit at my right hand until I put your enemies under your feet’?”
translation:
  language: ro
  text: '«Domnul i-a zis Domnului meu: „Șezi la dreapta Mea până când îi voi pune pe dușmanii Tăi sub picioarele Tale”»?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν
  choice: i-a zis
  rationale: Aoristul lui λέγω este redat firesc prin „a zis”; pronumele datival anticipează în mod idiomatic în română destinatarul exprimat prin „Domnului meu”.
- source_word: κύριος ... τῷ κυρίῳ μου
  choice: Domnul ... Domnului meu
  rationale: Aceeași denumire din greacă este păstrată în ambele ocurențe, fără a introduce în text distincția tipografică „DOMNUL”, derivată din ebraica Psalmului. Posesivul păstrează relația exprimată de μου.
- source_word: Κάθου
  choice: Șezi
  rationale: Imperativul „Șezi” este concis, demn și potrivit contextului de întronare; evită perifraza mai greoaie „Stai așezat”.
- source_word: ἐκ δεξιῶν μου
  choice: la dreapta Mea
  rationale: Redă idiomul grec consacrat pentru locul de onoare și autoritate. Majusculele pronumelor sunt folosite aici ca convenție reverențială românească, fără a schimba referenții textului.
- source_word: ἕως ἂν θῶ
  choice: până când îi voi pune
  rationale: Construcția cu ἄν și conjunctiv aorist indică un reper viitor; viitorul românesc este natural. Pronumele „îi” îi reia idiomatic pe „dușmanii Tăi”.
- source_word: τοὺς ἐχθρούς σου
  choice: pe dușmanii Tăi
  rationale: „Dușmani” este un echivalent modern, limpede și curent pentru ἐχθροί, iar marcarea cu „pe” este cerută firesc de română pentru complementul direct personal.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: sub picioarele Tale
  rationale: Urmează direct formularea greacă din Matei, fără a introduce imaginea „așternut pentru picioare”, care nu apare explicit în acest text grec.
theological_decisions:
- issue: Cele două ocurențe ale lui κύριος în citatul din Psalmul 110:1
  choice: Domnul i-a zis Domnului meu
  alternative: DOMNUL i-a zis Domnului meu; Domnul i-a zis stăpânului meu
  rationale: Greaca folosește același substantiv pentru ambii referenți. Redarea prin „Domnul” în ambele locuri păstrează această trăsătură și tensiunea argumentului lui Isus, în timp ce „DOMNUL” ar importa în textul principal distincția numelui divin din sursa ebraică, iar „stăpânului” ar diminua paralelismul lexical.
- issue: Imaginea supunerii dușmanilor
  choice: îi voi pune pe dușmanii Tăi sub picioarele Tale
  alternative: voi face din dușmanii Tăi un așternut pentru picioarele Tale
  rationale: Textul SBLGNT al versetului are explicit ὑποκάτω τῶν ποδῶν σου, „sub picioarele tale”. Varianta cu așternutul pentru picioare reflectă formularea ebraică tradițională a Psalmului 110:1, dar nu trebuie substituită formulării grecești din Matei.
translation_notes:
  register: Română standard modernă, cu registru biblic demn, dar inteligibil. S-a păstrat forma tradițională și încă vie „Șezi”, adecvată unui citat solemn. Ghilimelele marchează citatul rostit în întrebarea începută în contextul anterior; semnul întrebării final aparține întrebării lui Isus.
