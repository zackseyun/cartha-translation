id: MAT.22.37
reference: Matthew 22:37
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη αὐτῷ· Ἀγαπήσεις κύριον τὸν θεόν σου ἐν ὅλῃ ⸀τῇ καρδίᾳ σου καὶ ἐν ὅλῃ ⸁τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/037.yaml
  text: And he said to him[c][b][a], “You shall love the Lord your God with all your heart and with all your soul and with all your mind.”
translation:
  language: ro
  text: 'Iar el i-a spus: „Să-l iubești pe Domnul Dumnezeul tău cu toată inima ta, cu tot sufletul tău și cu toată mintea ta.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Iar
  rationale: Conjuncția continuă dialogul și marchează ușor trecerea la răspuns, fără a introduce un contrast puternic.
- source_word: ἔφη αὐτῷ
  choice: i-a spus
  rationale: Redă direct și firesc verbul de vorbire împreună cu complementul indirect, fără a adăuga nuanța de „a răspuns”, care nu este explicită în φημί.
- source_word: Ἀγαπήσεις
  choice: Să-l iubești
  rationale: Viitorul indicativ are aici forță de poruncă în citatul scripturistic; construcția românească cu conjunctiv este naturală, solemnă și păstrează caracterul imperativ.
- source_word: κύριον τὸν θεόν σου
  choice: pe Domnul Dumnezeul tău
  rationale: Formula consacrată și firească în română păstrează atât titlul κύριος, cât și relația exprimată prin pronumele posesiv.
- source_word: ἐν ὅλῃ τῇ καρδίᾳ σου
  choice: cu toată inima ta
  rationale: Deși ἐν înseamnă formal „în”, româna exprimă idiomatic totalitatea implicării prin „cu”; καρδία este redat prin „inimă”.
- source_word: ἐν ὅλῃ τῇ ψυχῇ σου
  choice: cu tot sufletul tău
  rationale: „Suflet” păstrează termenul distinct al enumerării și poate desemna aici întreaga ființă vie, fără a-l reduce la o definiție tehnică.
- source_word: ἐν ὅλῃ τῇ διανοίᾳ σου
  choice: cu toată mintea ta
  rationale: „Minte” redă natural facultatea gândirii și a înțelegerii exprimată de διάνοια.
theological_decisions:
- issue: Redarea citatului din porunca iubirii de Dumnezeu
  choice: Păstrarea triadei „inimă ... suflet ... minte” și a repetiției „cu toată/cu tot”
  alternative: Comasarea termenilor într-o parafrază precum „cu întreaga ta ființă” sau redarea lui διάνοια prin „înțelegere”
  rationale: Textul grec distinge cei trei termeni și subliniază totalitatea prin repetarea construcției. Traducerea păstrează această structură și tensiunea semantică fără a impune o antropologie confesională.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formularea „Să-l iubești” redă firesc în română forța imperativă a viitorului grecesc, iar repetarea posesivului urmează accentul textului sursă.
