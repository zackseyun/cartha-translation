  footnotes:
  - marker: a
    text: 'Mai concis: „Al cui este chipul acesta și inscripția?” În greacă, un singur pronume interogativ la genitiv se referă la ambele substantive și întreabă despre apartenența sau asocierea lor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: le-a zis
  rationale: Prezentul istoric grecesc este redat prin perfectul compus, timpul firesc al narațiunii în româna modernă; pronumele la dativ redă și αὐτοῖς.
- source_word: Τίνος
  choice: ale cui
  rationale: Interogativul la genitiv exprimă apartenența sau asocierea. Forma la plural se acordă firesc cu subiectul multiplu „chipul ... și inscripția”.
- source_word: εἰκών
  choice: chip
  rationale: În context desemnează reprezentarea imprimată pe monedă; „chip” este precis, firesc și păstrează rezonanța biblică a termenului.
- source_word: αὕτη
  choice: acesta
  rationale: Demonstrativul determină substantivul masculin „chipul” în formularea românească.
- source_word: ἐπιγραφή
  choice: inscripție
  rationale: Redă exact textul gravat sau imprimat pe monedă, fără a-l reduce la sensul general de „scriere”.
- source_word: καὶ
  choice: și
  rationale: 'Păstrează coordonarea dintre cele două elemente întrebate: chipul și inscripția.'
