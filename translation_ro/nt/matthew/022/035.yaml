  text: καὶ ἐπηρώτησεν εἷς ἐξ αὐτῶν νομικὸς πειράζων ⸀αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/035.yaml
  text: And one of them, a lawyer, asked him a question, testing him.
translation:
  language: ro
  text: 'Și unul dintre ei, un specialist în Lege[a], l-a întrebat ca să-l pună la încercare:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „un expert în Lege”. Termenul grecesc desemnează aici un specialist în Legea iudaică.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Și
  rationale: Păstrează legătura narativă simplă cu contextul precedent, fără a adăuga o nuanță temporală.
- source_word: ἐπηρώτησεν
  choice: l-a întrebat
  rationale: Redă direct și firesc verbul „a întreba”; ideea întrebării este cuprinsă în verb, fără a fi necesară adăugarea substantivului „întrebare”.
- source_word: εἷς ἐξ αὐτῶν
  choice: unul dintre ei
  rationale: Este echivalentul idiomatic românesc al expresiei partitive și arată că vorbitorul făcea parte din grupul menționat.
- source_word: νομικὸς
  choice: un învățător al Legii
  rationale: În contextul iudaic, termenul desemnează un cunoscător specializat al Legii mozaice; formularea evită sensul modern, civil sau judiciar, pe care l-ar sugera „avocat”.
- source_word: πειράζων
  choice: ca să-l pună la încercare
  rationale: Participiul exprimă aici scopul sau motivația întrebării. Formularea redă examinarea ostilă fără a restrânge sensul la ademenirea spre păcat.
- source_word: αὐτόν
  choice: l-
  rationale: Pronumele îl are ca referent pe Isus și este redat firesc drept complement direct în română.
theological_decisions:
- issue: Nuanța lui πειράζων cu referire la Isus
  choice: ca să-l pună la încercare
  alternative: ispitindu-l
  rationale: Grecescul poate însemna a pune la încercare, a testa sau a ispiti. Contextul indică o examinare cu intenție adversă; traducerea păstrează această tensiune fără a afirma mai îngust că interlocutorul încerca să-l ademenească pe Isus la păcat.
translation_notes:
  register: Română standard modernă, naturală și demnă. „Învățător al Legii” este inteligibil în context biblic și evită asocierea anacronică a termenului cu profesia modernă de avocat. Două puncte la final pregătesc întrebarea citată în versetul următor.
