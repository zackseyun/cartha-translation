id: MAT.2.19
reference: Matthew 2:19
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: ro
  text: Dar, după ce a murit Irod, iată că un înger al Domnului[a] i se arată în vis lui Iosif, în Egipt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „îngerul Domnului”. În greacă, substantivul „înger” nu are articol hotărât aici.'
    reason: Păstrează alternativa tradițională și explică forma nearticulată a textului grecesc.
lexical_decisions:
- source_word: Τελευτήσαντος ... τοῦ Ἡρῴδου
  choice: după ce a murit Irod
  rationale: Participiul aorist într-o construcție de genitiv absolut are aici sens temporal. Formularea redă firesc anterioritatea morții lui Irod față de apariția îngerului.
- source_word: δὲ
  choice: Dar
  rationale: Marchează tranziția narativă și păstrează ușorul contrast cu situația precedentă.
- source_word: ἰδοὺ
  choice: iată că
  rationale: Păstrează funcția de semnal narativ viu a lui ἰδού într-o construcție firească în româna actuală.
- source_word: ἄγγελος κυρίου
  choice: un înger al Domnului
  rationale: Substantivul ἄγγελος este nearticulat, iar construcția românească redă direct lectura nedefinită fără a pierde titlul «Domnul».
- source_word: φαίνεται
  choice: i se arată
  rationale: Prezentul istoric grecesc este păstrat pentru vivacitate; verbul românesc «a se arăta» exprimă natural apariția înaintea unei persoane.
- source_word: κατ’ ὄναρ
  choice: în vis
  rationale: Este echivalentul românesc firesc al expresiei care desemnează o revelație primită printr-un vis.
- source_word: τῷ Ἰωσὴφ
  choice: lui Iosif
  rationale: Dativul indică persoana căreia i se arată îngerul; numele urmează forma consacrată în română.
- source_word: ἐν Αἰγύπτῳ
  choice: în Egipt
  rationale: Redă simplu valoarea locativă a expresiei.
theological_decisions:
- issue: Redarea lui κύριος în expresia ἄγγελος κυρίου
  choice: Domnului
  alternative: stăpânului
  rationale: În acest context biblic, κύριος funcționează ca titlu divin; «Domnului» este redarea românească firească și consacrată.
- issue: Articolul pentru ἄγγελος
  choice: un înger al Domnului
  alternative: îngerul Domnului
  rationale: Greaca nu are articol înaintea lui ἄγγελος, astfel că textul principal păstrează lectura nedefinită. Varianta hotărâtă este consemnată deoarece este posibilă în context și are rezonanțe intertextuale, dar nu este impusă de forma greacă.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. Prezentul istoric «i se arată» păstrează vivacitatea originalului, iar «iată că» evită o formulare rigidă.
