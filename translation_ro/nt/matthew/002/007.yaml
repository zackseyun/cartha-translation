  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης λάθρᾳ καλέσας τοὺς μάγους ἠκρίβωσεν παρ’ αὐτῶν τὸν χρόνον τοῦ φαινομένου ἀστέρος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/007.yaml
  text: Then Herod secretly summoned the magi and determined from them the time when the star had appeared,[a]
translation:
  language: ro
  text: Atunci Irod i-a chemat în taină pe magi[a] și a aflat cu exactitate de la ei timpul când se arătase steaua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „pe înțelepți”. Grecescul μάγοι se referă mai precis la magi, oameni învățați din Răsărit, preocupați de astrologie.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Marcator temporal firesc în narațiune, care leagă evenimentul de cele precedente.
- source_word: Ἡρῴδης
  choice: Irod
  rationale: Forma consacrată în limba română pentru numele regelui.
- source_word: λάθρᾳ
  choice: în taină
  rationale: Redă caracterul ascuns al chemării într-un registru natural și demn.
- source_word: καλέσας
  choice: i-a chemat
  rationale: Participiul aorist este redat printr-un verb coordonat, potrivit succesiunii acțiunilor în română.
- source_word: τοὺς μάγους
  choice: pe magi
  rationale: „Magi” redă direct termenul grec și evită restrângerea lui la noțiunea generală de oameni înțelepți.
- source_word: ἠκρίβωσεν
  choice: a aflat cu exactitate
  rationale: Păstrează explicit ideea de cercetare și stabilire precisă cuprinsă în verbul grec.
- source_word: παρ’ αὐτῶν
  choice: de la ei
  rationale: Redă sursa informației indicată de παρά cu genitivul.
- source_word: τὸν χρόνον
  choice: timpul
  rationale: Formulare directă, fără a dubla semantic precizia deja exprimată de verb și de locuțiunea adverbială.
- source_word: τοῦ φαινομένου ἀστέρος
  choice: când se arătase steaua
  rationale: Transformă natural construcția genitivală cu participiu într-o propoziție temporală; mai-mult-ca-perfectul indică apariția anterioară întrebării lui Irod fără a impune dacă steaua încă era vizibilă.
theological_decisions: []
