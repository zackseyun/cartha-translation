  text: καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ⸂ἐξετάσατε ἀκριβῶς⸃ περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: ro
  text: 'I-a trimis la Betleem și le-a spus: „Duceți-vă și căutați cu atenție copilul, iar când îl găsiți, dați-mi de știre, ca să vin și eu să mă închin lui[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „să-i aduc omagiu” ori „să mă plec înaintea lui”. Verbul grecesc poate desemna fie închinarea, fie un gest de profundă reverență înaintea unui suveran.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψας
  choice: I-a trimis
  rationale: 'Participiul aorist exprimă o acțiune anterioară verbului principal; coordonarea în română redă firesc succesiunea: i-a trimis, apoi le-a spus.'
- source_word: Πορευθέντες
  choice: Duceți-vă
  rationale: Participiul are aici valoare imperativă împreună cu ἐξετάσατε; imperativul românesc redă direct și natural porunca.
- source_word: ἐξετάσατε ἀκριβῶς
  choice: căutați cu atenție
  rationale: Combinația indică o cercetare exactă și stăruitoare. Formularea aleasă este clară în româna actuală și se potrivește căutării copilului, fără rigiditatea expresiei «cercetați amănunțit despre».
- source_word: περὶ τοῦ παιδίου
  choice: copilul
  rationale: În asociere cu verbul cercetării, περί indică obiectul căutării; în română, complementul direct este mai idiomatic decât «despre copil».
- source_word: παιδίου
  choice: copilul
  rationale: παιδίον desemnează un copil; termenul românesc este natural și nu adaugă o precizare de vârstă absentă din verset.
- source_word: ἐπὰν δὲ εὕρητε
  choice: iar când îl găsiți
  rationale: Construcția exprimă o eventualitate anticipată. «Când» păstrează așteptarea implicată de instrucțiune, fără a afirma în mod independent certitudinea rezultatului.
- source_word: ἀπαγγείλατέ μοι
  choice: dați-mi de știre
  rationale: Verbul presupune transmiterea înapoi a unei informații sau a unui raport; expresia românească este actuală și păstrează această nuanță.
- source_word: ὅπως
  choice: ca să
  rationale: Conjuncția introduce scopul, redat idiomatic în română prin «ca să».
- source_word: κἀγὼ
  choice: și eu
  rationale: Crasisul subliniază pretinsa participare a lui Irod la aceeași acțiune; «și eu» redă concis această idee.
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: să vin și eu să mă închin lui
  rationale: Participiul și conjunctivul sunt redate firesc prin două verbe coordonate ca scop. προσκυνέω poate indica fie închinare, fie prosternare sau omagiu; sensurile alternative sunt semnalate în notă.
theological_decisions:
- issue: Sensul lui προσκυνήσω αὐτῷ cu referire la copilul Isus
  choice: să mă închin lui
  alternative: să-i aduc omagiu; să mă plec înaintea lui
  rationale: Verbul grec poate desemna atât închinarea, cât și gestul de reverență făcut înaintea unui suveran. Redarea principală păstrează rezonanța teologică posibilă în narațiunea lui Matei, iar nota menține deschisă ambiguitatea lexicală, cu atât mai importantă aici deoarece intenția declarată a lui Irod este înșelătoare.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. «Duceți-vă», «cu atenție» și «dați-mi de știre» evită atât arhaismele, cât și exprimarea excesiv de colocvială.
