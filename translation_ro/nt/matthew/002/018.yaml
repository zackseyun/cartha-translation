id: MAT.2.18
reference: Matthew 2:18
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Φωνὴ ἐν Ῥαμὰ ⸀ἠκούσθη, κλαυθμὸς καὶ ὀδυρμὸς πολύς· Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς, καὶ οὐκ ἤθελεν παρακληθῆναι ὅτι οὐκ εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/018.yaml
  text: 'A voice was heard in Ramah[a], weeping and great mourning: Rachel weeping for her children, and she was not willing to be comforted[c][b], because they are no more.'
translation:
  language: ro
  text: '„Un glas s-a auzit în Rama:

    plâns și jale mare[a];

    Rahela își plângea copiii

    și nu voia să fie mângâiată[b],

    pentru că ei nu mai sunt[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „bocet și multă tânguire”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „refuza să fie mângâiată”.'
    reason: lexical_alternative
  - marker: c
    text: 'Literal: „pentru că ei nu sunt”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Φωνὴ
  choice: Un glas
  rationale: „Glas” redă firesc ideea unei voci auzite și păstrează tonul solemn, profetic; „sunet” ar slăbi personificarea.
- source_word: ἐν Ῥαμὰ
  choice: în Rama
  rationale: Prepoziția ἐν indică locul, iar forma consacrată în română a toponimului este „Rama”.
- source_word: ἠκούσθη
  choice: s-a auzit
  rationale: Redă direct aoristul pasiv și păstrează formularea impersonală a textului grec.
- source_word: κλαυθμὸς καὶ ὀδυρμὸς πολύς
  choice: plâns și jale mare
  rationale: „Plâns” exprimă manifestarea audibilă a durerii, iar „jale mare” redă intensificarea lui ὀδυρμός prin πολύς într-o română actuală și solemnă.
- source_word: Ῥαχὴλ κλαίουσα
  choice: Rahela își plângea
  rationale: Construcția verbală este naturală în română și păstrează acțiunea continuă a participiului, fără a explica simbolismul Rahelei.
- source_word: τὰ τέκνα αὐτῆς
  choice: copiii
  rationale: τέκνα este termenul general pentru copii, fără restrângere la fii; posesivul este exprimat natural prin pronumele reflexiv din „își plângea”.
- source_word: οὐκ ἤθελεν
  choice: nu voia
  rationale: Păstrează sensul literal al lipsei voinței sau disponibilității, fără intensificarea interpretativă din „refuza”.
- source_word: παρακληθῆναι
  choice: să fie mângâiată
  rationale: În contextul doliului, pasivul lui παρακαλέω desemnează primirea mângâierii sau consolării.
- source_word: ὅτι οὐκ εἰσίν
  choice: pentru că ei nu mai sunt
  rationale: Păstrează expresia abruptă și reținută a grecei, indicând pierderea fără a introduce explicit cuvântul „morți”.
theological_decisions:
- issue: Identitatea și rolul Rahelei în citatul profetic
  choice: Rahela rămâne figura maternă numită în citat, fără explicarea simbolismului în textul principal.
  alternative: Rahela ar putea fi explicată direct ca simbol al mamelor lui Israel sau tratată numai ca o mamă istorică literală.
  rationale: Textul grec o prezintă simplu pe Rahela și lasă cititorului tensiunea tipologică a citatului din Ieremia; traducerea nu trebuie să o rezolve doctrinar.
- issue: Sensul expresiei ὅτι οὐκ εἰσίν
  choice: „pentru că ei nu mai sunt”
  alternative: „pentru că au murit”
  rationale: Formularea aleasă păstrează discreția și ambiguitatea expresiei grecești, care descrie absența prin pierdere fără a formula explicit cauza.
translation_notes:
  register: Registru solemn, poetic și ușor de înțeles în româna standard actuală. Așezarea pe versuri păstrează caracterul de citat profetic. S-a evitat atât limbajul arhaic, cât și explicarea în text a tipologiei Rahelei.
