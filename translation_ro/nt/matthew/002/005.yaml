  text: οἱ δὲ εἶπαν αὐτῷ· Ἐν Βηθλέεμ τῆς Ἰουδαίας· οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: ro
  text: 'I-au spus: „În Betleemul din Iudeea, căci așa a fost scris prin profet:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ei
  rationale: Articolul substantivizat îi reia pe conducătorii preoților și pe cărturarii din versetul anterior; pronumele românesc asigură continuitatea fără a accentua nejustificat contrastul lui δέ.
- source_word: εἶπαν αὐτῷ
  choice: i-au răspuns
  rationale: În context, cuvintele constituie răspunsul direct la întrebarea lui Irod; formularea este firească în română, păstrând destinatarul exprimat prin αὐτῷ.
- source_word: Ἐν Βηθλέεμ τῆς Ἰουδαίας
  choice: În Betleemul Iudeii
  rationale: Genitivul identifică localitatea drept Betleemul din regiunea Iudeea și îl deosebește de alte localități cu același nume; forma articulată este idiomatică în română.
- source_word: οὕτως γὰρ
  choice: căci așa
  rationale: γάρ introduce temeiul scripturistic al răspunsului, iar οὕτως indică înainte spre citatul care urmează.
- source_word: γέγραπται
  choice: a fost scris
  rationale: Perfectul pasiv grec exprimă un text scris cu valabilitate prezentă; românescul „a fost scris” păstrează pasivul și este natural în formula introductivă a citatului.
- source_word: διὰ τοῦ προφήτου
  choice: prin profet
  rationale: διά cu genitivul indică medierea sau agenția intermediară, fără a preciza explicit sursa ultimă a mesajului.
theological_decisions:
- issue: Formula medierii profetice
  choice: prin profet
  alternative: de profet
  rationale: „Prin” redă mai exact διά cu genitivul și păstrează deschisă relația dintre sursa divină implicită și profetul ca mijlocitor al rostirii.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. Punctuația păstrează răspunsul și justificarea în aceeași replică, iar două puncte anunță citatul profetic din versetul următor.
