id: MAT.2.6
reference: Matthew 2:6
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: ro
  text: „Și tu, Betleeme, ținut al lui Iuda, nu ești nicidecum cea mai neînsemnată dintre căpeteniile lui Iuda, căci din tine va veni[a] un conducător care va păstori[b] poporul Meu, Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „va ieși” (redare mai literală).
    reason: lexical_alternative
  - marker: b
    text: „Va păstori” poate avea și sensul de „va conduce”, păstrând imaginea conducerii regale alături de cea a grijii unui păstor.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ
  choice: ținut
  rationale: În apoziție cu „Betleeme” și urmat de genitivul „lui Iuda”, termenul indică regiunea sau teritoriul asociat lui Iuda, nu solul ori pământul în sens general.
- source_word: οὐδαμῶς
  choice: nicidecum
  rationale: Redă negația puternică și emfatică a adverbului grec, mai fidel decât simplul „nu”.
- source_word: ἐλαχίστη
  choice: cel mai neînsemnat
  rationale: Contextul privește rangul sau importanța, nu doar dimensiunea fizică; formularea păstrează contrastul dintre aparenta lipsă de însemnătate a Betleemului și rolul său.
- source_word: ἡγεμόσιν
  choice: conducătorii
  rationale: Termenul desemnează persoane sau unități conducătoare din Iuda. „Conducătorii” păstrează sensul larg de autoritate fără a impune funcția mai îngustă de guvernator.
- source_word: ἐξελεύσεται
  choice: va veni
  rationale: Verbul înseamnă literal „va ieși”, dar în construcția „din tine va veni” româna exprimă firesc apariția sau proveniența conducătorului; sensul mai literal este păstrat în nota [a].
- source_word: ἡγούμενος
  choice: un conducător
  rationale: Participiul substantivizat descrie rolul de conducere al celui care urmează să vină și susține dimensiunea regală a citatului.
- source_word: ποιμανεῖ
  choice: va păstori
  rationale: Păstrează imaginea explicită a păstorului și, totodată, permite sensul metaforic de guvernare, fără a reduce termenul numai la limbaj politic.
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: poporul Meu, Israel
  rationale: Redă direct expresia de legământ și face limpede relația apozițională prin virgulă, fără adaosuri explicative.
theological_decisions:
- issue: Nuanța regală și cea pastorală în descrierea celui care vine
  choice: „un conducător care va păstori”
  alternative: „un lider care va conduce” sau o formulare exclusiv pastorală
  rationale: Textul alătură autoritatea de conducător și imaginea păstorului. Păstrarea ambelor evită reducerea tensiunii teologice fie numai la domnie, fie numai la îngrijire pastorală.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. Vocativul „Betleeme” este firesc în context biblic; „nicidecum” păstrează accentul negației, iar „ținut” evită ambiguitatea modernă a lui „pământ”.
