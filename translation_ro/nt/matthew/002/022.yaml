id: MAT.2.22
reference: Matthew 2:22
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὅτι Ἀρχέλαος ⸀βασιλεύει τῆς Ἰουδαίας ἀντὶ ⸂τοῦ πατρὸς αὐτοῦ Ἡρῴδου⸃ ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατ’ ὄναρ ἀνεχώρησεν εἰς τὰ μέρη τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/022.yaml
  text: But when he heard that Archelaus was reigning over Judea in place of his father Herod[a], he was afraid to go there. And after being warned in a dream, he withdrew to the regions of Galilee,
translation:
  language: ro
  text: Dar, când a auzit că Arhelau domnea peste Iudeea în locul tatălui său, Irod, s-a temut să meargă acolo. Iar după ce a fost avertizat[a] în vis, s-a retras în ținuturile Galileii,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „înștiințat”; verbul implică adesea un avertisment sau o îndrumare de origine divină.'
    reason: alternativă lexicală și clarificarea unei implicații contextuale fără explicitarea ei în text
lexical_decisions:
- source_word: ἀκούσας
  choice: când a auzit
  rationale: Participiul aorist exprimă împrejurarea anterioară acțiunii principale; formularea este firească în româna actuală și păstrează raportul temporal.
- source_word: δὲ
  choice: Dar / Iar
  rationale: Prima apariție marchează contrastul cu intenția anterioară, iar a doua continuă relatarea printr-o nouă împrejurare; redarea diferențiată este idiomatică în română.
- source_word: βασιλεύει τῆς Ἰουδαίας
  choice: domnea peste Iudeea
  rationale: Verbul are sens regal, iar genitivul teritoriului se redă firesc prin „peste”; imperfectul se potrivește discursului indirect în cadrul unei narațiuni la trecut.
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: în locul tatălui său, Irod
  rationale: ἀντί indică aici înlocuirea sau succesiunea. Apoziția „Irod” este delimitată conform sintaxei românești.
- source_word: ἐφοβήθη ἐκεῖ ἀπελθεῖν
  choice: s-a temut să meargă acolo
  rationale: Redare românească naturală a verbului de teamă urmat de infinitivul care precizează acțiunea temută.
- source_word: χρηματισθεὶς
  choice: după ce a fost avertizat
  rationale: Păstrează forma pasivă și sensul contextual de avertizare, fără a introduce explicit agentul divin, care nu este numit în verset.
- source_word: κατ’ ὄναρ
  choice: în vis
  rationale: Este formularea românească consacrată și firească pentru comunicarea primită în timpul visului.
- source_word: ἀνεχώρησεν
  choice: s-a retras
  rationale: Păstrează nuanța unei plecări deliberate ca răspuns la pericol, mai precis decât simplul „a plecat”.
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: în ținuturile Galileii
  rationale: Pluralul μέρη este păstrat prin „ținuturile”, indicând zonele sau districtele Galileii.
theological_decisions:
- issue: Dacă sursa divină a avertizării din χρηματισθείς trebuie exprimată explicit
  choice: 'Agentul rămâne neexprimat: „a fost avertizat”.'
  alternative: „a fost avertizat de Dumnezeu” / „a primit o înștiințare divină”
  rationale: În uzul lui Matei, verbul implică adesea comunicare divină, însă aici greaca nu numește agentul. Pasivul păstrează această discreție și evită explicitarea interpretativă.
translation_notes:
  register: Română standard modernă, clară și demnă. „Domnea peste” păstrează nuanța regală, iar „s-a retras” sugerează plecarea prudentă în fața pericolului. Virgula finală este păstrată deoarece versetul continuă sintactic în versetul următor.
