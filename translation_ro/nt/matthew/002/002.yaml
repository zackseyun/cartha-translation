id: MAT.2.2
reference: Matthew 2:2
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: λέγοντες· Ποῦ ἐστιν ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων; εἴδομεν γὰρ αὐτοῦ τὸν ἀστέρα ἐν τῇ ἀνατολῇ καὶ ἤλθομεν προσκυνῆσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
translation:
  language: ro
  text: 'spunând: „Unde este cel care S-a născut rege al iudeilor? Căci I-am văzut steaua în răsărit[a] și am venit să-I aducem omagiu[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „la răsărirea ei”. Expresia grecească poate însemna „în răsărit” sau poate desemna răsărirea stelei.'
    reason: alternative_reading
  - marker: b
    text: 'Sau: „să ne închinăm Lui”. Verbul grecesc poate desemna fie omagiul adus unui rege, fie închinarea, în funcție de context.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: spunând
  rationale: Redă direct participiul prezent care introduce cuvintele magilor și păstrează legătura sintactică cu versetul precedent.
- source_word: Ποῦ ἐστιν
  choice: Unde este
  rationale: Întrebare locativă simplă, fără nuanțe suplimentare în greacă.
- source_word: ὁ τεχθεὶς
  choice: cel care S-a născut
  rationale: Păstrează valoarea substantivală a participiului pasiv și accentul pus pe naștere, fără a adăuga ideea explicită de nou-născut.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: rege al iudeilor
  rationale: Formulare românească firească pentru titlul regal, păstrând implicațiile sale politice și mesianice.
- source_word: εἴδομεν γὰρ
  choice: Căci I-am văzut
  rationale: „Căci” exprimă raportul explicativ introdus de γάρ, iar perfectul compus este redarea narativă firească a aoristului în română.
- source_word: αὐτοῦ τὸν ἀστέρα
  choice: I-am văzut steaua
  rationale: Construcția românească cu pronume datival posesiv redă natural sensul „am văzut steaua lui”, cu referire clară la copilul căutat.
- source_word: ἐν τῇ ἀνατολῇ
  choice: în răsărit
  rationale: Redă lectura geografică plauzibilă, păstrând în notă sensul astronomic alternativ al expresiei grecești.
- source_word: ἤλθομεν
  choice: am venit
  rationale: Perfectul compus este forma idiomatică românească pentru acțiunea încheiată a venirii, relevantă în momentul vorbirii.
- source_word: προσκυνῆσαι αὐτῷ
  choice: să-I aducem omagiu
  rationale: În cadrul imediat al căutării unui rege, formularea exprimă reverența regală fără a exclude sensul mai puternic de închinare, menționat în notă.
theological_decisions:
- issue: Sensul lui προσκυνῆσαι în raport cu copilul Isus
  choice: să-I aducem omagiu
  alternative: să ne închinăm Lui
  rationale: Verbul poate desemna atât omagiul și prosternarea înaintea unui suveran, cât și închinarea religioasă. Contextul imediat evidențiază titlul regal, astfel că textul principal păstrează cadrul narativ, iar nota conservă deschiderea teologică a termenului.
translation_notes:
  register: Română standard modernă, cu formulare demnă și ușor de înțeles. Majusculele reverențiale pentru pronumele referitoare la Isus urmează o convenție editorială românească răspândită și nu modifică sensul lexical. Ambiguitățile reale din ἐν τῇ ἀνατολῇ și προσκυνέω sunt păstrate prin note.
