  yaml_path: translation/nt/matthew/002/010.yaml
  text: And when they saw the star[a], they rejoiced with exceedingly great joy.
translation:
  language: ro
  text: Iar când au văzut steaua, s-au bucurat cu o bucurie nespus de mare.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'În greacă, literal: „s-au bucurat cu o bucurie mare, foarte [mult]”, o expresie puternic emfatică.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: când au văzut
  rationale: Participiul aorist are aici valoare temporală; formularea redă firesc în română relația cu verbul principal.
- source_word: δὲ
  choice: iar
  rationale: Particula este un conector narativ slab, fără un contrast puternic; „iar” continuă natural relatarea.
- source_word: τὸν ἀστέρα
  choice: steaua
  rationale: Substantivul desemnează steaua precisă, deja cunoscută din context, iar articolul hotărât este păstrat.
- source_word: ἐχάρησαν
  choice: s-au bucurat
  rationale: Deși forma grecească este pasivă/deponentă, sensul ei este activ; verbul românesc păstrează atât sensul, cât și tonul demn.
- source_word: χαρὰν μεγάλην
  choice: cu o bucurie ... mare
  rationale: Construcția cu acuzativ intern intensifică verbul; repetarea rădăcinii „s-au bucurat ... cu o bucurie” păstrează accentul retoric al grecei și rămâne inteligibilă în română.
- source_word: σφόδρα
  choice: nespus de
  rationale: Adverbul intensifică puternic expresia; „nespus de mare” este o redare românească naturală și expresivă pentru gradul foarte înalt.
