id: MAT.2.1
reference: Matthew 2:1
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως, ἰδοὺ μάγοι ἀπὸ ἀνατολῶν παρεγένοντο εἰς Ἱεροσόλυμα
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: ro
  text: După ce Isus s-a născut în Betleemul din Iudeea, în zilele regelui Irod, iată că niște magi[a] din răsărit au sosit la Ierusalim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Termenul grecesc îi desemnează pe niște oameni învățați din Răsărit, probabil legați de astrologie sau de înțelepciunea de curte.
    reason: Clarificarea sensului istoric al termenului „magi” fără a introduce tradiții ulterioare.
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: După ce Isus s-a născut
  rationale: Genitivul absolut oferă împrejurarea temporală anterioară acțiunii principale. Formularea românească redă natural această succesiune, iar δέ funcționează aici ca o tranziție narativă discretă, fără a necesita un echivalent separat.
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: Betleemul din Iudeea
  rationale: Articolul hotărât atașat numelui este firesc în română, iar „din Iudeea” localizează și deosebește această cetate de alte localități cu același nume.
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: în zilele regelui Irod
  rationale: Păstrează idiomul istoric și tonul narativ al grecei, într-o formă demnă și ușor de înțeles în româna actuală.
- source_word: ἰδοὺ
  choice: iată că
  rationale: Redă marcatorul discursiv care atrage atenția asupra sosirii neașteptate a personajelor, fără ton arhaic excesiv.
- source_word: μάγοι
  choice: magi
  rationale: „Magi” este termenul românesc consacrat și apropiat formal de greacă; evită identificarea lor nejustificată drept regi și este explicat în notă.
- source_word: ἀπὸ ἀνατολῶν
  choice: din răsărit
  rationale: Expresia românească redă firesc pluralul grecesc folosit colectiv pentru regiunile estice.
- source_word: παρεγένοντο εἰς Ἱεροσόλυμα
  choice: au sosit la Ierusalim
  rationale: Verbul indică venirea și ajungerea la destinație; „au sosit la” este construcția idiomatică în română.
theological_decisions:
- issue: Redarea lui μάγοι fără introducerea tradițiilor ulterioare
  choice: magi
  alternative: înțelepți
  rationale: Termenul desemnează oameni învățați din Răsărit, probabil legați de astrologie ori de înțelepciunea de curte. Redarea nu îi numește regi, nu le precizează numărul și nu adaugă alte detalii absente din text.
translation_notes:
  register: Română standard modernă, cu ton narativ demn. „În zilele” păstrează discret coloratura biblică, iar „iată că” menține reliefarea narativă a originalului.
source_grounding:
  english_pob_role: consult_only
