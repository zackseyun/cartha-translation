  terminology: „Nazaret” și „Nazarinean” sunt forme românești consacrate și inteligibile. Nota păstrează în mod util alternativa „Nazorean” și nu confundă termenul cu „nazireu”. „Prin profeți” redă bine agenția/instrumentalitatea lui διά și conservă pluralul semnificativ din text.
