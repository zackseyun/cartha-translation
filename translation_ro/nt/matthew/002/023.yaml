id: MAT.2.23
reference: Matthew 2:23
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην Ναζαρέτ, ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τῶν προφητῶν ὅτι Ναζωραῖος κληθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/023.yaml
  text: 'And he came and lived in a city called Nazareth[a], so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”'
translation:
  language: ro
  text: 'A venit și a locuit într-un oraș numit Nazaret[a], pentru ca să se împlinească ce fusese spus prin profeți: „El va fi numit Nazarinean.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „Nazorean”. Fundalul profetic exact al afirmației „El va fi numit Nazarinean” este disputat; este posibil ca Matei să rezume teme din scrierile profeților, nu să citeze un singur text anume.
    reason: alternativă lexicală și păstrarea incertitudinii privind sursa profetică
lexical_decisions:
- source_word: ἐλθὼν
  choice: A venit
  rationale: Participiul aorist exprimă o acțiune anterioară sau strâns legată de verbul principal; coordonarea prin „și” este firească în româna modernă și păstrează succesiunea.
- source_word: κατῴκησεν
  choice: a locuit
  rationale: Verbul indică stabilirea sau locuirea într-un loc. „A locuit” este clar și nu accentuează mai mult decât textul caracterul definitiv al stabilirii.
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: într-un oraș numit Nazaret
  rationale: Cu verbul κατοικέω, prepoziția εἰς se redă idiomatic prin „în”. „Oraș” este un echivalent modern și natural pentru πόλις.
- source_word: ὅπως πληρωθῇ
  choice: pentru ca să se împlinească
  rationale: Păstrează nuanța de scop/rezultat a formulei mateene și construcția la conjunctiv.
- source_word: τὸ ῥηθὲν
  choice: ce fusese spus
  rationale: Redă natural participiul pasiv substantivizat și marchează faptul că rostirea profetică precedă evenimentul relatat.
- source_word: διὰ τῶν προφητῶν
  choice: prin profeți
  rationale: Păstrează valoarea de mijlocire sau agenție a lui διά cu genitivul și pluralul explicit „profeți”.
- source_word: Ναζωραῖος
  choice: Nazarinean
  rationale: Este desemnarea românească tradițională și inteligibilă pentru o persoană asociată cu Nazaretul; alternativa mai formală „Nazorean” este păstrată în notă.
- source_word: κληθήσεται
  choice: va fi numit
  rationale: Redă direct viitorul pasiv și stilul solemn al afirmației profetice.
theological_decisions:
- issue: Natura trimiterii profetice, pentru care nu există un citat veterotestamentar unic și exact
  choice: Formula este redată ca o mărturie atribuită profeților la plural, fără identificarea unei surse anume în textul principal.
  alternative: Posibilele explicații includ o aluzie la Isaia 11:1 sau un rezumat al temelor profetice despre smerenia și disprețuirea lui Mesia.
  rationale: Textul grecesc spune explicit „prin profeți”, la plural. Traducerea trebuie să păstreze formularea și tensiunea ei fără să impună o identificare nesigură.
- issue: Sensul lui Ναζωραῖος
  choice: Nazarinean
  alternative: Nazorean; nu „nazireu”
  rationale: În context, termenul este asociat cu Nazaretul. „Nazireu” ar introduce ideea distinctă a jurământului de nazireat, care nu este exprimată de termenul grecesc de aici.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea evită arhaismele, păstrează pluralul „profeți” și nu transformă desemnarea legată de Nazaret într-o referire la nazireat.
