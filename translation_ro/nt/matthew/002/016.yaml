id: MAT.2.16
reference: Matthew 2:16
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: ro
  text: Atunci Irod, văzând că magii[a] îl păcăliseră[b], s-a mâniat foarte tare și, trimițând oameni, i-a ucis pe toți băieții din Betleem și din toate ținuturile din jurul Betleemului, pe cei de doi ani și mai mici, potrivit timpului pe care îl aflase cu exactitate de la magi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: În mod tradițional, „înțelepți”. Termenul grecesc este magi și se referă la învățați-astrologi din Răsărit.
    reason: cultural_note
  - marker: b
    text: Sau, mai literal, „își bătuseră joc de el”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Redă firesc legătura temporală și succesiunea evenimentelor.
- source_word: ἰδὼν ὅτι
  choice: văzând că
  rationale: Păstrează atât imaginea percepției, cât și legătura cauzală sugerată de participiu.
- source_word: ἐνεπαίχθη
  choice: îl păcăliseră
  rationale: În context, magii nu s-au întors la Irod, iar el a înțeles că fusese făcut de rușine sau dus de nas. Formularea aleasă comunică limpede sensul contextual; alternativa mai literală este consemnată în notă.
- source_word: μάγων
  choice: magii
  rationale: Păstrează termenul cultural specific pentru acești învățați-astrologi din Răsărit, fără a introduce imaginea tradițională mai largă a unor simpli „înțelepți”.
- source_word: ἐθυμώθη λίαν
  choice: s-a mâniat foarte tare
  rationale: Redă direct verbul care indică ajungerea la mânie și intensificatorul λίαν.
- source_word: ἀποστείλας
  choice: trimițând oameni
  rationale: Participiul arată că Irod a trimis agenți pentru a executa porunca. „Oameni” este o completare contextuală necesară pentru claritate în română.
- source_word: ἀνεῖλεν
  choice: i-a ucis
  rationale: Verbul înseamnă aici a omorî sau a da la moarte; „a ucis” este direct, actual și demn.
- source_word: πάντας τοὺς παῖδας
  choice: pe toți băieții
  rationale: În acest context, pluralul masculin îi desemnează pe copiii de sex bărbătesc vizați de căutarea pruncului.
- source_word: ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: din Betleem și din toate împrejurimile lui
  rationale: ὅρια desemnează aici teritoriile din jurul cetății, nu doar liniile de hotar. Pronumele românesc se raportează la Betleem.
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: pe cei de doi ani și mai mici
  rationale: Exprimă inclusiv limita superioară de doi ani într-o formulare românească naturală.
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων
  choice: potrivit timpului pe care îl aflase cu exactitate de la magi
  rationale: Păstrează ideea că limita de vârstă a fost stabilită în conformitate cu timpul cercetat precis de Irod de la magi.
theological_decisions:
- issue: Redarea lui μάγοι
  choice: magi
  alternative: înțelepți
  rationale: „Magi” păstrează identitatea istorico-culturală a vizitatorilor și evită introducerea unor asocieri tradiționale care nu sunt exprimate de termenul grec.
- issue: Redarea lui ἐνεπαίχθη
  choice: îl păcăliseră
  alternative: își bătuseră joc de el
  rationale: Contextul arată că Irod s-a considerat dus de nas deoarece magii nu s-au întors. Varianta principală este clară în româna actuală, iar sensul lexical mai literal este păstrat în notă fără a elimina tensiunea dintre înșelare și batjocură.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Construcția participială păstrează ritmul textului grec, iar formulările explicite evită atât arhaismele, cât și parafraza excesivă.
