  text: 'Atunci s-a împlinit ce fusese spus prin profetul Ieremia, care zice:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Marchează succesiunea în narațiune într-o formă firească și concisă în română.
- source_word: ἐπληρώθη
  choice: s-a împlinit
  rationale: Păstrează formula caracteristică a lui Matei despre împlinirea cuvântului profetic, fără parafrazare.
- source_word: τὸ ῥηθὲν
  choice: ce fusese spus
  rationale: Redă participiul articulat substantivizat într-o română naturală; mai-mult-ca-perfectul indică limpede că rostirea profetică a precedat împlinirea relatată.
- source_word: διὰ Ἰερεμίου τοῦ προφήτου
  choice: prin profetul Ieremia
  rationale: Redă valoarea de mediere a construcției διά cu genitivul și identifică firesc rolul lui Ieremia.
- source_word: λέγοντος
  choice: care zice
  rationale: Participiul este la genitiv și se leagă gramatical de Ieremia; formularea introduce direct citatul următor și evită impresia că împlinirea însăși „spune” ceva.
theological_decisions:
- issue: Formula mateiană a împlinirii
  choice: s-a împlinit
  alternative: s-a întâmplat ca să împlinească
  rationale: Textul afirmă explicit împlinirea cuvântului profetic; traducerea păstrează această afirmație fără să adauge o construcție de scop absentă din verset.
translation_notes:
  register: Română standard modernă, concisă și demnă. «Care zice» păstrează legătura gramaticală cu profetul și funcționează natural ca introducere a citatului din versetul următor.
