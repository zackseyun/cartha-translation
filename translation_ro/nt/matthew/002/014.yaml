  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ νυκτὸς καὶ ἀνεχώρησεν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/014.yaml
  text: So he got up[a], took the child and his mother during the night, and departed for Egypt.
translation:
  language: ro
  text: Atunci, el s-a ridicat, a luat copilul și pe mama lui noaptea și a plecat în Egipt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Așadar
  rationale: Conjuncția marchează discret continuarea narațiunii și legătura de consecință cu porunca primită anterior.
- source_word: ἐγερθεὶς
  choice: s-a ridicat
  rationale: Participiul aorist indică acțiunea imediată a lui Iosif; formularea este firească în româna actuală și păstrează succesiunea narațiunii.
- source_word: παρέλαβε
  choice: a luat
  rationale: În context, verbul înseamnă că Iosif i-a luat cu sine; „a luat” este concis și natural.
- source_word: τὸ παιδίον
  choice: copilul
  rationale: Redă sensul obișnuit al substantivului fără a adăuga un accent asupra vârstei care nu este explicit în text.
- source_word: τὴν μητέρα αὐτοῦ
  choice: pe mama lui
  rationale: Pronumele se referă în mod natural la copil, iar construcția românească păstrează formularea simplă a grecei.
- source_word: νυκτὸς
  choice: în timpul nopții
  rationale: Genitivul temporal arată că plecarea și acțiunile asociate au avut loc noaptea; formularea este clară și actuală.
- source_word: ἀνεχώρησεν
  choice: a plecat
  rationale: Verbul indică retragerea sau plecarea spre alt loc; „a plecat” redă natural mișcarea fără a explicita mai mult decât spune versetul.
- source_word: εἰς Αἴγυπτον
  choice: în Egipt
  rationale: Prepoziția εἰς indică deplasarea către o destinație; în română, expresia idiomatică este „a plecat în Egipt”.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. Sintaxa coordonată păstrează ritmul rapid al acțiunilor din textul grec. Nota din stratul englez nu a fost preluată, deoarece markerul ei este atașat unei expresii fără legătură cu alternativa indicată, iar varianta românească „în Egipt” nu necesită explicarea alternativei englezești „to Egypt”.
