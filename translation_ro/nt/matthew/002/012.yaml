id: MAT.2.12
reference: Matthew 2:12
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ χρηματισθέντες κατ’ ὄναρ μὴ ἀνακάμψαι πρὸς Ἡρῴδην δι’ ἄλλης ὁδοῦ ἀνεχώρησαν εἰς τὴν χώραν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: ro
  text: Și, fiind avertizați în vis[a] să nu se întoarcă la Irod, au plecat în țara lor pe un alt drum.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „fiind înștiințați de Dumnezeu în vis”. Pasivul grecesc sugerează că avertizarea venea de la Dumnezeu, deși Dumnezeu nu este numit explicit în acest verset.
    reason: lexical_alternative
  - marker: b
    text: Sau „pe o altă cale”.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισθέντες
  choice: fiind avertizați
  rationale: Participiul pasiv exprimă primirea unei avertizări și, în contextul lui Matei, sugerează o sursă divină. Formularea este firească în româna actuală fără a-l numi explicit pe Dumnezeu, pe care textul grec nu-l menționează aici.
- source_word: κατ’ ὄναρ
  choice: în vis
  rationale: Expresia idiomatică indică faptul că avertizarea a fost primită într-un vis; redarea este clară și naturală în română.
- source_word: μὴ ἀνακάμψαι
  choice: să nu se întoarcă
  rationale: Infinitivul negat redă conținutul avertizării, iar verbul „a se întoarce” se potrivește contextului călătoriei.
- source_word: πρὸς Ἡρῴδην
  choice: la Irod
  rationale: Construcția cu πρός și acuzativul indică deplasarea către o persoană; „la Irod” este formularea românească idiomatică.
- source_word: δι’ ἄλλης ὁδοῦ
  choice: pe un alt drum
  rationale: ὁδός are aici sens concret, referitor la traseul călătoriei. „Pe un alt drum” păstrează imaginea textului grec și sună firesc în română.
- source_word: ἀνεχώρησαν
  choice: au plecat
  rationale: În această narațiune de călătorie, verbul denotă plecarea sau retragerea; „au plecat” redă limpede acțiunea fără a introduce o nuanță militară.
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: în țara lor
  rationale: χώρα poate desemna o țară, un ținut sau o regiune. Contextul revenirii magilor acasă susține formularea firească „în țara lor”.
theological_decisions:
- issue: Sursa divină implicită a avertizării
  choice: Pasivul „fiind avertizați” este păstrat fără adăugarea expresiei „de Dumnezeu” în textul principal.
  alternative: „fiind avertizați de Dumnezeu” sau „primind o înștiințare dumnezeiască”
  rationale: Contextul și uzul verbului χρηματίζω sugerează puternic o comunicare divină, însă Dumnezeu nu este numit explicit în acest verset. Redarea păstrează atât implicația, cât și reținerea formulării grecești.
translation_notes:
  register: Română standard modernă, clară și demnă. Ordinea propoziției urmează îndeaproape desfășurarea textului grec, dar evită formulările rigide. „Avertizați” comunică primejdia implicită în context, iar nota păstrează nuanța de comunicare divină.
