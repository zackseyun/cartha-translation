  text: λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/020.yaml
  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: ro
  text: 'spunând: „Ridică-te, ia copilul și pe mama lui și du-te în țara lui Israel, căci cei care căutau să ia viața copilului au murit.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, mai literal: „cei care caută viața copilului au murit”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: spunând
  rationale: Păstrează participiul prezent care leagă direct cuvintele îngerului de propoziția din versetul anterior.
- source_word: Ἐγερθείς
  choice: Ridică-te
  rationale: Participiul aorist are aici valoarea idiomatică a unei porunci preliminare; formularea este firească și directă în română.
- source_word: παράλαβε
  choice: ia
  rationale: În context, verbul înseamnă a lua pe cineva cu sine; „ia” redă concis această idee.
- source_word: τὸ παιδίον
  choice: copilul
  rationale: Redă sensul obișnuit al substantivului fără a adăuga o precizare de vârstă absentă din text.
- source_word: τὴν μητέρα αὐτοῦ
  choice: pe mama lui
  rationale: Pronumele se referă firesc la copil, iar marcarea cu „pe” este cerută de uzul românesc pentru complementul direct personal.
- source_word: πορεύου
  choice: du-te
  rationale: Imperativul exprimă porunca simplă de a pleca spre o destinație; „du-te” este echivalentul românesc natural.
- source_word: εἰς γῆν Ἰσραήλ
  choice: în țara lui Israel
  rationale: Păstrează sensul teritorial al lui γῆ și construcția genitivală cu Israel.
- source_word: τεθνήκασιν
  choice: au murit
  rationale: Perfectul grecesc indică o moarte petrecută cu rezultat valabil în prezent; perfectul compus românesc este natural în această explicație narativă.
- source_word: οἱ ζητοῦντες
  choice: cei care căutau
  rationale: Participiul substantivizat este redat printr-o propoziție relativă; imperfectul românesc situează căutarea în perioada anterioară morții lor.
- source_word: τὴν ψυχὴν τοῦ παιδίου
  choice: să ia viața copilului
  rationale: În acest idiom de amenințare mortală, ψυχή înseamnă „viață”, nu „suflet”; expresia românească arată clar intenția fără a introduce o doctrină despre natura sufletului.
theological_decisions:
- issue: Redarea lui ψυχή într-un context de amenințare mortală
  choice: viața
  alternative: sufletul
  rationale: Contextul arată că oamenii urmăreau moartea copilului. „Sufletul” ar sugera aici o distincție teologică străină sensului idiomatic al expresiei.
- issue: Forța perfectului τεθνήκασιν
  choice: au murit
  alternative: sunt morți
  rationale: Ambele redări pot exprima rezultatul prezent al morții; „au murit” păstrează mai clar evenimentul verbal, fără a pierde implicația că ei nu mai sunt în viață.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. Imperativele sunt directe și naturale, iar construcția idiomatică despre amenințarea vieții este clarificată în text, cu forma mai literală păstrată în notă.
