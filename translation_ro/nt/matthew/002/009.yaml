id: MAT.2.9
reference: Matthew 2:9
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: ro
  text: După ce l-au ascultat pe rege, au plecat; și iată că steaua pe care o văzuseră la răsărit[a] mergea înaintea lor, până când a ajuns și s-a oprit deasupra locului unde era copilul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „la răsărirea ei”; expresia grecească se poate referi fie la răsărit ca regiune sau direcție, fie la răsărirea unei stele pe cer.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: După ce l-au ascultat pe rege
  rationale: Participiul aorist este redat printr-o propoziție temporală care păstrează succesiunea acțiunilor. Construcția românească exprimă faptul că ei l-au auzit pe rege, fără a-i introduce numele din context.
- source_word: ἐπορεύθησαν
  choice: au plecat
  rationale: Redă firesc în narațiune pornirea lor la drum după întrevederea cu regele.
- source_word: ἰδοὺ
  choice: iată că
  rationale: Păstrează marcatorul discursiv care atrage atenția asupra reapariției neașteptate a stelei.
- source_word: ὁ ἀστήρ
  choice: steaua
  rationale: Echivalentul lexical direct și firesc în context.
- source_word: ὃν εἶδον
  choice: pe care o văzuseră
  rationale: Mai-mult-ca-perfectul arată limpede că vederea stelei precedase deplasarea descrisă acum.
- source_word: ἐν τῇ ἀνατολῇ
  choice: la răsărit
  rationale: Formularea românească este naturală și păstrează într-o anumită măsură posibilitatea sensului geografic și a celui astronomic; alternativa este explicată în nota de subsol.
- source_word: προῆγεν αὐτούς
  choice: mergea înaintea lor
  rationale: Păstrează imaginea stelei care se deplasează înaintea lor, fără a preciza un mecanism sau a accentua suplimentar ideea de călăuzire.
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: până când a ajuns și s-a oprit
  rationale: Redă în română cursiv venirea la locul respectiv, urmată de oprire.
- source_word: ἐπάνω οὗ ἦν
  choice: deasupra locului unde era
  rationale: Face explicit referentul locativ cerut de exprimarea firească în română, păstrând poziția indicată de ἐπάνω.
- source_word: τὸ παιδίον
  choice: copilul
  rationale: Echivalent direct, fără adaosul unei precizări de vârstă pe care greaca nu o cere aici.
theological_decisions:
- issue: Sensul expresiei ἐν τῇ ἀνατολῇ în relatarea despre stea
  choice: la răsărit
  alternative: la ridicarea ei
  rationale: Expresia grecească poate indica răsăritul ca regiune sau direcție, dar poate avea și sens astronomic, referindu-se la ridicarea ori apariția stelei. Textul principal păstrează formularea familiară, iar nota menține deschisă alternativa reală.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. „Iată că” păstrează vivacitatea relatării, iar „la răsărit” evită atât tehnicismul, cât și rezolvarea nejustificată a ambiguității grecești.
