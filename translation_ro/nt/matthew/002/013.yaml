reference: Matthew 2:13
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: ro
  text: 'După ce au plecat, iată, un înger al Domnului i s-a arătat lui Iosif într-un vis și i-a zis: „Scoală-te, ia copilul și pe mama lui și fugi în Egipt. Rămâi acolo până îți voi spune, căci Irod este pe punctul de a căuta copilul ca să-l omoare.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: „ca să-l nimicească” sau „ca să-l distrugă”; aici, cu sensul de a-i provoca moartea.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: După ce au plecat ei
  rationale: Genitivul absolut indică o acțiune anterioară. Formularea este firească în româna actuală și păstrează succesiunea temporală; pronumele îi desemnează contextual pe vizitatorii menționați anterior.
- source_word: ἰδοὺ
  choice: iată
  rationale: Păstrează marcatorul narativ viu al lui Matei și semnalează intervenția neașteptată, într-un registru biblic încă limpede pentru cititorul modern.
- source_word: ἄγγελος κυρίου
  choice: un înger al Domnului
  rationale: Construcția greacă este nearticulată, astfel că redarea nehotărâtă evită identificarea nejustificată cu o figură unică; κύριος este redat prin titlul consacrat „Domnul”.
- source_word: φαίνεται κατ’ ὄναρ τῷ Ἰωσὴφ
  choice: i s-a arătat lui Iosif într-un vis
  rationale: Prezentul istoric grecesc este redat firesc prin perfect compus în narațiunea românească, iar expresia κατ’ ὄναρ înseamnă idiomatic „într-un vis”.
- source_word: Ἐγερθεὶς
  choice: Scoală-te
  rationale: Participiul are aici forța unei porunci în succesiunea imperativelor. „Scoală-te” este direct, demn și uzual în registrul biblic românesc.
- source_word: παράλαβε
  choice: ia
  rationale: În context înseamnă a lua cu sine; obiectele coordonate fac explicită ideea de însoțire.
- source_word: τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ
  choice: copilul și pe mama lui
  rationale: Redarea păstrează ordinea și relația posesivă din greacă, fără a o înlocui pe mamă cu un nume absent din verset.
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: fugi în Egipt
  rationale: Verbul exprimă fuga din fața unui pericol și păstrează urgența poruncii.
- source_word: ἴσθι ἐκεῖ
  choice: Rămâi acolo
  rationale: Deși literal este „fii acolo”, sensul contextual este continuarea șederii, exprimată idiomatic prin „rămâi”.
- source_word: ἕως ἂν εἴπω σοι
  choice: până îți voi spune
  rationale: Construcția indică o limită viitoare nedeterminată; viitorul românesc păstrează natural această orientare.
- source_word: μέλλει γὰρ Ἡρῴδης ζητεῖν
  choice: căci Irod este pe cale să caute
  rationale: μέλλει cu infinitivul exprimă aici intenția sau acțiunea iminentă, nu doar un viitor neutru.
- source_word: τοῦ ἀπολέσαι αὐτό
  choice: ca să-l omoare
  rationale: Infinitivul articular exprimă scopul, iar ἀπόλλυμι în acest context se referă la provocarea morții copilului. Redarea este clară și firească, iar sensul mai formal este consemnat în notă.
theological_decisions:
- issue: Identitatea lui ἄγγελος κυρίου
  choice: un înger al Domnului
  alternative: îngerul Domnului
  rationale: Lipsa articolului susține în context redarea nehotărâtă. Aceasta nu exclude expresia biblică familiară, dar nici nu impune identificarea îngerului cu o manifestare unică sau cu o anumită persoană divină.
- issue: Sensul lui ἀπολέσαι cu referire la copil
  choice: ca să-l omoare
  alternative: ca să-l nimicească
  rationale: Contextul arată că scopul lui Irod este moartea copilului. „Să-l omoare” exprimă precis rezultatul intenționat, fără a adăuga o nuanță teologică de nimicire totală.
translation_notes:
  register: Română standard modernă, cu un ton narativ demn și accesibil. „Iată” și „Scoală-te” păstrează culoarea biblică fără arhaizare excesivă. Punctuația separă porunca de a rămâne de explicația introdusă prin „căci”.
