  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ ⸀εἰσῆλθεν εἰς γῆν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/021.yaml
  text: So he rose, took the child and his mother, and entered the land of Israel.
translation:
  language: ro
  text: Iar el s-a ridicat, a luat copilul și pe mama lui și a intrat în țara Israelului.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Atunci
  rationale: Conjuncția marchează aici înaintarea narațiunii, fără un contrast puternic; „Atunci” redă firesc succesiunea.
- source_word: ἐγερθεὶς
  choice: s-a ridicat
  rationale: Participiul aorist pasiv are sens intranzitiv în context și indică acțiunea care o precedă pe cea principală.
- source_word: παρέλαβε
  choice: a luat
  rationale: Verbul înseamnă aici a lua pe cineva cu sine; formularea concisă este firească în narațiune.
- source_word: τὸ παιδίον
  choice: Copilul
  rationale: παιδίον desemnează simplu copilul; majuscula este folosită reverențial în referirea la Isus, fără a adăuga sens lexical.
- source_word: τὴν μητέρα αὐτοῦ
  choice: pe mama Lui
  rationale: Pronumele se referă cel mai natural la Copil; construcția românească păstrează clar această relație.
- source_word: εἰσῆλθεν
  choice: a intrat
  rationale: Redă direct și natural sensul de a intra într-un teritoriu.
- source_word: εἰς γῆν Ἰσραήλ
  choice: în țara lui Israel
  rationale: Construcția redă sensul geografic-național al expresiei grecești și este idiomatică în română.
