id: MAT.2.4
reference: Matthew 2:4
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: ro
  text: Și, adunându-i pe toți preoții cei mai de seamă și pe cărturarii poporului, îi întreba unde avea să Se nască Mesia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Cristosul”. Titlul grecesc Χριστός înseamnă „Unsul” și este redat aici prin „Mesia” pentru a păstra contextul mesianic iudaic.'
    reason: alternative_reading
lexical_decisions:
- source_word: συναγαγὼν
  choice: adunându-i
  rationale: Participiul aorist indică o acțiune asociată și logic anterioară întrebării; gerunziul românesc redă firesc construcția fără a pierde legătura strânsă dintre acțiuni.
- source_word: πάντας
  choice: pe toți
  rationale: Păstrează explicit caracterul cuprinzător al adjectivului grecesc.
- source_word: ἀρχιερεῖς
  choice: preoții cei mai de seamă
  rationale: În plural, termenul desemnează conducerea preoțească, nu mai mulți titulari simultani ai funcției unice de mare-preot.
- source_word: γραμματεῖς
  choice: cărturarii
  rationale: Este echivalentul românesc direct și consacrat pentru specialiștii în textele sacre și în Lege, fără a introduce în text o explicație interpretativă.
- source_word: τοῦ λαοῦ
  choice: poporului
  rationale: Redă direct genitivul și nu adaugă o precizare etnică absentă din formularea greacă.
- source_word: ἐπυνθάνετο
  choice: îi întreba
  rationale: Imperfectul românesc păstrează aspectul imperfectiv al verbului grec și exprimă o cercetare aflată în desfășurare.
- source_word: παρ’ αὐτῶν
  choice: îi
  rationale: În româna firească, relația exprimată prin prepoziția grecească este inclusă în construcția verbului „a întreba” cu obiect personal.
- source_word: ποῦ
  choice: unde
  rationale: Echivalentul direct al adverbului interogativ.
- source_word: ὁ χριστὸς
  choice: Mesia
  rationale: În contextul așteptării iudaice a conducătorului uns, Χριστός funcționează ca titlu și este redat prin echivalentul său mesianic, nu tratat ca nume propriu.
- source_word: γεννᾶται
  choice: avea să Se nască
  rationale: Construcția românească exprimă natural orientarea viitoare din întrebarea indirectă aflată într-un cadru narativ trecut, fără a elimina caracterul de așteptare profetică.
theological_decisions:
- issue: Redarea titlului Χριστός
  choice: Mesia
  alternative: Cristosul
  rationale: Contextul privește locul nașterii conducătorului uns așteptat pe baza profeției; „Mesia” face transparent acest sens titular și păstrează cadrul iudaic. Alternativa literală rămâne indicată în notă.
- issue: Orientarea temporală a lui γεννᾶται
  choice: avea să Se nască
  alternative: Se naște
  rationale: Prezentul grecesc apare într-o întrebare indirectă despre nașterea așteptată a lui Mesia. Formularea aleasă este idiomatică în română și păstrează perspectiva viitoare raportată la verbul trecut, fără a transforma enunțul într-o afirmație dogmatică suplimentară.
translation_notes:
  register: Română literară modernă, clară și demnă. Formularea evită atât arhaismele inutile, cât și parafraza explicativă. Majuscula din „Se” urmează uzul reverențial românesc pentru referirea la Mesia.
