  text: ἀκούσας δὲ ⸂ὁ βασιλεὺς Ἡρῴδης⸃ ἐταράχθη καὶ πᾶσα Ἱεροσόλυμα μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/003.yaml
  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: ro
  text: Când regele Irod a auzit aceasta, s-a tulburat și tot Ierusalimul[a] împreună cu el.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Tot Ierusalimul” folosește numele cetății pentru locuitorii ei; formularea poate fi generală sau hiperbolică, descriind alarma împărtășită în cetate.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: Când a auzit ... aceasta
  rationale: Participiul aorist are aici valoare temporală. Formularea românească explicită este firească, iar „aceasta” reia vestea adusă de magi din contextul imediat.
- source_word: δὲ
  choice: redat prin construcția temporală „Când”
  rationale: Particula marchează o tranziție ușoară; în română, funcția ei discursivă este exprimată adecvat odată cu transformarea participiului într-o propoziție temporală, fără o conjuncție separată.
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: regele Irod
  rationale: Păstrează atât titlul, cât și numele, într-o ordine naturală în româna modernă.
- source_word: ἐταράχθη
  choice: s-a tulburat
  rationale: Verbul exprimă tulburare lăuntrică, neliniște sau alarmare. „S-a tulburat” este natural și demn, fără să precizeze excesiv intensitatea.
- source_word: πᾶσα Ἱεροσόλυμα
  choice: tot Ierusalimul
  rationale: Păstrează metonimia greacă, în care numele cetății îi desemnează corporativ pe locuitorii ei, fără a introduce explicit „oamenii” în text.
- source_word: μετ’ αὐτοῦ
  choice: împreună cu el
  rationale: Redă clar asocierea dintre tulburarea lui Irod și cea a Ierusalimului.
theological_decisions:
- issue: Sfera expresiei πᾶσα Ἱεροσόλυμα
  choice: Referire corporativă și metonimică la Ierusalim și la locuitorii lui
  alternative: O generalizare sau hiperbolă pentru mulți locuitori; ori o referire mai restrânsă la cercurile conducătoare
  rationale: Greaca numește cetatea ca întreg. Traducerea păstrează această formulare și tensiunea narativă, fără a restrânge sensul la conducători și fără a transforma generalizarea într-o afirmație sociologică exactă.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Topica este firească, iar metonimia originalului este păstrată. Marcajul de notă este așezat după propoziția la care se referă.
