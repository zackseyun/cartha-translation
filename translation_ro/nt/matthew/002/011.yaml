id: MAT.2.11
reference: Matthew 2:11
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: ro
  text: 'După ce au intrat în casă, au văzut copilul împreună cu Maria, mama lui. Au căzut la pământ și i s-au închinat[a], apoi și-au deschis comorile și i-au oferit daruri: aur, tămâie și smirnă.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Verbul grec poate însemna „a adora” sau „a aduce omagiu” printr-un gest de profundă reverență, în funcție de context.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίαν
  choice: casă
  rationale: Redă direct locuința concretă indicată de substantivul grec, fără nuanțe suplimentare.
- source_word: παιδίον
  choice: copilul
  rationale: Este echivalentul firesc și suficient de precis; greaca nu cere o formulare mai specifică precum „băiețelul”.
- source_word: μετὰ Μαρίας τῆς μητρὸς αὐτοῦ
  choice: împreună cu Maria, mama lui
  rationale: Păstrează sensul lui μετά cu genitivul și apoziția care o identifică pe Maria drept mama copilului.
- source_word: πεσόντες
  choice: au căzut la pământ
  rationale: Păstrează imaginea corporală explicită a participiului, iar succesiunea firească din română arată că gestul precedă închinarea.
- source_word: προσεκύνησαν
  choice: i s-au închinat
  rationale: În română, expresia poate desemna atât venerarea religioasă, cât și plecăciunea profundă înaintea unei persoane de rang, păstrând amplitudinea semantică din context.
- source_word: θησαυροὺς
  choice: comorile
  rationale: Redare directă care nu precizează nejustificat că ar fi fost lăzi; termenul grec poate privi bunurile de preț ori recipientele lor.
- source_word: προσήνεγκαν
  choice: i-au oferit
  rationale: Exprimă natural prezentarea solemnă a darurilor, fără a introduce neapărat sensul cultic de jertfă.
- source_word: δῶρα
  choice: daruri
  rationale: Este echivalentul românesc clar și neîncărcat interpretativ.
- source_word: λίβανον
  choice: tămâie
  rationale: În uzul biblic românesc, „tămâie” denumește firesc rășina aromatică indicată aici, adică frankincense.
- source_word: σμύρναν
  choice: smirnă
  rationale: Termenul tradițional românesc este precis și ușor de recunoscut.
theological_decisions:
- issue: Forța verbului προσκυνέω în raport cu copilul Isus
  choice: i s-au închinat
  alternative: l-au adorat; i-au adus omagiu
  rationale: Formularea românească păstrează deschisă atât ideea unei reverențe profunde față de un rege, cât și pe cea a adorării religioase, fără să decidă mai mult decât permite contextul imediat. Nota explică explicit această amplitudine.
translation_notes:
  register: Română standard modernă, clară și demnă. Sintaxa a fost ușor segmentată pentru lizibilitate, păstrând succesiunea acțiunilor. Pronumele referitoare la copil sunt scrise cu literă mică, conform ortografiei curente și fără introducerea unei convenții confesionale absente din textul grec.
