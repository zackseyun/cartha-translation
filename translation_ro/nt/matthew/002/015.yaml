reference: Matthew 2:15
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: ro
  text: 'Și a fost acolo până la moartea lui Irod, ca să se împlinească ceea ce fusese spus de Domnul prin profet: „Din Egipt l-am chemat pe fiul Meu.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Matei citează Osea 11:1, unde „fiul” se referă inițial la Israel; aici, el prezintă ieșirea lui Isus din Egipt ca împlinire a acelui text.
    reason: cross_reference
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: a rămas acolo
  rationale: Deși expresia înseamnă literal „era acolo”, în contextul șederii până la moartea lui Irod, românescul „a rămas acolo” redă natural valoarea durativă a imperfectului fără a schimba sensul.
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: până la moartea lui Irod
  rationale: τελευτή desemnează aici sfârșitul vieții; construcția nominală este păstrată clar și firesc în română.
- source_word: ἵνα πληρωθῇ
  choice: ca să se împlinească
  rationale: Păstrează formula mateiană de împlinire și lasă deschisă nuanța de scop sau rezultat a lui ἵνα.
- source_word: τὸ ῥηθὲν
  choice: ceea ce fusese spus
  rationale: Participiul pasiv este redat idiomatic; mai-mult-ca-perfectul românesc arată că rostirea profetică precedă evenimentul relatat.
- source_word: ὑπὸ κυρίου
  choice: de Domnul
  rationale: Îl prezintă pe Domnul drept sursa ultimă a cuvântului, fără a adăuga „Dumnezeu”, absent din greacă.
- source_word: διὰ τοῦ προφήτου
  choice: prin profet
  rationale: 'Păstrează ideea de mijlocire: Domnul este sursa, iar profetul este instrumentul rostirii.'
- source_word: λέγοντος
  choice: ':'
  rationale: În româna actuală, două puncte introduc firesc citatul și evită construcția greoaie „spunând”, fără pierdere semantică.
- source_word: Ἐξ Αἰγύπτου
  choice: Din Egipt
  rationale: „Din” este echivalentul românesc firesc pentru ἐξ și poate exprima atât originea, cât și ieșirea dintr-un loc.
- source_word: ἐκάλεσα
  choice: l-am chemat
  rationale: καλέω indică aici chemarea fiului din Egipt; cliticul „l-” face explicit și natural în română obiectul anticipat.
- source_word: τὸν υἱόν μου
  choice: pe Fiul Meu
  rationale: „Fiul” păstrează sensul specific al lui υἱός și legătura filială esențială citatului. Majusculele urmează aplicarea citatului la Isus în contextul imediat, fără a modifica sensul lexical.
theological_decisions:
- issue: Formula împlinirii și citarea din Osea 11:1
  choice: Textul păstrează afirmația că evenimentul împlinește ceea ce Domnul spusese prin profet, iar nota explică referința inițială la Israel și aplicarea ei la Isus.
  alternative: A formula explicit fie o predicție directă exclusivă, fie o recapitulare tipologică exclusivă.
  rationale: Matei afirmă împlinirea, dar versetul nu definește în mod explicit mecanismul acesteia; traducerea nu trebuie să elimine tensiunea dintre contextul din Osea și aplicarea mateiană.
- issue: Redarea lui κύριος
  choice: Domnul
  alternative: DOMNUL
  rationale: Textul grec are κύριος; „Domnul” este redarea directă și nu introduce în corpul textului o reprezentare tipografică specială a tetragramei ebraice.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Sintaxa este fluentă, iar formula de împlinire rămâne apropiată de structura greacă. Citatul este introdus prin două puncte, conform uzului românesc actual.
