  source_fidelity: '„A rămas acolo” este o extindere contextuală plauzibilă, dar ἦν ἐκεῖ spune mai simplu „era/a fost acolo”. În plus, majuscula din „Fiul Meu” introduce în citatul propriu-zis o identificare interpretativă pe care formularea greacă citată nu o marchează tipografic. Restul redă fidel construcția: durata până la moartea lui Irod, formula pasivă a împlinirii, Domnul ca sursă și profetul ca mediator.'
  naturalness: „Și a fost acolo până la moartea lui Irod” este română standard, clară și suficient de firească în registru biblic. Introducerea citatului prin două puncte este idiomatică.
  terminology: „Domnul”, „profet”, „a se împlini”, „fiul” și „a chema” sunt alegeri potrivite. „Fiul Meu” trebuie scris cu minuscule în citat, pentru a păstra formularea neinterpretată; nota poate explica aplicarea mateiană la Isus.
