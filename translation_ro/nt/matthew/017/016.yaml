source:
  edition: SBLGNT
  text: καὶ προσήνεγκα αὐτὸν τοῖς μαθηταῖς σου, καὶ οὐκ ἠδυνήθησαν αὐτὸν θεραπεῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/016.yaml
  text: And I brought him to your disciples[a], and they were not able to heal him.
translation:
  language: ro
  text: Și l-am adus la ucenicii Tăi și ei n-au putut să-l vindece.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „nu au fost în stare să-l vindece”.'
    reason: Alternativă lexicală ce redă mai explicit ideea de capacitate din οὐκ ἠδυνήθησαν.
lexical_decisions:
- source_word: προσήνεγκα
  choice: l-am adus la
  rationale: În această construcție, προσφέρω înseamnă a aduce pe cineva la altcineva; formularea este directă și firească în româna actuală.
- source_word: μαθηταῖς σου
  choice: ucenicii Tăi
  rationale: În contextul Evangheliilor, μαθητής desemnează un ucenic, adică un adept și elev al unui învățător. Majuscula reverențială pentru pronumele referitor la Isus corespunde registrului biblic românesc.
- source_word: οὐκ ἠδυνήθησαν
  choice: n-au putut
  rationale: Redă limpede incapacitatea exprimată de δύναμαι și este mai natural în română decât construcția mai formală „nu au fost în stare”.
- source_word: θεραπεῦσαι
  choice: să-l vindece
  rationale: θεραπεύω se referă aici la vindecarea băiatului suferind; „a vindeca” este echivalentul firesc în relatările evanghelice.
- source_word: καὶ ... καὶ
  choice: Și ... iar
  rationale: Primul καί continuă relatarea prin „Și”; al doilea este redat prin „iar”, o coordonare naturală în română care marchează trecerea la rezultatul nereușit fără a introduce o opoziție puternică precum „dar”.
- source_word: αὐτόν
  choice: l-
  rationale: Pronumele masculin îl indică pe fiul/băiatul menționat în context și este redat neechivoc prin pronumele clitic românesc.
theological_decisions:
- issue: Natura nereușitei ucenicilor
  choice: Versetul afirmă numai că ucenicii nu au putut să-l vindece.
  alternative: Explicitarea nereușitei drept incapacitate de a scoate demonul sau atribuirea ei necredinței.
  rationale: Textul acestui verset nu precizează cauza și nici nu înlocuiește vindecarea cu o explicație despre exorcizare; asemenea detalii nu trebuie importate din context în formularea versetului.
translation_notes:
  register: Română standard modernă, clară și demnă. Formele contractate „l-am”, „n-au” și „să-l” sunt firești în registrul literar actual; „iar” păstrează coordonarea greacă într-o exprimare românească fluentă.
