  text: ὁ ⸀δὲ ἀποκριθεὶς ⸀εἶπεν· Ἠλίας μὲν ⸀ἔρχεται καὶ ἀποκαταστήσει πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/011.yaml
  text: He answered[a], “Elijah indeed is coming and will restore all things.”
translation:
  language: ro
  text: 'El a răspuns: „Într-adevăr, Ilie vine[a] și va restabili toate lucrurile.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „urmează să vină”. Verbul grecesc este la prezent, dar are aici un sens orientat spre viitor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: El le-a răspuns
  rationale: Construcția cu participiu și verb finit este redată firesc în română printr-un singur verb, păstrând caracterul de răspuns fără redundanța „a răspuns și a zis”. Pronumele indirect „le” explicitează natural destinatarii deja prezenți în context.
- source_word: Ἠλίας
  choice: Ilie
  rationale: Se folosește forma tradițională și standard în limba română pentru acest nume biblic.
- source_word: μέν
  choice: Într-adevăr
  rationale: Redă accentul și pregătește contrastul care urmează în versetul următor, fără formula rigidă „pe de o parte”.
- source_word: ἔρχεται
  choice: vine
  rationale: Prezentul românesc păstrează forma vie a prezentului grecesc și poate avea aici, în mod firesc, orientare spre viitor.
- source_word: ἀποκαταστήσει
  choice: va restabili
  rationale: Redă direct viitorul activ și ideea readucerii la starea cuvenită, fără a preciza în ce constă restaurarea.
- source_word: πάντα
  choice: toate lucrurile
  rationale: Păstrează caracterul neutru, larg și cuprinzător al expresiei grecești, fără să introducă obiecte sau persoane care nu sunt precizate.
theological_decisions:
- issue: Natura și amploarea lucrării de restabilire a lui Ilie
  choice: va restabili toate lucrurile
  alternative: va pune totul în ordine
  rationale: Textul afirmă o restabilire cuprinzătoare, dar nu îi definește natura exactă în acest verset. Formularea aleasă păstrează amploarea și tensiunea teologică fără a o restrânge la o anumită schemă interpretativă.
translation_notes:
  register: Română standard modernă, într-un registru demn și ușor de înțeles. Formularea păstrează concizia textului grec și evită atât arhaismele, cât și explicarea interpretativă excesivă.
