  text: Καὶ ⸀ἐλθόντων πρὸς τὸν ὄχλον προσῆλθεν αὐτῷ ἄνθρωπος γονυπετῶν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/014.yaml
  text: And when they came to the crowd[a], a man came up to him, kneeling before him[b],
translation:
  language: ro
  text: Și, când au ajuns la mulțime, un om s-a apropiat de el[a], îngenunchind înaintea lui[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „a venit la el”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „căzând în genunchi înaintea lui”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Și
  rationale: Păstrează legătura narativă simplă cu episodul precedent, fără a adăuga o nuanță interpretativă.
- source_word: ἐλθόντων
  choice: când au ajuns
  rationale: Participiul aorist la genitiv plural formează o construcție temporală absolută, al cărei subiect este subînțeles din context; formularea este firească în româna actuală.
- source_word: πρὸς τὸν ὄχλον
  choice: la mulțime
  rationale: ὄχλος desemnează aici grupul numeros de oameni; „mulțime” este termenul românesc firesc și demn în acest context narativ.
- source_word: προσῆλθεν αὐτῷ
  choice: s-a apropiat de el
  rationale: Redă direct mișcarea către Isus exprimată de προσέρχομαι și relația marcată de dativ.
- source_word: ἄνθρωπος
  choice: un om
  rationale: În context este vorba despre un anumit bărbat adult; „un om” este formularea narativă românească naturală și fidelă.
- source_word: γονυπετῶν αὐτόν
  choice: îngenunchind înaintea lui
  rationale: Participiul descrie gestul făcut în raport cu Isus. Formularea păstrează atât acțiunea corporală, cât și orientarea ei, fără a preciza mai mult decât spune textul.
theological_decisions:
- issue: Semnificația gestului exprimat prin γονυπετῶν
  choice: îngenunchind înaintea lui
  alternative: căzând în genunchi înaintea lui
  rationale: Gestul poate exprima rugăminte insistentă sau respect; traducerea păstrează gestul vizibil fără a-l defini explicit drept închinare cultică.
- issue: Redarea lui ἄνθρωπος ca referire individuală
  choice: un om
  alternative: o persoană
  rationale: Substantivul îl indică aici pe un individ de sex masculin, iar redarea aleasă este precisă contextual și nu introduce afirmații antropologice generale.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Ordinea propoziției urmărește îndeaproape textul grec, dar punctuația și construcția temporală sunt adaptate uzului românesc firesc. Virgula finală păstrează continuitatea sintactică spre versetul următor.
