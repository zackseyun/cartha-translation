  text: ⸂εἰπόντος δέ⸃· Ἀπὸ τῶν ἀλλοτρίων, ἔφη αὐτῷ ὁ Ἰησοῦς· Ἄρα γε ἐλεύθεροί εἰσιν οἱ υἱοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/026.yaml
  text: When he said[a], “From strangers,” Jesus said to him[c][b], “Then the sons are free.”
translation:
  language: ro
  text: 'Când a spus: „De la cei străini”[a], Isus i-a zis: „Așadar, fiii sunt liberi”[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „de la cei din afara casei”. Termenul grecesc îi pune în contrast pe cei care nu aparțin casei conducătorului cu propriii lui fii.
    reason: lexical_alternative
  - marker: b
    text: Sau „fiii sunt scutiți”. Greaca spune mai literal „fiii sunt liberi”, ceea ce în acest context implică scutirea de taxă.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντος δέ
  choice: Când el a răspuns
  rationale: Genitivul absolut are aici valoare temporală, iar în context Petru răspunde întrebării anterioare. „Când el a răspuns” este firesc în română și face explicită funcția replicii fără a-i adăuga conținut.
- source_word: ἀπὸ τῶν ἀλλοτρίων
  choice: De la cei străini
  rationale: ἀλλότριοι îi desemnează pe cei care nu aparțin casei conducătorului, în opoziție cu propriii lui fii. „Cei străini” păstrează contrastul relațional și evită sensul predominant etnic sau național al lui „străinii” în unele contexte.
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Isus i-a zis
  rationale: Redare narativă românească directă și demnă pentru φημί cu dativul persoanei.
- source_word: Ἄρα γε
  choice: Așadar
  rationale: Marchează limpede concluzia dedusă de Isus din răspunsul lui Petru, fără a încărca formularea.
- source_word: ἐλεύθεροί
  choice: liberi
  rationale: Păstrează sensul lexical mai larg al adjectivului, în timp ce în context libertatea implică scutirea de taxă.
- source_word: οἱ υἱοί
  choice: fiii
  rationale: Redă exact masculinul plural și păstrează contrastul juridic și familial dintre fiii conducătorului și cei din afara casei sale.
theological_decisions:
- issue: Redarea afirmației despre libertatea fiilor în contextul taxei
  choice: fiii sunt liberi
  alternative: fiii sunt scutiți
  rationale: Textul grec afirmă literal că fiii sunt „liberi”; scutirea de taxă este implicația contextuală. Formularea aleasă păstrează atât concluzia imediată, cât și rezonanța mai largă a statutului de fiu.
- issue: Redarea lui οἱ υἱοί
  choice: fiii
  alternative: copiii
  rationale: Greaca spune explicit „fiii”, iar analogia imediată privește relația fiilor unui rege cu obligațiile fiscale. Redarea nu extinde și nu neutralizează formularea sursei.
translation_notes:
  register: Română standard modernă, cu registru narativ clar și demn. Formularea păstrează concizia și raționamentul textului grec, precum și ambiguitatea productivă dintre libertate și scutirea fiscală.
