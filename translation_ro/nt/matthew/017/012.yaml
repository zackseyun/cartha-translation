id: MAT.17.12
reference: Matthew 17:12
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι Ἠλίας ἤδη ἦλθεν, καὶ οὐκ ἐπέγνωσαν αὐτὸν ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν· οὕτως καὶ ὁ υἱὸς τοῦ ἀνθρώπου μέλλει πάσχειν ὑπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/012.yaml
  text: But I tell you that Elijah has already come[a], and they did not recognize him, but did to him whatever they wanted[c][b]. So also the Son of Man is about to suffer at their hands.
translation:
  language: ro
  text: Dar Eu vă spun că Ilie a venit deja și ei nu l-au recunoscut[a], ci au făcut cu el tot ce au vrut[b]. Tot așa și Fiul Omului urmează să sufere din partea lor[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „nu l-au cunoscut” ori „nu l-au recunoscut ca atare”. Verbul grecesc poate desemna nerecunoașterea sau neidentificarea corectă a cuiva.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „i-au făcut tot ce au vrut” ori „s-au purtat cu el cum au vrut”. Expresia grecească arată că au acționat față de el după bunul lor plac.'
    reason: lexical_alternative
  - marker: c
    text: 'Sau: „are să sufere din cauza lor”. Greaca prezintă suferința ca fiind pe punctul de a avea loc și îi indică pe ei drept agenți.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Dar Eu vă spun
  rationale: Redă firesc introducerea directă, iar „Dar” păstrează contrastul marcat de δέ.
- source_word: Ἠλίας ἤδη ἦλθεν
  choice: Ilie a venit deja
  rationale: Numele urmează forma românească consacrată, iar perfectul compus împreună cu „deja” exprimă o venire încheiată și relevantă în context.
- source_word: οὐκ ἐπέγνωσαν αὐτόν
  choice: ei nu l-au recunoscut
  rationale: În context, ἐπιγινώσκω indică neidentificarea lui corectă ori nerecunoașterea rolului său, nu simpla lipsă de cunoaștere.
- source_word: ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν
  choice: au făcut cu el tot ce au vrut
  rationale: Formula idiomatică românească păstrează ideea unei purtări neîngrădite față de el, fără a explicita mai mult decât spune greaca.
- source_word: οὕτως καὶ
  choice: Tot așa și
  rationale: Păstrează limpede analogia dintre ceea ce i s-a întâmplat lui Ilie și suferința Fiului Omului.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Este redarea românească consacrată a expresiei titulare și îi păstrează rezonanțele biblice.
- source_word: μέλλει πάσχειν
  choice: urmează să sufere
  rationale: Exprimă suferința viitoare și iminentă fără a introduce în această propoziție o idee mai puternică de predestinare.
- source_word: ὑπ’ αὐτῶν
  choice: din partea lor
  rationale: Redă agenția ostilă indicată de ὑπό cu genitiv într-o formulare românească naturală.
theological_decisions:
- issue: Identificarea venirii lui Ilie
  choice: Textul păstrează numele „Ilie” fără să introducă explicit identificarea cu Ioan Botezătorul.
  alternative: O parafrază ar putea spune direct „Ioan Botezătorul”, pe baza contextului imediat.
  rationale: Versetul însuși îl numește pe Ilie; identificarea este lăsată contextului, evitând introducerea interpretării în text.
- issue: Forța lui μέλλει în raport cu suferința Fiului Omului
  choice: „urmează să sufere”
  alternative: „este sortit să sufere” sau „are să sufere”
  rationale: Greaca indică o suferință viitoare, apropiată, dar aici nu formulează explicit necesitatea sau predestinarea ei.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formularea evită atât literalismul nefiresc, cât și parafraza interpretativă; pronumele „Eu” este scris cu majusculă conform uzului biblic românesc, fără a-i adăuga accent care nu este cerut de sintaxa greacă.
