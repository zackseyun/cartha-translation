id: MAT.17.10
reference: Matthew 17:10
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν οἱ ⸀μαθηταὶ λέγοντες· Τί οὖν οἱ γραμματεῖς λέγουσιν ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/010.yaml
  text: And the disciples asked him, saying, “Why then do the scribes say that Elijah must come first?”
translation:
  language: ro
  text: 'Și ucenicii l-au întrebat: „De ce spun atunci cărturarii că Ilie trebuie să vină mai întâi?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: l-au întrebat
  rationale: Aoristul indicativ introduce o întrebare directă; formularea este firească în româna actuală și redă corect obiectul pronominal αὐτόν.
- source_word: μαθηταὶ
  choice: ucenicii
  rationale: Articolul indică grupul deja cunoscut din context. Nu se adaugă „lui”, deoarece textul grec nu conține aici un posesiv.
- source_word: λέγοντες
  choice: —
  rationale: Participiul care introduce conținutul întrebării este redat implicit prin punctuație, evitând formula greoaie „spunând”; sensul rămâne integral în româna idiomatică.
- source_word: Τί οὖν
  choice: De ce ... atunci
  rationale: În construcția τί ... λέγουσιν ὅτι, τί cere motivul afirmației, iar οὖν leagă întrebarea de contextul anterior. Ordinea aleasă este naturală în română.
- source_word: γραμματεῖς
  choice: cărturarii
  rationale: Este echivalentul tradițional și precis pentru specialiștii iudei în Scriptură și Lege, fără parafrază explicativă.
- source_word: λέγουσιν ὅτι
  choice: spun ... că
  rationale: Redă direct prezentul și propoziția completivă introdusă de ὅτι.
- source_word: Ἠλίαν
  choice: Ilie
  rationale: Se folosește forma consacrată în limba română a numelui profetului.
- source_word: δεῖ ἐλθεῖν
  choice: trebuie să vină
  rationale: Păstrează clar și concis ideea de necesitate exprimată de δεῖ.
- source_word: πρῶτον
  choice: mai întâi
  rationale: Redă ordinea temporală implicată de adverb și este formula idiomatică în română.
theological_decisions:
- issue: Forța interpretativă a întrebării ucenicilor despre venirea lui Ilie
  choice: Întrebarea este redată fără a preciza dacă învățătura cărturarilor este afirmată, contestată sau corectată parțial.
  alternative: O traducere mai interpretativă ar putea sugera scepticism față de cărturari ori ar putea introduce explicit contextul din Maleahi.
  rationale: Versetul consemnează întrebarea ucenicilor; răspunsul și clarificarea urmează în Matei 17:11–13. Traducerea păstrează tensiunea teologică a textului.
translation_notes:
  register: Română standard modernă, clară și demnă. S-a preferat o construcție directă și idiomatică; participiul λέγοντες nu este calchiat prin „spunând”, deoarece în română ar încărca inutil formularea.
