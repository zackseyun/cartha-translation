  text: καὶ ἰδοὺ ⸀ὤφθη αὐτοῖς Μωϋσῆς καὶ Ἠλίας ⸂συλλαλοῦντες μετ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/003.yaml
  text: And behold[a], Moses and Elijah appeared to them, talking with him.
translation:
  language: ro
  text: Și iată, li s-au arătat Moise și Ilie, vorbind cu el.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: iată
  rationale: Redă firesc în româna actuală particula care atrage atenția și păstrează caracterul brusc și viu al scenei.
- source_word: ὤφθη αὐτοῖς
  choice: li s-au arătat
  rationale: Construcția românească redă idiomatic aoristul pasiv al lui ὁράω împreună cu dativul martorilor, fără a exclude nuanța formală „au fost văzuți de ei”.
- source_word: Μωϋσῆς καὶ Ἠλίας
  choice: Moise și Ilie
  rationale: Sunt formele consacrate ale numelor în limba română.
- source_word: συλλαλοῦντες
  choice: vorbind
  rationale: Redă participiul care descrie o vorbire reciprocă; în context, asocierea prin „cu el” face limpede caracterul conversației.
- source_word: μετ’ αὐτοῦ
  choice: cu el
  rationale: Redă direct asocierea exprimată prin μετά cu genitivul și păstrează pronumele din greacă.
theological_decisions:
- issue: Referentul pronumelui αὐτοῦ
  choice: „el” se referă la Isus
  alternative: Înlocuirea pronumelui cu numele „Isus”
  rationale: Contextul imediat îl identifică limpede pe Isus, iar păstrarea pronumelui urmează forma textului grec fără să introducă o explicitare inutilă.
- issue: Natura apariției lui Moise și Ilie
  choice: Textul afirmă că Moise și Ilie li s-au arătat ucenicilor
  alternative: „Moise și Ilie au fost văzuți de ei”
  rationale: Formularea păstrează afirmația despre manifestarea lor vizibilă, fără să precizeze doctrinar modul prezenței lor.
translation_notes:
  register: Română standard modernă, clară și demnă. „Iată” păstrează intensitatea narativă, iar „li s-au arătat” este idiomatic și fidel construcției grecești.
