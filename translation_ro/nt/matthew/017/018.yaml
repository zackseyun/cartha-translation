id: MAT.17.18
reference: Matthew 17:18
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς, καὶ ἐξῆλθεν ἀπ’ αὐτοῦ τὸ δαιμόνιον· καὶ ἐθεραπεύθη ὁ παῖς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/018.yaml
  text: And Jesus rebuked it[a], and the demon came out of him; and the boy was healed from that hour.
translation:
  language: ro
  text: Isus l-a mustrat[a], iar demonul a ieșit din el; și băiatul a fost vindecat din clipa aceea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pronumele poate face referire fie la demon, fie la băiat; contextul favorizează demonul.
    reason: referential_ambiguity
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: l-a mustrat
  rationale: „A mustra” redă forța verbului ἐπιτιμάω și caracterul autoritar al adresării lui Isus, fără a-l restrânge la sensul de „a porunci”.
- source_word: αὐτῷ
  choice: l-a
  rationale: Pronumele clitic masculin păstrează în română ambiguitatea formală dintre băiat și demon; contextul imediat favorizează demonul ca destinatar al mustrării.
- source_word: τὸ δαιμόνιον
  choice: demonul
  rationale: Este echivalentul direct și curent al lui δαιμόνιον; „duhul necurat” ar introduce o formulare absentă din verset.
- source_word: ἐξῆλθεν ἀπ’ αὐτοῦ
  choice: a ieșit din el
  rationale: Redare directă și firească a expresiei de exorcizare, păstrând imaginea concretă a ieșirii.
- source_word: ἐθεραπεύθη
  choice: a fost vindecat
  rationale: Pasivul redă limpede vindecarea ca rezultat, fără a o limita la o explicație strict medicală.
- source_word: ὁ παῖς
  choice: băiatul
  rationale: În context este vorba despre fiul acelui tată; „băiatul” este mai precis decât „copilul”, iar sensul posibil de „slujitor” nu se potrivește aici.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: chiar din clipa aceea
  rationale: Expresia indică începutul imediat și durabil al vindecării. În româna actuală, „din clipa aceea” este mai firesc decât calcarea literală „din ceasul acela”, iar „chiar” scoate în evidență caracterul imediat.
theological_decisions:
- issue: Referentul pronumelui αὐτῷ în mustrarea lui Isus
  choice: Textul păstrează pronumele ambiguu, iar nota arată că demonul este referentul cel mai probabil.
  alternative: Isus l-ar fi mustrat pe băiat.
  rationale: Forma grecească poate trimite gramatical fie la demon, fie la băiat, însă propoziția următoare—demonul a ieșit din el—indică mai natural că mustrarea i-a fost adresată demonului. Ambiguitatea autentică este păstrată, nu eliminată din text.
translation_notes:
  register: Română standard modernă, clară și demnă. Coordonarea cu „iar” evită repetarea greoaie a lui „și”, fără a schimba succesiunea evenimentelor. Formularea „chiar din clipa aceea” exprimă idiomatic valoarea temporală a originalului.
