  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τότε συνῆκαν οἱ μαθηταὶ ὅτι περὶ Ἰωάννου τοῦ βαπτιστοῦ εἶπεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/013.yaml
  text: Then the disciples understood that he had spoken to them about John the Baptist[a].
translation:
  language: ro
  text: Atunci ucenicii au înțeles că le vorbise despre Ioan Botezătorul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Ioan cel care boteza”.'
    reason: Alternativă lexicală ce scoate în evidență sensul activ al lui βαπτιστής.
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Redă firesc adverbul temporal care marchează momentul în care ucenicii ajung la înțelegere.
- source_word: συνῆκαν
  choice: au înțeles
  rationale: Aoristul lui συνίημι indică ajungerea la înțelegerea sensului; formularea este clară și naturală în româna actuală.
- source_word: οἱ μαθηταὶ
  choice: ucenicii
  rationale: Echivalentul consacrat și inteligibil pentru μαθηταί în narațiunea evanghelică.
- source_word: ὅτι
  choice: că
  rationale: Introduce conținutul celor înțelese, nu o propoziție cauzală.
- source_word: περὶ
  choice: despre
  rationale: Cu genitivul, περί indică aici persoana la care se referea vorbirea.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Ioan Botezătorul
  rationale: Titlul românesc consacrat pentru Ioan și un echivalent adecvat al substantivului βαπτιστής; alternativa „Ioan cel care boteza” face mai explicit rolul activ.
- source_word: εἶπεν αὐτοῖς
  choice: le vorbise
  rationale: Mai-mult-ca-perfectul românesc exprimă natural faptul că vorbirea a precedat momentul înțelegerii; „a vorbi despre” redă idiomatic construcția εἶπεν ... περὶ.
theological_decisions:
- issue: Identificarea figurii lui Ilie în contextul imediat
  choice: Versetul spune explicit că ucenicii au înțeles că Isus se referea la Ioan Botezătorul.
  alternative: O formulare care ar explica în ce sens Ioan este asociat cu Ilie.
  rationale: Identificarea narativă trebuie redată clar, fără a adăuga o explicație teologică absentă din verset.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Ucenicii” și „Ioan Botezătorul” păstrează terminologia biblică românească bine cunoscută, iar sintaxa rămâne firească pentru cititorul contemporan.
