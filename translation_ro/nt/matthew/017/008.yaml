  text: ἐπάραντες δὲ τοὺς ὀφθαλμοὺς αὐτῶν οὐδένα εἶδον εἰ μὴ ⸀αὐτὸν Ἰησοῦν μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/008.yaml
  text: And lifting up their eyes[a], they saw no one except Jesus alone.
translation:
  language: ro
  text: Iar când și-au ridicat ochii, n-au văzut pe nimeni decât pe Isus singur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greaca accentuează puternic exclusivitatea, folosind atât pronumele emfatic („el însuși”), cât și „singur”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάραντες
  choice: când și-au ridicat
  rationale: Participiul aorist exprimă aici acțiunea anterioară verbului principal; construcția temporală este firească în româna actuală.
- source_word: δὲ
  choice: Iar
  rationale: Redă legătura narativă ușoară, fără a introduce un contrast mai puternic decât cere contextul.
- source_word: τοὺς ὀφθαλμοὺς αὐτῶν
  choice: ochii
  rationale: Păstrează exprimarea concretă a grecei; posesivul este exprimat deja prin forma reflexivă «și-au».
- source_word: οὐδένα εἶδον
  choice: n-au văzut pe nimeni
  rationale: Redare directă și idiomatică în română a negației și a verbului simplu de vedere.
- source_word: εἰ μὴ
  choice: decât
  rationale: După negație, «decât» exprimă natural sensul exceptiv al construcției.
- source_word: αὐτὸν Ἰησοῦν μόνον
  choice: pe Isus singur
  rationale: «Singur» păstrează exclusivitatea accentuată și poziția finală a lui μόνον; pronumele αὐτόν este absorbit firesc de construcția românească, iar cumularea emfatică este explicată în notă.
theological_decisions:
- issue: Isus este singura persoană rămasă vizibilă după vedenie
  choice: decât pe Isus singur
  alternative: decât numai pe Isus; decât pe Isus însuși, singur
  rationale: Formularea păstrează accentul narativ asupra exclusivității fără a adăuga o interpretare doctrinară. Varianta cu «însuși, singur» ar reproduce mai mecanic cumularea grecească, dar ar suna greoi și posibil ambiguu în română.
translation_notes:
  register: Română standard modernă, clară și demnă. «Iar» continuă natural relatarea, iar «și-au ridicat ochii» păstrează imaginea concretă a textului-sursă.
