id: MAT.17.27
reference: Matthew 17:27
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς, πορευθεὶς ⸀εἰς θάλασσαν βάλε ἄγκιστρον καὶ τὸν ⸀ἀναβάντα πρῶτον ἰχθὺν ἆρον, καὶ ἀνοίξας τὸ στόμα αὐτοῦ εὑρήσεις στατῆρα· ἐκεῖνον λαβὼν δὸς αὐτοῖς ἀντὶ ἐμοῦ καὶ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/027.yaml
  text: But so that we may not offend them[a], go to the sea, cast in a hook, and take the first fish that comes up. And when you open its mouth, you will find a stater[b]. Take that and give it to them for me and for yourself.
translation:
  language: ro
  text: Dar, ca să nu-i ofensăm[a], du-te la mare, aruncă un cârlig de pescuit și scoate primul pește care iese. Deschizându-i gura, vei găsi un stater[b]. Ia-l și dă-li-l pentru Mine și pentru tine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „ca să nu-i facem să se poticnească” sau „ca să nu le dăm prilej de poticnire”.'
    reason: lexical_alternative
  - marker: b
    text: Staterul era o monedă valorând aproximativ patru drahme, suficientă pentru plata taxei pentru templu pentru două persoane.
    reason: cultural_note
lexical_decisions:
- source_word: σκανδαλίσωμεν
  choice: să nu le dăm prilej de poticnire
  rationale: Păstrează imaginea și ambiguitatea verbului grec, indicând totodată evitarea unei ofense inutile în contextul taxei pentru templu.
- source_word: θάλασσαν
  choice: mare
  rationale: Redă termenul grec, conform denumirii tradiționale și biblice a Mării Galileii, fără a-l înlocui cu explicația geografică „lac”.
- source_word: ἄγκιστρον
  choice: undița
  rationale: În româna curentă, „a arunca undița” exprimă natural pescuitul cu cârlig; termenul este mai idiomatic aici decât „cârligul” luat izolat.
- source_word: τὸν ἀναβάντα πρῶτον ἰχθὺν ἆρον
  choice: scoate primul pește care se prinde
  rationale: 'Redă în mod firesc succesiunea acțiunii: primul pește prins este scos din apă, evitând formularea rigidă „care urcă”.'
- source_word: στατῆρα
  choice: un stater
  rationale: Păstrează denumirea precisă a monedei grecești, iar valoarea ei este explicată în nota de subsol.
- source_word: ἀντὶ ἐμοῦ καὶ σοῦ
  choice: pentru Mine și pentru tine
  rationale: Redă natural faptul că moneda acoperă plata pentru amândoi, fără a forța sensul „în locul” într-un mod nefiresc în română.
- source_word: πορευθεὶς
  choice: du-te
  rationale: Participiul circumstanțial introduce acțiunea premergătoare și capătă firesc valoare imperativă în română.
- source_word: δὸς αὐτοῖς
  choice: dă-li-l
  rationale: Pronumele reia explicit staterul și păstrează verbul general „a da”; sensul de plată rezultă din context.
theological_decisions:
- issue: Sensul lui σκανδαλίζω în raport cu plata taxei pentru templu
  choice: Isus cere plata pentru a nu le da colectorilor prilej de poticnire sau ofensă, fără a anula afirmația anterioară despre libertatea fiilor.
  alternative: Isus recunoaște prin plată o obligație absolută; ori plata are numai rolul de a demonstra o minune.
  rationale: Contextul imediat afirmă libertatea fiilor, iar ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς introduce o concesie practică. Formularea păstrează această tensiune fără a impune o concluzie doctrinară suplimentară.
translation_notes:
  register: Română standard modernă, clară și demnă. Majuscula reverențială din „Mine” marchează referirea la Isus. Notele au fost ordonate după locul corect al markerilor în text, corectând inversarea evidentă din stratul englezesc de consultare.
