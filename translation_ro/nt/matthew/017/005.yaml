  terminology: „Fiul meu iubit”, „nor luminos”, „glas” și „Ascultați-l” sunt alegeri exacte și naturale. „Ascultați-l” păstrează în mod util deschisă gama dintre ascultare atentă și luare în seamă, fără a introduce explicit interpretarea mai puternică „ascultați de el”. Notele sunt ancorate corect și corespund locurilor relevante din text.
