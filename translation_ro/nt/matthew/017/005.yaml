id: MAT.17.5
reference: Matthew 17:5
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἔτι αὐτοῦ λαλοῦντος ἰδοὺ νεφέλη φωτεινὴ ἐπεσκίασεν αὐτούς, καὶ ἰδοὺ φωνὴ ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα· ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/005.yaml
  text: While he was still speaking[a], behold, a bright cloud overshadowed them, and behold, a voice from the cloud said, “This is my beloved Son, with whom I am well pleased[c][b]; listen to him.”
translation:
  language: ro
  text: 'Pe când încă vorbea, iată, un nor luminos i-a umbrit[c]; și iată[b], un glas din nor a spus: „Acesta este Fiul meu iubit, în care mi-am găsit plăcerea. Ascultați-l[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Verbul grec poate însemna aici nu doar a auzi, ci și a lua aminte și a da ascultare.
    reason: lexical_alternative
  - marker: b
    text: Repetarea lui „iată” redă grecescul ἰδού, un marcator care atrage atenția și sporește intensitatea dramatică a scenei.
    reason: lexical_alternative
  - marker: c
    text: „I-a umbrit” poate evoca limbajul biblic al teofaniei, asociat cu manifestarea prezenței lui Dumnezeu.
    reason: cross_reference
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Pe când încă vorbea
  rationale: Redă construcția absolută la genitiv ca acțiune simultană și păstrează prin „încă” ideea întreruperii vorbirii lui Petru.
- source_word: ἰδοὺ
  choice: iată
  rationale: Păstrează de ambele ori marcatorul discursiv care atrage atenția și intensifică scena, într-o formă firească și demnă în română.
- source_word: νεφέλη φωτεινὴ
  choice: un nor luminos
  rationale: Redare directă a expresiei grecești, fără a explicita simbolismul teologic al norului.
- source_word: ἐπεσκίασεν
  choice: i-a umbrit
  rationale: Păstrează imaginea umbrei și posibilul ecou al limbajului teofanic; pronumele redă obiectul plural αὐτούς.
- source_word: φωνὴ ἐκ τῆς νεφέλης λέγουσα
  choice: un glas din nor a spus
  rationale: Transformă participiul într-un verb finit, conform uzului românesc natural, și păstrează proveniența glasului.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: Fiul meu iubit
  rationale: Redă atât relația filială, cât și calificativul ἀγαπητός într-un limbaj actual, sobru și clar.
- source_word: ἐν ᾧ εὐδόκησα
  choice: în care mi-am găsit plăcerea
  rationale: Păstrează prepoziția și aspectul retrospectiv al aoristului, precum și formularea solemnă a declarației divine.
- source_word: ἀκούετε αὐτοῦ
  choice: Ascultați-l
  rationale: În română, imperativul poate cuprinde atât auzirea atentă, cât și luarea în seamă, fără a restrânge sensul la simpla percepție auditivă ori a-l extinde explicit la „ascultați de el”.
theological_decisions:
- issue: Declarația divină despre identitatea lui Isus
  choice: Acesta este Fiul meu iubit, în care mi-am găsit plăcerea
  alternative: Acesta este Fiul meu, Cel iubit, în care îmi găsesc plăcerea
  rationale: Formularea păstrează identificarea directă a lui Isus ca Fiu, afecțiunea sau alegerea exprimată de ἀγαπητός și tensiunea temporală a aoristului, fără adaos de terminologie doctrinară ulterioară.
- issue: Forța imperativului ἀκούετε αὐτοῦ
  choice: Ascultați-l
  alternative: Ascultați de el
  rationale: Alegerea lasă deschisă gama semantică dintre ascultarea atentă și urmarea celor spuse; alternativa ar accentua mai explicit supunerea.
translation_notes:
  register: Română standard modernă, cu registru narativ solemn, dar accesibil. S-a păstrat repetarea lui „iată” și formularea „în care mi-am găsit plăcerea” pentru a conserva relieful și tensiunea textului grec. Pronumele referitoare la Dumnezeu sunt scrise cu literă mică, potrivit normelor ortografice curente și fără a transforma o convenție devoțională într-o cerință textuală.
