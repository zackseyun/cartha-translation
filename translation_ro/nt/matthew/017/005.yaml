  source_fidelity: 'Textul redă fidel toate elementele esențiale ale grecei: construcția temporală cu ἔτι, dubla ocurență a lui ἰδού, „nor luminos”, acțiunea de umbrire asupra celor prezenți, glasul din nor, declarația despre Fiul iubit și imperativul final. „În care mi-am găsit plăcerea” păstrează în mod legitim aoristul εὐδόκησα, fără a elimina nuanța formulării solemne.'
