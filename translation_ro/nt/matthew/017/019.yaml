source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ κατ’ ἰδίαν εἶπον· Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/019.yaml
  text: Then the disciples came to Jesus privately and said[a], “Why were we not able to cast it out?”
translation:
  language: ro
  text: 'Atunci, ucenicii au venit la Isus în particular și au zis: „De ce n-am putut noi să-l alungăm[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pronumele se referă probabil la demon, dar poate fi înțeles și ca referindu-se la băiat.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Redă firesc marcatorul temporal care introduce următorul moment al narațiunii.
- source_word: προσελθόντες
  choice: s-au apropiat
  rationale: Participiul aorist este redat printr-un verb coordonat, într-o formulare naturală în română.
- source_word: οἱ μαθηταὶ
  choice: ucenicii
  rationale: Este termenul consacrat și actual pentru discipolii lui Isus în contextul evanghelic.
- source_word: τῷ Ἰησοῦ
  choice: de Isus
  rationale: Completează firesc verbul românesc „s-au apropiat de”; numele urmează forma românească standard.
- source_word: κατ’ ἰδίαν
  choice: deoparte
  rationale: Exprimă idiomatic faptul că discuția a avut loc separat, în particular.
- source_word: εἶπον
  choice: au zis
  rationale: Redă direct verbul λέγω, fără a-l transforma interpretativ în „au întrebat”, deși urmează o întrebare.
- source_word: Διὰ τί
  choice: De ce
  rationale: Echivalentul românesc firesc al întrebării privitoare la cauză.
- source_word: ἡμεῖς
  choice: noi
  rationale: Pronumele explicit este păstrat în poziție postverbală pentru a reda accentul discret al grecei fără o formulare rigidă.
- source_word: οὐκ ἠδυνήθημεν
  choice: n-am putut
  rationale: Formulare românească naturală și exactă pentru incapacitatea exprimată de δύναμαι.
- source_word: ἐκβαλεῖν
  choice: să-l scoatem
  rationale: Păstrează sensul de a face să iasă și evită să fixeze referentul pronumelui mai mult decât o face textul grec.
- source_word: αὐτό
  choice: -l
  rationale: Pronumele românesc masculin poate trimite atât la demon, cât și la băiat, păstrând în mod natural ambiguitatea referentului.
theological_decisions:
- issue: Referentul pronumelui αὐτό
  choice: Ambiguitatea este păstrată prin pronumele „-l”, cu referirea probabilă la demon explicată în notă.
  alternative: Pronumele poate fi înțeles ca referindu-se la băiat.
  rationale: Contextul exorcizării favorizează demonul ca referent, însă forma românească permite ambele referințe și nu rezolvă nejustificat ambiguitatea textului.
translation_notes:
  register: Română standard modernă, clară și demnă. „Deoparte” este mai idiomatic decât „în particular”, iar „n-am putut noi” păstrează accentul pronumelui explicit fără a suna nefiresc.
