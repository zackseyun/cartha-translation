base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/006.yaml
  text: And when the disciples heard it[c][b][a], they fell on their faces and were greatly afraid.
translation:
  language: ro
  text: Când au auzit aceasta, ucenicii au căzut cu fața la pământ și s-au înspăimântat foarte tare.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Când au auzit aceasta
  rationale: Participiul aorist are aici valoare temporală și este redat firesc în română printr-o propoziție introdusă de „când”. „Aceasta” trimite la glasul auzit în versetul precedent, fără a-l identifica din nou în mod explicit.
- source_word: οἱ μαθηταὶ
  choice: ucenicii
  rationale: Redarea consacrată și firească în Evanghelii pentru discipolii lui Isus.
- source_word: ἔπεσαν ἐπὶ πρόσωπον αὐτῶν
  choice: au căzut cu fața la pământ
  rationale: Expresia românească redă natural postura de prosternare indicată de formularea greacă literală „au căzut pe fața lor”.
- source_word: ἐφοβήθησαν
  choice: s-au înspăimântat
  rationale: Verbul exprimă aici intrarea într-o stare de frică; forma reflexivă românească redă natural reacția intensă din context.
- source_word: σφόδρα
  choice: foarte tare
  rationale: Redă intensificarea puternică a fricii într-o română modernă, clară și demnă.
theological_decisions:
- issue: Natura reacției ucenicilor la glasul divin
  choice: Textul descrie prosternarea fizică și frica intensă fără să precizeze dacă reacția este în primul rând închinare, groază sau teamă reverențioasă.
  alternative: Reacția ar putea fi formulată explicit fie ca închinare reverențioasă, fie ca groază în fața manifestării divine.
  rationale: Greaca indică postura și frica, dar nu le atribuie explicit o interpretare teologică; traducerea păstrează această tensiune.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. Formularea evită literalismul nefiresc „pe fața lor”, dar păstrează limpede postura corporală și intensitatea fricii.
