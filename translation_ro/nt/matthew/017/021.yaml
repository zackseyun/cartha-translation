source:
  edition: robinson-pierpont-2005-byzantine
  text: Τοῦτο δὲ τὸ γένος οὐκ ἐκπορεύεται εἰ μὴ ἐν προσευχῇ καὶ νηστείᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/021.yaml
  text: But[a] this kind does not come out except by prayer and fasting.
translation:
  language: ro
  text: Dar[a] acest fel nu iese decât prin rugăciune și post.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Acest verset lipsește din cele mai vechi manuscrise grecești, inclusiv Codex Sinaiticus și Codex Vaticanus din secolul al IV-lea, precum și din vechi traduceri siriace și copte. El apare însă în tradiția bizantină majoritară, în tradiția latină și în majoritatea manuscriselor siriace. Probabil a fost adăugat ulterior de copiști pentru armonizare cu Marcu 9:29.
    reason: textual_critical
lexical_decisions:
- source_word: γένος
  choice: fel
  rationale: În context, termenul desemnează un tip sau o categorie de demoni; „fel” este echivalentul românesc firesc și păstrează formularea generală a grecei.
- source_word: ἐκπορεύεται
  choice: iese
  rationale: Verbul descrie ieșirea demonului din persoana chinuită; „iese” redă direct și natural sensul contextual.
- source_word: εἰ μὴ
  choice: decât
  rationale: În construcția negativă „nu ... decât”, expresia redă clar valoarea exclusivă a sintagmei grecești.
- source_word: ἐν προσευχῇ καὶ νηστείᾳ
  choice: prin rugăciune și post
  rationale: Prepoziția ἐν are aici valoare instrumentală; „prin” exprimă idiomatic mijlocul în limba română.
theological_decisions:
- issue: Referentul expresiei „acest fel”
  choice: Formulare generală, fără adăugarea substantivului „demon”
  alternative: „acest fel de demon”
  rationale: Greaca are doar „acest fel”; contextul indică demonii, dar traducerea nu explicitează ceea ce textul lasă implicit.
- issue: Relația rugăciunii și postului cu ieșirea demonului
  choice: Păstrarea afirmației concise „prin rugăciune și post”
  alternative: O parafrază care ar preciza cine trebuie să se roage și să postească sau în ce fel acestea produc rezultatul
  rationale: Textul nu precizează agentul, momentul ori mecanismul; traducerea păstrează această nedeterminare și evită o interpretare confesională.
translation_notes:
  register: Română standard modernă, cu formulare concisă, demnă și ușor de înțeles. „Post” este preferat lui „postire” deoarece este mai firesc în această construcție și corespunde substantivului grec νηστείᾳ.
