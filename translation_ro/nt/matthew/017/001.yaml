id: MAT.17.1
reference: Matthew 17:1
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/001.yaml
  text: And after six days Jesus takes Peter[a], James, and John his brother[c][b], and leads them up onto a high mountain by themselves.
translation:
  language: ro
  text: După șase zile, Isus îi ia cu el pe Petru, pe Iacov și pe Ioan, fratele lui[a], și îi urcă pe un munte înalt, deoparte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Probabil: fratele lui Iacov.'
    reason: clarificarea_referentului
  - marker: b
    text: Sau „în particular”; expresia arată că erau separați de ceilalți.
    reason: alternativă_lexicală
lexical_decisions:
- source_word: μεθ’ ἡμέρας ἓξ
  choice: După șase zile
  rationale: Redă direct construcția temporală cu μετά și acuzativul, păstrând legătura explicită cu relatarea precedentă.
- source_word: παραλαμβάνει
  choice: îi ia cu el
  rationale: Verbul indică luarea unor persoane împreună cu sine; formularea românească exprimă sensul complet și păstrează prezentul narativ.
- source_word: Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: pe Petru, pe Iacov și pe Ioan
  rationale: Folosește formele românești consacrate ale numelor și marcarea firească a complementelor directe personale.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: fratele lui
  rationale: Păstrează formularea și referința pronominală din greacă; în context, expresia îl identifică cel mai firesc pe Ioan ca fratele lui Iacov.
- source_word: ἀναφέρει
  choice: îi duce sus
  rationale: Exprimă atât conducerea lor, cât și mișcarea ascendentă implicată de verb, fără repetarea lui „îi ia”.
- source_word: εἰς ὄρος ὑψηλὸν
  choice: pe un munte înalt
  rationale: Redă idiomatic destinația mișcării în limba română.
- source_word: κατ’ ἰδίαν
  choice: deoparte
  rationale: Arată că Isus și cei trei se separă de ceilalți; formularea este concisă și firească, păstrând nuanța de retragere în particular.
theological_decisions:
- issue: Prezentul istoric în narațiunea evanghelică
  choice: 'Păstrarea prezentului narativ: „îi ia ... îi duce”'
  alternative: 'Trecutul narativ: „i-a luat ... i-a dus”'
  rationale: Greaca folosește forme de prezent pentru vivacitate narativă, iar româna poate păstra aici acest efect în mod natural.
- issue: Referentul expresiei „fratele lui”
  choice: 'Păstrarea pronumelui din text: „Ioan, fratele lui”'
  alternative: 'Explicitarea: „Ioan, fratele lui Iacov”'
  rationale: Contextul favorizează clar referirea la Iacov, dar formularea păstrează structura pronominală a grecei și evită introducerea explicită în text a unui nume repetat.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. Prezentul istoric este păstrat pentru a reda vivacitatea originalului; topica rămâne naturală în română, iar „sus” face explicită mișcarea ascendentă a verbului grec.
