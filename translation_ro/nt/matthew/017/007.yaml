id: MAT.17.7
reference: Matthew 17:7
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ⸂προσῆλθεν ὁ Ἰησοῦς καὶ ἁψάμενος αὐτῶν⸃ εἶπεν· Ἐγέρθητε καὶ μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/007.yaml
  text: And Jesus came near and touched them and said[a], “Get up[c][b], and do not be afraid.”
translation:
  language: ro
  text: 'Isus S-a apropiat, i-a atins și le-a spus: „Ridicați-vă[a] și nu vă temeți[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „Sculați-vă”; porunca se referă la ridicarea lor din poziția în care căzuseră.
    reason: lexical_alternative
  - marker: b
    text: Sau „nu vă fie frică”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθεν
  choice: S-a apropiat
  rationale: Verbul προσέρχομαι exprimă apropierea de cineva; formularea este firească în româna actuală și păstrează mișcarea spre ucenici.
- source_word: ἁψάμενος αὐτῶν
  choice: i-a atins
  rationale: Participiul aorist al lui ἅπτω, construit cu genitivul, înseamnă „a atinge”. Coordonarea printr-un verb personal redă fluent succesiunea acțiunilor fără a preciza nejustificat că Isus Și-ar fi pus mâna peste ei.
- source_word: εἶπεν
  choice: le-a spus
  rationale: Pronumele indirect este cerut natural în română de adresarea care urmează și are drept referent ucenicii; „a spus” redă direct verbul λέγω.
- source_word: Ἐγέρθητε
  choice: Ridicați-vă
  rationale: Imperativul le cere ucenicilor să se ridice din poziția în care căzuseră. „Ridicați-vă” este natural și nu precizează excesiv postura finală.
- source_word: μὴ φοβεῖσθε
  choice: nu vă temeți
  rationale: Redă concis și demn sensul lui φοβέομαι. Prezentul imperativ nu impune aici traducerea mai specifică „încetați să vă temeți”.
- source_word: καὶ
  choice: și
  rationale: Conjuncția păstrează legarea simplă a acțiunilor și a celor două porunci, fără a adăuga o nuanță temporală.
theological_decisions:
- issue: Redarea poruncii liniștitoare a lui Isus fără amplificare pastorală sau doctrinară
  choice: Ridicați-vă și nu vă temeți
  alternative: Sculați-vă și nu vă fie frică; Ridicați-vă și încetați să vă temeți
  rationale: Formularea păstrează atât chemarea fizică de a se ridica, cât și îndemnul direct de a nu se teme, fără a adăuga idei care nu sunt exprimate în text.
translation_notes:
  register: Română standard modernă, clară și demnă. Succesiunea participială grecească este redată prin verbe coordonate, într-o construcție narativă firească. Pronumele reverențial „S-a” urmează uzul editorial românesc pentru referirea la Isus.
