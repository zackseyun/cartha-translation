id: MAT.17.25
reference: Matthew 17:25
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: λέγει· Ναί. καὶ ⸀ἐλθόντα εἰς τὴν οἰκίαν προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων· Τί σοι δοκεῖ, Σίμων; οἱ βασιλεῖς τῆς γῆς ἀπὸ τίνων λαμβάνουσιν τέλη ἢ κῆνσον; ἀπὸ τῶν υἱῶν αὐτῶν ἢ ἀπὸ τῶν ἀλλοτρίων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/025.yaml
  text: He said[a], “Yes.” And when he came into the house, Jesus spoke to him first, saying, “What do you think[b], Simon? From whom do the kings of the earth collect duties or poll tax—from their own sons or from others?”
translation:
  language: ro
  text: 'El a răspuns: „Da.” Când a intrat în casă, Isus i-a luat-o înainte și i-a zis: „Ce crezi, Simon? De la cine încasează regii pământului taxe vamale sau bir[a]: de la fiii lor sau de la străini[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „taxe ori tribut”. Greaca deosebește între τέλη, taxe indirecte, inclusiv taxe vamale, și κῆνσος, bir sau impozit personal.
    reason: lexical_alternative
  - marker: b
    text: Aici, „străini” înseamnă cei care nu fac parte din familia regelui, adică persoane din afara ei.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: Da
  rationale: Redă direct și firesc răspunsul afirmativ simplu.
- source_word: ἐλθόντα εἰς τὴν οἰκίαν
  choice: Când a intrat în casă
  rationale: Transformă participiul circumstanțial într-o propoziție temporală clară; subiectul subînțeles este Petru.
- source_word: προέφθασεν αὐτὸν
  choice: Isus i-a vorbit primul
  rationale: Redă idiomatic faptul că Isus a luat inițiativa și a vorbit înainte ca Petru să apuce să spună ceva.
- source_word: Τί σοι δοκεῖ
  choice: Ce crezi
  rationale: Este formula românească actuală și naturală pentru solicitarea judecății lui Simon.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: regii pământului
  rationale: Păstrează formularea amplă a grecescului, fără a o restrânge la o anumită țară.
- source_word: τέλη
  choice: taxe vamale
  rationale: Indică taxele indirecte și taxele percepute asupra mărfurilor, păstrând deosebirea față de κῆνσον.
- source_word: κῆνσον
  choice: bir
  rationale: Termenul românesc concis denumește o dare impusă persoanelor sau populației și păstrează contrastul cu taxele vamale.
- source_word: υἱῶν αὐτῶν
  choice: fiii lor
  rationale: Păstrează termenul familial masculin și contrastul necesar pentru implicația dezvoltată în versetul următor.
- source_word: ἀλλοτρίων
  choice: străini
  rationale: Redă persoanele care nu aparțin familiei regelui; nota clarifică sensul contextual, nu neapărat etnic sau național.
theological_decisions:
- issue: Posibila implicație teologică a imaginii fiilor
  choice: fiii lor
  alternative: copiii lor; supușii lor
  rationale: Formularea literală păstrează analogia familiei regale și tensiunea cristologică pregătită pentru versetul următor, fără a o explica anticipat.
translation_notes:
  register: Română standard modernă, clară și demnă. „Bir” are o ușoară coloratură istorică, potrivită contextului antic, dar rămâne inteligibil; nota explică sensul fiscal. Marcajele notelor sunt așezate lângă expresiile pe care le clarifică.
