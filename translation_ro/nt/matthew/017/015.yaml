id: MAT.17.15
reference: Matthew 17:15
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ἐλέησόν μου τὸν υἱόν, ὅτι σεληνιάζεται καὶ κακῶς ⸀πάσχει, πολλάκις γὰρ πίπτει εἰς τὸ πῦρ καὶ πολλάκις εἰς τὸ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/015.yaml
  text: and saying[a], “Lord, have mercy on my son, because he is epileptic and suffers terribly; for he often falls into the fire and often into the water.”
translation:
  language: ro
  text: 'și zicând: „Doamne, ai milă de fiul meu, căci are crize[a] și suferă cumplit; fiindcă adesea cade în foc și adesea în apă.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „este epileptic”; literal: „este lovit de lună”. Termenul grecesc reflectă un idiom antic pentru o suferință manifestată prin crize.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: și zicând
  rationale: Păstrează legătura participială cu narațiunea din versetul precedent și redă firesc construcția greacă.
- source_word: Κύριε
  choice: Doamne
  rationale: Vocativul consacrat și demn al lui „Domn”, potrivit adresării respectuoase către Isus.
- source_word: ἐλέησόν μου τὸν υἱόν
  choice: ai milă de fiul meu
  rationale: Redă cererea urgentă de ajutor plin de compasiune și păstrează sensul specific al lui υἱός, „fiu”.
- source_word: σεληνιάζεται
  choice: are crize
  rationale: Descrie fenomenologic manifestarea, fără a introduce un diagnostic medical modern și fără a afirma o cauzalitate lunară; idiomul literal este consemnat în notă.
- source_word: κακῶς πάσχει
  choice: suferă cumplit
  rationale: Exprimă intensitatea adverbului κακῶς într-o română actuală, naturală și demnă.
- source_word: πολλάκις
  choice: adesea
  rationale: Redă concis repetarea frecventă și susține paralelismul celor două propoziții.
- source_word: πίπτει εἰς τὸ πῦρ ... εἰς τὸ ὕδωρ
  choice: cade în foc ... în apă
  rationale: Redare directă și idiomatică a mișcării exprimate prin εἰς, cu păstrarea paralelismului grec.
theological_decisions:
- issue: Sensul lui σεληνιάζεται în contextul vindecării și al exorcizării
  choice: are crize
  alternative: este epileptic; este lovit de lună
  rationale: Formularea descrie manifestările observabile fără a atribui textului un diagnostic neurologic modern ori credința că luna ar fi cauza. Astfel rămâne nerezolvată tensiunea dintre descrierea tatălui din acest verset și contextul narativ mai larg.
translation_notes:
  register: Română literară modernă, clară și demnă. „Are crize” este accesibil cititorului obișnuit și evită atât arhaismul literal, cât și precizia anacronică a unui diagnostic modern.
