id: MAT.17.20
reference: Matthew 17:20
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀λέγει αὐτοῖς· Διὰ τὴν ⸀ὀλιγοπιστίαν ὑμῶν· ἀμὴν γὰρ λέγω ὑμῖν, ἐὰν ἔχητε πίστιν ὡς κόκκον σινάπεως, ἐρεῖτε τῷ ὄρει τούτῳ· ⸂Μετάβα ἔνθεν⸃ ἐκεῖ, καὶ μεταβήσεται, καὶ οὐδὲν ἀδυνατήσει ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/020.yaml
  text: But he says to them[a], “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move[c][b], and nothing will be impossible for you.”
translation:
  language: ro
  text: 'Iar el le spune: „Din cauza puținei voastre credințe.[a] Adevărat vă spun: dacă aveți credință ca un grăunte de muștar, îi veți spune muntelui acestuia: «Mută-te de aici acolo!», iar el se va muta; și nimic nu vă va fi imposibil.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „din cauza credinței voastre slabe” ori „din cauza lipsei voastre de credință”. Termenul grecesc indică mai precis o credință mică sau insuficientă decât o necredință deplină.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: le spune
  rationale: Păstrează prezentul istoric grecesc și vivacitatea narațiunii; în româna narativă actuală, prezentul este firesc aici.
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  choice: Din cauza puținei voastre credințe
  rationale: Redă ideea unei credințe mici sau insuficiente, nu neapărat absența totală a credinței, și păstrează construcția nominală a sursei.
- source_word: ἀμὴν
  choice: Adevărat
  rationale: Este formula solemnă și idiomatică în română pentru afirmația introductivă a lui Isus, fără transliterarea mai puțin transparentă „amin”.
- source_word: πίστιν
  choice: credință
  rationale: În context, termenul indică încrederea în puterea lui Dumnezeu; „credință” este redarea românească firească și nu restrânge sensul la o formulare confesională.
- source_word: ὡς κόκκον σινάπεως
  choice: ca un grăunte de muștar
  rationale: Păstrează comparația grecească și imaginea unui lucru foarte mic, într-o formulare românească naturală.
- source_word: Μετάβα ἔνθεν ἐκεῖ
  choice: Mută-te de aici acolo!
  rationale: Imperativul reflexiv redă firesc în română deplasarea muntelui, fără a introduce ideea unei acțiuni pasive.
- source_word: μεταβήσεται
  choice: se va muta
  rationale: 'Redă valoarea intranzitivă a verbului: muntele își va schimba locul.'
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  choice: nimic nu vă va fi imposibil
  rationale: Redă clar idiomul grecesc și păstrează adresarea la plural.
theological_decisions:
- issue: Sensul lui πίστις în contextul unei minuni
  choice: credință
  alternative: încredere
  rationale: Contextul privește încrederea insuficientă a ucenicilor în puterea lui Dumnezeu. „Credință” păstrează termenul teologic larg, fără a transforma afirmația într-o definiție a credinței mântuitoare și fără a sugera că simpla voință omenească ar fi sursa puterii.
- issue: Sensul lui ὀλιγοπιστία
  choice: puțină credință
  alternative: lipsă de credință / necredință
  rationale: Termenul indică în primul rând o credință deficientă sau mică; redarea principală evită echivalarea nejustificată cu necredința totală, iar alternativa este consemnată în notă.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Prezentul istoric este păstrat, iar punctuația face limpede trecerea de la răspunsul lui Isus la afirmația solemnă și apoi la porunca adresată muntelui.
