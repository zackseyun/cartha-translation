source:
  edition: SBLGNT
  text: Ἐλθόντων δὲ αὐτῶν εἰς Καφαρναοὺμ προσῆλθον οἱ τὰ δίδραχμα λαμβάνοντες τῷ Πέτρῳ καὶ εἶπαν· Ὁ διδάσκαλος ὑμῶν οὐ τελεῖ τὰ δίδραχμα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/024.yaml
  text: When they came to Capernaum[a], those who collected the two-drachma tax came to Peter and said[b], “Does your teacher not pay the two-drachma tax?”
translation:
  language: ro
  text: 'Când au ajuns în Capernaum, cei care încasau taxa de două drahme[a][b] s-au apropiat de Petru și au spus: „Învățătorul vostru nu plătește taxa de două drahme?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'În greacă: „cele două drahme”; este vorba despre taxa de două drahme pentru templu.'
    reason: cultural_note
  - marker: b
    text: 'Sau: „cei care încasau cele două drahme”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλθόντων δὲ αὐτῶν
  choice: Când au ajuns
  rationale: Genitivul absolut exprimă o împrejurare temporală. Formularea este firească în româna actuală; particula δέ marchează aici doar trecerea narativă și nu necesită o redare explicită.
- source_word: Καφαρναοὺμ
  choice: Capernaum
  rationale: Se folosește forma consacrată în română a numelui localității.
- source_word: οἱ τὰ δίδραχμα λαμβάνοντες
  choice: cei care strângeau taxa de două drahme
  rationale: Participiul îi desemnează pe cei care încasau plata. Verbul „strângeau” este natural pentru colectarea unei taxe, iar adăugarea termenului „taxa” explicitează sensul cerut de context.
- source_word: προσῆλθον ... τῷ Πέτρῳ
  choice: s-au apropiat de Petru
  rationale: Redă direct mișcarea către Petru exprimată de προσέρχομαι și este idiomatic în română.
- source_word: δίδραχμα
  choice: taxa de două drahme
  rationale: Termenul desemnează plata în valoare de două drahme. Redarea comunică atât suma, cât și caracterul obligației, fără transliterarea tehnică mai puțin accesibilă „didrahmă”.
- source_word: Ὁ διδάσκαλος ὑμῶν
  choice: Învățătorul vostru
  rationale: „Învățător” este echivalentul românesc firesc și consacrat pentru διδάσκαλος în acest context evanghelic.
- source_word: οὐ τελεῖ
  choice: nu plătește
  rationale: În context fiscal, τελέω înseamnă îndeplinirea obligației prin plată. Forma negativă a întrebării este păstrată, fără a explicita răspunsul pozitiv probabil anticipat.
theological_decisions:
- issue: Identificarea lui δίδραχμα drept taxă, nu doar drept monede
  choice: taxa de două drahme în textul principal
  alternative: cele două drahme; didrahmele
  rationale: Contextul privește plata unei obligații, nu simpla primire sau folosire a unor monede. „Taxa” explicitează sensul contextual fără a introduce o interpretare doctrinară.
- issue: Natura taxei
  choice: Păstrarea termenului general „taxa” în text, cu identificarea drept taxă pentru templu în notă
  alternative: taxa pentru templu direct în textul principal
  rationale: Versetul folosește numai expresia „cele două drahme”; identificarea culturală este bine întemeiată contextual, dar nota păstrează distincția dintre formularea greacă și explicația istorică.
translation_notes:
  register: Română standard modernă, clară și demnă. Sintaxa narativă este fluentă, iar întrebarea negativă păstrează tensiunea pragmatică a originalului. Marcajele notelor sunt așezate lângă expresia pe care o explică.
