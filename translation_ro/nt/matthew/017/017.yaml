id: MAT.17.17
reference: Matthew 17:17
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ⸂μεθ’ ὑμῶν ἔσομαι⸃; ἕως πότε ἀνέξομαι ὑμῶν; φέρετέ μοι αὐτὸν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/017.yaml
  text: But Jesus answered[a], “O unbelieving and perverse generation[c][b], how long will I be with you? How long will I bear with you? Bring him here to me.”
translation:
  language: ro
  text: 'Dar Isus a răspuns: „O, generație necredincioasă[a] și pervertită[b], până când voi fi cu voi? Până când vă voi mai răbda? Aduceți-l aici, la Mine!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „lipsită de credincioșie”. Termenul grecesc poate descrie atât necredința, cât și lipsa fidelității.
    reason: lexical_alternative
  - marker: b
    text: Sau „strâmbată”, „denaturată” ori „coruptă”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Dar Isus a răspuns
  rationale: Redă firesc idiomul «răspunzând, a spus», iar δέ marchează aici trecerea cu nuanță adversativă spre mustrarea lui Isus.
- source_word: Ὦ γενεὰ
  choice: O, generație
  rationale: Păstrează adresarea solemnă și ecoul profetic al substantivului γενεά, într-o formă românească actuală.
- source_word: ἄπιστος
  choice: necredincioasă
  rationale: În context, termenul indică lipsa credinței; totuși, poate avea și sensul de «lipsită de fidelitate», păstrat în nota de subsol.
- source_word: διεστραμμένη
  choice: pervertită
  rationale: Participiul perfect pasiv descrie o stare de denaturare sau deformare morală; «pervertită» păstrează forța termenului și forma participială.
- source_word: ἕως πότε μεθ’ ὑμῶν ἔσομαι
  choice: până când voi fi cu voi?
  rationale: Redare directă și naturală a întrebării retorice, fără a preciza mai mult decât textul grec.
- source_word: ἕως πότε ἀνέξομαι ὑμῶν
  choice: până când vă voi mai răbda?
  rationale: «A răbda» exprimă limpede ideea de a suporta sau îndura; «mai» este idiomatic în întrebarea românească și scoate în evidență durata continuată.
- source_word: φέρετέ μοι αὐτὸν ὧδε
  choice: Aduceți-l aici, la Mine!
  rationale: Imperativul plural este păstrat, iar ὧδε și μοι sunt redate distinct prin «aici» și «la Mine».
theological_decisions:
- issue: Sensul lui ἄπιστος în mustrarea lui Isus
  choice: necredincioasă
  alternative: lipsită de credincioșie
  rationale: Contextul imediat privește insuficiența credinței, dar polisemia termenului este semnalată fără a transforma mustrarea într-o afirmație mai specifică despre infidelitatea legământului.
- issue: Referentul colectiv al lui γενεά
  choice: generație
  alternative: neam / oameni
  rationale: «Generație» păstrează ambiguitatea privind întinderea grupului căruia i se adresează mustrarea și evită restrângerea nejustificată la o singură categorie din context.
translation_notes:
  register: Registru actual, demn și solemn. «O» conservă forța vocativului, iar întrebările scurte păstrează intensitatea mustrării. Majuscula reverențială din «Mine» urmează o convenție românească răspândită, fără a schimba sensul sursei.
