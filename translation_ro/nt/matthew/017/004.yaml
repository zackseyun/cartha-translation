id: MAT.17.4
reference: Matthew 17:4
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ· Κύριε, καλόν ἐστιν ἡμᾶς ὧδε εἶναι· εἰ θέλεις, ⸀ποιήσω ὧδε τρεῖς σκηνάς, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ ⸂Ἠλίᾳ μίαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/004.yaml
  text: 'Then Peter answered and said to Jesus[a], “Lord, it is good for us to be here. If you wish, I will make three shelters here: one for you, one for Moses, and one for Elijah.”'
translation:
  language: ro
  text: 'Atunci Petru a răspuns și i-a zis lui Isus: „Doamne, este bine să fim aici. Dacă vrei, voi face aici trei adăposturi[a]: unul pentru tine, unul pentru Moise și unul pentru Ilie.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „corturi”, „colibe” ori „tabernacole”. Termenul grecesc skēnas desemnează structuri folosite ca adăposturi, de regulă temporare.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν
  choice: Atunci Petru a răspuns și i-a zis
  rationale: Păstrează formula narativă grecească „răspunzând... a zis”, dar o exprimă într-o construcție românească firească; „atunci” redă aici progresia narativă marcată de δέ.
- source_word: Κύριε
  choice: Doamne
  rationale: Este vocativul românesc firesc pentru κύριος și păstrează atât respectul adresării, cât și posibila greutate teologică a titlului.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: este bine să fim aici
  rationale: Redă natural construcția infinitivală grecească fără adaosuri explicative.
- source_word: εἰ θέλεις
  choice: Dacă vrei
  rationale: Redare modernă și directă a ideii de dorință sau voință exprimate de θέλω.
- source_word: ποιήσω ὧδε τρεῖς σκηνάς
  choice: voi face aici trei adăposturi
  rationale: „Voi face” urmărește sensul larg al verbului ποιέω, iar „adăposturi” redă neutru structurile temporare, fără a impune în text o asociere cultică sau festivă.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: unul pentru tine, unul pentru Moise și unul pentru Ilie
  rationale: Repetarea lui „unul” păstrează accentul distributiv al repetării lui μίαν în greacă.
- source_word: ὧδε
  choice: aici
  rationale: Ambele ocurențe sunt redate prin „aici”, păstrând repetiția sursei.
theological_decisions:
- issue: Redarea lui κύριος în adresarea către Isus
  choice: Doamne
  alternative: Stăpâne
  rationale: „Doamne” păstrează domeniul semantic și posibila încărcătură teologică a titlului, fără a-l reduce la o simplă formulă de politețe.
- issue: Redarea lui σκηνάς în contextul schimbării la față
  choice: adăposturi
  alternative: corturi, colibe, tabernacole
  rationale: Versetul nu identifică explicit structurile cu Sărbătoarea Corturilor. Termenul neutru din text evită impunerea acestei interpretări, iar nota păstrează alternativele și posibilele lor rezonanțe.
translation_notes:
  register: Română standard modernă, clară și demnă. Sintaxa discursului direct este firească, iar repetițiile semnificative ale textului grec sunt păstrate. Pronumele „tine” este scris cu literă mică, potrivit normelor ortografice generale și fără introducerea unei convenții confesionale.
