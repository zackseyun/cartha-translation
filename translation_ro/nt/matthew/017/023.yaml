source:
  edition: SBLGNT
  text: καὶ ἀποκτενοῦσιν αὐτόν, καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθήσεται. καὶ ἐλυπήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/023.yaml
  text: and they will kill him[a], and on the third day he will be raised. And they were deeply grieved.
translation:
  language: ro
  text: Și Îl vor omorî, și a treia zi va fi înviat.[a] Și ei s-au întristat foarte mult.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „va învia”. Verbul grecesc este la diateza pasivă: „va fi înviat”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: Îl vor omorî
  rationale: Redă direct viitorul activ și pronumele obiect, fără nuanța juridică suplimentară din „Îl vor da la moarte” sau nuanța morală mai specifică din „Îl vor ucide mișelește”.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: a treia zi
  rationale: Dativ temporal redat prin formula românească firească și consacrată; prepoziția „în” nu este necesară.
- source_word: ἐγερθήσεται
  choice: va fi înviat
  rationale: Păstrează diateza pasivă a viitorului grecesc și lasă implicit agentul acțiunii, așa cum face textul-sursă.
- source_word: ἐλυπήθησαν σφόδρα
  choice: s-au întristat foarte mult
  rationale: Formulare naturală în româna modernă, care redă atât reacția de tristețe, cât și intensificarea exprimată de σφόδρα.
- source_word: καὶ ... καὶ ... καὶ
  choice: și ... iar ... Ei
  rationale: Evită o succesiune greoaie de conectori identici, păstrând totodată coordonarea simplă și cursul narațiunii.
theological_decisions:
- issue: Diateza predicției despre înviere
  choice: va fi înviat
  alternative: va învia
  rationale: Forma pasivă reflectă exact ἐγερθήσεται și păstrează posibilitatea pasivului divin, fără a preciza explicit agentul. Alternativa activă este idiomatică, dar estompează forma sursei.
translation_notes:
  register: Română standard modernă, clară și demnă. Majuscula din „Îl” urmează uzul editorial românesc reverențial, fără a adăuga informație lexicală. Punctuația separă predicția de reacția ucenicilor și evită supraîncărcarea cu „și”.
