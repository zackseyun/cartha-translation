id: MAT.17.2
reference: Matthew 17:2
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν, καὶ ἔλαμψεν τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, τὰ δὲ ἱμάτια αὐτοῦ ⸀ἐγένετο λευκὰ ὡς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/002.yaml
  text: And he was transfigured before them[a], and his face shone like the sun, and his clothes became white as the light.
translation:
  language: ro
  text: Și a fost transfigurat înaintea lor[a]; fața Lui a strălucit ca soarele, iar hainele Lui s-au făcut albe ca lumina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „a fost transformat”.'
    reason: Alternativă lexicală pentru μετεμορφώθη.
lexical_decisions:
- source_word: μετεμορφώθη
  choice: a fost transfigurat
  rationale: Aorist pasiv al lui μεταμορφόω. Formularea consacrată „a fost transfigurat” redă aici transformarea vizibilă a înfățișării, iar alternativa mai generală este păstrată în nota de subsol.
- source_word: ἔμπροσθεν αὐτῶν
  choice: înaintea lor
  rationale: Redă firesc în româna biblică modernă faptul că evenimentul s-a petrecut în prezența și sub privirile lor.
- source_word: ἔλαμψεν
  choice: a strălucit
  rationale: Echivalent direct și natural pentru verbul care exprimă emiterea luminii.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: fața Lui
  rationale: În context, πρόσωπον desemnează fața fizică a lui Isus; „fața” este limpede și actual.
- source_word: ὡς ὁ ἥλιος
  choice: ca soarele
  rationale: Păstrează comparația explicită introdusă prin ὡς.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: hainele Lui
  rationale: „Hainele” este echivalentul românesc curent pentru îmbrăcăminte, fără solemnitate artificială.
- source_word: ἐγένετο λευκὰ
  choice: s-au făcut albe
  rationale: Redă schimbarea de stare exprimată de ἐγένετο; acordul românesc urmează subiectul plural „hainele”.
- source_word: ὡς τὸ φῶς
  choice: ca lumina
  rationale: Păstrează imaginea comparativă concretă și articolul grecesc într-o formulare românească naturală.
theological_decisions:
- issue: Redarea evenimentului transfigurării
  choice: a fost transfigurat
  alternative: a fost transformat
  rationale: „A fost transfigurat” descrie manifestarea vizibilă relatată în context și păstrează termenul creștin istoric, fără a adăuga afirmații doctrinare dincolo de text; nota indică sensul lexical mai larg.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Punctul și virgula structurează cele două efecte vizibile ale transfigurării fără a slăbi succesiunea narativă; majusculele pronominale pentru referirea la Isus urmează uzul românesc biblic tradițional.
