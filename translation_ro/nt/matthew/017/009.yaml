id: MAT.17.9
reference: Matthew 17:9
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων· Μηδενὶ εἴπητε τὸ ὅραμα ἕως οὗ ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ⸀ἐγερθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/009.yaml
  text: And as they were coming down from the mountain[a], Jesus commanded them, saying[b], “Tell the vision to no one until the Son of Man is raised from the dead.”
translation:
  language: ro
  text: 'În timp ce coborau de pe munte, Isus le-a poruncit: „Nu spuneți nimănui despre vedenie[a] până ce Fiul Omului va fi înviat dintre cei morți.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „ce ați văzut”. Grecescul spune „vedenie”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: În timp ce coborau de pe munte
  rationale: Construcția participială la prezent indică o acțiune în desfășurare, simultană cu porunca lui Isus; formularea este firească în româna actuală.
- source_word: ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: 'Isus le-a poruncit:'
  rationale: „A poruncit” redă forța verbului, iar două puncte introduc natural vorbirea directă fără calcarea rigidă a participiului „zicând”.
- source_word: Μηδενὶ εἴπητε
  choice: Nu spuneți nimănui
  rationale: Redă direct interdicția și păstrează negația categorică din greacă.
- source_word: τὸ ὅραμα
  choice: vedenie
  rationale: „Vedenie” păstrează nuanța unei priveliști cu caracter revelator; alternativa mai neutră „ce ați văzut” este consemnată în notă.
- source_word: ἕως οὗ
  choice: până ce
  rationale: Exprimă clar limita temporală a interdicției și este idiomatic în română.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Păstrează titlul cristologic și rezonanța lui scripturistică, fără parafrazare.
- source_word: ἐκ νεκρῶν
  choice: dintre cei morți
  rationale: Redă sensul ieșirii din rândul celor morți mai explicit decât formula românească abreviată „din morți”.
- source_word: ἐγερθῇ
  choice: va fi înviat
  rationale: Păstrează diateza pasivă a formei grecești și nu explicitează agentul acțiunii.
theological_decisions:
- issue: Formularea și diateza învierii
  choice: va fi înviat dintre cei morți
  alternative: va învia dintre cei morți
  rationale: Greaca folosește o formă pasivă; traducerea păstrează această diateză și posibila ei rezonanță privind acțiunea lui Dumnezeu, fără a numi explicit agentul.
- issue: Caracterul evenimentului văzut
  choice: vedenie
  alternative: ce ați văzut
  rationale: Termenul grec poate desemna ceea ce a fost văzut, dar are și o nuanță vizionară sau revelatoare; textul principal o păstrează, iar nota oferă formularea mai neutră.
translation_notes:
  register: Română standard modernă, clară și demnă. S-a evitat formula învechită „zicând”, folosindu-se punctuația firească a vorbirii directe; „vedenie” păstrează totuși nuanța revelatoare a termenului grec.
