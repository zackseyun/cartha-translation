  source_fidelity: 'Textul redă fidel construcția temporală cu genitiv absolut („Pe când se adunau”), locativul „în Galileea”, enunțul adresat discipolilor și predicția pasivă: „Fiul Omului urmează să fie dat în mâinile oamenilor”. „Urmează să” exprimă adecvat caracterul iminent/anticipat al lui μέλλει, iar „dat” păstrează fără supraspecificare sensul pasiv al lui παραδίδοσθαι.'
  naturalness: Formularea este firească în româna standard modernă și păstrează un registru biblic sobru, dar accesibil. „Le-a spus” este idiomatic, iar „în mâinile oamenilor” reproduce limpede metafora greacă și funcționează natural în română.
  terminology: „Fiul Omului” este forma consacrată și fidelă pentru ὁ υἱὸς τοῦ ἀνθρώπου. „Oamenilor” redă corect pluralul generic ἀνθρώπων. Nota pentru „să fie predat” oferă o alternativă legitimă pentru παραδίδοσθαι fără a impune interpretarea „trădat”.
