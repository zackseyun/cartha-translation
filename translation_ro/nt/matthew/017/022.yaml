id: MAT.17.22
reference: Matthew 17:22
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ⸀Συστρεφομένων δὲ αὐτῶν ἐν τῇ Γαλιλαίᾳ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μέλλει ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοσθαι εἰς χεῖρας ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/022.yaml
  text: While they were gathering together in Galilee[a], Jesus said to them[c][b], “The Son of Man is about to be delivered into the hands of men,”
translation:
  language: ro
  text: 'Pe când se adunau în Galileea[a], Isus le-a spus: „Fiul Omului urmează să fie dat[b] în mâinile oamenilor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Pe când erau adunați în Galileea” ori „Pe când se strângeau laolaltă în Galileea”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „să fie predat”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συστρεφομένων
  choice: se adunau
  rationale: Participiul la genitiv descrie grupul aflat în proces de adunare sau reunire. „Se adunau” păstrează sensul colectiv și este firesc în româna actuală, fără a preciza o deplasare pe care textul nu o exprimă explicit.
- source_word: δὲ
  choice: Pe când
  rationale: Împreună cu construcția participială absolută, δέ introduce împrejurarea în care Isus vorbește. „Pe când” redă fluent legătura temporală și discursivă.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: în Galileea
  rationale: Redare locativă directă și naturală.
- source_word: εἶπεν αὐτοῖς
  choice: le-a spus
  rationale: Redare românească firească a verbului λέγω cu obiect indirect, fără schimbarea sensului.
- source_word: Μέλλει
  choice: urmează să
  rationale: Exprimă caracterul iminent sau viitor al acțiunii, fără a introduce în mod nejustificat ideea unei predestinări explicite.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Formula consacrată păstrează structura expresiei grecești, rezonanța ei scripturală și funcția ei de autodesemnare în Evanghelii.
- source_word: παραδίδοσθαι
  choice: să fie dat
  rationale: Păstrează diateza pasivă și sensul larg al predării în puterea altora, fără a restrânge anticipat referirea la trădare sau la un transfer juridic.
- source_word: εἰς χεῖρας
  choice: în mâinile
  rationale: Păstrează metafora grecească, limpede și idiomatică și în română.
- source_word: ἀνθρώπων
  choice: oamenilor
  rationale: Redă pluralul generic al lui ἄνθρωπος și păstrează jocul de cuvinte perceptibil dintre „Fiul Omului” și „mâinile oamenilor”.
theological_decisions:
- issue: Redarea expresiei ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  alternative: Fiul omului / Cel omenesc
  rationale: Forma tradițională și literală păstrează caracterul de titlu, ecourile intertextuale și ambiguitatea teologică a expresiei, fără a o reduce la o simplă afirmație despre umanitate.
- issue: Nuanța lui παραδίδοσθαι în vestirea pătimirii
  choice: să fie dat
  alternative: să fie predat / să fie dat pe mâna
  rationale: „Să fie dat” lasă deschisă identitatea agentului și păstrează suprapunerea posibilă dintre trădare, predare și providență. Alternativa „să fie trădat” ar restrânge prea mult sensul verbului în acest context.
translation_notes:
  register: Română standard modernă, cu formulare demnă și accesibilă. „Le-a spus” este preferat lui „a zis către ei” pentru naturalețe, iar paralelismul „Fiul Omului... în mâinile oamenilor” este păstrat intenționat.
