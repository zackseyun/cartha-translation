  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ὁ ἐμβάψας μετ’ ἐμοῦ ⸂τὴν χεῖρα ἐν τῷ τρυβλίῳ⸃ οὗτός με παραδώσει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/023.yaml
  text: He answered[b][a], “The one who dipped his hand with me in the bowl—this one will betray me.”
translation:
  language: ro
  text: 'El le-a răspuns: „Cel care și-a înmuiat mâna odată cu Mine în bol[a], acela Mă va trăda[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „în vas” sau „în farfurie”.
    reason: lexical_alternative
  - marker: b
    text: Sau „Mă va preda”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: le-a răspuns
  rationale: Construcția cu participiu și verb finit este redată idiomatic printr-un singur verb; pronumele „le” clarifică firesc destinatarii din context.
- source_word: ἐμβάψας
  choice: și-a înmuiat
  rationale: Participiul aorist indică acțiunea de identificare deja săvârșită; forma reflexiv-posesivă este firească în română când obiectul este o parte a corpului.
- source_word: μετ’ ἐμοῦ
  choice: împreună cu Mine
  rationale: Redă explicit ideea de însoțire și simultaneitate exprimată de μετά cu genitivul.
- source_word: τὴν χεῖρα
  choice: mâna
  rationale: Româna folosește firesc articolul hotărât împreună cu dativul posesiv reflexiv din „și-a înmuiat”.
- source_word: ἐν τῷ τρυβλίῳ
  choice: în strachină
  rationale: τρύβλιον desemnează un vas relativ puțin adânc folosit la masă; „strachină” este concret, inteligibil și potrivit cadrului.
- source_word: οὗτός
  choice: acela
  rationale: Pronumele demonstrativ păstrează accentul identificator al grecescului, mai bine decât simplul „el”.
- source_word: παραδώσει
  choice: Mă va trăda
  rationale: În acest context, predarea lui Isus este un act de trădare; alternativa lexicală mai generală este păstrată în notă.
theological_decisions:
- issue: Redarea lui παραδίδωμι în contextul lui Iuda
  choice: Mă va trăda
  alternative: Mă va da pe mâna altora
  rationale: Contextul relațional și narativ susține sensul de trădare, fără a elimina din aparatul de note sensul concret de predare.
translation_notes:
  register: Română standard modernă, cu formulare demnă și oralitate naturală pentru vorbirea directă. Majusculele reverențiale pentru pronumele referitoare la Isus sunt folosite consecvent în verset.
