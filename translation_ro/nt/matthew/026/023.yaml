  verdict: revise
  source_fidelity: 'Sensul de bază este redat corect: răspunsul lui Isus, gestul identificator al celui care a înmuiat mâna cu El în recipient și anunțul trădării. Totuși, „împreună cu Mine” plasat după „și-a înmuiat mâna” sună stângaci în română și poate sugera că persoana i-a înmuiat mâna lui Isus. Reformularea propusă păstrează asocierea exprimată de μετ’ ἐμοῦ și gestul încheiat al participiului aorist.'
  naturalness: „Bol” este mai firesc în româna standard modernă decât „strachină”, care are o nuanță mai populară sau regională. „Odată cu Mine” exprimă natural simultaneitatea și participarea comună la gest.
  terminology: „Va trăda” redă adecvat forța contextuală a lui παραδώσει. Nota alternativă trebuie să păstreze mai direct sensul lexical de „a preda/a da în mâna cuiva”, fără adăugarea nespecificată „altora”.
  issues:
