    issue: Formulare greoaie pentru relația dintre gest și „cu Mine”
    rationale: „și-a înmuiat mâna împreună cu Mine” este mai puțin idiomatic și poate fi interpretat ambiguu. „și-a înmuiat mâna odată cu Mine” este clar și natural.
  - severity: low
    issue: Registrul lui „strachină”
    rationale: Termenul este posibil, dar „bol” este alegerea mai neutră și mai uzuală în româna standard modernă pentru un recipient de masă de acest tip.
  - severity: low
    issue: Nota b este prea explicativă
    rationale: „Mă va da pe mâna altora” introduce „altora”, absent din greacă. „Mă va preda” oferă alternativa lexicală fără această explicitare.
