source:
  edition: SBLGNT
  text: καὶ ἐμνήσθη ὁ Πέτρος τοῦ ⸀ῥήματος Ἰησοῦ ⸀εἰρηκότος ὅτι Πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με, καὶ ἐξελθὼν ἔξω ἔκλαυσεν πικρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/075.yaml
  text: 'And Peter remembered the word Jesus had spoken: “Before a rooster crows[a], you will deny me three times.” And he went outside and wept bitterly.'
translation:
  language: ro
  text: 'Și Petru și-a amintit cuvântul pe care îl spusese Isus: „Înainte să cânte cocoșul, te vei lepăda de mine de trei ori.” Și, ieșind afară, a plâns cu amar.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμνήσθη
  choice: și-a amintit
  rationale: Redă natural valoarea aoristului cu sens de aducere-aminte și păstrează desfășurarea narativă.
- source_word: ῥήματος
  choice: cuvântul
  rationale: ῥῆμα desemnează aici ceea ce fusese rostit; „cuvântul” este concis și firesc, iar propoziția relativă îi precizează sensul.
- source_word: εἰρηκότος
  choice: pe care îl spusese
  rationale: Mai-mult-ca-perfectul românesc exprimă anterioritatea participiului perfect și relevanța continuă a spuselor lui Isus.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: Înainte să cânte cocoșul
  rationale: Construcția temporală este idiomatică în română. Deși substantivul grec nu are articol, româna folosește firesc articolul hotărât pentru evenimentul tipic al cântatului cocoșului, fără a implica neapărat un anumit exemplar.
- source_word: τρὶς
  choice: de trei ori
  rationale: Formulare modernă, clară și exactă.
- source_word: ἀπαρνήσῃ
  choice: te vei lepăda de mine
  rationale: În contextul relației cu Isus, „a se lepăda de” redă repudierea sau negarea apartenenței și este o formulare românească firească și gravă.
- source_word: ἐξελθὼν ἔξω
  choice: ieșind afară
  rationale: Păstrează ușoara redundanță emfatică a expresiei grecești, care subliniază îndepărtarea lui Petru de locul scenei.
- source_word: ἔκλαυσεν πικρῶς
  choice: a plâns cu amar
  rationale: Expresie românească naturală și demnă, care transmite durerea profundă fără adaos interpretativ.
theological_decisions:
- issue: Referirea la Isus numai prin nume
  choice: Isus
  alternative: Domnul Isus
  rationale: Textul grec are doar Ἰησοῦ; nu se adaugă un titlu cristologic absent din sursă.
- issue: Sensul lepădării lui Petru
  choice: te vei lepăda de mine
  alternative: mă vei nega
  rationale: Formularea aleasă exprimă repudierea relației sau a asocierii cu Isus, fără a reduce acțiunea la simpla contestare verbală a unei afirmații.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Topica și legăturile sintactice păstrează succesiunea greacă fără rigiditate; nu este necesară o notă privind articolul la „cocoșul”, deoarece articularea este idiomatică în română și nu identifică obligatoriu o pasăre anume.
