  text: ὁ δὲ παραδιδοὺς αὐτὸν ἔδωκεν αὐτοῖς σημεῖον λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/048.yaml
  text: The one betraying him had given them a sign[a], saying, “The one I kiss is he[b]; seize him.”
translation:
  language: ro
  text: 'Cel care Îl trăda le-a dat un semn, spunând: „Cel pe care îl voi săruta, acela este el; prindeți-L!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδιδοὺς
  choice: care Îl trăda
  rationale: În contextul pătimirii, verbul desemnează predarea lui Isus prin trădarea lui Iuda; formularea redă firesc în română forța morală a contextului.
- source_word: σημεῖον
  choice: un semn
  rationale: Termenul denumește aici semnul de recunoaștere convenit dinainte; „semn” păstrează formularea greacă și este limpede în context.
- source_word: Ὃν ἂν φιλήσω
  choice: Cel pe care îl voi săruta
  rationale: Construcția relativă nedefinită cu conjunctiv indică persoana ce urma să fie identificată prin sărut; viitorul românesc redă natural această valoare.
- source_word: αὐτός ἐστιν
  choice: Acela este
  rationale: Pronumele accentuat identifică fără echivoc persoana; „Acela este” păstrează concizia și accentul expresiei grecești.
- source_word: κρατήσατε
  choice: prindeți-L
  rationale: Imperativul cere apucarea și reținerea fermă a lui Isus. „Prindeți-L” este actual și natural, fără a introduce explicit terminologia procedurală a arestării.
theological_decisions:
- issue: Forța morală a participiului παραδιδοὺς cu referire la Iuda
  choice: „care Îl trăda”
  alternative: „care Îl dădea pe mâna lor”
  rationale: Contextul imediat prezintă gestul drept trădare, nu ca o predare neutră; alegerea exprimă această forță narativă fără adaos doctrinar.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Pronumele referitoare la Isus sunt scrise cu majusculă potrivit uzului biblic românesc. Nu sunt necesare note de subsol, deoarece alternativele lexicale nu afectează în mod semnificativ înțelegerea versetului.
