  rationale: 'Revizia aliniază timpul principal la aoristul grecesc și înlocuiește o identificare eliptică printr-o formulare românească modernă, fără a pierde accentul identificator al expresiei αὐτός ἐστιν. Nu sunt necesare note de subsol: variantele „a da pe mâna lor” și „semnal” nu sunt indispensabile pentru înțelegerea versetului.'
