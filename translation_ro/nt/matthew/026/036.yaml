  source_fidelity: 'Textul redă fidel elementele esențiale ale grecei SBLGNT: succesiunea narativă prin „Atunci”, prezentele istorice („vine”, „spune”), însoțirea („cu ei”), caracterul nespecific al lui χωρίον prin „loc”, numele Ghetsimani, porunca de a ședea aici și contrastul spațial „aici ... acolo”. „Până când” păstrează valoarea temporală explicită a lui ἕως οὗ, iar „mă voi duce acolo să mă rog” redă natural participiul ἀπελθών și finalitatea rugăciunii.'
  naturalness: Româna este standard, clară și potrivită registrului narativ. „Ședeți aici” este ușor mai elevat decât „Stați jos aici”, dar rămâne firesc și redă bine imperativul Καθίσατε. Construcția „până când mă voi duce acolo să mă rog” este gramaticală și păstrează deliberat sensul temporal al sursei.
  terminology: „Isus”, „ucenici” și „Ghetsimani” sunt forme românești consacrate. Alegerea „loc”, nu „grădină”, respectă formularea lui Matei și nu importă un detaliu din relatarea ioanină. Nu sunt necesare note; alternativa engleză „while” nu trebuie impusă, deoarece româna păstrează fără dificultate lectura literală „până când”.
