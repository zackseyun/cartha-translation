id: MAT.26.36
reference: Matthew 26:36
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τότε ἔρχεται μετ’ αὐτῶν ὁ Ἰησοῦς εἰς χωρίον λεγόμενον Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς· Καθίσατε αὐτοῦ ἕως οὗ ἀπελθὼν ⸂ἐκεῖ προσεύξωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/036.yaml
  text: Then Jesus comes with them to a place called Gethsemane[a], and he says to the disciples, “Sit here while I go over there and pray.”
translation:
  language: ro
  text: 'Atunci Isus vine cu ei într-un loc numit Ghetsimani și le spune ucenicilor: „Ședeți aici până când mă voi duce acolo să mă rog.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Conector temporal firesc în narațiune, care marchează următorul eveniment.
- source_word: ἔρχεται
  choice: vine
  rationale: Păstrează prezentul istoric grecesc și vivacitatea relatării.
- source_word: μετ’ αὐτῶν
  choice: cu ei
  rationale: Redă direct sensul de însoțire al lui μετά cu genitivul.
- source_word: χωρίον
  choice: loc
  rationale: Termenul poate desemna un loc, un teren sau o proprietate; „loc” păstrează formularea largă a lui Matei fără a importa termenul „grădină” din Ioan.
- source_word: λεγόμενον Γεθσημανί
  choice: numit Ghetsimani
  rationale: Formulare românească naturală pentru indicarea numelui unui loc; numele propriu este transliterat în forma consacrată în română.
- source_word: λέγει τοῖς μαθηταῖς
  choice: le spune ucenicilor
  rationale: Păstrează prezentul istoric și exprimă idiomatic complementul indirect.
- source_word: Καθίσατε αὐτοῦ
  choice: Ședeți aici
  rationale: Imperativul simplu și adverbul local sunt redate direct; „ședeți” are un registru demn și clar în româna standard.
- source_word: ἕως οὗ
  choice: până când
  rationale: Redă explicit valoarea temporală a expresiei grecești, fără a o transforma în „în timp ce”.
- source_word: ἀπελθὼν ἐκεῖ προσεύξωμαι
  choice: mă voi duce acolo să mă rog
  rationale: Transformă natural participiul într-o construcție verbală românească, păstrând deplasarea către un loc distinct și scopul rugăciunii.
theological_decisions:
- issue: Natura locului numit Ghetsimani
  choice: „loc”
  alternative: „grădină”
  rationale: Matei folosește χωρίον, nu termenul explicit pentru „grădină”; alegerea păstrează formularea proprie acestei Evanghelii și nu importă precizarea din Ioan 18:1.
translation_notes:
  register: Română standard modernă, clară și demnă. Prezentul istoric este păstrat prin „vine” și „spune”. Formularea „până când mă voi duce acolo să mă rog” urmează îndeaproape structura și relația temporală din greacă, rămânând naturală în română.
