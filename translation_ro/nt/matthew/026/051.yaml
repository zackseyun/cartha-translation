id: MAT.26.51
reference: Matthew 26:51
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἷς τῶν μετὰ Ἰησοῦ ἐκτείνας τὴν χεῖρα ἀπέσπασεν τὴν μάχαιραν αὐτοῦ καὶ πατάξας τὸν δοῦλον τοῦ ἀρχιερέως ἀφεῖλεν αὐτοῦ τὸ ὠτίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/051.yaml
  text: And behold[a], one of those with Jesus stretched out his hand, drew his sword, and struck the high priest’s servant, and cut off his ear.
translation:
  language: ro
  text: Și iată, unul dintre cei care erau cu Isus și-a întins mâna, și-a scos sabia, l-a lovit pe sclavul[a] marelui preot și i-a tăiat urechea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „slujitorul”.'
    reason: Alternativă lexicală pentru δοῦλος.
lexical_decisions:
- source_word: ἰδοὺ
  choice: iată
  rationale: Păstrează caracterul viu și brusc al marcatorului narativ grecesc și este firesc în registrul biblic românesc actual.
- source_word: εἷς τῶν μετὰ Ἰησοῦ
  choice: unul dintre cei care erau cu Isus
  rationale: Redă clar construcția partitivă fără a preciza identitatea persoanei.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: și-a întins mâna
  rationale: Redă gestul fizic anterior scoaterii sabiei, într-o succesiune firească în română.
- source_word: ἀπέσπασεν τὴν μάχαιραν αὐτοῦ
  choice: și-a scos sabia
  rationale: Formulare românească idiomatică pentru scoaterea armei, fără a adăuga explicit existența unei teci.
- source_word: μάχαιραν
  choice: sabia
  rationale: Echivalentul uzual și suficient de larg; «pumnal» sau «sabie scurtă» ar restrânge nejustificat sensul.
- source_word: πατάξας
  choice: l-a lovit
  rationale: Exprimă direct și natural lovitura violentă.
- source_word: δοῦλον
  choice: sclavul
  rationale: Păstrează statutul social concret exprimat de termenul grecesc, fără îndulcirea lui în textul principal.
- source_word: ἀρχιερέως
  choice: marelui-preot
  rationale: Redarea consacrată în română pentru ἀρχιερεύς la singular.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτίον
  choice: i-a tăiat urechea
  rationale: Exprimă natural rezultatul loviturii cu sabia; sensul literal «i-a luat/îndepărtat urechea» ar fi nefiresc și mai puțin clar.
- source_word: ὠτίον
  choice: urechea
  rationale: Diminutivul grecesc nu impune sensul mai restrâns «lobul urechii».
theological_decisions:
- issue: Redarea lui δοῦλος în contextul social al relatării
  choice: sclav
  alternative: slujitor
  rationale: «Sclav» reflectă mai exact raportul social desemnat de δοῦλος; nota păstrează alternativa tradițională și contextual posibilă «slujitor».
translation_notes:
  register: Română standard modernă, clară și demnă. Succesiunea verbelor finite redă dinamismul narațiunii, iar «iată» păstrează efectul discursiv al originalului.
