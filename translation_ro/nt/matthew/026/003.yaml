id: MAT.26.3
reference: Matthew 26:3
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τότε συνήχθησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως τοῦ λεγομένου Καϊάφα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/003.yaml
  text: Then the chief priests and the elders of the people were gathered in the courtyard of the high priest[a], who was called Caiaphas[b],
translation:
  language: ro
  text: Atunci, preoții conducători și bătrânii poporului s-au adunat[a] în curtea[b] marelui-preot, numit Caiafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „au fost adunați”. Verbul grecesc are formă pasivă.
    reason: lexical_alternative
  - marker: b
    text: Termenul grecesc poate desemna curtea interioară a unei reședințe mari, inclusiv curtea unui palat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Redă firesc marcatorul temporal care introduce următorul eveniment din succesiune.
- source_word: συνήχθησαν
  choice: s-au adunat
  rationale: Verbul grecesc este pasiv ca formă, dar poate avea sens intranzitiv/colectiv; formularea românească este naturală și păstrează ideea reunirii grupului.
- source_word: ἀρχιερεῖς
  choice: preoții conducători
  rationale: În contextul Evangheliilor desemnează autoritățile preoțești de rang înalt, nu mai mulți deținători simultani ai funcției unice de mare-preot.
- source_word: πρεσβύτεροι τοῦ λαοῦ
  choice: bătrânii poporului
  rationale: Redare directă a construcției genitivale și denumire inteligibilă pentru conducătorii recunoscuți ai poporului.
- source_word: εἰς τὴν αὐλὴν
  choice: în curtea
  rationale: Cu verbul reunirii, româna exprimă natural locul rezultat prin „în”; αὐλή poate desemna curtea interioară a unei reședințe mari.
- source_word: τοῦ ἀρχιερέως
  choice: marelui-preot
  rationale: Redă precis titlul unic al titularului funcției din context.
- source_word: τοῦ λεγομένου Καϊάφα
  choice: numit Caiafa
  rationale: Formulare românească firească și apropiată de participiul grec de identificare.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Preoții conducători” evită impresia greșită că ar fi existat simultan mai mulți mari-preoți, iar „marele-preot” păstrează distinct titlul titularului funcției.
