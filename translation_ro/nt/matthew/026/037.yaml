source:
  edition: SBLGNT
  text: καὶ παραλαβὼν τὸν Πέτρον καὶ τοὺς δύο υἱοὺς Ζεβεδαίου ἤρξατο λυπεῖσθαι καὶ ἀδημονεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/037.yaml
  text: And taking Peter and the two sons of Zebedee with him[a], he began to be sorrowful and deeply distressed.
translation:
  language: ro
  text: Și, luându-i cu el pe Petru și pe cei doi fii ai lui Zebedeu, a început să se întristeze și să fie profund tulburat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „a început să fie mâhnit și tulburat”.'
    reason: Alternativă lexicală pentru λυπεῖσθαι și ἀδημονεῖν, păstrând cele două infinitive coordonate din greacă.
lexical_decisions:
- source_word: παραλαβὼν
  choice: luându-i cu el
  rationale: Participiul aorist arată că Isus i-a luat alături de sine pe acești însoțitori aleși; formularea este firească în româna actuală și păstrează sensul relațional.
- source_word: τοὺς δύο υἱοὺς Ζεβεδαίου
  choice: cei doi fii ai lui Zebedeu
  rationale: Redă exact identificarea din greacă, fără a introduce aici numele Iacov și Ioan.
- source_word: ἤρξατο
  choice: a început
  rationale: Păstrează explicit sensul ingresiv al verbului grecesc urmat de infinitive.
- source_word: λυπεῖσθαι
  choice: să fie cuprins de întristare
  rationale: Exprimă trăirea reală a durerii sufletești într-un registru solemn, clar și natural.
- source_word: ἀδημονεῖν
  choice: de o adâncă neliniște
  rationale: Redă tulburarea interioară intensă indicată de verb, fără a o amplifica până la disperare sau teroare.
- source_word: καὶ ... καὶ
  choice: și ... și
  rationale: Păstrează coordonarea și acumularea din textul grecesc, într-o sintaxă românească firească.
theological_decisions:
- issue: Descrierea stării emoționale a lui Isus în raport cu cristologia
  choice: Am redat direct ambele verbe ca întristare reală și tulburare interioară profundă.
  alternative: Atenuarea vulnerabilității emoționale ori intensificarea ei nejustificată ca „teroare” sau „disperare”.
  rationale: Textul afirmă suferința umană autentică a lui Isus. Traducerea păstrează această tensiune fără să diminueze umanitatea lui și fără să depășească dovezile lexicale.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Construcția „cuprins de întristare și de o adâncă neliniște” evită atât exprimarea plată, cât și dramatizarea excesivă; nota păstrează o redare mai formală a structurii grecești.
