  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: ro
  text: Și, după ce au cântat laude[a], au ieșit spre Muntele Măslinilor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „după ce au cântat un imn de laudă”. Verbul grecesc se poate referi în general la cântarea laudelor; redarea „un imn de laudă” se potrivește contextului mesei și uzului obișnuit, fără ca textul grec să precizeze o anumită cântare.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμνήσαντες
  choice: după ce au cântat cântarea de laudă
  rationale: Participiul aorist indică o acțiune anterioară verbului principal. Formularea redă natural ideea de a cânta laudă și se potrivește contextului mesei, fără a identifica în mod nejustificat o anumită cântare.
- source_word: ἐξῆλθον
  choice: au ieșit
  rationale: Redare directă și idiomatică a verbului ἐξέρχομαι în context narativ.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: spre Muntele Măslinilor
  rationale: «Muntele Măslinilor» este denumirea geografică consacrată în română, iar «spre» redă firesc deplasarea către acel loc.
- source_word: καὶ
  choice: Și
  rationale: Păstrează coordonarea simplă a narațiunii grecești, fără să adauge o nuanță temporală explicită.
