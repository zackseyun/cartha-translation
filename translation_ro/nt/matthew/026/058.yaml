id: MAT.26.58
reference: Matthew 26:58
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἠκολούθει αὐτῷ ἀπὸ μακρόθεν ἕως τῆς αὐλῆς τοῦ ἀρχιερέως, καὶ εἰσελθὼν ἔσω ἐκάθητο μετὰ τῶν ὑπηρετῶν ἰδεῖν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/058.yaml
  text: But Peter was following him from a distance[a], as far as the courtyard of the high priest. And after going inside[b], he sat with the officers to see the outcome.
translation:
  language: ro
  text: Dar Petru îl urma de la distanță până la curtea marelui preot. După ce a intrat înăuntru, stătea împreună cu slujitorii[a], ca să vadă deznodământul[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „slujbașii”, „însoțitorii” ori „paznicii”. Termenul grecesc poate desemna persoane aflate în serviciul unei autorități, iar rolul lor exact nu este precizat aici.
    reason: lexical_alternative
  - marker: b
    text: Literal, „sfârșitul”; în acest context, expresia se poate referi la rezultatul celor ce aveau să i se întâmple lui Isus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: îl urma
  rationale: Imperfectul grecesc descrie acțiunea în desfășurare; imperfectul românesc o redă firesc și exact.
- source_word: ἀπὸ μακρόθεν
  choice: de la distanță
  rationale: Formulare românească actuală, care păstrează sensul distanței fizice.
- source_word: ἕως τῆς αὐλῆς
  choice: până la curtea
  rationale: „Până la” redă limita exprimată de ἕως, iar „curtea” desemnează spațiul interior împrejmuit al reședinței.
- source_word: τοῦ ἀρχιερέως
  choice: marelui preot
  rationale: Echivalentul consacrat și clar în contextul relatării patimilor.
- source_word: εἰσελθὼν ἔσω
  choice: după ce a intrat înăuntru
  rationale: Redă anterioritatea participiului față de verbul principal și păstrează adverbul explicit ἔσω.
- source_word: ἐκάθητο
  choice: stătea
  rationale: Imperfectul indică o stare sau acțiune continuă; „stătea” evită transformarea ei într-un eveniment punctual.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: împreună cu slujitorii
  rationale: „Slujitorii” păstrează sensul larg al unor subordonați ori asistenți ai autorităților, fără a-i identifica nejustificat numai drept paznici.
- source_word: ἰδεῖν
  choice: ca să vadă
  rationale: Infinitivul exprimă scopul, redat natural în română prin construcția „ca să”.
- source_word: τὸ τέλος
  choice: deznodământul
  rationale: În context, termenul indică rezultatul final al celor petrecute; „deznodământul” este clar, demn și păstrează ideea de final.
theological_decisions: []
