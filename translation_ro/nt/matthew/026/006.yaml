  text: Τοῦ δὲ Ἰησοῦ γενομένου ἐν Βηθανίᾳ ἐν οἰκίᾳ Σίμωνος τοῦ λεπροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/006.yaml
  text: While Jesus was in Bethany[a], in the house of Simon the leper[b],
translation:
  language: ro
  text: Pe când Isus era în Betania[a], în casa lui Simon leprosul[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „când Isus era în Betania”. Greaca folosește o construcție care fixează cadrul temporal al relatării.
    reason: lexical_alternative
  - marker: b
    text: „Leprosul” redă termenul grecesc folosit ca epitet pentru identificarea lui Simon; acesta nu precizează dacă Simon avea atunci afecțiunea sau o avusese în trecut. Termenul antic putea acoperi afecțiuni ale pielii mai diverse decât lepra în sensul medical modern.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γενομένου
  choice: Pe când Isus era
  rationale: Genitivul absolut fixează cadrul temporal. Formularea românească redă natural valoarea circumstanțială, fără traducerea rigidă a lui γίνομαι prin „a ajunge să fie”.
- source_word: δὲ
  choice: redat prin tranziția implicită a construcției
  rationale: δέ marchează aici o trecere narativă ușoară, nu un contrast puternic; în română, introducerea unui „iar” sau „dar” ar încărca inutil enunțul.
- source_word: ἐν Βηθανίᾳ
  choice: în Betania
  rationale: Redare locativă directă a prepoziției ἐν și a toponimului.
- source_word: ἐν οἰκίᾳ Σίμωνος
  choice: în casa lui Simon
  rationale: οἰκία indică locuința fizică, iar genitivul Σίμωνος exprimă posesia; construcția cu „lui” este firească în româna modernă.
- source_word: τοῦ λεπροῦ
  choice: Leprosul
  rationale: Păstrează epitetul identificator concis din greacă. Termenul sursă poate desemna o categorie mai largă de afecțiuni cutanate decât boala Hansen și nu precizează dacă starea era prezentă sau trecută.
theological_decisions:
- issue: Implicația epitetului atribuit lui Simon
  choice: Simon Leprosul
  alternative: Simon, care fusese lepros; Simon, omul cu o boală de piele
  rationale: Textul grecesc oferă doar un epitet identificator și nu afirmă nici că Simon suferea încă de această afecțiune, nici că fusese vindecat. Traducerea nu adaugă o cronologie sau un diagnostic modern.
translation_notes:
  register: Română standard modernă, clară și demnă. „Pe când” păstrează caracterul circumstanțial al cadrului temporal, iar „Simon Leprosul” funcționează natural ca epitet, fără a elimina ambiguitatea textului-sursă.
