source:
  edition: SBLGNT
  text: τότε ἤρξατο καταθεματίζειν καὶ ὀμνύειν ὅτι Οὐκ οἶδα τὸν ἄνθρωπον. καὶ ⸀εὐθέως ἀλέκτωρ ἐφώνησεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/074.yaml
  text: Then he began to curse and to swear[a], “I do not know the man.” And immediately a rooster crowed.
translation:
  language: ro
  text: 'Atunci a început să invoce blesteme[a] și să jure: „Nu cunosc omul.” Și îndată a cântat un cocoș.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Verbul poate însemna „a rosti” sau „a chema blesteme”. În contextul jurământului, sensul probabil este că Petru chema blesteme asupra lui însuși pentru a-și întări lepădarea; textul grecesc nu precizează explicit asupra cui erau blestemele.
    reason: Clarifică sensul probabil al lui καταθεματίζειν în contextul jurământului, păstrând ambiguitatea privind obiectul blestemelor.
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Redă natural succesiunea temporală și marchează următoarea etapă a lepădării lui Petru.
- source_word: ἤρξατο
  choice: a început
  rationale: Păstrează valoarea ingresivă a verbului și intensificarea acțiunii.
- source_word: καταθεματίζειν
  choice: să invoce blesteme
  rationale: Exprimă rostirea sau chemarea unor blesteme în contextul unui jurământ, fără a preciza în text asupra cui erau îndreptate.
- source_word: ὀμνύειν
  choice: să jure
  rationale: Redă direct și firesc actul solemn al jurării.
- source_word: ὅτι
  choice: introducerea vorbirii directe
  rationale: Conjuncția introduce conținutul jurământului; citarea directă este clară și naturală în română.
- source_word: Οὐκ οἶδα
  choice: Nu-l cunosc
  rationale: În acest context, οἶδα exprimă cunoașterea sau recunoașterea unei persoane; pronumele anticipativ este idiomatic în română.
- source_word: τὸν ἄνθρωπον
  choice: pe omul acesta
  rationale: Construcția românească identifică persoana despre care se vorbește; „acesta” redă firesc referința contextuală fără a-i rosti numele.
- source_word: καὶ εὐθέως
  choice: Și îndată
  rationale: Păstrează legătura narativă și caracterul imediat al împlinirii prezicerii.
- source_word: ἀλέκτωρ
  choice: un cocoș
  rationale: Substantivul grecesc este nearticulat, iar „un cocoș” este formularea românească naturală.
- source_word: ἐφώνησεν
  choice: a cântat
  rationale: „A cânta” este verbul idiomatic românesc pentru strigătul cocoșului.
theological_decisions:
- issue: Sensul lui καταθεματίζειν în lepădarea lui Petru
  choice: Textul spune că Petru a început să invoce blesteme, fără a specifica explicit destinatarul lor.
  alternative: Petru a chemat blesteme asupra sa pentru a-și întări jurământul; ori a început pur și simplu să blesteme.
  rationale: Asocierea cu ὀμνύειν susține un context de jurământ și posibilă autoimprecație, dar pronumele reflexiv nu apare explicit în greacă. Formularea principală păstrează această tensiune, iar nota explică sensul probabil fără a afirma că Petru l-a blestemat pe Isus.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. „Îndată” păstrează concizia și solemnitatea textului, iar „a cântat un cocoș” este expresia românească obișnuită.
