id: MAT.26.18
reference: Matthew 26:18
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑπάγετε εἰς τὴν πόλιν πρὸς τὸν δεῖνα καὶ εἴπατε αὐτῷ· Ὁ διδάσκαλος λέγει· Ὁ καιρός μου ἐγγύς ἐστιν· πρὸς σὲ ποιῶ τὸ πάσχα μετὰ τῶν μαθητῶν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/018.yaml
  text: He said[a], “Go into the city to a certain man and tell him, ‘The Teacher says, “My time is near[c][b]. I am keeping the Passover with you with my disciples.”’”
translation:
  language: ro
  text: 'El le-a zis: „Mergeți în cetate la un anumit om și spuneți-i: «Învățătorul spune: ‘Vremea Mea este aproape. La tine voi sărbători Paștele împreună cu ucenicii Mei.’»”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Mergeți
  rationale: Imperativul exprimă simplu deplasarea cerută; „Mergeți” este firesc și fidel în româna actuală.
- source_word: πρὸς τὸν δεῖνα
  choice: la un anumit om
  rationale: δεῖνα indică o persoană anume, lăsată intenționat nenominalizată; formularea păstrează atât caracterul precis, cât și anonimatul.
- source_word: Ὁ διδάσκαλος
  choice: Învățătorul
  rationale: Redă titlul διδάσκαλος în registrul biblic românesc consacrat, fără a-l confunda cu ideea de stăpân.
- source_word: Ὁ καιρός μου ἐγγύς ἐστιν
  choice: Vremea Mea este aproape
  rationale: καιρός desemnează aici un timp semnificativ, dar versetul nu îi precizează complet sfera; „vremea” păstrează deschiderea semantică.
- source_word: πρὸς σὲ
  choice: la tine
  rationale: Păstrează formularea relațional-locativă a grecei fără să introducă explicit „casa”, termen absent din text.
- source_word: ποιῶ τὸ πάσχα
  choice: voi sărbători Paștele
  rationale: Expresia idiomatică ποιεῖν τὸ πάσχα înseamnă a ține sau a celebra Paștele; viitorul românesc redă natural prezentul cu valoare de intenție apropiată.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: împreună cu ucenicii Mei
  rationale: „Ucenicii” este echivalentul firesc și consacrat pentru μαθηταί, iar „împreună cu” evită succesiunea greoaie a două construcții cu „cu”.
theological_decisions:
- issue: Sensul afirmației despre apropierea lui καιρός
  choice: Vremea Mea este aproape
  alternative: Timpul Meu hotărât este aproape; Ceasul Meu este aproape
  rationale: Textul indică iminența, fără a limita explicit referința la moartea lui Isus, la masa pascală sau la împlinirea mai largă a misiunii Sale. Redarea aleasă păstrează această tensiune.
- issue: Locul celebrării exprimat prin πρὸς σὲ
  choice: La tine voi sărbători Paștele
  alternative: În casa ta voi sărbători Paștele; Voi sărbători Paștele cu tine
  rationale: „La tine” conservă ambiguitatea dintre proximitatea personală și locul găzduit, fără să adauge explicit o casă și fără să sugereze neapărat că omul ia parte la masă.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. S-a folosit „cetate” pentru registrul narativ biblic și „Învățătorul/Mea/Mei” cu majusculă reverențială. Punctuația cu citate imbricate clarifică mesajul transmis.
