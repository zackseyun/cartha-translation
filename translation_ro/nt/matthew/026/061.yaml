id: MAT.26.61
reference: Matthew 26:61
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: εἶπαν· Οὗτος ἔφη· Δύναμαι καταλῦσαι τὸν ναὸν τοῦ θεοῦ καὶ διὰ τριῶν ἡμερῶν ⸀οἰκοδομῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/061.yaml
  text: They said[a], “This man said[b], ‘I am able to destroy the temple of God and to build it in three days.’”
translation:
  language: ro
  text: 'Ei au spus: „Omul acesta a zis[b]: «Pot să dărâm Templul lui Dumnezeu și să-l construiesc în trei zile[a]».”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „în decurs de trei zile”. Expresia grecească poate indica finalizarea acțiunii în acel interval.
    reason: lexical_alternative
  - marker: b
    text: Vezi Ioan 2:19–21, unde cuvântul lui Isus despre templu este identificat ca referindu-se la trupul său.
    reason: cross_reference
lexical_decisions:
- source_word: εἶπαν
  choice: Ei au spus
  rationale: Aoristul prezintă acuzația martorilor ca pe un eveniment trecut punctual; formularea este firească în narațiunea românească.
- source_word: Οὗτος
  choice: Omul acesta
  rationale: Păstrează forța deictică, ușor disprețuitoare, a exprimării din cadrul acuzației, fără rigiditatea lui „acesta” folosit singur.
- source_word: ἔφη
  choice: a zis
  rationale: Redă simplu vorbirea pretinsă, fără a adăuga nuanța mai puternică din „a declarat” sau „a pretins”.
- source_word: Δύναμαι
  choice: Pot
  rationale: Exprimă direct și natural capacitatea indicată de verbul grec; „sunt în stare” ar putea sugera în română o nuanță provocatoare suplimentară.
- source_word: καταλῦσαι
  choice: să dărâm
  rationale: În contextul unei clădiri, verbul înseamnă a desface sau a distruge; „a dărâma” este concret și idiomatic în opoziție cu zidirea.
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: Templul lui Dumnezeu
  rationale: „Templul” este termenul românesc clar pentru sanctuarul avut în vedere în acuzație, iar genitivul este redat firesc prin „lui Dumnezeu”.
- source_word: διὰ τριῶν ἡμερῶν
  choice: în trei zile
  rationale: Construcția cu διά și genitivul indică un interval de timp; formularea românească păstrează ambiguitatea dintre realizarea în cursul intervalului și la încheierea lui.
- source_word: οἰκοδομῆσαι
  choice: să-l zidesc
  rationale: „A zidi” corespunde bine construirii unui templu și creează opoziția firească „să dărâm… să zidesc”; pronumele „-l” reia obiectul subînțeles din greacă.
theological_decisions:
- issue: Referentul expresiei „Templul lui Dumnezeu” în acuzație
  choice: Acuzația este tradusă la nivelul ei explicit, ca referire la Templu, fără identificarea referentului cu trupul lui Isus în textul principal.
  alternative: Traducerea ar putea explicita trupul lui Isus sau învierea pe baza relatării din Ioan.
  rationale: Matei redă aici mărturia acuzatorilor. Identificarea din Ioan 2:19–21 este relevantă ca trimitere, dar nu trebuie introdusă în formularea acuzației și nici folosită pentru a elimina tensiunea dintre relatări.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. „Omul acesta” păstrează caracterul acuzator al depoziției, iar „să dărâm… să-l zidesc” formează o opoziție concretă și naturală. Majuscula din „Templul” marchează clădirea cultică unică din Ierusalim.
