  text: τί ὑμῖν δοκεῖ; οἱ δὲ ἀποκριθέντες εἶπαν· Ἔνοχος θανάτου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/066.yaml
  text: What do you think? They answered[a], “He is deserving of death.”
translation:
  language: ro
  text: '„Ce părere aveți?” Ei au răspuns[a]: „Este vrednic de moarte.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Este vinovat de moarte”, „Este pasibil de pedeapsa cu moartea” ori „Merită moartea”. Expresia grecească reprezintă un verdict juridic.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Ce părere aveți?
  rationale: Expresia cu δοκέω și dativul ὑμῖν cere opinia sau judecata interlocutorilor. Formularea este firească în româna actuală și păstrează caracterul direct al întrebării.
- source_word: οἱ δὲ ἀποκριθέντες εἶπαν
  choice: Ei au răspuns
  rationale: Participiul urmat de εἶπαν este redat natural printr-un singur verb finit. δέ are aici o funcție narativă slab conectivă și nu necesită un adversativ explicit în română.
- source_word: Ἔνοχος
  choice: vrednic
  rationale: În construcția juridică ἔνοχος θανάτου, termenul indică faptul că persoana este socotită vinovată și pasibilă de pedeapsa cu moartea. „Vrednic de moarte” este o formulare românească compactă și inteligibilă, fără a transforma verdictul consiliului într-o afirmație despre vinovăția lui Isus înaintea lui Dumnezeu.
- source_word: θανάτου
  choice: de moarte
  rationale: Genitivul exprimă lucrul cu privire la care persoana este declarată ἔνοχος. „De moarte”, în expresia consacrată „vrednic de moarte”, păstrează formularea compactă.
- source_word: ἐστίν
  choice: Este
  rationale: Copula este păstrată, iar subiectul masculin este înțeles firesc din contextul românesc.
theological_decisions:
- issue: Forța juridică a verdictului consiliului
  choice: Este vrednic de moarte
  alternative: Este vinovat și pasibil de moarte / Merită moartea
  rationale: Redarea păstrează caracterul de verdict al afirmației și o atribuie celor care răspund, fără a afirma implicit că verdictul lor exprimă judecata lui Dumnezeu. Nota consemnează sensurile juridice posibile ale expresiei grecești.
translation_notes:
  register: Română standard modernă, directă și demnă. Întrebarea este formulată idiomatic, iar verdictul păstrează concizia și tensiunea juridică a originalului.
