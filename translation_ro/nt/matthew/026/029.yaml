    rationale: Adjectivul „nou” poate rămâne în text pentru a reflecta καινόν, însă o virgulă înainte de „împreună cu voi” delimitează mai clar complementul de însoțire și evită o lectură potențial greoaie, fără a elimina ambiguitatea lexicală.
