  source_fidelity: 'Textul redă fidel elementele principale: δέ („Dar”), negația viitoare emfatică οὐ μή („nu voi mai bea nicidecum”), reperul temporal ἀπ’ ἄρτι („de acum înainte”), idiomul „rod al viței”, ziua demonstrativă viitoare și cadrul „în Împărăția Tatălui Meu”. Menținerea lui „nou” și nota aferentă păstrează, fără a o soluționa doctrinar, ambiguitatea lui καινόν.'
  naturalness: „Îl voi bea nou împreună cu voi” este inteligibil, dar succesiunea fără virgulă este ușor greoaie în româna standard actuală și poate face ca „nou” să pară atașat neclar fie de actul de a bea, fie de participarea comună. O punctuație și o ordine minim ajustate fac construcția mai lizibilă, păstrând valoarea predicativă ambiguă a adjectivului.
  terminology: „Rod al viței” este o redare potrivită și fidelă pentru γένημα τῆς ἀμπέλου; nu este necesară substituirea cu „vin”. „Împărăția Tatălui Meu” este solemnă și acceptabilă în registrul biblic românesc. Nota redă corect opțiunile principale pentru καινόν, inclusiv posibilitatea „din nou”.
