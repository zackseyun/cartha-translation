id: MAT.26.29
reference: Matthew 26:29
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: λέγω δὲ ⸀ὑμῖν, οὐ μὴ πίω ἀπ’ ἄρτι ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω μεθ’ ὑμῶν καινὸν ἐν τῇ βασιλείᾳ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/029.yaml
  text: But I tell you[a], from now on I will certainly not drink from this fruit of the vine until that day when I drink it new with you in the kingdom of my Father.
translation:
  language: ro
  text: 'Dar vă spun: de acum înainte nu voi mai bea nicidecum din acest rod al viței până în ziua aceea când îl voi bea nou[a], împreună cu voi, în Împărăția Tatălui Meu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „din nou” ori „într-un mod nou”; adjectivul grecesc poate exprima o noutate de natură sau de calitate.
    reason: alternativă lexicală care păstrează ambiguitatea lui καινὸν
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Dar vă spun
  rationale: δέ marchează aici o tranziție ușor adversativă; formularea este firească în româna actuală și nu exagerează contrastul.
- source_word: οὐ μὴ πίω
  choice: nu voi mai bea nicidecum
  rationale: Construcția οὐ μή cu conjunctivul aorist exprimă o negație viitoare emfatică; „nicidecum” păstrează accentul, iar „mai” se leagă natural de limita temporală care urmează.
- source_word: ἀπ’ ἄρτι
  choice: de acum înainte
  rationale: Redă clar punctul de pornire prezent și continuitatea până la momentul viitor indicat.
- source_word: ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου
  choice: din acest rod al viței
  rationale: Păstrează idiomul grecesc și referirea la conținutul paharului fără a-l înlocui interpretativ cu „vin”.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: până în ziua aceea
  rationale: Păstrează demonstrativul și orientarea către o zi viitoare precisă.
- source_word: ὅταν αὐτὸ πίνω
  choice: când îl voi bea
  rationale: ὅταν cu conjunctivul indică aici evenimentul viitor; pronumele masculin românesc reia firesc „rod”.
- source_word: καινὸν
  choice: nou
  rationale: Redarea directă păstrează ambiguitatea dintre noutatea de ordin calitativ și ideea reluării într-un mod nou.
- source_word: μεθ’ ὑμῶν
  choice: împreună cu voi
  rationale: Exprimă limpede participarea comună și sună natural în contextul mesei.
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρός μου
  choice: în Împărăția Tatălui Meu
  rationale: Urmează îndeaproape structura greacă și păstrează formularea solemnă; majusculele sunt o convenție editorială românească pentru referirea la Dumnezeu.
theological_decisions:
- issue: Dacă băutura din pahar trebuie numită explicit „vin”
  choice: Este păstrată expresia „rod al viței”
  alternative: vin
  rationale: Textul grecesc folosește γένημα τῆς ἀμπέλου, nu οἶνος. Păstrarea idiomului respectă formularea sursă și evită adăugarea unei precizări care nu este exprimată lexical.
- issue: Sensul lui καινὸν în masa viitoare din Împărăție
  choice: „nou” în text, cu explicarea alternativei în notă
  alternative: din nou; într-un mod nou
  rationale: Adjectivul poate indica noutatea de natură sau calitate, iar construcția poate fi înțeleasă și ca o participare reînnoită. Versetul nu precizează pe deplin nuanța, astfel că traducerea nu o rezolvă interpretativ.
translation_notes:
  register: Registru modern, demn și accesibil. Formularea păstrează idiomul biblic „rod al viței”, evită arhaisme precum „nu voi mai bea nicicând” și menține accentul negației grecești prin „nicidecum”.
