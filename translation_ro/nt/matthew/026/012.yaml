  text: βαλοῦσα γὰρ αὕτη τὸ μύρον τοῦτο ἐπὶ τοῦ σώματός μου πρὸς τὸ ἐνταφιάσαι με ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/012.yaml
  text: For when she poured this perfume on my body[b][a], she did it to prepare me for burial.
translation:
  language: ro
  text: Căci, când a turnat acest parfum pe trupul Meu, a făcut-o ca să Mă pregătească pentru înmormântare.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „pentru înmormântarea Mea”. Verbul grecesc poate include sensul pregătirii unui trup pentru înmormântare.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσα
  choice: turnând
  rationale: Participiul aorist al lui βάλλω descrie aici aplicarea lichidului parfumat; „turnând” este firesc în română și păstrează relația circumstanțială cu verbul principal.
- source_word: γὰρ
  choice: Căci
  rationale: Introduce explicația dată de Isus pentru fapta femeii și păstrează legătura argumentativă cu versetul anterior.
- source_word: μύρον
  choice: parfumul
  rationale: În context, μύρον desemnează un ulei sau un preparat aromat prețios. „Parfum” este clar și natural în româna actuală, fără a sugera o consistență solidă.
- source_word: ἐπὶ τοῦ σώματός μου
  choice: pe trupul Meu
  rationale: ἐπί cu genitivul indică aici aplicarea pe suprafața trupului; formularea românească este directă și firească.
- source_word: πρὸς τὸ ἐνταφιάσαι με
  choice: ca să Mă pregătească pentru înmormântare
  rationale: Construcția πρὸς cu infinitiv articulat exprimă scopul, iar ἐνταφιάζω poate include pregătirea trupului în vederea înmormântării.
- source_word: ἐποίησεν
  choice: ea a făcut lucrul acesta
  rationale: Redă explicit verbul principal ποιέω și leagă acțiunea femeii de scopul ei, evitând ambiguitatea unui simplu „a făcut-o”.
- source_word: αὕτη
  choice: ea
  rationale: Referentul feminin este clar din context; pronumele este mai natural în română decât o redare rigidă precum „aceasta”.
theological_decisions:
- issue: Sensul lui ἐνταφιάζω în raport cu moartea lui Isus
  choice: Fapta femeii este prezentată drept pregătire a lui Isus pentru înmormântare.
  alternative: Fapta este făcută simplu „pentru înmormântarea Mea”, fără explicitarea pregătirii trupului.
  rationale: Verbul poate desemna pregătirea funerară sau punerea în mormânt. Textul principal explicitează nuanța de pregătire, iar nota păstrează alternativa mai compactă, fără a adăuga afirmații doctrinare.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. „Trup” se potrivește registrului biblic fără a fi arhaic. Majusculele reverențiale pentru pronumele referitoare la Isus sunt folosite consecvent în acest verset.
