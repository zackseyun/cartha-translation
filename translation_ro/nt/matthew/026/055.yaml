id: MAT.26.55
reference: Matthew 26:55
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ὥρᾳ εἶπεν ὁ Ἰησοῦς τοῖς ὄχλοις· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με; καθ’ ⸀ἡμέραν ⸂ἐν τῷ ἱερῷ ἐκαθεζόμην διδάσκων⸃ καὶ οὐκ ἐκρατήσατέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/055.yaml
  text: At that hour Jesus said to the crowds[a], “Have you come out with swords and clubs to arrest me, as against a robber? Day after day I was sitting in the temple teaching[b], and you did not seize me.”
translation:
  language: ro
  text: 'În ceasul acela, Isus le-a zis mulțimilor: „Ați ieșit cu săbii și ciomege ca să mă arestați, ca pe un tâlhar[a]? Zi de zi ședeam în templu, dând învățătură, și nu m-ați prins.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „bandit” ori „răzvrătit”; termenul grecesc poate desemna mai mult decât un hoț mărunt, inclusiv un tâlhar violent sau, în unele contexte, un insurgent.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: În ceasul acela
  rationale: Redă îndeaproape expresia temporală grecească și păstrează caracterul imediat al scenei, într-o formulare românească firească și demnă.
- source_word: τοῖς ὄχλοις
  choice: mulțimilor
  rationale: Păstrează pluralul substantivului grecesc ὄχλοις.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: ca pe un tâlhar
  rationale: Este echivalentul românesc firesc al construcției și prezintă felul în care grupul înarmat îl tratează pe Isus, fără a restrânge nejustificat termenul la o interpretare politică.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: cu săbii și ciomege
  rationale: În acest context, ξύλα desemnează obiecte de lemn folosite ca arme; „ciomege” exprimă funcția lor mai limpede decât simplul „bețe”.
- source_word: συλλαβεῖν με
  choice: ca să mă arestați
  rationale: Contextul este cel al unei capturări organizate de autorități; „a aresta” exprimă natural scopul acțiunii.
- source_word: καθ’ ἡμέραν
  choice: Zi de zi
  rationale: Păstrează sensul distributiv și accentul retoric al expresiei grecești.
- source_word: ἐν τῷ ἱερῷ
  choice: în templu
  rationale: ἱερόν se referă la ansamblul templului, nu doar la sanctuarul interior; în româna curentă, „templu” acoperă natural sensul contextual.
- source_word: ἐκαθεζόμην διδάσκων
  choice: ședeam în templu, dând învățătură
  rationale: Imperfectul indică o activitate repetată sau continuă, iar participiul arată acțiunea concomitentă. Formularea evită ambiguitatea verbului românesc „a învăța”, care poate însemna și a dobândi cunoștințe.
- source_word: οὐκ ἐκρατήσατέ με
  choice: nu m-ați prins
  rationale: Redă natural sensul lui κρατέω din context și păstrează o diferență lexicală față de συλλαβεῖν, tradus anterior prin „a aresta”.
theological_decisions:
- issue: Întinderea semantică a termenului λῃστής
  choice: tâlhar
  alternative: bandit; răzvrătit
  rationale: Termenul poate desemna un jefuitor violent sau un bandit și, în anumite contexte, un răzvrătit. Versetul subliniază în primul rând tratarea lui Isus ca un infractor primejdios, fără a impune aici un sens politic precis; alternativele sunt păstrate în nota de subsol.
translation_notes:
  register: Română standard modernă, clară și demnă. Construcția „ca pe un tâlhar” este idiomatică, iar „ședeam... dând învățătură” păstrează atât postura exprimată de text, cât și aspectul continuu al acțiunii.
