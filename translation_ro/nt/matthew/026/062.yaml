  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Οὐδὲν ἀποκρίνῃ; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/062.yaml
  text: And the high priest stood up and said to him[b][a], “Do you give no answer? What is it that these men are testifying against you?”
translation:
  language: ro
  text: 'Și marele preot s-a ridicat și i-a zis: „Nu răspunzi nimic? Ce mărturisesc aceștia împotriva ta?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: s-a ridicat
  rationale: Redă firesc participiul aorist și acțiunea fizică a marelui preot înainte de a vorbi, păstrând forța dramatică a scenei.
- source_word: ὁ ἀρχιερεὺς
  choice: marele preot
  rationale: Echivalentul românesc consacrat și exact pentru această funcție iudaică.
- source_word: εἶπεν αὐτῷ
  choice: i-a zis
  rationale: Păstrează pronumele din greacă și folosește o formulare narativă românească naturală.
- source_word: Οὐδὲν ἀποκρίνῃ;
  choice: Nu răspunzi nimic?
  rationale: Redare directă și idiomatică a întrebării, fără a transforma construcția într-o afirmație despre lipsa unui răspuns.
- source_word: τί
  choice: Ce
  rationale: Păstrează forma simplă și directă a pronumelui interogativ grec, fără o construcție emfatică suplimentară.
- source_word: οὗτοί
  choice: aceștia
  rationale: Demonstrativul masculin plural îi indică direct pe martorii prezenți; contextul face inutilă adăugarea substantivului «oameni».
- source_word: σου ... καταμαρτυροῦσιν
  choice: mărturisesc ... împotriva ta
  rationale: Păstrează sensul juridic adversativ al verbului compus și al genitivului personal, precum și aspectul prezent al mărturiei.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Formularea păstrează succesiunea și tensiunea celor două întrebări, evitând atât rigiditatea literalistă, cât și explicitările nenecesare.
