  text: μετὰ δὲ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/032.yaml
  text: But after I am raised up[a], I will go ahead of you into Galilee.
translation:
  language: ro
  text: Dar după ce voi fi înviat[a], voi merge înaintea voastră în Galileea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „după ce voi învia”. În greacă se folosește o formă pasivă: „după ce voi fi înviat”.'
    reason: alternativă lexicală
lexical_decisions:
- source_word: μετὰ δὲ
  choice: Dar, după ce
  rationale: Construcția μετά cu infinitiv articulat exprimă succesiunea temporală („după ce”), iar δέ păstrează contrastul ușor cu anunțul anterior despre căderea ucenicilor.
- source_word: τὸ ἐγερθῆναί με
  choice: voi fi înviat
  rationale: Infinitivul aorist pasiv al lui ἐγείρω, cu με ca subiect în acuzativ, cere sensul „după ce voi fi înviat”. Pasivul este păstrat și lasă implicită, fără a o explicita, agentivitatea divină.
- source_word: προάξω
  choice: voi merge înaintea
  rationale: Redă sensul de a merge înaintea cuiva, fără a impune nuanța mai specifică de conducere.
- source_word: ὑμᾶς
  choice: voastră
  rationale: Pronumele este la persoana a doua plural și depinde de expresia românească „înaintea voastră”.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: în Galileea
  rationale: În româna actuală, „în Galileea” exprimă natural deplasarea spre și în regiune; „întru Galileea” ar fi arhaic, iar „către Galileea” ar putea sugera doar direcția.
theological_decisions:
- issue: Formularea învierii în ἐγερθῆναί
  choice: după ce voi fi înviat
  alternative: după ce voi învia
  rationale: Forma pasivă a grecei este reflectată în română, păstrând formularea textului și posibila implicație a agentivității divine fără adaos explicativ.
translation_notes:
  register: Română standard modernă, firească și demnă. „Voi fi înviat” păstrează pasivul sursei, iar nota oferă alternativa idiomatică „voi învia”. Pronumele plural este explicit prin „voastră”.
