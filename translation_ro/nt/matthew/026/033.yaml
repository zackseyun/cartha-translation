id: MAT.26.33
reference: Matthew 26:33
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Εἰ πάντες σκανδαλισθήσονται ἐν σοί, ⸀ἐγὼ οὐδέποτε σκανδαλισθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/033.yaml
  text: But Peter answered him[a], “Even if all fall away because of you, I will never fall away.”
translation:
  language: ro
  text: 'Dar Petru I-a răspuns: „Chiar dacă toți se vor poticni[a] din cauza Ta, eu nu mă voi poticni niciodată.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „vor cădea” ori „se vor îndepărta”. Verbul grec poate descrie poticnirea, ofensarea sau abaterea de la loialitate.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: Dar Petru I-a răspuns
  rationale: Construcția narativă cu participiu și verb de vorbire este redată firesc în română printr-un singur verb. „Dar” exprimă contrastul dintre prezicerea lui Isus și reacția lui Petru, iar pronumele neaccentuat păstrează destinatarul exprimat prin αὐτῷ.
- source_word: Εἰ πάντες
  choice: Chiar dacă toți
  rationale: „Chiar dacă” redă valoarea concesivă pe care condiționalul o capătă aici, scoțând în evidență opoziția emfatică dintre „toți” și „eu”.
- source_word: σκανδαλισθήσονται / σκανδαλισθήσομαι
  choice: se vor poticni / mă voi poticni
  rationale: „A se poticni” păstrează metafora verbului grec și lasă deschisă gama lui contextuală, de la clătinare și ofensare până la îndepărtarea de loialitatea față de Isus. Repetarea aceluiași verb reproduce paralelismul grecesc.
- source_word: ἐν σοί
  choice: din cauza Ta
  rationale: În legătură cu σκανδαλίζω, expresia indică persoana din pricina căreia are loc poticnirea; formularea este clară și firească în româna actuală.
- source_word: ἐγὼ οὐδέποτε
  choice: eu ... niciodată
  rationale: Pronumele explicit „eu” păstrează contrastul emfatic al lui Petru cu „toți”, iar „niciodată” redă negarea temporală categorică.
theological_decisions:
- issue: Sensul lui σκανδαλίζω în contextul eșecului ucenicilor
  choice: a se poticni
  alternative: a cădea; a se îndepărta; a se lepăda
  rationale: Textul indică o clătinare gravă a loialității ucenicilor, dar verbul nu afirmă în sine caracterul definitiv al căderii. „A se poticni” păstrează metafora și tensiunea semantică fără a introduce o concluzie doctrinară despre apostazie definitivă; nota explică sensul mai puternic posibil.
translation_notes:
  register: Română standard modernă, cu formulare narativă concisă și demnă. Pronumele referitoare la Isus sunt scrise cu majusculă conform unei convenții editoriale românești răspândite, fără efect asupra sensului.
