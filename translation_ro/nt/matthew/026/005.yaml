  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἔλεγον δέ· Μὴ ἐν τῇ ἑορτῇ, ἵνα μὴ θόρυβος γένηται ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/005.yaml
  text: But they were saying[a], “Not during the feast[b], lest there be an uproar among the people.”
translation:
  language: ro
  text: 'Dar ei spuneau: „Nu în timpul sărbătorii,[a] ca să nu se producă o tulburare[b] în popor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „festivalului”. Termenul grecesc ἑορτή se poate referi atât la o sărbătoare religioasă, cât și la perioada festivă asociată ei.
    reason: lexical_alternative
  - marker: b
    text: Sau „agitație” sau „zarvă”; ori, mai puternic, „revoltă”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: spuneau
  rationale: Imperfectul grecesc exprimă o deliberare în desfășurare sau repetată; imperfectul românesc păstrează firesc acest aspect.
- source_word: δέ
  choice: Dar
  rationale: Marchează contrastul ușor dintre hotărârea de a-l prinde pe Isus și precauția privind momentul acțiunii.
- source_word: Μὴ ἐν τῇ ἑορτῇ
  choice: Nu în timpul sărbătorii
  rationale: Redă construcția eliptică drept o decizie sau interdicție, iar sensul temporal al lui ἐν este exprimat clar prin „în timpul”.
- source_word: ἵνα μὴ
  choice: ca să nu
  rationale: Formulare românească naturală care păstrează ideea scopului urmărit, anume evitarea tulburării.
- source_word: θόρυβος
  choice: tulburare
  rationale: Termenul denotă agitație sau dezordine publică; „tulburare” păstrează amplitudinea deschisă a grecescului fără a impune sensul mai puternic de „răscoală”.
- source_word: γένηται
  choice: se stârnească
  rationale: În asociere cu θόρυβος, verbul descrie ivirea unei tulburări; „se stârnească” este idiomatic în română.
- source_word: ἐν τῷ λαῷ
  choice: în popor
  rationale: Redare concisă și firească a sferei în care s-ar putea produce tulburarea, păstrând sensul colectiv al lui λαός.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu formulare narativă demnă și accesibilă. Imperfectul „spuneau” păstrează aspectul deliberativ al originalului; „ca să nu” este preferat unui echivalent arhaizant pentru ἵνα μὴ.
