  text: Οἱ δὲ κρατήσαντες τὸν Ἰησοῦν ἀπήγαγον πρὸς Καϊάφαν τὸν ἀρχιερέα, ὅπου οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι συνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/057.yaml
  text: Those who had seized Jesus led him away to Caiaphas the high priest[a], where the scribes and the elders had gathered.
translation:
  language: ro
  text: Cei care îl prinseseră pe Isus l-au dus la Caiafa, marele preot, unde cărturarii și bătrânii se adunaseră.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „fuseseră adunați”. În acest context, verbul grecesc poate fi înțeles fie pasiv, fie cu sens intranzitiv: „se adunaseră”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Cei care
  rationale: Articolul cu participiul este redat firesc prin construcția substantivală „cei care”. δέ este un conector narativ slab, care nu cere aici un echivalent românesc explicit.
- source_word: κρατήσαντες
  choice: îl prinseseră
  rationale: Participiul aorist exprimă o acțiune anterioară verbului principal; mai-mult-ca-perfectul redă clar succesiunea. „A prinde” păstrează ideea luării în custodie fără a introduce nuanța juridică mai precisă a lui „a aresta”.
- source_word: ἀπήγαγον
  choice: l-au dus
  rationale: Verbul indică ducerea cuiva de acolo către alt loc; formularea este naturală și potrivită contextului în care Isus se afla sub pază.
- source_word: πρὸς Καϊάφαν
  choice: la Caiafa
  rationale: πρός cu acuzativul indică deplasarea către o persoană. „La Caiafa” este idiomatic în română și nu adaugă ideea explicită a unei audieri sau a casei sale.
- source_word: τὸν ἀρχιερέα
  choice: marele-preot
  rationale: Redă titlul consacrat al funcției desemnate de substantivul singular ἀρχιερεύς în acest context.
- source_word: ὅπου
  choice: unde
  rationale: Echivalent direct și firesc al adverbului relativ locativ.
- source_word: οἱ γραμματεῖς
  choice: cărturarii
  rationale: Termenul românesc tradițional și precis pentru experții în Scriptură și Lege din acest context iudaic.
- source_word: οἱ πρεσβύτεροι
  choice: bătrânii
  rationale: Redă denumirea consacrată a conducătorilor recunoscuți ai comunității, fără parafrază explicativă.
- source_word: συνήχθησαν
  choice: se adunaseră
  rationale: Mai-mult-ca-perfectul arată că adunarea avusese deja loc când Isus a fost adus. Construcția reflexiv-intranzitivă este firească în română, deși forma greacă poate fi înțeleasă și pasiv.
