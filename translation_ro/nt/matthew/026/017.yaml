source:
  edition: SBLGNT
  text: Τῇ δὲ πρώτῃ τῶν ἀζύμων προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ ⸀λέγοντες· Ποῦ θέλεις ⸀ἑτοιμάσωμέν σοι φαγεῖν τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/017.yaml
  text: On the first day of Unleavened Bread[a], the disciples came to Jesus, saying[b], “Where do you want us to prepare for you to eat the Passover?”
translation:
  language: ro
  text: 'În prima zi a Azimelor[a], ucenicii au venit la Isus și au zis: „Unde vrei să-Ți pregătim Paștele[b], ca să-l mănânci?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Formularea reproduce expresia grecească; chestiunile privitoare la cronologia Paștelui nu trebuie soluționate numai prin traducere.
    reason: cultural_note
  - marker: b
    text: Aici, „Paștele” se referă mai precis la masa pascală.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ πρώτῃ τῶν ἀζύμων
  choice: În prima zi a Azimelor
  rationale: Construcția la dativ are sens temporal, iar „Azimele” este denumirea românească consacrată a perioadei sărbătorești. δέ este un conector slab și nu necesită aici o redare separată.
- source_word: προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: ucenicii au venit la Isus
  rationale: Redarea păstrează subiectul articulat și direcția apropierii de Isus, într-o formulare românească firească.
- source_word: λέγοντες
  choice: și au zis
  rationale: Coordonarea este mai naturală în română decât participiul „zicând”, fără a particulariza actul vorbirii drept „au întrebat”.
- source_word: Ποῦ θέλεις ἑτοιμάσωμέν σοι
  choice: Unde vrei să-Ți pregătim
  rationale: Subjonctivul deliberativ după θέλεις este redat firesc prin „vrei să...”, iar σοι este păstrat prin pronumele datival „Ți-”.
- source_word: φαγεῖν τὸ πάσχα
  choice: Paștele
  rationale: În context, verbul „a pregăti” și obiectul „Paștele” implică masa ce urma să fie mâncată; româna permite această exprimare eliptică și evită formularea greoaie „să-Ți pregătim ca să mănânci Paștele”.
theological_decisions:
- issue: Expresia cronologică „prima zi a Azimelor” în raport cu data mesei pascale
  choice: Păstrarea expresiei festive așa cum apare în greacă, fără armonizare cronologică
  alternative: „în ziua dinaintea Sărbătorii Azimelor” sau „în prima zi de Paște”
  rationale: Textul grec spune explicit „în prima [zi] a Azimelor”. Traducerea nu trebuie să soluționeze prin parafrază disputele privind cronologia relatărilor evanghelice.
- issue: Sensul lui πάσχα în contextul pregătirii și mâncării
  choice: „Paștele”, cu notă că se referă aici la masa pascală
  alternative: „masa de Paște” / „masa pascală” direct în text
  rationale: „Paștele” păstrează forma concisă și polisemia termenului grec, iar contextul indică masa; nota clarifică sensul contextual fără a restrânge inutil textul principal.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. „Azimele” păstrează termenul biblic și cultural consacrat; „și au zis” evită participiul livresc „zicând”. Majuscula reverențială din „Ți-” urmează uzul editorial românesc pentru referirea directă la Isus.
