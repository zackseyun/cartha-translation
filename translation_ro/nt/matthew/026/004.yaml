  text: καὶ συνεβουλεύσαντο ἵνα τὸν Ἰησοῦν δόλῳ κρατήσωσιν καὶ ἀποκτείνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/004.yaml
  text: and they conspired so that they might seize Jesus by stealth and kill him.
translation:
  language: ro
  text: și s-au sfătuit să-l prindă pe Isus prin vicleșug și să-l omoare.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεβουλεύσαντο
  choice: s-au sfătuit
  rationale: Redă deliberarea comună și planificarea sugerate de verb, într-o formulare românească firească și demnă.
- source_word: δόλῳ
  choice: prin vicleșug
  rationale: Păstrează ideea de înșelăciune sau stratagemă, fără a restrânge sensul la simpla discreție.
- source_word: κρατήσωσιν
  choice: să-l prindă
  rationale: În acest context ostil, verbul înseamnă a pune mâna pe cineva, a-l captura; «să-l prindă» este clar și natural.
- source_word: ἀποκτείνωσιν
  choice: să-l omoare
  rationale: Redare directă și curentă a intenției de a-i lua viața.
theological_decisions:
- issue: Valoarea construcției ἵνα cu conjunctivul
  choice: să-l prindă ... și să-l omoare
  alternative: ca să-l prindă ... și să-l omoare
  rationale: După «s-au sfătuit», completiva cu «să» exprimă natural conținutul și scopul planului, păstrând raportul sintactic fără a-l supraexplicita.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea evită atât arhaismul inutil, cât și parafraza; «prin vicleșug» păstrează nuanța morală a grecescului δόλῳ.
