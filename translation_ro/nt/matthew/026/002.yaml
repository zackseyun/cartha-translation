id: MAT.26.2
reference: Matthew 26:2
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Οἴδατε ὅτι μετὰ δύο ἡμέρας τὸ πάσχα γίνεται, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς τὸ σταυρωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/002.yaml
  text: You know that after two days the Passover is coming[a], and the Son of Man is being handed over to be crucified.
translation:
  language: ro
  text: Știți că după două zile vine Paștele, iar Fiul Omului este predat[a] ca să fie răstignit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „este trădat”. Verbul grecesc poate desemna trădarea, dar are sensul mai larg de „a fi predat” sau „a fi dat în mâinile altora”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδατε
  choice: Știți
  rationale: Forma de persoana a doua plural a lui οἶδα are sens prezent și se redă direct și firesc prin „Știți”.
- source_word: μετὰ δύο ἡμέρας
  choice: după două zile
  rationale: μετά cu acuzativul are aici sens temporal; formularea păstrează îndeaproape expresia greacă, rămânând inteligibilă în româna actuală.
- source_word: τὸ πάσχα
  choice: Paștele
  rationale: Termenul desemnează Paștele; forma românească articulată redă natural articolul grecesc fără a adăuga explicit „sărbătoarea”.
- source_word: γίνεται
  choice: vine
  rationale: În context, γίνομαι indică apropierea sau survenirea Paștelui. „Vine Paștele” este o formulare românească naturală și păstrează caracterul iminent al evenimentului.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Redarea consacrată a autodesemnării lui Isus păstrează rezonanța biblică și teologică a titlului fără parafrazare.
- source_word: παραδίδοται
  choice: este predat
  rationale: Prezentul pasiv este păstrat, iar „este predat” redă sensul larg de a fi dat sau încredințat în mâinile altora, fără a-l restrânge la actul trădării.
- source_word: εἰς τὸ σταυρωθῆναι
  choice: ca să fie răstignit
  rationale: Construcția cu infinitiv articulat exprimă scopul sau rezultatul; formularea este directă și firească în română.
theological_decisions:
- issue: Redarea lui παραδίδοται în prezicerea pătimirii
  choice: este predat
  alternative: este trădat
  rationale: Contextul apropiat cuprinde trădarea lui Iuda, însă verbul grecesc are un sens mai larg, acela de a fi dat în mâinile altora. Redarea aleasă păstrează tensiunea dintre trădarea omenească și faptul că Isus este dat spre pătimire, fără a fixa aici un singur agent sau o singură nuanță.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. „Vine Paștele” evită rigiditatea lui „are loc Paștele”, iar „este predat” păstrează prezentul viu și ambiguitatea verbului grec.
