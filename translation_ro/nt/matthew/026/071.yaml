  yaml_path: translation/nt/matthew/026/071.yaml
  text: But when he had gone out to the gateway, another woman saw him and says to those there, “This man was with Jesus the Nazarene.”
translation:
  language: ro
  text: 'Dar, când a ieșit la poartă, l-a văzut o altă femeie și le spune celor de acolo: „Omul acesta era cu Isus Nazarineanul.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυλών
