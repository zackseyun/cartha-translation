  rationale: În context, termenul desemnează zona porții de acces a curții, nu doar o poartă izolată; formularea este firească și clară în româna actuală.
- source_word: λέγει
  choice: le spune
  rationale: Păstrează prezentul istoric al textului grec, în acord cu efectul narativ intenționat.
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: Isus Nazarineanul
  rationale: Redă direct desemnarea de origine/asociere geografică, într-o formulare românească consacrată și demnă.
