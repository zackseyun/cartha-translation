id: MAT.26.25
reference: Matthew 26:25
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Ἰούδας ὁ παραδιδοὺς αὐτὸν εἶπεν· Μήτι ἐγώ εἰμι, ῥαββί; λέγει αὐτῷ· Σὺ εἶπας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/025.yaml
  text: Then Judas, the one betraying him, answered and said, “Surely I am not the one, Rabbi?” He said to him, “You have said so.”
translation:
  language: ro
  text: 'Atunci Iuda, cel care Îl trăda, a răspuns: „Nu cumva sunt eu, rabbi?” Isus i-a zis: „Tu ai spus-o.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: cel care Îl trăda
  rationale: Participiul prezent îl identifică pe Iuda prin acțiunea aflată în desfășurare; «a trăda» redă firesc în context sensul verbului παραδίδωμι.
- source_word: Μήτι ἐγώ εἰμι
  choice: Nu cumva sunt eu
  rationale: μήτι introduce o întrebare care așteaptă un răspuns negativ; formularea românească păstrează atât așteptarea, cât și tensiunea întrebării.
- source_word: ῥαββί
  choice: rabbi
  rationale: Se păstrează titlul semitic recognoscibil, cu forma uzuală în româna actuală.
- source_word: Σὺ εἶπας
  choice: Tu ai spus-o
  rationale: Redare apropiată de expresia greacă, fără a transforma răspunsul indirect într-o afirmație explicită mai categorică.
theological_decisions:
- issue: Forța răspunsului lui Isus către Iuda
  choice: Tu ai spus-o.
  alternative: Da, tu ești.
  rationale: Grecescul Σὺ εἶπας este o formulare indirectă și pregnantă. Traducerea păstrează ambiguitatea pragmatică și evită explicitarea doctrinară sau narativă nejustificată.
translation_notes:
  register: Română literară modernă, clară și demnă. Verbul introductiv redundant «a răspuns și a zis» este redat natural prin «a răspuns». Numele «Isus» este introdus pentru claritatea referentului implicit din λέγει, fără schimbarea sensului.
source_grounding:
  english_pob_role: consult_only
