    issue: Pronumele „l-a” din „și l-a turnat” are antecedent ambiguu.
    rationale: Cel mai apropiat antecedent masculin este „vas”, astfel că cititorul poate înțelege, cel puțin pentru o clipă, că femeia a turnat vasul. Greaca are ca obiect subînțeles μύρον, substanța parfumată; româna poate elimina ambiguitatea numind-o explicit.
  - severity: low
    issue: Nota culturală spune „pentru servirea mesei”.
    rationale: ἀνακειμένου se referă la postura persoanei în timpul mesei, nu la actul servirii ei. „Pentru luarea mesei” este mai exact și mai natural.
