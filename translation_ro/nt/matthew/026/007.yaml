  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: προσῆλθεν αὐτῷ γυνὴ ⸂ἔχουσα ἀλάβαστρον μύρου⸃ βαρυτίμου καὶ κατέχεεν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ ἀνακειμένου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/007.yaml
  text: a woman came to him holding an alabaster jar of very costly perfume[b][a], and she poured it on his head as he was reclining at the table.
translation:
  language: ro
  text: O femeie s-a apropiat de el, având un vas de alabastru cu ulei parfumat foarte scump[a], și a turnat uleiul parfumat pe capul lui, pe când stătea întins la masă[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „un flacon de alabastru cu mir foarte scump”. Termenul grecesc μύρον poate desemna ulei parfumat sau unguent, nu numai parfum lichid în sensul modern.
    reason: lexical_alternative
  - marker: b
    text: Adică stătea întins în postura obișnuită pentru luarea mesei în acea cultură.
    reason: cultural_note
lexical_decisions:
- source_word: προσῆλθεν αὐτῷ
  choice: s-a apropiat de el
  rationale: Redă clar mișcarea spre Isus exprimată de προσέρχομαι și este firească în româna actuală.
- source_word: γυνή
  choice: o femeie
  rationale: Substantivul este nearticulat și femeia nu este identificată în acest verset.
- source_word: ἔχουσα
  choice: având
  rationale: Păstrează valoarea participiului care o descrie pe femeie; în context indică faptul că aducea cu ea vasul.
- source_word: ἀλάβαστρον μύρου
  choice: un vas de alabastru cu ulei parfumat
  rationale: ἀλάβαστρον desemnează un recipient de tip alabastron, adesea din alabastru, iar μύρον este o substanță aromatică, precum un ulei parfumat sau un unguent. Formularea evită restrângerea sensului la parfumul lichid modern.
- source_word: βαρυτίμου
  choice: foarte scump
  rationale: Exprimă valoarea deosebit de mare indicată de adjectiv, într-o formulare naturală și ușor de înțeles.
- source_word: κατέχεεν
  choice: l-a turnat
  rationale: Verbul καταχέω descrie turnarea substanței asupra cuiva; pronumele românesc se referă firesc la uleiul parfumat.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: pe capul lui
  rationale: Redă direct locul asupra căruia a fost turnat uleiul, fără solemnitate artificială.
- source_word: ἀνακειμένου
  choice: pe când stătea întins la masă
  rationale: Participiul indică postura obișnuită la masă în lumea antică; completarea „la masă” face situația inteligibilă cititorului modern.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu o exprimare demnă și accesibilă. „Ulei parfumat” clarifică sensul concret al lui μύρον, iar varianta tradițională „mir” este păstrată în nota de subsol. Marcajele notelor sunt așezate lângă expresiile pe care le explică.
