  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/024.yaml
  text: The Son of Man indeed goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been better for him if that man had not been born.
translation:
  language: ro
  text: Fiul Omului se duce, într-adevăr, așa cum este scris despre el; dar vai de omul acela prin care este trădat[a] Fiul Omului! Ar fi fost mai bine pentru el dacă omul acela nu s-ar fi născut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „este predat” sau „este dat pe mâna cuiva”. Verbul grecesc poate însemna atât „a trăda”, cât și, mai literal, „a preda” sau „a da pe mâna cuiva”; aici a fost ales „a trăda”, deoarece este avută în vedere fapta perfidă a lui Iuda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului se duce, într-adevăr
  rationale: Păstrează titlul consacrat „Fiul Omului”, iar „într-adevăr” redă discret particula μὲν și pregătește contrastul introdus de δὲ.
- source_word: ὑπάγει
  choice: se duce
  rationale: Redă prezentul grecesc fără a preciza în mod interpretativ dacă referința imediată este la plecare, moarte sau întregul drum al pătimirii.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: așa cum este scris despre el
  rationale: Formula românească firească „este scris” redă perfectul pasiv cu rezultatul lui valabil în prezent, iar „despre el” păstrează sensul lui περὶ αὐτοῦ.
- source_word: οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: dar vai de omul acela
  rationale: „Vai de” păstrează forța profetică și judiciară a lui οὐαί, iar „dar” exprimă contrastul marcat de δὲ.
- source_word: δι’ οὗ
  choice: prin care
  rationale: Redă natural în română ideea de agenție exprimată de διά cu genitivul.
- source_word: παραδίδοται
  choice: este trădat
  rationale: În contextul acțiunii lui Iuda, „este trădat” exprimă limpede caracterul perfid al faptei; sensul mai literal „este dat pe mâna” este păstrat în nota de subsol.
- source_word: καλὸν ἦν αὐτῷ
  choice: Mai bine ar fi fost pentru el
  rationale: Redă idiomatic în română valoarea de preferabilitate a expresiei în construcția contrafactuală, fără a slăbi gravitatea afirmației.
- source_word: εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος
  choice: dacă omul acela nu s-ar fi născut
  rationale: Condiționalul perfect românesc exprimă firesc situația contrafactuală, iar repetarea lui „omul acela” păstrează accentul textului grec.
theological_decisions:
- issue: Relația dintre împlinirea Scripturii și răspunderea omului
  choice: Sunt păstrate împreună afirmația că drumul Fiului Omului este conform Scripturii și sentința de vai rostită asupra celui care îl trădează.
  alternative: O formulare care ar diminua fie împlinirea Scripturii, fie răspunderea personală a trădătorului.
  rationale: Textul grec afirmă ambele realități fără să explice aici raportul lor; traducerea păstrează această tensiune.
- issue: Forța afirmației finale despre faptul de a nu se fi născut
  choice: Afirmația este redată ca o sentință severă de judecată, fără dezvoltări doctrinare suplimentare.
  alternative: Tratarea ei exclusiv ca hiperbolă sau folosirea ei pentru a afirma un sistem doctrinar care depășește versetul.
  rationale: Traducerea păstrează gravitatea expresiei contrafactuale, dar nu precizează mai mult decât spune textul.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. Punctul și virgula și exclamația evidențiază contrastul și forța avertismentului. Pronumele referitor la Fiul Omului este scris cu literă mică, potrivit normelor generale ale limbii române și fără a introduce o convenție confesională de capitalizare.
