  text: εἶπεν· Τί θέλετέ μοι δοῦναι κἀγὼ ὑμῖν παραδώσω αὐτόν; οἱ δὲ ἔστησαν αὐτῷ τριάκοντα ἀργύρια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/015.yaml
  text: He said[a], “What are you willing to give me, and I will hand him over to you?” And they weighed out for him thirty pieces of silver.
translation:
  language: ro
  text: 'El a spus: „Ce sunteți dispuși să-mi dați, și eu vi-l voi preda[a]?” Ei i-au cântărit treizeci de arginți.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „îl voi da pe mâna voastră” sau „vi-l voi trăda”. Verbul grecesc poate însemna „a preda”, „a da pe mâna cuiva” sau, în acest context, „a trăda”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλετέ μοι δοῦναι
  choice: Ce sunteți gata să-mi dați
  rationale: În contextul negocierii, θέλω exprimă disponibilitatea sau voința. Formularea este firească în româna actuală și păstrează nuanța volitivă, fără a reduce întrebarea la simplul fapt al plății.
- source_word: κἀγὼ ὑμῖν παραδώσω αὐτόν
  choice: iar eu vi-l voi da pe mâna voastră
  rationale: παραδίδωμι are sensul larg de „a preda, a da pe mâna cuiva”. Expresia românească redă natural transferarea lui Isus sub controlul autorităților, fără a introduce direct evaluarea morală mai specifică din „a trăda”.
- source_word: οἱ δὲ
  choice: Ei
  rationale: δέ este un conector narativ slab. În română, trecerea la propoziția următoare este naturală fără un conector explicit și nu impune un contrast absent din context.
- source_word: ἔστησαν αὐτῷ
  choice: i-au cântărit
  rationale: În această construcție comercială, verbul indică stabilirea sau măsurarea sumei; „i-au cântărit” păstrează imaginea concretă a argintului măsurat și posibilul ecou scripturistic, în locul generalizării „i-au plătit”.
- source_word: τριάκοντα ἀργύρια
  choice: treizeci de arginți
  rationale: ἀργύρια desemnează bani sau piese de argint fără a preciza denominația. „Arginți” este concis, inteligibil și bine fixat în registrul biblic românesc, fără a identifica nejustificat tipul monedelor.
theological_decisions:
- issue: Redarea verbului παραδώσω în oferta lui Iuda
  choice: vi-l voi da pe mâna voastră
  alternative: vi-l voi trăda
  rationale: Textul principal păstrează sensul lexical mai larg al predării unei persoane sub autoritatea altora. Contextul face limpede caracterul de trădare al faptei, dar verbul grec nu cere ca această evaluare morală să fie inclusă direct în traducerea principală.
translation_notes:
  register: Română standard modernă, cu ton demn și narativ. „A da pe mâna cuiva” este idiomatic și accesibil, iar „arginți” păstrează concizia și rezonanța biblică fără a deveni obscur.
