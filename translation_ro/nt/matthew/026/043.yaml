  text: καὶ ἐλθὼν ⸂πάλιν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ βεβαρημένοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/043.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down.
translation:
  language: ro
  text: Și, venind din nou, i-a găsit dormind, căci aveau ochii îngreuiați.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „ochii le erau grei”.'
    reason: Alternativă lexicală idiomatică pentru starea exprimată de βεβαρημένοι; textul principal păstrează mai explicit nuanța de stare rezultată.
lexical_decisions:
- source_word: ἐλθὼν πάλιν
  choice: venind din nou
  rationale: Participiul aorist este redat prin gerunziu, păstrând curgerea narativă, iar πάλιν indică repetarea acțiunii.
- source_word: εὗρεν αὐτοὺς
  choice: i-a găsit
  rationale: Redare firească și exactă în română; subiectul implicit este Isus, stabilit de context.
- source_word: καθεύδοντας
  choice: dormind
  rationale: Gerunziul păstrează caracterul verbal și starea în desfășurare descrisă de participiul prezent.
- source_word: ἦσαν γὰρ
  choice: căci ... erau
  rationale: γάρ introduce explicația faptului că ucenicii dormeau; „căci” păstrează explicit legătura logică.
- source_word: αὐτῶν οἱ ὀφθαλμοὶ
  choice: ochii le
  rationale: Construcție idiomatică românească ce redă posesia exprimată în greacă.
- source_word: βεβαρημένοι
  choice: îngreunați
  rationale: Participiul perfect pasiv indică o stare rezultată și păstrează imaginea ochilor apăsați de somn.
theological_decisions: []
