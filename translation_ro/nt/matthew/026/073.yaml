id: MAT.26.73
reference: Matthew 26:73
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: μετὰ μικρὸν δὲ προσελθόντες οἱ ἑστῶτες εἶπον τῷ Πέτρῳ· Ἀληθῶς καὶ σὺ ἐξ αὐτῶν εἶ, καὶ γὰρ ἡ λαλιά σου δῆλόν σε ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/073.yaml
  text: After a little while[a], those standing there came up and said to Peter, “Surely you also are one of them, for even your accent makes you evident.”
translation:
  language: ro
  text: 'Puțin mai târziu, cei care stăteau acolo s-au apropiat și i-au spus lui Petru: „Cu siguranță, și tu ești dintre ei, căci până și felul tău de a vorbi te dă de gol.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ μικρὸν
  choice: Puțin mai târziu
  rationale: Redă firesc expresia temporală care indică trecerea unui interval scurt.
- source_word: δὲ
  choice: —
  rationale: Conjuncția marchează aici o continuare ușoară a narațiunii; tranziția este redată natural în română fără un termen separat.
- source_word: προσελθόντες
  choice: s-au apropiat
  rationale: Păstrează clar ideea deplasării către Petru și se potrivește registrului narativ.
- source_word: οἱ ἑστῶτες
  choice: cei care stăteau acolo
  rationale: Redare apropiată de participiul substantivizat, cu completarea contextuală firească „acolo”.
- source_word: εἶπον τῷ Πέτρῳ
  choice: i-au spus lui Petru
  rationale: Construcție românească naturală care păstrează destinatarul explicit.
- source_word: Ἀληθῶς
  choice: Cu siguranță
  rationale: Exprimă afirmația categorică a vorbitorilor într-un dialog modern și demn.
- source_word: καὶ σὺ
  choice: și tu
  rationale: Păstrează accentul pus pe includerea lui Petru în grup.
- source_word: ἐξ αὐτῶν
  choice: dintre ei
  rationale: Expresie idiomatică românească pentru apartenența la grupul menționat.
- source_word: καὶ γὰρ
  choice: căci până și
  rationale: „Căci” introduce motivul afirmației, iar „până și” redă valoarea emfatică posibilă a lui καί.
- source_word: ἡ λαλιά σου
  choice: felul tău de a vorbi
  rationale: Păstrează amplitudinea semantică a lui λαλιά—vorbire, mod de exprimare sau accent—fără a restrânge nejustificat sensul numai la accent.
- source_word: δῆλόν σε ποιεῖ
  choice: te dă de gol
  rationale: Echivalent românesc clar și idiomatic pentru faptul că vorbirea îl face recognoscibil, păstrând obiectul personal „te”.
theological_decisions: []
translation_notes:
  register: Română standard modernă, narativă și demnă. Formularea evită rigiditatea lui „te face evident” și păstrează ambiguitatea lexicală a lui λαλιά prin „felul tău de a vorbi”.
