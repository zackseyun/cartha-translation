  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ἤγγικεν ὁ παραδιδούς με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/046.yaml
  text: Get up, let us go. Look, my betrayer[a] is near.
translation:
  language: ro
  text: Ridicați-vă, să mergem! Iată, cel care mă predă[a] s-a apropiat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „cel care mă trădează”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Ridicați-vă
  rationale: Imperativul este la plural și îi cheamă direct pe ucenici să se scoale; formularea este firească și actuală în română.
- source_word: ἄγωμεν
  choice: să mergem
  rationale: Conjunctivul hortativ la persoana întâi plural este redat natural prin „să mergem”.
- source_word: ἰδού
  choice: Iată
  rationale: Particula atrage atenția asupra unei evoluții urgente; „Iată” îi păstrează forța vie într-un registru biblic demn, dar curent.
- source_word: ἤγγικεν
  choice: s-a apropiat
  rationale: Perfectul grec exprimă o apropiere deja realizată, cu relevanță prezentă; perfectul compus românesc redă natural această mișcare ajunsă în punctul imediat.
- source_word: ὁ παραδιδούς με
  choice: cel care mă dă pe mâna lor
  rationale: Participiul substantivizat îl identifică pe cel care îl predă pe Isus. Expresia românească păstrează acțiunea concretă și, în context, implică trădarea fără a o introduce ca unic sens lexical.
theological_decisions:
- issue: Redarea lui παραδιδούς în contextul pătimirii
  choice: cel care mă dă pe mâna lor
  alternative: trădătorul meu; cel care mă trădează; cel care mă predă
  rationale: Verbul descrie concret faptul că Isus este dat în mâinile altora, iar în context gestul constituie trădare. Textul principal păstrează imaginea acțiunii și tensiunea lexicală, fără a reduce participiul la eticheta interpretativă „trădătorul”.
translation_notes:
  register: Română standard modernă, directă și demnă. Punctul exclamării după îndemnul inițial redă urgența replicii; „Iată” păstrează funcția de atragere a atenției. Pronumele „lor” este implicit contextual, nu exprimat separat în greacă, dar face idiomatică locuțiunea românească „a da pe mâna cuiva”.
