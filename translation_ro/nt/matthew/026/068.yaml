  text: λέγοντες· Προφήτευσον ἡμῖν, χριστέ, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/068.yaml
  text: 'saying[a], “Prophesy to us, Messiah: who is it that struck you?”'
translation:
  language: ro
  text: 'spunând: „Profețește-ne, Mesia[a]: cine te-a lovit?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Cristos”. Termenul grecesc Χριστός este redat aici prin „Mesia” deoarece este folosit ca titlu, nu ca o formă apropiată de un nume propriu.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγοντες
  choice: spunând
  rationale: Participiul prezent introduce cuvintele batjocoritorilor și păstrează legătura sintactică cu versetul anterior.
- source_word: Προφήτευσον
  choice: Profețește-ne
  rationale: Imperativul aorist este redat direct; pronumele enclitic exprimă firesc în română dativul ἡμῖν și păstrează tonul batjocoritor al poruncii.
- source_word: χριστέ
  choice: Mesia
  rationale: Vocativul lui Χριστός funcționează aici ca titlu. „Mesia” comunică sensul de Uns și scoate în evidență ironia mesianică a batjocurii.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: cine te-a lovit?
  rationale: Formularea românească identifică în mod natural făptașul și redă participiul substantivat ὁ παίσας fără o construcție greoaie precum „cine este cel care te-a lovit”.
theological_decisions:
- issue: Redarea titlului Χριστός
  choice: Mesia
  alternative: Cristos
  rationale: În acest vocativ, termenul este folosit limpede ca titlu în cadrul unei batjocuri, nu ca un element de nume. „Mesia” păstrează transparent valoarea titulară, iar alternativa tradițională este consemnată în notă.
translation_notes:
  register: Română standard modernă, concisă și demnă. Construcția „cine te-a lovit?” evită literalismul nefiresc, fără a pierde cererea de identificare profetică. Două puncte păstrează relația dintre porunca batjocoritoare și întrebarea care o explicitează.
