  text: καὶ πάλιν ἠρνήσατο μετὰ ὅρκου ὅτι Οὐκ οἶδα τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/072.yaml
  text: 'And again he denied it with an oath: “I do not know the man.”[a]'
translation:
  language: ro
  text: 'Și din nou a negat cu jurământ: „Nu cunosc omul.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Și
  rationale: Păstrează coordonarea narativă simplă, fără a adăuga o nuanță temporală.
- source_word: πάλιν
  choice: din nou
  rationale: Redă clar repetarea lepădării și este firesc în româna actuală.
- source_word: ἠρνήσατο
  choice: a negat
  rationale: Verbul indică negarea sau tăgăduirea; în română, construcția poate introduce direct conținutul negării fără un pronume obiect suplimentar.
- source_word: μετὰ ὅρκου
  choice: cu jurământ
  rationale: 'Redă ideea de însoțire: negarea a fost întărită printr-un jurământ. Evită nuanța unui cadru juridic formal pe care ar putea-o sugera „sub jurământ”.'
- source_word: ὅτι
  choice: ':'
  rationale: Introduce conținutul negării, redat idiomatic prin două puncte și vorbire directă.
- source_word: Οὐκ οἶδα
  choice: Nu-l cunosc
  rationale: În acest context, οἶδα exprimă nerecunoașterea unei relații sau cunoașteri personale; „nu-l cunosc” este formularea românească firească.
- source_word: τὸν ἄνθρωπον
  choice: pe omul acesta
  rationale: Articolul grecesc individualizează bărbatul deja aflat în discuție; româna cere reluarea clitică în construcția firească „nu-l cunosc pe...”, iar „omul acesta” păstrează formula distanțatoare fără a introduce numele lui Isus.
theological_decisions:
- issue: Referentul expresiei τὸν ἄνθρωπον în lepădarea lui Petru
  choice: Păstrarea expresiei explicite „omul acesta”
  alternative: „pe el” sau „pe Isus”
  rationale: Textul grecesc spune explicit „omul”, formulare care poate transmite distanțarea lui Petru. Înlocuirea cu numele „Isus” ar explicita interpretativ referentul și ar pierde forța retorică a dezicerii.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Formularea directă evită arhaisme precum „s-a lepădat” sau „a tăgăduit”, iar „cu jurământ” păstrează caracterul solemn al afirmației.
