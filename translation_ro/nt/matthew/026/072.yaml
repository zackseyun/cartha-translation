  naturalness: „Și din nou a negat cu jurământ” is clear, modern Romanian narrative prose. „Nu cunosc omul” is somewhat more formal than the clitic construction but is grammatical, intelligible, and best preserves the source’s definite expression without adding a demonstrative.
  terminology: „A negat” and „cu jurământ” are accurate, non-denominational renderings of ἠρνήσατο and μετὰ ὅρκου. The explicit „omul” preserves Peter’s distancing formulation without substituting „Isus” or merely a pronoun.
