id: MAT.26.54
reference: Matthew 26:54
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: πῶς οὖν πληρωθῶσιν αἱ γραφαὶ ὅτι οὕτως δεῖ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/054.yaml
  text: How then would the Scriptures be fulfilled[a], that it must happen this way?
translation:
  language: ro
  text: Atunci cum s-ar împlini Scripturile, care spun că așa trebuie să se întâmple?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶς
  choice: cum
  rationale: Adverb interogativ care introduce o întrebare retorică; „cum” redă firesc forța întrebării.
- source_word: οὖν
  choice: atunci
  rationale: Particulă inferențială care leagă întrebarea de afirmația precedentă și este idiomatică în româna actuală.
- source_word: πληρωθῶσιν
  choice: s-ar împlini
  rationale: 'Subjunctivul aorist pasiv, în această întrebare retorică, exprimă consecința ipotetică: dacă s-ar recurge la împotrivire, Scripturile nu s-ar împlini.'
- source_word: αἱ γραφαὶ
  choice: Scripturile
  rationale: Pluralul desemnează scrierile sacre ale lui Israel; majuscula indică referentul consacrat.
- source_word: ὅτι
  choice: care spun că
  rationale: Introduce conținutul Scripturilor. Formularea explicită este naturală în română și evită o succesiune greoaie de propoziții cu „că”.
- source_word: οὕτως
  choice: așa
  rationale: Se referă la modul în care trebuie să se desfășoare evenimentele și păstrează concizia originalului.
- source_word: δεῖ
  choice: trebuie
  rationale: Redă direct necesitatea, fără să expliciteze sursa ei dincolo de ceea ce spune textul.
- source_word: γενέσθαι
  choice: să se întâmple
  rationale: În context, infinitivul lui γίνομαι se referă la producerea evenimentelor; formularea este actuală și firească.
theological_decisions:
- issue: Natura necesității exprimate prin δεῖ
  choice: „trebuie”, fără adaos explicativ
  alternative: „trebuie să se întâmple potrivit planului lui Dumnezeu”
  rationale: Legătura dintre împlinirea Scripturilor și necesitate sugerează o necesitate divină, dar greaca nu formulează explicit o explicație doctrinară mai amplă.
- issue: Funcția lui ὅτι
  choice: 'Conținut al Scripturilor: „care spun că...”'
  alternative: 'Explicație cauzală: „fiindcă așa trebuie...”'
  rationale: În context, ὅτι poate fi înțeles cel mai firesc drept introducând conținutul scripturistic, însă construcția greacă este compactă; traducerea nu adaugă precizarea unor texte anume.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Ordinea „Atunci cum” păstrează legătura logică și cursivitatea, iar condiționalul „s-ar împlini” redă întrebarea retorică fără limbaj arhaic.
