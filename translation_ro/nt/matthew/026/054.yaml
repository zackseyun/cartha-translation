  source_fidelity: „Atunci cum s-ar împlini Scripturile, care spun că așa trebuie să se întâmple?” redă fidel întrebarea retorică πῶς οὖν, valoarea potențială a lui πληρωθῶσιν prin condiționalul „s-ar împlini”, referința consacrată a lui αἱ γραφαὶ și necesitatea neexplicată din δεῖ γενέσθαι. „Care spun că” exprimă firesc în română relația de conținut introdusă de ὅτι, fără a preciza artificial anumite pasaje scripturistice sau sursa necesității.
