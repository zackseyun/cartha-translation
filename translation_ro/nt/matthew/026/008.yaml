  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ ἠγανάκτησαν λέγοντες· Εἰς τί ἡ ἀπώλεια αὕτη;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/008.yaml
  text: But when the disciples saw it[a], they were indignant, saying, “Why this waste?”
translation:
  language: ro
  text: 'Dar, când ucenicii au văzut aceasta, s-au indignat și au zis: „De ce[a] risipa aceasta?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Cu ce rost?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: când au văzut
  rationale: Participiul aorist este redat temporal, firesc în română. Greaca nu exprimă un complement direct, iar româna permite aici păstrarea acestei elipse, referința la gestul femeii fiind clară din context.
- source_word: δὲ
  choice: Dar
  rationale: Marchează trecerea ușor contrastivă de la gestul femeii la reacția negativă a ucenicilor.
- source_word: οἱ μαθηταὶ
  choice: ucenicii
  rationale: Echivalentul consacrat și natural în narațiunea evanghelică; posesivul „lui” nu este explicit în greacă.
- source_word: ἠγανάκτησαν
  choice: s-au indignat
  rationale: Redă nemulțumirea puternică și caracterul evaluativ al verbului ἀγανακτέω, fără a-l reduce la simpla supărare.
- source_word: λέγοντες
  choice: și au zis
  rationale: Coordonarea verbală este mai firească în româna narativă decât redarea rigidă prin participiul „zicând”, păstrând aceeași relație cu reacția ucenicilor.
- source_word: Εἰς τί
  choice: De ce
  rationale: Formulare idiomatică românească pentru întrebarea despre scop sau rost; alternativa mai explicită este păstrată în notă.
- source_word: ἡ ἀπώλεια αὕτη
  choice: risipa aceasta
  rationale: În contextul mirului scump turnat, ἀπώλεια denumește risipirea sau pierderea socotită inutilă; „risipă” redă cel mai natural acuzația ucenicilor.
theological_decisions: []
