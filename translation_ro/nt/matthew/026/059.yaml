  text: οἱ δὲ ἀρχιερεῖς ⸀καὶ τὸ συνέδριον ὅλον ἐζήτουν ψευδομαρτυρίαν κατὰ τοῦ Ἰησοῦ ὅπως ⸂αὐτὸν θανατώσωσιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/059.yaml
  text: The chief priests and the whole council were seeking false testimony against Jesus so that they might put him to death[b][a],
translation:
  language: ro
  text: Preoții de seamă și întregul consiliu[a] căutau o mărturie mincinoasă[b] împotriva lui Isus, ca să-l dea la moarte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „întregul Sinedriu”. Termenul grecesc desemnează consiliul conducător iudaic.'
    reason: cultural_note
  - marker: b
    text: 'Sau: „mărturie a unui martor mincinos”. Termenul grecesc poate desemna, într-un cadru juridic, fie mărturia falsă, fie mărturia dată de un martor mincinos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεῖς
  choice: preoții de seamă
  rationale: Redă pluralul care desemnează conducerea preoțească superioară, fără a sugera că toți erau simultan mari-preoți în sensul strict al funcției.
- source_word: συνέδριον ὅλον
  choice: întregul consiliu
  rationale: Traduce termenul instituțional într-o formă transparentă pentru cititorul modern și păstrează accentul lui ὅλον asupra întregului corp.
- source_word: ἐζήτουν
  choice: căutau
  rationale: Imperfectul indică o acțiune în desfășurare; forma românească păstrează această valoare aspectuală.
- source_word: ψευδομαρτυρίαν
  choice: o mărturie mincinoasă
  rationale: În context judiciar, expresia desemnează conținutul unei depoziții false; alternativa «mărturie falsă» este posibilă, dar «mincinoasă» evidențiază caracterul deliberat neadevărat.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: împotriva lui Isus
  rationale: κατά cu genitivul exprimă aici opoziția sau acuzația îndreptată împotriva lui Isus.
- source_word: ὅπως ... θανατώσωσιν
  choice: ca să-l poată da la moarte
  rationale: Păstrează scopul urmărit și tonul judiciar, fără a preciza mai mult decât greaca modul execuției.
theological_decisions:
- issue: Nuanța judiciară a intenției conducătorilor
  choice: Textul prezintă o căutare continuă a unei mărturii mincinoase, cu scopul de a-l da pe Isus la moarte.
  alternative: O formulare mai comprimată ar putea spune că «au căutat mărturie mincinoasă ca să-l omoare».
  rationale: Imperfectul ἐζήτουν și propoziția finală ὅπως...θανατώσωσιν descriu o acțiune deliberată și continuă în cadru judiciar, fără a impune un comentariu doctrinar.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. Formularea păstrează caracterul judiciar al scenei și aspectul continuu al verbului, evitând totodată transliterarea neexplicată a termenului instituțional.
