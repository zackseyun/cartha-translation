  naturalness: „Preoții de seamă”, „întregul consiliu” și „mărturie mincinoasă” sunt inteligibile și potrivite registrului. Eliminarea lui „poată” face finalul mai concis și mai firesc, fără pierderea tonului juridic solemn.
