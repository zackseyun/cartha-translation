  text: ὁ δὲ ἠρνήσατο ⸀ἔμπροσθεν πάντων λέγων· Οὐκ οἶδα τί λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/070.yaml
  text: But he denied it before them all[a], saying, “I do not know what you are saying.”
translation:
  language: ro
  text: 'Dar el a negat în fața tuturor, spunând: „Nu știu ce spui.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: a negat
  rationale: Verbul descrie negarea afirmației făcute imediat înainte. În română, folosirea fără obiect exprimat este firească și păstrează caracterul implicit al obiectului din greacă, fără a preciza mai mult decât textul.
- source_word: ἔμπροσθεν πάντων
  choice: înaintea tuturor
  rationale: Redă prezența publică indicată de prepoziție și referirea personală a lui πάντων, într-o formulare românească demnă și naturală.
- source_word: λέγων
  choice: spunând
  rationale: Păstrează construcția participială și legătura directă dintre negare și cuvintele rostite.
- source_word: Οὐκ οἶδα
  choice: Nu știu
  rationale: Este echivalentul direct, firesc și neechivoc al negației verbului «a ști».
- source_word: τί λέγεις
  choice: ce spui
  rationale: Redă îndeaproape formularea greacă și este natural în româna modernă; nu transformă afirmația într-o parafrază precum «despre ce vorbești».
theological_decisions:
- issue: Natura negării lui Petru
  choice: Petru neagă public afirmația care i-a fost adresată, fără obiect exprimat.
  alternative: Petru îl neagă direct pe Isus sau neagă că o cunoaște pe slujnică.
  rationale: Greaca folosește verbul absolut, iar obiectul negării se deduce din replica precedentă. Formularea românească păstrează această economie și nu introduce o identificare mai precisă decât permite propoziția.
translation_notes:
  register: Română standard modernă, cu registru narativ sobru și accesibil. «Înaintea tuturor» păstrează tonul demn al relatării, iar «ce spui» urmează direct textul-sursă. Nu este necesară o notă de subsol, deoarece formularea principală redă deja sensul literal și natural.
