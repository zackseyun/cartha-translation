id: MAT.26.56
reference: Matthew 26:56
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῶσιν αἱ γραφαὶ τῶν προφητῶν. τότε οἱ μαθηταὶ πάντες ἀφέντες αὐτὸν ἔφυγον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/056.yaml
  text: But all this has happened so that the Scriptures of the prophets might be fulfilled[a]. Then all the disciples left him and fled.
translation:
  language: ro
  text: Dar toate acestea s-au întâmplat ca să se împlinească Scripturile profeților. Atunci toți ucenicii l-au lăsat[a] și au fugit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „l-au părăsit”; participiul ἀφέντες poate avea în acest context sensul mai puternic de abandonare.'
    reason: alternativă lexicală
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Dar toate acestea
  rationale: Redă idiomatic referirea la întreaga situație precedentă, iar „dar” păstrează valoarea conjunctivă ușor adversativă a lui δέ.
- source_word: γέγονεν
  choice: s-au întâmplat
  rationale: Perfectul lui γίνομαι indică un fapt împlinit cu relevanță în momentul relatării; perfectul compus românesc este firesc în context.
- source_word: ἵνα πληρωθῶσιν
  choice: ca să se împlinească
  rationale: Păstrează construcția de scop sau rezultat și limbajul caracteristic al împlinirii profetice, fără a decide mai strict între scop și rezultat.
- source_word: αἱ γραφαὶ τῶν προφητῶν
  choice: Scripturile profeților
  rationale: „Scripturile” indică scrierile sacre, iar genitivul concis „profeților” nu adaugă dacă acestea au fost scrise ori rostite de profeți.
- source_word: τότε
  choice: Atunci
  rationale: Marchează simplu succesiunea imediată a evenimentelor.
- source_word: οἱ μαθηταὶ πάντες
  choice: toți ucenicii
  rationale: Păstrează explicit totalitatea grupului, fără a adăuga un posesiv absent din text.
- source_word: ἀφέντες αὐτὸν
  choice: l-au lăsat
  rationale: Formulare naturală și concisă; în context, participiul poate avea și sensul mai apăsat de abandonare, consemnat în notă.
- source_word: ἔφυγον
  choice: au fugit
  rationale: Redă direct sensul lui φεύγω și păstrează gravitatea narațiunii.
theological_decisions:
- issue: Împlinirea Scripturilor profetice
  choice: ca să se împlinească Scripturile profeților
  alternative: ca să se adeverească ceea ce au scris profeții
  rationale: Textul exprimă explicit motivul împlinirii și lasă deschisă nuanța de scop sau rezultat a construcției cu ἵνα; parafraza alternativă ar restrânge nejustificat sensul genitivului și al termenului „Scripturi”.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează concizia narațiunii și terminologia biblică familiară, fără arhaisme și fără a netezi ambiguitatea dintre scop și rezultat.
