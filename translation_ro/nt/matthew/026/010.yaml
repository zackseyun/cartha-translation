id: MAT.26.10
reference: Matthew 26:10
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Τί κόπους παρέχετε τῇ γυναικί; ἔργον γὰρ καλὸν ἠργάσατο εἰς ἐμέ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/010.yaml
  text: But Jesus[a], knowing this, said to them[b], “Why are you causing trouble for the woman? For she has done a beautiful work to me.
translation:
  language: ro
  text: 'Dar Isus, dându-și seama de aceasta, le-a zis: „De ce îi faceți necazuri femeii? Căci ea a făcut pentru mine o faptă frumoasă[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „o faptă bună”.'
    reason: Alternativa redă sensul moral direct al adjectivului καλόν, în timp ce textul principal păstrează și nuanța de frumusețe și noblețe.
lexical_decisions:
- source_word: γνοὺς
  choice: dându-și seama de aceasta
  rationale: Participiul aorist indică faptul că Isus a perceput critica ucenicilor înainte de a le răspunde. „De aceasta” explicitează referentul implicit din context, într-o română firească.
- source_word: δὲ
  choice: Dar
  rationale: Conjuncția marchează contrastul dintre nemulțumirea ucenicilor și răspunsul corectiv al lui Isus.
- source_word: Τί κόπους παρέχετε τῇ γυναικί
  choice: De ce îi faceți necazuri femeii?
  rationale: Expresia idiomatică descrie provocarea de necaz, tulburare sau suferință. Formularea păstrează atât forța mustrării, cât și imaginea pluralului κόπους, fiind naturală în româna actuală.
- source_word: ἔργον καλὸν
  choice: o faptă frumoasă
  rationale: καλός poate exprima atât bunătatea, cât și frumusețea, noblețea ori caracterul potrivit al unei fapte. „Faptă frumoasă” redă bine aprecierea amplă a gestului femeii.
- source_word: ἠργάσατο
  choice: a făcut
  rationale: Aoristul prezintă actul ca fapt împlinit; în română, perfectul compus este redarea firească în acest context narativ.
- source_word: εἰς ἐμέ
  choice: pentru mine
  rationale: εἰς cu referire la o persoană poate indica orientarea sau raportarea către acea persoană. În contextul unei fapte, „pentru mine” este formularea românească naturală, fără a exclude nuanța orientării către Isus.
theological_decisions:
- issue: Evaluarea faptei femeii
  choice: o faptă frumoasă
  alternative: o faptă bună
  rationale: Redarea păstrează aprecierea morală și estetică a lui καλόν fără a introduce idei despre merit, sacrament sau alte concluzii doctrinare care nu sunt afirmate în verset.
translation_notes:
  register: Română literară modernă, clară și demnă. Construcția „îi faceți necazuri femeii” este accesibilă și păstrează expresivitatea idiomului grec; pronumele referitor la Isus este scris cu literă mică, conform ortografiei curente și fără a transforma o convenție editorială într-o distincție teologică.
