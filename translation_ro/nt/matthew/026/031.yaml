id: MAT.26.31
reference: Matthew 26:31
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς· Πάντες ὑμεῖς σκανδαλισθήσεσθε ἐν ἐμοὶ ἐν τῇ νυκτὶ ταύτῃ, γέγραπται γάρ· Πατάξω τὸν ποιμένα, καὶ ⸀διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/031.yaml
  text: 'Then Jesus says to them[a], “You will all fall away because of me this night, for it is written: ‘I will strike the shepherd[c][b], and the sheep of the flock will be scattered.’”'
translation:
  language: ro
  text: 'Atunci Isus le spune: „În noaptea aceasta, voi toți vă veți poticni[a] din cauza Mea, căci este scris: «Voi lovi păstorul și oile turmei vor fi risipite.»”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Verbul grecesc poate însemna „a se poticni”, „a fi făcut să cadă” sau „a se îndepărta”. Aici contextul indică faptul că ucenicii Îl vor părăsi pe Isus.
    reason: lexical_alternative
  - marker: b
    text: Citat din Zaharia 13:7.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Adverb temporal firesc în narațiune, care introduce următorul moment al desfășurării evenimentelor.
- source_word: λέγει
  choice: spune
  rationale: Păstrează prezentul istoric grecesc și vivacitatea narațiunii.
- source_word: Πάντες ὑμεῖς
  choice: voi toți
  rationale: Redă explicit accentul combinației grecești asupra tuturor ucenicilor.
- source_word: σκανδαλισθήσεσθε
  choice: vă veți poticni
  rationale: Păstrează metafora și o parte din amplitudinea semantică a verbului grec; în context, poticnirea se concretizează în părăsirea lui Isus, fapt explicat în notă.
- source_word: ἐν ἐμοὶ
  choice: din cauza Mea
  rationale: 'Redă idiomatic relația cauzală: ceea ce I se întâmplă lui Isus va deveni pricina poticnirii ucenicilor.'
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: în noaptea aceasta
  rationale: Formulare naturală și demnă, apropiată de construcția greacă; „chiar în noaptea aceasta” ar adăuga un accent absent explicit.
- source_word: γέγραπται γάρ
  choice: căci este scris
  rationale: Formula românească consacrată și exactă pentru introducerea unui citat din Scriptură.
- source_word: Πατάξω
  choice: Voi lovi
  rationale: Redă direct viitorul activ fără a preciza suplimentar rezultatul lovirii.
- source_word: τὸν ποιμένα
  choice: păstorul
  rationale: Păstrează imaginea scripturistică în forma ei directă.
- source_word: διασκορπισθήσονται
  choice: vor fi risipite
  rationale: Păstrează viitorul pasiv și imaginea oilor despărțite unele de altele.
- source_word: τὰ πρόβατα τῆς ποίμνης
  choice: oile turmei
  rationale: Redă ambele substantive din textul grec, fără a reduce expresia la simplul „oile”.
theological_decisions:
- issue: Sensul lui σκανδαλισθήσεσθε în relație cu Isus
  choice: „vă veți poticni”, cu precizarea că aici contextul indică părăsirea lui Isus
  alternative: „Mă veți părăsi” sau „veți cădea de la credință din cauza Mea”
  rationale: „Vă veți poticni” păstrează metafora și ambiguitatea autentică a verbului, iar nota lămurește forța contextuală fără a transforma afirmația într-o categorie doctrinară explicită de apostazie definitivă.
- issue: Prezentul istoric λέγει
  choice: „spune”
  alternative: „a spus”
  rationale: Prezentul păstrează textura narativă a grecei fără să schimbe conținutul teologic.
- issue: Identitatea păstorului din citat
  choice: Păstrează simplu „păstorul” în text
  alternative: Identificarea explicită în traducere a păstorului cu Isus
  rationale: Contextul face aplicarea evidentă, dar citatul nu adaugă numele; traducerea nu trebuie să introducă o explicitare interpretativă în corpul versetului.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Prezentul istoric a fost păstrat. Majuscula reverențială din „Mea” urmează uzul românesc religios curent, fără a modifica sensul sursei.
