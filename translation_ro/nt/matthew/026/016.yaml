  yaml_path: translation/nt/matthew/026/016.yaml
  text: And from then on he was seeking an opportunity to hand him over[a].
translation:
  language: ro
  text: Și, de atunci, căuta un prilej potrivit ca să-l predea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „să-l trădeze”. Verbul grecesc înseamnă, mai literal, „să-l predea” sau „să-l dea pe mâna cuiva”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τότε
  choice: de atunci
  rationale: Redă firesc punctul temporal de la care începe acțiunea continuă.
- source_word: ἐζήτει
  choice: căuta
  rationale: Imperfectul indică o căutare desfășurată sau repetată; imperfectul românesc păstrează această valoare.
- source_word: εὐκαιρίαν
  choice: un prilej potrivit
  rationale: Păstrează atât ideea unei ocazii, cât și nuanța unui moment favorabil sau adecvat.
- source_word: ἵνα
  choice: ca să
  rationale: Exprimă natural în română scopul introdus de ἵνα.
- source_word: αὐτὸν
  choice: -l
  rationale: Pronumele acuzativ îl desemnează pe Isus în context.
- source_word: παραδῷ
  choice: să-l dea pe mâna lor
  rationale: Redă sensul de bază «a preda/a da pe mâna cuiva» și evită restrângerea verbului la sensul interpretativ «a trăda»; «lor» este implicit contextual, nu exprimat lexical în acest verset.
theological_decisions:
- issue: Redarea lui παραδῷ în contextul acțiunii lui Iuda
  choice: să-l dea pe mâna lor
  alternative: să-l trădeze
  rationale: Acțiunea este într-adevăr o trădare, dar verbul grec are sensul mai larg de a preda sau a da pe cineva pe mâna altora. Textul principal păstrează acest sens, iar nota oferă alternativa contextuală.
translation_notes:
  register: Română standard modernă, clară și demnă. „Prilej potrivit” redă concis nuanța favorabilă a lui εὐκαιρία, iar construcția „a da pe mâna lor” este idiomatică și păstrează tensiunea lexicală față de redarea explicită „a trăda”.
