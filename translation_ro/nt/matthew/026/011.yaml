id: MAT.26.11
reference: Matthew 26:11
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/011.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: ro
  text: Căci pe săraci îi aveți întotdeauna cu voi[a], dar pe Mine nu Mă aveți întotdeauna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „pe oamenii săraci”.'
    reason: Alternativă lexicală ce explicitează referirea colectivă a adjectivului substantivizat.
lexical_decisions:
- source_word: πάντοτε
  choice: întotdeauna
  rationale: Redă firesc ideea de prezență continuă și păstrează repetarea adverbului în ambele propoziții.
- source_word: γὰρ
  choice: căci
  rationale: Marchează legătura explicativă cu afirmația precedentă într-un registru biblic demn, dar încă actual.
- source_word: τοὺς πτωχοὺς
  choice: pe săraci
  rationale: Pluralul articulat îi desemnează colectiv pe oamenii săraci; formularea este concisă și idiomatică în română.
- source_word: ἔχετε
  choice: îi aveți / Mă aveți
  rationale: Aici verbul exprimă prezența sau disponibilitatea alături de ucenici, nu posesia; aceeași redare păstrează paralelismul celor două propoziții.
- source_word: μεθ’ ἑαυτῶν
  choice: cu voi
  rationale: Redă natural relația de prezență alături de destinatari, fără literalismul nefiresc «cu voi înșivă».
- source_word: ἐμὲ
  choice: pe Mine
  rationale: Pronumele accentuat și poziția sa contrastivă sunt redate prin construcția românească marcată cu «pe»; majuscula urmează convenția editorială pentru referirea la Isus.
- source_word: δὲ
  choice: dar
  rationale: Exprimă limpede contrastul dintre prezența continuă a săracilor și durata limitată a prezenței lui Isus.
- source_word: οὐ πάντοτε
  choice: nu ... întotdeauna
  rationale: Păstrează negația și repetarea lui πάντοτε, precum și contrastul temporal cu prima propoziție.
theological_decisions:
- issue: Implicația prezenței lui Isus
  choice: Textul contrastează prezența continuă a săracilor cu caracterul temporar al prezenței lui Isus alături de ucenici în acel moment.
  alternative: Versetul poate fi interpretat ca minimalizând grija față de săraci.
  rationale: Greaca formulează un contrast temporal, nu o depreciere morală a săracilor. Traducerea păstrează tensiunea și unicitatea momentului fără a adăuga o concluzie despre milostenie.
translation_notes:
  register: Română standard modernă, clară și demnă. «Căci» păstrează legătura explicativă; ordinea «pe săraci îi aveți» și «pe Mine nu Mă aveți» redă accentul contrastiv al pronumelor și paralelismul grecesc.
