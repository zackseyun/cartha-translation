source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Ἑταῖρε, ἐφ’ ⸀ὃ πάρει. τότε προσελθόντες ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν καὶ ἐκράτησαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/050.yaml
  text: But Jesus said to him[a], “Friend, do what you came for.” Then they came up, laid hands on Jesus, and seized him.
translation:
  language: ro
  text: 'Dar Isus i-a zis: „Prietene, fă ce ai venit să faci.”[a] Atunci ei s-au apropiat, au pus mâna pe Isus și L-au prins.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Prietene, pentru ce ai venit?” Expresia grecească este concisă și poate fi înțeleasă ca o întrebare.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Prietene
  rationale: Vocativ adresat lui Iuda; redă o adresare reținută, fără a sugera neapărat o prietenie intimă.
- source_word: ἐφ’ ὃ πάρει
  choice: fă ce ai venit să faci
  rationale: Redă natural construcția greacă eliptică în sens permisiv sau imperativ contextual, păstrând în nota de subsol posibilitatea interpretării interogative.
- source_word: προσελθόντες
  choice: s-au apropiat
  rationale: Exprimă firesc deplasarea grupului spre Isus și succesiunea narativă.
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν
  choice: au pus mâna pe Isus
  rationale: Expresie românească naturală pentru apucarea ostilă a cuiva; singularul idiomatic evită o redare rigid literală.
- source_word: ἐκράτησαν αὐτόν
  choice: L-au prins
  rationale: Redă apucarea și capturarea fizică fără a introduce explicit nuanța juridică a verbului „a aresta”.
- source_word: δὲ
  choice: Dar
  rationale: Marchează contrastul ușor și tranziția de la gestul lui Iuda la răspunsul lui Isus.
theological_decisions:
- issue: Interpretarea adresării și a răspunsului lui Isus către Iuda
  choice: „Prietene, fă ce ai venit să faci.”
  alternative: „Prietene, pentru ce ai venit?”
  rationale: Formularea principală păstrează tonul reținut și tensiunea scenei, iar nota consemnează caracterul concis și ambiguu al expresiei grecești, care poate fi înțeleasă și ca întrebare.
translation_notes:
  register: Română standard modernă, clară și demnă. Adresarea „Prietene” nu este accentuată ca termen de intimitate, iar formularea eliptică grecească este redată firesc în text și documentată prin notă.
