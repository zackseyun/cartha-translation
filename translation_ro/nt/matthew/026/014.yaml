    issue: „preoții conducători” pentru ἀρχιερεῖς
    rationale: Expresia poate desemna în mod general orice preoți aflați în conducere și nu este termenul românesc cel mai clar pentru autoritățile preoțești superioare pe care le desemnează ἀρχιερεῖς. „Preoții cei mai de seamă” păstrează pluralul, statutul superior și uzul biblic românesc fără a sugera mai mulți mari-preoți în funcție.
