  verdict: revise
  source_fidelity: Textul redă corect succesiunea narativă (Τότε), deplasarea lui Iuda către autoritățile preoțești și expresia partitivă „unul dintre cei doisprezece”. „S-a dus” este o transpunere idiomatică adecvată a lui πορευθείς. Pentru ἀρχιερεῖς, însă, „preoții conducători” este mai puțin precis și mai puțin idiomatic ca termen pentru corpul preoțesc superior din contextul iudaic al perioadei celui de-al Doilea Templu.
  naturalness: Formularea este în general firească în româna standard modernă. „Preoții cei mai de seamă” este mai natural în registru biblic modern și identifică mai limpede grupul vizat decât „preoții conducători”. Virgula finală este justificată, deoarece propoziția continuă în versetul următor.
  terminology: „Iuda Iscarioteanul” este forma românească consacrată și adecvată. Alternativa din nota pentru „cei doisprezece/Cei Doisprezece” păstrează în mod corect opțiunea de capitalizare fără a impune o interpretare. „Preoții cei mai de seamă” redă terminologic mai bine pluralul ἀρχιερεῖς decât un termen generic pentru preoți cu rol de conducere.
  issues:
