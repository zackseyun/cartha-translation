  text: Τότε πορευθεὶς εἷς τῶν δώδεκα, ὁ λεγόμενος Ἰούδας Ἰσκαριώτης, πρὸς τοὺς ἀρχιερεῖς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/014.yaml
  text: Then one of the twelve[a], the one called Judas Iscariot, went to the chief priests,
translation:
  language: ro
  text: Atunci, unul dintre cei doisprezece[a], cel numit Iuda Iscarioteanul, s-a dus la preoții cei mai de seamă,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „unul dintre Cei Doisprezece”.'
    reason: Alternativă lexicală și tipografică ce tratează expresia drept denumire consacrată a grupului.
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Redă firesc marcatorul temporal și succesiunea narativă.
- source_word: πορευθεὶς
  choice: s-a dus
  rationale: Participiul aorist cu sens de deplasare este redat idiomatic printr-un verb finit, fără construcția rigidă „ducându-se”.
- source_word: εἷς τῶν δώδεκα
  choice: unul dintre cei doisprezece
  rationale: Păstrează expresia partitivă și evită impunerea prin majusculă a unui titlu de grup, fără a pierde referința clară la cercul celor doisprezece.
- source_word: ὁ λεγόμενος
  choice: cel numit
  rationale: Păstrează structura apozițională și accentul identificator al expresiei grecești.
- source_word: Ἰούδας Ἰσκαριώτης
  choice: Iuda Iscarioteanul
  rationale: Folosește formele consacrate și inteligibile în româna biblică modernă pentru nume și epitet.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: la preoții conducători
  rationale: „La” exprimă deplasarea spre persoane, iar „preoții conducători” redă pluralul ἀρχιερεῖς ca desemnare a autorităților preoțești superioare, fără sugestia inexactă a mai multor mari-preoți simultani.
theological_decisions:
- issue: Redarea denumirii de grup τῶν δώδεκα
  choice: cei doisprezece
  alternative: Cei Doisprezece
  rationale: Forma cu literă mică nu introduce o capitalizare interpretativă, dar identifică limpede grupul apropiat al lui Isus.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Topica urmează îndeaproape greaca, dar participiul este transpus idiomatic. Virgula finală este păstrată deoarece versetul continuă sintactic în versetul următor.
