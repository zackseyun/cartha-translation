id: MAT.26.53
reference: Matthew 26:53
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἢ δοκεῖς ὅτι οὐ ⸀δύναμαι παρακαλέσαι τὸν πατέρα μου, καὶ παραστήσει μοι ⸂ἄρτι πλείω⸃ δώδεκα λεγιῶνας ἀγγέλων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/053.yaml
  text: Or do you think that I cannot appeal to my Father[c][b][a], and he will at once place at my disposal more than twelve legions of angels?
translation:
  language: ro
  text: Sau crezi că nu pot să apelez la Tatăl meu[a], iar el îmi va pune îndată la dispoziție mai mult de douăsprezece legiuni[b] de îngeri?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „să-l rog pe Tatăl meu” ori „să-i cer ajutor Tatălui meu”.'
    reason: lexical_alternative
  - marker: b
    text: Legiunea era o mare unitate militară romană; expresia subliniază amploarea covârșitoare a forței cerești.
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: Sau
  rationale: Introduce alternativa retorică prin care Isus continuă mustrarea; formularea simplă păstrează cursul argumentului.
- source_word: δοκεῖς
  choice: crezi
  rationale: Redă firesc în română întrebarea directă și retorică.
- source_word: οὐ δύναμαι
  choice: nu pot
  rationale: Păstrează sensul de capacitate sau putere, fără a-l transforma în permisiune ori voință.
- source_word: παρακαλέσαι
  choice: să-l chem în ajutor
  rationale: În context, verbul indică adresarea unei cereri urgente Tatălui pentru ajutor; expresia românească păstrează atât ideea de apel, cât și pe cea de solicitare.
- source_word: τὸν πατέρα μου
  choice: pe Tatăl meu
  rationale: Redă direct relația filială divină; majuscula urmează uzul românesc biblic pentru referirea la Dumnezeu.
- source_word: παραστήσει μοι
  choice: îmi va pune ... la dispoziție
  rationale: Exprimă faptul că forța îngerească ar fi pusă lângă Isus, disponibilă pentru ajutor, fără a reduce verbul la simplul «a trimite».
- source_word: ἄρτι
  choice: chiar acum
  rationale: Păstrează accentul contextual asupra disponibilității imediate a ajutorului.
- source_word: πλείω δώδεκα
  choice: mai mult de douăsprezece
  rationale: Redă direct comparația cantitativă din greacă.
- source_word: λεγιῶνας
  choice: legiuni
  rationale: Păstrează imaginea militară romană și ideea unei forțe covârșitoare.
- source_word: ἀγγέλων
  choice: de îngeri
  rationale: Contextul indică ființe cerești, nu mesageri umani.
theological_decisions:
- issue: Dacă afirmația lui Isus privește capacitatea, permisiunea sau disponibilitatea de a cere ajutor divin
  choice: «nu pot să-l chem în ajutor pe Tatăl meu» — formulare despre capacitate
  alternative: O redare mai liberă care ar sugera că Isus nu vrea ori nu are voie să ceară ajutor
  rationale: δύναμαι exprimă capacitatea sau puterea. Versetul afirmă că Isus ar putea cere un ajutor ceresc covârșitor, păstrând tensiunea dintre puterea disponibilă și acceptarea arestării, fără explicație doctrinară adăugată.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. «Să-l chem în ajutor» este idiomatic, dar păstrează forța petiționară a verbului; «îmi va pune ... la dispoziție» conservă imaginea disponibilității pentru ajutor. Marcajele notelor apar în text la termenii relevanți.
