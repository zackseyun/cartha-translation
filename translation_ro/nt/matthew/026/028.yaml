  text: τοῦτο γάρ ἐστιν τὸ αἷμά ⸀μου ⸀τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/028.yaml
  text: For this is my blood of the covenant[b][a], which is poured out for many for the forgiveness of sins.
translation:
  language: ro
  text: Căci acesta este sângele Meu, sângele legământului[a], care este vărsat pentru mulți[b], spre iertarea păcatelor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Unele manuscrise au: „sângele Meu, sângele noului legământ”.'
    reason: textual_variant
  - marker: b
    text: 'Sau: „în folosul multora”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: acesta
  rationale: Pronumele demonstrativ se referă la ceea ce Isus prezintă la masă. Greaca spune simplu „acesta”; substantivul „paharul” nu este introdus.
- source_word: γάρ
  choice: căci
  rationale: Păstrează valoarea explicativă și legătura cu porunca precedentă de a bea, într-un registru biblic demn, dar încă firesc în româna modernă.
- source_word: τὸ αἷμά μου τῆς διαθήκης
  choice: sângele Meu, sângele legământului
  rationale: Reluarea substantivului evită construcția românească ambiguă sau greoaie „sângele Meu al legământului” și redă clar relația atributivă, fără a adăuga „nou”.
- source_word: περὶ πολλῶν
  choice: pentru mulți
  rationale: În context sacrificial, περί cu genitivul exprimă referința și beneficiul în favoarea altora. Formularea păstrează „mulți” și nu soluționează disputa privind întinderea ispășirii.
- source_word: ἐκχυννόμενον
  choice: care este vărsat
  rationale: Redă participiul prezent pasiv care determină „sângele” și păstrează imaginea sacrificială într-o formulare românească naturală.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: spre iertarea păcatelor
  rationale: „Spre” păstrează orientarea de scop sau rezultat a lui εἰς, iar „iertarea păcatelor” este expresia clară și consacrată în româna actuală.
theological_decisions:
- issue: Includerea adjectivului „nou” lângă „legământ”
  choice: sângele legământului
  alternative: sângele noului legământ
  rationale: Textul SBLGNT furnizat nu conține καινῆς („nou”). Traducerea urmează textul de bază, iar varianta manuscrisă este consemnată în notă.
- issue: Sensul expresiei „pentru mulți” în limbajul ispășirii
  choice: pentru mulți
  alternative: pentru toți
  rationale: Grecescul πολλῶν înseamnă „mulți”. Formularea este păstrată fără a decide prin traducere dezbaterea teologică mai largă despre întinderea ispășirii.
- issue: Nuanța prepoziției περί cu genitivul
  choice: pentru mulți
  alternative: în folosul multora
  rationale: „Pentru” este natural și poate exprima beneficiul sau reprezentarea cerută de context, fără a face mai explicit decât originalul mecanismul teologic.
translation_notes:
  register: Română standard modernă, cu ton solemn și accesibil. Majuscula reverențială din „Meu” este folosită potrivit convenției editoriale biblice românești. Apoziția „sângele legământului” oferă claritate fără parafrazare doctrinară. Markerii notelor sunt plasați exact lângă elementele pe care le explică.
