  source_fidelity: 'Textul redă fidel enunțul grec: formula solemnă Ἀμὴν λέγω σοι este redată prin „Adevărat îți spun”; cadrul temporal emfatic ἐν ταύτῃ τῇ νυκτί prin „chiar în noaptea aceasta”; construcția πρὶν ... φωνῆσαι printr-o subordonată temporală firească; iar ἀπαρνήσῃ με prin idiomaticul „te vei lepăda de mine”. „De trei ori” corespunde exact lui τρὶς.'
