id: MAT.26.34
reference: Matthew 26:34
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι ἐν ταύτῃ τῇ νυκτὶ πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/034.yaml
  text: Jesus said to him, “Truly I tell you, in this very night, before a rooster crows, you will deny me three times.”
translation:
  language: ro
  text: 'Isus i-a spus: „Adevărat îți spun: chiar în noaptea aceasta[a], înainte să cânte un cocoș[b], te vei lepăda de mine de trei ori.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „în noaptea aceasta”. Demonstrativul grecesc „aceasta” este accentuat aici.
    reason: lexical_alternative
  - marker: b
    text: Sau „înainte să cânte cocoșul”. În greacă, „cocoș” nu are articol, dar româna poate folosi și articolul hotărât cu sens generic.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Isus i-a spus
  rationale: Redă firesc verbul narativ la trecut și păstrează destinatarul exprimat prin pronumele indirect.
- source_word: Ἀμὴν λέγω σοι
  choice: Adevărat îți spun
  rationale: Formula solemnă introductivă este idiomatică în româna actuală și păstrează greutatea afirmației fără a lăsa termenul semitic netradus.
- source_word: ἐν ταύτῃ τῇ νυκτί
  choice: chiar în noaptea aceasta
  rationale: Păstrează atât cadrul temporal, cât și accentul demonstrativului ταύτῃ; «chiar» face explicită emfaza într-o formulare românească naturală.
- source_word: πρὶν ἀλέκτορα φωνῆσαι
  choice: înainte să cânte un cocoș
  rationale: Construcția cu infinitiv este redată natural printr-o propoziție temporală; substantivul grecesc este nearticulat, iar verbul românesc consacrat pentru glasul cocoșului este «a cânta».
- source_word: τρὶς
  choice: de trei ori
  rationale: Este echivalentul modern și direct al adverbului grec.
- source_word: ἀπαρνήσῃ με
  choice: te vei lepăda de mine
  rationale: În context, verbul indică negarea relației sau asocierii cu Isus. Expresia românească este clară și păstrează forma verbală reflexivă firească, fără a extinde sensul.
theological_decisions:
- issue: Formula introductivă solemnă Ἀμὴν λέγω σοι
  choice: Adevărat îți spun
  alternative: Amin, îți spun
  rationale: Varianta aleasă comunică autoritatea solemnă a spuselor lui Isus în româna modernă, fără a introduce în textul principal conotațiile liturgice pe care «Amin» le poate avea pentru cititor.
- issue: Sensul lui ἀπαρνέομαι în raport cu Isus
  choice: te vei lepăda de mine
  alternative: mă vei tăgădui / mă vei nega
  rationale: Alegerea exprimă negarea legăturii personale cu Isus, cerută de context, fără a o reduce la contestarea verbală a unei afirmații și fără a adăuga o interpretare doctrinară.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Ordinea și ritmul urmăresc îndeaproape enunțul grec, dar evită formulările arhaice precum «a tăgădui» în textul principal. Pronumele referitor la Isus este scris cu minusculă, conform ortografiei românești obișnuite și unei prezentări neconfesionale.
