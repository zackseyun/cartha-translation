id: MAT.26.47
reference: Matthew 26:47
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ ἔτι αὐτοῦ λαλοῦντος ἰδοὺ Ἰούδας εἷς τῶν δώδεκα ἦλθεν καὶ μετ’ αὐτοῦ ὄχλος πολὺς μετὰ μαχαιρῶν καὶ ξύλων ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/047.yaml
  text: And while he was still speaking[a], behold, Judas, one of the twelve, came, and with him a large crowd with swords and clubs[b], from the chief priests and elders of the people.
translation:
  language: ro
  text: Pe când el încă vorbea, iată că a venit Iuda, unul dintre cei doisprezece, și cu el, o mare mulțime cu săbii și bâte[a], de la marii preoți și bătrânii poporului[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „bețe”. Termenul grecesc se referă literal la bucăți de lemn; aici desemnează probabil bâte sau ciomege.
    reason: lexical_alternative
  - marker: b
    text: Sau „trimisă de marii preoți și de bătrânii poporului”. Greaca spune mai literal „de la marii preoți și bătrânii poporului”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Pe când el încă vorbea
  rationale: Redă genitivul absolut ca acțiune simultană, iar „încă” păstrează firesc valoarea lui ἔτι în româna modernă.
- source_word: ἰδοὺ
  choice: iată că
  rationale: Păstrează marcatorul narativ de vivacitate și iminență într-o formulare românească naturală și demnă.
- source_word: Ἰούδας
  choice: Iuda
  rationale: Forma consacrată în limba română pentru numele grecesc Ἰούδας.
- source_word: εἷς τῶν δώδεκα
  choice: unul dintre cei doisprezece
  rationale: Redare directă a construcției partitive, fără a transforma în mod necesar numeralul într-un titlu formal.
- source_word: ἦλθεν
  choice: a venit
  rationale: Echivalent narativ direct pentru aoristul verbului ἔρχομαι.
- source_word: ὄχλος πολὺς
  choice: o mulțime mare
  rationale: Păstrează sensul cantitativ al adjectivului πολύς fără a introduce prin „gloată” o ostilitate mai explicită decât exprimă substantivul însuși.
- source_word: μετὰ μαχαιρῶν
  choice: cu săbii
  rationale: „Săbii” este echivalentul românesc larg și consacrat pentru armele desemnate aici prin μάχαιραι.
- source_word: καὶ ξύλων
  choice: și bâte
  rationale: Deși ξύλον înseamnă literal lemn sau bucată de lemn, contextul armelor indică bâte folosite ca arme.
- source_word: ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ
  choice: venită de la conducătorii preoților și de la bătrânii poporului
  rationale: „De la” păstrează ideea de sursă exprimată de ἀπό, fără să introducă explicit verbul „a trimite”; „conducătorii preoților” redă funcția grupului desemnat prin ἀρχιερεῖς.
theological_decisions:
- issue: Dacă mulțimea trebuie prezentată explicit ca fiind trimisă oficial de conducătorii iudei
  choice: venită de la conducătorii preoților și de la bătrânii poporului
  alternative: trimisă de conducătorii preoților și de bătrânii poporului
  rationale: Prepoziția ἀπό indică sursa sau proveniența, iar contextul sugerează însărcinarea mulțimii, dar textul nu folosește explicit un verb al trimiterii. Formularea principală păstrează această tensiune.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. „Iată că” păstrează energia discursivă a originalului fără arhaizare excesivă; „bâte” este mai curent decât „ciomege”, iar alternativa este consemnată în notă.
