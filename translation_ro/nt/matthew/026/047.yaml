revisions:
- from: Pe când el încă vorbea, iată că a venit Iuda, unul dintre cei doisprezece, iar împreună cu el era o mulțime mare, cu săbii și bâte[a], venită de la conducătorii preoților și de la bătrânii poporului[b].
  to: Pe când el încă vorbea, iată că a venit Iuda, unul dintre cei doisprezece, și cu el, o mare mulțime cu săbii și bâte[a], de la marii preoți și bătrânii poporului[b].
  rationale: Revizuirea înlocuiește parafraza imprecisă „conducătorii preoților” cu termenul românesc adecvat „marii preoți”, fluidizează construcția narativă și ajustează notele pentru a reflecta exact alternativele lexicale și ambiguitatea lui ἀπό. Nu este introdusă în text afirmația mai puternică „trimisă”.
