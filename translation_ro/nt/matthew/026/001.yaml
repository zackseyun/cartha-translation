  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς πάντας τοὺς λόγους τούτους, εἶπεν τοῖς μαθηταῖς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/001.yaml
  text: And when Jesus had finished all these words[a], he said to his disciples,
translation:
  language: ro
  text: 'Când Isus a terminat toate aceste cuvinte, le-a spus ucenicilor săi:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: După ce
  rationale: Formula narativă semitizantă introduce aici o împrejurare temporală. În româna actuală, „După ce” redă firesc anterioritatea acțiunii încheiate, fără formularea greoaie „Și s-a întâmplat când”.
- source_word: ἐτέλεσεν
  choice: a sfârșit
  rationale: Verbul indică ducerea la capăt a discursului. „A sfârșit” este natural și demn în această formulă mateană, păstrând ideea de încheiere.
- source_word: πάντας τοὺς λόγους τούτους
  choice: toate aceste cuvinte
  rationale: Redarea păstrează explicit atât πάντας, cât și sensul direct al lui λόγους și menține formula prin care Matei încheie un discurs.
- source_word: εἶπεν
  choice: le-a spus
  rationale: Este echivalentul narativ firesc al lui λέγω; pronumele datival „le” redă destinatarul exprimat în greacă.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ucenicilor săi
  rationale: „Ucenici” este termenul românesc consacrat și clar pentru μαθηταί, iar „săi” păstrează posesivul explicit αὐτοῦ.
theological_decisions: []
translation_notes:
  register: Română standard modernă, într-un registru narativ demn și accesibil. Formula grecească Καὶ ἐγένετο ὅτε este naturalizată pentru a evita un semitism rigid; construcția rămâne fidelă succesiunii temporale și funcției de încheiere a discursului.
