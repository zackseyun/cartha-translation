id: MAT.26.69
reference: Matthew 26:69
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ὁ δὲ Πέτρος ⸂ἐκάθητο ἔξω⸃ ἐν τῇ αὐλῇ· καὶ προσῆλθεν αὐτῷ μία παιδίσκη λέγουσα· Καὶ σὺ ἦσθα μετὰ Ἰησοῦ τοῦ Γαλιλαίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/069.yaml
  text: Peter was sitting outside in the courtyard[a], and one servant girl came up to him, saying, “You also were with Jesus the Galilean.”
translation:
  language: ro
  text: 'Petru ședea afară, în curte, iar o slujnică[a] s-a apropiat de el și i-a zis: „Și tu erai cu Isus Galileeanul.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „o servitoare” ori „o sclavă tânără”. Termenul grecesc παιδίσκη poate desemna o tânără aflată în slujba cuiva, uneori având statut de sclavă.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: iar
  rationale: Marchează o tranziție narativă ușoară și leagă firesc scena cu Petru de desfășurarea precedentă, fără a introduce un «acum» temporal inexistent în text.
- source_word: ἐκάθητο ἔξω
  choice: ședea afară
  rationale: Imperfectul exprimă o stare în desfășurare în trecut; «ședea» este natural și demn în româna biblică modernă, iar «afară» păstrează raportarea la cele petrecute în interior.
- source_word: ἐν τῇ αὐλῇ
  choice: în curte
  rationale: αὐλή desemnează aici curtea deschisă a reședinței marelui-preot; «curte» este formularea românească limpede și contextual precisă.
- source_word: προσῆλθεν αὐτῷ
  choice: s-a apropiat de el
  rationale: Redă direct apropierea fizică exprimată de προσέρχομαι, într-o formulare românească naturală.
- source_word: μία παιδίσκη
  choice: o slujnică
  rationale: παιδίσκη poate desemna o tânără servitoare, uneori sclavă. Articolul nehotărât românesc introduce firesc personajul; numeralul μία nu trebuie forțat ca «una», întrucât aici are în principal valoare introductivă.
- source_word: λέγουσα
  choice: și i-a zis
  rationale: Participiul circumstanțial este redat idiomatic printr-un verb coordonat; construcția românească evită rigiditatea lui «spunând» fără a schimba succesiunea acțiunilor.
- source_word: Καὶ σὺ
  choice: Și tu
  rationale: 'Păstrează accentul inclusiv asupra lui Petru: și el, asemenea altora, fusese asociat cu Isus.'
- source_word: ἦσθα μετὰ
  choice: erai cu
  rationale: Redă simplu relația exprimată de text, fără adaosul interpretativ «erai dintre ucenicii».
- source_word: Ἰησοῦ τοῦ Γαλιλαίου
  choice: Isus Galileeanul
  rationale: Păstrează epitetul identificator din greacă, mai exact decât o parafrază precum «Isus din Galileea».
theological_decisions: []
