source:
  edition: SBLGNT
  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἀπελθὼν⸃ προσηύξατο ἐκ τρίτου τὸν αὐτὸν λόγον εἰπὼν ⸀πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/044.yaml
  text: And leaving them again[a], he went away and prayed a third time, saying the same thing again.
translation:
  language: ro
  text: Și, lăsându-i, s-a dus din nou și s-a rugat a treia oară, spunând iarăși același lucru[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: „același cuvânt” sau „aceeași rostire”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεὶς αὐτοὺς
  choice: lăsându-i
  rationale: Participiul aorist arată că Isus îi lasă în urmă pe ucenici; forma participială păstrează succesiunea narațiunii și este firească în română.
- source_word: πάλιν ἀπελθὼν
  choice: s-a dus din nou
  rationale: Primul πάλιν exprimă repetarea plecării; plasarea lui lângă verbul finit redă natural în română sensul construcției grecești.
- source_word: προσηύξατο
  choice: s-a rugat
  rationale: Verbul deponent are sensul direct de „a se ruga”; perfectul compus se potrivește narațiunii românești moderne.
- source_word: ἐκ τρίτου
  choice: a treia oară
  rationale: Expresia idiomatică indică a treia ocazie în care are loc rugăciunea.
- source_word: τὸν αὐτὸν λόγον
  choice: același lucru
  rationale: λόγος la singular poate desemna aici rostirea sau conținutul spus. „Același lucru” este firesc în română și păstrează singularul fără a sugera că a fost repetată mecanic fiecare formulare.
- source_word: εἰπὼν πάλιν
  choice: spunând iarăși
  rationale: Redă participiul și al doilea πάλιν, păstrând accentul explicit al textului asupra repetării conținutului rugăciunii.
theological_decisions:
- issue: Repetarea rugăciunii lui Isus
  choice: Sunt păstrate atât a treia ocazie a rugăciunii, cât și repetarea aceluiași conținut.
  alternative: Ultimul „iarăși” ar putea fi omis pentru fluiditate stilistică.
  rationale: Textul grecesc prezentat conține două ocurențe ale lui πάλιν; redarea ambelor păstrează accentul narativ fără a trage concluzii teologice suplimentare.
- issue: Sensul lui λόγος în expresia τὸν αὐτὸν λόγον
  choice: același lucru
  alternative: aceleași cuvinte; aceeași rostire
  rationale: În context, termenul poate indica fie formularea, fie conținutul spus. Alegerea nu restrânge inutil sensul la repetarea verbală exactă, iar nota păstrează sensul mai literal.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. Repetiția „din nou… a treia oară… iarăși” este intenționată, deoarece reflectă repetițiile distincte din greacă.
