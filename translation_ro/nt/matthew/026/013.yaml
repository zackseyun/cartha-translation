source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅπου ἐὰν κηρυχθῇ τὸ εὐαγγέλιον τοῦτο ἐν ὅλῳ τῷ κόσμῳ, λαληθήσεται καὶ ὃ ἐποίησεν αὕτη εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/013.yaml
  text: Truly I tell you, wherever this good news is proclaimed in the whole world, what this woman has done will also be spoken of in memory of her.
translation:
  language: ro
  text: 'Adevărat vă spun: oriunde va fi vestită Evanghelia aceasta[a] în lumea întreagă, se va vorbi și despre ceea ce a făcut femeia aceasta, în amintirea ei.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „vestea aceasta bună”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „se va povesti și ceea ce a făcut femeia aceasta, ca memorial al ei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Adevărat vă spun
  rationale: Redă firesc în româna actuală formula solemnă de afirmare și păstrează adresarea directă la plural.
- source_word: ὅπου ἐὰν
  choice: oriunde
  rationale: Exprimă sensul locativ nedefinit al construcției grecești.
- source_word: κηρυχθῇ
  choice: va fi vestită
  rationale: Păstrează ideea de proclamare publică și se potrivește idiomatic cu „Evanghelia”.
- source_word: τὸ εὐαγγέλιον τοῦτο
  choice: Evanghelia aceasta
  rationale: „Evanghelia” este termenul românesc consacrat și inteligibil pentru εὐαγγέλιον; ordinea demonstrativului reflectă construcția greacă fără a suna nefiresc.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: în lumea întreagă
  rationale: Redare naturală și apropiată de sensul universal al expresiei.
- source_word: λαληθήσεται καὶ ὃ ἐποίησεν αὕτη
  choice: se va vorbi și despre ceea ce a făcut femeia aceasta
  rationale: Pasivul este păstrat prin forma impersonală, iar „despre” face explicită în română relația firească dintre vorbire și fapta relatată; „femeia” clarifică referentul contextual al lui αὕτη.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: în amintirea ei
  rationale: Redă limpede și demn funcția comemorativă a expresiei, fără a o încărca confesional.
theological_decisions:
- issue: Redarea lui εὐαγγέλιον
  choice: Evanghelia
  alternative: vestea cea bună
  rationale: Termenul consacrat „Evanghelia” păstrează aici registrul teologic și corespunde direct substantivului grec, iar sensul lexical transparent este oferit în notă.
- issue: Relația sintactică a expresiei εἰς μνημόσυνον αὐτῆς
  choice: în amintirea ei
  alternative: ca aducere-aminte despre ea
  rationale: Textul principal păstrează deschisă relația exactă dintre relatarea faptei și comemorarea femeii; alternativa formală este consemnată fără a impune o interpretare doctrinară.
translation_notes:
  register: Română standard modernă, cu ton solemn și accesibil. Punctuația evidențiază domeniul universal al proclamării, iar formulările evită atât arhaismele, cât și particularizările confesionale.
