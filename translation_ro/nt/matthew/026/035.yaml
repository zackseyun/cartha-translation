id: MAT.26.35
reference: Matthew 26:35
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πέτρος· Κἂν δέῃ με σὺν σοὶ ἀποθανεῖν, οὐ μή σε ⸀ἀπαρνήσομαι. ⸀ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/035.yaml
  text: Peter said to him[a], “Even if I must die with you, I will certainly not deny you.” Likewise all the disciples also said the same.
translation:
  language: ro
  text: 'Petru i-a zis: „Chiar dacă va trebui să mor împreună cu tine, nicidecum nu mă voi lepăda de tine.”[a] La fel au spus și toți ucenicii.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „nu mă voi lepăda niciodată de tine”. În greacă, negația este puternic accentuată (οὐ μή).'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: i-a zis
  rationale: Prezentul istoric grecesc este redat prin perfectul compus, firesc în narațiunea românească; pronumele indirect exprimă explicit αὐτῷ.
- source_word: Κἂν
  choice: Chiar dacă
  rationale: Construcția introduce o condiție concesivă și subliniază hotărârea declarată de Petru.
- source_word: δέῃ με
  choice: va trebui să
  rationale: Redă ideea de necesitate într-o formulare românească naturală, adecvată perspectivei viitoare a afirmației.
- source_word: σὺν σοὶ ἀποθανεῖν
  choice: să mor împreună cu tine
  rationale: Păstrează explicit atât moartea, cât și asocierea strânsă exprimată de σὺν σοὶ.
- source_word: οὐ μή
  choice: nicidecum nu
  rationale: Dubla formulă grecească exprimă o negație foarte puternică; „nicidecum nu” îi păstrează emfaza fără a adăuga o interpretare.
- source_word: ἀπαρνήσομαι
  choice: mă voi lepăda de tine
  rationale: În contextul relației cu Isus, expresia românească redă negarea sau dezicerea personală implicată de verb și este clară în registrul biblic modern.
- source_word: ὁμοίως
  choice: La fel
  rationale: Redă direct ideea că ceilalți ucenici au făcut aceeași afirmație.
- source_word: πάντες οἱ μαθηταὶ εἶπαν
  choice: au spus și toți ucenicii
  rationale: Păstrează totalitatea exprimată de πάντες și sensul simplu al verbului εἶπαν; poziția lui „și” este idiomatică în română.
theological_decisions:
- issue: Forța declarației lui Petru
  choice: „nicidecum nu mă voi lepăda de tine”
  alternative: „nu mă voi lepăda niciodată de tine”
  rationale: Textul grecesc folosește οὐ μή, o negație emfatică. Formularea aleasă păstrează încrederea categorică a lui Petru și tensiunea narativă, fără a explica sau atenua afirmația.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. „Mă voi lepăda de tine” păstrează formularea relațională consacrată, iar „nicidecum nu” redă emfaza fără rigiditate excesivă.
