  text: ἐδύνατο γὰρ ⸀τοῦτο πραθῆναι πολλοῦ καὶ δοθῆναι πτωχοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/009.yaml
  text: For this could have been sold for a great deal and given to the poor[a].
translation:
  language: ro
  text: Căci acest lucru ar fi putut fi vândut la un preț mare, iar suma obținută să fie dată săracilor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδύνατο
  choice: ar fi putut
  rationale: Imperfectul lui δύναμαι exprimă aici o posibilitate trecută, rămasă nerealizată; condiționalul perfect românesc redă firesc această nuanță împreună cu infinitivele.
- source_word: γὰρ
  choice: Căci
  rationale: Păstrează funcția explicativă a particulei și legătura ei cu reproșul anterior, într-un registru biblic demn, dar încă actual.
- source_word: τοῦτο
  choice: acest lucru
  rationale: Redă demonstrativul neutru fără a introduce explicit substantivul «parfum» sau «mir», care nu apare în acest verset.
- source_word: πραθῆναι
  choice: fi vândut
  rationale: Infinitivul aorist pasiv al lui πιπράσκω este redat prin infinitivul pasiv românesc, dependent de «ar fi putut».
- source_word: πολλοῦ
  choice: pe o sumă mare
  rationale: Genitivul de preț indică valoarea obținută prin vânzare; formularea este naturală în româna modernă și nu precizează o sumă absentă din text.
- source_word: καὶ δοθῆναι
  choice: iar banii să fie dați
  rationale: În context, lucrul vândut nu poate fi el însuși dat săracilor după vânzare; subiectul logic al celui de-al doilea pasiv este suma obținută. «Banii» face elipsa inteligibilă în română, fără a schimba sensul contextual.
- source_word: πτωχοῖς
  choice: săracilor
  rationale: Adjectivul substantivizat la dativ plural desemnează persoanele sărace; dativul românesc redă direct destinatarul.
theological_decisions: []
translation_notes:
  register: Română standard modernă, clară și demnă. «Căci» păstrează legătura explicativă; «pe o sumă mare» este idiomatic, iar explicitarea «banii» evită impresia nelogică potrivit căreia obiectul deja vândut ar fi apoi dat săracilor.
