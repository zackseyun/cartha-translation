  text: Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς ⸀ἄρτον καὶ ⸀εὐλογήσας ἔκλασεν καὶ ⸂δοὺς τοῖς μαθηταῖς⸃ εἶπεν· Λάβετε φάγετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/026.yaml
  text: While they were eating[a], Jesus took bread, and after blessing it, he broke it and gave it to the disciples and said, “Take, eat[d][c][b]; this is my body.”
translation:
  language: ro
  text: 'În timp ce mâncau, Isus a luat pâine și, după ce a rostit binecuvântarea, a frânt-o, le-a dat-o ucenicilor și a spus: „Luați, mâncați; acesta este trupul Meu.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Textul grecesc spune literal: „acesta este trupul Meu”. Unii înțeleg afirmația în sensul „acesta înseamnă/simbolizează trupul Meu”, însă traducerea păstrează formularea sursei.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐσθιόντων δὲ αὐτῶν
  choice: În timp ce mâncau
  rationale: Genitivul absolut stabilește cadrul temporal și descrie o acțiune în desfășurare; formularea este firească în româna modernă. δέ are aici o funcție conectivă ușoară și nu cere redarea printr-un adversativ.
- source_word: λαβὼν ὁ Ἰησοῦς ἄρτον
  choice: Isus a luat pâine
  rationale: Participiul aorist indică o acțiune anterioară verbului principal și este redat firesc printr-un verb finit în succesiunea narativă. ἄρτον poate desemna pâine sau o pâine, însă contextul nu impune precizarea formei.
- source_word: εὐλογήσας
  choice: după ce a rostit binecuvântarea
  rationale: Verbul indică rostirea unei binecuvântări. Formularea evită ambiguitatea românescului „a binecuvântat-o”, care ar putea sugera că obiectul gramatical explicit este pâinea, deși greaca nu îl exprimă aici.
- source_word: ἔκλασεν
  choice: a frânt-o
  rationale: Verbul înseamnă „a frânge”; pronumele feminin se referă firesc la „pâine” în română.
- source_word: δοὺς τοῖς μαθηταῖς
  choice: le-a dat-o ucenicilor
  rationale: Participiul este redat ca verb finit coordonat pentru o narațiune românească naturală. Articolul îi identifică pe ucenicii deja cunoscuți, fără a necesita adăugarea posesivului „Săi”.
- source_word: Λάβετε φάγετε
  choice: Luați, mâncați
  rationale: Cele două imperative aoriste succesive sunt păstrate fără conjuncție, reflectând atât structura greacă, cât și cadența solemnă a rostirii.
- source_word: τοῦτό ἐστιν τὸ σῶμά μου
  choice: acesta este trupul Meu
  rationale: Copula ἐστιν este redată direct prin „este”, fără parafraza interpretativă „înseamnă” sau „simbolizează”. Pronumele demonstrativ este acordat în română cu predicativul „trupul”.
theological_decisions:
- issue: Formularea euharistică a afirmației lui Isus
  choice: „acesta este trupul Meu”
  alternative: „acesta înseamnă/simbolizează trupul Meu”
  rationale: Textul grec folosește copula simplă ἐστιν. Redarea directă păstrează tensiunea teologică a sursei și nu introduce în text o anumită interpretare sacramentală.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „A frânt-o” păstrează expresia biblică consacrată fără a fi arhaică, iar „a rostit binecuvântarea” redă clar acțiunea fără să o confunde lexical cu verbul „a mulțumi” din relatările paralele.
