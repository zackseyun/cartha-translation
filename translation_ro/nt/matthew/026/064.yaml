id: MAT.26.64
reference: Matthew 26:64
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Σὺ εἶπας· πλὴν λέγω ὑμῖν, ἀπ’ ἄρτι ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου καθήμενον ἐκ δεξιῶν τῆς δυνάμεως καὶ ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/064.yaml
  text: Jesus said to him[a], “You have said so. But I tell you[c][b], from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.”
translation:
  language: ro
  text: 'Isus i-a zis: „Tu ai spus-o.[a] Dar vă spun: de acum îl veți vedea pe Fiul Omului șezând la dreapta Puterii[b] și venind pe norii cerului.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Tu ai zis-o.” Formularea grecească este un răspuns afirmativ idiomatic.'
    reason: lexical_alternative
  - marker: b
    text: „Puterea” este un mod reverențios de a face referire la Dumnezeu.
    reason: cultural_note
  - marker: c
    text: Aluzie la Daniel 7:13 și Psalmul 110:1.
    reason: cross_reference
lexical_decisions:
- source_word: Σὺ εἶπας
  choice: Tu ai spus-o
  rationale: Păstrează formularea idiomatică grecească drept răspuns afirmativ, fără a o transforma într-un simplu și neechivoc „Da”.
- source_word: πλὴν
  choice: Dar
  rationale: Redă firesc opoziția și trecerea apăsată de la răspunsul imediat la declarația care urmează.
- source_word: ἀπ’ ἄρτι
  choice: de acum
  rationale: Exprimă începutul, din acest moment, al unei noi stări de lucruri, fără a restrânge sensul la clipa imediată.
- source_word: ὄψεσθε
  choice: veți vedea
  rationale: Este redarea directă și naturală a viitorului verbului ὁράω; forma de plural corespunde adresării către cei prezenți.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Păstrează desemnarea consacrată și legătura ei textuală cu Daniel 7.
- source_word: καθήμενον
  choice: șezând
  rationale: Redă participiul și sugerează adecvat poziția de întronare, fără a adăuga explicit ideea de domnie.
- source_word: ἐκ δεξιῶν
  choice: la dreapta
  rationale: Este expresia românească biblică și idiomatică pentru locul de onoare și autoritate.
- source_word: τῆς δυνάμεως
  choice: Puterii
  rationale: Păstrează perifraza reverențioasă pentru Dumnezeu și reținerea formulării grecești; majuscula semnalează folosirea titulară.
- source_word: ἐρχόμενον
  choice: venind
  rationale: Redă direct participiul și păstrează rezonanța din Daniel 7, fără să precizeze în traducere momentul venirii.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: pe norii cerului
  rationale: Urmează transparent construcția grecească și păstrează ecoul formulării din Daniel 7:13.
theological_decisions:
- issue: Forța răspunsului Σὺ εἶπας adresat marelui-preot
  choice: 'Un răspuns afirmativ formulat indirect: „Tu ai spus-o.”'
  alternative: „Da” sau interpretarea expresiei ca răspuns evaziv
  rationale: Expresia funcționează ca o afirmare în context, dar păstrarea formulării evită atât explicitarea excesivă, cât și impresia unui refuz de a răspunde.
- issue: Referentul termenului „Puterea” (τῆς δυνάμεως)
  choice: Perifrază reverențioasă pentru Dumnezeu, păstrată ca „Puterea”
  alternative: Explicitarea prin „Dumnezeu” sau redarea prin „Cel Atotputernic”
  rationale: Referentul este Dumnezeu, însă textul grecesc folosește o perifrază; traducerea o păstrează fără a deveni mai explicită decât sursa.
- issue: Raportul temporal dintre șederea la dreapta Puterii și venirea pe nori
  choice: Ambele imagini sunt păstrate împreună ca obiect al afirmației „veți vedea”
  alternative: Limitarea întregii afirmații fie la viitorul imediat, fie exclusiv la a doua venire
  rationale: Cele două participii sunt coordonate în greacă. Traducerea păstrează tensiunea dintre întronare și venirea pentru vindicare, fără a impune o singură schemă escatologică.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Formulările biblice consacrate „Fiul Omului”, „la dreapta” și „norii cerului” sunt păstrate pentru rezonanța intertextuală, iar adresarea trece corect de la singular („i-a zis”, „Tu”) la plural („vă spun”, „veți vedea”).
