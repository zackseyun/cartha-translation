id: MAT.26.19
reference: Matthew 26:19
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἐποίησαν οἱ μαθηταὶ ὡς συνέταξεν αὐτοῖς ὁ Ἰησοῦς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/019.yaml
  text: And the disciples did as Jesus had directed them[a], and they prepared the Passover.
translation:
  language: ro
  text: Ucenicii au făcut așa cum le poruncise Isus și au pregătit Paștele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „masa de Paște”; termenul grecesc poate desemna sărbătoarea Paștelui în sens mai larg, inclusiv masa pregătită pentru ea.
    reason: Alternativă lexicală necesară pentru păstrarea întinderii semantice a lui πάσχα.
lexical_decisions:
- source_word: ἐποίησαν
  choice: au făcut
  rationale: Redă direct verbul comun ποιέω; împreună cu ὡς συνέταξεν exprimă împlinirea celor dispuse de Isus.
- source_word: οἱ μαθηταὶ
  choice: ucenicii
  rationale: Echivalentul consacrat și firesc în româna biblică modernă pentru discipolii lui Isus.
- source_word: ὡς
  choice: așa cum
  rationale: Exprimă limpede conformitatea dintre acțiunea ucenicilor și dispoziția lui Isus.
- source_word: συνέταξεν
  choice: le poruncise
  rationale: συντάσσω indică aici o dispoziție cu autoritate; mai-mult-ca-perfectul redă anterioritatea față de acțiunea ucenicilor.
- source_word: ἡτοίμασαν
  choice: au pregătit
  rationale: Echivalent direct și idiomatic pentru ἑτοιμάζω.
- source_word: τὸ πάσχα
  choice: Paștele
  rationale: Păstrează întinderea semantică a termenului grec, care poate desemna sărbătoarea și, în context, masa pascală, fără a restrânge nejustificat sensul.
- source_word: Ἰησοῦς
  choice: Isus
  rationale: Forma standard modernă folosită pentru numele personal în limba română.
theological_decisions:
- issue: Întinderea semantică a expresiei τὸ πάσχα
  choice: Paștele
  alternative: masa de Paște; mielul pascal
  rationale: Contextul indică pregătirea mesei pascale, dar termenul grec nu precizează exclusiv masa ori mielul. Textul principal păstrează formularea mai largă, iar nota semnalează sensul contextual posibil.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea „așa cum le poruncise” este naturală, păstrează autoritatea verbului grec și marchează anterioritatea instrucțiunii; nota evită restrângerea nejustificată a lui πάσχα.
