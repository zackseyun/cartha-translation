base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/067.yaml
  text: Then they spat in his face and struck him with their fists[c][b][a], and others slapped him.
translation:
  language: ro
  text: Atunci L-au scuipat în față și L-au lovit cu pumnii, iar alții L-au pălmuit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Marchează succesiunea imediată a evenimentelor și păstrează curgerea firească a narațiunii.
- source_word: ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ
  choice: L-au scuipat în față
  rationale: Expresia grecească descrie scuiparea îndreptată direct spre fața lui; formularea românească este idiomatică și redă limpede gestul de dispreț.
- source_word: ἐκολάφισαν αὐτόν
  choice: L-au lovit cu pumnii
  rationale: Verbul κολαφίζω indică lovirea cu pumnul; formularea concretă evită termenul mai general „L-au bătut”.
- source_word: οἱ δὲ ἐράπισαν
  choice: iar alții L-au pălmuit
  rationale: Articolul substantivizat οἱ indică un alt grup, iar ῥαπίζω desemnează de regulă lovirea cu palma. Obiectul „L-” este explicitat firesc din context.
- source_word: δέ
  choice: iar
  rationale: Redă tranziția ușoară spre acțiunea altora, fără a introduce un contrast puternic.
theological_decisions:
- issue: Descrierea abuzului suferit de Isus înaintea sinedriului
  choice: 'Acțiunile sunt redate concret: scuipare în față, lovire cu pumnii și pălmuire.'
  alternative: O formulare generală precum „L-au maltratat” sau „L-au bătut”.
  rationale: Textul grec individualizează actele de umilire și violență; traducerea le păstrează forța narativă fără comentariu teologic adăugat.
translation_notes:
  register: Română standard modernă, clară și demnă. Pronumele clitice referitoare la Isus sunt scrise cu majusculă conform unei convenții românești larg răspândite, fără a modifica sensul textului grec.
