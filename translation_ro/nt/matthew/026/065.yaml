id: MAT.26.65
reference: Matthew 26:65
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τότε ὁ ἀρχιερεὺς διέρρηξεν τὰ ἱμάτια αὐτοῦ ⸀λέγων· Ἐβλασφήμησεν· τί ἔτι χρείαν ἔχομεν μαρτύρων; ἴδε νῦν ἠκούσατε τὴν ⸀βλασφημίαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/065.yaml
  text: Then the high priest tore his garments[a], saying, “He has blasphemed! What further need do we have of witnesses? See[b], now you have heard the blasphemy.”
translation:
  language: ro
  text: 'Atunci marele preot și-a sfâșiat hainele[a] și a zis: „A blasfemiat! Ce nevoie mai avem de martori? Iată, acum ați auzit blasfemia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sfâșierea hainelor era un semn public de șoc, durere sau indignare.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Redă firesc conectorul temporal care înaintează succesiunea narativă.
- source_word: ὁ ἀρχιερεὺς
  choice: marele-preot
  rationale: Denumirea consacrată în română pentru titularul acestei funcții religioase iudaice.
- source_word: διέρρηξεν τὰ ἱμάτια αὐτοῦ
  choice: și-a sfâșiat hainele
  rationale: Construcția reflexiv-posesivă este idiomatică în română, iar „a sfâșia” păstrează caracterul violent și public al gestului.
- source_word: λέγων
  choice: și a zis
  rationale: Coordonarea verbală redă natural în română participiul circumstanțial contemporan cu gestul.
- source_word: Ἐβλασφήμησεν
  choice: A blasfemiat
  rationale: Păstrează termenul juridic-religios al acuzației și forța exclamativă a aoristului, fără a transforma acuzația în afirmație naratorială.
- source_word: τί ἔτι χρείαν ἔχομεν μαρτύρων;
  choice: Ce nevoie mai avem de martori?
  rationale: Redare apropiată de forma greacă și totodată naturală; „mai” exprimă valoarea lui ἔτι.
- source_word: ἴδε νῦν ἠκούσατε
  choice: Iată, acum ați auzit
  rationale: „Iată” păstrează funcția interjecțională de atragere a atenției, iar perfectul compus exprimă relevanța imediată a celor tocmai auzite.
- source_word: τὴν βλασφημίαν
  choice: blasfemia
  rationale: Articolul hotărât și substantivul religios-juridic redau direct caracterizarea făcută de marele-preot.
theological_decisions:
- issue: Statutul acuzației βλασφημέω / βλασφημία
  choice: „A blasfemiat” / „blasfemia” în vorbirea directă a marelui-preot
  alternative: „A rostit o blasfemie” / „vorba blasfemiatoare”
  rationale: Termenii direcți păstrează gravitatea acuzației istorice și teologice. Încadrarea lor în citatul marelui-preot arată că aceasta este judecata lui, fără a sugera că naratorul o confirmă.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Am evitat forma arhaizantă „veșminte” și am ales „haine”, suficient de larg pentru ἱμάτια. Marcajul notei este plasat imediat după expresia explicată; nota lexicală din stratul englez pare atașată greșit și nu a fost perpetuată.
