source:
  edition: SBLGNT
  text: καὶ ⸀λαβὼν ποτήριον καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων· Πίετε ἐξ αὐτοῦ πάντες,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/027.yaml
  text: And having taken a cup and given thanks[a], he gave it to them, saying, “Drink from it[c][b], all of you,”
translation:
  language: ro
  text: 'Și, după ce a luat un pahar și a mulțumit, li l-a dat, spunând: „Beți din el, voi toți.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: luând
  rationale: Participiul redă firesc acțiunea anterioară verbului principal și păstrează curgerea construcției grecești.
- source_word: ποτήριον
  choice: un pahar
  rationale: Substantivul grecesc este nearticulat; „un pahar” reflectă direct această formă, fără a exclude faptul că referentul este identificabil din context.
- source_word: εὐχαριστήσας
  choice: mulțumind
  rationale: Redă sensul lexical de a aduce mulțumire și, împreună cu contextul, indică o acțiune anterioară lui „a dat”, fără terminologie sacramentală adăugată.
- source_word: ἔδωκεν αὐτοῖς
  choice: li l-a dat
  rationale: Construcția românească exprimă natural destinatarul plural și obiectul masculin „paharul”, implicit în greacă.
- source_word: λέγων
  choice: spunând
  rationale: Păstrează forma participială care introduce vorbirea directă.
- source_word: Πίετε
  choice: Beți
  rationale: Imperativul la plural este redat direct și firesc.
- source_word: ἐξ αὐτοῦ
  choice: din el
  rationale: Prepoziția ἐξ indică sursa; pronumele se raportează gramatical la „pahar”.
- source_word: πάντες
  choice: toți
  rationale: În română, după imperativul plural, „toți” îi desemnează natural pe toți cei cărora li se adresează porunca, nu întreaga cantitate din pahar.
theological_decisions:
- issue: Posibile conotații euharistice sau sacramentale ale lui εὐχαριστήσας
  choice: mulțumind
  alternative: binecuvântând / rostind mulțumirea
  rationale: Verbul înseamnă în mod direct „a mulțumi”; formularea evită introducerea unei interpretări doctrinare ulterioare, fără a exclude semnificația teologică a contextului.
- issue: Domeniul lui πάντες în poruncă
  choice: toți
  alternative: cu toții / beți tot din el
  rationale: Termenul îi privește cel mai firesc pe membrii întregului grup căruia i se adresează Isus, nu cantitatea care trebuie băută.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Succesiunea participiilor păstrează compactitatea originalului, iar pronumele clitice fac propoziția idiomatică în română.
