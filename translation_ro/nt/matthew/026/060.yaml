lexical_decisions:
- source_word: οὐχ εὗρον
  choice: n-au găsit nimic
  rationale: 'Verbul are un complement subînțeles din contextul versetului anterior: o mărturie sau acuzație utilizabilă împotriva lui Isus. „N-au găsit nimic” redă firesc în română lipsa unui temei adecvat, fără a fixa explicit complementul.'
- source_word: πολλῶν προσελθόντων ψευδομαρτύρων
  choice: deși se prezentaseră mulți martori mincinoși
  rationale: Genitivul absolut are aici valoare concesivă. Mai-mult-ca-perfectul redă anterioritatea participiului față de constatarea că nu găsiseră nimic, iar „martori mincinoși” păstrează cadrul juridic.
- source_word: ὕστερον δὲ
  choice: Mai târziu însă
  rationale: „Mai târziu” exprimă succesiunea temporală, iar „însă” păstrează ușoara schimbare adversativă sau narativă marcată de δέ.
- source_word: προσελθόντες δύο
  choice: s-au prezentat doi
  rationale: În contextul audierii, „s-au prezentat” este o redare românească firească a venirii în față pentru a depune mărturie și păstrează accentul asupra celor doi.
