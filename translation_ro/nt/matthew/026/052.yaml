  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· Ἀπόστρεψον ⸂τὴν μάχαιράν σου⸃ εἰς τὸν τόπον αὐτῆς, πάντες γὰρ οἱ λαβόντες μάχαιραν ἐν μαχαίρῃ ⸀ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/052.yaml
  text: Then Jesus said to him[a], “Put your sword back in its place, for all who take up the sword will perish by the sword.”
translation:
  language: ro
  text: 'Atunci Isus i-a zis: „Pune-ți sabia la loc, căci toți cei care iau sabia[a] vor pieri de sabie.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „pun mâna pe sabie”; expresia înseamnă probabil a recurge la forță violentă, nu doar a apuca o armă.'
    reason: Alternativă lexicală idiomatică pentru expresia λαβόντες μάχαιραν; ancora este plasată după întreaga expresie explicată.
lexical_decisions:
- source_word: τότε λέγει αὐτῷ
  choice: Atunci Isus i-a zis
  rationale: Redă firesc succesiunea narativă; prezentul istoric λέγει este exprimat prin perfectul compus, potrivit narațiunii românești moderne.
- source_word: Ἀπόστρεψον τὴν μάχαιράν σου εἰς τὸν τόπον αὐτῆς
  choice: Pune-ți sabia la loc
  rationale: Imperativul cere întoarcerea imediată a armei în locul ei. Formularea este idiomatică și păstrează referirea convențională la sabie, fără a restrânge μάχαιρα la pumnal ori sabie scurtă.
- source_word: πάντες γὰρ οἱ λαβόντες μάχαιραν
  choice: căci toți cei ce iau sabia
  rationale: Participiul articulat are sens generalizator. Redarea relativ literală păstrează deschisă nuanța dintre luarea efectivă a armei și recurgerea la forță violentă; nota explică sensul idiomatic probabil.
- source_word: ἐν μαχαίρῃ ἀπολοῦνται
  choice: vor pieri de sabie
  rationale: Dativul este instrumental, iar ἀπολοῦνται exprimă pieirea sau moartea. Formularea păstrează gravitatea și paralelismul sentențios al originalului.
theological_decisions:
- issue: Sfera afirmației lui Isus despre sabie
  choice: 'Afirmația este redată ca principiu general: „toți cei ce iau sabia vor pieri de sabie”.'
  alternative: Interpretarea fie ca interdicție pacifistă absolută a oricărei folosiri a forței, fie ca predicție limitată exclusiv la situația imediată.
  rationale: Construcția grecească este generalizatoare. Traducerea îi păstrează amploarea fără a impune o concluzie confesională care depășește formularea versetului.
translation_notes:
  register: Română standard modernă, clară și demnă. Sintaxa este naturală, iar formularea sentențioasă „vor pieri de sabie” păstrează concizia și paralelismul originalului.
