lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Când s-a făcut seară
  rationale: Genitivul absolut fixează cadrul temporal; formularea este firească în româna actuală și păstrează sensul temporal.
- source_word: ἀνέκειτο
  choice: stătea întins la masă
  rationale: Verbul descrie poziția culcată sau rezemată adoptată la masă în lumea antică; completarea „la masă” redă idiomatic contextul ospățului.
- source_word: μετὰ
  choice: cu
  rationale: Cu genitivul, prepoziția exprimă în mod direct asocierea.
- source_word: τῶν δώδεκα μαθητῶν
  choice: cei doisprezece ucenici
  rationale: Redă explicit substantivul μαθητῶν din textul SBLGNT și folosește termenul românesc consacrat pentru μαθητής.
theological_decisions:
- issue: Subiectul neexprimat al verbului ἀνέκειτο
  choice: Isus
  alternative: el
  rationale: Greaca lasă subiectul implicit, recuperabil fără echivoc din context. Numele face versetul autonom și clar, fără a introduce o interpretare teologică.
translation_notes:
  register: Română standard modernă, cu formulare demnă și accesibilă. Expresia „stătea întins la masă” evită impresia modernă de ședere pe scaun și face inteligibil obiceiul antic de a mânca rezemat.
