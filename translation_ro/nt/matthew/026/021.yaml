source:
  edition: SBLGNT
  text: καὶ ἐσθιόντων αὐτῶν εἶπεν· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/021.yaml
  text: And while they were eating[a], he said, “Truly I tell you, one of you will betray me.”
translation:
  language: ro
  text: 'În timp ce mâncau, el a spus: „Adevărat vă spun că unul dintre voi mă va trăda[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, mai literal: „mă va da pe mâna cuiva” ori „mă va preda”.'
    reason: Alternativă lexicală pentru sensul mai larg al verbului παραδίδωμι.
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: în timp ce mâncau
  rationale: Construcția la genitiv absolut exprimă o acțiune simultană; formularea este firească în româna actuală și păstrează raportul temporal.
- source_word: Ἀμὴν
  choice: adevărat
  rationale: La începutul spuselor lui Isus, termenul introduce o afirmație solemnă și sigură; „adevărat” îi redă funcția idiomatic în română.
- source_word: λέγω ὑμῖν
  choice: vă spun
  rationale: Redare directă și firească a formulei de adresare, păstrând persoana și solemnitatea afirmației.
- source_word: εἷς ἐξ ὑμῶν
  choice: unul dintre voi
  rationale: Redă limpede și natural construcția partitivă grecească.
- source_word: παραδώσει
  choice: va trăda
  rationale: Verbul poate însemna mai larg „a da pe mâna cuiva” sau „a preda”, însă în context desemnează actul de trădare săvârșit de unul dintre ucenici; viitorul grecesc este păstrat.
- source_word: με
  choice: mă
  rationale: Pronume personal cu funcție de complement direct, referindu-se la Isus.
theological_decisions:
- issue: Redarea lui παραδώσει în contextul pătimirii
  choice: mă va trăda
  alternative: mă va da pe mâna altora / mă va preda
  rationale: „Va trăda” comunică firesc sensul contextual al acțiunii unui apropiat împotriva lui Isus, iar nota păstrează sensul lexical mai larg al verbului grec fără a elimina tensiunea dintre trădare și predare.
translation_notes:
  register: Română standard modernă, clară și demnă. Ordinea frazei este naturală, iar formula solemnă „Adevărat vă spun” păstrează tonul rostirii lui Isus. Marcajul notei este așezat după expresia pe care o explică.
