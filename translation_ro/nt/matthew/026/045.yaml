source:
  edition: SBLGNT
  text: τότε ἔρχεται πρὸς τοὺς ⸀μαθητὰς καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἰδοὺ ἤγγικεν ἡ ὥρα καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/045.yaml
  text: Then he comes to the disciples and says to them[a], “Sleep on now and take your rest. Look, the hour has drawn near[c][b], and the Son of Man is being handed over into the hands of sinners.”
translation:
  language: ro
  text: 'Apoi vine la ucenici și le spune: „Dormiți mai departe[a] și odihniți-vă. Iată, ceasul s-a apropiat[b], iar Fiul Omului este dat în mâinile păcătoșilor[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Încă dormiți și vă odihniți?” Formularea grecească poate fi înțeleasă ca o întrebare retorică; textul principal păstrează ambiguitatea și probabila ironie a afirmației.'
    reason: alternative_reading
  - marker: b
    text: 'Sau: „ceasul a sosit” ori „ceasul este aproape”.'
    reason: lexical_alternative
  - marker: c
    text: 'Sau: „este trădat” ori „este predat”. Verbul grecesc are un sens mai larg: „a preda” sau „a da în mâinile cuiva”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Apoi
  rationale: Redă firesc legătura temporală și succesiunea narațiunii.
- source_word: ἔρχεται ... καὶ λέγει
  choice: vine ... și le spune
  rationale: Păstrează prezentul istoric viu al narațiunii grecești.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: Dormiți de acum și odihniți-vă
  rationale: Păstrează forma de suprafață și posibila forță ironică ori concesivă, fără a transforma neechivoc enunțul într-o întrebare.
- source_word: ἰδού
  choice: Iată
  rationale: Formulă românească actuală și demnă care atrage solemn atenția.
- source_word: ἤγγικεν ἡ ὥρα
  choice: ceasul s-a apropiat
  rationale: Redă perfectul lui ἐγγίζω și păstrează ideea apropierii ajunse la punctul decisiv.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Păstrează titulatura consacrată și semnificativă contextual.
- source_word: παραδίδοται εἰς χεῖρας ἁμαρτωλῶν
  choice: este dat pe mâinile păcătoșilor
  rationale: Expresia idiomatică românească păstrează sensul larg al predării și imaginea mâinilor, fără a-l restrânge la trădare.
theological_decisions:
- issue: Forța expresiei Καθεύδετε ... καὶ ἀναπαύεσθε
  choice: 'Enunț cu posibilă nuanță ironică sau concesivă: „Dormiți de acum și odihniți-vă.”'
  alternative: 'Întrebare retorică: „Încă dormiți și vă odihniți?”'
  rationale: Contextul permite o întrebare retorică, însă greaca nu marchează explicit interogația; textul principal păstrează tensiunea, iar nota consemnează alternativa.
- issue: Sensul lui παραδίδοται în contextul pătimirii
  choice: „este dat pe mâinile”
  alternative: „este trădat” / „este predat”
  rationale: Alegerea păstrează întinderea semantică a verbului și nu reduce acțiunea numai la trădarea lui Iuda.
translation_notes:
  register: Română standard modernă, clară și demnă. Prezentul istoric este păstrat. „Iată” menține solemnitatea fără arhaizare excesivă, iar „dat pe mâinile” este idiomatic și păstrează imaginea concretă a textului grec.
