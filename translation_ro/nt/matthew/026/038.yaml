source:
  edition: SBLGNT
  text: τότε λέγει ⸀αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/038.yaml
  text: Then he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch with me.”
translation:
  language: ro
  text: 'Atunci le spune: „Sufletul meu este copleșit de întristare[a], până la moarte[b]. Rămâneți aici și vegheați împreună cu mine[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „este foarte întristat” ori „este adânc întristat”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „până în pragul morții”.'
    reason: lexical_alternative
  - marker: c
    text: 'Sau: „rămâneți treji împreună cu mine”. Verbul grecesc poate exprima atât faptul de a nu adormi, cât și vigilența atentă.'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Redă firesc conectorul temporal care introduce următorul moment al narațiunii.
- source_word: λέγει αὐτοῖς
  choice: le spune
  rationale: Păstrează prezentul istoric al textului grecesc și vivacitatea relatării; pronumele în dativ redă natural sensul lui αὐτοῖς.
- source_word: Περίλυπός
  choice: copleșit de întristare
  rationale: Exprimă intensitatea lui περίλυπος într-o română actuală și demnă, fără a reduce termenul la o tristețe obișnuită.
- source_word: ἡ ψυχή μου
  choice: Sufletul meu
  rationale: Păstrează substantivul explicit ψυχή și exprimă profunzimea suferinței lăuntrice, fără a impune o antropologie tehnică.
- source_word: ἕως θανάτου
  choice: până la moarte
  rationale: 'Este echivalentul direct și firesc care păstrează deschisă nuanța expresiei: întristare care ajunge până la limita morții sau până în moarte.'
- source_word: μείνατε ὧδε
  choice: Rămâneți aici
  rationale: Redă direct imperativul și adverbul de loc, într-un registru solemn, dar curent.
- source_word: γρηγορεῖτε
  choice: vegheați
  rationale: Verbul românesc poate indica atât starea de trezie, cât și vigilența atentă; alternativa literală contextuală este păstrată în notă.
- source_word: μετ’ ἐμοῦ
  choice: împreună cu mine
  rationale: Exprimă limpede însoțirea cerută de Isus; «împreună» face construcția românească mai naturală fără a adăuga un sens străin.
theological_decisions:
- issue: Redarea lui ψυχή în afirmația lui Isus
  choice: Sufletul meu
  alternative: Sunt copleșit de întristare
  rationale: Formularea păstrează termenul explicit al grecei și realitatea deplină a suferinței omenești a lui Isus, fără a transforma versetul într-o definiție doctrinară a alcătuirii omului.
- issue: Forța expresiei ἕως θανάτου
  choice: până la moarte
  alternative: până în pragul morții
  rationale: Textul principal păstrează formularea concisă și ambiguitatea autentică a grecei; alternativa explicitează ideea de intensitate extremă, dar ar restrânge sensul.
- issue: Forța lui γρηγορεῖτε în context
  choice: vegheați
  alternative: rămâneți treji
  rationale: Porunca poate cuprinde atât trezia fizică, cât și vigilența spirituală. «Vegheați» păstrează sensul mai larg, iar nota consemnează sensul imediat al rămânerii treze.
translation_notes:
  register: Română literară modernă, clară și demnă. Prezentul istoric este păstrat. Pronumele referitoare la Isus sunt scrise cu literă mică, potrivit normelor curente și fără marcaj confesional suplimentar.
