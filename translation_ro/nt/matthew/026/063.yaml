  text: ὁ δὲ Ἰησοῦς ἐσιώπα. ⸀καὶ ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος ἵνα ἡμῖν εἴπῃς εἰ σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/063.yaml
  text: 'But Jesus kept silent[a]. And the high priest said to him, “I put you under oath by the living God: tell us if you are the Messiah[b], the Son of God.”'
translation:
  language: ro
  text: 'Dar Isus continua să tacă. Marele preot i-a zis: „Te jur pe Dumnezeul cel viu[a] să ne spui dacă tu ești Mesia[b], Fiul lui Dumnezeu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Te pun sub jurământ înaintea Dumnezeului celui viu.” Greaca folosește o formulă solemnă de punere sub jurământ.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „Cristos”. Titlul grecesc Christos este redat aici prin „Mesia”, deoarece funcționează ca titlu, nu ca nume.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσιώπα
  choice: continua să tacă
  rationale: Imperfectul indică o tăcere care se prelungea; formularea redă aspectul continuu în româna actuală.
- source_word: ἀρχιερεὺς
  choice: marele-preot
  rationale: Denumirea consacrată și precisă a conducătorului preoțesc iudaic în acest context judiciar.
- source_word: Ἐξορκίζω
  choice: te pun sub jurământ
  rationale: În context, verbul exprimă o somație solemnă sub jurământ, nu sensul ulterior legat de exorcizare.
- source_word: κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: în numele Dumnezeului celui viu
  rationale: Redă invocarea solemnă a lui Dumnezeu ca temei al jurământului într-o formulare românească limpede și firească.
- source_word: ἵνα ἡμῖν εἴπῃς
  choice: spune-ne
  rationale: Construcția arată conținutul cererii impuse prin somație; imperativul românesc redă direct și natural această forță.
- source_word: ὁ χριστὸς
  choice: Mesia
  rationale: Articolul și contextul interogatoriului arată că termenul funcționează ca titlu al Unsului așteptat, nu ca nume propriu.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Fiul lui Dumnezeu
  rationale: Păstrează direct titlul cristologic și caracterul său definit, fără explicații adăugate.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Dar Isus
  rationale: δέ marchează contrastul ușor dintre acuzațiile anterioare și tăcerea lui Isus.
theological_decisions:
- issue: Redarea titlului Χριστός în întrebarea cristologică directă
  choice: Mesia
  alternative: Cristos
  rationale: Aici termenul este un titlu și desemnează Unsul așteptat; alternativa tradițională este păstrată în notă.
- issue: Forța formulei Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: somație solemnă sub jurământ
  alternative: o simplă poruncă fără forță de jurământ
  rationale: Invocarea Dumnezeului celui viu și cadrul judiciar cer păstrarea caracterului solemn și constrângător al formulei.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează cadrul judiciar, aspectul continuu al tăcerii și caracterul titular al lui „Mesia”, evitând atât arhaismele greu accesibile, cât și parafraza teologică.
