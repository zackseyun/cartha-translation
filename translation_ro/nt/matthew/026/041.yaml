id: MAT.26.41
reference: Matthew 26:41
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/041.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: ro
  text: Vegheați și rugați-vă, ca să nu intrați în ispită[a]. Într-adevăr, duhul este dornic, dar carnea este slabă.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „încercare” ori „testare”. Termenul grecesc poate desemna atât ademenirea spre păcat, cât și o situație în care cineva este pus la încercare.
    reason: alternativă lexicală
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Vegheați
  rationale: Imperativul plural exprimă atât rămânerea trează în contextul imediat al Ghetsimaniului, cât și vigilența lăuntrică. „Vegheați” păstrează ambele nuanțe și este firesc în registrul biblic românesc actual.
- source_word: προσεύχεσθε
  choice: rugați-vă
  rationale: Redare directă și naturală a imperativului prezent plural; în asociere cu „vegheați”, poate transmite și caracterul continuu al îndemnului fără o formulare greoaie.
- source_word: ἵνα μὴ εἰσέλθητε
  choice: ca să nu intrați
  rationale: Păstrează construcția de scop/prevenire și metafora intrării, fără a o interpreta prin „a cădea”.
- source_word: πειρασμόν
  choice: ispită
  rationale: În context, avertismentul privește primejdia cedării morale sub presiune. Termenul grec poate desemna și încercarea sau testarea, sens consemnat în nota de subsol.
- source_word: τὸ μὲν πνεῦμα
  choice: Duhul este, într-adevăr
  rationale: „Duhul”, scris cu literă mare numai fiindcă începe propoziția, redă aici cel mai probabil dispoziția lăuntrică omenească. „Într-adevăr” exprimă contrastul marcat de μέν...δέ.
- source_word: πρόθυμον
  choice: dornic
  rationale: Redă disponibilitatea și avântul lăuntric sugerate de πρόθυμος, într-o formulare scurtă și firească.
- source_word: ἡ δὲ σὰρξ
  choice: dar carnea
  rationale: Păstrează metafora și tensiunea antropologică a originalului, fără a interpreta termenul drept „fire păcătoasă” sau a-l reduce la „trup”.
- source_word: ἀσθενής
  choice: este slabă
  rationale: „Slabă” redă direct neputința și fragilitatea aflate în contrast cu disponibilitatea duhului.
theological_decisions:
- issue: Referentul lui πνεῦμα
  choice: duhul omenesc/dispoziția lăuntrică, redat „Duhul” doar din motiv sintactic, la început de propoziție
  alternative: Duhul Sfânt
  rationale: Contrastul cu „carnea” și eșecul apropiat al ucenicilor favorizează referirea la intenția lor lăuntrică sinceră. Formularea nu adaugă explicit calificativul „omenesc” și astfel evită supradeterminarea textului.
- issue: Sensul lui σάρξ
  choice: „carnea”
  alternative: „trupul” sau „firea păcătoasă”
  rationale: Aici termenul indică slăbiciunea omenească, trupească, nu formulează explicit categoria teologică a unei „firi păcătoase”. Redarea literală păstrează idiomul și contrastul cu duhul.
- issue: Amplitudinea semantică a lui πειρασμός
  choice: „ispită” în text, cu „încercare” și „testare” în notă
  alternative: „încercare” în textul principal
  rationale: Primejdia imediată este cedarea ucenicilor sub presiune, ceea ce susține „ispită”; nota păstrează ambiguitatea reală a termenului grec.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. „Vegheați” păstrează legătura cu somnul fizic al ucenicilor și cu vigilența spirituală. S-a păstrat contrastul biblic „duh–carne”, fără introducerea unei interpretări confesionale.
