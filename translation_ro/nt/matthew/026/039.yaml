source:
  edition: SBLGNT
  text: καὶ ⸀προελθὼν μικρὸν ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ προσευχόμενος καὶ λέγων· Πάτερ μου, εἰ δυνατόν ἐστιν, παρελθάτω ἀπ’ ἐμοῦ τὸ ποτήριον τοῦτο· πλὴν οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/039.yaml
  text: And going a little farther[a], he fell on his face, praying and saying, “My Father, if it is possible, let this cup pass from me; yet not as I will[b], but as you will.”
translation:
  language: ro
  text: 'Și, mergând puțin mai departe, a căzut cu fața la pământ[a], rugându-se și spunând: „Tatăl meu, dacă este posibil, să treacă de la mine paharul acesta[b]; totuși, nu cum vreau eu, ci cum vrei tu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „a căzut cu fața în jos”.'
    reason: lexical_alternative
  - marker: b
    text: „Paharul” este o imagine biblică pentru partea rânduită cuiva, îndeosebi pentru suferință; compară Matei 20:22 și 26:42.
    reason: cross_reference
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: mergând puțin mai departe
  rationale: Redă participiul aorist și ideea deplasării înainte pe o distanță mică, într-o formulare românească firească.
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ
  choice: a căzut cu fața la pământ
  rationale: Exprimă limpede postura de prosternare și păstrează caracterul concret și solemn al imaginii grecești.
- source_word: προσευχόμενος καὶ λέγων
  choice: rugându-se și spunând
  rationale: Păstrează cele două participii prezente ca acțiuni simultane cu gestul principal, fără a comprima formularea sursei.
- source_word: Πάτερ μου
  choice: Tatăl meu
  rationale: Vocativul însoțit de posesiv exprimă direct apropierea și reverența, fără adaos afectiv.
- source_word: εἰ δυνατόν ἐστιν
  choice: dacă este posibil
  rationale: Redă integral condiția într-o română modernă și neutră.
- source_word: παρελθάτω ἀπ’ ἐμοῦ
  choice: să treacă de la mine
  rationale: Subjonctivul românesc redă firesc cererea exprimată prin imperativul grecesc și păstrează verbul imagistic „a trece”.
- source_word: τὸ ποτήριον τοῦτο
  choice: paharul acesta
  rationale: Păstrează metafora biblică fără a o transforma în mod explicit în „suferință” sau „soartă”.
- source_word: πλὴν
  choice: totuși
  rationale: Marchează clar și demn calificarea puternică a cererii precedente.
- source_word: οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ
  choice: nu cum vreau eu, ci cum vrei tu
  rationale: Redă contrastul dintre voința exprimată de Isus și voința Tatălui într-un limbaj actual; repetarea verbului în a doua propoziție face elipsa greacă limpede în română.
theological_decisions:
- issue: Metafora „paharului” în rugăciunea lui Isus
  choice: Metafora literală „paharul acesta” este păstrată în text.
  alternative: „suferința aceasta” sau „soarta aceasta”
  rationale: ποτήριον evocă în limbajul biblic o parte rânduită, adesea asociată cu suferința și judecata. Păstrarea imaginii conservă legăturile intertextuale și nu limitează prematur sensul.
- issue: Voința lui Isus în raport cu voința Tatălui
  choice: θέλω este redat prin „vreau”, repetat în ambele membre ale contrastului.
  alternative: „voiesc” sau o parafrază precum „să se facă voia ta”
  rationale: „Vreau” este echivalentul modern și direct al lui θέλω și păstrează realitatea voinței exprimate, precum și supunerea ei față de voința Tatălui. Nu este introdusă formula diferită „facă-se voia ta”, care nu apare aici.
- issue: Majusculele reverențiale pentru pronumele divine
  choice: Pronumele și posesivele sunt scrise cu literă mică.
  alternative: „Tatăl Meu”, „Mine”, „Eu”, „Tu”
  rationale: Greaca nu codifică asemenea majuscule reverențiale. Grafia românească modernă cu literă mică evită adăugarea unei distincții tipografice interpretative, fără a diminua registrul solemn.
translation_notes:
  register: Română standard modernă, clară și demnă. Formele curente „este posibil” și „vreau” sunt preferate celor mai arhaizante „este cu putință” și „voiesc”. Ordinea „să treacă de la mine paharul acesta” păstrează focalizarea și mișcarea imaginii grecești, rămânând firească în registrul solemn.
