base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/049.yaml
  text: And immediately he came up to Jesus and said[a], “Greetings[b], Rabbi,” and kissed him.
translation:
  language: ro
  text: 'Și îndată s-a apropiat de Isus și a spus: „Te salut[a], Rabbi!” și l-a sărutat[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Plecăciune, Rabbi!”'
    reason: alternativă lexicală pentru formula de salut χaῖρε
  - marker: b
    text: Verbul grecesc poate sugera un sărut stăruitor sau repetat.
    reason: alternativă lexicală
lexical_decisions:
- source_word: εὐθέως
  choice: îndată
  rationale: Redă promptitudinea acțiunii într-o formulare narativă firească și demnă în româna actuală.
- source_word: προσελθὼν τῷ Ἰησοῦ
  choice: s-a apropiat de Isus
  rationale: Participiul aorist indică apropierea fizică de Isus înaintea rostirii; coordonarea verbală este naturală în română.
- source_word: εἶπεν
  choice: a zis
  rationale: Echivalent narativ simplu și curent, fără explicitarea unui complement absent din greacă.
- source_word: Χαῖρε
  choice: Salutare
  rationale: În context este o formulă convențională de salut; „Salutare” păstrează registrul direct fără caracterul arhaic al unor alternative.
- source_word: ῥαββί
  choice: Rabbi
  rationale: Păstrează prin transliterare titlul semitic prezent în textul grecesc; forma poate necesita o explicație pentru cititorul român.
- source_word: κατεφίλησεν
  choice: l-a sărutat
  rationale: Verbul poate avea o nuanță intensivă ori iterativă, dar aceasta nu este suficient de sigură pentru a fi impusă în textul principal; ambiguitatea este păstrată în notă.
- source_word: αὐτόν
  choice: l-
  rationale: Pronumele acuzativ îl are ca referent pe Isus și este redat firesc prin forma clitică românească.
theological_decisions:
- issue: Valoarea formulei Χαῖρε
  choice: Salutare
  alternative: Bucură-te; Plecăciune
  rationale: Aici termenul funcționează ca salut obișnuit, nu ca îndemn teologic și nici neapărat ca aclamație solemnă. Ironia trădării rămâne în narațiune, fără a fi amplificată lexical.
- issue: Forța verbului κατεφίλησεν
  choice: l-a sărutat
  alternative: l-a sărutat cu multă căldură; l-a sărutat de mai multe ori
  rationale: Forma compusă poate sugera intensitate sau repetare, însă contextul nu stabilește fără echivoc care nuanță este activă. Textul principal rămâne neinterpretativ, iar nota consemnează posibilitățile.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. „Îndată” menține ritmul alert, iar „Salutare” evită atât colocvialul excesiv, cât și formulările arhaice. Punctuația plasează nota despre titlu după adresare și nota lexicală imediat după verbul relevant.
