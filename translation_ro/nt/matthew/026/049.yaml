  source_fidelity: 'Textul redă corect succesiunea acțiunilor: Iuda se apropie imediat de Isus, îl salută ca „Rabbi” și îl sărută. „Îndată”, „s-a apropiat de Isus” și „l-a sărutat” sunt fidele grecei. Verbul καταφιλέω este tratat prudent, prin păstrarea formei neintensificate în text și consemnarea nuanței posibile în notă.'
  naturalness: „Salutare” este posibil, dar ca replică directă sună mai puțin firesc în româna standard actuală și poate avea o tentă livrescă sau formulă de adresare colectivă. „Te salut, Rabbi!” este mai idiomatic, păstrează funcția convențională a lui χαῖρε și nu impune o interpretare solemnă ori arhaizantă. Se păstrează litera mică la „și” după replica directă, deoarece narațiunea continuă în aceeași propoziție.
  terminology: „Isus” și „Rabbi” sunt potrivite. Nota anterioară la „Rabbi” era exactă în linii mari, dar nu corespundea notei lexicale din traseul POB englez, care privește salutul χαῖρε. Nota a este repoziționată și reformulată ca alternativă pentru salut; nota b rămâne ancorată la verbul relevant.
