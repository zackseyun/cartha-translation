id: MAT.26.42
reference: Matthew 26:42
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: πάλιν ἐκ δευτέρου ἀπελθὼν προσηύξατο λέγων· Πάτερ μου, εἰ οὐ δύναται ⸀τοῦτο ⸀παρελθεῖν ἐὰν μὴ αὐτὸ πίω, γενηθήτω τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/042.yaml
  text: Again[a], a second time he went away and prayed, saying, “My Father, if this cannot pass unless I drink it[b], your will be done.”
translation:
  language: ro
  text: 'Din nou, pentru a doua oară, S-a îndepărtat și S-a rugat, zicând: „Tatăl Meu, dacă acest lucru[a] nu poate trece fără să-l beau[b], facă-se voia Ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Acest lucru” și pronumele „-l” se referă la paharul suferinței menționat în versetul 39; greaca spune aici doar „acest lucru” și „el”.
    reason: Clarifică referința contextuală fără a introduce „paharul” în textul principal.
  - marker: b
    text: 'Sau: „dacă nu este posibil ca acest lucru să treacă fără să-l beau”.'
    reason: Oferă o alternativă sintactică apropiată de structura greacă.
lexical_decisions:
- source_word: πάλιν ἐκ δευτέρου
  choice: Din nou, pentru a doua oară
  rationale: Păstrează ambele elemente grecești care marchează repetarea, într-o formulare românească firească.
- source_word: ἀπελθὼν
  choice: S-a îndepărtat
  rationale: Redă participiul aorist printr-un verb finit coordonat, potrivit narațiunii românești; sensul este că Isus a plecat de lângă ucenici.
- source_word: προσηύξατο λέγων
  choice: S-a rugat, zicând
  rationale: Redare directă și demnă, care păstrează participiul introductiv λέγων.
- source_word: Πάτερ μου
  choice: Tatăl Meu
  rationale: Vocativul și pronumele posesiv sunt redate direct, păstrând adresarea filială.
- source_word: εἰ οὐ δύναται τοῦτο παρελθεῖν
  choice: dacă acest lucru nu poate trece
  rationale: Păstrează neputința sau imposibilitatea exprimată de οὐ δύναται și demonstrativul neutru τοῦτο, fără a introduce explicit «paharul».
- source_word: ἐὰν μὴ αὐτὸ πίω
  choice: fără să-l beau Eu
  rationale: Redă condiția exceptivă într-o formă românească naturală; pronumele îl reia pe «acest lucru», iar «Eu» face explicit subiectul deja accentuat de forma verbală și clarifică opoziția condițională.
- source_word: γενηθήτω τὸ θέλημά σου
  choice: facă-se voia Ta
  rationale: Păstrează forța imperativului și formularea consacrată, în acord cu Matei 6:10.
theological_decisions:
- issue: Dacă «paharul» trebuie introdus explicit pentru τοῦτο și αὐτό
  choice: Se păstrează «acest lucru» și pronumele care îl reia.
  alternative: «dacă paharul acesta nu poate trece fără să-l beau»
  rationale: Contextul din Matei 26:39 identifică referentul drept paharul suferinței, însă substantivul ποτήριον nu apare în acest vers. Textul principal nu îl adaugă, iar nota explică referința contextuală.
- issue: Redarea rugăciunii de supunere
  choice: facă-se voia Ta
  alternative: «să se împlinească voia Ta»
  rationale: Formularea păstrează valoarea imperativă și legătura verbală cu rugăciunea din Matei 6:10, fără interpretare suplimentară.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Majusculele reverențiale au fost folosite consecvent pentru pronumele și posesivele referitoare la Isus și la Tatăl. Sintaxa urmărește îndeaproape greaca, dar evită construcțiile nenaturale.
