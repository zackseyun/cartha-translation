  text: καὶ λυπούμενοι σφόδρα ἤρξαντο λέγειν αὐτῷ ⸂εἷς ἕκαστος⸃· Μήτι ἐγώ εἰμι, κύριε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/022.yaml
  text: And being deeply grieved[a], they began to say to him one by one, “Surely not I[b], Lord?”
translation:
  language: ro
  text: 'Și, foarte întristați, au început să-i spună, fiecare pe rând[a]: „Doar nu sunt eu, Doamne?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „fiecare” ori „unul după altul”.
    reason: lexical_alternative
  - marker: b
    text: 'Termenul grecesc μήτι introduce o întrebare care așteaptă un răspuns negativ: „Doar nu sunt eu, Doamne?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπούμενοι σφόδρα
  choice: întristându-se foarte mult
  rationale: Participiul prezent redă starea lor emoțională în desfășurare, iar σφόδρα îi intensifică puternic întristarea. Formularea este firească și demnă în româna actuală.
- source_word: ἤρξαντο λέγειν αὐτῷ
  choice: au început să-i spună
  rationale: Păstrează valoarea ingresivă a construcției și redă natural dativul αὐτῷ prin pronumele neaccentuat „-i”.
- source_word: εἷς ἕκαστος
  choice: fiecare pe rând
  rationale: Expresia distributivă subliniază că fiecare ucenic a răspuns individual; „fiecare pe rând” este limpede și idiomatic în română.
- source_word: Μήτι ἐγώ εἰμι
  choice: Nu cumva sunt eu
  rationale: Μήτι introduce o întrebare care anticipează un răspuns negativ. „Nu cumva sunt eu?” păstrează atât așteptarea negării, cât și neliniștea vorbitorilor.
- source_word: κύριε
  choice: Doamne
  rationale: Vocativul românesc consacrat redă direct titlul κύριος adresat lui Isus, păstrând greutatea sa narativă și teologică.
theological_decisions:
- issue: Redarea lui κύριε în adresarea către Isus
  choice: Doamne
  alternative: domnule / stăpâne
  rationale: Deși κύριε poate funcționa uneori ca formulă politicoasă, în narațiunea lui Matei adresarea către Isus are o greutate mai mare decât simplul „domnule”. „Doamne” păstrează această deschidere teologică fără a o explica excesiv.
- issue: Forța întrebării introduse prin μήτι
  choice: Nu cumva sunt eu?
  alternative: Eu sunt?
  rationale: Forma aleasă păstrează orientarea întrebării spre un răspuns negativ, fără a elimina neliniștea și posibilitatea dramatică resimțite de ucenici.
translation_notes:
  register: Română literară modernă, clară și demnă. Topica și punctuația urmăresc cursivitatea vorbirii, iar formularea evită atât arhaismele, cât și parafraza explicativă.
