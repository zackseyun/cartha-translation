id: MAT.14.32
reference: Matthew 14:32
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ⸀ἀναβάντων αὐτῶν εἰς τὸ πλοῖον ἐκόπασεν ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/032.yaml
  text: And when they got into the boat[a], the wind ceased.
translation:
  language: ro
  text: Și, după ce au intrat în barcă[a], vântul s-a potolit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mai literal: „după ce s-au urcat în barcă”.'
    reason: Alternativă lexicală ce păstrează mai îndeaproape sensul de bază al verbului ἀναβαίνω, „a urca”.
lexical_decisions:
- source_word: καὶ
  choice: Și
  rationale: Păstrează legătura simplă cu desfășurarea narațiunii, fără a adăuga o nuanță temporală mai explicită decât cea din text.
- source_word: ἀναβάντων αὐτῶν
  choice: după ce au intrat
  rationale: Genitivul absolut este redat firesc printr-o propoziție temporală. În contextul urcării într-o ambarcațiune, „au intrat” este idiomatic în româna actuală, iar sensul literal al verbului este consemnat în nota de subsol.
- source_word: εἰς τὸ πλοῖον
  choice: în barcă
  rationale: În contextul Mării Galileei, πλοῖον desemnează ambarcațiunea folosită de ucenici; „barcă” este termenul modern și proporționat cadrului.
- source_word: ἐκόπασεν
  choice: s-a potolit
  rationale: Verbul κοπάζω descrie încetarea sau domolirea vântului. „S-a potolit” este o formulare românească naturală care nu introduce ideea unui proces îndelungat.
- source_word: ὁ ἄνεμος
  choice: vântul
  rationale: Redare directă și firească a subiectului articulat.
theological_decisions:
- issue: Implicația narativă a autorității lui Isus asupra naturii
  choice: 'Evenimentul este relatat simplu: odată cu intrarea lor în barcă, vântul s-a potolit.'
  alternative: O formulare interpretativă care să scoată explicit în evidență autoritatea miraculoasă a lui Isus.
  rationale: Textul prezintă succesiunea evenimentelor fără explicație teologică explicită; semnificația rămâne disponibilă din context și nu trebuie adăugată în traducere.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea evită atât arhaismele, cât și explicitările teologice absente din greacă.
