source:
  edition: SBLGNT
  text: ⸀εὐθὺς δὲ ἐλάλησεν ⸂αὐτοῖς ὁ Ἰησοῦς⸃ λέγων· Θαρσεῖτε, ἐγώ εἰμι· μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: ro
  text: 'Dar Isus le-a vorbit îndată, spunând: „Prindeți curaj! Sunt eu.[a] Nu vă temeți!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, mai literal: „Eu sunt.” În acest context, expresia grecească poate fi o simplă autoidentificare, deși unii cititori aud în ea un posibil ecou al autoidentificării divine.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: îndată
  rationale: Redă limpede valoarea temporală și are un registru narativ demn, fără a fi arhaic.
- source_word: δὲ
  choice: Dar
  rationale: Marchează contrastul ușor dintre teama ucenicilor din versetul anterior și intervenția liniștitoare a lui Isus.
- source_word: ἐλάλησεν αὐτοῖς ὁ Ἰησοῦς
  choice: Isus le-a vorbit
  rationale: Păstrează explicit subiectul și destinatarul, într-o ordine firească în română.
- source_word: λέγων
  choice: zicând
  rationale: Păstrează structura participială a narațiunii grecești și introduce natural vorbirea directă.
- source_word: Θαρσεῖτε
  choice: Prindeți curaj!
  rationale: Redă imperativul plural ca îndemn la curaj într-o formulare actuală și ușor de înțeles.
- source_word: ἐγώ εἰμι
  choice: Sunt Eu.
  rationale: În context funcționează firesc drept autoidentificare, dar formularea rămâne suficient de apropiată de greacă pentru a nu elimina posibila rezonanță teologică.
- source_word: μὴ φοβεῖσθε
  choice: Nu vă temeți!
  rationale: Formulare românească directă, demnă și naturală, care nu supraprecizează aspectul verbal.
theological_decisions:
- issue: Dacă ἐγώ εἰμι trebuie redat doar ca autoidentificare sau ca ecou explicit al formulei divine „Eu sunt”
  choice: Textul principal are „Sunt Eu”, autoidentificare firească în context.
  alternative: 'Mai literal: „Eu sunt”, formulare în care unii cititori aud un posibil ecou al autoidentificării divine.'
  rationale: Contextul imediat îl prezintă pe Isus identificându-Se ucenicilor înspăimântați. Nota păstrează însă forma mai literală și tensiunea teologică posibilă, fără a impune o singură interpretare.
translation_notes:
  register: Română standard modernă, clară și demnă. „Îndată” și „zicând” păstrează tonul biblic fără arhaizare excesivă; exclamațiile redau caracterul direct și liniștitor al îndemnurilor.
