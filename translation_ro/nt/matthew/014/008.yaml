id: MAT.14.8
reference: Matthew 14:8
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἡ δὲ προβιβασθεῖσα ὑπὸ τῆς μητρὸς αὐτῆς· Δός μοι, φησίν, ὧδε ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/008.yaml
  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: ro
  text: 'Dar ea, îndemnată de mama ei, spune: „Dă-mi aici, pe o tavă, capul lui Ioan Botezătorul.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: îndemnată
  rationale: Redă influența anterioară exercitată de mamă și păstrează construcția pasivă, fără a preciza excesiv dacă a fost vorba de instruire formală sau de insistență.
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: de mama ei
  rationale: Ὑπό cu genitivul indică agentul personal al construcției pasive; formularea este directă și firească în română.
- source_word: Δός μοι
  choice: Dă-mi
  rationale: Imperativul aorist este redat printr-o poruncă directă și idiomatică.
- source_word: φησίν
  choice: spune
  rationale: Păstrează prezentul istoric al textului grec și vivacitatea narațiunii.
- source_word: ὧδε
  choice: aici
  rationale: Păstrează valoarea deictică locală, fără a introduce explicit ideea de «îndată», care nu este exprimată lexical.
- source_word: ἐπὶ πίνακι
  choice: pe o tavă
  rationale: În contextul ospățului, πίναξ desemnează un vas plat de servire. «Tavă» este actual, limpede și mai accesibil decât tradiționalul «tipsie».
- source_word: τὴν κεφαλὴν
  choice: capul
  rationale: Redare directă, care păstrează caracterul concret și șocant al cererii.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: lui Ioan Botezătorul
  rationale: «Botezătorul» este titlul românesc consacrat și păstrează totodată sensul descriptiv al substantivului de agent βαπτιστής.
theological_decisions:
- issue: Redarea titlului βαπτιστής al lui Ioan
  choice: Ioan Botezătorul
  alternative: Ioan, cel care boteza
  rationale: Forma consacrată «Botezătorul» este naturală în română și rămâne transparent descriptivă, fără a transforma titlul într-o etichetă confesională.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. «Tavă» evită arhaismul «tipsie», iar prezentul «spune» păstrează prezentul istoric al sursei.
