id: MAT.14.13
reference: Matthew 14:13
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ⸂Ἀκούσας δὲ⸃ ὁ Ἰησοῦς ἀνεχώρησεν ἐκεῖθεν ἐν πλοίῳ εἰς ἔρημον τόπον κατ’ ἰδίαν· καὶ ἀκούσαντες οἱ ὄχλοι ἠκολούθησαν αὐτῷ πεζῇ ἀπὸ τῶν πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/013.yaml
  text: When Jesus heard this[a], he withdrew from there by boat to a desolate place by himself. But when the crowds heard[b], they followed him on foot from the towns.
translation:
  language: ro
  text: Când a auzit aceasta, Isus s-a retras de acolo cu barca într-un loc pustiu[a], deoparte. Dar, când au auzit mulțimile, l-au urmat pe jos din orașe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „un loc nelocuit” ori „un loc retras”. Termenul grecesc descrie o zonă izolată sau nelocuită, nu neapărat un deșert nisipos.
    reason: lexical_alternative
  - marker: b
    text: Sau „din cetăți” ori „din localități”. Cuvântul grecesc poate desemna orașe sau așezări mai mici, în funcție de context.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας δὲ
  choice: Când a auzit aceasta
  rationale: Participiul aorist este redat temporal, iar δέ marchează continuarea narațiunii, fără a cere un contrast puternic. „Aceasta” explicitează în română obiectul subînțeles din context, fără a preciza natura veștii.
- source_word: ἀνεχώρησεν
  choice: s-a retras
  rationale: Păstrează sensul de îndepărtare intenționată sugerat frecvent de ἀναχωρέω în Matei, fără a atribui un motiv anume.
- source_word: ἐν πλοίῳ
  choice: cu o barcă
  rationale: Redare firească a mijlocului de deplasare; articolul nehotărât corespunde substantivului grec nearticulat.
- source_word: εἰς ἔρημον τόπον
  choice: spre un loc pustiu
  rationale: „Pustiu” indică aici un loc izolat ori nelocuit, nu neapărat un deșert nisipos.
- source_word: κατ’ ἰδίαν
  choice: ca să fie singur
  rationale: Exprimă natural retragerea în particular, departe de mulțimi. Formularea nu precizează dacă niciun ucenic nu îl însoțea.
- source_word: οἱ ὄχλοι
  choice: mulțimile
  rationale: Păstrează pluralul grecesc și folosește un termen românesc actual.
- source_word: ἠκολούθησαν αὐτῷ πεζῇ
  choice: l-au urmat pe jos
  rationale: Redare directă și idiomatică atât a urmării fizice, cât și a deplasării pe uscat, fără încărcătură teologică suplimentară.
- source_word: ἀπὸ τῶν πόλεων
  choice: din orașe
  rationale: πόλις poate desemna orașe sau târguri/localități; „orașe” este termenul modern direct, iar alternativa contextuală este păstrată în notă.
theological_decisions:
- issue: Motivul retragerii lui Isus
  choice: Acțiunea este redată neutru prin „s-a retras”, iar scopul exprimat de κατ’ ἰδίαν prin „ca să fie singur”.
  alternative: S-a retras din teamă, pentru doliu, rugăciune sau doar pentru a călători în alt loc.
  rationale: Versetul leagă retragerea de ceea ce a auzit Isus, dar nu îi definește explicit motivul; traducerea nu soluționează această ambiguitate.
- issue: Caracterul singurătății exprimate de κατ’ ἰδίαν
  choice: „ca să fie singur” descrie retragerea deoparte, mai ales față de mulțimi.
  alternative: Afirmația că Isus era în mod absolut fără niciun însoțitor.
  rationale: Expresia greacă poate indica intimitate sau separare, fără să stabilească neapărat că ucenicii nu erau prezenți.
translation_notes:
  register: Română standard modernă, cu frazare clară și demnă. Pronumele referitoare la Isus nu sunt scrise cu majusculă, conform ortografiei curente și unei prezentări confesional neutre. Notele sunt plasate chiar după expresiile pe care le explică.
