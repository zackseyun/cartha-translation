source:
  edition: SBLGNT
  text: καὶ ἠνέχθη ἡ κεφαλὴ αὐτοῦ ἐπὶ πίνακι καὶ ἐδόθη τῷ κορασίῳ, καὶ ἤνεγκεν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/011.yaml
  text: And his head was brought on a platter and given to the girl[a], and she brought it to her mother.
translation:
  language: ro
  text: Capul lui a fost adus pe un platou[a] și dat fetei, iar ea l-a dus mamei sale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „pe o tavă” ori „pe o farfurie întinsă”. Termenul grecesc πίναξ se referă la un platou, o tavă sau un vas folosit la servire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνέχθη
  choice: a fost adus
  rationale: Redă natural în română aoristul pasiv al lui φέρω și păstrează succesiunea narativă.
- source_word: ἡ κεφαλὴ αὐτοῦ
  choice: capul lui
  rationale: Redare directă a expresiei grecești, fără eufemizare.
- source_word: ἐπὶ πίνακι
  choice: pe un platou
  rationale: πίναξ desemnează un platou, o tavă sau un vas întins folosit la servire; „platou” este actual și firesc în context.
- source_word: ἐδόθη
  choice: dat
  rationale: Păstrează sensul pasiv al aoristului lui δίδωμι; auxiliarul „a fost” se subînțelege firesc din construcția coordonată anterioară.
- source_word: τῷ κορασίῳ
  choice: fetei
  rationale: κοράσιον desemnează o fată sau o fată tânără; „fetei” este clar și neînvechit.
- source_word: ἤνεγκεν
  choice: ea l-a dus
  rationale: Redă aoristul activ al lui φέρω; pronumele „l-” indică limpede capul ca obiect, iar „ea” face explicit subiectul feminin din context.
- source_word: τῇ μητρὶ αὐτῆς
  choice: mamei sale
  rationale: Redare firească a dativului și a pronumelui posesiv, cu referire clară la mama fetei.
theological_decisions: []
