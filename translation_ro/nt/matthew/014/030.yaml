id: MAT.14.30
reference: Matthew 14:30
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: βλέπων δὲ τὸν ἄνεμον ⸀ἰσχυρὸν ἐφοβήθη, καὶ ἀρξάμενος καταποντίζεσθαι ἔκραξεν λέγων· Κύριε, σῶσόν με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: ro
  text: 'Dar, când a văzut vântul puternic[a], i s-a făcut frică și, începând să se scufunde, a strigat: „Doamne, salvează-mă![b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „vântul violent”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „scapă-mă!”. Verbul grecesc poate desemna atât izbăvirea dintr-un pericol imediat, cât și mântuirea într-un sens mai larg.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπων
  choice: când a văzut
  rationale: Redă firesc în română participiul circumstanțial și percepția care declanșează teama, fără a pierde legătura temporală cu acțiunea principală.
- source_word: δὲ
  choice: Dar
  rationale: Marchează contrastul și răsturnarea narativă față de mersul anterior al lui Petru pe apă.
- source_word: ἄνεμον ἰσχυρόν
  choice: vântul puternic
  rationale: Este o redare directă și naturală a adjectivului ἰσχυρός; varianta «vântul violent» rămâne posibilă.
- source_word: ἐφοβήθη
  choice: i s-a făcut frică
  rationale: Surprinde nuanța ingresivă, adică instalarea fricii, într-o formulare românească firească.
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: începând să se scufunde
  rationale: Păstrează explicit începutul procesului și evită sensul excesiv de definitiv al lui «a se îneca».
- source_word: ἔκραξεν
  choice: a strigat
  rationale: Exprimă intensitatea și urgența apelului într-un registru clar și demn.
- source_word: λέγων
  choice: '[implicit în introducerea vorbirii directe]'
  rationale: În româna actuală, «a strigat, spunând» ar fi greoi; două puncte introduc natural cuvintele rostite, păstrând funcția participiului.
- source_word: Κύριε
  choice: Doamne
  rationale: Este vocativul românesc consacrat și exact pentru adresarea directă κύριε către Isus.
- source_word: σῶσόν με
  choice: salvează-mă
  rationale: Redă imperativul urgent și păstrează atât sensul imediat de izbăvire din pericol, cât și rezonanța semantică mai largă a verbului σῴζω.
theological_decisions:
- issue: Redarea lui κύριος în adresarea directă către Isus
  choice: Doamne
  alternative: Stăpâne
  rationale: «Doamne» este echivalentul normal al vocativului κύριε și păstrează greutatea cristologică a adresării fără a preciza mai mult decât textul.
- issue: Redarea lui σῴζω într-un context de pericol fizic imediat
  choice: salvează-mă
  alternative: scapă-mă
  rationale: «Salvează-mă» se potrivește situației concrete și păstrează deschiderea semantică a verbului către ideea mai largă de mântuire; nota indică alternativa contextuală.
translation_notes:
  register: Română standard modernă, clară și demnă. Sintaxa participială grecească este păstrată acolo unde rămâne firească («începând să se scufunde»), iar λέγων este redat idiomatic prin introducerea directă a strigătului. Marcajele [a] și [b] apar în text.
