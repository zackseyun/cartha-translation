id: MAT.14.19
reference: Matthew 14:19
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: ro
  text: După ce le-a poruncit mulțimilor să se așeze pe iarbă, a luat cele cinci pâini și cei doi pești, și-a ridicat privirea spre cer, a binecuvântat[a], apoi a frânt pâinile și le-a dat ucenicilor, iar ucenicii le-au dat mulțimilor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „a binecuvântat pe Dumnezeu” ori „a rostit o binecuvântare”. Textul grecesc spune doar „a binecuvântat”, fără să precizeze obiectul.'
    reason: alternative_reading
lexical_decisions:
- source_word: κελεύσας
  choice: le-a poruncit
  rationale: Redă clar forța unei dispoziții autoritative, iar „apoi” integrează firesc participiul aorist în succesiunea narativă românească.
- source_word: τοὺς ὄχλους
  choice: mulțimilor
  rationale: Păstrează pluralul grecesc și este formularea firească în registrul biblic românesc actual.
- source_word: ἀνακλιθῆναι
  choice: să se așeze
  rationale: În contextul mesei, verbul indică adoptarea poziției pentru a mânca; formularea este naturală în româna modernă fără a impune imaginea culcatului complet.
- source_word: ἐπὶ τοῦ χόρτου
  choice: pe iarbă
  rationale: Redare directă a locului, fără adaosul „verde”, care nu apare în textul lui Matei.
- source_word: τοὺς πέντε ἄρτους
  choice: cele cinci pâini
  rationale: „Pâini” este termenul românesc firesc pentru pâinile întregi avute în vedere aici.
- source_word: τοὺς δύο ἰχθύας
  choice: cei doi pești
  rationale: Redă concret pluralul numărabil din context.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: și-a ridicat privirea spre cer
  rationale: Formulare românească naturală care păstrează atât mișcarea privirii în sus, cât și direcția ei.
- source_word: εὐλόγησεν
  choice: a binecuvântat
  rationale: Păstrează verbul fără obiect exprimat, așa cum este în greacă, evitând să decidă în text dacă binecuvântarea îi este adresată lui Dumnezeu sau privește hrana.
- source_word: κλάσας
  choice: apoi a frânt pâinile
  rationale: Transformă participiul într-un verb finit pentru cursivitate și explicitează obiectul evident din context.
- source_word: ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους
  choice: le-a dat ucenicilor
  rationale: Pronumele „le” reia limpede pâinile tocmai frânte și evită repetarea greoaie.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: iar ucenicii le-au dat mulțimilor
  rationale: Completează în română verbul eliptic al grecei, păstrând contrastul și succesiunea prin „iar”.
theological_decisions:
- issue: Obiectul verbului εὐλόγησεν
  choice: 'Verbul rămâne fără obiect exprimat: „a binecuvântat”.'
  alternative: „L-a binecuvântat pe Dumnezeu”, „a rostit binecuvântarea” sau „le-a binecuvântat”.
  rationale: Greaca nu exprimă obiectul. Redarea fără obiect păstrează ambiguitatea reală dintre binecuvântarea adresată lui Dumnezeu și binecuvântarea asociată pâinilor și peștilor.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Succesiunea participiilor grecești este redată prin verbe finite pentru naturalețe, fără pierderea ordinii acțiunilor. Nota este plasată după „a binecuvântat”, expresia la care se referă.
