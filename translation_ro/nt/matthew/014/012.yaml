id: MAT.14.12
reference: Matthew 14:12
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: ro
  text: Ucenicii lui au venit, au luat trupul[a] și l-au îngropat; apoi s-au dus și i-au dat de veste lui Isus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „trupul neînsuflețit”. Cuvântul grecesc desemnează trupul unei persoane moarte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: au venit
  rationale: Participiul aorist introduce venirea ucenicilor la locul unde se afla trupul; formularea este firească în narațiunea românească, fără a accentua inutil ideea de apropiere.
- source_word: μαθηταὶ αὐτοῦ
  choice: ucenicii lui
  rationale: Păstrează termenul consacrat pentru μαθηταί și pronumele ambiguu formal; contextul îl indică pe Ioan Botezătorul drept referent.
- source_word: ἦραν
  choice: au luat
  rationale: Redă direct verbul αἴρω în contextul pregătirii pentru înmormântare, fără a adăuga explicit ideea de transportare.
- source_word: πτῶμα
  choice: trupul
  rationale: În româna biblică modernă, «trupul» este natural și demn; nota precizează că termenul grec desemnează un trup mort.
- source_word: ἔθαψαν αὐτόν
  choice: l-au îngropat
  rationale: Redare directă a verbului θάπτω și a pronumelui masculin, fără a introduce un mormânt care nu este menționat în verset.
- source_word: ἐλθόντες
  choice: apoi s-au dus
  rationale: În succesiunea narativă, participiul indică deplasarea lor către Isus după înmormântare; o construcție verbală finită este firească în română.
- source_word: ἀπήγγειλαν
  choice: i-au dat de veste
  rationale: Expresia românească redă sensul de a informa sau a raporta, păstrând neexprimat conținutul concret al veștii, așa cum este și în greacă.
- source_word: τῷ Ἰησοῦ
  choice: lui Isus
  rationale: Folosește forma standard românească a numelui și marchează destinatarul informării.
theological_decisions:
- issue: Identitatea expresiei «ucenicii lui»
  choice: Referentul contextual este Ioan Botezătorul, păstrând totuși formularea «ucenicii lui».
  alternative: Ucenicii lui Isus.
  rationale: Contextul imediat relatează moartea lui Ioan, astfel încât pronumele αὐτοῦ se referă în mod natural la el. Traducerea nu înlocuiește pronumele cu numele și păstrează forma textului grec.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. «I-au dat de veste» este idiomatic, dar nu colocvial; punctuația păstrează succesiunea strânsă a acțiunilor din greacă.
