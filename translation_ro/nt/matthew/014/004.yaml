  text: ἔλεγεν γὰρ ⸂αὐτῷ ὁ Ἰωάννης⸃· Οὐκ ἔξεστίν σοι ἔχειν αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/004.yaml
  text: For John had been saying to him[a], “It is not lawful for you to have her.”
translation:
  language: ro
  text: 'Căci Ioan îi spunea: „Nu-ți este îngăduit s-o ai.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: îi spunea
  rationale: Imperfectul indică o acțiune trecută în desfășurare sau repetată; formularea românească păstrează această valoare fără a forța ideea de repetare.
- source_word: γὰρ
  choice: Căci
  rationale: Introduce explicația de fundal pentru afirmația anterioară și păstrează explicit legătura logică.
- source_word: αὐτῷ ὁ Ἰωάννης
  choice: Ioan îi
  rationale: Redă pronumele datival ca obiect indirect și păstrează numele simplu din textul grecesc; ordinea este adaptată firesc limbii române.
- source_word: Οὐκ ἔξεστίν σοι
  choice: Nu-ți este îngăduit
  rationale: ἔξεστιν exprimă ceea ce este permis sau legitim. „Îngăduit” păstrează forța moral-juridică și sună firesc, demn și clar în româna actuală.
- source_word: ἔχειν αὐτήν
  choice: s-o ai
  rationale: Păstrează formularea concisă și ambiguitatea lexicală a grecei; contextul indică relația conjugală, fără ca aceasta să fie explicitată în verset.
theological_decisions:
- issue: Natura mustrării lui Ioan
  choice: „Nu-ți este îngăduit s-o ai”
  alternative: „Nu este drept să o ai”
  rationale: Textul exprimă în primul rând permisiunea sau legitimitatea, nu doar o apreciere generală despre ce este drept; traducerea păstrează caracterul moral-juridic fără a introduce explicit temeiul legal.
translation_notes:
  register: Română standard modernă, concisă și demnă. „Căci” păstrează conexiunea explicativă, iar construcția enclitică „Nu-ți” este naturală. Nu este necesară o notă, deoarece alternativa semantică „nu-ți este permis” este deja reprezentată adecvat de „nu-ți este îngăduit”.
