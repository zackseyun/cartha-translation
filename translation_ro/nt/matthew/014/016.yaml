  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐ χρείαν ἔχουσιν ἀπελθεῖν· δότε αὐτοῖς ὑμεῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/016.yaml
  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: ro
  text: 'Dar Isus le-a spus: „Nu este nevoie să plece; dați-le voi ceva de mâncare.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Dar
  rationale: Marchează contrastul moderat cu propunerea ucenicilor din versetul anterior și este firesc în narațiunea românească.
- source_word: εἶπεν αὐτοῖς
  choice: le-a spus
  rationale: Redare directă și idiomatică a verbului λέγω împreună cu obiectul indirect plural.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: Nu este nevoie
  rationale: Exprimă natural în română idiomul ἔχω χρείαν, fără a schimba sensul de lipsă a necesității.
- source_word: ἀπελθεῖν
  choice: să plece
  rationale: Redă firesc infinitivul lui ἀπέρχομαι în contextul trimiterii mulțimilor din acel loc.
- source_word: δότε αὐτοῖς
  choice: dați-le
  rationale: Păstrează imperativul aorist la persoana a doua plural și referirea pronominală la oameni.
- source_word: ὑμεῖς
  choice: voi
  rationale: Pronumele exprimat separat în greacă este emfatic; poziția lui „voi” după forma verbală păstrează accentul asupra ucenicilor.
- source_word: φαγεῖν
  choice: să mănânce
  rationale: Construcția „dați-le ... să mănânce” este idiomatică în română și păstrează infinitivul de conținut fără a introduce explicit un obiect absent din greacă.
theological_decisions:
- issue: Accentul pus pe rolul ucenicilor în porunca lui Isus
  choice: „dați-le voi să mănânce”
  alternative: „dați-le să mănânce”
  rationale: Pronumele grec explicit ὑμεῖς cere păstrarea accentului asupra ucenicilor, fără a adăuga o interpretare teologică.
translation_notes:
  register: Română standard modernă, concisă și demnă. Formularea păstrează contrastul narativ, porunca directă și accentul pronumelui grec, evitând atât arhaismul „trebuință”, cât și suplinirea inutilă a substantivului „mâncare”.
