  text: Ἐν ἐκείνῳ τῷ καιρῷ ἤκουσεν Ἡρῴδης ὁ τετραάρχης τὴν ἀκοὴν Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/001.yaml
  text: At that time Herod the tetrarch heard the report about Jesus,[a]
translation:
  language: ro
  text: În vremea aceea, tetrarhul Irod a auzit ce se spunea despre Isus,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „vestea despre Isus”.'
    reason: Alternativă lexicală pentru τὴν ἀκοὴν, care poate desemna vestea ori relatarea auzită.
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: În vremea aceea
  rationale: Redă firesc în româna actuală expresia temporală idiomatică, păstrând referirea la acel moment.
- source_word: ἤκουσεν
  choice: a auzit
  rationale: Păstrează sensul direct al aoristului verbului ἀκούω, fără interpretarea suplimentară „a aflat”.
- source_word: Ἡρῴδης
  choice: Irod
  rationale: Forma consacrată în limba română a numelui personal.
- source_word: ὁ τετραάρχης
  choice: tetrarhul
  rationale: Păstrează titlul politic precis și consacrat istoric; topica „tetrarhul Irod” este firească în română.
- source_word: τὴν ἀκοὴν
  choice: ce se spunea
  rationale: În acest context, substantivul desemnează ceea ce se aude, adică informațiile sau relatările care circulă; formularea este naturală și evită rigiditatea expresiei „relatarea despre”.
- source_word: Ἰησοῦ
  choice: despre Isus
  rationale: Redă genitivul de conținut prin construcția românească idiomatică „despre Isus”.
