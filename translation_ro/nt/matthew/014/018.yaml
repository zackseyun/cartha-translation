  text: ὁ δὲ εἶπεν· Φέρετέ μοι ⸂ὧδε αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/018.yaml
  text: But he said[a], “Bring them here to me.”
translation:
  language: ro
  text: 'Dar el a zis[a]: „Aduceți-le aici, la mine.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Adică pâinile și peștii menționați în versetul precedent.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: Dar
  rationale: Conjuncția marchează ușor contrastul dintre obiecția ucenicilor și răspunsul lui Isus; „Dar” este firesc în context.
- source_word: εἶπεν
  choice: a zis
  rationale: Redă direct aoristul verbului λέγω, fără a adăuga verbului însuși nuanța unei porunci.
- source_word: Φέρετέ
  choice: Aduceți
  rationale: Imperativul prezent, persoana a doua plural, cere ca obiectele menționate să fie aduse; „Aduceți” este formularea românească naturală.
- source_word: μοι
  choice: la mine
  rationale: Dativul indică persoana spre care sunt aduse obiectele; în combinație cu verbul „a aduce”, româna folosește firesc „la mine”.
- source_word: ὧδε
  choice: aici
  rationale: Păstrează sensul local al adverbului grec, fără parafrazare inutilă.
- source_word: αὐτούς
  choice: le
  rationale: Pronumele masculin plural se referă contextual la pâinile și peștii din versetul precedent; pronumele românesc neaccentuat evită repetarea și rămâne natural.
theological_decisions: []
translation_notes:
  register: Formulare modernă, demnă și accesibilă. „A zis” păstrează simplitatea narațiunii, iar „Aduceți-le aici, la mine” redă distinct atât locul, cât și orientarea personală exprimate în greacă.
