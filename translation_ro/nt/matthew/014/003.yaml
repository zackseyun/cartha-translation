id: MAT.14.3
reference: Matthew 14:3
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ὁ γὰρ Ἡρῴδης κρατήσας τὸν Ἰωάννην ἔδησεν ⸀αὐτὸν καὶ ⸂ἐν φυλακῇ ἀπέθετο⸃ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/003.yaml
  text: For Herod had arrested John[a], bound him, and put him in prison because of Herodias, the wife of Philip his brother,
translation:
  language: ro
  text: Căci Irod îl arestase pe Ioan[a], îl legase și îl pusese în închisoare din pricina Irodiadei, soția fratelui său Filip.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „după ce l-a prins pe Ioan”.'
    reason: Păstrează alternativa mai literală pentru participiul κρατήσας, care poate descrie prinderea sau luarea în custodie fără termenul juridic explicit „a aresta”.
lexical_decisions:
- source_word: γὰρ
  choice: Căci
  rationale: Păstrează valoarea explicativă prin care versetul fundamentează relatarea precedentă și se potrivește registrului narativ biblic actual.
- source_word: κρατήσας
  choice: îl arestase
  rationale: În contextul luării în custodie, verbul este redat firesc prin „a aresta”; mai-mult-ca-perfectul exprimă anterioritatea față de cadrul narativ din versetele precedente.
- source_word: ἔδησεν
  choice: îl legase
  rationale: Redă concret verbul δέω fără a preciza în mod nejustificat dacă au fost folosite funii sau lanțuri.
- source_word: ἐν φυλακῇ ἀπέθετο
  choice: îl pusese în închisoare
  rationale: Formulare românească limpede pentru actul întemnițării, care păstrează imaginea plasării lui Ioan sub pază.
- source_word: διὰ Ἡρῳδιάδα
  choice: din pricina Irodiadei
  rationale: διά cu acuzativul indică aici motivul sau cauza; formularea este naturală și păstrează nuanța contextuală negativă fără adaos explicativ.
- source_word: γυναῖκα
  choice: soția
  rationale: În construcția relațională cu Filip, sensul contextual al lui γυνή este „soție”.
- source_word: Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: fratelui său Filip
  rationale: Identifică limpede că Filip era fratele lui Irod și oferă o ordine firească în româna modernă.
theological_decisions:
- issue: Încadrarea istorico-morală a relației Irodiadei cu Filip
  choice: „Irodiada, soția fratelui său Filip”
  alternative: „Irodiada, soția lui Filip, fratele său”
  rationale: Versetul o identifică pe Irodiada prin relația ei cu Filip, fără să formuleze încă explicit caracterul nelegitim al relației cu Irod; judecata din versetul următor nu este anticipată.
translation_notes:
  register: Română standard modernă, clară și demnă. Mai-mult-ca-perfectul integrează firesc retrospectiva explicativă, iar reluarea pronumelui păstrează succesiunea acțiunilor fără rigiditate.
