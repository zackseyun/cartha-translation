  text: καὶ ⸂λυπηθεὶς ὁ βασιλεὺς διὰ⸃ τοὺς ὅρκους καὶ τοὺς συνανακειμένους ἐκέλευσεν δοθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/009.yaml
  text: And the king[a], though grieved, because of his oaths and those dining with him[b], commanded it to be given.
translation:
  language: ro
  text: Regele, deși întristat, din cauza jurămintelor sale și a celor care stăteau la masă împreună cu el, a poruncit să se dea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: În greacă, obiectul verbului „să se dea” rămâne neexprimat; el se referă la cererea din versetul precedent.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπηθεὶς
  choice: s-a întristat, dar
  rationale: Participiul aorist pasiv indică întristarea regelui; construcția cu „dar” redă firesc în română valoarea concesivă sugerată de context.
- source_word: ὁ βασιλεὺς
  choice: regele
  rationale: Redare directă și firească a substantivului βασιλεύς.
- source_word: διὰ τοὺς ὅρκους
  choice: din cauza jurămintelor sale
  rationale: διά cu acuzativul exprimă cauza; posesivul este explicitat legitim din context, fiind vorba despre jurămintele regelui.
- source_word: τοὺς συνανακειμένους
  choice: cei care stăteau la masă cu el
  rationale: Redă sensul participiului pentru comesenii care ședeau sau, conform obiceiului antic, stăteau întinși la masă, fără a încărca textul principal cu detaliul cultural.
- source_word: ἐκέλευσεν
  choice: a poruncit
  rationale: Echivalent românesc direct pentru ideea unei porunci autoritare.
- source_word: δοθῆναι
  choice: să-i fie dat ceea ce ceruse
  rationale: Păstrează diateza pasivă și face inteligibil în română obiectul subînțeles, identificat de contextul imediat drept lucrul cerut de fată.
theological_decisions: []
translation_notes:
  register: Română standard modernă, narativă și demnă. Formularea evită arhaismele și păstrează tensiunea dintre întristarea regelui și porunca dată. Detaliul posturii antice la masă nu este esențial aici și nu necesită o notă separată.
