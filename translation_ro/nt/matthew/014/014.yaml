  text: καὶ ⸀ἐξελθὼν εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ αὐτοῖς καὶ ἐθεράπευσεν τοὺς ἀρρώστους αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/014.yaml
  text: And when he went ashore[a], he saw a large crowd[b], and he had compassion on them and healed their sick.
translation:
  language: ro
  text: Când a debarcat[a], a văzut o mulțime mare, i s-a făcut milă de ei[b] și i-a vindecat pe bolnavii lor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau, mai literal, „când a ieșit” sau „după ce a ieșit”. În context, este vorba probabil despre coborârea din barcă la țărm.
    reason: lexical_alternative
  - marker: b
    text: Sau „a fost cuprins de compasiune pentru ei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: când a coborât la țărm
  rationale: Participiul înseamnă literal „ieșind” sau „după ce a ieșit”. În contextul sosirii cu barca, formularea românească redă natural debarcarea, iar nota păstrează sensul lexical mai larg.
- source_word: εἶδεν
  choice: a văzut
  rationale: Redare directă și firească a aoristului verbului ὁράω.
- source_word: πολὺν ὄχλον
  choice: o mulțime mare
  rationale: Păstrează explicit ideea cantitativă a adjectivului πολύς și sensul obișnuit al lui ὄχλος.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοῖς
  choice: i s-a făcut milă de ei
  rationale: Expresie românească naturală pentru o reacție profundă de compasiune, fără a adăuga o explicație psihologică absentă din text.
- source_word: ἐθεράπευσεν
  choice: i-a vindecat
  rationale: În acest context, θεραπεύω se referă clar la vindecarea fizică.
- source_word: τοὺς ἀρρώστους αὐτῶν
  choice: pe bolnavii lor
  rationale: Redă concis adjectivul substantivizat ἀρρώστους și păstrează pronumele posesiv αὐτῶν, referitor la mulțime.
theological_decisions:
- issue: Redarea reacției afective a lui Isus
  choice: i s-a făcut milă de ei
  alternative: a fost cuprins de compasiune pentru ei
  rationale: Formularea aleasă păstrează mila ca impuls al vindecării și intensitatea de bază a verbului, fără amplificare retorică sau interpretare doctrinară suplimentară.
translation_notes:
  register: Română standard modernă, cu frazare simplă și demnă. Subiectul rămâne implicit, ca în greacă, fiind clar din context. Nu se folosesc majuscule confesionale pentru pronumele referitoare la Isus.
