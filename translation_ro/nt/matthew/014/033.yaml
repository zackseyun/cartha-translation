  text: οἱ δὲ ἐν τῷ ⸀πλοίῳ προσεκύνησαν αὐτῷ λέγοντες· Ἀληθῶς θεοῦ υἱὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/033.yaml
  text: Then those in the boat worshiped him[a], saying[b], “Truly you are the Son of God.”
translation:
  language: ro
  text: 'Iar cei din barcă i s-au închinat[a], zicând: „Cu adevărat, tu ești Fiul lui Dumnezeu[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „s-au plecat înaintea lui” ori „i-au adus omagiu”. Verbul grecesc poate desemna reverența exprimată prin îngenunchere sau prosternare; aici contextul susține sensul „i s-au închinat”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „ești fiu al lui Dumnezeu”. Deși „Dumnezeu” nu are articol în greacă, în acest context expresia funcționează ca titlu, nu înseamnă doar „un fiu al lui Dumnezeu”.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: Iar cei
  rationale: δέ este un conector narativ slab; „iar” continuă firesc relatarea fără a introduce un contrast puternic, iar οἱ este substantivizat și îi desemnează pe cei aflați în barcă.
- source_word: ἐν τῷ πλοίῳ
  choice: din barcă
  rationale: πλοῖον desemnează aici o ambarcațiune obișnuită; „cei din barcă” este formularea românească naturală pentru persoanele aflate în ea.
- source_word: προσεκύνησαν αὐτῷ
  choice: i s-au închinat
  rationale: προσκυνέω poate descrie prosternarea, omagiul sau închinarea. În contextul autorității lui Isus asupra mării și al mărturisirii care urmează, „i s-au închinat” redă cel mai bine sensul probabil, păstrând totodată în notă alternativele lexicale.
- source_word: λέγοντες
  choice: zicând
  rationale: Participiul este păstrat printr-un gerunziu românesc firesc, care leagă actul închinării de mărturisirea rostită.
- source_word: Ἀληθῶς
  choice: Cu adevărat
  rationale: Adverbul exprimă o afirmare solemnă și fermă; „cu adevărat” se potrivește registrului confesional și este limpede în româna actuală.
- source_word: θεοῦ υἱὸς
  choice: Fiul lui Dumnezeu
  rationale: Deși θεοῦ nu are articol, construcția predicativă este aici calitativă și definită, nu indefinită. În contextul lui Matei, expresia funcționează ca titlu.
- source_word: εἶ
  choice: tu ești
  rationale: Pronumele exprimat în română conferă mărturisirii directe claritate și accent firesc, fără a-i schimba sensul.
theological_decisions:
- issue: Forța verbului προσκυνέω când acțiunea este îndreptată spre Isus
  choice: i s-au închinat
  alternative: s-au plecat înaintea lui / i-au adus omagiu
  rationale: Contextul imediat — manifestarea autorității asupra mării și mărturisirea despre identitatea lui Isus — susține sensul de închinare. Nota păstrează însă deschisă gama semantică autentică a verbului.
- issue: Caracterul definit al expresiei θεοῦ υἱὸς
  choice: Fiul lui Dumnezeu
  alternative: un fiu al lui Dumnezeu / Fiul lui Dumnezeu redat posesiv ca „Fiul lui Dumnezeu”
  rationale: Lipsa articolului în greacă nu impune un sens indefinit. În această mărturisire mateană, expresia are valoarea unui titlu și este redată natural și exact prin forma definită românească.
translation_notes:
  register: Română standard modernă, clară și demnă. „Barcă” este mai curent decât „corabie”, fără pierdere de sens. S-a evitat capitalizarea devoțională a pronumelui, care nu este marcată în textul grec. Exclamația redă intensitatea firească a mărturisirii, fără adaos lexical.
