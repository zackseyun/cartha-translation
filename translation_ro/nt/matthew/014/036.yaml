  text: καὶ παρεκάλουν αὐτὸν ἵνα μόνον ἅψωνται τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ· καὶ ὅσοι ἥψαντο διεσώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/036.yaml
  text: And they begged him that they might only touch the fringe of his garment[b][a], and as many as touched it were healed.
translation:
  language: ro
  text: Și îl rugau stăruitor să le îngăduie doar să atingă marginea[a] hainei lui; și toți cei care au atins-o au fost vindecați[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „tivul”, „franjurele” ori „ciucurele”; termenul grecesc poate desemna marginea unui veșmânt, posibil inclusiv ciucurele acestuia.
    reason: lexical_alternative
  - marker: b
    text: Sau „au fost făcuți bine”; verbul grecesc poate însemna și „au fost salvați” ori „au fost scăpați”, dar aici contextul este cel al vindecării fizice.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: îl rugau stăruitor
  rationale: Imperfectul sugerează o rugăminte repetată sau continuă, iar formularea redă insistența fără a deveni teatrală.
- source_word: ἵνα μόνον ἅψωνται
  choice: să-i lase măcar să se atingă
  rationale: Construcția cu ἵνα și conjunctivul exprimă conținutul cererii; «măcar» redă firesc accentul lui μόνον asupra faptului că simpla atingere era considerată suficientă.
- source_word: τοῦ κρασπέδου
  choice: de marginea
  rationale: κράσπεδον poate desemna marginea, tivul sau franjurele unui veșmânt. «Marginea» este clar și nu precizează excesiv forma exactă.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: hainei lui
  rationale: ἱμάτιον desemnează aici un veșmânt, probabil exterior; «haină» este termenul românesc general și natural.
- source_word: ὅσοι
  choice: toți cei care
  rationale: Redă idiomatic în română sensul cantitativ și inclusiv al relativului ὅσοι.
- source_word: ἥψαντο
  choice: s-au atins
  rationale: Forma medie a lui ἅπτω are aici sensul obișnuit de «a se atinge»; obiectul se înțelege din context.
- source_word: διεσώθησαν
  choice: au fost vindecați
  rationale: În contextul imediat al bolnavilor aduși la Isus, verbul indică însănătoșirea fizică, deși lexical poate avea și sensul mai larg de salvare sau scăpare.
theological_decisions:
- issue: Sensul lui διεσώθησαν în contextul minunii
  choice: vindecare fizică («au fost vindecați»)
  alternative: «au fost salvați/scăpați» sau «s-au făcut bine»
  rationale: Contextul indică direct vindecarea trupească. Nota păstrează însă deschiderea semantică mai largă a verbului și evită transformarea tacită a versetului într-o afirmație soteriologică.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. «Îl rugau stăruitor» păstrează aspectul continuu al imperfectului, iar «să-i lase măcar» exprimă natural conținutul cererii. Marcajele notelor sunt așezate imediat după termenii pe care îi explică.
