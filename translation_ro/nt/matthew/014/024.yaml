id: MAT.14.24
reference: Matthew 14:24
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τὸ δὲ πλοῖον ἤδη ⸂σταδίους πολλοὺς ἀπὸ τῆς γῆς ἀπεῖχεν⸃, βασανιζόμενον ὑπὸ τῶν κυμάτων, ἦν γὰρ ἐναντίος ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
translation:
  language: ro
  text: Dar barca era deja la multe stadii[a] depărtare de uscat[b], izbită de valuri[c], căci vântul îi era împotrivă.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un stadiu era o unitate antică de lungime, de aproximativ 185 de metri.
    reason: cultural_note
  - marker: b
    text: Sau „de țărm”. Textul grecesc spune literal „de uscat”.
    reason: lexical_alternative
  - marker: c
    text: Sau „lovită puternic de valuri”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῖον
  choice: barca
  rationale: În contextul traversării Mării Galileei, „barca” este termenul românesc firesc și nu sugerează o navă de dimensiuni prea mari.
- source_word: ἤδη
  choice: deja
  rationale: Redă direct faptul că situația se instalase până în acel moment al narațiunii.
- source_word: σταδίους πολλοὺς
  choice: la multe stadii depărtare
  rationale: Păstrează unitatea antică de măsură și formularea cantitativă a sursei, explicând termenul într-o notă.
- source_word: ἀπὸ τῆς γῆς
  choice: de uscat
  rationale: γῆ desemnează aici uscatul în contrast cu apa; „țărm” rămâne o alternativă contextuală legitimă.
- source_word: ἀπεῖχεν
  choice: era ... la ... depărtare
  rationale: Exprimă în română, într-o construcție firească, distanța spațială indicată de verb.
- source_word: βασανιζόμενον
  choice: izbită
  rationale: În acest context maritim, participiul descrie barca supusă cu putere valurilor; „izbită” redă efectul fizic fără a introduce ideea de suferință psihologică.
- source_word: ὑπὸ τῶν κυμάτων
  choice: de valuri
  rationale: Redare directă și idiomatică a agentului sau forței care acționează asupra bărcii.
- source_word: ἐναντίος
  choice: îi era împotrivă
  rationale: Redă opoziția vântului față de înaintarea bărcii, cu pronumele cerut de exprimarea firească în română.
- source_word: δὲ
  choice: Dar
  rationale: Marchează trecerea cu ușor contrast de la situația lui Isus la cea a bărcii.
- source_word: γάρ
  choice: căci
  rationale: Păstrează legătura explicativă dintre starea bărcii și vântul potrivnic.
theological_decisions: []
