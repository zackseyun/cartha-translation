  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ εἶπεν τοῖς παισὶν αὐτοῦ· Οὗτός ἐστιν Ἰωάννης ὁ βαπτιστής· αὐτὸς ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ διὰ τοῦτο αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
translation:
  language: ro
  text: 'Și le-a spus slujitorilor săi: „Acesta este Ioan Botezătorul. El a fost înviat dintre cei morți și, de aceea, puterile[a] sunt la lucru în el.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „puterile miraculoase”; mai interpretativ, „minunile”. Grecescul spune „puterile” (αἱ δυνάμεις), cu referire la puterea supranaturală manifestată în fapte mărețe.
    reason: lexical_alternative
lexical_decisions:
- source_word: παισὶν
  choice: slujitorilor
  rationale: În contextul curții lui Irod, termenul desemnează cel mai probabil oameni aflați în slujba sa. „Slujitorilor” redă relația socială fără a preciza nejustificat rangul lor.
- source_word: ὁ βαπτιστής
  choice: Botezătorul
  rationale: Este apelativul consacrat și firesc în română pentru cel care botează, păstrând sensul termenului grecesc.
- source_word: ἠγέρθη
  choice: a fost înviat
  rationale: Forma pasivă grecească este păstrată explicit, fără a sugera că Ioan s-ar fi înviat singur.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: dintre cei morți
  rationale: Redă natural și precis ideea ridicării din mijlocul celor morți.
- source_word: διὰ τοῦτο
  choice: de aceea
  rationale: Exprimă limpede raportul cauzal formulat de Irod.
- source_word: αἱ δυνάμεις
  choice: puterile
  rationale: Păstrează substantivul grecesc și ambiguitatea dintre puteri supranaturale și manifestările lor miraculoase, explicată în nota de subsol.
- source_word: ἐνεργοῦσιν
  choice: lucrează
  rationale: Redă activitatea efectivă și continuă exprimată de verb, într-o formulare românească firească.
- source_word: ἐν αὐτῷ
  choice: în el
  rationale: Păstrează valoarea directă a prepoziției ἐν și nu o transformă interpretativ în „prin el”.
theological_decisions:
- issue: Natura revenirii lui Ioan
  choice: El a fost înviat dintre cei morți
  alternative: El a înviat dintre cei morți
  rationale: Pasivul din greacă este păstrat, fără a face o afirmație doctrinară suplimentară despre agentul învierii; propoziția rămâne afirmația lui Irod.
- issue: Sensul lui δυνάμεις în context
  choice: puterile lucrează în el
  alternative: puterile miraculoase lucrează în el / minunile sunt săvârșite prin el
  rationale: Textul indică puteri supranaturale manifestate în fapte extraordinare, dar formularea principală nu reduce termenul la efectele sale și nu schimbă „în el” în „prin el”.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Topica și punctuația urmăresc fluența românească, iar formulările păstrează pasivul și ambiguitatea lexicală relevante ale textului grec.
