id: MAT.14.22
reference: Matthew 14:22
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ εὐθέως ⸀ἠνάγκασεν τοὺς μαθητὰς ἐμβῆναι ⸀εἰς πλοῖον καὶ προάγειν αὐτὸν εἰς τὸ πέραν, ἕως οὗ ἀπολύσῃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/022.yaml
  text: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
translation:
  language: ro
  text: Și îndată i-a silit pe ucenici să urce în barcă și să meargă înaintea lui spre celălalt țărm, până când avea să dea drumul mulțimilor[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „să lase mulțimile să plece”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: îndată
  rationale: Redă promptitudinea și tranziția rapidă din narațiune într-o formulare românească firească și demnă.
- source_word: ἠνάγκασεν
  choice: i-a silit
  rationale: Păstrează ideea de constrângere sau insistență puternică a verbului ἀναγκάζω, fără a adăuga explicit ideea de violență fizică.
- source_word: τοὺς μαθητάς
  choice: pe ucenici
  rationale: Articolul indică grupul deja cunoscut; posesivul „săi” nu este explicit în greacă și nu este necesar în română.
- source_word: ἐμβῆναι εἰς πλοῖον
  choice: să urce în barcă
  rationale: Este echivalentul românesc idiomatic pentru îmbarcarea într-o barcă.
- source_word: πλοῖον
  choice: barcă
  rationale: Contextul lacului și uzul românesc favorizează „barcă”; construcția „în barcă” poate identifica firesc ambarcațiunea cunoscută din context fără un demonstrativ adăugat.
- source_word: προάγειν αὐτόν
  choice: să meargă înaintea lui
  rationale: Redă faptul că ucenicii trebuiau să plece înaintea lui Isus, păstrând raportarea explicită exprimată prin αὐτόν.
- source_word: εἰς τὸ πέραν
  choice: spre celălalt țărm
  rationale: Exprimă limpede deplasarea către partea opusă a întinderii de apă; „țărm” se potrivește contextului geografic.
- source_word: ἕως οὗ ἀπολύσῃ
  choice: până când avea să dea drumul
  rationale: „Până când” păstrează limita temporală, iar „avea să” redă orientarea prospectivă a conjunctivului aorist față de acțiunea principală.
- source_word: τοὺς ὄχλους
  choice: mulțimilor
  rationale: Păstrează pluralul grecesc într-un registru actual și ușor de înțeles.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu ritm narativ limpede și registru demn. Formularea păstrează forța lui ἠνάγκασεν și raportul temporal prospectiv, evitând atât arhaismele, cât și explicitările care nu apar în textul grec.
