  text: ὅθεν μετὰ ὅρκου ὡμολόγησεν αὐτῇ δοῦναι ὃ ⸀ἐὰν αἰτήσηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/007.yaml
  text: Therefore he promised with an oath to give her whatever she might ask[a].
translation:
  language: ro
  text: De aceea, i-a promis cu jurământ că îi va da orice va cere[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „orice ar cere”. În greacă, construcția exprimă o cerere viitoare deschisă, al cărei conținut nu era încă stabilit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: De aceea
  rationale: Redă firesc în româna actuală valoarea inferențială și rezultativă a conjuncției, legând promisiunea de reacția regelui la dans.
- source_word: μετὰ ὅρκου
  choice: cu jurământ
  rationale: Păstrează direct ideea că promisiunea a fost întărită printr-un jurământ, într-o formulare românească demnă și naturală.
- source_word: ὡμολόγησεν
  choice: i-a promis
  rationale: În acest context, verbul exprimă asumarea fermă a unui angajament, nu mărturisirea; pronumele datival αὐτῇ este redat prin „i-”.
- source_word: δοῦναι
  choice: că îi va da
  rationale: Infinitivul care exprimă conținutul promisiunii este redat idiomatic în română printr-o propoziție completivă cu verb la viitor.
- source_word: ὃ ἐὰν αἰτήσηται
  choice: orice va cere
  rationale: Construcția relativă nedefinită cu ἐάν și conjunctiv indică o cerere viitoare, încă nedeterminată; formularea păstrează caracterul deschis și este naturală în română.
theological_decisions: []
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea evită atât arhaismul „orice va fi cerut”, cât și explicarea excesivă; repetarea pronumelui „îi” este idiomatică și clarifică destinatara promisiunii și a darului.
