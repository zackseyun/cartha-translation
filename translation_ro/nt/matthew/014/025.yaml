source:
  edition: SBLGNT
  text: τετάρτῃ δὲ φυλακῇ τῆς νυκτὸς ⸀ἦλθεν πρὸς ⸀αὐτοὺς περιπατῶν ἐπὶ ⸂τὴν θάλασσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
translation:
  language: ro
  text: Iar în a patra strajă a nopții[b], a venit la ei, mergând pe mare[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „mergând deasupra mării”. Unii au înțeles expresia ca „mergând pe lângă mare”, dar contextul susține puternic deplasarea pe suprafața apei.
    reason: alternative_reading
  - marker: b
    text: „A patra strajă a nopții” era ultima perioadă de veghe din timpul nopții, aproximativ între orele 3:00 și 6:00, potrivit sistemului roman.
    reason: cultural_note
lexical_decisions:
- source_word: τετάρτῃ ... φυλακῇ τῆς νυκτός
  choice: în a patra strajă a nopții
  rationale: Dativul are valoare temporală. „Strajă” păstrează împărțirea istorică a nopții în intervale de veghe, iar nota explică reperul orar cititorului modern.
- source_word: δὲ
  choice: Iar
  rationale: Conjuncția continuă narațiunea printr-o legătură ușoară; „iar” este firesc în română și nu introduce un contrast mai puternic decât greaca.
- source_word: ἦλθεν πρὸς αὐτούς
  choice: a venit la ei
  rationale: Construcția exprimă deplasarea către ucenici. „A venit la ei” este direct și idiomatic în română.
- source_word: περιπατῶν
  choice: mergând
  rationale: Participiul prezent indică o acțiune simultană cu verbul principal. „Mergând” redă natural deplasarea pe jos fără nuanța repetitivă pe care o poate avea astăzi „umblând”.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: pe mare
  rationale: În această construcție și în context, expresia descrie deplasarea pe suprafața apei. „Mare” păstrează termenul θάλασσα, fără a-l înlocui geografic prin „lac”.
- source_word: αὐτούς (subiectul implicit al lui ἦλθεν)
  choice: Isus
  rationale: Româna permite subiectul neexprimat, însă numele „Isus”, clar din contextul imediat, evită o formulare izolată ambiguă și nu adaugă o identificare străină narațiunii.
theological_decisions:
- issue: Descrierea miraculoasă a deplasării lui Isus pe apă
  choice: mergând pe mare
  alternative: mergând pe lângă mare
  rationale: Sintaxa expresiei περιπατῶν ἐπὶ τὴν θάλασσαν și contextul indică deplasarea pe suprafața apei, nu de-a lungul țărmului. Redarea păstrează sensul direct și caracterul miraculos al relatării fără amplificare.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. Termenul istoric „strajă” este păstrat pentru fidelitate culturală și explicat în notă; formularea „mergând pe mare” este naturală și menține sensul contextual al grecei.
