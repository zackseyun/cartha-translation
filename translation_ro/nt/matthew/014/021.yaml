id: MAT.14.21
reference: Matthew 14:21
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οἱ δὲ ἐσθίοντες ἦσαν ἄνδρες ὡσεὶ πεντακισχίλιοι χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: ro
  text: Cei care au mâncat erau cam cinci mii de bărbați, fără a număra femeile și copiii.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: Cei care au mâncat
  rationale: Participiul prezent articulat este substantivizat și îi desemnează pe cei care au luat parte la masă. Perfectul compus este firesc în româna narativă și nu supralicitează aspectul; δέ are aici o funcție discursivă ușoară, care nu cere neapărat redare explicită.
- source_word: ἦσαν
  choice: erau
  rationale: Imperfectul verbului εἰμί exprimă aici simpla constatare a numărului, redată natural prin «erau».
- source_word: ἄνδρες
  choice: bărbați
  rationale: Termenul se referă specific la persoane de sex masculin, nu la oameni în general, iar femeile și copiii sunt menționați separat.
- source_word: ὡσεὶ
  choice: cam
  rationale: Marchează aproximația; «cam» este clar și idiomatic în româna modernă.
- source_word: πεντακισχίλιοι
  choice: cinci mii
  rationale: Redare directă a numeralului cardinal care determină substantivul «bărbați».
- source_word: χωρὶς
  choice: fără a număra
  rationale: Cu genitivul, indică faptul că femeile și copiii nu sunt incluși în cifra menționată. Formularea românească exprimă limpede excluderea din numărătoare.
- source_word: γυναικῶν
  choice: femeile
  rationale: Contextul cere sensul general «femei», nu «soții», deoarece nu este avută în vedere vreo relație maritală.
- source_word: παιδίων
  choice: copiii
  rationale: Redă natural pluralul lui παιδίον fără a restrânge nejustificat referința la copiii foarte mici.
theological_decisions:
- issue: Termenul masculin specific într-o mulțime mixtă
  choice: Redarea lui ἄνδρες prin «bărbați» și păstrarea precizării că femeile și copiii nu intră în număr.
  alternative: «oameni» sau «persoane»
  rationale: Greaca numără explicit persoanele de sex masculin și menționează separat femeile și copiii. «Oameni» ar șterge această distincție lexicală și istorico-socială.
translation_notes:
  register: Română standard modernă, clară și demnă. «Cam» păstrează tonul firesc al relatării, iar «fără a număra» face explicit sensul contextual al lui χωρὶς fără a adăuga o notă redundantă.
