  text: καὶ θέλων αὐτὸν ἀποκτεῖναι ἐφοβήθη τὸν ὄχλον, ὅτι ὡς προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/005.yaml
  text: And wanting to kill him[a], he feared the crowd[b], because they regarded him as a prophet.
translation:
  language: ro
  text: Deși voia să-l omoare[a], s-a temut de mulțime, fiindcă mulțimea îl socotea profet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mai literal: „Voind să-l omoare, s-a temut de mulțime”. Participiul poate fi redat în context cu sens concesiv: „Deși voia să-l omoare”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „mulțimea îl considera profet”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: Deși voia
  rationale: 'Participiul exprimă dorința subiectului, iar în context relația cu verbul principal este concesivă: dorința de a-l ucide este împiedicată de teama de mulțime. Formularea este firească în româna actuală, iar nota păstrează construcția mai literală.'
- source_word: ἀποκτεῖναι
  choice: să-l omoare
  rationale: Verbul înseamnă direct „a ucide/a omorî”. „Să-l omoare” este natural și nu adaugă nuanța juridică din „să-l dea morții” sau calificarea morală explicită din „să-l asasineze”.
- source_word: ἐφοβήθη
  choice: s-a temut
  rationale: Aoristul lui φοβέομαι este redat prin perfectul compus, forma narativă obișnuită în româna modernă.
- source_word: τὸν ὄχλον
  choice: de mulțime
  rationale: ὄχλος desemnează mulțimea adunată; „mulțime” este exact, firesc și potrivit registrului narativ.
- source_word: ὅτι
  choice: fiindcă
  rationale: Conjuncția introduce motivul temerii. „Fiindcă” redă clar raportul cauzal.
- source_word: ὡς προφήτην
  choice: profet
  rationale: În construcția cu εἶχον, sintagma indică statutul în care era socotit Ioan. Predicativul fără articol este idiomatic în română și nu slăbește aprecierea mulțimii.
- source_word: αὐτὸν εἶχον
  choice: oamenii îl socoteau
  rationale: ἔχω cu un predicativ poate însemna „a socoti/a considera”. Subiectul plural este redat prin „oamenii”, referindu-se natural la membrii mulțimii, fără a introduce un nume propriu absent din verset.
theological_decisions:
- issue: Identitatea subiectului și a obiectului este exprimată în greacă numai prin pronume și prin context
  choice: Păstrarea pronumelor implicite în formele verbale și în „-l”, fără introducerea numelor Irod și Ioan
  alternative: „Deși Irod voia să-l omoare pe Ioan...”
  rationale: Contextul imediat identifică persoanele, dar versetul grec nu repetă numele. Păstrarea formei pronominale evită o explicitare interpretativă inutilă.
- issue: Valoarea logică a participiului θέλων
  choice: 'Redare concesivă: „Deși voia”'
  alternative: 'Redare formală: „Voind să-l omoare”'
  rationale: Greaca lasă relația participiului cu verbul principal să fie dedusă din context. Aici teama explică de ce dorința nu este pusă în aplicare; traducerea concesivă face relația inteligibilă în română, iar nota păstrează alternativa mai formală.
translation_notes:
  register: Română standard modernă, într-un registru narativ demn și accesibil. „A socoti profet” păstrează concizia construcției grecești, iar „a considera un profet” este oferit ca alternativă mai uzuală.
