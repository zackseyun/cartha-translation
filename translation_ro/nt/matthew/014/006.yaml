lexical_decisions:
- source_word: γενεσίοις ... γενομένοις
  choice: când s-a sărbătorit ziua de naștere a lui Irod
  rationale: Construcția temporală indică prilejul sau celebrarea zilei de naștere, nu doar data calendaristică. Formularea este firească în româna actuală și redă caracterul festiv al împrejurării.
- source_word: δὲ
  choice: Dar
  rationale: Marchează continuarea narațiunii cu o ușoară nuanță de contrast față de contextul precedent.
- source_word: ὠρχήσατο
  choice: a dansat
  rationale: Redă direct și natural verbul grec, fără a preciza un tip de dans pe care textul nu îl indică.
- source_word: ἡ θυγάτηρ τῆς Ἡρῳδιάδος
  choice: fiica Irodiadei
  rationale: Păstrează relația genitivală explicită și nu introduce identificarea tradițională a fiicei, al cărei nume nu apare în text.
- source_word: ἐν τῷ μέσῳ
  choice: în mijlocul adunării
  rationale: Expresia înseamnă literal „în mijloc”; completarea „adunării” face sensul contextual limpede în română, fără a adăuga o localizare mai precisă decât permite textul.
- source_word: ἤρεσεν τῷ Ἡρῴδῃ
  choice: i-a plăcut lui Irod
  rationale: Redă firesc construcția lui ἀρέσκω cu dativul și păstrează sensul simplu de a produce plăcere, fără amplificare.
- source_word: Ἡρῴδου / Ἡρῴδῃ
  choice: Irod
  rationale: Este forma consacrată în limba română pentru acest nume biblic.
