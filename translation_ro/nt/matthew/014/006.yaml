base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/006.yaml
  text: But when Herod’s birthday came[a], the daughter of Herodias danced in the midst and pleased Herod[b],
translation:
  language: ro
  text: Dar când s-a sărbătorit ziua de naștere a lui Irod[a], fiica Irodiadei a dansat în mijloc[b] și i-a plăcut lui Irod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „când a venit ziua de naștere a lui Irod” ori „la ospățul dat de ziua de naștere a lui Irod”. Expresia grecească se referă la prilejul sărbătoririi zilei sale de naștere.'
    reason: lexical_alternative
  - marker: b
