  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: ro
  text: 'Când s-a făcut seară, ucenicii au venit la el și i-au spus: „Locul este pustiu, iar este deja târziu[a]. Trimite mulțimile să plece, ca să se ducă în sate și să-și cumpere de mâncare.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: „ora a trecut deja”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: Când s-a făcut seară
  rationale: Construcția la genitiv absolut marchează trecerea temporală; formularea este firească în narațiunea românească și redă sensul fără a introduce un «acum» absent din text.
- source_word: προσῆλθον αὐτῷ
  choice: au venit la el
  rationale: Redă direct sensul obișnuit al lui προσέρχομαι în context; «s-au apropiat de el» ar fi de asemenea posibil, dar ar accentua mișcarea fizică.
- source_word: οἱ μαθηταὶ
  choice: ucenicii
  rationale: Articolul indică grupul deja cunoscut; nu este necesară adăugarea posesivului «lui».
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: Locul este pustiu
  rationale: ἔρημος descrie aici un loc nelocuit sau depărtat de așezări; «pustiu» este concis și natural, fără a impune ideea unui deșert.
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: timpul a trecut deja
  rationale: Păstrează mai îndeaproape formularea greacă și tensiunea expresiei, care poate indica faptul că ora potrivită a trecut; redarea idiomatică «este deja târziu» este menționată în notă.
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: Dă drumul mulțimilor
  rationale: În context, ἀπολύω înseamnă a lăsa sau a trimite oamenii să plece. Expresia românească păstrează imperativul și nu adaugă destinația «acasă».
- source_word: ἵνα ἀπελθόντες εἰς τὰς κώμας
  choice: ca să se ducă în sate
  rationale: Redă natural scopul exprimat prin ἵνα și participiul de mișcare, păstrând pluralul «sate» fără a adăuga «din apropiere».
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: să-și cumpere de mâncare
  rationale: Formularea românească este naturală și păstrează atât ideea cumpărării hranei, cât și valoarea reflexivă a lui ἑαυτοῖς.
