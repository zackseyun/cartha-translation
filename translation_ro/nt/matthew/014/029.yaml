id: MAT.14.29
reference: Matthew 14:29
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἐλθέ. καὶ καταβὰς ἀπὸ τοῦ ⸀πλοίου Πέτρος περιεπάτησεν ἐπὶ τὰ ὕδατα ⸂καὶ ἦλθεν⸃ πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/029.yaml
  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: ro
  text: 'El a zis: „Vino!” Petru a coborât din barcă, a mers pe apă și a venit spre Isus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „și a venit la Isus”. Expresia grecească poate fi redată astfel, însă subliniază mișcarea în direcția lui Isus.'
    reason: alternativă de traducere
lexical_decisions:
- source_word: Ἐλθέ
  choice: Vino!
  rationale: Imperativul aorist exprimă o chemare directă; forma românească este concisă, firească și păstrează forța poruncii.
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: a coborât din barcă
  rationale: Participiul indică acțiunea anterioară mersului pe apă. Redarea prin verb la indicativ este naturală în narațiunea românească și păstrează succesiunea acțiunilor.
- source_word: πλοίου
  choice: barcă
  rationale: În contextul galileean, „barcă” este echivalentul modern și contextual potrivit pentru πλοῖον.
- source_word: περιεπάτησεν
  choice: a mers
  rationale: Verbul descrie simplu mersul lui Petru; „a mers” este mai natural în româna actuală decât formularea tradițională „a umblat” și nu adaugă ideea că doar a început să meargă.
- source_word: ἐπὶ τὰ ὕδατα
  choice: pe apă
  rationale: Construcția indică deplasarea pe suprafața apei. Singularul colectiv „apă” este idiomatic în română.
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: și a venit spre Isus
  rationale: Prepoziția πρός exprimă orientarea mișcării către Isus, fără să afirme neapărat că Petru a ajuns la el.
- source_word: δὲ
  choice: El a zis
  rationale: δέ este aici un conector narativ slab; în română nu este necesară redarea lui printr-o conjuncție explicită, iar formularea păstrează cursivitatea.
theological_decisions:
- issue: Descrierea deplasării lui Petru către Isus
  choice: și a venit spre Isus
  alternative: și a venit la Isus
  rationale: Formularea cu „spre” păstrează sensul direcțional al lui πρός și tensiunea narațiunii, fără a afirma mai mult decât textul despre atingerea destinației.
translation_notes:
  register: Română standard modernă, cu frazare simplă și demnă. „A mers pe apă” este preferat formei mai arhaice „a umblat pe apă”, iar „spre Isus” păstrează nuanța direcțională a textului grec.
