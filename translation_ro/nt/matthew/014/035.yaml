id: MAT.14.35
reference: Matthew 14:35
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἐπιγνόντες αὐτὸν οἱ ἄνδρες τοῦ τόπου ἐκείνου ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην, καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/035.yaml
  text: And when the men of that place recognized him[a], they sent into that whole surrounding region and brought to him all who were sick[b],
translation:
  language: ro
  text: După ce bărbații din locul acela l-au recunoscut, au trimis în toată regiunea din împrejurimi[a] și i-au adus pe toți cei bolnavi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, „au trimis în toată regiunea din împrejurimi”; greaca nu precizează ce au trimis. Sensul poate fi că au trimis veste sau mesageri.
    reason: lexical_alternative
  - marker: b
    text: Literal, „pe toți cei care o duceau rău”, o expresie idiomatică pentru cei bolnavi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: l-au recunoscut
  rationale: Participiul aorist indică aici identificarea lui Isus de către localnici; formularea este firească și precisă în context.
- source_word: οἱ ἄνδρες τοῦ τόπου ἐκείνου
  choice: oamenii din locul acela
  rationale: Deși ἄνδρες poate însemna literal «bărbații», în context desemnează localnicii care l-au recunoscut și au răspândit vestea; «oamenii» este idiomatic în română fără a schimba referentul colectiv.
- source_word: ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην
  choice: au trimis veste în toată regiunea înconjurătoare
  rationale: Verbul înseamnă «au trimis», iar obiectul nu este exprimat în greacă. «Veste» explicitează minimal acțiunea comunicativă presupusă de context; nota păstrează construcția literală și ambiguitatea obiectului implicit.
- source_word: προσήνεγκαν αὐτῷ
  choice: i-au adus
  rationale: În acest context, προσφέρω descrie aducerea bolnavilor la Isus, nu o oferire cultică.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: pe toți cei bolnavi
  rationale: Expresia idiomatică κακῶς ἔχειν înseamnă a fi bolnav sau a se simți rău; redarea este clară și naturală.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. «Regiunea înconjurătoare» păstrează sensul lui περίχωρος, iar explicitarea «veste» este semnalată în nota de subsol.
