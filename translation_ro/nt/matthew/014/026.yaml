id: MAT.14.26
reference: Matthew 14:26
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ⸂οἱ δὲ μαθηταὶ ἰδόντες αὐτὸν⸃ ἐπὶ ⸂τῆς θαλάσσης⸃ περιπατοῦντα ἐταράχθησαν λέγοντες ὅτι Φάντασμά ἐστιν, καὶ ἀπὸ τοῦ φόβου ἔκραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: ro
  text: 'Dar ucenicii, când l-au văzut umblând pe mare, s-au înspăimântat și au zis: „Este o fantomă[a]!” Și au strigat de frică.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „o apariție” ori „o nălucă”.
    reason: Alternativă lexicală pentru φάντασμα, care poate desemna o apariție sau o formă fantomatică.
lexical_decisions:
- source_word: δὲ
  choice: Dar
  rationale: Marchează o ușoară opoziție sau o nouă evoluție narativă, aici reacția înfricoșată a ucenicilor.
- source_word: μαθηταὶ
  choice: ucenicii
  rationale: Articolul hotărât identifică grupul cunoscut din context; formularea este firească și clară în româna actuală.
- source_word: ἰδόντες αὐτὸν
  choice: când l-au văzut
  rationale: Redă participiul aorist printr-o propoziție temporală naturală și păstrează succesiunea acțiunilor.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: umblând pe mare
  rationale: Păstrează imaginea greacă a deplasării pe suprafața mării; „a umbla” are un registru narativ demn și inteligibil.
- source_word: ἐταράχθησαν
  choice: s-au înspăimântat
  rationale: În contextul apariției neașteptate, al concluziei ucenicilor și al strigătului lor, exprimă intensitatea tulburării provocate de frică.
- source_word: λέγοντες
  choice: și au zis
  rationale: Transformă participiul concomitent într-o coordonare firească în română, fără a modifica raportul narativ.
- source_word: Φάντασμά ἐστιν
  choice: Este o nălucă!
  rationale: „Nălucă” redă o apariție percepută ca supranaturală și înfricoșătoare, fără a transforma exclamația greșită a ucenicilor într-o afirmație doctrinară despre spirite.
- source_word: ἀπὸ τοῦ φόβου
  choice: de frică
  rationale: Redă concis și idiomatic cauza sau sursa strigătului.
- source_word: ἔκραξαν
  choice: au strigat
  rationale: Exprimă un strigăt puternic fără a preciza mai mult decât spune verbul grec.
theological_decisions:
- issue: Natura lui φάντασμα în exclamația ucenicilor
  choice: „nălucă” în textul principal
  alternative: „apariție” sau „fantomă”
  rationale: Versetul relatează interpretarea înfricoșată a ucenicilor, nu formulează o afirmație ontologică despre existența sau natura spiritelor. Alegerea păstrează această distincție.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. Pronumele referitor la Isus nu este scris cu majusculă, deoarece această distincție reverențială nu este marcată în textul grec. Marcajul notei este așezat imediat după termenul explicat.
