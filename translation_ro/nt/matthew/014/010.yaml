  verdict: revise
  source_fidelity: 'Textul redă corect succesiunea: Irod a trimis, iar Ioan a fost decapitat în locul detenției. Totuși, „să i se taie capul lui Ioan” este mai puțin limpede, deoarece cliticul anticipativ „i” precedă referentul exprimat ulterior; formularea cu „să-l decapiteze pe Ioan” păstrează explicit obiectul și sensul specific al verbului grec.'
  naturalness: „Și a trimis să-l decapiteze pe Ioan în închisoare” este română standard, firească și potrivită registrului narativ. Evită construcția mai greoaie „să i se taie capul lui Ioan”.
  terminology: „A decapita” redă precis ἀποκεφαλίζω. Numele „Ioan” este păstrat fără adaos interpretativ. „În închisoare” este idiomatic și redă locul detenției.
