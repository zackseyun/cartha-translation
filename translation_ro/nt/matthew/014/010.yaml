  - severity: low
    issue: Nota afirmă că participiul aorist este redat prin „trimițând”.
    rationale: Pentru un participiu aorist anterior verbului principal, „după ce a trimis” redă mai exact raportul aspectual decât gerunziul „trimițând”, care poate sugera simultaneitate.
