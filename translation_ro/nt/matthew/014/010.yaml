  yaml_path: translation/nt/matthew/014/010.yaml
  text: And he sent and beheaded John in the prison[a].
translation:
  language: ro
  text: Și a trimis să-l decapiteze pe Ioan în închisoare.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mai formal: „Și, după ce a trimis, l-a decapitat pe Ioan în închisoare.” În greacă apare un participiu la aorist urmat de verbul principal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Și
  rationale: Păstrează coordonarea narativă simplă din greacă, fără a adăuga o nuanță temporală sau cauzală.
- source_word: πέμψας
  choice: a trimis să
  rationale: Participiul aorist indică trimiterea unor oameni pentru executarea acțiunii. Formularea românească este firească și arată mijlocirea, fără a transforma explicit textul în «a poruncit».
- source_word: ἀπεκεφάλισεν
  choice: i se taie capul
  rationale: Redă precis sensul lui ἀποκεφαλίζω și, împreună cu «a trimis să», păstrează atribuirea faptei lui Irod prin agenții trimiși.
- source_word: τὸν Ἰωάννην
  choice: lui Ioan
  rationale: Redă numele propriu fără adaosul «Botezătorul», care nu apare în acest verset.
- source_word: ἐν τῇ φυλακῇ
  choice: în închisoare
  rationale: Redă locul concret al detenției într-o formulare românească naturală; articolul grecesc nu trebuie reprodus mecanic prin «în închisoarea» fără un determinant.
theological_decisions:
- issue: Atribuirea execuției lui Irod, deși acțiunea este îndeplinită prin agenți
  choice: a trimis să i se taie capul
  alternative: l-a decapitat
  rationale: Greaca atribuie verbul principal subiectului, dar participiul πέμψας sugerează clar mijlocirea unor trimiși. Formularea aleasă păstrează ambele aspecte fără a adăuga explicit ideea unei porunci.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. «A trimis să i se taie capul» este mai firesc decât o reproducere rigidă a construcției grecești și păstrează faptul că Irod a făcut aceasta prin oameni trimiși.
