  text: οἱ δὲ λέγουσιν αὐτῷ· Οὐκ ἔχομεν ὧδε εἰ μὴ πέντε ἄρτους καὶ δύο ἰχθύας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/017.yaml
  text: But they said to him[a], “We have nothing here except five loaves and two fish.”
translation:
  language: ro
  text: 'Dar ei i-au spus: „Nu avem aici decât cinci pâini și doi pești.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Dar ei
  rationale: Articolul substantivizat îi reia pe ucenici, iar δέ introduce un contrast ușor cu porunca anterioară a lui Isus; „Dar ei” este firesc și clar în română.
- source_word: λέγουσιν αὐτῷ
  choice: i-au spus
  rationale: Prezentul istoric grecesc este redat prin perfectul compus, timpul obișnuit al narațiunii românești, fără schimbarea funcției replicii.
- source_word: Οὐκ ἔχομεν ὧδε εἰ μὴ
  choice: Nu avem aici decât
  rationale: 'După negație, εἰ μή are sens exceptiv. Construcția românească „nu... decât” reproduce fidel și natural sensul: singurele provizii disponibile aici sunt cele enumerate.'
- source_word: πέντε ἄρτους
  choice: cinci pâini
  rationale: ἄρτος desemnează aici pâini numărabile; „cinci pâini” este formularea românească firească și potrivită contextului hrănirii mulțimii.
- source_word: δύο ἰχθύας
  choice: doi pești
  rationale: ἰχθύς înseamnă „pește”, iar pluralul românesc firesc în acest context este „doi pești”.
theological_decisions: []
translation_notes:
  register: Formulare modernă, clară și demnă. Pronumele referitor la Isus este scris cu literă mică, potrivit normelor ortografice curente și fără a introduce o convenție confesională. Nu este necesară o notă lexicală, deoarece „Nu avem aici decât” păstrează direct și idiomatic structura exceptivă a grecei.
