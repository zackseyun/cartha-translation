lexical_decisions:
- source_word: διαπεράσαντες
  choice: După ce au traversat
  rationale: Participiul aorist exprimă o acțiune anterioară verbului principal; formularea românească redă firesc succesiunea și păstrează ideea traversării fără a preciza explicit mijlocul.
- source_word: ἦλθον
  choice: au ajuns
  rationale: În contextul unei destinații atinse după traversare, „au ajuns” este mai firesc în română decât literalul „au venit” și redă bine sensul lui ἔρχομαι.
- source_word: ἐπὶ τὴν γῆν
  choice: la țărm
  rationale: Literal, expresia înseamnă „pe uscat/pământ”; în contextul traversării lacului, „la țărm” exprimă natural sosirea dinspre apă, fără a schimba referentul contextual.
- source_word: εἰς Γεννησαρέτ
  choice: în ținutul Ghenezaret
  rationale: Prepoziția εἰς indică destinația, iar alăturarea cu ἐπὶ τὴν γῆν sugerează sosirea la uscat în regiunea numită Ghenezaret.
- source_word: Γεννησαρέτ
  choice: Ghenezaret
  rationale: Se folosește forma românească biblică consacrată a toponimului.
