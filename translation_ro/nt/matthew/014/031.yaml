id: MAT.14.31
reference: Matthew 14:31
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: εὐθέως δὲ ὁ Ἰησοῦς ἐκτείνας τὴν χεῖρα ἐπελάβετο αὐτοῦ καὶ λέγει αὐτῷ· Ὀλιγόπιστε, εἰς τί ἐδίστασας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: ro
  text: 'Îndată, Isus Și-a întins mâna, l-a apucat și i-a zis: „Puțin credinciosule, de ce te-ai îndoit[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „ai șovăit?”. Verbul grecesc poate desemna ezitarea sau șovăirea, precum și îndoiala.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Îndată
  rationale: Redă concis acțiunea imediată și păstrează ritmul alert al narațiunii.
- source_word: δὲ
  choice: —
  rationale: Conectorul continuativ ușor contrastiv nu necesită o redare separată în română; succesiunea este limpede fără „dar” sau „și”.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: Și-a întins mâna
  rationale: Redare românească naturală a participiului circumstanțial, păstrând imaginea concretă și succesiunea acțiunilor.
- source_word: ἐπελάβετο αὐτοῦ
  choice: l-a apucat
  rationale: Exprimă precis faptul că Isus l-a prins și l-a ținut, fără a adăuga detalii absente din text.
- source_word: λέγει αὐτῷ
  choice: i-a zis
  rationale: Prezentul istoric grecesc este redat prin perfect compus, timpul narativ firesc în româna modernă.
- source_word: Ὀλιγόπιστε
  choice: Puțin credinciosule
  rationale: Păstrează adresarea directă și ideea unei credințe insuficiente, fără a sugera absența totală a credinței.
- source_word: εἰς τί
  choice: de ce
  rationale: Echivalentul idiomatic și exact al întrebării privind motivul.
- source_word: ἐδίστασας
  choice: te-ai îndoit
  rationale: Redarea cea mai clară în context; verbul poate exprima și ezitare sau șovăire, nu doar îndoială intelectuală.
theological_decisions:
- issue: Redarea vocativului Ὀλιγόπιστε în raport cu πίστις
  choice: Puțin credinciosule
  alternative: Om cu puțină credință
  rationale: Păstrează legătura lexicală cu „credința” și caracterul direct al mustrării, fără a transforma credința slabă în necredință totală.
- issue: Nuanța verbului ἐδίστασας
  choice: te-ai îndoit
  alternative: ai șovăit
  rationale: Textul principal folosește formularea românească familiară, iar nota păstrează deschisă nuanța de ezitare sau șovăire prezentă în verbul grec.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Formele pronominale referitoare la Isus sunt scrise cu majusculă conform unei convenții românești răspândite, fără a modifica sensul sursei.
