source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, εἰ σὺ εἶ, κέλευσόν με ⸂ἐλθεῖν πρὸς σὲ⸃ ἐπὶ τὰ ὕδατα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/028.yaml
  text: And Peter answered him[a], “Lord, if it is you, command me to come to you on the waters.”
translation:
  language: ro
  text: 'Iar Petru i-a răspuns: „Doamne, dacă ești tu, poruncește-mi să vin la tine pe ape[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau „pe apă”. În greacă apare pluralul: „pe ape”.'
    reason: 'Alternativă lexicală: româna preferă adesea singularul colectiv „apă”, însă textul grecesc folosește pluralul.'
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ αὐτῷ ὁ Πέτρος εἶπεν
  choice: Iar Petru i-a răspuns
  rationale: Formula narativă este redată firesc în română; „iar” păstrează legătura discursivă exprimată de δέ, iar pronumele datival „i-” redă pe αὐτῷ fără rigiditate.
- source_word: Κύριε
  choice: Doamne
  rationale: Vocativul românesc consacrat păstrează atât respectul adresării, cât și posibila greutate cristologică a termenului κύριος.
- source_word: εἰ σὺ εἶ
  choice: dacă ești tu
  rationale: Formularea redă identificarea persoanei și păstrează accentul pronumelui explicit σὺ, fără a adăuga un predicat absent din greacă.
- source_word: κέλευσόν με
  choice: poruncește-mi
  rationale: Verbul κελεύω exprimă o dispoziție autoritativă; „poruncește-mi” este clar și actual.
- source_word: ἐλθεῖν πρὸς σὲ
  choice: să vin la tine
  rationale: Mișcarea este orientată spre Isus; din perspectiva vorbitorului, româna cere firesc „să vin la tine”.
- source_word: ἐπὶ τὰ ὕδατα
  choice: pe ape
  rationale: Redarea păstrează pluralul grecesc τὰ ὕδατα și imaginea vie a scenei; varianta românească mai idiomatică „pe apă” este indicată în notă.
theological_decisions:
- issue: Forța adresării κύριε către Isus
  choice: Doamne
  alternative: Stăpâne / Domnule
  rationale: „Doamne” nu reduce adresarea la simplă politețe și păstrează deschisă greutatea cristologică posibilă în Evanghelia după Matei, fără a o explica în exces.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Pronumele referitoare la Isus sunt scrise cu literă mică, potrivit uzului ortografic curent și fără a introduce prin capitalizare o interpretare absentă din textul grec.
