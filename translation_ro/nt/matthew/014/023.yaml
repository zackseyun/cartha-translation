  terminology: '„Mulțimile”, „s-a urcat pe munte”, „ca să se roage”, „Când s-a făcut seară” și „era singur acolo” sunt potrivite. Nu sunt necesare note de subsol în română: „de unul singur” redă adecvat κατ’ ἰδίαν, iar repetarea ideii de solitudine în propoziția următoare este intenționată în textul-sursă.'
