source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος κατ’ ἰδίαν προσεύξασθαι. ὀψίας δὲ γενομένης μόνος ἦν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/023.yaml
  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: ro
  text: După ce a trimis mulțimile, s-a urcat pe munte, de unul singur, ca să se roage. Când s-a făcut seară, era singur acolo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολύσας τοὺς ὄχλους
  choice: După ce a dat drumul mulțimilor
  rationale: Participiul aorist exprimă aici o acțiune anterioară verbului principal. „A dat drumul” redă firesc trimiterea oamenilor acasă, iar pluralul „mulțimilor” păstrează forma greacă.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: s-a urcat pe munte
  rationale: Redă direct mișcarea ascendentă spre zona muntelui, într-o formulare românească naturală.
- source_word: κατ’ ἰδίαν
  choice: de unul singur
  rationale: Expresia indică retragerea separată de ceilalți, în particular; formularea aleasă se potrivește contextului și evită confundarea cu μόνος din propoziția următoare.
- source_word: προσεύξασθαι
  choice: ca să se roage
  rationale: Infinitivul exprimă scopul urcării; construcția finală cu „ca să” este firească în româna modernă.
- source_word: ὀψίας δὲ γενομένης
  choice: Când s-a făcut seară
  rationale: Genitivul absolut introduce cadrul temporal; formularea este clară, curentă și păstrează tranziția narativă.
- source_word: μόνος ἦν ἐκεῖ
  choice: era singur acolo
  rationale: Păstrează accentul explicit asupra singurătății și adverbul de loc, fără adaos interpretativ.
theological_decisions:
- issue: Subiectul implicit al verbelor
  choice: Isus este numit explicit o dată
  alternative: 'Păstrarea exclusivă a pronumelui implicit: „s-a urcat”'
  rationale: Greaca permite identificarea subiectului din context. Introducerea numelui „Isus” în română previne o posibilă ambiguitate după referirea la mulțimi, fără a adăuga o interpretare teologică.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. S-a evitat atât formularea livrescă „a slobozit mulțimile”, cât și una prea colocvială. Repetiția semantică dintre κατ’ ἰδίαν și μόνος este păstrată prin „de unul singur” și „singur”.
