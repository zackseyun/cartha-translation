  naturalness: '„Iar ei” este redundant după „Toți”, iar secvența „au strâns bucățile rămase: douăsprezece coșuri pline” este mai puțin firească în româna narativă modernă. O formulare cu „au strâns douăsprezece coșuri pline cu...” este directă și limpede.'
