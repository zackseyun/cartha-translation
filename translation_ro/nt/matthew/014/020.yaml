base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/020.yaml
  text: And they all ate and were satisfied[a], and they picked up twelve full baskets of the leftover pieces.
translation:
  language: ro
  text: Toți au mâncat și s-au săturat, iar ei au strâns douăsprezece coșuri pline cu bucățile rămase[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „fragmentele”. Termenul grec se poate referi la bucăți frânte rămase după masă.'
    reason: Oferă alternativa lexicală pentru κλασμάτων și explică neutru sensul în context, fără a adăuga un obiect neprecizat de text.
lexical_decisions:
- source_word: ἔφαγον
  choice: au mâncat
  rationale: Aoristul indicativ este redat firesc prin perfectul compus, timpul obișnuit al narațiunii românești moderne.
- source_word: πάντες
  choice: toți
  rationale: Păstrează explicit caracterul universal al afirmației despre mulțime.
- source_word: ἐχορτάσθησαν
  choice: s-au săturat
  rationale: Redă idiomatic faptul că au mâncat pe deplin, fără a adăuga o interpretare teologică.
- source_word: ἦραν
  choice: au strâns
  rationale: În contextul adunării resturilor, „au strâns” exprimă natural sensul contextual al verbului αἴρω.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: bucățile rămase
  rationale: Formulare românească fluentă pentru ceea ce a rămas din bucățile frânte; detaliul lexical este păstrat în nota de subsol.
- source_word: δώδεκα κοφίνους πλήρεις
  choice: douăsprezece coșuri pline
  rationale: Redare directă, clară și naturală a numărului, recipientelor și stării lor.
theological_decisions:
- issue: Descrierea rezultatului hrănirii miraculoase prin limbajul obișnuit al sațietății
  choice: s-au săturat
  alternative: au fost săturați / s-au umplut
  rationale: „S-au săturat” păstrează sensul simplu al unei hrăniri depline, fără a minimaliza minunea și fără a introduce limbaj interpretativ suplimentar.
translation_notes:
  register: Română standard modernă, clară și demnă. Construcția este concisă, cu o topică firească pentru narațiune; două puncte prezintă rezultatul concret al strângerii.
