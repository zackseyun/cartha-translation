  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐμβλέψας δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Παρὰ ἀνθρώποις τοῦτο ἀδύνατόν ἐστιν, παρὰ δὲ θεῷ πάντα δυνατά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/026.yaml
  text: But Jesus looked at them and said to them[a], “With men this is impossible, but with God all things are possible.”
translation:
  language: ro
  text: 'Isus S-a uitat la ei și le-a spus: „Pentru oameni, lucrul acesta este imposibil, dar pentru Dumnezeu toate sunt posibile.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: S-a uitat la ei
  rationale: Redă participiul aorist ca acțiune anterioară verbului principal și păstrează orientarea privirii spre ucenici, fără intensificarea nejustificată «i-a privit țintă».
- source_word: δὲ
  choice: și
  rationale: δέ poate marca aici o continuare narativă ușor contrastivă; în română, «și» asigură o legătură firească, în timp ce opoziția esențială este exprimată explicit în cuvintele lui Isus prin «dar».
- source_word: εἶπεν αὐτοῖς
  choice: le-a spus
  rationale: Pronumele clitic «le» păstrează dativul explicit αὐτοῖς într-o formulare românească naturală.
- source_word: παρὰ ἀνθρώποις
  choice: Pentru oameni
  rationale: παρά cu dativul exprimă sfera sau cazul de referință. «Pentru oameni» este idiomatic și redă clar referirea generică la ființele omenești, fără ambiguitatea modernă a lui «bărbați».
- source_word: τοῦτο
  choice: lucrul acesta
  rationale: Face explicit referentul demonstrativ într-o formulare românească firească și trimite la posibilitatea discutată în context.
- source_word: ἀδύνατόν ἐστιν
  choice: este imposibil
  rationale: Echivalent direct și idiomatic al adjectivului predicativ împreună cu copula.
- source_word: παρὰ δὲ θεῷ
  choice: dar pentru Dumnezeu
  rationale: Repetarea lui «pentru» păstrează paralelismul cu prima propoziție, iar «dar» redă contrastul marcat de δέ.
- source_word: πάντα δυνατά
  choice: toate sunt posibile
  rationale: Păstrează pluralul neutru πάντα și caracterul general al afirmației într-o română limpede și solemnă.
theological_decisions:
- issue: Sensul generic al lui ἀνθρώποις
  choice: oameni
  alternative: ființe omenești / bărbați
  rationale: Termenul grecesc se referă aici la omenire în general, în contrast cu Dumnezeu. «Oameni» este inclusiv în româna standard și nu restrânge nejustificat sensul la persoane de sex masculin.
- issue: Domeniul afirmației «toate sunt posibile»
  choice: Păstrarea formulării generale fără adaos explicativ
  alternative: «Dumnezeu poate face orice» sau o limitare explicită la mântuirea discutată în context
  rationale: Textul grec are o formulare generală și pregnantă în contextul imediat. Traducerea nu introduce nici o absolutizare filozofică suplimentară, nici o limitare absentă din verset.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formularea păstrează paralelismul dintre oameni și Dumnezeu, evitând atât arhaismul «la oameni», cât și o exprimare prea tehnică precum «din punct de vedere omenesc».
