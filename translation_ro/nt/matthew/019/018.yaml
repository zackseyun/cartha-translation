  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ποίας; ὁ δὲ Ἰησοῦς ⸀εἶπεν· Τὸ Οὐ φονεύσεις, Οὐ μοιχεύσεις, Οὐ κλέψεις, Οὐ ψευδομαρτυρήσεις,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/018.yaml
  text: 'He says to him, “Which ones?” And Jesus said, “The: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness,”'
translation:
  language: ro
  text: 'El i-a zis: „Care?” Isus i-a spus: „Acestea: Să nu ucizi; să nu comiți adulter; să nu furi; să nu depui mărturie mincinoasă,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποίας
  choice: Care?
  rationale: Pronumele interogativ feminin plural se raportează implicit la poruncile menționate în context; forma concisă păstrează elipsa greacă și este firească în română.
- source_word: Τὸ
  choice: 'Acestea:'
  rationale: Articolul neutru singular substantivizează citatul care urmează și îl introduce ca răspuns la întrebarea despre porunci; «Acestea:» redă funcția discursivă fără nefirescul unui articol izolat în română.
- source_word: Οὐ φονεύσεις
  choice: Să nu ucizi
  rationale: Redare consacrată și exactă a interdicției; φονεύω desemnează uciderea unei persoane, nu orice act de omorâre.
- source_word: Οὐ μοιχεύσεις
  choice: să nu comiți adulter
  rationale: Redă clar și în registru demn sensul juridic și moral al lui μοιχεύω.
- source_word: Οὐ κλέψεις
  choice: să nu furi
  rationale: Echivalentul direct, natural și neechivoc al verbului κλέπτω.
- source_word: Οὐ ψευδομαρτυρήσεις
  choice: să nu depui mărturie mincinoasă
  rationale: Păstrează componenta explicită de mărturie a verbului compus ψευδομαρτυρέω și registrul juridic al poruncii.
theological_decisions:
- issue: Forța lui φονεύσεις în porunca citată
  choice: Să nu ucizi
  alternative: Să nu omori
  rationale: «A ucide» exprimă precis luarea vieții unei persoane și evită lărgirea poruncii la orice omorâre, fără a introduce o calificare interpretativă precum «pe nedrept».
- issue: Articolul Τὸ înaintea listei
  choice: 'Acestea:'
  alternative: omiterea lui în traducere
  rationale: Textul sursă conține un element introductiv marcat; redarea lui păstrează accentul asupra poruncilor enumerate, dar într-o construcție românească naturală.
translation_notes:
  register: Română standard modernă, clară și demnă. Dialogul rămâne concis, iar poruncile sunt formulate în registrul familiar textelor biblice, fără arhaisme. Virgula finală indică faptul că enumerarea continuă în versetul următor.
