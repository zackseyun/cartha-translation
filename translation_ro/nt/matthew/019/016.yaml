  text: Καὶ ἰδοὺ εἷς προσελθὼν ⸂αὐτῷ εἶπεν⸃· ⸀Διδάσκαλε, τί ἀγαθὸν ποιήσω ἵνα ⸀σχῶ ζωὴν αἰώνιον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/016.yaml
  text: And behold[a], one who had come up to him said, “Teacher, what good thing must I do so that I may have eternal life?”
translation:
  language: ro
  text: 'Și iată, unul s-a apropiat de el și i-a zis: „Învățătorule, ce lucru bun[a] să fac ca să am viața veșnică?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „ce faptă bună să fac...?” Expresia grecească τί ἀγαθὸν poate însemna „ce lucru bun” sau, împreună cu verbul „a face”, poate desemna „ce faptă bună”.'
    reason: alternativă lexicală
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Și iată
  rationale: Păstrează atât legătura narativă exprimată prin καί, cât și funcția de atragere a atenției a lui ἰδού, într-o formulare românească demnă și ușor de înțeles.
- source_word: εἷς
  choice: unul
  rationale: Redă literal numeralul substantivizat fără a introduce prematur precizarea „un bărbat” sau informații din contextul ulterior și din pasajele paralele.
- source_word: προσελθὼν αὐτῷ εἶπεν
  choice: s-a apropiat de el și a zis
  rationale: 'Transformarea participiului aorist într-o succesiune verbală coordonată este firească în română și păstrează ordinea evenimentelor: apropierea precedă vorbirea.'
- source_word: Διδάσκαλε
  choice: Învățătorule
  rationale: Este echivalentul românesc consacrat și direct pentru titlul de profesor sau instructor.
- source_word: τί ἀγαθὸν
  choice: ce lucru bun
  rationale: Păstrează formularea deschisă a neutrului singular ἀγαθόν; în asociere cu „să fac”, poate desemna implicit o faptă bună, fără a fixa interpretarea în text.
- source_word: ποιήσω
  choice: să fac
  rationale: Subjonctivul deliberativ se redă natural în română prin „să fac”, exprimând întrebarea practică fără a adăuga ideea explicită de obligație prin „trebuie”.
- source_word: ἵνα σχῶ
  choice: ca să am
  rationale: Redă limpede relația de scop exprimată de ἵνα și sensul direct al lui ἔχω, „a avea”.
- source_word: ζωὴν αἰώνιον
  choice: viață veșnică
  rationale: Formulare românească consacrată, naturală și fidelă sensului expresiei în acest context.
theological_decisions:
- issue: Identitatea persoanei care se apropie
  choice: unul
  alternative: un om; un tânăr bogat
  rationale: Versetul folosește numai εἷς, „unul”. Traducerea nu introduce înainte de vreme detalii provenite din contextul ulterior sau din relatările paralele.
- issue: Raportul dintre acțiunea bună și viața veșnică în întrebare
  choice: ce lucru bun să fac ca să am viață veșnică?
  alternative: ce faptă bună trebuie să fac pentru a dobândi viața veșnică?
  rationale: Formularea păstrează orientarea spre acțiune a întrebării și relația de scop, fără a soluționa prin traducere tensiunea teologică privind faptele, meritul ori mântuirea.
translation_notes:
  register: Română standard modernă, cu ton narativ demn. „Și iată” și „Învățătorule” păstrează coloratura biblică fără arhaizare excesivă; construcția verbală coordonată este mai firească în română decât reproducerea rigidă a participiului grecesc.
