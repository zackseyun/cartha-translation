  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Οὐκ ἀνέγνωτε ὅτι ὁ ⸀κτίσας ἀπ’ ἀρχῆς ἄρσεν καὶ θῆλυ ἐποίησεν αὐτοὺς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/004.yaml
  text: He answered, “Have you not read that from the beginning the one who created them made them male and female?”
translation:
  language: ro
  text: 'El le-a răspuns: „N-ați citit că Cel care i-a creat de la început i-a făcut parte bărbătească și parte femeiască?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: El le-a răspuns
  rationale: Construcția cu participiu și verb finit este redată firesc în română printr-un singur verb; pronumele indirect explicitează natural destinatarii deja prezenți în context.
- source_word: Οὐκ ἀνέγνωτε
  choice: N-ați citit
  rationale: Întrebarea retorică îi confruntă pe ascultători cu propria cunoaștere a Scripturii; perfectul compus este forma idiomatică în româna actuală.
- source_word: ὁ κτίσας
  choice: Cel care i-a creat
  rationale: Păstrează forma participială substantivizată fără a o transforma în titlul interpretativ „Creatorul”.
- source_word: ἀπ’ ἀρχῆς
  choice: de la început
  rationale: Redarea firească păstrează ecoul relatării creației și, prin poziționare, asocierea expresiei cu actul creator.
- source_word: ἄρσεν καὶ θῆλυ
  choice: parte bărbătească și parte femeiască
  rationale: Formularea consacrată și demnă redă perechea sexuată din greacă și ecoul direct al Genezei, fără a o reformula ca „bărbat și femeie”.
- source_word: ἐποίησεν αὐτούς
  choice: i-a făcut
  rationale: Păstrează deosebirea lexicală dintre κτίζω, „a crea”, și ποιέω, „a face”, evitând repetarea.
theological_decisions:
- issue: Redarea afirmației despre creație în raport cu Geneza 1:27
  choice: parte bărbătească și parte femeiască
  alternative: bărbat și femeie
  rationale: Textul citează perechea creațională în termeni de sex, iar formularea aleasă păstrează atât sensul grecesc, cât și ecoul Genezei, fără concluzii doctrinare adăugate.
- issue: Legătura sintactică a expresiei ἀπ’ ἀρχῆς
  choice: Cel care i-a creat de la început
  alternative: de la început, Cel care i-a creat
  rationale: Ordinea aleasă indică mai limpede că expresia se leagă de actul creației, păstrând totodată o română naturală.
translation_notes:
  register: Română standard modernă, clară și solemnă. Contracția „N-ați” este firească în vorbirea directă, iar „Cel” semnalează natural referirea la Dumnezeu fără a introduce explicit titlul „Creatorul”.
