- from: 'Ei i-au zis: „Atunci de ce a poruncit Moise să-i dea un act de divorț și s-o alunge[a]?”'
  to: 'I-au spus: „Atunci de ce a poruncit Moise să-i dea un certificat de divorț și s-o lase[a]?”'
  rationale: Revizuirea înlocuiește termenul prea dur și potențial înșelător „s-o alunge” cu „s-o lase”, păstrând ambiguitatea lexicală a originalului și explicând în notă sensul de divorț cerut de context. De asemenea, „I-au spus” oferă un registru narativ modern standard, iar „certificat de divorț” exprimă limpede natura documentului.
