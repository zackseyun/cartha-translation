source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Τί οὖν Μωϋσῆς ἐνετείλατο δοῦναι βιβλίον ἀποστασίου καὶ ἀπολῦσαι ⸀αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/007.yaml
  text: They said to him[a], “Why then did Moses command to give a certificate of divorce and to send her away?”
translation:
  language: ro
  text: 'I-au spus: „Atunci de ce a poruncit Moise să-i dea un certificat de divorț și s-o lase[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „să divorțeze de ea”. Verbul grecesc poate însemna „a lăsa” sau „a trimite de la sine”; în acest context, el desemnează divorțul.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Ei i-au zis
  rationale: Prezentul istoric grecesc este redat prin perfect compus, firesc în narațiunea românească modernă.
- source_word: Τί οὖν
  choice: Atunci de ce
  rationale: În context, expresia introduce o obiecție la afirmația anterioară a lui Isus; formularea redă clar forța argumentativă.
- source_word: ἐνετείλατο
  choice: a poruncit
  rationale: Păstrează explicit formularea interlocutorilor, fără a anticipa precizarea lui Isus din versetul următor.
- source_word: δοῦναι βιβλίον ἀποστασίου
  choice: să-i dea un act de divorț
  rationale: Redă concis și modern documentul juridic de divorț la care se referă expresia grecească.
- source_word: καὶ ἀπολῦσαι αὐτήν
  choice: și s-o alunge
  rationale: Păstrează sensul concret de îndepărtare a soției, fără a ascunde faptul că, în acest context, verbul desemnează divorțul; alternativa juridică este indicată în notă.
theological_decisions:
- issue: Dacă formularea interlocutorilor trebuie armonizată anticipat cu precizarea lui Isus din versetul următor
  choice: a poruncit
  alternative: a îngăduit / a permis
  rationale: Textul grecesc folosește aici verbul „a porunci”. Traducerea păstrează tensiunea dintre afirmația interlocutorilor și răspunsul ulterior al lui Isus.
translation_notes:
  register: Română standard modernă, cu formulare directă și demnă. „Act de divorț” este preferat lui „carte de despărțire” pentru claritate actuală, iar „s-o alunge” păstrează imaginea concretă și ambiguitatea lexicală a verbului grecesc.
