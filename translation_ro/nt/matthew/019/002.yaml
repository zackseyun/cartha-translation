  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοί, καὶ ἐθεράπευσεν αὐτοὺς ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/002.yaml
  text: And large crowds followed him, and he healed them there.
translation:
  language: ro
  text: Și mulțimi mari l-au urmat, iar el i-a vindecat acolo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: l-au urmat
  rationale: Aoristul indicativ activ al lui ἀκολουθέω descrie aici acțiunea narativă concretă de a merge după Isus; formularea românească este firească și nu adaugă în mod necesar sensul tehnic de ucenicie.
- source_word: αὐτῷ
  choice: l-
  rationale: Pronumele la dativ este cerut în greacă de ἀκολουθέω; româna exprimă persoana urmată prin pronume personal în acuzativ.
- source_word: ὄχλοι πολλοί
  choice: mulțimi mari
  rationale: Sintagma înseamnă literal „multe mulțimi”; „mulțimi mari” redă idiomatic amploarea grupurilor de oameni în româna actuală.
- source_word: ἐθεράπευσεν
  choice: a vindecat
  rationale: În acest context de relatare evanghelică, θεραπεύω denumește vindecarea; „a vindecat” este echivalentul românesc direct și consacrat.
- source_word: αὐτούς
  choice: i-
  rationale: Pronumele acuzativ plural se referă la oamenii din mulțimi și este redat natural prin forma românească neaccentuată „i-”.
- source_word: ἐκεῖ
  choice: acolo
  rationale: Păstrează simpla referință locală a adverbului grec, fără explicitări suplimentare.
- source_word: καὶ ... καὶ
  choice: Și ... iar
  rationale: Primul καί continuă narațiunea, iar al doilea leagă următoarea acțiune având un subiect exprimat distinct în română. „Iar” asigură o curgere naturală fără a introduce opoziție teologică sau o relație cauzală.
