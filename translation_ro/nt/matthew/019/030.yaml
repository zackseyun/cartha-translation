  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/030.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: ro
  text: Dar mulți dintre cei dintâi vor fi cei din urmă[a], iar cei din urmă, cei dintâi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mai literal: „Dar mulți dintâi vor fi cei din urmă, iar cei din urmă, cei dintâi.” Greaca este deosebit de concisă și are forma unei zicale.'
    reason: alternativă lexicală și sintactică
lexical_decisions:
- source_word: πολλοὶ
  choice: mulți
  rationale: Adjectivul este folosit substantival și desemnează un grup larg, fără a-i preciza identitatea; „mulți” păstrează concizia originalului.
- source_word: δὲ
  choice: Dar
  rationale: Particula marchează aici un contrast moderat față de discuția precedentă despre răsplată și statut.
- source_word: ἔσονται
  choice: vor fi
  rationale: Viitorul verbului εἰμί este redat firesc în româna modernă prin „vor fi”.
- source_word: πρῶτοι
  choice: cei dintâi
  rationale: Termenul indică poziția sau rangul; „cei dintâi” păstrează opoziția proverbială și registrul demn.
- source_word: ἔσχατοι
  choice: cei din urmă
  rationale: Expresia redă direct contrastul de poziție cu „cei dintâi”, fără a-l restrânge la ideea de valoare sau mântuire.
- source_word: πρῶτοι ἔσχατοι
  choice: dintre cei dintâi vor fi cei din urmă
  rationale: Româna cere o legătură sintactică mai explicită după „mulți”; formularea clarifică predicația implicită fără a adăuga un sens nou.
- source_word: καὶ ἔσχατοι πρῶτοι
  choice: iar cei din urmă, cei dintâi
  rationale: Verbul subînțeles este omis în a doua parte, ca în greacă; virgula păstrează concizia și echilibrul proverbial.
theological_decisions:
- issue: Natura răsturnării exprimate de zicală
  choice: O afirmație generală despre inversarea poziției sau a rangului, fără precizarea domeniului exact.
  alternative: O afirmație specifică despre intrarea în Împărăție, despre răsplata ucenicilor sau despre răsturnarea socială.
  rationale: Versetul formulează aforistic inversarea, iar sfera ei exactă nu este definită în propoziție. Traducerea evită să impună o interpretare doctrinară mai îngustă decât permite textul.
translation_notes:
  register: Română standard modernă, cu ton demn și proverbial. „Cei dintâi / cei din urmă” este natural, ușor de înțeles și păstrează antiteza textului grec.
