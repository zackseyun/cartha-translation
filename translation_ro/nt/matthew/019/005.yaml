source:
  edition: SBLGNT
  text: καὶ εἶπεν· ⸀Ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ ⸀κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/005.yaml
  text: and said[a], ‘For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh.’
translation:
  language: ro
  text: 'și a spus: „De aceea, un bărbat își va lăsa tatăl și mama, se va uni[a] cu soția lui, iar cei doi vor deveni un singur trup.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „se va alipi de” ori „se va atașa de soția lui”. Verbul grecesc exprimă o legătură strânsă.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕνεκα τούτου
  choice: De aceea
  rationale: Redă firesc în româna actuală expresia cauzală/inferențială care introduce motivarea citatului scripturistic.
- source_word: καταλείψει
  choice: își va lăsa
  rationale: Viitorul păstrează forma afirmației citate, iar pronumele reflexiv posesiv este idiomatic în română în relație cu „tatăl și mama”.
- source_word: ἄνθρωπος
  choice: un bărbat
  rationale: În contextul explicit al unirii cu „soția lui”, substantivul desemnează partenerul masculin, nu omenirea în sens generic.
- source_word: κολληθήσεται
  choice: se va uni
  rationale: Redă atașarea strânsă exprimată de verb, într-o formulare românească naturală; nota păstrează alternativele mai concrete.
- source_word: γυναικὶ αὐτοῦ
  choice: cu soția lui
  rationale: În context matrimonial, γυνή are sensul precis de „soție”; prepoziția „cu” este cerută de construcția românească „a se uni cu”.
- source_word: οἱ δύο
  choice: cei doi
  rationale: Păstrează explicit numeralul articulat din greacă.
- source_word: εἰς σάρκα μίαν
  choice: vor deveni un singur trup
  rationale: „Vor deveni” exprimă rezultatul sau intrarea într-o nouă unire sugerată de ἔσονται εἰς, iar „un singur trup” păstrează idiomul relațional al citatului din Geneza.
theological_decisions:
- issue: Limbajul marcat de gen din citatul despre căsătorie
  choice: un bărbat ... soția lui
  alternative: o persoană ... soțul sau soția sa
  rationale: Contextul sursă formulează explicit perechea bărbat–soție; neutralizarea ar elimina o particularitate reală a textului.
- issue: Redarea idiomului unirii matrimoniale
  choice: cei doi vor deveni un singur trup
  alternative: cei doi vor fi un singur trup
  rationale: „Vor deveni” redă mai clar valoarea de rezultat a construcției ἔσονται ... εἰς, fără a explica suplimentar natura unirii.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Citatul păstrează paralelismul și concizia sursei, evitând atât arhaismele, cât și parafraza doctrinară.
