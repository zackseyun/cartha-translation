id: MAT.19.6
reference: Matthew 19:6
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ σὰρξ μία. ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/006.yaml
  text: So they are no longer two[a], but one flesh. Therefore, what God has joined together, man must not separate.
translation:
  language: ro
  text: Astfel, ei nu mai sunt doi, ci un singur trup. Așadar, ceea ce a unit Dumnezeu, omul[a] să nu despartă.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Aici, „omul” are sens generic: nicio ființă umană nu trebuie să despartă ceea ce a unit Dumnezeu.'
    reason: Clarificarea sensului generic al substantivului ἄνθρωπος.
lexical_decisions:
- source_word: ὥστε
  choice: Astfel
  rationale: Introduce rezultatul afirmației precedente despre cei doi care devin un singur trup și păstrează firesc valoarea consecutiv-inferențială.
- source_word: οὐκέτι εἰσὶν δύο
  choice: nu mai sunt doi
  rationale: Redare directă și idiomatică a negației temporale și a contrastului numeric.
- source_word: σὰρξ μία
  choice: un singur trup
  rationale: Păstrează formularea consacrată în română și legătura intertextuală cu relatarea creației din Geneza; «carne» ar suna nefiresc în acest context.
- source_word: ὃ οὖν
  choice: Așadar, ceea ce
  rationale: Pronumele neutru se referă la unirea realizată, iar «așadar» exprimă concluzia trasă de Isus.
- source_word: συνέζευξεν
  choice: a unit
  rationale: Exprimă clar acțiunea lui Dumnezeu de a-i lega pe cei doi într-o unitate; este natural în contextul căsătoriei.
- source_word: ἄνθρωπος
  choice: omul
  rationale: Păstrează substantivul singular din greacă și sensul său generic, referitor la orice ființă umană.
- source_word: μὴ χωριζέτω
  choice: să nu despartă
  rationale: Subjonctivul prohibitiv redă firesc în română imperativul prezent negativ din greacă.
theological_decisions:
- issue: Sensul generic al lui ἄνθρωπος în interdicția privitoare la căsătorie
  choice: «omul», cu sens generic
  alternative: «nimeni» sau «nicio persoană»
  rationale: «Omul» reflectă forma singulară a textului și poate avea în română sens reprezentativ pentru orice ființă umană; nota înlătură o posibilă interpretare restrictivă.
- issue: Ecoul limbajului despre căsătorie din Geneza în σὰρξ μία
  choice: «un singur trup»
  alternative: «o singură carne»
  rationale: Formularea păstrează ecoul biblic și ideea unirii conjugale fără a introduce explicații doctrinare suplimentare.
translation_notes:
  register: Română standard modernă, cu formulare demnă și accesibilă. «Un singur trup» păstrează idiomul biblic consacrat, iar «să nu despartă» redă natural forța interdicției.
