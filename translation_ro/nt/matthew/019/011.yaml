  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐ πάντες χωροῦσι τὸν λόγον ⸀τοῦτον ἀλλ’ οἷς δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/011.yaml
  text: But he said to them[a], “Not everyone can accept this word[b], but only those to whom it has been given.”
translation:
  language: ro
  text: 'Dar el le-a spus: „Nu toți pot accepta cuvântul acesta[a], ci numai cei cărora le-a fost dat[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „vorba aceasta”, „afirmația aceasta” ori „învățătura aceasta”.'
    reason: lexical_alternative
  - marker: b
    text: Cel care dă nu este numit în greacă; formularea poate sugera că Dumnezeu este cel care dă.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: le-a spus
  rationale: Redă firesc aoristul lui λέγω în introducerea replicii și păstrează destinatarul exprimat prin αὐτοῖς.
- source_word: Οὐ πάντες
  choice: Nu toți
  rationale: Păstrează direct negația universalului, într-o formulare românească naturală, fără a sugera că nimeni nu poate accepta.
- source_word: χωροῦσι
  choice: pot accepta
  rationale: În construcție cu λόγον, verbul are sensul figurat de a face loc unui cuvânt, a-l primi sau a-l accepta. Formularea aleasă comunică limpede ideea în româna actuală.
- source_word: τὸν λόγον τοῦτον
  choice: cuvântul acesta
  rationale: Păstrează legătura lexicală cu λόγος și trimite la afirmația sau învățătura imediat anterioară, fără a-i restrânge nejustificat sensul.
- source_word: ἀλλ’ οἷς
  choice: ci numai cei cărora
  rationale: „Ci” exprimă contrastul după negație, iar „numai” face explicită valoarea restrictivă a propoziției relative.
- source_word: δέδοται
  choice: le-a fost dat
  rationale: Păstrează perfectul pasiv și ideea unui dar acordat cu efect prezent, fără a introduce în text un agent care nu este numit în greacă.
theological_decisions:
- issue: Identitatea celui care dă în pasivul δέδοται
  choice: Păstrarea pasivului fără numirea celui care dă
  alternative: „ci numai cei cărora Dumnezeu le-a dat aceasta”
  rationale: Construcția este probabil un pasiv divin, însă greaca nu precizează subiectul. Traducerea păstrează această tensiune și nu îl introduce explicit pe Dumnezeu în text.
translation_notes:
  register: Română standard modernă, clară și demnă. „Cuvântul acesta” păstrează deschiderea semantică a lui λόγος, iar nota oferă echivalente mai explicite. Pasivul este menținut pentru a nu preciza dincolo de text identitatea celui care dă.
