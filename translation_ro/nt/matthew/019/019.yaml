  text: Τίμα τὸν πατέρα καὶ τὴν μητέρα, καὶ Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/019.yaml
  text: Honor your father and mother[a], and love your neighbor as yourself.
translation:
  language: ro
  text: Cinstește-i pe tatăl tău și pe mama ta și iubește-l pe aproapele tău ca pe tine însuți.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mai literal, păstrând schimbarea formei verbale din greacă: „Cinstește-i pe tatăl tău și pe mama ta și îl vei iubi pe aproapele tău ca pe tine însuți.”'
    reason: alternativă lexicală și gramaticală
lexical_decisions:
- source_word: Τίμα
  choice: Cinstește-i
  rationale: Verbul τιμάω cere acordarea cinstei cuvenite, nu doar un sentiment lăuntric de respect. „Cinstește-i” păstrează atât imperativul, cât și formularea consacrată a poruncii.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: pe tatăl tău și pe mama ta
  rationale: Deși greaca folosește articolul, contextul poruncii și adresarea directă cer în română posesivul exprimat natural pentru fiecare părinte.
- source_word: Ἀγαπήσεις
  choice: iubește-l
  rationale: Forma este viitor indicativ într-un citat din Lege, unde are forță de poruncă. Imperativul românesc redă limpede această forță și menține paralelismul natural cu „Cinstește-i”; forma mai literală este păstrată în nota de subsol.
- source_word: τὸν πλησίον σου
  choice: pe aproapele tău
  rationale: „Aproapele tău” este expresia românească precisă și consacrată pentru πλησίον în context etic, desemnând persoana aflată în sfera responsabilității și relațiilor cuiva, nu doar pe cineva apropiat fizic.
- source_word: ὡς σεαυτόν
  choice: ca pe tine însuți
  rationale: Redă concis comparația grecească, fără a adăuga verbul eliptic și fără a explica mai mult decât spune textul.
theological_decisions:
- issue: Redarea formelor de poruncă din citarea Legii
  choice: 'Ambele enunțuri sunt redate ca imperative: „Cinstește-i ... și iubește-l ...”.'
  alternative: „Cinstește-i pe tatăl tău și pe mama ta și îl vei iubi pe aproapele tău ca pe tine însuți.”
  rationale: Greaca alătură imperativul Τίμα și viitorul indicativ Ἀγαπήσεις, acesta din urmă fiind formula unei porunci citate din Leviticul 19:18. Două imperative sunt mai naturale în româna actuală și păstrează forța comună de poruncă, iar diferența formală a textului-sursă este semnalată în notă.
translation_notes:
  register: Română standard modernă, clară și demnă. S-a păstrat formularea biblică bine cunoscută „aproapele tău”, care rămâne inteligibilă în uzul actual; pronumele clitice fac construcția firească în română.
