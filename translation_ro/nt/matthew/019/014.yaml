    rationale: „A celor ca ei” redă mai clar categoria generică exprimată de τοιούτων și păstrează ambiguitatea intenționată privind calitatea avută în vedere.
  revised_text: 'Dar Isus a spus: „Lăsați copiii să vină la Mine și nu-i împiedicați să vină la Mine, căci Împărăția cerurilor este a celor ca ei[a].”'
