id: MAT.19.14
reference: Matthew 19:14
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε τὰ παιδία καὶ μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/014.yaml
  text: But Jesus said[a], “Let the children come, and do not hinder them from coming to me[b], for the kingdom of heaven belongs to such as these.”
translation:
  language: ro
  text: 'Dar Isus a spus: „Lăsați copiii să vină la Mine și nu-i împiedicați să vină la Mine, căci Împărăția cerurilor este a celor ca ei[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Celor ca ei” se referă la copiii prezenți, dar poate include și persoane de același fel; textul nu precizează în ce privință sunt asemenea lor.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφετε
  choice: Lăsați
  rationale: Imperativul are aici sensul firesc de a permite; „Lăsați” este concis și idiomatic în româna actuală.
- source_word: τὰ παιδία
  choice: copiii
  rationale: Redă exact substantivul fără a accentua inutil vârsta prin „copilașii” sau „copiii mici”.
- source_word: μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με
  choice: nu-i împiedicați
  rationale: În română, complementul venirii este deja exprimat în prima poruncă, iar reluarea lui după „împiedicați” ar fi redundantă; formularea păstrează sensul interdicției grecești.
- source_word: τῶν γὰρ τοιούτων ἐστὶν
  choice: căci a unora ca ei este
  rationale: Păstrează construcția posesivă și forța reprezentativă a lui τοιούτων, fără a limita referirea la copiii prezenți și fără a preciza în ce privință trebuie alții să fie asemenea lor.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Împărăția cerurilor
  rationale: Este formularea românească consacrată și redă expresia caracteristică Evangheliei după Matei.
theological_decisions:
- issue: Dacă Isus se referă numai la copiii prezenți sau și la persoane de felul lor
  choice: a unora ca ei
  alternative: a acestor copii; aparține celor care sunt asemenea copiilor
  rationale: Formularea menține atât referirea imediată la copii, cât și deschiderea către o categorie mai largă, fără a defini interpretativ calitatea avută în vedere.
- issue: Redarea genitivului τῶν τοιούτων împreună cu ἐστίν
  choice: a unora ca ei este Împărăția
  alternative: Împărăția le aparține unora ca ei
  rationale: Construcția mai apropiată de forma greacă păstrează tensiunea enunțului și este inteligibilă și demnă în română.
translation_notes:
  register: Română standard modernă, cu registru direct și demn. Majuscula reverențială din „Mine” și majuscula lexicală din „Împărăția” urmează uzul biblic românesc; punctuația evită o frazare arhaică.
