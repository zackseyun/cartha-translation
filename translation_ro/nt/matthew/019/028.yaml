  terminology: „Fiul Omului”, „tronul slavei sale”, „douăsprezece tronuri” și „seminții ale lui Israel” sunt alegeri consecvente și precise. „Judecând” conservă sensul direct al lui κρίνοντες, iar nota semnalează, fără a impune, posibila extensie de autoritate/conducere. Nota pentru „înnoire” menține corect caracterul escatologic probabil al termenului și nu îl confundă cu renașterea individuală.
