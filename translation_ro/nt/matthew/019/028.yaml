id: MAT.19.28
reference: Matthew 19:28
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, ⸀καθήσεσθε καὶ ⸀ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/028.yaml
  text: And Jesus said to them[a], “Truly I say to you, you who have followed me will also sit on twelve thrones in the renewal, when the Son of Man sits on the throne of his glory[b], judging the twelve tribes of Israel.”
translation:
  language: ro
  text: 'Isus le-a spus: „Adevărat vă spun: la înnoire[a], când Fiul Omului va ședea pe tronul slavei sale, voi, cei care m-ați urmat, veți ședea și voi pe douăsprezece tronuri, judecând[b] cele douăsprezece seminții ale lui Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „la regenerare”, „la renaștere” ori „în lumea cea nouă”. Aici termenul se referă, cel mai probabil, la înnoirea viitoare asociată cu domnia Fiului Omului, nu la renașterea spirituală a unei persoane.
    reason: lexical_alternative
  - marker: b
    text: „Judecând” poate avea aici și sensul mai larg de exercitare a conducerii sau a cârmuirii.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Adevărat
  rationale: Redă formula solemnă și autoritativă a lui Isus într-o română actuală și firească, fără a păstra netradus împrumutul ebraic.
- source_word: ἀκολουθήσαντές μοι
  choice: voi, cei care m-ați urmat
  rationale: Păstrează adresarea directă, referirea explicită la Isus și caracterizarea grupului prin faptul că l-a urmat.
- source_word: παλιγγενεσίᾳ
  choice: la înnoire
  rationale: Termenul poate însemna renaștere, regenerare sau înnoire. În context desemnează înnoirea viitoare asociată cu întronarea Fiului Omului; formularea concisă nu adaugă explicit «tuturor lucrurilor», cuvinte absente din greacă.
- source_word: ὅταν καθίσῃ
  choice: când ... va ședea
  rationale: Construcția greacă indică un eveniment viitor. Viitorul este firesc în română și păstrează legătura temporală.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Este redarea consacrată a titlului și îi păstrează rezonanța mesianică și danielică.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: pe tronul slavei sale
  rationale: Păstrează construcția genitivală și registrul solemn al expresiei grecești.
- source_word: καθήσεσθε καὶ ὑμεῖς
  choice: veți ședea și voi
  rationale: Redă viitorul și accentul lui καὶ ὑμεῖς, subliniind paralela dintre șederea Fiului Omului pe tron și cea a ucenicilor.
- source_word: ἐπὶ δώδεκα θρόνους
  choice: pe douăsprezece tronuri
  rationale: Redare directă, clară și naturală a expresiei locative.
- source_word: κρίνοντες
  choice: judecând
  rationale: Păstrează sensul lexical direct, fără a restrânge sau extinde în mod nejustificat funcția la guvernare politică.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: cele douăsprezece seminții ale lui Israel
  rationale: «Seminții» este termenul românesc biblic consacrat și inteligibil pentru diviziunile tribale ale lui Israel.
theological_decisions:
- issue: Sensul lui παλιγγενεσία în acest context
  choice: înnoirea viitoare asociată cu întronarea Fiului Omului
  alternative: renașterea individuală; regenerarea; lumea nouă; veacul nou
  rationale: Contextul vorbește despre întronare și judecată viitoare, nu despre convertirea unei persoane. «La înnoire» păstrează însă deschiderea termenului și nu impune o schemă escatologică confesională.
- issue: Sfera semantică a lui κρίνοντες
  choice: judecând
  alternative: cârmuind; guvernând
  rationale: Verbul poate include exercitarea autorității sau a conducerii, dar sensul său direct este «a judeca». Textul principal îl păstrează, iar nota semnalează nuanța mai largă posibilă.
translation_notes:
  register: Română standard modernă, cu ton demn și solemn. Formele «va ședea» și «veți ședea» păstrează imaginea întronării fără a deveni arhaice în mod excesiv; «seminții» conservă terminologia biblică uzuală. Pronumele referitoare la Isus sunt scrise cu literă mică potrivit normelor ortografice moderne, fără a introduce o convenție confesională.
