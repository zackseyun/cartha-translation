  text: ἀκούσαντες δὲ οἱ ⸀μαθηταὶ ἐξεπλήσσοντο σφόδρα λέγοντες· Τίς ἄρα δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/025.yaml
  text: When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”
translation:
  language: ro
  text: 'Când au auzit aceasta, ucenicii au fost foarte uimiți și au zis: „Atunci cine poate fi mântuit?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Când au auzit aceasta
  rationale: Participiul aorist exprimă împrejurarea anterioară verbului principal; o propoziție temporală este firească în română. „Aceasta” explicitează referirea contextuală la afirmația precedentă a lui Isus.
- source_word: δὲ
  choice: '[conector implicit]'
  rationale: Particula marchează continuarea ori un contrast ușor; tranziția este redată natural prin propoziția temporală, fără un conector separat.
- source_word: οἱ μαθηταὶ
  choice: ucenicii
  rationale: Este termenul consacrat, firesc și precis în contextul evanghelic pentru discipolii lui Isus.
- source_word: ἐξεπλήσσοντο σφόδρα
  choice: au rămas foarte uimiți
  rationale: Expresia redă reacția puternică de surprindere, iar „foarte” păstrează intensificarea lui σφόδρα. Formularea românească sugerează starea produsă de cele auzite fără a forța aspectul imperfectului grecesc.
- source_word: λέγοντες
  choice: și au zis
  rationale: Participiul de vorbire concomitentă este redat idiomatic printr-un verb finit coordonat în narațiune.
- source_word: Τίς ἄρα
  choice: Atunci cine
  rationale: Τίς cere identificarea unei persoane, iar ἄρα introduce concluzia surprinsă trasă de ucenici din afirmația anterioară.
- source_word: δύναται σωθῆναι
  choice: poate fi mântuit
  rationale: Construcția păstrează ideea de posibilitate și pasivul infinitivului, fără a preciza agentul ori mecanismul mântuirii.
theological_decisions:
- issue: Sensul lui σωθῆναι în context
  choice: fi mântuit
  alternative: fi salvat / fi izbăvit
  rationale: Contextul privește intrarea în Împărăție și dificultatea celui bogat, astfel că întrebarea are greutatea deplină a mântuirii, nu doar sensul unei scăpări vremelnice. Pasivul este păstrat fără explicații confesionale despre modul mântuirii.
translation_notes:
  register: Română standard modernă, clară și demnă. „Au rămas foarte uimiți” exprimă șocul puternic într-o formulare accesibilă; topica „Atunci cine” păstrează inferența și surprinderea întrebării.
