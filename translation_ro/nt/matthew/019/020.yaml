base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/020.yaml
  text: The young man says to him[a], “All these I have kept[b]. What do I still lack?”
translation:
  language: ro
  text: 'Tânărul îi spune: „Pe toate acestea le-am păzit. Ce-mi mai lipsește?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: spune
  rationale: Păstrează prezentul istoric grecesc, firesc și în narațiunea românească.
- source_word: αὐτῷ
  choice: îi
  rationale: Pronumele românesc la dativ redă natural sensul «lui» după verbul «spune».
- source_word: ὁ νεανίσκος
  choice: Tânărul
  rationale: Redă concis νεανίσκος ca «tânărul», fără a importa ideea de «conducător» din altă tradiție sinoptică.
- source_word: Πάντα ταῦτα
  choice: Pe toate acestea
  rationale: Construcția este idiomatică în română și indică toate poruncile tocmai menționate.
- source_word: ἐφύλαξα
  choice: le-am păzit
  rationale: În contextul poruncilor, «a păzi» exprimă respectarea lor și păstrează formularea biblică familiară, fără a pierde claritatea modernă.
- source_word: τί ἔτι ὑστερῶ
  choice: Ce-mi mai lipsește?
  rationale: Redă firesc întrebarea despre o lipsă care rămâne; «mai» corespunde lui ἔτι, iar «îmi lipsește» păstrează sensul lui ὑστερέω.
theological_decisions:
- issue: Autoevaluarea ascultării
  choice: Afirmația tânărului este redată direct, fără semnalarea aprobării sau a ironiei.
  alternative: Afirmația ar putea fi interpretată drept sinceră, dar greșită, ori exagerată retoric.
  rationale: Greaca prezintă afirmația fără comentariu explicit; traducerea păstrează tensiunea teologică și lasă evaluarea pe seama contextului narativ.
translation_notes:
  register: Română standard modernă, clară și demnă. Prezentul istoric este păstrat, iar dialogul rămâne concis și natural.
