id: MAT.19.24
reference: Matthew 19:24
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: πάλιν δὲ λέγω ὑμῖν, εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸀τρυπήματος ῥαφίδος ⸀εἰσελθεῖν ἢ πλούσιον ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/024.yaml
  text: Again I tell you[b][a], it is easier for a camel to go through the eye of a needle than for a rich man to enter into the kingdom of God.
translation:
  language: ro
  text: 'Vă spun din nou: este mai ușor ca o cămilă să treacă prin urechea unui ac[a] decât să intre un bogat în Împărăția lui Dumnezeu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, „prin orificiul unui ac de cusut”. Textul grec spune „cămilă”, nu „funie”.
    reason: Clarifică sensul concret al imaginii și consemnează fără a o adopta propunerea alternativă cunoscută.
lexical_decisions:
- source_word: πάλιν δὲ λέγω ὑμῖν
  choice: Vă spun din nou
  rationale: Redă firesc în româna modernă repetarea marcată de πάλιν și formula directă λέγω ὑμῖν; δέ este aici un conector slab, care nu necesită exprimare separată.
- source_word: εὐκοπώτερόν ἐστιν
  choice: este mai ușor
  rationale: Comparativul este folosit idiomatic împreună cu infinitivele și cere comparația firească „este mai ușor... decât...”.
- source_word: κάμηλον
  choice: o cămilă
  rationale: Textul grec atestat are κάμηλον, „cămilă”; imaginea hiperbolică nu trebuie atenuată prin conjectura „funie”.
- source_word: διὰ τρυπήματος ῥαφίδος
  choice: prin urechea unui ac
  rationale: Expresia desemnează orificiul unui ac de cusut; „urechea unui ac” este echivalentul românesc consacrat și exact.
- source_word: εἰσελθεῖν
  choice: să treacă / să intre
  rationale: Același infinitiv grec apare conceptual în cele două membre ale comparației; în primul, româna cere firesc „să treacă” printr-un orificiu, iar în al doilea „să intre” în împărăție.
- source_word: ἢ πλούσιον
  choice: decât să intre un bogat
  rationale: πλούσιον este un adjectiv masculin singular substantivizat, redat direct și natural prin „un bogat”.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: în Împărăția lui Dumnezeu
  rationale: Păstrează formula teologică centrală și sensul direcțional al prepoziției εἰς. Majuscula urmează uzul biblic românesc pentru domnia/împărăția lui Dumnezeu.
theological_decisions:
- issue: Interpretarea imaginii cămilei și a urechii acului
  choice: Comparație hiperbolică deliberată, păstrată fără atenuare sau alegorizare
  alternative: O presupusă poartă numită „Urechea Acului” ori lectura conjecturală „funie” în loc de „cămilă”
  rationale: Textul grec prezintă direct cămila și orificiul unui ac de cusut. Imaginea exprimă dificultatea extremă/imposibilitatea omenească în context, fără temei textual pentru o poartă specială sau pentru înlocuirea cămilei cu o funie.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Ordinea „să intre un bogat” păstrează accentul comparației și evită formularea greoaie „pentru un bogat să intre”. Imaginea rămâne concretă și puternică.
