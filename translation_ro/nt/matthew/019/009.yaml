id: MAT.19.9
reference: Matthew 19:9
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ⸀ὅτι ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ μὴ ἐπὶ πορνείᾳ καὶ γαμήσῃ ἄλλην μοιχᾶται ⸂καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/009.yaml
  text: But I tell you that whoever divorces his wife[a], except for sexual immorality, and marries another, commits adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: ro
  text: Dar Eu vă spun că oricine divorțează de soția lui, în afară de cazul de imoralitate sexuală[a], și se căsătorește cu alta comite adulter; iar cine se căsătorește cu o femeie divorțată comite adulter.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „decât din cauza imoralității sexuale”. Expresia grecească poate fi redată și mai restrâns prin „desfrânare” sau poate fi înțeleasă de unii drept „necredincioșie sexuală”.'
    reason: lexical_alternative
  - marker: b
    text: 'Unele manuscrise omit: „iar cine se căsătorește cu o femeie divorțată comite adulter”.'
    reason: textual_variant
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Dar Eu vă spun
  rationale: Redă firesc construcția cu dativ și păstrează nuanța ușor adversativă a lui δέ în raport cu discuția precedentă.
- source_word: ὃς ἂν
  choice: oricine
  rationale: Pronumele relativ împreună cu ἄν exprimă o situație generală, nedefinită.
- source_word: ἀπολύσῃ τὴν γυναῖκα αὐτοῦ
  choice: divorțează de soția lui
  rationale: În context matrimonial, ἀπολύω are sensul specific de a divorța, iar γυνή înseamnă aici „soție”.
- source_word: μὴ ἐπὶ πορνείᾳ
  choice: în afară de cazul de imoralitate sexuală
  rationale: Formularea exprimă excepția fără a restrânge πορνεία la adulter; „imoralitate sexuală” păstrează aria semantică largă a termenului.
- source_word: γαμήσῃ ἄλλην
  choice: se căsătorește cu alta
  rationale: ἄλλην este feminin și desemnează o altă femeie; româna permite exprimarea naturală și concisă „cu alta”.
- source_word: μοιχᾶται
  choice: comite adulter
  rationale: Este formularea românească limpede și consacrată pentru acțiunea indicată de verb.
- source_word: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: iar cine se căsătorește cu o femeie divorțată comite adulter
  rationale: Construcția participială articulată are sens generic, iar participiul perfect pasiv indică o femeie care a fost divorțată.
theological_decisions:
- issue: Sensul lui πορνεία în clauza de excepție
  choice: imoralitate sexuală
  alternative: desfrânare; necredincioșie sexuală; relație sexuală nelegitimă
  rationale: Termenul grec are o arie semantică mai largă decât adulterul. Redarea aleasă evită impunerea unei interpretări confesionale înguste, iar nota păstrează alternativele relevante.
- issue: Includerea clauzei finale καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: Clauza este inclusă în textul principal și semnalată prin notă textuală.
  alternative: Omiterea clauzei, conform unor manuscrise.
  rationale: Textul SBLGNT furnizat include clauza, dar o marchează ca variantă textuală; includerea ei cu notă păstrează atât textul ediției, cât și incertitudinea manuscrisă.
translation_notes:
  register: Română standard modernă, clară și demnă. Exprimarea este directă și accesibilă, fără terminologie confesională adăugată. Majuscula la pronumele „Eu” marchează referirea la Isus conform unei convenții editoriale românești curente, fără a modifica sensul.
