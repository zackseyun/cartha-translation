revisions:
- from: 'El le-a zis: „Din cauza împietririi inimii voastre, Moise v-a îngăduit să vă despărțiți de soțiile voastre[a], dar de la început nu a fost așa.”'
  to: 'El le-a zis: „Din cauza împietririi inimii voastre, Moise v-a îngăduit să divorțați de soțiile voastre[a], dar de la început nu a fost așa.”'
  rationale: Revizuirea înlocuiește expresia ambiguă „să vă despărțiți” cu „să divorțați”, care exprimă direct sensul contextual al lui ἀπολῦσαι. Restul versetului este păstrat, deoarece redă fidel greaca și este idiomatic în româna standard modernă. Nota este reformulată pentru o alternativă literală mai firească, fără a introduce interpretări teologice suplimentare.
