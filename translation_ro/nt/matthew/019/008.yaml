  text: λέγει αὐτοῖς ὅτι Μωϋσῆς πρὸς τὴν σκληροκαρδίαν ὑμῶν ἐπέτρεψεν ὑμῖν ἀπολῦσαι τὰς γυναῖκας ὑμῶν, ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/008.yaml
  text: He said to them[a], “Because of your hardness of heart Moses permitted you to divorce your wives[c][b], but from the beginning it has not been so.”
translation:
  language: ro
  text: 'El le-a zis: „Din cauza împietririi inimii voastre, Moise v-a îngăduit să divorțați de soțiile voastre[a], dar de la început nu a fost așa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: „a le da drumul soțiilor voastre” sau „a le lăsa pe soțiile voastre”; în acest context, expresia se referă la divorț.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: El le-a zis
  rationale: Prezentul istoric grecesc este redat firesc în narațiunea românească prin perfectul compus; pronumele păstrează subiectul exprimat în context.
- source_word: πρὸς τὴν σκληροκαρδίαν ὑμῶν
  choice: Din cauza împietririi inimii voastre
  rationale: Construcția cu πρός și acuzativul exprimă aici motivul sau temeiul concesiei; formularea păstrează imaginea biblică a inimii împietrite.
- source_word: ἐπέτρεψεν
  choice: v-a îngăduit
  rationale: Verbul indică permisiune sau concesie, nu poruncă ori aprobare; „a îngăduit” se potrivește registrului biblic modern și demn.
- source_word: ἀπολῦσαι
  choice: să vă despărțiți
  rationale: În context matrimonial, verbul se referă la desfacerea căsătoriei. Formularea românească este naturală, iar nota păstrează sensul literal de „a alunga/a trimite”.
- source_word: τὰς γυναῖκας ὑμῶν
  choice: de soțiile voastre
  rationale: γυνή înseamnă aici „soție”, întrucât discuția privește căsătoria și divorțul.
- source_word: ἀπ’ ἀρχῆς
  choice: de la început
  rationale: Redare directă și idiomatică, menținând aluzia contextuală la începutul creației fără a o explicita în text.
- source_word: οὐ γέγονεν οὕτως
  choice: nu a fost așa
  rationale: Perfectul lui γίνομαι descrie o stare de fapt stabilită; perfectul compus românesc redă concis faptul că această situație nu ține de ordinea originară.
theological_decisions:
- issue: 'Caracterul acțiunii lui Moise: poruncă sau concesie'
  choice: Moise v-a îngăduit
  alternative: Moise v-a poruncit
  rationale: ἐπέτρεψεν exprimă permisiune. Traducerea păstrează contrastul dintre concesia mozaică și situația de la început, fără a transforma concesia în poruncă.
- issue: Cât de explicită trebuie făcută trimiterea la creație
  choice: dar de la început nu a fost așa
  alternative: dar acesta nu a fost planul lui Dumnezeu de la creație
  rationale: Textul păstrează formularea concisă și implicită a grecei; contextul indică ordinea creației, dar această interpretare nu este introdusă ca adaos în text.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Împietrirea inimii” păstrează idiomul biblic, iar „a îngăduit” distinge clar permisiunea de poruncă.
