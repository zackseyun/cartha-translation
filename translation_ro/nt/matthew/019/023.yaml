id: MAT.19.23
reference: Matthew 19:23
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Ἀμὴν λέγω ὑμῖν ὅτι ⸂πλούσιος δυσκόλως⸃ εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/023.yaml
  text: Then Jesus said to his disciples[a], “Truly I say to you[b], a rich man will enter the kingdom of heaven with difficulty.”
translation:
  language: ro
  text: 'Atunci Isus le-a spus ucenicilor săi: „Adevărat vă spun: un om bogat va intra cu greu în Împărăția cerurilor.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Atunci
  rationale: Marchează trecerea și progresul narațiunii într-o formă firească în româna modernă.
- source_word: Ἰησοῦς
  choice: Isus
  rationale: Forma românească standard a numelui.
- source_word: εἶπεν τοῖς μαθηταῖς αὐτοῦ
  choice: le-a spus ucenicilor săi
  rationale: Redă verbul de vorbire, dativul destinatarului și posesivul explicit αὐτοῦ într-o sintaxă românească naturală.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Adevărat vă spun
  rationale: Redă solemnitatea formulei lui Isus într-un limbaj modern și demn, fără a transforma ἀμήν într-o simplă afirmație neutră.
- source_word: πλούσιος
  choice: un om bogat
  rationale: Adjectivul substantivizat este masculin singular; formularea păstrează referirea la un individ reprezentativ și sună firesc în română.
- source_word: δυσκόλως
  choice: cu greu
  rationale: Redă direct adverbul de mod, fără a anticipa sau intensifica până la imposibilitate afirmația din versetul următor.
- source_word: εἰσελεύσεται
  choice: va intra
  rationale: Echivalentul direct și idiomatic al viitorului lui εἰσέρχομαι.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: Împărăția cerurilor
  rationale: Păstrează expresia specifică Evangheliei după Matei și pluralul grecesc într-o formulare consacrată și naturală în română.
theological_decisions:
- issue: Formula solemnă Ἀμὴν λέγω ὑμῖν
  choice: Adevărat vă spun
  alternative: Amin vă spun
  rationale: Varianta aleasă comunică limpede funcția solemnă și autoritativă a formulei în româna actuală, în timp ce «Amin vă spun» păstrează mai formal termenul semitic.
- issue: Adjectivul substantivizat masculin πλούσιος
  choice: un om bogat
  alternative: o persoană bogată
  rationale: Masculinul singular din text este păstrat, fără a exclude caracterul reprezentativ al afirmației.
- issue: Forța adverbului δυσκόλως
  choice: cu greu
  alternative: aproape că nu va intra
  rationale: «Cu greu» păstrează tensiunea afirmației fără a o transforma aici într-o imposibilitate explicită; dezvoltarea retorică urmează în versetul următor.
translation_notes:
  register: Română standard modernă, clară și demnă. Ordinea propoziției este ușor adaptată sintaxei românești, iar termenii teologici consacrați sunt păstrați fără arhaizare inutilă.
