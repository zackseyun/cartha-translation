id: MAT.19.1
reference: Matthew 19:1
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, μετῆρεν ἀπὸ τῆς Γαλιλαίας καὶ ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/001.yaml
  text: And it happened that when Jesus had finished these words[a], he departed from Galilee and came into the region of Judea beyond the Jordan.
translation:
  language: ro
  text: După ce Isus a terminat de spus aceste cuvinte, a plecat din Galileea și a ajuns în ținuturile Iudeei, dincolo de Iordan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „de cealaltă parte a Iordanului”.'
    reason: Alternativă lexicală pentru πέραν, care poate fi redat atât prin „dincolo de”, cât și prin „de cealaltă parte a”.
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε ἐτέλεσεν
  choice: După ce ... a terminat
  rationale: Formula narativă grecească marchează trecerea la acțiunea următoare după încheierea discursului. Redarea prin „După ce” exprimă firesc în română succesiunea și anterioritatea, fără formula greoaie „și s-a întâmplat că”.
- source_word: τοὺς λόγους τούτους
  choice: de spus aceste cuvinte
  rationale: În context, λόγους indică discursul imediat precedent. Construcția „a terminat de spus aceste cuvinte” este naturală în româna actuală și păstrează referirea explicită la cuvintele rostite.
- source_word: μετῆρεν ἀπὸ τῆς Γαλιλαίας
  choice: a plecat din Galileea
  rationale: Verbul arată părăsirea unui loc; „a plecat din” redă limpede și firesc mișcarea de la locul de origine.
- source_word: ἦλθεν εἰς
  choice: a ajuns în
  rationale: În relatarea unei călătorii, „a ajuns în” redă idiomatic sosirea și intrarea într-un ținut, evitând alternanța românească dependentă de perspectiva naratorului dintre „a venit” și „s-a dus”.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: ținuturile Iudeei
  rationale: Pluralul ὅρια poate desemna hotarele, teritoriul sau regiunile unei zone. „Ținuturile” păstrează nuanța geografică fără a sugera doar linia exactă a frontierei.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: dincolo de Iordan
  rationale: πέραν indică partea aflată dincolo de un reper geografic. Formularea este clară, consacrată și păstrează alternativa spațială exprimată de greacă.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Formula grecească de tranziție este redată idiomatic, iar descrierea geografică rămâne suficient de literală pentru a păstra structura și posibila tensiune a textului.
