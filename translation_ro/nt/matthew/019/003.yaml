  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ προσῆλθον ⸀αὐτῷ Φαρισαῖοι πειράζοντες αὐτὸν καὶ ⸀λέγοντες· Εἰ ἔξεστιν ⸀ἀνθρώπῳ ἀπολῦσαι τὴν γυναῖκα αὐτοῦ κατὰ πᾶσαν αἰτίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/003.yaml
  text: And Pharisees came up to him[a], testing him and saying, “Is it lawful for a man to divorce his wife for any cause?”
translation:
  language: ro
  text: 'Niște farisei s-au apropiat de el ca să-l pună la încercare și l-au întrebat: „Îi este îngăduit unui bărbat să divorțeze de soția lui din orice motiv?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „pe orice temei” ori „pentru orice cauză”. Expresia grecească reflectă o întrebare juridică largă despre motivele în baza cărora era permis divorțul.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: s-au apropiat
  rationale: Redă firesc mișcarea către Isus exprimată de προσέρχομαι, fără rigiditatea unei formulări literale.
- source_word: πειράζοντες
  choice: ca să-l pună la încercare
  rationale: Păstrează sensul de testare și lasă contextul să indice intenția ostilă, fără a restrânge verbul la ideea de ispitire spre păcat.
- source_word: λέγοντες
  choice: l-au întrebat
  rationale: În context, participiul introduce o întrebare directă; formularea românească este naturală și păstrează funcția discursivă.
- source_word: ἔξεστιν
  choice: îi este îngăduit
  rationale: Exprimă permisiunea în cadrul unei dispute juridico-religioase și menține un registru demn, ușor de înțeles.
- source_word: ἀνθρώπῳ
  choice: unui bărbat
  rationale: Deși termenul poate avea sens generic, referirea imediată la «soția lui» indică aici concret un bărbat căsătorit.
- source_word: ἀπολῦσαι
  choice: să divorțeze
  rationale: În context matrimonial, ἀπολύω este termenul idiomatic pentru desfacerea căsătoriei; «să o alunge» ar putea pierde sensul juridic.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: de soția lui
  rationale: γυνή în contextul divorțului înseamnă «soție», iar αὐτοῦ cere exprimarea posesiei.
- source_word: κατὰ πᾶσαν αἰτίαν
  choice: din orice motiv
  rationale: Păstrează caracterul larg al întrebării despre motivele admisibile pentru divorț și este o formulare românească actuală.
theological_decisions:
- issue: Redarea întrebării despre divorț fără impunerea unei poziții confesionale ulterioare
  choice: Îi este îngăduit unui bărbat să divorțeze de soția lui din orice motiv?
  alternative: Îi este permis unui soț să-și lase soția pentru orice pricină?
  rationale: Versetul formulează o provocare juridico-religioasă, nu oferă încă răspunsul doctrinar. Traducerea păstrează întinderea și tensiunea întrebării fără a preciza anticipat ce motive ar fi legitime.
translation_notes:
  register: Română standard modernă, clară și demnă. «Niște farisei» redă natural substantivul nearticulat, iar «ca să-l pună la încercare» face explicită relația circumstanțială a participiului fără a exagera intenția prin formulări precum «ca să-i întindă o capcană».
