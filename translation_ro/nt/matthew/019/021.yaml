id: MAT.19.21
reference: Matthew 19:21
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Εἰ θέλεις τέλειος εἶναι, ὕπαγε πώλησόν σου τὰ ὑπάρχοντα καὶ ⸀δὸς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/021.yaml
  text: Jesus said to him[a], “If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in heaven; then come, follow me.”
translation:
  language: ro
  text: 'Isus i-a spus: „Dacă vrei să fii desăvârșit[a], du-te, vinde-ți bunurile și dă săracilor, și vei avea o comoară în cer; apoi vino și urmează-mă.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „deplin” ori „matur”. Cuvântul grecesc poate exprima perfecțiunea, deplinătatea sau maturitatea.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Isus i-a spus
  rationale: Redare firească a formulei narative, păstrând atât vorbitorul, cât și destinatarul indirect.
- source_word: τέλειος
  choice: desăvârșit
  rationale: „Desăvârșit” redă direct ideea de ajungere la deplinătate sau întregire și păstrează formularea solemnă și bine cunoscută, fără a exclude nuanțele „deplin” și „matur”, indicate în notă.
- source_word: ὕπαγε
  choice: du-te
  rationale: Imperativ românesc direct și idiomatic, care exprimă plecarea cerută.
- source_word: πώλησόν σου τὰ ὑπάρχοντα
  choice: vinde-ți bunurile
  rationale: „Bunurile” denumește natural proprietățile și avuția unei persoane, fără a restrânge nejustificat expresia la anumite obiecte.
- source_word: δὸς πτωχοῖς
  choice: dă săracilor
  rationale: Păstrează obiectul implicit al verbului, ca în greacă, și redă substantivarea lui πτωχοῖς prin formula românească firească „săracilor”.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: vei avea o comoară în cer
  rationale: Redare clară și idiomatică; singularul românesc „cer” exprimă natural pluralul grecesc în această formulă religioasă.
- source_word: δεῦρο ἀκολούθει μοι
  choice: apoi vino și urmează-mă
  rationale: „Vino” păstrează chemarea directă, iar „apoi” face explicită succesiunea deja sugerată de seria imperativelor; „urmează-mă” redă limbajul consacrat al uceniciei.
theological_decisions:
- issue: Sensul lui τέλειος în chemarea la ucenicie
  choice: desăvârșit
  alternative: deplin; matur
  rationale: Termenul poate indica perfecțiunea, deplinătatea ori maturitatea. Textul principal păstrează echivalentul românesc tradițional și lexical apropiat, iar nota menține deschisă nuanța de întregire și maturizare, fără a transforma versetul într-o afirmație doctrinară explicită despre impecabilitate.
- issue: Natura comorii promise
  choice: o comoară în cer
  alternative: o comoară în ceruri
  rationale: Singularul este idiomatic în româna actuală și nu precizează suplimentar natura răsplății sau raportul ei cu mântuirea.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Imperativele sunt directe, iar pronumele referitor la Isus este scris cu literă mică potrivit ortografiei curente, evitând introducerea unei convenții confesionale de capitalizare.
