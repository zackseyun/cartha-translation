  text: ἀκούσας δὲ ὁ νεανίσκος τὸν ⸀λόγον ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/022.yaml
  text: But when the young man heard this word[a], he went away grieving[c][b], for he had many possessions.
translation:
  language: ro
  text: Dar când a auzit aceste cuvinte[a], tânărul a plecat întristat[b], căci avea multe bunuri[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „acest cuvânt” ori „această afirmație”. Expresia grecească se referă la cele spuse de Isus imediat înainte.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „cuprins de întristare”. Participiul grecesc descrie starea lui în timp ce pleca.'
    reason: lexical_alternative
  - marker: c
    text: 'Sau: „multe proprietăți”. Termenul grecesc poate desemna bunuri sau proprietăți, iar formularea subliniază cantitatea lor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: când a auzit
  rationale: Participiul aorist este redat firesc printr-o propoziție temporală, păstrând succesiunea acțiunilor.
- source_word: δὲ
  choice: Dar
  rationale: Marchează contrastul ușor dintre cerința lui Isus și reacția negativă a tânărului.
- source_word: νεανίσκος
  choice: tânărul
  rationale: Redă direct sensul de „tânăr”; nu introduce identificarea drept „conducător” din relatarea paralelă.
- source_word: τὸν λόγον
  choice: aceste cuvinte
  rationale: În context, singularul λόγος desemnează cele spuse anterior de Isus; pluralul idiomatic românesc evită formularea rigidă „acest cuvânt”, fără să schimbe referința.
- source_word: ἀπῆλθεν
  choice: a plecat
  rationale: Formulare narativă naturală în româna actuală pentru actul îndepărtării.
- source_word: λυπούμενος
  choice: întristat
  rationale: Redă starea concomitentă plecării exprimată de participiul prezent, fără a exagera intensitatea emoției.
- source_word: ἦν γὰρ ἔχων
  choice: căci avea
  rationale: Construcția perifrastică exprimă o stare continuă de posesie, redată idiomatic prin imperfect.
- source_word: κτήματα πολλά
  choice: multe avuții
  rationale: Păstrează accentul adjectivului πολλά asupra cantității și redă κτήματα printr-un termen românesc demn și ușor de înțeles pentru bunuri sau proprietăți.
theological_decisions:
- issue: Introducerea identificării drept „conducător” din relatările paralele
  choice: tânărul
  alternative: tânărul conducător
  rationale: Textul lui Matei îl numește aici numai νεανίσκος; completarea ar armoniza relatarea cu Luca în loc să traducă formularea proprie acestui verset.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. „Aceste cuvinte” este mai idiomatic decât calcarea singularului grecesc, iar „avuții” păstrează sensul material fără arhaizare pronunțată.
