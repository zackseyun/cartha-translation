id: MAT.19.12
reference: Matthew 19:12
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν. ὁ δυνάμενος χωρεῖν χωρείτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/012.yaml
  text: For there are eunuchs who were born that way from their mother’s womb[a], and there are eunuchs who were made eunuchs by men, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of heaven[b]. The one able to accept this should accept it.
translation:
  language: ro
  text: Căci sunt eunuci care s-au născut așa din pântecele mamei lor, sunt eunuci care au fost făcuți eunuci de oameni și sunt eunuci care s-au făcut ei înșiși eunuci de dragul Împărăției cerurilor.[a] Cine poate primi lucrul acesta să-l primească.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „s-au castrat singuri”; mulți înțeleg aici o exprimare figurată pentru alegerea celibatului de dragul Împărăției lui Dumnezeu.
    reason: alternative_reading
  - marker: b
    text: 'Sau „Cine poate accepta lucrul acesta să-l accepte”; mai literal: „Cine poate primi să primească.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχοι
  choice: eunuci
  rationale: Termenul românesc redă direct substantivul grecesc și păstrează repetarea lui în toate cele trei categorii, fără a introduce în text parafraza interpretativă „celibatari”.
- source_word: ἐκ κοιλίας μητρὸς
  choice: din pântecele mamei lor
  rationale: Păstrează imaginea concretă a expresiei grecești și este clară în româna actuală; pronumele „lor” face construcția firească fără a-i schimba sensul.
- source_word: ἐγεννήθησαν οὕτως
  choice: s-au născut așa
  rationale: Este o redare naturală și directă a expresiei grecești, fără rigiditatea lui „astfel” în acest context.
- source_word: εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων
  choice: au fost făcuți eunuci de oameni
  rationale: Păstrează legătura lexicală dintre substantiv și verb, precum și pasivul grecesc. „Oameni” poate avea aici sens generic, corespunzător lui ἄνθρωποι.
- source_word: εὐνούχισαν ἑαυτοὺς
  choice: s-au făcut ei înșiși eunuci
  rationale: Redă explicit construcția reflexivă și formularea provocatoare a grecei, fără a decide în traducere dacă sensul este literal, hiperbolic sau metaforic.
- source_word: διὰ τὴν βασιλείαν τῶν οὐρανῶν
  choice: de dragul Împărăției cerurilor
  rationale: Exprimă motivul sau scopul indicat de διά cu acuzativ și sună firesc în română.
- source_word: ὁ δυνάμενος χωρεῖν χωρείτω
  choice: Cine poate primi lucrul acesta să-l primească
  rationale: „A primi” redă aici sensul idiomatic al acceptării unei învățături dificile, iar forma cu conjunctiv păstrează forța imperativului grecesc. „Lucrul acesta” explicitează în mod firesc în română obiectul subînțeles din context.
theological_decisions:
- issue: Dacă εὐνούχισαν ἑαυτοὺς trebuie înțeles literal sau metaforic
  choice: Formularea lexicală directă „s-au făcut ei înșiși eunuci” este păstrată în text.
  alternative: „s-au castrat singuri” sau „au ales celibatul / au renunțat la căsătorie”
  rationale: Versetul nu precizează dacă a treia categorie este literală, hiperbolică ori metaforică. Traducerea păstrează tensiunea, iar nota consemnează principalele posibilități.
- issue: Sensul îndemnului final ὁ δυνάμενος χωρεῖν χωρείτω
  choice: „Cine poate primi lucrul acesta să-l primească.”
  alternative: „Cine poate accepta lucrul acesta să-l accepte” sau, mai formal, „Cine poate primi să primească.”
  rationale: „A primi” păstrează metafora și legătura cu contextul imediat, dar în română poate exprima și acceptarea unei învățături. Nota păstrează alternativa semantic mai explicită.
translation_notes:
  register: 'Română standard modernă, clară și demnă. Repetarea termenului „eunuci” reproduce structura retorică a grecei. Marcajele notelor sunt așezate după expresiile la care se referă efectiv: [a] după a treia categorie și [b] după îndemnul final.'
