  yaml_path: translation/nt/matthew/019/015.yaml
  text: And after laying his hands on them[a], he went on from there.
translation:
  language: ro
  text: Și, după ce Și-a pus mâinile peste ei, a plecat de acolo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθεὶς
  choice: după ce Și-a pus
  rationale: Participiul aorist indică aici o acțiune anterioară verbului principal; construcția românească redă firesc succesiunea.
- source_word: τὰς χεῖρας αὐτοῖς
  choice: mâinile peste ei
  rationale: Expresia descrie gestul concret al punerii mâinilor asupra unor persoane. Pronumele posesiv reflexiv este cerut firesc în română, subiectul fiind Isus.
- source_word: ἐπορεύθη
  choice: a plecat
  rationale: Verbul indică deplasarea de la locul respectiv; „a plecat” este natural și demn în narațiunea românească.
- source_word: ἐκεῖθεν
  choice: de acolo
  rationale: Redă direct adverbul de loc care exprimă punctul de plecare.
- source_word: καὶ
  choice: Și
  rationale: Păstrează legătura narativă simplă cu versetul anterior.
theological_decisions:
- issue: Natura gestului punerii mâinilor
  choice: 'Este păstrat gestul fizic explicit: „Și-a pus mâinile peste ei”.'
  alternative: O parafrază interpretativă precum „i-a binecuvântat”.
  rationale: Contextul sugerează binecuvântarea, dar textul grec numește explicit punerea mâinilor; traducerea nu înlocuiește gestul cu efectul său presupus.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Majuscula reverențială din „Și-a” identifică limpede referirea la Isus, conform uzului biblic românesc.
