id: MAT.19.27
reference: Matthew 19:27
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τότε ἀποκριθεὶς ὁ Πέτρος εἶπεν αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ἠκολουθήσαμέν σοι· τί ἄρα ἔσται ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/027.yaml
  text: Then Peter answered him, “Look, we have left everything and followed you. What then will there be for us?”
translation:
  language: ro
  text: 'Atunci Petru I-a răspuns: „Iată, noi am lăsat totul și Te-am urmat. Ce va fi, atunci, cu noi?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: I-a zis
  rationale: În acest context, participiul idiomatic împreună cu verbul vorbirii introduce intervenția lui Petru; formularea românească naturală evită rigidul „răspunzând, a spus”.
- source_word: Ἰδοὺ
  choice: Iată
  rationale: Păstrează funcția de atragere a atenției și registrul demn, fiind totodată firesc în româna biblică modernă.
- source_word: ἀφήκαμεν πάντα
  choice: am lăsat totul
  rationale: Redă direct sensul renunțării la toate cele avute, fără a adăuga obiecte nespecificate.
- source_word: ἠκολουθήσαμέν σοι
  choice: Te-am urmat
  rationale: Este echivalentul românesc firesc al verbului „a urma” cu dativul persoanei.
- source_word: τί ἄρα ἔσται ἡμῖν
  choice: Ce va fi, așadar, pentru noi?
  rationale: Păstrează formularea deliberat largă și nu o restrânge interpretativ la „ce vom primi?” sau „ce răsplată vom avea?”.
theological_decisions:
- issue: Natura a ceea ce îi așteaptă pe ucenici
  choice: „Ce va fi, așadar, pentru noi?”
  alternative: „Ce vom primi, așadar?”
  rationale: Greaca folosește verbul „a fi”, nu un verb explicit al primirii sau răsplătirii; traducerea păstrează ambiguitatea și tensiunea întrebării lui Petru.
translation_notes:
  register: Română standard modernă, clară și demnă. Majusculele reverențiale din pronumele adresate lui Isus sunt folosite consecvent ca opțiune editorială de registru, fără schimbarea sensului sursei.
source_grounding:
  english_pob_role: consult_only
