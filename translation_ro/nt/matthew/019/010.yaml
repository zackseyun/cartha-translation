base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/010.yaml
  text: His disciples said to him[a], “If that is the case of a man with his wife, it is not beneficial to marry.”
translation:
  language: ro
  text: 'Ucenicii Lui I-au spus: „Dacă așa stau lucrurile între un bărbat și soția lui,[a] nu este spre folos să se căsătorească.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Dacă acesta este cazul unui bărbat cu soția lui”. Expresia grecească este concisă, iar termenul redat aici prin „stau lucrurile” poate însemna și „cazul”, „situația” sau „starea de lucruri”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν αὐτῷ
  choice: I-au spus
  rationale: Prezentul grecesc funcționează aici ca prezent istoric; perfectul compus este firesc în narațiunea românească. Pronumele reverențiale sunt marcate prin majusculă conform uzului biblic românesc.
- source_word: οἱ μαθηταί
  choice: ucenicii Lui
  rationale: „Ucenici” este termenul consacrat și păstrează atât ideea de învățare, cât și relația de urmărire a lui Isus; posesivul clarifică referentul în română.
- source_word: Εἰ οὕτως ἐστὶν ἡ αἰτία
  choice: Dacă aceasta este situația
  rationale: Redare idiomatică a construcției compacte; „situația” exprimă aici împrejurarea sau starea de lucruri, nu cauza în sens strict.
- source_word: τοῦ ἀνθρώπου μετὰ τῆς γυναικός
  choice: bărbatului față de soția lui
  rationale: Contextul matrimonial cere „bărbat” și „soție”. „Față de” redă natural relația avută în vedere, iar posesivul este cerut de exprimarea românească firească.
- source_word: οὐ συμφέρει
  choice: nu este spre folos
  rationale: Păstrează sensul de avantaj sau folos al verbului συμφέρει și tensiunea afirmației ucenicilor, fără a-l transforma în simplul „nu este recomandabil”.
- source_word: γαμῆσαι
  choice: să se căsătorească
  rationale: Infinitivul aorist grecesc este redat firesc în română prin conjunctivul cerut de construcția impersonală.
theological_decisions:
- issue: Limbajul de gen din ἀνθρώπου ... γυναικός
  choice: bărbatului față de soția lui
  alternative: persoanei față de partenerul său
  rationale: Contextul imediat vorbește explicit despre căsătoria dintre bărbat și femeie; redarea păstrează referința masculină și sensul matrimonial al lui γυνή, fără neutralizare.
- issue: Forța pragmatică a expresiei οὐ συμφέρει
  choice: nu este spre folos
  alternative: nu este recomandabil
  rationale: „Spre folos” conservă evaluarea avantajului exprimată de greacă și nu reduce replica la un sfat practic.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Formularea evită atât arhaismele, cât și colocvialismele și păstrează caracterul categoric al reacției ucenicilor.
