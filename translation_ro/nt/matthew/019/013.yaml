id: MAT.19.13
reference: Matthew 19:13
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τότε ⸀προσηνέχθησαν αὐτῷ παιδία ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται· οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/013.yaml
  text: Then children were brought to him so that he might lay his hands on them and pray[a]; but the disciples rebuked them.
translation:
  language: ro
  text: Atunci au fost aduși la el niște copii, ca să-și pună mâinile peste ei și să se roage; dar ucenicii i-au mustrat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pronumele „i-” se poate referi fie la copii, fie la cei care i-au adus.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Redă firesc adverbul temporal care marchează succesiunea narațiunii.
- source_word: προσηνέχθησαν αὐτῷ παιδία
  choice: au fost aduși la el niște copii
  rationale: Păstrează pasivul aorist și sensul direct al lui προσφέρω; „niște copii” este natural în româna actuală și nu adaugă ideea explicită de vârstă foarte mică.
- source_word: ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς
  choice: ca să-și pună mâinile peste ei
  rationale: Păstrează scopul exprimat prin ἵνα, pluralul „mâinile” și idiomul gestului, într-o formulare românească limpede.
- source_word: καὶ προσεύξηται
  choice: și să se roage
  rationale: Nu adaugă complementul „pentru ei”, care este sugerat de context, dar nu apare explicit în verbul grecesc.
- source_word: οἱ δὲ μαθηταὶ
  choice: dar ucenicii
  rationale: „Dar” redă contrastul ușor introdus de δέ.
- source_word: ἐπετίμησαν αὐτοῖς
  choice: i-au mustrat
  rationale: „A mustra” redă forța lui ἐπιτιμάω, iar pronumele românesc păstrează referentul neprecizat al pronumelui grec.
theological_decisions:
- issue: Referentul pronumelui final αὐτοῖς
  choice: i-au mustrat
  alternative: ucenicii i-au mustrat pe copii / ucenicii i-au mustrat pe cei care îi aduseseră
  rationale: Pronumele grec poate avea drept antecedent fie copiii, fie persoanele care i-au adus. Textul principal nu decide între aceste posibilități, iar nota explică ambiguitatea autentică.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Formularea evită atât arhaismele, cât și explicitarea nejustificată a persoanelor mustrate.
source_grounding:
  english_pob_role: consult_only
