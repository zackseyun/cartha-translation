  text: ὁ δὲ εἶπεν αὐτῷ· Τί με ⸂ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός⸃· εἰ δὲ θέλεις ⸂εἰς τὴν ζωὴν εἰσελθεῖν⸃, ⸀τήρησον τὰς ἐντολάς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/017.yaml
  text: And he said to him[a], “Why do you ask me about what is good? One is good. But if you want to enter into life[b], keep the commandments.”
translation:
  language: ro
  text: 'Iar el i-a zis[a]: „De ce mă întrebi despre ce este bun? Unul singur este bun[b]. Dar, dacă vrei să intri în viață, păzește poruncile.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Unele manuscrise, precum și relatările paralele, au: „De ce mă numești bun? Nimeni nu este bun decât unul singur: Dumnezeu.” Textul SBLGNT din Matei are însă: „De ce mă întrebi despre ce este bun? Unul este cel bun.”'
    reason: textual_variant
  - marker: b
    text: 'Literal: „Unul este cel bun.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ
  choice: De ce mă întrebi despre ce este bun?
  rationale: Construcția la neutru singular este redată ca referire la ceea ce este bun, fără armonizare cu formularea paralelă despre numirea lui Isus drept bun.
- source_word: εἷς ἐστιν ὁ ἀγαθός
  choice: Unul este Cel bun
  rationale: Redarea păstrează structura accentuată a grecei și adjectivul articulat substantivizat, precum și legătura lexicală cu afirmația precedentă, deși româna permite și o formulare mai idiomatică.
- source_word: εἰ δὲ θέλεις
  choice: Dar, dacă vrei
  rationale: „Vrei” exprimă firesc dorința sau intenția, iar „dar” redă valoarea ușor adversativă a lui δέ.
- source_word: εἰς τὴν ζωὴν εἰσελθεῖν
  choice: să intri în viață
  rationale: Formularea păstrează imaginea intrării și nu adaugă termenul „veșnică”, absent din această propoziție.
- source_word: τήρησον τὰς ἐντολάς
  choice: păzește poruncile
  rationale: În contextul poruncilor divine, „a păzi poruncile” este o expresie românească firească, clară și cu greutatea potrivită.
theological_decisions:
- issue: Relația afirmației lui Isus cu bunătatea divină și cu cristologia
  choice: 'Este tradusă formularea proprie textului SBLGNT din Matei: o întrebare despre ceea ce este bun, urmată de „Unul este Cel bun”.'
  alternative: 'Armonizarea cu Marcu și Luca: „De ce mă numești bun? Nimeni nu este bun decât unul singur—Dumnezeu.”'
  rationale: Textul grec al lui Matei trebuie păstrat fără a introduce fie o negare a bunătății lui Isus, fie o concluzie cristologică explicită care nu este formulată în verset.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. „Iar el i-a zis” păstrează succesiunea narativă; „păzește poruncile” este formularea biblică încă naturală în uzul actual. Majuscula din „Cel bun” semnalează adjectivul substantivizat ca referire personală, fără a adăuga explicit numele lui Dumnezeu.
