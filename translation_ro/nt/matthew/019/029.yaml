id: MAT.19.29
reference: Matthew 19:29
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ πᾶς ⸀ὅστις ἀφῆκεν ⸂οἰκίας ἢ⸃ ἀδελφοὺς ἢ ἀδελφὰς ἢ πατέρα ἢ μητέρα ἢ ⸂γυναῖκα ἢ⸃ τέκνα ἢ ⸀ἀγροὺς ἕνεκεν τοῦ ⸂ὀνόματός μου⸃, ⸀ἑκατονταπλασίονα λήμψεται καὶ ζωὴν αἰώνιον κληρονομήσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/029.yaml
  text: And everyone who has left houses or brothers or sisters or father or mother or wife or children or fields for the sake of my name will receive a hundredfold and will inherit eternal life[a].
translation:
  language: ro
  text: Și oricine a lăsat case, frați, surori, tată, mamă, soție, copii sau ogoare de dragul numelui Meu va primi de o sută de ori mai mult[a] și va moșteni viața veșnică.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „însutit”.'
    reason: Alternativă lexicală concisă, cu registru biblic, pentru ἑκατονταπλασίονα.
lexical_decisions:
- source_word: πᾶς ὅστις
  choice: oricine
  rationale: 'Redă firesc în româna actuală sensul distributiv și generic: fiecare persoană care îndeplinește condiția.'
- source_word: ἀφῆκεν
  choice: a lăsat
  rationale: Păstrează ideea unei renunțări efective fără încărcătura interpretativă mai puternică a verbelor „a părăsit” sau „a abandonat”.
- source_word: οἰκίας
  choice: case
  rationale: Termen concret, potrivit alături de „ogoare”, care poate cuprinde atât locuințele, cât și bunurile gospodăriei.
- source_word: ἀδελφοὺς / ἀδελφὰς
  choice: frați, surori
  rationale: Păstrează termenii de rudenie separați, așa cum apar în greacă.
- source_word: πατέρα / μητέρα
  choice: tată, mamă
  rationale: Redare directă și naturală a termenilor singulari de rudenie.
- source_word: γυναῖκα
  choice: soție
  rationale: În enumerarea relațiilor familiale, sensul contextual este „soție”, nu termenul general „femeie”.
- source_word: τέκνα
  choice: copii
  rationale: Echivalentul românesc obișnuit pentru descendenți în cadrul unei enumerări familiale.
- source_word: ἀγρούς
  choice: ogoare
  rationale: Redă terenurile agricole și păstrează caracterul concret al bunurilor la care se renunță.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: de dragul numelui Meu
  rationale: 'Păstrează idiomul teologic al „numelui” și exprimă limpede motivul: devotamentul față de Isus și identitatea Lui.'
- source_word: ἑκατονταπλασίονα
  choice: însutit
  rationale: Este concis, idiomatic și păstrează direct forța cantitativă a termenului grec; alternativa explicativă este consemnată în notă.
- source_word: ζωὴν αἰώνιον κληρονομήσει
  choice: va moșteni viața veșnică
  rationale: Păstrează atât metafora moștenirii, cât și expresia consacrată și clară „viața veșnică”.
theological_decisions:
- issue: Sensul lui γυνή în enumerarea renunțărilor ucenicului
  choice: soție
  alternative: femeie
  rationale: Contextul enumeră relații de familie și bunuri; „soție” păstrează sensul relațional fără a sugera renunțarea generală la femei.
- issue: Păstrarea expresiei ἕνεκεν τοῦ ὀνόματός μου
  choice: de dragul numelui Meu
  alternative: din cauza Mea / de dragul Meu
  rationale: Păstrarea cuvântului „nume” conservă idiomul sursei și greutatea lui teologică, fără a-l reduce la o parafrază.
- issue: Forța promisiunii exprimate prin ἑκατονταπλασίονα
  choice: însutit
  alternative: de o sută de ori mai mult
  rationale: „Însutit” redă direct proporția exprimată de text, fără a preciza în ce mod se realizează răsplata și fără a rezolva interpretativ tensiunea promisiunii.
translation_notes:
  register: Română standard modernă, clară și demnă. Enumerarea este ușor fluidizată prin virgule, păstrând „sau” înaintea ultimului element. Formulările „numele Meu”, „va moșteni” și „viața veșnică” conservă registrul biblic fără arhaizare.
