id: MAT.5.43
reference: Matthew 5:43
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἠκούσατε ὅτι ἐρρέθη· Ἀγαπήσεις τὸν πλησίον σου καὶ μισήσεις τὸν ἐχθρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/043.yaml
  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: ro
  text: 'Ați auzit că s-a spus[a]: „Să-l iubești pe aproapele tău și să-l urăști pe dușmanul tău.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Prima propoziție evocă Leviticul 19:18; a doua („și să-l urăști pe dușmanul tău”) nu este un citat direct din Vechiul Testament, ci reflectă învățătura transmisă pe care Isus o corectează.
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Ați auzit
  rationale: Aoristul indicativ, folosit în formula introductivă a învățăturii, se redă firesc în română prin perfectul compus și indică primirea anterioară a acestei învățături.
- source_word: ἐρρέθη
  choice: s-a spus
  rationale: Redarea impersonală păstrează valoarea pasivă fără a preciza cine a rostit cuvintele.
- source_word: Ἀγαπήσεις
  choice: Să-l iubești
  rationale: Viitorul indicativ grecesc are aici valoare de poruncă; conjunctivul românesc redă limpede și natural această forță în cadrul citatului.
- source_word: τὸν πλησίον σου
  choice: pe aproapele tău
  rationale: „Aproapele” este echivalentul consacrat și exact în context etic și păstrează legătura cu Leviticul 19:18.
- source_word: μισήσεις
  choice: să-l urăști
  rationale: Forma este paralelă cu Ἀγαπήσεις și are aceeași valoare de poruncă în zicerea relatată.
- source_word: τὸν ἐχθρόν σου
  choice: pe dușmanul tău
  rationale: „Dușman” redă direct sensul etic și relațional al lui ἐχθρός într-o română modernă și firească.
theological_decisions:
- issue: Statutul propoziției „și să-l urăști pe dușmanul tău”
  choice: Este redată ca parte a zicerii despre care Isus afirmă că fusese auzită, fără a sugera că întreaga zicere este un citat direct din Scriptură.
  alternative: A trata ambele propoziții ca un citat scripturistic direct sau a identifica în textul principal a doua propoziție drept tradiție interpretativă.
  rationale: Greaca prezintă o singură zicere relatată, introdusă prin „Ați auzit că s-a spus”. Nota clarifică sursa diferită a celor două părți fără a rezolva în textul principal tensiunea pe care acesta o păstrează.
translation_notes:
  register: Română standard modernă, clară și demnă. Formele la conjunctiv redau natural valoarea de poruncă a viitorului grecesc, iar construcția impersonală „s-a spus” evită identificarea nejustificată a vorbitorului.
