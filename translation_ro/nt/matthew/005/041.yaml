id: MAT.5.41
reference: Matthew 5:41
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ὅστις σε ἀγγαρεύσει μίλιον ἕν, ὕπαγε μετ’ αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/041.yaml
  text: And whoever forces you to go one mile[c][b][a], go with him two miles.
translation:
  language: ro
  text: Iar dacă te silește cineva să mergi o milă[a], mergi cu el două mile.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Verbul tradus prin „te silește” poate desemna obligarea cuiva de către o autoritate să presteze un serviciu, probabil cu aluzie la practica romană a serviciului impus.
    reason: lexical_alternative
  - marker: b
    text: 'Literal: „mergi cu el două”; „mile” este subînțeles din prima parte a versetului.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὅστις
  choice: Iar dacă ... cineva
  rationale: Redă firesc în română cazul general introdus de pronumele relativ nehotărât, fără a restrânge referința.
- source_word: ἀγγαρεύσει
  choice: te silește să mergi
  rationale: Păstrează caracterul coercitiv al cererii; verbul grec putea desemna obligarea cuiva la un serviciu impus de autorități, iar deplasarea este indicată de distanța menționată.
- source_word: μίλιον ἕν
  choice: o milă
  rationale: Este vorba despre o milă romană; formularea românească este directă și naturală.
- source_word: ὕπαγε μετ’ αὐτοῦ
  choice: mergi cu el
  rationale: Redă imperativul și ideea de însoțire în limbaj românesc curent și demn.
- source_word: δύο
  choice: două mile
  rationale: În greacă apare numai numeralul „două”, unitatea fiind subînțeleasă din prima propoziție; în română, repetarea substantivului evită o exprimare nefirească.
theological_decisions:
- issue: Contextul social-istoric al serviciului impus
  choice: Textul principal vorbește despre constrângere fără a identifica persoana care o exercită.
  alternative: Menționarea explicită a unui soldat roman sau a rechiziției militare.
  rationale: Verbul și mila romană evocă probabil serviciul impus sub autoritate romană, însă textul grec nu menționează explicit nici soldați, nici armata.
translation_notes:
  register: Română standard modernă, clară și demnă. Construcția „dacă ... cineva” este mai firească decât un calc rigid cu „oricine”, iar sensul general rămâne intact. Nu este precizat un agent roman în textul principal.
