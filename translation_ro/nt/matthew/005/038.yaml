  text: Ἠκούσατε ὅτι ἐρρέθη· Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ καὶ ὀδόντα ἀντὶ ὀδόντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/038.yaml
  text: You have heard that it was said[a], ‘An eye for an eye and a tooth for a tooth.’
translation:
  language: ro
  text: 'Ați auzit că s-a spus: „Ochi pentru ochi și dinte pentru dinte.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Ați auzit
  rationale: Aoristul din formula introductivă mateiană este redat firesc în română prin perfectul compus și indică învățătura primită anterior de ascultători.
- source_word: ὅτι
  choice: că
  rationale: Introduce conținutul celor auzite și corespunde uzului declarativ obișnuit din română.
- source_word: ἐρρέθη
  choice: s-a spus
  rationale: Păstrează construcția impersonală și sensul pasiv al verbului λέγω, fără a preciza cine a rostit afirmația.
- source_word: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
  choice: Ochi pentru ochi
  rationale: Formula românească consacrată redă concis raportul de substituire sau echivalență exprimat de ἀντί.
- source_word: καὶ
  choice: și
  rationale: Leagă simplu cele două membre paralele ale formulei juridice.
- source_word: ὀδόντα ἀντὶ ὀδόντος
  choice: dinte pentru dinte
  rationale: Păstrează paralelismul și formularea juridică proverbială, fără a adăuga o interpretare privind aplicarea ei.
theological_decisions:
- issue: Redarea formulei juridice a talionului citate de Isus
  choice: „Ochi pentru ochi și dinte pentru dinte”
  alternative: „Un ochi în locul unui ochi și un dinte în locul unui dinte”
  rationale: Forma consacrată în română reflectă exact formula greacă și rămâne recognoscibilă, fără a decide dacă principiul cere răzbunare literală sau stabilește proporționalitatea juridică.
translation_notes:
  register: Română standard modernă, clară și demnă. Formula tradițională este încă naturală și ușor de înțeles; nu este necesară o notă lexicală, deoarece sensul substitutiv al lui ἀντί este bine redat de „pentru” în această expresie fixă.
