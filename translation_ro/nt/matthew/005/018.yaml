id: MAT.5.18
reference: Matthew 5:18
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: ro
  text: 'Căci adevărat vă spun: până vor trece cerul și pământul, nici măcar o singură iotă[a] sau o singură trăsătură de literă[b] nu va trece nicidecum din lege, până când toate vor avea loc[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Iotă” este numele celei mai mici litere din alfabetul grecesc.
    reason: lexical_alternative
  - marker: b
    text: Adică un semn scris foarte mic, prin care se pot deosebi literele.
    reason: lexical_clarification
  - marker: c
    text: 'Sau: „până când totul se va împlini” ori „până când toate se vor petrece”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: adevărat
  rationale: În această formulă solemnă introductivă, termenul afirmă certitudinea și autoritatea spuselor lui Isus; „adevărat” este firesc și demn în româna actuală.
- source_word: γὰρ
  choice: căci
  rationale: Păstrează rolul explicativ al enunțului față de afirmația precedentă.
- source_word: λέγω ὑμῖν
  choice: vă spun
  rationale: Redare directă și naturală, care păstrează tonul autoritativ.
- source_word: ἕως ἂν παρέλθῃ
  choice: până când vor trece
  rationale: Exprimă limita viitoare indicată de construcția grecească și sensul lui παρέρχομαι în raport cu cerul și pământul.
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: cerul și pământul
  rationale: Formularea românească consacrată și firească păstrează întinderea cosmică a expresiei.
- source_word: ἰῶτα ἓν
  choice: o singură iotă
  rationale: Păstrează denumirea precisă a literei și accentul numeralului asupra celui mai mic element al scrierii.
- source_word: μία κεραία
  choice: o singură trăsătură de literă
  rationale: Redă o mică linie ori proeminență grafică prin care se pot deosebi literele, fără arhaismul unei formulări precum „titlă”.
- source_word: οὐ μὴ παρέλθῃ
  choice: nu va trece nicidecum
  rationale: Dubla formulă negativă grecească este emfatică; „nicidecum” îi păstrează forța în română.
- source_word: ἀπὸ τοῦ νόμου
  choice: din lege
  rationale: Redă direct construcția grecească și lasă contextul să arate că este vorba despre legea Scripturii, fără a restrânge explicit referința la o anumită delimitare canonică.
- source_word: ἕως ἂν πάντα γένηται
  choice: până când toate vor avea loc
  rationale: Redarea exprimă venirea la existență sau producerea tuturor lucrurilor avute în vedere, fără a decide dacă accentul cade exclusiv pe împlinire, realizare ori simpla lor petrecere.
theological_decisions:
- issue: Sensul lui νόμος
  choice: „legea” ca lege scripturistică a lui Dumnezeu
  alternative: Tora/Pentateuhul în sens strict sau, prin extensie, întregul corpus scripturistic anterior
  rationale: Contextul din Matei 5:17–19 vorbește despre „Lege și Profeți” și despre autoritatea Scripturii. Textul tradus păstrează termenul general și nu fixează mai îngust întinderea referinței.
- issue: Forța expresiei πάντα γένηται
  choice: „până când toate vor avea loc”
  alternative: „până când totul se va împlini” sau „până când toate se vor petrece”
  rationale: γίνομαι poate indica faptul că lucrurile ajung să aibă loc, iar în context poate purta și nuanța realizării. Formularea principală păstrează deschiderea semantică, iar nota oferă alternativa cu accent pe împlinire.
translation_notes:
  register: Română standard modernă, cu ton solemn și accesibil. Sintaxa rămâne apropiată de structura greacă, dar este fluentă; repetiția „o singură” și adverbul „nicidecum” păstrează insistența originalului. Litera mică în „lege” evită impunerea tipografică a unei delimitări mai precise decât permite termenul grec.
