review_pass:
  verdict: revise
  source_fidelity: Textul redă corect formula discursivă, destinatarul tradiției, porunca și consecința juridică. Totuși, „li s-a spus celor din vechime” dublează în română marcarea destinatarului, deși greaca spune simplu „s-a spus celor din vechime”. „Va fi pasibil de judecată” este mai puțin firesc și nu redă la fel de direct construcția ἔνοχος εἰμί cu dativul consecinței judiciare.
  naturalness: Se recomandă eliminarea lui „li” și înlocuirea expresiei administrative „pasibil de judecată” cu „va răspunde înaintea judecății”, formulare românească naturală care păstrează caracterul juridic fără a identifica instanța. Restul este modern, clar și are un registru potrivit.
  terminology: „Să nu ucizi” este formula românească consacrată și poate fi menținută, cu nota care precizează sensul mai restrâns al lui φονεύω. „Judecată” păstrează în mod justificat ambiguitatea lui τῇ κρίσει; nu trebuie înlocuit cu „tribunal” sau „condamnare”.
  issues:
  - severity: medium
    issue: Dublarea destinatarului în „li s-a spus celor din vechime”
    rationale: Dativul românesc este exprimat deja prin „celor din vechime”; cliticul „li” este redundant și ușor greoi. Greaca are doar τοῖς ἀρχαίοις ca destinatar explicit.
  - severity: medium
    issue: „Va fi pasibil de judecată”
    rationale: Este o formulare administrativ-juridică rigidă și o colocationare mai puțin idiomatică. „Va răspunde înaintea judecății” exprimă firesc răspunderea juridică inclusă în ἔνοχος ἔσται τῇ κρίσει, fără a preciza natura instanței.
  revised_text: 'Ați auzit că s-a spus celor din vechime[a]: „Să nu ucizi[b]; iar cine ucide va răspunde înaintea judecății.”'
