source:
  edition: SBLGNT
  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: ro
  text: 'Ați auzit că s-a spus celor din vechime[a]: „Să nu ucizi[b]; iar cine ucide va răspunde înaintea judecății.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „celor de demult”.'
    reason: lexical_alternative
  - marker: b
    text: Verbul grecesc se referă mai precis la omor, adică la uciderea nelegitimă, nu la orice fel de ucidere.
    reason: lexical_clarification
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Ați auzit
  rationale: Perfectul compus redă firesc în română formula discursivă, referindu-se la învățătura primită și cunoscută de ascultători.
- source_word: ἐρρέθη
  choice: s-a spus
  rationale: Pasivul impersonal păstrează formularea greacă fără a identifica explicit vorbitorul.
- source_word: τοῖς ἀρχαίοις
  choice: celor din vechime
  rationale: Redă persoanele din vremurile de demult și păstrează sensul de destinatar al dativului; este mai natural în româna actuală decât «anticilor».
- source_word: Οὐ φονεύσεις
  choice: Să nu ucizi
  rationale: În română, «a ucide» este formularea consacrată și firească a poruncii; în acest context denumește uciderea nelegitimă, nu orice luare a vieții, fapt precizat în notă.
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: iar cine ucide
  rationale: Construcția redă natural condiția generală și păstrează legătura cu verbul din poruncă.
- source_word: ἔνοχος ἔσται
  choice: va fi pasibil
  rationale: Exprimă răspunderea juridică față de o sancțiune sau instanță, nu doar vinovăția în sens abstract.
- source_word: τῇ κρίσει
  choice: de judecată
  rationale: Păstrează caracterul juridic al lui κρίσις fără a preciza nejustificat dacă este vorba despre o instanță omenească sau despre condamnarea însăși.
theological_decisions:
- issue: Întinderea semantică a poruncii a șasea
  choice: «Să nu ucizi», cu precizarea că verbul se referă aici la omor nelegitim
  alternative: «Să nu omori»
  rationale: Grecescul φονεύω indică omorul, nu uciderea în sensul cel mai larg. Formularea românească tradițională rămâne inteligibilă în context, iar nota împiedică interpretarea ei ca interdicție lexicală a oricărei ucideri.
- issue: Identitatea judecății din τῇ κρίσει
  choice: judecată
  alternative: tribunal / condamnare
  rationale: Textul grec are o formulare juridică ce nu cere identificarea explicită a unei instanțe precise; traducerea păstrează această deschidere.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Punctuația prezintă porunca și consecința juridică drept o singură unitate de învățătură citată. «Pasibil de judecată» păstrează nuanța juridică, deși are un registru ușor formal, adecvat contextului.
