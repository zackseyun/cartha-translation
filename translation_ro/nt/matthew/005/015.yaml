id: MAT.5.15
reference: Matthew 5:15
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οὐδὲ καίουσιν λύχνον καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, καὶ λάμπει πᾶσιν τοῖς ἐν τῇ οἰκίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: ro
  text: Nici oamenii nu aprind o lampă și nu o pun sub un vas de măsurat[a], ci pe un suport pentru lampă, iar ea luminează tuturor celor din casă.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „sub un recipient pentru măsurat”; în mod tradițional, „sub obroc”. Termenul grecesc desemnează o măsură pentru produse uscate și, prin extensie, vasul folosit la măsurare.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Nici nu
  rationale: Leagă acest exemplu negativ de afirmația precedentă și păstrează forța conjunctivă a textului grecesc.
- source_word: καίουσιν λύχνον
  choice: aprind oamenii o lampă
  rationale: În acest context, καίω descrie aprinderea unei lămpi, iar λύχνος indică o lampă concretă, probabil cu ulei. Subiectul generic implicit al pluralului grecesc este redat prin „oamenii”.
- source_word: τιθέασιν αὐτόν
  choice: o pun
  rationale: Redă direct acțiunea coordonată din greacă, fără a o transforma într-o propoziție de scop.
- source_word: ὑπὸ τὸν μόδιον
  choice: sub un vas de măsurat
  rationale: μόδιος desemnează o măsură pentru produse uscate și, prin extensie, recipientul folosit la măsurare. Formularea este mai exactă decât simplul „coș” și mai ușor de înțeles decât termenul tradițional „obroc”.
- source_word: ἀλλ’ ἐπὶ τὴν λυχνίαν
  choice: ci pe un suport pentru lampă
  rationale: λυχνία este suportul pe care se așază lampa. Articolul nehotărât este firesc în română într-o afirmație cu caracter general.
- source_word: λάμπει
  choice: luminează
  rationale: Verbul redă atât strălucirea lămpii, cât și efectul luminii sale asupra celor aflați în casă, fără a adăuga o interpretare figurată.
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: pentru toți cei din casă
  rationale: Păstrează caracterul universal al lui πᾶσιν și sensul spațial al lui οἰκίᾳ.
theological_decisions:
- issue: Subiectul generic la persoana a treia plural nu este exprimat explicit în greacă
  choice: Nici nu aprind oamenii o lampă
  alternative: Nici nu aprinde nimeni o lampă
  rationale: „Oamenii” face explicit caracterul general al afirmației, păstrând totodată pluralul și construcția activă din greacă. Varianta cu „nimeni” este firească, dar reformulează pluralul generic printr-un singular negativ.
- issue: Relația dintre lampă și cei aflați în casă
  choice: ea luminează pentru toți cei din casă
  alternative: ea strălucește pentru toți cei din casă
  rationale: Formularea păstrează imaginea concretă și beneficiul luminii pentru toți, fără a explicita aici semnificația teologică a metaforei din context.
translation_notes:
  register: Română standard modernă, clară și demnă. „Vas de măsurat” evită atât arhaismul „obroc”, cât și impresia nejustificată că recipientul era neapărat un coș. Punctul și virgula evidențiază contrastul dintre ascunderea lămpii și așezarea ei la locul potrivit.
