id: MAT.5.47
reference: Matthew 5:47
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀσπάσησθε τοὺς ⸀ἀδελφοὺς ὑμῶν μόνον, τί περισσὸν ποιεῖτε; οὐχὶ καὶ οἱ ⸀ἐθνικοὶ ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: ro
  text: Și dacă îi salutați numai pe frații voștri[a], ce faceți deosebit[b]? Oare nu fac și neevreii[c] la fel?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „frații și surorile voastre”; greaca spune „frații”, dar termenul se poate referi aici, în sens mai larg, la membrii propriului grup.
    reason: lexical_alternative
  - marker: b
    text: Sau „ce faceți mai mult decât alții?”
    reason: lexical_alternative
  - marker: c
    text: Sau „păgânii”; termenul grecesc îi desemnează aici pe cei din afara comunității iudaice, adică pe neevrei.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: îi salutați
  rationale: Verbul desemnează adresarea unui salut; formularea românească este firească și nu adaugă ideea mai puternică de ospitalitate.
- source_word: ἀδελφοὺς
  choice: frații
  rationale: Păstrează forma masculină plural a grecei, în timp ce nota indică posibilul sens social mai larg.
- source_word: μόνον
  choice: numai
  rationale: Exprimă limpede restrângerea salutului la propriul grup.
- source_word: τί περισσὸν ποιεῖτε
  choice: ce faceți deosebit?
  rationale: Redă concis ideea unei conduite care trece dincolo de ceea ce este obișnuit, păstrând forța întrebării retorice.
- source_word: ἐθνικοὶ
  choice: neamurile
  rationale: Termenul îi desemnează aici pe neevrei; alegerea păstrează contrastul etnic și religios fără a impune nuanța mai polemică a termenului „păgânii”.
- source_word: τὸ αὐτὸ
  choice: la fel
  rationale: Este echivalentul idiomatic românesc al expresiei „a face același lucru” în acest context.
theological_decisions:
- issue: Sfera de referință a lui ἀδελφοὺς
  choice: „frații” în textul principal
  alternative: „frații și surorile” sau membrii propriului grup
  rationale: Forma grecească este masculină plural, dar contextul poate viza mai larg persoanele din cercul propriu; nota păstrează această ambiguitate.
- issue: Sensul lui ἐθνικοὶ
  choice: „neamurile”
  alternative: „păgânii” sau „neevreii”
  rationale: Alegerea păstrează denumirea tradițională și contrastul cu comunitatea iudaică, fără a accentua nejustificat o judecată religioasă.
translation_notes:
  register: Română modernă, clară și demnă. Întrebările retorice sunt păstrate, iar „Oare nu...?” redă natural construcția grecească ce așteaptă un răspuns afirmativ.
