id: MAT.5.11
reference: Matthew 5:11
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: μακάριοί ἐστε ὅταν ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν καὶ εἴπωσιν πᾶν ⸀πονηρὸν καθ’ ὑμῶν ψευδόμενοι ἕνεκεν ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/011.yaml
  text: Blessed are you when they insult you and persecute you and falsely say every kind of evil against you because of me[a][b][c].
translation:
  language: ro
  text: Fericiți sunteți când vă insultă[a], vă persecută și spun, mințind, tot felul de lucruri rele împotriva voastră[b], din cauza mea[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „vă batjocoresc” ori „vă ocărăsc”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „spun orice lucru rău împotriva voastră”.'
    reason: lexical_alternative
  - marker: c
    text: 'Sau: „de dragul meu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί ἐστε
  choice: Fericiți sunteți
  rationale: Păstrează formula solemnă a fericirilor și sensul unei stări de binecuvântare recunoscute de Dumnezeu, fără a o reduce la o simplă emoție de fericire.
- source_word: ὅταν
  choice: când
  rationale: Introduce firesc în română o situație generală sau repetabilă; prezentul verbelor subordonate redă valoarea general-contingentă a construcției grecești.
- source_word: ὀνειδίσωσιν
  choice: vă insultă
  rationale: Redă clar și actual abuzul verbal; «vă ocărăsc» ar fi mai tradițional, dar este mai puțin curent.
- source_word: διώξωσιν
  choice: vă persecută
  rationale: Păstrează amploarea ostilității îndreptate împotriva ucenicilor, fără a o limita la violență fizică, hărțuire socială sau acțiune juridică.
- source_word: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν
  choice: spun ... tot felul de lucruri rele împotriva voastră
  rationale: Redă idiomatic caracterul cuprinzător al expresiei πᾶν πονηρόν și păstrează orientarea ostilă exprimată prin κατά cu genitivul.
- source_word: ψευδόμενοι
  choice: mințind
  rationale: Păstrează explicit forma participială și arată că afirmațiile ostile sunt neadevărate, fără a transforma automat toate afirmațiile în acuzații juridice.
- source_word: ἕνεκεν ἐμοῦ
  choice: din cauza mea
  rationale: 'Exprimă direct motivul opoziției: legătura ucenicilor cu Isus. Alternativa «de dragul meu» poate sugera mai puternic scopul sau beneficiul și este de aceea păstrată în notă.'
theological_decisions:
- issue: Natura opoziției descrise
  choice: Versetul cuprinde insultarea, persecuția și afirmațiile mincinoase îndreptate împotriva ucenicilor din cauza lui Isus.
  alternative: Restrângerea persecuției fie la violență fizică, fie numai la calomnie.
  rationale: Cele trei verbe coordonate descriu forme distincte, dar asociate, de ostilitate. Formularea păstrează această amploare și nu precizează un cadru juridic, social sau fizic absent din text.
translation_notes:
  register: Română standard modernă, clară și demnă. Topica «Fericiți sunteți» păstrează formula recognoscibilă a fericirilor. Prezentul după «când» exprimă natural caracterul general și repetabil al situației, iar repetarea coordonării urmează îndeaproape structura greacă fără a suna rigid.
