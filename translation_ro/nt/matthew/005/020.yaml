id: MAT.5.20
reference: Matthew 5:20
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι ἐὰν μὴ περισσεύσῃ ⸂ὑμῶν ἡ δικαιοσύνη⸃ πλεῖον τῶν γραμματέων καὶ Φαρισαίων, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/020.yaml
  text: For I tell you that unless your righteousness exceeds that of the scribes and Pharisees[a], you will certainly not enter the kingdom of heaven.
translation:
  language: ro
  text: Căci vă spun că, dacă dreptatea voastră nu o va întrece pe cea a cărturarilor și a fariseilor, în niciun caz nu veți intra în Împărăția cerurilor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Căci vă spun
  rationale: „Căci” păstrează valoarea explicativă a lui γάρ, iar „vă spun” redă direct și firesc în româna actuală prezentul λέγω și adresarea ὑμῖν.
- source_word: ἐὰν μὴ
  choice: dacă ... nu
  rationale: Construcția exprimă o condiție negativă necesară. În această frază, „dacă ... nu” este mai firesc decât o formulare rigidă cu „decât dacă” și păstrează limpede raportul condițional.
- source_word: περισσεύσῃ ... πλεῖον
  choice: nu o va întrece pe cea
  rationale: Verbul și comparativul indică depășirea în măsură. Pronumele „o” și expresia „pe cea” arată fără echivoc că dreptatea ucenicilor este comparată cu dreptatea cărturarilor și a fariseilor.
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: dreptatea voastră
  rationale: „Dreptatea” este un echivalent românesc actual și cuprinzător pentru δικαιοσύνη, capabil să exprime atât caracterul drept, cât și conduita conformă voii lui Dumnezeu, fără a impune o nuanță confesională îngustă.
- source_word: γραμματέων
  choice: cărturarilor
  rationale: „Cărturari” este termenul românesc biblic consacrat pentru experții și interpreții Legii desemnați aici prin γραμματεῖς.
- source_word: Φαρισαίων
  choice: fariseilor
  rationale: Este forma românească standard a numelui grupării religioase.
- source_word: οὐ μὴ εἰσέλθητε
  choice: în niciun caz nu veți intra
  rationale: „În niciun caz” redă negația grecească emfatică οὐ μή, iar viitorul românesc exprimă natural forța enunțului.
- source_word: τὴν βασιλείαν τῶν οὐρανῶν
  choice: Împărăția cerurilor
  rationale: Aceasta este redarea românească firească și consacrată a expresiei caracteristice Evangheliei după Matei; pluralul „cerurilor” reflectă forma greacă.
theological_decisions:
- issue: Sensul lui δικαιοσύνη în contextul nepaulin din Matei 5
  choice: dreptatea
  alternative: neprihănirea
  rationale: În acest context, termenul privește viața dreaptă și ascultarea autentică ce trebuie să depășească modelul cărturarilor și al fariseilor. „Dreptatea” păstrează amploarea semantică a termenului grec și este mai transparentă pentru cititorul modern; „neprihănirea” poate sugera mai îngust absența vinei sau a păcatului.
translation_notes:
  register: Registru modern, demn și direct. Sintaxa rămâne apropiată de argumentul grecesc, dar evită calcurile greoaie. Majuscula din „Împărăția” marchează referirea la domnia lui Dumnezeu, conform uzului editorial biblic românesc.
