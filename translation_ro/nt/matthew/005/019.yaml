id: MAT.5.19
reference: Matthew 5:19
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: ro
  text: De aceea, oricine desființează[a] una dintre cele mai mici dintre aceste porunci și îi învață pe oameni să facă la fel va fi numit cel mai mic în Împărăția cerurilor; dar oricine le împlinește și le învață, acela va fi numit mare în Împărăția cerurilor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: „dezleagă”; poate însemna și „slăbește”, „anulează” sau „încalcă”, adică tratează porunca drept neobligatorie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: De aceea
  rationale: Redă firesc legătura de concluzie cu afirmația precedentă despre Lege.
- source_word: λύσῃ
  choice: desființează
  rationale: În contextul poruncilor, verbul indică anularea ori slăbirea caracterului obligatoriu al unei porunci; nota păstrează sensul literal și alternativele posibile.
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: una dintre cele mai mici dintre aceste porunci
  rationale: Păstrează construcția partitivă și ideea unei categorii a poruncilor socotite cele mai mici.
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: îi învață pe oameni să facă la fel
  rationale: οὕτως trimite la acțiunea precedentă, iar ἀνθρώπους are aici sens generic, redat natural prin «oameni».
- source_word: ἐλάχιστος κληθήσεται
  choice: va fi numit cel mai mic
  rationale: Păstrează pasivul lui καλέω și superlativul contextual al lui ἐλάχιστος, fără a transforma afirmația într-una despre excludere.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: în Împărăția cerurilor
  rationale: Este formularea consacrată și idiomatică în română pentru expresia caracteristică lui Matei.
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: le împlinește și îi învață și pe alții să le împlinească
  rationale: «Împlinește» exprimă natural punerea în fapt a poruncilor; obiectul subînțeles al celui de-al doilea verb este făcut explicit pentru claritate.
- source_word: οὗτος
  choice: acela
  rationale: Păstrează accentul demonstrativ și contrastul cu persoana din prima propoziție.
- source_word: μέγας
  choice: mare
  rationale: Este echivalentul direct și menține contrastul cu «cel mai mic».
theological_decisions:
- issue: Statutul de «cel mai mic» sau «mare» în Împărăție
  choice: Formularea descrie comparativ statutul în Împărăție, fără a afirma excluderea sau un sistem tehnic de merite.
  alternative: Interpretarea lui «cel mai mic» ca exclus din Împărăție ori a lui «mare» ca rang tehnic al răsplății.
  rationale: Textul spune explicit «în Împărăția cerurilor»; traducerea păstrează această tensiune fără să soluționeze dezbaterea teologică.
- issue: Referința generică a lui ἀνθρώπους
  choice: «oameni»
  alternative: «bărbați» sau «ceilalți»
  rationale: Substantivul grecesc se referă aici generic la ființe umane; «oameni» este exact, natural și neambiguu în româna modernă.
- issue: Obiectul subînțeles în ποιήσῃ καὶ διδάξῃ
  choice: Poruncile sunt împlinite și predate altora spre împlinire.
  alternative: 'A lăsa al doilea verb fără obiect explicit: «le împlinește și învață».'
  rationale: Contextul furnizează obiectul, iar explicitarea lui evită o formulare românească ambiguă fără să adauge o doctrină.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Formularea păstrează paralelismul și contrastul versetului, evitând atât arhaismele, cât și explicațiile doctrinare introduse în text.
