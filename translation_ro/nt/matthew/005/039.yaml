id: MAT.5.39
reference: Matthew 5:39
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: ro
  text: 'Dar Eu vă spun: să nu vă împotriviți omului rău.[a] Ci, dacă cineva te pălmuiește peste obrazul drept, întoarce-i și celălalt obraz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „să nu vă împotriviți răului”; o altă posibilitate: „să nu vă împotriviți celui rău”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Dar Eu vă spun
  rationale: Păstrează contrastul exprimat prin δέ și formula solemnă, autoritativă; pronumele explicit redă accentul pus pe ἐγώ.
- source_word: μὴ ἀντιστῆναι
  choice: să nu vă împotriviți
  rationale: Redă sensul direct al lui ἀνθίστημι fără a-l restrânge doar la opoziție juridică sau la răzbunare.
- source_word: τῷ πονηρῷ
  choice: omului rău
  rationale: Construcția este ambiguă gramatical, dar exemplul imediat al agresorului uman favorizează aici referința personală generică; celelalte sensuri sunt păstrate în notă.
- source_word: ῥαπίζει
  choice: te pălmuiește
  rationale: Verbul indică o lovire cu mâna, iar contextul obrazului susține sensul precis și firesc „a pălmui”.
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: peste obrazul drept
  rationale: „Obraz” este echivalentul românesc natural în contextul unei palme, iar „peste” redă idiomatic ținta loviturii.
- source_word: ὅστις
  choice: dacă cineva
  rationale: Redă firesc în româna actuală valoarea nedefinită și condițională a construcției.
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: întoarce-i-l și pe celălalt
  rationale: Păstrează verbul concret „a întoarce”; pronumele „-l” face explicit, în mod natural în română, că este vorba despre celălalt obraz.
theological_decisions:
- issue: Sensul expresiei τῷ πονηρῷ
  choice: 'referință personală generică: „omului rău”'
  alternative: 'sens abstract: „răului”; referință personală specifică: „celui rău”'
  rationale: Forma grecească poate fi neutră sau masculină. Exemplul imediat despre cel care pălmuiește favorizează un agresor uman, însă ambiguitatea reală este consemnată în notă.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Alternarea dintre pluralul „vă” în adresarea către audiență și singularul „te/întoarce” în exemplul individual urmează schimbarea din textul grec. Majuscula din „Eu” marchează accentul pronumelui în formularea contrastivă, fără a modifica sensul.
