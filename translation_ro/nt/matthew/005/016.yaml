id: MAT.5.16
reference: Matthew 5:16
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οὕτως λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: ro
  text: Tot așa, să lumineze lumina voastră înaintea oamenilor, pentru ca ei să vadă faptele voastre bune și să-L slăvească pe Tatăl vostru care este în ceruri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Tot așa
  rationale: Leagă îndemnul de imaginea lămpii din versetul precedent și exprimă în mod firesc ideea de manieră.
- source_word: λαμψάτω τὸ φῶς ὑμῶν
  choice: să lumineze lumina voastră
  rationale: Redă imperativul la persoana a treia și păstrează substantivul singular, colectiv, din greacă.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: înaintea oamenilor
  rationale: Formulare românească demnă și firească; „oamenilor” are aici sens generic, referindu-se la ființele umane în general.
- source_word: ὅπως ἴδωσιν
  choice: pentru ca ei să vadă
  rationale: Redă limpede construcția de scop cu conjunctivul, fără a exclude nuanța de rezultat urmărit.
- source_word: τὰ καλὰ ἔργα
  choice: faptele voastre bune
  rationale: „Fapte bune” este echivalentul românesc consacrat și clar pentru lucrări cu valoare morală, păstrând posesivul explicit.
- source_word: δοξάσωσιν
  choice: să-L slăvească
  rationale: „A slăvi” păstrează sensul teologic și registrul demn al verbului δοξάζω; pronumele anticipativ este idiomatic în română.
- source_word: τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς
  choice: pe Tatăl vostru care este în ceruri
  rationale: Păstrează limbajul relațional și pluralul grecesc οὐρανοῖς, care este totodată firesc în română.
theological_decisions:
- issue: Sensul generic al lui ἀνθρώπων
  choice: oamenilor
  alternative: celorlalți / înaintea tuturor
  rationale: Substantivul grecesc îi desemnează aici pe oameni în general, nu numai pe bărbați; românescul „oamenilor” transmite natural acest sens fără adaos explicativ.
- issue: Pluralul οὐρανοῖς
  choice: în ceruri
  alternative: în cer
  rationale: Pluralul sursei este păstrat, fără a-l uniformiza după formula tradițională la singular.
- issue: Relația dintre faptele ucenicilor și slăvirea lui Dumnezeu
  choice: pentru ca ei să vadă... și să-L slăvească
  alternative: astfel încât ei să vadă... și să-L slăvească
  rationale: Construcția păstrează tensiunea de scop/rezultat a lui ὅπως și arată că faptele sunt văzute, dar slava îi este dată Tatălui.
translation_notes:
  register: Română standard modernă, clară și demnă. S-a păstrat cadența memorabilă a propoziției, fără arhaisme inutile; majuscula din pronumele „-L” urmează uzul reverențial românesc.
