id: MAT.5.1
reference: Matthew 5:1
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος· καὶ καθίσαντος αὐτοῦ προσῆλθαν αὐτῷ οἱ μαθηταὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/001.yaml
  text: Seeing the crowds[a], he went up the mountain; and when he sat down[c][b], his disciples came to him.
translation:
  language: ro
  text: Văzând mulțimile, Isus s-a urcat pe munte; iar după ce s-a așezat, ucenicii lui s-au apropiat de el.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν
  choice: Văzând
  rationale: Participiul aorist stabilește împrejurarea acțiunii principale; formularea păstrează legătura participială și este firească în româna actuală.
- source_word: δὲ
  choice: —
  rationale: Particulă de tranziție slabă, care nu necesită aici un corespondent explicit în română.
- source_word: τοὺς ὄχλους
  choice: mulțimile
  rationale: Păstrează pluralul substantivului grec și redă natural grupurile numeroase de oameni.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: s-a urcat pe munte
  rationale: Redă mișcarea ascendentă către zona muntelui într-o formulare românească naturală; articolul grec este reprezentat prin forma articulată „munte” cerută de construcția cu „pe”.
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: iar după ce s-a așezat
  rationale: Genitivul absolut indică o împrejurare temporală anterioară apropierii ucenicilor; „după ce” redă aici limpede succesiunea narativă, fără a adăuga o semnificație ceremonială.
- source_word: προσῆλθαν αὐτῷ
  choice: s-au apropiat de el
  rationale: Redă exact sensul obișnuit al lui προσέρχομαι și sună mai firesc în acest context decât „au venit la el”.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ucenicii lui
  rationale: „Ucenici” este termenul românesc consacrat și exact pentru adepții aflați într-o relație de învățare cu un învățător.
theological_decisions:
- issue: Subiectul neexprimat al verbelor ἀνέβη și καθίσαντος
  choice: Isus
  alternative: el
  rationale: Greaca poate omite pronumele deoarece referentul este recuperabil din context. Într-un verset prezentat izolat, numele „Isus” clarifică referentul fără a schimba sensul.
- issue: Redarea articolului din τὸ ὄρος
  choice: pe munte
  alternative: pe un munte
  rationale: Construcția românească firească păstrează caracterul definit al expresiei grecești, fără a pretinde identificarea unui munte anume.
- issue: Relația temporală din καθίσαντος αὐτοῦ
  choice: după ce s-a așezat
  alternative: când s-a așezat
  rationale: Genitivul absolut permite o relație temporală circumstanțială; aici aoristul și succesiunea acțiunilor susțin „după ce”, dar formularea nu atribuie șederii o semnificație doctrinară suplimentară.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. S-a evitat atât formularea arhaică „noroadele”, cât și verbul mai livresc „a urca/ascende” în construcții nenaturale. Punctuația urmărește cele două mișcări ale frazei grecești.
