id: MAT.5.48
reference: Matthew 5:48
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἔσεσθε οὖν ὑμεῖς τέλειοι ⸀ὡς ὁ πατὴρ ὑμῶν ὁ ⸀οὐράνιος τέλειός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/048.yaml
  text: You[a], therefore, shall be perfect, as your heavenly Father is perfect.
translation:
  language: ro
  text: Voi, așadar, fiți desăvârșiți[a], așa cum Tatăl vostru ceresc este desăvârșit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „deplini”, „întregi” ori „maturi”. Termenul grecesc τέλειος poate desemna deplinătatea sau maturitatea, precum și desăvârșirea.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔσεσθε
  choice: fiți
  rationale: Viitorul indicativ al lui εἰμί are aici valoare imperativă/exortativă. În româna actuală, imperativul „fiți” redă limpede și solemn cerința, fără rigiditatea unei redări literale prin viitor.
- source_word: οὖν
  choice: așadar
  rationale: Păstrează inferența din învățătura precedentă, în special iubirea vrăjmașilor, într-un registru firesc și demn.
- source_word: ὑμεῖς
  choice: subiect inclus în forma verbală „fiți”
  rationale: Persoana a doua plural este exprimată clar de forma verbală românească; introducerea lui „voi” ar produce o emfază mai puternică decât este necesar în acest context.
- source_word: τέλειοι / τέλειός
  choice: desăvârșiți / desăvârșit
  rationale: „Desăvârșit” este echivalentul românesc direct și consacrat, iar repetarea aceluiași termen păstrează corespondența retorică dintre ucenici și Tatăl. Nota indică sensurile contextuale de întregime și maturitate.
- source_word: ὡς
  choice: așa cum
  rationale: Introduce natural comparația și îi păstrează claritatea în română.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Tatăl vostru ceresc
  rationale: Redare românească firească a construcției atributive; majuscula marchează referirea la Dumnezeu.
theological_decisions:
- issue: Sensul lui τέλειος în îndemnul etic
  choice: „desăvârșit” în textul principal, cu o notă despre „deplin”, „întreg” și „matur”
  alternative: „deplin”, „întreg” sau „matur” în textul principal
  rationale: Redarea directă păstrează forța exigentă a afirmației și comparația cu Tatăl, iar nota conservă aria semantică relevantă în contextul iubirii neîmpărțite, fără a transforma traducerea într-o afirmație explicită despre egalitatea metafizică cu Dumnezeu ori într-o definiție doctrinară a impecabilității.
translation_notes:
  register: Română standard modernă, clară și demnă. Imperativul „fiți” redă idiomatic valoarea exortativă a viitorului grecesc; formularea păstrează legătura logică și repetiția lexicală a originalului.
