source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ὀμόσαι ὅλως· μήτε ἐν τῷ οὐρανῷ, ὅτι θρόνος ἐστὶν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: ro
  text: 'Dar Eu vă spun: să nu jurați deloc, nici pe cer, pentru că este tronul lui Dumnezeu;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Dar Eu vă spun
  rationale: Redă contrastul marcat de δέ și accentul pronumelui explicit ἐγώ, într-o formulare românească firească și demnă.
- source_word: μὴ ὀμόσαι ὅλως
  choice: să nu jurați deloc
  rationale: Păstrează direct interdicția și sensul lui ὅλως, „deloc/întru totul”, fără adaos interpretativ.
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: nici pe cer
  rationale: În română, „a jura pe cer” este echivalentul idiomatic al construcției grecești cu ἐν în contextul formulelor de jurământ.
- source_word: ὅτι θρόνος ἐστὶν τοῦ θεοῦ
  choice: pentru că este tronul lui Dumnezeu
  rationale: Redă aici ὅτι cauzal, în acord cu relația argumentativă explicită din propoziție.
theological_decisions:
- issue: Întinderea interdicției privind jurământul
  choice: să nu jurați deloc
  alternative: să nu faceți nicidecum jurăminte
  rationale: Textul păstrează formularea amplă a grecei fără să decidă în traducere dezbaterea teologică despre jurămintele oficiale ori solemne.
- issue: Relația dintre cer și tronul lui Dumnezeu
  choice: pentru că este tronul lui Dumnezeu
  alternative: căci este tronul lui Dumnezeu
  rationale: Se păstrează afirmația metaforică și justificarea dată de text, fără explicații doctrinare suplimentare.
translation_notes:
  register: Română standard modernă, clară și demnă. Majuscula la „Eu” marchează referirea la Isus potrivit uzului editorial românesc, fără a schimba conținutul sursei. Punctuația cu punct și virgulă păstrează continuitatea cu versetul următor.
