id: MAT.5.33
reference: Matthew 5:33
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: ro
  text: 'Din nou, ați auzit că li s-a spus celor din vechime: „Să nu juri strâmb[a], ci să-ți împlinești jurămintele față de Domnul[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „Să nu-ți încalci jurământul”; verbul poate însemna a jura fals sau a încălca un jurământ.
    reason: lexical_alternative
  - marker: b
    text: Sau „față de DOMNUL”, reflectând numele divin al legământului din fundalul Vechiului Testament.
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν
  choice: Din nou
  rationale: Introduce încă un exemplu din seria de contraste și păstrează progresia discursului într-o formulare românească firească.
- source_word: ἠκούσατε
  choice: ați auzit
  rationale: Redă natural aoristul din formula repetată și relevanța celor auzite pentru ascultători.
- source_word: ἐρρέθη
  choice: s-a spus
  rationale: Păstrează construcția pasivă impersonală fără a preciza cine a rostit cuvintele.
- source_word: τοῖς ἀρχαίοις
  choice: celor din vechime
  rationale: Indică generațiile de demult, nu persoane vârstnice, și are un registru demn, dar accesibil.
- source_word: Οὐκ ἐπιορκήσεις
  choice: Să nu juri strâmb
  rationale: Expresia românească păstrează sensul de a jura fals, fără a-l restrânge la categoria juridică modernă a sperjurului; alternativa privind încălcarea jurământului este notată.
- source_word: ἀποδώσεις
  choice: să-ți împlinești
  rationale: În contextul jurămintelor, verbul exprimă ducerea la îndeplinire a obligației asumate.
- source_word: τῷ κυρίῳ
  choice: față de Domnul
  rationale: Identifică referentul divin și exprimă idiomatic în română obligația jurămintelor asumate înaintea lui Dumnezeu.
- source_word: τοὺς ὅρκους σου
  choice: jurămintele
  rationale: Redă concis obiectul verbului; posesia este exprimată natural prin pronumele reflexiv din «să-ți împlinești».
theological_decisions:
- issue: Redarea lui κύριος într-o aluzie la Scripturile lui Israel
  choice: Domnul
  alternative: DOMNUL
  rationale: Textul grec are κυρίῳ, iar formularea este o rezumare/aluzie scripturală, nu o citare explicită a formei ebraice a numelui divin. Alternativa care reflectă fundalul veterotestamentar este păstrată în notă.
- issue: Sfera semantică a verbului ἐπιορκέω
  choice: a jura strâmb
  alternative: a încălca un jurământ
  rationale: Verbul poate desemna atât jurarea falsă, cât și încălcarea jurământului. Textul principal folosește o expresie românească larg inteligibilă, iar ambiguitatea lexicală autentică este păstrată în notă.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. «Din vechime» păstrează tonalitatea scripturală fără arhaizare excesivă, iar «a jura strâmb» este idiomatic și suficient de larg pentru context.
