source:
  edition: SBLGNT
  text: καὶ τῷ θέλοντί σοι κριθῆναι καὶ τὸν χιτῶνά σου λαβεῖν, ἄφες αὐτῷ καὶ τὸ ἱμάτιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/040.yaml
  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: ro
  text: Iar celui care vrea să te dea în judecată[a] și să-ți ia tunica[b], lasă-i și mantia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „să se judece cu tine”. Greaca spune literalmente „să fie judecat”, cu sens juridic în acest context.'
    reason: lexical_alternative
  - marker: b
    text: „Tunica” era veșmântul purtat pe dedesubt, iar „mantia”, veșmântul exterior.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: celui care vrea
  rationale: Participiul articulat desemnează în mod generic o persoană, iar formularea păstrează firesc sensul volitiv al verbului θέλω.
- source_word: σοι κριθῆναι
  choice: să se judece cu tine
  rationale: Formularea românească indică un litigiu și păstrează mai îndeaproape ideea greacă de a ajunge la judecată împreună cu cineva, fără a preciza mai mult decât textul rolurile juridice.
- source_word: χιτῶνά
  choice: tunica
  rationale: χитών desemnează veșmântul purtat pe dedesubt; «tunică» păstrează cadrul istoric și contrastul cu veșmântul exterior.
- source_word: λαβεῖν
  choice: să-ți ia
  rationale: Redă direct dobândirea veșmântului în cadrul litigiului, fără a introduce ideea suplimentară de confiscare violentă.
- source_word: ἄφες
  choice: lasă-i
  rationale: Imperativul lui ἀφίημι exprimă aici cedarea sau îngăduirea păstrării unui bun; «lasă-i» este direct și firesc în română.
- source_word: ἱμάτιον
  choice: mantia
  rationale: ἱμάτιον este veșmântul exterior, distinct de χιτών; «mantie» păstrează atât cadrul antic, cât și contrastul concret dintre cele două haine.
- source_word: καὶ ... καὶ
  choice: iar ... și
  rationale: «Iar» leagă afirmația de contextul precedent, iar «și» păstrează forța aditivă a cedării celui de-al doilea veșmânt.
theological_decisions:
- issue: Forța etică a poruncii lui Isus într-un litigiu
  choice: Porunca este redată direct, ca un act radical de renunțare la represalii și de cedare chiar și a veșmântului exterior.
  alternative: Reducerea formulării la un principiu general și abstract despre renunțarea la drepturi.
  rationale: Imperativul ἄφες și imaginea concretă a celor două veșminte cer păstrarea caracterului incisiv al învățăturii, fără limitarea ei printr-o interpretare doctrinară adăugată.
translation_notes:
  register: Română standard modernă, cu formulare directă și demnă. Termenii vestimentari păstrează cadrul istoric, iar nota explică diferența culturală necesară cititorului modern.
