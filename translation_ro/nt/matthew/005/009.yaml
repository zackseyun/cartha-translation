id: MAT.5.9
reference: Matthew 5:9
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: μακάριοι οἱ εἰρηνοποιοί, ὅτι αὐτοὶ υἱοὶ θεοῦ κληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/009.yaml
  text: Blessed are the peacemakers[a], because they will be called sons of God.
translation:
  language: ro
  text: Fericiți sunt cei care fac pace, pentru că ei vor fi numiți fii ai lui Dumnezeu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „copii ai lui Dumnezeu”. Greaca spune literal „fii ai lui Dumnezeu”, folosind limbaj filial la masculin plural cu sens reprezentativ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Fericiți
  rationale: Formula consacrată și firească în română pentru fericiri; exprimă starea de binecuvântare și favoarea divină, fără a o reduce la o emoție trecătoare.
- source_word: εἰρηνοποιοί
  choice: cei care fac pace
  rationale: 'Redare naturală și ușor de înțeles, care păstrează sensul activ al substantivului compus: persoane care înfăptuiesc sau aduc pacea, nu doar persoane pașnice.'
- source_word: ὅτι
  choice: pentru că
  rationale: Introduce limpede temeiul fericirii și redă direct valoarea cauzală a termenului grecesc în româna actuală.
- source_word: αὐτοὶ
  choice: ei
  rationale: Pronumele explicit păstrează accentul pus în greacă asupra celor care fac pace, fără formularea mai apăsată și mai puțin firească „ei înșiși”.
- source_word: υἱοὶ θεοῦ
  choice: fii ai lui Dumnezeu
  rationale: Păstrează limbajul filial masculin al textului grecesc și posibilele lui rezonanțe teologice, iar sensul reprezentativ și incluziv este explicat în nota de subsol.
- source_word: κληθήσονται
  choice: vor fi numiți
  rationale: Redă direct viitorul pasiv al verbului καλέω, fără a-l restrânge la simpla recunoaștere socială.
theological_decisions:
- issue: Limbajul filial masculin din υἱοὶ θεοῦ
  choice: fii ai lui Dumnezeu
  alternative: copii ai lui Dumnezeu
  rationale: Textul principal păstrează forma masculină plurală a grecei și posibilele implicații ale statutului filial; nota precizează că exprimarea are aici valoare reprezentativă și nu îi exclude pe cei de sex feminin.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea „cei care fac pace” este preferată arhaizantului „făcătorii de pace”, deoarece exprimă firesc acțiunea activă implicată de termenul grecesc.
