  text: καὶ ἀνοίξας τὸ στόμα αὐτοῦ ἐδίδασκεν αὐτοὺς λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/002.yaml
  text: 'And he opened his mouth and taught them[a], saying:'
translation:
  language: ro
  text: 'Și, deschizându-și gura, îi învăța[a], spunând:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, într-o redare mai formală: „Și, după ce și-a deschis gura, îi învăța, spunând:”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Și
  rationale: Păstrează valoarea conectivă simplă a lui καί, fără a introduce o nuanță temporală suplimentară.
- source_word: ἀνοίξας τὸ στόμα αὐτοῦ
  choice: deschizându-și gura
  rationale: Redă participiul aorist și expresia solemnă din textul-sursă într-o formulare românească firească, fără a o reduce interpretativ la „a început să vorbească”.
- source_word: ἐδίδασκεν
  choice: îi învăța
  rationale: Imperfectul românesc păstrează aspectul durativ/imperfectiv al verbului grec, fără a-l restrânge la o valoare exclusiv ingresivă.
- source_word: αὐτοὺς
  choice: îi
  rationale: Pronumele păstrează referința contextuală nedeterminată în acest vers și nu o limitează explicit la ucenici ori la mulțime.
- source_word: λέγων
  choice: spunând
  rationale: Redă transparent participiul prezent care introduce conținutul învățăturii.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu o construcție demnă și apropiată de forma greacă. Expresia „deschizându-și gura” păstrează tonalitatea solemnă, iar imperfectul „îi învăța” conservă aspectul verbal al originalului.
