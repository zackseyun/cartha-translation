id: MAT.5.26
reference: Matthew 5:26
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀμὴν λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ἂν ἀποδῷς τὸν ἔσχατον κοδράντην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/026.yaml
  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: ro
  text: 'Adevărat îți spun: nicidecum nu vei ieși de acolo până nu vei plăti și ultimul codrant.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Codrantul era o monedă romană de valoare foarte mică.
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν
  choice: Adevărat
  rationale: În formula solemnă ἀμὴν λέγω σοι, termenul introduce și întărește afirmația. „Adevărat” redă firesc această forță în româna actuală, fără a păstra netradus „Amin”.
- source_word: λέγω σοι
  choice: îți spun
  rationale: Redă direct și natural formula de adresare la persoana a doua singular.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: nicidecum nu vei ieși
  rationale: Construcția οὐ μή cu conjunctivul aorist exprimă o negație categorică; „nicidecum nu vei ieși” îi păstrează accentul fără formulare arhaică.
- source_word: ἐκεῖθεν
  choice: de acolo
  rationale: Exprimă mișcarea dinspre locul indicat și se îmbină natural cu verbul românesc „a ieși”.
- source_word: ἕως ἂν ἀποδῷς
  choice: până nu vei plăti
  rationale: În română, construcția afirmativă grecească după ἕως se redă idiomatic prin „până nu”; viitorul indică limita viitoare a stării de detenție, iar „a plăti” se potrivește contextului datoriei.
- source_word: τὸν ἔσχατον
  choice: și ultimul
  rationale: „Ultimul” redă sensul de cantitate finală, iar „și” exprimă idiomatic ideea achitării integrale, până la moneda cea mai mică.
- source_word: κοδράντην
  choice: codrant
  rationale: Este păstrată denumirea specifică a monedei romane, adaptată formei românești, în locul unei echivalări cu o monedă modernă înșelătoare; nota explică termenul.
theological_decisions:
- issue: Dacă imaginea detenției pentru datorie trebuie explicitată ca judecată finală, purificare sau simplă situație juridică
  choice: Textul păstrează imaginea concretă a detenției până la achitarea deplină a datoriei.
  alternative: Explicitarea ca metaforă a judecății divine ori ca afirmație despre o purificare de după moarte.
  rationale: Greaca nu precizează aici aplicarea doctrinară. Formularea lasă deschisă tensiunea dintre avertismentul imediat privind împăcarea și posibilele implicații escatologice.
translation_notes:
  register: Română standard modernă, directă și solemnă. Singularul „îți/vei” păstrează adresarea individuală din textul grec. Termenul monetar istoric este explicat prin notă pentru accesibilitate.
