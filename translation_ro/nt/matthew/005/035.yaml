id: MAT.5.35
reference: Matthew 5:35
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: μήτε ἐν τῇ γῇ, ὅτι ὑποπόδιόν ἐστιν τῶν ποδῶν αὐτοῦ· μήτε εἰς Ἱεροσόλυμα, ὅτι πόλις ἐστὶν τοῦ μεγάλου βασιλέως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/035.yaml
  text: nor by the earth[a], because it is the footstool of his feet; nor by Jerusalem, because it is the city of the great King[d][c][b];
translation:
  language: ro
  text: nici pe pământ, pentru că este așternutul picioarelor lui; nici pe Ierusalim[a], pentru că este cetatea marelui Împărat[b][c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, „spre Ierusalim”; aici prepoziția grecească poate avea în mod idiomatic sensul „pe Ierusalim” într-o formulă de jurământ.
    reason: lexical_alternative
  - marker: b
    text: 'Aluzie la Isaia 66:1: „pământul este așternutul picioarelor Mele”.'
    reason: cross_reference
  - marker: c
    text: Aluzie la Psalmul 48:2, unde Ierusalimul este numit „cetatea marelui Împărat”.
    reason: cross_reference
lexical_decisions:
- source_word: μήτε
  choice: nici
  rationale: Continuă în mod firesc seria interdicțiilor din versetul precedent.
- source_word: ἐν τῇ γῇ
  choice: pe pământ
  rationale: În formula de jurământ, româna folosește firesc construcția «a jura pe»; redarea păstrează sensul contextual, nu valoarea locală obișnuită a lui ἐν.
- source_word: γῇ
  choice: pământ
  rationale: Contrastul cu cerul și Ierusalimul indică pământul, nu o țară anume.
- source_word: ὅτι
  choice: pentru că
  rationale: Introduce motivul interdicției într-o formulare clară și actuală.
- source_word: ὑποπόδιόν
  choice: scăunelul
  rationale: Echivalent consacrat și inteligibil pentru suportul picioarelor, păstrând aluzia scripturistică.
- source_word: τῶν ποδῶν αὐτοῦ
  choice: picioarelor lui
  rationale: Păstrează construcția genitivală și lasă referentul pronumelui implicit, ca în greacă.
- source_word: εἰς Ἱεροσόλυμα
  choice: pe Ierusalim
  rationale: În contextul jurământului, εἰς funcționează idiomatic; «a jura pe Ierusalim» este natural în română, iar nuanța prepoziției este consemnată în notă.
- source_word: πόλις
  choice: cetatea
  rationale: «Cetate» păstrează registrul scripturistic demn și se potrivește Ierusalimului în această aluzie la Psalmul 48.
- source_word: τοῦ μεγάλου βασιλέως
  choice: marelui Împărat
  rationale: Redă genitivul și titlul elevat; majuscula indică referirea contextuală la Dumnezeu fără a adăuga un nume explicit.
theological_decisions:
- issue: Referentul lui αὐτοῦ în «scăunelul picioarelor lui»
  choice: Pronumele «lui» este scris cu literă mică, lăsând referentul implicit.
  alternative: «Lui», cu majusculă, pentru a marca explicit referirea la Dumnezeu.
  rationale: Textul grec nu marchează majuscule pronominale; contextul și aluzia la Isaia 66:1 fac referirea suficient de clară.
- issue: Identitatea «marelui Împărat»
  choice: «Împărat» cu majusculă, păstrând titlul aluziv.
  alternative: «împărat», cu literă mică.
  rationale: Aluzia la Psalmul 48:2 și contextul indică un titlu divin; majuscula este firească în ortografia românească, fără a explicita mai mult decât textul.
translation_notes:
  register: Română standard modernă, cu o cadență biblică demnă. «Cetatea» și «scăunelul» păstrează aluziile scripturistice fără a deveni arhaice. Formula «a jura pe» este presupusă din contextul imediat al versetului precedent.
