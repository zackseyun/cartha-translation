  source_fidelity: 'Revizuire necesară: «cei flămânzi și însetați» exprimă în mod firesc o stare, dar participiile prezente grecești πεινῶντες și διψῶντες descriu dorința/actul continuu de a flămânzi și a înseta. «Cei care flămânzesc și însetează» păstrează mai bine acest aspect. «Vor fi săturați» redă adecvat viitorul pasiv χορτασθήσονται, fără a preciza agentul implicit.'
  naturalness: «Fericiți sunt» este formula românească firească și consacrată pentru Fericiri. «Cei care flămânzesc și însetează după dreptate» este idiomatic în româna standard modernă și mai precis decât formularea adjectivală din proiect. «Vor fi săturați» menține imaginea concretă a hrănirii până la sațietate.
  terminology: «Dreptate» este o alegere principală largă și potrivită pentru δικαιοσύνη, putând acoperi atât rectitudinea, cât și dreptatea. Nota actuală include «neprihănire», termen marcat confesional și mai puțin curent în româna standard modernă; este preferabilă o notă neutră care explică aria semantică și păstrează alternativa «justiție».
