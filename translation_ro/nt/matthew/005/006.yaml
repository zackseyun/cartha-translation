  text: μακάριοι οἱ πεινῶντες καὶ διψῶντες τὴν δικαιοσύνην, ὅτι αὐτοὶ χορτασθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: ro
  text: Fericiți sunt cei care flămânzesc și însetează după dreptate[a], pentru că ei vor fi săturați.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „după justiție”. Termenul grecesc poate desemna dreptatea, justiția sau conduita dreaptă înaintea lui Dumnezeu.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Fericiți
  rationale: Formula consacrată și firească în română pentru declarațiile de binecuvântare din Fericiri; exprimă o stare declarată de favoare, nu doar o emoție trecătoare.
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: cei flămânzi și însetați
  rationale: Redă natural participiile prezente și păstrează imaginea unei dorințe puternice și continue.
- source_word: τὴν δικαιοσύνην
  choice: după dreptate
  rationale: Construcția românească idiomatică este „flămânzi și însetați după”; „dreptate” poate cuprinde atât conduita dreaptă înaintea lui Dumnezeu, cât și ideea de justiție, fără a restrânge prematur sensul termenului grec.
- source_word: ὅτι
  choice: pentru că
  rationale: Redă limpede valoarea explicativ-cauzală a conjuncției.
- source_word: αὐτοὶ
  choice: ei
  rationale: Păstrează pronumele explicit și o ușoară urmă a accentului grecesc, fără formularea greoaie „ei înșiși”.
- source_word: χορτασθήσονται
  choice: vor fi săturați
  rationale: Păstrează viitorul pasiv și continuă metafora foamei și a setei mai direct decât „vor fi mulțumiți”.
theological_decisions:
- issue: Sensul lui δικαιοσύνη
  choice: dreptate
  alternative: neprihănire; justiție; ceea ce este drept înaintea lui Dumnezeu
  rationale: Termenul grec are o arie semantică largă, care poate include caracterul și conduita dreaptă, starea de conformitate cu voia lui Dumnezeu și dreptatea în sens social. Textul principal folosește termenul românesc larg „dreptate”, iar nota păstrează explicit această amplitudine.
- issue: Agentul pasivului din χορτασθήσονται
  choice: vor fi săturați
  alternative: Dumnezeu îi va sătura
  rationale: Pasivul poate sugera implicit acțiunea lui Dumnezeu, dar textul grec nu numește agentul; traducerea păstrează această discreție și tensiune teologică.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. „Fericiți sunt” păstrează forma declarativă a Fericirilor, iar „vor fi săturați” menține imaginea concretă și pasivul teologic al originalului.
