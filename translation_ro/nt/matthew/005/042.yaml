id: MAT.5.42
reference: Matthew 5:42
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τῷ αἰτοῦντί σε ⸀δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: ro
  text: Dă-i celui care îți cere, iar celui care vrea să se împrumute de la tine nu-i întoarce spatele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „nu-l refuza pe cel care vrea să ia cu împrumut de la tine”.'
    reason: Alternativă lexicală ce explicitează sensul contextual al imaginii „nu-i întoarce spatele” și redă δανίσασθαι prin expresia alternativă „să ia cu împrumut”.
lexical_decisions:
- source_word: αἰτοῦντί
  choice: celui care îți cere
  rationale: Participiul prezent articulat are valoare substantivală și se referă generic la persoana care cere; formularea este firească în româna actuală și păstrează caracterul general.
- source_word: δός
  choice: Dă-i
  rationale: Imperativul aorist al lui δίδωμι exprimă o poruncă directă. Cliticul „-i” marchează natural în română destinatarul exprimat prin „celui”.
- source_word: θέλοντα
  choice: celui care vrea
  rationale: Participiul prezent articulat este substantival, iar „care vrea” redă firesc sensul lui θέλω fără a adăuga nuanțe.
- source_word: ἀπὸ σοῦ
  choice: de la tine
  rationale: Expresia prepozițională indică sursa împrumutului; „de la tine” este echivalentul românesc obișnuit.
- source_word: δανίσασθαι
  choice: să se împrumute
  rationale: Infinitivul aorist mediu exprimă aici acțiunea de a lua cu împrumut. Formularea nu limitează obiectul la bani, deoarece greaca nu îl precizează.
- source_word: μὴ ἀποστραφῇς
  choice: nu-i întoarce spatele
  rationale: Prohibiția este redată direct, iar expresia păstrează imaginea întoarcerii de la cineva, într-o formă idiomatică și demnă în română.
theological_decisions:
- issue: Întinderea și forța poruncii etice a lui Isus
  choice: Porunca este redată direct, fără atenuare și fără restrângerea categoriei celor care cer sau vor să se împrumute.
  alternative: Interpretarea poruncii ca aplicându-se numai anumitor solicitanți considerați vrednici sau redarea exclusiv interpretativă prin „nu-l refuza”.
  rationale: Textul formulează două îndemnuri generale și directe. Traducerea păstrează forța și deschiderea lor, fără a introduce calificări absente din greacă.
translation_notes:
  register: Română standard modernă, clară și demnă. „Dă-i” și „nu-i întoarce spatele” păstrează caracterul direct al poruncilor; nota oferă lectura mai explicită fără a o impune în text.
