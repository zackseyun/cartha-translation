source:
  edition: SBLGNT
  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: ro
  text: Fii binevoitor față de acuzatorul tău, fără întârziere[a], cât timp ești cu el pe drum, ca nu cumva acuzatorul să te predea judecătorului, iar judecătorul slujbașului, și să fii aruncat în închisoare.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, mai idiomatic în acest context juridic: „Împacă-te repede cu acuzatorul tău.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: Împacă-te
  rationale: În contextul juridic, construcția exprimă o atitudine favorabilă care urmărește rezolvarea conflictului. Formularea românească este firească și păstrează implicația practică, iar sensul lexical mai strict este indicat în nota de subsol.
- source_word: ἀντιδίκῳ / ἀντίδικος
  choice: acuzatorul
  rationale: Termenul desemnează partea adversă într-un litigiu; contextul cu judecătorul, slujbașul și închisoarea susține sensul juridic. „Acuzator” este clar pentru cititorul modern.
- source_word: ταχὺ
  choice: repede
  rationale: Redă direct urgența poruncii într-o română naturală.
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: cât timp ești cu el pe drum
  rationale: Păstrează imaginea concretă a drumului fără a introduce explicit destinația tribunalului, doar sugerată de context.
- source_word: μήποτέ
  choice: ca nu cumva
  rationale: Redă natural în română avertismentul și posibilitatea nedorită exprimate de μήποτε.
- source_word: παραδῷ
  choice: să te dea pe mâna
  rationale: Expresie românească idiomatică pentru predarea unei persoane autorității sau custodiei alteia.
- source_word: κριτῇ / κριτὴς
  choice: judecătorului / judecătorul
  rationale: Echivalentul juridic direct și standard.
- source_word: ὑπηρέτῃ
  choice: slujbașului
  rationale: Desemnează subordonatul oficial care execută hotărârea judecătorului, fără a importa funcția modernă și cultural specifică de „executor” sau „portărel”.
- source_word: εἰς φυλακὴν
  choice: în închisoare
  rationale: Echivalent românesc standard, potrivit gravității avertismentului.
- source_word: βληθήσῃ
  choice: să fii aruncat
  rationale: Păstrează caracterul viu și puternic al verbului βάλλω.
theological_decisions:
- issue: Dacă porunca inițială trebuie redată lexical ca o dispoziție favorabilă sau idiomatic ca ajungere la împăcare
  choice: Împacă-te repede cu acuzatorul tău
  alternative: Fii binevoitor față de acuzatorul tău
  rationale: Sensul lexical de atitudine favorabilă rămâne real, dar în cadrul juridic expresia indică practic rezolvarea conflictului. Textul principal folosește româna idiomatică, iar nota păstrează alternativa mai literală și ambiguitatea lexicală.
translation_notes:
  register: Română standard modernă, clară și demnă. Succesiunea juridică și imaginea concretă a drumului sunt păstrate; formulările excesiv de arhaice ori termenii juridici moderni prea specifici sunt evitați.
