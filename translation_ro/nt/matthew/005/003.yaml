id: MAT.5.3
reference: Matthew 5:3
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Μακάριοι οἱ πτωχοὶ τῷ πνεύματι, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/003.yaml
  text: Blessed are the poor in spirit[c][b][a], because the kingdom of heaven is theirs.
translation:
  language: ro
  text: Fericiți sunt cei săraci în duh[a], pentru că a lor este Împărăția cerurilor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expresia „săraci în duh” poate fi înțeleasă și ca „săraci spiritual” sau ca referire la cei care își recunosc nevoia spirituală; formularea greacă este păstrată fără a-i restrânge sensul.
    reason: alternative_reading
  - marker: b
    text: 'Literal: „Împărăția cerurilor”, expresie caracteristică Evangheliei după Matei; în alte limbi este redată uneori prin singularul „cerului”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: Fericiți
  rationale: „Fericiți” este formularea consacrată și firească în română pentru μακάριοι în contextul Fericirilor; exprimă o stare vrednică de dorit sub favoarea lui Dumnezeu, nu doar o emoție trecătoare.
- source_word: οἱ πτωχοὶ
  choice: cei săraci
  rationale: Redă valoarea substantivală a adjectivului articulat și păstrează sensul de sărăcie/lipsă fără a-l restrânge la cerșetorie.
- source_word: τῷ πνεύματι
  choice: în duh
  rationale: Păstrează expresia compactă și ambiguitatea productivă a dativului grec, fără să o transforme într-o explicație precum „conștienți de nevoia lor spirituală” și fără să indice explicit Duhul Sfânt.
- source_word: ὅτι
  choice: pentru că
  rationale: Introduce clar, în româna actuală, temeiul declarației de fericire.
- source_word: αὐτῶν ἐστιν
  choice: a lor este
  rationale: Păstrează timpul prezent al lui ἐστιν și redă natural posesia, cu accentul pronumelui plasat înaintea verbului în greacă.
- source_word: ἡ βασιλεία
  choice: Împărăția
  rationale: „Împărăția” este termenul biblic românesc firesc și poate cuprinde atât domnia regală, cât și sfera ei; majuscula este o convenție editorială pentru împărăția lui Dumnezeu, nu o precizare doctrinară suplimentară.
- source_word: τῶν οὐρανῶν
  choice: cerurilor
  rationale: Redă pluralul expresiei mateene și este idiomatic în formula românească consacrată „Împărăția cerurilor”.
theological_decisions:
- issue: Sensul expresiei „săraci în duh”
  choice: Păstrarea expresiei „cei săraci în duh” fără dezvoltare interpretativă în text.
  alternative: „cei săraci spiritual”, „cei smeriți” sau „cei care își recunosc nevoia spirituală”
  rationale: Greaca lasă expresia deschisă semantic și teologic; o parafrază ar selecta o singură interpretare pe care textul nu o explicitează.
- issue: Posesia prezentă a Împărăției
  choice: „a lor este”, la timpul prezent
  alternative: „a lor va fi”
  rationale: ἐστιν este la prezent; traducerea nu trebuie să transforme afirmația într-o răsplată exclusiv viitoare.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. S-a păstrat formula biblică bine cunoscută „Fericiți sunt...”, iar topica „a lor este” reflectă accentul sursei și sună natural în registrul solemn. Marcajele de notă apar în text și corespund exact notelor furnizate.
