source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ⸀ὑμῶν καὶ προσεύχεσθε ὑπὲρ ⸀τῶν διωκόντων ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/044.yaml
  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: ro
  text: 'Dar eu vă spun: iubiți-i pe dușmanii voștri și rugați-vă pentru[a] cei care vă persecută.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „rugați-vă în favoarea celor care vă persecută”.'
    reason: Alternativă lexicală care explicitează nuanța lui ὑπέρ cu genitivul.
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Dar Eu vă spun
  rationale: Păstrează contrastul marcat de δέ și accentul explicit al pronumelui ἐγώ, într-o formulare românească firească și demnă.
- source_word: ἀγαπᾶτε
  choice: iubiți-i
  rationale: Redă direct imperativul prezent, fără a supralicita aspectul printr-o formulare precum „continuați să-i iubiți”.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: pe dușmanii voștri
  rationale: Formulare directă și curentă, care păstrează sensul relațional al ostilității.
- source_word: προσεύχεσθε
  choice: rugați-vă
  rationale: Echivalentul românesc firesc al verbului deponent προσεύχομαι, cu forța imperativului păstrată.
- source_word: ὑπὲρ
  choice: pentru
  rationale: În construcția cu genitivul indică rugăciunea pentru binele sau în folosul cuiva; „pentru” este natural și suficient de precis în text.
- source_word: τῶν διωκόντων ὑμᾶς
  choice: cei care vă persecută
  rationale: Păstrează caracterul verbal al participiului prezent și acțiunea ostilă, fără a o transforma într-o etichetă nominală.
theological_decisions:
- issue: Întinderea poruncii privitoare la dușmani
  choice: Cele două imperative sunt redate direct, fără precizarea naturii iubirii sau a conținutului rugăciunii.
  alternative: Extinderea textului pentru a indica în principal fapte binevoitoare, nonrezistență în orice împrejurare ori rugăciune anume pentru binecuvântare, pocăință sau convertire.
  rationale: Versetul poruncește iubirea dușmanilor și rugăciunea pentru persecutori, dar nu definește aici toate implicațiile practice și nici conținutul concret al rugăciunii.
translation_notes:
  register: Română standard modernă, clară și demnă. Majuscula reverențială din „Eu” marchează referirea la Isus, fără adaos interpretativ. „Dușmani” și „persecută” sunt termeni curenți, direcți și ușor de înțeles.
