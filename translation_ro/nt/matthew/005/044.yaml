  source_fidelity: Textul redă fidel cele două imperative (ἀγαπᾶτε, προσεύχεσθε), obiectele lor și sensul lui ὑπέρ cu genitivul. „Dușmanii voștri” și „cei care vă persecută” păstrează relația ostilă și caracterul verbal al participiului. „Dar eu vă spun” exprimă contrastul lui δέ și pronumele emfatic ἐγώ fără a introduce conținut interpretativ.
  naturalness: Formularea este firească în româna standard modernă. Se recomandă minuscula în „eu”, deoarece majuscula reverențială este o convenție confesional-editorială, nu o trăsătură cerută de textul grec. Nota alternativă este mai idiomatică cu „în favoarea” decât cu „în folosul”.
  terminology: „A iubi”, „dușmani”, „a se ruga” și „a persecuta” sunt alegeri precise și potrivite registrului. Nu este necesară explicarea naturii iubirii sau a conținutului rugăciunii.
