  text: Ἠκούσατε ὅτι ἐρρέθη· Οὐ μοιχεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/027.yaml
  text: You have heard that it was said[a], ‘You shall not commit adultery.’
translation:
  language: ro
  text: 'Ați auzit că s-a spus: „Să nu comiți adulter.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Ați auzit
  rationale: Aoristul din formula introductivă este redat firesc în româna actuală prin perfectul compus și păstrează ideea unei învățături deja auzite de destinatari.
- source_word: ὅτι
  choice: că
  rationale: Introduce conținutul celor auzite și corespunde construcției idiomatice românești.
- source_word: ἐρρέθη
  choice: s-a spus
  rationale: Pasivul aorist este redat printr-o construcție reflexiv-pasivă impersonală, naturală și apropiată de formularea greacă.
- source_word: Οὐ μοιχεύσεις
  choice: Să nu comiți adulter
  rationale: Viitorul indicativ grecesc are aici valoare prohibitivă și reproduce porunca din Decalog. Construcția românească cu conjunctivul păstrează forma solemnă de poruncă, iar «a comite adulter» este precis și ușor de înțeles.
theological_decisions:
- issue: Relația cu citatul din Decalog
  choice: Să nu comiți adulter.
  alternative: Nu comite adulter.
  rationale: Forma cu «să nu» este consacrată în redarea românească a poruncilor și păstrează legătura intertextuală fără a adăuga interpretare.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea rămâne apropiată de structura greacă, dar este pe deplin firească în română; nu este necesară o notă pentru «Ați auzit», deoarece perfectul compus redă direct și natural aoristul în acest context.
