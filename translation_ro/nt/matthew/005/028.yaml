id: MAT.5.28
reference: Matthew 5:28
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/028.yaml
  text: But I say to you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart[a][b][c].
translation:
  language: ro
  text: Dar Eu vă spun că oricine se uită la o femeie ca s-o dorească[a][b] a comis deja adulter cu ea în inima lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „ca s-o poftească”.'
    reason: lexical_alternative
  - marker: b
    text: Termenul grecesc tradus prin „femeie” poate însemna și „soție”, în funcție de context.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Dar Eu vă spun
  rationale: „Dar” păstrează contrastul introdus de δέ, iar pronumele exprimat „Eu” redă accentul lui ἐγώ. Formularea este directă, demnă și firească în româna actuală.
- source_word: πᾶς ὁ βλέπων
  choice: oricine se uită
  rationale: Redă caracterul general al construcției fără a introduce în mod nejustificat substantivul „bărbat”. Verbul reflexiv „se uită” exprimă aici privirea intenționată mai natural decât simplul „vede”.
- source_word: γυναῖκα
  choice: o femeie
  rationale: γυνή poate însemna „femeie” sau „soție”, în funcție de context. Enunțul general și lipsa unei precizări explicite privind starea civilă susțin termenul mai larg în textul principal.
- source_word: πρὸς τὸ ἐπιθυμῆσαι αὐτὴν
  choice: ca s-o dorească
  rationale: Construcția românească redă firesc scopul sau intenția exprimată de πρὸς cu infinitivul articulat. „S-o dorească” păstrează amplitudinea lexicală a lui ἐπιθυμέω, iar contextul adulterului arată că este vorba despre dorință sexuală nelegitimă.
- source_word: ἤδη ἐμοίχευσεν αὐτὴν
  choice: a comis deja adulter cu ea
  rationale: „Deja” redă ἤδη, iar expresia consacrată și naturală „a comis adulter cu ea” transmite sensul lui μοιχεύω și relația cu pronumele αὐτήν.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: în inima lui
  rationale: Păstrează imaginea biblică a inimii ca centru al gândurilor, voinței și dorințelor, fără a o reduce printr-o parafrază interpretativă.
theological_decisions:
- issue: Dacă γυνή trebuie redat prin „femeie” sau „soție” în contextul adulterului
  choice: femeie
  alternative: soție
  rationale: Greaca nu precizează explicit starea civilă. „Femeie” păstrează întinderea formulării sursă, în timp ce menționarea adulterului menține gravitatea etică a afirmației.
- issue: Dacă ἐπιθυμέω trebuie redat prin termenul mai larg „a dori” sau prin termenul moral mai încărcat „a pofti”
  choice: a dori
  alternative: a pofti
  rationale: Verbul grec are un domeniu semantic mai larg decât pofta sexuală, deși în acest context indică limpede o dorință sexuală nelegitimă. Textul principal păstrează transparența lexicală, iar alternativa tradițională este consemnată în notă.
- issue: Dacă privirea este descrisă doar ca însoțită de dorință sau ca îndreptată intenționat spre dorință
  choice: ca s-o dorească
  alternative: poftind-o
  rationale: πρὸς τὸ cu infinitivul exprimă scop sau orientare intențională. Traducerea aleasă nu condamnă simpla observare, ci păstrează relația dintre privire și intenția dorinței.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Sintaxa „ca s-o dorească” este naturală și păstrează nuanța de scop a construcției grecești. Majuscula din „Eu” marchează accentul pronumelui explicit și urmează uzul reverențial românesc fără a adăuga conținut doctrinar.
