id: MAT.5.32
reference: Matthew 5:32
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: ro
  text: Dar Eu vă spun că oricine divorțează de soția lui, cu excepția cazului de imoralitate sexuală[a], o face să comită adulter[b]; iar cine se căsătorește cu o femeie divorțată comite adulter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Imoralitate sexuală” traduce termenul grecesc porneia, care desemnează în sens larg conduita sexuală nepermisă; mai poate fi redat prin „desfrânare” sau „necurăție sexuală”.
    reason: lexical_alternative
  - marker: b
    text: Mai literal, „o face să devină adulteră”; infinitivul grecesc are formă pasivă.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: divorțează / femeie divorțată
  rationale: În context matrimonial, ἀπολύω are sensul juridic și relațional de „a divorța”, nu doar sensul general de „a trimite” sau „a elibera”. Aceeași terminologie păstrează legătura dintre cele două forme grecești.
- source_word: γυναῖκα
  choice: soția
  rationale: Deși γυνή poate însemna „femeie” sau „soție”, posesivul și contextul divorțului cer aici sensul de „soție”.
- source_word: παρεκτὸς λόγου πορνείας
  choice: în afară de cazul unei imoralități sexuale
  rationale: παρεκτός introduce o excepție, iar λόγος are aici sensul de „caz” sau „motiv”. „Imoralitate sexuală” redă caracterul larg al lui πορνεία fără a-l restrânge la adulter ori la un singur tip de conduită sexuală nepermisă.
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: o face să comită adulter
  rationale: Construcția ποιέω urmat de infinitiv exprimă cauzarea. Formularea aleasă este firească în româna actuală, iar forma pasivă a infinitivului grecesc și alternativa rezultativă sunt semnalate în nota [b].
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: cine se căsătorește
  rationale: Construcția relativă cu ἐάν exprimă o situație generală nedefinită; „cine se căsătorește” este concis și natural în română.
- source_word: μοιχᾶται
  choice: comite adulter
  rationale: Această redare idiomatică exprimă limpede sensul verbului grecesc fără a forța în română distincția formală de diateză.
- source_word: πᾶς ὁ ἀπολύων
  choice: oricine divorțează
  rationale: Participiul masculin singular are aici valoare generalizatoare. „Oricine” redă această valoare, în timp ce cadrul masculin concret rămâne vizibil prin expresia „soția lui”.
theological_decisions:
- issue: Sensul excepției παρεκτὸς λόγου πορνείας
  choice: 'Redarea ca excepție reală: „în afară de cazul unei imoralități sexuale”.'
  alternative: „în afară de cazul unei căsătorii nelegitime” sau alte restrângeri ale sensului lui πορνεία
  rationale: Textul grecesc formulează explicit o excepție, dar nu definește mai îngust întinderea semantică a lui πορνεία. Traducerea păstrează atât excepția, cât și caracterul larg al termenului, fără a soluționa disputele confesionale privind aplicarea lui.
- issue: Valoarea lui μοιχευθῆναι după ποιεῖ
  choice: 'În textul principal: „o face să comită adulter”, cu nuanța formal pasivă păstrată în nota [b].'
  alternative: „o face să devină adulteră”
  rationale: Infinitivul este pasiv ca formă, iar sensul exact poate fi înțeles activ sau rezultativ. Textul principal urmărește claritatea idiomatică, iar nota păstrează ambiguitatea relevantă și permite verificarea alegerii.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Pronumele „Eu” este scris cu majusculă potrivit convenției editoriale reverențiale. Formulările juridice excesiv de tehnice și vocabularul confesional îngust au fost evitate.
