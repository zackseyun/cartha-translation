  text: Ἐρρέθη ⸀δέ· Ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ, δότω αὐτῇ ἀποστάσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/031.yaml
  text: But it was said[a], ‘Whoever divorces his wife, let him give her a certificate of divorce.’
translation:
  language: ro
  text: 'Dar s-a spus: „Oricine divorțează[a] de soția sa să-i dea un certificat de divorț.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „își lasă soția să plece”. Verbul grecesc poate însemna „a lăsa să plece”, dar aici, în contextul juridic al căsătoriei și al certificatului de divorț, se referă la divorț.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρρέθη
  choice: s-a spus
  rationale: Redă firesc în română aoristul pasiv din formula care introduce citarea unei învățături.
- source_word: δέ
  choice: Dar
  rationale: Marchează tranziția și contrastul cu unitatea precedentă, în acord cu succesiunea antitezelor.
- source_word: Ὃς ἂν
  choice: Oricine
  rationale: Pronumele relativ împreună cu ἄν exprimă o condiție generală nedefinită.
- source_word: ἀπολύσῃ
  choice: își lasă soția
  rationale: În contextul juridic matrimonial verbul se referă la desfacerea căsătoriei; formularea românească păstrează totuși nuanța literală de «a trimite/a lăsa» și este clarificată prin nota de subsol.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: soția
  rationale: γυνή desemnează aici soția, fapt cerut de posesiv și de contextul divorțului; pronumele reflexiv posesiv românesc redă natural relația.
- source_word: δότω
  choice: să-i dea
  rationale: Redă firesc imperativul de persoana a treia și păstrează forma juridică imperativă a citatului.
- source_word: αὐτῇ
  choice: -i
  rationale: Pronumele personal în dativ redă concis și natural sensul «ei».
- source_word: ἀποστάσιον
  choice: un certificat de divorț
  rationale: Termenul denumește documentul scris care atestă divorțul; această formulare este limpede și actuală.
theological_decisions:
- issue: Relația formulării lui Isus cu prevederea mozaică despre divorț
  choice: Afirmația este redată ca citarea unei formule juridice, fără a introduce aici aprobarea sau dezaprobarea ei.
  alternative: O traducere interpretativă care ar prezenta formularea fie drept poruncă susținută de Isus, fie drept simplă descriere a unei practici.
  rationale: Versetul introduce formula tradițională pe care Isus o va aborda în versetul următor; traducerea păstrează tensiunea teologică și nu anticipează concluzia.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Construcția «s-a spus» păstrează formula de citare, iar «să-i dea» redă natural imperativul juridic. Nota conservă paleta semantică a verbului ἀπολύω fără a face textul principal obscur.
