  text: Blessed are the pure in heart[b][a], because they will see God.
translation:
  language: ro
  text: Ferice de cei cu inima curată[a], căci ei Îl vor vedea pe Dumnezeu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „cei curați în inimă”.'
    reason: lexical_alternative
  - marker: b
    text: Promisiunea „Îl vor vedea pe Dumnezeu” poate face referire la accesul nemijlocit la prezența lui Dumnezeu, inclusiv la împlinirea viitoare a acestei promisiuni; traducerea păstrează formularea fără a-i restrânge sensul.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Fericiți
  rationale: Redarea consacrată a macarismelor exprimă starea binecuvântată și vrednică de dorit a celor aflați sub favoarea lui Dumnezeu, fără a o reduce la o emoție trecătoare.
- source_word: καθαροὶ
  choice: curată
  rationale: În construcția românească „cu inima curată”, adjectivul redă puritatea lăuntrică sugerată de context; „curată” este natural și păstrează totodată posibilitatea sensului de curățenie.
- source_word: τῇ καρδίᾳ
  choice: cu inima
  rationale: Dativul de privință este redat idiomatic prin „cu inima”, indicând domeniul în care se manifestă curăția. „Inima” desemnează aici persoana lăuntrică, nu numai afectele.
- source_word: ὅτι
  choice: pentru că
  rationale: Introduce temeiul sau motivul fericirii într-o formulare limpede și actuală.
- source_word: αὐτοὶ
  choice: ei
  rationale: Pronumele explicit păstrează accentul grecesc asupra faptului că tocmai acești oameni vor primi promisiunea, fără formularea mai greoaie „ei înșiși”.
- source_word: τὸν θεὸν
  choice: pe Dumnezeu
  rationale: Complementul direct personal este redat firesc în română cu marca „pe”.
- source_word: ὄψονται
  choice: Îl vor vedea
  rationale: Viitorul verbului ὁράω este păstrat ca promisiune directă, fără extindere interpretativă.
theological_decisions:
- issue: Sensul expresiei „Îl vor vedea pe Dumnezeu”
  choice: Formularea directă este păstrată fără explicație în text.
  alternative: „vor avea acces nemijlocit la prezența lui Dumnezeu” sau „Îl vor contempla pe Dumnezeu la împlinirea viitoare”
  rationale: Expresia poate sugera accesul direct la prezența lui Dumnezeu și împlinirea escatologică, dar greaca rămâne concisă. Traducerea nu restrânge în mod nejustificat profunzimea sau tensiunea teologică a promisiunii.
translation_notes:
  register: Română standard modernă, limpede și demnă. Sintagma „cei cu inima curată” este idiomatică și accesibilă, iar pronumele „ei” păstrează accentul originalului. Majuscula reverențială din „Îl” urmează uzul editorial românesc pentru referirea la Dumnezeu.
