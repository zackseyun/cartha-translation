id: MAT.5.29
reference: Matthew 5:29
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: ro
  text: Dar dacă ochiul tău drept te face să te poticnești[a], smulge-l și aruncă-l departe de tine. Căci este mai bine pentru tine să piară unul dintre mădularele tale decât să fie aruncat întregul tău trup în Gheenă[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „te face să păcătuiești”.'
    reason: lexical_alternative
  - marker: b
    text: Gheena este forma grecească a unui nume asociat cu Valea lui Hinom; termenul este redat tradițional prin „iad”.
    reason: historical_and_translation_note
lexical_decisions:
- source_word: σκανδαλίζει
  choice: te face să te poticnești
  rationale: Păstrează metafora împiedicării din greacă, fără a o restrânge în textul principal la explicația „te face să păcătuiești”.
- source_word: ἔξελε
  choice: scoate-l
  rationale: Redă imperativul hotărât și este firesc în româna actuală în raport cu un ochi; evită formularea arhaică „scoate-l afară”.
- source_word: βάλε ἀπὸ σοῦ
  choice: aruncă-l de la tine
  rationale: Păstrează atât forța verbului βάλλω, cât și ideea separării exprimată prin ἀπὸ σοῦ.
- source_word: συμφέρει
  choice: este mai bine pentru tine
  rationale: Exprimă natural avantajul comparativ implicat în context.
- source_word: ἀπόληται
  choice: să piară
  rationale: Păstrează gravitatea lui ἀπόλλυμι fără a preciza excesiv felul pierderii.
- source_word: μελῶν
  choice: mădularele
  rationale: Termen corporal potrivit și demn, care poate include ochiul și susține contrastul cu întregul trup.
- source_word: βληθῇ
  choice: să-ți fie aruncat
  rationale: Redă pasivul și forța lui βάλλω, iar dativul de interes este exprimat idiomatic prin pronumele „-ți”.
- source_word: γέενναν
  choice: Gheenă
  rationale: Păstrează termenul distinct din greacă și forma consacrată în română, fără a-l uniformiza în textul principal cu termenul teologic mai general „iad”.
- source_word: ὁ δεξιὸς
  choice: drept
  rationale: Păstrează detaliul explicit al sursei.
- source_word: δὲ
  choice: Dar
  rationale: Redă continuarea cu nuanță ușor adversativă față de afirmația precedentă.
theological_decisions:
- issue: Redarea lui γέεννα
  choice: Gheenă
  alternative: iad
  rationale: Menținerea numelui distinct păstrează referința istorică și tensiunea teologică a termenului, fără a introduce automat toate asocierile ulterioare ale cuvântului „iad”.
- issue: Forța metaforică a lui σκανδαλίζω
  choice: te face să te poticnești
  alternative: te face să păcătuiești
  rationale: Textul principal păstrează imaginea grecească a poticnirii; nota explică sensul contextual legat de păcat fără a elimina metafora.
- issue: Caracterul drastic al poruncii
  choice: scoate-l și aruncă-l de la tine
  alternative: îndepărtează-l
  rationale: Formularea păstrează imaginile corporale puternice ale textului și nu le atenuează printr-o parafrază interpretativă.
translation_notes:
  register: Română standard modernă, clară și demnă. „Mădulare” este ușor mai elevat decât „părți ale trupului”, dar rămâne inteligibil și redă precis termenul corporal. Topica urmărește îndeaproape argumentul grecesc, cu ajustări minime pentru naturalețe.
