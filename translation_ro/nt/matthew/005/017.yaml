    rationale: «Legea» este feminin, iar «Profeții» este masculin plural; un pronume masculin plural nu poate relua fără dificultate această coordonare. În plus, originalul grec lasă obiectul nerostit în a doua ocurență. Eliminarea pronumelui este atât fidelă, cât și naturală.
