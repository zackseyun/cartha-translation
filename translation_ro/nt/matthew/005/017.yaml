reference: Matthew 5:17
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/017.yaml
  text: Do not think that I came to abolish the Law or the Prophets[b][a]; I did not come to abolish them but to fulfill them.
translation:
  language: ro
  text: Să nu credeți că am venit să desființez Legea sau Profeții. Nu am venit să desființez, ci să împlinesc.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Să împlinesc” poate fi înțeles și ca „să duc la împlinire” sau „să dau expresie deplină”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Să nu credeți
  rationale: Redă firesc în româna actuală interdicția exprimată prin μή cu aoristul conjunctiv și păstrează tonul direct.
- source_word: ἦλθον
  choice: am venit
  rationale: Perfectul compus este echivalentul românesc natural în acest context pentru aoristul grec și exprimă venirea lui Isus cu relevanță pentru momentul enunțării.
- source_word: καταλῦσαι
  choice: să desființez
  rationale: În asociere cu Legea și Profeții, verbul indică anularea sau înlăturarea autorității lor, nu distrugerea fizică; „a desființa” este clar și curent.
- source_word: τὸν νόμον ἢ τοὺς προφήτας
  choice: Legea sau Profeții
  rationale: Majusculele și formularea păstrează sensul de corpuri recunoscute ale Scripturilor lui Israel.
- source_word: ἀλλὰ πληρῶσαι
  choice: ci să-i împlinesc
  rationale: „A împlini” păstrează amplitudinea semantică și greutatea teologică a lui πληρόω. Pronumele masculin plural se referă gramatical la cei doi termeni coordonați, „Legea” și „Profeții”.
theological_decisions:
- issue: Sensul lui πληρῶσαι în relația lui Isus cu Legea și Profeții
  choice: împlinesc
  alternative: duc la împlinire; aduc la deplina lor expresie; îndeplinesc
  rationale: Formularea nu restrânge verbul la o singură interpretare doctrinară, ci păstrează deschise nuanțele de realizare, aducere la plinătate și exprimare deplină.
translation_notes:
  register: 'Română standard modernă, clară și demnă. „Să nu credeți” este direct și firesc, iar „Legea” și „Profeții” sunt tratate ca denumiri ale corpusurilor scripturale. Nu este necesară o notă pentru timpul verbal: „am venit” este redarea românească naturală, iar alternativa literală engleză „I came/I have come” nu produce în română o distincție echivalentă utilă.'
