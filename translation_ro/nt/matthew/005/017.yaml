  rationale: Revizuirea elimină pronumele obiect care produce un acord gramatical problematic în română. Repetarea implicită a obiectului după «a desființa» și «a împlini» este clară din context și corespunde construcției grecești, unde obiectul nu este repetat explicit. Nota a fost ajustată în consecință, fără a modifica sensul sau a impune o interpretare teologică a lui πληρῶσαι.
