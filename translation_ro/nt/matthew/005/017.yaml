  source_fidelity: 'Sensul de bază este redat fidel: interdicția, venirea lui Isus, contrastul dintre «a desființa» și «a împlini», precum și referința scripturală la Lege și Profeți sunt păstrate. Totuși, pronumele plural masculin «-i» introduce o referință gramatical neadecvată, deoarece «Legea» este feminin; greaca nu conține aici un pronume obiect care să trebuiască redat.'
  naturalness: «Să nu credeți», «am venit» și «a desființa» sunt firești în româna standard contemporană. Omiterea obiectului repetat în a doua propoziție este idiomatică și evită acordul forțat.
