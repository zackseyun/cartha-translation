  text: ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/037.yaml
  text: But let your word be[a], ‘Yes, yes,’ or ‘No, no.’ Anything beyond these is from the evil one.
translation:
  language: ro
  text: 'Iar cuvântul vostru să fie: „Da, da” sau „Nu, nu”. Orice este în plus față de acestea vine de la cel rău.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „vine din rău”. Expresia grecească τοῦ πονηροῦ poate fi înțeleasă fie personal („cel rău”), fie impersonal („rău”).'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω
  choice: să fie
  rationale: Redă firesc în română imperativul prezent la persoana a treia și păstrează caracterul de îndemn.
- source_word: λόγος
  choice: cuvântul
  rationale: În context se referă la ceea ce spune cineva; „cuvântul vostru” păstrează formularea concisă și proverbială.
- source_word: ναὶ ναί, οὒ οὔ
  choice: „Da, da” sau „Nu, nu”
  rationale: Păstrează dublarea emfatică și ritmul textului grec, iar „sau” exprimă firesc contrastul în română.
- source_word: τὸ δὲ περισσὸν τούτων
  choice: Orice este în plus față de acestea
  rationale: Redă folosirea substantivală a adjectivului și raportarea demonstrativului plural la cele două răspunsuri precedente.
- source_word: ἐκ
  choice: vine de la
  rationale: Exprimă limpede sursa sau originea indicată de prepoziția grecească.
- source_word: τοῦ πονηροῦ
  choice: cel rău
  rationale: Articolul și adjectivul substantivizat permit sensul personal; în uzul mateian acesta este probabil, fără ca sensul impersonal să fie exclus.
theological_decisions:
- issue: Dacă τοῦ πονηροῦ are sens impersonal („rău”) sau personal („cel rău”)
  choice: cel rău
  alternative: rău
  rationale: Construcția grecească este ambiguă, însă în Matei ὁ πονηρός are adesea referință personală. Sensul alternativ este păstrat în nota de subsol pentru a nu elimina ambiguitatea autentică.
translation_notes:
  register: Română standard modernă, concisă și demnă. Dublarea „Da, da” / „Nu, nu” este menținută pentru fidelitate și forță proverbială.
