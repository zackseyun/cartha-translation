id: MAT.5.12
reference: Matthew 5:12
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: ro
  text: Bucurați-vă și tresăltați de bucurie, pentru că răsplata voastră este mare în ceruri; căci tot așa i-au persecutat pe profeții care au fost înaintea voastră.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρετε
  choice: Bucurați-vă
  rationale: Imperativul prezent, la persoana a doua plural, cheamă la o bucurie activă; formularea este firească, clară și consacrată în română.
- source_word: ἀγαλλιᾶσθε
  choice: tresăltați de bucurie
  rationale: Verbul exprimă o bucurie intensă și exuberantă. Formularea păstrează intensificarea față de simplul „Bucurați-vă”, într-un registru demn și inteligibil.
- source_word: μισθὸς
  choice: răsplata
  rationale: În context desemnează răsplătirea oferită de Dumnezeu, nu o plată salarială în sens strict.
- source_word: πολὺς
  choice: mare
  rationale: Adjectivul indică amploarea răsplății, iar „răsplata este mare” este o construcție idiomatică în română.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: în ceruri
  rationale: Păstrează pluralul grecesc și este totodată o exprimare naturală în română.
- source_word: οὕτως
  choice: tot așa
  rationale: Redă corespondența de mod dintre persecutarea ucenicilor și cea a profeților.
- source_word: ἐδίωξαν
  choice: i-au persecutat
  rationale: Contextul cere sensul ostil al verbului διώκω, nu sensul general de urmărire.
- source_word: τοὺς προφήτας
  choice: pe profeții
  rationale: Este echivalentul românesc direct și uzual pentru profeții lui Israel; marca obiectului personal este necesară idiomatic.
- source_word: τοὺς πρὸ ὑμῶν
  choice: dinaintea voastră
  rationale: Exprimă concis precedența istorică a profeților față de destinatari, fără a adăuga informații inexistente în text.
theological_decisions:
- issue: Sensul expresiei „în ceruri”
  choice: Păstrarea pluralului și referirea la sfera cerească în care se află răsplata ucenicilor.
  alternative: „în cer”, cu singular colectiv și idiomatic
  rationale: Pluralul grecesc poate reflecta uzul semitic caracteristic lui Matei, iar româna acceptă firesc pluralul „ceruri”; astfel, forma sursă este păstrată fără impunerea unei cosmologii stratificate.
- issue: Caracterul „răsplății”
  choice: „răsplată”, în sensul recompensei acordate de Dumnezeu
  alternative: „plată” sau „salariu”
  rationale: Termenul grec poate avea un sens salarial, dar contextul persecuției pentru credincioșie indică răsplătirea divină; traducerea nu definește mecanismul teologic al acesteia.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. Paralelismul celor două imperative și pluralul „ceruri” au fost păstrate, iar ordinea propozițiilor urmează îndeaproape textul grec fără a suna rigid.
