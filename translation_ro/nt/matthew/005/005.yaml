  text: μακάριοι οἱ πραεῖς, ὅτι αὐτοὶ κληρονομήσουσι τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/005.yaml
  text: Blessed are the meek[b][a], because they will inherit the earth.
translation:
  language: ro
  text: Fericiți sunt cei blânzi[a], pentru că ei vor moșteni pământul[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „cei blajini”; aici blândețea nu înseamnă slăbiciune, ci o atitudine smerită și stăpânită.
    reason: lexical_alternative
  - marker: b
    text: Sau „țara”; expresia trimite probabil la Psalmul 37:11, unde promisiunea poate fi înțeleasă atât ca referire la țară, cât și într-un sens mai larg.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Fericiți
  rationale: Redarea consacrată a fericirilor în română; exprimă starea celor aflați sub favoarea lui Dumnezeu, fără a se limita la o emoție trecătoare.
- source_word: οἱ πραεῖς
  choice: cei blânzi
  rationale: πραΰς indică blândețe smerită și stăpânită, nu slăbiciune sau timiditate; substantivizarea prin articol este redată natural prin „cei blânzi”.
- source_word: ὅτι
  choice: pentru că
  rationale: Introduce temeiul afirmației și este limpede în româna actuală.
- source_word: αὐτοὶ
  choice: ei
  rationale: Păstrează accentul pronumelui grecesc fără formularea mai greoaie „ei înșiși”.
- source_word: κληρονομήσουσι
  choice: vor moșteni
  rationale: Redă direct sensul primirii unei moșteniri și păstrează ecoul limbajului promisiunii.
- source_word: τὴν γῆν
  choice: pământul
  rationale: În română, „pământul” poate desemna atât întregul pământ, cât și o țară sau un teritoriu, păstrând deschisă ambiguitatea grecescului γῆ și ecoul probabil din Psalmul 37:11.
theological_decisions:
- issue: Întinderea sensului expresiei τὴν γῆν
  choice: pământul
  alternative: țara
  rationale: γῆ poate avea sens universal („pământul”) sau teritorial, legat de promisiunea țării. Textul principal folosește termenul românesc mai larg, iar nota semnalează alternativa fără a elimina tensiunea dintre ecoul legământului și împlinirea mai cuprinzătoare.
translation_notes:
  register: Română standard modernă, cu formulare simplă și demnă. S-a păstrat structura compactă a fericirii și s-au evitat atât arhaismele, cât și explicarea doctrinară în textul principal.
