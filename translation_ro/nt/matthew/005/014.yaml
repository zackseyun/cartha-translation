  source_fidelity: Prima propoziție redă fidel Ὑμεῖς ἐστε τὸ φῶς τοῦ κόσμου. A doua păstrează imposibilitatea exprimată de οὐ δύναται și sensul locativ al lui ἐπάνω ὄρους κειμένη. „Pe un munte” este o redare legitimă și mai literală a lui ὄρος decât alternativa engleză „pe un deal”.
  naturalness: „O cetate” este inteligibil și tradițional în limbaj biblic, dar în româna standard modernă desemnează în primul rând o fortificație sau o reședință fortificată. „Un oraș” este echivalentul uzual și neîncărcat al lui πόλις. „Situat” redă natural participiul κειμένη în acest context.
  terminology: '„Lumina lumii” este formularea firească și fidelă. Înlocuirea lui „cetate” cu „oraș” evită o nuanță fortificată necerută de πόλις și păstrează registrul modern standard. Nu este necesară notă: textul românesc principal redă deja „munte”, iar „situat” transmite sensul participiului fără a introduce interpretare.'
  issues:
