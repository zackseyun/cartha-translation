  text: Ὑμεῖς ἐστε τὸ φῶς τοῦ κόσμου. οὐ δύναται πόλις κρυβῆναι ἐπάνω ὄρους κειμένη·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: ro
  text: Voi sunteți lumina lumii. Un oraș situat pe un munte nu poate fi ascuns.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Voi
  rationale: Pronumele de persoana a doua plural este explicit și emfatic în greacă; româna permite redarea firească a accentului prin pronumele explicit „Voi”.
- source_word: τὸ φῶς
  choice: lumina
  rationale: Articolul grecesc este redat natural prin forma articulată „lumina”, păstrând metafora directă.
- source_word: τοῦ κόσμου
  choice: lumii
  rationale: Genitivul este redat formal și firesc prin „lumii”, fără transformarea lui în mai interpretativul „pentru lume”.
- source_word: οὐ δύναται
  choice: nu poate
  rationale: Redare idiomatică a imposibilității exprimate de verbul δύναμαι negat.
- source_word: πόλις
  choice: O cetate
  rationale: „Cetate” evocă natural în română o așezare urbană antică, vizibilă și adesea fortificată, fără a reduce πόλις la un simplu sat.
- source_word: κρυβῆναι
  choice: fi ascunsă
  rationale: Infinitivul aorist pasiv este redat direct, păstrând vocea pasivă.
- source_word: ἐπάνω ὄρους
  choice: pe un munte
  rationale: ὄρος denumește o înălțime, în mod obișnuit un munte; „pe un munte” păstrează mai îndeaproape formularea greacă, fără a o restrânge la „deal”.
- source_word: κειμένη
  choice: așezată
  rationale: Participiul indică poziționarea sau situarea cetății; „așezată” este natural și demn în româna actuală.
theological_decisions:
- issue: Identificarea metaforică a ucenicilor drept lumină
  choice: „Voi sunteți lumina lumii”
  alternative: „Voi sunteți lumină pentru lume”
  rationale: Metafora nominală directă și genitivul din greacă sunt păstrate fără explicație doctrinară sau reformulare funcțională.
translation_notes:
  register: Română standard modernă, cu formulare clară și solemnă. „Cetate” păstrează coloratura cadrului antic, iar „pe un munte” urmează sensul lexical direct al lui ὄρος. Nu este necesară o notă de subsol, deoarece traducerea principală redă literal și natural construcția greacă.
