id: MAT.5.4
reference: Matthew 5:4
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: μακάριοι οἱ πενθοῦντες, ὅτι αὐτοὶ παρακληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/004.yaml
  text: Blessed are those who mourn[a], because they will be comforted.
translation:
  language: ro
  text: Fericiți sunt cei ce plâng[a], pentru că ei vor fi mângâiați.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „cei ce se întristează”. Verbul grecesc are un sens larg și nu precizează cauza plângerii.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Fericiți
  rationale: Păstrează formula consacrată a fericirilor și forța ei evaluativă, indicând starea de favoare recunoscută de Dumnezeu, nu doar o emoție subiectivă.
- source_word: οἱ πενθοῦντες
  choice: cei ce plâng
  rationale: Redă participiul articulat ca grup de persoane într-o formulare românească naturală. Verbul rămâne suficient de larg pentru a cuprinde doliul, suferința, regretul sau lamentarea, fără a preciza cauza.
- source_word: ὅτι
  choice: pentru că
  rationale: Exprimă limpede raportul cauzal sau temeiul fericirii în româna actuală.
- source_word: αὐτοὶ
  choice: ei
  rationale: Păstrează pronumele explicit și ușor emfatic din greacă fără emfaza excesivă pe care ar produce-o «ei înșiși».
- source_word: παρακληθήσονται
  choice: vor fi mângâiați
  rationale: Redă natural viitorul pasiv și sensul contextual de primire a mângâierii sau alinării.
theological_decisions:
- issue: Sfera plângerii din fericire
  choice: 'Formulare largă: «cei ce plâng», fără precizarea cauzei.'
  alternative: «cei ce își plâng păcatele», «cei îndoliați» sau «cei care deplâng starea lui Israel»
  rationale: Textul grec nu precizează obiectul sau cauza plângerii. Redarea largă păstrează deschiderea teologică și pastorală a afirmației și nu introduce în text o interpretare confesională restrânsă.
translation_notes:
  register: Română standard modernă, clară și demnă. «Fericiți» și «mângâiați» păstrează formularea biblică recognoscibilă fără a deveni arhaică.
