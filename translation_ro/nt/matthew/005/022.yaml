id: MAT.5.22
reference: Matthew 5:22
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: ro
  text: 'Dar Eu vă spun că oricine se mânie pe fratele său[a] va fi pasibil de judecată; iar cine îi spune fratelui său: „Raca”[b][d] va răspunde în fața consiliului[c]; și cine spune: „Nebunule!” va fi pasibil de Gheena focului[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Unele manuscrise adaugă „fără motiv” după „se mânie pe fratele său”. Lectura cea mai veche și mai bine atestată omite aceste cuvinte.
    reason: textual_variant
  - marker: b
    text: „Raca” este un termen aramaic de dispreț, cu sensul aproximativ de „cap sec” sau „om de nimic”.
    reason: cultural_note
  - marker: c
    text: Sau „Sinedriului”, consiliul suprem iudaic.
    reason: alternative_reading
  - marker: d
    text: „Frate” traduce un termen masculin singular care poate avea funcție reprezentativă; afirmația nu se limitează la frații de sex masculin.
    reason: lexical_alternative
  - marker: e
    text: Sau „iadul de foc”. „Gheena” păstrează termenul specific folosit de Isus, derivat din imaginea Văii lui Hinom și asociat cu judecata.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Dar Eu vă spun
  rationale: Păstrează contrastul și accentul pronumelui explicit ἐγώ, într-o formulare românească firească și demnă.
- source_word: πᾶς ὁ ὀργιζόμενος
  choice: oricine se mânie
  rationale: Redă caracterul general al participiului substantivizat la prezent fără a preciza excesiv durata sau debutul mâniei.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: pe fratele său
  rationale: Construcția românească „a se mânia pe” redă natural dativul asociat verbului; substantivul masculin singular este păstrat, iar funcția lui reprezentativă este explicată în notă.
- source_word: ἔνοχος ἔσται
  choice: va fi pasibil de
  rationale: Exprimă expunerea la răspundere ori pedeapsă și susține paralelismul juridic al celor trei avertismente.
- source_word: τῇ κρίσει
  choice: judecată
  rationale: Păstrează deschis dacă termenul indică actul judecății sau un for judiciar, fără a-l restrânge nejustificat la un tribunal local.
- source_word: Ῥακά
  choice: Raca
  rationale: Păstrează prin transliterare insulta aramaică transmisă în textul grec; sensul aproximativ este oferit în notă.
- source_word: τῷ συνεδρίῳ
  choice: judecata Sinedriului
  rationale: În contextul juridic, συνέδριον desemnează consiliul înaintea căruia cineva răspunde. „Sinedriu” este termenul românesc consacrat, iar nota păstrează alternativa generică „consiliu”.
- source_word: Μωρέ
  choice: Nebunule!
  rationale: Vocativul redă direct insulta și păstrează forța morală a termenului fără asocierea modernă improprie a unui diagnostic.
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: pasibil de Gheena focului
  rationale: „Gheena” conservă termenul istorico-religios specific, iar „focului” păstrează genitivul și imaginea judecății.
theological_decisions:
- issue: Redarea termenului γέεννα
  choice: Gheena
  alternative: iadul de foc
  rationale: Păstrează fundalul iudaic al Văii lui Hinom și nu transferă automat asupra textului toate conotațiile teologice ulterioare ale cuvântului „iad”.
- issue: Sfera lui ἀδελφός
  choice: fratele său
  alternative: fratele sau sora sa / semenul său
  rationale: Se păstrează forma masculină singulară a sursei, fără a nega folosirea ei reprezentativă, explicată în nota aferentă.
- issue: Varianta textuală εἰκῇ
  choice: omisiune din textul principal
  alternative: „fără motiv” după „se mânie pe fratele său”
  rationale: Textul SBLGNT urmat nu include adverbul; varianta este semnalată fără a limita în text avertismentul lui Isus.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Paralelismul juridic al versetului este păstrat prin repetarea formulei „va fi pasibil de”. Termenii culturali specifici „Raca”, „Sinedriu” și „Gheena” sunt conservați și explicați succint în note.
