  text: μακάριοι οἱ ἐλεήμονες, ὅτι αὐτοὶ ἐλεηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/007.yaml
  text: Blessed are the merciful[a], for they will be shown mercy.
translation:
  language: ro
  text: Fericiți sunt cei milostivi, căci lor li se va arăta milă.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: Fericiți
  rationale: Termenul consacrat în română pentru formularea Fericirilor; exprimă starea favorabilă a celor aflați sub binecuvântarea lui Dumnezeu, nu doar o emoție trecătoare.
- source_word: οἱ ἐλεήμονες
  choice: cei milostivi
  rationale: Articolul și adjectivul au valoare substantivală. «Cei milostivi» este firesc și demn în româna actuală și păstrează legătura lexicală cu «milă» din promisiune.
- source_word: ὅτι
  choice: pentru că
  rationale: Redă limpede valoarea cauzală a conjuncției în româna contemporană.
- source_word: αὐτοὶ
  choice: ei
  rationale: Pronumele explicit păstrează accentul pus de greacă asupra corespondenței dintre cei milostivi și cei care vor avea parte de milă.
- source_word: ἐλεηθήσονται
  choice: vor avea parte de milă
  rationale: Redă idiomatic viitorul pasiv și păstrează ecoul lexical dintre «milostivi» și «milă», fără a preciza agentul neexprimat în greacă.
theological_decisions:
- issue: Identitatea celui care acordă mila promisă
  choice: 'Agentul rămâne neprecizat: «vor avea parte de milă».'
  alternative: «Dumnezeu va avea milă de ei»
  rationale: Contextul poate sugera acțiunea lui Dumnezeu, dar forma pasivă grecească nu numește agentul; traducerea păstrează această rezervă și tensiunea teologică a textului.
translation_notes:
  register: Formulare concisă, solemnă și ușor de înțeles, potrivită stilului proverbial al Fericirilor. «Fericiți» urmează uzul biblic românesc consacrat, iar «vor avea parte de milă» este natural în limba actuală.
