  source_fidelity: Textul redă fidel propoziția emfatică inițială, metafora „sarea pământului”, condiționalul referitor la sarea care își pierde caracterul sărat, întrebarea despre resărare, inutilitatea ei și finalul cu aruncarea afară și călcarea de către oameni. „Își pierde gustul” este un echivalent idiomatic adecvat pentru μωρανθῇ în contextul sării. „Din nou” face explicită doar implicația imediată a întrebării și nu schimbă sensul.
  naturalness: Româna este standard, fluentă și potrivit de sobră. „Călcată în picioare de oameni” este natural și redă bine imaginea lui καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων. Construcția „Nu mai este bună la nimic decât să fie...” este acceptabilă și clară în registrul acestui text.
  terminology: „Sarea pământului”, „își pierde gustul”, „aruncată afară” și „de oameni” sunt alegeri exacte și naturale. „Oameni” exprimă referința umană generică a lui ἀνθρώπων fără a introduce o restrângere de gen. Nu este necesară o notă de subsol pentru această formulare românească.
