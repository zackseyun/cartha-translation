id: MAT.5.13
reference: Matthew 5:13
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: ro
  text: Voi sunteți sarea pământului. Dar, dacă sarea își pierde gustul, cu ce va fi sărată din nou? Nu mai este bună la nimic decât să fie aruncată afară și călcată în picioare de oameni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Voi
  rationale: Pronumele explicit este emfatic; „Voi” redă firesc accentul în română.
- source_word: τὸ ἅλας τῆς γῆς
  choice: sarea pământului
  rationale: Redare consacrată și firească; γῆ are aici sensul larg de „pământ”.
- source_word: μωρανθῇ
  choice: își pierde gustul
  rationale: Cu referire la sare, verbul descrie pierderea gustului sau a caracterului sărat; formularea evită sensul literal nepotrivit „devine nebună”.
- source_word: ἐν τίνι ἁλισθήσεται;
  choice: cu ce va fi sărată din nou?
  rationale: Păstrează întrebarea despre mijlocul prin care sarea ar putea redeveni sărată; „din nou” explicitează natural implicația contextuală.
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: Nu mai este bună la nimic
  rationale: Redă idiomatic lipsa totală de utilitate sau eficacitate.
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: decât să fie aruncată afară
  rationale: Păstrează atât construcția de excepție, cât și sensul spațial al lui ἔξω.
- source_word: καταπατεῖσθαι
  choice: călcată în picioare
  rationale: Echivalent românesc viu și firesc pentru ideea de a fi călcată și strivită sub picioare.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: de oameni
  rationale: ἀνθρώπων îi desemnează generic pe oameni; românescul „oameni” este exact, natural și nu restrânge referința la bărbați.
theological_decisions:
- issue: Sensul metaforic al lui μωρανθῇ aplicat sării
  choice: își pierde gustul
  alternative: devine nesărată / își pierde puterea de a săra
  rationale: Alegerea păstrează imaginea sării devenite insipide fără a transfera aici sensul cognat de „a deveni nebun” și fără a explica excesiv metafora.
- issue: Referința generic umană în ὑπὸ τῶν ἀνθρώπων
  choice: de oameni
  alternative: de către ființe omenești
  rationale: Expresia greacă are referință umană generală, nu exclusiv masculină; „de oameni” păstrează acest sens direct în româna modernă.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formularea urmărește îndeaproape structura și metafora greacă, dar folosește expresii românești naturale.
