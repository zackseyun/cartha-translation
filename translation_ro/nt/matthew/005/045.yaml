source:
  edition: SBLGNT
  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: ro
  text: ca să deveniți fii ai Tatălui vostru din ceruri[a], pentru că El face să răsară soarele Lui peste cei răi și peste cei buni și trimite ploaie peste cei drepți și peste cei nedrepți[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greacă: „fii” (masculin plural) și „în ceruri” (plural). „Copii ai Tatălui vostru” redă posibilul sens reprezentativ, dar textul principal păstrează limbajul filial al sursei.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „face să plouă peste cei drepți și peste cei nedrepți”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: ca să
  rationale: Redă firesc în româna actuală valoarea de scop, fără a exclude nuanța contextuală de rezultat.
- source_word: γένησθε
  choice: să deveniți
  rationale: Păstrează sensul dinamic al lui γίνομαι, în loc să-l reducă la staticul „să fiți”.
- source_word: υἱοὶ
  choice: fii
  rationale: Redă termenul masculin explicit și păstrează limbajul filial al sursei; în context, desemnarea îi cuprinde pe discipoli în general.
- source_word: τοῦ πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: ai Tatălui vostru care este în ceruri
  rationale: Păstrează construcția explicită a grecei, fără a absorbi locuțiunea în adjectivul „ceresc”; pluralul „ceruri” este consacrat și firesc în registrul biblic românesc.
- source_word: ὅτι
  choice: pentru că
  rationale: Introduce limpede temeiul explicativ al afirmației precedente.
- source_word: τὸν ἥλιον αὐτοῦ ἀνατέλλει
  choice: face să răsară soarele Lui
  rationale: Păstrează posesivul explicit și exprimă natural valoarea cauzativă, precum și acțiunea lui Dumnezeu.
- source_word: ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: peste cei răi și peste cei buni
  rationale: Adjectivele substantivizate sunt redate explicit și simetric, într-o formulare românească naturală.
- source_word: βρέχει
  choice: trimite ploaie
  rationale: Redă idiomatic verbul și menține explicită acțiunea providențială a lui Dumnezeu; sensul mai literal este semnalat în notă.
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: peste cei drepți și peste cei nedrepți
  rationale: Păstrează perechea morală tradițională δίκαιος/ἄδικος și paralelismul propoziției.
theological_decisions:
- issue: Limbajul filial marcat de gen
  choice: fii ai Tatălui vostru
  alternative: copii ai Tatălui vostru
  rationale: Greaca are υἱοί, nu τέκνα. „Fii” conservă formularea sursei, iar nota lămurește sensul reprezentativ fără să elimine limbajul filiației.
- issue: Forța lui γένησθε în raport cu filiația divină
  choice: să deveniți
  alternative: să fiți / să vă dovediți
  rationale: Este păstrată forța lexicală dinamică, fără a introduce ideea că fapta descrisă constituie prin ea însăși un mecanism al adopției mântuitoare; contextul accentuează asemănarea cu generozitatea Tatălui.
- issue: Exprimarea acțiunii divine în βρέχει
  choice: trimite ploaie
  alternative: face să plouă / plouă peste
  rationale: Formularea este naturală în română și păstrează agentul divin, fără a preciza mai mult decât afirmă textul.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Paralelismul și opozițiile morale ale grecei sunt păstrate, iar pronumele referitor la Dumnezeu este scris cu majusculă conform uzului editorial românesc.
