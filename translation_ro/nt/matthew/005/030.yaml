id: MAT.5.30
reference: Matthew 5:30
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ εἰ ἡ δεξιά σου χεὶρ σκανδαλίζει σε, ἔκκοψον αὐτὴν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου ⸂εἰς γέενναν ἀπέλθῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: ro
  text: Și, dacă mâna ta dreaptă te face să te poticnești[a], taie-o și arunc-o de la tine! Căci este mai bine pentru tine să piară unul dintre mădularele tale decât să se ducă tot trupul tău în Gheenă[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „te face să păcătuiești”. Verbul grecesc înseamnă literal „a face să se poticnească”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „iad”. „Gheena” este un termen provenit din numele Văii Hinomului și este folosit cu referire la judecata escatologică.'
    reason: alternative_reading
lexical_decisions:
- source_word: δεξιά ... χείρ
  choice: mâna ta dreaptă
  rationale: Formulare românească firească, ce păstrează precizia imaginii corporale și paralelismul din context.
- source_word: σκανδαλίζει
  choice: te face să te poticnești
  rationale: Păstrează metafora grecească a poticnirii, care în context indică ajungerea în păcat; sensul contextual este precizat în nota de subsol.
- source_word: ἔκκοψον
  choice: taie-o
  rationale: Imperativ direct și hotărât, natural în română când complementul este mâna.
- source_word: βάλε ἀπὸ σοῦ
  choice: arunc-o de la tine
  rationale: Redă atât forța verbului βάλε, cât și îndepărtarea exprimată de ἀπὸ σοῦ, fără a atenua imaginea.
- source_word: συμφέρει γάρ σοι
  choice: căci este mai bine pentru tine
  rationale: Exprimă firesc avantajul comparativ cerut de context, nu ideea îngustă de profit.
- source_word: ἵνα ἀπόληται
  choice: să piară
  rationale: Păstrează gravitatea verbului și contrastul dintre pierderea unui mădular și soarta întregului trup.
- source_word: ἓν τῶν μελῶν σου
  choice: unul dintre mădularele tale
  rationale: „Mădular” este termenul românesc potrivit pentru o parte a trupului și nu restrânge sensul la membrele locomotorii.
- source_word: ὅλον τὸ σῶμά σου
  choice: tot trupul tău
  rationale: Redare naturală care păstrează contrastul dintre o singură parte și întregul trup.
- source_word: εἰς γέενναν ἀπέλθῃ
  choice: să se ducă ... în Gheenă
  rationale: Urmează sensul de mișcare al lui ἀπέρχομαι și păstrează termenul istoric și teologic γέεννα.
theological_decisions:
- issue: Redarea termenului γέεννα
  choice: Gheenă
  alternative: iad
  rationale: Transliterarea păstrează termenul sursă, legat de Valea Hinomului și de judecata escatologică, fără a-l identifica neexplicat cu toate conotațiile doctrinare ulterioare ale cuvântului „iad”.
- issue: Sensul lui σκανδαλίζει
  choice: te face să te poticnești
  alternative: te face să păcătuiești
  rationale: Textul principal păstrează metafora poticnirii, iar nota oferă sensul contextual, fără a elimina tensiunea imaginii originale.
translation_notes:
  register: Română standard modernă, solemnă și directă. Metafora poticnirii și imaginea corporală aspră sunt păstrate, iar termenul „Gheenă” este explicat pentru cititorul obișnuit.
