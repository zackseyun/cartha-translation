id: MAT.5.46
reference: Matthew 5:46
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς, τίνα μισθὸν ἔχετε; οὐχὶ καὶ οἱ τελῶναι ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/046.yaml
  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: ro
  text: Căci, dacă îi iubiți pe cei ce vă iubesc, ce răsplată[a] aveți? Oare nu fac chiar și colectorii de taxe același lucru?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „ce plată aveți?” Cuvântul grecesc poate însemna „plată” sau „răsplată”; aici se referă la recompensă în contextul învățăturii lui Isus.'
    reason: alternativă lexicală
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Căci, dacă
  rationale: „Căci” păstrează legătura explicativă cu afirmația precedentă, iar „dacă” redă condiția introdusă de ἐάν.
- source_word: ἀγαπήσητε
  choice: îi iubiți
  rationale: Prezentul românesc redă firesc condiția generală exprimată prin aoristul conjunctiv după ἐάν.
- source_word: τοὺς ἀγαπῶντας ὑμᾶς
  choice: pe cei ce vă iubesc
  rationale: Redă participiul substantivizat și păstrează repetarea intenționată a verbului „a iubi”.
- source_word: τίνα μισθὸν ἔχετε
  choice: ce răsplată aveți
  rationale: μισθός poate însemna plată, salariu sau răsplată; aici „răsplată” exprimă cel mai natural sensul din învățătura etică a pasajului, fără a preciza natura ori temeiul recompensei.
- source_word: οὐχὶ
  choice: Oare nu
  rationale: Formula introduce în mod firesc în română o întrebare retorică la care se așteaptă un răspuns afirmativ.
- source_word: καὶ οἱ τελῶναι
  choice: chiar și colectorii de taxe
  rationale: „Chiar și” păstrează forța emfatică a lui καί, iar „colectorii de taxe” comunică transparent ocupația desemnată de τελῶναι cititorului modern.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: fac ... același lucru
  rationale: Formularea românească redă direct și idiomatic expresia grecească.
theological_decisions:
- issue: Sensul lui μισθός în învățătura etică a lui Isus
  choice: răsplată
  alternative: plată; salariu; recompensă
  rationale: „Răsplată” păstrează dimensiunea morală și teologică a contextului, fără a introduce ideea unei remunerații contractuale sau o doctrină specifică a meritului.
translation_notes:
  register: Română standard modernă, clară și demnă. „Colectorii de taxe” a fost preferat termenului tradițional „vameșii” pentru a evita sensul modern restrâns de funcționari vamali și pentru a reda transparent referentul istoric.
