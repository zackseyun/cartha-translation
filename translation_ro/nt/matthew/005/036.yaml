id: MAT.5.36
reference: Matthew 5:36
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: μήτε ἐν τῇ κεφαλῇ σου ὀμόσῃς, ὅτι οὐ δύνασαι μίαν τρίχα λευκὴν ⸂ποιῆσαι ἢ μέλαιναν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: ro
  text: Să nu juri nici pe capul tău, pentru că nu poți face nici măcar un fir de păr alb sau negru.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτε
  choice: nici
  rationale: Continuă seria coordonată de interdicții din context; construcția românească „Să nu... nici” redă natural legătura negativă.
- source_word: ἐν τῇ κεφαλῇ σου
  choice: pe capul tău
  rationale: În asociere cu ὀμόσῃς indică lucrul invocat în jurământ; „a jura pe capul...” este expresia idiomatică românească potrivită.
- source_word: ὀμόσῃς
  choice: să nu juri
  rationale: Subjonctivul aorist într-o interdicție este redat firesc și direct prin conjunctivul prohibitiv românesc.
- source_word: ὅτι
  choice: pentru că
  rationale: 'Păstrează clar raportul cauzal: incapacitatea omului motivează interdicția.'
- source_word: οὐ δύνασαι
  choice: nu poți
  rationale: Redare modernă, concisă și exactă a incapacității exprimate de verb.
- source_word: μίαν τρίχα
  choice: nici măcar un fir de păr
  rationale: „Un fir de păr” este idiomatic, iar „nici măcar” face perceptibilă în română emfaza asupra celei mai mici unități.
- source_word: λευκὴν ... ἢ μέλαιναν
  choice: alb sau negru
  rationale: Păstrează termenii cromatici de bază și contrastul explicit al textului grec.
- source_word: ποιῆσαι
  choice: face
  rationale: În această construcție, ποιέω înseamnă a face ca ceva să aibă o anumită însușire; „a face... alb sau negru” este clar și fidel.
theological_decisions:
- issue: Întinderea interdicției referitoare la jurăminte
  choice: Versetul este redat ca interdicție directă de a jura pe propriul cap.
  alternative: Interpretarea enunțului fie ca interdicție absolută a tuturor jurămintelor, fie ca interdicție limitată exclusiv la formulele evazive.
  rationale: Textul acestui verset numește concret jurarea pe cap și o motivează prin limitarea puterii omenești. Traducerea nu extinde și nici nu restrânge afirmația dincolo de formularea ei.
translation_notes:
  register: Română standard modernă, cu formulare demnă și accesibilă. Sintaxa prohibitivă este naturală, iar expresia idiomatică „a jura pe capul tău” păstrează imaginea și forța originalului.
