id: MAT.5.24
reference: Matthew 5:24
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου καὶ ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: ro
  text: lasă-ți darul acolo, înaintea altarului, și du-te; mai întâi împacă-te cu fratele tău[a], apoi vino și adu-ți darul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Termenul grecesc este la masculin singular, „frate”; în context, principiul împăcării se poate aplica mai larg.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: lasă
  rationale: Imperativul cere ca darul să rămână pe loc; „lasă” este redarea românească firească în acest cadru concret.
- source_word: ἐκεῖ
  choice: acolo
  rationale: Păstrează precizarea spațială din text.
- source_word: τὸ δῶρόν σου
  choice: darul tău / darul
  rationale: „Dar” păstrează sensul de dar adus lui Dumnezeu, iar contextul altarului indică limpede caracterul lui cultic. Pronumele posesiv este exprimat natural prin forma neaccentuată în „lasă-ți” și „adu-ți”.
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: înaintea altarului
  rationale: Redare exactă și idiomatică a raportului spațial.
- source_word: ὕπαγε
  choice: du-te
  rationale: Imperativ românesc firesc pentru porunca de deplasare.
- source_word: πρῶτον
  choice: mai întâi
  rationale: Evidențiază prioritatea împăcării față de continuarea actului de închinare.
- source_word: διαλλάγηθι
  choice: împacă-te
  rationale: În româna actuală, forma reflexivă redă natural intrarea într-o relație împăcată și păstrează caracterul reciproc al reconcilierii.
- source_word: τῷ ἀδελφῷ σου
  choice: cu fratele tău
  rationale: Prepoziția „cu” este construcția românească idiomatică cerută de verbul „a se împăca”.
- source_word: καὶ τότε
  choice: apoi
  rationale: Marchează clar succesiunea temporală după împăcare, fără greutate stilistică inutilă.
- source_word: ἐλθὼν πρόσφερε
  choice: vino și adu
  rationale: Participiul urmat de imperativ este redat natural prin două verbe coordonate; „adu” este idiomatic pentru prezentarea unui dar la altar.
theological_decisions:
- issue: Redarea lui ἀδελφός într-un context de etică interpersonală
  choice: fratele tău
  alternative: fratele sau sora ta; semenul tău; confratele tău
  rationale: Textul grec are substantiv masculin singular. Redarea „fratele tău” păstrează forma sursei și nu restrânge ori extinde în mod explicit domeniul principiului; nota semnalează posibila aplicare mai largă.
- issue: Nuanța relațională a lui διαλλάγηθι
  choice: împacă-te cu
  alternative: fii împăcat cu
  rationale: „Împacă-te cu” este formularea românească naturală și lasă deschisă dinamica exactă a reconcilierii, fără a o reduce doar la un sentiment interior sau la o acțiune unilaterală.
translation_notes:
  register: Română standard modernă, clară și demnă. Punctuația păstrează succesiunea poruncilor și accentul pus pe împăcare. Markerul [a] este plasat imediat după expresia la care se referă.
