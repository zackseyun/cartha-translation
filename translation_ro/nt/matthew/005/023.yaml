id: MAT.5.23
reference: Matthew 5:23
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον κἀκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/023.yaml
  text: Therefore, if you are offering your gift on the altar, and there remember that your brother has something against you,
translation:
  language: ro
  text: Așadar, dacă îți aduci darul la altar și acolo îți amintești că fratele tău[a] are ceva împotriva ta,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „fratele sau sora ta”; în greacă apare „fratele”, un termen masculin la singular care, în acest context, poate avea sens reprezentativ.
    reason: Alternativă lexicală privind sfera de referință a termenului ἀδελφός.
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Așadar, dacă
  rationale: „Așadar” păstrează legătura de concluzie cu învățătura precedentă, iar „dacă” introduce firesc condiția.
- source_word: προσφέρῃς τὸ δῶρόν σου
  choice: îți aduci darul
  rationale: În context cultic, expresia redă natural acțiunea de a aduce și prezenta un dar sacrificial; „darul” păstrează sensul general al lui δῶρον.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: la altar
  rationale: În româna actuală, „a aduce darul la altar” este formularea firească pentru prezentarea lui acolo, fără a exclude depunerea lui pe altar.
- source_word: κἀκεῖ μνησθῇς
  choice: și acolo îți amintești
  rationale: Păstrează atât legătura coordonatoare și accentul local al lui κἀκεῖ, cât și sensul direct al verbului μνησθῇς.
- source_word: ὁ ἀδελφός σου
  choice: fratele tău
  rationale: Redă exact substantivul masculin singular din greacă, fără a neutraliza forma sursă; posibila folosire reprezentativă este semnalată în notă.
- source_word: ἔχει τι κατὰ σοῦ
  choice: are ceva împotriva ta
  rationale: Este echivalentul idiomatic românesc cel mai apropiat și păstrează caracterul nedefinit al lui τι.
theological_decisions:
- issue: Termenul de rudenie masculin ἀδελφός
  choice: fratele tău
  alternative: fratele sau sora ta; un alt credincios
  rationale: Textul grecesc folosește masculinul singular. Traducerea îl păstrează, iar nota recunoaște că termenul poate avea funcție reprezentativă în context, fără a introduce această extindere direct în text.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea „îți aduci darul la altar” este idiomatică în contextul cultic, iar propoziția rămâne deschisă, conform structurii versetului grec, care continuă în versetul următor.
