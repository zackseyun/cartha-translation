id: MAT.5.10
reference: Matthew 5:10
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: μακάριοι οἱ δεδιωγμένοι ἕνεκεν δικαιοσύνης, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/010.yaml
  text: Blessed are those who have been persecuted because of righteousness[a], for theirs is the kingdom of heaven.
translation:
  language: ro
  text: Fericiți sunt cei persecutați din cauza dreptății[a], căci a lor este Împărăția cerurilor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „din cauza neprihănirii” ori „din cauza justiției”. Termenul grecesc poate desemna conduita conformă voii lui Dumnezeu și ceea ce este drept sau just.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Fericiți
  rationale: Formula consacrată și firească în română pentru fericiri; exprimă o declarație de binecuvântare, nu doar o stare afectivă.
- source_word: οἱ δεδιωγμένοι
  choice: cei persecutați
  rationale: Articolul și participiul perfect pasiv au valoare substantivală. Româna redă natural atât experiența persecuției, cât și starea rezultată prin această formulare concisă.
- source_word: ἕνεκεν
  choice: din cauza
  rationale: 'Redă limpede raportul cauzal: dreptatea este motivul pentru care aceștia sunt persecutați.'
- source_word: δικαιοσύνης
  choice: dreptății
  rationale: „Dreptate” acoperă în româna biblică modernă atât conduita conformă voii lui Dumnezeu, cât și nuanța de justiție, fără a restrânge prematur sensul.
- source_word: ὅτι
  choice: căci
  rationale: Introduce explicația fericirii într-un registru demn și firesc.
- source_word: αὐτῶν
  choice: a lor
  rationale: Redare idiomatică și emfatică a genitivului posesiv.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Împărăția cerurilor
  rationale: Expresia consacrată în română păstrează formula caracteristică lui Matei și pluralul grecesc „cerurilor”.
theological_decisions:
- issue: Sensul lui δικαιοσύνη
  choice: dreptate
  alternative: neprihănire; justiție
  rationale: În context, termenul poate desemna viața și conduita conforme voii drepte a lui Dumnezeu, fără a exclude dimensiunea justiției. „Dreptate” păstrează mai bine această amplitudine semantică în româna actuală; nota menționează explicit nuanțele posibile.
- issue: Valoarea perfectului în δεδιωγμένοι
  choice: cei persecutați
  alternative: cei care au fost persecutați
  rationale: Perfectul indică o acțiune suferită cu efect prezent. Forma românească participială evită limitarea persecuției la un episod complet încheiat și păstrează starea rezultată.
translation_notes:
  register: Română standard modernă, clară și demnă. „Fericiți” și „Împărăția cerurilor” păstrează formulările biblice bine cunoscute, iar sintaxa rămâne accesibilă cititorului obișnuit.
