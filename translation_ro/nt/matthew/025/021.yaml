source:
  edition: SBLGNT
  text: ⸀ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/021.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will appoint you over many things[b]. Enter into the joy of your master.’
translation:
  language: ro
  text: 'Stăpânul lui i-a spus: „Bine, slujitor bun și credincios[a]! Ai fost credincios în puține lucruri; te voi pune peste multe lucruri. Intră în bucuria stăpânului[b] tău!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „rob” ori „sclav”. Grecescul δοῦλος desemnează o persoană aflată în slujba și sub autoritatea unui stăpân și poate indica statutul de sclav.
    reason: alternative_reading
  - marker: b
    text: Grecescul κύριος poate fi redat și prin „domn”; aici, „stăpân” corespunde relației dintre personajele parabolei.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: i-a spus
  rationale: Redă firesc introducerea vorbirii directe și păstrează complementul indirect αὐτῷ.
- source_word: κύριος
  choice: stăpân
  rationale: În cadrul imediat al parabolei, termenul desemnează persoana aflată în autoritate asupra slujitorului; „stăpân” exprimă limpede această relație fără a transforma termenul într-un titlu cristologic explicit.
- source_word: Εὖ
  choice: Foarte bine
  rationale: Formulă românească naturală de laudă; redă valoarea aprobatoare a adverbului, mai firesc decât simplul „Bine”.
- source_word: δοῦλε
  choice: slujitor
  rationale: Este o formulare curentă și demnă în română pentru rolul personajului din parabolă; sensul social mai puternic „rob/sclav” este real și este semnalat în notă.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: bun și credincios
  rationale: Păstrează coordonarea celor două calități și sensul de loialitate, statornicie și vrednicie de încredere al lui πιστός.
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: Ai fost credincios în puține lucruri
  rationale: În română, „în puține lucruri” exprimă natural sfera în care slujitorul s-a dovedit credincios, fără a preciza mai mult decât textul.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: te voi pune peste multe
  rationale: Redă numirea într-o poziție de răspundere și păstrează paralelismul dintre „puține” și „multe”, fără a adăuga substantivul absent din greacă.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: Intră în bucuria
  rationale: Păstrează imaginea explicită a intrării, precum și formularea concentrată a textului grec, fără a o reduce la simpla participare.
theological_decisions:
- issue: Sensul lui κύριος în cadrul parabolei și posibilul său referent teologic
  choice: stăpân
  alternative: Domn
  rationale: Relația narativă imediată este cea dintre un slujitor și stăpânul său. „Stăpân” păstrează nivelul povestirii, în timp ce sensul teologic al parabolei rămâne disponibil cititorului fără a fi introdus direct în traducere.
- issue: Redarea statutului exprimat de δοῦλος
  choice: slujitor
  alternative: rob; sclav
  rationale: „Slujitor” este natural în formula românească de laudă și păstrează rolul de subordonare, însă δοῦλος poate desemna propriu-zis un rob sau sclav; alternativa este menționată pentru a nu estompa ambiguitatea socială a termenului.
- issue: Natura „bucuriei stăpânului”
  choice: Intră în bucuria stăpânului tău
  alternative: Ia parte la bucuria stăpânului tău
  rationale: Traducerea păstrează metafora intrării din εἴσελθε εἰς și nu decide dacă bucuria este ospățul, sărbătoarea, răsplata sau participarea la bucuria stăpânului.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Punctuația susține caracterul oral al aprobării, iar formularea păstrează paralelismul „puține/multe” și imaginea intrării în bucurie.
