base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/042.yaml
  text: For I was hungry and you gave me nothing to eat[a]; I was thirsty and you gave me nothing to drink.
translation:
  language: ro
  text: Căci am fost flămând și nu mi-ați dat să mănânc; am fost însetat și nu mi-ați dat să beau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείνασα
  choice: am fost flămând
  rationale: Redă firesc în româna modernă aoristul care exprimă starea trecută de foame.
- source_word: γὰρ
  choice: Căci
  rationale: Păstrează valoarea explicativă a particulei, legând motivarea de judecata din context.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: nu mi-ați dat să mănânc
  rationale: Construcția românească este naturală și apropiată formal de greacă, păstrând atât pronumele personal, cât și infinitivul cu sens verbal.
- source_word: ἐδίψησα
  choice: am fost însetat
  rationale: Formulare idiomatică și demnă, paralelă cu «am fost flămând».
- source_word: ἐποτίσατέ με
  choice: nu mi-ați dat să beau
  rationale: În context, verbul înseamnă a da cuiva de băut; formularea păstrează focalizarea personală și paralelismul cu prima propoziție.
theological_decisions:
- issue: Gradul de explicitare a lipsei de hrană și băutură
  choice: nu mi-ați dat să mănânc ... nu mi-ați dat să beau
  alternative: nu mi-ați dat nimic de mâncare ... nu mi-ați dat nimic de băut
  rationale: Varianta aleasă urmează îndeaproape construcția greacă și este pe deplin firească în română, fără a amplifica negația prin introducerea lui «nimic». Ea păstrează accentul contextual asupra ajutorului refuzat lui Isus.
translation_notes:
  register: Română standard modernă, clară și demnă. Paralelismul celor două membre este păstrat, iar punctuația evidențiază structura retorică a versetului.
