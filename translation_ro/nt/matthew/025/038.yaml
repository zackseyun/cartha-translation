id: MAT.25.38
reference: Matthew 25:38
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: πότε δέ σε εἴδομεν ξένον καὶ συνηγάγομεν, ἢ γυμνὸν καὶ περιεβάλομεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/038.yaml
  text: And when did we see you as a stranger and take you in[c][b][a], or naked and clothe you?
translation:
  language: ro
  text: Și când te-am văzut străin[a] și te-am primit[b], sau gol[c] și te-am îmbrăcat?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „venit din altă parte”. Termenul grecesc poate desemna o persoană necunoscută, din afara cercului cuiva sau din alt loc; aici contextul este cel al primirii cu ospitalitate.
    reason: lexical_alternative
  - marker: b
    text: Literal, „te-am adunat” sau „te-am primit înăuntru”; în acest context, sensul este de a primi pe cineva cu ospitalitate.
    reason: lexical_alternative
  - marker: c
    text: Sau „îmbrăcat necorespunzător”. Termenul grecesc poate însemna fie complet gol, fie lipsit de îmbrăcăminte suficientă.
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: când
  rationale: Adverb interogativ temporal; „când” este echivalentul firesc și direct în româna actuală.
- source_word: δέ
  choice: și
  rationale: Leagă ușor această întrebare de cea precedentă, fără un contrast puternic; „și” redă bine continuitatea discursului.
- source_word: σε
  choice: te
  rationale: Pronume la acuzativ care se referă la împăratul din parabolă; forma românească neaccentuată este firească în construcția verbală.
- source_word: εἴδομεν
  choice: te-am văzut
  rationale: Aorist indicativ al lui ὁράω; perfectul compus redă natural acțiunea trecută în întrebarea românească.
- source_word: ξένον
  choice: străin
  rationale: Termenul îl prezintă pe cel văzut ca necunoscut sau din afara cercului celor care l-ar primi. „Străin” păstrează atât sensul social, cât și posibila nuanță de persoană venită din altă parte.
- source_word: συνηγάγομεν
  choice: te-am primit
  rationale: Deși verbul înseamnă literal „a aduna”, în acest context exprimă primirea cu ospitalitate. „Te-am primit” este natural și nu introduce un loc care nu apare explicit în text.
- source_word: ἢ
  choice: sau
  rationale: Conjuncție disjunctivă ce introduce a doua situație.
- source_word: γυμνὸν
  choice: gol
  rationale: Redă sensul de bază al termenului, păstrând deschisă și folosirea lui pentru lipsa îmbrăcămintei corespunzătoare.
- source_word: περιεβάλομεν
  choice: te-am îmbrăcat
  rationale: În context, verbul περιβάλλω înseamnă a pune haine pe cineva; „te-am îmbrăcat” este concis și idiomatic.
theological_decisions:
- issue: Sensul lui ξένος în contextul ospitalității și al judecății
  choice: străin
  alternative: venetic; persoană din altă țară
  rationale: „Străin” păstrează sensul larg al unei persoane necunoscute sau din afara cercului social, fără a restrânge referirea la cetățenie ori etnie.
translation_notes:
  register: Română standard modernă, clară și demnă. Pronumele adresării sunt scrise cu literă mică, conform formei neaccentuate obișnuite și fără a adăuga în text o convenție onorifică absentă din greacă. Formularea păstrează paralelismul întrebării și ambiguitățile lexicale relevante.
