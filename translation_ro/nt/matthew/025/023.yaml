  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/023.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’
translation:
  language: ro
  text: 'Stăpânul lui i-a zis: „Bine, slujitor[a] bun și credincios! Ai fost credincios peste puține lucruri; te voi pune peste multe lucruri. Intră în bucuria stăpânului tău.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „sclav”. Termenul grecesc δοῦλος poate desemna un slujitor sau un sclav, în funcție de context.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη αὐτῷ
  choice: i-a zis
  rationale: Redare firească în narațiunea românească a introducerii vorbirii directe, păstrând explicit destinatarul.
- source_word: ὁ κύριος αὐτοῦ
  choice: stăpânul lui
  rationale: În cadrul parabolei, κύριος desemnează superiorul uman al slujitorului; „stăpân” redă relația contextuală fără a impune aici titlul divin „Domnul”.
- source_word: Εὖ
  choice: Bine
  rationale: Interjecție românească naturală de aprobare, apropiată formal de adverbul grec și potrivită construcției următoare.
- source_word: δοῦλε
  choice: slujitor
  rationale: „Slujitor” este firesc și demn în româna actuală și păstrează raportul ierarhic; termenul grec poate desemna și un rob, dar versetul accentuează administrarea credincioasă.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: bun și credincios
  rationale: Păstrează asocierea adjectivelor și repetarea lexicală a lui πιστός în propoziția următoare.
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: Ai fost credincios peste puține lucruri
  rationale: Păstrează paralelismul cu ἐπὶ πολλῶν și exprimă domeniul responsabilității încredințate.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: te voi pune peste multe
  rationale: καθίστημι indică așezarea sau numirea într-o poziție de răspundere; formularea păstrează contrastul intenționat dintre „puține” și „multe”.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: Intră în bucuria
  rationale: Redare directă a imperativului și a imaginii spațiale din greacă, fără a o reduce interpretativ la simpla participare.
- source_word: τοῦ κυρίου σου
  choice: stăpânului tău
  rationale: Menține consecvența contextuală pentru κύριος și relația exprimată prin pronumele posesiv.
theological_decisions:
- issue: Redarea lui κύριος într-o parabolă despre un superior uman
  choice: stăpân
  alternative: Domn
  rationale: Referentul din lumea povestirii este stăpânul slujitorului. „Stăpân” lasă semnificația teologică mai largă a parabolei să reiasă din context, fără a transforma substantivul într-un titlu divin explicit.
- issue: Redarea lui δοῦλος în acest context
  choice: slujitor
  alternative: rob
  rationale: Ambele sensuri sunt posibile lexical. Aici accentul imediat cade pe credincioșia în responsabilitatea încredințată, iar „slujitor” este natural în registrul parabolei; nu este necesară o notă întrucât alternativa nu schimbă sensul afirmației în acest verset.
- issue: Sensul expresiei εἴσελθε εἰς τὴν χαρὰν
  choice: Intră în bucuria
  alternative: Ia parte la bucuria
  rationale: Formularea aleasă păstrează metafora deliberată a intrării și nu precizează dacă bucuria este trăirea stăpânului, celebrarea oferită de el sau ambele.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. S-a păstrat paralelismul „puține... multe” și repetarea „credincios”, precum și metafora neexplicată „intră în bucuria”. Punctuația vorbirii directe urmează uzul românesc actual.
