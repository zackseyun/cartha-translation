  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/040.yaml
  text: And the King will answer them[a], ‘Truly I say to you, insofar as you did it to one of the least of these brothers of mine[b], you did it to me.’
translation:
  language: ro
  text: 'Iar Regele le va răspunde: „Adevărat vă spun[a]: în măsura în care i-ați făcut unuia dintre acești frați ai Mei, dintre cei mai neînsemnați, Mie Mi-ați făcut.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mai literal, formula de început este „Amin vă spun”. „Frați” redă termenul grec la plural masculin. Expresia „acești frați ai Mei” poate desemna în mod specific ucenicii lui Isus, credincioșii în general sau, într-un sens mai larg, oamenii vulnerabili; textul nu precizează aici referentul.
    reason: alternativă lexicală și ambiguitate interpretativă
lexical_decisions:
- source_word: ἀποκριθεὶς ... ἐρεῖ
  choice: le va răspunde
  rationale: Participiul aorist împreună cu verbul la viitor exprimă natural în română o singură acțiune verbală de răspuns; formularea evită construcția greoaie „răspunzând, va spune”.
- source_word: ὁ βασιλεὺς
  choice: Regele
  rationale: Păstrează titlul regal explicit; majuscula semnalează referentul unic din cadrul parabolei, fără a înlocui titlul cu o interpretare.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Adevărat vă spun
  rationale: Redă forța formulei solemne într-o română actuală și demnă; alternativa mai literală „Amin vă spun” este indicată în notă.
- source_word: ἐφ’ ὅσον
  choice: ori de câte ori
  rationale: În contextul faptelor enumerate anterior, construcția indică aplicarea afirmației la fiecare asemenea faptă. Formularea este idiomatică în română, deși sensul de măsură/întindere permite și „în măsura în care”.
- source_word: ἐποιήσατε
  choice: i-ați făcut ... Mi-ați făcut
  rationale: Pronumele dativ personal exprimă firesc în română beneficiarul acțiunii și păstrează paralelismul dintre ceea ce li s-a făcut fraților și ceea ce I s-a făcut Regelui.
- source_word: ἑνὶ τούτων τῶν ἀδελφῶν μου
  choice: unuia dintre acești frați ai Mei
  rationale: Păstrează individualizarea lui ἑνί, demonstrativul și substantivul masculin plural, fără a preciza interpretativ cine sunt frații.
- source_word: τῶν ἐλαχίστων
  choice: dintre cei mai neînsemnați
  rationale: Redă superlativul substantivizat cu nuanța de statut social scăzut, într-o formulare românească naturală, fără a-l restrânge la dimensiune fizică.
- source_word: ἐμοὶ
  choice: Mie
  rationale: Poziția și forma accentuată păstrează emfaza pronumelui grec și identificarea izbitoare a Regelui cu cei vizați de faptă.
theological_decisions:
- issue: Referentul expresiei „acești frați ai Mei”
  choice: Expresia este păstrată fără identificarea explicită a grupului.
  alternative: Ucenicii sau mesagerii lui Isus; credincioșii în general; oamenii nevoiași ori vulnerabili în sens larg.
  rationale: Versetul nu soluționează singur disputa privind referentul. Păstrarea formulării grecești menține ambiguitatea și tensiunea teologică.
- issue: Redarea lui ἀδελφῶν la masculin plural
  choice: frați
  alternative: frați și surori; semeni
  rationale: Greaca folosește aici forma masculină plurală. O extindere neutră sau incluzivă ar decide suplimentar asupra componenței grupului, deja disputată.
- issue: Relația dintre faptă și Rege
  choice: Paralelismul „i-ați făcut ... Mie Mi-ați făcut” este păstrat direct.
  alternative: Formulări explicative precum „este ca și cum Mi-ați fi făcut Mie”.
  rationale: Textul grec afirmă direct identificarea, nu o atenuează printr-o comparație explicativă.
translation_notes:
  register: Română literară modernă, solemnă și accesibilă. Formele pronominale referitoare la Rege sunt scrise cu majusculă potrivit uzului românesc biblic. Nota reunește concis alternativa lexicală și chestiunea interpretativă; marcatorul [a] apare în text.
