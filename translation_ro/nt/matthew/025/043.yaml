id: MAT.25.43
reference: Matthew 25:43
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/043.yaml
  text: I was a stranger and you did not welcome me[a], naked and you did not clothe me[b], sick and in prison and you did not visit me.
translation:
  language: ro
  text: Am fost străin și nu m-ați primit[a], gol și nu m-ați îmbrăcat, bolnav și în închisoare și nu m-ați vizitat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „nu m-ați primit la voi”; verbul grecesc înseamnă literal „a aduna”, dar aici se referă la primirea ospitalieră a unui străin.
    reason: lexical_alternative
  - marker: b
    text: Verbul poate avea și sensul „nu v-ați îngrijit de mine” sau „nu v-ați interesat de mine”, nu doar acela de a face o vizită.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένος
  choice: străin
  rationale: Redă direct persoana din afara cercului familial sau comunitar care are nevoie de ospitalitate, fără a restrânge sensul la apartenență etnică ori cetățenie.
- source_word: συνηγάγετέ
  choice: m-ați primit în casa voastră
  rationale: În asociere cu ξένος, verbul συνάγω exprimă primirea ospitalieră. Formularea românească face limpede sensul contextual, evitând traducerea literală și nefirească „m-ați adunat”.
- source_word: γυμνός
  choice: gol
  rationale: Păstrează forța termenului grec, care poate indica atât nuditatea, cât și lipsa îmbrăcămintei necesare; verbul următor clarifică nevoia concretă.
- source_word: περιεβάλετέ
  choice: m-ați îmbrăcat
  rationale: Este echivalentul românesc firesc și concis al verbului care înseamnă literal a pune ceva în jurul cuiva, de aici a îmbrăca.
- source_word: ἀσθενής
  choice: bolnav
  rationale: În această enumerare a nevoilor trupești și a faptelor de milă, sensul de boală este cel mai probabil, deși termenul poate însemna mai general „slab”.
- source_word: ἐν φυλακῇ
  choice: în închisoare
  rationale: Redă sensul contextual de detenție, într-un registru standard și ușor de înțeles.
- source_word: ἐπεσκέψασθέ
  choice: nu ați venit să mă vedeți
  rationale: Formularea este naturală în română pentru vizitarea unui bolnav sau deținut și păstrează actul concret, iar nota explică nuanța de grijă implicată de verb.
theological_decisions:
- issue: Nuanța faptei de milă exprimate prin ἐπεσκέψασθέ με
  choice: nu ați venit să mă vedeți
  alternative: nu v-ați îngrijit de mine
  rationale: Traducerea păstrează acțiunea concretă a vizitării fără a reduce verbul la o simplă vizită socială; nota menține nuanța de preocupare și îngrijire, fără a o impune ca unic sens.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Paralelismul enumerării grecești este păstrat, iar formulările explicite sunt folosite numai acolo unde o redare literală ar fi nefirească sau ambiguă în mod înșelător.
