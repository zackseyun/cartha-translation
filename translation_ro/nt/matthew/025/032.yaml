id: MAT.25.32
reference: Matthew 25:32
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ⸀συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/032.yaml
  text: And all the nations will be gathered before him[a], and he will separate them from one another, just as the shepherd separates the sheep from the goats[b],
translation:
  language: ro
  text: Și toate națiunile[a] vor fi adunate înaintea lui, iar el îi va despărți pe unii de alții, așa cum păstorul desparte oile de capre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „toate popoarele”; în greacă, „toate națiunile” (πάντα τὰ ἔθνη).
    reason: lexical_alternative
  - marker: b
    text: Termenul grecesc ἐρίφων poate însemna mai precis „capre tinere” sau „iezi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθήσονται
  choice: vor fi adunate
  rationale: Redă viitorul pasiv fără a preciza agentul și este firesc în româna actuală.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: înaintea lui
  rationale: Formulare românească demnă și idiomatică, potrivită cadrului judiciar.
- source_word: πάντα τὰ ἔθνη
  choice: toate națiunile
  rationale: Păstrează sensul lexical larg al lui ἔθνη și evită restrângerea la neamurile neevreiești.
- source_word: ἀφορίσει
  choice: va despărți
  rationale: Exprimă direct separarea unei categorii de alta și se potrivește imaginii pastorale.
- source_word: αὐτοὺς ἀπ’ ἀλλήλων
  choice: îi va despărți pe unii de alții
  rationale: Păstrează pronumele masculin plural și caracterul reciproc al separării.
- source_word: ὥσπερ
  choice: așa cum
  rationale: Introduce limpede comparația într-o formulare românească naturală.
- source_word: ὁ ποιμὴν
  choice: păstorul
  rationale: Păstrează articolul grecesc și funcționează generic în comparație.
- source_word: τὰ πρόβατα
  choice: oile
  rationale: Redă concret substantivul πρόβατα, fără a-l transforma în termenul colectiv «turma».
- source_word: τῶν ἐρίφων
  choice: capre
  rationale: Păstrează contrastul pastoral natural dintre oi și capre; sensul mai precis de «iezi» este consemnat în notă.
theological_decisions:
- issue: Sfera expresiei πάντα τὰ ἔθνη
  choice: toate națiunile
  alternative: toate popoarele; toate neamurile/neevreii
  rationale: Formularea păstrează amploarea lexicală și ambiguitatea privind componența celor judecați, fără a o limita doctrinar la neevrei.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. «Națiunile» păstrează corespondența formală și evită ambiguitatea românescului tradițional «neamurile», iar notele conservă alternativele lexicale reale.
