id: MAT.25.24
reference: Matthew 25:24
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: προσελθὼν δὲ καὶ ὁ τὸ ἓν τάλαντον εἰληφὼς εἶπεν· Κύριε, ἔγνων σε ὅτι σκληρὸς εἶ ἄνθρωπος, θερίζων ὅπου οὐκ ἔσπειρας καὶ συνάγων ὅθεν οὐ διεσκόρπισας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/024.yaml
  text: Then the one who had received the one talent also came and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
translation:
  language: ro
  text: 'Apoi a venit și cel care primise un talant și a zis: „Doamne, știam că ești un om aspru[a], care seceri unde n-ai semănat și aduni de unde n-ai împrăștiat[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „dur” ori „sever”. Cuvântul grecesc poate descrie pe cineva aspru, dur sau neînduplecat.
    reason: lexical_alternative
  - marker: b
    text: Literal, „aduni de unde n-ai împrăștiat”. Obiectul acțiunii nu este exprimat în greacă; în context poate fi subînțeleasă sămânța.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: a venit
  rationale: Participiul aorist introduce acțiunea slujitorului înainte de vorbire; formularea este firească în succesiunea narativă românească.
- source_word: δὲ καὶ
  choice: Apoi ... și
  rationale: „Apoi” marchează progresia narațiunii, iar „și” îl include pe acest slujitor în seria celor care se prezintă.
- source_word: ὁ τὸ ἓν τάλαντον εἰληφὼς
  choice: cel care primise un talant
  rationale: Construcția participială articulată îl identifică prin ceea ce primise, iar mai-mult-ca-perfectul redă adecvat anterioritatea și relevanța participiului perfect.
- source_word: τάλαντον
  choice: talant
  rationale: Păstrează termenul monetar antic și legătura lexicală tradițională a parabolei, fără a preciza interpretativ valoarea.
- source_word: Κύριε
  choice: Doamne
  rationale: Este vocativul românesc firesc pentru κύριος și păstrează atât adresarea respectuoasă din parabolă, cât și rezonanța termenului.
- source_word: ἔγνων σε ὅτι
  choice: știam că
  rationale: În acest context, construcția exprimă pretinsa cunoaștere a caracterului stăpânului; româna naturală cere „știam că”, fără reluarea rigidă a pronumelui.
- source_word: σκληρὸς ἄνθρωπος
  choice: un om aspru
  rationale: „Aspru” redă gama de sens a lui σκληρός — dur, sever, neînduplecat — și este idiomatic pentru caracterizarea unei persoane.
- source_word: θερίζων ὅπου οὐκ ἔσπειρας
  choice: care seceri unde n-ai semănat
  rationale: Păstrează imaginea agricolă și paralelismul lexical dintre secerat și semănat.
- source_word: συνάγων ὅθεν οὐ διεσκόρπισας
  choice: și aduni de unde n-ai împrăștiat
  rationale: Redarea rămâne aproape de textul grec, păstrează diferența dintre ὅπου și ὅθεν și nu introduce un obiect precum „sămânță”, absent din original.
theological_decisions:
- issue: Redarea lui κύριος într-o adresare din parabolă
  choice: Doamne
  alternative: Stăpâne
  rationale: „Doamne” corespunde direct lui κύριος și păstrează deschisă rezonanța teologică, fără a nega sensul contextual de stăpân.
- issue: Caracterizarea stăpânului în afirmația slujitorului
  choice: Acuzația este redată drept afirmația slujitorului, fără atenuare sau confirmare naratorială.
  alternative: O formulare mai interpretativă, precum „un om nemilos”
  rationale: Textul relatează percepția sau acuzația slujitorului; traducerea nu trebuie să decidă aici dacă aceasta este adevărată.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Fraza păstrează ritmul discursului parabolic, imaginile agricole și ambiguitatea obiectului verbului „a împrăștia”.
