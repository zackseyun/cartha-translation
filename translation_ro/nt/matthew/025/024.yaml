  naturalness: Textul este firesc și inteligibil în româna standard modernă. «Apoi a venit și cel care primise...» și «a zis» se potrivesc registrului narativ sobru al parabolei. Formularea eliptică «n-ai împrăștiat» este admisibilă aici și este clarificată prudent în notă, fără a introduce „sămânță” în text.
  terminology: «Talant», «Doamne», «om aspru», «seceri» și «semănat» sunt alegeri adecvate. «Aspru» redă bine ambiguitatea evaluativă a lui σκληρός, fără să transforme afirmația slujitorului într-o judecată naratorială. Ancorele notelor sunt plasate corect după termenii explicați.
