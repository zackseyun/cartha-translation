  text: πέντε δὲ ⸂ἐξ αὐτῶν ἦσαν⸃ ⸂μωραὶ καὶ πέντε φρόνιμοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/002.yaml
  text: And five of them were foolish, and five were wise.
translation:
  language: ro
  text: Cinci dintre ele erau nechibzuite, iar cinci erau înțelepte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέντε
  choice: cinci
  rationale: Numeralul cardinal este redat direct; repetarea lui păstrează echilibrul și contrastul formulării grecești.
- source_word: δὲ
  choice: iar
  rationale: Particula are aici rol de legătură și introduce o repartizare contrastantă; „iar” este firesc în română fără a accentua excesiv opoziția.
- source_word: ἐξ αὐτῶν
  choice: dintre ele
  rationale: Expresia partitivă arată că cele cinci fac parte din grupul menționat anterior; „dintre ele” este redarea românească naturală și clară.
- source_word: ἦσαν
  choice: erau
  rationale: Imperfectul verbului εἰμί funcționează copulativ într-o descriere și este redat firesc prin „erau”.
- source_word: μωραὶ
  choice: nechibzuite
  rationale: Termenul desemnează lipsa de judecată sau discernământ; „nechibzuite” exprimă natural această trăsătură în contextul pildei, fără nuanța modernă predominant insultătoare a lui „proaste”.
- source_word: καὶ πέντε φρόνιμοι
  choice: iar cinci erau înțelepte
  rationale: φρόνιμος poate însemna înțelept, chibzuit sau prevăzător. „Înțelepte” păstrează contrastul tradițional și semantic cu cele nechibzuite; repetarea lui „erau” face elipsa grecească limpede în română.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu formulare concisă și demnă. S-a păstrat paralelismul celor două grupuri, iar acordul la feminin urmează referentul din versetul anterior.
