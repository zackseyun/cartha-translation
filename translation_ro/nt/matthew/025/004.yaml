  text: αἱ δὲ φρόνιμοι ἔλαβον ἔλαιον ἐν τοῖς ⸀ἀγγείοις μετὰ τῶν λαμπάδων ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/004.yaml
  text: But the wise took oil in their containers with their lamps[a].
translation:
  language: ro
  text: Dar cele înțelepte au luat ulei în vase, împreună cu lămpile lor[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „torțele” în loc de „lămpile” (grecescul lampadas); termenul poate desemna o torță sau o lampă, în funcție de context.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρόνιμοι
  choice: înțelepte
  rationale: Redă în mod firesc în română înțelepciunea practică și păstrează contrastul explicit cu fecioarele nechibzuite din context, fără a restrânge sensul la simpla pregătire.
- source_word: ἔλαβον
  choice: au luat
  rationale: În contextul narativ, verbul indică faptul că au luat cu ele uleiul; „au primit” nu se potrivește aici.
- source_word: ἔλαιον
  choice: ulei
  rationale: Termenul denumește ulei, adesea ulei de măsline, dar precizarea tipului ar adăuga o informație pe care textul nu o explicitează.
- source_word: ἀγγείοις
  choice: vase
  rationale: Este un termen românesc general și demn pentru recipiente, fără a impune o anumită formă ori un anumit material.
- source_word: λαμπάδων
  choice: candelele
  rationale: „Candelă” se potrivește natural cu folosirea uleiului și cu registrul parabolei; termenul grec poate desemna și torțe, alternativă păstrată în nota de subsol.
- source_word: ἑαυτῶν
  choice: lor
  rationale: Exprimă firesc posesia reflexivă în română; „propriile lor” ar accentua inutil.
- source_word: μετὰ τῶν λαμπάδων ἑαυτῶν
  choice: împreună cu candelele lor
  rationale: 'Redă clar ideea de însoțire exprimată de μετά cu genitivul: uleiul a fost luat pe lângă candele.'
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu formulare naturală și demnă. „Vase” păstrează caracterul generic al recipientelor, iar „candele” urmează contextul folosirii uleiului fără a elimina alternativa lexicală „torțe”.
