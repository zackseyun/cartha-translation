source:
  edition: SBLGNT
  text: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι· Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ ἡμῖν καὶ ὑμῖν· ⸀πορεύεσθε μᾶλλον πρὸς τοὺς πωλοῦντας καὶ ἀγοράσατε ἑαυταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/009.yaml
  text: But the wise answered[a], saying, ‘No, lest there not be enough for us and for you. Go instead to those who sell, and buy for yourselves.’
translation:
  language: ro
  text: 'Dar cele înțelepte au răspuns: „Nu, ca nu cumva să nu ne ajungă nici nouă, nici vouă. Mergeți mai degrabă la cei care vând și cumpărați-vă.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Construcția grecească exprimă apăsat temerea că uleiul nu va fi suficient pentru ambele grupuri; formularea poate fi redată și: „ca nu cumva să nu fie îndeajuns pentru noi și pentru voi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: au răspuns
  rationale: Echivalentul narativ firesc în româna modernă pentru verbul standard de răspuns.
- source_word: αἱ φρόνιμοι
  choice: cele înțelepte
  rationale: Păstrează adjectivul substantivizat și legătura cu personajele feminine deja menționate, fără a introduce aici un substantiv absent din greacă.
- source_word: λέγουσαι
  choice: redat prin introducerea directă a replicii
  rationale: În română, „au răspuns, zicând” ar fi greoi și redundant; punctuația redă natural participiul introductiv.
- source_word: Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ
  choice: Nu, ca nu cumva să nu ne ajungă
  rationale: „Nu” exprimă refuzul implicit, iar construcția cu „ca nu cumva” păstrează preocuparea puternică privind insuficiența, fără a o transforma într-o certitudine.
- source_word: ἀρκέσῃ
  choice: să nu ne ajungă
  rationale: Formulare românească idiomatică pentru o cantitate care s-ar putea dovedi insuficientă.
- source_word: ἡμῖν καὶ ὑμῖν
  choice: nici nouă, nici vouă
  rationale: Structura corelativă este firească după negație și redă limpede cele două grupuri beneficiare.
- source_word: πορεύεσθε
  choice: Mergeți
  rationale: Imperativ direct și natural al verbului de deplasare.
- source_word: μᾶλλον
  choice: mai degrabă
  rationale: Păstrează explicit valoarea comparativă a grecescului și indică alternativa preferată.
- source_word: πρὸς τοὺς πωλοῦντας
  choice: la cei care vând
  rationale: Redă participiul substantivizat fără a adăuga obiectul subînțeles „ulei”.
- source_word: ἀγοράσατε ἑαυταῖς
  choice: cumpărați-vă
  rationale: Dativul reflexiv este redat idiomatic prin pronumele reflexiv enclitic, cu sensul „cumpărați pentru voi însevă”.
theological_decisions: []
