id: MAT.25.13
reference: Matthew 25:13
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε τὴν ἡμέραν οὐδὲ τὴν ⸀ὥραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/013.yaml
  text: Therefore[a], stay awake, because you do not know the day or the hour.
translation:
  language: ro
  text: De aceea, vegheați[a], pentru că nu știți nici ziua, nici ceasul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „rămâneți treji” ori „fiți vigilenți”. Imperativul grecesc exprimă o veghere continuă.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: vegheați
  rationale: Imperativul prezent, persoana a doua plural, exprimă o vigilență continuă. „Vegheați” păstrează atât imaginea stării de trezie din parabolă, cât și îndemnul la disponibilitate, într-o formulare românească demnă și firească.
- source_word: οὖν
  choice: De aceea
  rationale: Marchează concluzia practică desprinsă din parabola precedentă; „De aceea” redă limpede raportul inferențial.
- source_word: ὅτι
  choice: pentru că
  rationale: Introduce motivul poruncii și redă direct valoarea cauzală.
- source_word: οὐκ οἴδατε
  choice: nu știți
  rationale: Redare directă a verbului negat la persoana a doua plural, fără adaos interpretativ.
- source_word: τὴν ἡμέραν
  choice: ziua
  rationale: Păstrează substantivul articulat și nu explicitează mai mult decât spune textul cu privire la evenimentul avut în vedere.
- source_word: οὐδὲ τὴν ὥραν
  choice: nici ceasul
  rationale: În construcția românească „nu știți nici ziua, nici ceasul”, perechea corelativă redă natural coordonarea negativă și sensul grecescului οὐδέ.
theological_decisions:
- issue: Imaginea vigilenței din imperativ
  choice: vegheați
  alternative: rămâneți treji; fiți vigilenți
  rationale: „Vegheați” păstrează tensiunea dintre sensul concret de a rămâne treaz și îndemnul figurat la pregătire, fără a reduce textul la o formulă abstractă sau la un sistem escatologic particular.
- issue: Referința expresiei „ziua, nici ceasul”
  choice: expresia este păstrată fără explicitare
  alternative: ziua sau ceasul venirii Fiului Omului; timpul hotărât
  rationale: Contextul indică venirea și judecata, dar versetul nu numește explicit evenimentul; traducerea evită să adauge o precizare teologică absentă din formularea greacă.
translation_notes:
  register: Română standard modernă, clară și demnă. „Vegheați” este bine consacrat în registrul biblic, dar rămâne inteligibil; nota explică sensul continuu și alternativele contemporane. Construcția „nici ziua, nici ceasul” este idiomatică și păstrează paralelismul.
