  text: ⸂αἱ γὰρ⸃ μωραὶ λαβοῦσαι τὰς λαμπάδας αὐτῶν οὐκ ἔλαβον μεθ’ ἑαυτῶν ἔλαιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/003.yaml
  text: For the foolish[a], when they took their lamps, did not take oil with them.
translation:
  language: ro
  text: Căci cele nechibzuite, când și-au luat candelele[a], nu au luat cu ele untdelemn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „făcliile” (grecescul λαμπάδας).
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Căci
  rationale: Păstrează valoarea explicativă a conjuncției și legătura cu afirmația precedentă.
- source_word: μωραὶ
  choice: cele nechibzuite
  rationale: Adjectivul feminin plural substantivizat trimite la fecioarele menționate anterior; formularea este firească și evită repetarea inutilă a substantivului.
- source_word: λαβοῦσαι
  choice: când și-au luat
  rationale: Redă participiul aorist cu sens temporal și păstrează relația lui cu verbul principal.
- source_word: λαμπάδας
  choice: candelele
  rationale: „Candele” este o redare românească tradițională și inteligibilă pentru lămpi alimentate cu untdelemn; „făclii” rămâne o alternativă lexicală posibilă.
- source_word: οὐκ ἔλαβον
  choice: nu au luat
  rationale: Păstrează paralelismul verbal din greacă dintre λαβοῦσαι și ἔλαβον.
- source_word: μεθ’ ἑαυτῶν
  choice: cu ele
  rationale: Echivalent românesc idiomatic al construcției reflexive, referindu-se la cele nechibzuite.
- source_word: ἔλαιον
  choice: untdelemn
  rationale: Redă precis uleiul folosit pentru iluminat și se potrivește registrului biblic românesc fără a deveni obscur.
theological_decisions: []
