base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/007.yaml
  text: Then all those virgins got up and trimmed their lamps[a].
translation:
  language: ro
  text: Atunci toate fecioarele acelea s-au ridicat și și-au pregătit candelele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „făcliile”; termenul grecesc λαμπάδας poate desemna o sursă de lumină purtată în mână, fie candelă, fie făclie, iar contextul uleiului și al pregătirii permite ambele redări.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Marchează firesc următorul moment din desfășurarea narațiunii.
- source_word: ἠγέρθησαν
  choice: s-au ridicat
  rationale: Redă sensul contextual al ridicării din somn sau din poziția de odihnă, fără a impune lectura pasivă „au fost trezite”.
- source_word: πᾶσαι αἱ παρθένοι ἐκεῖναι
  choice: toate fecioarele acelea
  rationale: Păstrează specificitatea lexicală a lui παρθένοι și referința demonstrativă, într-o formulare românească demnă și clară.
- source_word: ἐκόσμησαν
  choice: și-au pregătit
  rationale: κοσμέω înseamnă aici a pune în ordine sau a face gata sursele de lumină; „și-au pregătit” este natural și evită sugerarea nejustificată a unei singure operațiuni tehnice.
- source_word: λαμπάδας
  choice: candelele
  rationale: În contextul uleiului și al pregătirii, „candele” redă natural surse portabile de lumină alimentate cu ulei; „făclii” rămâne o alternativă lexicală reală.
- source_word: ἑαυτῶν
  choice: și-au
  rationale: Construcția reflexiv-posesivă românească exprimă natural faptul că fiecare și-a pregătit propria sursă de lumină, fără accentuare suplimentară.
theological_decisions: []
