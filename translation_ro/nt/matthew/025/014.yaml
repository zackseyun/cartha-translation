id: MAT.25.14
reference: Matthew 25:14
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ὥσπερ γὰρ ἄνθρωπος ἀποδημῶν ἐκάλεσεν τοὺς ἰδίους δούλους καὶ παρέδωκεν αὐτοῖς τὰ ὑπάρχοντα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/014.yaml
  text: For it is like a man going on a journey[a], who called his own servants and entrusted his possessions to them.
translation:
  language: ro
  text: Căci este ca atunci când un om, plecând într-o călătorie, și-a chemat propriii sclavi[a] și le-a încredințat bunurile sale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „propriii robi” ori „propriii slujitori”. Termenul grecesc doulos poate desemna un sclav sau un slujitor, în funcție de context; aici „sclavi” evidențiază faptul că se aflau sub stăpânirea și autoritatea omului.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: Căci este ca atunci când
  rationale: Redă legătura explicativă introdusă de γὰρ și completează firesc în română comparația eliptică introdusă de ὥσπερ, fără a-i preciza în mod nejustificat subiectul.
- source_word: ἄνθρωπος
  choice: un om
  rationale: În cadrul pildei este vorba despre un personaj masculin concret, nu despre omenire în general.
- source_word: ἀποδημῶν
  choice: plecând într-o călătorie
  rationale: Participiul indică plecarea într-un alt loc; formularea este actuală și nu adaugă ideea mai precisă de plecare în străinătate.
- source_word: ἐκάλεσεν
  choice: și-a chemat
  rationale: Construcția reflexiv-posesivă este idiomatică în română și exprimă faptul că omul i-a chemat pe cei care îi aparțineau gospodăriei.
- source_word: τοὺς ἰδίους δούλους
  choice: propriii sclavi[a]
  rationale: δοῦλος desemnează aici persoane aflate sub stăpânirea omului, iar ἰδίους accentuează relația lor cu el. „Sclavi” păstrează realitatea socială și autoritatea stăpânului; nota oferă variantele tradiționale sau funcționale.
- source_word: παρέδωκεν
  choice: le-a încredințat
  rationale: În contextul administrării bunurilor, verbul implică predarea lor împreună cu responsabilitatea, nu doar un transfer material.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: bunurile sale
  rationale: Expresia se referă la ceea ce îi aparținea omului; „bunurile sale” este clar, firesc și potrivit cadrului economic al pildei.
theological_decisions:
- issue: Redarea lui δοῦλος în contextul gospodăriei din pildă
  choice: sclavi
  alternative: robi; slujitori
  rationale: Relația de posesie și autoritatea stăpânului sunt proeminente, astfel că „sclavi” evită atenuarea statutului social exprimat de termen. Nota păstrează accesibile variantele românești posibile fără a transforma alegerea lexicală într-o afirmație doctrinară.
- issue: Subiectul comparației eliptice Ὥσπερ γὰρ
  choice: Căci este ca atunci când
  alternative: Căci este asemenea unui om care
  rationale: Textul grec nu repetă explicit subiectul comparației. Formularea aleasă produce o propoziție românească firească, dar nu introduce explicit „Împărăția” sau un alt referent, păstrând astfel elipsa și legătura cu versetul anterior.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. „Sclavi” este termenul contemporan direct; „robi” rămâne o alternativă tradițională indicată în notă. Topica participială păstrează cursivitatea narațiunii și raportul temporal din greacă.
