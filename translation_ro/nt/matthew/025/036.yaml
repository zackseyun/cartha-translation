  rationale: Revizuirea înlocuiește arhaizantul ambiguu „M-ați cercetat” cu formularea modernă și exactă „M-ați vizitat”. Nota păstrează, fără a o impune în text, nuanța semantică de grijă a lui ἐπισκέπτομαι. Restul textului rămâne neschimbat, deoarece urmează îndeaproape greaca și nu introduce interpretări suplimentare.
