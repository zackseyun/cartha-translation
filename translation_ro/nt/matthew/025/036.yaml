id: MAT.25.36
reference: Matthew 25:36
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: γυμνὸς καὶ περιεβάλετέ με, ἠσθένησα καὶ ἐπεσκέψασθέ με, ἐν φυλακῇ ἤμην καὶ ἤλθατε πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/036.yaml
  text: I was naked and you clothed me[a]; I was sick and you visited me[b]; I was in prison and you came to me.
translation:
  language: ro
  text: Am fost gol și M-ați îmbrăcat; am fost bolnav și M-ați vizitat[a]; am fost în închisoare și ați venit la Mine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „ați avut grijă de Mine”; verbul grecesc poate desemna o vizită făcută cu grijă și preocupare.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυμνὸς
  choice: gol
  rationale: Redă direct adjectivul grec, care în acest context indică lipsa îmbrăcămintei necesare și corespunde firesc acțiunii „M-ați îmbrăcat”.
- source_word: περιεβάλετέ
  choice: M-ați îmbrăcat
  rationale: Verbul περιβάλλω înseamnă aici a pune haine pe cineva; formularea este concisă și naturală în română.
- source_word: ἠσθένησα
  choice: am fost bolnav
  rationale: Deși verbul poate desemna și slăbiciunea în sens mai larg, contextul faptelor de milă susține sensul de boală.
- source_word: ἐπεσκέψασθέ
  choice: M-ați cercetat
  rationale: „A cerceta” păstrează ideea unei vizite făcute cu grijă și preocupare, nu doar a unei simple prezențe; nota oferă alternativa românească mai curentă.
- source_word: φυλακῇ
  choice: în închisoare
  rationale: Este echivalentul românesc standard și suficient de larg pentru un loc de detenție.
- source_word: ἤλθατε πρός με
  choice: ați venit la Mine
  rationale: Urmează simplitatea expresiei grecești și nu adaugă noțiunea de vizitare, deja exprimată în propoziția anterioară.
theological_decisions:
- issue: Gradul de explicitare a faptelor de milă
  choice: 'Păstrarea acțiunilor concrete: „M-ați îmbrăcat”, „M-ați cercetat” și „ați venit la Mine”.'
  alternative: Parafraze precum „ați avut grijă de Mine” sau „ați venit să Mă vizitați”.
  rationale: Textul grec prezintă fapte concrete fără dezvoltare pastorală sau doctrinară; traducerea păstrează această simplitate și nu precizează mai mult decât sursa.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Pronumele referitoare la vorbitor sunt scrise cu majusculă potrivit uzului biblic românesc. „A cerceta” are rezonanță biblică tradițională, iar nota clarifică sensul pentru cititorul modern.
