review_pass:
  verdict: revise
  source_fidelity: Textul redă corect cele trei afirmații grecești și păstrează distincția importantă dintre ἐπεσκέψασθέ με („m-ați vizitat”, cu posibilă nuanță de grijă) și ἤλθατε πρός με („ați venit la Mine”). „Gol”, „M-ați îmbrăcat”, „bolnav”, „în închisoare” și „ați venit la Mine” sunt fidele sursei.
  naturalness: „M-ați cercetat” este o formulare biblică tradițională, dar în româna standard modernă este neobișnuită cu sensul de „a vizita” și poate sugera „a examina/a investiga”. „M-ați vizitat” este direct, idiomatic și păstrează sensul de bază al verbului grec.
  terminology: Terminologia este potrivită, inclusiv „închisoare”. Majusculele reverențiale sunt consecvente cu registrul biblic adoptat. Nota trebuie să ofere nuanța de grijă ca alternativă, nu să prezinte „a vizitat” drept alternativă la un termen principal arhaizant.
  issues:
  - severity: medium
    issue: „M-ați cercetat” nu este cea mai clară redare modernă pentru ἐπεσκέψασθέ με.
    rationale: Deși este consacrată în tradiția biblică, expresia nu mai este uzuală cu sensul de „a vizita” și poate fi înțeleasă ca „a investiga” sau „a examina”. „M-ați vizitat” redă transparent sensul de bază, iar nota poate conserva nuanța de grijă.
  revised_text: Am fost gol și M-ați îmbrăcat; am fost bolnav și M-ați vizitat[a]; am fost în închisoare și ați venit la Mine.
  revised_footnotes:
  - marker: a
    text: 'Sau: „ați avut grijă de Mine”; verbul grecesc poate desemna o vizită făcută cu grijă și preocupare.'
    reason: lexical_alternative
  revision_rationale: Revizuirea înlocuiește arhaizantul ambiguu „M-ați cercetat” cu formularea modernă și exactă „M-ați vizitat”. Nota păstrează, fără a o impune în text, nuanța semantică de grijă a lui ἐπισκέπτομαι. Restul textului rămâne neschimbat, deoarece urmează îndeaproape greaca și nu introduce interpretări suplimentare.
