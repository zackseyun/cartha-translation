source:
  edition: SBLGNT
  text: τότε ἀποκριθήσεται αὐτοῖς λέγων· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων, οὐδὲ ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/045.yaml
  text: Then he will answer them[a], saying, ‘Truly I say to you, insofar as you did not do it for one of the least of these[b], neither did you do it for me.’
translation:
  language: ro
  text: 'Atunci le va răspunde, zicând: „Adevărat vă spun: întrucât nu ați făcut aceasta pentru niciunul dintre acești oameni, dintre cei mai neînsemnați[a], nici Mie nu Mi-ați făcut-o.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expresia „acești oameni, dintre cei mai neînsemnați” poate fi înțeleasă fie în mod specific cu referire la ucenicii lui Isus, fie mai larg cu referire la cei smeriți și nevoiași; traducerea păstrează expresia fără să-i restrângă sensul.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Marchează succesiunea în scena judecății și este formularea românească firească.
- source_word: ἀποκριθήσεται αὐτοῖς λέγων
  choice: le va răspunde, zicând
  rationale: Păstrează valoarea viitorului, complementul indirect și participiul de vorbire, într-un registru biblic încă natural.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Adevărat vă spun
  rationale: Redă formula solemnă a lui Isus clar și idiomatic; alternativa formală „Amin vă spun” este posibilă, dar mai puțin firească în româna curentă.
- source_word: ἐφ’ ὅσον
  choice: întrucât
  rationale: În context introduce corespondența dintre ceea ce nu li s-a făcut celor neînsemnați și ceea ce nu I s-a făcut lui Isus, fără a extinde sensul prin parafrază.
- source_word: οὐκ ἐποιήσατε
  choice: nu i-ați făcut aceasta
  rationale: Obiectul implicit este recuperat din contextul imediat; pronumele singular anticipează persoana reprezentativă din grup.
- source_word: ἑνὶ τούτων τῶν ἐλαχίστων
  choice: niciunuia dintre acești neînsemnați
  rationale: Redă singularul ἑνί în sfera negației și superlativul substantivizat ἐλαχίστων, evitând formularea românească rigidă „unul dintre cei mai mici”.
- source_word: οὐδὲ ἐμοὶ ἐποιήσατε
  choice: nici Mie nu Mi-ați făcut-o
  rationale: Păstrează paralelismul negativ și identificarea directă cu Isus; pronumele obiect face propoziția firească în română.
theological_decisions:
- issue: Identitatea „acestor neînsemnați”
  choice: Referentul rămâne nespecificat în text, iar nota consemnează principalele înțelegeri.
  alternative: Expresia poate fi limitată explicit la ucenicii/mesagerii lui Isus sau extinsă explicit la cei smeriți și nevoiași.
  rationale: Versetul afirmă identificarea acțiunii față de ei cu acțiunea față de Isus, dar nu soluționează singur disputa privind delimitarea grupului.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formula „Adevărat vă spun” păstrează solemnitatea fără arhaizare; majusculele reverențiale pentru pronumele referitoare la Isus urmează uzul editorial românesc.
