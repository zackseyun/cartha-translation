id: MAT.25.20
reference: Matthew 25:20
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ τὰ πέντε τάλαντα λαβὼν προσήνεγκεν ἄλλα πέντε τάλαντα λέγων· Κύριε, πέντε τάλαντά μοι παρέδωκας· ἴδε ἄλλα πέντε τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/020.yaml
  text: And the one who had received the five talents came forward and brought another five talents[a], saying, ‘Lord, you delivered five talents to me; look[b], I have gained another five talents.’
translation:
  language: ro
  text: 'Cel care primise cei cinci talanți[b] s-a apropiat și a adus alți cinci talanți, spunând: „Doamne[a], mi-ai dat cinci talanți; iată, am câștigat alți cinci talanți.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau „Stăpâne”. Greacă: Kyrios.'
    reason: alternative_reading
  - marker: b
    text: Un talant era o unitate mare de greutate și, prin extensie, o sumă mare de bani.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: s-a apropiat
  rationale: Participiul aorist al lui προσέρχομαι descrie apropierea slujitorului pentru a se prezenta înaintea stăpânului; formularea este firească și păstrează sensul de mișcare către acesta.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: Cel care primise cei cinci talanți
  rationale: Construcția participială articulată îl identifică prin primirea anterioară a sumei; mai-mult-ca-perfectul românesc redă clar anterioritatea față de apropiere și aducere.
- source_word: τάλαντα
  choice: talanți
  rationale: Termenul tradițional românesc păstrează unitatea monetară și de greutate din text, fără a o restrânge nejustificat la aur; nota explică valoarea sa mare.
- source_word: προσήνεγκεν
  choice: a adus
  rationale: Redare directă și naturală a actului de a aduce suma suplimentară înaintea stăpânului; evită nuanța cultică posibilă a lui „a oferit”.
- source_word: ἄλλα πέντε τάλαντα
  choice: alți cinci talanți
  rationale: Redă suma suplimentară egală și păstrează repetiția deliberată a textului grec.
- source_word: Κύριε
  choice: Doamne
  rationale: Vocativul românesc uzual pentru κύριος păstrează atât adresarea către stăpânul din parabolă, cât și rezonanța mai largă posibilă în Matei.
- source_word: παρέδωκας
  choice: mi-ai dat
  rationale: În contextul înmânării banilor, „mi-ai dat” este natural și suficient de apropiat de sensul lui παραδίδωμι; „mi-ai încredințat” ar explicita o implicație contextuală care nu este exprimată lexical.
- source_word: ἴδε
  choice: iată
  rationale: Interjecție deictică firească într-un registru biblic modern și demn, care atrage atenția asupra rezultatului prezentat.
- source_word: ἐκέρδησα
  choice: am câștigat
  rationale: Perfectul compus exprimă o acțiune încheiată cu rezultat prezent, iar „a câștiga” redă sensul de spor sau profit fără sugestia salarială a lui „a câștiga prin muncă” într-o formulare mai explicită.
theological_decisions:
- issue: Redarea lui κύριος în adresarea din parabolă
  choice: Doamne
  alternative: Stăpâne
  rationale: În cadrul parabolei, cuvântul îl desemnează pe stăpânul slujitorului, însă „Doamne” păstrează consecvența lexicală și posibila rezonanță narativ-teologică, fără a impune explicit o identificare hristologică în acest verset.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. Sintaxa urmează îndeaproape succesiunea greacă, dar evită construcțiile rigide; „iată” păstrează caracterul oral și solemn al replicii fără arhaizare excesivă.
