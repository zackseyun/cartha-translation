id: MAT.25.16
reference: Matthew 25:16
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ⸀πορευθεὶς ὁ τὰ πέντε τάλαντα λαβὼν ἠργάσατο ἐν αὐτοῖς καὶ ⸀ἐκέρδησεν ἄλλα ⸀πέντε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/016.yaml
  text: The one who had received the five talents went and worked with them[b][a], and gained another five.
translation:
  language: ro
  text: Cel care primise cei cinci talanți[a] s-a dus, a lucrat cu ei și a câștigat alți cinci.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un talant era o unitate mare de greutate și, prin extensie, o sumă mare de bani, nu o aptitudine înnăscută.
    reason: cultural_note
lexical_decisions:
- source_word: πορευθεὶς
  choice: s-a dus
  rationale: Redă firesc participiul aorist circumstanțial, fără a adăuga ideea de grabă, care nu este exprimată lexical în greacă.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: Cel care primise cei cinci talanți
  rationale: Construcția participială articulată îl identifică pe slujitor prin suma primită; mai-mult-ca-perfectul românesc exprimă limpede anterioritatea primirii.
- source_word: τάλαντα
  choice: talanți
  rationale: Păstrează termenul tradițional și concret al parabolei; nota precizează că aici este vorba despre o unitate monetară, nu despre o aptitudine.
- source_word: ἠργάσατο ἐν αὐτοῖς
  choice: a lucrat cu ei
  rationale: Urmează îndeaproape formularea greacă și păstrează o ușoară deschidere semantică, fără a restrânge nejustificat acțiunea la comerț propriu-zis; contextul indică folosirea banilor pentru câștig.
- source_word: ἐκέρδησεν
  choice: a câștigat
  rationale: Verbul românesc exprimă natural obținerea unui profit sau spor în acest context.
- source_word: ἄλλα πέντε
  choice: alți cinci
  rationale: Formulare românească firească, în acord cu genul substantivului subînțeles «talanți», care păstrează sensul aditiv.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Nu s-a introdus «îndată», deoarece textul grec al versetului nu conține un adverb care să exprime explicit graba.
