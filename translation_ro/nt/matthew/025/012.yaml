  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀμὴν λέγω ὑμῖν, οὐκ οἶδα ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/012.yaml
  text: But he answered[a], ‘Truly I tell you, I do not know you.’
translation:
  language: ro
  text: 'Dar el le-a răspuns: „Adevărat vă spun: nu vă cunosc.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „nu vă recunosc”. În greacă, formularea mai literală este „nu vă cunosc”, care, în acest context, poate implica o nerecunoaștere pe plan relațional.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Dar el le-a răspuns
  rationale: Redă firesc formula narativă participiu + verb finit, fără redundanța „răspunzând, a zis”; δέ marchează contrastul cu rugămintea anterioară.
- source_word: Ἀμὴν
  choice: Adevărat
  rationale: În formula solemnă sinoptică, „Adevărat vă spun” este limpede și natural în româna actuală, păstrând forța afirmativă a lui Ἀμήν.
- source_word: λέγω ὑμῖν
  choice: vă spun
  rationale: Formulare românească directă și idiomatică, în care „vă” păstrează adresarea la plural.
- source_word: οὐκ οἶδα ὑμᾶς
  choice: nu vă cunosc
  rationale: Păstrează sensul lexical de bază al lui οἶδα și tensiunea relațională din context, fără a explicita în text o interpretare doctrinară.
theological_decisions:
- issue: Forța expresiei „nu vă cunosc” în parabolă
  choice: Păstrarea formulării simple și relațional puternice „nu vă cunosc”
  alternative: „nu vă recunosc” sau „nu am nicio legătură cu voi”
  rationale: Contextul sugerează nerecunoaștere relațională și excludere, însă greaca nu dezvoltă aici o afirmație doctrinară mai amplă. Traducerea păstrează ambiguitatea și tensiunea textului.
translation_notes:
  register: Română standard modernă, clară și demnă. Punctuația separă formula solemnă de declarația principală, iar pronumele la plural este redat prin „vă”.
