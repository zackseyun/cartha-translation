  text: ἐπείνασα γὰρ καὶ ἐδώκατέ μοι φαγεῖν, ἐδίψησα καὶ ἐποτίσατέ με, ξένος ἤμην καὶ συνηγάγετέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/035.yaml
  text: For I was hungry and you gave me something to eat[a]; I was thirsty and you gave me something to drink; I was a stranger and you welcomed me,
translation:
  language: ro
  text: Căci mi-a fost foame și mi-ați dat să mănânc; mi-a fost sete și mi-ați dat să beau; am fost străin și m-ați primit[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Verbul grec are la bază sensul „a aduna”, dar în acest context se referă la primirea ospitalieră a unui străin. Se poate reda și: „m-ați luat la voi”.'
    reason: Alternativă lexicală ce explică sensul de bază al verbului grec și întrebuințarea lui contextuală, fără a prezenta drept literală o formulare românească nenaturală.
lexical_decisions:
- source_word: ἐπείνασα
  choice: mi-a fost foame
  rationale: Aoristul verbului πεινάω exprimă aici experiența foamei în trecut. Formularea este firească în româna actuală și redă direct starea descrisă.
- source_word: γὰρ
  choice: Căci
  rationale: Conjuncția introduce explicația afirmației precedente; „Căci” păstrează legătura argumentativă și registrul demn al pasajului.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: mi-ați dat să mănânc
  rationale: Construcția cu δίδωμι, dativ și infinitiv este redată prin expresia românească idiomatică „a da cuiva să mănânce”, fără a adăuga explicit „hrană” sau „ceva”.
- source_word: ἐδίψησα
  choice: mi-a fost sete
  rationale: Redă natural în română experiența setei în trecut și formează un paralelism clar cu „mi-a fost foame”.
- source_word: ἐποτίσατέ με
  choice: mi-ați dat să beau
  rationale: În context, ποτίζω înseamnă a da cuiva de băut. Formularea românească este naturală și păstrează paralelismul cu propoziția anterioară.
- source_word: ξένος
  choice: străin
  rationale: Termenul desemnează aici o persoană fără legături obișnuite de apartenență și care are nevoie de ospitalitate. „Străin” păstrează sensul larg fără a-l limita la cetățenie sau etnie.
- source_word: συνηγάγετέ με
  choice: m-ați primit
  rationale: Deși sensul de bază al lui συνάγω este „a aduna”, în asociere cu ξένος verbul exprimă primirea ospitalieră. „M-ați primit” este concis, natural și nu introduce în text un loc care nu este exprimat explicit în greacă.
theological_decisions:
- issue: Sensul ospitalier al expresiei ξένος ... συνηγάγετέ με
  choice: „am fost străin și m-ați primit”
  alternative: „am fost străin și m-ați luat la voi”
  rationale: Alegerea păstrează accentul pe primirea personală și milostivă a celui vulnerabil, fără a restrânge sensul la statutul de străin din punct de vedere juridic și fără a adăuga explicit ideea locuinței.
translation_notes:
  register: Română literară modernă, clară și demnă. Paralelismul celor trei situații este păstrat, iar punctuația cu punct și virgulă face distincte actele de milă. Marcajul notei este plasat după expresia pe care o explică.
