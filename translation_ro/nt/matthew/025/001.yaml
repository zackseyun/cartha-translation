lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Redă firesc indicatorul temporal și păstrează legătura cu contextul escatologic precedent.
- source_word: ὁμοιωθήσεται
  choice: va fi asemenea
  rationale: Formulare românească naturală pentru introducerea comparației parabolice; valoarea pasivă explicită a verbului grecesc este consemnată în nota [a].
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Împărăția cerurilor
  rationale: Expresia consacrată în limba română păstrează pluralul genitivului grecesc și uzul caracteristic lui Matei.
- source_word: δέκα παρθένοις
  choice: cu zece fecioare
  rationale: „Fecioare” redă direct sensul lui παρθένος în cadrul unei nunți, fără a-l lărgi la simplul sens de „tinere”.
- source_word: λαβοῦσαι τὰς λαμπάδας ἑαυτῶν
  choice: care și-au luat candelele
  rationale: Transformarea participiului într-o propoziție relativă este firească în română și păstrează anterioritatea acțiunii; „candele” redă sursele portabile de lumină, iar alternativa „făclii” este menționată în notă.
- source_word: ἐξῆλθον εἰς ὑπάντησιν
  choice: au ieșit în întâmpinarea
  rationale: Expresie românească idiomatică ce redă atât deplasarea în afară, cât și scopul întâlnirii.
- source_word: τοῦ νυμφίου
  choice: mirelui
  rationale: „Mire” este termenul românesc precis și firesc pentru νυμφίος în contextul nunții.
theological_decisions:
- issue: Formula comparației parabolice
  choice: Împărăția cerurilor va fi asemenea cu zece fecioare
  alternative: Împărăția cerurilor va fi asemănată cu zece fecioare
  rationale: Textul principal folosește o formulare românească mai naturală, fără a schimba obiectul comparației. Nota păstrează transparența asupra formei pasive a verbului grecesc și evită rezolvarea excesivă a construcției.
- issue: Sensul lui παρθένοις
  choice: fecioare
  alternative: tinere necăsătorite
  rationale: Alegerea păstrează specificitatea lexicală și imaginea nupțială a sursei, fără a introduce o interpretare doctrinară suplimentară.
translation_notes:
  register: Română standard modernă, clară și demnă. S-a păstrat expresia biblică bine cunoscută „Împărăția cerurilor”, iar sintaxa a fost formulată natural pentru cititorul contemporan. Notele marchează ambiguitățile lexicale reale fără a încărca textul principal.
