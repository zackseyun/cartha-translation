base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/001.yaml
  text: Then the kingdom of heaven will be like ten virgins[c][b][a], who took their lamps and went out to meet the bridegroom.
translation:
  language: ro
  text: Atunci Împărăția cerurilor va fi ca zece fecioare[a] care și-au luat lămpile[b] și au ieșit în întâmpinarea mirelui.
  philosophy: optimal-equivalence
