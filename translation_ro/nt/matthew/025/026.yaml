  text: ἀποκριθεὶς δὲ ὁ κύριος αὐτοῦ εἶπεν αὐτῷ· Πονηρὲ δοῦλε καὶ ὀκνηρέ, ᾔδεις ὅτι θερίζω ὅπου οὐκ ἔσπειρα καὶ συνάγω ὅθεν οὐ διεσκόρπισα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/026.yaml
  text: But his master answered and said to him[a], ‘Wicked and lazy servant[b], you knew that I reap where I did not sow and gather where I did not scatter?
translation:
  language: ro
  text: 'Stăpânul lui însă i-a răspuns: „Slujitor rău și leneș[a], știai că secer unde n-am semănat și adun de unde n-am împrăștiat[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Sclav rău și leneș”. Termenul grecesc doulos poate însemna „slujitor” sau „sclav”, în funcție de context.'
    reason: lexical_alternative
  - marker: b
    text: 'Cuvintele pot fi citite și ca un enunț, nu ca o întrebare retorică: „Știai că secer unde n-am semănat și adun de unde n-am împrăștiat.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: însă i-a răspuns
  rationale: Redă formula narativă grecească în mod firesc și păstrează nuanța ușor adversativă a lui δέ.
- source_word: ὁ κύριος αὐτοῦ
  choice: stăpânul lui
  rationale: În cadrul parabolei, κύριος indică stăpânul slujitorului, nu funcționează aici ca titlu cristologic direct.
- source_word: Πονηρὲ δοῦλε καὶ ὀκνηρέ
  choice: Slujitor rău și leneș
  rationale: „Rău” păstrează judecata morală exprimată de πονηρός, iar „leneș” redă clar și actual ὀκνηρός. „Slujitor” este firesc în narațiune, în timp ce alternativa lexicală „sclav” este consemnată în notă.
- source_word: ᾔδεις ὅτι
  choice: știai că
  rationale: Redă direct conținutul a ceea ce slujitorul pretindea că știe și permite atât lectura interogativ-retorică, cât și pe cea enunțiativă.
- source_word: θερίζω ὅπου οὐκ ἔσπειρα
  choice: secer unde n-am semănat
  rationale: Păstrează paralelismul agricol și succesiunea verbală a textului grec într-o română naturală.
- source_word: συνάγω ὅθεν οὐ διεσκόρπισα
  choice: adun de unde n-am împrăștiat
  rationale: Păstrează diferența dintre συνάγω, „adun”, și διασκορπίζω, „împrăștii”, fără a introduce în text obiectul subînțeles „sămânță”, absent din greacă.
theological_decisions:
- issue: Forța ultimei afirmații și punctuația
  choice: Cuvintele stăpânului sunt redate ca întrebare retorică.
  alternative: 'Cuvintele pot fi citite ca enunț: „Știai că secer unde n-am semănat și adun de unde n-am împrăștiat.”'
  rationale: Greaca nu impune prin punctuația originară una dintre cele două lecturi. Întrebarea retorică se potrivește replicii prin care stăpânul întoarce împotriva slujitorului propriile lui cuvinte, dar lectura enunțiativă rămâne posibilă și este păstrată în notă.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează imaginea agricolă și elipsa obiectului după „a împrăștia”, fără adaosul interpretativ „sămânță”.
