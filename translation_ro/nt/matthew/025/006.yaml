  text: μέσης δὲ νυκτὸς κραυγὴ γέγονεν· Ἰδοὺ ὁ ⸀νυμφίος, ἐξέρχεσθε εἰς ἀπάντησιν ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/006.yaml
  text: 'But at midnight a cry rang out: ‘Look[b][a], the bridegroom! Come out to meet him.’'
translation:
  language: ro
  text: 'Dar la miezul nopții s-a auzit un strigăt: „Iată mirele! Ieșiți-i în întâmpinare.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μέσης δὲ νυκτός
  choice: Dar la miezul nopții
  rationale: Construcția la genitiv exprimă idiomatic momentul acțiunii, iar δέ marchează o tranziție narativă cu o ușoară nuanță de contrast.
- source_word: κραυγὴ γέγονεν
  choice: s-a auzit un strigăt
  rationale: Redarea este firească în româna modernă și exprimă apariția bruscă a strigătului, fără calcarea rigidă „a fost un strigăt”.
- source_word: Ἰδού
  choice: Iată
  rationale: „Iată” este formula românească firească de atragere a atenției și păstrează forța deictică a termenului grec.
- source_word: ὁ νυμφίος
  choice: mirele
  rationale: „Mirele” desemnează precis bărbatul aflat în contextul nunții și păstrează imaginea parabolei.
- source_word: ἐξέρχεσθε
  choice: Ieșiți
  rationale: Imperativul plural este redat direct și natural; direcția este completată idiomatic de construcția „în întâmpinare”.
- source_word: εἰς ἀπάντησιν αὐτοῦ
  choice: ieșiți-i în întâmpinare
  rationale: Expresia românească reproduce concis idiomul grec al ieșirii pentru a întâlni și întâmpina o persoană.
theological_decisions:
- issue: Referentul parabolic al lui νυμφίος
  choice: „mirele”, cu literă mică și fără identificare explicită
  alternative: „Mirele”, cu majusculă
  rationale: Versetul îl prezintă pe mire în planul narativ al parabolei. Litera mică păstrează acest nivel literar și nu introduce în traducere identificarea cristologică dedusă din context.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează vivacitatea anunțului direct și evită atât arhaismele, cât și exprimarea excesiv de colocvială.
