id: MAT.25.34
reference: Matthew 25:34
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τότε ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ· Δεῦτε, οἱ εὐλογημένοι τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/034.yaml
  text: Then the King will say to those on his right[a], ‘Come, you who are blessed by my Father[b], inherit the kingdom prepared for you from the foundation of the world.’
translation:
  language: ro
  text: 'Atunci Regele le va spune celor de la dreapta lui: „Veniți, voi, cei binecuvântați de Tatăl meu[a], moșteniți împărăția pregătită pentru voi de la întemeierea lumii[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mai literal: „binecuvântații Tatălui meu”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „încă de la întemeierea lumii”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Redă firesc adverbul temporal care marchează următorul moment din scena judecății.
- source_word: ἐρεῖ
  choice: va spune
  rationale: Este echivalentul românesc natural al viitorului lui λέγω în introducerea vorbirii directe.
- source_word: ὁ βασιλεὺς
  choice: Regele
  rationale: Articolul hotărât și contextul indică o figură regală bine determinată; majuscula semnalează folosirea ca titlu al judecătorului din această scenă.
- source_word: τοῖς ἐκ δεξιῶν αὐτοῦ
  choice: celor de la dreapta lui
  rationale: Păstrează poziționarea spațială și conotația de onoare într-o formulare românească actuală.
- source_word: Δεῦτε
  choice: Veniți
  rationale: Imperativul plural exprimă direct chemarea solemnă adresată grupului.
- source_word: οἱ εὐλογημένοι τοῦ πατρός μου
  choice: voi, cei binecuvântați de Tatăl meu
  rationale: Participiul perfect pasiv substantivizat este redat clar, iar genitivul este înțeles natural ca indicând sursa sau agentul binecuvântării; nota păstrează construcția mai literală.
- source_word: κληρονομήσατε
  choice: moșteniți
  rationale: Păstrează sensul de primire a unei moșteniri și nu îl reduce la simplul „primiți”.
- source_word: τὴν ... βασιλείαν
  choice: împărăția
  rationale: În asociere cu „moșteniți” și „pregătită pentru voi”, termenul denumește cel mai firesc împărăția ca realitate eshatologică, fără a exclude ideea domniei.
- source_word: ἡτοιμασμένην ὑμῖν
  choice: pregătită pentru voi
  rationale: Redă participiul perfect pasiv și rezultatul prezent al pregătirii într-o formulare românească idiomatică.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: de la întemeierea lumii
  rationale: Urmează îndeaproape prepoziția ἀπό și păstrează expresia biblică consacrată despre începutul lumii.
theological_decisions:
- issue: Raportul genitivului τοῦ πατρός μου cu „cei binecuvântați”
  choice: cei binecuvântați de Tatăl meu
  alternative: binecuvântații Tatălui meu
  rationale: Construcția indică în mod natural sursa sau agentul binecuvântării. Varianta aleasă este limpede în româna modernă, iar alternativa mai literală este consemnată în notă.
- issue: Sensul lui βασιλεία în contextul moștenirii eshatologice
  choice: împărăția
  alternative: domnia
  rationale: Faptul că este moștenită și pregătită pentru destinatari favorizează sensul de împărăție, deși termenul grec poate exprima și domnia; traducerea nu neagă această dimensiune.
- issue: Legătura sintactică a expresiei ἀπὸ καταβολῆς κόσμου
  choice: expresia determină participiul „pregătită”
  alternative: o legătură mai largă cu întreaga invitație
  rationale: Poziția și sintaxa leagă cel mai firesc expresia temporală de pregătirea împărăției, fără a construi din verset un sistem doctrinar suplimentar.
translation_notes:
  register: Registru solemn, dar actual și ușor de înțeles. Formele „Veniți” și „moșteniți” păstrează adresarea la plural. Punctuația românească delimitează clar discursul direct, iar ordinea cuvintelor urmărește îndeaproape progresia textului grec fără a suna rigid.
