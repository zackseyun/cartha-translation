revisions:
- from: Iar pe robul[a] nefolositor aruncați-l în întunericul de afară. Acolo va fi plânsul și scrâșnirea dinților.
  to: Pe sclavul[a] inutil aruncați-l în întunericul de afară. Acolo va fi plânsul și scrâșnirea dinților.
