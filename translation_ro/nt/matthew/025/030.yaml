id: MAT.25.30
reference: Matthew 25:30
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ τὸν ἀχρεῖον δοῦλον ἐκβάλετε εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/030.yaml
  text: And throw the worthless servant into the outer darkness[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: ro
  text: Pe sclavul[a] inutil aruncați-l în întunericul de afară. Acolo va fi plânsul și scrâșnirea dinților.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Termenul grecesc doulos desemnează în mod obișnuit un sclav, adică o persoană aflată în dependența unui stăpân. În unele contexte poate fi redat și prin „slujitor”; aici, cadrul parabolei face relevant statutul de sclav.
    reason: Clarifică sensul social predominant al termenului grec și semnalează alternativa de traducere fără a-i estompa sensul în acest context.
lexical_decisions:
- source_word: ἀχρεῖον
  choice: nefolositor
  rationale: Redă direct ideea de lipsă de folos în evaluarea stăpânului, fără a introduce în mod necesar sensul moral mai larg pe care l-ar putea sugera „netrebnic”.
- source_word: δοῦλον
  choice: rob
  rationale: În cadrul parabolei, termenul indică o persoană aflată sub autoritatea și în dependența stăpânului. „Rob” păstrează această relație mai bine decât simplul „slujitor”, iar nota explică aria semantică.
- source_word: ἐκβάλετε
  choice: aruncați-l
  rationale: Imperativul este categoric și exprimă o alungare violentă; „aruncați-l” este firesc și păstrează forța verbului grec.
- source_word: σκότος τὸ ἐξώτερον
  choice: întunericul de afară
  rationale: Formularea românească este clară și consacrată, păstrând imaginea excluderii într-un întuneric exterior.
- source_word: ἐκεῖ
  choice: acolo
  rationale: Redă simplu și exact adverbul locativ, trimițând la întunericul tocmai menționat.
- source_word: κλαυθμὸς
  choice: plânsul
  rationale: Este echivalentul firesc și tradițional al termenului în formula mateiană, fără a preciza excesiv intensitatea sau natura durerii.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: scrâșnirea dinților
  rationale: Expresia consacrată în română păstrează imaginea puternică, precum și posibila asociere cu chinul, furia ori ambele, fără a o restrânge interpretativ.
theological_decisions:
- issue: Natura imaginii judecății din parabolă
  choice: Păstrarea imaginilor excluderii, întunericului și suferinței fără identificarea lor explicită cu iadul sau cu o anumită formă de pedeapsă.
  alternative: Interpretarea explicită drept iad, judecată finală ori doar excludere temporară sau metaforică.
  rationale: Versetul folosește limbaj mateian de judecată, însă traducerea trebuie să păstreze imaginile și tensiunea textului, fără a introduce o precizare doctrinară pe care acesta nu o formulează aici.
translation_notes:
  register: Română standard modernă, cu ton demn și direct. „Rob” are rezonanță biblică, dar rămâne inteligibil; nota previne atât atenuarea relației sociale prin „slujitor”, cât și confundarea automată cu toate formele moderne ale sclaviei. Topica păstrează accentul inițial exprimat prin καί și face porunca naturală în română.
