review_pass:
  verdict: revise
  source_fidelity: Revizuire necesară, dar sensul de bază este corect. «Nefolositor» redă ἀχρεῖος, însă «inutil» este mai firesc în româna standard actuală și păstrează evaluarea de lipsă de folos fără a introduce conotația morală mai largă a lui «netrebnic». «Întunericul de afară», «plânsul» și «scrâșnirea dinților» redau fidel formula mateiană.
  naturalness: 'Textul este în mare parte natural, dar «rob» are astăzi o pronunțată rezonanță arhaică, biblică sau religioasă și poate sugera «rob al lui Dumnezeu» mai degrabă decât raportul social de dependență din parabolă. «Sclav» este termenul modern standard mai clar. Topica cu obiectul anticipat păstrează accentul grecesc și este firească: «Pe sclavul inutil aruncați-l...»'
  terminology: δοῦλος este redat aici prin «sclav», deoarece contextul parabolei presupune relația stăpân–sclav. Nota trebuie să precizeze că «slujitor» este o redare posibilă în funcție de context, nu să lase impresia că toate aceste cuvinte sunt echivalente sociale directe. Nu este necesară interpretarea imaginii drept iad sau o anumită formă de pedeapsă.
  issues:
  - severity: medium
    issue: «rob» este prea marcat arhaic în româna standard modernă.
    rationale: Deși poate apărea în traduceri biblice tradiționale, termenul nu exprimă la fel de transparent raportul social desemnat de δοῦλος într-o parabolă despre un stăpân și persoanele aflate în proprietatea/serviciul lui. «Sclav» este mai clar și mai actual.
  - severity: low
    issue: «nefolositor» este corect, dar mai puțin idiomatic decât «inutil» în acest enunț.
    rationale: ἀχρεῖος indică lipsa de folos sau de valoare în evaluarea stăpânului. «Inutil» transmite concis acest sens, fără a moraliza expresia.
  - severity: low
    issue: Formularea notei despre aria semantică a lui δοῦλος necesită nuanțare.
    rationale: «Slujitor» poate fi o opțiune de traducere contextuală, însă δοῦλος desemnează în mod fundamental o persoană aflată în statut de sclav/dependent; nota trebuie să păstreze această distincție.
  revised_text: Pe sclavul[a] inutil aruncați-l în întunericul de afară. Acolo va fi plânsul și scrâșnirea dinților.
  revised_footnotes:
