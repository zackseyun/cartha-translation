id: MAT.25.41
reference: Matthew 25:41
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων· Πορεύεσθε ἀπ’ ἐμοῦ ⸀οἱ κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/041.yaml
  text: Then he will also say to those on the left[a], ‘Go away from me, you cursed, into the eternal fire prepared for the devil and his angels.’
translation:
  language: ro
  text: 'Atunci le va spune și celor din stânga: „Plecați de la mine, blestemaților[a], în focul veșnic, pregătit pentru diavol și îngerii lui!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „voi, cei blestemați”.'
    reason: Alternativă care redă mai explicit forma participială pasivă οἱ κατηραμένοι.
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Marchează succesiunea în scena judecății și este formularea firească în româna actuală.
- source_word: ἐρεῖ
  choice: le va spune
  rationale: Redă viitorul verbului λέγω și include natural în română complementul indirect exprimat în greacă.
- source_word: τοῖς ἐξ εὐωνύμων
  choice: celor din stânga
  rationale: Expresie idiomatică pentru grupul așezat la stânga regelui în contextul imediat.
- source_word: Πορεύεσθε ἀπ’ ἐμοῦ
  choice: Plecați de la mine
  rationale: Exprimă limpede porunca de a părăsi prezența vorbitorului, fără formulare arhaică.
- source_word: οἱ κατηραμένοι
  choice: blestemaților
  rationale: Participiul perfect pasiv este folosit ca adresare directă; vocativul românesc păstrează concizia și forța expresiei.
- source_word: εἰς τὸ πῦρ τὸ αἰώνιον
  choice: în focul veșnic
  rationale: Păstrează direcția spre destinație exprimată de εἰς și sensul contextual al lui αἰώνιον.
- source_word: τὸ ἡτοιμασμένον
  choice: pregătit
  rationale: Redă starea rezultată dintr-o pregătire anterioară și se acordă firesc cu „focul”.
- source_word: τῷ διαβόλῳ
  choice: pentru diavol
  rationale: În acest context, διάβολος este desemnarea consacrată a adversarului personal, nu un substantiv generic.
- source_word: τοῖς ἀγγέλοις αὐτοῦ
  choice: îngerii lui
  rationale: Contextul judecății indică ființe supranaturale asociate diavolului, nu mesageri umani.
theological_decisions:
- issue: Sensul lui αἰώνιον în contextul judecății
  choice: veșnic
  alternative: de durată veacului
  rationale: „Veșnic” este echivalentul românesc normal în acest context și păstrează gravitatea afirmației fără a introduce o explicație doctrinară suplimentară.
- issue: Referentul termenilor διάβολος și ἄγγελοι
  choice: diavol și îngerii lui
  alternative: defăimător și mesagerii lui
  rationale: În scena escatologică, termenii îi desemnează în mod convențional pe diavol și pe ființele cerești asociate lui; redarea generică ar obscuriza referenții.
translation_notes:
  register: Română standard modernă, solemnă și directă. S-a evitat atât arhaismul „duceți-vă de la mine”, cât și o parafrazare explicativă. Pronumele referitor la vorbitor rămâne cu literă mică, potrivit ortografiei curente și fără a adăuga o marcă interpretativă absentă din greacă.
