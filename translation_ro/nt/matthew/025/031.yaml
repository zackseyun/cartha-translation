  source_fidelity: Textul redă fidel construcția temporală cu referință viitoare („Când va veni”), nuanța de tranziție a lui δέ („însă”), titlul „Fiul Omului”, „în slava sa”, prezența tuturor îngerilor împreună cu el și succesiunea marcată de „atunci”. „Va ședea” redă direct viitorul lui καθίσει. „Pe tronul său glorios” este o redare idiomatică justificată a lui ἐπὶ θρόνου δόξης αὐτοῦ, fără a pierde sensul de tron asociat cu slava sa.
  naturalness: Româna este standard, cursivă și potrivită unui registru biblic modern și demn. „Va ședea” are o ușoară culoare literar-biblică, dar rămâne inteligibil și natural în acest gen. „Împreună cu toți îngerii” exprimă firesc însoțirea, fără a adăuga posesivul absent din greacă.
  terminology: „Fiul Omului” păstrează forma consacrată a titlului și rezonanța sa intertextuală, fără interpretare suplimentară. „Slava” este termenul biblic potrivit pentru δόξα. Nota oferă transparent alternativa mai literală pentru expresia referitoare la tron.
