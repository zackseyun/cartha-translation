id: MAT.25.31
reference: Matthew 25:31
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες ⸀οἱ ἄγγελοι μετ’ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/031.yaml
  text: But when the Son of Man comes in his glory[a], and all the angels with him, then he will sit on his glorious throne.
translation:
  language: ro
  text: Când va veni însă Fiul Omului în slava sa, împreună cu toți îngerii, atunci va ședea pe tronul său glorios[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mai literal: „tronul slavei sale”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Când va veni însă
  rationale: Construcția introduce un eveniment viitor unic, iar „când” este firesc în româna actuală. „Însă” redă tranziția ușor contrastivă marcată de δέ fără a impune un contrast puternic.
- source_word: ἔλθῃ
  choice: va veni
  rationale: Aoristul conjunctiv după ὅταν privește spre un eveniment viitor; româna îl redă natural prin viitor.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Păstrează titlul consacrat și rezonanța sa din Daniel, fără a-l înlocui cu o parafrază interpretativă.
- source_word: ἐν τῇ δόξῃ αὐτοῦ
  choice: în slava sa
  rationale: „Slavă” păstrează sensul de măreție manifestată și ecoul biblic al termenului δόξα.
- source_word: πάντες οἱ ἄγγελοι μετ’ αὐτοῦ
  choice: împreună cu toți îngerii
  rationale: Redă în mod natural în română însoțirea și păstrează formularea greacă „toți îngerii”, fără a adăuga posesivul „săi”.
- source_word: τότε καθίσει
  choice: atunci va ședea
  rationale: „Atunci” păstrează succesiunea explicită, iar „va ședea” redă direct verbul καθίζω într-un registru biblic demn și inteligibil.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: pe tronul său glorios
  rationale: Formularea este idiomatică în româna modernă și exprimă tronul caracterizat de slava sa; construcția greacă mai formală este păstrată în notă.
theological_decisions:
- issue: Titlul cristologic ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  alternative: Fiul omului / Omul
  rationale: Titlul consacrat păstrează ambiguitatea și încărcătura mesianică și judiciară legată de Daniel 7, fără o parafrazare doctrinară.
- issue: Construcția θρόνου δόξης αὐτοῦ
  choice: tronul său glorios
  alternative: tronul slavei sale
  rationale: Varianta din text este firească în româna actuală, iar alternativa literală rămâne vizibilă în notă pentru transparență și pentru păstrarea rezonanței teologice.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. S-a păstrat titlul tradițional „Fiul Omului”, fără adăugarea unui posesiv la „îngerii”. Pronumele posesive referitoare la Fiul Omului nu sunt capitalizate, pentru a evita introducerea unei convenții confesionale absente din textul grec.
