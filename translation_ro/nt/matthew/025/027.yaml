id: MAT.25.27
reference: Matthew 25:27
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἔδει ⸂σε οὖν⸃ βαλεῖν ⸂τὰ ἀργύριά⸃ μου τοῖς τραπεζίταις, καὶ ἐλθὼν ἐγὼ ἐκομισάμην ἂν τὸ ἐμὸν σὺν τόκῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/027.yaml
  text: Therefore[a], you should have deposited my money with the bankers, and when I came, I would have received what was mine with interest.
translation:
  language: ro
  text: Așadar, ar fi trebuit să depui banii mei la bancheri, iar eu, la întoarcere, aș fi primit ce era al meu cu dobândă.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδει
  choice: ar fi trebuit
  rationale: Imperfectul verbului impersonal exprimă ceea ce se cuvenea sau trebuia făcut în trecut; formularea redă firesc mustrarea și situația contrară faptelor.
- source_word: οὖν
  choice: Așadar
  rationale: Marchează concluzia dedusă din acuzația precedentă, într-un registru limpede și demn.
- source_word: βαλεῖν
  choice: să depui
  rationale: Deși sensul de bază este „a pune”, asocierea cu bancherii și dobânda indică aici depunerea banilor.
- source_word: τὰ ἀργύριά μου
  choice: banii mei
  rationale: Pluralul lui ἀργύριον poate desemna argint sau bani; contextul financiar cere sensul funcțional „bani”.
- source_word: τοῖς τραπεζίταις
  choice: la bancheri
  rationale: Termenul desemnează persoane care se ocupau cu operațiuni bănești; menționarea dobânzii susține echivalentul „bancheri”.
- source_word: ἐλθὼν ἐγὼ
  choice: eu, la întoarcere
  rationale: Participiul aorist are valoare temporală, iar pronumele explicit este păstrat prin „eu”, fără o construcție greoaie.
- source_word: ἐκομισάμην ἂν
  choice: aș fi primit
  rationale: Forma cu ἄν exprimă rezultatul contrar faptelor; verbul la diateza medie poate însemna a primi sau a recupera pentru sine.
- source_word: τὸ ἐμὸν
  choice: ce era al meu
  rationale: Posesivul substantivizat subliniază proprietatea stăpânului, iar formularea este idiomatică în româna actuală.
- source_word: σὺν τόκῳ
  choice: cu dobândă
  rationale: În context financiar, τόκος înseamnă dobânda produsă de bani; termenul românesc este precis și neutru.
theological_decisions:
- issue: Limbajul financiar al parabolei și posibila interpretare morală excesivă a dobânzii
  choice: Redarea neutră a termenilor financiari ca elemente ale imaginii parabolice
  alternative: Folosirea unui termen cu nuanță morală negativă, precum „camătă”
  rationale: Versetul utilizează limbaj economic pentru argumentul intern al parabolei și nu formulează aici o aprobare sau o condamnare generală a împrumutului cu dobândă.
translation_notes:
  register: 'Română standard modernă, clară și demnă. Formularea urmărește echivalența optimă: păstrează inferența, mustrarea și condiționalul contrar faptelor, folosind terminologie financiară naturală.'
