  text: But while the bridegroom was delayed[b][a], they all became drowsy and fell asleep.
translation:
  language: ro
  text: Dar, cum mirele întârzia[a], tuturor li s-a făcut somn și au adormit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „cum mirele zăbovea”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mai literal, în privința aspectului verbal: „tuturor li s-a făcut somn și dormeau”. Greaca deosebește instalarea somnolenței (ἐνύσταξαν) de starea de somn (ἐκάθευδον).'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρονίζοντος
  choice: întârzia
  rationale: Participiul prezent exprimă faptul că mirele venea mai târziu decât era așteptat; imperfectul românesc redă firesc durata situației.
- source_word: δὲ
  choice: Dar
  rationale: Conjuncția marchează o ușoară schimbare sau opoziție în desfășurarea narațiunii.
- source_word: νυμφίου
  choice: mirele
  rationale: „Mirele” este termenul românesc precis și consacrat pentru νυμφίος în cadrul unei nunți.
- source_word: ἐνύσταξαν
  choice: li s-a făcut somn
  rationale: Formularea redă natural în română instalarea somnolenței și o deosebește de somnul propriu-zis exprimat de verbul următor.
- source_word: πᾶσαι
  choice: tuturor
  rationale: Forma de feminin plural se referă la toate cele zece fecioare; dativul distributiv este cerut de expresia românească aleasă.
- source_word: ἐκάθευδον
  choice: au adormit
  rationale: Redarea exprimă firesc progresia de la somnolență la somn. Nota păstrează posibilitatea de a reda mai strict imperfectul grecesc prin „dormeau”.
theological_decisions:
- issue: Imaginea parabolică a mirelui
  choice: Păstrarea termenului „mirele” fără identificare explicită
  alternative: Introducerea explicită în text a unei identificări cristologice
  rationale: Contextul mai larg poate conferi imaginii rezonanță teologică, însă versetul prezintă direct scena parabolei; traducerea nu trebuie să transforme interpretarea implicită în explicație explicită.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. Expresia „li s-a făcut somn” evită formularea rigidă „au devenit somnoroase”, iar nota consemnează contrastul lexical și aspectual din greacă.
