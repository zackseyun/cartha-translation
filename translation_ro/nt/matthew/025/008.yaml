source:
  edition: SBLGNT
  text: αἱ δὲ μωραὶ ταῖς φρονίμοις εἶπαν· Δότε ἡμῖν ἐκ τοῦ ἐλαίου ὑμῶν, ὅτι αἱ λαμπάδες ἡμῶν σβέννυνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/008.yaml
  text: But the foolish said to the wise[a], ‘Give us some of your oil, because our lamps are going out.’
translation:
  language: ro
  text: 'Dar cele nechibzuite le-au zis celor chibzuite: „Dați-ne din uleiul vostru, pentru că lămpile[a] noastre se sting.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „făclii”. Grecescul λαμπάδες poate desemna o sursă portabilă de lumină care arde, inclusiv o lampă sau o făclie; traducerile diferă în funcție de înțelegerea scenei.
    reason: alternativă lexicală pentru λαμπάδες; păstrează ambiguitatea relevantă a termenului-sursă.
lexical_decisions:
- source_word: μωραὶ
  choice: cele nechibzuite
  rationale: Adjectiv substantivizat, referitor la fecioarele din parabolă; „nechibzuite” redă lipsa judecății practice și păstrează contrastul cu φρονίμοις fără tonul mai insultător al lui „proaste”.
- source_word: φρονίμοις
  choice: celor chibzuite
  rationale: În context desemnează persoane prevăzătoare și cu judecată practică; „chibzuite” formează un contrast firesc cu „nechibzuite”.
- source_word: Δότε ἡμῖν
  choice: Dați-ne și nouă
  rationale: Imperativul plural este redat direct; „și nouă” exprimă idiomatic în română solicitarea de a primi o parte din rezerva celorlalte, fără a schimba sensul.
- source_word: ἐκ τοῦ ἐλαίου ὑμῶν
  choice: din untdelemnul vostru
  rationale: Construcția cu ἐκ are sens partitiv. „Din untdelemnul vostru” îl păstrează natural și demn; „untdelemn” este termenul românesc biblic consacrat și inteligibil în acest context.
- source_word: λαμπάδες
  choice: lămpile
  rationale: λαμπάς poate desemna o lampă sau o torță; „lămpi” se potrivește firesc menționării untdelemnului și scenei parabolei, deși „făclii” rămâne lexical posibil.
- source_word: σβέννυνται
  choice: se sting
  rationale: Prezentul descrie un proces în desfășurare; forma reflexivă românească este idiomatică și nu impune un agent exterior.
- source_word: ὅτι
  choice: pentru că
  rationale: Introduce explicit motivul cererii și redă limpede valoarea cauzală.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. S-a păstrat paralelismul „cele nechibzuite / celor chibzuite”; punctuația dialogului urmează uzul românesc actual.
