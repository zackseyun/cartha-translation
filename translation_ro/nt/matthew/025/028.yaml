  text: ἄρατε οὖν ἀπ’ αὐτοῦ τὸ τάλαντον καὶ δότε τῷ ἔχοντι τὰ δέκα τάλαντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/028.yaml
  text: Therefore take the talent from him and give it to the one who has the ten talents[a][b].
translation:
  language: ro
  text: Așadar, luați de la el talantul[a] și dați-l celui care are cei zece talanți.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un „talant” era o unitate mare de greutate, folosită și ca unitate monetară.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρατε
  choice: luați
  rationale: Imperativ aorist activ, persoana a doua plural, exprimând porunca directă de a lua obiectul de la cineva; construcția românească „luați de la el” redă firesc și sensul de îndepărtare.
- source_word: οὖν
  choice: așadar
  rationale: Marchează concluzia care decurge din judecata precedentă și păstrează clar legătura logică.
- source_word: ἀπ’ αὐτοῦ
  choice: de la el
  rationale: ἀπό cu genitivul indică separarea de slujitorul tocmai condamnat; „de la el” este formularea românească directă și naturală.
- source_word: τὸ τάλαντον
  choice: talantul
  rationale: Păstrează termenul istoric pentru o unitate foarte mare de greutate și, prin extensie, de valoare monetară, fără a-l interpreta drept aptitudine înnăscută.
- source_word: δότε
  choice: dați-l
  rationale: Imperativ aorist activ, persoana a doua plural; pronumele „-l” este cerut firesc în română pentru reluarea obiectului direct „talantul”.
- source_word: τῷ ἔχοντι
  choice: celui care are
  rationale: Participiul articulat are valoare substantivală; formularea este actuală și păstrează referirea generică fără să adauge explicit „omului”.
- source_word: τὰ δέκα τάλαντα
  choice: cei zece talanți
  rationale: Articolul grecesc indică suma precisă menționată deja; articolul demonstrativ românesc „cei” păstrează această specificitate.
theological_decisions:
- issue: Sensul lui τάλαντον în contextul parabolei
  choice: Termenul istoric monetar „talant”, explicat în notă
  alternative: „sumă de bani” sau „banii”
  rationale: Contextul privește valori încredințate și tragerea la răspundere. Păstrarea termenului istoric evită interpretarea lui ca aptitudine naturală și menține textura culturală a parabolei.
translation_notes:
  register: Română standard modernă, clară și demnă. „Așadar” păstrează inferența exprimată de οὖν, iar cele două imperative sunt redate direct. Nu este necesară o notă separată pentru alternativa „luați-i”, deoarece „luați de la el” redă atât verbul, cât și complementul de separare fără ambiguitate artificială.
