id: MAT.25.18
reference: Matthew 25:18
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ τὸ ἓν λαβὼν ἀπελθὼν ὤρυξεν ⸀γῆν καὶ ⸀ἔκρυψεν τὸ ἀργύριον τοῦ κυρίου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/018.yaml
  text: But the one who had received the one talent went away[a], dug in the ground, and hid his master's money.
translation:
  language: ro
  text: Dar cel care primise un talant s-a dus, a săpat în pământ și a ascuns banii stăpânului său.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, mai literal: „argintul stăpânului său”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ τὸ ἓν λαβὼν
  choice: Dar cel care primise un talant
  rationale: δέ marchează contrastul cu ceilalți slujitori, iar participiul λαβών indică o acțiune anterioară verbelor principale. Substantivul „talant” este subînțeles în greacă din contextul imediat și este exprimat în română pentru claritate.
- source_word: ἀπελθὼν
  choice: s-a dus
  rationale: Redă natural deplasarea urmată de acțiunile principale, fără registrul mai livresc al lui „a plecat de acolo” sau „s-a îndepărtat”.
- source_word: ὤρυξεν γῆν
  choice: a săpat în pământ
  rationale: Expresia românească este firească și păstrează formularea concisă a grecei, fără a adăuga explicit „o groapă”, deși aceasta este implicită.
- source_word: ἔκρυψεν
  choice: a ascuns
  rationale: Echivalentul direct și firesc al verbului κρύπτω în acest context.
- source_word: τὸ ἀργύριον
  choice: banii
  rationale: ἀργύριον poate însemna „argint” sau, prin extensie, „bani”. În contextul fondurilor încredințate, „banii” comunică limpede sensul, iar alternativa literală este păstrată în notă.
- source_word: τοῦ κυρίου αὐτοῦ
  choice: stăpânului său
  rationale: În cadrul parabolei, κύριος desemnează superiorul uman al slujitorului. „Stăpân” redă relația de autoritate și evită confundarea referinței imediate cu titlul divin „Domnul”.
theological_decisions:
- issue: Redarea lui κύριος într-o referire parabolică nemijlocit umană
  choice: stăpânului
  alternative: domnului
  rationale: Referentul din lumea relatării este stăpânul slujitorului. Alegerea contextuală „stăpân” păstrează raportul social și nu transformă nejustificat termenul într-un titlu divin, fără a nega dimensiunea simbolică a parabolei.
translation_notes:
  register: Română standard modernă, clară și demnă. Ordinea acțiunilor este redată fluent, iar formularea evită atât arhaismele, cât și explicitările interpretative inutile.
