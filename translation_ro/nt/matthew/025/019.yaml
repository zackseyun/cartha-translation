source:
  edition: SBLGNT
  text: μετὰ δὲ ⸂πολὺν χρόνον⸃ ἔρχεται ὁ κύριος τῶν δούλων ἐκείνων καὶ συναίρει ⸂λόγον μετ’ αὐτῶν⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/019.yaml
  text: After a long time[a], the master of those servants comes and settles accounts with them.
translation:
  language: ro
  text: După mult timp, stăpânul acelor sclavi[a] vine și încheie socotelile cu ei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gr. κύριος poate fi redat și prin „domn”, iar δοῦλοι prin „slujitori”. „Sclavi” face explicit statutul lor de dependență în gospodăria din parabolă; „stăpânul” redă rolul contextual al lui κύριος.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ δὲ πολὺν χρόνον
  choice: După mult timp
  rationale: μετά cu acuzativul exprimă succesiunea temporală. δέ este aici un conector narativ slab, iar româna redă firesc progresia fără un „iar” sau „dar” adăugat.
- source_word: ἔρχεται
  choice: vine
  rationale: Păstrează prezentul istoric al textului grec și vivacitatea relatării.
- source_word: ὁ κύριος
  choice: stăpânul
  rationale: În cadrul parabolei, termenul desemnează persoana aflată în autoritate asupra robilor săi; „stăpânul” redă relația socială fără a transforma explicit termenul într-un titlu cristologic.
- source_word: τῶν δούλων ἐκείνων
  choice: acelor robi
  rationale: „Robi” păstrează statutul de dependență implicat de δοῦλος și este mai natural în registrul biblic românesc decât „sclavi” în această formulare, fără a-l reduce la sensul mai blând de simpli slujitori.
- source_word: συναίρει λόγον μετ’ αὐτῶν
  choice: încheie socotelile cu ei
  rationale: Expresia grecească este un idiom comercial pentru verificarea și decontarea conturilor; formularea românească este clară și firească.
theological_decisions:
- issue: Redarea lui κύριος în parabolă
  choice: stăpânul
  alternative: domnul
  rationale: Referentul imediat este stăpânul gospodăriei din parabolă. Alegerea evită impunerea în această propoziție a titlului teologic „Domnul”, fără a nega semnificația mai largă a parabolei.
- issue: Redarea lui δοῦλος
  choice: robi
  alternative: slujitori; sclavi
  rationale: „Robi” păstrează atât relația de subordonare și apartenență, cât și un registru românesc demn și inteligibil. „Slujitori” poate estompa statutul social, iar „sclavi” este mai explicit, dar mai puțin firesc în expresia tradițională a acestei parabole.
translation_notes:
  register: Română standard modernă, cu ton demn și formulare directă. Prezentul istoric este păstrat, iar conectorul slab δέ nu este redat separat.
