    rationale: Deși este inteligibil și tradițional în registrul biblic, „robi” poartă un colorit arhaizant și poate acoperi dependența în general. δοῦλοι desemnează aici persoane aflate sub stăpânire în economia gospodăriei; „sclavi” face acest statut explicit.
  - severity: low
    issue: Nota de subsol formulează alternativa „domnul acelor slujitori” ca și cum ar constitui o singură variantă.
    rationale: κύριος și δοῦλοι sunt două alegeri lexicale distincte. Nota este mai exactă dacă indică separat alternativele pentru fiecare termen și explică alegerea din text.
  revised_text: După mult timp, stăpânul acelor sclavi[a] vine și încheie socotelile cu ei.
