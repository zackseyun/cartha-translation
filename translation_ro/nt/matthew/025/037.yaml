id: MAT.25.37
reference: Matthew 25:37
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/037.yaml
  text: Then the righteous will answer him[a], saying, ‘Lord, when did we see you hungry and feed you, or thirsty and give you drink?’
translation:
  language: ro
  text: 'Atunci cei drepți îi vor răspunde: „Doamne, când te-am văzut flămând și ți-am dat să mănânci sau însetat și ți-am dat să bei?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Redă firesc adverbul temporal și succesiunea din discurs.
- source_word: ἀποκριθήσονται αὐτῷ
  choice: îi vor răspunde
  rationale: Verbul are sens activ, deși forma este deponentă, iar dativul αὐτῷ este redat idiomatic prin pronumele românesc la dativ.
- source_word: οἱ δίκαιοι
  choice: cei drepți
  rationale: Adjectivul substantivizat îi desemnează pe cei recunoscuți ca drepți în scena judecății; formularea este clară și consacrată în română.
- source_word: λέγοντες
  choice: ':'
  rationale: Participiul introduce vorbirea directă; în româna actuală, această funcție este redată natural prin două puncte, fără adaosul greoi „spunând”.
- source_word: Κύριε
  choice: Doamne
  rationale: Vocativul românesc păstrează atât adresarea respectuoasă, cât și rezonanța titlului κύριος.
- source_word: πεινῶντα καὶ ἐθρέψαμεν
  choice: flămând și ți-am dat să mănânci
  rationale: Redare idiomatică a stării și a acțiunii concrete exprimate de τρέφω, fără a pierde sensul de hrănire.
- source_word: διψῶντα καὶ ἐποτίσαμεν
  choice: însetat și ți-am dat să bei
  rationale: 'Construcția românească redă direct și firesc sensul cauzativ al lui ποτίζω: a da cuiva de băut.'
theological_decisions:
- issue: Redarea lui κύριος în adresarea directă către Isus
  choice: Doamne
  alternative: Stăpâne
  rationale: „Doamne” este echivalentul românesc obișnuit al vocativului κύριε și păstrează deschisă atât nuanța de respect, cât și semnificația hristologică din context.
- issue: Capitalizarea pronumelor care se referă la Isus
  choice: îi / te / ți, cu literă mică
  alternative: Îi / Te / Ți
  rationale: Textul grec nu codifică o asemenea distincție grafică. Litera mică urmează ortografia română curentă și evită introducerea unei convenții confesionale, fără a diminua identitatea referentului.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Vorbirea directă este introdusă firesc prin două puncte, iar construcțiile „ți-am dat să mănânci” și „ți-am dat să bei” sunt idiomatice și apropiate de sensul grec.
