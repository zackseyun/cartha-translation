id: MAT.25.15
reference: Matthew 25:15
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ᾧ μὲν ἔδωκεν πέντε τάλαντα ᾧ δὲ δύο ᾧ δὲ ἕν, ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν, καὶ ἀπεδήμησεν. εὐθέως
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/015.yaml
  text: And to one he gave five talents[a], to another two, and to another one, to each according to his own ability[b]; and he went away immediately.
translation:
  language: ro
  text: Și unuia i-a dat cinci talanți[a], altuia doi, iar altuia unul, fiecăruia după propria capacitate; și a plecat îndată.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un talant era o unitate foarte mare de greutate și de valoare monetară; aici nu înseamnă o aptitudine sau o înzestrare naturală.
    reason: lexical_clarification
  - marker: b
    text: 'Sau adverbul poate fi legat de versetul următor: „Îndată, cel care primise cei cinci talanți s-a dus...”'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: τάλαντα
  choice: talanți
  rationale: În context, termenul desemnează unități foarte mari de greutate și valoare monetară, nu aptitudini naturale. „Talanți” păstrează termenul istoric și legătura recognoscibilă cu parabola, iar nota previne înțelegerea lui în sensul românesc modern de „înzestrări”.
- source_word: ᾧ μὲν ... ᾧ δὲ ... ᾧ δὲ
  choice: unuia ... altuia ... iar altuia
  rationale: Redă firesc în română distribuirea contrastivă între cei trei slujitori.
- source_word: ἕν
  choice: unul
  rationale: Substantivul „talant” este subînțeles din enumerare; pronumele numeral evită o repetare greoaie fără pierdere de sens.
- source_word: ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν
  choice: fiecăruia după puterea lui
  rationale: „Puterea” exprimă aici capacitatea personală a fiecăruia, nu o putere miraculoasă. Singularul distributiv și pronumele corespunzător urmează îndeaproape construcția greacă.
- source_word: ἀπεδήμησεν
  choice: a plecat
  rationale: Verbul indică plecarea de acasă, de regulă într-o călătorie. În contextul deja stabilit al parabolei, formularea concisă este naturală și suficientă.
- source_word: εὐθέως
  choice: îndată
  rationale: Adverbul este redat direct, dar poziția sa la hotarul dintre propoziții permite legarea fie de plecarea stăpânului, fie de acțiunea imediat următoare a slujitorului; această ambiguitate este semnalată în notă.
- source_word: καί
  choice: Și / apoi
  rationale: Primul „și” păstrează legătura cu versetul anterior; înaintea plecării, „apoi” redă mai firesc în română progresia narațiunii fără a-i schimba sensul.
theological_decisions:
- issue: Sensul lui τάλαντα în parabolă
  choice: unități monetare numite „talanți”
  alternative: sume foarte mari de bani
  rationale: Bunurile încredințate au valoare financiară; traducerea nu trebuie să sugereze că stăpânul distribuie aptitudini naturale, chiar dacă parabola poate primi ulterior aplicații mai largi.
- issue: Referința singulară din expresia distributivă
  choice: fiecăruia după puterea lui
  alternative: fiecăruia după propria capacitate
  rationale: Formularea păstrează singularul distributiv al grecei și nu transformă „puterea” într-o categorie teologică sau supranaturală.
- issue: Legarea sintactică a adverbului εὐθέως
  choice: 'de plecarea stăpânului: „a plecat îndată”'
  alternative: 'de acțiunea slujitorului din versetul următor: „îndată, cel care primise...”'
  rationale: Poziția adverbului permite ambele legături. Textul principal oferă o propoziție completă în cadrul versetului, iar nota păstrează deschisă cealaltă analiză, fără a ascunde tensiunea sintactică.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. „Talanți” păstrează termenul istoric, explicat pentru a evita sensul modern ambiguu; alternanța „unuia ... altuia ... iar altuia” face enumerarea fluentă.
