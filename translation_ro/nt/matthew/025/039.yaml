  text: πότε δέ σε εἴδομεν ⸀ἀσθενοῦντα ἢ ἐν φυλακῇ καὶ ἤλθομεν πρός σε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/039.yaml
  text: And when did we see you sick or in prison and come to you?[a]
translation:
  language: ro
  text: Și când te-am văzut bolnav sau în închisoare și am venit la tine?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „te-am vizitat”. În greacă, formularea este mai literală: „am venit la tine”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: când
  rationale: Adverb interogativ temporal; „când” este echivalentul firesc în vorbirea directă.
- source_word: δέ
  choice: și
  rationale: Are aici rolul unei legături ușoare în succesiunea întrebărilor; „și” păstrează continuitatea fără a introduce un contrast puternic.
- source_word: εἴδομεν
  choice: am văzut
  rationale: Aoristul indicativ al lui ὁράω este redat natural în întrebarea românească prin perfectul compus.
- source_word: ἀσθενοῦντα
  choice: bolnav
  rationale: Participiul descrie aici starea de boală fizică, potrivit paralelismului contextual; „bolnav” este clar și actual.
- source_word: ἐν φυλακῇ
  choice: în închisoare
  rationale: φυλακή desemnează aici un loc de detenție; formularea este standard și nu introduce distincții juridice moderne.
- source_word: ἤλθομεν πρός σε
  choice: am venit la tine
  rationale: Redă transparent sensul concret al expresiei grecești, fără a-l restrânge la ideea mai specifică de vizită.
theological_decisions:
- issue: Dacă ἤλθομεν πρός σε trebuie redat idiomatic prin „te-am vizitat” sau mai literal prin „am venit la tine”
  choice: am venit la tine
  alternative: te-am vizitat
  rationale: Textul vorbește despre fapte de milă față de Fiul Omului identificat cu „cei mai neînsemnați”, însă expresia grecească indică în mod direct venirea la o persoană, nu folosește un verb specific pentru vizitare. Textul principal păstrează această formulare, iar alternativa idiomatică este consemnată în notă.
translation_notes:
  register: Română standard modernă, cu formulare simplă și demnă. Pronumele referitoare la Isus sunt scrise cu literă mică, potrivit ortografiei curente, fără a afecta referentul sau respectul exprimat de context.
