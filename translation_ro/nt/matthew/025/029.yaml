id: MAT.25.29
reference: Matthew 25:29
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τῷ γὰρ ἔχοντι παντὶ δοθήσεται καὶ περισσευθήσεται· ⸂τοῦ δὲ⸃ μὴ ἔχοντος καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/029.yaml
  text: For to everyone who has[a], more will be given, and he will have an abundance; but from the one who does not have, even what he has will be taken away from him.
translation:
  language: ro
  text: Căci oricui are i se va da și va avea din belșug; dar celui care nu are i se va lua chiar și ceea ce are.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ γὰρ ἔχοντι παντὶ
  choice: Căci oricui are
  rationale: Construcția cu participiu articulat și παντί are sens substantival și distributiv. „Oricui are” redă firesc în română caracterul generic și legătura explicativă marcată de γάρ.
- source_word: δοθήσεται
  choice: i se va da
  rationale: Păstrează viitorul pasiv al lui δίδωμι și exprimă idiomatic în română beneficiarul la dativ.
- source_word: καὶ περισσευθήσεται
  choice: și va avea din belșug
  rationale: περισσεύω indică ajungerea la abundență sau prisos. Formularea este naturală și păstrează ideea rezultatului fără a preciza nejustificat obiectul.
- source_word: τοῦ δὲ μὴ ἔχοντος
  choice: dar celui care nu are
  rationale: Genitivul construcției participiale este cerut de ideea separării din ἀπ’ αὐτοῦ; româna formulează contrastul natural prin „celui care nu are”.
- source_word: καὶ ὃ ἔχει
  choice: chiar și ceea ce are
  rationale: καί are aici valoare ascensivă, subliniind paradoxul; „chiar și” o redă clar.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: i se va lua
  rationale: Viitorul pasiv al lui αἴρω, împreună cu ἀπό, exprimă îndepărtarea. Construcția românească „i se va lua” redă concis atât pasivul, cât și separarea.
theological_decisions:
- issue: Referința generică a participiilor masculine la singular
  choice: 'Formulare singulară generică: „oricui are... celui care nu are”'
  alternative: 'Pluralul generic: „celor care au... celor care nu au”'
  rationale: Greaca folosește construcții participiale la singular cu valoare reprezentativă. Româna poate păstra singularul fără pronume masculine suplimentare, evitând atât restrângerea la bărbați, cât și aplatizarea structurii în plural.
- issue: Referentul implicit al verbului περισσευθήσεται
  choice: „va avea din belșug”, fără complement explicit
  alternative: „îi va prisosi” sau „va avea mai mult decât îi trebuie”
  rationale: Textul nu numește obiectul abundenței. Traducerea păstrează această deschidere și nu decide dacă este vorba strict despre bunurile din pildă sau despre un principiu spiritual mai larg.
translation_notes:
  register: Română standard modernă, clară și demnă. S-a păstrat paralelismul singular și contrastul sentențios al versetului; formularea evită arhaisme precum „va prisosi”, dar menține tonul solemn.
