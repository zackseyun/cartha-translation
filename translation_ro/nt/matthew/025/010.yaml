id: MAT.25.10
reference: Matthew 25:10
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι ἦλθεν ὁ νυμφίος, καὶ αἱ ἕτοιμοι εἰσῆλθον μετ’ αὐτοῦ εἰς τοὺς γάμους, καὶ ἐκλείσθη ἡ θύρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/010.yaml
  text: But while they were going away to buy[a], the bridegroom came, and those who were ready went in with him to the wedding feast, and the door was shut.
translation:
  language: ro
  text: Dar, pe când ele se duceau să cumpere, a venit mirele, iar cele care erau gata au intrat cu el la ospățul de nuntă[a], iar ușa a fost închisă.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „la sărbătoarea nunții” ori, simplu, „la nuntă”. Pluralul grecesc poate desemna celebrarea nunții în ansamblu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπερχομένων δὲ αὐτῶν
  choice: Dar, pe când ele se duceau
  rationale: Construcția la genitiv absolut exprimă o acțiune simultană. „Pe când ele se duceau” este firesc în româna actuală și păstrează ideea plecării din acel loc.
- source_word: ἀγοράσαι
  choice: să cumpere
  rationale: Infinitivul aorist exprimă scopul. Obiectul cumpărării, uleiul, rămâne implicit aici, ca în textul grec.
- source_word: ὁ νυμφίος
  choice: mirele
  rationale: „Mirele” este echivalentul românesc precis și firesc în contextul nunții, păstrând imaginea parabolei fără explicații teologice adăugate.
- source_word: αἱ ἕτοιμοι
  choice: cele care erau pregătite
  rationale: Adjectivul feminin plural este substantivizat și se referă la fecioarele pregătite. Formularea este clară și idiomatică.
- source_word: εἰσῆλθον μετ’ αὐτοῦ
  choice: au intrat cu el
  rationale: Redă direct și natural mișcarea narativă exprimată de aorist.
- source_word: εἰς τοὺς γάμους
  choice: la ospățul de nuntă
  rationale: Pluralul grec poate desemna celebrarea nunții în ansamblu; în acest context, „ospățul de nuntă” redă limpede participarea la sărbătoare.
- source_word: ἐκλείσθη ἡ θύρα
  choice: ușa a fost închisă
  rationale: Păstrează forma pasivă și caracterul definitiv al acțiunii, într-o formulare românească simplă și solemnă.
theological_decisions:
- issue: Redarea imaginii nunții în contextul parabolei
  choice: Păstrarea termenilor narativi „mirele” și „ospățul de nuntă”, fără identificarea explicită a personajelor
  alternative: Introducerea în traducere a unei interpretări cristologice explicite sau folosirea simplă a expresiei „la nuntă”
  rationale: Semnificația teologică trebuie să reiasă din parabolă și din context, nu dintr-o completare interpretativă. Redarea aleasă păstrează imaginea și solemnitatea scenei.
translation_notes:
  register: Română standard modernă, clară și demnă. Fraza păstrează succesiunea rapidă a acțiunilor și finalitatea solemnă a închiderii ușii. Marcajul notei este așezat lângă expresia la care se referă, εἰς τοὺς γάμους.
