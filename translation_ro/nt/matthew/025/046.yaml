  text: καὶ ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/046.yaml
  text: And these will go away into eternal punishment[a], but the righteous into eternal life.
translation:
  language: ro
  text: Și aceștia vor pleca la pedeapsă veșnică[a], iar cei drepți, la viață veșnică.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „pedeapsă pentru veac” … „viață pentru veac”. Sensul adjectivului αἰώνιος este discutat în unele contexte; aici însă același cuvânt califică atât „pedeapsă”, cât și „viață”, de aceea traducerea păstrează paralelismul prin „veșnică” în ambele expresii.'
    reason: alternativă lexicală
lexical_decisions:
- source_word: ἀπελεύσονται
  choice: vor pleca
  rationale: Viitorul lui ἀπέρχομαι exprimă îndepărtarea sau plecarea; formularea este firească în româna actuală și nu adaugă detalii interpretative.
- source_word: οὗτοι
  choice: aceștia
  rationale: Pronumele demonstrativ trimite la grupul descris anterior și păstrează contrastul concis cu „cei drepți”.
- source_word: κόλασιν
  choice: pedeapsă
  rationale: În contextul judecății, κόλασις desemnează consecința punitivă; „pedeapsă” este echivalentul românesc direct și clar.
- source_word: αἰώνιον
  choice: veșnică
  rationale: Același adjectiv califică atât „pedeapsă”, cât și „viață”. Redarea identică prin „veșnică” păstrează paralelismul grecesc; alternativa lexicală „pentru veac” este semnalată în notă.
- source_word: δίκαιοι
  choice: cei drepți
  rationale: Adjectivul substantivizat îi desemnează pe cei caracterizați sau socotiți drepți; expresia este idiomatică și consacrată în română.
- source_word: ζωὴν
  choice: viață
  rationale: Echivalentul direct al lui ζωή, fără ca acest context să impună o explicitare.
- source_word: δὲ
  choice: iar
  rationale: Particula marchează contrastul dintre cele două grupuri și destinele lor; „iar” redă natural în română opoziția, fără a o accentua excesiv.
theological_decisions:
- issue: Redarea lui αἰώνιον în expresiile paralele κόλασιν αἰώνιον și ζωὴν αἰώνιον
  choice: „veșnică” în ambele expresii
  alternative: „pentru veac” / „veacului” în ambele expresii
  rationale: Deoarece același adjectiv este folosit în ambele membre, traducerea păstrează aceeași redare și nu atribuie celor două destinații durate diferite. „Veșnică” este formularea românească naturală și standard, iar sensul alternativ disputat este consemnat în notă, fără a rezolva tacit dezbaterea.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. Elipsa verbului în al doilea membru reproduce concizia și paralelismul originalului; virgula după „cei drepți” clarifică elipsa. „Iar” exprimă contrastul într-un mod firesc românesc.
