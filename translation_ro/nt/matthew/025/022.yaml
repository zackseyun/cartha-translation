id: MAT.25.22
reference: Matthew 25:22
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: προσελθὼν ⸀δὲ καὶ ὁ τὰ δύο ⸀τάλαντα εἶπεν· Κύριε, δύο τάλαντά μοι παρέδωκας· ἴδε ἄλλα δύο τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/022.yaml
  text: Then the one who had received the two talents also came forward and said[a], ‘Lord, you handed over to me two talents. Look[b], I gained two more talents.’
translation:
  language: ro
  text: 'Apoi s-a apropiat și cel care primise doi talanți și a spus: „Doamne[a], mi-ai încredințat doi talanți[b]. Iată, am câștigat încă doi talanți.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „Stăpâne”. Termenul grecesc kýrios este redat de obicei prin „Domn”; în această parabolă poate funcționa și ca adresare respectuoasă către un stăpân.
    reason: alternative_reading
  - marker: b
    text: Talanții erau unități mari de greutate și valoare monetară, nu aptitudini naturale.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: a venit
  rationale: Participiul aorist al lui προσέρχομαι descrie apropierea slujitorului pentru a vorbi; în succesiunea narativă, „a venit” este firesc și suficient de clar.
- source_word: δὲ καὶ
  choice: Apoi ... și
  rationale: Redă atât progresia relatării, cât și adăugarea acestui slujitor la cel menționat anterior.
- source_word: ὁ τὰ δύο τάλαντα
  choice: cel cu cei doi talanți
  rationale: Construcția substantivală îl identifică prin suma primită. Formularea românească este concisă, iar contextul arată că talanții îi fuseseră încredințați.
- source_word: Κύριε
  choice: Doamne
  rationale: Vocativul consacrat și natural al lui κύριος; păstrează sensul de „Domn”, deși în cadrul parabolei poate fi și o adresare respectuoasă către un stăpân.
- source_word: παρέδωκας
  choice: mi-ai încredințat
  rationale: În context, παραδίδωμι indică darea bunurilor în grija slujitorului. „Ai încredințat” exprimă natural relația de administrare, fără a sugera transfer definitiv de proprietate.
- source_word: ἴδε
  choice: Iată
  rationale: Interjecția atrage atenția asupra rezultatului prezentat; „Iată” este demn, clar și curent în registrul biblic românesc.
- source_word: ἄλλα δύο τάλαντα
  choice: încă doi talanți
  rationale: ἄλλα împreună cu numeralul indică o cantitate suplimentară egală; „încă doi” este idiomatic în română.
- source_word: ἐκέρδησα
  choice: am câștigat
  rationale: κερδαίνω înseamnă a dobândi un câștig sau profit; „am câștigat” păstrează sensul fără a preciza metoda.
- source_word: τάλαντα
  choice: talanți
  rationale: Păstrează termenul istoric pentru unitatea mare de greutate și valoare, clarificat prin nota culturală pentru a evita sensul modern de aptitudine.
theological_decisions:
- issue: Redarea lui κύριος ca adresare în parabolă
  choice: Doamne
  alternative: Stăpâne
  rationale: „Doamne” păstrează echivalentul obișnuit al lui κύριος și continuitatea terminologică. „Stăpâne” este posibil în situația socială a parabolei și este indicat în notă, fără a elimina ambivalența termenului.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. S-a păstrat termenul tradițional „talanți”, explicat în notă, iar ambivalența lui κύριος este menținută prin nota alternativă.
