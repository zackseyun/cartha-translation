id: MAT.25.25
reference: Matthew 25:25
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ φοβηθεὶς ἀπελθὼν ἔκρυψα τὸ τάλαντόν σου ἐν τῇ γῇ· ἴδε ἔχεις τὸ σόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/025.yaml
  text: And being afraid[a], I went away and hid your talent in the ground. Look, you have what is yours.
translation:
  language: ro
  text: Și, de frică, m-am dus și am ascuns talantul[a] tău în pământ. Iată, ai ce este al tău.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un talant era o unitate de greutate și de valoare monetară foarte mare; aici nu se referă la o aptitudine înnăscută.
    reason: Clarifică sensul istoric și monetar al termenului „talant” pentru cititorii moderni.
lexical_decisions:
- source_word: φοβηθεὶς
  choice: fiindcă mi-a fost frică
  rationale: Participiul circumstanțial exprimă motivul declarat al slujitorului. Formularea este firească în româna actuală și nu transformă frica în reverență.
- source_word: ἀπελθὼν
  choice: m-am dus
  rationale: Participiul aorist este redat în succesiunea verbală „m-am dus și am ascuns”, păstrând ordinea acțiunilor într-o exprimare românească naturală.
- source_word: ἔκρυψα
  choice: am ascuns
  rationale: Redă direct sensul lui κρύπτω; ideea îngropării reiese din expresia următoare, fără a fi introdusă în verb.
- source_word: τὸ τάλαντόν σου
  choice: talantul tău
  rationale: „Talant” este termenul istoric consacrat în română pentru această unitate de mare valoare. Nota precizează sensul monetar și previne interpretarea modernă de aptitudine.
- source_word: ἐν τῇ γῇ
  choice: în pământ
  rationale: Echivalent idiomatic și exact pentru locul în care suma a fost ascunsă.
- source_word: ἴδε
  choice: Uite
  rationale: Interjecție deictică firească în vorbirea directă modernă, care atrage atenția asupra bunului restituit fără registrul arhaic al lui „iată”.
- source_word: ἔχεις τὸ σόν
  choice: ai ce este al tău
  rationale: 'Păstrează construcția eliptică și accentul posesiv: slujitorul susține că îi restituie stăpânului bunul care îi aparține.'
theological_decisions:
- issue: Sensul lui τάλαντον într-o parabolă asociată ulterior cu aptitudinile personale
  choice: Păstrarea termenului istoric „talant” în text și explicarea sensului monetar într-o notă
  alternative: o mare sumă de bani
  rationale: În greacă, termenul denumește o unitate de greutate și, prin extensie, o valoare monetară foarte mare, nu o aptitudine înnăscută. Soluția păstrează cadrul istoric și continuitatea literară fără a susține sensul metaforic ulterior.
translation_notes:
  register: Română standard modernă, clară și demnă. Discursul direct păstrează tonul defensiv al slujitorului. „Uite” este actual și natural, iar „talant” cere nota explicativă din cauza sensului modern al cuvântului „talent”.
