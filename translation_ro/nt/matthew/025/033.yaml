id: MAT.25.33
reference: Matthew 25:33
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ στήσει τὰ μὲν πρόβατα ἐκ δεξιῶν αὐτοῦ τὰ δὲ ἐρίφια ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/033.yaml
  text: And he will place the sheep at his right hand[b][a], but the goats at the left.
translation:
  language: ro
  text: Și va așeza oile la dreapta sa[b], iar caprele[a] la stânga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „caprele tinere” ori „iezii”; termenul grecesc ἐρίφια poate avea acest sens mai precis.'
    reason: lexical_alternative
  - marker: b
    text: 'Literal, în greacă: „dinspre dreapta sa ... dinspre stânga”, expresie idiomatică pentru așezarea la dreapta și la stânga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσει
  choice: va așeza
  rationale: 'Viitorul activ al lui ἵστημι este cauzativ aici: el face ca cele două grupuri să stea în locuri distincte. „Va așeza” este firesc în româna actuală și păstrează sensul tranzitiv.'
- source_word: πρόβατα
  choice: oile
  rationale: πρόβατα este termenul obișnuit pentru oi; articolul hotărât redă referirea la grupurile deja prezentate în scenă.
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: la dreapta sa
  rationale: Construcția idiomatică indică poziționarea în partea dreaptă a lui. Formularea românească este clară, demnă și nu adaugă explicit o interpretare simbolică.
- source_word: ἐρίφια
  choice: caprele
  rationale: Termenul poate desemna mai precis capre tinere sau iezi, însă în contrastul pastoral cu oile, „caprele” este formularea românească cea mai naturală și ușor de recunoscut; nuanța lexicală este păstrată în notă.
- source_word: ἐξ εὐωνύμων
  choice: la stânga
  rationale: Expresia înseamnă poziționarea în partea stângă. Posesivul nu este repetat în greacă și rămâne firesc implicit și în română.
- source_word: μὲν ... δὲ
  choice: iar
  rationale: Perechea marchează distribuirea contrastivă a celor două grupuri. „Iar” exprimă opoziția echilibrat și natural, fără rigiditatea unei redări mecanice.
theological_decisions:
- issue: Păstrarea sau explicitarea valorii simbolice a pozițiilor dreapta și stânga
  choice: 'Redare strict spațială: „la dreapta sa ... la stânga”'
  alternative: Extinderea prin „în locul favorii ... în locul dezaprobării”
  rationale: Versetul descrie poziționarea grupurilor în scena judecății. Valoarea lor simbolică reiese din context și nu trebuie introdusă explicativ în text.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Paralelismul dintre cele două grupuri este păstrat, iar idiomul spațial grec este redat firesc.
