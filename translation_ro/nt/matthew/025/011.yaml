id: MAT.25.11
reference: Matthew 25:11
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὕστερον δὲ ἔρχονται καὶ αἱ λοιπαὶ παρθένοι λέγουσαι· Κύριε κύριε, ἄνοιξον ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/011.yaml
  text: Later[a], the other virgins also come, saying, ‘Lord, lord[c][b], open to us.’
translation:
  language: ro
  text: 'Mai târziu vin și celelalte fecioare, spunând: „Doamne, Doamne[a], deschide-ne[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Domnule, domnule” ori „Stăpâne, stăpâne”. Grecește: Kýrie, kýrie.'
    reason: alternative_reading
  - marker: b
    text: Textul grec spune simplu „deschide-ne”; ușa este subînțeleasă din context.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: Mai târziu
  rationale: Redă firesc adverbul temporal care marchează o acțiune ulterioară, fără a adăuga o legătură cauzală.
- source_word: δὲ
  choice: —
  rationale: Conectorul slab este redat implicit prin tranziția temporală „Mai târziu”; introducerea lui „dar” ar sugera un contrast mai puternic decât cel cerut de context.
- source_word: ἔρχονται
  choice: vin
  rationale: Păstrează prezentul narativ al textului grec și vivacitatea relatării.
- source_word: καὶ αἱ λοιπαὶ παρθένοι
  choice: și celelalte fecioare
  rationale: „Și” păstrează forța aditivă a lui καί, iar „celelalte fecioare” este o redare directă și naturală a expresiei αἱ λοιπαὶ παρθένοι.
- source_word: λέγουσαι
  choice: spunând
  rationale: Păstrează construcția participială care introduce vorbirea directă.
- source_word: Κύριε κύριε
  choice: Doamne, Doamne
  rationale: Păstrează repetiția urgentă și tensiunea dintre adresarea respectuoasă din parabolă și rezonanța teologică a titlului în Evanghelia după Matei.
- source_word: ἄνοιξον ἡμῖν
  choice: deschide-ne
  rationale: Cliticul românesc redă dativul de interes/acces, iar obiectul subînțeles, ușa, nu este introdus în text.
theological_decisions:
- issue: Redarea vocativului κύριε în adresarea directă
  choice: Doamne
  alternative: Domnule; Stăpâne
  rationale: „Doamne” permite atât sensul de adresare către stăpânul casei, cât și rezonanța cristologică posibilă în contextul mai larg al lui Matei, fără a reduce expresia la un simplu apelativ social.
translation_notes:
  register: Română standard modernă, cu un ton narativ demn și accesibil. Prezentul narativ „vin” urmează forma greacă; repetiția din adresare este păstrată, iar obiectul implicit al verbului nu este explicat în textul principal.
