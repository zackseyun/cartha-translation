id: MAT.25.44
reference: Matthew 25:44
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/044.yaml
  text: Then they too will answer, saying, ‘Lord, when did we see you hungry or thirsty or a stranger or naked or sick or in prison, and not serve you?’
translation:
  language: ro
  text: 'Atunci vor răspunde și ei, zicând: „Doamne, când Te-am văzut flămând sau însetat, străin sau gol, bolnav sau în închisoare și nu Ți-am slujit?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „nu Te-am ajutat” ori „nu ne-am îngrijit de Tine”, pentru „nu Ți-am slujit” (grecescul διακονέω).'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Redă firesc adverbul temporal care marchează următoarea replică din scena judecății.
- source_word: ἀποκριθήσονται καὶ αὐτοὶ λέγοντες
  choice: vor răspunde și ei, zicând
  rationale: Păstrează viitorul, accentul inclusiv al expresiei καὶ αὐτοὶ și participiul introductiv, într-o formulare românească demnă și clară.
- source_word: Κύριε
  choice: Doamne
  rationale: Vocativul românesc consacrat pentru κύριος păstrează atât adresarea respectuoasă, cât și rezonanța cristologică.
- source_word: πεινῶντα ἢ διψῶντα
  choice: flămând sau însetat
  rationale: Adjectivele predicative redau natural participiile grecești după verbul „a vedea”.
- source_word: ξένον
  choice: străin
  rationale: Păstrează sensul social larg al unei persoane din afara cercului propriu, fără a-l restrânge la etnie sau cetățenie.
- source_word: γυμνὸν
  choice: gol
  rationale: Este echivalentul direct și tradițional, păstrând forța lexicală, chiar dacă în context poate include lipsa îmbrăcămintei suficiente.
- source_word: ἀσθενῆ
  choice: bolnav
  rationale: În enumerarea nevoilor trupești și sociale, sensul contextual cel mai probabil este „bolnav”, nu simplu „slab”.
- source_word: ἐν φυλακῇ
  choice: în închisoare
  rationale: Redare directă și idiomatică a situației de detenție.
- source_word: οὐ διηκονήσαμέν σοι
  choice: nu Ți-am slujit
  rationale: „A sluji” păstrează gama semantică largă a lui διακονέω și legătura dintre ajutorul practic și slujirea adusă Domnului.
theological_decisions:
- issue: Titlul κύριος adresat lui Isus
  choice: Doamne
  alternative: Stăpâne
  rationale: „Doamne” este vocativul standard pentru adresarea către Isus și păstrează rezonanța teologică fără a adăuga ceva ce textul nu afirmă explicit.
- issue: Forța verbului διακονέω în contextul faptelor de milă
  choice: Ți-am slujit
  alternative: Ți-am fost de ajutor / ne-am îngrijit de Tine
  rationale: Alegerea păstrează sensul mai larg al slujirii practice și corespondența teologică dintre ajutorarea celor nevoiași și slujirea Împăratului, fără a restrânge verbul la îngrijire sau la o slujire eclezială.
translation_notes:
  register: Română standard modernă, clară și demnă. Majusculele reverențiale din pronumele adresate Domnului urmează uzul biblic românesc; enumerarea concisă reproduce paralelismul sursei.
