  text: And calling the crowd to him[a], he said to them, “Listen and understand.”
translation:
  language: ro
  text: 'Și, chemând mulțimea la el, le-a spus: „Ascultați și înțelegeți!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Și
  rationale: Păstrează legătura coordonatoare simplă și continuitatea narațiunii fără a adăuga o nuanță temporală.
- source_word: προσκαλεσάμενος
  choice: chemând ... la el
  rationale: Participiul aorist mediu exprimă chemarea mulțimii spre Isus; construcția românească este firească și urmează îndeaproape forma greacă.
- source_word: τὸν ὄχλον
  choice: mulțimea
  rationale: Redă natural un grup numeros adunat și este termenul curent potrivit contextului narativ.
- source_word: εἶπεν αὐτοῖς
  choice: le-a spus
  rationale: Redare românească directă și idiomatică a verbului λέγω împreună cu pronumele la dativ.
- source_word: Ἀκούετε
  choice: Ascultați
  rationale: Imperativul prezent plural cere atenție activă; „Ascultați” este mai firesc în româna actuală decât literalul „Auziți”.
- source_word: συνίετε
  choice: înțelegeți
  rationale: Exprimă priceperea sensului celor auzite și păstrează distincția dintre ascultare și înțelegere.
