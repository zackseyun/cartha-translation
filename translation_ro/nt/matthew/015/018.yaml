id: MAT.15.18
reference: Matthew 15:18
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τὰ δὲ ἐκπορευόμενα ἐκ τοῦ στόματος ἐκ τῆς καρδίας ἐξέρχεται, κἀκεῖνα κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/018.yaml
  text: But the things that come out of the mouth come from the heart[a], and those defile the man.
translation:
  language: ro
  text: Dar cele care ies din gură vin din inimă, iar acelea îl întinează pe om.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „îl fac necurat pe om”.'
    reason: Păstrează alternativa lexicală mai explicită pentru κοινόω și fundalul terminologiei curăției.
lexical_decisions:
- source_word: τὰ ... ἐκπορευόμενα
  choice: cele care ies
  rationale: Participiul neutru plural substantivizat se referă în mod general la lucrurile care ies, iar formularea păstrează pluralul și imaginea concretă într-o română firească.
- source_word: ἐκ τοῦ στόματος
  choice: din gură
  rationale: Redarea directă păstrează imaginea corporală și legătura contextuală cu vorbirea.
- source_word: ἐκ τῆς καρδίας
  choice: din inimă
  rationale: «Inimă» păstrează sensul antropologic biblic al centrului lăuntric al gândurilor, intențiilor și orientării morale.
- source_word: ἐξέρχεται
  choice: vin
  rationale: Verbul grec este la singular cu un subiect neutru plural, construcție normală în greacă. În română, acordul la plural este firesc, iar «vin din» exprimă limpede proveniența.
- source_word: κἀκεῖνα
  choice: iar acelea
  rationale: Forma contractată înseamnă «și acelea»; «iar acelea» reia explicit lucrurile care ies din gură și marchează natural continuarea ideii.
- source_word: κοινοῖ
  choice: îl întinează
  rationale: În contextul curăției, verbul înseamnă a face necurat sau a întina. «Întinează» păstrează concizia și încărcătura moral-religioasă fără a limita sensul exclusiv la impuritatea rituală.
- source_word: τὸν ἄνθρωπον
  choice: pe om
  rationale: Singularul articulat are valoare reprezentativă și generică. În română, «pe om» exprimă firesc omenirea sau persoana umană în general, fără a indica doar sexul masculin.
theological_decisions:
- issue: Sursa lăuntrică a întinării
  choice: Textul arată că ceea ce este exprimat prin gură provine din inimă și îl întinează pe om.
  alternative: O interpretare restrânsă exclusiv la impuritatea rituală produsă de vorbire.
  rationale: Contextul pune în contrast ceea ce intră din exterior cu ceea ce provine din interior. Redarea «inimă» și «întinează» păstrează atât dimensiunea morală, cât și fundalul limbajului curăției, fără a rezolva excesiv tensiunea dintre ele.
- issue: Valoarea generică a lui ἄνθρωπος
  choice: pe om
  alternative: persoana
  rationale: În acest context, ἄνθρωπος este un singular reprezentativ. Românescul «om» păstrează forma și caracterul generic al expresiei grecești în mod natural.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Paralelismul dintre «din gură» și «din inimă» este păstrat, iar formularea evită atât arhaizarea, cât și parafraza explicativă.
