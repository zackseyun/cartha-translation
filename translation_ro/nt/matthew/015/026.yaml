source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἔστιν καλὸν λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ βαλεῖν τοῖς κυναρίοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/026.yaml
  text: But he answered[a], “It is not right to take the children's bread and throw it to the little dogs.”
translation:
  language: ro
  text: 'Dar el a răspuns: „Nu este potrivit să iei pâinea copiilor și s-o arunci cățelușilor[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „câinilor de casă” ori „puilor de câine”. Grecescul folosește o formă diminutivală, care poate sugera câini mici sau ținuți pe lângă casă, spre deosebire de câinii vagabonzi.
    reason: alternativă lexicală
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: a răspuns
  rationale: Construcția cu participiu și verb finit este redată firesc în română printr-un singur verb, păstrând sensul de răspuns.
- source_word: καλὸν
  choice: potrivit
  rationale: În această construcție, termenul exprimă ceea ce se cuvine sau este adecvat, nu doar ceea ce este bun din punct de vedere moral.
- source_word: λαβεῖν
  choice: să iei
  rationale: Redă direct acțiunea de a lua, fără a atenua imaginea.
- source_word: ἄρτον
  choice: pâinea
  rationale: Echivalentul direct păstrează imaginea concretă și metafora din afirmație.
- source_word: τέκνων
  choice: copiilor
  rationale: τέκνα este un termen incluziv pentru copii, fără restrângere la fii.
- source_word: βαλεῖν
  choice: s-o arunci
  rationale: Păstrează caracterul viu al verbului βάλλω și referința firească la substantivul feminin „pâinea”.
- source_word: κυναρίοις
  choice: cățelușilor
  rationale: Forma diminutivală este redată prin diminutivul românesc, păstrând nuanța posibilă de câini mici sau ținuți în gospodărie.
theological_decisions:
- issue: Păstrarea metaforei despre copii și câini fără identificarea explicită a referenților ei.
  choice: Metafora este redată direct prin „pâinea copiilor” și „cățelușilor”.
  alternative: „Nu este bine să iei hrana copiilor și s-o dai câinilor.”
  rationale: Textul versetului nu explică explicit referenții metaforei. Redarea directă păstrează tensiunea afirmației și lasă contextului rolul de a-i contura sensul.
translation_notes:
  register: Română standard modernă, cu formulare demnă și accesibilă. „Nu este potrivit” redă firesc ideea de cuviință, iar diminutivul „cățelușilor” păstrează forma și forța metaforei grecești.
