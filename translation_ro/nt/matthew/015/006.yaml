  text: he certainly need not honor his father[b][a]. And you have nullified the word of God for the sake of your tradition.
translation:
  language: ro
  text: „acela nu are nicidecum obligația să-și cinstească tatăl[b][a]”. Și ați anulat cuvântul lui Dumnezeu din cauza tradiției voastre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Unele manuscrise au „porunca lui Dumnezeu” în loc de „cuvântul lui Dumnezeu”.
    reason: textual_variant
  - marker: b
    text: Aici, „a cinsti” include probabil și îndatorirea practică de a le asigura părinților cele necesare, nu doar de a le arăta respect.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ τιμήσει
  choice: nu mai este nicidecum dator să-și cinstească
  rationale: Dubla negație οὐ μή este emfatică, iar în context regula tradițională înlătură obligația față de tată. Formularea românească redă atât intensitatea negației, cât și sensul contextual, fără a reduce verbul τιμάω la sprijin financiar.
- source_word: τὸν πατέρα αὐτοῦ
  choice: tatăl
  rationale: Textul grecesc tipărit menționează explicit numai tatăl, la singular; traducerea nu armonizează formularea cu referirea mai largă la tată și mamă din context.
- source_word: ἠκυρώσατε
  choice: ați anulat
  rationale: Verbul ἀκυρόω înseamnă a invalida sau a lipsi de valabilitate. „Ați anulat” exprimă limpede acuzația puternică potrivit căreia tradiția lor face fără efect cuvântul lui Dumnezeu.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: cuvântul lui Dumnezeu
  rationale: Traducerea urmează lectura λόγον din SBLGNT. Varianta textuală ἐντολήν este păstrată în nota [a].
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: din cauza tradiției voastre
  rationale: διά cu acuzativul exprimă aici cauza sau motivul. Formularea arată că tradiția lor este cauza anulării cuvântului lui Dumnezeu.
- source_word: καί
  choice: Și astfel
  rationale: „Și” păstrează legătura coordonatoare, iar „astfel” face naturală în română concluzia acuzației în context, fără a-i schimba sensul.
theological_decisions:
- issue: Dacă sensul practic al cinstirii părinților trebuie explicitat ca sprijin material
  choice: Verbul rămâne „să-și cinstească” în textul principal.
  alternative: „să-și întrețină tatăl” sau „să aibă grijă de tatăl său”
  rationale: Disputa privește obligații materiale față de părinți, dar τιμάω înseamnă propriu-zis „a cinsti”. Păstrarea termenului menține legătura cu porunca și evită restrângerea nejustificată a sensului.
- issue: Dacă textul trebuie armonizat cu contextul sau cu variantele manuscrise
  choice: Se traduc „tatăl” și „cuvântul lui Dumnezeu”, conform textului SBLGNT.
  alternative: „tatăl sau mama” și „porunca lui Dumnezeu”
  rationale: Prioritatea textului grecesc dat cere păstrarea formei sale, în timp ce varianta textuală semnificativă este consemnată în notă.
- issue: Valoarea negației emfatice în context
  choice: „nu mai este nicidecum dator”
  alternative: „cu siguranță nu-și va cinsti”
  rationale: Forma poate fi redată formal ca o negație puternică a viitorului, dar contextul indică faptul că tradiția invocată îl scutește pe om de obligație. Traducerea păstrează această forță pragmatică fără a transforma afirmația într-o simplă predicție.
translation_notes:
  register: Română standard modernă, clară și demnă. „Nicidecum dator” păstrează accentul negației fără o construcție greoaie, iar „tradiție” este termenul actual și neutru pentru παράδοσις.
