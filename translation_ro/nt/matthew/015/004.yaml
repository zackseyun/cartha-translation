source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ⸀εἶπεν· Τίμα τὸν πατέρα καὶ τὴν μητέρα, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: ro
  text: 'Căci Dumnezeu a spus: „Cinstește pe tatăl tău și pe mama ta” și: „Cine își insultă[a] tatăl sau mama trebuie să moară negreșit.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „își blestemă”.'
    reason: Alternativă lexicală contextuală pentru κακολογέω, care poate însemna a insulta, a ocărî sau a blestema.
lexical_decisions:
- source_word: ὁ γὰρ θεὸς
  choice: Căci Dumnezeu
  rationale: γάρ introduce temeiul explicativ al argumentului lui Isus; „Căci” păstrează firesc această legătură în româna literară actuală.
- source_word: εἶπεν
  choice: a spus
  rationale: Verbul introduce citate din Scriptură. Sensul simplu „a spus” evită întărirea interpretativă „a poruncit”, deși primul citat are formă imperativă.
- source_word: Τίμα
  choice: Cinstește-l
  rationale: τιμάω cere acordarea cinstei cuvenite; „a cinsti” păstrează greutatea morală a poruncii mai bine decât simplul „a respecta”.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: pe tatăl tău și pe mama ta
  rationale: Posesivele, implicite în citarea poruncii, sunt necesare pentru o formulare românească naturală și clară.
- source_word: Ὁ κακολογῶν
  choice: Cine își vorbește de rău
  rationale: Participiul substantivizat este redat idiomatic prin „Cine”, iar κακολογέω indică vorbirea rea, insultătoare ori blestemul. Formularea principală păstrează sensul larg, fără a-l restrânge la blestem.
- source_word: πατέρα ἢ μητέρα
  choice: tatăl sau mama
  rationale: Construcția este generică; pronumele reflexiv posesiv din expresia românească „își vorbește de rău” stabilește relația fără un adaos greoi.
- source_word: θανάτῳ τελευτάτω
  choice: trebuie să moară negreșit
  rationale: Formula solemnă exprimă pedeapsa cu moartea și certitudinea sentinței, fără a face explicit agentul execuției mai mult decât o face greaca.
theological_decisions:
- issue: Redarea formulei juridice θανάτῳ τελευτάτω
  choice: trebuie să moară negreșit
  alternative: să fie omorât negreșit
  rationale: Textul citează o lege scripturistică și trebuie să-i păstreze severitatea. Varianta aleasă reflectă formula emfatică și nu precizează în mod nejustificat agentul morții; alternativa face mai explicit caracterul de execuție juridică.
- issue: Sfera semantică a lui κακολογέω
  choice: își vorbește de rău
  alternative: își blestemă
  rationale: Verbul poate desemna defăimarea, insultarea sau blestemarea. Textul principal păstrează amplitudinea lexicală, iar nota oferă sensul mai restrâns posibil în contextul juridic veterotestamentar.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formularea păstrează tonul solemn al celor două citate scripturistice, cu punctuație clară și fără arhaisme inutile.
