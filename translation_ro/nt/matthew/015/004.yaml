    rationale: În uzul românesc, expresia poate desemna vorbirea defăimătoare despre cineva, pe când κακολογέω în această formulă juridică implică revilarea/insultarea directă și poate include blestemul.
  - severity: low
    issue: Ancora notei este plasată după întreaga propoziție citată.
    rationale: Nota explică alternativa lexicală pentru κακολογέω; plasarea ei imediat după „își insultă” face referința clară și precisă.
