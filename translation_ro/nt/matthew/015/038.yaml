  text: οἱ δὲ ἐσθίοντες ἦσαν τετρακισχίλιοι ἄνδρες χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/038.yaml
  text: Those who had eaten were four thousand men[a], besides women and children.
translation:
  language: ro
  text: 'Cei care mâncaseră erau patru mii de bărbați, pe lângă femei și copii.[a]


    [a] Sau: „fără a număra femeile și copiii”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „fără a număra femeile și copiii”.'
    reason: Prezintă o redare alternativă, mai explicită, a lui χωρίς, care arată că femeile și copiii nu sunt incluși în cifra de patru mii.
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: Cei care mâncaseră
  rationale: Articolul cu participiul este redat substantival prin „cei care”, iar participiul prezent capătă în context sensul unei acțiuni încheiate. δέ este un conector slab și nu necesită aici o redare explicită.
- source_word: ἦσαν τετρακισχίλιοι
  choice: erau patru mii
  rationale: Redare directă a copulei și a numeralului cardinal.
- source_word: ἄνδρες
  choice: bărbați
  rationale: Termenul indică persoane de sex masculin, nu oameni în general; distincția este confirmată de menționarea separată a femeilor și copiilor.
- source_word: χωρὶς γυναικῶν καὶ παιδίων
  choice: pe lângă femei și copii
  rationale: χωρίς arată că femeile și copiii nu sunt incluși în numărul de patru mii; formularea aleasă este firească în româna actuală și păstrează sensul aditiv.
theological_decisions:
- issue: Formula de numărare diferențiată după sex și vârstă
  choice: Păstrarea termenului „bărbați” și menționarea femeilor și copiilor ca grupuri neincluse în număr
  alternative: Redarea prin „oameni” sau „persoane”
  rationale: Greaca folosește ἄνδρες și îi menționează separat pe femei și copii; o formulare generică ar șterge această distincție lexicală.
translation_notes:
  register: Română standard modernă, clară și demnă. Mai-mult-ca-perfectul „mâncaseră” exprimă natural faptul că masa se încheiase, iar formularea evită introducerea unui marcator discursiv fără corespondent explicit necesar.
