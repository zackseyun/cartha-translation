id: MAT.15.20
reference: Matthew 15:20
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ταῦτά ἐστιν τὰ κοινοῦντα τὸν ἄνθρωπον, τὸ δὲ ἀνίπτοις χερσὶν φαγεῖν οὐ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/020.yaml
  text: These are the things that defile the man[b][a], but to eat with unwashed hands does not defile the man.
translation:
  language: ro
  text: Acestea sunt lucrurile care îl întinează[a] pe om; dar a mânca cu mâinile nespălate nu-l întinează pe om.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „îl face necurat”. Verbul grecesc poate desemna facerea cuiva necurat din punct de vedere ritual; aici, „întinează” păstrează atât cadrul purității rituale, cât și sensul mai larg al coruperii morale.
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῦντα / κοινοῖ
  choice: îl întinează / nu-l întinează
  rationale: În contextul disputei despre puritate, verbul κοινόω indică faptul de a face pe cineva necurat, cu o dimensiune atât rituală, cât și morală. „A întina” păstrează această amplitudine mai bine decât o formulare limitată la murdăria fizică.
- source_word: ἄνθρωπον
  choice: pe om
  rationale: Articolul și singularul grecesc au aici valoare generică. În română, „om” exprimă firesc o ființă umană în sens reprezentativ și păstrează singularul sursei.
- source_word: ἀνίπτοις χερσὶν
  choice: cu mâinile nespălate
  rationale: Redare românească naturală și exactă a construcției la dativ, cu referire clară la controversa privind spălarea rituală a mâinilor.
- source_word: φαγεῖν
  choice: a mânca
  rationale: Infinitivul românesc redă direct și firesc infinitivul articular grecesc.
- source_word: ταῦτά ἐστιν τὰ
  choice: Acestea sunt lucrurile care
  rationale: Păstrează accentul demonstrativ și construcția sursei într-o exprimare românească limpede.
- source_word: δέ
  choice: dar
  rationale: Marchează explicit contrastul dintre lucrurile care întinează cu adevărat și mâncatul cu mâinile nespălate.
theological_decisions:
- issue: Sensul lui κοινόω în contextul purității
  choice: „a întina”, păstrând împreună cadrul necurăției rituale și forța morală a afirmației
  alternative: „a face necurat” sau „a spurca”
  rationale: Contextul imediat privește puritatea rituală, însă argumentul lui Isus se referă la ceea ce corupe cu adevărat omul. „A întina” evită restrângerea sensului la igiena fizică și nu impune o interpretare exclusiv ceremonială.
- issue: Singularul generic ἄνθρωπον
  choice: „pe om”
  alternative: „pe o persoană” sau pluralul „pe oameni”
  rationale: „Om” funcționează natural în română ca singular generic și păstrează forma reprezentativă a textului grec fără a schimba numărul.
translation_notes:
  register: Română standard modernă, clară și demnă. Repetarea expresiei „pe om” păstrează paralelismul și contrastul explicit al originalului.
