  text: ὑμεῖς δὲ λέγετε· Ὃς ἂν εἴπῃ τῷ πατρὶ ἢ τῇ μητρί· Δῶρον ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/005.yaml
  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: ro
  text: 'Dar voi spuneți: „Oricine îi spune tatălui său sau mamei sale: «Orice ajutor ai fi putut primi de la mine este un dar[a]»,“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „o ofrandă”. Sensul este că ajutorul care ar fi putut fi dat părinților este declarat ca fiind închinat lui Dumnezeu; compară Marcu 7:11, unde apare termenul „corban”.
    reason: alternativă lexicală și clarificare contextuală
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: Dar voi spuneți
  rationale: „Dar” redă contrastul marcat de δὲ, iar pronumele explicit „voi” păstrează accentul pus de ὑμεῖς asupra interlocutorilor.
- source_word: Ὃς ἂν εἴπῃ
  choice: Oricine îi spune
  rationale: Construcția cu pronume relativ, ἄν și conjunctiv exprimă o situație generală nedefinită; „oricine” o redă firesc în româna actuală.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: tatălui său sau mamei sale
  rationale: Dativele indică destinatarii, iar posesivele cerute de uzul românesc fac explicită relația de rudenie fără să modifice sensul.
- source_word: Δῶρον
  choice: un dar
  rationale: „Dar” este sensul lexical direct al lui δῶρον și evită introducerea în textul lui Matei a termenului tehnic „corban”, prezent numai în relatarea paralelă din Marcu.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: Ceea ce ți-ar fi fost de folos din partea mea
  rationale: Formularea păstrează caracterul potențial al beneficiului nerealizat, sensul pasiv al lui ὠφεληθῇς și proveniența exprimată prin ἐξ ἐμοῦ, într-o ordine firească în română.
theological_decisions:
- issue: Dacă termenul tehnic „corban” trebuie introdus în textul lui Matei
  choice: Păstrarea formulării lui Matei prin „un dar”
  alternative: „corban” sau „o ofrandă închinată lui Dumnezeu”
  rationale: Textul grecesc al lui Matei are δῶρον, nu κορβᾶν. Implicația dedicării religioase este explicată în notă, fără a importa în text formularea din Marcu 7:11.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. Inversarea firească a predicatului nominal față de ordinea greacă evită o formulare rigidă, iar perechea „tatălui său sau mamei sale” păstrează referirea individuală a construcției.
