base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/025.yaml
  text: But she came and knelt before him[a], saying, “Lord, help me.”
translation:
  language: ro
  text: 'Dar ea a venit și a îngenuncheat înaintea lui[a], spunând: „Doamne, ajută-mă!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „i s-a închinat”. Verbul grecesc poate desemna a se pleca în semn de reverență, a aduce omagiu sau a se închina, după context.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Dar
  rationale: Marchează contrastul moderat cu răspunsul anterior al lui Isus și stăruința femeii.
- source_word: ἐλθοῦσα
  choice: ea a venit
  rationale: Participiul aorist este redat firesc printr-un verb la mod personal, păstrând apropierea femeii de Isus.
- source_word: προσεκύνει αὐτῷ
  choice: a îngenuncheat înaintea lui
  rationale: Verbul poate desemna prosternarea, omagiul sau închinarea. Formularea redă gestul corporal de reverență fără a-i preciza excesiv sensul teologic.
- source_word: λέγουσα
  choice: zicând
  rationale: Introduce direct și demn cuvintele rostite de femeie.
- source_word: Κύριε
  choice: Doamne
  rationale: Redarea consacrată și potrivită pentru adresarea respectuoasă și pregnantă către Isus.
- source_word: βοήθει μοι
  choice: ajută-mă
  rationale: Păstrează caracterul direct, concis și urgent al imperativului prezent.
theological_decisions:
- issue: Sensul lui προσκυνέω când gestul este îndreptat către Isus
  choice: a îngenuncheat înaintea lui
  alternative: i s-a închinat
  rationale: Termenul grec poate exprima reverență, omagiu ori închinare. Textul principal păstrează gestul observabil, iar nota menține alternativa teologic mai puternică fără a elimina ambiguitatea contextuală.
translation_notes:
  register: Română standard modernă, cu exprimare naturală și demnă. „A îngenuncheat înaintea lui” este ușor de înțeles și păstrează ambiguitatea semantică a verbului grec; exclamația redă urgența rugăminții.
