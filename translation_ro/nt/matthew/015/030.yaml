  text: καὶ προσῆλθον αὐτῷ ὄχλοι πολλοὶ ἔχοντες μεθ’ ἑαυτῶν ⸂κωφούς, τυφλούς, χωλούς, κυλλούς⸃, καὶ ἑτέρους πολλούς, καὶ ἔρριψαν αὐτοὺς παρὰ τοὺς πόδας ⸀αὐτοῦ, καὶ ἐθεράπευσεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/030.yaml
  text: And large crowds came to him[a], bringing with them the mute, the blind, the lame, the crippled, and many others, and they laid them at his feet[b], and he healed them.
translation:
  language: ro
  text: Și au venit la el mulțimi mari, aducând cu ele persoane care nu puteau vorbi[a], orbi, șchiopi, persoane cu membre afectate[b] și mulți alții. I-au așezat la picioarele lui, iar el i-a vindecat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „surzi”. Termenul grecesc poate desemna persoane surde, mute sau surdo-mute, în funcție de context.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „cu membre deformate” sau „schilodiți”. Termenul grecesc se referă în sens larg la persoane cu membre afectate, deformate ori lipsite de funcționalitate.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: au venit la
  rationale: Redă firesc apropierea mulțimilor de Isus în desfășurarea narațiunii.
- source_word: ὄχλοι πολλοὶ
  choice: mulțimi mari
  rationale: Formulare românească naturală, care păstrează pluralul și amploarea grupurilor.
- source_word: ἔχοντες μεθ’ ἑαυτῶν
  choice: aducând cu ele
  rationale: 'Exprimă în context valoarea participiului: mulțimile îi aveau cu ele și îi aduceau la Isus.'
- source_word: κωφούς
  choice: oameni surzi și muți
  rationale: κωφός poate desemna surzenia, incapacitatea de a vorbi sau asocierea lor; formularea păstrează deschisă aria semantică fără a alege arbitrar numai una dintre deficiențe.
- source_word: τυφλούς
  choice: orbi
  rationale: Echivalentul direct și consacrat al lui τυφλούς.
- source_word: χωλούς
  choice: șchiopi
  rationale: Echivalent concis și uzual pentru persoane cu dificultăți de mers.
- source_word: κυλλούς
  choice: cu membrele vătămate
  rationale: Redă afectarea, deformarea ori pierderea funcției membrelor fără termenul modern peiorativ «schilodiți» și fără să restrângă sensul exclusiv la amputare.
- source_word: ἑτέρους πολλούς
  choice: mulți alții
  rationale: Redare directă și firească a celorlalte persoane suferinde care nu sunt enumerate.
- source_word: ἔρριψαν
  choice: i-au așezat
  rationale: Deși verbul poate însemna literal «au aruncat», contextul susține sensul de a-i pune jos înaintea lui Isus; «i-au așezat» evită sugerarea nejustificată a brutalității.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: la picioarele lui
  rationale: Păstrează imaginea apropierii imediate și este idiomatic în română.
- source_word: ἐθεράπευσεν
  choice: i-a vindecat
  rationale: Echivalentul standard în relatările evanghelice despre vindecări.
