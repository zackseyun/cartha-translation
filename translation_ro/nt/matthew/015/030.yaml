  source_fidelity: Textul redă corect structura versetului și principalele elemente lexicale. Totuși, „surzi și muți” afirmă cumulativ două condiții, pe când κωφούς poate însemna „muți”, „surzi” sau, contextual, ambele; ambiguitatea trebuie lăsată în nota de subsol, nu rezolvată printr-o formulare cumulativă în text.
  naturalness: Construcția este în general firească în româna standard modernă. „Aducând cu ele” este acceptabil pentru mulțimi; formularea revizuită păstrează un ritm narativ clar. „Persoane care nu puteau vorbi” este mai respectuos și mai natural decât o etichetă substantivizată, fără a pierde concizia excesiv.
  terminology: „Orbi”, „șchiopi”, „la picioarele lui” și „i-a vindecat” sunt potrivite. Pentru κυλλούς, „persoane cu membre afectate” păstrează caracterul general al termenului fără limbaj depreciativ și fără a limita sensul la vătămare traumatică.
  issues:
