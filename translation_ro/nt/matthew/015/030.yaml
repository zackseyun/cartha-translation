  - severity: low
    issue: „cu membrele vătămate” poate sugera prea precis o leziune sau traumă.
    rationale: κυλλούς se referă mai larg la afectarea ori deformarea membrelor. „Cu membre afectate” menține caracterul descriptiv și cuprinzător; nota precizează alternativele lexicale.
