source:
  edition: SBLGNT
  text: ἄφετε αὐτούς· ⸂τυφλοί εἰσιν ὁδηγοὶ τυφλῶν⸃· τυφλὸς δὲ τυφλὸν ἐὰν ὁδηγῇ, ἀμφότεροι εἰς βόθυνον πεσοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/014.yaml
  text: Leave them alone[a]; they are blind guides of the blind. But if a blind man guides a blind man[c][b], both will fall into a pit.
translation:
  language: ro
  text: Lăsați-i în pace! Sunt călăuze oarbe ale orbilor. Iar dacă un orb călăuzește un orb,[a] amândoi vor cădea într-o groapă.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Masculinul singular are aici valoare reprezentativă: proverbul se aplică în general, nu numai bărbaților.'
    reason: cultural_note
  - marker: b
    text: 'Sau: „într-un șanț”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε αὐτούς
  choice: Lăsați-i în pace!
  rationale: Imperativul aorist al lui ἀφίημι are aici sensul de „a lăsa în pace / a nu se mai ocupa de”, nu de „a ierta”. Formularea este firească în româna actuală și păstrează forța poruncii.
- source_word: τυφλοί
  choice: oarbe
  rationale: Adjectivul este folosit metaforic. Redarea directă păstrează imaginea și nu introduce în text o explicație precum „orbi spiritual”.
- source_word: ὁδηγοὶ τυφλῶν
  choice: călăuze ... ale orbilor
  rationale: „Călăuze” redă sensul concret al lui ὁδηγοί și menține legătura imagistică cu verbul ὁδηγῇ. Genitivul τυφλῶν este redat direct prin „ale orbilor”.
- source_word: τυφλὸς ... τυφλὸν
  choice: un orb ... un alt orb
  rationale: Construcția proverbială la singular este redată natural în română; „un alt” clarifică rolurile fără să schimbe sensul general al enunțului.
- source_word: ἐὰν ὁδηγῇ
  choice: Dacă ... călăuzește
  rationale: ἐάν cu conjunctivul prezent exprimă aici o condiție generală. Indicativul prezent este construcția firească în română, iar „călăuzește” păstrează corespondența cu substantivul „călăuze”.
- source_word: ἀμφότεροι
  choice: amândoi
  rationale: Redă precis faptul că atât călăuza, cât și cel călăuzit au aceeași soartă.
- source_word: εἰς βόθυνον
  choice: într-o groapă
  rationale: βόθυνος poate desemna o groapă, un șanț sau o adâncitură. „Groapă” este termenul românesc larg, viu și potrivit imaginii proverbiale.
- source_word: πεσοῦνται
  choice: vor cădea
  rationale: Redare directă și naturală a viitorului, care exprimă rezultatul condiției.
theological_decisions:
- issue: Forța metaforică a orbirii
  choice: Păstrarea termenului „orb” fără explicitarea metaforei
  alternative: „orb spiritual” sau „lipsit de discernământ”
  rationale: Textul grec lasă metafora să funcționeze în context. Explicitarea ei ar restrânge sensul și ar introduce interpretare în corpul traducerii.
- issue: Caracterul reprezentativ al masculinului singular din proverb
  choice: „un orb ... un alt orb”
  alternative: „o persoană oarbă ... o altă persoană oarbă”
  rationale: Masculinul singular din greacă are funcție proverbială și generală. Româna permite aceeași construcție compactă, iar nota precizează sfera generală fără a modifica forma imaginii.
- issue: Relația dintre călăuze și cei orbi
  choice: „călăuze oarbe ale orbilor”
  alternative: „călăuze oarbe pentru orbi”
  rationale: Genitivul grec poate fi redat firesc prin „ale orbilor”; formularea păstrează concizia și nu precizează mai mult decât sursa natura relației.
translation_notes:
  register: Română standard modernă, clară și demnă. „Lăsați-i în pace” este idiomatic, iar „călăuze” păstrează registrul biblic fără a fi arhaic. Punctuația separă porunca de explicația proverbială și evită introducerea unei opoziții mai puternice decât cere δέ.
