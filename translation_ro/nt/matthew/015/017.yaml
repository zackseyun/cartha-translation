id: MAT.15.17
reference: Matthew 15:17
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ⸀οὐ νοεῖτε ὅτι πᾶν τὸ εἰσπορευόμενον εἰς τὸ στόμα εἰς τὴν κοιλίαν χωρεῖ καὶ εἰς ἀφεδρῶνα ἐκβάλλεται;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/017.yaml
  text: Do you not understand that everything entering into the mouth goes into the stomach and is expelled into the latrine?[a]
translation:
  language: ro
  text: Nu înțelegeți că tot ce intră în gură ajunge în stomac și este eliminat în latrină?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „orice intră în gură ... este aruncat afară, în hazna”.'
    reason: Alternativă lexicală pentru πᾶν τὸ εἰσπορευόμενον, ἐκβάλλεται și ἀφεδρῶνα, păstrând formulări mai literale ori istorice.
lexical_decisions:
- source_word: νοεῖτε
  choice: înțelegeți
  rationale: Verbul se referă aici la înțelegerea afirmației lui Isus; formularea este firească într-o întrebare mustrătoare.
- source_word: πᾶν τὸ εἰσπορευόμενον
  choice: tot ce intră
  rationale: Construcția participială articulată, la neutru singular, are sens generic și cuprinde orice aliment ingerat.
- source_word: εἰς τὸ στόμα
  choice: în gură
  rationale: Redă direct mișcarea spre interior exprimată de εἰς și păstrează imaginea concretă.
- source_word: κοιλίαν
  choice: stomac
  rationale: În contextul digestiei, „stomac” este precis, actual și mai firesc decât redări mai largi precum „pântece”.
- source_word: χωρεῖ
  choice: ajunge
  rationale: În acest context descrie trecerea hranei în stomac; „ajunge” redă natural traseul fără literalism rigid.
- source_word: ἀφεδρῶνα
  choice: latrină
  rationale: Termenul denumește locul destinat eliminării excrementelor; „latrină” este exact, demn și potrivit cadrului antic.
- source_word: ἐκβάλλεται
  choice: este eliminat
  rationale: Pasivul descrie eliminarea din organism. Alegerea este clară și demnă, păstrând sensul fiziologic al verbului.
theological_decisions:
- issue: Relația afirmației lui Isus cu legile purității rituale
  choice: Afirmația fiziologică este tradusă simplu, fără adăugarea unei formule explicite despre declararea tuturor alimentelor drept curate.
  alternative: O extindere interpretativă potrivit căreia prin această afirmație toate alimentele sunt declarate curate.
  rationale: Versetul descrie procesul digestiv în sprijinul argumentului despre ceea ce îl întinează pe om, dar nu conține explicit comentariul interpretativ din Marcu 7:19. Redarea păstrează formularea și tensiunea textului grec.
translation_notes:
  register: Română standard modernă, clară și demnă. Întrebarea păstrează tonul mustrător al contextului, iar vocabularul fiziologic evită atât eufemizarea excesivă, cât și exprimarea grosolană.
