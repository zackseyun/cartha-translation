  text: Τότε προσέρχονται τῷ ⸀Ἰησοῦ ἀπὸ Ἱεροσολύμων ⸂Φαρισαῖοι καὶ γραμματεῖς⸃ λέγοντες
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/001.yaml
  text: Then Pharisees and scribes from Jerusalem come to Jesus[a], saying[b],
translation:
  language: ro
  text: 'Atunci, niște farisei și cărturari[b] din Ierusalim vin[a] la Isus, spunând:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „se apropie de Isus”.'
    reason: lexical_alternative
  - marker: b
    text: „Cărturari” poate desemna aici „experți în Lege” sau „învățători ai Legii”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Redă firesc marcatorul temporal care introduce episodul următor și păstrează cursul narațiunii.
- source_word: προσέρχονται
  choice: vin la
  rationale: Exprimă apropierea de Isus într-o română actuală și păstrează prezentul narativ al textului grec.
- source_word: τῷ Ἰησοῦ
  choice: la Isus
  rationale: Dativul indică persoana spre care se îndreaptă; construcția românească firească este „vin la Isus”.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: din Ierusalim
  rationale: ἀπό indică originea; „din Ierusalim” este formularea românească naturală, fără a presupune explicit o delegare oficială.
- source_word: Φαρισαῖοι
  choice: farisei
  rationale: Denumirea istorică și religioasă consacrată în limba română.
- source_word: γραμματεῖς
  choice: cărturari
  rationale: Termenul tradițional și încă inteligibil în context biblic pentru specialiștii în texte și în Lege; sensul contextual este precizat în notă.
- source_word: καὶ
  choice: și
  rationale: Păstrează coordonarea simplă dintre cele două grupuri și legătura cu verbul de vorbire.
- source_word: λέγοντες
  choice: spun
  rationale: Participiul prezent introduce vorbirea directă din versetul următor; forma verbală finită este mai naturală în română și păstrează prezentul narativ.
theological_decisions:
- issue: Prezentul narativ
  choice: 'Păstrarea prezentului: „vin ... și spun”'
  alternative: 'Trecutul narativ: „au venit ... și au spus”'
  rationale: Greaca folosește prezentul istoric pentru vivacitate. Româna permite aici prezentul narativ fără artificialitate, astfel că efectul discursiv poate fi păstrat.
translation_notes:
  register: Română standard modernă, clară și demnă. „Niște” marchează natural caracterul nearticulat al substantivelor grecești fără să sugereze lipsă de importanță. Ordinea grupurilor urmează textul grec; proveniența comună, „din Ierusalim”, este redată după ambele substantive pentru claritate.
