    issue: Destinatarul este explicitat prin „le”.
    rationale: Greaca are doar ὁ δὲ ἀποκριθεὶς εἶπεν, fără complement indirect. Eliminarea pronumelui păstrează economia și deschiderea formulării sursei.
  - severity: low
    issue: Alternativa „plantație” din notă este mai puțin precisă în româna actuală.
    rationale: „Plantație” se referă uzual la o cultură sau suprafață plantată. „Lucru sădit” păstrează posibilitatea semantică a lui φυτεία („ceea ce a fost plantat”) și corelația cu verbul „a sădi”.
  revised_text: 'Dar el a răspuns: „Orice plantă[a] pe care n-a plantat-o Tatăl meu ceresc va fi smulsă din rădăcini.”'
