reference: Matthew 15:13
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Πᾶσα φυτεία ἣν οὐκ ἐφύτευσεν ὁ πατήρ μου ὁ οὐράνιος ἐκριζωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/013.yaml
  text: But he answered and said[a], “Every plant that my heavenly Father did not plant will be uprooted.”
translation:
  language: ro
  text: 'Dar el a răspuns: „Orice plantă[a] pe care n-a plantat-o Tatăl meu ceresc va fi smulsă din rădăcini.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Orice lucru sădit pe care Tatăl meu ceresc nu l-a sădit va fi dezrădăcinat.”'
    reason: Alternativă lexicală pentru φυτεία, care poate desemna ceea ce a fost plantat; păstrează imaginea și corespondența cu ἐφύτευσεν și ἐκριζωθήσεται.
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: le-a răspuns
  rationale: Formula narativă grecească, influențată semitic, folosește literal două verbe („răspunzând, a spus”), însă în româna actuală „le-a răspuns” redă firesc întregul sens; pronumele „le” explicitează destinatarul din context, fără a modifica referentul.
- source_word: Πᾶσα
  choice: Orice
  rationale: Redă adecvat sensul distributiv al singularului și se acordă firesc cu „plantă”.
- source_word: φυτεία
  choice: plantă
  rationale: Substantivul poate desemna o plantă sau ceea ce a fost plantat. „Plantă” păstrează imaginea concretă și corespunde natural acțiunii de a fi smulsă din rădăcini; alternativa „plantație” este consemnată în notă.
- source_word: ἐφύτευσεν
  choice: n-a plantat-o
  rationale: Păstrează direct metafora agricolă și legătura lexicală cu φυτεία; pronumele enclitic este cerut de sintaxa românească firească.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: Tatăl meu ceresc
  rationale: Formulare românească idiomatică și demnă, care păstrează atât posesivul, cât și calificativul „ceresc”.
- source_word: ἐκριζωθήσεται
  choice: va fi smulsă din rădăcini
  rationale: Redă limpede viitorul pasiv și sensul concret al verbului ἐκριζόω, păstrând imaginea agricolă și nuanța de judecată.
theological_decisions:
- issue: Referentul metaforic al expresiei „orice plantă”
  choice: 'Metafora rămâne nerezolvată: „Orice plantă”'
  alternative: Orice învățătură; orice tradiție; orice om care nu a fost plantat de Tatăl
  rationale: Textul grecesc nu identifică explicit planta cu învățături, tradiții sau persoane. Menținerea imaginii păstrează ambiguitatea și tensiunea teologică ale sursei.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea evită literalismul greoi al construcției „răspunzând, a spus”, dar păstrează metafora agricolă și ambiguitatea referentului. Marcatorul [a] apare în textul principal.
