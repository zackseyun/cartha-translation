  text: καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πόσους ἄρτους ἔχετε; οἱ δὲ εἶπαν· Ἑπτά, καὶ ὀλίγα ἰχθύδια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/034.yaml
  text: And Jesus said to them[a], “How many loaves do you have?” And they said, “Seven, and a few small fish.”
translation:
  language: ro
  text: 'Isus le-a zis: „Câte pâini aveți?” Ei au răspuns: „Șapte și câțiva peștișori[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „pești”; termenul grecesc este o formă diminutivală, care poate sugera pești mici.
    reason: alternativă lexicală
lexical_decisions:
- source_word: λέγει
  choice: le-a zis
  rationale: Prezentul istoric grecesc este redat prin perfectul compus, firesc în narațiunea românească; pronumele „le” păstrează destinatarul plural exprimat prin αὐτοῖς.
- source_word: Πόσους ἄρτους
  choice: Câte pâini
  rationale: ἄρτους desemnează pâini numărabile; în română, „câte pâini” este formularea directă și idiomatică.
- source_word: ἔχετε
  choice: aveți
  rationale: Redare directă a prezentului indicativ, persoana a doua plural.
- source_word: οἱ δὲ εἶπαν
  choice: Ei au răspuns
  rationale: În contextul unei întrebări, „au răspuns” exprimă natural funcția lui εἶπαν; δέ marchează aici continuarea narațiunii, fără un contrast care să impună „dar”.
- source_word: Ἑπτά
  choice: Șapte
  rationale: Redare directă a numeralului, cu substantivul „pâini” subînțeles ca în greacă.
- source_word: ὀλίγα
  choice: câțiva
  rationale: Exprimă idiomatic numărul mic și neprecizat; acordul românesc este determinat de substantivul masculin „peștișori”.
- source_word: ἰχθύδια
  choice: peștișori
  rationale: Diminutivul românesc păstrează nuanța formei diminutivale grecești, care poate sugera pești mici.
