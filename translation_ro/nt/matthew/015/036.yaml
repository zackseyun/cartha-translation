source:
  edition: SBLGNT
  text: ⸀ἔλαβεν τοὺς ἑπτὰ ἄρτους καὶ τοὺς ἰχθύας ⸀καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀ἐδίδου τοῖς ⸀μαθηταῖς οἱ δὲ μαθηταὶ ⸂τοῖς ὄχλοις⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/036.yaml
  text: He took the seven loaves and the fish[a], and after giving thanks he broke them and kept giving them to the disciples, and the disciples to the crowds.
translation:
  language: ro
  text: A luat cele șapte pâini și peștii și, după ce a mulțumit[a], a frânt pâinile și le dădea ucenicilor, iar ucenicii le dădeau mulțimilor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „mulțumind”.'
    reason: Alternativă mai formală pentru participiul grecesc.
lexical_decisions:
- source_word: ἔλαβεν
  choice: a luat
  rationale: Redă firesc acțiunea prin care Isus ia hrana înainte de mulțumire și împărțire.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: cele șapte pâini
  rationale: În contextul hrănirii mulțimii, ἄρτος desemnează pâini concrete; româna folosește natural pluralul „pâini”.
- source_word: τοὺς ἰχθύας
  choice: peștii
  rationale: Păstrează pluralul și articolul hotărât din greacă într-o formulare românească firească.
- source_word: εὐχαριστήσας
  choice: după ce a mulțumit
  rationale: Exprimă limpede anterioritatea participiului aorist față de frângerea pâinilor, fără a introduce explicit un destinatar al mulțumirii, absent din text.
- source_word: ἔκλασεν
  choice: le-a frânt
  rationale: Verbul „a frânge” păstrează formularea tradițională și demnă pentru ruperea pâinilor; pronumele reia hrana menționată în context, obiectul fiind implicit în greacă.
- source_word: ἐδίδου
  choice: le dădea
  rationale: Imperfectul românesc redă caracterul continuu sau repetat al distribuirii exprimat de imperfectul grec.
- source_word: τοῖς μαθηταῖς
  choice: ucenicilor
  rationale: Dativul indică destinatarii; nu este adăugat posesivul „săi”, deoarece acesta nu apare explicit în greacă.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: iar ucenicii le dădeau mulțimilor
  rationale: Verbul eliptic este completat natural în română din propoziția precedentă, iar pluralul „mulțimilor” păstrează τοῖς ὄχλοις.
theological_decisions:
- issue: Posibila rezonanță euharistică a lui εὐχαριστήσας
  choice: după ce a mulțumit
  alternative: o formulare liturgică mai explicită sau „după ce I-a mulțumit lui Dumnezeu”
  rationale: Textul relatează mulțumirea rostită asupra hranei. Formularea aleasă păstrează posibilele rezonanțe fără a introduce o interpretare sacramentală ori un complement care nu este exprimat în greacă.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. „A frânt” păstrează precizia și rezonanța biblică fără a deveni arhaic, iar imperfectul „le dădea” redă distribuirea continuă.
