  terminology: „Pâini”, „pești”, „ucenici” și „mulțimi” sunt alegeri exacte și consecvente. „După ce a mulțumit” păstrează caracterul nespecificat al complementului din greacă și nu impune o interpretare liturgică sau doctrinară.
