  text: Ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Φράσον ἡμῖν τὴν παραβολὴν ⸀ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/015.yaml
  text: But Peter answered and said to him[a], “Explain this parable to us.”
translation:
  language: ro
  text: 'Dar Petru I-a răspuns: „Explică-ne această parabolă.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: Dar Petru I-a răspuns
  rationale: Redă natural în româna actuală formula narativă grecească literală „răspunzând... i-a spus”, evitând redundanța, dar păstrând tranziția ușor contrastivă marcată de δέ și destinatarul exprimat prin αὐτῷ.
- source_word: Φράσον
  choice: Explică-ne
  rationale: Imperativul lui φράζω cere aici clarificarea sensului afirmației figurate; „explică” este direct, firesc și adecvat contextului.
- source_word: ἡμῖν
  choice: -ne
  rationale: Pronumele datival este redat idiomatic prin forma neaccentuată românească atașată verbului.
- source_word: τὴν παραβολὴν ταύτην
  choice: această parabolă
  rationale: „Parabolă” păstrează termenul consacrat pentru παραβολή, iar „această” redă demonstrativul apropiat ταύτην, referitor la afirmația imediat precedentă.
theological_decisions: []
translation_notes:
  register: 'Formulare modernă, demnă și accesibilă. Construcția grecească redundantă „răspunzând, a spus” este condensată idiomatic în „I-a răspuns”, fără pierdere de sens. Nu este necesară o notă: sensurile posibile „spune-ne” și „fă-ne clară” sunt acoperite adecvat de „explică-ne”.'
