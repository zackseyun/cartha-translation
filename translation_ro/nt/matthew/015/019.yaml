  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐκ γὰρ τῆς καρδίας ἐξέρχονται διαλογισμοὶ πονηροί, φόνοι, μοιχεῖαι, πορνεῖαι, κλοπαί, ψευδομαρτυρίαι, βλασφημίαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/019.yaml
  text: For out of the heart come evil thoughts[a], murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.
translation:
  language: ro
  text: Căci din inimă ies gândurile rele, omorurile, adulterele, imoralitățile sexuale, furturile, mărturiile mincinoase și defăimările[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „blasfemiile”. Termenul grecesc poate desemna fie defăimarea oamenilor, fie vorbirea blasfemiatoare împotriva lui Dumnezeu, în funcție de context.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ τῆς καρδίας
  choice: Căci din inimă
  rationale: „Căci” păstrează valoarea explicativă a lui γάρ, iar „din inimă” redă sursa indicată de ἐκ și păstrează metafora biblică a centrului lăuntric al persoanei.
- source_word: ἐξέρχονται
  choice: ies
  rationale: Redă direct ideea de ieșire sau provenire și se leagă firesc în română de expresia „din inimă”.
- source_word: διαλογισμοὶ πονηροί
  choice: gândurile rele
  rationale: διαλογισμοί poate desemna gânduri, raționamente ori deliberări; formularea aleasă este naturală și nu restrânge sensul la uneltiri deliberate.
- source_word: φόνοι
  choice: omorurile
  rationale: Redă pluralul și caracterul culpabil al uciderilor, evitând termenul mai larg și potențial neutru „uciderile”.
- source_word: μοιχεῖαι
  choice: adulterele
  rationale: Echivalent direct, actual și demn, care păstrează pluralul listei.
- source_word: πορνεῖαι
  choice: imoralitățile sexuale
  rationale: Redă caracterul larg al termenului pentru conduite sexuale nelegitime și păstrează pluralul grecesc, fără arhaismul sau îngustarea lui „desfrânările”/„fornicațiile”.
- source_word: κλοπαί
  choice: furturile
  rationale: Echivalent românesc direct și firesc, cu pluralul păstrat.
- source_word: ψευδομαρτυρίαι
  choice: mărturiile mincinoase
  rationale: Păstrează pluralul și nuanța testimonială sau juridică a termenului compus.
- source_word: βλασφημίαι
  choice: defăimările
  rationale: În această listă generală de rele, termenul poate desemna vorbirea care ponegrește oameni; alegerea păstrează sensul larg în româna curentă, iar alternativa referitoare explicit la Dumnezeu este indicată în notă.
theological_decisions:
- issue: Sfera semantică a lui βλασφημίαι în lista de vicii
  choice: defăimările
  alternative: blasfemiile
  rationale: Contextul nu precizează dacă vorbirea ofensatoare este îndreptată împotriva oamenilor sau a lui Dumnezeu. Textul principal folosește sensul general, firesc în română, iar nota păstrează deschisă lectura tradițională referitoare la blasfemie.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Articolul hotărât repetat susține ritmul enumerării și corespunde substantivelor grecești la plural. Marcajul notei este așezat după termenul ambiguu pe care îl explică.
