  source_fidelity: Textul redă fidel identificarea femeii, apelul mesianic „Doamne, Fiul lui David”, intensificatorul κακῶς și atribuirea stării fiicei unei cauze demonice. Totuși, „care ieșise” introduce nejustificat mai-mult-ca-perfectul; participiul aorist ἐξελθοῦσα marchează acțiunea în raport cu strigarea, fără să ceară această anterioritate accentuată în română.
  naturalness: Formularea este în general firească în româna standard modernă. „Iată” și imperfectul „striga” sunt potrivite pentru registrul narativ și pentru valoarea imperfectivă a lui ἔκραζεν. Construcția revizuită cu „ieșită” este mai concisă și mai apropiată de participiul grecesc.
  terminology: „Canaanită”, „Doamne” și „Fiul lui David” sunt corecte și păstrează vocabularul și rezonanța contextuală a sursei. „Este cumplit chinuită de un demon” redă prudent δαιμονίζεται; nota păstrează alternativa convențională „posedată” fără a impune o explicație doctrinară a stării.
