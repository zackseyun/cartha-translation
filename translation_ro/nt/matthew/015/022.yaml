id: MAT.15.22
reference: Matthew 15:22
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ Χαναναία ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα ⸀ἔκραζεν λέγουσα· Ἐλέησόν με, κύριε ⸀υἱὸς Δαυίδ· ἡ θυγάτηρ μου κακῶς δαιμονίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/022.yaml
  text: And behold[a], a Canaanite woman from those regions came out and was crying out, saying, “Have mercy on me, Lord, Son of David; my daughter is badly demon-possessed.”
translation:
  language: ro
  text: 'Și iată, o femeie canaanită, ieșită din ținuturile acelea, striga, zicând: „Ai milă de mine, Doamne, Fiul lui David! Fiica mea este cumplit chinuită de un demon.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „este posedată de un demon” ori „se află cumplit sub puterea unui demon”.'
    reason: Alternativă lexicală pentru δαιμονίζεται, al cărui sens indică acțiune sau influență demonică fără a preciza complet natura stării.
lexical_decisions:
- source_word: ἰδοὺ
  choice: iată
  rationale: Păstrează funcția de atragere a atenției și vivacitatea întreruperii narative, într-o formulare românească biblică încă inteligibilă.
- source_word: Χαναναία
  choice: canaanită
  rationale: Redă termenul explicit al lui Matei și păstrează rezonanța istorică israelită; nu îl înlocuiește cu termenul din relatarea paralelă din Marcu.
- source_word: ἀπὸ τῶν ὁρίων ἐκείνων
  choice: din ținuturile acelea
  rationale: ὅρια desemnează aici teritorii sau regiuni; pluralul este păstrat natural în română.
- source_word: ἐξελθοῦσα
  choice: care ieșise
  rationale: Redă participiul aorist ca acțiune anterioară strigării, fără o construcție participială greoaie.
- source_word: ἔκραζεν
  choice: striga
  rationale: Imperfectul românesc păstrează caracterul continuu ori repetat al acțiunii sugerat de imperfectul grecesc.
- source_word: Ἐλέησόν με
  choice: Ai milă de mine
  rationale: Este o formulare românească firească și demnă, care păstrează cererea urgentă de îndurare.
- source_word: κύριε
  choice: Doamne
  rationale: Vocativul tradițional și natural redă titlul κύριος; alăturarea cu „Fiul lui David” susține aici o adresare reverențială, posibil mesianică.
- source_word: υἱὸς Δαυίδ
  choice: Fiul lui David
  rationale: Păstrează literal titlul davidic și semnificația sa mesianică.
- source_word: κακῶς
  choice: cumplit
  rationale: Redă intensitatea stării fiicei într-o română naturală și neclinică.
- source_word: δαιμονίζεται
  choice: este chinuită de un demon
  rationale: Exprimă clar agenția demonică fără a fixa mai precis decât permite verbul natura stării; alternativa convențională „este posedată de un demon” este păstrată în notă.
theological_decisions:
- issue: Redarea lui κύριε într-o adresare cu rezonanță mesianică
  choice: Doamne
  alternative: domnule; stăpâne
  rationale: Împreună cu „Fiul lui David”, termenul are probabil mai mult decât simpla valoare politicoasă. „Doamne” păstrează reverența și posibila forță mesianică fără a declara explicit întinderea înțelegerii femeii.
- issue: Redarea lui δαιμονίζεται
  choice: este chinuită de un demon
  alternative: este posedată de un demon
  rationale: Greaca atribuie limpede starea agenției demonice, însă nu definește exact fenomenologia. Textul principal evită supraprecizarea, iar nota păstrează formularea convențională mai puternică.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. „Iată” păstrează marcajul narativ; imperfectul „striga” redă aspectul continuu. Topica adresării este ajustată firesc în română, iar nota păstrează ambiguitatea lexicală relevantă.
