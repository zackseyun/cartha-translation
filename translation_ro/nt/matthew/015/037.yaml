  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ⸂τὸ περισσεῦον τῶν κλασμάτων ἦραν⸃ ἑπτὰ σπυρίδας πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/037.yaml
  text: And they all ate and were satisfied[a], and they picked up seven full baskets of the leftover pieces.
translation:
  language: ro
  text: Și toți au mâncat și s-au săturat, iar din bucățile rămase au strâns șapte coșuri[a] pline.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „șapte coșuri mari, pline”; termenul grecesc de aici (spyridas) poate desemna un tip de coș mai mare decât cel menționat în alte relatări despre hrănirea mulțimilor.'
    reason: Alternativă lexicală ce păstrează posibila nuanță de mărime a substantivului σπυρίς.
lexical_decisions:
- source_word: ἔφαγον
  choice: au mâncat
  rationale: Aoristul lui ἐσθίω exprimă simplu acțiunea încheiată; româna nu cere exprimarea unui complement direct.
- source_word: πάντες
  choice: toți
  rationale: Păstrează sfera universală a termenului și se leagă firesc de verbul la persoana a treia plural.
- source_word: ἐχορτάσθησαν
  choice: s-au săturat
  rationale: În context, verbul înseamnă că au mâncat până s-au săturat; formularea este firească în româna actuală și păstrează ideea de îndestulare.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: din bucățile rămase
  rationale: Redă idiomatic ceea ce a rămas dintre bucățile frânte, fără a introduce explicit «pâine», care nu apare în acest verset.
- source_word: ἦραν
  choice: au strâns
  rationale: Deși sensul de bază poate fi «au ridicat/luat», în contextul adunării resturilor «au strâns» exprimă limpede acțiunea.
- source_word: ἑπτὰ σπυρίδας πλήρεις
  choice: șapte coșuri pline
  rationale: Redare directă și naturală; posibila nuanță că σπυρίς desemnează un coș mai mare este păstrată în nota de subsol.
theological_decisions: []
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. Coordonarea cu „iar” evită repetarea greoaie a lui „și”, fără a schimba succesiunea narațiunii; nota este plasată după expresia la care se referă.
