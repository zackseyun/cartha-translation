  text: And after instructing the crowd to recline on the ground,[a]
translation:
  language: ro
  text: Și, după ce a poruncit mulțimii să se așeze pe pământ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „să se întindă pe pământ”. Verbul grecesc poate desemna luarea locului la masă, adesea într-o poziție culcată.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Și
  rationale: Conjuncție narativă simplă, care leagă această acțiune de contextul precedent.
- source_word: παραγγείλας
  choice: după ce a poruncit
  rationale: Participiul aorist exprimă o dispoziție dată înaintea acțiunii principale din versetul următor; „a poruncit” păstrează forța directivă a verbului, fără formulare artificială.
- source_word: τῷ ὄχλῳ
  choice: mulțimii
  rationale: Dativul indică destinatarul poruncii; „mulțime” este termenul firesc în acest cadru narativ.
- source_word: ἀναπεσεῖν
  choice: să se așeze
  rationale: În contextul mesei, verbul desemnează luarea locului, adesea într-o poziție culcată. „Să se așeze” este natural în româna actuală, iar nuanța istorică este păstrată în notă.
- source_word: ἐπὶ τὴν γῆν
  choice: pe pământ
  rationale: Aici γῆ denumește suprafața solului pe care urma să se așeze mulțimea; redarea este clară și idiomatică.
