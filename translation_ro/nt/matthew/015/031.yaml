id: MAT.15.31
reference: Matthew 15:31
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὥστε ⸂τὸν ὄχλον⸃ θαυμάσαι βλέποντας κωφοὺς λαλοῦντας ⸂κυλλοὺς ὑγιεῖς⸃ ⸀καὶ χωλοὺς περιπατοῦντας καὶ τυφλοὺς βλέποντας· καὶ ἐδόξασαν τὸν θεὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/031.yaml
  text: so that the crowd marveled as they saw the mute speaking, the crippled made well, the lame walking, and the blind seeing; and they glorified the God of Israel.
translation:
  language: ro
  text: Așa că mulțimea s-a minunat văzându-i pe cei muți[a] vorbind, pe cei cu membre schilodite vindecați[b], pe cei șchiopi umblând și pe cei orbi văzând; și L-au glorificat pe Dumnezeul lui Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „cei surzi”. Termenul grecesc poate desemna persoane surde sau mute; aici este preferat sensul „muți”, deoarece accentul imediat cade pe faptul că vorbeau.
    reason: lexical_alternative
  - marker: b
    text: Sau „pe cei schilodiți sănătoși” sau „pe cei schilodiți refăcuți”. Greaca descrie persoane cu membre vătămate, deformate ori nefuncționale ajunse sănătoase sau refăcute.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Astfel
  rationale: Introduce în mod firesc rezultatul vindecărilor relatate anterior, păstrând valoarea consecutivă a construcției grecești.
- source_word: τὸν ὄχλον
  choice: mulțimea
  rationale: Echivalent românesc actual și firesc pentru grupul de oameni prezent.
- source_word: θαυμάσαι
  choice: s-a minunat
  rationale: Redă uimirea profundă exprimată de verb, iar singularul se acordă natural în română cu substantivul colectiv „mulțimea”.
- source_word: βλέποντας
  choice: văzându-i
  rationale: Păstrează participiul care arată motivul uimirii mulțimii și introduce natural enumerarea persoanelor vindecate.
- source_word: κωφοὺς
  choice: cei muți
  rationale: Deși termenul poate însemna „surzi” sau „muți”, participiul λαλοῦντας, „vorbind”, indică aici cel mai direct redobândirea vorbirii.
- source_word: λαλοῦντας
  choice: vorbind
  rationale: Redare directă și naturală a acțiunii puse în contrast cu starea anterioară.
- source_word: κυλλοὺς
  choice: cei cu membre schilodite
  rationale: Explicitează sensul de persoane ale căror membre sunt vătămate, deformate ori nefuncționale și evită confundarea lor cu „cei șchiopi” din următorul element al enumerării.
- source_word: ὑγιεῖς
  choice: vindecați
  rationale: În contextul minunilor, exprimă natural în română starea sănătoasă sau refăcută descrisă prin adjectivul grec.
- source_word: χωλοὺς
  choice: cei șchiopi
  rationale: Echivalent consacrat și precis în contextele biblice de vindecare.
- source_word: περιπατοῦντας
  choice: umblând
  rationale: Redă sensul concret al mersului redobândit.
- source_word: τυφλοὺς βλέποντας
  choice: cei orbi văzând
  rationale: Păstrează formularea succintă și paralelismul deliberat al enumerării grecești.
- source_word: ἐδόξασαν
  choice: L-au glorificat
  rationale: Păstrează sensul puternic al atribuirii gloriei lui Dumnezeu, nu doar ideea generală de laudă.
- source_word: τὸν θεὸν Ἰσραήλ
  choice: Dumnezeul lui Israel
  rationale: Redă construcția genitivală grecească în forma românească biblică firească.
theological_decisions:
- issue: Sensul lui κωφούς în expresia κωφοὺς λαλοῦντας
  choice: cei muți vorbind
  alternative: cei surzi vorbind
  rationale: Termenul grec are ambele sensuri, dar asocierea imediată cu „vorbind” favorizează aici incapacitatea de a vorbi. Ambiguitatea lexicală autentică este menționată în nota de subsol.
- issue: Redarea verbului δοξάζω cu referire la Dumnezeu
  choice: L-au glorificat pe Dumnezeul lui Israel
  alternative: L-au lăudat pe Dumnezeul lui Israel / I-au dat slavă Dumnezeului lui Israel
  rationale: „L-au glorificat” păstrează direct ideea atribuirii gloriei lui Dumnezeu, fără a restrânge răspunsul mulțimii la laudă verbală.
- issue: Relația dintre κυλλούς și ὑγιεῖς
  choice: cei cu membre schilodite vindecați
  alternative: cei schilodiți întregi / cei cu membre neputincioase sănătoși
  rationale: Formularea aleasă distinge această categorie de cei șchiopi și comunică refacerea descrisă de adjectivul ὑγιεῖς, fără a preciza natura exactă a infirmității dincolo de sensul termenului grec.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. Enumerarea și paralelismul sursei grecești sunt păstrate, iar termenii apropiați κυλλοί și χωλοί sunt diferențiați clar. Majuscula pronumelui „L-” urmează uzul românesc reverențial fără a adăuga conținut doctrinar.
