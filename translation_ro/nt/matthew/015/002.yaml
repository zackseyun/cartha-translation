source:
  edition: SBLGNT
  text: Διὰ τί οἱ μαθηταί σου παραβαίνουσιν τὴν παράδοσιν τῶν πρεσβυτέρων; οὐ γὰρ νίπτονται τὰς χεῖρας ⸀αὐτῶν ὅταν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: ro
  text: De ce încalcă ucenicii tăi tradiția bătrânilor? Căci ei nu-și spală mâinile când mănâncă pâine[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: În context, disputa privește o practică de spălare a mâinilor asociată cu tradiția bătrânilor, nu doar spălarea obișnuită pentru igienă.
    reason: cultural_note
  - marker: b
    text: 'Sau: „când iau masa”; în greacă, „pâine” poate desemna uneori hrana sau masa în general.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: De ce
  rationale: Redă firesc în româna actuală întrebarea privitoare la motiv.
- source_word: παραβαίνουσιν
  choice: încalcă
  rationale: Exprimă clar încălcarea unei norme sau tradiții cu autoritate, fără registrul arhaic al lui „calcă” ori tonul prea tehnic al lui „transgresează”.
- source_word: παράδοσιν
  choice: tradiția
  rationale: Păstrează ideea unei învățături sau practici primite și transmise, cu forța ei normativă în context.
- source_word: πρεσβυτέρων
  choice: bătrânilor
  rationale: Este echivalentul consacrat și demn pentru autoritățile sau înaintașii iudaici asociați tradiției, nu o simplă referire la vârstnici.
- source_word: νίπτονται τὰς χεῖρας αὐτῶν
  choice: nu-și spală mâinile
  rationale: Construcția reflexivă posesivă este idiomatică în română și redă exact spălarea mâinilor proprii.
- source_word: ὅταν
  choice: când
  rationale: Redă natural situația repetată sau obișnuită indicată de construcția grecească.
- source_word: ἄρτον
  choice: pâine
  rationale: Păstrează sensul lexical direct al substantivului grec, în timp ce sensul metonimic posibil este consemnat în notă.
- source_word: ἐσθίωσιν
  choice: mănâncă
  rationale: Prezentul românesc redă firesc acțiunea obișnuită din propoziția temporală generală.
theological_decisions:
- issue: Natura spălării mâinilor
  choice: Textul principal prezintă practica drept parte a tradiției bătrânilor, fără să o definească explicit drept curățire ceremonială sau igienă obișnuită.
  alternative: Introducerea explicită în text a termenului „ritual” sau interpretarea gestului ca simplă igienă.
  rationale: Versetul însuși leagă disputa de tradiția bătrânilor, dar nu formulează direct natura exactă a practicii; nota oferă context fără a elimina tensiunea interpretativă.
translation_notes:
  register: Română standard modernă, clară și demnă. „Căci” păstrează legătura explicativă marcată de γάρ, iar „nu-și spală mâinile” este formularea românească naturală. Marcajele ambelor note apar în text.
