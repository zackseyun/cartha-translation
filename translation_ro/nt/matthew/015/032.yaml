id: MAT.15.32
reference: Matthew 15:32
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ εἶπεν· Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον, ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν· καὶ ἀπολῦσαι αὐτοὺς νήστεις οὐ θέλω, μήποτε ἐκλυθῶσιν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/032.yaml
  text: Then Jesus called his disciples to him and said[a], “I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat. And I do not want to send them away hungry[d][c][b], lest they collapse on the way.”
translation:
  language: ro
  text: 'Atunci Isus i-a chemat la el pe ucenicii săi și a zis: „Mi-e milă de mulțime[a], pentru că sunt deja trei zile de când stau cu mine și nu au ce să mănânce. Nu vreau să-i trimit flămânzi[b], ca nu cumva să-și piardă puterile pe drum[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Sunt cuprins de milă pentru mulțime.”'
    reason: lexical_alternative
  - marker: b
    text: Termenul grecesc poate fi redat literal prin „nemâncați” sau „fără hrană”; aici nu se referă la un post religios.
    reason: lexical_alternative
  - marker: c
    text: 'Sau: „să leșine pe drum”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: i-a chemat la el
  rationale: Redă firesc participiul mediu și păstrează ideea că Isus îi cheamă pe ucenici la sine.
- source_word: Σπλαγχνίζομαι
  choice: Mi-e milă
  rationale: Exprimă în româna actuală compasiunea profundă indicată de verb, fără formulare greoaie.
- source_word: ὄχλον
  choice: mulțime
  rationale: Este echivalentul narativ firesc și demn pentru ὄχλος.
- source_word: ἤδη ἡμέραι τρεῖς προσμένουσίν μοι
  choice: sunt deja trei zile de când stau cu mine
  rationale: Păstrează durata și ideea continuării șederii alături de Isus într-o construcție românească naturală.
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: nu au ce să mănânce
  rationale: Redă idiomatic lipsa hranei.
- source_word: ἀπολῦσαι
  choice: să le dau drumul
  rationale: Se potrivește contextului în care mulțimea adunată urmează să fie lăsată să plece.
- source_word: νήστεις
  choice: flămânzi
  rationale: În context desemnează oameni rămași fără hrană, nu persoane care țin un post religios.
- source_word: μήποτε
  choice: ca nu cumva
  rationale: Păstrează explicit nuanța de rezultat temut.
- source_word: ἐκλυθῶσιν
  choice: să-și piardă puterile
  rationale: Redă sensul de a slăbi sau a ajunge la epuizare, fără a impune neapărat ideea pierderii cunoștinței.
- source_word: ἐν τῇ ὁδῷ
  choice: pe drum
  rationale: Este formularea românească idiomatică pentru călătoria de întoarcere.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. Formulările evită arhaismele, păstrând totodată intensitatea compasiunii lui Isus și nuanța de posibilă epuizare din propoziția finală.
