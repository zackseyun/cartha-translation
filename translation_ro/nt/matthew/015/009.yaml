  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/009.yaml
  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: ro
  text: Dar în zadar mi se închină, învățând porunci omenești drept doctrine.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „învățând ca doctrine poruncile oamenilor”.'
    reason: alternative_reading
lexical_decisions:
- source_word: μάτην
  choice: în zadar
  rationale: Redă firesc sensul adverbial „fără folos, fără rezultat” și păstrează tonul profetic de mustrare.
- source_word: δὲ
  choice: Dar
  rationale: Marchează contrastul ușor din context și se potrivește cu forța critică a citatului.
- source_word: σέβονταί με
  choice: mi se închină
  rationale: σέβομαι exprimă aici venerația religioasă îndreptată spre Dumnezeu; formularea este naturală în româna actuală.
- source_word: διδάσκοντες
  choice: dând drept învățături
  rationale: Păstrează legătura circumstanțială a participiului și exprimă faptul că poruncile omenești sunt prezentate cu autoritate doctrinară.
- source_word: διδασκαλίας
  choice: învățături
  rationale: Termenul poate desemna învățături sau doctrine; „învățături” este mai accesibil cititorului obișnuit și rămâne adecvat registrului religios.
- source_word: ἐντάλματα ἀνθρώπων
  choice: porunci omenești
  rationale: Redă concis originea pur umană a poruncilor și contrastul implicit cu ceea ce vine de la Dumnezeu; ἀνθρώπων este generic, nu limitat la bărbați.
theological_decisions:
- issue: Relația sintactică dintre διδασκαλίας și ἐντάλματα ἀνθρώπων
  choice: dând drept învățături porunci omenești
  alternative: învățând ca doctrine poruncile oamenilor
  rationale: Greaca este comprimată și permite formulări ușor diferite. Textul principal exprimă sensul probabil că poruncile de origine omenească sunt prezentate drept învățături cu autoritate, fără a adăuga explicit „de la Dumnezeu”.
- issue: Forța generică a lui ἀνθρώπων
  choice: omenești
  alternative: ale oamenilor
  rationale: Adjectivul românesc exprimă clar contrastul dintre originea umană și cea divină, fără a sugera că termenul grecesc se referă exclusiv la bărbați.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea evită arhaismele și păstrează tonul solemn al citatului profetic. Pronumele referitor la Dumnezeu este scris cu literă mică, potrivit normelor ortografice curente și fără a impune o convenție confesională.
