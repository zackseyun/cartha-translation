  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἀπεστάλην εἰ μὴ εἰς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/024.yaml
  text: But he answered[a], “I was sent only to the lost sheep of the house of Israel.”
translation:
  language: ro
  text: 'Dar el a răspuns: „Nu am fost trimis decât la oile pierdute ale casei lui Israel.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: a răspuns
  rationale: Construcția cu participiu aorist și verb finit este redată idiomatic și fidel în română prin verbul simplu „a răspuns”.
- source_word: Οὐκ ἀπεστάλην
  choice: Nu am fost trimis
  rationale: Aoristul pasiv exprimă trimiterea sau însărcinarea; perfectul compus pasiv este forma narativă firească în româna modernă.
- source_word: εἰ μὴ
  choice: decât
  rationale: În corelație cu negația, „nu... decât” păstrează exact valoarea restrictivă de excepție a expresiei grecești.
- source_word: τὰ πρόβατα τὰ ἀπολωλότα
  choice: oile pierdute
  rationale: Păstrează metafora oilor și redă participiul perfect adjectival prin termenul contextual firesc „pierdute”, fără a sugera o pieire definitivă.
- source_word: οἴκου Ἰσραήλ
  choice: casei lui Israel
  rationale: Păstrează expresia biblică și sensul ei colectiv, național și legământal, într-o formă consacrată și naturală în română.
- source_word: δὲ
  choice: Dar
  rationale: Marchează contrastul ușor și schimbarea narativă produsă de răspunsul lui Isus.
theological_decisions:
- issue: Sfera misiunii declarate de Isus în această afirmație
  choice: 'Formulare explicit restrictivă: „Nu am fost trimis decât...”'
  alternative: O parafrază care ar exprima doar prioritatea lui Israel sau ar introduce aici misiunea ulterioară către națiuni
  rationale: Construcția grecească Οὐκ ... εἰ μὴ este restrictivă. Traducerea păstrează tensiunea afirmației în contextul narativ, fără să o atenueze ori să o rezolve prin dezvoltări canonice ulterioare.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Sintagma „casa lui Israel” păstrează rezonanța biblică fără arhaizare inutilă; formularea „nu... decât” reproduce natural restricția din greacă.
