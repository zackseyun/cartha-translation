id: MAT.15.28
reference: Matthew 15:28
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ· Ὦ γύναι, μεγάλη σου ἡ πίστις· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/028.yaml
  text: Then Jesus answered her[a], “O woman, great is your faith[b]; let it be done for you as you desire.” And her daughter was healed from that hour.
translation:
  language: ro
  text: 'Atunci Isus i-a răspuns: „O, femeie, mare este credința ta![a] Să ți se facă așa cum dorești.” Și fiica ei a fost vindecată din ceasul acela.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „mare este încrederea ta”; termenul grecesc πίστις poate avea sensul de credință, încredere sau fidelitate, însă aici contextul pune în prim-plan încrederea femeii în Isus.
    reason: lexical_alternative
  - marker: b
    text: Sau „din clipa aceea”. Greaca spune literal „din ceasul acela”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Redă firesc marcatorul temporal care leagă răspunsul lui Isus de dialogul anterior.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτῇ
  choice: i-a răspuns
  rationale: Construcția grecească este o formulă narativă de introducere a vorbirii; formularea românească evită dublarea rigidă „răspunzând, i-a zis” și păstrează destinatarul exprimat prin αὐτῇ.
- source_word: Ὦ γύναι
  choice: O, femeie
  rationale: Păstrează particula de adresare și vocativul direct; în context, adresarea este solemnă și elogioasă, nu disprețuitoare.
- source_word: μεγάλη σου ἡ πίστις
  choice: mare este credința ta
  rationale: Păstrează accentul structurii grecești, în care adjectivul „mare” este pus în prim-plan, și rămâne natural în registrul biblic românesc.
- source_word: πίστις
  choice: credință
  rationale: Este echivalentul românesc uzual în acest context; aici desemnează încrederea stăruitoare a femeii în Isus, fără a exclude nuanța lexicală de „încredere”.
- source_word: γενηθήτω σοι
  choice: Să ți se facă
  rationale: Redă imperativul pasiv și dativul beneficiarului, păstrând forța rostirii împlinitoare a lui Isus.
- source_word: ὡς θέλεις
  choice: așa cum dorești
  rationale: „Dorești” exprimă voința sau dorința femeii într-un registru actual și demn.
- source_word: ἰάθη
  choice: a fost vindecată
  rationale: Redă direct aoristul pasiv al verbului ἰάομαι în contextul vindecării miraculoase.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: din ceasul acela
  rationale: Păstrează imaginea temporală exactă a grecescului, chiar dacă în româna curentă sensul poate fi exprimat și prin „din clipa aceea”.
theological_decisions:
- issue: Sensul lui πίστις în lauda rostită de Isus
  choice: credință
  alternative: încredere
  rationale: Contextul evidențiază încrederea femeii în puterea și bunăvoința lui Isus. „Credință” este redarea principală firească și păstrează deschiderea teologică a termenului, iar alternativa lexicală este indicată în notă.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. Ordinea „mare este credința ta” conservă accentul grecesc fără a deveni nefirească, iar „din ceasul acela” păstrează formularea sursei, cu echivalentul idiomatic oferit în notă.
