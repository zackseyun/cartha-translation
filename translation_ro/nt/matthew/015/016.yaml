    issue: „Nici voi” pentru καὶ ὑμεῖς
    rationale: '„Nici” funcționează în mod normal corelativ cu negația și poate sugera „nici voi, ca nici alții”, în timp ce greaca afirmă emfatic includerea ucenicilor: „și voi/de asemenea voi”. „Și voi” păstrează mai exact valoarea lui καί.'
