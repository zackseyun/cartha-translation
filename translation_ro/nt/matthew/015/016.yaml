  verdict: revise
  source_fidelity: '„Nici voi” introduce o nuanță negativă corelativă („nici voi”), pe când καὶ ὑμεῖς are aici sens aditiv/emfatic: „și voi/de asemenea voi”. În plus, ἀσύνετοι desemnează starea de lipsă a înțelegerii; redarea verbală „nu înțelegeți” este totuși o echivalență românească firească și adecvată în context. „Tot” redă bine persistența exprimată de Ἀκμήν.'
  naturalness: „Și voi tot nu înțelegeți?” este română standard modernă, directă și potrivită tonului de mustrare. Evită implicația mai restrictivă a lui „nici voi”, păstrând accentul asupra ucenicilor.
  terminology: Nu apar termeni teologici tehnici. „A înțelege” redă clar și neîncărcat ἀσύνετος în acest context, fără a intensifica sensul spre „nesăbuit” sau „prost”.
  issues:
