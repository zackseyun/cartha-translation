  text: ὁ ⸀δὲ εἶπεν· Ἀκμὴν καὶ ὑμεῖς ἀσύνετοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/016.yaml
  text: But he said[a], “Are you also still without understanding?”
translation:
  language: ro
  text: 'Dar el a spus: „Și voi tot nu înțelegeți?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Dar
  rationale: Marchează o ușoară opoziție sau trecerea la răspunsul lui Isus; „Dar” redă firesc această întorsătură în română.
- source_word: ὁ ... εἶπεν
  choice: el a spus
  rationale: Articolul ὁ are aici valoare pronominală și se referă la Isus, iar aoristul lui λέγω este redat prin forma narativă firească „a spus”.
- source_word: Ἀκμὴν
  choice: încă
  rationale: Adverbul indică persistența situației până în momentul vorbirii; poziția firească în română este la sfârșitul întrebării.
- source_word: καὶ ὑμεῖς
  choice: nici voi
  rationale: 'Într-o întrebare negativă ca sens, formularea idiomatică „nici voi” exprimă includerea emfatică a ucenicilor: nici ei, asemenea celorlalți, nu au ajuns să înțeleagă.'
- source_word: ἀσύνετοί ἐστε
  choice: nu înțelegeți
  rationale: Expresia desemnează lipsa de înțelegere sau discernământ. Redarea verbală este naturală în româna actuală și păstrează în context sensul intelectual și spiritual fără a-l înăspri spre „nesăbuiți”.
theological_decisions:
- issue: Tonul mustrării adresate ucenicilor
  choice: Întrebare directă despre faptul că încă nu înțeleg
  alternative: „Și voi sunteți încă fără pricepere?”
  rationale: Formularea păstrează mustrarea clară și surprinderea lui Isus față de lipsa lor persistentă de înțelegere, fără să transforme termenul într-o condamnare morală mai aspră.
translation_notes:
  register: Română standard modernă, clară și demnă. Construcția „Nici voi nu înțelegeți încă?” este idiomatică, păstrează accentul asupra ucenicilor și redă concis persistența lipsei lor de înțelegere.
