id: MAT.15.29
reference: Matthew 15:29
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ μεταβὰς ἐκεῖθεν ὁ Ἰησοῦς ἦλθεν παρὰ τὴν θάλασσαν τῆς Γαλιλαίας, καὶ ἀναβὰς εἰς τὸ ὄρος ἐκάθητο ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/029.yaml
  text: And departing from there[a], Jesus came along the Sea of Galilee, and after going up on the mountain[b], he sat there.
translation:
  language: ro
  text: După ce a plecat de acolo, Isus a venit pe lângă Marea Galileii[a], iar după ce a urcat pe munte, stătea așezat acolo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „lângă Marea Galileii”. Prepoziția grecească poate indica deplasarea pe lângă mare sau poziționarea lângă ea.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau, mai simplu: „a șezut acolo”. Imperfectul grecesc poate fi redat astfel în narațiune, dar „stătea așezat” evidențiază caracterul continuu al stării.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: Plecând de acolo
  rationale: Participiul aorist indică plecarea anterioară acțiunii principale; construcția participială este firească în română și păstrează succesiunea narativă.
- source_word: ἦλθεν
  choice: a mers
  rationale: În acest context de deplasare, verbul ἔρχομαι poate fi redat firesc prin „a mers”; „a venit” ar presupune în română un punct de perspectivă mai explicit decât oferă textul.
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: de-a lungul Mării Galileii
  rationale: παρά cu acuzativul, alături de un verb de mișcare, poate descrie deplasarea de-a lungul mării; formularea păstrează caracterul dinamic al expresiei.
- source_word: ἀναβὰς εἰς τὸ ὄρος
  choice: a urcat pe munte
  rationale: Participiul aorist exprimă o acțiune anterioară șederii, iar „a urcat pe munte” este echivalentul românesc natural al construcției.
- source_word: ἐκάθητο
  choice: stătea
  rationale: Imperfectul grecesc prezintă șederea ca stare în desfășurare; imperfectul românesc „stătea” păstrează acest aspect.
- source_word: ἐκεῖ
  choice: acolo
  rationale: Redare directă și firească a adverbului locativ.
- source_word: ὁ Ἰησοῦς
  choice: Isus
  rationale: Forma numelui urmează convenția românească modernă adoptată pentru text.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Ordinea acțiunilor și aspectul imperfect al verbului final sunt păstrate fără formulări greoaie.
