id: MAT.15.3
reference: Matthew 15:3
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Διὰ τί καὶ ὑμεῖς παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: ro
  text: 'Dar el le-a răspuns și le-a zis: „De ce încălcați și voi porunca lui Dumnezeu din cauza tradiției voastre?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „de dragul tradiției voastre”.'
    reason: Alternativă lexicală pentru διά cu acuzativul, care poate evidenția faptul că porunca este încălcată pentru a păstra tradiția.
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Dar el le-a răspuns și le-a zis
  rationale: Redă atât participiul „răspunzând”, cât și verbul „a zis”, păstrând expresia greacă influențată de uzul semitic, într-o formulare românească biblică și inteligibilă.
- source_word: Διὰ τί
  choice: De ce
  rationale: Este echivalentul românesc firesc al întrebării despre motiv sau cauză.
- source_word: καὶ ὑμεῖς
  choice: și voi
  rationale: 'Păstrează corespondența polemică cu acuzația precedentă: și interlocutorii lui Isus se fac vinovați de încălcare.'
- source_word: παραβαίνετε
  choice: încălcați
  rationale: Verbul exprimă trecerea peste limita unei porunci, adică violarea ei; „încălcați” este exact, actual și natural în română.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: porunca lui Dumnezeu
  rationale: „Porunca” păstrează registrul biblic și contrastul de autoritate dintre ceea ce poruncește Dumnezeu și tradiția interlocutorilor.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: din cauza tradiției voastre
  rationale: διά cu acuzativul indică aici motivul sau temeiul încălcării. Formularea este clară și nu extinde critica asupra oricărei tradiții, ci o limitează la tradiția concretă a interlocutorilor.
theological_decisions:
- issue: Contrastul dintre porunca divină și tradiția omenească
  choice: porunca lui Dumnezeu … tradiției voastre
  alternative: porunca lui Dumnezeu … învățăturii/obiceiului vostru
  rationale: „Poruncă” și „tradiție” păstrează opoziția directă din text fără a transforma versetul într-o condamnare generală a tuturor tradițiilor.
- issue: Valoarea lui διά cu acuzativul
  choice: din cauza tradiției voastre
  alternative: de dragul tradiției voastre
  rationale: Lectura cauzală este bine susținută lexical. Alternativa poate scoate mai puternic în evidență preferarea sau protejarea tradiției, dar adaugă o nuanță de scop ori beneficiu; ambiguitatea este semnalată în notă.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. Formula „le-a răspuns și le-a zis” păstrează forma retorică a originalului, deși este ușor redundantă după uzul românesc curent.
