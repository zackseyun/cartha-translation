id: MAT.15.21
reference: Matthew 15:21
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ἐκεῖθεν ὁ Ἰησοῦς ἀνεχώρησεν εἰς τὰ μέρη Τύρου καὶ Σιδῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/021.yaml
  text: And Jesus went out from there and withdrew to the region of Tyre and Sidon[a].
translation:
  language: ro
  text: Și Isus a plecat de acolo și S-a retras în ținuturile Tirului și Sidonului.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „a plecat în regiunea Tirului și Sidonului”. Verbul grecesc poate fi redat mai neutru, dar „S-a retras” reflectă folosirea lui repetată în Evanghelia după Matei.'
    reason: Alternativă lexicală pentru ἀνεχώρησεν și εἰς τὰ μέρη.
lexical_decisions:
- source_word: Καὶ
  choice: Și
  rationale: Păstrează legătura narativă simplă cu contextul anterior, fără a adăuga un accent interpretativ.
- source_word: ἐξελθὼν ἐκεῖθεν
  choice: a plecat de acolo
  rationale: Participiul aorist exprimă o acțiune anterioară verbului principal. În româna actuală, „a plecat de acolo” redă firesc ieșirea din locul precedent, fără a sugera un motiv.
- source_word: ἀνεχώρησεν
  choice: S-a retras
  rationale: Verbul ἀναχωρέω are frecvent la Matei nuanța retragerii sau îndepărtării. Alegerea păstrează această nuanță fără sensul mai puternic al unei fugi ori înfrângeri.
- source_word: εἰς τὰ μέρη
  choice: în ținuturile
  rationale: Pluralul μέρη desemnează părțile sau teritoriile unei zone. „În ținuturile” este natural în registru biblic modern și nu afirmă că Isus a intrat neapărat în cetățile înseși.
- source_word: Τύρου καὶ Σιδῶνος
  choice: Tirului și Sidonului
  rationale: Genitivele identifică teritoriile asociate cetăților feniciene Tir și Sidon; sunt folosite formele consacrate în română.
theological_decisions:
- issue: Nuanța narativă a deplasării lui Isus spre un teritoriu asociat neevreilor
  choice: „S-a retras”, fără precizarea motivului
  alternative: „a plecat” sau, mai accentuat, „S-a refugiat”
  rationale: Formularea lui Matei poate sugera o retragere deliberată, dar versetul nu precizează motivul. Traducerea păstrează nuanța fără a introduce o explicație psihologică sau teologică.
translation_notes:
  register: Română standard modernă, cu formulare demnă și accesibilă. S-a păstrat succesiunea celor două acțiuni și nuanța distinctă a verbului principal; pronumele reflexiv referitor la Isus este scris cu majusculă potrivit uzului biblic românesc.
