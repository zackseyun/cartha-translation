id: MAT.15.12
reference: Matthew 15:12
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ ⸀μαθηταὶ ⸀λέγουσιν αὐτῷ· Οἶδας ὅτι οἱ Φαρισαῖοι ἀκούσαντες τὸν λόγον ἐσκανδαλίσθησαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/012.yaml
  text: Then the disciples came and said to him[b][a], “Do you know that the Pharisees were offended when they heard this word?”
translation:
  language: ro
  text: 'Atunci ucenicii s-au apropiat și i-au zis: „Știi că fariseii s-au ofensat[a] când au auzit cuvântul acesta?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „au fost scandalizați”; mai literal, „s-au poticnit”.
    reason: lexical_alternative
  - marker: b
    text: „Cuvântul acesta” se referă la afirmația anterioară a lui Isus.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Redă firesc adverbul temporal care leagă episodul de afirmația precedentă.
- source_word: προσελθόντες
  choice: s-au apropiat
  rationale: Păstrează mai precis sensul participiului aorist προσέρχομαι decât simplul „au venit”, într-o construcție românească naturală.
- source_word: οἱ μαθηταὶ
  choice: ucenicii
  rationale: Articolul hotărât identifică grupul cunoscut; greaca nu are aici un posesiv explicit.
- source_word: λέγουσιν αὐτῷ
  choice: i-au zis
  rationale: Prezentul istoric grecesc este redat idiomatic prin perfectul compus, iar pronumele reproduce complementul αὐτῷ.
- source_word: Οἶδας
  choice: Știi
  rationale: Întrebarea directă este redată simplu și fără adaosul interpretativ „îți dai seama”.
- source_word: οἱ Φαρισαῖοι
  choice: fariseii
  rationale: Forma românească standard a numelui grupului.
- source_word: ἀκούσαντες τὸν λόγον
  choice: când au auzit cuvântul acesta
  rationale: Transformă participiul temporal într-o propoziție firească și păstrează termenul λόγος, cu referire contextuală la afirmația anterioară a lui Isus.
- source_word: ἐσκανδαλίσθησαν
  choice: s-au simțit jigniți
  rationale: Exprimă în româna actuală reacția negativă a fariseilor, păstrând în notă alternativele „s-au ofensat” și sensul literal al poticnirii.
theological_decisions:
- issue: Sensul lui σκανδαλίζω în reacția fariseilor
  choice: s-au simțit jigniți
  alternative: s-au ofensat; s-au poticnit
  rationale: Contextul indică faptul că afirmația lui Isus le-a provocat indignare sau ofensă. Nota păstrează metafora mai literală, fără a impune aici un sens soteriologic ori moral.
translation_notes:
  register: Română standard modernă, narativă și demnă. „S-au apropiat și i-au zis” redă natural construcția participială urmată de prezentul istoric. Marcajele notelor apar în text la elementele explicate.
