id: MAT.15.39
reference: Matthew 15:39
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἐνέβη εἰς τὸ πλοῖον, καὶ ἦλθεν εἰς τὰ ὅρια ⸀Μαγαδάν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/039.yaml
  text: And after dismissing the crowds[a], he got into the boat and came to the region of Magadan.
translation:
  language: ro
  text: După ce a trimis mulțimile, s-a urcat în barcă și a venit în regiunea Magadan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Unele manuscrise au „Magdala” în loc de „Magadan”.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπολύσας
  choice: după ce a lăsat ... să plece
  rationale: Participiul aorist exprimă o acțiune anterioară verbului principal. Formularea redă firesc trimiterea mulțimilor, fără a adăuga ideea că au fost trimise într-un anumit loc.
- source_word: τοὺς ὄχλους
  choice: mulțimile
  rationale: Păstrează pluralul grecesc și este termenul curent și clar în româna modernă.
- source_word: ἐνέβη εἰς τὸ πλοῖον
  choice: s-a urcat în barcă
  rationale: Redă idiomatic îmbarcarea și păstrează caracterul concret al acțiunii; «barcă» este mai curent în româna modernă decât «corabie».
- source_word: ἦλθεν
  choice: a venit
  rationale: Urmează sensul obișnuit al verbului ἔρχομαι și rămâne natural în relatarea deplasării.
- source_word: τὰ ὅρια
  choice: ținutul
  rationale: Pluralul grecesc desemnează aici în mod idiomatic o zonă sau un teritoriu, nu doar liniile de graniță.
- source_word: Μαγαδάν
  choice: Magadanului
  rationale: Textul SBLGNT are Μαγαδάν; numele este transliterat, iar forma de genitiv este cerută de construcția românească «ținutul Magadanului».
theological_decisions:
- issue: Forma numelui de loc la sfârșitul versetului
  choice: Magadan
  alternative: Magdala
  rationale: Este o chestiune textuală și toponimică, nu una doctrinară. Textul principal urmează forma Μαγαδάν din ediția greacă furnizată, iar varianta cunoscută este semnalată în notă.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea evită atât arhaismul «corabie», cât și o explicitare nejustificată precum «le-a trimis acasă». Marcajul notei este atașat numelui de loc la care se referă varianta textuală.
