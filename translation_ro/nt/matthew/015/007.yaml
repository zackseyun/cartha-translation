id: MAT.15.7
reference: Matthew 15:7
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὑποκριταί, καλῶς ἐπροφήτευσεν περὶ ὑμῶν Ἠσαΐας λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/007.yaml
  text: 'Hypocrites[a], Isaiah rightly prophesied about you, saying:'
translation:
  language: ro
  text: 'Ipocriților, pe bună dreptate[a] a profețit Isaia despre voi, spunând:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „bine a profețit Isaia despre voi”.'
    reason: Alternativă lexicală ce păstrează redarea mai literală a adverbului καλῶς și ambiguitatea dintre ideea de „bine” și cea de „pe bună dreptate”.
lexical_decisions:
- source_word: ὑποκριταί
  choice: Ipocriților
  rationale: Vocativul plural exprimă direct și apăsat mustrarea lui Isus; forma românească păstrează atât adresarea explicită, cât și forța acuzației.
- source_word: καλῶς
  choice: pe bună dreptate
  rationale: Redă sensul că profeția lui Isaia se aplică în mod potrivit și adevărat interlocutorilor, într-o formulare românească firească. Alternativa mai literală „bine” este păstrată în notă.
- source_word: ἐπροφήτευσεν
  choice: a profețit
  rationale: Echivalentul direct și consacrat pentru verbul grecesc, păstrând registrul profetic și legătura cu Isaia.
- source_word: περὶ ὑμῶν
  choice: despre voi
  rationale: Redă natural construcția περί cu genitivul și referirea explicită la cei cărora li se adresează Isus.
- source_word: Ἠσαΐας
  choice: Isaia
  rationale: Forma consacrată în limba română pentru numele profetului.
- source_word: λέγων
  choice: 'spunând:'
  rationale: Participiul introduce citatul următor; această redare este concisă și păstrează structura textului grec.
theological_decisions:
- issue: Forța adresării lui Isus către farisei și cărturari
  choice: 'Mustrare directă și condamnatoare: „Ipocriților”'
  alternative: O formulare atenuată, precum „Prefăcuților”
  rationale: Termenul grec ὑποκριταί are aici forța unei acuzații morale și religioase puternice. Atenuarea lui ar slăbi judecata exprimată de Isus și legătura cu citatul următor din Isaia.
translation_notes:
  register: Română standard modernă, demnă și directă. Vocativul „Ipocriților” păstrează asprimea retorică a originalului, iar „pe bună dreptate” evită ambiguitatea stilistică a lui „bine” în textul principal.
