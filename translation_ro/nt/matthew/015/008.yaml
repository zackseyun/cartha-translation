id: MAT.15.8
reference: Matthew 15:8
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ⸂Ὁ λαὸς οὗτος⸃ τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/008.yaml
  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: ro
  text: „Poporul acesta Mă cinstește cu buzele, dar inima lui este departe de Mine.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „dar inimile lor sunt departe de Mine”. În greacă, „inima” este la singular, fiind probabil folosită colectiv pentru popor ca întreg.'
    reason: alternativă lexicală și explicarea singularului colectiv
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: Poporul acesta
  rationale: Redă sensul colectiv al lui λαός și păstrează demonstrativul οὗτος, precum și ecoul solemn al citatului profetic.
- source_word: τοῖς χείλεσίν
  choice: cu buzele
  rationale: Dativul este instrumental; formularea păstrează imaginea concretă din greacă și este firească în româna actuală.
- source_word: με
  choice: Mă
  rationale: Pronume personal cu rol de complement direct al verbului τιμᾷ; majuscula este convențională în referirea la Dumnezeu.
- source_word: τιμᾷ
  choice: cinstește
  rationale: Redă direct ideea de acordare a cinstei, fără intensificarea pe care ar putea-o sugera „slăvește”.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: dar inima lui
  rationale: Păstrează singularul colectiv καρδία și redă firesc în română posesia raportată la substantivul colectiv singular „poporul”.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: este departe de Mine
  rationale: Formulare românească naturală care păstrează atât imaginea distanței, cât și implicația relațională, fără a o explica suplimentar.
theological_decisions:
- issue: Singularul colectiv „inimă” față de pluralul distributiv
  choice: inima lui
  alternative: inimile lor
  rationale: Textul grec folosește καρδία la singular și prezintă poporul ca întreg, cu o dispoziție lăuntrică unitară. Singularul este păstrat fără a exclude aplicarea la persoanele care alcătuiesc poporul.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Topica „Poporul acesta” păstrează accentul demonstrativ și tonul citatului profetic. Pronumele referitoare la Dumnezeu sunt scrise cu majusculă potrivit convenției editoriale românești.
