source:
  edition: SBLGNT
  text: καὶ λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Πόθεν ἡμῖν ἐν ἐρημίᾳ ἄρτοι τοσοῦτοι ὥστε χορτάσαι ὄχλον τοσοῦτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/033.yaml
  text: And the disciples said to him[c][b][a], “Where could we get enough bread in this desolate place to satisfy so large a crowd?”
translation:
  language: ro
  text: 'Ucenicii i-au zis: „De unde să avem noi, într-un loc pustiu[a], atâtea pâini[b], încât să săturăm o mulțime atât de mare?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „în pustiu” ori „într-un loc nelocuit”.
    reason: lexical_alternative
  - marker: b
    text: Literal, „atâtea pâini”; în context, expresia se referă la cantitatea de hrană necesară.
    reason: lexical_clarification
lexical_decisions:
- source_word: λέγουσιν
  choice: i-au zis
  rationale: Prezentul istoric grecesc este redat firesc prin perfectul compus în narațiunea românească; pronumele datival exprimă explicit destinatarul.
- source_word: οἱ μαθηταί
  choice: Ucenicii
  rationale: Articolul indică grupul deja cunoscut din context; nu se adaugă posesivul „lui”, care nu este explicit în greacă.
- source_word: Πόθεν ἡμῖν
  choice: De unde să avem noi
  rationale: Redă idiomatic întrebarea despre proveniență și păstrează dativul ἡμῖν prin construcția cu „noi”, fără a introduce explicit ideea de cumpărare sau procurare.
- source_word: ἐν ἐρημίᾳ
  choice: într-un loc pustiu
  rationale: ἐρημία desemnează aici o zonă nelocuită sau izolată; formularea este naturală și nu presupune neapărat un deșert arid.
- source_word: ἄρτοι τοσοῦτοι
  choice: atâtea pâini
  rationale: Păstrează pluralul concret al grecescului ἄρτοι și corelația cantitativă τοσοῦτοι, firească în română.
- source_word: ὥστε χορτάσαι
  choice: încât să săturăm
  rationale: Construcția consecutivă redă ὥστε cu infinitivul, iar „a sătura” păstrează sensul hrănirii până la îndestulare.
- source_word: ὄχλον τοσοῦτον
  choice: o mulțime atât de mare
  rationale: Redă substantivul colectiv și accentul cantitativ al lui τοσοῦτον într-o formulare românească actuală.
theological_decisions: []
translation_notes:
  register: Română literară modernă, clară și demnă. Sintaxa întrebării păstrează uimirea ucenicilor și paralelismul cantitativ dintre „atâtea pâini” și „o mulțime atât de mare”.
