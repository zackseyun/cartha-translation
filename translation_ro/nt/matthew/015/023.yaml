reference: Matthew 15:23
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἀπεκρίθη αὐτῇ λόγον. καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ⸀ἠρώτουν αὐτὸν λέγοντες· Ἀπόλυσον αὐτήν, ὅτι κράζει ὄπισθεν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/023.yaml
  text: But he did not answer her a word[a]. And his disciples came and kept asking him, saying, “Send her away[b], because she is crying out behind us.”
translation:
  language: ro
  text: 'Dar el nu i-a răspuns niciun cuvânt. Ucenicii lui s-au apropiat și îi cereau insistent, spunând: „Trimite-o[a], căci strigă în urma noastră[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „Dă-i drumul”. Cuvintele ucenicilor nu precizează dacă voiau ca Isus să-i împlinească cererea, astfel încât ea să plece, sau doar să o îndepărteze.
    reason: alternative_reading
  - marker: b
    text: Sau „în spatele nostru”. Expresia grecească poate indica fie poziția în spatele lor, fie faptul că femeia venea după ei.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῇ λόγον
  choice: nu i-a răspuns niciun cuvânt
  rationale: Redă firesc în română idiomul grecesc și păstrează accentul că Isus nu i-a dat absolut niciun răspuns.
- source_word: προσελθόντες
  choice: s-au apropiat
  rationale: Exprimă explicit mișcarea ucenicilor către Isus și este natural în narațiunea românească.
- source_word: ἠρώτουν
  choice: îl rugau mereu
  rationale: În acest context, ἐρωτάω are sensul de a ruga, iar imperfectul indică o cerere continuată sau repetată. „Mereu” face perceptibil acest aspect fără a transforma verbul în „a implora”.
- source_word: Ἀπόλυσον αὐτήν
  choice: Dă-i drumul
  rationale: Formularea românească poate însemna să fie lăsată să plece ori să fie trimisă de acolo și evită să precizeze nejustificat dacă ucenicii cereau mai întâi împlinirea cererii ei.
- source_word: κράζει
  choice: strigă
  rationale: Redă chemarea puternică și continuă indicată de verbul la prezent, într-o formulare românească simplă și directă.
- source_word: ὄπισθεν ἡμῶν
  choice: în urma noastră
  rationale: Păstrează atât ideea poziției în spatele grupului, cât și posibila nuanță că femeia îi urmează.
theological_decisions:
- issue: Intenția ucenicilor în porunca Ἀπόλυσον αὐτήν
  choice: 'Formulare neutră: „Dă-i drumul”'
  alternative: „Împlinește-i cererea și las-o să plece” sau „Alung-o de la noi”
  rationale: Greaca nu precizează dacă ucenicii voiau ca Isus să-i împlinească cererea și apoi s-o lase să plece sau doar s-o îndepărteze. Traducerea nu rezolvă această tensiune narativă.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. „Îl rugau mereu” păstrează caracterul continuu al cererii, iar „Dă-i drumul” evită vocabularul arhaic și conservă ambiguitatea pasajului.
