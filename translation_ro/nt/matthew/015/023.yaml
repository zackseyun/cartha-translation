  source_fidelity: Textul redă corect tăcerea lui Isus, apropierea ucenicilor, aspectul iterativ al imperfectului ἠρώτουν și strigătul femeii. Totuși, „Dă-i drumul” poate sugera în româna actuală eliberarea unei persoane aflate sub constrângere și este mai puțin potrivit ca redare principală pentru Ἀπόλυσον în acest context. „Trimite-o” este mai direct, firesc și păstrează intenționat neprecizată modalitatea trimiterii ei.
  naturalness: '„Îi cereau insistent” este mai idiomatic și mai exact contextual decât „îl rugau mereu”: păstrează valoarea durativă/repetată a imperfectului fără nuanța posibil excesiv de imploratoare a lui „a ruga”. „În urma noastră” rămâne o formulare românească naturală, capabilă să sugereze atât poziția, cât și urmărirea.'
  terminology: „Trimite-o” redă bine ἀπόλυσον fără a decide dacă ucenicii doreau împlinirea cererii femeii sau îndepărtarea ei. Nu sunt implicate aici nume ori termeni teologici care să necesite normalizare.
