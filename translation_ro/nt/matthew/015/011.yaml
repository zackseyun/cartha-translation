id: MAT.15.11
reference: Matthew 15:11
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οὐ τὸ εἰσερχόμενον εἰς τὸ στόμα κοινοῖ τὸν ἄνθρωπον, ἀλλὰ τὸ ἐκπορευόμενον ἐκ τοῦ στόματος τοῦτο κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/011.yaml
  text: It is not what enters into the mouth that defiles the man[b][a], but what comes out of the mouth—this defiles the man.
translation:
  language: ro
  text: Nu ceea ce intră în gură îl întinează[a] pe om[b], ci ceea ce iese din gură—acest lucru îl întinează pe om.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „îl face necurat”. Verbul grecesc poate desemna aducerea cuiva într-o stare de necurăție, îndeosebi în contextul curăției rituale.
    reason: lexical_alternative
  - marker: b
    text: Aici, „om” are sens reprezentativ și se referă generic la orice ființă umană.
    reason: cultural_note
lexical_decisions:
- source_word: κοινοῖ
  choice: îl întinează
  rationale: În contextul discuției despre curăție, verbul exprimă ajungerea unei persoane într-o stare de necurăție. „Îl întinează” păstrează atât rezonanța cultică, cât și pe cea morală, fără a sugera simpla murdărire fizică.
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: ceea ce intră în gură
  rationale: Participiul articulat este substantival; redarea prin „ceea ce intră” este firească în româna actuală și păstrează imaginea concretă a intrării în gură.
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: ceea ce iese din gură
  rationale: Redarea idiomatică prin „ceea ce iese” exprimă clar mișcarea dinspre gură, fără formularea rigidă „ceea ce purcede”.
- source_word: ἄνθρωπον
  choice: pe om
  rationale: Substantivul grecesc la singular are aici valoare reprezentativă. Românescul „om” păstrează singularul și funcționează firesc cu sens generic, referindu-se la orice ființă umană.
- source_word: τοῦτο
  choice: acest lucru
  rationale: 'Demonstrativul este redat explicit pentru a păstra accentul contrastiv al textului grec: tocmai ceea ce iese din gură îl întinează pe om.'
- source_word: οὐ ... ἀλλὰ
  choice: Nu ... ci ...
  rationale: Construcția românească redă direct și natural opoziția fermă dintre cele două elemente.
theological_decisions:
- issue: Sensul de curăție al verbului κοινόω
  choice: „îl întinează”, cu alternativa explicată în notă
  alternative: „îl face necurat”
  rationale: „Îl întinează” păstrează împreună dimensiunile cultică și morală ale afirmației și nu reduce sensul nici la igienă, nici exclusiv la statutul ceremonial.
- issue: Valoarea generică a lui ἄνθρωπον
  choice: „pe om”, cu precizarea sensului reprezentativ în notă
  alternative: „pe o persoană”
  rationale: „Om” corespunde substantivului singular și este în română o formulare naturală pentru ființa umană în sens generic, fără a restrânge afirmația la bărbați.
translation_notes:
  register: Formulare modernă, clară și demnă. „Întinează” este un termen cunoscut în registrul biblic, dar rămâne inteligibil în româna actuală; reluarea „pe om” și demonstrația prin „acest lucru” păstrează accentul și paralelismul sursei.
