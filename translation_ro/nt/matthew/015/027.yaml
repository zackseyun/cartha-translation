id: MAT.15.27
reference: Matthew 15:27
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἡ δὲ εἶπεν· Ναί, κύριε, καὶ γὰρ τὰ κυνάρια ἐσθίει ἀπὸ τῶν ψιχίων τῶν πιπτόντων ἀπὸ τῆς τραπέζης τῶν κυρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/027.yaml
  text: She said[a], “Yes, Lord[b], for even the little dogs eat from the crumbs that fall from their masters’ table.”
translation:
  language: ro
  text: 'Dar ea a spus: „Da, Doamne[b], căci și cățeii[a] mănâncă din firimiturile care cad de la masa stăpânilor lor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „câinii”, „câinii de casă” ori „puii de câine”; greaca folosește un diminutiv, care poate sugera câini mici, ținuți în gospodărie.
    reason: lexical_alternative
  - marker: b
    text: „Doamne” poate fi înțeles aici și ca o adresare respectuoasă, „domnule”; traducerea păstrează redarea obișnuită a lui κύριος în Evanghelii.
    reason: alternative_reading
lexical_decisions:
- source_word: Ναί
  choice: Da
  rationale: Redă direct și natural răspunsul afirmativ al femeii, păstrând acordul ei cu afirmația anterioară.
- source_word: κύριε
  choice: Doamne
  rationale: Este vocativul românesc consacrat pentru adresarea către Isus și păstrează atât respectul, cât și posibila semnificație teologică a lui κύριος.
- source_word: καὶ γὰρ
  choice: căci și
  rationale: 'Păstrează atât forța explicativă a lui γάρ, cât și nuanța aditivă a lui καί: femeia acceptă imaginea și își întemeiază răspunsul pe ea.'
- source_word: κυνάρια
  choice: cățeii
  rationale: Diminutivul românesc reflectă forma diminutivală grecească și sugerează câini mici sau domestici, fără a restrânge sensul la pui de câine.
- source_word: ἐσθίει
  choice: mănâncă
  rationale: Redă sensul simplu al verbului; acordul la plural este cerut de româna firească, deși greaca folosește verbul la singular cu un subiect neutru plural.
- source_word: ἀπὸ τῶν ψιχίων
  choice: din firimiturile
  rationale: „Din” redă idiomatic ideea de a mânca o parte dintre firimituri, iar „firimituri” este echivalentul precis în imaginea mesei.
- source_word: τῶν πιπτόντων
  choice: care cad
  rationale: Propoziția relativă redă natural participiul prezent și păstrează sensul general sau repetat al căderii firimiturilor.
- source_word: ἀπὸ τῆς τραπέζης
  choice: de la masa
  rationale: „De la” exprimă natural în română proveniența firimiturilor căzute de pe ori din zona mesei, fără formulare greoaie.
- source_word: τῶν κυρίων αὐτῶν
  choice: stăpânilor lor
  rationale: În metafora domestică, κύριοι desemnează stăpânii câinilor; alegerea păstrează raportul de autoritate și paralelismul lexical cu κύριε, fără a confunda referentul.
theological_decisions:
- issue: Redarea lui κύριε în adresarea directă către Isus
  choice: Doamne
  alternative: domnule
  rationale: „Doamne” este redarea evanghelică obișnuită și lasă deschisă atât lectura ca adresare respectuoasă, cât și recunoașterea mai profundă a autorității lui Isus; nota semnalează ambiguitatea reală.
- issue: Păstrarea forței diminutivale a lui κυνάρια
  choice: cățeii
  alternative: câinii; câinii de casă; puii de câine
  rationale: „Cățeii” reproduce diminutivul din greacă și nu face metafora mai aspră decât este, dar nici nu o transformă într-o parafrază explicativă.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Ordinea notelor urmează termenii marcați în text; formularea păstrează argumentul concis al femeii și ambiguitatea lui κύριε.
