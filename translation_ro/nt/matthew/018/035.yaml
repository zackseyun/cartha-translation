  terminology: „Tatăl Meu ceresc”, „a ierta” și „fratele său” sunt adecvate registrului solemn și textului grec. Majuscula reverențială este o convenție editorială acceptabilă. Nota privind masculinul singular este potrivită, dar ancora ei trebuie plasată imediat după expresia explicată.
