  rationale: Revizuirea înlocuiește elipsa românească stângace „vă va face” cu „va face ... cu voi”, fără să precizeze natura acțiunii divine dincolo de ceea ce lasă implicat greaca și pilda precedentă. De asemenea, mută ancora notei culturale lângă „fratele său”. Restul formulării păstrează fidel condiția negativă, distribuția lui ἕκαστος și idiomul românesc natural „din inimă”, documentat prin notă literală.
