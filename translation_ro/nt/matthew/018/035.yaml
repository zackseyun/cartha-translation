  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ πατήρ μου ὁ ⸀οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/035.yaml
  text: So also my heavenly Father will do to you[b][a], if each of you does not forgive his brother from your hearts.
translation:
  language: ro
  text: Tot așa va face și Tatăl Meu ceresc cu voi, dacă fiecare dintre voi nu-l iartă pe fratele său[a] din inimă[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Fratele său” redă masculinul singular din greacă; în context, formularea se referă reprezentativ la orice alt ucenic sau credincios.
    reason: cultural_note
  - marker: b
    text: 'Literal: „din inimile voastre”.'
    reason: literal_rendering
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Tot așa ... și
  rationale: Redă firesc în română forța comparativă și conclusivă, făcând trimitere la purtarea stăpânului din pilda precedentă.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: Tatăl Meu ceresc
  rationale: Păstrează posesivul și adjectivul οὐράνιος într-o formulare românească consacrată și naturală.
- source_word: ποιήσει ὑμῖν
  choice: vă va face
  rationale: Menține caracterul larg al verbului ποιέω și legătura cu acțiunea stăpânului din pildă, fără a preciza mai mult decât spune textul.
- source_word: ἐὰν μὴ
  choice: dacă ... nu
  rationale: Redă transparent condiția negativă; alternativa „dacă nu” este mai directă aici decât reformularea cu „decât dacă”.
- source_word: ἀφῆτε
  choice: iartă
  rationale: În contextul greșelii personale și al imaginii datoriei, ἀφίημι are sensul clar de a ierta.
- source_word: ἕκαστος
  choice: fiecare dintre voi
  rationale: Exprimă valoarea distributivă a singularului în raport cu destinatarii la plural.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: pe fratele său
  rationale: Păstrează masculinul singular al textului grecesc; sensul reprezentativ în cadrul comunității ucenicilor este explicat în notă.
- source_word: ἀπὸ τῶν καρδιῶν ὑμῶν
  choice: din inimă
  rationale: Este expresia românească firească pentru iertarea sinceră și lăuntrică. Pluralul literal al grecei este consemnat în notă.
theological_decisions:
- issue: Întinderea și gravitatea avertismentului
  choice: 'Avertisment direct: „vă va face”'
  alternative: O parafrază atenuată precum „se va purta la fel cu voi” sau o explicitare doctrinară a judecății
  rationale: Versetul aplică direct pilda și afirmă solemn o judecată condiționată, dar nu definește aici categoria ei sistematic-teologică. Formularea păstrează tensiunea fără atenuare sau extindere.
- issue: Limbajul masculin din ἀδελφῷ
  choice: „pe fratele său”, cu notă explicativă
  alternative: „pe fratele sau sora sa”, „pe aproapele său” ori „pe un alt credincios”
  rationale: Textul-sursă are masculin singular. Traducerea îl păstrează, iar nota clarifică funcția sa reprezentativă fără a modifica formularea de bază.
translation_notes:
  register: Română standard modernă, cu ton solemn și direct. Majuscula din „Meu” urmează convenția editorială reverențială, fără a schimba sensul. Formularea „din inimă” evită construcția rigidă „din inimile voastre”, păstrând însă sensul lăuntric și sincer al iertării.
