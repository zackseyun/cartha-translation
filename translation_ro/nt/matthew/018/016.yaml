  source_fidelity: Textul redă fidel sensul lui ἐὰν δὲ μὴ ἀκούσῃ prin „dacă nu te ascultă”, imperativul παράλαβε μετὰ σοῦ prin „ia cu tine”, valoarea aditivă a lui ἔτι prin „încă”, precum și propoziția finală juridică introdusă de ἵνα. „Orice chestiune” transmite adecvat πᾶν ῥῆμα în contextul formulei juridice aluzive la Deuteronomul 19:15, fără a-l restrânge nejustificat la „acuzație” sau „caz” în sens tehnic.
