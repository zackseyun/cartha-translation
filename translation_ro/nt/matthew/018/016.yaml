id: MAT.18.16
reference: Matthew 18:16
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ἀκούσῃ, παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο, ἵνα ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν σταθῇ πᾶν ῥῆμα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/016.yaml
  text: But if he does not listen[a], take one or two others with you[b], so that by the mouth of two or three witnesses every matter may be established.
translation:
  language: ro
  text: Dar, dacă nu te ascultă, ia cu tine încă unul sau doi, pentru ca orice chestiune să fie stabilită pe mărturia[a] a doi sau trei martori.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: „pe gura”; expresie juridică cu sensul „pe baza mărturiei”.'
    reason: lexical_alternative
  - marker: b
    text: Aluzie la Deuteronomul 19:15, unde o chestiune este stabilită pe mărturia a doi sau trei martori.
    reason: cross_reference
lexical_decisions:
- source_word: ἀκούσῃ
  choice: te ascultă
  rationale: În contextul îndreptării frățești, verbul exprimă ascultarea receptivă, adică luarea în seamă, nu simpla percepție auditivă.
- source_word: παράλαβε μετὰ σοῦ
  choice: ia cu tine
  rationale: Redă firesc imperativul concret și ideea de însoțire exprimată de μετά cu genitivul.
- source_word: ἔτι ἕνα ἢ δύο
  choice: încă unul sau doi
  rationale: Păstrează valoarea aditivă a lui ἔτι și indică persoane suplimentare fără a adăuga o identificare absentă din text.
- source_word: ἵνα
  choice: pentru ca
  rationale: Păstrează clar valoarea finală, de scop.
- source_word: ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν
  choice: pe mărturia a doi sau trei martori
  rationale: Redă sensul juridic al idiomului semitic într-o română naturală; formularea literală «pe gura» ar fi nefirească și potențial obscură.
- source_word: σταθῇ
  choice: să fie stabilită
  rationale: În cadrul juridic și în aluzia la Deuteronom, verbul indică validarea sau confirmarea unei chestiuni.
- source_word: πᾶν ῥῆμα
  choice: orice chestiune
  rationale: În acest context juridic, sintagma desemnează lucrul sau cazul aflat în discuție, nu doar un cuvânt rostit.
theological_decisions:
- issue: Aluzia la regula martorilor din Deuteronom și aplicarea ei în disciplina comunității
  choice: Formularea juridică limpede «orice chestiune să fie stabilită pe mărturia a doi sau trei martori»
  alternative: Formularea mai literală «orice cuvânt să stea pe gura a doi sau trei martori»
  rationale: Alegerea păstrează funcția juridică a citatului și tensiunea dintre mărturie și stabilirea faptelor, fără a restrânge nejustificat sensul la o acuzație anume.
translation_notes:
  register: Română standard modernă, clară și demnă. «Te ascultă» păstrează legătura personală din contextul imediat, iar «pe mărturia» comunică natural idiomul juridic biblic.
