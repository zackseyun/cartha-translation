  terminology: „Martori”, „mărturie” și „stabilită” sunt potrivite pentru registrul juridic al versetului. Traducerea interpretativă a idiomului ἐπὶ στόματος ca „pe mărturia” este justificată și este susținută de nota lexicală. Ancora notei lexicale este plasată corespunzător lângă expresia pe care o explică.
