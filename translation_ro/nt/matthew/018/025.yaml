id: MAT.18.25
reference: Matthew 18:25
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι ἐκέλευσεν αὐτὸν ὁ ⸀κύριος πραθῆναι καὶ τὴν ⸀γυναῖκα καὶ τὰ τέκνα καὶ πάντα ὅσα ⸀ἔχει καὶ ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/025.yaml
  text: But since he was unable to repay[a], the master ordered that he be sold, along with his wife and children and all that he had[b], and that payment be made.
translation:
  language: ro
  text: Dar, fiindcă nu avea cu ce să plătească, stăpânul[a] a poruncit să fie vândut, împreună cu soția și copiii lui și cu tot ce avea[b], iar să se facă plata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „domnul”. Termenul grecesc κύριος poate însemna „domn” ori „stăpân”; aici se referă la superiorul omenesc al slujitorului din parabolă.
    reason: lexical_alternative
  - marker: b
    text: Adică el și familia lui urmau să fie vânduți, iar bunurile lui valorificate, pentru a se face plata.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι
  choice: Dar, fiindcă nu avea cu ce să plătească
  rationale: Genitivul absolut exprimă aici împrejurarea cauzală. Formularea românească „nu avea cu ce” redă firesc lipsa mijloacelor de plată, fără a sugera că nu avea o datorie de achitat.
- source_word: ἐκέλευσεν
  choice: a poruncit
  rationale: Verbul indică emiterea unui ordin autoritar; „a poruncit” este clar și potrivit raportului dintre stăpân și slujitor.
- source_word: ὁ κύριος
  choice: stăpânul
  rationale: În cadrul parabolei, termenul îl desemnează pe superiorul omenesc al slujitorului. „Stăpânul” este natural în română și evită confundarea cu un titlu divin direct.
- source_word: πραθῆναι
  choice: să fie vândut
  rationale: Păstrează sensul pasiv al verbului și realitatea juridico-socială a vânzării persoanei pentru datorie.
- source_word: τὴν γυναῖκα καὶ τὰ τέκνα
  choice: soția și copiii lui
  rationale: Posesivul, implicit în context, este exprimat pentru claritate și naturalețe în română.
- source_word: πάντα ὅσα ἔχει
  choice: tot ce avea
  rationale: Redă simplu totalitatea bunurilor sale; imperfectul se armonizează firesc cu relatarea la trecut.
- source_word: καὶ ἀποδοθῆναι
  choice: iar plata să fie făcută
  rationale: Păstrează construcția pasivă și scopul implicit al vânzării, fără a introduce explicit substantivul „datorie”, absent din această propoziție.
theological_decisions:
- issue: Redarea lui κύριος în contextul parabolei
  choice: stăpânul
  alternative: domnul
  rationale: Deși κύριος poate însemna „Domnul” sau „domnul”, aici referentul imediat este superiorul omenesc din povestire. „Stăpânul” redă relația socială fără a transforma automat termenul într-un titlu divin; alternativa lexicală este păstrată în notă.
translation_notes:
  register: Română literară modernă, clară și demnă. Formularea „nu avea cu ce să plătească” este idiomatică, iar ordinea coordonărilor păstrează desfășurarea propoziției grecești fără rigiditate.
