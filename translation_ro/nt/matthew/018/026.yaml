base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/026.yaml
  text: So the servant fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
translation:
  language: ro
  text: 'Robul s-a aruncat deci la pământ și i s-a prosternat[a], spunând: „Ai răbdare cu mine și îți voi plăti totul!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „i se închina”. Verbul grecesc poate însemna „a se închina” în contexte religioase; aici descrie prosternarea plină de respect înaintea unui stăpân omenesc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσὼν
  choice: s-a aruncat la pământ
  rationale: Participiul aorist descrie gestul fizic prin care robul se smerește înaintea stăpânului; formularea este firească în româna actuală și redă intensitatea scenei.
- source_word: οὖν
  choice: Atunci
  rationale: Conectorul indică urmarea narativă a hotărârii din versetul anterior; „atunci” păstrează cursivitatea relatării fără a accentua excesiv o deducție logică.
- source_word: δοῦλος
  choice: rob
  rationale: În contextul antic al obligației totale față de stăpân, „rob” redă mai fidel statutul social exprimat de δοῦλος decât termenul mai larg „slujitor”.
- source_word: προσεκύνει αὐτῷ
  choice: a rămas plecat înaintea lui
  rationale: Verbul la imperfect descrie o atitudine continuă de prosternare și supunere înaintea unui stăpân omenesc. Redarea evită să impună sensul exclusiv religios al lui „a se închina”, dar păstrează gestul de profund respect.
- source_word: λέγων
  choice: spunând
  rationale: Participiul introduce direct cuvintele robului; caracterul lor implorator reiese limpede din situație și din cererea care urmează.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Ai răbdare cu mine
  rationale: Imperativul cere îngăduință și amânarea aplicării pedepsei; expresia este clară, actuală și potrivită contextului unei datorii.
- source_word: πάντα
  choice: totul
  rationale: Pluralul neutru are sens cuprinzător și se referă la întreaga datorie; „totul” este echivalentul românesc cel mai firesc aici.
- source_word: ἀποδώσω σοι
  choice: îți voi plăti
  rationale: În context financiar, ἀποδίδωμι înseamnă a restitui sau a achita o datorie. Împreună cu „totul”, verbul „a plăti” redă concis promisiunea achitării integrale.
theological_decisions:
- issue: Sensul verbului προσκυνέω când este îndreptat spre un stăpân omenesc
  choice: 'Gest de prosternare și supunere: „a rămas plecat înaintea lui”'
  alternative: „i se închina” sau „i s-a prosternat”
  rationale: În lumea parabolei, robul se află înaintea stăpânului său, iar verbul exprimă aici omagiul smerit manifestat prin plecare la pământ. Redarea nu exclude aria semantică mai largă a verbului, dar evită să sugereze nejustificat că scena descrie în mod explicit închinare religioasă.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. „Rob” păstrează realitatea socială a parabolei, iar formularea „a rămas plecat” redă atât postura, cât și aspectul continuu al imperfectului grecesc.
