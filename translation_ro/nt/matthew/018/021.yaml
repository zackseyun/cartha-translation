id: MAT.18.21
reference: Matthew 18:21
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τότε προσελθὼν ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, ποσάκις ἁμαρτήσει εἰς ἐμὲ ὁ ἀδελφός μου καὶ ἀφήσω αὐτῷ; ἕως ἑπτάκις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/021.yaml
  text: Then Peter came up to him and said[a], “Lord, how many times will my brother sin against me, and I forgive him? Up to seven times?”
translation:
  language: ro
  text: 'Atunci Petru s-a apropiat de el și a spus: „Doamne, de câte ori va păcătui fratele meu[a] împotriva mea, iar eu îl voi ierta? Până la șapte ori?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „fratele sau sora mea”; textul grec spune „fratele meu” (masculin singular), expresie care, în acest context, se poate referi mai larg la un alt ucenic.
    reason: alternativă lexicală și clarificarea sferei contextuale
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Redă firesc marcatorul temporal și păstrează continuitatea narațiunii.
- source_word: προσελθὼν αὐτῷ
  choice: s-a apropiat de el
  rationale: Participiul aorist exprimă apropierea lui Petru de Isus înainte de a vorbi; formularea este naturală în româna actuală.
- source_word: ὁ Πέτρος εἶπεν
  choice: Petru ... a spus
  rationale: Păstrează verbul general al vorbirii din greacă, fără a-l înlocui interpretativ cu „a întrebat”.
- source_word: Κύριε
  choice: Doamne
  rationale: Vocativul tradițional și firesc al lui „Domn”, păstrând atât respectul adresării, cât și posibila rezonanță teologică.
- source_word: ποσάκις
  choice: de câte ori
  rationale: Exprimă frecvența numerică și pregătește limita propusă în întrebarea următoare.
- source_word: ἁμαρτήσει εἰς ἐμὲ
  choice: va păcătui ... împotriva mea
  rationale: Păstrează viitorul indicativ și redă idiomatic orientarea greșelii împotriva vorbitorului.
- source_word: ὁ ἀδελφός μου
  choice: fratele meu
  rationale: Redă direct substantivul masculin singular din textul grec, fără a extinde interpretativ formularea în textul principal.
- source_word: καὶ ἀφήσω αὐτῷ
  choice: iar eu îl voi ierta
  rationale: „A ierta” corespunde sensului etic al lui ἀφίημι; viitorul este păstrat, iar „iar” face mai limpede în română schimbarea subiectului dintre cele două verbe coordonate.
- source_word: ἕως ἑπτάκις
  choice: Până la șapte ori?
  rationale: Păstrează propunerea lui Petru privind limita maximă a iertării.
theological_decisions:
- issue: Sfera referinței lui ἀδελφός
  choice: „fratele meu” în textul principal
  alternative: „fratele sau sora mea”; „un alt ucenic”; „semenul meu în credință”
  rationale: Greaca are masculinul singular „fratele meu”. În context, termenul poate desemna mai larg un alt ucenic, dar această posibilitate este menționată în notă, nu introdusă în text.
- issue: Relația dintre păcătuire și iertare în întrebarea lui Petru
  choice: Sunt păstrate cele două verbe la viitor, coordonate prin „iar”
  alternative: „de câte ori să-l iert ... când păcătuiește împotriva mea?”
  rationale: Alternativa este mai idiomatică, dar restructurează întrebarea și transformă formele verbale. Redarea aleasă păstrează tensiunea și forma neobișnuită a exprimării grecești, rămânând inteligibilă în română.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Formularea păstrează ordinea logică și timpurile verbale ale textului grec, evitând atât arhaismele, cât și parafraza excesivă.
