  text: καὶ ὀργισθεὶς ὁ κύριος αὐτοῦ παρέδωκεν αὐτὸν τοῖς βασανισταῖς ἕως οὗ ἀποδῷ πᾶν τὸ ⸀ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/034.yaml
  text: And in anger his master handed him over to the torturers until he should pay all that was owed[a][b].
translation:
  language: ro
  text: Și, mâniindu-se, stăpânul lui l-a dat pe mâna chinuitorilor, până când va plăti tot ce datora.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „Domnul”; cuvântul grecesc este kyrios. Aici se referă la stăpânul slujitorului din cadrul parabolei.
    reason: alternative_reading
  - marker: b
    text: Sau „celor care îl chinuiesc” sau, mai puțin pregnant, „temnicerilor”. Termenul grecesc se referă la cei care pricinuiesc chinuri, nu doar la paznici obișnuiți.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: mâniindu-se
  rationale: Participiul aorist este redat printr-un gerunziu firesc în română, păstrând starea afectivă ce însoțește și motivează acțiunea principală.
- source_word: κύριος
  choice: stăpânul
  rationale: În cadrul parabolei, termenul indică superiorul omenesc al slujitorului; „stăpânul” redă relația narativă fără a transforma termenul într-un titlu cristologic.
- source_word: παρέδωκεν
  choice: l-a dat pe mâna
  rationale: Expresia românească redă natural predarea unei persoane sub autoritatea altora și păstrează nuanța judiciară.
- source_word: βασανισταῖς
  choice: celor care îl chinuiau
  rationale: Termenul desemnează persoane care aplică chinuri, nu simpli paznici. Formularea este clară și actuală, păstrând severitatea grecescului.
- source_word: ἕως οὗ
  choice: până
  rationale: Redă direct și natural limita temporală exprimată de construcția grecească.
- source_word: ἀποδῷ
  choice: avea să plătească
  rationale: Construcția redă sensul prospectiv al conjunctivului după ἕως οὗ, fără o formulare românească rigidă.
- source_word: πᾶν τὸ ὀφειλόμενον
  choice: tot ce datora
  rationale: Redă fidel expresia participială și evită introducerea explicită a substantivului „datorie”, absent din această formulare grecească.
theological_decisions:
- issue: Dacă κύριος trebuie redat prin titlul „Domnul”
  choice: stăpânul
  alternative: Domnul
  rationale: Referentul imediat este stăpânul slujitorului din parabolă. Alegerea păstrează sensul narativ, fără a exclude implicațiile teologice ale parabolei.
- issue: Severitatea termenului βασανισταῖς în contextul judecății parabolice
  choice: celor care îl chinuiau
  alternative: temnicerilor
  rationale: Grecescul indică aplicarea chinului și este mai puternic decât denumirea unor simpli paznici. Redarea păstrează avertismentul sever fără a defini dincolo de text natura judecății finale.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „L-a dat pe mâna” este idiomatic, dar păstrează caracterul judiciar al acțiunii; perifraza „celor care îl chinuiau” evită un substantiv rar sau greoi.
