id: MAT.18.7
reference: Matthew 18:7
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οὐαὶ τῷ κόσμῳ ἀπὸ τῶν σκανδάλων· ἀνάγκη ⸀γὰρ ἐλθεῖν τὰ σκάνδαλα, πλὴν οὐαὶ τῷ ⸀ἀνθρώπῳ δι’ οὗ τὸ σκάνδαλον ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/007.yaml
  text: Woe to the world because of stumbling blocks[a]; for it is necessary that the stumbling blocks come[b], but woe to the man through whom the stumbling block comes.
translation:
  language: ro
  text: Vai de lume din cauza prilejurilor de cădere[a]! Căci este necesar ca prilejurile de cădere să vină, dar vai de omul[b] prin care vine prilejul de cădere!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „poticnirilor”, „ispitelor”, „capcanelor” ori „prilejurilor de păcat”. Termenul grecesc σκάνδαλον desemnează ceva care face pe cineva să se împiedice sau să cadă, inclusiv prin ofensă, ispitire ori împingere la păcat.
    reason: lexical_alternative
  - marker: b
    text: În greacă, „omul” este la masculin singular, dar are aici valoare reprezentativă și se referă la orice om prin care vine un asemenea prilej de cădere.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαί
  choice: Vai de
  rationale: Păstrează forța profetică și judiciară a avertizării, precum și repetarea retorică din ambele propoziții.
- source_word: κόσμῳ
  choice: lume
  rationale: Redă sensul larg al lumii omenești afectate de rău, fără a-l restrânge la creația fizică sau la un anumit grup de oameni.
- source_word: ἀπὸ
  choice: din cauza
  rationale: În context exprimă cauza nenorocirii anunțate; formularea este limpede și firească în româna actuală.
- source_word: σκάνδαλα / σκάνδαλον
  choice: prilejurile de cădere / prilejul de cădere
  rationale: Păstrează metafora împiedicării și gama semantică ce include ispita, capcana, poticnirea și împingerea la păcat; menține deosebirea dintre plural și singular.
- source_word: ἀνάγκη
  choice: este necesar
  rationale: Păstrează afirmația explicită de necesitate fără a preciza dacă aceasta este providențială, logică sau ține de inevitabilitatea situației.
- source_word: γάρ
  choice: căci
  rationale: Introduce explicația afirmației precedente într-un registru demn și încă firesc în limba română.
- source_word: ἐλθεῖν ... ἔρχεται
  choice: să vină ... vine
  rationale: Păstrează repetiția verbală și imaginea din greacă, fără a o transforma în formularea mai abstractă „să aibă loc”.
- source_word: πλήν
  choice: dar
  rationale: Marchează clar contrastul dintre necesitatea venirii prilejurilor de cădere și răspunderea celui prin care vine unul dintre ele.
- source_word: ἀνθρώπῳ
  choice: omul
  rationale: Redă substantivul masculin singular din sursă și îi păstrează întrebuințarea reprezentativă.
- source_word: δι’ οὗ
  choice: prin care
  rationale: Exprimă persoana ca mijloc sau agent prin care apare prilejul de cădere, fără a elimina nuanța de mediere a construcției grecești.
theological_decisions:
- issue: Natura necesității exprimate de ἀνάγκη γὰρ ἐλθεῖν τὰ σκάνδαλα
  choice: Afirmația este redată prin „este necesar”, fără explicarea sursei necesității.
  alternative: „Este inevitabil să vină” ori „trebuie să vină”, formulări care pot accentua fie inevitabilitatea practică, fie ideea unui decret divin.
  rationale: Textul grec afirmă necesitatea, dar nu îi precizează temeiul. Redarea aleasă păstrează tensiunea teologică fără a atribui în mod explicit lui Dumnezeu producerea prilejurilor de cădere.
- issue: Forța reprezentativă a lui ἀνθρώπῳ
  choice: Textul principal păstrează masculinul singular „omul”, cu sens reprezentativ.
  alternative: „persoana” sau „oricine”
  rationale: Forma sursă este masculin singular, însă avertizarea are aplicare generală. Nota explică acest lucru fără a înlocui forma gramaticală din text.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează paralelismul celor două exclamații cu „Vai de”, repetiția termenilor-cheie și metafora căderii, evitând atât arhaismele inutile, cât și explicitarea doctrinară a necesității.
