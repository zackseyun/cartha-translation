id: MAT.18.32
reference: Matthew 18:32
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τότε προσκαλεσάμενος αὐτὸν ὁ κύριος αὐτοῦ λέγει αὐτῷ· Δοῦλε πονηρέ, πᾶσαν τὴν ὀφειλὴν ἐκείνην ἀφῆκά σοι, ἐπεὶ παρεκάλεσάς με·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/032.yaml
  text: Then his master summoned him and said to him[a], ‘Wicked servant[b], I forgave you all that debt because you pleaded with me.’
translation:
  language: ro
  text: 'Atunci, stăpânul lui l-a chemat și i-a zis: „Sclav rău[a], ți-am iertat[b] toată datoria aceea, fiindcă m-ai rugat.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „rob rău”. Termenul grecesc δοῦλος poate desemna un sclav sau un rob; în unele contexte poate fi redat și prin „slujitor”.
    reason: lexical_alternative
  - marker: b
    text: Sau „ți-am anulat toată datoria aceea”. Verbul grecesc poate însemna atât a ierta, cât și a elibera de o datorie ori a o remite.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Redă firesc în română legătura temporală și narativă din desfășurarea parabolei.
- source_word: προσκαλεσάμενος
  choice: l-a chemat
  rationale: Verbul exprimă chemarea cuiva la sine; formularea românească este naturală și păstrează autoritatea stăpânului fără a adăuga ideea unei convocări oficiale.
- source_word: ὁ κύριος αὐτοῦ
  choice: stăpânul lui
  rationale: În context, κύριος denumește stăpânul robului, nu este folosit ca titlu divin.
- source_word: λέγει αὐτῷ
  choice: i-a zis
  rationale: Prezentul istoric grecesc este redat prin perfectul compus, timpul narativ firesc în româna modernă.
- source_word: Δοῦλε πονηρέ
  choice: Rob rău
  rationale: „Rob” păstrează relația de dependență față de stăpân, iar „rău” redă condamnarea morală exprimată de πονηρός într-o formulare concisă și idiomatică.
- source_word: πᾶσαν τὴν ὀφειλὴν ἐκείνην
  choice: toată datoria aceea
  rationale: Redare directă și firească a întregii sume datorate.
- source_word: ἀφῆκά σοι
  choice: ți-am iertat
  rationale: În context este vorba de remiterea datoriei, dar verbul ἀφίημι păstrează și rezonanța iertării, importantă pentru sensul parabolei.
- source_word: ἐπεὶ
  choice: fiindcă
  rationale: Introduce limpede motivul acțiunii stăpânului.
- source_word: παρεκάλεσάς με
  choice: m-ai rugat
  rationale: Redă cererea stăruitoare fără a exagera intensitatea verbului; contextul anterior face limpede caracterul implorator.
theological_decisions:
- issue: Redarea lui δοῦλος în relația dintre stăpân și datornic
  choice: rob
  alternative: sclav; slujitor
  rationale: „Rob” face vizibilă relația de dependență și stăpânire centrală în parabolă, dar evită rigiditatea vocativului „sclav” în română. Nota păstrează deschisă aria lexicală.
- issue: Redarea lui ἀφίημι într-un context de datorie
  choice: ți-am iertat
  alternative: ți-am șters; ți-am anulat
  rationale: „A ierta” păstrează suprapunerea voită dintre remiterea unei datorii și iertarea morală, fără a reduce imaginea la o operațiune strict financiară.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. „Rob” este ușor marcat biblic, dar rămâne inteligibil și redă mai bine decât „slujitor” statutul dependent din parabolă. Punctuația dialogului urmează uzul românesc actual.
