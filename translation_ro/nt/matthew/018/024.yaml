  text: ἀρξαμένου δὲ αὐτοῦ συναίρειν ⸀προσηνέχθη ⸂αὐτῷ εἷς⸃ ὀφειλέτης μυρίων ταλάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/024.yaml
  text: And when he began to settle accounts[a], one debtor who owed ten thousand talents was brought to him.
translation:
  language: ro
  text: Când a început să ceară socoteală, i-a fost adus un datornic care îi datora zece mii de talanți.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un talant era o unitate monetară foarte mare; în cadrul parabolei, „zece mii de talanți” reprezintă o datorie de neînchipuit.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξαμένου δὲ αὐτοῦ
  choice: Când a început
  rationale: Genitivul absolut introduce împrejurarea temporală a acțiunii principale; formularea este firească în româna actuală și nu precizează excesiv succesiunea.
- source_word: συναίρειν
  choice: să încheie socotelile
  rationale: În context financiar, verbul se referă la verificarea și reglarea conturilor. Expresia românească păstrează imaginea contabilă și sensul contextual.
- source_word: προσηνέχθη αὐτῷ
  choice: i-a fost adus
  rationale: Aoristul pasiv arată că datornicul a fost adus de alții înaintea stăpânului; construcția cu pronume datival redă concis și natural αὐτῷ.
- source_word: εἷς ὀφειλέτης
  choice: un datornic
  rationale: În română, numeralul εἷς poate avea aici funcție introductivă, echivalentă articolului nehotărât; redarea cu «un» este naturală și introduce un caz particular fără a impune contrastul numeric «unul».
- source_word: μυρίων ταλάντων
  choice: zece mii de talanți
  rationale: μύριοι denumește literal zece mii și sugerează totodată o sumă uriașă. Unitatea istorică este păstrată deoarece transformarea într-o monedă modernă ar fi aproximativă și ar pierde cadrul parabolei.
theological_decisions: []
translation_notes:
  register: Română standard modernă, clară și demnă. «A încheia socotelile» este o expresie idiomatică accesibilă, iar «talanți» păstrează termenul istoric, explicat în notă.
