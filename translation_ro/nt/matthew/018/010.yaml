id: MAT.18.10
reference: Matthew 18:10
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων, λέγω γὰρ ὑμῖν ὅτι οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν ⸀οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/010.yaml
  text: See that you do not despise one of these little ones[c][b][a], for I tell you that their angels in heaven continually see the face of my Father who is in heaven.
translation:
  language: ro
  text: Aveți grijă să nu disprețuiți pe niciunul dintre acești micuți,[a] căci vă spun că îngerii lor[b] în ceruri văd neîncetat fața Tatălui Meu, care este în ceruri.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „să nu priviți de sus pe niciunul dintre acești micuți”.'
    reason: lexical_alternative
  - marker: b
    text: Expresia „îngerii lor” poate desemna îngeri asociați cu acești micuți sau care îi reprezintă; versetul singur nu stabilește întreaga doctrină a îngerilor păzitori.
    reason: alternative_reading
  - marker: c
    text: 'În greacă, atât aici, cât și în expresia „în ceruri”, substantivul este la plural: „ceruri”.'
    reason: source_form
lexical_decisions:
- source_word: Ὁρᾶτε μὴ καταφρονήσητε
  choice: Aveți grijă să nu disprețuiți
  rationale: Imperativul prezent urmat de μή și conjunctivul aorist exprimă un avertisment/prohibiție. Formularea este firească în româna actuală și păstrează atât vigilența cerută, cât și gravitatea verbului καταφρονέω.
- source_word: ἑνὸς τῶν μικρῶν τούτων
  choice: pe niciunul dintre acești micuți
  rationale: În contextul unei propoziții negative, româna cere firesc „niciunul”. „Micuți” păstrează referința suficient de largă, fără a o limita explicit doar la copii.
- source_word: λέγω γὰρ ὑμῖν
  choice: căci vă spun
  rationale: Redă natural formula discursivă și valoarea explicativă a lui γάρ.
- source_word: οἱ ἄγγελοι αὐτῶν
  choice: îngerii lor
  rationale: Păstrează relația posesivă din greacă fără a preciza natura exactă a asocierii dintre îngeri și cei micuți.
- source_word: ἐν οὐρανοῖς
  choice: din ceruri
  rationale: În legătură cu „îngerii lor”, formularea românească indică locul în care se află îngerii și păstrează pluralul grecesc.
- source_word: διὰ παντὸς
  choice: neîncetat
  rationale: Redă idiomul cu sensul „mereu/în permanență” într-un registru demn și actual.
- source_word: βλέπουσι τὸ πρόσωπον
  choice: văd ... fața
  rationale: Păstrează direct imaginea biblică a accesului la prezența lui Dumnezeu.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: Tatălui Meu, care este în ceruri
  rationale: Păstrează limbajul filial explicit și construcția atributivă, fără a comprima expresia în „Tatăl Meu ceresc”.
theological_decisions:
- issue: Sensul expresiei „îngerii lor”
  choice: Expresia este păstrată literal, fără definirea unei doctrine a îngerilor păzitori individuali.
  alternative: S-ar putea interpreta fie ca îngeri personali desemnați fiecăruia, fie mai general ca îngeri asociați cu acești micuți sau care îi reprezintă.
  rationale: Versetul afirmă relația prin posesiv, dar nu explică mecanismul angelologic; traducerea nu trebuie să rezolve ceea ce textul lasă deschis.
- issue: Referentul expresiei „acești micuți”
  choice: Este folosit termenul larg „micuți”.
  alternative: „copilași” ar limita referința la vârstă, iar „cei neînsemnați” ar limita-o la statut.
  rationale: Contextul din Matei 18 implică un copil, dar extinde tema spre smerenie și spre cei care cred; formularea păstrează această amplitudine.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. „Aveți grijă” evită rigiditatea lui „Vedeți să”, iar „neîncetat” păstrează solemnitatea fără arhaizare. Majusculele reverențiale la „Meu” și „Tatălui” urmează uzul editorial românesc religios.
