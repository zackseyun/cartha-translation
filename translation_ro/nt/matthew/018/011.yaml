source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἦλθεν γὰρ ὁ υἱὸς τοῦ ἀνθρώπου σῶσαι τὸ ἀπολωλός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/011.yaml
  text: For the Son[a] of Man came to save the lost.
translation:
  language: ro
  text: Căci Fiul Omului a venit să salveze ce era pierdut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Acest verset lipsește din cele mai vechi manuscrise grecești, inclusiv Codex Sinaiticus și Codex Vaticanus din secolul al IV-lea, precum și din traduceri copte timpurii. El apare însă în Codex Bezae din secolul al V-lea, în tradiția majoritară bizantină și în Vulgata latină. Este posibil să fi fost adăugat ulterior de copiști pentru armonizare cu Luca 19:10.
    reason: textual_critical
lexical_decisions:
- source_word: σῴζω
  choice: să salveze
  rationale: Redă direct infinitivul aorist σῶσαι și păstrează sensul de izbăvire din primejdie sau pierzare, fără a adăuga o precizare absentă din text.
- source_word: τὸ ἀπολωλός
  choice: ce era pierdut
  rationale: Participiul perfect neutru singular, folosit substantival, desemnează «ceea ce se afla în stare de pierdere». Formularea românească păstrează neutrul și ambiguitatea referentului mai bine decât «cei pierduți».
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Echivalentul consacrat și inteligibil al titlului grec, cu majuscule pentru folosirea lui titulară în acest context.
- source_word: γάρ
  choice: Căci
  rationale: Păstrează legătura explicativă a versetului cu contextul precedent.
theological_decisions:
- issue: Referentul expresiei τὸ ἀπολωλός
  choice: ce era pierdut
  alternative: cei pierduți
  rationale: Greaca are neutru singular, nu masculin plural; traducerea aleasă evită să restrângă explicit referentul la persoane, deși contextul permite această înțelegere.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. «Să salveze» este natural în uzul actual, iar «ce era pierdut» păstrează forma neutră și starea rezultată exprimată de perfectul grecesc.
