  text: καὶ ὃς ⸀ἐὰν δέξηται ⸂ἓν παιδίον τοιοῦτο⸃ ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/005.yaml
  text: And whoever receives one such child in my name receives me[a][b].
translation:
  language: ro
  text: Și oricine primește un astfel de copil în numele Meu Mă primește pe Mine.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „primește cu bunăvoință”. Verbul grecesc poate însemna „a primi”, „a primi cu bunăvoință” sau „a accepta”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literal: „un astfel de copil”; textul grecesc nu conține în acest vers adjectivul „mic”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: oricine
  rationale: Pronumele relativ împreună cu ἐάν exprimă o condiție generală nedefinită; „oricine” redă firesc această valoare în româna actuală.
- source_word: δέξηται / δέχεται
  choice: primește / primește
  rationale: „A primi” păstrează repetarea verbului grecesc și face explicită corespondența dintre primirea copilului și primirea lui Isus. Verbul poate însemna și „a întâmpina cu bunăvoință” sau „a accepta”.
- source_word: ἓν παιδίον τοιοῦτο
  choice: un astfel de copil
  rationale: Formularea redă literal și natural referirea la copilul tocmai prezentat și la unul asemenea lui; nu adaugă adjectivul „mic”, absent din acest vers.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: în Numele Meu
  rationale: Expresia consacrată și naturală păstrează deschisă ideea acțiunii făcute cu referire la numele, autoritatea sau apartenența față de Isus, fără a restrânge sensul la o singură nuanță.
- source_word: ἐμὲ
  choice: Mă ... pe Mine
  rationale: Construcția românească cu reluarea pronumelui redă natural obiectul accentuat ἐμέ și subliniază identificarea reprezentativă din finalul enunțului.
theological_decisions:
- issue: Identificarea reprezentativă dintre copil și Isus
  choice: Primirea unui astfel de copil în Numele lui Isus este prezentată drept primirea lui Isus Însuși.
  alternative: Primirea copilului ar putea fi parafrazată doar ca un mod de a-L cinsti pe Isus.
  rationale: Același verb, δέχομαι, are mai întâi ca obiect copilul, apoi pe Isus; traducerea păstrează afirmația directă, fără a-i adăuga implicații sacramentale sau ecleziale care nu sunt exprimate în text.
translation_notes:
  register: Română standard modernă, clară și demnă. Repetarea lui „primește” urmărește deliberat repetiția grecească. Majusculele reverențiale pentru pronumele referitoare la Isus sunt folosite consecvent în formularea propusă.
