id: MAT.18.8
reference: Matthew 18:8
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον ⸀αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν εἰσελθεῖν εἰς τὴν ζωὴν ⸂κυλλὸν ἢ χωλόν⸃, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/008.yaml
  text: And if your hand or your foot causes you to stumble[a], cut it off and throw it away from you. It is better for you to enter into life maimed or lame than, having two hands or two feet, to be thrown into the eternal fire.
translation:
  language: ro
  text: Iar dacă mâna ta sau piciorul tău te face să te poticnești[a], taie-l și aruncă-l departe de tine. Este mai bine pentru tine să intri în viață ciung sau șchiop decât, având două mâini sau două picioare, să fii aruncat în focul veșnic.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „te face să păcătuiești”. Verbul grecesc înseamnă literal „te face să te poticnești”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίζει
  choice: te face să cazi în păcat
  rationale: Păstrează imaginea căderii din verbul grec și exprimă firesc în română implicația morală cerută de context; nota consemnează alternativa mai concisă și mai interpretativă.
- source_word: ἔκκοψον
  choice: taie-l
  rationale: Imperativul este concret și categoric, iar pronumele masculin se acordă firesc cu oricare dintre substantivele «mâna» și «piciorul» considerate alternativ, după uzul românesc raportat la antecedentul cel mai apropiat și la membrul vizat.
- source_word: βάλε ἀπὸ σοῦ
  choice: aruncă-l departe de tine
  rationale: Redă atât acțiunea energică a lui βάλλω, cât și îndepărtarea exprimată prin ἀπὸ σοῦ.
- source_word: καλόν σοί ἐστιν
  choice: Este mai bine pentru tine
  rationale: Deși καλόν înseamnă în mod obișnuit «bine/bun», construcția contrastivă cu ἢ are aici valoare comparativă.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: să intri în viață
  rationale: Păstrează termenul simplu «viață» din greacă, fără a adăuga explicit «veșnică»; sensul escatologic reiese din contrast.
- source_word: κυλλὸν
  choice: ciung
  rationale: În contextul tăierii unei mâini, «ciung» redă precis lipsa sau mutilarea unui membru și este mai specific decât termenii generali referitori la dizabilitate.
- source_word: χωλόν
  choice: șchiop
  rationale: Este echivalentul românesc direct și contextual pentru afectarea piciorului indicată de χωλός.
- source_word: ἔχοντα
  choice: având
  rationale: Redă explicit participiul grec și păstrează contrastul structural dintre intrarea în viață lipsit de un membru și judecata cu ambele membre.
- source_word: βληθῆναι
  choice: să fii aruncat
  rationale: Redă direct infinitivul pasiv al lui βάλλω într-o formulare românească actuală.
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: focul veșnic
  rationale: «Veșnic» este redarea naturală a lui αἰώνιος în acest context de judecată și păstrează caracterul grav al expresiei.
theological_decisions:
- issue: 'Redarea lui σκανδαλίζει: metafora împiedicării sau explicitarea păcatului'
  choice: te face să cazi în păcat
  alternative: te face să păcătuiești
  rationale: Formularea aleasă păstrează ceva din metafora greacă a poticnirii/căderii, dar clarifică direcția morală în româna curentă, fără a reduce verbul la simpla ofensare.
- issue: Sensul lui «viață» în εἰς τὴν ζωὴν
  choice: viață
  alternative: viața veșnică
  rationale: Textul grec spune simplu «viață». Nu se adaugă adjectivul «veșnică», deși sensul escatologic este indicat de opoziția cu focul veșnic.
- issue: Caracterul poruncii despre mutilarea trupului
  choice: limbajul concret și categoric este păstrat
  alternative: parafrazarea ca îndemn figurat la renunțarea radicală la păcat
  rationale: Traducerea nu decide în text dacă rostirea este hiperbolică, ci păstrează tensiunea și severitatea imaginii originale.
translation_notes:
  register: Română standard modernă, clară și solemnă. S-au evitat atât arhaismele, cât și formulările clinice sau eufemistice care ar slăbi imaginea. Markerul [a] este inclus în text la termenul relevant.
