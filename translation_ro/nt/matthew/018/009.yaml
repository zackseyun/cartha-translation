id: MAT.18.9
reference: Matthew 18:9
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ ὀφθαλμός σου σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν μονόφθαλμον εἰς τὴν ζωὴν εἰσελθεῖν, ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/009.yaml
  text: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into the Gehenna of fire.
translation:
  language: ro
  text: Și dacă ochiul tău te face să cazi[a], smulge-l și aruncă-l departe de tine. Este mai bine pentru tine să intri în viață cu un singur ochi decât, având doi ochi, să fii aruncat în Gheena[b] focului.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „te face să păcătuiești”. Verbul grecesc poate însemna a face pe cineva să se împiedice, să cadă sau să păcătuiască.'
    reason: lexical_alternative
  - marker: b
    text: „Gheena” desemnează locul judecății finale; în mod tradițional, termenul este redat prin „iad”.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: te face să cazi
  rationale: Păstrează metafora împiedicării și căderii, fără a restrânge sensul exclusiv la păcat; nota indică sensul contextual posibil.
- source_word: ἔξελε
  choice: scoate-l
  rationale: Imperativul cere o îndepărtare hotărâtă; în româna actuală, „scoate-l” este firesc și suficient de puternic în contextul smulgerii ochiului.
- source_word: βάλε ἀπὸ σοῦ
  choice: aruncă-l de la tine
  rationale: Redă atât acțiunea decisivă exprimată de βάλλω, cât și separarea indicată de ἀπὸ σοῦ.
- source_word: καλόν σοί ἐστιν
  choice: Este mai bine pentru tine
  rationale: Construcția are valoare comparativă în opoziția introdusă prin ἤ, astfel că „mai bine” exprimă sensul idiomatic.
- source_word: μονόφθαλμον
  choice: cu un singur ochi
  rationale: Formulare naturală în româna contemporană pentru adjectivul „cu un singur ochi”.
- source_word: εἰς τὴν ζωὴν
  choice: în viață
  rationale: Păstrează formularea greacă fără a adăuga adjectivul „veșnică”, lăsând intactă rezonanța escatologică.
- source_word: βληθῆναι
  choice: să fii aruncat
  rationale: Redă direct infinitivul pasiv și păstrează forța imaginii.
- source_word: γέενναν
  choice: Gheena
  rationale: Transliterarea termenului specific γέεννα îi păstrează particularitatea istorică și escatologică, fără a-l echivala neexplicat cu termenul teologic mai larg „iad”.
- source_word: τοῦ πυρός
  choice: focului
  rationale: Păstrează genitivul grec în expresia firească românească „Gheena focului”.
theological_decisions:
- issue: Redarea termenului γέεννα
  choice: Gheena
  alternative: iadul
  rationale: Textul folosește termenul specific γέεννα. Păstrarea lui evită contopirea cu un termen teologic mai larg; nota explică referința.
- issue: Redarea expresiei εἰς τὴν ζωὴν
  choice: în viață
  alternative: în viața veșnică
  rationale: Deși contextul este escatologic, adjectivul „veșnică” nu apare în textul grec și nu este adăugat.
- issue: Forța lui σκανδαλίζει
  choice: te face să cazi
  alternative: te face să păcătuiești
  rationale: Varianta principală păstrează metafora sursei, iar nota prezintă explicit sensul moral contextual fără a elimina ambiguitatea lexicală.
translation_notes:
  register: Română standard modernă, demnă și directă. Sintaxa urmărește îndeaproape contrastul și imaginile textului grec, evitând atât arhaismele, cât și explicitările doctrinare care nu apar în sursă.
