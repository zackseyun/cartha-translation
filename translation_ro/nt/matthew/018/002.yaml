- source_word: ἔστησεν
  choice: l-a pus să stea
  rationale: 'Păstrează valoarea cauzativă a verbului: Isus a făcut copilul să se așeze în picioare ori să stea într-un anumit loc; formularea evită impresia că doar l-a așezat jos.'
- source_word: ἐν μέσῳ αὐτῶν
  choice: în mijlocul lor
  rationale: Echivalent direct și idiomatic pentru poziționarea copilului în centrul grupului.
