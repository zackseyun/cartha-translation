id: MAT.18.12
reference: Matthew 18:12
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/012.yaml
  text: What do you think? If a man has a hundred sheep[a], and one of them goes astray[c][b], will he not leave the ninety-nine on the mountains and go and seek the one going astray?
translation:
  language: ro
  text: Ce credeți? Dacă un om are o sută de oi și una dintre ele se rătăcește[a], oare nu va lăsa cele nouăzeci și nouă pe munți[b], ca să se ducă s-o caute pe cea care se rătăcește[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „se abate”. Verbul grecesc poate însemna „a se rătăci”, „a se abate” sau, în anumite contexte, „a fi dus în rătăcire”.
    reason: lexical_alternative
  - marker: b
    text: Sau „pe dealuri”.
    reason: lexical_alternative
  - marker: c
    text: 'Literal: „cea care se rătăcește”; tradițional: „cea pierdută”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Ce credeți?
  rationale: Întrebare introductivă firească în româna actuală, care păstrează adresarea directă la plural și îi invită pe ascultători să judece situația.
- source_word: ἐὰν γένηταί τινι ἀνθρώπῳ
  choice: Dacă un om are
  rationale: Construcția cu γίνομαι și dativul exprimă aici posesia ori situația în care se află cineva. „Un om” păstrează forma masculină singulară cu sens reprezentativ.
- source_word: ἑκατὸν πρόβατα
  choice: o sută de oi
  rationale: Redare directă și idiomatică a expresiei numerice.
- source_word: πλανηθῇ ἓν ἐξ αὐτῶν
  choice: una dintre ele se rătăcește
  rationale: „Se rătăcește” păstrează atât imaginea pastorală, cât și posibila rezonanță figurată, fără să precizeze dacă oaia este indusă în eroare de un agent extern.
- source_word: οὐχὶ ἀφήσει
  choice: nu le va lăsa el
  rationale: Întrebarea cu οὐχί așteaptă un răspuns afirmativ. Viitorul redă ἀφήσει, iar pronumele „el” susține în română forma retorică a întrebării.
- source_word: τὰ ἐνενήκοντα ἐννέα
  choice: cele nouăzeci și nouă
  rationale: Formulare românească standard, cu substantivul „oi” subînțeles din context.
- source_word: ἐπὶ τὰ ὄρη
  choice: pe munți
  rationale: Redare concretă și apropiată de sensul obișnuit al lui ὄρη; „pe dealuri” rămâne o alternativă contextual posibilă.
- source_word: καὶ πορευθεὶς ζητεῖ
  choice: și nu se va duce s-o caute
  rationale: Participiul πορευθείς este redat natural printr-un verb coordonat, iar ζητεῖ prin „s-o caute”. Repetarea negației este cerută de sintaxa firească a întrebării retorice în română.
- source_word: τὸ πλανώμενον
  choice: cea care se rătăcește
  rationale: Păstrează aspectul verbal al participiului prezent și repetă aceeași rădăcină lexicală folosită anterior, fără a înlocui expresia cu „cea pierdută”.
theological_decisions:
- issue: Masculinul generic ἀνθρώπῳ
  choice: un om
  alternative: cineva
  rationale: „Un om” păstrează forma masculină singulară a textului-sursă și funcția ei reprezentativă, fără să restrângă aplicabilitatea afirmației.
- issue: Nuanța verbului πλανάω în metafora oii
  choice: se rătăcește / cea care se rătăcește
  alternative: se abate / cea pierdută / este dusă în rătăcire
  rationale: Alegerea păstrează ambivalența dintre rătăcirea concretă și cea figurată, fără să introducă ideea mai puternică de pierzare sau să atribuie explicit acțiunea unui agent extern.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează întrebarea retorică, imaginea topografică și repetarea verbului πλανάω, evitând atât arhaismele, cât și explicarea doctrinară a metaforei.
