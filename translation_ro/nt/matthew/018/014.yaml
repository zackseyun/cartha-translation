  yaml_path: translation/nt/matthew/018/014.yaml
  text: In the same way, it is not the will of your Father in heaven that even one of these little ones should perish.
translation:
  language: ro
  text: Tot așa, nu este voia Tatălui vostru, care este în ceruri, ca vreunul dintre acești micuți să piară.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „să se piardă”. Verbul grecesc poate însemna atât „să piară”, cât și „să se piardă”; contextul imediat al oii pierdute susține a doua nuanță.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Tot așa
  rationale: Leagă firesc afirmația de pilda precedentă și păstrează valoarea comparativă a termenului.
- source_word: οὐκ ἔστιν θέλημα ἔμπροσθεν τοῦ πατρός
  choice: nu este voia Tatălui
  rationale: Redă idiomatic în română construcția grecească; sensul lui ἔμπροσθεν este inclus în formula care exprimă ceea ce este voit înaintea Tatălui, fără formularea românească rigidă „voia înaintea Tatălui”.
- source_word: πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: Tatălui vostru din ceruri
  rationale: Formulare românească naturală, apropiată de greacă și păstrând pluralul οὐρανοῖς prin expresia consacrată „din ceruri”.
- source_word: ἵνα ἀπόληται
  choice: să piară
  rationale: Păstrează gravitatea verbului ἀπόλλυμι, în timp ce sensul contextual „să se piardă” este consemnat în nota de subsol.
- source_word: ἓν τῶν μικρῶν τούτων
  choice: vreunul dintre acești micuți
  rationale: „Vreunul” într-o propoziție negativă exprimă firesc ideea că nici măcar unul nu este exceptat, fără a adăuga explicit un intensificator absent din greacă; „micuți” nu limitează referirea doar la copii.
theological_decisions:
- issue: Sensul lui ἀπόληται în raport cu contextul oii pierdute
  choice: să piară
  alternative: să se piardă
  rationale: Verbul poate indica pieirea sau faptul de a fi pierdut. Textul principal păstrează avertismentul grav, iar nota conservă nuanța susținută de contextul imediat, fără a elimina tensiunea interpretativă.
- issue: Forța expresiei ἓν τῶν μικρῶν τούτων
  choice: vreunul dintre acești micuți
  alternative: unul dintre acești micuți
  rationale: În română, „vreunul” sub negație comunică natural caracterul neexceptiv al afirmației, fără a introduce explicit „chiar și”, care nu are un corespondent lexical direct.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Tot așa” asigură legătura discursivă, iar „micuți” păstrează deschisă referirea la cei smeriți sau vulnerabili, fără a o restrânge la vârsta copilăriei.
