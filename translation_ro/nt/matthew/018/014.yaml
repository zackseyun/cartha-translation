  source_fidelity: Redarea urmează fidel structura și sensul textului grec. „Tot așa”, construcția idiomatică „nu este voia Tatălui”, „vreunul dintre acești micuți” și „să piară” sunt alegeri potrivite. Nota păstrează în mod util alternativa contextuală pentru ἀπόληται.
