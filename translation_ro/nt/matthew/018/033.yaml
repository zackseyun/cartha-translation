source:
  edition: SBLGNT
  text: οὐκ ἔδει καὶ σὲ ἐλεῆσαι τὸν σύνδουλόν σου, ὡς κἀγὼ σὲ ἠλέησα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/033.yaml
  text: Should you not also have had mercy on your fellow servant[a], as I also had mercy on you?
translation:
  language: ro
  text: Nu trebuia oare să ai și tu milă de tovarășul tău de robie[a], așa cum și eu am avut milă de tine?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gr. σύνδουλος: un rob aflat sub același stăpân; sau „tovarășul tău de slujbă”.'
    reason: Clarifică sensul de „co-rob” al termenului grec și consemnează o alternativă tradițională mai puțin explicită privind robia.
lexical_decisions:
- source_word: οὐκ ἔδει
  choice: Nu trebuia oare să
  rationale: Redă obligația morală exprimată de imperfectul impersonal ἔδει și păstrează forța mustrătoare a întrebării retorice într-o română firească.
- source_word: καὶ σὲ
  choice: și tu
  rationale: καί marchează corespondența dintre mila primită și cea care trebuia arătată; pronumele accentuat „tu” redă contrastul implicit.
- source_word: ἐλεῆσαι / ἠλέησα
  choice: să ai milă / am avut milă
  rationale: Aceeași expresie românească în ambele propoziții păstrează repetiția verbului ἐλεέω și sensul său etic și teologic.
- source_word: τὸν σύνδουλόν σου
  choice: tovarășul tău de robie
  rationale: Redarea exprimă atât statutul comun indicat de prefixul συν-, cât și condiția de robi aflați sub același stăpân, fără a sugera simpla colegialitate profesională.
- source_word: ὡς κἀγὼ
  choice: așa cum am avut și eu
  rationale: „Așa cum” introduce limpede comparația, iar „și eu” păstrează valoarea lui κἀγώ și paralelismul cu „și tu”.
theological_decisions:
- issue: Redarea termenului din familia δοῦλος în σύνδουλος
  choice: tovarășul tău de robie
  alternative: semenul tău rob; cel împreună-rob cu tine; slujitorul asemenea ție
  rationale: Contextul parabolei presupune persoane aflate sub autoritatea aceluiași stăpân. Formularea aleasă păstrează relația de robie și ideea statutului comun, evitând atenuarea termenului la simplul „slujitor”.
translation_notes:
  register: Română standard modernă, cu ton demn și mustrător. Construcția „Nu trebuia oare...?” este naturală și păstrează întrebarea retorică; paralelismul „și tu / și eu” reflectă structura greacă.
