  source_fidelity: Textul redă corect întrebarea retorică de obligație morală din οὐκ ἔδει, paralelismul „și tu / și eu”, repetiția lui ἐλεέω și comparația introdusă de ὡς. „Tovarășul tău de robie” transmite statutul comun implicat de σύνδουλος, deși este ușor mai livresc decât formularea obișnuită în româna actuală.
  naturalness: „Nu trebuia oare să ai ... milă de ...?” este română standard firească și potrivită registrului. Reașezarea lui „și eu” înaintea verbului face paralelismul comparativ mai transparent și mai apropiat de κἀγώ.
  terminology: '„Robie” păstrează relația de dependență prezentă în familia δοῦλος și nu o reduce la simplă slujire. Nota trebuie formulată mai idiomatic: expresia propusă ca „literală” („cel împreună-rob cu tine”) nu este română naturală și nu trebuie prezentată drept redare literală utilizabilă.'
