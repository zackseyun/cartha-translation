  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ σύνδουλος ⸀αὐτοῦ παρεκάλει αὐτὸν λέγων· Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/029.yaml
  text: So his fellow servant fell down and pleaded with him[a], saying, ‘Be patient with me, and I will repay you.’
translation:
  language: ro
  text: 'Atunci, tovarășul lui de sclavie a căzut la pământ și îl implora, spunând: „Ai răbdare cu mine și îți voi plăti.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύνδουλος
  choice: cel care era sclav împreună cu el
  rationale: Redă explicit ideea unei persoane aflate în sclavie sub același stăpân, fără a atenua statutul social exprimat de termenul grec. Formularea este mai firească în româna actuală decât un calc precum „co-sclav”.
- source_word: πεσών
  choice: a căzut la pământ
  rationale: Păstrează gestul fizic de smerire și implorare, fără a adăuga un obiect sau un loc care nu este exprimat explicit în greacă.
- source_word: οὖν
  choice: Atunci
  rationale: În acest context narativ, introduce firesc reacția următoare și păstrează valoarea secvențială-inferențială a particulei.
- source_word: παρεκάλει
  choice: îl implora
  rationale: Imperfectul indică o rugăminte stăruitoare, aflată în desfășurare; „implora” redă intensitatea contextului fără formulare arhaică.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Ai răbdare cu mine
  rationale: Este echivalentul românesc natural al idiomului grec prin care se cere îngăduință și amânare.
- source_word: ἀποδώσω
  choice: îți voi plăti
  rationale: Contextul este cel al unei datorii, iar verbul românesc „a plăti” exprimă clar achitarea sumei datorate.
theological_decisions:
- issue: Redarea limbajului referitor la sclavie din σύνδουλος
  choice: cel care era sclav împreună cu el
  alternative: tovarășul său de slujire; celălalt slujitor
  rationale: Termenul indică nu doar un coleg de serviciu, ci o persoană aflată sub același stăpân. Redarea păstrează realitatea socială și raportul de autoritate important în parabolă, fără a introduce o interpretare confesională.
translation_notes:
  register: Română standard modernă, clară și demnă. Construcția explicativă pentru σύνδουλος evită atât eufemizarea prin „slujitor”, cât și un neologism rigid. Imperfectul „implora” păstrează aspectul verbal al textului grec.
