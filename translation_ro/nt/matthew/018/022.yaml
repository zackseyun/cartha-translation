source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Οὐ λέγω σοι ἕως ἑπτάκις ἀλλὰ ἕως ἑβδομηκοντάκις ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/022.yaml
  text: Jesus says to him[a], “I do not say to you, up to seven times, but up to seventy times seven.
translation:
  language: ro
  text: 'Isus îi spune: „Nu-ți spun: până la șapte ori, ci până la șaptezeci și șapte de ori.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „de șaptezeci de ori câte șapte”.'
    reason: Lectură alternativă a expresiei grecești ἑβδομηκοντάκις ἑπτά.
lexical_decisions:
- source_word: λέγει
  choice: spune
  rationale: Păstrează prezentul istoric grecesc, firesc și viu și în narațiunea românească.
- source_word: αὐτῷ
  choice: îi
  rationale: Redă obiectul indirect pronominal fără a-l înlocui explicit cu numele lui Petru.
- source_word: Οὐ λέγω σοι
  choice: Nu-ți spun
  rationale: Formulare românească directă și naturală, care păstrează prezentul și pronumele la persoana a doua.
- source_word: ἕως
  choice: până la
  rationale: În context numeric, exprimă limita propusă fără a adăuga o interpretare.
- source_word: ἑπτάκις
  choice: de șapte ori
  rationale: Redă limpede adverbul de frecvență.
- source_word: ἀλλὰ
  choice: ci
  rationale: După negație, „ci” exprimă natural în română contrastul corectiv.
- source_word: ἑβδομηκοντάκις ἑπτά
  choice: de șaptezeci și șapte de ori
  rationale: Este o interpretare directă și bine atestată a expresiei grecești; ambiguitatea reală este păstrată prin nota cu alternativa „de șaptezeci de ori câte șapte”.
theological_decisions:
- issue: Expresia numerică ambiguă din învățătura lui Isus despre iertare
  choice: de șaptezeci și șapte de ori
  alternative: de șaptezeci de ori câte șapte
  rationale: Sintagma grecească poate susține ambele redări. Textul principal adoptă lectura „șaptezeci și șapte”, iar nota păstrează transparent alternativa tradițională, fără a transforma afirmația într-o explicație doctrinară.
translation_notes:
  register: Română standard modernă, concisă și demnă. Prezentul istoric este păstrat; construcția „Nu-ți spun până la...” urmează îndeaproape formularea greacă, rămânând inteligibilă în română.
