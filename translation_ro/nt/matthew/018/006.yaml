id: MAT.18.6
reference: Matthew 18:6
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ὃς δ’ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς ⸀εἰς τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/006.yaml
  text: But whoever causes one of these little ones who believe in me to stumble[c][b][a], it is better for him that a donkey millstone be hung around his neck and that he be drowned in the open sea.
translation:
  language: ro
  text: Dar cine îl face pe unul dintre acești micuți care cred în Mine să cadă[a], ar fi mai bine pentru el să i se atârne de gât o piatră de moară învârtită de un măgar[b] și să fie înecat în largul mării[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „îl face să păcătuiască” ori „îl face să se îndepărteze”. Verbul grecesc poate desemna provocarea unei căderi, a păcatului sau a abandonării credinței.'
    reason: lexical_alternative
  - marker: b
    text: 'Literal: „o piatră de moară măgărească”, adică o piatră mare de moară, învârtită de un măgar.'
    reason: cultural_note
  - marker: c
    text: 'Sau: „în marea adâncă”. Expresia grecească se referă mai precis la largul mării.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: îl face să cadă
  rationale: Păstrează metafora împiedicării și permite sensul spiritual mai larg — a duce la păcat, la cădere sau la îndepărtarea de credință — fără a-l restrânge în textul principal.
- source_word: μικρῶν τούτων
  choice: acești micuți
  rationale: Redă caracterul diminutival și afectiv al expresiei, fără a limita referința exclusiv la copii; calificarea următoare îi identifică drept persoane care cred în Isus.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: care cred în Mine
  rationale: Este redarea directă și firească a construcției πιστεύω εἰς cu obiect personal.
- source_word: συμφέρει αὐτῷ
  choice: ar fi mai bine pentru el
  rationale: Exprimă idiomatic avantajul comparativ șocant indicat de verb în contextul avertizării.
- source_word: μύλος ὀνικὸς
  choice: o piatră de moară învârtită de un măgar
  rationale: Face explicit faptul că este piatra mare a unei mori acționate de un măgar, nu mica râșniță manuală.
- source_word: εἰς τὸν τράχηλον αὐτοῦ
  choice: să i se atârne de gât
  rationale: Redă natural în română imaginea obiectului greu suspendat la gât.
- source_word: καταποντισθῇ
  choice: să fie înecat
  rationale: Verbul pasiv descrie cufundarea în apă cu rezultatul morții; formularea este limpede și păstrează gravitatea imaginii.
- source_word: ἐν τῷ πελάγει τῆς θαλάσσης
  choice: în largul mării
  rationale: πέλαγος indică întinderea mării deschise, departe de țărm; «în largul mării» este precis și idiomatic.
theological_decisions:
- issue: Sfera expresiei «acești micuți»
  choice: Referința rămâne suficient de largă pentru a-i include pe credincioșii smeriți sau vulnerabili, fără a exclude copilul din context.
  alternative: «acești copilași», cu referire exclusivă la copii
  rationale: Copilul din context oferă imaginea imediată, însă participiul «care cred în Mine» permite o aplicare mai largă la discipoli. Traducerea nu soluționează restrictiv această tensiune.
translation_notes:
  register: Română standard modernă, demnă și directă. «Micuți» păstrează deschiderea referențială a grecescului, iar explicațiile lexicale și culturale sunt mutate în note pentru ca textul principal să rămână fluent.
