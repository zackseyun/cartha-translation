id: MAT.18.30
reference: Matthew 18:30
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἤθελεν, ἀλλὰ ἀπελθὼν ἔβαλεν αὐτὸν εἰς φυλακὴν ἕως ⸀οὗ ἀποδῷ τὸ ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/030.yaml
  text: But he was not willing[a]; instead[c][b], he went away and threw him into prison until he should pay what was owed.
translation:
  language: ro
  text: Dar el n-a vrut[a], ci s-a dus și l-a aruncat în închisoare[b] până avea să plătească ceea ce datora[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „a refuzat”; grecește, literal, „n-a vrut”.
    reason: lexical_alternative
  - marker: b
    text: Sau „l-a băgat în închisoare”; verbul grecesc este mai puternic, literal „l-a aruncat în închisoare”.
    reason: lexical_alternative
  - marker: c
    text: Sau „suma datorată” ori „datoria”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Dar el
  rationale: Articolul are valoare substantivală și îl reia pe primul slujitor, iar δέ introduce contrastul; pronumele explicit este firesc în română.
- source_word: οὐκ ἤθελεν
  choice: n-a vrut
  rationale: Redă direct și natural valoarea volitivă a lui θέλω, fără a o întări interpretativ până la „a refuzat”.
- source_word: ἀλλὰ
  choice: ci
  rationale: După o negație, „ci” exprimă în română contrastul puternic și alternativa de acțiune introduse de ἀλλά.
- source_word: ἀπελθὼν
  choice: s-a dus
  rationale: Participiul aorist este redat printr-un verb coordonat, păstrând succesiunea acțiunilor într-o formulare românească naturală.
- source_word: ἔβαλεν αὐτὸν εἰς φυλακήν
  choice: l-a aruncat în închisoare
  rationale: „A aruncat” păstrează forța lui βάλλω și asprimea gestului, spre deosebire de formularea mai neutră „l-a băgat”.
- source_word: ἕως οὗ ἀποδῷ
  choice: până avea să plătească
  rationale: Construcția exprimă limita temporală a detenției și plata anticipată; „avea să” păstrează orientarea prospectivă fără a sugera o obligație morală prin „trebuia”.
- source_word: τὸ ὀφειλόμενον
  choice: ceea ce datora
  rationale: Participiul substantivizat înseamnă literal ceea ce era datorat; formularea este exactă și firească, fără a restrânge expresia la un substantiv interpretativ.
theological_decisions: []
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formularea păstrează contrastul puternic, duritatea acțiunii și caracterul prospectiv al plății, evitând atât arhaismele, cât și explicitările doctrinare.
