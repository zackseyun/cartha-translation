id: MAT.18.4
reference: Matthew 18:4
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὅστις οὖν ταπεινώσει ἑαυτὸν ὡς τὸ παιδίον τοῦτο, οὗτός ἐστιν ὁ μείζων ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/004.yaml
  text: Therefore, whoever humbles himself like this child, he is the greatest in the kingdom of heaven.
translation:
  language: ro
  text: Așadar, oricine se va smeri asemenea acestui copil, acela este cel mai mare în Împărăția cerurilor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις οὖν
  choice: Așadar, oricine
  rationale: Redă atât legătura concluzivă οὖν, cât și caracterul general al pronumelui ὅστις într-o formulare românească firească.
- source_word: ταπεινώσει ἑαυτόν
  choice: se va smeri
  rationale: Păstrează forma de viitor și sensul reflexiv al expresiei grecești, referitor la asumarea voită a unei poziții smerite.
- source_word: ὡς τὸ παιδίον τοῦτο
  choice: asemenea acestui copil
  rationale: Redă comparația explicită ὡς și referința demonstrativă la copilul aflat în centrul scenei.
- source_word: οὗτός ἐστιν ὁ μείζων
  choice: acela este cel mai mare
  rationale: Păstrează reluarea emfatică prin οὗτος; superlativul contextual este exprimat natural în română prin «cel mai mare».
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: în Împărăția cerurilor
  rationale: Urmează expresia caracteristică Evangheliei după Matei și uzul biblic românesc consacrat, fără a-i modifica referința teologică.
theological_decisions:
- issue: Natura asemănării cu copilul
  choice: se va smeri asemenea acestui copil
  alternative: va deveni smerit ca acest copil
  rationale: Textul explicitează smerirea de sine, nu atribuie copilului toate calitățile asociate în mod obișnuit copilăriei; traducerea evită extinderea comparației.
- issue: Reluarea emfatică a subiectului
  choice: acela este cel mai mare
  alternative: este cel mai mare
  rationale: Pronumele οὗτος este păstrat pentru a reda accentul construcției grecești și pentru a conserva formularea explicită din sursă.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. «Așadar» oferă o tranziție concluzivă naturală, iar «acela» conservă emfaza originalului fără a suna excesiv de rigid.
