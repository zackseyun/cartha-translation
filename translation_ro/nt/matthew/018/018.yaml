id: MAT.18.18
reference: Matthew 18:18
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅσα ⸀ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ⸀ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ⸁ἐν οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/018.yaml
  text: Truly I tell you[a], whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.
translation:
  language: ro
  text: 'Adevărat vă spun: orice veți lega pe pământ va fi fost legat în cer, iar orice veți dezlega pe pământ va fi fost dezlegat în cer.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, în formularea tradițională: „va fi legat în cer ... va fi dezlegat în cer”. Construcția grecească poate fi redată astfel, însă traducerea din text reflectă verbul la viitor împreună cu participiul perfect, care poate indica o stare deja stabilită în cer.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Adevărat
  rationale: Introduce solemn și autoritativ afirmația; „Adevărat” redă limpede funcția formulei în româna modernă, fără opacitatea posibilă a lui „Amin” în discurs direct.
- source_word: λέγω ὑμῖν
  choice: vă spun
  rationale: Formulă firească de adresare directă, care păstrează autoritatea și pluralul pronumelui ὑμῖν.
- source_word: ὅσα ἐὰν
  choice: orice
  rationale: Redă valoarea generală și nedefinită a construcției, într-o formulare românească naturală.
- source_word: δήσητε
  choice: veți lega
  rationale: Păstrează metafora de bază a verbului δέω și nu restrânge prematur sensul la „a interzice” sau la o singură interpretare juridică.
- source_word: ἐπὶ τῆς γῆς
  choice: pe pământ
  rationale: Echivalentul românesc firesc al expresiei spațiale, în contrast cu sfera cerească.
- source_word: ἔσται δεδεμένα
  choice: va fi fost legat
  rationale: Viitorul verbului εἰμί împreună cu participiul perfect pasiv este redat prin viitorul anterior, păstrând ideea unei stări rezultate dintr-o acțiune anterioară.
- source_word: ἐν οὐρανῷ
  choice: în cer
  rationale: Redă idiomatic singularul grecesc ca desemnare a sferei cerești.
- source_word: λύσητε
  choice: veți dezlega
  rationale: Păstrează opoziția metaforică față de „a lega” și evită limitarea sensului la „a permite” ori „a elibera”.
- source_word: ἔσται λελυμένα
  choice: va fi fost dezlegat
  rationale: Redă paralel construcția perifrastică prin viitorul anterior pasiv, reflectând acțiunea anterioară și starea ei rezultată.
theological_decisions:
- issue: Forța temporală și teologică a formulei despre legare și dezlegare
  choice: „va fi fost legat/dezlegat în cer”
  alternative: „va fi legat/dezlegat în cer”
  rationale: Construcția greacă ἔσται plus participiu perfect pasiv poate indica o stare viitoare rezultată dintr-o acțiune deja împlinită. Viitorul anterior păstrează tensiunea dintre hotărârea de pe pământ și realitatea cerească, fără a impune teoria că cerul doar ratifică ulterior decizia omenească.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. S-a păstrat perechea tradițională și metaforică „a lega/a dezlega”, iar viitorul anterior redă forma greacă fără a elimina ambiguitatea ei legitimă.
