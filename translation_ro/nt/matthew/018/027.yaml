  terminology: „Stăpân”, „sclav”, „milă”, „a da drumul” și „a ierta datoria” sunt alegeri consecvente și adecvate contextului. Nota a oferă alternativa mai atenuată „slujitor” fără a diminua termenul din text. Nota b explică precis diferența dintre „datorie” și sensul lexical mai specific al lui δάνειον.
