source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ κύριος τοῦ δούλου ἐκείνου ἀπέλυσεν αὐτόν, καὶ τὸ δάνειον ἀφῆκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/027.yaml
  text: Then the master of that servant[a], moved with compassion[b], released him and forgave him the debt.
translation:
  language: ro
  text: Atunci, cuprins de milă, stăpânul acelui sclav[a] i-a dat drumul și i-a iertat datoria[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „slujitor”; termenul grec indică mai precis un sclav.'
    reason: lexical_alternative
  - marker: b
    text: Termenul grec denumește mai precis un împrumut sau ceea ce fusese dat cu împrumut.
    reason: lexical_precision
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: cuprins de milă
  rationale: Redă firesc în româna actuală compasiunea profundă exprimată de verb, fără a reduce sensul la o simplă constatare intelectuală.
- source_word: δὲ
  choice: Atunci
  rationale: În context, particula marchează înaintarea narațiunii; „Atunci” leagă natural reacția stăpânului de rugămintea anterioară.
- source_word: κύριος
  choice: stăpânul
  rationale: Referentul imediat este stăpânul omenesc din parabolă. Forma cu literă mică evită transformarea termenului într-un titlu divin direct.
- source_word: δοῦλου
  choice: sclav
  rationale: Termenul grec indică statutul de persoană aflată sub autoritatea și în proprietatea unui stăpân; această asimetrie este relevantă în parabolă.
- source_word: ἀπέλυσεν αὐτόν
  choice: i-a dat drumul
  rationale: Formularea românească este naturală și exprimă eliberarea lui din situația imediată, fără a preciza mai mult decât textul.
- source_word: τὸ δάνειον
  choice: datoria
  rationale: Deși substantivul grec denumește mai precis un împrumut sau lucrul împrumutat, în acest context desemnează obligația financiară anulată; „datoria” este formularea românească firească, iar precizia lexicală este păstrată în notă.
- source_word: ἀφῆκεν αὐτῷ
  choice: i-a iertat
  rationale: Verbul poate însemna a ierta, a remite sau a anula. Împreună cu „datoria”, expresia românească redă clar remiterea obligației și păstrează rezonanța iertării din Evanghelia după Matei.
theological_decisions:
- issue: Posibila interpretare a lui κύριος ca titlu divin
  choice: „stăpânul”, cu literă mică, pentru personajul omenesc din parabolă
  alternative: „Domnul”
  rationale: Textul îl desemnează direct pe stăpânul sclavului. Parabola poate avea o semnificație teologică, dar traducerea nu trebuie să transforme referentul narativ într-un titlu divin explicit.
- issue: Redarea statutului exprimat de δοῦλος
  choice: „sclav”
  alternative: „slujitor”
  rationale: Relația de autoritate și dependență juridică este importantă în scena datoriei și a eliberării; „slujitor” ar putea estompa această realitate socială.
- issue: Relația dintre sensul financiar și rezonanța iertării în ἀφῆκεν
  choice: „i-a iertat datoria”
  alternative: „i-a anulat împrumutul”
  rationale: Formularea aleasă exprimă limpede remiterea financiară și păstrează vocabularul iertării, fără a transforma în mod direct acțiunea din parabolă într-o afirmație doctrinară.
translation_notes:
  register: Română standard modernă, cu formulare narativă clară și demnă. „Cuprins de milă” evită rigiditatea unei construcții participiale literale, iar „i-a dat drumul” este idiomatic fără a banaliza registrul.
