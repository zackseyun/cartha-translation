source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ὥρᾳ προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ λέγοντες· Τίς ἄρα μείζων ἐστὶν ἐν τῇ βασιλείᾳ τῶν οὐρανῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/001.yaml
  text: At that time the disciples came to Jesus, saying, “Who then is greater in the kingdom of heaven?”
translation:
  language: ro
  text: 'În ceasul acela, ucenicii s-au apropiat de Isus și au întrebat: „Cine este, așadar, mai mare în Împărăția cerurilor?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: În ceasul acela
  rationale: Redă fidel expresia temporală grecească într-un registru biblic demn și ușor de înțeles.
- source_word: προσῆλθον ... τῷ Ἰησοῦ
  choice: s-au apropiat de Isus
  rationale: Păstrează sensul direct al verbului προσέρχομαι și complementul în dativ.
- source_word: λέγοντες
  choice: și au întrebat
  rationale: În acest context, participiul «spunând» introduce o întrebare directă; formularea românească aleasă este mai firească fără a schimba actul de vorbire.
- source_word: Τίς ἄρα
  choice: Cine este, așadar
  rationale: «Așadar» păstrează valoarea inferențială sau deliberativă a particulei ἄρα, fără a o suprainterpreta.
- source_word: μείζων
  choice: mai mare
  rationale: Păstrează comparativul grec, în loc să îl transforme în superlativul «cel mai mare».
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Împărăția cerurilor
  rationale: Echivalent românesc consacrat și fidel pentru expresia caracteristică lui Matei.
theological_decisions:
- issue: Forța comparativului μείζων
  choice: mai mare
  alternative: cel mai mare
  rationale: Textul grec are forma comparativă. Deși întrebarea poate avea pragmatic sens superlativ, traducerea păstrează forma și tensiunea originalului.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. Topica este naturală, iar comparativul aparent neobișnuit este păstrat intenționat pe baza textului grec.
