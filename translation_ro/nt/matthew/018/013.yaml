id: MAT.18.13
reference: Matthew 18:13
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἐὰν γένηται εὑρεῖν αὐτό, ἀμὴν λέγω ὑμῖν ὅτι χαίρει ἐπ’ αὐτῷ μᾶλλον ἢ ἐπὶ τοῖς ἐνενήκοντα ἐννέα τοῖς μὴ πεπλανημένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/013.yaml
  text: And if he happens to find it[a], truly I tell you[b], he rejoices over it more than over the ninety-nine that have not gone astray.
translation:
  language: ro
  text: Și, dacă se întâmplă să o găsească[a], adevărat vă spun că se bucură de ea mai mult decât de cele nouăzeci și nouă care nu s-au rătăcit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, mai formal: „dacă se va întâmpla să o găsească”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Și
  rationale: Păstrează legătura simplă cu desfășurarea ilustrației lui Isus.
- source_word: ἐὰν γένηται εὑρεῖν αὐτό
  choice: dacă se întâmplă să o găsească
  rationale: Redă atât caracterul condițional, cât și nuanța explicită de eventualitate a construcției cu γένηται, într-o formulare românească firească.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: adevărat vă spun
  rationale: Formulă solemnă, clară și consacrată în româna biblică modernă, care păstrează accentul afirmației.
- source_word: χαίρει ἐπ’ αὐτῷ
  choice: se bucură de ea
  rationale: În română, „a se bucura de” exprimă firesc obiectul bucuriei și păstrează forța afectivă a verbului χαίρω.
- source_word: μᾶλλον ἢ
  choice: mai mult decât
  rationale: Redă direct comparația, fără a sugera excluderea celor nouăzeci și nouă.
- source_word: τοῖς ἐνενήκοντα ἐννέα
  choice: cele nouăzeci și nouă
  rationale: Substantivul „oi” rămâne implicit, ca în greacă, iar genul feminin îl face limpede din context în română.
- source_word: τοῖς μὴ πεπλανημένοις
  choice: care nu s-au rătăcit
  rationale: Redă starea rezultată exprimată de participiul perfect și se potrivește natural imaginii oilor care nu au părăsit drumul.
theological_decisions:
- issue: Forța comparației dintre bucuria pentru oaia găsită și bucuria pentru cele nouăzeci și nouă
  choice: Se afirmă direct că păstorul se bucură mai mult de cea găsită decât de cele care nu s-au rătăcit.
  alternative: Atenuarea comparației pentru a evita impresia unei preferințe.
  rationale: Construcția grecească μᾶλλον ἢ exprimă o comparație reală. Traducerea păstrează tensiunea afirmației fără a deduce că păstorului nu îi pasă de cele nouăzeci și nouă sau că acestea au o valoare mai mică.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formularea păstrează ordinea și caracterul condițional al textului grec, evitând atât arhaismele inutile, cât și explicitarea substantivului „oi”, care este doar subînțeles aici.
