id: MAT.18.3
reference: Matthew 18:3
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/003.yaml
  text: And he said[a], “Truly I say to you, unless you turn and become like children[c][b], you will certainly not enter the kingdom of heaven.”
translation:
  language: ro
  text: 'Și a zis: „Adevărat vă spun: dacă nu vă întoarceți[a] și nu deveniți asemenea copiilor, nicidecum nu veți intra[b] în Împărăția cerurilor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „dacă nu sunteți întorși”. Forma grecească poate avea sens intranzitiv sau pasiv; în tradiția mai veche a fost redată și prin „dacă nu vă convertiți”.'
    reason: alternative_reading
  - marker: b
    text: 'Sau: „nu veți intra niciodată”. În greacă, negația este categorică și accentuată.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Adevărat
  rationale: Redă în româna actuală formula solemnă și autoritativă care introduce spusele lui Isus; „Amin” ar fi posibil, dar mai puțin transparent în acest context.
- source_word: στραφῆτε
  choice: vă întoarceți
  rationale: Păstrează ideea unei schimbări hotărâte de orientare și permite sensul intranzitiv al formei pasive, fără a introduce termenul teologic tehnic „vă convertiți”.
- source_word: γένησθε
  choice: deveniți
  rationale: Redă direct schimbarea de stare exprimată de γίνομαι și păstrează coordonarea cu verbul precedent.
- source_word: ὡς τὰ παιδία
  choice: asemenea copiilor
  rationale: Este o formulare românească naturală, care păstrează comparația concretă cu copiii fără a adăuga însușiri precum inocența sau smerenia.
- source_word: οὐ μὴ εἰσέλθητε
  choice: nicidecum nu veți intra
  rationale: Construcția οὐ μή cu conjunctivul aorist exprimă o negație categorică; „nicidecum” îi păstrează accentul într-un registru demn și inteligibil.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: Împărăția cerurilor
  rationale: Redă fidel expresia caracteristică lui Matei și corespunde uzului biblic românesc consacrat.
theological_decisions:
- issue: Sensul limbajului asemănător convertirii din στραφῆτε
  choice: „vă întoarceți”, fără termenul tehnic „vă convertiți”
  alternative: „sunteți întorși” sau „vă convertiți”
  rationale: Greaca permite nuanța intranzitivă ori pasivă și cere o reorientare decisivă, dar nu impune terminologia teologică tehnică ulterioară.
- issue: Referentul și calitățile asociate copiilor
  choice: comparația concretă „asemenea copiilor”
  alternative: „asemenea acestor copii” sau o explicitare precum „nevinovați/smeriți ca niște copii”
  rationale: Articolul grecesc poate desemna generic clasa copiilor și poate evoca acel copil din context, însă versetul nu precizează aici care însușire a copiilor este avută în vedere; traducerea păstrează această deschidere interpretativă.
translation_notes:
  register: Română standard modernă, cu exprimare clară și demnă. „Adevărat vă spun” și „Împărăția cerurilor” păstrează rezonanța biblică firească, iar sintaxa rămâne accesibilă cititorului contemporan.
