source:
  edition: SBLGNT
  text: Πάλιν ⸀ἀμὴν λέγω ὑμῖν ὅτι ἐὰν δύο ⸂συμφωνήσωσιν ἐξ ὑμῶν⸃ ἐπὶ τῆς γῆς περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/019.yaml
  text: Again[a], truly I tell you, if two of you agree on earth about any matter they ask for[c][b], it will be done for them by my Father in heaven.
translation:
  language: ro
  text: 'Din nou, adevărat vă spun: dacă doi dintre voi ajung la un acord[a] pe pământ cu privire la orice lucru pe care îl vor cere[b], li se va împlini de la Tatăl meu, care este în ceruri.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „sunt de acord” sau „ajung la aceeași înțelegere”.
    reason: lexical_alternative
  - marker: b
    text: În context, această afirmație urmează învățăturii lui Isus despre autoritatea și disciplina comunității (18:15–18), deși formularea versetului vorbește în sens larg despre cereri făcute de comun acord.
    reason: cross_reference
  - marker: c
    text: 'Greacă: „în ceruri”; pluralul este păstrat în traducere.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Din nou
  rationale: Marchează reluarea sau adăugarea solemnă la învățătura precedentă și păstrează firesc desfășurarea discursului.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: adevărat vă spun
  rationale: Redă în româna actuală formula solemnă și emfatică a lui Isus, fără transliterarea mai puțin transparentă „amin”.
- source_word: ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν
  choice: dacă doi dintre voi cad de acord
  rationale: συμφωνέω exprimă aici acordul dintre persoane; „cad de acord” este natural, dinamic și păstrează ideea ajungerii la un acord, iar „dintre voi” redă ἐξ ὑμῶν.
- source_word: ἐπὶ τῆς γῆς
  choice: pe pământ
  rationale: Echivalent românesc direct, care păstrează contrastul cu Tatăl aflat „în ceruri”.
- source_word: περὶ παντὸς πράγματος
  choice: cu privire la orice lucru
  rationale: πρᾶγμα are sens larg, de lucru, chestiune sau situație; formularea păstrează această amploare fără a restrânge referința la un anumit tip de cerere.
- source_word: οὗ ἐὰν αἰτήσωνται
  choice: pe care îl vor cere
  rationale: Redă construcția relativă nedefinită și sensul lui αἰτέω de a cere sau solicita, fără a introduce explicit termenul „rugăciune”, absent din verset.
- source_word: γενήσεται αὐτοῖς
  choice: acesta se va face pentru ei
  rationale: Păstrează sensul larg al lui γίνομαι și relația cu lucrul cerut, evitând introducerea unui verb mai specific precum „a da”.
- source_word: παρὰ τοῦ πατρός μου
  choice: de către Tatăl meu
  rationale: În legătură cu „se va face”, παρά cu genitivul poate indica sursa sau agentul; formularea românească face limpede acțiunea Tatălui fără a schimba rezultatul promis.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: care este în ceruri
  rationale: Păstrează pluralul grecesc οὐρανοῖς, o formulare firească și consacrată în registrul biblic românesc.
theological_decisions:
- issue: Întinderea promisiunii în context
  choice: Afirmația este redată direct, fără calificări adăugate despre rugăciune, disciplina comunității sau voia divină.
  alternative: Limitarea explicită la hotărârile disciplinare ale comunității ori extinderea ei într-o promisiune necondiționată pentru orice rugăciune.
  rationale: Contextul imediat privește relațiile și autoritatea comunității (18:15–18), iar αἰτέω indică o cerere, probabil adresată lui Dumnezeu. Totuși, versetul nu formulează explicit nici restrângerea, nici extinderea doctrinară; traducerea păstrează amploarea și tensiunea textului.
- issue: Sursa sau agentul împlinirii
  choice: „de către Tatăl meu”
  alternative: „din partea Tatălui meu”
  rationale: παρά cu genitivul permite nuanța de sursă, dar construcția cu γενήσεται susține și exprimarea agentului. Varianta aleasă este mai limpede în română, fără a exclude conceptual faptul că rezultatul vine de la Tatăl.
translation_notes:
  register: Română standard modernă, clară și demnă. Formula solemnă „adevărat vă spun” și expresia biblică firească „în ceruri” păstrează registrul scripturistic, iar restul construcției evită arhaismele și adaosurile confesionale.
