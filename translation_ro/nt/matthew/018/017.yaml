    rationale: În uzul românesc modern, „păgân” evocă în mod normal adeziunea la o religie păgână. Termenul grec desemnează aici, în primul rând, reprezentantul celor dintre neamuri, adică o persoană din afara comunității iudaice; o redare mai neutră păstrează mai bine domeniul semantic și ambiguitatea contextuală.
