  source_fidelity: 'Revizuire necesară: „păgânul” este tradițional, dar poate restrânge sau intensifica pe ὁ ἐθνικός prin asocierea sa religioasă. „Cel dintre neamuri” redă mai direct categoria etnică/socială din greacă, fără a suprainterpreta. Restul structurii și sensului sunt fidele textului sursă.'
  naturalness: Construcția „să asculte de ei/de adunare” este română standard firească în acest context și redă nu doar auzirea, ci luarea în seamă. „Cel dintre neamuri” are coloratură biblică ușoară, însă este inteligibil și potrivit registrului pasajului.
  terminology: „Adunare” redă bine ἐκκλησία, cu „biserică” și „comunitate” păstrate ca alternative în notă. „Vameș” este termenul consacrat și precis pentru τελώνης. Înlocuirea lui „păgân” cu „cel dintre neamuri” evită o nuanță religioasă suplimentară necerută de ἐθνικός.
  issues:
