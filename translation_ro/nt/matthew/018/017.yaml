  to: Dar, dacă refuză să asculte de ei, spune adunării[a]. Iar dacă refuză să asculte și de adunare, să fie pentru tine ca cel dintre neamuri și vameșul.
  rationale: Textul este păstrat cât mai aproape de proiectul dat. Ajustarea principală înlocuiește „păgânul” cu „cel dintre neamuri”, pentru a reda ἐθνικός fără nuanța religioasă mai specifică a lui „păgân”. „A asculta de” este folosit consecvent pentru παρακούω și exprimă refuzul de a da ascultare, nu simpla incapacitate de a auzi.
