id: MAT.18.17
reference: Matthew 18:17
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐὰν δὲ παρακούσῃ αὐτῶν, εἰπὸν τῇ ἐκκλησίᾳ· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/017.yaml
  text: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
translation:
  language: ro
  text: Dar, dacă refuză să asculte de ei, spune adunării[a]. Iar dacă refuză să asculte și de adunare, să fie pentru tine ca cel dintre neamuri și vameșul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau „bisericii” ori „comunității” (greacă: ekklēsia).'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσῃ
  choice: refuză să-i asculte / refuză să asculte
  rationale: În contextul îndreptării comunitare, verbul indică refuzul de a da ascultare, nu simpla neauzire. Formularea redă nuanța voită fără a o întări până la „nu se supune”.
- source_word: εἰπὸν
  choice: spune
  rationale: Imperativul introduce aducerea situației la cunoștința comunității. În română, „spune adunării” este firesc, iar obiectul rămâne implicit, ca în greacă.
- source_word: ἐκκλησίᾳ / ἐκκλησίας
  choice: adunare
  rationale: „Adunare” redă comunitatea convocată sau strânsă și evită impunerea unor conotații instituționale ulterioare; alternativa tradițională „biserică” este păstrată în notă.
- source_word: ἔστω σοι
  choice: să fie pentru tine
  rationale: Păstrează imperativul și dativul σοι într-o construcție românească inteligibilă, fără a transforma expresia în formularea mai interpretativă „să-l consideri”.
- source_word: ὥσπερ
  choice: ca
  rationale: Redă direct și natural comparația.
- source_word: ὁ ἐθνικὸς
  choice: păgânul
  rationale: În acest context iudaic, termenul desemnează reprezentativ o persoană din afara comunității legământului. „Păgânul” este forma românească tradițională și inteligibilă; „omul dintre neamuri” ar fi mai greoi aici.
- source_word: ὁ τελώνης
  choice: vameșul
  rationale: „Vameș” este echivalentul românesc consacrat pentru colectorul de taxe din contextul antic, iar articolul păstrează caracterul reprezentativ al categoriei.
theological_decisions:
- issue: Redarea lui ἐκκλησία în contextul disciplinar din Matei
  choice: adunare
  alternative: biserică; comunitate
  rationale: „Adunare” păstrează sensul comunitar de bază fără a introduce automat o structură confesională sau instituțională ulterioară. „Biserică”, o redare tradițională și contextual posibilă, este indicată în notă.
- issue: Forța comparației cu păgânul și vameșul
  choice: să fie pentru tine ca păgânul și vameșul
  alternative: să-l consideri ca pe un păgân și un vameș; să-l tratezi ca pe un om din afară
  rationale: Formularea păstrează comparația și imperativul din text, fără a le transforma într-o procedură explicită sau într-o doctrină mai dezvoltată a excluderii decât afirmă versetul.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. Repetiția lui „refuză să asculte” urmărește repetiția greacă, iar „să fie pentru tine” păstrează deliberat formularea mai puțin interpretativă a originalului.
