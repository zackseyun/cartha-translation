source:
  edition: SBLGNT
  text: οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/020.yaml
  text: For where two or three are gathered in my name[a], there I am in their midst.
translation:
  language: ro
  text: Căci unde sunt adunați doi sau trei în numele meu, acolo sunt și eu în mijlocul lor[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „între ei”.'
    reason: Alternativă lexicală firească pentru ἐν μέσῳ αὐτῶν; formularea principală păstrează mai clar imaginea spațială.
lexical_decisions:
- source_word: οὗ
  choice: unde
  rationale: Introduce firesc propoziția locativă și păstrează corelația grecească „unde… acolo”, fără a extinde sensul la „oriunde”.
- source_word: γάρ
  choice: căci
  rationale: Păstrează valoarea explicativă și legătura cu afirmațiile precedente.
- source_word: δύο ἢ τρεῖς
  choice: doi sau trei
  rationale: Redare directă și firească a expresiei numerice.
- source_word: συνηγμένοι
  choice: sunt adunați
  rationale: Redă participiul perfect pasiv și starea rezultată a celor care au fost adunați, fără a transforma pasivul într-un reflexiv explicit.
- source_word: εἰς τὸ ἐμὸν ὄνομα
  choice: în numele meu
  rationale: Este echivalentul românesc idiomatic, păstrând deschisă ideea de raportare la Isus, autoritatea lui și apartenența față de el.
- source_word: ἐκεῖ
  choice: acolo
  rationale: Păstrează corelația locativă explicită cu „unde”.
- source_word: εἰμι
  choice: sunt și eu
  rationale: Redă direct verbul „a fi”; particula „și” este idiomatică în română și subliniază prezența vorbitorului fără a preciza modul acesteia.
- source_word: ἐν μέσῳ αὐτῶν
  choice: în mijlocul lor
  rationale: Păstrează imaginea spațială a expresiei grecești și este naturală în româna actuală.
theological_decisions:
- issue: Implicația cristologică a prezenței lui Isus între ucenicii adunați
  choice: Afirmația este redată direct ca prezență a lui Isus în mijlocul celor adunați în numele lui.
  alternative: „Sunt prezent între ei” sau o formulare care ar preciza un anumit mod sacramental ori ecleziologic al prezenței.
  rationale: Textul afirmă prezența lui Isus, dar nu definește modul ei metafizic și nu justifică introducerea unei doctrine confesionale ulterioare.
translation_notes:
  register: Română standard modernă, clară și demnă. Ordinea cu „doi sau trei” după verb este firească, iar construcția „unde… acolo” păstrează structura și accentul sursei grecești. Pronumele referitoare la Isus sunt scrise cu literă mică, potrivit uzului ortografic modern și fără marcaj confesional suplimentar.
