id: MAT.18.28
reference: Matthew 18:28
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ ὁ δοῦλος ἐκεῖνος εὗρεν ἕνα τῶν συνδούλων αὐτοῦ ὃς ὤφειλεν αὐτῷ ἑκατὸν δηνάρια, καὶ κρατήσας αὐτὸν ἔπνιγεν λέγων· ⸀Ἀπόδος εἴ τι ὀφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/028.yaml
  text: But when that servant went out[a], he found one of his fellow servants who owed him a hundred denarii, and seizing him, he began choking him, saying[b], ‘Pay back whatever you owe.’
translation:
  language: ro
  text: 'Dar, după ce a ieșit, sclavul acela a găsit pe unul dintre tovarășii lui de sclavie, care îi datora o sută de dinari[b]. L-a apucat și a început să-l sugrume, spunând: „Dă-mi înapoi tot ce-mi datorezi!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mai literal: „Dă-mi înapoi dacă îmi datorezi ceva.”'
    reason: lexical_alternative
  - marker: b
    text: Un dinar era plata obișnuită pentru o zi de muncă a unui lucrător sau soldat.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλος
  choice: sclav
  rationale: Redă direct statutul de persoană aflată în proprietatea și sub autoritatea unui stăpân; în această parabolă, raporturile de putere, datoria și constrângerea fac relevant sensul social mai puternic al termenului.
- source_word: ἐξελθὼν δὲ
  choice: Dar, după ce a ieșit
  rationale: Exprimă firesc în română atât tranziția narativă marcată de δέ, cât și relația temporală a participiului aorist.
- source_word: συνδούλων
  choice: ceilalți sclavi
  rationale: Păstrează ideea că omul găsit aparținea aceleiași categorii servile; formularea este mai naturală în româna actuală decât „co-sclavi” sau „tovarăși de sclavie”.
- source_word: ὤφειλεν
  choice: îi datora
  rationale: Este echivalentul românesc direct și natural pentru o datorie financiară.
- source_word: ἑκατὸν δηνάρια
  choice: o sută de dinari
  rationale: Păstrează unitatea monetară istorică și contrastul narativ cu datoria uriașă din context, fără a o transforma într-o sumă modernă aproximativă.
- source_word: κρατήσας
  choice: L-a apucat
  rationale: Redă acțiunea fizică energică, într-o formulare clară și firească.
- source_word: ἔπνιγεν
  choice: a început să-l sugrume
  rationale: Valoarea durativă sau ingresivă a imperfectului este redată prin începutul unei acțiuni violente aflate în desfășurare.
- source_word: Ἀπόδος
  choice: Dă-mi înapoi
  rationale: Redă imperativul categoric în contextul recuperării unei datorii.
- source_word: εἴ τι ὀφείλεις
  choice: tot ce-mi datorezi
  rationale: Formulare românească naturală pentru valoarea nedefinită „orice ai datora”; lectura mai strict literală, „dacă îmi datorezi ceva”, este păstrată în notă.
theological_decisions:
- issue: Redarea lui δοῦλος în narațiunea parabolică
  choice: sclav / ceilalți sclavi
  alternative: rob / ceilalți robi; slujitor / ceilalți slujitori
  rationale: „Sclav” reflectă limpede realitatea socială și autoritatea coercitivă din scenă. „Slujitor” ar atenua statutul indicat de termenul grec, iar „rob”, deși tradițional, poate avea în româna biblică și asocieri religioase care nu sunt centrale aici.
- issue: Caracterul nedefinit al expresiei εἴ τι ὀφείλεις
  choice: tot ce-mi datorezi
  alternative: dacă îmi datorezi ceva; ce-mi datorezi
  rationale: Textul păstrează în mod idiomatic cererea deschisă și amenințătoare, fără a o transforma într-o referire strict definită la suma deja menționată; nota conservă forma mai literală și ambiguitatea ei.
translation_notes:
  register: Română standard modernă, clară și demnă. Construcțiile sunt narative și directe; violența scenei și statutul social al personajelor nu sunt atenuate. Marcajele notelor sunt așezate lângă expresiile pe care le explică.
