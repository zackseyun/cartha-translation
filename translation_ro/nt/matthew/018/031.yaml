id: MAT.18.31
reference: Matthew 18:31
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἰδόντες ⸀οὖν οἱ σύνδουλοι αὐτοῦ τὰ γενόμενα ἐλυπήθησαν σφόδρα, καὶ ἐλθόντες διεσάφησαν τῷ κυρίῳ ἑαυτῶν πάντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/031.yaml
  text: Therefore[a], when his fellow servants saw what had happened, they were deeply grieved[b], and they came and reported to their lord everything that had happened.
translation:
  language: ro
  text: Așadar, când ceilalți robi ai lui[a] au văzut ce se întâmplase, s-au întristat foarte mult și au venit și i-au povestit stăpânului lor[b] tot ce se întâmplase.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „ceilalți slujitori”. Termenul grecesc σύνδουλοι îi desemnează pe cei care au aceeași condiție de robi sub același stăpân.
    reason: lexical_alternative
  - marker: b
    text: Sau „domnului lor”. Cuvântul grecesc κύριος poate însemna „stăpân” sau „domn”, în funcție de context.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Așadar
  rationale: Păstrează legătura de consecință sau de progresie narativă față de acțiunea precedentă.
- source_word: σύνδουλοι
  choice: tovarășii lui de robie
  rationale: 'Redă ideea compusului grecesc: persoane care au aceeași condiție de robi sub același stăpân. Formularea evită să reducă termenul la simpli angajați sau slujitori.'
- source_word: τὰ γενόμενα / πάντα τὰ γενόμενα
  choice: ce se întâmplase / tot ce se întâmplase
  rationale: Redare idiomatică a participiului substantivizat; „tot” din a doua expresie corespunde lui πάντα și păstrează intensificarea.
- source_word: ἐλυπήθησαν σφόδρα
  choice: s-au întristat foarte mult
  rationale: Exprimă durerea sau mâhnirea puternică indicată de verb și de intensificatorul σφόδρα, într-o română actuală și firească.
- source_word: ἐλθόντες
  choice: au venit
  rationale: Redă participiul aorist ca acțiune narativă anterioară verbului principal, fără o construcție participială greoaie în română.
- source_word: διεσάφησαν
  choice: să-i relateze
  rationale: Verbul indică o informare sau relatare clară și amănunțită; caracterul complet este întărit și de expresia „tot ce se întâmplase”.
- source_word: τῷ κυρίῳ ἑαυτῶν
  choice: stăpânului lor
  rationale: În cadrul parabolei, κύριος desemnează superiorul uman căruia îi aparțin robii; „stăpân” este termenul românesc natural în acest raport social.
theological_decisions:
- issue: Redarea termenului din familia lui δοῦλος într-un cadru social parabolic
  choice: tovarășii lui de robie
  alternative: ceilalți slujitori
  rationale: Condiția comună de robi este relevantă pentru logica parabolei. Alegerea păstrează această relație fără a o atenua la sensul modern de angajați, dar nota oferă alternativa tradițională.
- issue: Redarea lui κύριος pentru un superior uman
  choice: stăpân
  alternative: domn
  rationale: Contextul imediat este cel al robilor aflați sub autoritatea unui stăpân omenesc. „Stăpân” exprimă limpede raportul social, fără a transforma figura parabolică în referință divină explicită.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. „Tovarășii lui de robie” păstrează statutul comun exprimat de σύνδουλοι, iar „stăpân” este firesc pentru κύριος în cadrul social al parabolei. Repetarea lui „se întâmplase” reflectă repetarea intenționată din textul grec.
