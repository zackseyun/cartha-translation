id: MAT.18.15
reference: Matthew 18:15
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἁμαρτήσῃ ⸂εἰς σὲ⸃ ὁ ἀδελφός σου, ⸀ὕπαγε ἔλεγξον αὐτὸν μεταξὺ σοῦ καὶ αὐτοῦ μόνου. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/015.yaml
  text: But if your brother sins against you[a], go and reprove him between you and him alone. If he listens to you[c][b], you have gained your brother.
translation:
  language: ro
  text: Dar, dacă fratele tău păcătuiește împotriva ta[a], du-te și arată-i greșeala numai între tine și el. Dacă te ascultă, l-ai câștigat pe fratele tău.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Unele manuscrise omit „împotriva ta”, astfel încât textul spune: „Dacă fratele tău păcătuiește, du-te...”'
    reason: textual_variant
lexical_decisions:
- source_word: ἁμαρτήσῃ
  choice: păcătuiește
  rationale: Aoristul conjunctiv după ἐὰν exprimă aici o condiție generală; prezentul românesc este firesc și păstrează sensul moral și religios al verbului.
- source_word: εἰς σέ
  choice: împotriva ta
  rationale: Redă idiomatic direcționarea greșelii către interlocutor; expresia este inclusă în SBLGNT, iar omiterea ei din unele manuscrise este semnalată în notă.
- source_word: ὁ ἀδελφός σου
  choice: fratele tău
  rationale: Păstrează masculinul singular al textului grec și limbajul relațional al contextului ucenicilor, fără extindere interpretativă în textul principal.
- source_word: ὕπαγε
  choice: du-te
  rationale: Imperativ românesc direct și natural, corespunzător poruncii grecești.
- source_word: ἔλεγξον
  choice: arată-i greșeala
  rationale: Redă ideea de a scoate vina la lumină și de a-l face conștient de ea, fără asprimea posibilă a lui „mustră-l” și fără ambiguitatea modernă a lui „confruntă-l”.
- source_word: μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  choice: între tine și el, numai voi doi
  rationale: Păstrează construcția relațională și subliniază clar caracterul strict privat al discuției.
- source_word: ἐάν σου ἀκούσῃ
  choice: dacă te ascultă
  rationale: Exprimă o auzire receptivă, fără a impune sensul mai tare de ascultare obedientă.
- source_word: ἐκέρδησας
  choice: l-ai câștigat
  rationale: Păstrează metafora lui κερδαίνω și evită adaosul semantic din „l-ai recâștigat”.
theological_decisions:
- issue: Domeniul de referință al lui ἀδελφός
  choice: fratele tău
  alternative: fratele sau sora ta; un alt credincios
  rationale: Forma masculină singulară a sursei este păstrată. În context, termenul poate avea o aplicare mai largă la un alt ucenic, dar aceasta nu este introdusă explicit în text.
- issue: Statutul textual al expresiei εἰς σέ
  choice: includerea expresiei „împotriva ta” în text
  alternative: „dacă fratele tău păcătuiește”
  rationale: SBLGNT include expresia, dar varianta mai scurtă are consecințe interpretative reale și este consemnată în nota textuală.
- issue: Forța verbului ἀκούω în contextul împăcării
  choice: dacă te ascultă
  alternative: dacă te aude; dacă îți dă ascultare
  rationale: Formularea păstrează deschisă nuanța dintre auzirea receptivă și acceptarea mustrării, fără a transforma verbul în ascultare deplină.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formularea „arată-i greșeala” este clară pentru cititorul obișnuit și redă funcția verbului ἐλέγχω; „numai voi doi” explicitează firesc exclusivitatea exprimată de μόνος. Marcajul notei apare în textul principal.
