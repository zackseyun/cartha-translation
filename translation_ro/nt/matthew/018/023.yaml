  source_fidelity: Textul redă corect legătura inferențială, pasivul lui ὡμοιώθη, expresia mateiană „împărăția cerurilor” și comparația cu un rege. Pentru δοῦλοι, „sclavii” exprimă mai direct în româna standard actuală statutul servil indicat de greacă. „A încheia socotelile” poate sugera doar finalizarea unor calcule; „a încheia socoteala cu” redă mai precis idiomul συνᾶραι λόγον, adică efectuarea unei decontări/chemări la socoteală.
  naturalness: „De aceea” și construcția pasivă sunt firești într-un registru biblic modern. Forma singulară „să încheie socoteala cu” este o expresie românească mai idiomatică și mai precisă decât pluralul „să-și încheie socotelile” în acest context.
  terminology: „Împărăția cerurilor” este formularea stabilită și adecvată. „Sclavii” este termenul modern standard cel mai transparent pentru δοῦλοι aici; nota păstrează „robi” și „slujitori” ca alternative contextuale, fără a diminua sensul principal.
