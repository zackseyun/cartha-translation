source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ ὃς ἠθέλησεν συνᾶραι λόγον μετὰ τῶν δούλων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/023.yaml
  text: For this reason the kingdom of heaven has become like a king who wanted to settle accounts with his servants[a][b].
translation:
  language: ro
  text: De aceea, împărăția cerurilor a fost asemănată cu un rege care a vrut să încheie socoteala cu sclavii săi[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „robii săi” sau „slujitorii săi”; grecescul δοῦλοι desemnează persoane aflate în servitute, sub autoritatea stăpânului.'
    reason: alternative_reading
  - marker: b
    text: 'Greacă: „a fost asemănată cu” sau „a fost comparată cu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: De aceea
  rationale: Redă firesc în româna actuală legătura cauzal-inferențială cu învățătura precedentă.
- source_word: ὡμοιώθη
  choice: a fost asemănată
  rationale: Păstrează forma pasivă a aoristului și caracterul explicit comparativ al verbului ὁμοιόω, fără a transforma comparația într-o simplă afirmație de identitate.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: împărăția cerurilor
  rationale: Este formularea românească consacrată și redă expresia specifică lui Matei, cu pluralul cerurilor.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: cu un rege
  rationale: βασιλεῖ îl precizează pe ἀνθρώπῳ; româna naturală poate comprima expresia literală „cu un om, un rege” fără pierdere semantică relevantă.
- source_word: ἠθέλησεν
  choice: a vrut
  rationale: Exprimă simplu și actual voința sau intenția regelui.
- source_word: συνᾶραι λόγον
  choice: să-și încheie socotelile
  rationale: Redă idiomatic procesul de verificare și reglare a conturilor, păstrând cadrul economic și implicația tragerii la răspundere.
- source_word: μετὰ τῶν δούλων αὐτοῦ
  choice: cu robii săi
  rationale: „Robii” păstrează statutul de dependență și autoritatea stăpânului implicate de δοῦλοι, fiind totodată inteligibil și demn în registrul biblic românesc; alternativa „slujitorii” este notată pentru uzul semantic mai larg al termenului.
theological_decisions:
- issue: Redarea lui δοῦλος în contextul regal și economic al parabolei
  choice: robi
  alternative: slujitori; sclavi
  rationale: Contextul evidențiază dependența față de rege și puterea lui asupra celor chemați la socoteală. „Robi” păstrează această tensiune mai bine decât „slujitori”, fără a impune conotațiile moderne mai înguste ale lui „sclavi”.
- issue: Forța pasivului ὡμοιώθη
  choice: a fost asemănată
  alternative: se aseamănă; este asemenea
  rationale: Pasivul explicit păstrează forma neobișnuită a grecei și ambiguitatea privind agentul comparației; o formulare cu „este” ar netezi această particularitate.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și clar. Formularea păstrează pasivul grecesc și terminologia economică, evitând atât arhaizarea excesivă, cât și explicarea teologică în corpul versetului.
