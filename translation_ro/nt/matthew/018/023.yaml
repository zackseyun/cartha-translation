  - severity: low
    issue: „să-și încheie socotelile”
    rationale: Formularea poate însemna pur și simplu finalizarea propriilor calcule. Idiomul grec desemnează decontarea sau cererea de socoteală față de subordonați; „să încheie socoteala cu” păstrează mai clar această relație.
