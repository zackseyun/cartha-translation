source:
  edition: SBLGNT
  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
translation:
  language: ro
  text: Dar dacă eu îi alung pe demoni prin Duhul lui Dumnezeu[a], atunci împărăția lui Dumnezeu a ajuns la voi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „în Duhul lui Dumnezeu”. Expresia grecească poate indica aici fie sfera în care are loc acțiunea, fie mijlocul sau agentul prin care este săvârșită.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „a venit peste voi” ori „v-a ajuns”. Verbul grecesc subliniază că împărăția lui Dumnezeu a ajuns la destinatarii afirmației.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Dar, dacă
  rationale: Păstrează atât condiția, cât și contrastul ușor introdus de δέ, într-o formulare românească firească.
- source_word: ἐν πνεύματι θεοῦ
  choice: prin Duhul lui Dumnezeu
  rationale: Redă aici ἐν cu dativul ca mijloc sau agent, fără a pierde referirea personală la Duhul; alternativa mai literală „în Duhul lui Dumnezeu” este consemnată în notă.
- source_word: ἐγὼ
  choice: Eu
  rationale: Pronumele explicit din greacă este păstrat pentru accentul argumentativ și este scris cu majusculă în acord cu uzul românesc reverențial curent.
- source_word: ἐκβάλλω
  choice: îi alung
  rationale: „A alunga” exprimă clar și natural scoaterea forțată a demonilor, fără caracterul ușor arhaic al lui „a izgoni”.
- source_word: τὰ δαιμόνια
  choice: pe demoni
  rationale: „Demoni” este echivalentul modern direct; în română, articolul și cazul acuzativ sunt exprimate idiomatic prin pronumele anticipativ „îi” și marca „pe”.
- source_word: ἄρα
  choice: atunci
  rationale: Marchează limpede concluzia logică rezultată din condiția precedentă.
- source_word: ἔφθασεν
  choice: a ajuns
  rationale: Redă sensul contextual de sosire sau atingere a unei destinații și forța aoristului, fără a reduce afirmația la simpla apropiere.
- source_word: ἐφ’ ὑμᾶς
  choice: la voi
  rationale: Este formularea românească naturală pentru ceva care i-a atins sau a ajuns până la destinatari; nota păstrează nuanța mai pregnantă posibilă.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Împărăția lui Dumnezeu
  rationale: Este redarea consacrată și cuprinzătoare, capabilă să exprime atât domnia lui Dumnezeu, cât și sfera împărăției Sale.
theological_decisions:
- issue: Relația dintre Împărăția lui Dumnezeu și alungarea demonilor de către Isus
  choice: Afirmația prezintă alungarea demonilor prin Duhul ca dovadă că Împărăția lui Dumnezeu a ajuns deja în mod real la ascultători.
  alternative: Împărăția doar s-a apropiat, fără să fi ajuns încă, ori se referă exclusiv la împlinirea viitoare.
  rationale: ἔφθασεν exprimă ajungerea/sosirea, iar argumentul leagă această realitate prezentă de lucrările lui Isus; formularea nu neagă însă o împlinire viitoare.
- issue: Referentul expresiei „Duhul lui Dumnezeu”
  choice: Expresia este redată ca referire personală la Duhul lui Dumnezeu.
  alternative: O referire generală la o putere divină impersonală.
  rationale: πνεύματι θεοῦ îl indică în context pe Duhul ca agent al alungării demonilor; majuscula urmează uzul românesc creștin, fără a adăuga o explicație doctrinară în text.
translation_notes:
  register: Română standard modernă, clară și demnă. „A alunga” este curent și energic; „Împărăția lui Dumnezeu” păstrează formularea biblică bine cunoscută. Notele mențin ambiguitățile reale ale construcțiilor ἐν πνεύματι și ἔφθασεν ἐφ’ ὑμᾶς.
