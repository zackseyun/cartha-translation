id: MAT.12.2
reference: Matthew 12:2
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: ro
  text: 'Dar fariseii, când au văzut aceasta, i-au spus: „Uite, ucenicii tăi fac ce nu este îngăduit să facă în ziua de Sabat.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Dar
  rationale: Redă firesc contrastul cu desfășurarea precedentă a relatării.
- source_word: ἰδόντες
  choice: când au văzut aceasta
  rationale: Participiul aorist este redat temporal; pronumele „aceasta” explicitează în mod discret acțiunea ucenicilor, subînțeleasă din context.
- source_word: εἶπαν αὐτῷ
  choice: i-au spus
  rationale: Formulă românească directă și neutră pentru introducerea vorbirii.
- source_word: Ἰδοὺ
  choice: Uite
  rationale: Interjecție deictică actuală, care păstrează forța acuzației fără caracterul arhaic al lui „Iată” în vorbirea adresată direct.
- source_word: μαθηταί
  choice: ucenicii
  rationale: Termen consacrat și exact în contextul relației dintre învățător și discipol din Evanghelii.
- source_word: ποιοῦσιν ... ποιεῖν
  choice: fac ... să facă
  rationale: Păstrează repetiția verbului ποιέω într-o formulare românească inteligibilă.
- source_word: ὃ οὐκ ἔξεστιν
  choice: ce nu este îngăduit
  rationale: Redă sensul de permisiune legal-religioasă fără să precizeze dacă norma invocată provine din Scriptură sau din tradiția interpretativă.
- source_word: ἐν σαββάτῳ
  choice: în ziua de Sabat
  rationale: Formulare idiomatică românească pentru referirea temporală la Sabat și la respectarea lui.
theological_decisions:
- issue: Natura obiecției fariseilor
  choice: ce nu este îngăduit
  alternative: ce nu este legal; ce nu este permis
  rationale: Versetul consemnează acuzația fără să decidă aici dacă ea se întemeiază pe legea biblică sau pe tradiția fariseică; formularea păstrează această tensiune.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. „Uite” redă adresarea directă și acuzatoare; „în ziua de Sabat” evită o construcție rigidă. Nu este necesară o notă de subsol, deoarece alternativa lexicală din stratul englez („not permitted”) este deja exprimată în text prin „nu este îngăduit”.
