id: MAT.12.31
reference: Matthew 12:31
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: ro
  text: 'De aceea vă spun: oamenilor li se va ierta orice păcat și orice blasfemie, dar blasfemia împotriva Duhului[a] nu va fi iertată.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „împotriva Duhului Sfânt”. Din context reiese că este vorba despre Duhul Sfânt, deși acest verset spune simplu „Duhul”.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: De aceea
  rationale: Redă firesc în româna actuală concluzia sau deducția întemeiată pe contextul precedent.
- source_word: λέγω ὑμῖν
  choice: vă spun
  rationale: Formulă directă și solemnă, idiomatică în română, care păstrează adresarea la persoana a doua plural.
- source_word: πᾶσα ἁμαρτία καὶ βλασφημία
  choice: orice păcat și orice blasfemie
  rationale: Repetarea lui „orice” exprimă limpede valoarea distributivă a lui πᾶσα pentru ambii termeni și sună natural în română.
- source_word: ἀφεθήσεται τοῖς ἀνθρώποις
  choice: oamenilor li se va ierta
  rationale: Construcția românească păstrează oamenii ca beneficiari ai iertării și evită o formulare pasivă greoaie. „Oamenilor” are sens generic, incluzând toate persoanele.
- source_word: βλασφημία
  choice: blasfemie
  rationale: În acest context, termenul indică vorbire ofensatoare sau sfidătoare îndreptată împotriva divinului; „blasfemie” este precis și inteligibil în româna modernă.
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: dar blasfemia împotriva Duhului
  rationale: 'Genitivul este înțeles obiectiv: Duhul este ținta blasfemiei. Adversativul „dar” păstrează contrastul, iar „Duhului” urmează formularea versetului fără a adăuga „Sfânt” în textul principal.'
- source_word: οὐκ ἀφεθήσεται
  choice: nu va fi iertată
  rationale: Redă direct viitorul pasiv și menține contrastul formal cu iertarea din prima parte a versetului.
theological_decisions:
- issue: Redarea lui πνεύματος prin „Duhul” sau „Duhul Sfânt”
  choice: Duhul
  alternative: Duhul Sfânt
  rationale: Textul grec al versetului are numai τοῦ πνεύματος, fără adjectivul „Sfânt”. Contextul identifică referentul drept Duhul Sfânt, însă textul principal păstrează formularea explicită a versetului, iar precizarea interpretativă este consemnată în notă.
- issue: Relația exprimată de genitivul τοῦ πνεύματος
  choice: împotriva Duhului
  alternative: blasfemia Duhului
  rationale: 'Contextul cere înțelegerea genitivului ca obiectiv, nu posesiv: blasfemia este îndreptată împotriva Duhului, nu săvârșită de Duhul.'
translation_notes:
  register: Română standard modernă, clară și demnă. S-a preferat construcția idiomatică „oamenilor li se va ierta” pentru a reda dativul beneficiarului fără rigiditate, păstrând totodată contrastul teologic și structura logică a versetului.
