source:
  edition: SBLGNT
  text: ⸂ἐξελθόντες δὲ οἱ Φαρισαῖοι συμβούλιον ἔλαβον κατ’ αὐτοῦ⸃ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/014.yaml
  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: ro
  text: Fariseii însă au ieșit și au ținut sfat împotriva lui, despre cum să-l nimicească.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „să-l omoare” ori „să-l dea la moarte”. Verbul grecesc înseamnă „a nimici” și, în acest context, poate include intenția de a-l ucide.
    reason: alternativă lexicală
lexical_decisions:
- source_word: ἐξελθόντες
  choice: au ieșit
  rationale: Participiul aorist exprimă o acțiune anterioară sau succesivă; forma verbală coordonată redă firesc în română plecarea lor înaintea consfătuirii.
- source_word: δὲ
  choice: însă
  rationale: Marchează schimbarea contrastantă de la fapta lui Isus la reacția ostilă a fariseilor; poziția postpusă este firească în română.
- source_word: οἱ Φαρισαῖοι
  choice: Fariseii
  rationale: Denumirea consacrată în română pentru această grupare iudaică.
- source_word: συμβούλιον ἔλαβον
  choice: s-au sfătuit
  rationale: Redă direct expresia idiomatică „au luat sfat”, într-o română actuală și demnă, fără a accentua intenția conspirativă mai mult decât o face contextul.
- source_word: κατ’ αὐτοῦ
  choice: împotriva lui
  rationale: κατά cu genitivul are aici sens adversativ, confirmat de scopul ostil al consfătuirii.
- source_word: ὅπως
  choice: cum să
  rationale: Introduce obiectul deliberării, anume modul în care urmau să acționeze; „cum să” păstrează această nuanță mai precis decât o simplă construcție finală.
- source_word: ἀπολέσωσιν
  choice: să-l nimicească
  rationale: ἀπόλλυμι poate însemna „a nimici”, iar în context poate implica omorârea. Alegerea păstrează formularea mai largă a verbului grec, în timp ce nota explică intenția letală probabilă.
theological_decisions:
- issue: Gradul de precizie în redarea lui ἀπολέσωσιν
  choice: să-l nimicească
  alternative: să-l omoare; să-l dea la moarte
  rationale: Contextul indică o intenție ostilă, probabil letală, dar verbul grec este mai larg decât un verb care înseamnă explicit „a omorî”. Textul principal păstrează această amplitudine semantică, iar nota oferă sensul contextual mai precis.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. Construcția „s-au sfătuit împotriva lui cum să...” păstrează atât idiomul deliberării, cât și nuanța lui ὅπως, fără a netezi tensiunea lexicală a verbului final.
