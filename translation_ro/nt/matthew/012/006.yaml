id: MAT.12.6
reference: Matthew 12:6
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι τοῦ ἱεροῦ μεῖζόν ἐστιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/006.yaml
  text: But I tell you that something greater than the temple is here[a][b].
translation:
  language: ro
  text: Dar vă spun că aici este ceva mai mare decât templul[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „cineva mai mare decât templul este aici” ori „unul mai mare decât templul este aici”. Greaca folosește o formă neutră („mai mare”), lăsând referentul neexprimat în mod formal.'
    reason: alternative_reading
  - marker: b
    text: 'Sau: „în locul acesta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Dar vă spun
  rationale: Formula de adresare directă este redată firesc în româna actuală, iar „dar” exprimă contrastul moderat introdus de δέ față de argumentul precedent.
- source_word: ὅτι
  choice: că
  rationale: Introduce explicit conținutul afirmației și păstrează o sintaxă românească limpede.
- source_word: τοῦ ἱεροῦ
  choice: decât templul
  rationale: ἱερόν denumește de regulă ansamblul templului, nu în mod specific sanctuarul interior; „templul” este formularea românească firească și precisă în context.
- source_word: μεῖζόν
  choice: ceva mai mare
  rationale: Comparativul neutru singular este folosit substantival, fără ca referentul să fie numit. „Ceva mai mare” păstrează caracterul impersonal al formei grecești și evită identificarea explicită a referentului în textul principal.
- source_word: ἐστιν
  choice: este
  rationale: Redă direct copula la prezent, fără adaos explicativ.
- source_word: ὧδε
  choice: aici
  rationale: Adverbul locativ înseamnă „aici” sau „în locul acesta”; „aici” este concis și natural.
theological_decisions:
- issue: Identitatea referentului neexprimat al comparativului neutru μεῖζόν
  choice: „ceva mai mare decât templul”
  alternative: „cineva mai mare decât templul” sau „unul mai mare decât templul”
  rationale: Greaca folosește forma neutră singulară μεῖζόν, nu una masculină. Deși contextul indică puternic spre Isus și autoritatea sa, textul principal nu trebuie să precizeze mai mult decât originalul; nota păstrează interpretările personale posibile.
translation_notes:
  register: Română standard modernă, clară și demnă. Ordinea „aici este” sună natural și păstrează accentul locativ al lui ὧδε; formularea „ceva mai mare” conservă ambiguitatea gramaticală și tensiunea teologică a originalului.
