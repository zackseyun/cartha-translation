reference: Matthew 12:11
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: ro
  text: 'Dar el le-a spus: „Care om dintre voi, dacă are o singură oaie și aceasta cade într-o groapă în ziua de sabat[a], nu o va apuca și o va scoate de acolo[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: În greacă, „în zilele de sabat”, un plural idiomatic cu sensul „în ziua de sabat”.
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „nu o va apuca și o va ridica?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος
  choice: Care om dintre voi
  rationale: Redă firesc întrebarea retorică și păstrează substantivul masculin singular ἄνθρωπος, fără construcția greoaie „cine va fi omul dintre voi”.
- source_word: πρόβατον ἕν
  choice: o singură oaie
  rationale: Păstrează accentul numeralului asupra faptului că omul are doar o oaie și sună natural în româna actuală.
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: dacă ... aceasta cade
  rationale: Condiționalul cu aorist conjunctiv este redat firesc prin prezent; „aceasta” are ca referent explicit oaia.
- source_word: τοῖς σάββασιν
  choice: în ziua de sabat
  rationale: Pluralul grecesc este idiomatic, iar singularul românesc redă ziua de sabat avută în vedere în controversă.
- source_word: εἰς βόθυνον
  choice: într-o groapă
  rationale: „Groapă” este termenul românesc general și natural, fără a preciza nejustificat dacă este șanț sau cisternă.
- source_word: κρατήσει
  choice: o va apuca
  rationale: Verbul exprimă prinderea fermă a oii; „a apuca” este clar și adecvat registrului.
- source_word: ἐγερεῖ
  choice: o va scoate de acolo
  rationale: În context, ridicarea are drept rezultat scoaterea oii din groapă. Formularea este naturală, iar sensul mai formal „a ridica” este păstrat în notă.
theological_decisions:
- issue: Limbajul reprezentativ masculin
  choice: Care om dintre voi
  alternative: Cine dintre voi
  rationale: Formularea păstrează explicit substantivul masculin singular ἄνθρωπος și caracterul reprezentativ al exemplului.
- issue: Pluralul σάββασιν
  choice: în ziua de sabat
  alternative: în zilele de sabat
  rationale: Pluralul grecesc are aici valoare idiomatică și nu indică în mod necesar mai multe zile de sabat.
translation_notes:
  register: Română standard modernă, clară și demnă. Întrebarea retorică păstrează așteptarea unui răspuns afirmativ, iar ordinea propoziției evită o calchiere greoaie a construcției grecești.
