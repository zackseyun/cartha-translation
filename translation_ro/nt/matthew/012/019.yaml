  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οὐκ ἐρίσει οὐδὲ κραυγάσει, οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: ro
  text: Nu se va certa, nici nu va striga[a], și nimeni nu-i va auzi glasul pe străzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Nu va intra în dispute, nici nu va striga, iar nimeni nu-i va auzi glasul în piețele publice.”'
    reason: Alternativă lexicală pentru ἐρίζω („a intra în dispute”) și pentru πλατείαι („piețele publice”); păstrează redarea firească a lui κραυγάζω prin „a striga”.
lexical_decisions:
- source_word: ἐρίσει
  choice: se va certa
  rationale: Verbul exprimă implicarea în ceartă sau dispută. Formularea reflexivă este firească în româna actuală și redă purtarea neconflictuală a Slujitorului.
- source_word: κραυγάσει
  choice: va striga
  rationale: Verbul indică un strigăt puternic. „Va striga” este clar și păstrează paralelismul, fără a adăuga ideea unei agresivități care nu este explicită.
- source_word: ἀκούσει τις
  choice: nimeni nu-i va auzi
  rationale: Construcția grecească, literal „nici nu va auzi cineva”, este redată idiomatic prin negația „nimeni nu”.
- source_word: ἐν ταῖς πλατείαις
  choice: pe străzi
  rationale: Termenul desemnează străzi largi sau artere publice. „Pe străzi” este formularea românească naturală și păstrează cadrul public.
- source_word: φωνὴν αὐτοῦ
  choice: glasul
  rationale: „Glasul” redă clar φωνή și oferă un registru demn, potrivit citatului scripturistic, fără a fi greu de înțeles.
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: Nu… nici… și nimeni nu…
  rationale: Succesiunea păstrează forța cumulativă a celor trei negații, într-o sintaxă românească fluentă.
theological_decisions:
- issue: Relația cu citatul despre Slujitorul din Isaia și portretizarea purtării lui Mesia
  choice: Versetul îl prezintă pe Mesia ca neconflictual și lipsit de ostentație publică.
  alternative: O redare mai formală ar putea folosi „nu se va lupta” și „nu va scoate strigăte”.
  rationale: Textul caracterizează maniera blândă și necombativă a lui Isus, fără să afirme că el nu vorbește niciodată în public sau că este pasiv în sens absolut.
translation_notes:
  register: Română standard modernă, clară și demnă. „Se va certa” și „va striga” sunt expresii curente; „glasul” menține registrul biblic fără arhaizare excesivă.
