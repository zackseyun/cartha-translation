id: MAT.12.38
reference: Matthew 12:38
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: ro
  text: 'Atunci, unii dintre cărturari și farisei i-au răspuns, zicând: „Învățătorule, vrem să vedem un semn[a] de la tine.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „un semn miraculos”. Termenul grecesc poate desemna un semn cu semnificație miraculoasă, dar textul principal păstrează termenul mai larg „semn”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Redă firesc adverbul temporal care introduce următorul moment al narațiunii.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: i-au răspuns
  rationale: Păstrează sensul de răspuns adresat lui Isus și urmează idiomul narativ grecesc, chiar dacă în versetul imediat anterior nu apare o întrebare directă.
- source_word: τινες τῶν γραμματέων καὶ Φαρισαίων
  choice: unii dintre cărturari și farisei
  rationale: „Unii” indică o parte a grupului, iar „cărturari” și „farisei” sunt denumirile consacrate și inteligibile în româna biblică actuală.
- source_word: λέγοντες
  choice: zicând
  rationale: Păstrează participiul care introduce vorbirea directă și sună demn, fără a fi arhaic.
- source_word: Διδάσκαλε
  choice: Învățătorule
  rationale: Redă direct vocativul și rolul de profesor religios, fără nuanța mai puternică pe care ar putea-o sugera „Stăpâne”.
- source_word: θέλομεν
  choice: vrem
  rationale: Este echivalentul românesc direct și actual al exprimării voinței.
- source_word: ἀπὸ σοῦ
  choice: de la tine
  rationale: Redă sursa sau proveniența semnului cerut.
- source_word: σημεῖον
  choice: un semn
  rationale: Păstrează sensul lexical larg al termenului grec; contextul poate indica o manifestare miraculoasă, dar aceasta nu este introdusă explicit în textul principal.
- source_word: ἰδεῖν
  choice: să vedem
  rationale: Construcția românească este firească după „vrem” și redă simplu infinitivul grec „a vedea”.
theological_decisions:
- issue: Natura semnului cerut
  choice: un semn
  alternative: un semn miraculos
  rationale: În context este probabil cerută o dovadă supranaturală care să-l autentifice pe Isus, însă σημεῖον înseamnă în mod direct „semn”. Formularea principală păstrează întinderea semantică și tensiunea textului grec.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Pronumele referitoare la Isus nu sunt scrise cu majusculă reverențială, deoarece această distincție nu este marcată de textul grec. „Zicând” păstrează structura participială a sursei fără a îngreuna fraza.
