id: MAT.12.20
reference: Matthew 12:20
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, ἕως ἂν ἐκβάλῃ εἰς νῖκος τὴν κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: ro
  text: Nu va frânge trestia zdrobită și nu va stinge fitilul care fumegă[a], până când va duce dreptatea[b] la biruință.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: „inul care fumegă”; este vorba despre un fitil de lampă făcut din in.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „până când va duce judecata la biruință”.'
    reason: alternative_reading
lexical_decisions:
- source_word: κάλαμον
  choice: trestia
  rationale: κάλαμος desemnează în mod obișnuit o trestie sau tulpina ei; „trestie” redă firesc imaginea profetică și legătura cu Isaia 42:3.
- source_word: συντετριμμένον
  choice: zdrobită
  rationale: 'Participiul lui συντρίβω descrie ceva strivit, zdrobit ori grav vătămat. „Zdrobită” păstrează forța termenului grec și tensiunea imaginii: trestia este deja deteriorată, dar nu va fi frântă de tot.'
- source_word: κατεάξει
  choice: va frânge
  rationale: κατάγνυμι înseamnă a rupe sau a frânge. „A frânge” este potrivit pentru o trestie și exprimă ruperea ei deplină.
- source_word: λίνον
  choice: fitilul
  rationale: Deși λίνον denumește literal inul, aici se referă la fitilul de in al unei lămpi. „Fitilul” comunică direct obiectul avut în vedere cititorului modern.
- source_word: τυφόμενον
  choice: care fumegă
  rationale: Participiul descrie un fitil care scoate fum și este aproape să se stingă. Formularea verbală „care fumegă” este clară și firească în româna actuală.
- source_word: σβέσει
  choice: va stinge
  rationale: σβέννυμι înseamnă a stinge. Verbul românesc este precis, natural și se potrivește unui fitil.
- source_word: ἕως ἂν
  choice: până când
  rationale: Construcția indică punctul viitor până la care se mențin negațiile precedente; „până când” este echivalentul românesc direct.
- source_word: ἐκβάλῃ
  choice: va duce
  rationale: În această expresie, ἐκβάλλω are sensul de a face ca ceva să înainteze ori să ajungă la un rezultat. „Va duce ... la” redă idiomatic relația cu εἰς νῖκος.
- source_word: εἰς νῖκος
  choice: la biruință
  rationale: Expresia indică rezultatul victorios. „La biruință” este demn, inteligibil și păstrează orientarea spre țintă a construcției grecești.
- source_word: τὴν κρίσιν
  choice: dreptatea
  rationale: κρίσις poate însemna „judecată” sau „dreptate”. În contextul slujitorului din Isaia, „dreptatea” exprimă mai bine instaurarea ordinii drepte, fără a elimina alternativa lexicală „judecata”.
theological_decisions:
- issue: Redarea lui κρίσις în citatul despre Slujitorul din Isaia
  choice: dreptatea
  alternative: judecata
  rationale: Contextul descrie misiunea blândă, dar eficientă, a Slujitorului de a face să triumfe ordinea dreaptă a lui Dumnezeu, nu numai rostirea unei sentințe. Alternativa „judecata” rămâne posibilă și este consemnată în notă.
- issue: Gradul de literalitate al imaginii lămpii
  choice: fitilul care fumegă ... va stinge
  alternative: inul fumegând ... îl va stinge
  rationale: Greaca numește materialul, inul, dar imaginea se referă la fitilul de in al unei lămpi. Textul principal identifică limpede obiectul, iar nota păstrează forma mai literală.
translation_notes:
  register: Română standard modernă, cu ton demn și imagini concrete. Formularea păstrează paralelismul poetic al citatului și ambiguitatea lui κρίσις prin nota alternativă. Marcajele notelor sunt așezate lângă expresiile pe care le explică.
