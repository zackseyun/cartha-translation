id: MAT.12.43
reference: Matthew 12:43
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ὅταν δὲ τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ οὐχ εὑρίσκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/043.yaml
  text: When the unclean spirit goes out from the man[a], it passes through waterless places seeking rest, and does not find it.
translation:
  language: ro
  text: Când duhul necurat iese dintr-un om, străbate locuri fără apă[a], căutând odihnă, și nu o găsește.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „locuri uscate”. Termenul grecesc înseamnă literal „locuri fără apă”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Când
  rationale: Ὅταν introduce o situație temporală generală, iar δέ are aici o forță discretă de tranziție, care nu necesită în română un adversativ explicit.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: duhul necurat
  rationale: Redă direct expresia greacă și păstrează rezonanța limbajului despre curăție, fără a înlocui termenul πνεῦμα cu interpretativul „demon”.
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: iese din om
  rationale: Prezentul românesc redă natural aoristul conjunctiv din construcția generală cu ὅταν. „Din om” păstrează formularea generică și evită introducerea unui demonstrativ absent din text.
- source_word: διέρχεται
  choice: străbate
  rationale: Exprimă natural deplasarea printr-un ținut sau prin mai multe locuri și este mai precis decât simplul „merge”.
- source_word: δι’ ἀνύδρων τόπων
  choice: locuri fără apă
  rationale: Păstrează imaginea concretă a adjectivului ἄνυδρος, literal „fără apă”, fără a o reduce la sensul mai general „uscate”.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: căutând odihnă
  rationale: Participiul românesc păstrează simultaneitatea acțiunii, iar „odihnă” redă direct substantivul ἀνάπαυσις fără a adăuga ideea explicită a unui loc de odihnă.
- source_word: καὶ οὐχ εὑρίσκει
  choice: și nu o găsește
  rationale: Păstrează conjuncția greacă καί; pronumele „o” reia în mod firesc „odihnă”, obiectul subînțeles în greacă.
theological_decisions:
- issue: Redarea lui πνεῦμα în contextul unui duh rău
  choice: duh
  alternative: demon
  rationale: Deși referentul este o ființă spirituală rea, textul folosește πνεῦμα, nu δαιμόνιον. „Duh” păstrează distincția lexicală și formularea sursei.
translation_notes:
  register: Română literară modernă, clară și demnă. Formularea este concisă, păstrează imaginea concretă a textului grec și evită atât arhaismele, cât și explicitările doctrinare.
