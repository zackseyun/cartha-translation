id: MAT.12.29
reference: Matthew 12:29
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: ro
  text: Sau cum poate cineva să intre în casa omului puternic și să-i ia cu forța bunurile[a], dacă nu-l leagă mai întâi pe omul puternic? Și atunci îi va jefui casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Termenul grecesc poate însemna mai literal „vase” sau „obiecte”, iar aici se referă mai larg la lucrurile ori bunurile din casă.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Sau
  rationale: Introduce o comparație explicativă alternativă, legată de argumentul precedent, și păstrează concizia conectorului grec.
- source_word: δύναταί τις
  choice: poate cineva
  rationale: Redă firesc în română posibilitatea exprimată de verb împreună cu subiectul nehotărât.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: omului puternic / omul puternic
  rationale: Adjectivul grec este folosit substantival; formularea păstrează imaginea concretă și genul masculin al comparației.
- source_word: τὰ σκεύη αὐτοῦ
  choice: bunurile
  rationale: În contextul pătrunderii într-o casă, pluralul σκεύη desemnează lucrurile sau bunurile aflate acolo, deși sensul său mai literal poate fi „vase” ori „obiecte”.
- source_word: ἁρπάσαι
  choice: să-i ia cu forța
  rationale: Păstrează ideea unei luări forțate și o deosebește de verbul mai intens διαρπάσει din final.
- source_word: ἐὰν μὴ πρῶτον δήσῃ
  choice: dacă nu-l leagă mai întâi
  rationale: Redă condiția necesară și ordinea acțiunilor, fără a explica suplimentar metafora.
- source_word: διαρπάσει
  choice: va jefui
  rationale: Exprimă luarea amplă a bunurilor din casă și păstrează intensificarea față de ἁρπάσαι.
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: casa
  rationale: Păstrează imaginea concretă a casei, fără a o transforma interpretativ în „stăpânire” sau „domeniu”.
theological_decisions:
- issue: Limbajul masculin reprezentativ al comparației
  choice: omul puternic / cineva
  alternative: cel puternic / oricine
  rationale: Textul grec prezintă o figură masculină concretă în cadrul comparației; „omul puternic” păstrează imaginea, iar „cineva” redă natural pronumele nehotărât.
- issue: Sfera metaforică a casei și a bunurilor
  choice: Păstrarea imaginii concrete a pătrunderii și jefuirii unei case
  alternative: Redarea interpretativă prin „domeniu”, „stăpânire” sau termeni demonologici expliciți
  rationale: Contextul privește autoritatea lui Isus asupra puterilor demonice, însă versetul formulează o comparație. Traducerea nu introduce în text explicația teologică a elementelor metaforei.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea „să-i ia cu forța” păstrează forța primului verb fără a-l confunda cu „va jefui”, iar repetiția „omul puternic” reflectă repetiția retorică a textului grec.
