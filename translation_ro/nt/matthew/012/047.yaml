id: MAT.12.47
reference: Matthew 12:47
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ⸂εἶπεν δέ τις αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἔξω ἑστήκασιν, ζητοῦντές σοι λαλῆσαι.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/047.yaml
  text: Then someone said to him[a], “Look, your mother and your brothers are standing outside, seeking to speak to you.”
translation:
  language: ro
  text: 'Atunci cineva i-a spus[a]: „Iată, mama ta și frații tăi stau afară și caută să vorbească cu tine.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Unele manuscrise omit acest verset.
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δέ τις αὐτῷ
  choice: Atunci cineva i-a spus
  rationale: δέ leagă ușor relatarea de context, iar „Atunci” redă firesc progresia narativă; τις rămâne indefinit prin „cineva”.
- source_word: Ἰδοὺ
  choice: Iată
  rationale: „Iată” este un semnal de atragere a atenției, actual și demn în româna standard, păstrând forța deictică a termenului grec.
- source_word: ἡ μήτηρ σου
  choice: mama ta
  rationale: Redare directă și firească a construcției posesive.
- source_word: οἱ ἀδελφοί σου
  choice: frații tăi
  rationale: Termenul grec este masculin plural și, în acest cadru narativ, indică membri de familie de sex masculin; „frații” păstrează formularea fără a decide natura exactă a rudeniei.
- source_word: ἔξω ἑστήκασιν
  choice: stau afară
  rationale: Perfectul lui ἵστημι exprimă aici o stare prezentă rezultată; în română, „stau afară” redă natural atât poziția, cât și localizarea.
- source_word: ζητοῦντές
  choice: caută
  rationale: Păstrează sensul de bază al lui ζητέω și evită transformarea lui într-o simplă exprimare a dorinței.
- source_word: σοι λαλῆσαι
  choice: să vorbească cu tine
  rationale: Este formularea idiomatică în română pentru actul comunicării adresate unei persoane; „cu tine” nu implică mai mult decât permite contextul.
theological_decisions:
- issue: Statutul textual al versetului Matei 12:47
  choice: Versetul este inclus în textul principal, conform sursei SBLGNT furnizate, iar omiterea lui din unele manuscrise este semnalată în notă.
  alternative: Omiterea versetului, conform unor martori manuscriși.
  rationale: Textul furnizat include versetul între semne critice. Includerea lui cu o notă păstrează atât baza solicitată pentru traducere, cât și transparența asupra variantei textuale.
- issue: Sensul lui οἱ ἀδελφοί σου
  choice: „frații tăi”, fără precizarea tipului exact de rudenie
  alternative: „rudele tale” sau o formulare care precizează că ar fi frați vitregi ori veri
  rationale: Textul grec spune „frați”, dar versetul singur nu stabilește mai precis natura biologică sau juridică a relației; traducerea nu importă o soluție doctrinară.
translation_notes:
  register: Română standard modernă, clară și demnă. „Iată” păstrează caracterul solemn moderat al relatării fără arhaizare, iar „stau afară și caută să vorbească cu tine” este natural și apropiat de structura greacă.
