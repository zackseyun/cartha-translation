  text: ⸀ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[a], saying:'
translation:
  language: ro
  text: 'ca să se împlinească ceea ce fusese spus prin profetul Isaia, care zice:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ca să
  rationale: Introduce în mod firesc în română o propoziție de scop sau rezultat, fără a restrânge sensul la una singură dintre aceste nuanțe.
- source_word: πληρωθῇ
  choice: să se împlinească
  rationale: Redă conjunctivul pasiv și păstrează formula caracteristică a împlinirii profeției din Evanghelia după Matei.
- source_word: τὸ ῥηθὲν
  choice: ceea ce fusese spus
  rationale: Redă participiul articulat substantivizat și pasivul; mai-mult-ca-perfectul românesc exprimă natural anterioritatea rostirii profetice față de împlinire.
- source_word: διὰ
  choice: prin
  rationale: 'Cu genitivul, indică aici agentul intermediar: mesajul a fost rostit prin Isaia, fără a-l prezenta pe profet drept sursa ultimă.'
- source_word: Ἠσαΐου
  choice: Isaia
  rationale: Forma consacrată în limba română pentru numele profetului.
- source_word: τοῦ προφήτου
  choice: profetul
  rationale: Păstrează identificarea apozițională explicită din textul grec, într-o ordine naturală în română.
- source_word: λέγοντος
  choice: care zice
  rationale: Introduce direct citatul din versetul următor și redă participiul într-o construcție românească firească; prezentul păstrează caracterul viu al mărturiei scripturale.
theological_decisions:
- issue: Rolul profetului în formula de citare
  choice: prin profetul Isaia
  alternative: de profetul Isaia
  rationale: „Prin” păstrează valoarea lui διά cu genitivul și lasă vizibilă medierea profetică, fără a afirma că Isaia este sursa ultimă a mesajului.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează formula mateiană a împlinirii și legătura sintactică înainte cu citatul care urmează.
