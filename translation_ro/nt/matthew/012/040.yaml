id: MAT.12.40
reference: Matthew 12:40
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἦν Ἰωνᾶς ἐν τῇ κοιλίᾳ τοῦ κήτους τρεῖς ἡμέρας καὶ τρεῖς νύκτας, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ καρδίᾳ τῆς γῆς τρεῖς ἡμέρας καὶ τρεῖς νύκτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: ro
  text: Căci, așa cum Iona a fost în pântecele făpturii marine[a] trei zile și trei nopți[b], tot așa Fiul Omului va fi în inima pământului[c] trei zile și trei nopți.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „peștelui celui mare”. Termenul grecesc desemnează o făptură marină mare și este mai larg decât o denumire zoologică precisă.
    reason: lexical_alternative
  - marker: b
    text: Expresia „trei zile și trei nopți” este uneori înțeleasă idiomatic, ca incluzând părți din trei zile; alții o înțeleg într-un sens mai strict.
    reason: alternative_reading
  - marker: c
    text: Expresia „în inima pământului” poate face referire la îngropare, la mormânt ori la adâncurile sau tărâmul morților; metafora grecească este păstrată în textul principal.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Căci, așa cum
  rationale: Redă atât legătura explicativă exprimată de γάρ, cât și comparația introdusă de ὥσπερ, într-o formulare românească firească.
- source_word: Ἰωνᾶς
  choice: Iona
  rationale: Forma consacrată a numelui în limba română.
- source_word: ἐν τῇ κοιλίᾳ
  choice: în pântecele
  rationale: „Pântecele” redă firesc sensul lui κοιλία în această imagine narativă și păstrează registrul demn al textului.
- source_word: τοῦ κήτους
  choice: făpturii marine
  rationale: κῆτος desemnează o vietate marină mare, fără a impune o specie zoologică precisă; formularea evită atât restrângerea la „pește”, cât și conotația mitică posibilă a termenului „monstru”.
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: trei zile și trei nopți
  rationale: Redare directă a expresiei temporale repetate, fără a decide în traducere dacă trebuie înțeleasă idiomatic sau strict.
- source_word: οὕτως
  choice: tot așa
  rationale: Marchează limpede și natural al doilea termen al comparației.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Titlul biblic consacrat în română, care păstrează rezonanța și ambiguitatea expresiei grecești.
- source_word: ἔσται
  choice: va fi
  rationale: Redă simplu viitorul verbului εἰμί, fără a adăuga ideea de durată sugerată de „va rămâne”.
- source_word: ἐν τῇ καρδίᾳ τῆς γῆς
  choice: în inima pământului
  rationale: Păstrează metafora explicită a lui καρδία și nu o înlocuiește cu o interpretare precum „mormânt”, „adâncuri” sau „tărâmul morților”.
theological_decisions:
- issue: Sensul expresiei „în inima pământului”
  choice: Metafora este păstrată literal, fără identificarea ei cu o singură realitate.
  alternative: „în mormânt”, „în adâncurile pământului” sau „în tărâmul morților”
  rationale: Greaca nu impune aici o singură explicare a metaforei; traducerea păstrează tensiunea dintre interpretările posibile.
- issue: Forța expresiei „trei zile și trei nopți”
  choice: Expresia temporală este păstrată întocmai în textul principal.
  alternative: Idiom care include părți din trei zile sau perioadă strictă de șaptezeci și două de ore
  rationale: Versetul enunță explicit această formulă, iar disputele cronologice nu trebuie soluționate prin parafrazarea textului.
translation_notes:
  register: Română standard modernă, într-un registru clar și demn. Formulările consacrate „Iona” și „Fiul Omului” sunt păstrate, iar metaforele și ambiguitățile reale ale sursei nu sunt netezite interpretativ.
