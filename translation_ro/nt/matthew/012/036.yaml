id: MAT.12.36
reference: Matthew 12:36
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πᾶν ῥῆμα ἀργὸν ὃ ⸀λαλήσουσιν οἱ ἄνθρωποι, ἀποδώσουσιν περὶ αὐτοῦ λόγον ἐν ἡμέρᾳ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: ro
  text: Dar vă spun că, pentru orice cuvânt nechibzuit[a] pe care îl vor rosti oamenii, vor da socoteală în ziua judecății.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „cuvânt fără folos”. Adjectivul grec poate însemna „inactiv”, „neproductiv”, „fără folos” sau, în acest context, „nechibzuit”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Dar vă spun
  rationale: Redă direct adresarea la plural, iar δέ are aici o nuanță ușor adversativă, potrivită contrastului cu contextul precedent.
- source_word: πᾶν ῥῆμα
  choice: orice cuvânt
  rationale: πᾶν la singular are sens distributiv, iar ῥῆμα desemnează aici un cuvânt sau un enunț rostit.
- source_word: ἀργὸν
  choice: nechibzuit
  rationale: În contextul răspunderii la judecată, termenul indică vorbire lipsită de grija și responsabilitatea cuvenite. „Nechibzuit” exprimă clar această forță morală, fără a restrânge sensul la vorbire răuvoitoare.
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: pe care îl vor rosti oamenii
  rationale: Păstrează viitorul verbului și sensul generic, incluziv, al lui οἱ ἄνθρωποι. „A rosti” se potrivește natural cu substantivul „cuvânt”.
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: vor da socoteală
  rationale: Expresia grecească este un idiom pentru a răspunde sau a da seamă cu privire la ceva. Legătura cu fiecare cuvânt este deja exprimată prin construcția „pentru orice cuvânt”, astfel că formularea românească evită o repetare greoaie.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: în ziua judecății
  rationale: Redare românească firească a expresiei temporale, cu păstrarea sensului judiciar al lui κρίσις.
theological_decisions:
- issue: Forța morală a adjectivului ἀργόν
  choice: nechibzuit
  alternative: fără folos; trândav; deșert
  rationale: Avertizarea privește vorbirea pentru care oamenii sunt răspunzători înaintea judecății divine. „Nechibzuit” păstrează seriozitatea etică fără să transforme termenul în „rău” sau „blasfemiator”, sensuri mai înguste decât greaca.
- issue: Sensul generic al expresiei οἱ ἄνθρωποι
  choice: oamenii
  alternative: bărbații; ființele omenești
  rationale: Referirea este la oameni în general, nu doar la persoane de sex masculin; „oamenii” este formularea românească firească și exactă.
- issue: Caracterul judiciar al expresiei λόγον ἀποδίδωμι
  choice: vor da socoteală
  alternative: vor da un răspuns; vor prezenta o justificare
  rationale: „A da socoteală” păstrează imaginea evaluării și răspunderii la judecată, fără a preciza în plus natura verdictului.
translation_notes:
  register: Română standard modernă, cu un ton demn și direct. „A da socoteală” este o expresie curentă și potrivită contextului solemn, iar ordinea propoziției păstrează accentul distributiv asupra fiecărui cuvânt.
