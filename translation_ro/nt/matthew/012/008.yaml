id: MAT.12.8
reference: Matthew 12:8
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: κύριος γάρ ἐστιν τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/008.yaml
  text: For the Son of Man is Lord of the Sabbath[a][b].
translation:
  language: ro
  text: Căci Fiul Omului este Domn al sabatului.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Fiul Omului este stăpân peste sabat”.'
    reason: Alternativă lexicală pentru κύριος și pentru relația exprimată prin genitiv.
  - marker: b
    text: „Fiul Omului” este autodenumirea caracteristică a lui Isus în Evanghelii; expresia ar putea fi înțeleasă mai generic drept „omul” sau „ființa umană”, dar o asemenea redare îi slăbește probabila rezonanță titulară.
    reason: Păstrează la vedere alternativa de interpretare a expresiei semitizante.
lexical_decisions:
- source_word: γάρ
  choice: Căci
  rationale: Păstrează valoarea explicativă prin care afirmația este legată de argumentul precedent și sună firesc într-un registru biblic modern.
- source_word: κύριος
  choice: Domn
  rationale: Redă direct autoritatea puternică exprimată de termen și îi păstrează greutatea cristologică, fără a adăuga sensuri care nu apar în text.
- source_word: τοῦ σαββάτου
  choice: al sabatului
  rationale: Genitivul dependent de κύριος este redat natural în română prin construcția „Domn al”. „Sabat” denumește aici ziua și instituția religioasă iudaică.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Păstrează autodenumirea caracteristică a lui Isus din Evanghelii și posibila ei rezonanță titulară și intertextuală, în loc să o reducă la o expresie generică despre om.
- source_word: ἐστιν
  choice: este
  rationale: Redă simplu și exact copula la timpul prezent.
theological_decisions:
- issue: Forța cristologică a expresiei κύριος ... τοῦ σαββάτου
  choice: „Fiul Omului este Domn al sabatului”
  alternative: „Fiul Omului este stăpân peste sabat”
  rationale: „Domn” păstrează atât afirmația fermă de autoritate, cât și greutatea teologică a lui κύριος; formularea nu extinde afirmația dincolo de raportul cu sabatul indicat de text.
- issue: Redarea expresiei ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Este tratată ca autodenumirea titulară „Fiul Omului”.
  alternative: „omul” sau „ființa umană”
  rationale: În contextul Evangheliilor, expresia funcționează ca autodenumire a lui Isus și poate purta rezonanțe apocaliptice și intertextuale; traducerea tradițională păstrează această tensiune fără a o explica excesiv.
translation_notes:
  register: Română standard modernă, clară și demnă. „Căci” menține legătura argumentativă, iar „sabatului” este scris cu literă mică potrivit uzului ortografic românesc curent. Formularea rămâne concisă și apropiată de ordinea și tensiunea textului grec.
