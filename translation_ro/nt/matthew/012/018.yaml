revisions:
- from: „Iată slujitorul meu, pe care l-am ales, preaiubitul meu, în care sufletul meu și-a găsit plăcerea.[a] Voi pune Duhul meu peste el, iar el va vesti dreptatea[b] neamurilor.[c]”
  to: „Iată slujitorul meu, pe care l-am ales, preaiubitul meu, în care sufletul meu și-a găsit plăcerea.[a] Voi pune Duhul meu peste el, iar el va vesti popoarelor dreptatea[b].[c]”
  rationale: Revizuirea clarifică funcția de destinatar a lui τοῖς ἔθνεσιν prin „va vesti popoarelor dreptatea”, fără a modifica sensul. Înlocuiește nota a cu o alternativă românească idiomatică pentru expresia εὐδόκησεν ἡ ψυχή μου și păstrează alternativele lexicale relevante pentru κρίσις și ἔθνη. Ancorele notelor sunt plasate după elementele la care se referă.
