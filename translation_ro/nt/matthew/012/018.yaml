  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: ro
  text: „Iată slujitorul meu, pe care l-am ales, preaiubitul meu, în care sufletul meu și-a găsit plăcerea.[a] Voi pune Duhul meu peste el, iar el va vesti popoarelor dreptatea[b].[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „în care îmi găsesc toată plăcerea”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „judecata”.'
    reason: lexical_alternative
  - marker: c
    text: 'Sau: „neamurilor”; termenul poate desemna și popoarele neevreiești.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Iată
  rationale: Păstrează chemarea profetică la atenție într-o formulare firească și demnă în româna actuală.
- source_word: παῖς
  choice: slujitor
  rationale: În contextul citatului din Isaia, termenul îl desemnează pe slujitorul ales al lui Dumnezeu; „copil” sau „fiu” ar estompa această legătură intertextuală.
- source_word: ᾑρέτισα
  choice: pe care l-am ales
  rationale: Perfectul compus redă firesc în română alegerea divină prezentată ca fapt împlinit.
- source_word: ὁ ἀγαπητός μου
  choice: preaiubitul meu
  rationale: Redă concis afecțiunea și demnitatea exprimate de ἀγαπητός, fără a introduce explicit termenul „Fiu”.
- source_word: εἰς ὃν εὐδόκησεν ἡ ψυχή μου
  choice: în care sufletul meu și-a găsit plăcerea
  rationale: Păstrează subiectul explicit „sufletul meu” și exprimă idiomatic bunăvoința și desfătarea divină.
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: Voi pune Duhul meu peste el
  rationale: Urmează îndeaproape imaginea greacă a învestirii profetice; „Duhul” este scris cu majusculă deoarece se referă la Duhul lui Dumnezeu.
- source_word: κρίσιν
  choice: dreptatea
  rationale: În misiunea slujitorului către popoare, termenul indică ordinea dreaptă a lui Dumnezeu, deși poate însemna și „judecată”.
- source_word: τοῖς ἔθνεσιν
  choice: neamurilor
  rationale: Redă sfera universală a citatului profetic și păstrează posibilitatea referirii la popoarele neevreiești.
- source_word: ἀπαγγελεῖ
  choice: va vesti
  rationale: Exprimă comunicarea publică și solemnă proprie contextului profetic, într-o formulare naturală în română.
theological_decisions:
- issue: Identitatea mesianică exprimată prin παῖς
  choice: „slujitor”
  alternative: „copil” sau „fiu”
  rationale: Contextul este cântarea slujitorului din Isaia. Alegerea păstrează această temă mesianică fără a importa în termenul de față filiația, care nu este explicită lexical aici.
- issue: Sensul lui κρίσις în misiunea către neamuri
  choice: „dreptatea” în textul principal
  alternative: „judecata”
  rationale: „Dreptatea” exprimă mai bine aici instaurarea și vestirea rânduielii drepte a lui Dumnezeu; nota păstrează sensul alternativ autentic de „judecată”.
- issue: Referentul lui πνεῦμά μου
  choice: „Duhul meu”
  alternative: „duhul meu”
  rationale: În vorbirea directă a lui Dumnezeu, expresia se referă la Duhul lui Dumnezeu; majuscula clarifică referentul fără a adăuga un titlu absent din text.
translation_notes:
  register: Registru modern, demn și accesibil, cu o ușoară solemnitate potrivită citatului profetic. Pronumele sunt scrise conform ortografiei curente, fără majuscule reverențiale; „Duhul” primește majusculă pentru identificarea referentului divin.
