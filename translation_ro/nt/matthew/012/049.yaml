id: MAT.12.49
reference: Matthew 12:49
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα αὐτοῦ ἐπὶ τοὺς μαθητὰς αὐτοῦ εἶπεν· Ἰδοὺ ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/049.yaml
  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: ro
  text: 'Și, întinzându-și mâna spre ucenicii săi, a spus: „Iată mama mea și frații mei!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτείνας
  choice: întinzându-și
  rationale: Redă firesc participiul aorist ca acțiune care însoțește verbul principal și păstrează gestul concret.
- source_word: τὴν χεῖρα αὐτοῦ
  choice: mâna
  rationale: În română, posesivitatea este exprimată idiomatic prin pronumele reflexiv din „întinzându-și”; sensul obișnuit al lui χείρ aici este „mână”.
- source_word: ἐπὶ τοὺς μαθητὰς αὐτοῦ
  choice: spre ucenicii săi
  rationale: Cu acuzativul, ἐπί indică direcția gestului; „ucenici” păstrează relația specifică dintre învățător și discipoli.
- source_word: εἶπεν
  choice: a spus
  rationale: Echivalent românesc curent și demn pentru verbul introductiv.
- source_word: Ἰδοὺ
  choice: Iată
  rationale: „Iată” este formula românească naturală de atragere a atenției și păstrează accentul demonstrativ al termenului grec.
- source_word: ἡ μήτηρ μου
  choice: mama mea
  rationale: Redare directă a termenului concret de rudenie.
- source_word: οἱ ἀδελφοί μου
  choice: frații mei
  rationale: Păstrează masculinul plural explicit din greacă, fără extinderea interpretativă la „frații și surorile” sau generalizarea la „familia mea”.
theological_decisions:
- issue: Limbajul familial prin care Isus îi identifică pe ucenici drept adevărata sa familie
  choice: Păstrarea termenilor concreți „mama mea” și „frații mei”
  alternative: O parafrază incluzivă precum „familia mea” sau „frații și surorile mele”
  rationale: Formularea concretă susține forța retorică a afirmației și nu introduce în text o extindere care nu este exprimată explicit de masculinul plural grec.
translation_notes:
  register: Română standard modernă, clară și demnă. Construcția participială păstrează ordinea și legătura dintre gest și rostire, iar „Iată” oferă solemnitate fără a suna arhaic.
