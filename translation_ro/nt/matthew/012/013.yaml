id: MAT.12.13
reference: Matthew 12:13
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τότε λέγει τῷ ἀνθρώπῳ· Ἔκτεινόν ⸂σου τὴν χεῖρα⸃· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ὑγιὴς ὡς ἡ ἄλλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: ro
  text: 'Atunci îi spune omului: „Întinde-ți mâna!” El și-a întins-o, iar mâna i s-a refăcut[a] și a devenit sănătoasă ca cealaltă[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „vindecată”; verbul grecesc accentuează readucerea la o stare corespunzătoare.
    reason: lexical_alternative
  - marker: b
    text: Literal, „sănătoasă ca cealaltă”; „cealaltă” se referă la cealaltă mână a omului.
    reason: lexical_clarification
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Marchează succesiunea narațiunii într-o formulare românească firească.
- source_word: λέγει
  choice: îi spune
  rationale: Păstrează prezentul istoric grecesc și vivacitatea relatării; pronumele „îi” redă destinatarul exprimat la dativ.
- source_word: τῷ ἀνθρώπῳ
  choice: omului
  rationale: În context este vorba despre bărbatul menționat anterior; „omului” este firesc în construcția românească „îi spune omului”.
- source_word: Ἔκτεινόν
  choice: Întinde-ți
  rationale: Redă imperativul direct și, împreună cu pronumele posesiv enclitic, formează expresia românească naturală pentru gestul cerut.
- source_word: σου τὴν χεῖρα
  choice: mâna
  rationale: χείρ denumește aici mâna, iar posesivul σου este redat idiomatic prin „-ți” în „Întinde-ți mâna”.
- source_word: ἐξέτεινεν
  choice: și-a întins-o
  rationale: Păstrează repetiția verbală dintre poruncă și răspuns, iar pronumele „o” indică limpede mâna.
- source_word: ἀπεκατεστάθη
  choice: a fost refăcută
  rationale: Verbul pasiv indică readucerea mâinii la starea ei corespunzătoare; „refăcută” păstrează ideea de restaurare și rămâne natural în română.
- source_word: ὑγιὴς
  choice: sănătoasă
  rationale: Redă direct starea de sănătate și funcționare normală descrisă de adjectiv.
- source_word: ὡς ἡ ἄλλη
  choice: ca și cealaltă
  rationale: Forma feminină subînțelege cealaltă mână; româna poate păstra natural acest referent implicit.
theological_decisions:
- issue: Natura descrierii vindecării
  choice: Mâna este descrisă ca fiind refăcută și sănătoasă, fără explicații doctrinare suplimentare.
  alternative: „a fost vindecată” sau „a fost făcută sănătoasă”
  rationale: Formularea păstrează atât nuanța de restaurare a verbului ἀποκαθίστημι, cât și afirmația explicită a stării sănătoase, fără a adăuga o interpretare teologică străină textului.
translation_notes:
  register: Română standard modernă, clară și demnă. Prezentul istoric a fost păstrat în „îi spune”, iar porunca și răspunsul folosesc formulări idiomatice actuale. Pronumele feminin „ea” are ca antecedent imediat „mâna”.
