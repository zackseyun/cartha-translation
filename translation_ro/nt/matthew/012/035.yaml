id: MAT.12.35
reference: Matthew 12:35
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ ἐκβάλλει ἀγαθά, καὶ ὁ πονηρὸς ἄνθρωπος ἐκ τοῦ πονηροῦ θησαυροῦ ἐκβάλλει πονηρά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: ro
  text: Omul bun scoate lucruri bune din comoara lui bună[a], iar omul rău scoate lucruri rele din comoara lui rea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Contextul imediat se referă la vorbire; de aceea, „lucruri bune” și „lucruri rele” pot desemna în special cuvintele rostite.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθὸς / ἀγαθά
  choice: bun / lucruri bune
  rationale: Păstrează repetiția lexicală și contrastul moral din greacă; adjectivul neutru plural substantivizat este redat firesc prin „lucruri bune”.
- source_word: ἄνθρωπος
  choice: omul
  rationale: „Omul” este echivalentul românesc natural pentru singularul reprezentativ ἄνθρωπος și se potrivește formulării proverbiale.
- source_word: θησαυροῦ
  choice: comoara
  rationale: Păstrează metafora unei rezerve lăuntrice din care ies lucrurile rostite sau făcute; „depozit” ar fi prea concret.
- source_word: ἐκβάλλει
  choice: scoate
  rationale: Redă concis și idiomatic ideea mișcării din interior spre exterior, fără forța excesivă a lui „aruncă”.
- source_word: πονηρὸς / πονηρά
  choice: rău / lucruri rele
  rationale: Păstrează paralelismul și contrastul moral cu „bun”, într-o română actuală și demnă.
- source_word: ἐκ
  choice: din
  rationale: Este prepoziția românească firească pentru originea lucrurilor scoase din comoară.
theological_decisions:
- issue: Sfera lucrurilor care ies din comoara lăuntrică
  choice: Formularea largă „lucruri bune/rele”
  alternative: Restrângerea explicită la „cuvinte bune/rele”
  rationale: Contextul imediat privește vorbirea, dar textul grec folosește adjective substantivizate fără un substantiv explicit. Traducerea păstrează astfel deschiderea expresiei, iar nota indică accentul contextual asupra cuvintelor.
translation_notes:
  register: Română standard modernă, cu paralelism proverbial clar. „Omul” este generic în română și nu necesită aici o notă separată de gen.
