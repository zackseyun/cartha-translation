id: MAT.12.34
reference: Matthew 12:34
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: γεννήματα ἐχιδνῶν, πῶς δύνασθε ἀγαθὰ λαλεῖν πονηροὶ ὄντες; ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας τὸ στόμα λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/034.yaml
  text: Offspring of vipers[b][a], how can you speak good things when you are evil? For out of the overflow of the heart the mouth speaks.
translation:
  language: ro
  text: Pui de vipere, cum puteți să spuneți lucruri bune, când sunteți răi? Căci din prisosul inimii vorbește gura.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Căci gura vorbește din ceea ce prisosește în inimă.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεννήματα ἐχιδνῶν
  choice: Pui de vipere
  rationale: γεννήματα desemnează ceea ce este născut sau produs, iar expresia redă metaforic originea și caracterul. „Pui de vipere” este o formulare românească firească, vie și demnă.
- source_word: πῶς δύνασθε
  choice: cum puteți
  rationale: Redă idiomatic întrebarea retorică despre incapacitatea morală, fără a o transforma într-o afirmație explicită.
- source_word: ἀγαθὰ λαλεῖν
  choice: să spuneți lucruri bune
  rationale: ἀγαθά este un plural neutru substantivizat; formularea păstrează sensul concret și este naturală în româna actuală.
- source_word: πονηροὶ ὄντες
  choice: când sunteți răi
  rationale: Construcția participială indică împrejurarea în care este pusă întrebarea, iar „răi” păstrează caracterizarea morală directă.
- source_word: ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας
  choice: Căci din prisosul inimii
  rationale: περίσσευμα poate desemna surplusul, abundența sau ceea ce dă pe dinafară. „Prisosul inimii” păstrează metafora și concizia originalului; o redare mai explicită este oferită în notă.
- source_word: τὸ στόμα λαλεῖ
  choice: vorbește gura
  rationale: Păstrează ordinea focalizată și personificarea simplă din greacă, într-o construcție românească inteligibilă.
theological_decisions:
- issue: Forța metaforică a termenului καρδία
  choice: inimii
  alternative: ființei lăuntrice; minții
  rationale: „Inima” păstrează termenul biblic pentru centrul lăuntric al gândirii, voinței și dispoziției morale, fără a-l restrânge doar la emoții.
- issue: Caracterizarea morală din πονηροὶ ὄντες
  choice: când sunteți răi
  alternative: fiind răi; pentru că sunteți răi
  rationale: „Răi” exprimă judecata morală a textului. „Când” păstrează valoarea circumstanțială fără să fixeze participiul exclusiv drept cauzal.
translation_notes:
  register: Română standard modernă, directă și solemnă fără arhaisme. Expresia „Pui de vipere” este idiomatică și păstrează asprimea mustrării. Nota explicitează metafora lui περίσσευμα fără a o suprainterpreta în textul principal.
