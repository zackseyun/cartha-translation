id: MAT.12.50
reference: Matthew 12:50
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ πατρός μου τοῦ ἐν οὐρανοῖς, αὐτός μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/050.yaml
  text: For whoever does the will of my Father in heaven[a], he is my brother and sister and mother.
translation:
  language: ro
  text: Căci oricine face voia Tatălui meu care este în ceruri, acela[a] îmi este frate, soră și mamă.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „acea persoană îmi este frate, soră și mamă”. Greaca folosește aici o formă gramaticală de masculin singular cu sens generic.'
    reason: alternativă lexicală și clarificarea masculinului generic
lexical_decisions:
- source_word: ὅστις ... ἂν
  choice: oricine
  rationale: Construcția relativă nehotărâtă cu ἄν exprimă o condiție generală și deschisă; „oricine” redă firesc această valoare în română.
- source_word: γὰρ
  choice: căci
  rationale: Păstrează legătura explicativă cu afirmația precedentă și se potrivește registrului demn al textului.
- source_word: ποιήσῃ
  choice: face
  rationale: Împreună cu θέλημα, verbul formează expresia firească „face voia”; „ascultă” ar restrânge interpretativ sensul.
- source_word: τὸ θέλημα
  choice: voia
  rationale: Păstrează formularea relațională și teologică a originalului fără parafrază.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: Tatălui meu care este în ceruri
  rationale: Redă explicit construcția atributivă și păstrează pluralul idiomatic οὐρανοῖς; formularea rămâne clară și naturală în română.
- source_word: αὐτός
  choice: acela
  rationale: Pronumele demonstrativ redă accentul pus asupra persoanei care împlinește voia Tatălui și păstrează forma masculină singulară cu valoare generică.
- source_word: ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ
  choice: frate, soră și mamă
  rationale: Păstrează separat toate cele trei roluri familiale și numărul singular din greacă.
- source_word: μου ... ἐστίν
  choice: îmi este
  rationale: Dativul posesiv este o construcție românească firească, păstrând sensul relațional al genitivului μου și copula la prezent.
theological_decisions:
- issue: Masculinul reprezentativ într-o afirmație generică
  choice: oricine ... acela îmi este frate, soră și mamă
  alternative: oricine ... acea persoană îmi este frate, soră și mamă
  rationale: Formele grecești ὅστις și αὐτός sunt la masculin singular, dar au aici sferă generică. „Oricine” face explicit caracterul deschis al afirmației, iar „acela” păstrează forma reprezentativă și accentul originalului; includerea expresă a „surorii” și a „mamei” confirmă că afirmația nu se limitează la bărbați.
translation_notes:
  register: Română standard modernă, clară și demnă. „Căci” păstrează legătura argumentativă, iar formularea „îmi este frate, soră și mamă” evită repetarea greoaie a posesivului. Majuscula este păstrată la titlul relațional „Tatăl”, dar pronumele posesive și personale referitoare la divinitate rămân cu literă mică, conform ortografiei curente și fără a impune o convenție confesională.
