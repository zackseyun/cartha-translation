  text: Ὁ δὲ Ἰησοῦς γνοὺς ἀνεχώρησεν ἐκεῖθεν. καὶ ἠκολούθησαν ⸀αὐτῷ πολλοί, καὶ ἐθεράπευσεν αὐτοὺς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/015.yaml
  text: But Jesus[a], knowing this, withdrew from there. And many followed him, and he healed them all,
translation:
  language: ro
  text: Dar Isus, aflând aceasta[a], S-a retras de acolo. Mulți L-au urmat, iar El i-a vindecat pe toți.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Dar Isus, știind, S-a retras de acolo.” În greacă, obiectul verbului „a ști” nu este exprimat; el se înțelege din versetul precedent.'
    reason: alternativă lexicală
lexical_decisions:
- source_word: γνοὺς
  choice: aflând aceasta
  rationale: Participiul aorist indică luarea la cunoștință anterioară acțiunii principale; „aceasta” trimite firesc la uneltirea fariseilor din versetul precedent, fără a o explicita excesiv.
- source_word: ἀνεχώρησεν
  choice: S-a retras
  rationale: În contextul opoziției, ἀναχωρέω exprimă o plecare deliberată din acel loc; „S-a retras” păstrează această nuanță mai bine decât simplul „a plecat”.
- source_word: ἐκεῖθεν
  choice: de acolo
  rationale: Redare românească directă și idiomatică a mișcării dinspre un loc.
- source_word: ἠκολούθησαν αὐτῷ πολλοί
  choice: Mulți L-au urmat
  rationale: Păstrează sensul simplu al lui πολλοί, fără a introduce noțiunea explicită de „mulțimi”, absentă din text.
- source_word: ἐθεράπευσεν
  choice: i-a vindecat
  rationale: În relatările evanghelice, θεραπεύω desemnează în mod firesc vindecarea bolnavilor.
- source_word: αὐτοὺς πάντας
  choice: pe toți
  rationale: Păstrează forța cuprinzătoare a lui πάντας într-o formulare românească naturală.
theological_decisions:
- issue: Obiectul implicit al participiului γνοὺς
  choice: „aflând aceasta”, cu referire contextuală la hotărârea ostilă din versetul precedent
  alternative: „știind” sau „aflând” fără obiect exprimat
  rationale: Greaca lasă obiectul neexprimat. Pronumele „aceasta” face legătura contextuală inteligibilă în română, fără a adăuga detalii doctrinare ori narative.
- issue: Nuanța plecării lui Isus
  choice: „S-a retras”
  alternative: „a plecat” sau „S-a dus”
  rationale: Redarea conservă ideea unei retrageri deliberate în fața opoziției, fără a sugera teamă sau lașitate.
translation_notes:
  register: Română standard modernă, clară și demnă. Pronumele referitoare la Isus sunt scrise cu majusculă conform uzului biblic românesc. Punctuația împarte firesc succesiunea acțiunilor, fără a schimba raporturile sintactice ale textului grec.
