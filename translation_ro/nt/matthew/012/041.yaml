id: MAT.12.41
reference: Matthew 12:41
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἄνδρες Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/041.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the preaching of Jonah, and behold[b], something greater than Jonah is here.
translation:
  language: ro
  text: Bărbații din Ninive se vor ridica la judecată împreună cu generația aceasta și o vor condamna, pentru că ei s-au pocăit ca răspuns la proclamarea lui Iona, și iată, aici este ceva mai mare decât Iona.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „aici este cineva mai mare decât Iona”. În greacă, expresia este la neutru, literal „ceva mai mare decât Iona”, ceea ce poate scoate în evidență realitatea mai mare prezentă în Isus, nu doar comparația dintre două persoane.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: Bărbații din Ninive
  rationale: Păstrează explicit substantivul masculin ἄνδρες și redă natural identificarea lor ca niniviteni.
- source_word: ἀναστήσονται
  choice: se vor ridica
  rationale: Redă viitorul lui ἀνίστημι și păstrează atât imaginea ridicării în cadrul judecății, cât și posibila rezonanță a învierii, fără a o explicita excesiv.
- source_word: ἐν τῇ κρίσει
  choice: la judecată
  rationale: Este formularea românească firească pentru participarea la evenimentul judiciar escatologic desemnat aici de κρίσις.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: împreună cu generația aceasta
  rationale: Păstrează sensul obișnuit al lui μετά cu genitivul, „cu”; opoziția este exprimată de verbul următor, „o vor condamna”.
- source_word: κατακρινοῦσιν αὐτήν
  choice: o vor condamna
  rationale: Redă direct sensul lui κατακρίνω, iar pronumele feminin are ca antecedent clar „generația aceasta”.
- source_word: μετενόησαν
  choice: s-au pocăit
  rationale: În contextul răspunsului la mesajul profetic, termenul românesc consacrat și precis este „s-au pocăit”.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: ca răspuns la proclamarea lui Iona
  rationale: Face limpede relația responsivă exprimată de εἰς după μετανοέω și redă κήρυγμα prin termenul demn și actual „proclamare”.
- source_word: ἰδοὺ
  choice: iată
  rationale: Este echivalentul românesc firesc, solemn și emfatic al markerului discursiv ἰδού.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: aici este ceva mai mare decât Iona
  rationale: Păstrează forma neutră a comparativului πλεῖον și ambiguitatea intenționată dintre persoana lui Isus și realitatea mai mare prezentă în persoana și lucrarea sa.
theological_decisions:
- issue: Redarea expresiei neutre πλεῖον Ἰωνᾶ ca referire la Isus
  choice: ceva mai mare decât Iona
  alternative: cineva mai mare decât Iona
  rationale: Greaca folosește neutrul πλεῖον, nu o formulare masculină care ar însemna simplu „un om mai mare”. Textul principal păstrează forma și tensiunea expresiei grecești, iar nota oferă alternativa personală firească.
- issue: Redarea genului în ἄνδρες Νινευῖται
  choice: Bărbații din Ninive
  alternative: Oamenii din Ninive
  rationale: Substantivul ἄνδρες este explicit masculin; traducerea nu îl neutralizează printr-un termen generic.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. „La judecată” și „iată” păstrează registrul biblic fără arhaizare. Formularea „ca răspuns la proclamarea” explicitează natural în română relația sintactică a lui εἰς, fără a adăuga un sens absent din sursă.
