id: MAT.12.22
reference: Matthew 12:22
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τότε ⸂προσηνέχθη αὐτῷ δαιμονιζόμενος τυφλὸς καὶ κωφός⸃· καὶ ἐθεράπευσεν αὐτόν, ὥστε τὸν ⸀κωφὸν λαλεῖν καὶ βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: ro
  text: Atunci I-a fost adus un om stăpânit de un demon, orb și care nu putea vorbi[a]. El l-a vindecat, astfel încât omul care nu putea vorbi a putut să vorbească și să vadă.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „surd”. Cuvântul grecesc poate desemna o persoană surdă sau una care nu poate vorbi; aici contextul favorizează incapacitatea de a vorbi, deoarece, după vindecare, omul poate să vorbească și să vadă.
    reason: Alternativă lexicală pentru κωφός și explicarea alegerii contextuale.
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Redă firesc marcatorul temporal care introduce următorul eveniment.
- source_word: προσηνέχθη αὐτῷ
  choice: I-a fost adus
  rationale: Păstrează construcția pasivă și faptul că agentul nu este precizat în greacă.
- source_word: δαιμονιζόμενος
  choice: stăpânit de un demon
  rationale: Păstrează explicit atribuirea demonică din text, într-o formulare românească limpede, fără a o înlocui cu o categorie clinică modernă.
- source_word: τυφλὸς
  choice: orb
  rationale: Echivalent lexical direct și natural.
- source_word: κωφός
  choice: care nu putea vorbi
  rationale: Termenul poate desemna surzenia sau incapacitatea de a vorbi; aici propoziția rezultatului menționează vorbirea și vederea, indicând incapacitatea de a vorbi.
- source_word: ἐθεράπευσεν αὐτόν
  choice: l-a vindecat
  rationale: Redare standard și transparentă în contextul unei vindecări relatate în Evanghelii.
- source_word: ὥστε
  choice: astfel încât
  rationale: Introduce clar rezultatul vindecării.
- source_word: τὸν κωφὸν λαλεῖν καὶ βλέπειν
  choice: omul care nu putea vorbi a putut să vorbească și să vadă
  rationale: Exprimă rezultatul ca restabilire a capacităților, fără a adăuga ideea explicită de început și fără a sugera doar un singur act de vedere.
theological_decisions:
- issue: Natura suferinței atribuite demonului
  choice: stăpânit de un demon
  alternative: bolnav mintal; chinuit
  rationale: Textul grec atribuie explicit starea omului unei influențe demonice; traducerea nu demitologizează și nu redefinește clinic afirmația.
- issue: Sensul lui κωφός în context
  choice: care nu putea vorbi
  alternative: surd; mut
  rationale: Deși termenul este ambiguu lexical, rezultatul vindecării specifică faptul că omul vorbește și vede. Nota păstrează deschisă alternativa lexicală «surd».
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea evită atât jargonul tehnic „demonizat”, cât și termenul posibil stigmatizant „mut”, păstrând totodată explicit limbajul demonic al sursei.
