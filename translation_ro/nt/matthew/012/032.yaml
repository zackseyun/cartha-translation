  source_fidelity: Textul redă fidel structura condițional-generalizatoare a grecei („oricine”), contrastul dintre vorbirea împotriva Fiului Omului și cea împotriva Duhului Sfânt, precum și contrastul temporal dintre veacul prezent și cel viitor. „Va fi iertat / nu va fi iertat” păstrează adecvat pasivul viitor, fără a adăuga un agent al iertării.
  naturalness: Româna este standard, limpede și potrivit de solemnă. „Va spune un cuvânt” este firesc pentru πρώτη expresie, iar „va vorbi împotriva” în a doua evită o repetare rigidă fără a pierde sensul. „Nici în veacul acesta, nici în cel viitor” este concis, inteligibil și reproduce elipsa substantivului din greacă.
  terminology: „Fiului Omului” și „Duhului Sfânt” sunt forme românești consacrate și adecvate. „Veac” redă bine αἰών în contrastul temporal-eshatologic și evită sugestia spațială a lui „lume”. Nota explică în mod util elipsa din a doua expresie.
