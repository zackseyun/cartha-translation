id: MAT.12.32
reference: Matthew 12:32
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: ro
  text: Și oricine va spune un cuvânt împotriva Fiului Omului, va fi iertat; dar oricine va vorbi împotriva Duhului Sfânt nu va fi iertat, nici în veacul acesta, nici în cel viitor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, mai explicit: „nici în veacul acesta, nici în veacul viitor”. În greacă, a doua apariție a cuvântului „veac” este subînțeleasă.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: oricine ... dar oricine
  rationale: Construcția relativă cu ἐάν/ἄν exprimă o condiție generală nedefinită; „oricine” redă firesc caracterul ei deschis și general.
- source_word: εἴπῃ λόγον
  choice: va spune un cuvânt
  rationale: Păstrează substantivul λόγον și redă idiomatic expresia greacă în româna actuală.
- source_word: κατὰ
  choice: împotriva
  rationale: Cu genitivul, în acest context, indică vorbire ostilă îndreptată împotriva cuiva.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Fiului Omului
  rationale: Păstrează titlul consacrat și rezonanțele sale mesianice și apocaliptice.
- source_word: ἀφεθήσεται αὐτῷ
  choice: va fi iertat
  rationale: Pasivul viitor este păstrat, iar româna permite referirea firească la persoana vinovată fără a reproduce rigid dativul grecesc.
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: Duhului Sfânt
  rationale: Este redarea standard, modernă și demnă a titlului.
- source_word: οὔτε ἐν τούτῳ τῷ αἰῶνι
  choice: nici în veacul acesta
  rationale: „Veac” redă sensul temporal și escatologic al lui αἰών, evitând sensul spațial sugerat de „lume”.
- source_word: οὔτε ἐν τῷ μέλλοντι
  choice: nici în cel viitor
  rationale: Păstrează elipsa greacă, în care substantivul „veac” este subînțeles din expresia precedentă, și rămâne limpede în română.
theological_decisions:
- issue: Contrastul temporal αἰών / μέλλων
  choice: nici în veacul acesta, nici în cel viitor
  alternative: nici în lumea aceasta, nici în lumea viitoare; nici în veacul acesta, nici în veacul care vine
  rationale: Textul contrastează epoca prezentă cu cea viitoare, nu două spații. Formularea păstrează cadrul escatologic fără a impune un sistem doctrinar anume și conservă elipsa din greacă.
- issue: Natura păcatului care nu va fi iertat
  choice: Avertismentul este păstrat fără o definiție doctrinară adăugată a vorbirii împotriva Duhului Sfânt.
  alternative: Identificarea explicită fie cu acuzația istorică adusă lucrărilor lui Isus, fie cu nepocăința finală.
  rationale: Versetul afirmă consecința, dar nu definește aici cu precizie teologică ulterioară natura faptei; traducerea nu trebuie să rezolve ceea ce textul lasă pentru context și interpretare.
translation_notes:
  register: Română standard modernă, cu registru solemn și accesibil. „Veac” a fost preferat lui „lume” pentru precizie temporală și escatologică; „cel viitor” păstrează concis elipsa originalului.
