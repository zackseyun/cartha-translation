id: MAT.12.37
reference: Matthew 12:37
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐκ γὰρ τῶν λόγων σου δικαιωθήσῃ, καὶ ἐκ τῶν λόγων σου καταδικασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/037.yaml
  text: For by your words you will be justified[a], and by your words you will be condemned.
translation:
  language: ro
  text: Căci pe baza cuvintelor tale vei fi declarat drept[a] și pe baza cuvintelor tale vei fi condamnat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „vei fi achitat” ori „vei fi găsit nevinovat”. Verbul grecesc are aici sens judiciar: a primi un verdict favorabil, a fi declarat în drept.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: pe baza
  rationale: Cu genitivul, ἐκ indică aici temeiul sau dovezile luate în considerare la judecată. Formularea românească „pe baza” exprimă firesc această valoare, fără a sugera că vorbele sunt agentul acțiunii.
- source_word: γάρ
  choice: căci
  rationale: Conjuncția introduce explicația avertismentului anterior despre vorbire; „căci” păstrează legătura argumentativă și registrul demn.
- source_word: λόγων
  choice: cuvintelor
  rationale: Pluralul λόγων desemnează rostirile persoanei. „Cuvintelor” este direct, natural și păstrează repetiția paralelă din greacă.
- source_word: σου
  choice: tale
  rationale: Pronumele la genitiv are valoare posesivă și determină „cuvintelor” în ambele propoziții.
- source_word: δικαιωθήσῃ
  choice: vei fi declarat drept
  rationale: Viitorul pasiv al lui δικαιόω are aici sens judiciar, confirmat de opoziția cu καταδικασθήσῃ. „Vei fi declarat drept” redă verdictul favorabil mai limpede în româna actuală decât formularea posibil ambiguă „vei fi îndreptățit”.
- source_word: καταδικασθήσῃ
  choice: vei fi condamnat
  rationale: Viitorul pasiv este judiciar și formează antiteza deliberată cu δικαιωθήσῃ. „Vei fi condamnat” este echivalentul românesc direct.
theological_decisions:
- issue: Sensul judiciar al lui δικαιόω în raport cu vorbirea și judecata
  choice: „vei fi declarat drept”, în sensul unui verdict favorabil pronunțat pe baza cuvintelor ca dovezi
  alternative: „vei fi achitat” sau „vei fi găsit nevinovat”
  rationale: Paralelismul cu „vei fi condamnat” impune un cadru judiciar. Redarea aleasă păstrează legătura lexicală și teologică mai largă a lui δικαιόω, fără a transforma versetul într-o formulare doctrinară mai amplă și fără a preciza dincolo de text raportul dintre dovezi și temeiul ultim al verdictului.
translation_notes:
  register: Română standard modernă, clară și demnă. Repetiția „pe baza cuvintelor tale” este păstrată pentru a reda paralelismul și accentul originalului. Expresia „declarat drept” evită sensul curent al lui „îndreptățit” ca persoană care are motive să facă sau să simtă ceva.
