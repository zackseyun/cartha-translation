id: MAT.12.9
reference: Matthew 12:9
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ μεταβὰς ἐκεῖθεν ἦλθεν εἰς τὴν συναγωγὴν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/009.yaml
  text: And departing from there, he went into their synagogue.
translation:
  language: ro
  text: Plecând de acolo, Isus a intrat în sinagoga lor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: (neredat separat)
  rationale: Conjuncția leagă episodul de relatarea precedentă; în româna narativă, succesiunea este redată natural fără un „și” inițial, evitând o formulare greoaie.
- source_word: μεταβὰς ἐκεῖθεν
  choice: Plecând de acolo
  rationale: Redă participiul aorist și adverbul de loc, păstrând atât tranziția, cât și punctul de plecare.
- source_word: ἦλθεν
  choice: a intrat
  rationale: În combinație cu εἰς și cu locul de destinație, exprimă natural deplasarea în interiorul sinagogii; românescul „a venit în” ar fi mai puțin firesc aici.
- source_word: εἰς τὴν συναγωγὴν
  choice: în sinagoga
  rationale: Prepoziția „în”, împreună cu verbul „a intrat”, păstrează direcția spre interior indicată de εἰς.
- source_word: συναγωγὴν
  choice: sinagoga
  rationale: Termen consacrat și exact pentru locul iudaic de adunare și cult din acest context.
- source_word: αὐτῶν
  choice: lor
  rationale: Păstrează pronumele posesiv plural fără a preciza mai mult decât spune textul cine sunt cei avuți în vedere.
theological_decisions:
- issue: Referentul expresiei „sinagoga lor”
  choice: Formularea neutră „sinagoga lor”
  alternative: „sinagoga fariseilor” sau „sinagoga iudeilor”
  rationale: Textul grecesc are numai pronumele αὐτῶν și nu identifică explicit grupul; traducerea nu introduce o precizare polemică ori sectară.
- issue: Subiectul neexprimat al verbului ἦλθεν
  choice: Numele „Isus” este exprimat pentru claritate în română
  alternative: „a intrat”, cu subiectul rămas implicit
  rationale: Greaca permite recuperarea subiectului din context. Exprimarea lui în română clarifică referentul fără a modifica sensul sau a rezolva vreo ambiguitate teologică autentică.
translation_notes:
  register: Română standard modernă, concisă și demnă. Construcția participială „Plecând de acolo” păstrează forma și tranziția narațiunii, iar „a intrat” este idiomatic și redă mișcarea spre interior.
