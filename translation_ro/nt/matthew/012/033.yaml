id: MAT.12.33
reference: Matthew 12:33
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἢ ποιήσατε τὸ δένδρον καλὸν καὶ τὸν καρπὸν αὐτοῦ καλόν, ἢ ποιήσατε τὸ δένδρον σαπρὸν καὶ τὸν καρπὸν αὐτοῦ σαπρόν· ἐκ γὰρ τοῦ καρποῦ τὸ δένδρον γινώσκεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: ro
  text: Ori faceți pomul bun și rodul lui bun, ori faceți[b] pomul rău și rodul lui rău[a]; căci pomul se cunoaște după rodul lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „stricat” ori „putred”; termenul grecesc poate desemna ceva alterat, corupt sau fără valoare.
    reason: lexical_alternative
  - marker: b
    text: Verbul repetat „faceți” poate avea aici sensul retoric de „socotiți” sau „arătați că este”, însă forma grecească este la imperativ.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσατε
  choice: faceți
  rationale: Păstrează imperativul aorist plural și paralelismul retoric al celor două enunțuri, fără a-l transforma interpretativ în „socotiți” sau „arătați că este”.
- source_word: τὸ δένδρον
  choice: pomul
  rationale: „Pom” este firesc în română când imaginea centrală este rodul și păstrează concret metafora.
- source_word: καλόν
  choice: bun
  rationale: Redă atât calitatea sănătoasă, cât și rezonanța morală a adjectivului καλός, fără a restrânge sensul la starea fizică.
- source_word: τὸν καρπόν
  choice: rodul
  rationale: „Rod” este echivalentul românesc consacrat și natural în această metaforă, fiind aplicabil atât literal, cât și figurat.
- source_word: σαπρόν
  choice: stricat
  rationale: „Stricat” poate descrie firesc atât pomul, cât și rodul și acoperă aria de sens „alterat, corupt, fără valoare” a lui σαπρός; evită formularea mai puțin naturală „pom putred” în paralel cu „rod putred”.
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: căci ... după rodul lui
  rationale: „Căci” păstrează raportul explicativ marcat de γάρ, iar „după rodul lui” redă idiomatic criteriul de recunoaștere exprimat prin ἐκ.
- source_word: γινώσκεται
  choice: se cunoaște
  rationale: Redă prezentul pasiv într-o formulare românească directă și tradițional inteligibilă, fără a adăuga un agent.
theological_decisions:
- issue: Forța imperativelor din metafora lui Isus
  choice: 'S-au păstrat imperativele directe: „faceți pomul...”'
  alternative: „Socotiți pomul...” / „Considerați pomul...” / „Arătați că pomul este...”
  rationale: Greaca are de două ori imperativul aorist ποιήσατε. Deși poate avea o forță retorică apropiată de „socotiți” ori „declarați”, păstrarea formei imperative conservă tensiunea și ascuțimea argumentului fără a decide în locul cititorului.
- issue: Valoarea metaforică a lui σαπρός
  choice: „stricat” atât despre pom, cât și despre rod
  alternative: „rău”, „putred”, „bolnav”
  rationale: Alegerea păstrează contrastul calitativ și posibila rezonanță morală, fără a limita termenul exclusiv la putrezire fizică ori la boală.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Paralelismul original este păstrat. „Pom” și „rod” formează o pereche idiomatică în română. Marcajele de notă apar în text, fiecare fiind asociat informației relevante.
