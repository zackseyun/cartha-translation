id: MAT.12.23
reference: Matthew 12:23
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἐξίσταντο πάντες οἱ ὄχλοι καὶ ἔλεγον· Μήτι οὗτός ἐστιν ὁ υἱὸς Δαυίδ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/023.yaml
  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: ro
  text: 'Toate mulțimile erau uimite și spuneau: „Nu cumva acesta este Fiul lui David?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Fiul lui David” este un titlu mesianic, referitor la eliberatorul regal promis din linia lui David.
    reason: cross_reference
  - marker: b
    text: 'Sau, redând întrebarea mai neutru: „Poate fi acesta Fiul lui David?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: erau uimite
  rationale: Imperfectul exprimă reacția continuă de uimire a mulțimilor; formularea este firească în româna actuală și păstrează intensitatea verbului fără o expresie susceptibilă de interpretare greșită.
- source_word: πάντες οἱ ὄχλοι
  choice: toate mulțimile
  rationale: Păstrează atât ideea de totalitate, cât și pluralul explicit al substantivului grecesc ὄχλοι.
- source_word: ἔλεγον
  choice: spuneau
  rationale: Imperfectul românesc redă caracterul continuu sau repetat al vorbirii în cadrul reacției colective.
- source_word: Μήτι
  choice: Oare nu
  rationale: Redă întrebarea ezitantă care tinde să anticipeze un răspuns negativ, fără a o transforma într-o negare categorică.
- source_word: ὁ υἱὸς Δαυίδ
  choice: Fiul lui David
  rationale: Păstrează forma titlului mesianic și rezonanța sa istorică și teologică, fără a-l înlocui cu o parafrază interpretativă.
theological_decisions:
- issue: Forța mesianică a expresiei „Fiul lui David”
  choice: Titlul „Fiul lui David” este păstrat în text.
  alternative: Mesia; moștenitorul promis al lui David
  rationale: Textul grecesc folosește titlul propriu-zis; păstrarea lui evită rezolvarea prin parafrază a semnificației sale istorice și teologice.
- issue: Orientarea întrebării introduse prin Μήτι
  choice: „Oare nu este acesta...?” păstrează ezitarea și așteptarea probabilă a unui răspuns negativ.
  alternative: „Poate fi acesta...?”
  rationale: Alternativa este mai neutră, dar poate pierde forța pragmatică negativă a particulei Μήτι. Formularea aleasă păstrează tensiunea dintre uimirea mulțimilor și reținerea lor de a afirma deschis identitatea mesianică.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. „Toate mulțimile” păstrează pluralul grecesc, deși „toată mulțimea” ar fi mai idiomatic în unele contexte. Marcajele notelor sunt așezate după întreaga întrebare la care se referă.
