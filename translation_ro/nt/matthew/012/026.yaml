id: MAT.12.26
reference: Matthew 12:26
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: ro
  text: Și, dacă Satan îl alungă pe Satan[a], este dezbinat împotriva lui însuși[b]. Atunci cum va dăinui împărăția lui?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „îl scoate afară pe Satan”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „a fost dezbinat împotriva lui însuși”.'
    reason: lexical_alternative
  - marker: c
    text: 'Literal: „cum va sta în picioare împărăția lui?”; sau, ca sens: „cum poate dăinui împărăția lui?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἰ
  choice: Și, dacă
  rationale: Păstrează atât conjuncția καί, care leagă afirmația de argumentul precedent, cât și condiția introdusă prin εἰ.
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: Satan
  rationale: Folosește forma consacrată în română a numelui sau titlului personal Σατανᾶς, fără a-l înlocui cu o interpretare precum „Adversarul”.
- source_word: ἐκβάλλει
  choice: îl alungă
  rationale: Redă firesc ideea de izgonire sau expulzare proprie verbului ἐκβάλλω în acest context; alternativa mai literală este consemnată în notă.
- source_word: ἐφ’ ἑαυτὸν
  choice: împotriva lui însuși
  rationale: Păstrează ideea opoziției interne exprimată de ἐπί împreună cu pronumele reflexiv.
- source_word: ἐμερίσθη
  choice: este dezbinat
  rationale: Aoristul pasiv exprimă în argument starea rezultată din acțiunea ipotetică. Prezentul românesc face limpede rezultatul actual, iar valoarea verbală mai strict trecută este păstrată în notă.
- source_word: πῶς οὖν
  choice: Atunci cum
  rationale: Redă clar atât întrebarea introdusă prin πῶς, cât și concluzia logică semnalată de οὖν.
- source_word: σταθήσεται
  choice: va dăinui
  rationale: În acest context, viitorul lui ἵστημι are sensul de a rămâne întemeiat sau de a continua să existe. „Va dăinui” este natural în română, iar metafora mai literală este oferită în notă.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: împărăția lui
  rationale: „Împărăția” redă aici βασιλεία ca domeniu aflat sub stăpânirea lui Satan și se potrivește imaginii unei stăpâniri dezbinate.
theological_decisions:
- issue: Sensul dezbinării lui Satan împotriva lui însuși
  choice: 'Versetul rămâne un argument prin reducere la absurd: dacă Satan l-ar alunga pe Satan, propria lui împărăție ar fi dezbinată și nu ar putea dăinui.'
  alternative: Textul ar putea fi parafrazat prin imaginea mai largă a unei case dezbinate, prezentă în context.
  rationale: Greaca formulează direct opoziția internă și imposibilitatea stabilității împărăției lui Satan. Traducerea nu adaugă imagini sau explicații care nu apar în verset.
translation_notes:
  register: Română standard modernă, demnă și ușor de înțeles. Formularea păstrează repetiția intenționată a numelui „Satan”, logica ipotetică a originalului și metafora stabilității împărăției, fără adaos confesional.
