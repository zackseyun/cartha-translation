  yaml_path: translation/nt/matthew/012/016.yaml
  text: And he warned them not to make him known,[a]
translation:
  language: ro
  text: Și le-a poruncit cu asprime să nu-l facă cunoscut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „i-a avertizat cu asprime” ori „i-a mustrat”.'
    reason: 'Alternativă lexicală: ἐπιτιμάω poate desemna, în funcție de context, o poruncă sau avertizare severă ori o mustrare.'
lexical_decisions:
- source_word: καὶ
  choice: Și
  rationale: Păstrează legătura coordonatoare simplă cu narațiunea precedentă, fără a adăuga o nuanță temporală sau cauzală.
- source_word: ἐπετίμησεν
  choice: le-a poruncit cu asprime
  rationale: În acest context, verbul introduce o interdicție fermă. Formularea redă intensitatea lui ἐπιτιμάω fără a sugera neapărat că cei vizați erau mustrați pentru o vină deja comisă.
- source_word: αὐτοῖς
  choice: le
  rationale: Pronumele românesc la dativ plural redă natural referirea la persoanele menționate în context.
- source_word: ἵνα μὴ
  choice: să nu
  rationale: După un verb de poruncă, construcția românească exprimă firesc conținutul interdicției redate de ἵνα cu μή și conjunctivul.
- source_word: φανερὸν αὐτὸν ποιήσωσιν
  choice: să nu-l facă cunoscut
  rationale: Expresia φανερὸν ποιέω înseamnă a face cunoscut sau public; formularea păstrează obiectul personal αὐτόν și rămâne naturală în româna actuală.
theological_decisions:
- issue: Natura directivei lui Isus privind publicitatea
  choice: O poruncă fermă de a nu-l face cunoscut
  alternative: O mustrare adresată celor vizați sau un simplu avertisment
  rationale: Construcția indică o directivă puternică, dar versetul nu precizează motivul teologic al discreției. Traducerea păstrează această tensiune și nu adaugă o explicație absentă din text.
translation_notes:
  register: Română standard modernă, clară și demnă. „Le-a poruncit cu asprime” comunică fermitatea directivei fără a folosi o formulare arhaică; nota păstrează gama semantică autentică a verbului grec.
