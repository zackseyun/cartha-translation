  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ἄνθρωπος χεῖρα ἔχων ξηράν. καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Εἰ ἔξεστι τοῖς σάββασιν ⸀θεραπεύειν; ἵνα κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
translation:
  language: ro
  text: 'Și iată că era un om cu o mână uscată. Ei l-au întrebat: „Este îngăduit să vindeci în zilele de Sabat[a]?” — ca să-l acuze.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greaca are pluralul „în zilele de Sabat”, o exprimare obișnuită pentru zilele de Sabat; idiomatic, se poate reda și „în ziua de Sabat” sau „sâmbăta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: iată că
  rationale: Păstrează rolul de marcator discursiv care atrage atenția asupra scenei, într-o formulare românească firească și demnă.
- source_word: ἄνθρωπος
  choice: un om
  rationale: În context, substantivul la singular desemnează un bărbat concret; „un om” este redarea românească naturală și exactă.
- source_word: χεῖρα ἔχων ξηράν
  choice: cu o mână uscată
  rationale: Redă firesc construcția participială și păstrează imaginea lui ξηράν, fără a preciza în mod nejustificat diagnosticul exact.
- source_word: ἐπηρώτησαν αὐτὸν λέγοντες
  choice: l-au întrebat
  rationale: Româna nu are nevoie de dublarea literală „l-au întrebat, spunând”; formularea concentrează natural cele două elemente fără pierdere de sens.
- source_word: ἔξεστι
  choice: este îngăduit
  rationale: Exprimă permisiunea în cadrul unei controverse despre Lege și are un registru actual, demn, fără a sugera doar o permisiune socială.
- source_word: τοῖς σάββασιν
  choice: în zilele de Sabat
  rationale: Păstrează forma de plural a grecei într-o expresie românească inteligibilă, referitoare la zilele de Sabat în general.
- source_word: θεραπεύειν
  choice: să vindeci
  rationale: Este verbul românesc firesc pentru refacerea sănătății în relatările evanghelice și nu restrânge sensul la un procedeu medical.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: ca să-l poată acuza
  rationale: Redă scopul ostil al întrebării și sensul juridic-adversativ al verbului κατηγορέω; „poată” exprimă faptul că urmăreau să găsească un temei de acuzație.
theological_decisions:
- issue: Redarea pluralului expresiei despre Sabat într-un context de controversă juridico-religioasă
  choice: în zilele de Sabat
  alternative: în ziua de Sabat / sâmbăta
  rationale: Greaca folosește dativul plural τοῖς σάββασιν. Textul principal păstrează pluralul într-o formulare românească naturală, iar nota arată că acesta poate funcționa idiomatic cu sensul general de „în ziua de Sabat”.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. „Iată că” păstrează vivacitatea narațiunii, iar „este îngăduit” susține cadrul juridico-religios. Imaginea „mână uscată” este păstrată pentru fidelitate față de sursă, fără impunerea unui diagnostic modern.
