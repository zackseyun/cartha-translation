id: MAT.12.7
reference: Matthew 12:7
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: ro
  text: 'Dar, dacă ați fi înțeles ce înseamnă: „Milă doresc, nu jertfă”[a], nu i-ați fi condamnat pe cei nevinovați[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isus citează din Osea 6:6.
    reason: cross_reference
  - marker: b
    text: 'Sau: „pe cei fără vină”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: ați fi înțeles
  rationale: În condiția ireală, forma redă firesc în română o înțelegere care ar fi trebuit să existe deja; „ați fi cunoscut” ar suna mai puțin idiomatic în raport cu sensul citatului.
- source_word: τί ἐστιν
  choice: ce înseamnă
  rationale: Expresia introduce explicarea sensului unui text scripturistic, nu identificarea lui.
- source_word: Ἔλεος
  choice: milă
  rationale: „Milă” este echivalentul românesc direct și consacrat al lui ἔλεος, păstrând ideea de compasiune activă fără a o extinde interpretativ.
- source_word: θέλω
  choice: doresc
  rationale: „Doresc” păstrează registrul demn al citatului profetic și exprimă adecvat preferința voită.
- source_word: θυσίαν
  choice: jertfă
  rationale: „Jertfă” este termenul biblic românesc natural pentru sacrificiul cultic și păstrează singularul grecesc.
- source_word: κατεδικάσατε
  choice: i-ați fi condamnat
  rationale: Condiționalul perfect redă apodoza contrafactuală, iar „condamnat” păstrează forța juridică a verbului.
- source_word: ἀναιτίους
  choice: cei nevinovați
  rationale: „Nevinovați” este natural în româna actuală și păstrează sensul juridic de persoane lipsite de vină; alternativa „fără vină” este indicată în notă.
theological_decisions:
- issue: Redarea citatului din Osea 6:6 fără a elimina tensiunea dintre milă și jertfă
  choice: „Milă doresc, nu jertfă”
  alternative: „Milă vreau, iar nu jertfă”
  rationale: Formularea păstrează contrastul categoric al textului grecesc și prioritatea profetică acordată milei, fără a adăuga o explicație care ar afirma sau ar nega în mod general legitimitatea jertfelor.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Topica este naturală, iar citatul profetic rămâne concis și memorabil. Markerii notelor sunt plasați lângă elementele la care se referă.
