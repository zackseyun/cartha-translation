id: MAT.12.24
reference: Matthew 12:24
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: ro
  text: 'Dar fariseii, când au auzit aceasta, au spus: „Omul acesta nu alungă demonii decât prin Beelzebul[a], conducătorul demonilor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Beelzebul: tradițional „Beelzebub”.'
    reason: Formă alternativă tradițională a numelui.
lexical_decisions:
- source_word: δὲ
  choice: Dar
  rationale: Redă contrastul dintre reacția fariseilor și reacția pozitivă din contextul precedent.
- source_word: ἀκούσαντες
  choice: când au auzit aceasta
  rationale: Participiul aorist are aici valoare temporală; „aceasta” explicitează în mod firesc obiectul subînțeles din context.
- source_word: Οὗτος
  choice: Omul acesta
  rationale: Păstrează tonul distant și disprețuitor al demonstrativului, într-o formulare românească naturală.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: scoate demonii
  rationale: Este o redare directă, clară și firească în contextul alungării demonilor.
- source_word: εἰ μὴ
  choice: decât
  rationale: În construcția negativă românească, „nu... decât” exprimă limpede mijlocul unic pretins de farisei.
- source_word: ἐν τῷ Βεελζεβοὺλ
  choice: prin Beelzebul
  rationale: Prepoziția ἐν indică aici mijlocul sau agentul; „prin” păstrează acuzația fără a adăuga explicit sintagma „prin puterea lui”.
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: Transliterează forma numelui din textul grec SBLGNT; forma tradițională alternativă este menționată în notă.
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: conducătorul demonilor
  rationale: Redă autoritatea exprimată de ἄρχων într-un limbaj modern și ușor de înțeles.
theological_decisions:
- issue: Forța demonstrativului ostil Οὗτος
  choice: Omul acesta
  alternative: Acesta
  rationale: Formularea păstrează disprețul contextual fără a introduce o interpretare doctrinară suplimentară.
- issue: Forma numelui Βεελζεβούλ
  choice: Beelzebul
  alternative: Beelzebub
  rationale: Textul principal urmează forma greacă din ediția-sursă, iar forma tradițională familiară este păstrată în nota de subsol.
- issue: Sensul instrumental sau de agenție al expresiei ἐν τῷ Βεελζεβοὺλ
  choice: prin Beelzebul
  alternative: cu ajutorul lui Beelzebul
  rationale: „Prin” păstrează concizia și ambiguitatea firească dintre agent și puterea exercitată, fără să explice mai mult decât spune textul.
translation_notes:
  register: Română standard modernă, clară și demnă. Replica păstrează tonul acuzator și ușor disprețuitor al fariseilor, fără arhaisme și fără amplificări doctrinare.
