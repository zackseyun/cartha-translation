id: MAT.12.39
reference: Matthew 12:39
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/039.yaml
  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
translation:
  language: ro
  text: 'Dar el le-a răspuns: „O generație rea și adulteră[a] caută un semn, dar nu i se va da niciun semn, în afară de semnul profetului Iona[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Adulteră” poate evoca atât adulterul propriu-zis, cât și infidelitatea față de Dumnezeu; profeții folosesc imaginea adulterului pentru necredincioșia spirituală.
    reason: cross_reference
  - marker: b
    text: 'Sau: „semnul lui Iona, profetul”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: le-a răspuns
  rationale: Redă firesc în româna actuală formula narativă grecească alcătuită din participiu și verb finit, fără a produce formularea greoaie „răspunzând, le-a zis”.
- source_word: Γενεὰ
  choice: generație
  rationale: Păstrează sensul colectiv al grupului contemporan caracterizat moral și este limpede în româna modernă.
- source_word: πονηρὰ
  choice: rea
  rationale: Este echivalentul direct și firesc, păstrând forța condamnării morale fără intensificări adăugate.
- source_word: μοιχαλὶς
  choice: adulteră
  rationale: Păstrează metafora pregnantă a adulterului și posibila ei rezonanță profetică privind infidelitatea față de Dumnezeu, fără a o reduce la parafraza interpretativă „necredincioasă”.
- source_word: σημεῖον
  choice: semn
  rationale: Redă termenul în sensul său larg, fără a adăuga calificativul „miraculos”, absent din greacă.
- source_word: ἐπιζητεῖ
  choice: caută
  rationale: Este o redare directă și naturală; contextul exprimă deja caracterul reprobabil al cererii, astfel că „pretinde” ar interpreta mai mult decât spune forma lexicală.
- source_word: οὐ δοθήσεται αὐτῇ
  choice: nu i se va da niciun semn
  rationale: Păstrează viitorul pasiv și raportarea pronumelui feminin la substantivul colectiv „generație”, într-o construcție românească firească.
- source_word: εἰ μὴ
  choice: în afară de
  rationale: În construcția negativă, exprimă clar excepția introdusă de greacă.
- source_word: τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου
  choice: semnul profetului Iona
  rationale: Este o formulare românească naturală și fidelă, care nu explică prematur în ce constă semnul.
theological_decisions:
- issue: Sensul calificativului μοιχαλὶς în mustrarea lui Isus
  choice: adulteră
  alternative: necredincioasă
  rationale: Termenul concret păstrează simultan acuzația morală și ecoul imaginii profetice a infidelității față de legământ, fără a decide exclusiv în favoarea uneia dintre dimensiuni.
- issue: Natura „semnului profetului Iona”
  choice: Expresia este păstrată fără explicație în textul principal.
  alternative: un semn asemenea experienței lui Iona
  rationale: Versetul introduce expresia, iar contextul imediat îi dezvoltă sensul. O parafrază aici ar impune anticipat o interpretare.
translation_notes:
  register: Română standard modernă, clară și demnă. Sintaxa evită atât arhaismul „răspunzând, a zis”, cât și parafrazele care ar diminua caracterul metaforic sau ambiguitatea expresiei despre Iona.
