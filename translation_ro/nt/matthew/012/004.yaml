id: MAT.12.4
reference: Matthew 12:4
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸂ἔφαγον, ὃ⸃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ, εἰ μὴ τοῖς ἱερεῦσιν μόνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/004.yaml
  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: ro
  text: cum a intrat în casa lui Dumnezeu și au mâncat[b] pâinile punerii înainte[a], pe care nu le era îngăduit să le mănânce nici lui, nici celor ce erau cu el, ci numai preoților?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „pâinile Prezenței”, adică pâinile consacrate așezate înaintea lui Dumnezeu.'
    reason: lexical_alternative
  - marker: b
    text: Unele manuscrise au „a mâncat”, nu „au mâncat”.
    reason: textual_variant
lexical_decisions:
- source_word: πῶς
  choice: cum
  rationale: Introduce în mod firesc, în română, conținutul relatării invocate de Isus.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: a intrat în Casa lui Dumnezeu
  rationale: Redă direct mișcarea exprimată de εἰσέρχομαι cu εἰς și păstrează formularea sacră a textului, fără a o înlocui contextual cu „Cort” sau „sanctuar”.
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: pâinile punerii înainte
  rationale: Păstrează expresia cultică grecească și terminologia biblică românească pentru pâinile consacrate așezate înaintea lui Dumnezeu; sensul este lămurit în nota [a].
- source_word: ἔφαγον
  choice: au mâncat
  rationale: Urmează forma de plural tipărită în SBLGNT și se potrivește cu menționarea ulterioară a celor care erau cu David; varianta la singular este consemnată în nota [b].
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν
  choice: pe care nici el ... nu aveau voie să le mănânce
  rationale: Construcția românească exprimă limpede lipsa permisiunii legale sau cultice, iar reluarea prin „le” este cerută de uzul firesc al limbii.
- source_word: οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: nici cei ce erau cu el
  rationale: Redare apropiată și naturală, fără a preciza mai mult decât spune textul despre însoțitorii lui David.
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: ci numai preoții
  rationale: Redă idiomatic excepția introdusă de εἰ μή și exclusivitatea lui μόνοις.
theological_decisions:
- issue: Forța cultică și legală a expresiei ἐξὸν ἦν
  choice: „nu aveau voie” în contextul restricției privitoare la pâinile consacrate
  alternative: „nu le era îngăduit” / „nu era legal”
  rationale: Formularea aleasă este modernă și ușor de înțeles, dar contextul și excepția rezervată preoților păstrează caracterul sacru și normativ al interdicției, fără a o reduce la o simplă convenție socială.
- issue: Subiectul textual al verbului ἔφαγον
  choice: Pluralul „au mâncat” în textul principal
  alternative: Singularul „a mâncat”
  rationale: Textul SBLGNT furnizat are forma de plural, care îi include pe David și pe cei aflați cu el. Varianta la singular este relevantă și este păstrată în nota [b], fără a armoniza tacit textul.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. „Casa lui Dumnezeu” păstrează formularea sursei, iar „pâinile punerii înainte” conservă termenul cultic, explicat pentru cititorul contemporan. Topica „nici el, nici cei ce erau cu el nu aveau voie” evită rigiditatea unei calchieri, menținând totodată raportul dintre David, însoțitorii lui și permisiunea rezervată preoților.
