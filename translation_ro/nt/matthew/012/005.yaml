id: MAT.12.5
reference: Matthew 12:5
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἢ οὐκ ἀνέγνωτε ἐν τῷ νόμῳ ὅτι τοῖς σάββασιν οἱ ἱερεῖς ἐν τῷ ἱερῷ τὸ σάββατον βεβηλοῦσιν καὶ ἀναίτιοί εἰσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/005.yaml
  text: Or have you not read in the Law that on the Sabbaths the priests in the temple profane the Sabbath and are guiltless?[a][b][c]
translation:
  language: ro
  text: Sau n-ați citit în Lege[c] că, în zilele de sabat[b], preoții profanează[a] sabatul în Templu și sunt nevinovați?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „încalcă sabatul”. Verbul grecesc are sensul de a trata ceva sfânt ca fiind obișnuit sau profan.
    reason: lexical_alternative
  - marker: b
    text: Literal, „în sabate”; pluralul grecesc se referă probabil la ocaziile repetate de sabat.
    reason: lexical_alternative
  - marker: c
    text: „Legea” se referă aici la Legea lui Moise, parte a Scripturii, probabil la rânduielile despre slujirea preoților în ziua de sabat (vezi Numeri 28:9–10).
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Sau
  rationale: Introduce un al doilea argument scripturistic în replica lui Isus și păstrează legătura retorică simplă din greacă.
- source_word: οὐκ ἀνέγνωτε
  choice: n-ați citit
  rationale: Formularea firească în româna actuală păstrează întrebarea retorică specifică Evangheliei după Matei.
- source_word: ἐν τῷ νόμῳ
  choice: în Lege
  rationale: Majuscula arată că este vorba despre Legea mozaică, privită ca parte a Scripturii, nu despre lege în sens abstract.
- source_word: τοῖς σάββασιν
  choice: în zilele de sabat
  rationale: Redă pluralul grecesc și sugerează situațiile repetate de sabat, evitând totodată o construcție românească rigidă precum „în sabate”.
- source_word: οἱ ἱερεῖς
  choice: preoții
  rationale: Redare directă a slujitorilor preoțești care își îndeplineau îndatoririle la Templu.
- source_word: ἐν τῷ ἱερῷ
  choice: din Templu
  rationale: În context, construcția românească identifică firesc preoții care slujesc în incinta Templului; ἱερόν desemnează complexul Templului, nu doar sanctuarul interior.
- source_word: τὸ σάββατον
  choice: sabatul
  rationale: Păstrează singularul, care desemnează ziua sau instituția sabatului ca obiect al verbului.
- source_word: βεβηλοῦσιν
  choice: profanează
  rationale: Păstrează sensul puternic de a trata drept comun sau profan și tensiunea provocatoare a afirmației lui Isus; „încalcă” rămâne o alternativă explicativă.
- source_word: ἀναίτιοί εἰσιν
  choice: sunt nevinovați
  rationale: Exprimă clar lipsa culpabilității și contrastează direct cu verbul puternic „profanează”.
theological_decisions:
- issue: Dacă afirmația despre acțiunea preoților trebuie atenuată pentru a nu sugera o încălcare reală a sabatului
  choice: Se păstrează formularea puternică „profanează sabatul”, alături de „sunt nevinovați”.
  alternative: „încalcă sabatul și nu sunt vinovați” sau o parafrază care explică din text că slujirea lor este permisă
  rationale: 'Greaca menține deliberat tensiunea: lucrarea preoțească din ziua de sabat poate fi descrisă printr-un verb foarte puternic, dar preoții nu poartă vină. Traducerea nu rezolvă sau atenuează această tensiune.'
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „În zilele de sabat” este mai natural decât pluralul literal „în sabate”, iar „profanează” păstrează forța și tensiunea textului-sursă. Majusculele din „Lege” și „Templu” marchează referenții religioși istorici specifici.
