  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: ro
  text: Cine nu este cu mine este împotriva mea, iar cine nu adună cu mine risipește.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: cine nu este
  rationale: Construcția articulată cu participiu are sens substantival și generic. În româna actuală, „cine nu este” redă firesc această referire generală la orice persoană, fără formularea greoaie „cel care nu este”.
- source_word: μετ’ ἐμοῦ
  choice: cu mine
  rationale: μετά cu genitivul exprimă asocierea sau alinierea. „Cu mine” este echivalentul direct și păstrează deschisă dimensiunea relațională a afirmației.
- source_word: κατ’ ἐμοῦ
  choice: împotriva mea
  rationale: κατά cu genitivul exprimă aici opoziția; „împotriva mea” este formularea românească limpede și exactă.
- source_word: συνάγων
  choice: adună
  rationale: Verbul denumește acțiunea de a strânge laolaltă. „Adună” este concis și păstrează posibila imagine pastorală ori a recoltei fără să o precizeze excesiv.
- source_word: σκορπίζει
  choice: risipește
  rationale: „Risipește” redă acțiunea contrară adunării și formează în română o antiteză naturală cu „adună”; obiectul rămâne neexprimat, ca în greacă.
- source_word: καὶ
  choice: iar
  rationale: Conjuncția leagă două afirmații paralele. „Iar” exprimă coordonarea și pune în relief paralelismul fără a introduce un contrast adversativ propriu-zis.
theological_decisions:
- issue: Caracterul absolut al antitezei formulate de Isus
  choice: 'Afirmația este redată fără atenuare: lipsa alinierii cu Isus este opoziție față de el, iar lipsa participării la adunare duce la risipire.'
  alternative: O parafrază care ar slăbi opoziția categorică sau ar explica doctrinar ce anume este adunat și risipit.
  rationale: Textul grec conține două propoziții paralele și categorice, fără nuanțări. Traducerea păstrează tensiunea și nu adaugă o identificare a obiectului implicit.
translation_notes:
  register: Română standard modernă, concisă și demnă. Repetiția „cu mine” și opoziția „adună—risipește” păstrează structura retorică a originalului. Nu este necesară o notă pentru alternanța dintre „cine” și „cel care”, deoarece aceasta este stilistică și nu schimbă sensul.
