  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: πόσῳ οὖν διαφέρει ἄνθρωπος προβάτου. ὥστε ἔξεστιν τοῖς σάββασιν καλῶς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/012.yaml
  text: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
translation:
  language: ro
  text: Cu cât mai de preț este, deci, un om decât o oaie! Așadar, este îngăduit să faci bine în zilele de sabat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, „în sabate”; pluralul grecesc este folosit în mod obișnuit și cu sensul „în ziua de sabat”.
    reason: Clarificarea pluralului idiomatic din greacă.
lexical_decisions:
- source_word: πόσῳ οὖν
  choice: Cu cât este deci mai
  rationale: Construcția introduce un argument de la mai puțin la mai mult, iar „deci” păstrează legătura logică cu exemplul precedent.
- source_word: διαφέρει
  choice: de preț
  rationale: În context, verbul indică superioritatea valorii omului față de oaie, nu o simplă deosebire.
- source_word: ἄνθρωπος
  choice: un om
  rationale: Redă substantivul singular cu sens generic și păstrează contrastul direct cu „o oaie”.
- source_word: προβάτου
  choice: decât o oaie
  rationale: Genitivul marchează termenul comparației, exprimat firesc în română prin „decât”.
- source_word: ὥστε
  choice: Așadar
  rationale: Introduce concluzia dedusă din comparația precedentă.
- source_word: ἔξεστιν
  choice: este îngăduit
  rationale: Păstrează nuanța de permisiune legitimă în contextul disputei despre legea sabatului.
- source_word: τοῖς σάββασιν
  choice: în zilele de sabat
  rationale: Redă pluralul grecesc într-o formulare românească firească; pluralul poate funcționa idiomatic cu referire la respectarea sabatului.
- source_word: καλῶς ποιεῖν
  choice: să faci bine
  rationale: Expresie românească naturală și apropiată de idiomul grecesc pentru săvârșirea binelui.
theological_decisions:
- issue: Sensul comparativ al valorii omului
  choice: mai de preț ... decât o oaie
  alternative: se deosebește ... de o oaie
  rationale: Contextul argumentului de la oaie la om cere o comparație de valoare, fără a adăuga o explicație doctrinară străină textului.
- issue: Redarea pluralului referitor la sabat
  choice: în zilele de sabat
  alternative: în ziua de sabat
  rationale: Textul principal păstrează valoarea plurală a formei grecești într-o română naturală, iar nota semnalează atât forma literală, cât și folosirea ei idiomatică.
- issue: Caracterul legal al concluziei
  choice: este îngăduit
  alternative: este permis
  rationale: „Îngăduit” exprimă adecvat legitimitatea acțiunii în cadrul controversei despre sabat, fără a sugera doar permisiunea omenească.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Exclamația redă forța retorică a comparației, iar „Așadar” marchează limpede concluzia.
