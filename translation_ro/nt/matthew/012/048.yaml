id: MAT.12.48
reference: Matthew 12:48
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ ⸀λέγοντι αὐτῷ· Τίς ἐστιν ἡ μήτηρ μου, καὶ τίνες εἰσὶν οἱ ἀδελφοί μου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: ro
  text: 'Dar el i-a răspuns celui care îi vorbea[a]: „Cine este mama mea și cine sunt frații mei?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mai formal: „Dar el, răspunzând, i-a spus celui care îi vorbea”.'
    reason: Alternativă lexicală ce reflectă mai îndeaproape construcția grecească participiu plus verb finit.
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Dar el i-a răspuns
  rationale: Redă firesc idiomul grec „răspunzând, a spus”, fără redundanță, iar „Dar” marchează schimbarea de direcție în discurs introdusă de δέ.
- source_word: τῷ λέγοντι αὐτῷ
  choice: celui care îi vorbea
  rationale: Participiul prezent substantivizat indică persoana care i se adresa; imperfectul românesc păstrează caracterul în desfășurare al acțiunii.
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: Cine este mama mea
  rationale: Traducere directă și idiomatică a întrebării privind identitatea.
- source_word: καὶ τίνες εἰσὶν οἱ ἀδελφοί μου
  choice: și cine sunt frații mei
  rationale: „Cine” este forma românească firească și pentru plural, iar „frații” păstrează termenul masculin de rudenie din context.
theological_decisions:
- issue: Posibila atenuare interpretativă a întrebării retorice a lui Isus despre identitatea familiei
  choice: Păstrarea întrebărilor directe, fără explicație adăugată
  alternative: „Cine se socotește mama mea și cine se socotesc frații mei?”
  rationale: Versetul următor dezvoltă sensul redefinirii rudeniei; formularea de aici trebuie să păstreze tensiunea narativă și teologică fără să anticipeze explicația.
- issue: Redarea lui ἀδελφοί
  choice: frații
  alternative: „frații și surorile”; „rudele de același sânge”
  rationale: Substantivul este masculin plural, iar referentul imediat îl constituie membrii familiei prezentați în scenă; traducerea nu lărgește nejustificat sensul.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea evită atât redundanța nefiresc de literală, cât și explicitarea interpretativă a întrebării retorice.
