id: MAT.12.27
reference: Matthew 12:27
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: ro
  text: Și dacă eu scot demonii cu ajutorul lui Beelzebul[a], fiii voștri cu ajutorul cui îi scot? De aceea, ei vor fi judecătorii voștri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greacă: „Beelzebul”; în unele traduceri apare forma „Beelzebub”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: cu ajutorul lui Beelzebul
  rationale: Prepoziția ἐν are aici sens instrumental, indicând puterea sau agentul prin care s-ar face exorcizarea. Formularea românească redă firesc acest sens și păstrează forma numelui din textul grec.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: scot demonii
  rationale: În contextul exorcizării, ἐκβάλλω înseamnă a alunga sau a scoate. „Scot demonii” este clar, natural și păstrează imaginea expulzării.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: fiii voștri
  rationale: Redarea păstrează termenul explicit de rudenie υἱοί și paralelismul retoric, fără a-l interpreta în text drept „adepții” sau „oamenii voștri”.
- source_word: ἐν τίνι
  choice: cu ajutorul cui
  rationale: Expresia are același sens instrumental ca ἐν din prima propoziție; „cu ajutorul cui” este idiomatic în română și păstrează întrebarea privitoare la agentul sau puterea invocată.
- source_word: διὰ τοῦτο
  choice: De aceea
  rationale: Redă concis concluzia inferențială introdusă de expresia grecească.
- source_word: κριταὶ ἔσονται ὑμῶν
  choice: ei vor fi judecătorii voștri
  rationale: Păstrează construcția nominală cu κριταί, timpul viitor și caracterul direct al concluziei.
theological_decisions:
- issue: Identitatea și forma numelui Βεελζεβούλ
  choice: Beelzebul
  alternative: Beelzebub
  rationale: Este urmată forma Βεελζεβούλ din textul grec furnizat, prin transliterare, fără armonizare cu forma tradițională mai cunoscută.
- issue: Referentul expresiei οἱ υἱοὶ ὑμῶν
  choice: fiii voștri
  alternative: adepții voștri / oamenii voștri
  rationale: Textul păstrează formularea de rudenie și ambiguitatea ei retorică, fără să stabilească în mod explicit dacă este vorba despre descendenți, discipoli ori membri ai grupului interlocutorilor.
translation_notes:
  register: Română standard modernă, clară și demnă. Pronumele „Eu” este scris cu majusculă conform unei convenții românești răspândite pentru vorbirea lui Isus, fără a adăuga conținut interpretativ. Repetarea expresiei „cu ajutorul” păstrează paralelismul argumentului grec.
