source:
  edition: SBLGNT
  text: Ἔτι ⸀δὲ αὐτοῦ λαλοῦντος τοῖς ὄχλοις ἰδοὺ ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ εἱστήκεισαν ἔξω ζητοῦντες αὐτῷ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/046.yaml
  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: ro
  text: În timp ce el încă vorbea mulțimilor, iată că mama și frații lui stăteau afară, căutând să-i vorbească.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „rudele lui apropiate”, dacă termenul grecesc ἀδελφοί este înțeles aici într-un sens familial mai larg; forma grecească este la masculin plural și este redată în text prin „frații”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: În timp ce el încă vorbea
  rationale: Redă simultaneitatea construcției absolute la genitiv, continuitatea indicată de ἔτι și tranziția narativă ușoară a lui δέ într-o formulare românească firească.
- source_word: τοῖς ὄχλοις
  choice: mulțimilor
  rationale: Păstrează pluralul grecesc și sensul obișnuit al lui ὄχλος, fără arhaismul „gloatelor”.
- source_word: ἰδοὺ
  choice: iată că
  rationale: Păstrează rolul de semnal narativ care atrage atenția asupra unei noi evoluții, într-o expresie idiomatică românească.
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: mama și frații lui
  rationale: Posesivul este exprimat o singură dată, conform unei construcții românești naturale, și se aplică ambilor termeni; ἀδελφοί este redat la masculin plural.
- source_word: εἱστήκεισαν ἔξω
  choice: stăteau afară
  rationale: Forma verbală prezintă o stare continuă rezultată, redată idiomatic prin imperfect; „afară” nu adaugă un loc explicit absent din verset.
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: căutând să vorbească cu el
  rationale: Păstrează sensul intențional al lui ζητέω și redă natural în română comunicarea avută în vedere de construcția cu dativ și infinitiv.
theological_decisions:
- issue: Sensul lui ἀδελφοί în desemnarea familiei lui Isus
  choice: frații lui
  alternative: frații și surorile lui; rudele lui apropiate
  rationale: Forma grecească este masculin plural și, la nivelul lexical al narațiunii, se redă cel mai direct prin „frații”. Nota păstrează deschisă posibilitatea unui sens familial mai larg, fără a soluționa prin traducere disputele teologice ulterioare privind relația lor exactă cu Isus.
translation_notes:
  register: Română standard modernă, clară și demnă. „Iată că” păstrează vivacitatea narativă fără ton excesiv de arhaic. Topica și timpurile verbale urmăresc îndeaproape greaca, dar rămân firești în română.
