id: MAT.12.42
reference: Matthew 12:42
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: ro
  text: Regina Sudului[a] se va ridica la judecată împreună cu generația aceasta și o va condamna, pentru că ea a venit de la marginile pământului ca să asculte înțelepciunea lui Solomon; și iată, aici este ceva mai mare decât Solomon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Regina Sudului” face aluzie la regina din Șeba (1 Regi 10:1–13; 2 Cronici 9:1–12), deși textul grecesc nu menționează explicit numele Șeba.
    reason: cross_reference
  - marker: b
    text: 'Sau: „aici este cineva mai mare decât Solomon”. Greaca folosește o formă neutră („ceva mai mare”), care poate accentua măreția prezentă în Isus și în lucrarea sa, mai mare decât Solomon.'
    reason: alternative_reading
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: Regina Sudului
  rationale: Redă direct construcția cu genitivul, fără a introduce în text numele „Șeba”, care provine din contextul veterotestamentar, nu din formularea greacă a versetului.
- source_word: ἐγερθήσεται
  choice: se va ridica
  rationale: Păstrează atât sensul firesc de ridicare, cât și posibila nuanță de înviere și înfățișare la judecată, fără a preciza inutil mecanismul.
- source_word: ἐν τῇ κρίσει
  choice: la judecată
  rationale: Formulare românească naturală pentru judecata escatologică definită de articolul grecesc.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: împreună cu generația aceasta
  rationale: Păstrează sensul obișnuit al lui μετά cu genitivul, „cu”; opoziția este exprimată de verbul următor, „o va condamna”.
- source_word: κατακρινεῖ αὐτήν
  choice: o va condamna
  rationale: Pronumele feminin românesc trimite clar la „generația aceasta” și redă sensul puternic al verbului κατακρίνω.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: de la marginile pământului
  rationale: Păstrează imaginea idiomatică a unei distanțe extreme și formularea solemnă a sursei.
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: ca să asculte înțelepciunea lui Solomon
  rationale: Infinitivul exprimă scopul venirii; „să asculte” este mai firesc în română decât simplul „să audă” când este vorba de căutarea înțelepciunii.
- source_word: ἰδοὺ
  choice: iată
  rationale: Marker discursiv solemn și curent, care atrage atenția asupra afirmației culminante.
- source_word: πλεῖον Σολομῶνος
  choice: ceva mai mare decât Solomon
  rationale: Păstrează forma neutră a comparativului πλεῖον și nu restrânge afirmația la o redare exclusiv personală, deși contextul îl are în vedere pe Isus și lucrarea sa.
- source_word: ὧδε
  choice: aici este
  rationale: Redare românească firească a adverbului „aici”, cu verbul copulativ necesar propoziției.
theological_decisions:
- issue: Redarea comparativului neutru πλεῖον în raport cu Isus
  choice: ceva mai mare decât Solomon
  alternative: cineva mai mare decât Solomon
  rationale: Greaca folosește o formă neutră, care poate indica realitatea mai mare prezentă în Isus și în lucrarea sa. „Ceva mai mare” păstrează forma și tensiunea expresiei, fără a nega referința contextuală la persoana lui Isus.
- issue: Nuanța lui ἐγερθήσεται în cadrul judecății
  choice: se va ridica
  alternative: va fi înviată
  rationale: „Se va ridica” lasă deschise atât nuanța învierii, cât și imaginea juridică a ridicării pentru a depune mărturie sau a condamna; „va fi înviată” ar explicita doar una dintre aceste nuanțe.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Iată” și „marginile pământului” păstrează solemnitatea și forța imagistică, iar sintaxa rămâne clară pentru cititorul contemporan.
