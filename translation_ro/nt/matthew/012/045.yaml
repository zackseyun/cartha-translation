id: MAT.12.45
reference: Matthew 12:45
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: ro
  text: Atunci se duce și ia cu el alte șapte duhuri mai rele decât el, iar ele intră și locuiesc acolo. Astfel, starea de la urmă a omului aceluia ajunge mai rea decât cea dintâi.[a] Tot așa va fi și cu această generație rea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: „cele de la urmă ale omului aceluia ajung mai rele decât cele dintâi”, expresie care se referă la starea lui finală în contrast cu cea de la început.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε πορεύεται
  choice: Atunci se duce
  rationale: Redă succesiunea temporală și prezentul narativ viu într-o română firească.
- source_word: παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: ia cu el
  rationale: Exprimă direct luarea altor duhuri ca însoțitori; pronumele masculin este firesc în română deoarece „duh” este masculin.
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: alte șapte duhuri
  rationale: ἕτερα indică aici duhuri suplimentare, fără a impune ideea unei categorii diferite; „duhuri” păstrează termenul sursă.
- source_word: πονηρότερα ἑαυτοῦ
  choice: mai rele decât el
  rationale: Păstrează comparativul moral și referirea reflexivă la duhul inițial într-un limbaj accesibil.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: ele intră și locuiesc acolo
  rationale: Participiul este redat prin verb coordonat pentru cursivitate. Sensul contextual plural este exprimat natural, deși forma tipărită κατοικεῖ este singulară.
- source_word: τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου
  choice: starea de la urmă a omului aceluia
  rationale: Expresia idiomatică desemnează situația finală; formularea păstrează opoziția cu începutul și masculinul singular al exemplului.
- source_word: χείρονα τῶν πρώτων
  choice: mai rea decât cea dintâi
  rationale: Face explicită elipsa lui „stare” și păstrează contrastul comparativ.
- source_word: οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: Tot așa va fi și cu această generație rea
  rationale: Redă aplicarea analogică, valoarea viitoare și evaluarea morală a generației.
theological_decisions:
- issue: Redarea lui πνεύματα în context demonic
  choice: duhuri
  alternative: demoni
  rationale: Textul grec spune „duhuri”, iar contextul anterior stabilește caracterul lor necurat; termenul mai specific „demoni” nu este introdus aici.
- issue: Redarea lui ἀνθρώπου
  choice: omului aceluia
  alternative: persoanei aceleia
  rationale: „Om” este echivalentul românesc direct și tradițional-neutru în uz generic, păstrând totodată forma singulară a exemplului.
- issue: Forma singulară κατοικεῖ după participiul plural εἰσελθόντα
  choice: ele intră și locuiesc acolo
  alternative: după ce intră, el locuiește acolo
  rationale: Contextul și paralela din Luca 11:26 susțin sensul colectiv/plural al duhurilor care își stabilesc locuința; nota semnalează particularitatea formală fără a produce o frază românească derutantă.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. S-a preferat „se duce” în loc de mai livrescul „pornește”, „locuiesc” în loc de arhaizantul „sălășluiesc” și „generație” pentru γενεά, păstrând aplicarea colectivă. Marcajul [a] apare în text la expresia explicată.
