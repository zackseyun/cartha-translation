  yaml_path: translation/nt/matthew/012/021.yaml
  text: and in his name the nations will hope[a].
translation:
  language: ro
  text: Și popoarele își vor pune speranța în numele lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „neamurile”; în context, poate desemna popoarele neevreiești.'
    reason: Redă alternativa contextuală pentru ἔθνη fără a restrânge sensul principal al textului.
lexical_decisions:
- source_word: καὶ
  choice: Și
  rationale: Păstrează conjuncția coordonatoare și legătura versetului cu citatul mesianic precedent.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: în numele lui
  rationale: Redă firesc în română dativul asociat verbului ἐλπίζω și păstrează rezonanța biblică a numelui ca reprezentare a persoanei și autorității sale, fără a o explicita excesiv.
- source_word: ἔθνη
  choice: națiunile
  rationale: Termenul poate desemna națiunile în general sau popoarele neevreiești. „Națiunile” păstrează perspectiva largă a citatului din Isaia, iar sensul alternativ este consemnat în notă.
- source_word: ἐλπιοῦσιν
  choice: își vor pune speranța
  rationale: Redă viitorul indicativ și sensul lexical al speranței într-o formulare românească naturală; evită restrângerea sensului la simpla încredere.
theological_decisions:
- issue: Redarea lui ἔθνη în citatul mesianic
  choice: națiunile
  alternative: neamurile, adică popoarele neevreiești
  rationale: „Națiunile” păstrează orizontul universal al citatului profetic, fără a exclude sensul contextual de popoare din afara lui Israel. Nota păstrează această alternativă interpretativă.
translation_notes:
  register: Română standard modernă, clară și demnă. Ordinea cuvintelor a fost ajustată pentru naturalețe, fără schimbarea accentului semantic; expresia „în numele lui” și viitorul promisiunii au fost păstrate.
