id: MAT.12.44
reference: Matthew 12:44
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τότε λέγει· ⸂Εἰς τὸν οἶκόν μου ἐπιστρέψω⸃ ὅθεν ἐξῆλθον· καὶ ἐλθὸν ⸀εὑρίσκει ⸀σχολάζοντα σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: ro
  text: 'Atunci spune: „Mă voi întoarce în casa mea, din care am ieșit.” Și, când vine, o găsește nelocuită[a], măturată și pusă în ordine[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „goală”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „împodobită”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Redă firesc adverbul temporal care introduce următoarea acțiune.
- source_word: λέγει
  choice: spune
  rationale: Păstrează prezentul narativ viu; subiectul implicit este duhul necurat din contextul anterior.
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: Mă voi întoarce în casa mea
  rationale: Păstrează atât sensul revenirii, cât și revendicarea posesivă exprimată de «mea».
- source_word: ὅθεν ἐξῆλθον
  choice: din care am ieșit
  rationale: Este o formulare românească naturală și menține imaginea concretă a ieșirii din casă.
- source_word: ἐλθὸν
  choice: când vine
  rationale: Redă participiul aorist printr-o propoziție temporală firească, păstrând succesiunea acțiunilor.
- source_word: εὑρίσκει
  choice: o găsește
  rationale: Păstrează prezentul narativ; pronumele «o» indică limpede casa, conform acordului cerut în română.
- source_word: σχολάζοντα
  choice: nelocuită
  rationale: În contextul casei, exprimă faptul că aceasta este liberă și disponibilă pentru ocupare, fără a explicita metafora.
- source_word: σεσαρωμένον
  choice: măturată
  rationale: Redă concis starea rezultată exprimată de participiul perfect pasiv.
- source_word: κεκοσμημένον
  choice: pusă în ordine
  rationale: κοσμέω poate însemna a aranja, a pune în ordine sau a împodobi; aici formularea evidențiază ordinea fără a impune ideea decorării.
theological_decisions:
- issue: Forța metaforică a cuvântului «casă» în zicerea despre întoarcerea duhului necurat
  choice: Păstrarea substantivului «casă» fără explicarea lui drept «persoană» sau «viață».
  alternative: „Mă voi întoarce la persoana din care am ieșit.”
  rationale: Textul sursă menține imaginea casei, iar contextul îi comunică funcția metaforică; explicitarea ar transforma traducerea în interpretare.
translation_notes:
  register: Română standard modernă, clară și demnă. Prezentul narativ este păstrat, iar seria de participii care descriu casa este redată idiomatic prin adjective la feminin.
