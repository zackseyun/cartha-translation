id: MAT.12.1
reference: Matthew 12:1
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: ro
  text: În vremea aceea, Isus a mers prin lanurile de cereale într-o zi de sabat[a]. Ucenicilor lui li s-a făcut foame și au început să smulgă spice și să mănânce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: În greacă, forma este la plural, „în sabate”, un plural idiomatic cu sensul „într-o zi de sabat”.
    reason: alternativă lexicală
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: În vremea aceea
  rationale: Redă firesc reperul temporal narativ, fără a restrânge καιρός la timpul măsurat de ceas.
- source_word: ἐπορεύθη
  choice: a trecut
  rationale: În combinație cu διὰ τῶν σπορίμων, exprimă natural deplasarea lui Isus prin zona cultivată.
- source_word: τοῖς σάββασιν
  choice: într-o zi de sabat
  rationale: Pluralul grecesc este idiomatic și se referă aici la ziua sabatului; formularea românească evită impresia că acțiunea s-a repetat în mai multe sabate.
- source_word: διὰ τῶν σπορίμων
  choice: printre lanurile de grâu
  rationale: σπόριμος desemnează terenuri semănate, îndeosebi lanuri de cereale; «lanurile de grâu» este limpede și idiomatic în contextul spicelor culese.
- source_word: οἱ δὲ μαθηταὶ αὐτοῦ
  choice: Ucenicilor Săi
  rationale: δέ are aici rol de continuare narativă, nu de opoziție puternică; construcția românească se leagă firesc de verbul impersonal următor.
- source_word: ἐπείνασαν
  choice: li s-a făcut foame
  rationale: Păstrează nuanța ingresivă a aoristului, indicând apariția foamei, într-o formulare românească naturală.
- source_word: ἤρξαντο
  choice: au început
  rationale: Redă direct începutul acțiunilor exprimate de infinitivele coordonate.
- source_word: τίλλειν στάχυας
  choice: să smulgă spice
  rationale: τίλλω indică desprinderea cu mâna, iar στάχυς desemnează spicul; formularea este precisă și ușor de înțeles.
- source_word: καὶ ἐσθίειν
  choice: și să mănânce
  rationale: Păstrează coordonarea celor două infinitive dependente de «au început» și sună natural în română.
theological_decisions:
- issue: Redarea pluralului τοῖς σάββασιν
  choice: într-o zi de sabat
  alternative: în sabate
  rationale: Pluralul grecesc are aici valoare idiomatică pentru ziua sabatului. Singularul românesc comunică sensul contextual fără a sugera, nejustificat, mai multe episoade.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. «Sabat» este păstrat ca termen biblic consacrat, iar «li s-a făcut foame» redă natural debutul stării.
