id: MAT.12.25
reference: Matthew 12:25
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: ro
  text: 'Dar el, cunoscându-le gândurile[a], le-a zis: „Orice împărăție dezbinată împotriva ei însăși este pustiită[b], iar orice oraș sau casă[c] dezbinată împotriva ei însăși nu va rămâne în picioare.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „raționamentele” ori „intențiile”.
    reason: lexical_alternative
  - marker: b
    text: Sau „ajunge pustie” ori „este adusă la ruină”.
    reason: lexical_alternative
  - marker: c
    text: În acest context, „casă” poate avea și sensul de „familie” sau „gospodărie”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: cunoscând
  rationale: Participiul exprimă faptul că el le cunoștea gândurile, fără să precizeze modul în care a dobândit această cunoaștere.
- source_word: δὲ
  choice: Dar
  rationale: Marchează tranziția și ușorul contrast cu acuzația din context.
- source_word: ἐνθυμήσεις
  choice: gândurile
  rationale: Este formularea românească cea mai limpede și firească; termenul grec poate cuprinde și raționamente sau intenții lăuntrice.
- source_word: Πᾶσα βασιλεία
  choice: Orice împărăție
  rationale: În această afirmație cu caracter proverbial, singularul cu πᾶσα exprimă un principiu general; „orice” sună natural în româna actuală.
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: dezbinată împotriva ei însăși
  rationale: Redă atât divizarea internă, cât și orientarea adversativă exprimată de κατά împreună cu pronumele reflexiv.
- source_word: ἐρημοῦται
  choice: este pustiită
  rationale: Păstrează forma pasivă și imaginea severă a ajungerii la pustietate sau ruină.
- source_word: πόλις ἢ οἰκία
  choice: cetate sau casă
  rationale: „Cetate” este un echivalent biblic încă inteligibil pentru πόλις, iar „casă” păstrează sensul concret al οἰκία fără a exclude sensul extins de familie sau gospodărie.
- source_word: οὐ σταθήσεται
  choice: nu va rămâne în picioare
  rationale: Redă idiomatic ideea de a nu rămâne stabilă ori de a nu dăinui, păstrând totodată metafora verbului ἵστημι.
theological_decisions:
- issue: Natura cunoașterii gândurilor lor de către Isus
  choice: Textul afirmă simplu că el le cunoștea gândurile, fără să explice mecanismul acestei cunoașteri.
  alternative: A preciza că le-a cunoscut în mod supranatural sau că le-a dedus din împrejurări.
  rationale: Versetul afirmă realitatea cunoașterii, dar nu spune dacă aceasta a fost omnisciență, discernământ profetic ori percepție omenească; traducerea păstrează această nedeterminare.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. Formularea păstrează structura proverbială, paralelismul și imaginile textului grec, evitând atât arhaismele greu de înțeles, cât și explicitările doctrinare.
