source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐκ ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε ⸀ἐπείνασεν καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/003.yaml
  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: ro
  text: 'Dar el le-a zis: „N-ați citit ce a făcut David când lui David și celor care erau cu el li s-a făcut foame?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „ce a făcut David când i s-a făcut foame, iar cei care erau cu el...” Verbul grecesc este la singular și se referă explicit la David, dar construcția poate fi înțeleasă ca incluzându-i și pe cei care erau cu el în starea de foame.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Dar el
  rationale: δέ marchează aici răspunsul lui Isus la acuzația anterioară; „Dar el” redă firesc contrastul ușor.
- source_word: εἶπεν αὐτοῖς
  choice: le-a zis
  rationale: Redare directă și naturală în româna actuală a verbului λέγω urmat de dativ.
- source_word: Οὐκ ἀνέγνωτε
  choice: N-ați citit
  rationale: Întrebarea retorică apelează la cunoașterea Scripturii de către interlocutori; perfectul compus este idiomatic în română.
- source_word: τί ἐποίησεν
  choice: ce a făcut
  rationale: ποιέω are aici sensul istoric simplu „a face”, fără a necesita explicitare.
- source_word: Δαυὶδ
  choice: David
  rationale: Forma consacrată în limba română a numelui propriu.
- source_word: ὅτε ἐπείνασεν
  choice: când i s-a făcut foame
  rationale: Redare românească naturală a lui πεινάω, fără a accentua excesiv începutul stării.
- source_word: καὶ οἱ μετ’ αὐτοῦ
  choice: lui și celor care erau cu el
  rationale: Construcția păstrează asocierea celor însoțitori cu David și permite redarea elipsei grecești fără repetarea greoaie a verbului.
theological_decisions:
- issue: Dacă foamea îi privește numai pe David sau și pe cei aflați cu el
  choice: Textul principal leagă expresia „lui și celor care erau cu el” de foame.
  alternative: „când i s-a făcut foame, iar cei care erau cu el...” sau o formulare care lasă verbul singular să se refere explicit numai la David.
  rationale: Verbul grec ἐπείνασεν este la singular și îl indică explicit pe David, dar καὶ οἱ μετ’ αὐτοῦ poate extinde în mod eliptic starea și asupra însoțitorilor. Nota păstrează vizibilă tensiunea gramaticală.
translation_notes:
  register: Română standard modernă, clară și demnă. Forma „N-ați” este firească în dialog și păstrează forța întrebării retorice; nota explică ambiguitatea sintactică fără a o transforma într-o afirmație doctrinară.
