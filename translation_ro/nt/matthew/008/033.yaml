source:
  edition: SBLGNT
  text: οἱ δὲ βόσκοντες ἔφυγον, καὶ ἀπελθόντες εἰς τὴν πόλιν ἀπήγγειλαν πάντα καὶ τὰ τῶν δαιμονιζομένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: ro
  text: Iar păzitorii turmei au fugit, iar după ce s-au dus în cetate, au povestit totul, inclusiv cele întâmplate cu oamenii stăpâniți de demoni[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mai literal: „și cele privitoare la oamenii stăpâniți de demoni”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: Atunci păzitorii turmei
  rationale: Participiul îi desemnează pe cei care pășteau și supravegheau turma de porci. „Păzitorii turmei” este firesc și evită termenul mai specializat „porcarii”; δέ marchează aici continuarea narațiunii.
- source_word: ἔφυγον
  choice: au fugit
  rationale: Redă direct aoristul lui φεύγω și păstrează caracterul viu al relatării.
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: după ce s-au dus în cetate
  rationale: Participiul aorist indică o acțiune anterioară relatării, iar εἰς exprimă deplasarea în cetate.
- source_word: ἀπήγγειλαν πάντα
  choice: au povestit totul
  rationale: ἀπαγγέλλω înseamnă a relata sau a da de știre; „au povestit” este natural în context, iar „totul” păstrează caracterul cuprinzător al lui πάντα.
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: inclusiv cele întâmplate cu oamenii stăpâniți de demoni
  rationale: Expresia eliptică înseamnă literal „și cele privitoare la cei demonizați”. Formularea românească explicitează contextual că este vorba despre cele petrecute cu cei doi oameni, fără a adăuga detalii străine textului.
- source_word: δαιμονιζομένων
  choice: oamenii stăpâniți de demoni
  rationale: Redă o aflicțiune demonică reală și relația de putere exprimată de verb, într-un limbaj modern, fără a preciza mai mult decât spune termenul grec.
theological_decisions:
- issue: Redarea lui δαιμονιζομένων fără impunerea unei distincții doctrinare ulterioare
  choice: oamenii stăpâniți de demoni
  alternative: demonizații; oamenii posedați de demoni
  rationale: „Stăpâniți de demoni” comunică limpede realitatea aflicțiunii demonice din narațiune, dar nu transformă termenul într-o definiție tehnică a naturii sau gradului acestei stăpâniri.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. „Cetate” păstrează tonul biblic fără a fi neinteligibil, iar construcțiile sunt naturale pentru cititorul contemporan.
