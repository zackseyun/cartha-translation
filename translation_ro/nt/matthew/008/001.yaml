base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/001.yaml
  text: When he came down from the mountain[a], large crowds followed him.
translation:
  language: ro
  text: Când a coborât de pe munte, l-au urmat mulțimi mari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καταβάντος δὲ αὐτοῦ
  choice: Când a coborât
  rationale: Construcția cu genitiv absolut și participiu aorist este redată firesc printr-o propoziție temporală. „Când” păstrează succesiunea narativă fără să precizeze excesiv raportul temporal; δέ are aici o funcție conectivă ușoară și nu necesită o redare separată.
- source_word: ἀπὸ τοῦ ὄρους
  choice: de pe munte
  rationale: În română, coborârea de la o suprafață sau înălțime se exprimă idiomatic prin „de pe”; „munte” păstrează legătura cu cadrul relatării precedente.
- source_word: ἠκολούθησαν αὐτῷ
  choice: l-au urmat
  rationale: Verbul ἀκολουθέω cu complement la dativ indică aici urmarea fizică a lui Isus; construcția românească firească este verbul tranzitiv „a urma” cu pronume în acuzativ.
- source_word: ὄχλοι πολλοί
  choice: mulțimi mari
  rationale: Expresia desemnează mulțimi numeroase sau ample. „Mulțimi mari” este natural în româna actuală, păstrează pluralul grecesc și evită reformularea mai interpretativă „mulți oameni”.
theological_decisions: []
translation_notes:
  register: Formulare narativă clară, demnă și actuală. Ordinea „l-au urmat mulțimi mari” este firească în context și păstrează accentul final asupra amplorii mulțimilor.
