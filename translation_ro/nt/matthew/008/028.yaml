id: MAT.8.28
reference: Matthew 8:28
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ πέραν εἰς τὴν χώραν τῶν ⸀Γαδαρηνῶν ὑπήντησαν αὐτῷ δύο δαιμονιζόμενοι ἐκ τῶν μνημείων ἐξερχόμενοι, χαλεποὶ λίαν ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: ro
  text: Când a ajuns pe celălalt țărm, în ținutul gadarenilor[a], L-au întâmpinat doi oameni stăpâniți de demoni, care ieșeau din morminte. Erau atât de primejdioși[b], încât nimeni nu putea trece pe drumul acela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Unele manuscrise au „gherghesenilor” sau „gherasenilor” în loc de „gadarenilor”.
    reason: textual_variant
  - marker: b
    text: Sau „foarte fioroși”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: Când a ajuns
  rationale: Genitivul absolut este redat firesc printr-o propoziție temporală, păstrând succesiunea relatării.
- source_word: τὸ πέραν
  choice: celălalt țărm
  rationale: În contextul traversării lacului, expresia indică malul opus; „țărm” este mai explicit și mai natural în română decât simplul „partea cealaltă”.
- source_word: χώραν τῶν Γαδαρηνῶν
  choice: ținutul gadarenilor
  rationale: „Ținut” redă natural sensul teritorial al lui χώρα, iar „gadarenilor” urmează forma din textul SBLGNT.
- source_word: δύο δαιμονιζόμενοι
  choice: doi oameni stăpâniți de demoni
  rationale: Formularea exprimă dominația demonică indicată de participiu și identifică firesc referenții masculini, fără a recurge la termenul neobișnuit „demonizați”.
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: care ieșeau din morminte
  rationale: Redarea păstrează acțiunea participială și sensul concret al locurilor de îngropare.
- source_word: χαλεποὶ λίαν
  choice: atât de primejdioși
  rationale: χαλεπός poate descrie persoane fioroase, periculoase sau greu de înfruntat. „Primejdioși” se potrivește rezultatului enunțat — nimeni nu putea folosi drumul — fără a preciza nejustificat că recurgeau efectiv la violență. Construcția „atât de... încât” redă împreună intensificarea și consecința.
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης
  choice: încât nimeni nu putea trece pe drumul acela
  rationale: ἰσχύω exprimă aici capacitatea practică, iar διά cu genitivul indică traseul; formularea este idiomatică în româna actuală.
theological_decisions:
- issue: Redarea stării desemnate de δαιμονιζόμενοι
  choice: stăpâniți de demoni
  alternative: posedați de demoni
  rationale: Alegerea afirmă agenția demonică personală prezentă în relatare și ideea de dominație, dar evită încărcarea termenului modern „posedat” cu o definiție tehnică mai precisă decât oferă participiul grec.
- issue: Varianta textuală a toponimului
  choice: gadarenilor
  alternative: gherghesenilor / gherasenilor
  rationale: Textul principal urmează forma Γαδαρηνῶν din SBLGNT, iar celelalte forme atestate sunt păstrate în nota textuală.
- issue: Natura pericolului sugerat de χαλεποί
  choice: primejdioși
  alternative: fioroși
  rationale: Contextul afirmă limpede că cei doi îi împiedicau pe oameni să treacă, dar nu descrie în mod explicit actele lor; traducerea păstrează această măsură de nedeterminare.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și vocabular accesibil. Fraza greacă lungă este împărțită în două propoziții pentru claritate, fără pierdere de conținut sau de legătură logică.
