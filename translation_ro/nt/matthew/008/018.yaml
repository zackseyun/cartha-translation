  text: Ἰδὼν δὲ ὁ Ἰησοῦς ⸂πολλοὺς ὄχλους⸃ περὶ αὐτὸν ἐκέλευσεν ἀπελθεῖν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/018.yaml
  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: ro
  text: Când Isus a văzut mulțimi numeroase în jurul lui, a dat poruncă să se treacă de cealaltă parte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὺς ὄχλους
  choice: mulțimile
  rationale: În context, pluralul grecesc indică numeroasele grupuri de oameni aflate în jurul lui Isus; româna firească exprimă ideea prin pluralul articulat, fără redundantul „multe mulțimi”.
- source_word: ἐκέλευσεν
  choice: a poruncit
  rationale: Verbul exprimă emiterea unei porunci sau dispoziții, iar „a poruncit” păstrează clar forța lui.
- source_word: ἀπελθεῖν εἰς τὸ πέραν
  choice: să treacă de cealaltă parte
  rationale: Expresia se referă contextual la deplasarea spre malul opus; „să treacă” este idiomatic în română și păstrează complementul de destinație.
theological_decisions:
- issue: Subiectul neexprimat al infinitivului ἀπελθεῖν
  choice: să treacă
  alternative: să plece / să meargă de cealaltă parte
  rationale: Greaca nu precizează explicit aici cine urmează să plece. Forma românească fără pronume exprimat păstrează această economie și nu impune nejustificat „ucenicilor” sau „tuturor”.
translation_notes:
  register: Română standard modernă, clară și demnă. Conjuncția δέ este redată natural prin simpla legare narativă, fără un „iar” sau „atunci” care ar accentua excesiv tranziția.
