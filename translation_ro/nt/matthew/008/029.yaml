id: MAT.8.29
reference: Matthew 8:29
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔκραξαν λέγοντες· Τί ἡμῖν καὶ ⸀σοί, υἱὲ τοῦ θεοῦ; ἦλθες ὧδε πρὸ καιροῦ βασανίσαι ἡμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: ro
  text: 'Și iată, ei au strigat: „Ce avem noi de-a face cu tine[a], Fiul lui Dumnezeu? Ai venit aici înainte de vremea hotărâtă[b] ca să ne chinuiești?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mai literal: „Ce este între noi și tine?” Expresia indică delimitare, respingere sau confruntare.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „înainte de vreme”. Termenul grecesc poate desemna un moment hotărât.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Și iată
  rationale: Păstrează marcatorul discursiv și efectul viu de atragere bruscă a atenției.
- source_word: ἔκραξαν λέγοντες
  choice: 'ei au strigat:'
  rationale: „Au strigat” redă intensitatea lui κράζω, iar două puncte introduc firesc vorbirea exprimată prin participiul λέγοντες, fără formula greoaie „strigând, au spus”.
- source_word: Τί ἡμῖν καὶ σοί
  choice: Ce avem noi de-a face cu tine
  rationale: Redă idiomul de delimitare și confruntare într-o română actuală, păstrând totodată forma relațională a expresiei, fără a o restrânge la sensul „Ce vrei de la noi?”.
- source_word: υἱὲ τοῦ θεοῦ
  choice: Fiul lui Dumnezeu
  rationale: Redare directă a titlului hristologic prin care vorbitorii i se adresează lui Isus.
- source_word: ἦλθες ὧδε
  choice: Ai venit aici
  rationale: Perfectul compus este firesc în întrebarea despre venirea cu efect prezent, iar „aici” redă valoarea locativă a lui ὧδε.
- source_word: πρὸ καιροῦ
  choice: înainte de vremea hotărâtă
  rationale: καιρός poate indica un moment stabilit sau potrivit; „vremea hotărâtă” păstrează această nuanță fără a preciza cine a hotărât-o.
- source_word: βασανίσαι
  choice: ca să ne chinuiești
  rationale: Construcția finală redă infinitivul de scop, iar „a chinui” exprimă suferința severă asociată aici judecății fără a limita sensul la tortură fizică.
- source_word: ἡμᾶς
  choice: ne
  rationale: Redă pronumele la persoana întâi plural, referitor la duhurile care vorbesc.
theological_decisions:
- issue: Recunoașterea identității lui Isus de către demoni
  choice: Fiul lui Dumnezeu
  alternative: fiu al lui Dumnezeu
  rationale: Articolul și adresarea directă susțin titlul definit; formularea păstrează afirmația explicită a textului fără explicații doctrinare suplimentare.
- issue: Nuanța escatologică a lui καιρός
  choice: înainte de vremea hotărâtă
  alternative: înainte de vreme
  rationale: Contextul întrebării sugerează un moment stabilit pentru chin sau judecată. Traducerea păstrează sugestia, fără a introduce un calendar ori un sistem escatologic absent din verset.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Pronumele adresării sunt scrise cu literă mică, potrivit uzului curent și pentru a nu introduce prin ortografie o convenție confesională. Formula „Ce avem noi de-a face cu tine” păstrează tensiunea idiomului sursă, iar nota explică sensul său mai literal.
