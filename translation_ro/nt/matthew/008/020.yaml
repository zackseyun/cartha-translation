id: MAT.8.20
reference: Matthew 8:20
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: ro
  text: 'Și Isus îi spune: „Vulpile au vizuini, iar păsările cerului au cuiburi[a], dar Fiul Omului[b] nu are unde să-și plece capul.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „locuri de adăpost” ori „locuri de popas”.
    reason: lexical_alternative
  - marker: b
    text: „Fiul Omului” este autodesemnarea folosită de Isus; expresia poate fi redată mai interpretativ și prin „Omul”, dar această variantă nu păstrează toate rezonanțele titlului.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: spune
  rationale: Prezentul narativ grecesc este păstrat prin prezentul românesc „spune”, care este firesc în narațiune și menține vivacitatea formulării sursă.
- source_word: ἀλώπεκες
  choice: vulpile
  rationale: Echivalentul lexical direct și firesc al pluralului grecesc.
- source_word: φωλεούς
  choice: vizuini
  rationale: „Vizuini” denumește în româna actuală adăposturile animalelor și se potrivește natural vulpilor, fără a reduce sensul la simple „găuri”.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: păsările cerului
  rationale: Redare apropiată de structura greacă și idiomatică în română; păstrează imaginea cerului fără a o înlocui cu interpretativul „văzduhului”.
- source_word: κατασκηνώσεις
  choice: cuiburi
  rationale: În contextul păsărilor, „cuiburi” este formularea cea mai naturală pentru locurile lor de adăpost, deși termenul grecesc poate avea sensul mai larg de locuri de popas sau adăposturi.
- source_word: ὁ δὲ υἱὸς τοῦ ἀνθρώπου
  choice: dar Fiul Omului
  rationale: Păstrează titlul tradițional și rezonanțele sale scripturale, inclusiv posibila aluzie la Daniel 7, fără a-l transforma într-o parafrază interpretativă.
- source_word: οὐκ ἔχει ποῦ
  choice: nu are unde
  rationale: Este echivalentul românesc natural și fidel al construcției grecești negative.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: să-și plece capul
  rationale: Păstrează imaginea concretă a aplecării sau așezării capului și exprimă idiomatic lipsa unui loc de odihnă.
theological_decisions:
- issue: Redarea autodesemnării lui Isus ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  alternative: Omul / Cel omenesc
  rationale: „Fiul Omului” păstrează forma distinctivă, ambiguitatea și rezonanțele mesianice ale expresiei grecești. Alternativele ar explicita doar dimensiunea umană și ar diminua tensiunea teologică a titlului.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. Construcția „îi spune” redă natural atât pronumele indirect αὐτῷ, cât și prezentul narativ. Conectorul δέ este redat prin „dar”, iar primul καί prin „Și”; al doilea καί este redat firesc prin „iar” pentru contrastul coordonat. Pronumele reflexiv din „să-și” rămâne cu literă mică, potrivit ortografiei române curente și fără introducerea unei convenții confesionale de reverență.
