id: MAT.8.24
reference: Matthew 8:24
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς μέγας ἐγένετο ἐν τῇ θαλάσσῃ, ὥστε τὸ πλοῖον καλύπτεσθαι ὑπὸ τῶν κυμάτων, αὐτὸς δὲ ἐκάθευδεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/024.yaml
  text: And behold[a], a great storm arose on the sea, so that the boat was being swamped by the waves[b]; but he was sleeping.
translation:
  language: ro
  text: Și iată, pe mare s-a stârnit o furtună puternică[a], încât barca era acoperită de valuri[b]. El însă dormea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Termenul grecesc σεισμός înseamnă adesea „cutremur” sau „zguduire”; aici, contextul indică o tulburare violentă a mării.
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „barca era copleșită de valuri”.'
    reason: translation_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: iată
  rationale: Păstrează funcția discursivă de atragere vie și bruscă a atenției, într-o formulare românească firească și demnă.
- source_word: σεισμὸς μέγας
  choice: o furtună puternică
  rationale: Deși σεισμός denumește adesea un cutremur sau o zguduire, contextul maritim — marea, barca și valurile — indică aici o tulburare violentă a mării. „Furtună puternică” redă limpede sensul contextual fără a sugera în mod înșelător un cutremur de uscat.
- source_word: ἐγένετο
  choice: s-a stârnit
  rationale: În legătură cu o furtună, „s-a stârnit” exprimă natural apariția bruscă a fenomenului.
- source_word: ἐν τῇ θαλάσσῃ
  choice: pe mare
  rationale: Redă idiomatic locul evenimentului și păstrează termenul sursă „mare”, fără a-l înlocui cu explicația geografică „lac”.
- source_word: ὥστε
  choice: încât
  rationale: Introduce clar rezultatul produs de violența furtunii.
- source_word: τὸ πλοῖον
  choice: barca
  rationale: În contextul navigației pe Marea Galileii, „barca” este echivalentul românesc natural pentru πλοῖον.
- source_word: καλύπτεσθαι
  choice: era acoperită
  rationale: 'Păstrează construcția pasivă și caracterul continuu al acțiunii: valurile acopereau în mod repetat sau progresiv barca.'
- source_word: ὑπὸ τῶν κυμάτων
  choice: de valuri
  rationale: 'Redă agentul construcției pasive: valurile erau cele care acopereau barca.'
- source_word: αὐτὸς δὲ
  choice: El însă
  rationale: Poziția pronumelui și conjuncția sunt redate printr-un contrast clar cu primejdia din jur, fără accentuare excesivă.
- source_word: ἐκάθευδεν
  choice: dormea
  rationale: Imperfectul românesc exprimă firesc acțiunea continuă din trecut și corespunde aspectului formei grecești.
theological_decisions:
- issue: Natura evenimentului desemnat prin σεισμός
  choice: Evenimentul este redat contextual drept „furtună”, adică o tulburare violentă a mării.
  alternative: „Cutremur” sau „zguduire”, ca redări mai literale ale lui σεισμός.
  rationale: Este o decizie lexical-contextuală, nu una doctrinară. Imaginile imediate ale mării, bărcii și valurilor cer o formulare care să comunice fenomenul maritim, păstrând în nota de subsol sensul literal posibil al termenului.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. „Iată” păstrează vivacitatea relatării, iar „El însă dormea” redă contrastul pregnant al originalului.
