id: MAT.8.13
reference: Matthew 8:13
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ· Ὕπαγε, ⸀ὡς ἐπίστευσας γενηθήτω σοι· καὶ ἰάθη ὁ ⸀παῖς ἐν τῇ ὥρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: ro
  text: 'Isus i-a spus centurionului: „Du-te; să ți se facă așa cum ai crezut.” Și slujitorul[a] lui a fost vindecat în ceasul acela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „băiatul” ori „copilul”. Termenul grecesc παῖς poate desemna fie un slujitor, fie o persoană tânără; în acest context, „slujitorul” se potrivește cel mai bine pentru subordonatul centurionului.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: centurionului
  rationale: Termenul românesc consacrat și precis pentru ofițerul roman care comanda, în principiu, aproximativ o sută de soldați.
- source_word: Ὕπαγε
  choice: Du-te!
  rationale: Redă direct imperativul de plecare, într-o formulare firească în româna actuală.
- source_word: ὡς ἐπίστευσας
  choice: așa cum ai crezut
  rationale: Păstrează construcția verbală personală și relația comparativă exprimată de ὡς, fără a o transforma în substantivul interpretativ „credință”.
- source_word: γενηθήτω σοι
  choice: Să ți se facă
  rationale: Redă imperativul pasiv cu valoare iusivă și păstrează formularea deliberat deschisă a grecei.
- source_word: παῖς
  choice: slujitorul
  rationale: Contextul centurionului și paralela contextuală cu δοῦλος susțin sensul de subordonat/slujitor; ambiguitatea lexicală privind vârsta este păstrată în nota de subsol.
- source_word: ἰάθη
  choice: a fost vindecat
  rationale: Echivalent românesc standard pentru pasivul lui ἰάομαι, exprimând însănătoșirea fără parafrază suplimentară.
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: chiar în ceasul acela
  rationale: Păstrează imaginea temporală a originalului; „chiar” exprimă caracterul imediat indicat de context fără a înlocui „ceasul” cu „clipa”.
theological_decisions:
- issue: Redarea limbajului πιστεύω/πίστις
  choice: ai crezut
  alternative: ai avut credință; te-ai încrezut
  rationale: Forma verbală „ai crezut” corespunde direct aoristului ἐπίστευσας și nu transformă afirmația într-o formulă doctrinară substantivală.
- issue: Raportul dintre credința centurionului și împlinire
  choice: Să ți se facă așa cum ai crezut
  alternative: Să ți se facă potrivit credinței tale
  rationale: Traducerea păstrează tensiunea și formularea comparativă din text, fără a explica mecanismul ori natura relației dintre credință și vindecare.
translation_notes:
  register: Română standard modernă, clară și demnă. „Centurion” și „în ceasul acela” păstrează vocabularul biblic familiar fără arhaizare excesivă; topica și punctuația urmăresc fluența rostirii directe.
