source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ὁ παῖς μου βέβληται ἐν τῇ οἰκίᾳ παραλυτικός, δεινῶς βασανιζόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/006.yaml
  text: and saying[a], “Lord, my servant is lying paralyzed at home[b], suffering terribly.”
translation:
  language: ro
  text: 'și i-a spus: „Doamne, slujitorul meu[a] zace paralizat acasă și suferă cumplit.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Termenul grecesc poate însemna și „băiatul meu” sau „copilul meu”; în contextul centurionului, „slujitorul meu” este sensul cel mai probabil.
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „este chinuit îngrozitor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: și zicând
  rationale: Păstrează legătura participială cu versetul anterior și este o formulare narativă firească și demnă în română.
- source_word: Κύριε
  choice: Doamne
  rationale: Vocativul consacrat păstrează atât posibilitatea unei adresări respectuoase, cât și rezonanța mai înaltă a titlului.
- source_word: ὁ παῖς μου
  choice: slujitorul meu
  rationale: παῖς poate însemna slujitor, băiat sau copil; în contextul centurionului, «slujitorul meu» este sensul contextual cel mai probabil, fără a elimina alternativa lexicală, consemnată în notă.
- source_word: βέβληται
  choice: zace
  rationale: Perfectul pasiv indică starea rezultată în care se află bolnavul; «zace» redă natural ideea că este țintuit la pat, fără imaginea literală nepotrivită «a fost aruncat».
- source_word: ἐν τῇ οἰκίᾳ
  choice: acasă
  rationale: Este echivalentul românesc firesc al expresiei locative în acest context.
- source_word: παραλυτικός
  choice: paralizat
  rationale: Redare adjectivală directă, actuală și ușor de înțeles.
- source_word: δεινῶς βασανιζόμενος
  choice: suferă cumplit
  rationale: Exprimă intensitatea suferinței într-o română naturală, păstrând în notă redarea mai literală «este chinuit îngrozitor».
theological_decisions:
- issue: Forța lui Κύριε ca adresare către Isus
  choice: Doamne
  alternative: Domnule
  rationale: «Doamne» păstrează deschisă atât lectura ca adresare respectuoasă, cât și posibilitatea unei recunoașteri mai profunde, fără a o impune explicit.
translation_notes:
  register: Română standard modernă, clară și demnă. «Zace paralizat acasă» evită rigiditatea unei redări mecanice, iar nota păstrează ambiguitățile lexicale reale ale textului grec.
