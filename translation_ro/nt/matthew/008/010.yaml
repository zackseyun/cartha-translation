id: MAT.8.10
reference: Matthew 8:10
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν· Ἀμὴν λέγω ὑμῖν, ⸂παρ’ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ⸃ εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/010.yaml
  text: When Jesus heard this[a], he marveled and said to those following him, “Truly I tell you[b], with no one in Israel have I found such faith.”
translation:
  language: ro
  text: 'Când a auzit Isus, s-a mirat și le-a spus celor care îl urmau: „Adevărat vă spun: la nimeni în Israel n-am găsit o credință atât de mare.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: Când a auzit
  rationale: Participiul aorist exprimă împrejurarea temporală a verbului principal. Propoziția temporală este firească în româna actuală; obiectul auzirii rămâne implicit, ca în greacă.
- source_word: ἐθαύμασεν
  choice: s-a mirat
  rationale: Redă reacția puternică de uimire a lui Isus într-un limbaj actual și demn, fără a adăuga o explicație teologică.
- source_word: τοῖς ἀκολουθοῦσιν
  choice: celor care îl urmau
  rationale: Participiul prezent îi desemnează pe oamenii care îl însoțeau atunci, fără a-i identifica în mod necesar cu un grup formal de ucenici.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Adevărat vă spun
  rationale: Formulă solemnă și emfatică, redată idiomatic în română, păstrând forța lui ἀμήν.
- source_word: παρ’ οὐδενὶ
  choice: la nimeni
  rationale: παρά cu dativul indică aici persoana la care sau în cazul căreia este găsită credința; „la nimeni” este formularea românească firească.
- source_word: τοσαύτην πίστιν
  choice: o credință atât de mare
  rationale: τοσαύτην accentuează gradul sau mărimea, iar formularea aleasă face explicită această intensitate și păstrează sensul lui πίστις.
- source_word: ἐν τῷ Ἰσραὴλ
  choice: în Israel
  rationale: Păstrează formularea locativă și corporativă a grecei, referitoare la poporul lui Israel.
- source_word: εὗρον
  choice: n-am găsit
  rationale: Aoristul este redat natural prin perfectul compus românesc, exprimând constatarea lui Isus până în acel moment.
theological_decisions:
- issue: Sensul lui πίστις
  choice: credință
  alternative: încredere
  rationale: Contextul evidențiază încrederea centurionului în autoritatea lui Isus, dar termenul mai larg și consacrat „credință” păstrează întinderea semantică a substantivului grec fără a-i restrânge sensul.
translation_notes:
  register: Română standard modernă, cu formulare orală solemnă în cuvintele lui Isus. Ordinea propoziției este ajustată ușor pentru naturalețe, fără a elimina accentul pus pe caracterul excepțional al credinței.
