id: MAT.8.2
reference: Matthew 8:2
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ λεπρὸς ⸀προσελθὼν προσεκύνει αὐτῷ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/002.yaml
  text: And behold[a], a leper came and bowed down before him, saying, “Lord, if you are willing, you are able to cleanse me.”
translation:
  language: ro
  text: 'Și iată, un om bolnav de lepră s-a apropiat și s-a plecat înaintea lui[a], spunând: „Doamne, dacă vrei, poți să mă curățești.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „i s-a închinat”; verbul grecesc poate desemna plecarea cu reverență, aducerea de omagiu sau închinarea, în funcție de context.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: iată
  rationale: Păstrează funcția particulei de a atrage atenția și vivacitatea narațiunii, într-o formă firească și consacrată în română.
- source_word: λεπρὸς
  choice: un om bolnav de lepră
  rationale: Redă adjectivul substantivizat ca referire la o persoană afectată de boala numită tradițional lepră, fără a reduce persoana la afecțiunea sa.
- source_word: προσελθὼν
  choice: s-a apropiat
  rationale: Exprimă direct mișcarea către Isus indicată de participiu.
- source_word: προσεκύνει
  choice: s-a plecat înaintea lui
  rationale: Păstrează gestul corporal de profund respect fără a decide nejustificat dacă, în acest context, verbul trebuie înțeles strict drept închinare cultică.
- source_word: Κύριε
  choice: Doamne
  rationale: Forma românească vocativă păstrează atât adresarea respectuoasă către Isus, cât și posibila greutate cristologică a titlului.
- source_word: ἐὰν θέλῃς
  choice: dacă vrei
  rationale: Redă limpede și natural condiția privitoare la voința lui Isus, fără ton arhaic.
- source_word: δύνασαί
  choice: poți
  rationale: Exprimă capacitatea sau puterea lui Isus într-o formulare românească directă și naturală.
- source_word: καθαρίσαι
  choice: să mă curățești
  rationale: Păstrează dimensiunea fizică și rituală a curățirii asociate bolii, pe care simplul «să mă vindeci» ar estompa-o.
theological_decisions:
- issue: Sensul lui προσκυνέω în raport cu Isus
  choice: s-a plecat înaintea lui
  alternative: i s-a închinat
  rationale: Verbul poate desemna prosternarea, omagiul reverențios sau închinarea. Contextul indică sigur un gest de profund respect, dar nu impune ca traducerea principală să rezolve întreaga lui încărcătură teologică; alternativa este păstrată în notă.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. «Iată» păstrează reliefarea discursivă a originalului, iar formularea cererii este simplă și solemnă.
