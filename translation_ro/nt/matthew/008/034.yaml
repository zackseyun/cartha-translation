id: MAT.8.34
reference: Matthew 8:34
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πᾶσα ἡ πόλις ἐξῆλθεν εἰς ⸀ὑπάντησιν τῷ Ἰησοῦ, καὶ ἰδόντες αὐτὸν παρεκάλεσαν ὅπως μεταβῇ ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: ro
  text: Și iată, întregul oraș a ieșit în întâmpinarea lui Isus și, când l-au văzut, l-au rugat stăruitor să plece din ținutul lor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „din teritoriul lor”; mai literal, „de la hotarele lor”.
    reason: Alternativă lexicală pentru ἀπὸ τῶν ὁρίων αὐτῶν, care poate evidenția fie teritoriul, fie limitele lui.
lexical_decisions:
- source_word: ἰδοὺ
  choice: iată
  rationale: Păstrează rolul de captare a atenției și vivacitatea narativă, într-o formulare românească firească și demnă.
- source_word: πᾶσα ἡ πόλις
  choice: întregul oraș
  rationale: Redă colectiv populația orașului, fără a impune ideea că fiecare locuitor, fără excepție, a ieșit.
- source_word: ἐξῆλθεν
  choice: a ieșit
  rationale: Redă direct aoristul și se acordă la singular cu substantivul colectiv „oraș”.
- source_word: εἰς ὑπάντησιν
  choice: în întâmpinarea
  rationale: Expresie românească idiomatică pentru ieșirea cu scopul de a întâlni pe cineva.
- source_word: Ἰησοῦ
  choice: Isus
  rationale: Folosește forma românească standard a numelui.
- source_word: ἰδόντες αὐτὸν
  choice: când l-au văzut
  rationale: Redă participiul aorist printr-o propoziție temporală naturală și păstrează succesiunea relatării.
- source_word: παρεκάλεσαν
  choice: l-au rugat stăruitor
  rationale: Exprimă intensitatea cererii mai bine decât simplul „l-au rugat”, fără a introduce o ostilitate pe care textul nu o precizează.
- source_word: ὅπως μεταβῇ
  choice: să plece
  rationale: Redă firesc în română conținutul cererii exprimate prin ὅπως cu conjunctivul.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: din ținutul lor
  rationale: În context, pluralul ὅρια desemnează teritoriul delimitat al locuitorilor, nu doar liniile de graniță.
theological_decisions:
- issue: Motivul cererii locuitorilor
  choice: 'Motivul rămâne neprecizat: ei îl roagă stăruitor pe Isus să plece.'
  alternative: Cererea ar putea fi explicată prin frica de puterea lui Isus, prin pierderea porcilor sau prin tulburarea generală produsă de eveniment.
  rationale: Textul grecesc relatează cererea fără să-i explice explicit cauza; traducerea păstrează această tensiune narativă și teologică.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. „Oraș” este preferat lui „cetate” pentru claritate actuală, iar pronumele referitoare la Isus sunt scrise cu literă mică, potrivit ortografiei curente și fără a impune o convenție confesională.
