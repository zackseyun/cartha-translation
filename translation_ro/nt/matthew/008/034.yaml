  verdict: revise
  source_fidelity: 'Textul redă fidel elementele principale ale grecei: marcatorul narativ «iată», sensul colectiv al expresiei «întregul oraș», ieșirea pentru a-l întâlni pe Isus, participiul temporal «când l-au văzut», caracterul insistent al lui παρεκάλεσαν și cererea ca el să plece din zona lor. «Ținutul lor» este o redare contextuală potrivită pentru τῶν ὁρίων αὐτῶν, iar nota păstrează alternativa mai literală.'
  naturalness: Formularea este firească în româna standard modernă și păstrează un registru narativ demn, fără arhaizare inutilă. «L-au rugat stăruitor» este natural și exprimă bine intensitatea cererii.
  terminology: «Isus» este forma românească standard. «Oraș», «în întâmpinarea» și «ținut» sunt termeni clari și adecvați contextului. Nu se introduce nicio explicație confesională sau motiv presupus al cererii locuitorilor.
