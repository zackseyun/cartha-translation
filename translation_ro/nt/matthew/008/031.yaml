id: MAT.8.31
reference: Matthew 8:31
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οἱ δὲ δαίμονες παρεκάλουν αὐτὸν λέγοντες· Εἰ ἐκβάλλεις ἡμᾶς, ⸂ἀπόστειλον ἡμᾶς⸃ εἰς τὴν ἀγέλην τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/031.yaml
  text: And the demons kept begging him[a], saying, “If you cast us out[b], send us into the herd of pigs.”
translation:
  language: ro
  text: 'Demonii îl rugau stăruitor[a], zicând: „Dacă ne alungi, trimite-ne în turma de porci.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „îl rugau” ori „îl implorau”; verbul grecesc este la imperfect și poate sugera o acțiune continuă sau repetată.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ δαίμονες
  choice: Demonii
  rationale: Redă direct ființele spirituale rele și continuarea narațiunii; în română nu este necesară exprimarea separată a lui δέ la începutul versetului.
- source_word: παρεκάλουν
  choice: îl rugau stăruitor
  rationale: Imperfectul indică o acțiune continuă sau repetată, iar formularea este firească și păstrează intensitatea rugăminții.
- source_word: λέγοντες
  choice: zicând
  rationale: Păstrează participiul care introduce vorbirea directă într-un registru biblic demn, dar încă inteligibil.
- source_word: Εἰ ἐκβάλλεις ἡμᾶς
  choice: Dacă ne alungi
  rationale: Păstrează condiția exprimată prin Εἰ și redă idiomatic ideea scoaterii forțate, fără a o explica suplimentar.
- source_word: ἀπόστειλον ἡμᾶς
  choice: trimite-ne
  rationale: Imperativul aorist cere o acțiune directă; această formulare este concisă și naturală.
- source_word: εἰς τὴν ἀγέλην τῶν χοίρων
  choice: în turma de porci
  rationale: Este echivalentul românesc curent și precis pentru destinația cerută.
theological_decisions:
- issue: Natura ființelor care îi vorbesc lui Isus
  choice: demoni
  alternative: duhuri demonice
  rationale: „Demoni” păstrează afirmația textului despre ființe rele personale, fără adaos explicativ sau nuanțare doctrinară.
- issue: Forța condiției Εἰ
  choice: Dacă ne alungi
  alternative: Fiindcă ne alungi
  rationale: Forma condițională păstrează ambiguitatea și perspectiva vorbitorilor, fără a transforma condiția într-o afirmație cauzală.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. „Zicând” păstrează structura greacă fără a produce obscuritate; „porci” este forma contemporană firească.
