  text: 'Când a intrat în Capernaum, s-a apropiat de el un centurion, rugându-l:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσελθόντος δὲ αὐτοῦ
  choice: Când a intrat
  rationale: Genitivul absolut cu participiu aorist este redat printr-o propoziție temporală firească în română, fără a preciza excesiv dacă acțiunea este strict anterioară sau simultană.
- source_word: εἰς Καφαρναοὺμ
  choice: în Capernaum
  rationale: Toponimul urmează forma românească biblică consacrată; prepoziția este integrată firesc cu verbul „a intra”.
- source_word: προσῆλθεν αὐτῷ
  choice: s-a apropiat de el
  rationale: Redă direct sensul contextual al lui προσέρχομαι și evită formularea mai puțin precisă „a venit la el”.
- source_word: ἑκατόνταρχος
  choice: un centurion
  rationale: Termenul românesc consacrat păstrează rangul militar specific, fără a-l generaliza drept simplu ofițer.
- source_word: παρακαλῶν αὐτὸν
  choice: rugându-l stăruitor
  rationale: Participiul exprimă o cerere insistentă și introduce vorbirea din versetul următor; formularea este naturală și demnă, fără intensitatea posibil excesivă a lui „implorându-l”.
theological_decisions: []
