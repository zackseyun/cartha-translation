id: MAT.8.11
reference: Matthew 8:11
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: ro
  text: Dar vă spun că mulți vor veni de la răsărit și de la apus[b] și se vor așeza la masă[a] cu Avraam, Isaac și Iacov în Împărăția cerurilor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, „vor sta întinși la masă”; în lumea antică, oamenii luau adesea masa festivă stând întinși pe paturi joase.
    reason: cultural_note
  - marker: b
    text: Expresia „de la răsărit și de la apus” indică oameni veniți din ținuturi îndepărtate și poate include persoane din afara lui Israel.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Dar vă spun
  rationale: Verbul λέγω este redat firesc prin „vă spun”, iar δέ marchează aici un contrast sau o nouă dezvoltare în discurs, exprimată natural prin „Dar”.
- source_word: πολλοὶ
  choice: mulți
  rationale: Adjectivul este folosit substantival; româna permite aceeași redare concisă fără adăugarea substantivului „oameni”.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: de la răsărit și de la apus
  rationale: Pluralurile grecești desemnează idiomatic direcții sau regiuni. Formula românească păstrează întinderea geografică și este clară, fără a preciza în text identitatea celor veniți.
- source_word: ἥξουσιν
  choice: vor veni
  rationale: ἥκω are aici sensul obișnuit de „a veni/a sosi”; „vor veni” este forma cea mai naturală în context.
- source_word: ἀνακλιθήσονται
  choice: se vor așeza la masă
  rationale: Verbul evocă poziția culcată la masa unui ospăț antic. Redarea comunică limpede participarea la masă și păstrează imaginea ospățului, iar detaliul cultural este explicat în notă.
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: cu Avraam, Isaac și Iacov
  rationale: μετά cu genitivul exprimă asocierea, aici părtășia la masă. Numele urmează formele românești consacrate.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: în Împărăția cerurilor
  rationale: Expresia caracteristică lui Matei este redată prin formula românească consacrată și exactă, fără literalismul nefiresc al unei formulări precum „împărăția cerurilor celor multe”.
theological_decisions:
- issue: Imaginea ospățului și părtășia escatologică
  choice: Păstrarea explicită a imaginii mesei prin „se vor așeza la masă”
  alternative: „vor sta” sau „se vor așeza” fără menționarea mesei
  rationale: Versetul evocă participarea la un ospăț, nu doar prezența în același loc. Redarea păstrează această forță teologică și culturală fără a adăuga detalii doctrinare.
- issue: Identitatea celor „mulți” veniți de la răsărit și de la apus
  choice: Păstrarea formulării geografice, fără a-i numi explicit neevrei
  alternative: „mulți dintre neamuri vor veni”
  rationale: Contextul poate sugera includerea celor din afara lui Israel, însă textul grecesc spune doar „mulți” veniți din răsărit și apus. Traducerea păstrează implicația fără să transforme interpretarea în text explicit.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. „Împărăția cerurilor” și formele numelor patriarhilor urmează uzul biblic românesc consacrat; construcția propoziției rămâne naturală pentru cititorul contemporan.
