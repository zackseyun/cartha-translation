id: MAT.8.9
reference: Matthew 8:9
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: ro
  text: 'Căci și eu sunt un om sub autoritate și am soldați sub comanda mea. Îi spun acestuia: «Du-te!», și se duce; altuia: «Vino!», și vine; iar sclavului meu[a]: «Fă aceasta!», și o face.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „slujitorului meu” (grecescul doulos).'
    reason: Alternativă lexicală mai generală pentru termenul grecesc δούλος; textul principal păstrează explicit statutul social de sclavie.
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Căci și
  rationale: Redă valoarea explicativă a lui γάρ și păstrează contribuția lui καί, prin care centurionul se include într-o structură de autoritate comparabilă.
- source_word: ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν
  choice: sunt un om aflat sub autoritate
  rationale: Formulare românească firească, ce păstrează ideea de subordonare într-un lanț de comandă fără a preciza în mod nejustificat autoritatea concretă.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: am soldați sub comanda mea
  rationale: Exprimă limpede raportul militar de subordonare; simpla formulare «sub mine» ar fi mai puțin idiomatică în româna actuală.
- source_word: λέγω τούτῳ
  choice: Îi spun unuia
  rationale: Păstrează caracterul distributiv al exemplelor, într-o exprimare mai naturală decât literalul «îi spun acestuia».
- source_word: Πορεύθητι
  choice: Du-te!
  rationale: Imperativ direct și idiomatic, adecvat unei porunci de plecare.
- source_word: ἄλλῳ· Ἔρχου
  choice: 'altuia: «Vino!»'
  rationale: Păstrează paralelismul concis dintre cei doi soldați și comenzile opuse.
- source_word: δούλῳ
  choice: robului
  rationale: Termenul indică în primul rând o persoană aflată în statut de sclavie, nu doar un slujitor angajat; «rob» este concis, demn și consacrat în registrul biblic românesc.
- source_word: Ποίησον τοῦτο
  choice: Fă aceasta!
  rationale: Redare directă, clară și suficient de solemnă a poruncii grecești.
theological_decisions:
- issue: Sensul lui δοῦλος în exemplul centurionului
  choice: rob
  alternative: slujitor / sclav
  rationale: «Rob» păstrează subordonarea socială puternică exprimată de termenul grec fără a reduce relația la serviciu voluntar. Nota consemnează echivalentul social explicit «sclav», evitând ascunderea realității istorice.
- issue: Relația centurionului cu autoritatea
  choice: aflat sub autoritate
  alternative: supus autorității cuiva
  rationale: Textul nu numește persoana sau instituția superioară. Formularea aleasă conservă această nedeterminare și analogia centurionului dintre autoritatea primită și autoritatea exercitată.
translation_notes:
  register: Română standard modernă, clară și demnă. Paralelismul poruncă–ascultare este păstrat prin propoziții scurte și simetrice; punctuația marchează natural vorbirea directă.
