id: MAT.8.16
reference: Matthew 8:16
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης προσήνεγκαν αὐτῷ δαιμονιζομένους πολλούς· καὶ ἐξέβαλεν τὰ πνεύματα λόγῳ, καὶ πάντας τοὺς κακῶς ἔχοντας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
translation:
  language: ro
  text: Când s-a făcut seară, au adus la el mulți demonizați[a]. El a alungat duhurile cu un cuvânt și i-a vindecat pe toți cei bolnavi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „mulți chinuiți de demoni”. Participiul grecesc se referă la persoane aflate sub influență demonică; „demonizați” este redarea concisă, consacrată.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Când s-a făcut seară
  rationale: Construcția la genitiv absolut exprimă timpul; formularea este firească în româna actuală și păstrează explicit instalarea serii.
- source_word: προσήνεγκαν αὐτῷ
  choice: au adus la el
  rationale: Verbul προσφέρω descrie aici aducerea unor persoane la Isus; redarea este directă și idiomatică.
- source_word: δαιμονιζομένους πολλούς
  choice: mulți demonizați
  rationale: Participiul îi desemnează pe cei aflați sub influență demonică. „Demonizați” este o redare concisă și consacrată, iar nota păstrează o alternativă care nu precizează excesiv natura acestei influențe.
- source_word: ἐξέβαλεν τὰ πνεύματα
  choice: a alungat duhurile
  rationale: În contextul exorcizării, ἐκβάλλω are sensul de a scoate sau a izgoni. „A alungat” este natural, iar „duhurile” redă direct substantivul grecesc fără adaosul explicit „rele”.
- source_word: λόγῳ
  choice: cu un cuvânt
  rationale: Dativul are valoare instrumentală. Formularea păstrează accentul asupra autorității exercitate printr-un singur cuvânt, fără a adăuga pronumele posesiv absent din greacă.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: pe toți cei bolnavi
  rationale: Expresia idiomatică grecească înseamnă „a fi bolnav”; formularea românească este clară și potrivită contextului vindecărilor.
- source_word: ἐθεράπευσεν
  choice: i-a vindecat
  rationale: θεραπεύω denumește în relatările evanghelice vindecarea; pronumele „i-” este cerut de sintaxa firească a limbii române.
theological_decisions:
- issue: Natura stării exprimate de δαιμονιζομένους și realitatea duhurilor
  choice: „demonizați” și „duhurile”
  alternative: „chinuiți de demoni”; reinterpretarea lor drept persoane cu boli psihice
  rationale: Versetul distinge alungarea duhurilor de vindecarea bolnavilor. Traducerea păstrează categoriile proprii relatării, fără a le reduce la o explicație psihologică și fără a defini mai precis decât textul gradul influenței demonice.
- issue: Forța instrumentală a lui λόγῳ
  choice: „cu un cuvânt”
  alternative: „prin cuvântul său”; „vorbind”
  rationale: Redarea instrumentală evidențiază autoritatea poruncii lui Isus, dar nu introduce elemente care nu sunt exprimate explicit în text.
translation_notes:
  register: Registru modern, demn și accesibil. S-a evitat capitalizarea reverențială a pronumelui și nu s-au adăugat calificative precum „rele” la „duhurile”, deoarece acestea nu apar explicit în greacă. Marcajul notei este așezat lângă termenul pe care îl explică.
