source:
  edition: SBLGNT
  text: Καὶ ἐμβάντι αὐτῷ ⸀εἰς πλοῖον ἠκολούθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/023.yaml
  text: And when he got into the boat[b][a], his disciples followed him.
translation:
  language: ro
  text: Și, când s-a urcat în barcă, ucenicii lui l-au urmat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβάντι
  choice: când a urcat
  rationale: Participiul aorist indică aici împrejurarea temporală a acțiunii principale. În româna actuală, „când a urcat” redă firesc intrarea într-o barcă și lasă contextului să indice succesiunea imediată.
- source_word: πλοῖον
  choice: barcă
  rationale: Termenul poate desemna o ambarcațiune de diferite dimensiuni; în cadrul narațiunilor de pe Marea Galileei, „barcă” este formularea modernă și firească. Româna permite construcția definită „în barcă” fără a cere o notă despre lipsa articolului grecesc.
- source_word: ἠκολούθησαν
  choice: l-au urmat
  rationale: Verbul exprimă deplasarea ucenicilor după Isus, păstrând totodată rezonanța mai largă a uceniciei, fără a o explicita prin parafrază.
- source_word: μαθηταὶ
  choice: ucenicii
  rationale: „Ucenici” este termenul românesc consacrat și încă inteligibil pentru cei care îl urmează și învață de la Isus.
- source_word: αὐτῷ ... αὐτῷ ... αὐτοῦ
  choice: a urcat / l- / lui
  rationale: Pronumele se referă contextual la Isus. Româna redă primul referent prin subiectul subînțeles al verbului, iar următoarele prin „l-” și „lui”, evitând repetiția greoaie.
theological_decisions:
- issue: Nuanța de ucenicie a verbului ἀκολουθέω
  choice: l-au urmat
  alternative: au mers după el / l-au însoțit
  rationale: „L-au urmat” descrie mișcarea fizică și păstrează simultan posibila rezonanță a uceniciei, fără a transforma relatarea într-o afirmație teologică explicită.
translation_notes:
  register: Formulare modernă, clară și demnă. Topica păstrează legătura strânsă dintre urcarea lui Isus în barcă și reacția ucenicilor, fără rigiditatea unei redări participiale literale.
