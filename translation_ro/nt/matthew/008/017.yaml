id: MAT.8.17
reference: Matthew 8:17
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Αὐτὸς τὰς ἀσθενείας ἡμῶν ἔλαβεν καὶ τὰς νόσους ἐβάστασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[b][a], saying: “He himself took our sicknesses and carried our diseases.”'
translation:
  language: ro
  text: 'ca să se împlinească ceea ce fusese spus prin profetul Isaia: „El însuși a luat slăbiciunile noastre[a] și a purtat bolile noastre[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „neputințele” ori „suferințele trupești”. Termenul grecesc poate desemna slăbiciuni, neputințe sau boli.
    reason: lexical_alternative
  - marker: b
    text: Sau „a dus bolile noastre”. „A purtat” păstrează mai bine legătura verbală cu Isaia 53:4.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: ca să se împlinească
  rationale: Redă natural în română construcția de scop/rezultat și păstrează motivul mateian al împlinirii.
- source_word: τὸ ῥηθὲν
  choice: ceea ce fusese spus
  rationale: Participiul articular este redat idiomatic, iar mai-mult-ca-perfectul marchează firesc anterioritatea rostirii profetice.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: prin profetul Isaia
  rationale: Prepoziția «prin» păstrează ideea de mijlocire sau instrument al rostirii profetice.
- source_word: λέγοντος
  choice: ':'
  rationale: În română, după formula «ceea ce fusese spus prin profetul Isaia», două puncte introduc citatul mai firesc decât un redundant «care zice».
- source_word: Αὐτὸς
  choice: El însuși
  rationale: Păstrează accentul explicit al pronumelui grecesc.
- source_word: ἀσθενείας
  choice: slăbiciunile
  rationale: Păstrează sensul lexical mai larg al termenului, care poate desemna slăbiciuni, neputințe sau suferințe trupești; contextul vindecărilor susține nuanța fizică.
- source_word: ἔλαβεν
  choice: a luat
  rationale: Redare directă, fără a adăuga sensul interpretativ «a îndepărtat» și fără a confunda verbul cu βαστάζω.
- source_word: νόσους
  choice: bolile
  rationale: Termen românesc precis și curent pentru afecțiuni sau boli.
- source_word: ἐβάστασεν
  choice: a purtat
  rationale: Redă sensul de a duce/a purta și păstrează rezonanța citatului din Isaia fără a explicita o anumită teorie teologică.
theological_decisions:
- issue: Redarea citatului din Isaia 53:4 în contextul vindecărilor din Matei
  choice: „slăbiciunile noastre” și „bolile noastre”
  alternative: „neputințele/suferințele noastre” și „bolile noastre”; ori o formulare cu o rezonanță substitutivă mai accentuată
  rationale: Contextul imediat privește vindecarea suferințelor trupești, dar vocabularul citatului rămâne suficient de larg pentru a nu restrânge sensul la o singură formulare doctrinară. «A purtat» conservă tensiunea și legătura intertextuală cu Isaia.
translation_notes:
  register: Română standard modernă, clară și demnă. Topica este firească, pronumele emfatic este păstrat, iar introducerea citatului prin două puncte evită o formulă participială greoaie.
