  text: ἦν δὲ μακρὰν ἀπ’ αὐτῶν ἀγέλη χοίρων πολλῶν βοσκομένη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/030.yaml
  text: A large herd of pigs was feeding some distance away from them[a].
translation:
  language: ro
  text: Departe de ei era o turmă mare de porci care păștea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν δὲ
  choice: La ... păștea
  rationale: δέ este un conector narativ slab și nu impune un «acum» temporal; în română, curgerea narațiunii este redată firesc fără un marcator separat. Existența turmei este exprimată idiomatic prin construcția locativă și verbul «păștea».
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: la o oarecare depărtare de ei
  rationale: Redă distanța spațială într-o română naturală, fără a fixa mai precis decât textul cât de mare era distanța.
- source_word: ἀγέλη
  choice: turmă
  rationale: «Turmă» este termenul românesc obișnuit pentru un grup de animale și se potrivește aici porcilor.
- source_word: χοίρων
  choice: de porci
  rationale: Este echivalentul modern, direct și neutru al substantivului grecesc.
- source_word: πολλῶν
  choice: mare
  rationale: Deși forma grecească înseamnă literal «mulți», alături de substantivul colectiv «turmă», româna exprimă firesc cantitatea prin «o turmă mare».
- source_word: βοσκομένη
  choice: păștea
  rationale: Participiul prezintă turma hrănindu-se. «Păștea» este concis și idiomatic în context, fără a introduce ideea neexplicită că turma era păzită sau îngrijită de cineva.
theological_decisions: []
translation_notes:
  register: Română standard modernă, clară și demnă. Topica locativă păstrează focalizarea inițială asupra distanței, iar formularea evită un marcator temporal absent din greacă.
