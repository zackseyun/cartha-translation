source:
  edition: SBLGNT
  text: καὶ προσελθὼν εἷς γραμματεὺς εἶπεν αὐτῷ· Διδάσκαλε, ἀκολουθήσω σοι ὅπου ἐὰν ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/019.yaml
  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: ro
  text: 'Și un cărturar s-a apropiat și i-a spus: „Învățătorule, te voi urma oriunde vei merge[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „oriunde vei pleca” sau „oriunde te vei duce”. Verbul grecesc poate desemna mai precis plecarea sau ducerea dintr-un loc, deși aici funcționează natural cu sensul „a merge”.'
    reason: alternative lexicală pentru ἀπέρχῃ
lexical_decisions:
- source_word: προσελθὼν
  choice: s-a apropiat
  rationale: Participiul aorist indică apropierea de Isus înainte de rostirea cuvintelor; formularea este firească în româna actuală și păstrează sensul de mișcare către cineva.
- source_word: εἷς
  choice: un
  rationale: Numeralul introduce aici idiomatic un individ; în română, „un cărturar” redă natural construcția, fără a sugera nejustificat „unul dintre cărturari”.
- source_word: γραμματεὺς
  choice: cărturar
  rationale: Este termenul românesc biblic consacrat pentru specialistul în Scriptură și Lege, fiind mai puțin explicativ decât „învățător al Legii” sau „expert în Lege”.
- source_word: Διδάσκαλε
  choice: Învățătorule
  rationale: Redă direct titlul și vocativul grecesc, fără a introduce conotațiile mai puternice ale lui „Stăpâne” sau titlul netradus „Rabbi”.
- source_word: ἀκολουθήσω
  choice: te voi urma
  rationale: Viitorul indicativ exprimă declarația de intenție a cărturarului și păstrează atât sensul concret al urmării, cât și posibila rezonanță a uceniciei.
- source_word: ὅπου ἐὰν
  choice: oriunde
  rationale: Construcția are sens relativ nedefinit și exprimă caracterul nelimitat al promisiunii.
- source_word: ἀπέρχῃ
  choice: vei merge
  rationale: Deși verbul poate însemna mai precis „a pleca” sau „a se duce”, în acest context „vei merge” este redarea românească firească a deplasării către orice destinație.
theological_decisions:
- issue: Redarea lui διδάσκαλος ca titlu adresat lui Isus
  choice: Învățătorule
  alternative: Stăpâne; Rabbi
  rationale: Textul exprimă o adresare respectuoasă, fără să impună aici un titlu cristologic mai accentuat; „Învățătorule” păstrează sensul lexical și tensiunea proprie contextului.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. „Cărturar” păstrează terminologia biblică uzuală, iar ordinea propoziției rămâne apropiată de greacă fără a suna rigid.
