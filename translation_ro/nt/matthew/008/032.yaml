  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑπάγετε. οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς ⸂τοὺς χοίρους⸃· καὶ ἰδοὺ ὥρμησεν πᾶσα ἡ ⸀ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, καὶ ἀπέθανον ἐν τοῖς ὕδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: ro
  text: 'El le-a zis: „Duceți-vă!” Iar ei au ieșit și au intrat în porci. Și iată, toată turma s-a repezit în jos pe povârnișul abrupt[a], în mare, iar porcii au murit în ape.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „în jos pe râpă”. Termenul grecesc poate desemna o pantă abruptă, un mal abrupt sau o prăpastie.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau, potrivit sensului implicat de context: „s-au înecat în ape”. Greaca spune mai literal: „au murit în ape”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Duceți-vă!
  rationale: Imperativul redă firesc și concis porunca scurtă a lui Isus, fără a adăuga o nuanță de alungare mai puternică decât exprimă textul.
- source_word: οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς τοὺς χοίρους
  choice: Iar ei au ieșit și au intrat în porci
  rationale: Formularea păstrează succesiunea acțiunilor și referința implicită la demoni; „au intrat” exprimă natural în română deplasarea εἰς τοὺς χοίρους.
- source_word: ἰδοὺ
  choice: Și iată
  rationale: Păstrează marcatorul discursiv care atrage atenția și conferă vivacitate relatării.
- source_word: πᾶσα ἡ ἀγέλη
  choice: toată turma
  rationale: Echivalent românesc direct și firesc pentru substantivul colectiv determinat de πᾶσα.
- source_word: ὥρμησεν
  choice: s-a repezit
  rationale: Redă mișcarea bruscă și puternică exprimată de verb, fără a preciza mai mult decât sursa.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: la vale, pe povârniș
  rationale: Exprimă atât direcția descendentă, cât și terenul abrupt, fără a presupune neapărat o stâncă verticală.
- source_word: τὴν θάλασσαν
  choice: mare
  rationale: Urmează termenul grecesc, fără a-l înlocui în text cu explicația geografică „lac”.
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: porcii au murit în ape
  rationale: Păstrează afirmația explicită „au murit”, iar repetarea subiectului evită în română ambiguitatea că demonii ar fi murit și reflectă pluralul verbului grecesc.
theological_decisions:
- issue: Gradul de precizare a felului în care au murit porcii
  choice: au murit în ape
  alternative: s-au înecat în ape
  rationale: Contextul indică înecul, dar greaca afirmă literal că au murit în ape. Textul principal nu transformă această implicație într-o precizare explicită.
translation_notes:
  register: Română standard modernă, într-un registru narativ demn și accesibil. „Și iată” conservă vivacitatea textului biblic, iar „povârniș” păstrează caracterul abrupt al terenului fără a impune imaginea unei stânci verticale.
