  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: ro
  text: 'El le-a zis: „De ce sunteți fricoși, voi cu puțină credință?” Apoi s-a ridicat, a mustrat vânturile și marea, și s-a făcut o mare liniște.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: fricoși
  rationale: Redă direct ideea de teamă și lipsă de curaj, păstrând tonul mustrător al întrebării.
- source_word: ὀλιγόπιστοι
  choice: puțin credincioșilor
  rationale: Păstrează forma de adresare și legătura transparentă cu ideea unei credințe mici/slabe, fără a o transforma într-o afirmație despre necredință totală.
- source_word: ἐπετίμησεν
  choice: a mustrat
  rationale: Echivalent biblic românesc firesc pentru o poruncă autoritară adresată vânturilor și mării.
- source_word: γαλήνη μεγάλη
  choice: o liniște mare
  rationale: Păstrează intensificarea explicită prin μεγάλη și descrie încetarea furtunii într-o formulare naturală.
theological_decisions:
- issue: Sensul lui ὀλιγόπιστοι
  choice: puțin credincioșilor
  alternative: oameni cu puțină credință
  rationale: Forma aleasă păstrează apelativul compact din greacă și tensiunea dintre existența credinței și insuficiența ei.
- issue: Subiectul implicit al verbelor
  choice: El / S-a ridicat / a mustrat
  alternative: Isus / ridicându-Se / a certat
  rationale: Contextul identifică limpede subiectul; nu se introduce aici numele „Isus”, absent din verset, iar succesiunea acțiunilor este păstrată.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Topica a fost ușor naturalizată, păstrând întrebarea retorică, adresarea directă și succesiunea narațiunii grecești.
