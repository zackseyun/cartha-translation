id: MAT.8.15
reference: Matthew 8:15
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἥψατο τῆς χειρὸς αὐτῆς, καὶ ἀφῆκεν αὐτὴν ὁ πυρετός, καὶ ἠγέρθη καὶ διηκόνει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/015.yaml
  text: And he touched her hand, and the fever left her, and she got up and began serving him.
translation:
  language: ro
  text: Și i-a atins mâna, iar febra a lăsat-o; ea s-a ridicat și îi slujea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „a început să-i slujească”. Imperfectul grecesc poate descrie o acțiune în desfășurare, dar poate sugera și începutul ei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥψατο
  choice: a atins
  rationale: Verbul la diateza medie înseamnă aici a atinge sau a intra în contact cu; formularea este firească și nu exagerează gestul.
- source_word: τῆς χειρὸς αὐτῆς
  choice: i-a atins mâna
  rationale: χείρ desemnează în mod obișnuit mâna, iar genitivul cerut de verb este redat idiomatic în română prin construcția cu pronume personal și complement direct.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: febra a lăsat-o
  rationale: Păstrează construcția personificată a grecei și exprimă natural încetarea febrei.
- source_word: πυρετός
  choice: febra
  rationale: Substantivul denumește direct febra; nu este necesară o explicitare precum «boala febrilă».
- source_word: ἠγέρθη
  choice: s-a ridicat
  rationale: Forma pasivă are aici sens intranzitiv și descrie simplu ridicarea femeii după vindecare, fără a introduce nejustificat o asociere cu învierea.
- source_word: διηκόνει αὐτῷ
  choice: îi slujea
  rationale: Imperfectul descrie o acțiune în desfășurare; «îi slujea» este natural, demn și păstrează deschisă posibilitatea unei nuanțe ingresive.
theological_decisions:
- issue: Posibila suprainterpretare teologică a lui ἠγέρθη
  choice: s-a ridicat
  alternative: a fost ridicată
  rationale: În contextul imediat este vorba despre ridicarea ei după vindecare; traducerea nu trebuie să importe aici o aluzie explicită la înviere.
- issue: Forța aspectuală a imperfectului διηκόνει
  choice: îi slujea
  alternative: a început să-i slujească
  rationale: Imperfectul poate descrie pur și simplu o acțiune continuă și nu impune lexical ideea de început; alternativa ingresivă rămâne consemnată în notă.
translation_notes:
  register: Română standard modernă, cu o formulare narativă clară și demnă. «Îi slujea» evită atât registrul arhaic, cât și explicitarea excesivă a aspectului verbal.
