id: MAT.8.3
reference: Matthew 8:3
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο ⸀αὐτοῦ λέγων· Θέλω, καθαρίσθητι· καὶ εὐθέως ἐκαθαρίσθη αὐτοῦ ἡ λέπρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/003.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing[c][b]; be cleansed.” And immediately his leprosy was cleansed.
translation:
  language: ro
  text: 'Și-a întins mâna, l-a atins și a zis: „Vreau; fii curățit!” Și îndată a fost curățit de lepră.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Termenul grecesc tradus prin „lepră” poate desemna o categorie mai largă de boli grave ale pielii, nu numai boala Hansen numită astăzi lepră.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: Și-a întins mâna
  rationale: Redă firesc participiul aorist ca acțiune care precedă atingerea și păstrează gestul concret.
- source_word: ἥψατο αὐτοῦ
  choice: l-a atins
  rationale: ἅπτομαι cu genitivul are aici sensul obișnuit de „a atinge”; formularea este simplă și naturală în română.
- source_word: Θέλω
  choice: Vreau
  rationale: În răspunsul la întrebarea implicită privind voința lui Isus, „Vreau” exprimă direct disponibilitatea sa, fără a introduce o nuanță de viitor.
- source_word: καθαρίσθητι
  choice: fii curățit
  rationale: Imperativul pasiv păstrează atât dimensiunea vindecării fizice, cât și limbajul curăției rituale.
- source_word: εὐθέως
  choice: îndată
  rationale: Termen românesc curent în registrul biblic, care redă caracterul imediat al rezultatului.
- source_word: ἐκαθαρίσθη αὐτοῦ ἡ λέπρα
  choice: lepra lui a fost curățită
  rationale: Păstrează subiectul gramatical al textului grec și repetarea intenționată a verbului „a curăți”, în loc să reducă expresia la simpla vindecare.
theological_decisions:
- issue: Limbajul curățirii și al vindecării în καθαρίζω
  choice: „curățit/curățită” atât în poruncă, cât și în rezultat
  alternative: „vindecat/vindecată”
  rationale: Textul grec folosește explicit limbajul curățirii, care poate cuprinde deopotrivă refacerea fizică și înlăturarea necurăției rituale.
- issue: Sensul lui Θέλω în răspunsul lui Isus
  choice: „Vreau”
  alternative: „Voiesc” sau „Sunt dispus”
  rationale: „Vreau” este modern, direct și demn, răspunzând exact afirmației condiționale din versetul anterior, fără arhaism sau explicație adăugată.
translation_notes:
  register: Română standard modernă, cu formulare concisă și demnă. „Îndată” și „fii curățit” păstrează tonalitatea biblică fără a recurge la forme arhaice precum „voiesc”. Marcajul notei este plasat după enunțul care conține termenul explicat.
