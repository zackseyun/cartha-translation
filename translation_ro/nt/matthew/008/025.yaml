id: MAT.8.25
reference: Matthew 8:25
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ⸀προσελθόντες ἤγειραν αὐτὸν λέγοντες· Κύριε, ⸀σῶσον, ἀπολλύμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/025.yaml
  text: And they came and woke him[a], saying, “Lord, save us! We are perishing!”
translation:
  language: ro
  text: 'Și, apropiindu-se, L-au trezit, spunând: „Doamne, salvează-ne![a] Pierim!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „scapă-ne”. Imperativul grecesc σῶσον poate desemna salvarea imediată dintr-o primejdie, precum și salvarea în sens mai larg.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: apropiindu-se
  rationale: Participiul aorist indică apropierea ucenicilor de Isus înainte de a-L trezi; formularea păstrează succesiunea și redă explicit mișcarea spre El.
- source_word: ἤγειραν
  choice: L-au trezit
  rationale: În contextul somnului, ἐγείρω are sensul concret de a trezi, fără vreo conotație necesară de înviere.
- source_word: λέγοντες
  choice: spunând
  rationale: Redare directă a participiului prezent, fără a adăuga ideea de strigăt, care nu este exprimată lexical.
- source_word: Κύριε
  choice: Doamne
  rationale: Vocativul românesc firesc pentru κύριος păstrează atât adresarea respectuoasă, cât și posibila greutate cristologică.
- source_word: σῶσον
  choice: salvează-ne
  rationale: Imperativul aorist exprimă o cerere urgentă de scăpare din primejdie; obiectul plural este implicit din context și este cerut de idiomul românesc.
- source_word: ἀπολλύμεθα
  choice: pierim
  rationale: Prezentul exprimă primejdia imediată de ruină sau moarte; „pierim” este concis, urgent și natural în româna actuală.
theological_decisions:
- issue: Redarea titlului κύριος adresat lui Isus
  choice: Doamne
  alternative: Învățătorule / Stăpâne
  rationale: „Doamne” păstrează deschisă amplitudinea termenului, de la adresare respectuoasă la semnificație cristologică, fără să o reducă la un simplu rol funcțional.
- issue: Exprimarea obiectului implicit al imperativului σῶσον
  choice: salvează-ne
  alternative: salvează
  rationale: Deși obiectul nu este exprimat separat în greacă, persoana întâi plural din „pierim” și situația fac referința la ucenici neechivocă; româna cere firesc pronumele enclitic.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Inversiunea participială păstrează cursul narativ al grecei, iar exclamațiile redau urgența fără a adăuga detalii inexistente în text.
