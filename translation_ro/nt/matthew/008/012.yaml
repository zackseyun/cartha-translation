id: MAT.8.12
reference: Matthew 8:12
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οἱ δὲ υἱοὶ τῆς βασιλείας ἐκβληθήσονται εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/012.yaml
  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: ro
  text: Dar fiii Împărăției vor fi aruncați în întunericul de afară.[a] Acolo va fi plânsul și scrâșnirea dinților.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expresie idiomatică pentru cei considerați moștenitori de drept sau membri așteptați ai Împărăției.
    reason: clarificare_idiomatică
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ τῆς βασιλείας
  choice: Dar fiii Împărăției
  rationale: „Dar” redă contrastul marcat de δέ cu cei veniți de la răsărit și de la apus. Redarea literală a idiomului „fiii Împărăției” păstrează ironia celor socotiți moștenitori de drept sau membri așteptați ai Împărăției, care sunt totuși excluși.
- source_word: ἐκβληθήσονται
  choice: vor fi aruncați
  rationale: Viitorul pasiv al lui ἐκβάλλω exprimă o alungare energică; „vor fi aruncați” este firesc în româna actuală și păstrează forța imaginii.
- source_word: τὸ σκότος τὸ ἐξώτερον
  choice: întunericul de afară
  rationale: Expresia românească redă natural întunericul aflat în exterior, păstrând opoziția spațială din imaginea mateiană fără a o transforma într-un termen doctrinar explicit.
- source_word: ἐκεῖ
  choice: Acolo
  rationale: Poziționarea la începutul propoziției păstrează accentul locativ al grecescului ἐκεῖ.
- source_word: ὁ κλαυθμὸς
  choice: plânsul
  rationale: „Plânsul” redă substantivul articulat și exprimă lamentarea fără a-i intensifica nejustificat sensul.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: scrâșnirea dinților
  rationale: Este formula biblică românească bine cunoscută și corespunde îndeaproape construcției grecești.
theological_decisions:
- issue: Imaginea excluderii și a judecății
  choice: Se păstrează imaginile concrete „aruncați în întunericul de afară” și „plânsul și scrâșnirea dinților”.
  alternative: Parafrazarea prin termeni sistematici precum „iad” sau „pedeapsă veșnică”.
  rationale: Versetul descrie o excludere severă și suferință, dar nu folosește aici un termen explicit pentru „iad”; păstrarea imaginilor evită introducerea unor precizări doctrinare care depășesc formularea textului.
- issue: Redarea lui υἱοὶ în idiomul υἱοὶ τῆς βασιλείας
  choice: fiii Împărăției
  alternative: copiii Împărăției; moștenitorii Împărăției
  rationale: „Fiii” păstrează forma masculină și idiomul sursă, precum și tensiunea dintre statutul presupus și excluderea efectivă. Nota explică sensul idiomatic fără a-l înlocui în text.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Formularea păstrează concizia, paralelismul substantivelor articulate și imaginile puternice ale textului grec.
