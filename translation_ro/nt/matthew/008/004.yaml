id: MAT.8.4
reference: Matthew 8:4
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ὅρα μηδενὶ εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ, καὶ προσένεγκον τὸ δῶρον ὃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: ro
  text: 'Iar Isus i-a spus: „Vezi să nu spui nimănui, ci du-te, arată-te preotului și adu darul pe care l-a poruncit Moise[b], ca mărturie pentru ei[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expresia poate însemna și „drept dovadă pentru ei”. Pronumele „ei” nu are aici un referent explicit; mărturia poate fi înțeleasă ca dovadă prezentată preoților, iar unii o înțeleg ca mărturie împotriva celor care nu aveau să creadă.
    reason: alternative_reading
  - marker: b
    text: Această poruncă trimite la rânduiala dată prin Moise pentru omul curățit de lepră; vezi Leviticul 14.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅρα μηδενὶ εἴπῃς
  choice: Vezi să nu spui nimănui
  rationale: Redă construcția idiomatică de avertizare urmată de interdicție, într-o română firească, păstrând forța poruncii.
- source_word: ὕπαγε
  choice: du-te
  rationale: Imperativ simplu de mișcare, redat direct și natural.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: arată-te preotului
  rationale: Păstrează construcția reflexivă și aluzia la examinarea preoțească prescrisă pentru cel curățit.
- source_word: προσένεγκον τὸ δῶρον
  choice: adu darul
  rationale: În context cultic, verbul indică prezentarea darului prescris. Formularea păstrează termenul concret δῶρον și sună firesc în română.
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: pe care l-a poruncit Moise
  rationale: Redă direct autoritatea poruncii mozaice, fără a adăuga interpretări.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ca mărturie pentru ei
  rationale: Păstrează atât valoarea de scop sau rezultat, cât și caracterul nedefinit al mărturiei și al referentului pronumelui.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Isus i-a spus
  rationale: Prezentul istoric grecesc este redat prin perfect compus, timpul narativ firesc în româna modernă.
theological_decisions:
- issue: Referentul și sensul expresiei εἰς μαρτύριον αὐτοῖς
  choice: ca mărturie pentru ei
  alternative: ca dovadă pentru preoți; ca mărturie împotriva lor
  rationale: Textul grecesc nu precizează cine sunt „ei” și nici dacă mărturia are sens favorabil, probatoriu sau acuzator. Formularea aleasă păstrează această ambiguitate.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea este apropiată de structura greacă, dar evită rigiditatea. Ambiguitatea pronumelui αὐτοῖς și a funcției mărturiei este păstrată explicit.
