    rationale: Textul SBLGNT furnizat conține καὶ ἀποκριθεὶς ὁ ἑκατόνταρχος ἔφη. Nota despre omiterea formulei „Iar … a răspuns” nu este susținută de datele furnizate și nici nu corespunde deciziei lexicale urmărite. Ea trebuie eliminată și înlocuită, dacă se păstrează o notă a, cu nota lexicală pentru εἰπὲ λόγῳ, ancorată după „un cuvânt”.
  - severity: low
