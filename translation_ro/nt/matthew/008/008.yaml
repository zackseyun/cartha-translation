  naturalness: Româna este modernă, clară și are un registru potrivit. „Sub acoperișul meu”, „nu sunt vrednic” și „va fi vindecat” sunt firești. „Dar” este puțin mai natural decât „Ci” după propoziția negativă, păstrând opoziția lui ἀλλά.
  terminology: „Centurionul”, „Doamne”, „vrednic”, „slujitorul” și „vindecat” sunt alegeri adecvate. Sensul alternativ al lui παῖς trebuie păstrat în notă; „băiat” și „copil” sunt alternative reale. Pentru εἰπὲ λόγῳ, o notă lexicală cu alternativa idiomatică „spune doar cuvântul” este justificată.
  issues:
