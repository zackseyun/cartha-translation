source:
  edition: SBLGNT
  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: ro
  text: 'Iar centurionul a răspuns: „Doamne, nu sunt vrednic să intri sub acoperișul meu. Dar rostește doar un cuvânt[a], și slujitorul meu[b] va fi vindecat.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „spune doar cuvântul”. Greaca spune literal: „rostește printr-un cuvânt”.'
    reason: alternativă lexicală
  - marker: b
    text: Termenul grecesc poate însemna, după context, „slujitor”, „băiat” sau „copil”.
    reason: alternativă lexicală
lexical_decisions:
- source_word: καὶ ἀποκριθεὶς … ἔφη
  choice: Iar … a răspuns
  rationale: Participiul împreună cu verbul de vorbire formează o introducere narativă idiomatică. Redarea printr-un singur verb evită formula greoaie „răspunzând, a zis”, iar „Iar” păstrează legătura cu replica precedentă.
- source_word: ἑκατόνταρχος
  choice: centurionul
  rationale: Termenul consacrat și precis pentru ofițerul roman aflat la comanda unei centurii.
- source_word: Κύριε
  choice: Doamne
  rationale: Păstrează atât adresarea respectuoasă, cât și posibila rezonanță cristologică a lui κύριος, fără a o reduce la simplul „domnule”.
- source_word: οὐκ εἰμὶ ἱκανός
  choice: nu sunt vrednic
  rationale: În acest context, ἱκανός exprimă nevrednicia sau lipsa de statut potrivit, nu incapacitatea practică.
- source_word: ὑπὸ τὴν στέγην
  choice: sub acoperișul meu
  rationale: Păstrează imaginea concretă și idiomatică din greacă, firească și în română.
- source_word: ἀλλὰ μόνον εἰπὲ λόγῳ
  choice: Ci rostește doar un cuvânt
  rationale: Redare naturală a poruncii, păstrând accentul restrictiv al lui μόνον și ideea că rostirea lui Isus este suficientă pentru vindecare.
- source_word: ἰαθήσεται
  choice: va fi vindecat
  rationale: Redă clar viitorul pasiv al verbului ἰάομαι și nu precizează agentul vindecării mai mult decât o face textul.
- source_word: παῖς
  choice: slujitorul
  rationale: Contextul centurionului și paralela narativă susțin sensul „slujitor”, dar termenul poate însemna și „băiat” ori „copil”; ambiguitatea este semnalată în notă.
theological_decisions:
- issue: Sensul adresării Κύριε către Isus
  choice: Doamne
  alternative: domnule; stăpâne
  rationale: „Doamne” păstrează valoarea lexicală principală și posibila greutate cristologică a adresării, fără a afirma că vorbitorul formulează aici o mărturisire teologică deplină.
- issue: Identitatea lui παῖς
  choice: slujitorul
  alternative: băiatul; copilul
  rationale: „Slujitorul” se potrivește cel mai bine cadrului social și contextului narativ, însă polisemia reală a termenului este păstrată explicit în nota de subsol.
- issue: Agentul vindecării în forma pasivă ἰαθήσεται
  choice: va fi vindecat
  alternative: se va vindeca
  rationale: Pasivul românesc păstrează forma textului și lasă neexprimat agentul, evitând atât eliminarea, cât și precizarea nejustificată a acestuia.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Formularea evită atât arhaismele („zi numai cu cuvântul”), cât și exprimarea colocvială. Imaginea „sub acoperișul meu” este păstrată pentru concretețea ei.
