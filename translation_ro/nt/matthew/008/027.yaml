  source_fidelity: 'Textul redă corect sensul de bază al versetului: uimirea, întrebarea calitativă despre Isus și ascultarea vânturilor și a mării de el. Totuși, „au rămas uimiți” introduce nuanța de stare persistentă, care nu este exprimată de aoristul ἐθαύμασαν; „s-au mirat” este mai direct și mai aproape de reacția relatată.'
  naturalness: Formularea este în general firească în româna standard modernă. „Ce fel de om este acesta, de până și...” și „ascultă de el” sunt idiomatice și păstrează tonul narativ. „S-au mirat și au zis” este concis și natural.
  terminology: '„Oamenii” este acceptabil în context pentru οἱ ἄνθρωποι, fără a transforma referirea într-una despre omenire în general. Nota actuală trebuie restrânsă: explicația despre „ce natură are” poate sugera o afirmație metafizică pe care ποταπός nu o precizează; termenul întreabă ce fel de persoană este, cu uimire față de caracterul/calitatea sa.'
