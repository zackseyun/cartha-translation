  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οἱ δὲ ἄνθρωποι ἐθαύμασαν λέγοντες· Ποταπός ἐστιν οὗτος ὅτι καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα ⸂αὐτῷ ὑπακούουσιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/027.yaml
  text: And the men marveled[a], saying, “What sort of man is this, that even the winds and the sea obey him?”
translation:
  language: ro
  text: 'Iar oamenii s-au mirat și au zis: „Ce fel de om este acesta[a], de până și vânturile și marea ascultă de el?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expresia grecească întreabă ce fel de persoană este, punând în evidență uimirea față de felul sau calitatea sa.
    reason: Clarifică sensul calitativ al lui ποταπός fără a introduce noțiunea interpretativă de „natură”.
lexical_decisions:
- source_word: οἱ δὲ ἄνθρωποι
  choice: Iar oamenii
  rationale: „Oamenii” redă firesc pluralul ἄνθρωποι fără a accentua inutil sexul participanților; contextul îi identifică drept cei aflați cu Isus în barcă. „Iar” marchează discret legătura narativă exprimată de δέ.
- source_word: ἐθαύμασαν
  choice: au rămas uimiți
  rationale: Redă reacția puternică de mirare și uimire într-o română actuală și naturală.
- source_word: λέγοντες
  choice: și au zis
  rationale: Coordonarea este mai firească în narațiunea românească decât păstrarea literală a participiului „zicând”, fără a schimba raportul dintre reacție și cuvintele rostite.
- source_word: Ποταπός ἐστιν οὗτος
  choice: Ce fel de om este acesta
  rationale: Ποταπός întreabă despre felul sau natura persoanei, iar οὗτος păstrează referirea directă la Isus. Substantivul „om” este cerut în română pentru o formulare completă și naturală.
- source_word: ὅτι
  choice: de
  rationale: În construcția interogativă românească, „de” introduce natural motivul uimirii și corespunde funcției explicative a lui ὅτι.
- source_word: καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα
  choice: până și vânturile și marea
  rationale: „Până și” exprimă accentul cumulativ al lui καί, subliniind caracterul extraordinar al ascultării forțelor naturii.
- source_word: αὐτῷ ὑπακούουσιν
  choice: ascultă de el
  rationale: Expresia românească „a asculta de cineva” redă idiomatic sensul de supunere față de autoritatea unei persoane cuprins în ὑπακούω.
theological_decisions:
- issue: Forța cristologică a întrebării ucenicilor
  choice: Întrebarea este redată direct, păstrând uimirea față de autoritatea lui Isus asupra creației fără a explica explicit identitatea lui.
  alternative: O formulare interpretativă precum „Cine poate fi omul acesta?” ar face mai explicită implicația despre identitatea lui Isus.
  rationale: Textul grec lasă întrebarea deschisă și creează tensiune narativă. Traducerea păstrează această tensiune și autoritatea extraordinară implicată, fără a adăuga o concluzie doctrinară.
translation_notes:
  register: Română standard modernă, clară și demnă. „Au rămas uimiți” evită caracterul ușor arhaizant al lui „s-au minunat”, iar „ascultă de el” este expresia românească firească pentru supunerea față de o autoritate personală.
