id: MAT.8.22
reference: Matthew 8:22
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀λέγει αὐτῷ· Ἀκολούθει μοι, καὶ ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: ro
  text: 'Dar Isus îi spune: „Urmează-mă și lasă-i pe cei morți[a] să-și îngroape morții.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Prima referire la „cei morți” este adesea înțeleasă metaforic: cei nereceptivi spiritual îi pot îngropa pe cei morți fizic.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Dar
  rationale: Redă contrastul moderat dintre cererea ucenicului și răspunsul corectiv al lui Isus, fără a-l accentua excesiv.
- source_word: λέγει αὐτῷ
  choice: îi spune
  rationale: Păstrează prezentul istoric al narațiunii grecești și redă firesc pronumele indirect.
- source_word: Ἀκολούθει μοι
  choice: Urmează-mă
  rationale: Imperativ direct și idiomatic, care păstrează atât ideea urmării, cât și chemarea la ucenicie.
- source_word: ἄφες
  choice: lasă-i
  rationale: Exprimă direct renunțarea la această responsabilitate; pronumele anticipativ este firesc în construcția românească.
- source_word: νεκροὺς ... νεκρούς
  choice: cei morți ... morții
  rationale: Păstrează repetarea deliberată a aceluiași termen și nu introduce în text precizarea interpretativă „morți spiritual”.
- source_word: θάψαι
  choice: să-și îngroape
  rationale: După „lasă-i”, conjunctivul este construcția românească naturală; forma reflexivă leagă acțiunea de propriul lor grup.
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: să-și îngroape morții
  rationale: Pronumele reflexiv „-și” redă posesia reflexivă exprimată de ἑαυτῶν, fără formularea mai greoaie „propriii lor morți”.
theological_decisions:
- issue: Sensul celor două apariții ale termenului „morți”
  choice: Textul principal păstrează formularea „cei morți ... morții”, fără a explica prima apariție drept „morți spiritual”.
  alternative: Prima apariție poate desemna metaforic oamenii insensibili sau nereceptivi spiritual, iar a doua, oamenii morți fizic.
  rationale: Greaca folosește același cuvânt în ambele locuri, creând un joc de cuvinte provocator. Traducerea păstrează ambiguitatea și tensiunea teologică, iar interpretarea probabilă este menționată doar în notă.
translation_notes:
  register: Română standard modernă, concisă și demnă. Prezentul narativ „spune” păstrează vivacitatea textului grec, iar formularea evită atât arhaismele, cât și explicitarea doctrinară în textul principal.
