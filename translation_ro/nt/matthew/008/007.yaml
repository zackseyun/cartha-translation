  text: ⸀καὶ λέγει ⸀αὐτῷ· Ἐγὼ ἐλθὼν θεραπεύσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/007.yaml
  text: And he says to him[a], “I will come and heal him.”
translation:
  language: ro
  text: 'Și îi spune[a]: „Voi veni și îl voi vindeca.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Să vin și să-l vindec?” Unii înțeleg cuvintele lui Isus ca pe o întrebare, pe baza contextului, însă formularea grecească se citește în mod natural ca o afirmație.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Și
  rationale: Păstrează legătura narativă simplă, fără a adăuga o nuanță temporală sau concluzivă care nu este exprimată explicit.
- source_word: λέγει
  choice: spune
  rationale: Redă prezentul istoric grecesc și păstrează vivacitatea relatării; prezentul istoric este firesc și în narațiunea românească.
- source_word: αὐτῷ
  choice: îi
  rationale: Pronumele românesc la dativ redă natural complementul indirect al verbului λέγει.
- source_word: Ἐγὼ
  choice: voi veni
  rationale: Persoana întâi este exprimată clar prin forma verbală românească; introducerea pronumelui „Eu” ar produce aici o emfază mai puternică decât este necesar.
- source_word: ἐλθὼν
  choice: voi veni și
  rationale: Participiul aorist, asociat cu verbul la viitor, indică venirea urmată de vindecare; coordonarea este redarea românească naturală a acestei succesiuni.
- source_word: θεραπεύσω
  choice: îl voi vindeca
  rationale: „A vindeca” este echivalentul curent și potrivit contextului pentru θεραπεύω, iar viitorul redă forma grecească.
- source_word: αὐτόν
  choice: îl
  rationale: Pronumele acuzativ îl desemnează natural în română pe slujitorul bolnav.
theological_decisions:
- issue: Dacă enunțul trebuie redat ca afirmație sau ca întrebare
  choice: 'Afirmație: „Voi veni și îl voi vindeca.”'
  alternative: 'Întrebare: „Să vin și să-l vindec?”'
  rationale: Textul grecesc nu conține o particulă interogativă și se citește în mod natural ca afirmație. Contextul permite interpretarea interogativă adoptată de unii, de aceea alternativa este păstrată în notă, fără a o impune textului principal.
translation_notes:
  register: Română standard modernă, clară și demnă. Prezentul istoric „spune” păstrează dinamismul originalului, iar formularea directă evită atât rigiditatea literală, cât și interpretarea excesivă.
