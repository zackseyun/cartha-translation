id: MAT.8.21
reference: Matthew 8:21
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἕτερος δὲ τῶν ⸀μαθητῶν εἶπεν αὐτῷ· Κύριε, ἐπίτρεψόν μοι πρῶτον ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
translation:
  language: ro
  text: 'Un altul dintre ucenici i-a spus: „Doamne, îngăduie-mi să plec mai întâi și să-l îngrop pe tatăl meu.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cererea poate privi fie o înmormântare imediată, fie, într-un sens mai larg, împlinirea datoriei de fiu până la moartea tatălui; textul grecesc nu precizează.
    reason: cultural_note
lexical_decisions:
- source_word: ἕτερος δὲ
  choice: Un altul
  rationale: ἕτερος indică o altă persoană decât vorbitorul precedent, iar δέ este un conector narativ slab; în română, formularea curge natural fără redarea separată a lui δέ.
- source_word: τῶν μαθητῶν
  choice: dintre ucenici
  rationale: Genitivul partitiv îl identifică pe vorbitor ca aparținând grupului ucenicilor; „dintre ucenici” este firesc și precis în română.
- source_word: εἶπεν αὐτῷ
  choice: i-a spus
  rationale: Redare directă și idiomatică a verbului urmat de pronumele la dativ.
- source_word: Κύριε
  choice: Doamne
  rationale: Vocativul consacrat în română păstrează respectul adresării și posibila greutate teologică a titlului.
- source_word: ἐπίτρεψόν μοι
  choice: îngăduie-mi
  rationale: Imperativul exprimă o cerere de permisiune; „îngăduie-mi” are un registru demn și natural, fără rigiditatea lui „permite-mi”.
- source_word: πρῶτον
  choice: mai întâi
  rationale: Exprimă prioritatea în succesiune și este formularea idiomatică românească în acest context.
- source_word: ἀπελθεῖν
  choice: să plec
  rationale: Verbul indică îndepărtarea de locul prezent; „să plec” redă concis și natural această nuanță.
- source_word: θάψαι τὸν πατέρα μου
  choice: să-l îngrop pe tatăl meu
  rationale: Redare directă a acțiunii și a obiectului, cu reluarea pronominală firească în română.
theological_decisions:
- issue: Sensul cererii de a-l îngropa pe tată
  choice: Textul principal redă simplu cererea, fără a preciza dacă tatăl murise deja.
  alternative: Cererea poate privi fie o înmormântare imediată, fie împlinirea datoriei filiale până la moartea viitoare a tatălui.
  rationale: Greaca nu stabilește momentul morții tatălui; traducerea păstrează ambiguitatea, iar nota explică posibilitățile fără a alege una.
translation_notes:
  register: Română standard modernă, clară și demnă. „Îngăduie-mi” păstrează tonul respectuos al cererii, iar sintaxa rămâne accesibilă cititorului obișnuit.
