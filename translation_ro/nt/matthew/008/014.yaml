source:
  edition: SBLGNT
  text: Καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν Πέτρου εἶδεν τὴν πενθερὰν αὐτοῦ βεβλημένην καὶ πυρέσσουσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/014.yaml
  text: And when Jesus came into Peter’s house[b][a], he saw his mother-in-law lying down and having a fever.
translation:
  language: ro
  text: Când a intrat Isus în casa lui Petru, a văzut-o pe soacra lui Petru culcată[a] și având febră.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „întinsă”. Grecescul descrie literalmente starea de a fi fost pusă jos sau de a sta culcată; faptul că era în pat este sugerat de context, dar nu este spus explicit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Când a intrat Isus
  rationale: Participiul aorist are aici valoare temporală; formularea redă firesc în română venirea lui Isus în casă, fără rigiditatea unei construcții participiale literale.
- source_word: οἰκίαν Πέτρου
  choice: în casa lui Petru
  rationale: Redă direct posesia exprimată prin genitiv și păstrează sensul concret al lui οἰκία.
- source_word: πενθερὰν αὐτοῦ
  choice: pe soacra acestuia
  rationale: πενθερά înseamnă precis „soacră”, iar demonstrativul „acestuia” indică fără echivoc spre Petru, nu spre Isus.
- source_word: βεβλημένην
  choice: zăcând
  rationale: Participiul perfect pasiv descrie starea în care se afla femeia, culcată sau doborâtă de boală. „Zăcând” este firesc în context și nu adaugă explicit un pat, care nu apare în greacă.
- source_word: πυρέσσουσαν
  choice: având febră
  rationale: Participiul prezent descrie o stare continuă; expresia este directă, actuală și nu intensifică nejustificat febra.
theological_decisions:
- issue: Referentul pronumelui αὐτοῦ
  choice: Femeia este identificată fără echivoc drept soacra lui Petru prin „soacra acestuia”.
  alternative: „Soacra lui” ar păstra mai literal pronumele, dar în română ar putea fi înțeles greșit ca referindu-se la Isus.
  rationale: Sintaxa și contextul leagă pronumele de Petru. Clarificarea referentului previne o ambiguitate creată de limba-țintă, fără a adăuga concluzii doctrinare.
translation_notes:
  register: Română standard modernă, clară și demnă. Construcția păstrează succesiunea narativă și cele două participii descriptive, evitând atât arhaismele, cât și adaosul explicit „în pat”.
