  text: ἄρα γε ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/020.yaml
  text: So then[a], you will recognize them by their fruits.
translation:
  language: ro
  text: Așadar[a], îi veți recunoaște după roadele lor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Prin urmare, tocmai după roadele lor îi veți cunoaște.”'
    reason: Alternativă lexicală ce face mai explicită ușoara accentuare din ἄρα γε și sensul posibil „a cunoaște” al verbului.
lexical_decisions:
- source_word: ἄρα γε
  choice: Așadar
  rationale: Redă concluzia inferențială, ușor accentuată, într-o română modernă și firească.
- source_word: ἀπὸ
  choice: după
  rationale: Împreună cu verbul de recunoaștere, indică temeiul după care sunt identificați; „după” este formularea idiomatică în română.
- source_word: καρπῶν
  choice: roadele
  rationale: Păstrează pluralul și metafora explicită din greacă, fără a o reduce interpretativ la „fapte” sau „rezultate”.
- source_word: αὐτῶν
  choice: lor
  rationale: Redă natural genitivul posesiv care determină „roadele”.
- source_word: ἐπιγνώσεσθε
  choice: veți recunoaște
  rationale: Viitorul verbului ἐπιγινώσκω exprimă aici identificarea unor persoane pe baza dovezilor observabile.
- source_word: αὐτούς
  choice: îi
  rationale: Pronumele acuzativ masculin plural se referă la persoanele discutate și este redat firesc prin pronumele clitic românesc.
theological_decisions:
- issue: Folosirea metaforică a „roadelor” pentru evaluarea oamenilor
  choice: Metafora „roadele” este păstrată.
  alternative: „faptele lor” sau „rezultatele lor”
  rationale: Contextul indică manifestări observabile, dar textul folosește metafora roadelor; păstrarea ei menține legătura cu contextul imediat și evită restrângerea interpretativă.
translation_notes:
  register: Română standard modernă, clară și demnă. Ordinea pronumelui și expresia „după roadele lor” sunt idiomatice, iar metafora originală este conservată.
