id: MAT.7.3
reference: Matthew 7:3
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: ro
  text: Dar de ce vezi paiul din ochiul fratelui tău, iar bârna din propriul tău ochi nu o observi?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί
  choice: de ce
  rationale: În această construcție interogativă, τί are sens idiomatic cauzal și introduce o întrebare retorică.
- source_word: δὲ
  choice: Dar
  rationale: Marchează contrastul și trecerea de la învățătura precedentă.
- source_word: βλέπεις
  choice: vezi
  rationale: Redă sensul vizual concret și păstrează contrastul lexical cu κατανοεῖς.
- source_word: κάρφος
  choice: paiul
  rationale: În româna biblică actuală, „pai” este o imagine firească pentru o particulă vegetală mică și contrastează limpede cu „bârna”.
- source_word: ἀδελφοῦ
  choice: fratelui
  rationale: Păstrează substantivul masculin singular din textul grecesc.
- source_word: σῷ
  choice: propriul tău
  rationale: Exprimă accentul posesiv și opoziția cu ochiul fratelui.
- source_word: δοκόν
  choice: bârna
  rationale: Redă o grindă mare de construcție și păstrează hiperbola imaginii.
- source_word: οὐ κατανοεῖς
  choice: nu o observi
  rationale: κατανοέω implică observarea atentă sau conștientizarea; formularea păstrează deosebirea față de „vezi”.
- source_word: ὀφθαλμῷ
  choice: ochiul
  rationale: Echivalentul românesc direct, potrivit imaginii concrete.
theological_decisions:
- issue: Termenul de rudenie masculin ἀδελφοῦ
  choice: fratelui
  alternative: fratelui sau surorii / semenului
  rationale: Textul-sursă folosește masculinul singular. Forma este păstrată fără neutralizare, deși aplicația afirmației nu este limitată la bărbați.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formularea păstrează întrebarea retorică, contrastul dintre „vezi” și „observi” și hiperbola dintre „pai” și „bârnă”.
