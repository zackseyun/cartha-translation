id: MAT.7.26
reference: Matthew 7:26
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: ro
  text: Și oricine aude aceste cuvinte ale Mele și nu le împlinește va fi asemenea unui om nechibzuit[a], care și-a construit casa pe nisip.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „unui om nesăbuit”.'
    reason: Alternativă lexicală pentru μωρός, care poate exprima atât nechibzuința, cât și nesăbuința.
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: oricine aude
  rationale: Participiul prezent articulat are sens substantival și generic; formularea este firească în româna actuală și păstrează aplicarea universală.
- source_word: μου τοὺς λόγους τούτους
  choice: aceste cuvinte ale Mele
  rationale: Păstrează accentul demonstrativ și relația posesivă; „cuvinte” redă direct sensul lui λόγοι în context.
- source_word: μὴ ποιῶν αὐτούς
  choice: nu le împlinește
  rationale: În context, ποιέω înseamnă punerea în practică a cuvintelor auzite. „A împlini” este natural în registrul biblic românesc, fără a adăuga o explicație absentă din text.
- source_word: ὁμοιωθήσεται
  choice: va fi asemenea
  rationale: Redă viitorul pasiv al comparației într-o formulare românească limpede și demnă.
- source_word: ἀνδρὶ μωρῷ
  choice: unui om nechibzuit
  rationale: „Om” poate reda aici substantivul masculin ἀνήρ în comparația reprezentativă, iar „nechibzuit” exprimă lipsa de judecată implicată de μωρός, într-un registru natural și demn.
- source_word: ὅστις
  choice: care
  rationale: Introduce firesc în română propoziția relativă explicativă.
- source_word: ᾠκοδόμησεν
  choice: și-a construit
  rationale: Redă direct acțiunea de a construi, iar forma reflexiv-posesivă integrează natural posesivul αὐτοῦ.
- source_word: αὐτοῦ τὴν οἰκίαν
  choice: casa
  rationale: οἰκία desemnează clădirea din imagine; posesia este exprimată idiomatic prin „și-a construit casa”.
- source_word: ἐπὶ τὴν ἄμμον
  choice: pe nisip
  rationale: Redă clar poziționarea/fundația construcției, conform imaginii narative.
theological_decisions:
- issue: Limbajul masculin reprezentativ din comparație
  choice: unui om nechibzuit
  alternative: unei persoane nechibzuite / unui bărbat nechibzuit
  rationale: Grecescul ἀνήρ este masculin singular, dar comparația are aplicare generică. Românescul „om” păstrează forma masculină și caracterul reprezentativ fără a restrânge nejustificat referința la sexul masculin.
translation_notes:
  register: Română standard modernă, clară și demnă. Majuscula din „Mele” urmează convenția românească de reverență pentru referirea la Isus. Sintaxa păstrează paralelismul cu versetul precedent și caracterul solemn al concluziei Predicii de pe Munte.
