  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Μὴ δῶτε τὸ ἅγιον τοῖς κυσίν, μηδὲ βάλητε τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων, μήποτε ⸀καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν καὶ στραφέντες ῥήξωσιν ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: ro
  text: Nu dați câinilor ce este sfânt[a] și nu aruncați mărgăritarele voastre înaintea porcilor, ca nu cumva să le calce în picioare, apoi să se întoarcă și să vă sfâșie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „lucrul sfânt” ori „ce este sacru”. Expresia grecească are un sens larg.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „să vă rupă în bucăți”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἅγιον
  choice: ce este sfânt
  rationale: Adjectivul neutru singular substantivizat are un referent larg; formularea românească păstrează această deschidere fără a preciza dacă este vorba despre învățătură, un lucru consacrat sau altceva sfânt.
- source_word: τοῖς κυσίν
  choice: câinilor
  rationale: Redare directă a pluralului la dativ, păstrând forța și caracterul ofensator al metaforei antice.
- source_word: βάλητε
  choice: aruncați
  rationale: Echivalent românesc actual și firesc pentru βάλλω în acest context.
- source_word: τοὺς μαργαρίτας ὑμῶν
  choice: mărgăritarele voastre
  rationale: „Mărgăritare” este termenul biblic consacrat și încă inteligibil în româna standard; posesivul și pluralul sunt păstrate.
- source_word: ἔμπροσθεν τῶν χοίρων
  choice: înaintea porcilor
  rationale: Păstrează imaginea și construcția spațială a textului grec într-o formulare românească demnă și naturală.
- source_word: μήποτε
  choice: ca nu cumva
  rationale: Introduce firesc în română avertizarea privind rezultatul nedorit, fără a decide rigid între nuanța de scop și cea de rezultat.
- source_word: καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν
  choice: să le calce în picioare
  rationale: Expresia idiomatică românească redă atât verbul intens de călcare, cât și menționarea explicită a picioarelor. Pronumele „le” se acordă după genul românesc al antecedentului „mărgăritarele”.
- source_word: στραφέντες
  choice: apoi să se întoarcă
  rationale: Participiul aorist indică întoarcerea care precedă atacul; „apoi” face succesiunea limpede și naturală, fără a încărca fraza.
- source_word: ῥήξωσιν ὑμᾶς
  choice: să vă sfâșie
  rationale: „A sfâșia” exprimă violența verbului grec și este mai concis și mai firesc decât o perifrază precum „să vă rupă în bucăți”.
theological_decisions:
- issue: 'Identitatea referenților metaforici: „ce este sfânt”, „câinii”, „mărgăritarele” și „porcii”'
  choice: Metaforele sunt păstrate fără explicație interpretativă în text.
  alternative: Identificarea explicită a lucrului sfânt și a mărgăritarelor cu învățătura sacră sau mesajul împărăției, iar a animalelor cu anumite categorii de oameni.
  rationale: Versetul nu definește precis imaginile. O explicitare ar restrânge în mod nejustificat gama interpretativă și ar introduce în traducere o concluzie teologică absentă din formularea greacă.
- issue: Raportul dintre călcarea mărgăritarelor și atacarea ascultătorilor
  choice: 'Ambele acțiuni sunt atribuite acelorași animale din a doua imagine, într-o succesiune: calcă, apoi se întorc și sfâșie.'
  alternative: Tratarea celor două acțiuni ca imagini independente sau atribuirea lor unor grupuri diferite.
  rationale: Sintaxa greacă leagă καταπατήσουσιν și στραφέντες ῥήξωσιν prin καί, cu același subiect implicit; traducerea păstrează această legătură.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. „Mărgăritare” păstrează ecoul biblic tradițional fără a deveni obscur; „perle” ar fi mai cotidian, dar ar diminua ușor registrul. Construcția „ca nu cumva să” redă natural avertizarea grecească, iar metaforele rămân intenționat neexplicate.
