id: MAT.7.11
reference: Matthew 7:11
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: ro
  text: Așadar, dacă voi, fiind răi, știți să le dați daruri bune copiilor voștri, cu cât mai mult Tatăl vostru, care este în ceruri[a], va da lucruri bune[b] celor care Îi cer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, în formularea tradițională, „în cer”. În greacă, substantivul este la plural: „în ceruri”.'
    reason: lexical_alternative
  - marker: b
    text: Unele traduceri au aici „daruri bune”, dar textul grecesc spune doar „lucruri bune”; cuvântul pentru „daruri” din prima parte nu este repetat.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ οὖν
  choice: Așadar, dacă
  rationale: Redă atât condiția introdusă de εἰ, cât și legătura concluzivă exprimată de οὖν, într-o ordine firească în română.
- source_word: ὑμεῖς πονηροὶ ὄντες
  choice: voi, fiind răi
  rationale: Păstrează descrierea directă din greacă și contrastul ei moral, fără a o extinde într-o formulare doctrinară mai amplă. Pronumele explicit «voi» reflectă accentul formei grecești.
- source_word: οἴδατε ... διδόναι
  choice: știți să ... dați
  rationale: Construcția românească exprimă natural cunoașterea practică sau capacitatea indicată de verbul urmat de infinitiv.
- source_word: δόματα ἀγαθὰ
  choice: daruri bune
  rationale: δόματα desemnează daruri, iar ἀγαθὰ le califică drept bune; formularea este exactă și curentă.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: copiilor voștri
  rationale: τέκνα este un termen incluziv pentru copii, fără limitare la fii.
- source_word: πόσῳ μᾶλλον
  choice: cu cât mai mult
  rationale: Redă argumentul de la mai mic la mai mare și expresia comparativă grecească într-o formă idiomatică românească.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: Tatăl vostru, care este în ceruri
  rationale: Păstrează substantivul «Tatăl» și calificarea locativă separată, precum și pluralul grecesc «ceruri».
- source_word: δώσει ἀγαθὰ
  choice: le va da lucruri bune
  rationale: În a doua propoziție, ἀγαθὰ este substantivizat, iar δόματα nu se repetă; «lucruri bune» evită introducerea nejustificată a lui «daruri».
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: celor care îi cer
  rationale: Participiul substantivizat descrie în mod general persoanele care cer de la Tatăl; formularea este naturală în română și păstrează referirea la el.
theological_decisions:
- issue: Forța antropologică a expresiei πονηροὶ ὄντες
  choice: fiind răi
  alternative: deși sunteți păcătoși / deși aveți defecte morale
  rationale: Formularea păstrează afirmația morală directă și tensiunea contrastului cu bunătatea Tatălui, fără să o atenueze și fără să introducă o doctrină antropologică mai dezvoltată decât textul.
- issue: Redarea expresiei ὁ ἐν τοῖς οὐρανοῖς
  choice: care este în ceruri
  alternative: ceresc / care este în cer
  rationale: Această alegere păstrează construcția locativă și pluralul sursei grecești, în loc să le înlocuiască printr-un adjectiv teologic tradițional sau prin singular.
translation_notes:
  register: Română standard modernă, clară și demnă. Sintaxa păstrează paralelismul și argumentul comparativ al versetului. Formularea «fiind răi» este deliberat directă, iar «în ceruri» conservă pluralul sursei. Marcajele notelor au fost așezate lângă expresiile pe care le explică.
