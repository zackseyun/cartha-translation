  text: πᾶν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/019.yaml
  text: Every tree not producing good fruit is cut down and thrown into the fire[a][b].
translation:
  language: ro
  text: Orice pom care nu face rod bun este tăiat și aruncat în foc[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „care nu aduce rod bun”.'
    reason: lexical_alternative
  - marker: b
    text: „Focul” este o imagine a judecății; versetul în sine nu precizează dacă accentul cade pe o judecată vremelnică, pe cea de la sfârșit sau pe amândouă.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν δένδρον
  choice: Orice pom
  rationale: πᾶν împreună cu substantivul la singular are sens distributiv. „Orice pom” este firesc în româna actuală și păstrează forța generalizatoare a afirmației.
- source_word: μὴ ποιοῦν
  choice: care nu face
  rationale: Participiul prezent descrie acțiunea caracteristică a pomului. „Nu face” redă direct verbul ποιέω și se potrivește expresiei românești „a face rod”; alternativa idiomatică „nu aduce” rămâne posibilă.
- source_word: καρπὸν καλὸν
  choice: rod bun
  rationale: „Rod bun” este formularea firească și demnă în acest context metaforic, păstrând evaluarea morală exprimată de καλός.
- source_word: ἐκκόπτεται
  choice: este tăiat
  rationale: Pasivul prezent arată ce i se întâmplă unui asemenea pom. În context, „este tăiat” este natural și suficient de precis; ideea doborârii pomului este implicită.
- source_word: εἰς πῦρ βάλλεται
  choice: este aruncat în foc
  rationale: Formularea păstrează pasivul și mișcarea spre interior exprimată de εἰς. Româna nu cere articolul hotărât aici, iar „în foc” evită să precizeze mai mult decât greaca.
theological_decisions:
- issue: Imaginea focului ca judecată
  choice: Păstrarea imaginii pomului tăiat și aruncat în foc fără identificarea mai precisă a focului
  alternative: Precizarea ca judecată vremelnică, judecată escatologică sau iad
  rationale: Versetul comunică limpede judecata printr-o imagine agricolă, dar nu îi definește singur momentul ori referentul exact. Traducerea păstrează avertismentul și tensiunea teologică fără a introduce o concluzie doctrinară mai îngustă.
translation_notes:
  register: Română standard modernă, cu formulare simplă, demnă și proverbială. „Pom” și „rod” păstrează registrul biblic familiar fără a fi arhaice.
source_grounding:
  english_pob_role: consult_only
