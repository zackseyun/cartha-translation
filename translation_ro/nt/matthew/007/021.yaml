id: MAT.7.21
reference: Matthew 7:21
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: ro
  text: 'Nu oricine Îmi spune: „Doamne, Doamne!” va intra în Împărăția cerurilor[a], ci acela care face voia Tatălui Meu, care este în ceruri[b], va intra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, „Împărăția cerurilor”; expresie folosită frecvent de Matei acolo unde alte contexte spun „Împărăția lui Dumnezeu”.
    reason: lexical_alternative
  - marker: b
    text: 'Greacă: „în ceruri”, la plural, la fel ca în expresia „Împărăția cerurilor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: Nu oricine Îmi spune
  rationale: 'Construcția exprimă o negație parțială: nu fiecare dintre cei care spun, nu «nimeni». Participiul prezent este redat firesc printr-o propoziție relativă, păstrând sensul general.'
- source_word: Κύριε κύριε
  choice: Doamne, Doamne!
  rationale: Vocativul repetat este păstrat pentru adresarea emfatică; «Doamne» este echivalentul românesc consacrat și adecvat pentru κύριος.
- source_word: εἰσελεύσεται
  choice: va intra
  rationale: Viitorul lui εἰσέρχομαι este redat direct și idiomatic. Verbul este repetat în a doua parte pentru claritate în română, deși acolo este eliptic în greacă.
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: în Împărăția cerurilor
  rationale: «Împărăția cerurilor» păstrează expresia caracteristică lui Matei și pluralul grecesc, într-o formulare românească naturală și consacrată.
- source_word: ἀλλ’ ὁ ποιῶν
  choice: ci acela care face
  rationale: Participiul articulat este substantivizat, iar «ci» marchează limpede contrastul corectiv dintre simpla adresare și împlinirea voii Tatălui.
- source_word: τὸ θέλημα τοῦ πατρός μου
  choice: voia Tatălui Meu
  rationale: «Voia» redă sensul etic și teologic al lui θέλημα, iar «Tatălui Meu» păstrează exprimarea filială a lui Isus.
- source_word: τοῦ ἐν τοῖς οὐρανοῖς
  choice: care este în ceruri
  rationale: Sintagma atributivă este redată explicit și păstrează pluralul grecesc, posibil și firesc în registrul biblic românesc.
theological_decisions:
- issue: Intrarea în Împărăție în raport cu mărturisirea verbală și ascultarea
  choice: Versetul contrastează adresarea verbală «Doamne» cu împlinirea voii Tatălui.
  alternative: A interpreta versetul fie ca prezentând o doctrină completă a mântuirii prin fapte, fie ca negând orice valoare a mărturisirii verbale.
  rationale: Textul afirmă limpede contrastul dintre a spune și a face, dar nu formulează aici singur un sistem complet despre justificare sau mântuire; traducerea păstrează această tensiune.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează expresia mateiană «Împărăția cerurilor», repetiția solemnă «Doamne, Doamne» și contrastul ferm dintre vorbire și faptă. Majusculele reverențiale urmează uzul biblic românesc.
