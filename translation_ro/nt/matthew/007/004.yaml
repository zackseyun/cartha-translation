id: MAT.7.4
reference: Matthew 7:4
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
translation:
  language: ro
  text: 'Sau cum îi vei spune fratelui tău[c]: «Lasă-mă să scot paiul[a] din ochiul tău», și iată, bârna[b] este în ochiul tău?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „așchia”; termenul grecesc κάρφος desemnează o bucățică mică de material uscat.
    reason: lexical_alternative
  - marker: b
    text: Sau „grinda”; termenul grecesc δοκός desemnează o bucată mare de lemn folosită ca element de susținere.
    reason: lexical_alternative
  - marker: c
    text: În greacă, „fratelui tău”; masculinul singular poate fi folosit cu sens reprezentativ.
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: Sau
  rationale: Introduce a doua alternativă retorică din argumentul lui Isus și redă firesc legătura cu versetul precedent.
- source_word: πῶς ἐρεῖς
  choice: cum îi vei spune
  rationale: Păstrează atât întrebarea retorică exprimată prin πῶς, cât și viitorul indicativ ἐρεῖς.
- source_word: τῷ ἀδελφῷ σου
  choice: fratelui tău
  rationale: Redă direct substantivul masculin singular ἀδελφός, fără a restrânge sau extinde explicit referința sa reprezentativă.
- source_word: Ἄφες ἐκβάλω
  choice: Lasă-mă să scot
  rationale: Imperativul urmat de conjunctiv exprimă idiomatic cererea de permisiune, iar «să scot» este natural pentru îndepărtarea unui obiect din ochi.
- source_word: τὸ κάρφος
  choice: paiul
  rationale: κάρφος desemnează o bucățică mică și uscată de material; «pai» este o redare românească firească și păstrează contrastul proverbial cu bârna.
- source_word: ἐκ τοῦ ὀφθαλμοῦ σου
  choice: din ochiul tău
  rationale: Redă concis și firesc ideea extragerii indicată de ἐκ.
- source_word: καὶ ἰδοὺ
  choice: când iată că
  rationale: În context, καὶ ἰδού introduce situația vădit contradictorie; formularea românească păstrează funcția de atragere a atenției și face limpede raportul circumstanțial, fără a elimina forța retorică.
- source_word: ἡ δοκὸς
  choice: bârna
  rationale: δοκός este o grindă mare de lemn; «bârnă» este termenul tradițional și precis în română, menținând hiperbola.
- source_word: ἐν τῷ ὀφθαλμῷ σοῦ
  choice: în ochiul tău este
  rationale: Păstrează localizarea explicită din greacă; ordinea cu «în ochiul tău» în prim-plan accentuează contrastul.
theological_decisions:
- issue: Sfera referinței lui ἀδελφῷ
  choice: fratelui tău
  alternative: semenului tău / fratelui sau surorii tale
  rationale: Forma sursă este masculin singular și imaginează adresarea către o persoană concretă. Nota semnalează posibilul sens reprezentativ fără a introduce în text o extindere interpretativă.
- issue: Contrastul hiperbolic κάρφος / δοκός
  choice: pai / bârnă
  alternative: așchie / grindă
  rationale: Perechea aleasă conservă disproporția intenționată și imaginea bine înțeleasă în română, fără a atenua critica ipocriziei.
translation_notes:
  register: Română standard modernă, demnă și ușor de înțeles. Formularea păstrează întrebarea retorică, imaginea concretă și hiperbola textului-sursă; ghilimelele românești marchează vorbirea directă.
