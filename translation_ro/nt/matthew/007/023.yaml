source:
  edition: SBLGNT
  text: καὶ τότε ὁμολογήσω αὐτοῖς ὅτι Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ’ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/023.yaml
  text: And then I will declare to them[a], ‘I never knew you; depart from me[b], you who practice lawlessness.’
translation:
  language: ro
  text: 'Și atunci le voi declara: „Niciodată nu v-am cunoscut[a]. Plecați de la Mine, voi care săvârșiți fărădelegea[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Niciodată nu v-am recunoscut.” Verbul grecesc tradus prin „a cunoaște” poate exprima o recunoaștere într-un sens relațional, nu doar faptul de a ști cine este cineva.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „voi care lucrați fărădelegea” sau „voi care faceți răul”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τότε
  choice: Și atunci
  rationale: Păstrează atât legătura cu contextul anterior, cât și succesiunea temporală.
- source_word: ὁμολογήσω
  choice: voi declara
  rationale: În acest context solemn și judiciar, verbul indică o afirmație deschisă și publică, nu mărturisirea unei greșeli.
- source_word: Οὐδέποτε
  choice: Niciodată
  rationale: Redă natural și categoric negația absolută din greacă.
- source_word: ἔγνων
  choice: v-am cunoscut
  rationale: Păstrează formularea relațională și ambiguitatea autentică a verbului, fără a o reduce la simpla informare sau a o extinde doctrinar.
- source_word: ἀποχωρεῖτε ἀπ’ ἐμοῦ
  choice: Plecați de la Mine
  rationale: Redă porunca de îndepărtare într-o română actuală, directă și solemnă.
- source_word: οἱ ἐργαζόμενοι
  choice: voi care practicați
  rationale: Exprimă o activitate caracteristică sau repetată mai firesc decât traducerea literală „lucrați”.
- source_word: τὴν ἀνομίαν
  choice: fărădelegea
  rationale: Păstrează dimensiunea moral-juridică a termenului și este o formulare biblică încă inteligibilă în româna modernă.
theological_decisions:
- issue: Sensul expresiei „Niciodată nu v-am cunoscut”
  choice: Este păstrată formularea relațională directă „nu v-am cunoscut”.
  alternative: „Niciodată nu v-am recunoscut” sau „Niciodată nu v-am aprobat”.
  rationale: Textul grec nu explică aici în ce constă această cunoaștere. O parafrazare prin „aprobat” ori printr-o afirmație despre apartenență ar soluționa în traducere o tensiune teologică pe care versetul o lasă implicită.
- issue: Forța termenului ἀνομία
  choice: „fărădelegea”
  alternative: „nelegiuirea”, „răutatea” sau „încălcarea legii”.
  rationale: „Fărădelegea” conservă categoria moral-juridică a originalului fără a o generaliza la simpla răutate și fără a introduce o interpretare confesională îngustă.
translation_notes:
  register: Română literară modernă, clară și solemnă. Majuscula din pronumele „Mine” urmează convenția editorială românească pentru referirea la Isus, fără a modifica sensul sursei. Formularea evită atât arhaismele greu accesibile, cât și parafrazele doctrinare.
