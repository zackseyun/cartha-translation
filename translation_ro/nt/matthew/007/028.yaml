source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ⸀ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, ἐξεπλήσσοντο οἱ ὄχλοι ἐπὶ τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/028.yaml
  text: And it happened that when Jesus had finished these words[b][a], the crowds were astonished at his teaching.
translation:
  language: ro
  text: Și s-a întâmplat că, atunci când Isus a terminat de rostit aceste cuvinte, mulțimile erau uimite de învățătura lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: După ce
  rationale: Formula narativă introduce aici încheierea discursului. În româna modernă, redarea compactă „După ce” exprimă firesc raportul temporal, fără calc arhaic și greoi.
- source_word: ἐτέλεσεν
  choice: a terminat de spus
  rationale: Verbul indică ducerea discursului la capăt; completarea firească „de spus” leagă explicit acțiunea de „aceste cuvinte”, fără a adăuga o etichetă interpretativă precum „predică”.
- source_word: τοὺς λόγους τούτους
  choice: aceste cuvinte
  rationale: Păstrează demonstrativul și sensul larg al lui λόγοι, făcând trimitere directă la discursul precedent.
- source_word: ἐξεπλήσσοντο
  choice: erau uimite
  rationale: Imperfectul este păstrat prin construcția „erau uimite”, care redă reacția colectivă aflată în desfășurare; „uimite” este puternic, natural și demn.
- source_word: οἱ ὄχλοι
  choice: mulțimile
  rationale: Păstrează pluralul grecesc și folosește termenul biblic încă firesc în româna contemporană.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: de învățătura lui
  rationale: Cu verbul mirării, ἐπί cu dativul indică temeiul sau obiectul reacției; „uimite de” este construcția idiomatică românească.
theological_decisions:
- issue: Referința expresiei „aceste cuvinte”
  choice: Trimitere directă la învățătura rostită imediat înainte
  alternative: „aceste rostiri” sau extinderea interpretativă „această predică”
  rationale: Textul indică discursul încheiat de Isus, dar nu îi atribuie o denumire teologică ori literară; formularea păstrează această sobrietate.
translation_notes:
  register: Română standard modernă, clară și demnă. Sintaxa greacă formulaică este exprimată idiomatic, evitând formule arhaice precum „și s-a întâmplat că, atunci când”. Pronumele „lui” rămâne cu literă mică potrivit normelor curente și caracterului neutru confesional al proiectului.
