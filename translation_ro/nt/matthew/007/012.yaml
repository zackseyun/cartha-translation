id: MAT.7.12
reference: Matthew 7:12
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Πάντα οὖν ὅσα ⸀ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς· οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/012.yaml
  text: Therefore[a], in everything, whatever you want people to do for you, do the same for them; for this is the Law and the Prophets.
translation:
  language: ro
  text: Așadar, tot ce vreți să vă facă oamenii, faceți-le și voi la fel; căci aceasta este Legea și Profeții.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα ὅσα
  choice: tot ce
  rationale: Construcția exprimă cuprinderea universală. „Tot ce” este echivalentul românesc firesc și păstrează întinderea maximă a afirmației.
- source_word: οὖν
  choice: Așadar
  rationale: Redă clar concluzia trasă din învățătura precedentă, într-un registru actual și demn.
- source_word: ἐὰν θέλητε
  choice: vreți
  rationale: Construcția cu ἐὰν generalizează situația; prezentul românesc exprimă natural dorința avută în vedere.
- source_word: ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι
  choice: să vă facă vouă oamenii
  rationale: „Oamenii” are aici sens generic, referindu-se la ființele umane, nu doar la bărbați. Pronumele accentuat „vouă” păstrează contrastul cu „și voi” din propoziția următoare.
- source_word: οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς
  choice: faceți-le și voi la fel
  rationale: Imperativul prezent este redat direct, iar „și voi la fel” păstrează reciprocitatea și accentul explicit al pronumelui grecesc.
- source_word: οὗτος γάρ ἐστιν
  choice: căci aceasta este
  rationale: Păstrează forma concisă, explicativă și echivalența afirmației grecești, fără a o transforma într-o parafrază.
- source_word: ὁ νόμος καὶ οἱ προφῆται
  choice: Legea și Profeții
  rationale: Păstrează formula consacrată care desemnează marile categorii ale Scripturilor iudaice; majusculele indică acest sens titular și intertextual.
theological_decisions:
- issue: Sensul generic al lui οἱ ἄνθρωποι
  choice: oamenii
  alternative: bărbații
  rationale: Contextul formulează un principiu universal al relațiilor umane; termenul grecesc nu îi desemnează aici exclusiv pe cei de sex masculin.
- issue: Sfera expresiei „Legea și Profeții”
  choice: Formula scripturistică este păstrată literal
  alternative: întreaga învățătură morală a Scripturii
  rationale: Textul folosește formula iudaică și mateiană consacrată. Păstrarea ei menține rezonanța intertextuală și tensiunea afirmației fără explicații doctrinare adăugate.
- issue: Forța afirmației οὗτος γάρ ἐστιν
  choice: căci aceasta este
  alternative: căci aceasta rezumă
  rationale: Verbul copulativ afirmă direct identitatea, iar traducerea nu restrânge sensul la ideea, posibilă dar interpretativă, de simplu rezumat.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea evită atât arhaismele („voiți”, „câte”), cât și colocvialitatea. Ordinea „să vă facă vouă oamenii” păstrează accentul contrastiv al textului grec și rămâne firească în registrul biblic actual.
