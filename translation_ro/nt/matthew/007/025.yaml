id: MAT.7.25
reference: Matthew 7:25
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἔπεσεν, τεθεμελίωτο γὰρ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/025.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it did not fall[b], for it had been founded on the rock.
translation:
  language: ro
  text: Și a căzut ploaia, au venit râurile[a], au suflat vânturile și s-au izbit[b] de casa aceea, dar ea nu a căzut, căci fusese întemeiată pe stâncă.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „au venit șuvoaiele”; termenul grecesc înseamnă mai literal „râuri”.
    reason: lexical_alternative
  - marker: b
    text: Sau „s-au năpustit asupra” ori „au lovit” casa aceea.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: a căzut ploaia
  rationale: În româna actuală, aceasta este formularea firească pentru coborârea ploii; redă sensul contextual al lui καταβαίνω fără rigiditatea expresiei „ploaia a coborât”.
- source_word: οἱ ποταμοί
  choice: râurile
  rationale: Redă sensul lexical obișnuit al substantivului ποταμός. Contextul furtunii permite înțelegerea unor ape ieșite cu putere, dar traducerea nu înlocuiește imaginea greacă printr-o interpretare mai specifică.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: au suflat vânturile
  rationale: Echivalent românesc direct și firesc, care păstrează pluralul textului grecesc.
- source_word: προσέπεσαν
  choice: s-au izbit de
  rationale: În contextul vânturilor care lovesc o casă, formularea exprimă clar impactul indicat de προσπίπτω și rămâne naturală în română.
- source_word: τῇ οἰκίᾳ ἐκείνῃ
  choice: de casa aceea
  rationale: οἰκία denumește aici construcția fizică din parabolă, iar ἐκείνῃ este redat prin demonstrativul „aceea”.
- source_word: οὐκ ἔπεσεν
  choice: nu a căzut
  rationale: Traducere directă, care evită termenul mai interpretativ și mai intens „nu s-a prăbușit”.
- source_word: τεθεμελίωτο
  choice: fusese întemeiată
  rationale: Mai-mult-ca-perfectul pasiv păstrează starea rezultată dintr-o acțiune anterioară și imaginea temeliei.
- source_word: ἐπὶ τὴν πέτραν
  choice: pe stâncă
  rationale: „Stâncă” redă πέτρα fără a introduce sensul mai specific de „rocă de bază”; omiterea articolului în română este firească în această construcție prepozițională.
theological_decisions:
- issue: Imaginea parabolică a temeliei
  choice: pe stâncă
  alternative: pe roca de bază
  rationale: Versetul păstrează imaginea concretă a stâncii fără a o identifica explicit aici cu o realitate teologică anume și fără a-i restrânge sensul geologic.
translation_notes:
  register: Română standard modernă, cu o cadență demnă și clară. Coordonarea repetată păstrează succesiunea energică a propozițiilor grecești, iar „dar” redă firesc în română contrastul contextual exprimat de al doilea καί.
