  naturalness: „Sau, dacă îi cere un pește—nu-i va da un șarpe, nu-i așa?” este română standard modernă, naturală și reproduce ruptura retorică dintre condiție și întrebare. Cliticul „-i” este idiomatic și se referă firesc la copilul care cere.
