  text: ⸀ἢ καὶ ⸂ἰχθὺν αἰτήσει⸃— μὴ ὄφιν ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/010.yaml
  text: Or if he asks for a fish—he will not give him a snake[b][a], will he?
translation:
  language: ro
  text: Sau, dacă îi cere un pește—nu-i va da un șarpe, nu-i așa?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: Sau, dacă
  rationale: Introduce al doilea exemplu dintr-o pereche de întrebări retorice; formularea este firească în română și nu supratraduce particula καί.
- source_word: ἰχθὺν
  choice: un pește
  rationale: Acuzativ singular cu sensul obișnuit de aliment, potrivit contextului familial.
- source_word: αἰτήσει
  choice: îi cere
  rationale: Viitorul grecesc apare într-o situație generică; prezentul românesc redă natural condiția, iar pronumele indirect îl anticipează firesc pe tatăl din context.
- source_word: μὴ
  choice: oare
  rationale: În întrebarea directă, μή indică așteptarea unui răspuns negativ; construcția românească cu „oare” păstrează caracterul retoric fără a transforma întrebarea într-o afirmație.
- source_word: ὄφιν
  choice: un șarpe
  rationale: Este echivalentul modern, curent și precis al termenului grecesc; „șarpe” poate acoperi și nuanța tradițională „șarpele/serpentul” fără registru arhaizant.
- source_word: ἐπιδώσει
  choice: îi va da
  rationale: În context, verbul înseamnă simplu „a da”; viitorul este păstrat în propoziția principală.
- source_word: αὐτῷ
  choice: îi
  rationale: Dativul obiectului indirect este redat idiomatic prin pronumele clitic românesc.
theological_decisions:
- issue: Forța întrebării retorice
  choice: Întrebare cu „oare”, care așteaptă răspunsul „nu”
  alternative: Afirmația „nu-i va da un șarpe” sau întrebarea „nu-i va da un șarpe, nu-i așa?”
  rationale: μή marchează o întrebare la care se așteaptă răspuns negativ. Forma aleasă păstrează argumentul retoric al lui Isus și sună mai natural în română decât o întrebare cu etichetă copiată din engleză.
translation_notes:
  register: Română standard modernă, clară și demnă. Sintaxa este idiomatică, iar întrebarea retorică păstrează forța textului grec. Marcajul de notă este plasat în text.
