id: MAT.7.8
reference: Matthew 7:8
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει καὶ ὁ ζητῶν εὑρίσκει καὶ τῷ κρούοντι ⸀ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/008.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: ro
  text: Căci oricine cere primește, cine caută găsește, iar celui care bate i se va deschide.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Textul grecesc nu spune explicit ce anume se va deschide; „ușa” este doar subînțeleasă din imagine.
    reason: clarificare lexicală
lexical_decisions:
- source_word: πᾶς
  choice: oricine
  rationale: Construcția substantivală exprimă o categorie generală; „oricine” redă firesc în română sfera universală.
- source_word: γὰρ
  choice: căci
  rationale: Păstrează rolul explicativ al versetului în raport cu îndemnul precedent, într-un registru demn și curent.
- source_word: ὁ αἰτῶν
  choice: cere
  rationale: Participiul articulat are sens general, „cel care cere”; după „oricine”, forma verbală simplă este cea mai naturală.
- source_word: λαμβάνει
  choice: primește
  rationale: Redă sensul obișnuit al verbului și păstrează paralelismul concis al enunțului.
- source_word: ὁ ζητῶν
  choice: cine caută
  rationale: Redă participiul substantival printr-o construcție românească naturală, păstrând caracterul general al afirmației.
- source_word: εὑρίσκει
  choice: găsește
  rationale: Este echivalentul direct și firesc, potrivit simplității și ritmului maximei.
- source_word: τῷ κρούοντι
  choice: celui care bate
  rationale: Dativul grecesc este păstrat prin dativul românesc și pregătește construcția pasiv-impersonală care urmează.
- source_word: ἀνοιγήσεται
  choice: i se va deschide
  rationale: Redă viitorul pasiv fără a introduce explicit substantivul „ușa”, absent din textul grec, dar implicat de imagine.
theological_decisions:
- issue: Întinderea și forța promisiunii
  choice: O asigurare generală formulată în termeni universali, fără limitări sau precizări teologice adăugate în traducere.
  alternative: O garanție necondiționată că orice cerere concretă va fi împlinită exact cum este formulată sau, dimpotrivă, o promisiune restrânsă explicit la anumite cereri spirituale.
  rationale: Textul folosește un limbaj universal și trebuie redat direct, dar traducerea nu trebuie nici să absolutizeze afirmația în afara contextului, nici să introducă o restrângere care nu apare în formularea greacă.
translation_notes:
  register: Română standard modernă, concisă și memorabilă. „Căci” păstrează legătura explicativă cu versetul anterior; „i se va deschide” este o formulare naturală care menține subiectul neexprimat al grecei.
