  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: ro
  text: Căci strâmtă este poarta și anevoioasă este calea care duce la viață, iar puțini sunt cei ce o găsesc.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενή
  choice: strâmtă
  rationale: Redă direct ideea unei porți înguste, într-o formulare românească firească și tradițional inteligibilă.
- source_word: τεθλιμμένη
  choice: anevoioasă
  rationale: Participiul sugerează o cale apăsată, strâmtorată și, prin urmare, dificilă. „Anevoioasă” exprimă dificultatea fără a o reduce doar la lățimea fizică a drumului.
- source_word: ἀπάγουσα
  choice: care duce
  rationale: Formulare naturală în română pentru sensul de conducere către o destinație.
- source_word: ζωήν
  choice: viață
  rationale: Păstrează termenul simplu și teologic deschis al textului-sursă.
- source_word: εὑρίσκοντες
  choice: găsesc
  rationale: Echivalent direct, care păstrează imaginea descoperirii porții și căii.
theological_decisions:
- issue: Natura dificultății căii spre viață
  choice: anevoioasă
  alternative: strâmtorată / grea
  rationale: Textul descrie calea prin τεθλιμμένη, termen care poate indica atât constrângerea, cât și dificultatea. „Anevoioasă” păstrează implicația existențială fără a introduce o explicație doctrinară.
- issue: Sensul lui „viață”
  choice: viață
  alternative: viața veșnică
  rationale: Nu se adaugă „veșnică”, deoarece adjectivul nu apare aici; formularea păstrează deschiderea și tensiunea contextului.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Ordinea predicativă „strâmtă este poarta” păstrează accentul retoric al textului grec, fără a suna nefiresc.
