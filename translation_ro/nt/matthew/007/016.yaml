id: MAT.7.16
reference: Matthew 7:16
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. μήτι συλλέγουσιν ἀπὸ ἀκανθῶν ⸀σταφυλὰς ἢ ἀπὸ τριβόλων σῦκα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/016.yaml
  text: You will recognize them by their fruits[a]. Do people gather grapes from thorns[b], or figs from thistles?
translation:
  language: ro
  text: Îi veți recunoaște după roadele lor.[a] Oare se culeg struguri din spini sau smochine din mărăcini?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Îi veți cunoaște după roadele lor.”'
    reason: lexical_alternative
  - marker: b
    text: 'Întrebarea presupune un răspuns negativ: nu se culeg struguri din spini și nici smochine din mărăcini.'
    reason: rhetorical_clarification
lexical_decisions:
- source_word: καρπῶν
  choice: roadele
  rationale: Păstrează pluralul și metafora agricolă, firească în română pentru manifestările sau rezultatele observabile.
- source_word: ἐπιγνώσεσθε
  choice: veți recunoaște
  rationale: Redă ideea identificării prin observare, potrivită contextului discernării, fără a intensifica nejustificat sensul.
- source_word: μήτι
  choice: Oare
  rationale: Introduce firesc în română o întrebare retorică la care se așteaptă un răspuns negativ.
- source_word: συλλέγουσιν
  choice: se culeg
  rationale: Construcția impersonală este idiomatică în română pentru culegerea roadelor și nu adaugă un subiect absent din greacă.
- source_word: ἀκανθῶν
  choice: spini
  rationale: Echivalent concis care păstrează imaginea plantelor spinoase.
- source_word: σταφυλάς
  choice: struguri
  rationale: Echivalentul lexical direct al pluralului grecesc.
- source_word: τριβόλων
  choice: mărăcini
  rationale: Termen modern și accesibil pentru plante spinoase sau buruieni cu spini; păstrează deosebirea lexicală față de «spini».
- source_word: σῦκα
  choice: smochine
  rationale: Echivalentul lexical direct al pluralului grecesc.
- source_word: αὐτῶν / αὐτούς
  choice: lor / îi
  rationale: Pronumele trimit la persoanele menționate în context, iar româna păstrează această referință personală.
theological_decisions:
- issue: Forța metaforică a «roadelor» în discernerea oamenilor
  choice: Este păstrată metafora «roadele», fără explicarea ei în text drept fapte sau rezultate.
  alternative: Îi veți recunoaște după faptele lor / după rezultatele lor.
  rationale: Imaginea agricolă este esențială argumentului și permite contextului să-i determine întinderea, fără a impune o interpretare mai îngustă.
translation_notes:
  register: Română standard modernă, clară și demnă. «Roadele» păstrează registrul biblic familiar fără a fi arhaic, iar «Oare» marchează natural întrebarea retorică.
