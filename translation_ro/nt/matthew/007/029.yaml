source:
  edition: SBLGNT
  text: ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/029.yaml
  text: for he was teaching them as one having authority[a], and not as their scribes.
translation:
  language: ro
  text: căci îi învăța ca unul care avea autoritate[a], și nu ca cărturarii lor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, mai idiomatic: „cu autoritate”.'
    reason: Alternativă lexicală și stilistică pentru expresia grecească ὡς ἐξουσίαν ἔχων.
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων
  choice: căci îi învăța
  rationale: Construcția perifrastică la imperfect redă o acțiune continuă în trecut, iar „căci” păstrează rolul explicativ al lui γάρ în legătură cu uimirea mulțimilor din versetul anterior.
- source_word: αὐτούς
  choice: îi
  rationale: Pronumele este complementul direct și se referă la ascultători, adică la mulțimile menționate în context.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: ca unul care avea autoritate
  rationale: Redarea păstrează construcția comparativă și prezintă autoritatea ca o însușire reală a celui care îi învăța, fără a o reduce la simplă siguranță de sine.
- source_word: καὶ οὐχ ὡς
  choice: și nu cum
  rationale: „Cum” exprimă firesc în română contrastul dintre felul în care îi învăța Isus și felul în care îi învățau cărturarii.
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: cărturarii lor
  rationale: „Cărturarii” este echivalentul consacrat și precis pentru specialiștii în Lege, iar „lor” păstrează pronumele αὐτῶν din textul sursă.
theological_decisions:
- issue: Natura autorității lui Isus în învățătură
  choice: 'Afirmația este redată descriptiv: „ca unul care avea autoritate”.'
  alternative: O formulare care ar preciza explicit că era vorba despre autoritate divină sau, dimpotrivă, una care ar reduce sensul la simplă forță retorică.
  rationale: Versetul afirmă autoritatea reală a lui Isus prin contrast cu cărturarii, dar nu explică aici în mod explicit temeiul deplin al acestei autorități. Redarea păstrează această tensiune fără adaos doctrinar.
translation_notes:
  register: Română standard modernă, clară și demnă. „Autoritate” păstrează sensul lui ἐξουσία, iar „cărturarii” menține termenul biblic consacrat fără perifrază explicativă în text.
