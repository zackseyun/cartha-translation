source:
  edition: SBLGNT
  text: ἢ τίς ⸀ἐστιν ἐξ ὑμῶν ἄνθρωπος, ὃν ⸀αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον— μὴ λίθον ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/009.yaml
  text: Or what man is there among you whose son asks him for bread[a], and he will give him a stone?
translation:
  language: ro
  text: Sau care om dintre voi, dacă fiul său îi cere pâine, îi va da oare o piatră?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: Sau
  rationale: Introduce următoarea comparație retorică și păstrează legătura cu versetul precedent.
- source_word: τίς ἐστιν ἐξ ὑμῶν ἄνθρωπος
  choice: cine este omul dintre voi
  rationale: Redă firesc expresia partitivă și păstrează substantivul masculin reprezentativ din greacă.
- source_word: ὃν αἰτήσει ὁ υἱὸς αὐτοῦ
  choice: căruia, dacă fiul lui îi va cere
  rationale: Reorganizarea sintactică este necesară în română; «dacă» face explicit cadrul eventual al întrebării retorice, iar viitorul redă forma αἰτήσει.
- source_word: ἄρτον
  choice: pâine
  rationale: Este echivalentul direct și potrivit contextului, fără restrângerea nejustificată la o anumită formă de pâine.
- source_word: μὴ λίθον ἐπιδώσει αὐτῷ
  choice: îi va da o piatră?
  rationale: Întrebarea retorică transmite în română răspunsul negativ așteptat de particula μή; «a da» redă natural verbul.
theological_decisions:
- issue: Limbaj masculin reprezentativ
  choice: omul dintre voi
  alternative: cineva dintre voi
  rationale: Textul grec folosește explicit ἄνθρωπος la masculin într-o construcție reprezentativă; traducerea îl păstrează fără a-i restrânge arbitrar referința.
translation_notes:
  register: Română standard modernă, clară și demnă. Topica a fost ajustată pentru fluență, păstrând forma de întrebare retorică și opoziția dintre pâine și piatră.
