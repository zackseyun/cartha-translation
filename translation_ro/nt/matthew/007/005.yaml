id: MAT.7.5
reference: Matthew 7:5
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: ro
  text: Ipocritule, scoate mai întâi bârna[a] din ochiul tău și atunci vei vedea limpede ca să scoți paiul[b] din ochiul fratelui tău.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „grinda”. Termenul grecesc desemnează o bucată mare de lemn folosită la construcții.
    reason: lexical_alternative
  - marker: b
    text: Sau „așchia” ori „firul de paie”. Termenul grecesc poate desemna un fragment mic și uscat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριτά
  choice: Ipocritule
  rationale: Vocativul singular exprimă o mustrare directă și aspră; forma românească redă firesc adresarea explicită.
- source_word: ἔκβαλε / ἐκβαλεῖν
  choice: scoate / să scoți
  rationale: Verbul ἐκβάλλω descrie aici îndepărtarea unui obiect din ochi. „A scoate” este concret, firesc și păstrează reluarea aceluiași verb.
- source_word: πρῶτον
  choice: mai întâi
  rationale: Redă clar prioritatea în succesiunea cerută și este expresia idiomatică în româna actuală.
- source_word: δοκόν
  choice: bârna
  rationale: δοκός desemnează o grindă sau bârnă mare. „Bârnă” păstrează exagerarea voită și contrastul puternic cu κάρφος.
- source_word: διαβλέψεις
  choice: vei vedea limpede
  rationale: Redă sensul intensificat al lui διαβλέπω, nu doar simplul fapt de a vedea.
- source_word: κάρφος
  choice: paiul
  rationale: κάρφος poate desemna un fir sau fragment uscat de material vegetal ori o așchie mică. „Pai” este concret, ușor de înțeles și păstrează contrastul cu bârna.
- source_word: ἀδελφοῦ σου
  choice: fratelui tău
  rationale: Păstrează forma masculină singulară și relația comunitară exprimată explicit de textul grecesc.
theological_decisions:
- issue: Sensul relațional și genul lui ἀδελφοῦ
  choice: fratelui tău
  alternative: semenului tău / altei persoane
  rationale: Greaca are substantiv masculin singular, „frate”. Redarea literală păstrează atât forma, cât și cadrul relațional al învățăturii, fără neutralizare necerută de context.
- issue: Relația dintre διαβλέψεις și infinitivul ἐκβαλεῖν
  choice: vei vedea limpede ca să scoți
  alternative: vei putea vedea limpede și scoate / vei vedea limpede cum să scoți
  rationale: Construcția aleasă păstrează legătura dintre vederea devenită limpede și scoaterea paiului, fără a introduce explicit ideea de capacitate sau de metodă, care nu este formulată separat în greacă.
translation_notes:
  register: Română standard modernă, cu ton direct și demn. „Ipocritule” păstrează asprimea mustrării, iar imaginile concrete „bârnă” și „pai” mențin hiperbola și contrastul memorabil ale originalului.
