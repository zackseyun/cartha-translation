  text: Nu judecați[a], ca să nu fiți judecați.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Nu condamnați, ca să nu fiți condamnați.” Verbul grecesc poate avea în anumite contexte sensul de „a condamna”, însă „a judeca” este mai larg și păstrează repetiția lexicală din verset.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: Nu
  rationale: Împreună cu imperativul prezent κρίνετε, introduce o interdicție; în română, construcția firească este „Nu judecați”.
- source_word: κρίνετε
  choice: judecați
  rationale: Verbul κρίνω are un sens larg, care poate include evaluarea, judecarea sau condamnarea. „Judecați” păstrează această amplitudine și repetiția lexicală din verset.
- source_word: ἵνα
  choice: ca să
  rationale: Redă natural în româna actuală relația de scop sau rezultat exprimată aici de ἵνα cu conjunctivul.
- source_word: μὴ
  choice: nu
  rationale: Neagă verbul la conjunctiv pasiv din a doua propoziție și se redă direct prin „nu”.
- source_word: κριθῆτε
  choice: fiți judecați
  rationale: Forma de aorist pasiv conjunctiv a lui κρίνω este redată cu aceeași rădăcină ca în prima propoziție, păstrând paralelismul și fără a restrânge sensul la condamnare.
theological_decisions:
- issue: Sfera semantică a verbului κρίνω în interdicția lui Isus
  choice: Se păstrează termenul mai larg „a judeca”, fără restrângerea interpretativă la „a condamna”.
  alternative: Nu condamnați, ca să nu fiți condamnați.
  rationale: Versetul avertizează împotriva unui anumit fel de judecare, precizat de contextul imediat din Matei 7:2–5, dar nu definește singur toate limitele evaluării morale. Formularea aleasă păstrează tensiunea teologică și lasă contextul să clarifice interdicția.
translation_notes:
  register: Română standard modernă, concisă și demnă. Pluralul „judecați” urmează forma verbală grecească și se adresează colectiv ascultătorilor.
