id: MAT.7.27
reference: Matthew 7:27
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ, καὶ ἔπεσεν, καὶ ἦν ἡ πτῶσις αὐτῆς μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/027.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it fell—and its fall was great.
translation:
  language: ro
  text: Și a căzut ploaia, au venit râurile[a], au suflat vânturile și au izbit casa aceea; ea s-a prăbușit, iar căderea ei a fost mare.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „au venit apele revărsate”. Substantivul grecesc înseamnă mai literal „râuri”, dar în acest context poate sugera apele unei inundații.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: a căzut ploaia
  rationale: În româna actuală, aceasta este formularea firească pentru ploaia care coboară; redă mișcarea indicată de καταβαίνω fără rigiditatea expresiei „ploaia a coborât”.
- source_word: ἦλθον οἱ ποταμοί
  choice: au venit râurile
  rationale: Păstrează sensul lexical obișnuit al lui ποταμός și imaginea apelor care vin cu putere; nota semnalează sensul contextual posibil de ape revărsate.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: au suflat vânturile
  rationale: Redare directă și naturală a verbului πνέω împreună cu substantivul ἄνεμοι.
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: au izbit în casa aceea
  rationale: În contextul furtunii, προσκόπτω exprimă lovirea casei; „au izbit în” păstrează forța și construcția orientată spre țintă, fără a introduce ideea literală de poticnire.
- source_word: ἔπεσεν
  choice: s-a prăbușit
  rationale: Deși verbul înseamnă literal „a căzut”, pentru o casă lovită de furtună româna curentă cere firesc „s-a prăbușit”; substantivul cognat din propoziția următoare rămâne redat prin „căderea”.
- source_word: ἡ πτῶσις αὐτῆς μεγάλη
  choice: căderea ei a fost mare
  rationale: Păstrează substantivul πτῶσις și caracterizarea sobră μεγάλη, fără amplificări precum „catastrofală” și fără inversiune nefiresc de solemnă.
theological_decisions:
- issue: Intensitatea imaginii judecății la încheierea parabolei
  choice: căderea ei a fost mare
  alternative: prăbușirea ei a fost catastrofală
  rationale: Textul grec afirmă mărimea căderii casei, fără a explicita aici natura judecății. Formularea păstrează forța avertismentului și tensiunea teologică fără adaos interpretativ.
translation_notes:
  register: Română standard modernă, clară și demnă. Succesiunea repetată cu „și/au” păstrează cadența cumulativă a furtunii, iar punctuația evită o frază greoaie.
