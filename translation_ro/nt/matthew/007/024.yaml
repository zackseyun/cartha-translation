id: MAT.7.24
reference: Matthew 7:24
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ἀκούει μου τοὺς λόγους τούτους καὶ ποιεῖ αὐτούς, ⸀ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: ro
  text: De aceea, oricine aude aceste cuvinte ale mele și le pune în practică va fi asemănat[a] cu un bărbat înțelept[b] care și-a construit casa pe stâncă.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „va fi asemenea” ori „va fi comparat”.'
    reason: lexical_alternative
  - marker: b
    text: 'Greacă: „un bărbat înțelept”; termenul folosit pentru personajul comparației este masculin.'
    reason: cultural_note
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: De aceea, oricine
  rationale: οὖν exprimă concluzia care decurge din învățătura precedentă, iar construcția Πᾶς ... ὅστις are sens distributiv și general. „De aceea, oricine” redă firesc ambele elemente în româna actuală.
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: aude aceste cuvinte ale mele
  rationale: „Aude” păstrează sensul direct al lui ἀκούει fără a introduce explicit ideea suplimentară de ascultare, iar „aceste cuvinte ale mele” redă atât τούτους, cât și genitivul μου.
- source_word: καὶ ποιεῖ αὐτούς
  choice: și le pune în practică
  rationale: Redarea literală „și le face” este nefirească în română. În acest context, ποιεῖ înseamnă îndeplinirea celor auzite; „le pune în practică” exprimă clar și natural acest sens.
- source_word: ὁμοιωθήσεται
  choice: va fi asemănat
  rationale: Forma păstrează diateza pasivă și sensul comparativ al verbului grec, rămânând totodată firească și demnă în română.
- source_word: ἀνδρὶ φρονίμῳ
  choice: cu un bărbat înțelept
  rationale: ἀνήρ indică aici o persoană de sex masculin, iar „bărbat” păstrează această precizie. „Înțelept” redă limpede și consacrat sensul lui φρόνιμος în context.
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: care și-a construit casa
  rationale: Construcția reflexiv-posesivă românească redă natural faptul că bărbatul și-a construit propria casă. „A construit” este echivalentul actual și direct al verbului.
- source_word: ἐπὶ τὴν πέτραν
  choice: pe stâncă
  rationale: „Pe stâncă” păstrează imaginea unei temelii stâncoase fără a o preciza excesiv printr-un termen precum „rocă de bază”.
theological_decisions:
- issue: Limbajul masculin din comparație
  choice: un bărbat înțelept
  alternative: un om înțelept / o persoană înțeleaptă
  rationale: Afirmația de deschidere îi include generic pe toți cei care aud și împlinesc, dar personajul comparației este exprimat în greacă prin ἀνήρ, termen masculin specific. Traducerea păstrează această distincție fără a restrânge aplicarea generală a afirmației.
- issue: Relația dintre auzire și faptă
  choice: aude ... și le pune în practică
  alternative: ascultă ... și le împlinește
  rationale: Textul juxtapune auzirea și săvârșirea. Redarea aleasă evită să includă deja ideea de obediență în verbul „aude” și păstrează tensiunea dintre receptarea cuvintelor și punerea lor în practică.
translation_notes:
  register: Română standard modernă, cu formulare clară și demnă. „Le pune în practică” evită literalismul neidiomatic, iar „va fi asemănat” păstrează pasivul și deschiderea semantică a textului grec.
