id: MAT.7.13
reference: Matthew 7:13
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι πλατεῖα ⸂ἡ πύλη⸃ καὶ εὐρύχωρος ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν, καὶ πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: ro
  text: Intrați pe poarta cea strâmtă. Căci largă este poarta și lat este drumul care duce la pierzare[a], iar mulți sunt cei ce intră pe ea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „la pieire”, „la distrugere” ori „la ruină”. Termenul grecesc ἀπώλεια poate desemna pierzarea, distrugerea sau ruina.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: Intrați
  rationale: Imperativ aorist activ, persoana a doua plural; redă direct și firesc porunca.
- source_word: διὰ τῆς στενῆς πύλης
  choice: pe poarta cea strâmtă
  rationale: În româna actuală, „a intra pe poartă” exprimă idiomatic trecerea prin ea; „cea strâmtă” păstrează contrastul explicit cu poarta largă.
- source_word: ὅτι
  choice: Căci
  rationale: Introduce temeiul explicativ al poruncii într-un registru biblic demn, dar inteligibil.
- source_word: πλατεῖα ἡ πύλη
  choice: largă este poarta
  rationale: Păstrează antepunerea adjectivului și accentul construcției grecești.
- source_word: εὐρύχωρος ἡ ὁδός
  choice: lat este drumul
  rationale: εὐρύχωρος descrie ceva larg sau încăpător; „lat” este firesc pentru un drum și menține imaginea concretă.
- source_word: ἡ ἀπάγουσα
  choice: care duce
  rationale: Redare idiomatică a participiului prezent cu sens direcțional.
- source_word: εἰς τὴν ἀπώλειαν
  choice: la pierzare
  rationale: „Pierzare” redă gravitatea lui ἀπώλεια fără a preciza mai mult decât spune textul.
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: mulți sunt cei ce intră pe ea
  rationale: Păstrează accentul pus pe „mulți” și construcția participială. Pronumele feminin se poate raporta gramatical la „poartă”, iar expresia „a intra pe ea” susține acest referent.
theological_decisions:
- issue: Sensul lui ἀπώλεια în avertismentul lui Isus
  choice: pierzare
  alternative: distrugere; ruină; pieire
  rationale: Termenul indică un deznodământ dezastruos, fără ca versetul să-i definească aici întreaga natură teologică. „Pierzare” păstrează această tensiune.
- issue: Referentul pronumelui αὐτῆς
  choice: pronumele feminin „ea”, cu referire naturală la poartă
  alternative: explicitarea „pe acea poartă”
  rationale: Greaca folosește un pronume, nu repetă substantivul. Româna permite păstrarea lui, iar genul feminin și verbul „a intra” fac referirea la poartă firească, fără adaos explicitativ.
translation_notes:
  register: Română standard modernă, cu o sintaxă ușor solemnă potrivită discursului sapiențial al lui Isus. Inversiunile „largă este poarta” și „lat este drumul” păstrează accentul grecesc fără a deveni greu de înțeles.
