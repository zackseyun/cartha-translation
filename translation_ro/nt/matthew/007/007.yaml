id: MAT.7.7
reference: Matthew 7:7
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/007.yaml
  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: ro
  text: Cereți[a] și vi se va da; căutați și veți găsi; bateți și vi se va deschide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Imperativele grecești la prezent pot fi înțelese și cu sens continuu sau repetat: „Continuați să cereți... continuați să căutați... continuați să bateți.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: Cereți
  rationale: Imperativ prezent activ, persoana a doua plural. „Cereți” este firesc în româna actuală și păstrează forța poruncii fără a explicita excesiv aspectul imperfectiv.
- source_word: δοθήσεται
  choice: vi se va da
  rationale: Viitor pasiv al lui δίδωμι. Construcția românească păstrează pasivul și lasă neexprimat agentul, ca în greacă.
- source_word: ὑμῖν
  choice: vi
  rationale: Pronumele la dativ este redat idiomatic prin forma clitică „vi”, atât în „vi se va da”, cât și, subînțeles prin paralelism, în „vi se va deschide”.
- source_word: ζητεῖτε
  choice: căutați
  rationale: Imperativ prezent activ. „Căutați” păstrează atât sensul concret, cât și pe cel figurat, într-un registru demn și accesibil.
- source_word: εὑρήσετε
  choice: veți găsi
  rationale: Viitor activ indicativ, redat direct și natural în română.
- source_word: κρούετε
  choice: bateți
  rationale: Imperativ prezent activ. În contextul unei uși subînțelese, „bateți” este formularea românească firească.
- source_word: ἀνοιγήσεται
  choice: vi se va deschide
  rationale: Viitor pasiv al lui ἀνοίγω. Formula păstrează valoarea pasivă și relația exprimată de dativul ὑμῖν.
- source_word: καὶ
  choice: și
  rationale: Conjuncția coordonatoare repetată menține paralelismul și ritmul textului grec, fără a adăuga o nuanță consecutivă.
theological_decisions:
- issue: Aspectul celor trei imperative la prezent
  choice: 'Imperative simple: „Cereți”, „căutați”, „bateți”'
  alternative: „Continuați să cereți... continuați să căutați... continuați să bateți” sau „Cereți mereu...”
  rationale: Formele grecești pot avea o nuanță continuă sau repetată, dar aceasta nu trebuie impusă în textul principal. Imperativele simple sunt naturale în română, iar alternativa aspectuală este consemnată în notă.
- issue: Agentul pasivelor δοθήσεται și ἀνοιγήσεται
  choice: Agentul rămâne neexprimat
  alternative: 'Explicitarea lui Dumnezeu ca agent: „Dumnezeu vă va da/deschide”'
  rationale: Greaca folosește pasivul fără a numi agentul. Deși contextul poate indica un pasiv divin, explicitarea ar rezolva ceea ce textul lasă implicit.
translation_notes:
  register: Română standard modernă, cu formulare concisă, ritmică și demnă. Paralelismul celor trei îndemnuri și al celor trei promisiuni este păstrat.
