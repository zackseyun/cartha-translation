id: MAT.7.18
reference: Matthew 7:18
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: ro
  text: Un pom bun[a] nu poate da roade rele[b], și niciun pom putred[c] nu poate da roade bune.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „un pom sănătos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „roade dăunătoare”.'
    reason: lexical_alternative
  - marker: c
    text: 'Sau: „un pom stricat” ori „un pom descompus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: un pom bun
  rationale: „Pom” este termenul românesc firesc în contextul roadelor, iar „bun” păstrează atât imaginea concretă, cât și valoarea evaluativă a lui ἀγαθός, fără a restrânge sensul la sănătatea fizică.
- source_word: οὐ δύναται ... ποιεῖν
  choice: nu poate face
  rationale: Construcția exprimă o imposibilitate categorică. În română, „a face roade” păstrează verbul ποιέω și este natural în această imagine proverbială.
- source_word: καρποὺς πονηρούς
  choice: roade rele
  rationale: πονηρός poate descrie ceea ce este rău, vătămător sau de proastă calitate. „Rele” păstrează aici atât contrastul calitativ, cât și posibila rezonanță morală.
- source_word: οὐδέ
  choice: și nici
  rationale: „Și nici” leagă firesc în română a doua negație de prima și menține paralelismul celor două propoziții.
- source_word: δένδρον σαπρόν
  choice: un pom putred
  rationale: σαπρός înseamnă propriu-zis „putred, descompus, stricat”. „Putred” redă viu imaginea și evită termenul mai general „rău”.
- source_word: καρποὺς καλούς
  choice: roade bune
  rationale: καλός indică aici roade de calitate bună. „Roade bune” este formularea românească naturală și susține contrastul cu „roade rele”.
theological_decisions:
- issue: Natura imposibilității exprimate de metaforă
  choice: 'Afirmația este redată ca imposibilitate categorică: „nu poate”.'
  alternative: „nu face de obicei” sau „nu ar trebui să facă”
  rationale: δύναται, negat prin οὐ, exprimă incapacitatea, nu doar improbabilitatea ori o obligație morală. Redarea păstrează forța afirmației fără a trage concluzii doctrinare dincolo de metaforă.
translation_notes:
  register: Română standard modernă, cu formulare demnă și accesibilă. „Pom” și „roade” păstrează imaginea agricolă familiară; structura echilibrată reproduce paralelismul și contrastul categoric al textului grec.
