id: MAT.7.17
reference: Matthew 7:17
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οὕτως πᾶν δένδρον ἀγαθὸν καρποὺς καλοὺς ποιεῖ, τὸ δὲ σαπρὸν δένδρον καρποὺς πονηροὺς ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/017.yaml
  text: So[a], every good tree produces good fruit[c][b], but the rotten tree produces bad fruit.
translation:
  language: ro
  text: Tot așa[a], orice pom bun dă roade bune, dar pomul putred[b] dă roade rele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Astfel” ori „În felul acesta”.'
    reason: lexical_alternative
  - marker: b
    text: Termenul grecesc poate însemna și „stricat”, „degradat” sau „corupt”.
    reason: lexical_alternative
  - marker: c
    text: 'Sau: „roade nelegiuite”. Cuvântul grecesc poate avea atât sensul general de „rele”, cât și o conotație morală mai accentuată.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Tot așa
  rationale: Redă firesc în română legătura cu imaginea și concluzia din contextul anterior; „Astfel” rămâne o alternativă posibilă.
- source_word: πᾶν δένδρον
  choice: orice pom
  rationale: Construcția grecească are sens distributiv și generalizator. „Orice pom” păstrează caracterul proverbial și este idiomatic în română.
- source_word: ἀγαθὸν
  choice: bun
  rationale: Păstrează calificarea largă, funcțională și implicit morală a pomului, fără a explica metafora.
- source_word: καρποὺς καλοὺς
  choice: roade bune
  rationale: În acest context, καλός indică roade de calitate. „Roade bune” este expresia românească firească și menține paralelismul cu „pom bun”.
- source_word: ποιεῖ
  choice: dă
  rationale: Deși ποιέω are sensul de bază „a face”, în asociere cu pomul și roadele româna idiomatică spune că pomul „dă roade”. Alegerea păstrează sensul de producere fără rigiditate lexicală.
- source_word: τὸ δὲ
  choice: dar pomul
  rationale: δέ marchează aici contrastul dintre cele două feluri de pom, redat limpede prin „dar”.
- source_word: σαπρὸν
  choice: putred
  rationale: σαπρός desemnează ceea ce este stricat, degradat sau nefolositor. „Putred” păstrează imaginea concretă și forța termenului.
- source_word: καρποὺς πονηροὺς
  choice: roade rele
  rationale: πονηρός poate însemna „rău”, inclusiv în sens moral, dar în metafora agricolă „roade rele” sună natural și lasă contextului rolul de a evidenția implicația morală.
theological_decisions:
- issue: Forța agricolă și morală a imaginii
  choice: Păstrarea imaginii concrete a pomului și roadelor, fără explicitarea aplicării ei morale
  alternative: O formulare interpretativă precum „pomul corupt dă roade nelegiuite”
  rationale: Versetul apare în avertismentul despre profeții falși, însă formularea grecească exprimă metafora, nu interpretarea ei. Traducerea păstrează tensiunea și permite contextului să transmită sensul moral.
translation_notes:
  register: Română standard modernă, simplă și demnă. „Pom” și „dă roade” păstrează registrul proverbial și imaginea agricolă într-o formulare firească pentru cititorul contemporan.
