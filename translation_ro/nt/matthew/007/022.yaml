id: MAT.7.22
reference: Matthew 7:22
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ· Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: ro
  text: 'Mulți Îmi vor spune în ziua aceea: „Doamne, Doamne, oare nu în numele Tău am profețit, în numele Tău am alungat demoni și în numele Tău am făcut multe minuni[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „multe fapte de putere”. Expresia grecească spune literal „multe puteri” și este folosită în Evanghelii pentru fapte miraculoase.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Mulți
  rationale: Adjectivul masculin plural este folosit substantival. „Mulți” redă direct forma greacă, fără a adăuga substantivul „oameni”.
- source_word: ἐροῦσίν μοι
  choice: Îmi vor spune
  rationale: Redă natural în română viitorul lui λέγω împreună cu pronumele la dativ, păstrând adresarea directă.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: în ziua aceea
  rationale: Este echivalentul temporal firesc în română și păstrează caracterul eshatologic implicit, fără explicitarea interpretativă „în ziua judecății”.
- source_word: Κύριε κύριε
  choice: Doamne, Doamne
  rationale: Vocativul repetat exprimă insistență și apel direct. „Doamne” păstrează atât sensul obișnuit al titlului, cât și greutatea lui cristologică.
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: oare nu ... am profețit
  rationale: „Oare nu” redă întrebarea care așteaptă un răspuns afirmativ, iar „am profețit” este echivalentul consacrat și transparent al verbului.
- source_word: τῷ σῷ ὀνόματι
  choice: în numele Tău
  rationale: Expresia românească redă acțiunea făcută prin invocarea sau sub autoritatea numelui cuiva. Repetarea ei de trei ori păstrează accentul retoric al grecei.
- source_word: δαιμόνια ἐξεβάλομεν
  choice: am alungat demoni
  rationale: „A alunga demoni” este o formulare actuală și clară pentru sensul exorcistic al lui ἐκβάλλω.
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: am făcut multe minuni
  rationale: În Evanghelii, δύναμις la plural poate desemna fapte miraculoase care manifestă putere. „Multe minuni” este natural și ușor de înțeles în româna actuală; nota păstrează sensul lexical mai literal.
theological_decisions:
- issue: Redarea lui κύριος în adresarea directă către Isus
  choice: Doamne
  alternative: Stăpâne
  rationale: „Doamne” păstrează sensul firesc al titlului și rezonanța cristologică, fără a impune o explicare suplimentară.
- issue: Forța eshatologică a expresiei „ziua aceea”
  choice: în ziua aceea
  alternative: în ziua judecății
  rationale: Contextul indică judecata finală, dar textul grecesc spune numai „ziua aceea”. Formularea păstrează aluzia și tensiunea teologică fără a transforma implicația în explicitare.
- issue: Sensul lui δυνάμεις în descrierea faptelor revendicate
  choice: minuni
  alternative: fapte de putere
  rationale: Contextul evanghelic susține sensul de fapte miraculoase, însă nota semnalează imaginea lexicală a „puterilor”, evitând pierderea completă a nuanței originale.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Ordinea repetată „în numele Tău” urmează accentul retoric al textului grec. Majusculele reverențiale pentru pronumele adresate lui Isus sunt folosite consecvent în acest vers.
