id: MAT.7.2
reference: Matthew 7:2
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ κρίματι κρίνετε κριθήσεσθε, καὶ ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/002.yaml
  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: ro
  text: Căci cu judecata cu care judecați, veți fi judecați, iar cu măsura cu care măsurați, vi se va măsura[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „vi se va măsura înapoi”. Greaca nu exprimă explicit ideea de „înapoi”, deși sensul reciproc o sugerează.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματι
  choice: judecata
  rationale: Substantivul denumește aici judecata sau evaluarea judiciară. „Judecata” păstrează legătura lexicală cu formele verbului κρίνω și se potrivește avertismentului din context.
- source_word: κρίνετε
  choice: judecați
  rationale: κρίνω poate însemna a judeca, a evalua sau a condamna. Sensul general „a judeca” păstrează repetiția din greacă fără a restrânge nejustificat ideea la condamnare.
- source_word: κριθήσεσθε
  choice: veți fi judecați
  rationale: Viitorul pasiv reia același verb și exprimă reciprocitatea, fără a preciza că rezultatul va fi neapărat condamnarea.
- source_word: μέτρῳ
  choice: măsura
  rationale: Termenul este folosit metaforic pentru criteriul sau măsura aplicată altora. Echivalentul românesc păstrează jocul de cuvinte cu verbul „a măsura”.
- source_word: μετρεῖτε
  choice: măsurați
  rationale: Redarea prin verbul „a măsura” păstrează corespondența directă cu substantivul μέτρον și caracterul proverbial al enunțului.
- source_word: μετρηθήσεται ὑμῖν
  choice: vi se va măsura
  rationale: Pasivul urmat de dativ este redat firesc și concis. Ideea de întoarcere este sugerată de reciprocitatea propoziției, dar adverbul „înapoi” nu apare explicit în greacă.
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: cu ... cu care
  rationale: Construcția repetată indică instrumentul sau criteriul. Formularea românească păstrează paralelismul și este naturală în context.
- source_word: γὰρ
  choice: Căci
  rationale: Conjuncția introduce motivarea poruncii din versetul precedent și păstrează clar legătura explicativă.
- source_word: καὶ
  choice: iar
  rationale: „Iar” leagă natural cele două propoziții paralele în română și evidențiază al doilea termen al comparației fără a introduce opoziție doctrinară.
theological_decisions:
- issue: Natura judecății reciproce
  choice: Versetul afirmă principiul unei judecăți corespunzătoare, păstrând neprecizat agentul verbelor pasive.
  alternative: Agentul ar putea fi explicitat fie ca Dumnezeu, fie ca ceilalți oameni.
  rationale: Formele pasive din greacă nu numesc agentul. Traducerea păstrează această deschidere interpretativă și nu limitează avertismentul nici la judecata divină, nici la reacția oamenilor.
translation_notes:
  register: Română standard modernă, cu ton demn și proverbial. Repetițiile „judecata/judecați/judecați” și „măsura/măsurați/măsura” sunt păstrate intenționat pentru a reflecta paralelismul și legăturile lexicale din greacă.
