  text: ⸀Προσέχετε ἀπὸ τῶν ψευδοπροφητῶν, οἵτινες ἔρχονται πρὸς ὑμᾶς ἐν ἐνδύμασι προβάτων ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: ro
  text: Păziți-vă de profeții falși[a], care vin la voi îmbrăcați în haine de oaie[b], dar pe dinăuntru sunt lupi răpitori[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Fiți atenți la profeții falși”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literal: „în veșminte de oi”.'
    reason: lexical_alternative
  - marker: c
    text: 'Sau: „pe dinăuntru sunt lupi rapace”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Păziți-vă de
  rationale: Imperativul prezent plural cere vigilență continuă, iar construcția românească redă firesc atât avertismentul, cât și obiectul lui.
- source_word: ψευδοπροφητῶν
  choice: profeții falși
  rationale: Redare standard și limpede pentru cei care pretind în mod fals autoritate profetică sau vorbesc fals ca profeți.
- source_word: οἵτινες ἔρχονται πρὸς ὑμᾶς
  choice: care vin la voi
  rationale: Păstrează descrierea directă, la timpul prezent, a apropierii lor de ascultători.
- source_word: ἐν ἐνδύμασι προβάτων
  choice: îmbrăcați în piei de oaie
  rationale: Redă natural în română imaginea unor veșminte făcute din sau asociate cu oaia și păstrează contrastul dintre înfățișarea exterioară și realitatea lăuntrică.
- source_word: ἔσωθεν δέ
  choice: dar pe dinăuntru
  rationale: Exprimă clar opoziția dintre exterior și interior, fără a explica excesiv metafora.
- source_word: λύκοι ἅρπαγες
  choice: lupi răpitori
  rationale: Adjectivul „răpitori” păstrează sensul de prădători agresivi și distructivi al lui ἅρπαγες, fără a-l reduce doar la foame.
theological_decisions:
- issue: Natura avertismentului împotriva conducătorilor religioși înșelători
  choice: Imaginea este redată direct ca avertisment moral și spiritual împotriva profeților falși.
  alternative: Restrângerea referinței la eretici sau la o categorie eclezială definită ulterior.
  rationale: Textul grec contrastează aparența inofensivă cu natura prădătoare, fără să specifice categorii confesionale ori instituționale ulterioare.
translation_notes:
  register: Română standard modernă, cu ton solemn, dar accesibil. „Păziți-vă” păstrează forța avertismentului; „pe dinăuntru” și „lupi răpitori” mențin imaginea vie și contrastul textului grec.
