  text: καὶ ὁ ὀμόσας ἐν τῷ ναῷ ὀμνύει ἐν αὐτῷ καὶ ἐν τῷ ⸀κατοικοῦντι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/021.yaml
  text: And whoever swears by the temple swears by it and by the One dwelling in it[a].
translation:
  language: ro
  text: Iar cine jură pe templu jură pe el și pe Cel care locuiește în el.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „în templu ... în el”; prepoziția grecească înseamnă literal „în”, dar în această formulă de jurământ are sensul „pe”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: cine jură
  rationale: Participiul aorist articulat are valoare substantivală și generică. Formularea românească redă firesc orice persoană care face un asemenea jurământ.
- source_word: ἐν τῷ ναῷ
  choice: pe templu
  rationale: Deși ἐν înseamnă de regulă „în”, aici face parte din formula jurământului și indică realitatea invocată; în română, construcția idiomatică este „a jura pe”.
- source_word: ναῷ
  choice: templu
  rationale: ναός desemnează templul, mai precis sanctuarul propriu-zis. „Templu” este termenul curent și clar în acest context.
- source_word: ὀμνύει
  choice: jură
  rationale: Indicativul prezent exprimă principiul general care decurge din jurământ, iar prezentul simplu românesc îl redă direct.
- source_word: ἐν αὐτῷ
  choice: pe el
  rationale: Prepoziția păstrează aici sensul formulei de jurământ, iar pronumele se referă la templu.
- source_word: τῷ κατοικοῦντι αὐτόν
  choice: Cel care locuiește în el
  rationale: Participiul substantival îl indică în context pe Dumnezeu ca locuitor al templului. „Cel care locuiește” este natural și păstrează imaginea prezenței divine.
theological_decisions:
- issue: Identitatea celui care locuiește în templu
  choice: „Cel” cu majusculă, referindu-se la Dumnezeu
  alternative: „cel care locuiește în el”, fără majusculă
  rationale: Contextul arată că jurământul pe templu îl implică pe Dumnezeu, care locuiește în el. Majuscula semnalează referentul divin clar, fără a adăuga o afirmație doctrinară străină textului.
translation_notes:
  register: Română standard modernă, clară și demnă. S-a folosit formula idiomatică „a jura pe”, păstrând într-o notă sensul literal al prepoziției grecești.
