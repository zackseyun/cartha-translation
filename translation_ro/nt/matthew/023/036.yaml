  text: ἀμὴν λέγω ὑμῖν, ⸀ἥξει ⸂ταῦτα πάντα⸃ ἐπὶ τὴν γενεὰν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/036.yaml
  text: Truly I say to you[b][a], all these things will come upon this generation.
translation:
  language: ro
  text: 'Adevărat vă spun: toate acestea[a] vor veni peste generația aceasta[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau „toate aceste lucruri”. Greaca folosește pluralul: „toate acestea”.'
    reason: lexical_alternative
  - marker: b
    text: Expresia „generația aceasta” a fost înțeleasă și ca „oamenii aceștia” sau, mai larg, ca o generație necredincioasă; însă greaca spune cel mai direct „generația aceasta”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Adevărat
  rationale: În formula solemnă ἀμὴν λέγω ὑμῖν, termenul introduce și întărește autoritatea afirmației. „Adevărat” redă firesc această funcție în româna modernă; „Amin” ar putea suna aici mai degrabă liturgic decât declarativ.
- source_word: λέγω ὑμῖν
  choice: vă spun
  rationale: Redare directă și idiomatică a verbului λέγω împreună cu pronumele la dativ, păstrând tonul solemn fără o formulare greoaie.
- source_word: ἥξει
  choice: vor veni
  rationale: Viitorul verbului ἥκω exprimă venirea sau ajungerea celor anunțate asupra generației vizate. Acordul la plural este firesc în română cu subiectul „toate acestea”.
- source_word: ταῦτα πάντα
  choice: toate acestea
  rationale: Păstrează explicit pluralul neutru grecesc și trimite natural la judecățile și vina pentru sânge din contextul precedent.
- source_word: ἐπὶ
  choice: peste
  rationale: Cu acuzativul, prepoziția indică aici venirea unor consecințe asupra cuiva. „Peste” este expresia românească firească și păstrează tonalitatea judiciară fără a adăuga sensul mai explicit de ostilitate al lui „împotriva”.
- source_word: γενεὰν ταύτην
  choice: generația aceasta
  rationale: Este redarea lexicală cea mai directă și păstrează atât substantivul „generație”, cât și demonstrativul, fără a decide interpretativ cine este inclus în referent.
theological_decisions:
- issue: Referentul expresiei γενεὰν ταύτην
  choice: generația aceasta
  alternative: o categorie mai largă de oameni necredincioși; poporul evreu de-a lungul timpului; veacul prezent
  rationale: Textul grecesc spune cel mai direct „generația aceasta”. Traducerea păstrează formularea și forța ei temporală, fără să impună una dintre interpretările escatologice disputate.
translation_notes:
  register: Română standard modernă, clară și demnă. Formula „Adevărat vă spun” păstrează solemnitatea enunțului, iar ordinea propoziției rămâne firească în română. Marcajele notelor sunt așezate imediat după expresiile pe care le explică.
