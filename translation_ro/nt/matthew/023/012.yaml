id: MAT.23.12
reference: Matthew 23:12
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὅστις δὲ ὑψώσει ἑαυτὸν ταπεινωθήσεται, καὶ ὅστις ταπεινώσει ἑαυτὸν ⸀ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/012.yaml
  text: But whoever exalts himself will be humbled[b][a], and whoever humbles himself will be exalted.
translation:
  language: ro
  text: Dar oricine se va înălța va fi smerit[a], iar oricine se va smeri va fi înălțat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „va fi coborât” ... „va fi ridicat”.'
    reason: alternativă lexicală
lexical_decisions:
- source_word: ὅστις
  choice: oricine
  rationale: Pronume relativ nehotărât care introduce un principiu general; „oricine” redă firesc valoarea proverbială și universală.
- source_word: δὲ
  choice: dar
  rationale: Marchează un contrast moderat cu contextul precedent; „dar” păstrează această nuanță adversativă.
- source_word: ὑψώσει ἑαυτόν
  choice: se va înălța
  rationale: Construcția reflexivă românească redă idiomatic ideea de autoînălțare și păstrează forma de viitor a verbului grec.
- source_word: ταπεινωθήσεται
  choice: va fi smerit
  rationale: Redă direct viitorul pasiv, fără a preciza agentul, și exprimă coborârea în rang sau onoare sugerată de context.
- source_word: καὶ
  choice: iar
  rationale: „Iar” leagă firesc cele două propoziții paralele și evidențiază opoziția lor echilibrată, fără a introduce o ruptură puternică.
- source_word: ταπεινώσει ἑαυτόν
  choice: se va smeri
  rationale: Construcția reflexivă este naturală în română, păstrează viitorul și redă acțiunea voluntară de a se pune într-o poziție smerită.
- source_word: ὑψωθήσεται
  choice: va fi înălțat
  rationale: Păstrează viitorul pasiv și paralelismul lexical cu „se va înălța” din prima parte.
theological_decisions:
- issue: Agentul verbelor la diateza pasivă
  choice: Păstrarea formelor pasive fără numirea agentului
  alternative: 'Formulare activă cu Dumnezeu ca subiect: „Dumnezeu îl va smeri/înălța”'
  rationale: Greaca folosește forme pasive și nu numește explicit agentul. Traducerea păstrează deschisă formularea textului, fără a exclude implicația unei acțiuni divine.
- issue: Referința generică a masculinului singular grecesc
  choice: „oricine” cu forme reflexive neprecizate după gen
  alternative: O formulare explicit masculină, precum „orice om care se înalță pe sine”
  rationale: În română, „oricine se...” exprimă în mod natural referința generală a enunțului și nu pierde nicio informație semantică relevantă, deși pronumele reflexiv grecesc este morfologic masculin singular.
translation_notes:
  register: Registru modern, demn și proverbial. S-a păstrat simetria celor două propoziții, viitorul verbelor grecești și contrastul dintre înălțare și smerire. Formele reflexive sunt idiomatice în româna standard, iar pasivele nu explicitează agentul.
