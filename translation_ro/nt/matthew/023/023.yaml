id: MAT.23.23
reference: Matthew 23:23
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε τὰ βαρύτερα τοῦ νόμου, τὴν κρίσιν καὶ ⸂τὸ ἔλεος⸃ καὶ τὴν πίστιν· ⸀ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/023.yaml
  text: 'Woe to you[a], scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin, and have neglected the weightier matters of the law: justice and mercy and faith. These you ought to have done, without neglecting the others.'
translation:
  language: ro
  text: 'Vai de voi, cărturari și farisei ipocriți! Căci dați zeciuială din mentă, mărar și chimion, dar ați neglijat lucrurile mai importante ale Legii: dreptatea, mila și credincioșia[a]. Pe acestea trebuia să le împliniți, fără să le neglijați nici pe celelalte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „credința”. Termenul grecesc poate însemna credință, încredere sau credincioșie; în acest context etic, mulți înțeleg aici fidelitatea.'
    reason: Păstrează deschisă ambiguitatea semantică reală a lui πίστις.
lexical_decisions:
- source_word: Οὐαὶ
  choice: Vai de voi
  rationale: Păstrează formula profetică de denunțare și judecată, într-o exprimare consacrată și firească în română.
- source_word: γραμματεῖς
  choice: cărturari
  rationale: Echivalentul tradițional și precis în contextul Evangheliilor; evită parafraza mai largă „învățători ai Legii”.
- source_word: ὑποκριταί
  choice: ipocriți
  rationale: Redă sensul etic al termenului în acest context și este limpede pentru cititorul modern.
- source_word: ἀποδεκατοῦτε
  choice: dați zeciuială din
  rationale: Exprimă explicit oferirea unei zecimi și permite legarea naturală de plantele enumerate.
- source_word: ἡδύοσμον
  choice: mentă
  rationale: Denumirea românească standard a plantei.
- source_word: ἄνηθον
  choice: mărar
  rationale: Denumirea românească standard a plantei aromatice.
- source_word: κύμινον
  choice: chimen
  rationale: Denumirea românească uzuală a condimentului menționat.
- source_word: ἀφήκατε
  choice: ați neglijat
  rationale: În context înseamnă a lăsa nefăcut sau a trece cu vederea; formularea redă clar reproșul.
- source_word: τὰ βαρύτερα τοῦ νόμου
  choice: lucrurile mai importante ale Legii
  rationale: Redă sensul metaforic al comparativului βαρύτερα într-o română naturală și clară.
- source_word: κρίσιν
  choice: dreptatea
  rationale: În triada etică, termenul indică exercitarea dreptății, nu doar pronunțarea unei judecăți.
- source_word: ἔλεος
  choice: mila
  rationale: Echivalent biblic firesc, care păstrează dimensiunea etică și relațională a termenului.
- source_word: πίστιν
  choice: credincioșia
  rationale: În această enumerare de obligații etice, sensul de fidelitate sau loialitate este probabil; ambiguitatea lexicală este păstrată prin notă.
- source_word: ποιῆσαι
  choice: să le împliniți
  rationale: În raport cu cerințele Legii, „a împlini” este mai firesc în română decât literalul „a face”, fără a adăuga o idee străină textului.
theological_decisions:
- issue: Sensul lui πίστις în triada etică
  choice: credincioșia
  alternative: credința
  rationale: Contextul alătură dreptatea, mila și πίστις ca îndatoriri etice, ceea ce favorizează sensul de fidelitate. Totuși, termenul grec poate însemna și credință sau încredere, astfel că alternativa este consemnată fără a elimina ambiguitatea.
- issue: Raportul dintre cerințele mai importante și zeciuirea plantelor
  choice: Poruncile mai importante trebuiau împlinite fără neglijarea celorlalte practici
  alternative: O respingere totală a zeciuirii minuțioase
  rationale: Construcția ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ἀφιέναι afirmă explicit atât prioritatea primelor, cât și faptul că celelalte nu trebuiau lăsate nefăcute.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formularea evită arhaismele inutile, păstrând totodată forța profetică a mustrării și terminologia biblică bine cunoscută.
