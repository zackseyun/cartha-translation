  source_fidelity: 'Revizuire necesară pentru numele plantei: κύμινον este „chimion” în româna standard, nu „chimen” (care denumește în mod normal caraway/Carum carvi). Restul redă fidel structura și sensul versetului, inclusiv prioritatea lucrurilor mai importante ale Legii fără abandonarea zeciuirii.'
