  terminology: „Cărturari”, „farisei”, „ipocriți”, „zeciuială”, „dreptatea” și „mila” sunt alegeri potrivite. „Credincioșia” este o redare contextual plauzibilă a lui πίστις; nota păstrează în mod util alternativa „credința”.
