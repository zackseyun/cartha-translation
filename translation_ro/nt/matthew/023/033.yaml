id: MAT.23.33
reference: Matthew 23:33
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὄφεις γεννήματα ἐχιδνῶν, πῶς φύγητε ἀπὸ τῆς κρίσεως τῆς γεέννης;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/033.yaml
  text: You snakes[a], offspring of vipers! How will you escape from the judgment of Gehenna?
translation:
  language: ro
  text: Șerpilor, pui de vipere! Cum veți scăpa de judecata Gheenei?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „de judecata iadului”. În greacă: „Gheena”.'
    reason: Oferă echivalentul românesc uzual, păstrând totodată transparența termenului grec redat în text.
lexical_decisions:
- source_word: ὄφεις
  choice: Șerpilor
  rationale: Vocativ direct și firesc în româna actuală, păstrând forța invectivei și imaginea metaforică.
- source_word: γεννήματα
  choice: pui
  rationale: Redă natural ceea ce este născut sau produs; în asociere cu „vipere” exprimă limpede descendența fără tonul mai tehnic al lui „odrasle”.
- source_word: ἐχιδνῶν
  choice: de vipere
  rationale: Păstrează referirea specifică la vipere, nu doar la șerpi în general, și astfel intensitatea denunțului.
- source_word: πῶς
  choice: Cum
  rationale: Introduce întrebarea retorică despre perspectiva sau posibilitatea scăpării, fără să o reducă explicit la capacitate.
- source_word: φύγητε
  choice: veți scăpa
  rationale: Subjonctivul aorist din întrebarea deliberativ-retorică are orientare viitoare; „veți scăpa” este direct și idiomatic cu complementul introdus prin „de”.
- source_word: κρίσεως
  choice: judecata
  rationale: Păstrează sensul judiciar larg al termenului, fără a-l restrânge interpretativ la „condamnare” sau „sentință”.
- source_word: γεέννης
  choice: Gheenei
  rationale: Transliterarea românească tradițională și inteligibilă păstrează specificitatea termenului grec și fundalul său iudaic, fără a-l echivala neexplicat cu toate sensurile ulterioare ale cuvântului „iad”.
theological_decisions:
- issue: Redarea lui γέεννα
  choice: Gheena
  alternative: iadul
  rationale: „Gheena” păstrează termenul specific folosit în text și asocierile sale istorice și escatologice. Echivalentul uzual „iad” este oferit în notă, fără a elimina particularitatea formulării sursă.
- issue: Forța întrebării πῶς φύγητε
  choice: Cum veți scăpa
  alternative: Cum ați putea scăpa
  rationale: Viitorul românesc păstrează orientarea prospectivă și caracterul retoric, fără să transforme explicit întrebarea într-o afirmație despre incapacitate absolută.
translation_notes:
  register: Română standard modernă, directă și solemnă. Vocativul „Șerpilor” și expresia idiomatică „pui de vipere” păstrează asprimea mustrării; topica este firească, iar termenul „Gheena” este explicat succint în notă.
