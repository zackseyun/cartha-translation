lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Redă firesc adverbul temporal care marchează succesiunea narațiunii.
- source_word: ὁ Ἰησοῦς
  choice: Isus
  rationale: Forma consacrată în româna biblică modernă; articolul grecesc nu se redă înaintea numelui propriu.
- source_word: ἐλάλησεν
  choice: le-a vorbit
  rationale: Aoristul lui λαλέω exprimă simplu actul de a vorbi; pronumele „le” redă natural în română destinatarii la dativ.
- source_word: τοῖς ὄχλοις
  choice: mulțimilor
  rationale: Păstrează pluralul substantivului grecesc și evită termenul învechit „gloatelor”.
- source_word: καὶ
  choice: și
  rationale: Redă conjuncția coordonatoare simplă.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ucenicilor săi
  rationale: „Ucenici” este echivalentul consacrat și exact al lui μαθηταί, iar posesivul redă firesc genitivul αὐτοῦ.
