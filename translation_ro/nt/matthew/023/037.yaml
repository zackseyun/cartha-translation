source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ⸀ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυναγαγεῖν τὰ τέκνα σου, ὃν τρόπον ⸂ὄρνις ἐπισυνάγει⸃ τὰ νοσσία ⸀αὐτῆς ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/037.yaml
  text: Jerusalem[a], Jerusalem, the one who kills the prophets and stones those sent to her—how often I wanted to gather your children together, the way a hen gathers her chicks under her wings[b], and you were not willing!
translation:
  language: ro
  text: Ierusalime[a], Ierusalime, tu, care-i omori pe profeți și-i ucizi cu pietre pe cei trimiși la tine — de câte ori am vrut să-i adun pe copiii tăi, așa cum găina își adună puii sub aripi[b], și n-ați vrut?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, redând mai literal caracterizarea participială: „Ierusalime, Ierusalime, cea care omoară profeții și îi ucide cu pietre pe cei trimiși la ea.”'
    reason: lexical_alternative
  - marker: b
    text: Termenul grecesc poate desemna o „pasăre” în sens mai larg, dar imaginea adunării puilor sub aripi indică aici o găină.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Ierusalime, Ierusalime
  rationale: Folosește vocativul românesc firesc și păstrează repetiția emfatică a chemării de jale.
- source_word: ἡ ἀποκτείνουσα τοὺς προφήτας
  choice: tu, care-i omori pe profeți
  rationale: Redă participiul prezent substantivizat ca o caracterizare continuă a Ierusalimului, într-o formulare românească naturală.
- source_word: λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: și-i ucizi cu pietre pe cei trimiși la tine
  rationale: Păstrează paralelismul cu primul participiu și sensul concret al uciderii prin lovire cu pietre; «la tine» menține adresarea directă în româna curentă.
- source_word: ποσάκις
  choice: De câte ori
  rationale: Echivalent idiomatic care păstrează intensitatea lamentației.
- source_word: ἠθέλησα ... οὐκ ἠθελήσατε
  choice: am vrut ... n-ați vrut
  rationale: Aceeași rădăcină verbală este redată identic, păstrând contrastul de voință dintre Isus și destinatarii pluralului.
- source_word: ἐπισυναγαγεῖν τὰ τέκνα σου
  choice: să-i adun pe copiii tăi
  rationale: Păstrează metafora relațională «copiii tăi» fără a o restrânge interpretativ la un anumit grup.
- source_word: ὃν τρόπον ὄρνις ἐπισυνάγει τὰ νοσσία αὐτῆς
  choice: așa cum găina își adună puii
  rationale: «Găina» concretizează firesc pasărea maternă sugerată de context, iar repetarea lui «adună» reproduce legătura lexicală dintre cele două verbe grecești.
- source_word: ὑπὸ τὰς πτέρυγας
  choice: sub aripi
  rationale: Redare directă și naturală a imaginii protectoare, fără adaos interpretativ.
theological_decisions:
- issue: Contrastul de voință dintre Isus și Ierusalim
  choice: am vrut ... n-ați vrut
  alternative: am hotărât ... v-ați împotrivit / mi-am dorit ... ați refuzat
  rationale: Formularea păstrează tensiunea reală dintre dorința sau voința lui Isus și lipsa de voință a celor vizați, fără a soluționa prin traducere dezbateri despre voința divină ori responsabilitatea umană.
- issue: Identitatea expresiei «copiii tăi»
  choice: copiii tăi
  alternative: locuitorii tăi / poporul tău
  rationale: Metafora cetății personificate și relația ei cu oamenii asociați ei sunt păstrate fără a impune o identificare mai îngustă.
- issue: Schimbarea de la singularul adresării la pluralul final
  choice: la tine ... copiii tăi ... n-ați vrut
  alternative: nu ai vrut
  rationale: Pluralul lui ἠθελήσατε este păstrat, astfel încât cetatea personificată și oamenii ei rămân distincte, chiar în cadrul aceleiași lamentații.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Vocativul «Ierusalime» și repetiția susțin tonul solemn de lamentație. Formele clitice și «n-ați» sunt naturale în limba actuală, fără a coborî registrul. Punctuația cu semnul exclamării redă caracterul afectiv al rostirii.
