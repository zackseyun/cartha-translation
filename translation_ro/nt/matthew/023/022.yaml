id: MAT.23.22
reference: Matthew 23:22
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ οὐρανῷ ὀμνύει ἐν τῷ θρόνῳ τοῦ θεοῦ καὶ ἐν τῷ καθημένῳ ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/022.yaml
  text: And whoever swears by heaven swears by the throne of God and by the one seated upon it[a].
translation:
  language: ro
  text: Iar cine jură pe cer jură pe tronul lui Dumnezeu și pe Cel care șade pe el.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Cel care stă pe el”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: cine jură
  rationale: Participiul aorist articulat are aici valoare generică și substantivală; formularea românească exprimă firesc un principiu general, fără a-i da în mod artificial un sens trecut.
- source_word: ἐν
  choice: pe
  rationale: În formulele de jurământ, ἐν cu dativul indică realitatea pe care se jură; în română, construcția idiomatică este „a jura pe”. Aceeași valoare se păstrează în toate cele trei apariții.
- source_word: οὐρανῷ
  choice: cer
  rationale: În contextul religios iudaic și prin asocierea imediată cu tronul lui Dumnezeu, termenul desemnează cerul ca sferă cerească, nu doar bolta vizibilă.
- source_word: ὀμνύει
  choice: jură
  rationale: Prezentul indicativ exprimă un adevăr general, redat natural prin prezent în română.
- source_word: θρόνῳ τοῦ θεοῦ
  choice: tronul lui Dumnezeu
  rationale: Redarea păstrează genitivul explicit și tonul solemn al expresiei grecești.
- source_word: τῷ καθημένῳ
  choice: Cel care șade
  rationale: Participiul substantivizat îl indică reverențial pe ocupantul tronului. „Șade” este demn și natural în contextul unei imagini de întronare, fără a înlocui perifraza prin numele „Dumnezeu”.
- source_word: ἐπάνω αὐτοῦ
  choice: pe el
  rationale: În contextul tronului, expresia indică așezarea pe tron; pronumele se referă la „tronul”, substantiv masculin în română. „Deasupra lui” ar putea sugera separare spațială.
theological_decisions:
- issue: Referentul expresiei „Cel care șade pe el”
  choice: O perifrază reverențială pentru Dumnezeu întronat în cer
  alternative: O referire mai nedefinită la „cel care stă acolo”
  rationale: Sintagma imediat precedentă, „tronul lui Dumnezeu”, clarifică referentul, iar logica versetului este că jurământul pe cer îl implică pe Dumnezeu însuși. Traducerea păstrează perifraza textului grec și nu o înlocuiește explicit cu „Dumnezeu”.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Iar” redă legătura continuativă a lui καί, „a jura pe” este formula idiomatică românească, iar majuscula reverențială la „Cel” face limpede referentul personal fără a elimina formularea indirectă a originalului.
