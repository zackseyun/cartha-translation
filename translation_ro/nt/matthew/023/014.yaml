    issue: Construcția «și, ca pretext, faceți rugăciuni lungi»
    rationale: În română, «ca pretext» cere în mod normal un complement sau o precizare a lucrului invocat drept pretext. Grecescul προφάσει indică o practică simulată; «cu prefăcătorie, rostiți rugăciuni lungi» păstrează sensul fără a adăuga motivul concret ascuns.
