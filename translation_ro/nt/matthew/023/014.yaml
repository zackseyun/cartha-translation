source:
  edition: robinson-pierpont-2005-byzantine
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κατεσθίετε τὰς οἰκίας τῶν χηρῶν, καὶ προφάσει μακρὰ προσευχόμενοι· διὰ τοῦτο λήψεσθε περισσότερον κρίμα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/014.yaml
  text: Woe[a] to you, scribes and Pharisees, hypocrites! For you devour widows' houses, and as a pretext make long prayers; therefore you will receive greater condemnation.
translation:
  language: ro
  text: Vai de voi, cărturari și farisei ipocriți! Căci devorați casele văduvelor și, cu prefăcătorie, rostiți rugăciuni lungi. De aceea veți primi o condamnare mai grea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Acest verset lipsește din cele mai vechi manuscrise grecești, inclusiv Codex Sinaiticus și Codex Vaticanus din secolul al IV-lea, precum și din traduceri copte timpurii. El este însă păstrat în tradiția majoritară bizantină, în latina veche, în Vulgata și în tradiția siriacă. Probabil a fost adăugat ulterior de copiști pentru armonizare cu afirmațiile asemănătoare din Marcu 12:40 și Luca 20:47. Manuscrisele care îl includ diferă și în privința poziției lui: înainte sau după versetul 13.'
    reason: textual_critical
lexical_decisions:
- source_word: κατεσθίετε
  choice: devorați
  rationale: Păstrează metafora puternică a consumării nemiloase și exprimă exploatarea care le ruinează pe văduve ori le acaparează gospodăriile și averea.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: casele văduvelor
  rationale: 'Redarea literală păstrează deschiderea semantică a expresiei: poate desemna atât locuințele, cât și gospodăriile sau averea văduvelor.'
- source_word: προφάσει
  choice: ca pretext
  rationale: Indică o justificare aparentă folosită pentru a ascunde intențiile reale; formularea românească este directă și firească.
- source_word: περισσότερον
  choice: mai grea
  rationale: În asociere cu κρίμα, comparativul descrie intensitatea sau severitatea sporită a sentinței, nu simpla ei cantitate.
- source_word: κρίμα
  choice: condamnare
  rationale: În acest context punitiv, termenul se referă la o judecată nefavorabilă; «condamnare» transmite clar rezultatul, fără a slăbi avertismentul.
theological_decisions:
- issue: Relația dintre rugăciunile lungi și pretext
  choice: și, ca pretext, faceți rugăciuni lungi
  alternative: și faceți rugăciuni lungi de ochii lumii
  rationale: Păstrează formularea concentrată și ambiguitatea sintactică a grecescului, fără a explica în text exact ce ascund rugăciunile.
- issue: Sensul condamnării «mai grele»
  choice: veți primi o condamnare mai grea
  alternative: veți primi o condamnare mai mare
  rationale: Exprimă severitatea sporită sugerată de context, fără a construi o doctrină detaliată despre gradele pedepsei.
translation_notes:
  register: Română standard modernă, demnă și directă. «Cărturari» păstrează termenul biblic consacrat și inteligibil, iar «ipocriți», «pretext» și «condamnare mai grea» redau acuzația fără arhaisme. Marcajul notei este așezat la sfârșitul întregului verset deoarece nota privește autenticitatea și poziția versetului în ansamblu.
