  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: μηδὲ κληθῆτε καθηγηταί, ⸂ὅτι καθηγητὴς ὑμῶν ἐστιν εἷς⸃ ὁ χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/010.yaml
  text: Do not be called instructors, for you have one instructor, the Messiah[a].
translation:
  language: ro
  text: 'Nici să nu fiți numiți îndrumători, căci unul singur este Îndrumătorul vostru: Mesia[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „Cristos”.
    reason: Alternativă lexicală pentru titlul grecesc ὁ χριστός.
lexical_decisions:
- source_word: μηδὲ
  choice: Nici să nu
  rationale: Păstrează legătura cu interdicțiile precedente și redă firesc valoarea negativă aditivă a termenului grecesc.
- source_word: κληθῆτε
  choice: fiți numiți
  rationale: Redă pasivul și ideea primirii unei denumiri sau a unui titlu, fără a transforma porunca într-o simplă interdicție de a vă atribui singuri titlul.
- source_word: καθηγηταί / καθηγητὴς
  choice: îndrumători / Îndrumătorul
  rationale: „Îndrumător” cuprinde ideea de călăuzire și instruire proprie termenului καθηγητής și păstrează o distincție lexicală față de διδάσκαλος din contextul apropiat.
- source_word: ὅτι
  choice: căci
  rationale: Introduce motivul interdicției într-un registru demn și natural.
- source_word: ὑμῶν ἐστιν εἷς
  choice: unul singur este Îndrumătorul vostru
  rationale: Păstrează construcția predicativă și accentul grecesc asupra unicității.
- source_word: ὁ χριστός
  choice: Mesia
  rationale: Termenul articulat funcționează aici ca titlu și este tradus semantic, păstrând cadrul mesianic iudaic.
theological_decisions:
- issue: Redarea lui Χριστός
  choice: Mesia
  alternative: Cristos
  rationale: Articolul și poziția predicativă indică folosirea ca titlu; „Mesia” îi exprimă sensul, iar alternativa tradițională este consemnată în notă fără a impune o interpretare confesională.
- issue: Unicitatea îndrumătorului
  choice: unul singur este Îndrumătorul vostru
  alternative: aveți un singur îndrumător
  rationale: Formularea aleasă păstrează mai vizibil accentul și structura sursei grecești, rămânând totodată firească în română.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Majuscula din „Îndrumătorul” marchează referirea titulară la Mesia, nu introduce o distincție doctrinară suplimentară.
