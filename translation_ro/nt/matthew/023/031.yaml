  text: ὥστε μαρτυρεῖτε ἑαυτοῖς ὅτι υἱοί ἐστε τῶν φονευσάντων τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/031.yaml
  text: So you testify against yourselves that you are sons of those who murdered the prophets[a].
translation:
  language: ro
  text: Astfel, mărturisiți împotriva voastră înșivă[a] că sunteți fiii celor care i-au ucis pe profeți.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, mai literal: „depuneți mărturie vouă înșivă”. Expresia grecească poate fi redată astfel, deși, în context, mărturia lor îi incriminează.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Astfel
  rationale: Redă în mod firesc în română concluzia sau consecința dedusă din afirmația precedentă.
- source_word: μαρτυρεῖτε
  choice: mărturisiți
  rationale: Păstrează sensul de a depune mărturie și nuanța juridică a verbului.
- source_word: ἑαυτοῖς
  choice: împotriva voastră înșivă
  rationale: Dativul înseamnă literal „vouă înșivă”, dar contextul arată că mărturia îi incriminează; alternativa literală este păstrată în nota de subsol.
- source_word: ὅτι
  choice: că
  rationale: Introduce conținutul mărturiei, nu cauza ei.
- source_word: υἱοί
  choice: fiii
  rationale: Păstrează metafora familială explicit masculină și forța retorică a solidarității genealogice și morale.
- source_word: τῶν φονευσάντων
  choice: celor care i-au ucis
  rationale: Participiul aorist îi identifică prin actul săvârșit; „au ucis” este natural și, în context, exprimă omorârea nelegitimă fără a încărca formularea.
- source_word: τοὺς προφήτας
  choice: pe profeți
  rationale: Redare directă și firească a obiectului, referitoare la categoria cunoscută a mesagerilor lui Dumnezeu.
theological_decisions:
- issue: Dacă υἱοί trebuie redat literal sau interpretat mai larg ca descendență ori moștenire morală.
  choice: fiii
  alternative: copiii / urmașii
  rationale: „Fiii” păstrează limbajul familial și tensiunea dintre descendența genealogică și solidaritatea morală cu cei care i-au ucis pe profeți.
- issue: Dacă ἑαυτοῖς trebuie redat literal sau potrivit efectului incriminator din context.
  choice: împotriva voastră înșivă
  alternative: vouă înșivă
  rationale: Textul imediat indică o mărturie care se întoarce împotriva vorbitorilor, dar sensul formal al dativului rămâne vizibil în nota de subsol.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează tonul acuzator și metafora familială, iar nota semnalează ambiguitatea construcției grecești.
