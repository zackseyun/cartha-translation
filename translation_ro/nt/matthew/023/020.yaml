id: MAT.23.20
reference: Matthew 23:20
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ οὖν ὀμόσας ἐν τῷ θυσιαστηρίῳ ὀμνύει ἐν αὐτῷ καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/020.yaml
  text: Therefore[a], the one who swears by the altar swears by it and by everything on it.
translation:
  language: ro
  text: Așadar, cine jură pe altar jură pe el și pe tot ce este pe el.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „și pe toate cele aflate deasupra lui”. Expresia grecească este mai largă decât un singur „dar” și poate cuprinde tot ce este așezat pe altar.
    reason: alternativă lexicală
lexical_decisions:
- source_word: ὁ οὖν ὀμόσας
  choice: Așadar, cine jură
  rationale: οὖν introduce concluzia dedusă din argumentul anterior, iar participiul articulat are sens generic. Construcția românească „cine jură” redă firesc ideea de „oricine jură”, fără a o limita la o anumită persoană.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: pe altar
  rationale: În formulele de jurământ, ἐν împreună cu ὀμνύω indică lucrul invocat drept garanție. În româna actuală, expresia idiomatică este „a jura pe”, nu traducerea spațială „în altar”.
- source_word: ὀμνύει
  choice: jură
  rationale: Prezentul românesc păstrează caracterul general al afirmației și repetarea verbului din textul grec.
- source_word: ἐν αὐτῷ
  choice: pe el
  rationale: 'Pronumele se referă la altar, iar prepoziția este redată conform aceleiași formule românești de jurământ: „a jura pe”.'
- source_word: καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ
  choice: și pe tot ce este pe el
  rationale: Expresia substantivizată πᾶσι τοῖς ἐπάνω αὐτοῦ desemnează în mod general tot ce se află pe altar. Formularea nu este restrânsă la un singur dar sau numai la jertfe, iar „pe el” este natural în contextul obiectelor așezate pe altar.
theological_decisions:
- issue: Referentul expresiei „tot ce este pe el”
  choice: Referire generală la tot ce se află pe altar, fără precizarea „daruri” sau „jertfe”
  alternative: „tot ce este deasupra lui” ori „toate darurile de pe el”
  rationale: Contextul anterior menționează darul de pe altar, însă formularea greacă din acest vers este mai largă. Traducerea păstrează această deschidere semantică și nu restrânge în mod doctrinar referentul.
translation_notes:
  register: Română standard modernă, clară și demnă. S-a folosit formula idiomatică „a jura pe”, iar paralelismul și repetiția textului grec au fost păstrate.
source_grounding:
  english_pob_role: consult_only
