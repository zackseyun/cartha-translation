  text: καὶ ὑμεῖς πληρώσατε τὸ μέτρον τῶν πατέρων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/032.yaml
  text: And you[a], fill up the measure of your fathers.
translation:
  language: ro
  text: Iar voi, umpleți măsura strămoșilor voștri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „duceți la plinătate măsura păcatelor strămoșilor voștri”. Greaca spune literal „umpleți măsura strămoșilor voștri”, folosind metafora unei vinovății acumulate care ajunge la limită.'
    reason: alternativă lexicală și explicarea metaforei
lexical_decisions:
- source_word: καὶ
  choice: Iar
  rationale: Redă legătura cu denunțul precedent într-o română firească și păstrează continuarea retorică.
- source_word: ὑμεῖς
  choice: voi
  rationale: Pronumele explicit păstrează accentul contrastiv al grecei.
- source_word: πληρώσατε
  choice: umpleți
  rationale: Păstrează imperativul aorist, persoana a doua plural, precum și metafora aducerii unei măsuri la plinătate.
- source_word: τὸ μέτρον
  choice: măsura
  rationale: Traducerea literală menține metafora unei cantități de vinovăție care ajunge la limită, fără a explicita interpretativ «păcatelor» în text.
- source_word: τῶν πατέρων ὑμῶν
  choice: părinților voștri
  rationale: Păstrează formularea și continuitatea retorică a sursei; în context, «părinților» are sensul de înaintași sau strămoși.
theological_decisions:
- issue: 'Forța afirmației lui Isus: poruncă sau predicție ironică'
  choice: 'Imperativ cu forță ironică și judiciară: «umpleți măsura»'
  alternative: 'Predicție: «umpleți» în sensul «veți ajunge să umpleți» ori explicit «veți umple»'
  rationale: Forma πληρώσατε este imperativ aorist activ, persoana a doua plural. Traducerea păstrează forma gramaticală și tensiunea retorică a unei chemări ironice de a duce la capăt tiparul vinovăției părinților lor.
translation_notes:
  register: Română standard modernă, concisă și solemnă. «Iar voi» exprimă firesc accentul pronumelui; formularea literală «măsura părinților voștri» este păstrată în text, iar sensul contextual este explicat în notă.
