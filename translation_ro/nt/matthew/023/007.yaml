source:
  edition: SBLGNT
  text: καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ καλεῖσθαι ὑπὸ τῶν ἀνθρώπων· ⸀Ῥαββί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/007.yaml
  text: and greetings in the marketplaces, and to be called by men, ‘Rabbi.’
translation:
  language: ro
  text: și saluturile în piețe și să fie numiți de oameni «Rabi».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπασμούς
  choice: saluturile
  rationale: Redă natural pluralul articulat și, în context, saluturile publice și onorifice pe care cărturarii și fariseii le îndrăgesc.
- source_word: ἀγοραῖς
  choice: piețe
  rationale: Termenul desemnează piețele sau spațiile publice de întâlnire; «piețe» este concis și firesc în româna actuală.
- source_word: καλεῖσθαι
  choice: să fie numiți
  rationale: Păstrează infinitivul pasiv și ideea de a li se atribui un titlu.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: de oameni
  rationale: Redă agentul construcției pasive fără a restrânge nejustificat sensul generic al lui ἄνθρωποι la bărbați.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Păstrează titlul semitic transliterat, familiar limbajului biblic românesc, fără a-l înlocui interpretativ cu «învățător».
theological_decisions:
- issue: Sensul și forma titlului Ῥαββί
  choice: Păstrarea titlului «Rabi»
  alternative: «Învățătorule» sau «maestru»
  rationale: Textul folosește explicit titlul semitic; transliterarea conservă cadrul istoric și legătura cu explicația din versetul următor, fără a-i fixa aici întregul sens.
translation_notes:
  register: Formulare modernă, demnă și concisă, păstrată ca fragment coordonat cu versetul precedent. Ghilimelele românești marchează titlul rostit.
