  text: ὑμεῖς δὲ μὴ κληθῆτε· Ῥαββί, εἷς γάρ ἐστιν ὑμῶν ὁ ⸀διδάσκαλος, πάντες δὲ ὑμεῖς ἀδελφοί ἐστε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/008.yaml
  text: But you are not to be called ‘Rabbi,’ for one is your teacher[b][a], and you are all brothers.
translation:
  language: ro
  text: Dar voi să nu fiți numiți «Rabbi»[a], căci unul este învățătorul vostru, iar voi toți sunteți frați[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Învățător”. Titlul grec „Rabbi” are sensul de învățător, însă păstrarea titlului conservă cadrul iudaic și îl deosebește de termenul „învățătorul” care urmează în verset.'
    reason: lexical_alternative
  - marker: b
    text: „Frați” redă pluralul masculin grecesc ἀδελφοί; în context, termenul poate desemna colectiv ansamblul discipolilor.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κληθῆτε
  choice: să nu vă lăsați numiți
  rationale: Redă natural în română interdicția exprimată prin conjunctivul aorist pasiv cu μή și păstrează ideea că discipolii nu trebuie să accepte acest titlu.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Păstrează titlul transliterat din textul grec și cadrul iudaic, fără a-l confunda cu termenul διδάσκαλος din aceeași propoziție.
- source_word: εἷς
  choice: unul singur
  rationale: În română, formularea exprimă firesc accentul contextual asupra unicității, fără a adăuga o explicație doctrinară.
- source_word: ὁ διδάσκαλος
  choice: Învățătorul vostru
  rationale: Genitivul ὑμῶν arată relația cu discipolii; această formulare este firească și demnă în română.
- source_word: πάντες δὲ ὑμεῖς
  choice: iar voi toți
  rationale: Păstrează contrastul și accentul colectiv al construcției grecești.
- source_word: ἀδελφοί
  choice: frați
  rationale: Redă pluralul masculin și păstrează metafora familială; posibila referire colectivă la ceilalți discipoli este precizată în notă.
theological_decisions:
- issue: Dacă interdicția privește în mod absolut toate titlurile omenești sau denunță căutarea statutului în comunitatea discipolilor
  choice: Textul păstrează interdicția directă fără a-i extinde ori restrânge explicit aplicarea.
  alternative: O interdicție absolută a oricărui titlu asemănător sau, dimpotrivă, doar o critică restrânsă a ambiției ipocrite.
  rationale: Versetul formulează interdicția și motivul ei, dar nu definește toate aplicațiile ulterioare; traducerea nu trebuie să rezolve această tensiune prin adaosuri.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Rabbi” conservă culoarea istorică, iar „Învățătorul” este folosit pentru διδάσκαλος. Majuscula este editorială și marchează referentul unic din context, fără a-l identifica mai precis decât o face versetul.
