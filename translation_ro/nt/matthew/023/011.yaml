  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ μείζων ὑμῶν ἔσται ὑμῶν διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/011.yaml
  text: But the greatest among you will be your servant[a].
translation:
  language: ro
  text: Dar cel mai mare dintre voi va fi slujitorul vostru.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Comparativul grecesc redat aici prin „cel mai mare” poate funcționa idiomatic cu sens superlativ, desemnând persoana care ocupă locul cel mai înalt în grup.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Dar
  rationale: Marchează contrastul cu preocuparea pentru titluri și rang din contextul anterior.
- source_word: μείζων
  choice: cel mai mare
  rationale: Comparativul grecesc are aici valoare superlativă în mod idiomatic, indicând persoana cu rangul cel mai înalt din grup.
- source_word: ὑμῶν (prima ocurență)
  choice: dintre voi
  rationale: 'Redă firesc în română genitivul partitiv: persoana cea mai mare din cadrul grupului căruia i se adresează Isus.'
- source_word: ἔσται
  choice: va fi
  rationale: Redare directă și modernă a viitorului verbului «a fi».
- source_word: ὑμῶν (a doua ocurență)
  choice: vostru
  rationale: 'Exprimă relația cu διάκονος în română naturală: cel care îi slujește pe cei din grup.'
- source_word: διάκονος
  choice: slujitorul
  rationale: În acest context denumește o persoană care îi slujește pe alții, nu funcția eclezială tehnică de diacon.
theological_decisions:
- issue: Raportul dintre rang și slujire în învățătura lui Isus
  choice: 'Formularea prezintă răsturnarea etică a statutului: cel mai mare va fi slujitorul celorlalți.'
  alternative: „Cel mai mare dintre voi va fi diaconul vostru” sau „cel mai mare dintre voi să fie slujitorul vostru”.
  rationale: „Diaconul” ar introduce nejustificat sensul unei funcții ecleziale ulterioare, iar conjunctivul imperativ ar schimba forma de viitor a afirmației. Traducerea păstrează tensiunea dintre măreție și slujire.
translation_notes:
  register: Română standard modernă, simplă și demnă. „Slujitor” păstrează sensul relațional al slujirii fără a sugera în mod nejustificat o funcție bisericească tehnică.
