lexical_decisions:
- source_word: φιλοῦσι
  choice: Le plac
  rationale: În context, verbul exprimă o preferință puternică pentru semnele prestigiului social; „Le plac” este firesc în româna actuală și evită impresia unei iubiri teologice sau relaționale.
- source_word: δὲ
  choice: redat implicit
  rationale: Particula este slab conectivă și continuă descrierea din versetul anterior. Într-un fragment citat separat, omiterea ei produce o formulare românească mai firească, fără pierderea sensului.
- source_word: τὴν πρωτοκλισίαν
  choice: locurile de onoare
  rationale: Termenul desemnează locul de cea mai mare cinste la masă, în cadrul mesei antice la care participanții stăteau întinși. Redarea comunică limpede funcția socială, fără a impune cititorului detaliul cultural.
- source_word: ἐν τοῖς δείπνοις
  choice: la ospețe
  rationale: În acest context, termenul indică mese festive și publice, marcate de rang social; „ospețe” este o formulare demnă și inteligibilă în româna modernă.
- source_word: τὰς πρωτοκαθεδρίας
  choice: scaunele de frunte
  rationale: Compusul indică locurile cu cel mai înalt rang sau întâietate. Expresia românească păstrează ideea de prestigiu vizibil, nu doar de confort.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: în sinagogi
  rationale: Redare locativă directă și naturală, referitoare la adunările și clădirile sinagogale.
