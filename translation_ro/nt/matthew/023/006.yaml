  text: And they love the places of honor at banquets and the best seats in the synagogues[c][b][a],
translation:
  language: ro
  text: Le plac locul de onoare la ospețe[c][a] și scaunele de frunte în sinagogi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „locul de frunte la masă”; termenul grec se referă la poziția cea mai onorată la mesele formale din lumea antică, unde oaspeții stăteau întinși.
