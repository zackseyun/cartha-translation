source:
  edition: SBLGNT
  text: λέγων· Ἐπὶ τῆς Μωϋσέως καθέδρας ἐκάθισαν οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/002.yaml
  text: saying[a], “The scribes and the Pharisees sit in Moses’ seat.”
translation:
  language: ro
  text: 'spunând: „Cărturarii și fariseii s-au așezat pe scaunul lui Moise.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „stau pe scaunul lui Moise” ori „au șezut pe scaunul lui Moise”. Verbul grecesc poate fi înțeles și mai neutru; redarea „s-au așezat” păstrează posibila nuanță a ocupării unei poziții de autoritate.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: spunând
  rationale: Participiul prezent introduce cuvintele lui Isus și păstrează legătura sintactică cu versetul precedent.
- source_word: Ἐπὶ τῆς Μωϋσέως καθέδρας
  choice: pe scaunul lui Moise
  rationale: Prepoziția ἐπί cu genitivul și substantivul καθέδρα descriu ocuparea unui loc asociat autorității de învățare; formularea este firească în română și păstrează metafora.
- source_word: ἐκάθισαν
  choice: s-au așezat
  rationale: Aoristul poate descrie faptul de a se așeza sau de a ocupa un loc. Forma românească păstrează posibilitatea asumării poziției fără a introduce explicit ideea unei numiri oficiale.
- source_word: οἱ γραμματεῖς
  choice: cărturarii
  rationale: Termenul românesc consacrat pentru specialiștii în Scriptură și în Lege din contextul evanghelic.
- source_word: οἱ Φαρισαῖοι
  choice: fariseii
  rationale: Denumirea standard în română pentru această grupare iudaică.
theological_decisions:
- issue: Dacă ἐκάθισαν trebuie redat neutru («stau») sau cu nuanța ocupării/asumării unei poziții («s-au așezat»)
  choice: s-au așezat
  alternative: stau; au șezut
  rationale: Aoristul permite o redare evenimențială, iar «s-au așezat» păstrează posibila nuanță a ocupării poziției de autoritate asociate lui Moise, fără a afirma că aceasta ar fi fost uzurpată sau conferită de Dumnezeu.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. «Cărturarii» și «scaunul lui Moise» păstrează terminologia biblică familiară fără a pierde sensul instituțional al imaginii.
