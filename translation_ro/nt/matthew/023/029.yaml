id: MAT.23.29
reference: Matthew 23:29
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι οἰκοδομεῖτε τοὺς τάφους τῶν προφητῶν καὶ κοσμεῖτε τὰ μνημεῖα τῶν δικαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/029.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites, because you build the tombs of the prophets and decorate the monuments of the righteous[b],
translation:
  language: ro
  text: Vai de voi, cărturari și farisei ipocriți, pentru că construiți mormintele profeților și împodobiți monumentele funerare[a] ale celor drepți,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „mormintele”. Termenul grecesc poate desemna morminte ori monumente funerare; aici este redat „monumentele funerare” pentru a-l deosebi de „mormintele” menționate mai devreme în verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ
  choice: Vai de voi
  rationale: Păstrează formula profetică de condamnare și adresarea explicită din dativul ὑμῖν, într-o expresie românească firească și solemnă.
- source_word: γραμματεῖς
  choice: cărturari
  rationale: Denumirea tradițională și precisă în română pentru specialiștii iudei în Lege, fără extinderea interpretativă „învățători ai Legii”.
- source_word: Φαρισαῖοι
  choice: farisei
  rationale: Forma românească consacrată a numelui grupării.
- source_word: ὑποκριταί
  choice: ipocriți
  rationale: Redă direct acuzația de prefăcătorie moral-religioasă din contextul polemic.
- source_word: ὅτι
  choice: pentru că
  rationale: 'Exprimă limpede valoarea cauzală: acțiunile următoare constituie motivul condamnării.'
- source_word: οἰκοδομεῖτε
  choice: zidiți
  rationale: Redă construirea unor morminte într-un registru biblic demn, dar încă inteligibil; nu presupune nejustificat reconstruirea lor.
- source_word: τάφους
  choice: mormintele
  rationale: Se potrivește unor locuri funerare construite și păstrează termenul distinct de μνημεῖα.
- source_word: προφητῶν
  choice: profeților
  rationale: Redare directă a genitivului de apartenență sau asociere.
- source_word: κοσμεῖτε
  choice: împodobiți
  rationale: Exprimă ornamentarea sau înfrumusețarea, fără a exagera efectul.
- source_word: μνημεῖα
  choice: monumentele funerare
  rationale: Termenul grec poate desemna morminte ori monumente comemorative; expresia românească păstrează sensul funerar și îl deosebește de τάφους.
- source_word: δικαίων
  choice: celor drepți
  rationale: Redă adjectivul substantivizat ca desemnare a persoanelor socotite drepte, păstrând categoria moral-teologică a textului.
theological_decisions:
- issue: Sensul substantivizat al lui δικαίων
  choice: celor drepți
  alternative: celor neprihăniți / oamenilor drepți
  rationale: „Celor drepți” este concis, natural și păstrează deschisă referirea la oamenii credincioși și integri ai trecutului lui Israel, fără a introduce o explicație doctrinară suplimentară.
- issue: Forța formulei Οὐαὶ ὑμῖν
  choice: Vai de voi
  alternative: Nenorocire vouă / Vai vouă
  rationale: Formula aleasă păstrează atât lamentul, cât și denunțul profetic de judecată; „Vai vouă” ar fi mai arhaizant, iar „Nenorocire vouă” mai rigid.
translation_notes:
  register: Română standard modernă, cu ton solemn și profetic. „Cărturari”, „farisei” și „cei drepți” păstrează vocabularul biblic consacrat fără arhaisme sintactice. Punctuația leagă direct motivul introdus prin „pentru că” de formula „Vai de voi” și încheie enunțul ca exclamație.
