  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: δεσμεύουσιν ⸀δὲ φορτία ⸀βαρέα καὶ ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων, ⸂αὐτοὶ δὲ τῷ⸃ δακτύλῳ αὐτῶν οὐ θέλουσιν κινῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/004.yaml
  text: They tie up heavy burdens and lay them on the shoulders of men[a], but they themselves are unwilling to move them with their finger.
translation:
  language: ro
  text: Ei leagă poveri grele și le pun pe umerii oamenilor, dar ei înșiși nu vor să le miște nici cu un deget.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσμεύουσιν
  choice: leagă
  rationale: Redă direct imaginea legării sau strângerii poverilor și este firesc în româna actuală.
- source_word: φορτία βαρέα
  choice: poveri grele
  rationale: Păstrează atât imaginea concretă a unei greutăți purtate, cât și forța metaforică a unor cerințe apăsătoare.
- source_word: ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων
  choice: le pun pe umerii oamenilor
  rationale: Păstrează imaginea corporală concretă din greacă; „oamenilor” exprimă natural sensul generic al lui ἀνθρώπων fără a necesita o notă explicativă.
- source_word: αὐτοὶ δὲ
  choice: dar ei înșiși
  rationale: Pronumele întărit păstrează contrastul emfatic dintre ceea ce le impun altora și ceea ce refuză ei să facă.
- source_word: τῷ δακτύλῳ αὐτῶν
  choice: nici cu un deget
  rationale: Formularea românească idiomatică exprimă efortul minim și păstrează imaginea singularului grecesc, iar „nici” face explicită forța contextuală a refuzului total.
- source_word: οὐ θέλουσιν κινῆσαι αὐτά
  choice: nu vor să le miște
  rationale: Redă clar caracterul voit al refuzului exprimat de θέλουσιν și sensul direct al lui κινῆσαι, fără a interpreta verbul ca „a ridica” sau „a purta”.
theological_decisions:
- issue: Identitatea și natura poverilor
  choice: Păstrarea imaginii neexplicate „poveri grele”
  alternative: Explicitarea poverilor drept reguli religioase, cerințe legale sau obligații apăsătoare
  rationale: Versetul folosește metafora poverilor fără a-i preciza aici referentul. Traducerea păstrează deschiderea și tensiunea imaginii, fără a introduce o interpretare doctrinară mai îngustă.
translation_notes:
  register: Română standard modernă, clară și demnă. Construcția este naturală pentru cititorul obișnuit, păstrând paralelismul, contrastul emfatic și imaginea concretă a textului grec.
