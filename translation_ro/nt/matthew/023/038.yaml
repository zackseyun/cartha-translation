  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ὑμῶν ⸀ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/038.yaml
  text: Look[a], your house is left to you desolate.
translation:
  language: ro
  text: Iată, casa voastră[a] vă este lăsată pustie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „templul vostru”; expresia „casa voastră” se poate referi în mod special la templu, deși formularea grecească are un sens mai larg.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Iată
  rationale: „Iată” este o formulă românească firească și demnă pentru introducerea unei declarații solemne, păstrând funcția de atragere a atenției.
- source_word: ἀφίεται
  choice: este lăsată
  rationale: Redă prezentul pasiv fără a preciza agentul și fără a accentua interpretativ sensul mai puternic de „abandonată”.
- source_word: ὑμῖν
  choice: vă
  rationale: Dativul este păstrat natural în construcția românească „vă este lăsată”, cu sensul că locuința le rămâne lor.
- source_word: ὁ οἶκος ὑμῶν
  choice: casa voastră
  rationale: Păstrează formularea largă și metaforică a grecei, fără a o restrânge în textul principal la templu, Ierusalim sau popor.
- source_word: ἔρημος
  choice: pustie
  rationale: În acest context profetic, „pustie” exprimă atât părăsirea, cât și starea de devastare și corespunde firesc substantivului „casa”.
theological_decisions:
- issue: Referentul expresiei „casa voastră”
  choice: Expresia este păstrată literal și larg ca „casa voastră”.
  alternative: „templul vostru”, „Ierusalimul” sau „casa lui Israel”
  rationale: Contextul poate indica în special templul și Ierusalimul, dar greaca nu restrânge explicit referentul. Traducerea păstrează astfel ambiguitatea și forța profetică.
- issue: Agentul acțiunii din pasivul ἀφίεται
  choice: 'Agentul rămâne neexprimat: „vă este lăsată”.'
  alternative: „Dumnezeu vă lasă casa” sau „casa vă este abandonată”
  rationale: Textul grecesc folosește pasivul și nu numește agentul; explicitarea lui Dumnezeu ori intensificarea prin „abandonată” ar interpreta dincolo de formularea sursă.
translation_notes:
  register: Română standard modernă, într-un registru solemn, limpede și potrivit textului profetic. „Iată” și „pustie” păstrează demnitatea tradiției biblice fără a face versetul greu de înțeles.
