id: MAT.23.18
reference: Matthew 23:18
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καί· Ὃς ⸀ἂν ὀμόσῃ ἐν τῷ θυσιαστηρίῳ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ δώρῳ τῷ ἐπάνω αὐτοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/018.yaml
  text: And[a], ‘Whoever swears by the altar, it is nothing[b]; but whoever swears by the gift on top of it is obligated.’
translation:
  language: ro
  text: 'Și: „Oricine jură pe altar, jurământul lui nu are nicio valoare[a]; dar oricine jură pe darul[b] aflat pe el este obligat.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Adică, potrivit învățăturii pe care Isus o condamnă, un jurământ făcut pe altar „nu are nicio valoare”, pe când unul făcut pe darul de pe altar este considerat obligatoriu.
    reason: cultural_note
  - marker: b
    text: Sau „jertfa”. Cuvântul grecesc poate desemna un dar adus lui Dumnezeu la templu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: Și
  rationale: Continuă seria învățăturilor citate și condamnate de Isus; conjuncția simplă păstrează cursul discursului.
- source_word: Ὃς ἂν ... ὀμόσῃ / ὃς δ’ ἂν ... ὀμόσῃ
  choice: Oricine jură ... dar oricine jură
  rationale: Construcția cu ὅς, ἄν și conjunctivul aorist exprimă o situație generală nedefinită; formularea românească redă firesc această valoare generică.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: pe altar
  rationale: În contextul jurământului, ἐν indică lucrul invocat; în română, expresia idiomatică este „a jura pe” ceva.
- source_word: θυσιαστήριον
  choice: altar
  rationale: Este echivalentul standard și precis pentru altarul de jertfă din contextul templului.
- source_word: οὐδέν ἐστιν
  choice: aceasta nu înseamnă nimic
  rationale: Redă sensul afirmației că un asemenea jurământ nu are valoare sau putere obligatorie, într-o română actuală și limpede.
- source_word: ἐν τῷ δώρῳ
  choice: pe darul
  rationale: δῶρον denumește aici darul adus lui Dumnezeu; „dar” păstrează echivalentul lexical direct, iar nota explică sensul cultic posibil.
- source_word: τῷ ἐπάνω αὐτοῦ
  choice: aflat pe el
  rationale: Redă poziția darului pe altar și clarifică în mod natural referentul pronumelui.
- source_word: ὀφείλει
  choice: este obligat
  rationale: Păstrează forța juridico-morală a verbului și, asemenea grecei, nu precizează obiectul obligației.
theological_decisions:
- issue: Obiectul subînțeles al obligației din formula de jurământ
  choice: „este obligat”, fără completarea unui obiect explicit
  alternative: „este ținut de jurământ” sau „este obligat să-l împlinească”
  rationale: Textul grec lasă obiectul neexprimat. Contextul arată că este vorba despre obligația creată de jurământ, dar traducerea nu explicitează în text ceea ce sursa păstrează implicit.
translation_notes:
  register: Română standard modernă, cu formulare demnă și accesibilă. Ghilimelele marchează învățătura citată de Isus. Expresia „a jura pe” este idiomatică în română, iar „este obligat” păstrează concizia și obiectul neexprimat din greacă.
