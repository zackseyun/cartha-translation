id: MAT.23.9
reference: Matthew 23:9
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ πατέρα μὴ καλέσητε ὑμῶν ἐπὶ τῆς γῆς, εἷς γάρ ἐστιν ⸂ὑμῶν ὁ πατὴρ⸃ ὁ ⸀οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/009.yaml
  text: And call no man on earth your father[a], for one is your Father[b], the heavenly One.
translation:
  language: ro
  text: Și să nu numiți pe nimeni de pe pământ tatăl vostru[a], căci unul singur este Tatăl vostru, Cel ceresc[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Și să nu numiți pe nimeni de pe pământ «tată».”'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „Tatăl ceresc”; ori: „Tatăl vostru, care este în cer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα μὴ καλέσητε ὑμῶν
  choice: să nu numiți pe nimeni... tatăl vostru
  rationale: Redă interdicția exprimată prin μή cu aoristul conjunctiv și păstrează paralela dintre titlul „tată” și „Tatăl vostru”. „Pe nimeni” exprimă firesc în română obiectul nedefinit subînțeles, fără a introduce un substantiv masculin absent din greacă.
- source_word: ἐπὶ τῆς γῆς
  choice: de pe pământ
  rationale: Formulare românească naturală pentru sfera oamenilor aflați pe pământ, în contrast cu Tatăl ceresc.
- source_word: εἷς
  choice: unul singur
  rationale: În română, „unul singur” exprimă limpede forța exclusivă a numeralului în acest context, fără a schimba referentul.
- source_word: ὑμῶν ὁ πατήρ
  choice: Tatăl vostru
  rationale: Păstrează relația personală exprimată de genitivul ὑμῶν și articolul cu πατήρ.
- source_word: ὁ οὐράνιος
  choice: Cel ceresc
  rationale: Redă adjectivul articulat folosit substantival și păstrează formularea marcată a grecei, fără a o transforma nejustificat în propoziția „care este în cer”.
theological_decisions:
- issue: Întinderea interdicției lui Isus
  choice: Păstrarea interdicției directe, fără o explicație inserată în text care să-i limiteze sensul la un anumit titlu spiritual.
  alternative: Parafrazarea ca interdicție explicită doar a acordării unei autorități spirituale supreme sau, dimpotrivă, ca interdicție absolută a oricărei întrebuințări omenești a cuvântului „tată”.
  rationale: Greaca formulează porunca tranșant, dar versetul nu explică aici raportarea ei la paternitatea biologică ori socială. Traducerea păstrează această tensiune și lasă contextul să-i determine aplicarea.
- issue: Sensul lui ὁ οὐράνιος
  choice: Cel ceresc
  alternative: Tatăl ceresc / Cel care este în cer
  rationale: Alegerea păstrează valoarea substantivală a adjectivului și nu decide dacă expresia trebuie înțeleasă strict adjectival sau ca echivalent al unei propoziții locative.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Construcția „să nu numiți pe nimeni” este firească, iar majuscula la „Tatăl” și „Cel” indică referirea la Dumnezeu. Marcajele [a] și [b] apar în text la locurile corespunzătoare.
