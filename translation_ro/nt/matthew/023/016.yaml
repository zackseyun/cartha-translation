language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, ὁδηγοὶ τυφλοὶ οἱ λέγοντες· Ὃς ἂν ὀμόσῃ ἐν τῷ ναῷ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ χρυσῷ τοῦ ναοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/016.yaml
  text: Woe to you[a], blind guides, who say, ‘Whoever swears by the temple, it is nothing[b]; but whoever swears by the gold of the temple is bound.’
translation:
  language: ro
  text: 'Vai de voi, călăuze oarbe, care spuneți: «Dacă cineva jură pe Templu, nu înseamnă nimic[a]; dar dacă jură pe aurul Templului, este obligat[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: „nu este nimic”, adică un asemenea jurământ este considerat neobligatoriu.'
    reason: Clarifică expresia grecească eliptică οὐδέν ἐστιν.
  - marker: b
    text: 'Literal: „este dator” sau „este obligat”; obiectul obligației este subînțeles din context.'
    reason: Semnalează elipsa verbului ὀφείλει, fără a introduce în text un obiect explicit al obligației.
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: Vai de voi
  rationale: Redă formula profetică de condamnare într-o expresie românească consacrată, păstrând forța solemnă a enunțului.
- source_word: ὁδηγοὶ τυφλοὶ
  choice: călăuze oarbe
  rationale: Păstrează direct metafora celor care îi îndrumă pe alții, deși ei înșiși nu văd.
- source_word: οἱ λέγοντες
  choice: care spuneți
  rationale: Participiul articulat este redat firesc printr-o propoziție relativă, iar persoana a doua menține adresarea directă din «voi».
- source_word: Ὃς ἂν ὀμόσῃ
  choice: Dacă cineva jură
  rationale: Construcția relativă nedefinită cu ἄν și conjunctiv exprimă un caz general; această formulare este naturală și exactă în română.
- source_word: ἐν τῷ ναῷ
  choice: pe Templu
  rationale: Deși ἐν are sensul de bază «în», aici introduce obiectul invocat în formula jurământului; româna idiomatică cere «a jura pe».
- source_word: οὐδέν ἐστιν
  choice: nu înseamnă nimic
  rationale: Redă clar elipsa grecească «nu este nimic», în context sensul fiind că jurământul este socotit lipsit de efect obligatoriu.
- source_word: χρυσῷ τοῦ ναοῦ
  choice: aurul Templului
  rationale: Păstrează contrastul precis dintre sanctuar și aurul care îi aparține.
- source_word: ὀφείλει
  choice: este dator să-și țină jurământul
  rationale: Verbul exprimă o obligație sau datorie; completarea explicitează obiectul subînțeles de context și produce o formulare românească limpede.
theological_decisions:
- issue: Caracterul eliptic al obligației asociate jurământului
  choice: Prima afirmație este redată «nu înseamnă nimic», iar ὀφείλει este explicitat prin «este dator să-și țină jurământul».
  alternative: 'O redare mai formală ar fi: «nu este nimic ... este dator», lăsând ambele elipse neexplicate.'
  rationale: Contextul critică distincțiile cazuistice dintre jurăminte considerate neobligatorii și obligatorii. Explicitarea sensului contextual clarifică opoziția fără a introduce o doctrină suplimentară.
- issue: Valoarea lui ἐν în formula jurământului
  choice: «jură pe Templu» și «jură pe aurul Templului»
  alternative: «jură în Templu» și «jură în aurul Templului»
  rationale: În context, prepoziția marchează lucrul invocat în jurământ, nu locul în care acesta este rostit; traducerea idiomatică românească păstrează sensul intenționat.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. «Templu» este scris cu majusculă pentru a indica sanctuarul din Ierusalim. Formularea păstrează tonul sever al denunțului și face inteligibilă opoziția juridico-morală dintre cele două jurăminte.
