  text: ὁδηγοὶ τυφλοί, ⸀οἱ διϋλίζοντες τὸν κώνωπα τὴν δὲ κάμηλον καταπίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/024.yaml
  text: Blind guides[a], straining out the gnat but swallowing the camel!
translation:
  language: ro
  text: Călăuze oarbe, care strecurați țânțarul, dar înghițiți cămila!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁδηγοὶ
  choice: călăuze
  rationale: Redă direct rolul celor care îi îndrumă pe alții și păstrează metafora vie din context.
- source_word: τυφλοί
  choice: oarbe
  rationale: Păstrează imaginea metaforică și forța mustrării; acordul este cu substantivul feminin „călăuze”.
- source_word: διϋλίζοντες
  choice: care strecurați
  rationale: Verbul desemnează filtrarea unui lichid pentru îndepărtarea unei impurități; „a strecura” este termenul românesc firesc și concret.
- source_word: τὸν κώνωπα
  choice: țânțarul
  rationale: „Țânțar” este echivalentul modern și ușor de înțeles pentru mica insectă avută în vedere, iar forma articulată păstrează formularea proverbială.
- source_word: τὴν δὲ κάμηλον
  choice: dar ... cămila
  rationale: „Dar” redă contrastul marcat de δέ, iar „cămila” păstrează hiperbola și disproporția voită.
- source_word: καταπίνοντες
  choice: înghițiți
  rationale: Redă simplu și viu acțiunea, fără a introduce o nuanță colocvială suplimentară.
theological_decisions:
- issue: Forța metaforică a imaginii impurității rituale
  choice: Păstrarea imaginii concrete a strecurării țânțarului și a înghițirii cămilei.
  alternative: Parafrazarea ca preocupare pentru greșeli mici concomitent cu tolerarea celor mari.
  rationale: Textul își produce efectul prin contrastul absurd dintre două animale necurate, unul minuscul și celălalt foarte mare. Imaginea trebuie păstrată fără a transforma traducerea într-o explicație.
translation_notes:
  register: 'Română standard modernă, concisă și demnă. Vocativul și persoana a doua plural reproduc adresarea directă și mustrarea energică. Nu este necesară o notă lexicală: „a strecura” exprimă firesc în română filtrarea lichidului pentru a scoate impurități.'
