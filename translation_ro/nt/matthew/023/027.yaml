id: MAT.23.27
reference: Matthew 23:27
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ⸀παρομοιάζετε τάφοις κεκονιαμένοις, οἵτινες ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ γέμουσιν ὀστέων νεκρῶν καὶ πάσης ἀκαθαρσίας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/027.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you are like whitewashed tombs, which outwardly appear beautiful[b], but inwardly are full of dead people's bones and every kind of uncleanness.
translation:
  language: ro
  text: Vai de voi, cărturari și farisei ipocriți! Căci semănați cu niște morminte văruite[a], care pe dinafară par frumoase, dar pe dinăuntru sunt pline de oasele morților și de orice necurăție[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „morminte acoperite cu var”.'
    reason: Alternativă lexicală ce explicitează sensul participiului κεκονιαμένοις.
  - marker: b
    text: În acest context, „necurăția” poate cuprinde atât impuritatea rituală, cât și corupția morală.
    reason: Notă culturală și semantică menită să păstreze amploarea termenului ἀκαθαρσία.
lexical_decisions:
- source_word: Οὐαὶ
  choice: Vai de voi
  rationale: Redă formula profetică de denunț și judecată într-o expresie românească consacrată, păstrând forța adresării directe.
- source_word: γραμματεῖς
  choice: cărturari
  rationale: Denumirea tradițională și exactă în română pentru specialiștii iudei în Scriptură și Lege; evită explicarea excesivă prin „învățători ai Legii”.
- source_word: Φαρισαῖοι
  choice: farisei
  rationale: Forma românească standard a numelui grupării.
- source_word: ὑποκριταί
  choice: ipocriți
  rationale: În context desemnează prefăcătoria moral-religioasă și păstrează tonul direct al mustrării.
- source_word: παρομοιάζετε
  choice: semănați cu
  rationale: Redare idiomatică a comparației directe; „sunteți asemenea” ar fi mai rigid în româna actuală.
- source_word: τάφοις κεκονιαμένοις
  choice: morminte văruite
  rationale: Păstrează imaginea locurilor de îngropare acoperite cu var și este concis, natural și recognoscibil în română.
- source_word: ἔξωθεν μὲν ... ἔσωθεν δὲ
  choice: pe dinafară ... dar pe dinăuntru
  rationale: Redă clar și ritmic opoziția dintre aparența exterioară și realitatea interioară.
- source_word: φαίνονται ὡραῖοι
  choice: par frumoase
  rationale: Păstrează accentul asupra aparenței vizibile, nu asupra unei frumuseți reale.
- source_word: γέμουσιν
  choice: sunt pline de
  rationale: Echivalent românesc firesc, la timpul prezent, pentru ideea de a fi plin de ceva.
- source_word: ὀστέων νεκρῶν
  choice: oasele morților
  rationale: Redare naturală și precisă a construcției genitivale, evitând formularea ambiguă „oase moarte”.
- source_word: πάσης ἀκαθαρσίας
  choice: orice necurăție
  rationale: Păstrează caracterul cuprinzător al expresiei grecești și nu limitează sensul la o singură categorie de impuritate.
theological_decisions:
- issue: Sensul lui ἀκαθαρσία în metaforă
  choice: necurăție
  alternative: impuritate rituală; corupție morală
  rationale: Imaginea mormintelor evocă impuritatea rituală în contextul iudaic, iar mustrarea lui Isus indică și corupția lăuntrică. Termenul larg „necurăție” păstrează ambele rezonanțe fără a elimina tensiunea.
translation_notes:
  register: Română standard modernă, demnă și directă. Formularea păstrează paralelismul exterior–interior și forța profetică a mustrării, fără arhaisme inutile.
source_grounding:
  english_pob_role: consult_only
