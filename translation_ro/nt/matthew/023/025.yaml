id: MAT.23.25
reference: Matthew 23:25
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι καθαρίζετε τὸ ἔξωθεν τοῦ ποτηρίου καὶ τῆς παροψίδος, ἔσωθεν δὲ γέμουσιν ἐξ ἁρπαγῆς καὶ ⸀ἀκρασίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/025.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence.
translation:
  language: ro
  text: Vai de voi, cărturari și farisei ipocriți! Căci curățați partea din afară a paharului și a farfuriei, dar pe dinăuntru ele sunt pline de lăcomie și necumpătare.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Termenii grecești pot avea și sensurile mai tari de „jaf/stoarcere” și „lipsă de stăpânire de sine”.
    reason: Păstrează amplitudinea semantică a lui ἁρπαγή și ἀκρασία, inclusiv ideea dobândirii prin exploatare și a excesului nestăpânit.
lexical_decisions:
- source_word: Οὐαὶ
  choice: Vai
  rationale: Păstrează formula profetică de denunțare și gravitatea exclamației grecești.
- source_word: γραμματεῖς
  choice: cărturari
  rationale: Echivalentul românesc consacrat și inteligibil în contextul Evangheliilor, fără parafraza mai interpretativă „învățători ai Legii”.
- source_word: Φαρισαῖοι
  choice: farisei
  rationale: Denumirea standard în română pentru această grupare.
- source_word: ὑποκριταί
  choice: ipocriți
  rationale: Redă direct prefăcătoria moral-religioasă denunțată în context.
- source_word: καθαρίζετε
  choice: curățați
  rationale: Formulare firească în româna actuală, care păstrează valoarea prezentului activ.
- source_word: τὸ ἔξωθεν
  choice: partea din afară
  rationale: Păstrează explicit contrastul spațial cu interiorul și se leagă natural de ambele vase.
- source_word: ποτηρίου
  choice: paharului
  rationale: Echivalent lexical direct și curent.
- source_word: παροψίδος
  choice: farfuriei
  rationale: Redă firesc un vas de masă în româna modernă; termenul grec nu impune aici o formă foarte precisă a vasului.
- source_word: ἔσωθεν
  choice: pe dinăuntru
  rationale: Formulare idiomatică ce menține contrastul cu „partea din afară”.
- source_word: γέμουσιν
  choice: ele sunt pline
  rationale: Păstrează pluralul verbului grec și referirea gramaticală la pahar și farfurie, fără a explicita metafora ca referire la inimile conducătorilor.
- source_word: ἁρπαγῆς
  choice: lăcomie
  rationale: În contextul moral și metaforic, exprimă pornirea acaparatoare; nota păstrează sensurile mai tari de jaf și stoarcere.
- source_word: ἀκρασίας
  choice: necumpătare
  rationale: Redă lipsa stăpânirii de sine și excesul nedisciplinat într-un registru demn, dar accesibil.
theological_decisions:
- issue: Referentul metaforic al necurăției interioare
  choice: 'Imaginea rămâne la nivelul paharului și al farfuriei: „ele sunt pline”.'
  alternative: „dar pe dinăuntru voi sunteți plini de lăcomie și necumpătare”
  rationale: Verbul grec este la plural și continuă gramatical imaginea celor două vase. Deși aplicarea la cărturari și farisei este evidentă, traducerea nu introduce explicit „voi” sau „inimile voastre”, formulări absente din această propoziție.
translation_notes:
  register: Română standard modernă, cu ton solemn și direct. „Cărturari”, „farisei” și „Vai de voi” păstrează vocabularul biblic bine cunoscut, iar sintaxa rămâne clară pentru cititorul contemporan.
