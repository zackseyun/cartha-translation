  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ⸀τυφλοί, τί γὰρ μεῖζον, τὸ δῶρον ἢ τὸ θυσιαστήριον τὸ ἁγιάζον τὸ δῶρον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/019.yaml
  text: Blind men[a], for which is greater[b], the gift or the altar that sanctifies the gift?
translation:
  language: ro
  text: 'Orbilor! Căci care este mai mare: darul[a] sau altarul care sfințește[b] darul?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „ofranda”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „face sfânt”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοί
  choice: Orbilor!
  rationale: Adjectiv la vocativ plural, folosit substantival ca mustrare directă. Forma românească păstrează adresarea personală fără a adăuga „nebunilor”, cuvânt care nu apare aici în textul grecesc furnizat.
- source_word: τί γὰρ μεῖζον
  choice: Căci care este mai mare
  rationale: „Care” este firesc în română când se compară două elemente explicit menționate, iar „căci” păstrează valoarea explicativă a lui γάρ. „Mai mare” redă direct comparativul μεῖζον fără interpretarea suplimentară „mai important”.
- source_word: τὸ δῶρον
  choice: darul
  rationale: Redă sensul de bază al lui δῶρον și păstrează formularea concretă a textului; în contextul templului, termenul poate desemna o ofrandă, alternativă indicată în notă.
- source_word: θυσιαστήριον
  choice: altarul
  rationale: Echivalentul românesc consacrat și clar pentru termenul cultic θυσιαστήριον.
- source_word: τὸ ἁγιάζον
  choice: care sfințește
  rationale: Participiul prezent este redat printr-o propoziție relativă firească în română. „Sfințește” păstrează atât sensul de a face sfânt, cât și registrul cultic și teologic al verbului ἁγιάζω.
theological_decisions:
- issue: Limbajul cultic al lui ἁγιάζω privind relația dintre altar și dar
  choice: altarul care sfințește darul
  alternative: altarul care face sfânt darul / altarul care consacră darul
  rationale: Formularea păstrează afirmația că altarul conferă sfințenie darului și nu reduce argumentul la o simplă validare ceremonială. „Sfințește” este totodată natural și precis în română.
translation_notes:
  register: Română standard modernă, cu ton direct și demn. Vocativul „Orbilor!” păstrează forța mustrării, iar vocabularul „altar”, „dar” și „sfințește” menține registrul cultic fără a deveni arhaic. Marcajele notelor sunt așezate lângă termenii pe care îi explică.
