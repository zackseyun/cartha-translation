id: MAT.23.34
reference: Matthew 23:34
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἰδοὺ ἐγὼ ἀποστέλλω πρὸς ὑμᾶς προφήτας καὶ σοφοὺς καὶ γραμματεῖς· ⸀ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε, καὶ ἐξ αὐτῶν μαστιγώσετε ἐν ταῖς συναγωγαῖς ὑμῶν καὶ διώξετε ἀπὸ πόλεως εἰς πόλιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/034.yaml
  text: Therefore, look, I am sending to you prophets and wise men and scribes. Some of them you will kill and crucify, and some of them you will flog in your synagogues and persecute from city to city.
translation:
  language: ro
  text: De aceea, iată, eu vă trimit profeți, înțelepți și cărturari. Pe unii dintre ei îi veți omorî și îi veți răstigni, iar pe alții îi veți biciui în sinagogile voastre și îi veți persecuta din cetate în cetate.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: iată
  rationale: Păstrează marcatorul discursiv emfatic și solemn al textului grec, într-o formă românească firească.
- source_word: γραμματεῖς
  choice: cărturari
  rationale: Redă rolul de cunoscători și învățători ai Scripturilor, nu simplul sens modern de scrib/copist.
- source_word: μαστιγώσετε
  choice: îi veți biciui
  rationale: Exprimă direct pedeapsa corporală indicată de verbul grec.
- source_word: διώξετε
  choice: îi veți persecuta
  rationale: În context, verbul descrie urmărirea ostilă și repetată a trimișilor dintr-o cetate în alta.
- source_word: ἀπὸ πόλεως εἰς πόλιν
  choice: din cetate în cetate
  rationale: Păstrează mișcarea distributivă a expresiei grecești și registrul biblic demn.
theological_decisions:
- issue: Afirmația lui Isus «eu vă trimit»
  choice: eu vă trimit
  alternative: vor fi trimiși la voi
  rationale: Păstrează explicit subiectul și prezentul grecesc ἐγὼ ἀποστέλλω, fără a diminua revendicarea autorității vorbitorului.
- issue: Distribuirea acțiunilor asupra trimișilor
  choice: Pe unii dintre ei... iar pe alții...
  alternative: Dintre ei veți omorî și răstigni, și dintre ei veți biciui...
  rationale: Redă idiomatic repetarea lui ἐξ αὐτῶν fără a afirma rigid că grupurile sunt neapărat complet distincte.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează emfaza lui «iată», terminologia istoric-biblică «cărturari» și paralelismul amenințător al enunțului.
