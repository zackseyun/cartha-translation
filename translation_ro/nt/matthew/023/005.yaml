id: MAT.23.5
reference: Matthew 23:5
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις· πλατύνουσι ⸀γὰρ τὰ φυλακτήρια αὐτῶν καὶ μεγαλύνουσι τὰ ⸀κράσπεδα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/005.yaml
  text: But they do all their works to be seen by people[b][a], for they widen their phylacteries and enlarge their tassels.
translation:
  language: ro
  text: Dar toate faptele lor le fac ca să fie văzuți de oameni; căci își lățesc filacterele[a] și își măresc ciucurii[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „cutiuțele cu texte sacre”. Filacterele erau mici cutii din piele care conțineau pasaje din Scriptură și erau purtate de unii evrei în ascultare de texte precum Deuteronomul 6:8.
    reason: cultural_note
  - marker: b
    text: Sau „franjurii”. Compară Numeri 15:38–39, despre ciucurii purtați la veșminte.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ τὰ ἔργα αὐτῶν
  choice: Dar toate faptele lor
  rationale: „Dar” redă contrastul marcat de δὲ, iar „toate faptele lor” exprimă firesc totalitatea indicată de πάντα împreună cu ἔργα.
- source_word: ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις
  choice: le fac ca să fie văzuți de oameni
  rationale: Construcția cu πρὸς τό și infinitivul exprimă scopul. Formularea românească păstrează atât intenția, cât și sensul pasiv al lui θεαθῆναι; „oameni” are aici referință umană generală.
- source_word: πλατύνουσι
  choice: își lățesc
  rationale: Verbul înseamnă a face mai lat; pronumele reflexiv posesiv redă natural în română faptul că obiectele sunt ale lor.
- source_word: φυλακτήρια
  choice: filacterele
  rationale: Este termenul românesc precis pentru micile cutii cu texte scripturale purtate în practica iudaică; nota explică termenul cultural posibil nefamiliar.
- source_word: μεγαλύνουσι
  choice: își măresc
  rationale: Redă direct ideea de a face mai mare, fără a preciza nejustificat dacă este vorba numai despre lungime.
- source_word: κράσπεδα
  choice: ciucurii
  rationale: În context desemnează ciucurii rituali de la veșminte, nu în mod generic marginile acestora; termenul este concret și inteligibil în româna actuală.
theological_decisions:
- issue: Redarea obiectelor religioase iudaice fără conotații polemice adăugate
  choice: „filacterele” în text, cu explicație în notă, și „ciucurii” pentru κράσπεδα
  alternative: „cutiuțele de rugăciune” și „franjurii”
  rationale: Critica privește afișarea ostentativă și motivația faptelor, nu condamnă în sine practicile asociate poruncilor Torei. Termenii preciși păstrează această distincție.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Ordinea propoziției urmează îndeaproape greaca, dar construcțiile posesive sunt adaptate idiomatic prin „își”. Marcajele notelor apar în text lângă termenii pe care îi explică.
