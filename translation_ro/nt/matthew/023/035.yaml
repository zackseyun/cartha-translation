  source_fidelity: 'Redarea urmează bine structura și sensul textului grec: finalul ὅπως este păstrat prin „pentru ca”, iar ἔλθῃ ἐφ’ ὑμᾶς prin „asupra voastră să vină”. Intervalul de la Abel la Zaharia, numele din textul grec și distincția dintre ναός („sanctuar”) și întregul complex al templului sunt redate fidel. Totuși, „tot sângele drept” nu exprimă idiomatic și suficient de limpede metonimia greacă, care se referă la sângele vărsat al oamenilor drepți.'
  naturalness: „Asupra voastră să vină” și „între sanctuar și altar” sunt firești într-un registru biblic modern. În schimb, în româna standard „sânge drept” sună nefiresc, deoarece adjectivul califică în mod propriu persoanele al căror sânge a fost vărsat. „Tot sângele celor drepți vărsat” este natural, păstrează concizia și nu introduce noțiunea distinctă de „nevinovat”.
  terminology: „Zaharia”, „Barachia”, „sanctuar” și „altar” sunt potrivite. Nota despre γῆ păstrează corect alternativa „țară”, iar nota despre identitatea lui Zaharia prezintă dificultatea istorică fără să o rezolve în traducere.
