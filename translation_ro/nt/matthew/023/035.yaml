id: MAT.23.35
reference: Matthew 23:35
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὅπως ἔλθῃ ἐφ’ ὑμᾶς πᾶν αἷμα δίκαιον ἐκχυννόμενον ἐπὶ τῆς γῆς ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου, ὃν ἐφονεύσατε μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/035.yaml
  text: so that upon you may come all the righteous blood being poured out on the earth[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
translation:
  language: ro
  text: pentru ca asupra voastră să vină tot sângele celor drepți vărsat pe pământ[a], de la sângele lui Abel cel drept până la sângele lui Zaharia, fiul lui Barachia[b], pe care l-ați ucis între sanctuar și altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „în țară”. Cuvântul grecesc poate însemna fie „pământ”, fie „țară”.
    reason: lexical_alternative
  - marker: b
    text: Identitatea lui „Zaharia, fiul lui Barachia” este disputată. Unii îl identifică cu profetul Zaharia, iar alții cu Zaharia, fiul lui Iehoiada (2 Cronici 24:20–22). Traducerea urmează textul grecesc așa cum este scris.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: pentru ca
  rationale: Introduce scopul sau rezultatul denunțului precedent și păstrează forța finală a construcției.
- source_word: ἔλθῃ ἐφ’ ὑμᾶς
  choice: asupra voastră să vină
  rationale: Păstrează subjunctivul și formularea judiciară sugerată de prepoziția ἐπί cu acuzativul.
- source_word: πᾶν αἷμα δίκαιον
  choice: tot sângele drept
  rationale: Menține singularul colectiv și caracterizarea metonimică a sângelui ca fiind al oamenilor drepți, fără a adăuga explicit „nevinovat”.
- source_word: ἐκχυννόμενον
  choice: vărsat
  rationale: Redă idiomatic în română participiul pasiv și imaginea vărsării de sânge; forma greacă poate avea o nuanță continuă, dar o redare progresivă ar fi greoaie aici.
- source_word: ἐπὶ τῆς γῆς
  choice: pe pământ
  rationale: γῆ poate desemna fie pământul în sens larg, fie țara; contextul de la Abel încoace favorizează sensul larg, iar alternativa este păstrată în nota de subsol.
- source_word: ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου
  choice: de la sângele lui Abel cel drept
  rationale: Păstrează construcția genitivală și epitetul δίκαιος într-o formulare românească firească și demnă.
- source_word: ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου
  choice: până la sângele lui Zaharia, fiul lui Barachia
  rationale: Redă clar expresia de interval ἀπό...ἕως și transliterează numele direct din forma greacă.
- source_word: ὃν ἐφονεύσατε
  choice: pe care l-ați ucis
  rationale: În context, φονεύω exprimă o ucidere culpabilă; „ați ucis” este natural și păstrează acuzația fără o intensificare lexicală inutilă.
- source_word: μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου
  choice: între sanctuar și altar
  rationale: ναός indică sanctuarul propriu-zis, nu întregul complex al templului; „sanctuar” păstrează această distincție.
theological_decisions:
- issue: Identitatea lui Zaharia, fiul lui Barachia
  choice: Numele este păstrat așa cum apare în textul grecesc, fără armonizare sau emendare.
  alternative: Identificarea fie cu profetul Zaharia, fiul lui Berechia, fie cu Zaharia, fiul lui Iehoiada, din 2 Cronici 24:20–22.
  rationale: Identificarea istorică este disputată. Traducerea trebuie să reflecte textul grecesc și să păstreze dificultatea într-o notă, nu să o rezolve tacit.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Ordinea „asupra voastră să vină” păstrează accentul juridic al grecei fără a deveni nenaturală. „Sanctuar” este folosit pentru precizia lui ναός, în opoziție cu întregul complex al templului.
