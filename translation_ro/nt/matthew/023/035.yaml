    rationale: πᾶν αἷμα δίκαιον este o metonimie pentru sângele oamenilor drepți. Reformularea „tot sângele celor drepți vărsat” redă explicit relația cerută de uzul românesc, fără a schimba referentul ori a adăuga o interpretare doctrinară.
