id: MAT.23.30
reference: Matthew 23:30
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ λέγετε· Εἰ ⸀ἤμεθα ἐν ταῖς ἡμέραις τῶν πατέρων ἡμῶν, οὐκ ἂν ⸁ἤμεθα ⸂αὐτῶν κοινωνοὶ⸃ ἐν τῷ αἵματι τῶν προφητῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/030.yaml
  text: and you say[a], ‘If we had been living in the days of our fathers[b], we would not have been partners with them in the blood of the prophets.’
translation:
  language: ro
  text: 'și spuneți: „Dacă am fi trăit în zilele strămoșilor noștri, nu am fi fost părtași cu ei la sângele profeților.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expresia poate fi redată și „părtași cu ei la vărsarea sângelui profeților”; se referă la participarea sau complicitatea la uciderea profeților.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγετε
  choice: spuneți
  rationale: Prezentul indicativ, persoana a doua plural, este redat prin adresare directă și firească în româna actuală.
- source_word: Εἰ ἤμεθα ἐν ταῖς ἡμέραις
  choice: Dacă am fi trăit în zilele
  rationale: Construcția exprimă o situație trecută contrară faptelor; „am fi trăit” redă idiomatic valoarea contextuală a imperfectului, iar „în zilele” păstrează imaginea temporală a originalului.
- source_word: τῶν πατέρων ἡμῶν
  choice: părinților noștri
  rationale: Redarea literală păstrează termenul masculin πατέρων și formularea biblică firească; în context, acesta se referă la înaintașii generației vizate.
- source_word: οὐκ ἂν ἤμεθα
  choice: nu am fi fost
  rationale: Condiționalul perfect românesc redă apodoza ireală referitoare la trecut.
- source_word: αὐτῶν κοινωνοὶ
  choice: părtași cu ei
  rationale: „Părtași” exprimă participarea comună și posibila complicitate implicate de κοινωνοί, fără a intensifica nejustificat sensul până la „complici”.
- source_word: ἐν τῷ αἵματι τῶν προφητῶν
  choice: la sângele profeților
  rationale: Formularea păstrează imaginea concretă a sângelui și exprimă în română participarea la vărsarea lui, fără a transforma explicit metafora în „uciderea profeților”.
theological_decisions:
- issue: Gradul de complicitate exprimat de κοινωνοὶ ἐν τῷ αἵματι
  choice: „părtași cu ei la sângele profeților”
  alternative: „complici cu ei la uciderea profeților” sau „părtași cu ei la vărsarea sângelui profeților”
  rationale: Textul neagă participarea la vina înaintașilor pentru moartea profeților. Redarea aleasă păstrează atât limbajul relațional al lui κοινωνοί, cât și imaginea deschisă a „sângelui”, evitând o explicitare doctrinară mai puternică decât originalul.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Părtași” păstrează o ușoară rezonanță biblică, dar rămâne inteligibil; condiționalul perfect redă clar ipoteza contrară faptelor.
