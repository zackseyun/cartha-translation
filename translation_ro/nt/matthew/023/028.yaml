id: MAT.23.28
reference: Matthew 23:28
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς ἔξωθεν μὲν φαίνεσθε τοῖς ἀνθρώποις δίκαιοι, ἔσωθεν δέ ⸂ἐστε μεστοὶ⸃ ὑποκρίσεως καὶ ἀνομίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/028.yaml
  text: In the same way[a], you also outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.
translation:
  language: ro
  text: 'Tot așa și voi: pe dinafară păreți drepți înaintea oamenilor, dar pe dinăuntru sunteți plini de ipocrizie și de fărădelege.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Tot așa
  rationale: Leagă explicit afirmația de comparația anterioară cu mormintele văruite și redă firesc valoarea comparativă.
- source_word: ἔξωθεν ... ἔσωθεν
  choice: pe dinafară ... pe dinăuntru
  rationale: Păstrează contrastul simetric dintre aparența exterioară și realitatea lăuntrică într-o română naturală.
- source_word: φαίνεσθε
  choice: păreți
  rationale: Exprimă impresia produsă asupra observatorilor, fără a afirma că dreptatea lor este reală.
- source_word: τοῖς ἀνθρώποις
  choice: înaintea oamenilor
  rationale: Redă dativul de referință, adică felul în care sunt percepuți de oameni; „oamenilor” este aici generic.
- source_word: δίκαιοι
  choice: drepți
  rationale: Termenul românesc consacrat păstrează sensul etic și religios al lui δίκαιοι.
- source_word: μεστοὶ
  choice: plini de
  rationale: Echivalent direct și idiomatic al adjectivului grecesc.
- source_word: ὑποκρίσεως
  choice: ipocrizie
  rationale: Redă duplicitatea morală și religioasă denunțată în context.
- source_word: ἀνομίας
  choice: fărădelege
  rationale: Păstrează raportarea termenului la încălcarea sau nesocotirea legii, fără a-l dilua în sensul generic de răutate.
theological_decisions:
- issue: Dacă δίκαιοι afirmă o stare morală reală sau numai o aparență în ochii oamenilor
  choice: dreptate doar aparentă, în percepția oamenilor
  alternative: dreptate morală reală
  rationale: Verbul φαίνεσθε, complementul „înaintea oamenilor” și contrastul cu starea lăuntrică arată că Isus descrie o aparență, nu confirmă o dreptate autentică.
translation_notes:
  register: Registru modern, demn și direct. Perechea „pe dinafară / pe dinăuntru” conservă paralelismul retoric, iar „fărădelege” păstrează forța biblică a lui ἀνομία fără formulări arhaice excesive.
