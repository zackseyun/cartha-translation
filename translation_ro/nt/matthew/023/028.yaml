  source_fidelity: 'Redă fidel structura și sensul grecesc: οὕτως καὶ ὑμεῖς este bine redat prin „Tot așa și voi”, iar contrastul ἔξωθεν/ἔσωθεν este păstrat clar. „Păreți drepți înaintea oamenilor” exprimă corect aparența publică indicată de φαίνεσθε τοῖς ἀνθρώποις, fără a afirma o dreptate reală. „Plini de ipocrizie și de fărădelege” redă exact μεστοὶ ὑποκρίσεως καὶ ἀνομίας.'
  naturalness: Formularea este fluentă, modernă și potrivită registrului biblic românesc. Perechea „pe dinafară / pe dinăuntru” este idiomatică și păstrează contrastul retoric al originalului. Colonul după „voi” este o punctuație românească acceptabilă pentru explicitarea comparației.
  terminology: „Drepți”, „ipocrizie” și „fărădelege” sunt termeni exacți și stabili în uzul biblic românesc. „Fărădelege” păstrează mai bine decât termeni generici ideea de ἀνομία, adică nesocotirea legii. Nu este necesară o notă pentru „oamenilor”, care funcționează natural ca termen generic în acest context.
