id: MAT.23.17
reference: Matthew 23:17
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: μωροὶ καὶ τυφλοί, τίς γὰρ μείζων ἐστίν, ὁ χρυσὸς ἢ ὁ ναὸς ὁ ⸀ἁγιάσας τὸν χρυσόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/017.yaml
  text: 'You fools and blind men, for which is greater: the gold, or the temple that sanctified the gold?'
translation:
  language: ro
  text: 'Nebuni și orbi! Căci care este mai mare: aurul sau templul[a] care a sfințit[b] aurul?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Termenul grecesc ναός poate desemna mai precis sanctuarul templului.
    reason: cultural_note
  - marker: b
    text: 'Sau: „care a făcut aurul sfânt”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωροὶ
  choice: Nebuni
  rationale: Vocativul masculin plural redă direct și apăsat mustrarea, într-o română firească, fără a introduce o insultă modernă sau argotică.
- source_word: τυφλοί
  choice: orbi
  rationale: Păstrează al doilea vocativ masculin plural și paralelismul concis al textului grec.
- source_word: τίς γὰρ μείζων ἐστίν
  choice: Căci ce este mai mare
  rationale: „Căci” păstrează funcția explicativă a lui γάρ, iar „ce este mai mare” introduce natural în română comparația explicită dintre cele două elemente.
- source_word: ὁ χρυσὸς
  choice: aurul
  rationale: Articolul hotărât indică aurul concret aflat în discuție și este păstrat în ambele apariții.
- source_word: ὁ ναὸς
  choice: templul
  rationale: „Templul” este termenul cel mai limpede pentru cititorul obișnuit; sensul mai precis de sanctuar propriu-zis este consemnat în notă.
- source_word: ὁ ἁγιάσας
  choice: care a sfințit
  rationale: 'Perfectul compus redă participiul aorist și păstrează sensul cultic: templul a conferit aurului statutul de lucru sfânt.'
- source_word: τὸν χρυσόν
  choice: aurul
  rationale: Repetarea substantivului urmează textul grec și menține paralelismul retoric.
theological_decisions:
- issue: Redarea verbului cultic ἁγιάζω în contextul templului
  choice: a sfințit
  alternative: a făcut sfânt; sfințește
  rationale: „A sfințit” păstrează registrul religios și forma aoristă fără a explica excesiv mecanismul sacralizării. Nota oferă echivalentul mai transparent „a făcut sfânt”.
translation_notes:
  register: Română standard modernă, concisă și solemnă. Mustrarea este păstrată direct, iar întrebarea retorică rămâne clară și naturală.
