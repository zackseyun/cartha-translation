source:
  edition: SBLGNT
  text: Οὐαὶ ⸀δὲ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κλείετε τὴν βασιλείαν τῶν οὐρανῶν ἔμπροσθεν τῶν ἀνθρώπων· ὑμεῖς γὰρ οὐκ εἰσέρχεσθε, οὐδὲ τοὺς εἰσερχομένους ἀφίετε ⸀εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/013.yaml
  text: But woe to you[a], scribes and Pharisees, hypocrites! For you shut the kingdom of heaven before people; for you do not enter[c][b], nor do you allow those who are entering to enter.
translation:
  language: ro
  text: Dar vai de voi, cărturari și farisei ipocriți! Căci închideți împărăția cerurilor înaintea oamenilor; fiindcă voi nu intrați și nici pe cei ce intră nu-i lăsați să intre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „nici pe cei ce încearcă să intre nu-i lăsați să intre”. Participiul grecesc îi poate desemna pe cei aflați în curs de a intra sau pe cei care caută să intre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ δὲ ὑμῖν
  choice: Dar vai de voi
  rationale: Păstrează forța denunțului profetic al lui οὐαί, iar „dar” redă tranziția marcată de δέ.
- source_word: γραμματεῖς
  choice: cărturari
  rationale: Termenul românesc consacrat în contextul Evangheliilor, mai precis istoric decât parafraza „învățători ai Legii”.
- source_word: Φαρισαῖοι ὑποκριταί
  choice: farisei ipocriți
  rationale: Redă direct denumirea grupului și acuzația de prefăcătorie religioasă.
- source_word: κλείετε
  choice: închideți
  rationale: Păstrează metafora blocării accesului la împărăție.
- source_word: τὴν βασιλείαν τῶν οὐρανῶν
  choice: împărăția cerurilor
  rationale: Redare românească naturală și formal apropiată de pluralul grecesc, păstrând expresia caracteristică lui Matei.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: înaintea oamenilor
  rationale: Păstrează imaginea unei căi închise în fața oamenilor, într-un registru demn și firesc.
- source_word: τοὺς εἰσερχομένους
  choice: pe cei ce intră
  rationale: Păstrează aspectul participiului prezent fără a decide dacă persoanele intră efectiv sau încearcă să intre.
- source_word: ἀφίετε εἰσελθεῖν
  choice: nu-i lăsați să intre
  rationale: Construcție românească naturală care redă explicit atât permisiunea refuzată, cât și infinitivul „să intre”.
theological_decisions:
- issue: Sensul expresiei βασιλεία τῶν οὐρανῶν
  choice: împărăția cerurilor
  alternative: împărăția cerului
  rationale: Pluralul reflectă forma greacă specifică lui Matei fără a introduce o deosebire doctrinară față de expresia „împărăția lui Dumnezeu”.
- issue: Valoarea participiului τοὺς εἰσερχομένους
  choice: cei ce intră
  alternative: cei ce încearcă să intre
  rationale: Textul principal păstrează formularea participială și ambiguitatea aspectuală; alternativa explicativă este consemnată în notă.
translation_notes:
  register: Română standard modernă, într-un registru demn și direct. Repetiția verbului „a intra” este păstrată deoarece reproduce accentul retoric al textului grec și rămâne firească în română.
