source:
  edition: SBLGNT
  text: πάντα οὖν ὅσα ⸀ἐὰν εἴπωσιν ὑμῖν ⸂ποιήσατε καὶ τηρεῖτε⸃, κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε, λέγουσιν γὰρ καὶ οὐ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/003.yaml
  text: Therefore[a], do and keep everything they tell you, but do not do according to their works, for they say and do not do.
translation:
  language: ro
  text: Așadar, faceți și respectați tot ce vă spun, dar nu faceți după faptele lor[a], căci ei spun și nu fac.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „nu faceți ca ei”.'
    reason: Alternativă idiomatică pentru κατὰ τὰ ἔργα αὐτῶν μὴ ποιεῖτε; textul principal păstrează substantivul „fapte” și exprimă conformitatea indicată de κατά.
lexical_decisions:
- source_word: πάντα οὖν ὅσα ἐὰν
  choice: Așadar ... tot ce
  rationale: „Tot ce” redă firesc expresia cuprinzătoare πάντα ὅσα ἐὰν, iar „așadar” păstrează valoarea inferențială a lui οὖν.
- source_word: εἴπωσιν ὑμῖν
  choice: vă spun
  rationale: Formularea redă direct verbul λέγω și caracterul general al construcției, fără a adăuga ideea mai restrânsă de instruire formală.
- source_word: ποιήσατε καὶ τηρεῖτε
  choice: faceți și păziți
  rationale: „Faceți” redă direct ποιέω, iar „păziți” păstrează verbul distinct τηρέω și sensul lui de respectare atentă, familiar în registrul biblic românesc.
- source_word: κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε
  choice: dar nu faceți după faptele lor
  rationale: „După” exprimă aici conformitatea indicată de κατά, iar „faptele” redă concret ἔργα. Repetarea lui „faceți” păstrează ecoul retoric al verbului ποιέω.
- source_word: λέγουσιν γὰρ καὶ οὐ ποιοῦσιν
  choice: căci ei spun și nu fac
  rationale: Formularea păstrează concizia și contrastul tranșant al grecei, fără să introducă obiecte care nu sunt exprimate în text.
theological_decisions:
- issue: Sfera poruncii privind ceea ce spun cărturarii și fariseii
  choice: 'Afirmația rămâne necalificată: „tot ce vă spun”.'
  alternative: „Tot ce vă învață” sau „tot ce vă spun de pe scaunul lui Moise”.
  rationale: Versetul însuși nu repetă și nu explicitează cadrul din versetul anterior. Traducerea păstrează atât amploarea formulării grecești, cât și tensiunea ei contextuală, fără a introduce o limitare interpretativă.
- issue: Repetarea verbului ποιέω
  choice: Se păstrează seria „faceți ... nu faceți ... nu fac”.
  alternative: Variarea verbelor prin „împliniți”, „nu-i imitați” și „nu practică”.
  rationale: Repetiția este o trăsătură retorică semnificativă, care scoate în evidență ruptura dintre vorbire și faptă.
translation_notes:
  register: Română standard modernă, cu ton demn și direct. „Păziți” este ușor elevat, dar este inteligibil și păstrează distincția lexicală dintre ποιέω și τηρέω. Ordinea propoziției a fost adaptată moderat pentru fluență, fără pierderea accentului cuprinzător al expresiei „tot ce”.
