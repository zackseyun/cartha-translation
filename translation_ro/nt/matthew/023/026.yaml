id: MAT.23.26
reference: Matthew 23:26
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Φαρισαῖε τυφλέ, καθάρισον πρῶτον τὸ ἐντὸς τοῦ ποτηρίου ⸂καὶ τῆς παροψίδος⸃, ἵνα γένηται καὶ τὸ ἐκτὸς ⸀αὐτοῦ καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/026.yaml
  text: Blind Pharisee[a], first clean the inside of the cup and the dish, so that its outside also may become clean.
translation:
  language: ro
  text: Fariseu orb, curăță mai întâi interiorul paharului și al farfuriei[a], pentru ca și exteriorul lui să devină curat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „platoul”, „castronul” ori „vasul”; termenul grecesc παροψίς desemnează un vas folosit la servirea mâncării.
    reason: alternativă lexicală
lexical_decisions:
- source_word: Φαρισαῖε τυφλέ
  choice: Fariseu orb
  rationale: Păstrează adresarea directă la vocativ și forța metaforei despre orbirea spirituală, fără explicații adăugate.
- source_word: καθάρισον πρῶτον
  choice: curăță mai întâi
  rationale: Imperativul exprimă o acțiune hotărâtă, iar „mai întâi” redă prioritatea logică și temporală.
- source_word: τὸ ἐντὸς
  choice: interiorul
  rationale: Redă firesc partea lăuntrică a vaselor și menține imaginea concretă.
- source_word: ποτηρίου
  choice: paharului
  rationale: Este echivalentul românesc obișnuit pentru vasul de băut desemnat de ποτήριον.
- source_word: παροψίδος
  choice: farfuriei
  rationale: Termenul desemnează un vas pentru servirea mâncării; „farfurie” este modern și ușor de înțeles, iar alternativele posibile sunt consemnate în notă.
- source_word: ἵνα γένηται
  choice: pentru ca ... să devină
  rationale: Păstrează nuanța rezultativă a lui γίνομαι, mai precis decât simplul „să fie”.
- source_word: τὸ ἐκτὸς αὐτοῦ
  choice: exteriorul lui
  rationale: Redă paralelismul cu „interiorul” și păstrează pronumele grecesc la singular; în română, forma masculină trimite gramatical la „pahar”.
- source_word: καθαρόν
  choice: curat
  rationale: Menține atât imaginea curățării vasului, cât și posibilitatea sensului moral metaforic.
theological_decisions:
- issue: Imaginea concretă a vaselor față de explicarea morală a metaforei
  choice: Păstrarea imaginii despre curățarea interiorului și exteriorului vaselor
  alternative: Explicitarea printr-o parafrază precum „curăță-ți mai întâi viața lăuntrică”
  rationale: Textul grec lasă sensul moral să lucreze prin metafora concretă; explicitarea lui în corpul versetului ar restrânge forța și deschiderea retorică a afirmației.
- issue: Referentul pronumelui singular αὐτοῦ
  choice: „exteriorul lui”, cu referire gramaticală la pahar
  alternative: „exteriorul lor”, tratând paharul și farfuria împreună
  rationale: Greaca folosește pronumele la singular neutru, compatibil în mod direct cu ποτήριον („pahar”), nu un pronume la plural. Traducerea păstrează această particularitate, chiar dacă enumerarea anterioară creează o ușoară tensiune.
translation_notes:
  register: Română standard modernă, concisă și demnă. „Interiorul” și „exteriorul” formează un paralelism limpede, iar metafora rămâne neexplicată, ca în textul grec.
