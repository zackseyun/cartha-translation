    issue: 'Construcția finală este greoaie: „faceți din el de două ori mai mult decât voi un fiu...”'
    rationale: Poziționarea lui „de două ori mai mult decât voi” înaintea substantivului produce o formulare nefirescă și dificil de procesat. O construcție comparativă românească idiomatică este necesară pentru comunicarea sensului.
