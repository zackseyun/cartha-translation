  naturalness: „Când devine prozelit” este clar, firesc și exprimă predicatul subînțeles din γένηται. „Îl faceți un fiu al Gheenei de două ori mai rău decât voi înșivă” redă natural în română comparația intensificatoare din διπλότερον ὑμῶν, păstrând „fiu al Gheenei” în text.
  terminology: „Cărturari”, „farisei”, „ipocriți”, „prozelit” și „Gheena” sunt adecvate registrului biblic modern. Nota b trebuie să ofere alternativa completă „un fiu al iadului”, nu numai „iadului”.
