id: MAT.23.15
reference: Matthew 23:15
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν ποιῆσαι ἕνα προσήλυτον, καὶ ὅταν γένηται ποιεῖτε αὐτὸν υἱὸν γεέννης διπλότερον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/015.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! Because you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
translation:
  language: ro
  text: Vai de voi, cărturari și farisei ipocriți! Căci străbateți marea și uscatul ca să faceți un singur convert[a], iar când devine prozelit, îl faceți un fiu al Gheenei de două ori mai rău decât voi înșivă[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „prozelit”, adică o persoană convertită la iudaism.
    reason: lexical_alternative
  - marker: b
    text: 'Sau „un fiu al iadului”. Grecește: „un fiu al Gheenei”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: Vai de voi
  rationale: Păstrează forța profetică de mustrare și condamnare a expresiei grecești, într-o formulare românească consacrată și firească.
- source_word: γραμματεῖς
  choice: cărturari
  rationale: Denumirea tradițională și exactă în română pentru grupul de cunoscători și interpreți ai Legii; evită extinderea interpretativă din «învățători ai Legii».
- source_word: Φαρισαῖοι
  choice: farisei
  rationale: Forma românească standard pentru numele acestei grupări iudaice.
- source_word: ὑποκριταί
  choice: ipocriți
  rationale: Redă direct și actual ideea de prefăcătorie morală și religioasă din context.
- source_word: περιάγετε
  choice: străbateți
  rationale: Exprimă deplasarea amplă și efortul susținut implicate de verb, fără rigiditatea unei redări literale precum «mergeți de jur împrejur».
- source_word: τὴν θάλασσαν καὶ τὴν ξηρὰν
  choice: marea și uscatul
  rationale: Păstrează merismul grecesc într-o formulare naturală în română.
- source_word: ποιῆσαι ἕνα προσήλυτον
  choice: ca să faceți un singur convert
  rationale: «Convert» este inteligibil cititorului modern, iar termenul mai tehnic «prozelit» și sensul său contextual sunt păstrate în nota de subsol.
- source_word: ὅταν γένηται
  choice: când devine astfel
  rationale: Redă eliptic și natural devenirea persoanei ca prozelit, fără a adăuga în text un complement absent din greacă.
- source_word: υἱὸν γεέννης
  choice: un fiu al Gheenei
  rationale: Păstrează atât termenul concret γεέννα, cu fundalul său iudaic și escatologic, cât și idiomul semitic «fiu al», fără a-l explica doctrinar în corpul textului.
- source_word: διπλότερον ὑμῶν
  choice: de două ori mai mult decât voi
  rationale: Conservă comparația explicită și ascuțită a grecei, chiar dacă expresia rămâne intenționat mai pregnantă decât o parafrază românească.
theological_decisions:
- issue: Redarea termenului γεέννα
  choice: Gheena
  alternative: iadul
  rationale: Textul grec numește Gheena, termen cu fundal istoric și escatologic iudaic. Transliterarea păstrează această specificitate, iar echivalentul familiar este oferit în notă fără a uniformiza termenii teologici.
- issue: Redarea idiomului υἱὸν γεέννης
  choice: un fiu al Gheenei
  alternative: sortit Gheenei / vrednic de iad
  rationale: Formula literală păstrează idiomul semitic și tensiunea afirmației. Alternativele explicative ar preciza sensul într-un mod pe care textul nu îl formulează explicit.
- issue: Referirea masculină singulară după προσήλυτον
  choice: din el
  alternative: din acea persoană
  rationale: Greaca folosește pronume masculin singular, iar româna poate păstra firesc această referire, determinată și de substantivul masculin «convert».
translation_notes:
  register: Registru modern, demn și direct. «Cărturari», «farisei» și «Gheena» păstrează vocabularul biblic necesar, iar notele explică termenii mai puțin transparenți. Ordinea din ultima propoziție urmărește îndeaproape comparația greacă pentru a nu dizolva idiomul sau intensitatea condamnării.
