id: MAT.23.39
reference: Matthew 23:39
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, οὐ μή με ἴδητε ἀπ’ ἄρτι ἕως ἂν εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/039.yaml
  text: For I tell you[a], from now on you will certainly not see me until you say[b], ‘Blessed is he who comes in the name of the Lord.’
translation:
  language: ro
  text: 'Căci vă spun: de acum înainte, cu siguranță nu Mă veți mai vedea până când veți spune[a]: „Binecuvântat este Cel ce vine în Numele Domnului!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trimitere la Psalmul 118:26.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Căci vă spun
  rationale: Redă firesc formula de adresare directă, iar „căci” păstrează valoarea explicativă a lui γάρ și legătura cu afirmația precedentă.
- source_word: οὐ μή με ἴδητε
  choice: cu siguranță nu Mă veți mai vedea
  rationale: Construcția οὐ μή cu conjunctivul aorist exprimă o negație emfatică; „cu siguranță nu” îi păstrează forța, iar „mai” este cerut firesc în română de contextul temporal.
- source_word: ἀπ’ ἄρτι
  choice: de acum înainte
  rationale: Exprimă limpede începutul intervalului în momentul prezent.
- source_word: ἕως ἂν εἴπητε
  choice: până când veți spune
  rationale: Păstrează limita viitoare formulată prin ἕως ἄν cu conjunctivul, fără a preciza interpretativ momentul împlinirii.
- source_word: Εὐλογημένος
  choice: Binecuvântat
  rationale: Echivalent consacrat și exact, care păstrează rezonanța citatului scripturistic.
- source_word: ὁ ἐρχόμενος
  choice: Cel ce vine
  rationale: Redă participiul articulat într-o formulare românească demnă și naturală, fără a impune o nuanță titulară suplimentară.
- source_word: ἐν ὀνόματι κυρίου
  choice: în Numele Domnului
  rationale: Păstrează structura expresiei și cadența scripturistică; „Domnul” redă κύριος.
theological_decisions:
- issue: Momentul viitoarei vederi și al rostirii binecuvântării
  choice: Textul afirmă absența până la o recunoaștere viitoare, fără a identifica evenimentul precis.
  alternative: Referire exclusivă la intrarea triumfală, la a doua venire sau la pocăința viitoare a lui Israel.
  rationale: Greaca stabilește limita prin „până când veți spune”, dar nu definește explicit cadrul istoric ori escatologic; traducerea păstrează această deschidere interpretativă.
translation_notes:
  register: Română standard modernă, clară și demnă. Majusculele reverențiale din „Mă”, „Cel” și „Numele” urmează uzul biblic românesc, fără a modifica sensul sursei.
