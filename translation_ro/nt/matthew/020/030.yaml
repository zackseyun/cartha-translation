source:
  edition: SBLGNT
  text: καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/030.yaml
  text: And behold, two blind men sitting by the road, when they heard that Jesus was passing by, cried out, saying, “Lord, have mercy on us, Son of David.”
translation:
  language: ro
  text: 'Și iată, doi orbi care stăteau așezați lângă drum, când au auzit că Isus trecea, au strigat: „Doamne, ai milă de noi, Fiul lui David!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: iată
  rationale: Păstrează funcția de atragere a atenției și vivacitatea narativă, într-o formulare consacrată și încă inteligibilă în româna actuală.
- source_word: δύο τυφλοὶ
  choice: doi orbi
  rationale: Masculinul plural desemnează aici doi bărbați concreți; formularea este exactă și firească în context.
- source_word: καθήμενοι παρὰ τὴν ὁδόν
  choice: care ședeau lângă drum
  rationale: Redă clar poziția și cadrul scenei; construcția cu propoziție relativă este naturală în română.
- source_word: ἀκούσαντες ὅτι Ἰησοῦς παράγει
  choice: când au auzit că Isus trecea pe acolo
  rationale: Participiul aorist are aici valoare temporală, iar „trecea pe acolo” redă idiomatic verbul παράγει în contextul deplasării.
- source_word: ἔκραξαν λέγοντες
  choice: au strigat
  rationale: „Au strigat” păstrează intensitatea lui κράζω; participiul redundant „zicând” poate fi absorbit firesc în introducerea vorbirii directe.
- source_word: Κύριε
  choice: Doamne
  rationale: Vocativul românesc tradițional și natural păstrează respectul și posibila greutate cristologică a adresării.
- source_word: ἐλέησον ἡμᾶς
  choice: ai milă de noi
  rationale: Este redarea românească directă și consacrată a cererii de ajutor plin de îndurare.
- source_word: υἱὸς Δαυίδ
  choice: Fiul lui David
  rationale: Păstrează forma titlului mesianic și rezonanța sa davidică, fără a-l reduce la simpla idee de descendență.
theological_decisions:
- issue: Sensul lui κύριος în adresarea directă către Isus
  choice: Doamne
  alternative: Domnule
  rationale: Alăturarea cu titlul „Fiul lui David” conferă adresării o greutate reverențioasă și mesianică. „Doamne” păstrează această deschidere semantică fără a o reduce la o formulă obișnuită de politețe.
- issue: Forța mesianică a expresiei υἱὸς Δαυίδ
  choice: Fiul lui David
  alternative: urmaș al lui David
  rationale: În Matei, expresia funcționează ca titlu mesianic; redarea literală păstrează atât legătura dinastică, cât și rezonanța regal-mesianică.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. „Iată” păstrează culoarea narativă biblică fără arhaizare excesivă; „ședeau” este folosit aici în sensul curent de poziție așezată, iar sintaxa rămâne fluentă pentru lectura publică.
