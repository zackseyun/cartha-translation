  source_fidelity: 'Textul redă corect elementele esențiale ale grecei: marcatorul narativ „iată”, cei doi bărbați orbi, poziția lor lângă drum, auzirea trecerii lui Isus, strigătul și titlurile „Doamne” și „Fiul lui David”. Totuși, „pe acolo” introduce un detaliu locativ care nu este exprimat în mod specific de παράγει; „trecea” păstrează sensul fără această adăugire.'
