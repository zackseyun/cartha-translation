source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· Τί θέλεις; λέγει αὐτῷ· Εἰπὲ ἵνα καθίσωσιν οὗτοι οἱ δύο υἱοί μου εἷς ἐκ δεξιῶν ⸀σου καὶ εἷς ἐξ εὐωνύμων σου ἐν τῇ βασιλείᾳ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/021.yaml
  text: And he said to her[a], “What do you want?” She said to him, “Command that these two sons of mine may sit, one at your right and one at your left[c][b], in your kingdom.”
translation:
  language: ro
  text: 'El i-a zis: „Ce dorești?” Ea i-a zis: „Spune ca acești doi fii ai mei să stea așezați, unul la dreapta Ta și unul la stânga Ta[a], în Împărăția Ta[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „unul de-a dreapta Ta și unul de-a stânga Ta”.'
    reason: lexical_alternative
  - marker: b
    text: Termenul tradus prin „Împărăție” poate desemna și domnia sau stăpânirea regală.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλεις
  choice: Ce dorești?
  rationale: Redă direct întrebarea despre cererea femeii; „dorești” este firesc și demn în româna modernă.
- source_word: Εἰπὲ
  choice: Spune
  rationale: Păstrează sensul lexical simplu al imperativului lui λέγω. Contextul implică o hotărâre cu autoritate, dar traducerea nu înlocuiește verbul cu interpretativul „poruncește” sau „acordă”.
- source_word: ἵνα καθίσωσιν
  choice: ca ... să stea
  rationale: Construcția românească redă natural conținutul cererii și păstrează verbul activ καθίζω fără a introduce explicit ideea de numire într-o funcție.
- source_word: οὗτοι οἱ δύο υἱοί μου
  choice: acești doi fii ai mei
  rationale: Păstrează demonstrativul οὗτοι și referirea personală accentuată prin μου.
- source_word: εἷς ἐκ δεξιῶν σου ... εἷς ἐξ εὐωνύμων σου
  choice: unul la dreapta Ta și unul la stânga Ta
  rationale: Redă idiomatic pozițiile spațiale de onoare și paralelismul expresiei grecești.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: în Împărăția Ta
  rationale: „Împărăție” este echivalentul românesc firesc și consacrat, capabil să includă atât domeniul regal, cât și exercitarea domniei.
theological_decisions:
- issue: Natura locurilor cerute în raport cu regalitatea lui Isus
  choice: Cererea este redată ca una pentru locuri de onoare la dreapta și la stânga lui Isus, în Împărăția Sa.
  alternative: Interpretarea explicită drept împărăție mesianică pământească sau drept Împărăția cerească ajunsă la împlinire.
  rationale: Textul grec nu precizează etapa ori forma Împărăției; traducerea păstrează deschisă această tensiune escatologică.
translation_notes:
  register: Română standard modernă, clară și demnă. Majusculele reverențiale pentru pronumele referitoare la Isus urmează uzul editorial românesc. Formularea păstrează simplitatea verbului grec „a spune” și nu precizează natura temporală a Împărăției.
