  yaml_path: translation/nt/matthew/020/033.yaml
  text: They said to him[a], “Lord, let our eyes be opened.”
translation:
  language: ro
  text: 'I-au spus: „Doamne[a], să ni se deschidă ochii!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „Domnule”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: Ei i-au spus
  rationale: Prezentul istoric grecesc este redat firesc prin perfectul compus în narațiunea românească; pronumele datival αὐτῷ este inclus în forma „i-au”.
- source_word: Κύριε
  choice: Doamne
  rationale: Vocativul lui κύριος este redat prin forma românească consacrată de adresare „Doamne”, care păstrează respectul și posibila recunoaștere a autorității lui Isus.
- source_word: ἵνα ἀνοιγῶσιν
  choice: să ni se deschidă
  rationale: Construcția cu ἵνα și conjunctivul pasiv exprimă aici conținutul cererii; conjunctivul românesc păstrează firesc atât valoarea volitivă, cât și sensul pasiv.
- source_word: οἱ ὀφθαλμοὶ ἡμῶν
  choice: ochii
  rationale: Posesorul de persoana întâi plural este exprimat idiomatic prin dativul posesiv „ni” din „să ni se deschidă ochii”, evitând formularea mai greoaie „ochii noștri”.
theological_decisions:
- issue: Redarea apelativului κύριος adresat lui Isus
  choice: Doamne
  alternative: Domnule
  rationale: „Doamne” este redarea firească a vocativului și păstrează deschisă tensiunea dintre adresarea respectuoasă și recunoașterea unei autorități mai profunde; „Domnule” ar restrânge sensul la politețe obișnuită.
translation_notes:
  register: Română standard modernă, demnă și directă. Formularea „să ni se deschidă ochii” este idiomatică și păstrează pasivul textului grec fără a preciza agentul.
