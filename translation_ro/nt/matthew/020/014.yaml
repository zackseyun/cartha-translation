review_pass:
  verdict: revise
  source_fidelity: Textul redă corect imperativele ἆρον și ὕπαγε, posesivul substantivizat τὸ σὸν, voința exprimată de θέλω și referentul masculin singular din τούτῳ τῷ ἐσχάτῳ. Comparativul eliptic ὡς καὶ σοί este mai limpede redat în română prin „tot atât cât ție”, care exprimă explicit egalitatea darului/plății, implicită în greacă.
  naturalness: „Acestuia din urmă” este firesc și păstrează sensul de „acest ultim [lucrător]”. „Să-i dau ... la fel ca ție” este inteligibil, dar ușor eliptic și mai puțin idiomatic decât „să-i dau ... tot atât cât ție”. Punctul după al doilea imperativ este suficient; semnul exclamării adaugă o intensitate pe care textul sursă nu o marchează.
  terminology: Nu sunt introduși termeni confesionali ori interpretativi. „Ce este al tău” păstrează deliberat caracterul general al lui τὸ σὸν, fără a-l restrânge la „plata ta”. Nu este necesară notă de subsol în română pentru acest verset.
  issues:
  - severity: low
    issue: Comparativul final este formulat oarecum neidiomatic.
    rationale: „La fel ca ție” poate funcționa, însă „tot atât cât ție” redă mai natural elipsa greacă după δοῦναι și clarifică egalitatea a ceea ce se dă, fără adaos semantic substanțial.
  - severity: low
    issue: Semnul exclamării după „du-te” intensifică replica.
    rationale: Imperativele sunt ferme, dar manuscrisele grecești vechi nu oferă această marcă de intensitate; un punct păstrează tonul direct fără amplificare editorială.
  revised_text: Ia ce este al tău și du-te. Eu însă vreau să-i dau acestuia din urmă tot atât cât ție.
