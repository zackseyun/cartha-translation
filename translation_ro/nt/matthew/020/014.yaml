revisions:
- from: Ia ce este al tău și du-te! Eu însă vreau să-i dau acestuia din urmă la fel ca ție.
  to: Ia ce este al tău și du-te. Eu însă vreau să-i dau acestuia din urmă tot atât cât ție.
  rationale: Revizuirea păstrează toate elementele semantice ale grecei și deciziile lexicale de bază ale auditului englez. Ea înlocuiește comparativul românesc mai puțin natural cu o formulare curentă care exprimă egalitatea implicată de ὡς καὶ σοί și elimină o intensificare punctuațională necerută de sursă.
  reviewer_model: gpt-5.6-terra
