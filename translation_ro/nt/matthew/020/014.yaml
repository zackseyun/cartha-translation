  text: ἆρον τὸ σὸν καὶ ὕπαγε· θέλω δὲ τούτῳ τῷ ἐσχάτῳ δοῦναι ὡς καὶ σοί·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/014.yaml
  text: Take what is yours and go[a]. But I want to give to this last man the same as to you.
translation:
  language: ro
  text: Ia ce este al tău și du-te. Eu însă vreau să-i dau acestuia din urmă tot atât cât ție.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἆρον
  choice: Ia
  rationale: Imperativul este redat direct și firesc; în context înseamnă să ia ceea ce îi aparține.
- source_word: τὸ σὸν
  choice: ce este al tău
  rationale: Păstrează formularea generală a grecei fără a introduce explicit „plata”, deși contextul este cel al plătirii lucrătorilor.
- source_word: ὕπαγε
  choice: du-te
  rationale: Redă porunca de plecare într-o română actuală și directă, fără a-i accentua inutil ostilitatea.
- source_word: θέλω δὲ
  choice: Eu însă vreau
  rationale: „Vreau” exprimă clar voința stăpânului, iar „însă” redă contrastul introdus de δέ.
- source_word: τούτῳ τῷ ἐσχάτῳ
  choice: acestuia din urmă
  rationale: Redă referința masculină singulară și sensul de „ultimul”, fără a adăuga substantivul „om”, absent din textul grec.
- source_word: δοῦναι
  choice: să-i dau
  rationale: Păstrează sensul de bază al lui δίδωμι; „să-i plătesc” ar fi posibil contextual, dar ar fi mai specific decât formularea sursă.
- source_word: ὡς καὶ σοί
  choice: la fel ca ție
  rationale: Exprimă idiomatic egalitatea dintre ceea ce primește ultimul lucrător și ceea ce a primit interlocutorul.
theological_decisions:
- issue: Redarea referentului personal masculin singular
  choice: acestuia din urmă
  alternative: acestui ultim om
  rationale: Forma românească păstrează genul masculin și referința individuală din greacă, fără să introducă substantivul „om”, care este doar implicit.
translation_notes:
  register: Formulare modernă, demnă și directă. Exclamația după „du-te” reflectă forța celor două imperative, fără vocabular arhaic sau confesional.
