  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν περὶ τρίτην ὥραν εἶδεν ἄλλους ἑστῶτας ἐν τῇ ἀγορᾷ ἀργούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/003.yaml
  text: And going out about the third hour[b][a], he saw others standing idle in the marketplace.
translation:
  language: ro
  text: Și, ieșind pe la ceasul al treilea[a], a văzut pe alții stând fără lucru[b] în piață.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „pe la nouă dimineața”. „Ceasul al treilea” reflectă numărarea orelor zilei începând de la răsăritul soarelui.
    reason: cultural_note
  - marker: b
    text: Sau „stând degeaba”. Grecescul înseamnă „inactiv” sau „ocios”; aici indică faptul că nu lucrau.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: ieșind
  rationale: Participiul aorist este redat printr-un gerunziu firesc în română, păstrând succesiunea acțiunilor fără o formulare greoaie.
- source_word: περὶ τρίτην ὥραν
  choice: cam pe la ceasul al treilea
  rationale: Păstrează modul antic de indicare a timpului și redă aproximarea lui περὶ într-o formulare românească naturală.
- source_word: εἶδεν
  choice: a văzut
  rationale: Echivalentul direct și firesc al verbului ὁράω în narațiune.
- source_word: ἄλλους
  choice: pe alții
  rationale: Adjectivul este substantivizat; formularea nu adaugă explicit «bărbați», absent din greacă.
- source_word: ἑστῶτας
  choice: stând
  rationale: 'Redă valoarea stativă a participiului perfect: persoanele se aflau în picioare/acolo.'
- source_word: ἀγορᾷ
  choice: piață
  rationale: În context, ἀγορά este spațiul public și comercial unde se puteau aduna lucrătorii; «piață» este termenul românesc curent.
- source_word: ἀργούς
  choice: fără lucru
  rationale: Redă contextual faptul că nu lucrau, fără conotația morală posibilă a lui «leneși» și fără categoria economică modernă implicată de «șomeri».
theological_decisions: []
translation_notes:
  register: Română standard modernă, clară și demnă. Este păstrată expresia temporală antică în text, cu echivalentul aproximativ modern în notă; «fără lucru» evită atât judecata morală, cât și terminologia economică modernă.
