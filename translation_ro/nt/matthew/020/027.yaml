  text: καὶ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν εἶναι πρῶτος ⸀ἔσται ὑμῶν δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/027.yaml
  text: And whoever wants to be first among you will be your servant[a].
translation:
  language: ro
  text: Și oricine vrea să fie primul între voi va fi sclavul vostru.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „robul vostru”. Termenul grecesc doulos este mai puternic decât termenul pentru „slujitor” din versetul precedent și desemnează adesea un sclav, adică o persoană aflată în robie.
    reason: alternativă lexicală și explicarea intensificării față de versetul precedent
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: oricine vrea
  rationale: Pronumele relativ cu ἄν și conjunctivul exprimă o condiție generală nedefinită; „oricine vrea” este firesc în româna actuală și păstrează sensul volitiv.
- source_word: ἐν ὑμῖν
  choice: între voi
  rationale: În contextul rangului în comunitate, formularea indică poziția în cadrul grupului, nu simpla localizare.
- source_word: εἶναι πρῶτος
  choice: să fie primul
  rationale: Redă direct aspirația către rangul cel mai înalt.
- source_word: ἔσται
  choice: va fi
  rationale: Păstrează forma de viitor a indicativului și lasă contextului forța normativă, fără a o transforma explicit în „trebuie să fie”.
- source_word: ὑμῶν
  choice: vostru
  rationale: 'Genitivul exprimă relația față de ceilalți membri ai grupului: cel ce dorește întâietatea va fi sclavul lor.'
- source_word: δοῦλος
  choice: sclav
  rationale: Termenul este mai puternic decât διάκονος din versetul precedent și evocă statutul de persoană aflată în robie; „sclav” păstrează intensificarea retorică.
theological_decisions:
- issue: Redarea lui δοῦλος în învățătura despre ucenicie
  choice: sclav
  alternative: slujitor; rob
  rationale: Afirmația răstoarnă ambiția după rang prin imaginea unei înjosiri radicale. „Sclav” păstrează contrastul cu termenul mai general pentru slujitor din versetul anterior, fără a atenua tensiunea spuselor lui Isus.
translation_notes:
  register: Română standard modernă, cu sintaxă simplă și demnă. S-a preferat „sclav” în text pentru precizia lexicală și forța contrastului, iar „rob” este consemnat în notă ca alternativă familiară registrului biblic.
