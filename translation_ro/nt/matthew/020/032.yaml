id: MAT.20.32
reference: Matthew 20:32
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ στὰς ὁ Ἰησοῦς ἐφώνησεν αὐτοὺς καὶ εἶπεν· Τί θέλετε ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/032.yaml
  text: And Jesus stopped[a], called them, and said, “What do you want me to do for you?”
translation:
  language: ro
  text: 'Isus S-a oprit, i-a chemat și le-a zis: „Ce vreți să fac pentru voi?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: S-a oprit
  rationale: Participiul aorist al lui ἵστημι indică aici oprirea lui Isus din mers; formularea este firească și păstrează succesiunea narativă.
- source_word: ἐφώνησεν
  choice: i-a chemat
  rationale: φωνέω înseamnă aici că Isus i-a chemat pe cei doi orbi; redarea este concisă și naturală, fără formalitatea excesivă a lui „i-a convocat”.
- source_word: αὐτοὺς
  choice: i-
  rationale: Pronumele acuzativ plural se referă la cei doi orbi din context și este redat prin pronumele neaccentuat cerut de construcția românească.
- source_word: Τί θέλετε
  choice: Ce vreți
  rationale: Redă direct și idiomatic întrebarea grecească, păstrând sensul de voință sau dorință al lui θέλω.
- source_word: ποιήσω
  choice: să fac
  rationale: Subjunctivul aorist dependent de θέλετε este redat natural în română prin conjunctivul „să fac”.
- source_word: ὑμῖν
  choice: pentru voi
  rationale: 'Dativul are sens benefactiv: acțiunea cerută urma să fie făcută în folosul lor.'
- source_word: ὁ Ἰησοῦς
  choice: Isus
  rationale: Numele propriu este redat în forma românească modernă stabilită; articolul grecesc nu se reproduce.
theological_decisions:
- issue: Tonul și forța întrebării lui Isus
  choice: 'Întrebare directă și personală: „Ce vreți să fac pentru voi?”'
  alternative: „Ce doriți să fac pentru voi?”
  rationale: „Vreți” păstrează sensul obișnuit al lui θέλετε și naturalețea dialogului, fără a diminua demnitatea sau implicarea personală a lui Isus.
translation_notes:
  register: Română standard modernă, clară și demnă. Forma „S-a oprit” redă idiomatic participiul circumstanțial, iar „i-a chemat” evită atât rigiditatea, cât și ambiguitatea. Nu este necesară nicio notă de subsol, deoarece alternativa mai formală nu adaugă o nuanță textuală ori semantică esențială.
