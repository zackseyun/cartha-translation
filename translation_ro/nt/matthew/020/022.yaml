  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ μέλλω ⸀πίνειν; λέγουσιν αὐτῷ· Δυνάμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/022.yaml
  text: But Jesus answered and said[a], “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to him, “We are able.”
translation:
  language: ro
  text: 'Dar Isus le-a răspuns: „Nu știți ce cereți. Puteți să beți paharul[a] pe care urmează să-l beau Eu?” Ei I-au spus: „Putem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Paharul” este o imagine biblică pentru partea rânduită cuiva, aici sugerând mai ales suferința care Îl așteaptă pe Isus.
    reason: Clarifică metafora păstrată în text, fără a o înlocui sau a-i epuiza sensul; ancora este atașată direct de „paharul”.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Dar Isus le-a răspuns
  rationale: Redă contrastul ușor marcat de δέ și formula de răspuns într-o română firească; exprimarea literală „răspunzând, a spus” ar fi greoaie și redundantă.
- source_word: Οὐκ οἴδατε
  choice: Nu știți
  rationale: Păstrează sensul direct al lui οἶδα, fără a-l interpreta mai specific drept „nu înțelegeți”.
- source_word: τί αἰτεῖσθε
  choice: ce cereți
  rationale: Este formularea românească naturală pentru cererea aflată în discuție și păstrează caracterul direct al întrebării.
- source_word: δύνασθε πιεῖν
  choice: Puteți să beți
  rationale: Exprimă limpede capacitatea vizată de δύνασθε, într-o construcție românească actuală și demnă.
- source_word: τὸ ποτήριον
  choice: paharul
  rationale: Păstrează metafora biblică din greacă, fără a o reduce în textul principal la suferință sau moarte.
- source_word: ὃ ἐγὼ μέλλω πίνειν
  choice: pe care urmează să-l beau Eu
  rationale: „Urmează să” redă orientarea viitoare a lui μέλλω; pronumele „Eu” face explicit contrastul exprimat în greacă prin ἐγώ.
- source_word: λέγουσιν αὐτῷ
  choice: Ei I-au spus
  rationale: Redă prezentul istoric grecesc prin trecut, conform narațiunii românești naturale, și păstrează destinatarul explicit.
- source_word: Δυνάμεθα
  choice: Putem
  rationale: Reia consecvent verbul din întrebare și păstrează răspunsul scurt și categoric.
theological_decisions:
- issue: Forța metaforică a „paharului”
  choice: Metafora „paharul” este păstrată în textul principal.
  alternative: „suferința prin care urmează să trec” sau „paharul suferinței pe care urmează să-l beau”
  rationale: Imaginea are rezonanțe biblice privind partea rânduită cuiva, adesea suferința, și indică aici spre ceea ce Îl așteaptă pe Isus. Explicitarea în text ar restrânge în mod interpretativ metafora.
translation_notes:
  register: Română standard modernă, concisă și demnă. Formula grecească redundantă de vorbire este naturalizată, iar metafora centrală este păstrată. Marcajul notei este așezat după verset, dar se referă la termenul „paharul”.
