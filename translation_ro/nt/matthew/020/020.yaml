source:
  edition: SBLGNT
  text: Τότε προσῆλθεν αὐτῷ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου μετὰ τῶν υἱῶν αὐτῆς προσκυνοῦσα καὶ αἰτοῦσά τι ⸀παρ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/020.yaml
  text: Then the mother of the sons of Zebedee came to him with her sons[a], bowing down and asking something from him.
translation:
  language: ro
  text: Atunci mama fiilor lui Zebedei s-a apropiat de el împreună cu fiii ei, plecându-se înaintea lui[a] și cerând ceva de la el.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „închinându-se lui”; verbul grecesc poate însemna a te pleca în semn de respect, a aduce omagiu sau a te închina, în funcție de context.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Redă firesc în româna actuală conectorul temporal care introduce următorul eveniment din succesiune.
- source_word: προσῆλθεν αὐτῷ
  choice: s-a apropiat de el
  rationale: Păstrează sensul de mișcare către o persoană al verbului προσέρχομαι și este mai precis aici decât simplul „a venit”.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: mama fiilor lui Zebedei
  rationale: Redare directă și naturală a construcției genitivale, fără a adăuga numele femeii.
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: împreună cu fiii ei
  rationale: μετά cu genitivul exprimă însoțirea; formularea este limpede și naturală.
- source_word: προσκυνοῦσα
  choice: plecându-se înaintea lui
  rationale: Exprimă gestul fizic și reverențial fără a hotărî nejustificat dacă acesta trebuie înțeles explicit drept închinare.
- source_word: καὶ αἰτοῦσά τι παρ’ αὐτοῦ
  choice: și cerându-i ceva
  rationale: Redă concis participiul αἰτοῦσα, obiectul nehotărât τι și ideea că solicitarea îi este adresată lui.
theological_decisions:
- issue: Sensul lui προσκυνοῦσα în raport cu Isus
  choice: plecându-se înaintea lui
  alternative: închinându-se lui; aducându-i omagiu
  rationale: Verbul προσκυνέω poate desemna plecarea/prosternarea reverențială, omagiul sau închinarea. Contextul imediat prezintă o cerere respectuoasă, dar nu exclude rezonanța mai puternică; textul principal păstrează sensul fizic-reverențial, iar nota menține ambiguitatea lexicală și teologică.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Sintaxa participială grecească este păstrată într-o formă firească în română, iar ambiguitatea lui προσκυνέω este semnalată prin notă.
