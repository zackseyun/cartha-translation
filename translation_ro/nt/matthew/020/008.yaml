source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης λέγει ὁ κύριος τοῦ ἀμπελῶνος τῷ ἐπιτρόπῳ αὐτοῦ· Κάλεσον τοὺς ἐργάτας καὶ ἀπόδος ⸀αὐτοῖς τὸν μισθὸν ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/008.yaml
  text: When evening came, the master of the vineyard says to his steward, ‘Call the workers and pay them their wages, beginning with the last and ending with the first.’
translation:
  language: ro
  text: 'Când s-a făcut seară, stăpânul viei îi spune administratorului său: „Cheamă-i pe lucrători și plătește-le salariul, începând cu cei din urmă și terminând cu cei dintâi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: stăpânul viei
  rationale: Redă natural relația de proprietate și autoritate din parabolă; „vie” este termenul românesc curent pentru terenul cultivat cu viță-de-vie.
- source_word: τῷ ἐπιτρόπῳ αὐτοῦ
  choice: administratorului său
  rationale: ἐπίτροπος desemnează persoana însărcinată cu administrarea bunurilor sau supravegherea activității; „administrator” este clar și actual.
- source_word: ἀπόδος αὐτοῖς τὸν μισθόν
  choice: plătește-le salariul
  rationale: ἀποδίδωμι implică achitarea a ceea ce li se datorează, iar μισθός este plata pentru munca prestată; singularul colectiv este păstrat firesc în română.
- source_word: ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων
  choice: începând cu cei din urmă și terminând cu cei dintâi
  rationale: Păstrează contrastul și ordinea expresă din greacă, într-o formulare românească limpede.
- source_word: λέγει
  choice: îi spune
  rationale: Păstrează prezentul istoric al narațiunii grecești, în acord cu sursa și cu revizuirea auditata.
theological_decisions:
- issue: Prezentul istoric λέγει
  choice: îi spune
  alternative: i-a spus
  rationale: Prezentul din textul grec este păstrat, fără normalizarea lui tacită la trecut; această schimbare de timp conferă vivacitate relatării.
- issue: Sensul lui ἔσχατοι și πρῶτοι
  choice: cei din urmă / cei dintâi
  alternative: ultimii / primii
  rationale: Formularea păstrează ecoul terminologic și tensiunea parabolică din context, fără a reduce expresiile doar la ordinea cronologică a angajării.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează prezentul istoric și paralelismul final al textului grec; nu sunt necesare note de subsol.
