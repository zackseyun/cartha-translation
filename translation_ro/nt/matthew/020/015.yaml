  text: ⸀οὐκ ἔξεστίν μοι ⸂ὃ θέλω ποιῆσαι⸃ ἐν τοῖς ἐμοῖς; ⸀ἢ ὁ ὀφθαλμός σου πονηρός ἐστιν ὅτι ἐγὼ ἀγαθός εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/015.yaml
  text: Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am good?[a]
translation:
  language: ro
  text: Nu-mi este îngăduit să fac ce vreau cu ce este al meu? Sau ochiul tău este rău pentru că eu sunt bun?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Ești invidios pentru că eu sunt bun?” Expresia „ochiul tău este rău” este un idiom care indică invidia sau nemulțumirea plină de ciudă față de binele făcut altuia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστίν
  choice: îmi este îngăduit
  rationale: Redă sensul de permisiune sau drept legitim și păstrează nuanța juridică a întrebării retorice.
- source_word: ὃ θέλω ποιῆσαι
  choice: să fac ce vreau
  rationale: Exprimă firesc în româna actuală voința personală indicată de θέλω.
- source_word: ἐν τοῖς ἐμοῖς
  choice: cu ce este al meu
  rationale: Redă idiomatic posesia și folosirea bunurilor proprii în contextul economic al parabolei.
- source_word: ὁ ὀφθαλμός σου πονηρός
  choice: ochiul tău este rău
  rationale: Păstrează imaginea literală și contrastul formulat în greacă, iar nota explică sensul idiomatic probabil.
- source_word: ἀγαθός
  choice: bun
  rationale: Păstrează sensul lexical de bază și opoziția explicită dintre «rău» și «bun», fără a restrânge termenul la «generos».
theological_decisions:
- issue: Dacă expresia ὁ ὀφθαλμός σου πονηρός trebuie interpretată direct în text
  choice: Păstrarea expresiei «ochiul tău este rău» în textul principal
  alternative: «ești invidios» sau «privești cu ciudă pentru că sunt generos»
  rationale: Formularea literală conservă imaginea sursei și tensiunea dintre ochiul rău al lucrătorului și bunătatea stăpânului; nota oferă sensul idiomatic fără a-l impune ca unică interpretare.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează paralelismul și contrastul sursei, folosind o notă pentru idiomul care poate fi neclar cititorului contemporan.
