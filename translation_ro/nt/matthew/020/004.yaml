  text: καὶ ἐκείνοις εἶπεν· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ἀμπελῶνα, καὶ ὃ ἐὰν ᾖ δίκαιον δώσω ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/004.yaml
  text: And he said to them[a], ‘You also go into the vineyard, and whatever is right I will give you.’
translation:
  language: ro
  text: 'Și le-a zis: „Duceți-vă și voi în vie, și vă voi da ceea ce va fi drept.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκείνοις εἶπεν
  choice: le-a zis
  rationale: Pronumele neaccentuat redă firesc dativul plural ἐκείνοις, al cărui referent este clar din context, iar „a zis” introduce natural vorbirea directă.
- source_word: Ὑπάγετε
  choice: Duceți-vă
  rationale: Imperativul plural exprimă porunca directă de a merge în vie; forma românească este idiomatică și păstrează forța verbului.
- source_word: καὶ ὑμεῖς
  choice: și voi
  rationale: Păstrează atât includerea, cât și accentul explicit asupra acestor lucrători, trimiși asemenea celor de mai înainte.
- source_word: ἀμπελῶνα
  choice: vie
  rationale: „Vie” este echivalentul românesc curent și precis pentru ἀμπελών.
- source_word: ὃ ἐὰν ᾖ δίκαιον
  choice: ce este drept
  rationale: Redă valoarea etică a lui δίκαιον fără a o restrânge la sens juridic ori la o apreciere subiectivă a echității.
- source_word: δώσω ὑμῖν
  choice: vă voi da
  rationale: Păstrează verbul general δίδωμι, fără a introduce explicit ideea de plată, deși aceasta este sugerată de context.
theological_decisions:
- issue: Redarea lui δίκαιον în contextul stabilirii plății
  choice: drept
  alternative: just; echitabil
  rationale: „Drept” păstrează sensul moral larg al termenului și tensiunea narațiunii, fără a-l limita la justiție juridică sau la noțiunea modernă, mai interpretativă, de echitate.
translation_notes:
  register: Română standard modernă, cu exprimare simplă și demnă. Ordinea propozițiilor este ușor adaptată pentru fluență, iar sensul și accentul originalului sunt păstrate.
