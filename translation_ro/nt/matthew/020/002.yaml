  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ⸂συμφωνήσας δὲ⸃ μετὰ τῶν ἐργατῶν ἐκ δηναρίου τὴν ἡμέραν ἀπέστειλεν αὐτοὺς εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/002.yaml
  text: After agreeing with the workers for one denarius for the day[a], he sent them into his vineyard.
translation:
  language: ro
  text: După ce s-a învoit cu lucrătorii pentru un dinar pe zi[a], i-a trimis în via lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dinarul era plata obișnuită pentru o zi de muncă a unui lucrător.
    reason: cultural_note
lexical_decisions:
- source_word: συμφωνήσας
  choice: După ce s-a învoit
  rationale: Participiul aorist exprimă o acțiune anterioară verbului principal; formularea este firească în româna actuală și păstrează ideea ajungerii la o înțelegere.
- source_word: δὲ
  choice: —
  rationale: Aici particula are rol de legătură narativă slabă, redat suficient prin construcția temporală românească, fără un corespondent explicit.
- source_word: ἐργατῶν
  choice: lucrătorii
  rationale: Termen modern, clar și potrivit contextului angajării unor oameni pentru lucrul în vie.
- source_word: ἐκ δηναρίου
  choice: pentru un dinar
  rationale: Redă suma convenită drept plată și păstrează denumirea monedei antice, fără echivalare modernă înșelătoare.
- source_word: τὴν ἡμέραν
  choice: pe zi
  rationale: Redă natural în română valoarea temporală a acuzativului în expresia referitoare la plată, fără a adăuga explicit ideea de «zi întreagă».
- source_word: ἀπέστειλεν
  choice: i-a trimis
  rationale: Echivalent narativ firesc și precis; pronumele îi reprezintă explicit pe lucrătorii menționați anterior.
- source_word: ἀμπελῶνα
  choice: vie
  rationale: Echivalentul românesc standard și idiomatic pentru terenul cultivat cu viță-de-vie.
- source_word: αὐτοῦ
  choice: lui
  rationale: Pronumele posesiv se referă direct la proprietarul viei.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. «S-a învoit» păstrează sensul acordului salarial fără ton juridic excesiv, iar «vie» este mai natural decât «podgorie» în acest context.
