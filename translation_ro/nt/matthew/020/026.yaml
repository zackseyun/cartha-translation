id: MAT.20.26
reference: Matthew 20:26
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οὐχ οὕτως ⸀ἔσται ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν μέγας γενέσθαι ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/026.yaml
  text: It shall not be so among you[a]. But whoever wants to become great among you shall be your servant,
translation:
  language: ro
  text: Între voi însă nu va fi așa.[a] Dimpotrivă, oricine vrea să devină mare între voi va fi slujitorul vostru,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Între voi nu este așa.” Greaca folosește un verb la viitor („va fi”), care poate exprima felul în care nu trebuie să stea lucrurile între urmașii lui Isus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ οὕτως ἔσται ἐν ὑμῖν
  choice: Între voi însă nu va fi așa
  rationale: Păstrează viitorul lui ἔσται și, astfel, forța normativă și orientată spre viitor a afirmației; «între voi» redă firesc sensul comunitar al lui ἐν ὑμῖν.
- source_word: ἀλλ’ ὃς ἂν θέλῃ
  choice: Dimpotrivă, oricine vrea
  rationale: Construcția nedefinită ὃς ἂν cu conjunctivul este redată prin «oricine», iar θέλῃ prin formularea volitivă și actuală «vrea». «Dimpotrivă» exprimă aici contrastul puternic introdus de ἀλλά.
- source_word: μέγας γενέσθαι
  choice: să devină mare
  rationale: «Să devină» păstrează nuanța dinamică a lui γενέσθαι, nu doar starea de a fi mare.
- source_word: διάκονος
  choice: slujitor
  rationale: În context, termenul desemnează o persoană care slujește, fără a indica în mod necesar funcția eclezială ulterioară de diacon. «Slujitor» păstrează limbajul concret al slujirii.
- source_word: ὑμῶν
  choice: vostru
  rationale: Genitivul este redat idiomatic prin posesivul «vostru», păstrând relația slujitorului față de întreaga comunitate.
theological_decisions:
- issue: Natura măreției în comunitatea ucenicilor lui Isus
  choice: 'Afirmația este redată ca o răsturnare normativă a ierarhiei lumești: cel care urmărește măreția trebuie să fie slujitorul celorlalți.'
  alternative: διάκονος ar putea fi redat instituțional prin «diacon» sau ideea ar putea fi parafrazată generic drept smerenie.
  rationale: Contextul contrastează exercitarea puterii de către conducătorii națiunilor cu modelul cerut ucenicilor. Redarea concretă «slujitor» evită atât importarea unei funcții bisericești ulterioare, cât și diluarea afirmației într-o abstracție.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Ordinea inițială «Între voi însă» produce un contrast firesc în română; «slujitor» evită atât arhaicul «slugă», cât și sensul instituțional al lui «diacon».
