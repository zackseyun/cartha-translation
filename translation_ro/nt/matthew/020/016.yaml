  text: οὕτως ἔσονται οἱ ἔσχατοι πρῶτοι καὶ οἱ πρῶτοι ⸀ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/016.yaml
  text: So the last will be first[a], and the first last.
translation:
  language: ro
  text: Astfel[a], cei din urmă vor fi cei dintâi, și cei dintâi vor fi cei din urmă.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Așa, cei din urmă vor fi cei dintâi, și cei dintâi vor fi cei din urmă.”'
    reason: Alternativă lexicală pentru οὕτως, care poate avea nuanță concluzivă sau modală.
lexical_decisions:
- source_word: οὕτως
  choice: Tot așa
  rationale: Introduce concluzia și aplicarea pildei, păstrând sensul de rezultat sau corespondență al expresiei grecești într-o formulare românească firească.
- source_word: ἔσονται
  choice: vor fi
  rationale: Redă direct și natural în româna modernă viitorul verbului εἰμί.
- source_word: οἱ ἔσχατοι
  choice: cei din urmă
  rationale: Adjectivul articulat este substantivizat; formularea păstrează ideea de ordine sau poziție fără a o restrânge la valoare socială.
- source_word: πρῶτοι
  choice: cei dintâi
  rationale: În română, reluarea articolului substantivizează firesc adjectivul și păstrează formula memorabilă a inversării.
- source_word: καὶ
  choice: și
  rationale: Păstrează coordonarea simplă din greacă, fără a introduce o nuanță adversativă suplimentară prin „dar” sau „iar”.
- source_word: οἱ πρῶτοι
  choice: cei dintâi
  rationale: Redă adjectivul substantivizat în paralel direct cu „cei din urmă”.
- source_word: ἔσχατοι
  choice: cei din urmă
  rationale: Completează simetric inversarea; elipsa verbului din greacă este păstrată într-o construcție românească demnă și inteligibilă.
theological_decisions:
- issue: Natura inversării exprimate de sentință
  choice: Formulare concisă, fără precizarea domeniului în care cei din urmă devin cei dintâi
  alternative: Interpretarea explicită drept inversare socială, răsplată în ucenicie sau ordine a mântuirii
  rationale: Textul grecesc nu precizează dacă termenii se referă la cronologie, statut, răsplată ori mântuire; traducerea păstrează deschiderea și tensiunea teologică a afirmației.
translation_notes:
  register: Română standard modernă, concisă și solemnă. Paralelismul și elipsa verbului din a doua parte păstrează caracterul aforistic al grecei; virgulele fac elipsa ușor de urmărit.
