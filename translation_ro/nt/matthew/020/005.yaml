base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/005.yaml
  text: So they went away. Going out again about the sixth and ninth hour[a], he did likewise.
translation:
  language: ro
  text: Iar ei au plecat. A ieșit din nou pe la ceasul al șaselea și al nouălea[a] și a făcut la fel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Adică aproximativ la amiază și la ora trei după-amiaza, potrivit modului iudaic de numărare a orelor.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ ἀπῆλθον
  choice: Iar ei au plecat
  rationale: Pronumele îi indică pe lucrătorii menționați anterior; δέ este redat prin legătura narativă firească „iar”, iar ἀπῆλθον prin expresia curentă „au plecat”.
- source_word: πάλιν
  choice: din nou
  rationale: Redă direct repetarea acțiunii într-o română modernă și naturală.
- source_word: ἐξελθὼν
  choice: Ieșind
  rationale: Păstrează construcția participială și succesiunea narativă fără a preciza excesiv raportul temporal.
- source_word: περὶ ἕκτην καὶ ἐνάτην ὥραν
  choice: cam pe la ceasul al șaselea și al nouălea
  rationale: „Cam pe la” exprimă aproximația lui περὶ, iar numerotarea orelor păstrează cadrul cultural al textului-sursă; echivalentele moderne sunt oferite în notă.
- source_word: ἐποίησεν ὡσαύτως
  choice: a făcut la fel
  rationale: Expresia românească redă concis verbul cu sens general ποιέω împreună cu valoarea comparativă a lui ὡσαύτως.
