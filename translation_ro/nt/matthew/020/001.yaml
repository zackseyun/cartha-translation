id: MAT.20.1
reference: Matthew 20:1
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ὁμοία γάρ ἐστιν ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐξῆλθεν ἅμα πρωῒ μισθώσασθαι ἐργάτας εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/001.yaml
  text: For the kingdom of heaven is like a man, a master of a house, who went out early in the morning to hire workers for his vineyard.
translation:
  language: ro
  text: Căci Împărăția cerurilor este asemenea unui om, unui stăpân al casei, care a ieșit dis-de-dimineață să angajeze lucrători pentru via sa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: unui om, unui stăpân al casei
  rationale: Păstrează atât termenul generic ἀνθρώπῳ, cât și apoziția οἰκοδεσπότῃ, fără a-l reduce pe primul la o simplă formulă redundantă.
- source_word: ἅμα πρωῒ
  choice: dis-de-dimineață
  rationale: Redă idiomatic ideea ieșirii foarte devreme, la începutul dimineții.
- source_word: μισθώσασθαι
  choice: să angajeze
  rationale: Exprimă natural scopul de a lua lucrători cu plată, păstrând cadrul muncii remunerate.
- source_word: ἀμπελῶνα
  choice: via
  rationale: Este echivalentul românesc firesc și precis pentru terenul cultivat cu viță-de-vie.
theological_decisions:
- issue: Formula comparativă despre Împărăția cerurilor
  choice: Împărăția cerurilor este asemenea unui om, unui stăpân al casei
  alternative: Împărăția cerurilor este asemenea unui stăpân al casei
  rationale: Menține structura greacă și referirea explicită la „un om”, fără a netezi tensiunea metaforică prin omiterea lui ἀνθρώπῳ.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Apoziția repetată cu „unui” păstrează fidel construcția sursă, iar „dis-de-dimineață” oferă o formulare românească naturală.
