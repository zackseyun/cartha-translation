base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/006.yaml
  text: And about the eleventh hour he went out and found others standing there[a], and he says to them[b], ‘Why have you been standing here idle all day?’
translation:
  language: ro
  text: 'Iar pe la ceasul al unsprezecelea[a], a ieșit și i-a găsit pe alții stând acolo; și le spune[b]: „De ce stați aici toată ziua fără să lucrați?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'În modul antic de numărare a orelor zilei, aproximativ ora cinci după-amiaza. Literal: „pe la ceasul al unsprezecelea”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „le-a spus”. Greaca folosește aici prezentul istoric: „le spune”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἑνδεκάτην
  choice: Iar pe la ceasul al unsprezecelea
  rationale: περί cu acuzativul exprimă aproximația. Formularea păstrează modul antic de numărare a orelor și legătura temporală din parabolă.
- source_word: ἐξελθὼν εὗρεν
  choice: a ieșit și i-a găsit
  rationale: Participiul aorist indică o acțiune anterioară sau strâns legată de verbul principal; coordonarea este firească în româna narativă și păstrează succesiunea.
- source_word: ἄλλους ἑστῶτας
  choice: pe alții stând acolo
  rationale: ἄλλους este substantivizat, iar participiul perfect descrie starea lor continuă. „Acolo” redă natural situația locativă sugerată și explicitată apoi prin ὧδε.
- source_word: καὶ λέγει αὐτοῖς
  choice: și le spune
  rationale: Se păstrează prezentul istoric al narațiunii grecești, fără a-l uniformiza la trecut.
- source_word: Τί ὧδε ἑστήκατε
  choice: De ce ați stat aici
  rationale: În această întrebare, τί are sensul idiomatic „de ce”, iar perfectul ἑστήκατε exprimă starea prelungită până în momentul vorbirii.
- source_word: ὅλην τὴν ἡμέραν ἀργοί
  choice: toată ziua fără să lucrați
  rationale: ἀργοί înseamnă inactivi, fără lucru. Expresia românească este clară și neutră, evitând conotațiile morale pe care le-ar putea avea „leneși”.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. S-a păstrat idiomul temporal antic în text, explicat în notă, precum și prezentul istoric al originalului. „Fără să lucrați” redă sensul contextual al lui ἀργοί fără a introduce ideea moralizatoare de lene.
