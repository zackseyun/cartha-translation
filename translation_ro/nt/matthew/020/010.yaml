id: MAT.20.10
reference: Matthew 20:10
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ πρῶτοι ἐνόμισαν ὅτι ⸀πλεῖον λήμψονται· καὶ ἔλαβον ⸂τὸ ἀνὰ δηνάριον καὶ αὐτοί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/010.yaml
  text: When the first ones came[a], they thought they would receive more[b], but they too received a denarius each.
translation:
  language: ro
  text: Când au venit cei dintâi[a], au crezut că vor primi mai mult, dar și ei au primit câte un dinar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Adică lucrătorii angajați primii în parabolă.
    reason: lexical_alternative
  - marker: b
    text: Dinarul era plata obișnuită pentru o zi de muncă a unui lucrător.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντες
  choice: când au venit
  rationale: Participiul aorist are aici valoare temporală; formularea redă firesc în română succesiunea acțiunilor.
- source_word: οἱ πρῶτοι
  choice: cei dintâi
  rationale: Expresia îi desemnează pe lucrătorii angajați primii, nu un rang abstract; „cei dintâi” păstrează referința plurală și legătura cu parabola.
- source_word: ἐνόμισαν
  choice: au crezut
  rationale: Verbul exprimă o presupunere sau așteptare; „au crezut” este natural și nu implică certitudine.
- source_word: πλεῖον
  choice: mai mult
  rationale: Comparativul indică o plată mai mare, iar redarea concisă este idiomatică.
- source_word: λήμψονται
  choice: vor primi
  rationale: Viitorul din discursul indirect este redat firesc în română prin viitor, păstrând perspectiva așteptării lor.
- source_word: τὸ ἀνὰ δηνάριον
  choice: câte un dinar
  rationale: ἀνά cu acuzativul are sens distributiv; „câte un” exprimă limpede suma primită de fiecare.
- source_word: καὶ αὐτοί
  choice: dar și ei
  rationale: „Și ei” păstrează accentul asupra egalității surprinzătoare a plății, iar „dar” face explicit contrastul contextual dintre așteptare și rezultat.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu formulare narativă clară și demnă. „Cei dintâi” păstrează ecoul terminologic al parabolei, iar „câte un dinar” redă natural distribuirea aceleiași plăți fiecăruia.
