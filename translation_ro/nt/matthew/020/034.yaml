  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ Ἰησοῦς ἥψατο τῶν ⸀ὀμμάτων αὐτῶν, καὶ εὐθέως ⸀ἀνέβλεψαν καὶ ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/034.yaml
  text: And Jesus[a], moved with compassion, touched their eyes, and immediately they received their sight and followed him.
translation:
  language: ro
  text: Iar Isus, cuprins de milă, le-a atins ochii și îndată și-au recăpătat vederea[a] și l-au urmat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „au văzut din nou”. Verbul grec poate însemna „a-și recăpăta vederea” sau, mai literal, „a-și ridica privirea”; în acest context se referă la restabilirea vederii.'
    reason: alternativă lexicală
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: cuprins de milă
  rationale: Participiul exprimă o compasiune profundă. Formularea este firească în româna actuală și păstrează intensitatea afectivă fără a adăuga o explicație.
- source_word: δὲ
  choice: Iar
  rationale: Aici particula are rolul unei legături narative ușoare. „Iar” continuă relatarea fără să introducă un contrast puternic.
- source_word: ἥψατο
  choice: le-a atins
  rationale: În contextul vindecării, verbul indică atingerea fizică. Pronumele „le” redă natural în română relația cu „ochii”.
- source_word: τῶν ὀμμάτων αὐτῶν
  choice: ochii
  rationale: Împreună cu pronumele datival „le”, expresia grecească este redată idiomatic prin „le-a atins ochii”.
- source_word: εὐθέως
  choice: îndată
  rationale: Termenul subliniază rezultatul imediat al atingerii lui Isus; „îndată” păstrează atât precizia temporală, cât și registrul demn al narațiunii.
- source_word: ἀνέβλεψαν
  choice: și-au recăpătat vederea
  rationale: În relatările despre vindecarea orbilor, verbul denotă în mod obișnuit redobândirea vederii. Formularea românească exprimă limpede sensul contextual, iar alternativa lexicală este păstrată în notă.
- source_word: ἠκολούθησαν αὐτῷ
  choice: l-au urmat
  rationale: Redarea păstrează atât sensul concret al mersului după Isus, cât și posibila rezonanță a uceniciei, fără a preciza mai mult decât spune textul.
theological_decisions:
- issue: Natura rezultatului vindecării exprimat prin ἀνέβλεψαν
  choice: o redobândire reală și imediată a vederii
  alternative: o afirmație mai puțin specifică, precum „au văzut din nou” sau sensul literal „și-au ridicat privirea”
  rationale: În contextul vindecării celor orbi, asocierea dintre εὐθέως și ἀνέβλεψαν indică restabilirea imediată a vederii, fără a necesita vreo amplificare.
- issue: Forța expresiei ἠκολούθησαν αὐτῷ
  choice: l-au urmat
  alternative: au devenit ucenicii lui
  rationale: Textul afirmă că ei l-au urmat pe Isus. Deși formularea poate avea rezonanțe de ucenicie, nu definește explicit profunzimea sau durata acestei urmări.
translation_notes:
  register: Română standard modernă, clară și demnă. Construcția „cuprins de milă” evită un calc rigid, iar „îndată” menține concizia și solemnitatea narațiunii. Marcajul notei este așezat lângă expresia pe care o explică.
