source:
  edition: SBLGNT
  text: ⸀λέγει αὐτοῖς· Τὸ μὲν ποτήριόν μου ⸀πίεσθε, τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ ⸀εὐωνύμων οὐκ ἔστιν ⸀ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/023.yaml
  text: He said to them[a], “You will indeed drink my cup, but to sit at my right and at my left is not mine to grant[b], but it is for those for whom it has been prepared by my Father.”
translation:
  language: ro
  text: 'El le-a zis: „Paharul Meu îl veți bea negreșit[a], dar a sta la dreapta Mea și la stânga Mea nu-Mi aparține Mie să le dau, ci celor pentru care au fost pregătite de Tatăl Meu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Paharul” este o imagine pentru suferința sau destinul rânduit lui Isus, de care vor avea parte și ucenicii Săi.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: El le-a zis
  rationale: Prezentul istoric grecesc este redat prin perfectul compus, firesc în narațiunea românească modernă.
- source_word: Τὸ μὲν ποτήριόν μου πίεσθε
  choice: Paharul Meu îl veți bea negreșit
  rationale: Este păstrată imaginea paharului, fără a o interpreta în textul principal. „Negreșit” redă afirmarea accentuată din construcția contrastivă cu μὲν.
- source_word: καθίσαι ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων
  choice: a ședea la dreapta Mea și la stânga Mea
  rationale: Formularea păstrează infinitivul și locurile de onoare indicate de expresiile grecești, într-o română demnă și inteligibilă.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: nu este al Meu să acord
  rationale: Redarea apropiată de forma greacă păstrează afirmația și tensiunea ei teologică; „a acorda” este natural pentru atribuirea unor locuri de onoare.
- source_word: ἀλλ’ οἷς ἡτοίμασται
  choice: ci este pentru cei cărora le-a fost pregătit
  rationale: Este păstrată elipsa din greacă atât cât permite limba română, precum și perfectul pasiv, care indică o pregătire deja făcută și încă valabilă.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: de Tatăl Meu
  rationale: Redare directă a agentului personal al verbului pasiv, fără adaosul neexplicit „numai”.
theological_decisions:
- issue: Implicația cristologică a afirmației că acordarea locurilor „nu este” a lui Isus
  choice: Afirmația este redată direct, fără calificări explicative.
  alternative: „nu este al Meu să acord fără voia Tatălui” sau o parafrază care armonizează explicit autoritatea Fiului cu cea a Tatălui
  rationale: Textul grecesc nu conține o asemenea calificare. Traducerea păstrează tensiunea teologică autentică și nu introduce o soluție doctrinară în cuvintele lui Isus.
translation_notes:
  register: Română standard modernă, cu registru demn. Formularea ușor solemnă „nu este al Meu să acord” a fost păstrată pentru fidelitate față de structura și tensiunea textului grecesc.
