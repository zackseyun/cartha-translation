  to: 'El le-a zis: „Paharul Meu îl veți bea negreșit[a], dar a sta la dreapta Mea și la stânga Mea nu-Mi aparține Mie să le dau, ci celor pentru care au fost pregătite de Tatăl Meu.”'
  rationale: Revizuirea înlocuiește două formulări mai rigide cu română standard modernă, păstrând imaginea paharului, construcția contrastivă și tensiunea afirmației despre acordarea locurilor. Finalul explicitează numai referentul gramatical necesar în română („le”/locurile), fără a adăuga o interpretare teologică. Nota este corectată gramatical.
