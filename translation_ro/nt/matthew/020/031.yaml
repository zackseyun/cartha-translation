  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ ὄχλος ἐπετίμησεν αὐτοῖς ἵνα σιωπήσωσιν· οἱ δὲ μεῖζον ⸀ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/031.yaml
  text: But the crowd rebuked them so that they would be silent[a]. Yet they cried out all the more, saying, “Lord, have mercy on us[b], Son of David.”
translation:
  language: ro
  text: 'Dar mulțimea i-a mustrat ca să tacă. Ei însă au strigat și mai tare[a], spunând: „Doamne, Fiule al lui David, ai milă de noi!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „cu atât mai mult”. Comparativul grecesc poate indica fie o intensificare în general, fie, în acest context, un volum mai mare al strigătului.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὄχλος
  choice: mulțimea
  rationale: Redă firesc grupul de oameni din cadrul narativ și păstrează valoarea colectivă a substantivului grecesc.
- source_word: ἐπετίμησεν αὐτοῖς
  choice: i-a mustrat
  rationale: ἐπιτιμάω exprimă aici o dezaprobare fermă prin care mulțimea încearcă să-i reducă la tăcere; „i-a mustrat” păstrează această forță fără să adauge explicit ideea unei porunci.
- source_word: ἵνα σιωπήσωσιν
  choice: ca să tacă
  rationale: Construcția redă concis și natural scopul urmărit de mulțime.
- source_word: μεῖζον ἔκραξαν
  choice: au strigat și mai tare
  rationale: Comparativul adverbial intensifică strigătul; în context, formularea românească indică firesc intensificarea și volumul, iar nota păstrează sensul mai general posibil.
- source_word: λέγοντες
  choice: spunând
  rationale: Păstrează participiul care introduce conținutul strigătului, fără a repeta inutil verbul „a striga”.
- source_word: Κύριε
  choice: Doamne
  rationale: Vocativul românesc consacrat păstrează atât adresarea respectuoasă, cât și posibila rezonanță cristologică a lui κύριος.
- source_word: ἐλέησον ἡμᾶς
  choice: ai milă de noi
  rationale: Este echivalentul românesc direct, natural și demn al cererii urgente exprimate prin imperativ.
- source_word: υἱὸς Δαυίδ
  choice: Fiul lui David
  rationale: Păstrează formularea titulară recunoscută în Evanghelia după Matei și nu o reduce la simpla idee de descendență.
theological_decisions:
- issue: Titlul mesianic atribuit lui Isus
  choice: Fiul lui David
  alternative: urmașul lui David
  rationale: Expresia are în Matei o încărcătură regală și mesianică. Redarea literală păstrează această forță fără a explicita în text mai mult decât afirmă greaca.
- issue: κύριος ca adresare către Isus
  choice: Doamne
  alternative: Stăpâne
  rationale: „Doamne” păstrează simultan caracterul de adresare respectuoasă și potențiala greutate cristologică, evitând restrângerea sensului la o simplă relație de autoritate omenească.
translation_notes:
  register: Română standard modernă, cu formulare narativă limpede și demnă. Topica urmează îndeaproape textul grecesc, iar dialogul rămâne natural. Marcajele notelor au fost așezate lângă expresiile pe care le explică.
