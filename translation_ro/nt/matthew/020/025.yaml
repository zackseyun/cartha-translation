id: MAT.20.25
reference: Matthew 20:25
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτοὺς εἶπεν· Οἴδατε ὅτι οἱ ἄρχοντες τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/025.yaml
  text: But Jesus[a], calling them to himself, said, “You know that the rulers of the Gentiles lord it over them[b], and their great men exercise authority over them.”
translation:
  language: ro
  text: 'Dar Isus i-a chemat la el și le-a spus: „Știți că stăpânitorii neamurilor[a] își impun stăpânirea asupra lor, iar mai-marii lor[b] își exercită autoritatea asupra lor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „națiunilor”; în acest context, termenul îi poate desemna pe cei dintre popoarele neevreiești.'
    reason: alternative_reading
  - marker: b
    text: 'Sau: „cei mari ai lor” ori „înalții lor dregători”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: i-a chemat la el
  rationale: Redă natural participiul aorist mediu și păstrează ideea că Isus îi cheamă pe ucenici spre sine înainte de a vorbi.
- source_word: Οἴδατε
  choice: Știți
  rationale: Deși forma grecească este perfectă, sensul este prezent; această redare este idiomatică și exactă în româna actuală.
- source_word: ἄρχοντες
  choice: stăpânitorii
  rationale: Termenul denumește persoane care conduc sau guvernează. „Stăpânitorii” se potrivește contextului și pregătește contrastul cu modelul de conducere prezentat de Isus.
- source_word: τῶν ἐθνῶν
  choice: neamurilor
  rationale: „Neamurile” păstrează termenul biblic românesc care poate desemna atât națiunile, cât și popoarele neevreiești, fără a elimina ambiguitatea contextuală a grecescului ἔθνη.
- source_word: κατακυριεύουσιν
  choice: își impun stăpânirea asupra
  rationale: Verbul compus exprimă exercitarea dominatoare a stăpânirii; formularea păstrează nuanța negativă mai bine decât simplul „conduc”.
- source_word: οἱ μεγάλοι
  choice: mai-marii lor
  rationale: Expresia românească desemnează natural persoane proeminente ori cu rang înalt și păstrează caracterul substantival și masculin al adjectivului grecesc.
- source_word: κατεξουσιάζουσιν
  choice: își exercită autoritatea asupra
  rationale: Redă direct ideea exercitării puterii asupra altora și păstrează paralelismul cu verbul precedent.
- source_word: αὐτῶν
  choice: lor / asupra lor
  rationale: Pronumele se referă natural la neamurile sau popoarele aflate sub conducerea celor menționați; româna cere forme diferite în cele două construcții.
theological_decisions:
- issue: Sensul lui ἐθνῶν în contextul iudaic al spuselor lui Isus
  choice: neamurilor
  alternative: națiunilor; popoarelor neevreiești
  rationale: „Neamurilor” păstrează deschisă atât lectura generală, „națiunilor”, cât și lectura contextuală, „neevreilor”, evitând introducerea unei interpretări teologice mai înguste direct în text.
- issue: Redarea formei masculine οἱ μεγάλοι
  choice: mai-marii lor
  alternative: cei mari ai lor; înalții lor dregători
  rationale: Alegerea păstrează forma masculină și sensul de persoane cu rang sau influență, fără a preciza nejustificat o funcție oficială anume.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formularea „își impun stăpânirea” păstrează forța critică a verbului grecesc, iar „mai-marii lor” este o expresie românească firească pentru persoane proeminente sau aflate la conducere.
