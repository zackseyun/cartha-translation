id: MAT.20.19
reference: Matthew 20:19
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν εἰς τὸ ἐμπαῖξαι καὶ μαστιγῶσαι καὶ σταυρῶσαι, καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/019.yaml
  text: and they will hand him over to the Gentiles to mock and flog and crucify[a], and on the third day he will be raised.
translation:
  language: ro
  text: și Îl vor da pe mâna neamurilor ca să-L batjocorească, să-L biciuiască și să-L răstignească, iar a treia zi va fi înviat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „va învia”. Verbul grecesc este la diateza pasivă („va fi înviat”), formulare obișnuită despre înviere, care poate sugera acțiunea lui Dumnezeu.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραδώσουσιν
  choice: Îl vor da pe mâna
  rationale: Redă natural transferarea lui Isus sub puterea autorităților ostile, fără a restrânge sensul la trădare.
- source_word: τοῖς ἔθνεσιν
  choice: neamurilor
  rationale: În contextul relatării patimilor desemnează oamenii dintre neamuri, adică autoritățile neiudaice; termenul este consacrat și inteligibil în româna biblică actuală.
- source_word: εἰς τὸ ἐμπαῖξαι
  choice: ca să-L batjocorească
  rationale: Construcția cu infinitiv articulat exprimă scopul sau rezultatul, iar formularea românească păstrează limpede această relație.
- source_word: μαστιγῶσαι
  choice: să-L biciuiască
  rationale: „A biciui” este termenul românesc actual și precis pentru pedeapsa corporală judiciară indicată aici.
- source_word: σταυρῶσαι
  choice: să-L răstignească
  rationale: Redă direct verbul grecesc „a crucifica”; pronumele obiect este repetat pentru claritate și fluență în română.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: a treia zi
  rationale: Este o expresie temporală firească în română și corespunde dativului temporal grecesc.
- source_word: ἐγερθήσεται
  choice: va fi înviat
  rationale: Păstrează forma pasivă viitoare a textului grecesc și posibila nuanță a acțiunii lui Dumnezeu.
theological_decisions:
- issue: Diateza verbului învierii
  choice: va fi înviat
  alternative: va învia
  rationale: Greaca are viitor pasiv. Redarea pasivă conservă formularea și nuanța posibilă a acțiunii divine, fără a exclude alte afirmații biblice despre lucrarea lui Cristos.
translation_notes:
  register: Română standard modernă, demnă și clară. Majusculele reverențiale din pronumele referitoare la Isus urmează uzul biblic românesc răspândit. „Neamurilor” păstrează termenul contextual și tradițional fără formularea depreciativă „păgânilor”.
