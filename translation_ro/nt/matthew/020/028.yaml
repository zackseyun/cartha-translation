id: MAT.20.28
reference: Matthew 20:28
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὥσπερ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/028.yaml
  text: just as the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: ro
  text: după cum nici Fiul Omului n-a venit ca să fie slujit, ci ca să slujească și să-și dea viața drept preț de răscumpărare pentru mulți[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, mai explicit: „drept preț de răscumpărare în locul multora”.'
    reason: Alternativă lexicală ce face explicită nuanța substitutivă a prepoziției ἀντί.
lexical_decisions:
- source_word: ὥσπερ
  choice: după cum
  rationale: Introduce comparația cu învățătura precedentă și redă firesc forța comparativă a termenului grecesc.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Păstrează desemnarea consacrată, precum și rezonanța ei titulară și legătura intertextuală cu Daniel.
- source_word: οὐκ ἦλθεν
  choice: n-a venit
  rationale: Redă natural aoristul indicativ prin trecut, fără a adăuga o precizare de loc sau de aspect absentă din greacă.
- source_word: διακονηθῆναι
  choice: să fie slujit
  rationale: Păstrează forma pasivă și folosește un verb românesc clar, care poate fi reluat în contrastul imediat.
- source_word: ἀλλὰ διακονῆσαι
  choice: ci ca să slujească
  rationale: Menține opoziția verbală directă cu „să fie slujit” și exprimă scopul în mod firesc în română.
- source_word: καὶ δοῦναι
  choice: și să-și dea
  rationale: Coordonează al doilea infinitiv cu ideea venirii și redă simplu actul voluntar al dăruirii.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: viața
  rationale: În acest context, ψυχή este viața dată până la moarte, nu doar „sufletul” ca parte imaterială a persoanei.
- source_word: λύτρον
  choice: preț de răscumpărare
  rationale: Redă explicit sensul de preț plătit pentru eliberare și este mai limpede în româna actuală decât folosirea izolată a substantivului „răscumpărare”.
- source_word: ἀντὶ πολλῶν
  choice: pentru mulți
  rationale: Este o formulare românească naturală și consacrată, care păstrează concizia textului; nuanța mai explicit substitutivă a lui ἀντί este consemnată în notă.
theological_decisions:
- issue: Forța prepoziției ἀντί în afirmația despre răscumpărare
  choice: pentru mulți
  alternative: în locul multora
  rationale: Textul prezintă moartea lui Isus în termeni reprezentativi și substitutivi. Formularea principală rămâne idiomatică și nu exclude substituția, iar nota păstrează sensul mai explicit de schimb sau înlocuire pe care îl poate avea ἀντί.
translation_notes:
  register: Română standard modernă, clară și demnă. Repetiția „să fie slujit ... să slujească” păstrează contrastul retoric al originalului, iar „Fiul Omului” menține formularea biblică recunoscută.
