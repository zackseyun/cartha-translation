base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/009.yaml
  text: And those who came about the eleventh hour received a denarius each[a].
translation:
  language: ro
  text: Și cei care au venit pe la ceasul al unsprezecelea au primit câte un dinar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dinarul era o monedă romană de argint, considerată în mod obișnuit plata tipică pentru o zi de muncă a unui lucrător.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: (neredat explicit)
  rationale: În română, legătura cu versetul anterior este firească fără un „Și” inițial; omiterea conjunctivei evită o formulare greoaie fără a pierde continuitatea narativă.
- source_word: ἐλθόντες
  choice: care veniseră
  rationale: Redă natural participiul aorist și indică venirea lor anterioară primirii plății.
- source_word: οἱ περὶ τὴν ἑνδεκάτην ὥραν
  choice: Cei ... pe la ceasul al unsprezecelea
  rationale: „Pe la” păstrează aproximația temporală exprimată de περὶ, iar formularea nu adaugă ideea de angajare, doar implicită în context.
- source_word: ἔλαβον
  choice: au primit
  rationale: În contextul plății salariului, „au primit” redă sensul firesc al verbului fără nuanța prea activă a lui „au luat”.
- source_word: ἀνὰ
  choice: câte un
  rationale: Construcția distributivă românească arată limpede că fiecare persoană a primit un singur dinar.
- source_word: δηνάριον
  choice: dinar
  rationale: Păstrează denumirea istorică a monedei, în loc să o înlocuiască interpretativ cu valoarea aproximativă a unei zile de muncă.
