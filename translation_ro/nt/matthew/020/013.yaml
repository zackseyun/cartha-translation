id: MAT.20.13
reference: Matthew 20:13
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸂ἑνὶ αὐτῶν εἶπεν⸃· Ἑταῖρε, οὐκ ἀδικῶ σε· οὐχὶ δηναρίου συνεφώνησάς μοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/013.yaml
  text: But answering[a], he said to one of them, ‘Friend, I am not wronging you[b]. Did you not agree with me for a denarius?’
translation:
  language: ro
  text: 'Dar el i-a răspuns unuia dintre ei: „Prietene, nu te nedreptățesc. Nu te-ai învoit cu mine pentru un dinar?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dinarul era o monedă romană de argint, considerată în mod obișnuit plata tipică pentru o zi de muncă a unui lucrător.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: i-a răspuns
  rationale: Româna exprimă natural formula grecească participiu + verb de vorbire prin verbul simplu „a răspunde”, fără redundanța rigidă „răspunzând, a zis”.
- source_word: ἑνὶ αὐτῶν
  choice: unuia dintre ei
  rationale: 'Redă precis dativul singular și genitivul partitiv: stăpânul se adresează unei singure persoane din grup.'
- source_word: Ἑταῖρε
  choice: Prietene
  rationale: Este echivalentul vocativ firesc în româna actuală; contextul permite tonul reținut sau distant al apelativului, fără a-l explicita în traducere.
- source_word: οὐκ ἀδικῶ σε
  choice: nu te nedreptățesc
  rationale: 'Păstrează sensul personal și prezent al lui ἀδικέω: a săvârși o nedreptate față de cineva.'
- source_word: οὐχὶ
  choice: Nu ...?
  rationale: Întrebarea negativă românească păstrează așteptarea unui răspuns afirmativ.
- source_word: δηναρίου
  choice: pentru un dinar
  rationale: Păstrează moneda istorică, iar nota explică valoarea ei culturală fără a introduce interpretarea direct în text.
- source_word: συνεφώνησάς μοι
  choice: te-ai învoit cu mine
  rationale: Redă acordul încheiat anterior și este o formulare naturală, demnă, potrivită contextului unei înțelegeri privind plata.
theological_decisions: []
translation_notes:
  register: Română standard modernă, clară și demnă. Sintaxa greacă este naturalizată moderat, iar termenul istoric „dinar” este păstrat și explicat în notă.
