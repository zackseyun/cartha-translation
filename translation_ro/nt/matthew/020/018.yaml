id: MAT.20.18
reference: Matthew 20:18
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/018.yaml
  text: Look[a], we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn him to death[c][b],
translation:
  language: ro
  text: „Iată[a], urcăm la Ierusalim, iar Fiul Omului[b] va fi dat pe mâna[c] preoților de seamă și cărturarilor, iar ei îl vor condamna la moarte.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Priviți” ori, într-o formulare tradițională, „Iată că”.'
    reason: lexical_alternative
  - marker: b
    text: „Fiul Omului” este autodesemnarea caracteristică a lui Isus și poate evoca Daniel 7:13–14.
    reason: cross_reference
  - marker: c
    text: 'Sau: „va fi predat”; într-un context mai restrâns, verbul poate însemna și „va fi trădat”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Iată
  rationale: Redă firesc în româna actuală semnalul discursiv care atrage atenția, păstrând totodată demnitatea registrului.
- source_word: ἀναβαίνομεν
  choice: urcăm
  rationale: Păstrează sensul prezent al deplasării ascendente spre Ierusalim, cu rezonanța geografică și convențională a urcării la cetate.
- source_word: Ἱεροσόλυμα
  choice: Ierusalim
  rationale: Forma consacrată în limba română a numelui cetății.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Păstrează autodesemnarea caracteristică a lui Isus și posibila ei rezonanță din Daniel 7, fără a o reduce la o expresie antropologică generică.
- source_word: παραδοθήσεται
  choice: va fi dat pe mâna
  rationale: Exprimă transferarea sub puterea autorităților ostile și rămâne suficient de larg pentru a nu restrânge verbul doar la actul trădării.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: preoților de seamă
  rationale: Redă pluralul care desemnează conducătorii autorității preoțești, nu mai mulți deținători simultani ai funcției de mare-preot.
- source_word: γραμματεῦσιν
  choice: cărturarilor
  rationale: Echivalentul românesc biblic direct pentru experții și copiștii Legii, inteligibil în context.
- source_word: κατακρινοῦσιν
  choice: îl vor condamna
  rationale: Păstrează sensul judiciar al pronunțării unei sentințe nefavorabile.
- source_word: θανάτῳ
  choice: la moarte
  rationale: Redă idiomatic în română pedeapsa sau rezultatul condamnării.
theological_decisions:
- issue: Redarea titlului cristologic ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  alternative: Omul / Cel omenesc
  rationale: Forma consacrată păstrează caracterul de titlu și posibila trimitere la Daniel 7:13–14, fără a impune o singură explicație a expresiei.
- issue: Sfera semantică a verbului παραδοθήσεται
  choice: va fi dat pe mâna
  alternative: va fi predat / va fi trădat
  rationale: Alegerea păstrează ideea largă de trecere sub puterea altora și nu identifică în mod prematur acțiunea numai cu trădarea lui Iuda.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. „Iată” și „cărturari” păstrează concizia și rezonanța biblică fără arhaizare excesivă; coordonarea cu „iar” face limpede schimbarea subiectului.
