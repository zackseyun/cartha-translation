source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένων αὐτῶν ἀπὸ Ἰεριχὼ ἠκολούθησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/029.yaml
  text: And as they were going out from Jericho[a], a large crowd followed him.
translation:
  language: ro
  text: Pe când ieșeau ei din Ierihon[a], o mulțime mare l-a urmat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Pe când plecau din Ierihon”.'
    reason: Alternativă lexicală pentru ἐκπορευομένων ἀπὸ, care poate accentua plecarea, nu strict ieșirea.
lexical_decisions:
- source_word: ἐκπορευομένων
  choice: Pe când ieșeau
  rationale: Participiul prezent la genitiv plural are aici valoare temporală și sugerează desfășurarea acțiunii; formularea este firească în româna actuală.
- source_word: ἀπὸ Ἰεριχὼ
  choice: din Ierihon
  rationale: Prepoziția ἀπό indică îndepărtarea de locul de plecare; în asociere cu verbul „a ieși”, româna cere în mod firesc „din Ierihon”.
- source_word: ἠκολούθησεν
  choice: a urmat
  rationale: Aoristul indicativ al lui ἀκολουθέω descrie faptul că mulțimea a mers după Isus; „a urmat” păstrează sensul direct și formularea biblică firească.
- source_word: αὐτῷ
  choice: l-
  rationale: Pronumele dativ singular se referă cel mai natural la Isus. Româna exprimă complementul indirect al verbului „a urma” prin forma clitică de acuzativ „l-”.
- source_word: ὄχλος πολύς
  choice: o mulțime mare
  rationale: Expresia indică o mulțime numeroasă; redarea este clară, actuală și păstrează corespondența transparentă dintre substantiv și adjectiv.
theological_decisions:
- issue: Referentul pronumelui singular αὐτῷ după participiul cu subiect plural
  choice: Mulțimea l-a urmat pe Isus („l-a urmat”).
  alternative: Mulțimea i-a urmat pe cei din grup („i-a urmat”).
  rationale: Textul grec trece intenționat de la pluralul „ieșeau ei” la singularul „l-a urmat”, iar contextul îl indică pe Isus drept referent. Traducerea păstrează această schimbare fără a o uniformiza.
translation_notes:
  register: Română standard modernă, clară și demnă. Ordinea propoziției și schimbarea de la plural la singular urmăresc îndeaproape greaca, fără rigiditate inutilă.
