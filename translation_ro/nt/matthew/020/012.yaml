id: MAT.20.12
reference: Matthew 20:12
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὗτοι οἱ ἔσχατοι μίαν ὥραν ἐποίησαν, καὶ ἴσους ⸂αὐτοὺς ἡμῖν⸃ ἐποίησας τοῖς βαστάσασι τὸ βάρος τῆς ἡμέρας καὶ τὸν καύσωνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/012.yaml
  text: saying[a], ‘These last worked one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’
translation:
  language: ro
  text: 'spunând: „Aceștia din urmă au lucrat o singură oră, iar tu i-ai făcut egali cu noi[a], care am îndurat povara zilei și arșița.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „i-ai tratat la fel ca pe noi”.'
    reason: Alternativă lexicală pentru construcția ἴσους … ἐποίησας, care poate descrie atât faptul de a-i face egali, cât și tratarea lor ca egali.
lexical_decisions:
- source_word: λέγοντες
  choice: spunând
  rationale: Păstrează valoarea participiului prezent, legat sintactic de acțiunea din versetul precedent.
- source_word: Οὗτοι οἱ ἔσχατοι
  choice: Aceștia din urmă
  rationale: Redă concis și firesc referirea contrastivă la lucrătorii angajați ultimii.
- source_word: μίαν ὥραν ἐποίησαν
  choice: au lucrat o singură oră
  rationale: În această construcție, ποιέω cu o durată indică timpul lucrat; formularea românească este clară și idiomatică.
- source_word: ἴσους αὐτοὺς ἡμῖν ἐποίησας
  choice: i-ai făcut egali cu noi
  rationale: Păstrează direct construcția și forța plângerii, fără să introducă explicit o judecată despre nedreptate.
- source_word: τοῖς βαστάσασι τὸ βάρος τῆς ἡμέρας
  choice: care am îndurat povara zilei
  rationale: „Am îndurat” exprimă aici suportarea muncii grele, iar „povara” păstrează imaginea lui βάρος.
- source_word: τὸν καύσωνα
  choice: arșița
  rationale: Termenul românesc redă natural căldura puternică și apăsătoare indicată de καύσων.
theological_decisions:
- issue: Plângerea lucrătorilor despre egalitate și dreptate
  choice: Redarea directă a protestului, fără calificarea purtării stăpânului drept nedreaptă
  alternative: O formulare interpretativă precum „ne-ai tratat pe nedrept, ca și cum am fi fost egali”
  rationale: Textul relatează perspectiva lucrătorilor din parabolă, fără să rezolve în acest verset tensiunea teologică privitoare la dreptate și generozitate.
translation_notes:
  register: Română standard modernă, cu un ton demn și accesibil. Formularea păstrează curgerea participială a originalului și intensitatea plângerii, evitând arhaismele și adaosurile interpretative.
