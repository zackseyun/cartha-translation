base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/007.yaml
  text: They said to him[a], “Because no one has hired us.” He says to them, “You also go into the vineyard.”
translation:
  language: ro
  text: 'Ei i-au răspuns[a]: „Pentru că nimeni nu ne-a angajat.” El le-a zis: „Duceți-vă și voi în vie.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'În greacă, verbele redate prin „i-au răspuns” și „le-a zis” sunt la prezentul istoric; se poate traduce și: „Ei îi spun... El le spune”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: Ei i-au răspuns
  rationale: Prezentul istoric grecesc este redat prin perfectul compus, firesc în narațiunea românească; verbul „a răspunde” exprimă natural replica la întrebarea din context.
- source_word: Ὅτι
  choice: Pentru că
  rationale: Conjuncția introduce motivul pentru care oamenii se află încă acolo și este redată idiomatic prin „Pentru că”.
- source_word: οὐδεὶς
  choice: nimeni
  rationale: Echivalentul românesc direct și standard pentru negația referitoare la persoane.
- source_word: ἐμισθώσατο
  choice: nu ne-a angajat
  rationale: Verbul desemnează angajarea unor lucrători contra plată; perfectul compus exprimă firesc faptul că până atunci nu îi angajase nimeni.
- source_word: λέγει
  choice: El le-a zis
  rationale: Prezentul istoric este redat la trecut pentru coerență și naturalețe narativă în română.
- source_word: Ὑπάγετε
  choice: Duceți-vă
  rationale: Imperativul exprimă o poruncă simplă de deplasare spre locul de muncă; „Duceți-vă” este natural în acest context.
- source_word: καὶ ὑμεῖς
  choice: și voi
  rationale: 'Păstrează accentul incluziv: și acest grup este trimis, asemenea celor angajate mai devreme.'
- source_word: ἀμπελῶνα
  choice: vie
  rationale: „Vie” este echivalentul românesc standard, concis și natural pentru o plantație de viță-de-vie.
