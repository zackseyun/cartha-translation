  text: ⸂Καὶ ἀναβαίνων ὁ⸃ Ἰησοῦς εἰς Ἱεροσόλυμα παρέλαβεν τοὺς δώδεκα ⸀μαθητὰς κατ’ ἰδίαν, ⸂καὶ ἐν τῇ ὁδῷ⸃ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/017.yaml
  text: And as Jesus was going up to Jerusalem, he took the twelve disciples aside by themselves, and on the way he said to them,
translation:
  language: ro
  text: 'În timp ce Isus urca spre Ierusalim, i-a luat deoparte pe cei doisprezece ucenici și, pe drum, le-a spus:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνων
  choice: În timp ce ... urca
  rationale: Redă participiul prezent ca acțiune contemporană cu verbul principal și păstrează ideea urcării geografice și convenționale spre Ierusalim.
- source_word: εἰς Ἱεροσόλυμα
  choice: spre Ierusalim
  rationale: „Spre” exprimă natural direcția deplasării în română, fără a sugera că Isus ajunsese deja în cetate.
- source_word: παρέλαβεν
  choice: i-a luat
  rationale: Păstrează sensul de a lua cu sine; împreună cu „deoparte” redă separarea grupului pentru o comunicare privată.
- source_word: τοὺς δώδεκα μαθητὰς
  choice: pe cei doisprezece ucenici
  rationale: Reprezintă explicit atât numeralul, cât și substantivul μαθητάς; „ucenici” este termenul românesc consacrat și inteligibil.
- source_word: κατ’ ἰδίαν
  choice: deoparte
  rationale: Redă idiomatic separarea de ceilalți și cadrul privat, fără redundanța mai greoaie „deoparte, numai pe ei”.
- source_word: ἐν τῇ ὁδῷ
  choice: pe drum
  rationale: Formulare românească firească ce păstrează cadrul călătoriei.
- source_word: εἶπεν αὐτοῖς
  choice: le-a spus
  rationale: Redare naturală și exactă a actului vorbirii, iar două puncte lasă conținutul pentru versetul următor.
