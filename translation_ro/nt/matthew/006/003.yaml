source:
  edition: SBLGNT
  text: σοῦ δὲ ποιοῦντος ἐλεημοσύνην μὴ γνώτω ἡ ἀριστερά σου τί ποιεῖ ἡ δεξιά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/003.yaml
  text: But when you give to the needy[a], do not let your left hand know what your right hand is doing,
translation:
  language: ro
  text: Dar tu, când dai ajutor celor nevoiași[a], să nu știe mâna ta stângă ce face mâna ta dreaptă,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „când faci milostenie”; termenul grec se referă la ajutorul caritabil oferit celor săraci.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σοῦ δὲ ποιοῦντος
  choice: Dar tu, când dai
  rationale: Construcția genitivului absolut, împreună cu δέ, exprimă contrastul cu practica descrisă anterior. Formularea românească este firească, iar verbul „dai” redă contextual expresia ποιεῖν ἐλεημοσύνην.
- source_word: ἐλεημοσύνην
  choice: ajutor celor nevoiași
  rationale: Termenul desemnează milostenia sau ajutorul material oferit celor săraci. Această formulare este clară în româna actuală, fără a pierde sensul caritabil al termenului grec.
- source_word: μὴ γνώτω
  choice: să nu știe
  rationale: Redă natural imperativul negativ la persoana a treia și păstrează personificarea expresivă a mâinii.
- source_word: ἡ ἀριστερά σου
  choice: mâna ta stângă
  rationale: Traducerea directă păstrează imaginea și paralelismul memorabil al enunțului.
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: ce face mâna ta dreaptă
  rationale: Prezentul „face” este idiomatic în română și păstrează caracterul viu al acțiunii fără a adăuga o interpretare.
theological_decisions:
- issue: Sensul imaginii despre mâna stângă și mâna dreaptă
  choice: Păstrarea metaforei ca îndemn la discreție radicală și la lipsa ostentației în ajutorarea altora.
  alternative: Parafrazarea ca îndemn general la smerenie sau interpretarea ca interdicție absolută a oricărui ajutor oferit în public.
  rationale: Textul folosește personificare și hiperbolă. Păstrarea imaginii lasă intactă forța enunțului și nu transformă traducerea într-o regulă doctrinară mai strictă decât exprimă versetul.
translation_notes:
  register: Română standard modernă, clară și demnă. „Milostenie” este păstrat în notă ca echivalent tradițional, iar textul principal folosește formularea mai accesibilă „ajutor celor nevoiași”. Pronumele explicit „tu” susține contrastul marcat de construcția grecească.
