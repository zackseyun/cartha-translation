source:
  edition: SBLGNT
  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: ro
  text: 'Iar când postiți, nu vă faceți posomorâți ca ipocriții, căci ei își schimonosesc fețele ca să pară oamenilor că postesc. Adevărat vă spun: și-au primit răsplata pe deplin.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν δὲ νηστεύητε
  choice: Iar când postiți
  rationale: Ὅταν introduce o situație temporală repetabilă sau ori de câte ori apare; în româna firească, „când postiți” exprimă adecvat practica generală, iar „iar” leagă învățătura de secțiunile paralele anterioare.
- source_word: μὴ γίνεσθε ... σκυθρωποί
  choice: nu vă faceți posomorâți
  rationale: Păstrează nuanța dinamică a lui γίνεσθε, de asumare a unei înfățișări, iar „posomorâți” descrie clar expresia voit tristă.
- source_word: ὡς οἱ ὑποκριταὶ
  choice: ca ipocriții
  rationale: Redare comparativă directă și idiomatică în româna contemporană.
- source_word: ἀφανίζουσιν ... τὰ πρόσωπα αὐτῶν
  choice: își schimonosesc fețele
  rationale: În context, verbul indică alterarea voită a înfățișării pentru a părea afectați de post; „schimonosesc” păstrează imaginea concretă și forța expresiei.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: ca să le arate oamenilor că postesc
  rationale: Exprimă natural scopul și faptul că ei urmăresc să fie recunoscuți de oameni ca postind. „Oamenilor” redă sensul generic al lui ἀνθρώποις.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Adevărat vă spun
  rationale: Formulă românească solemnă și limpede care păstrează caracterul autoritativ al declarației.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: și-au primit răsplata pe deplin
  rationale: ἀπέχω este aici un idiom comercial pentru primirea integrală a plății, cu implicația că nu mai rămâne nimic de primit.
theological_decisions:
- issue: Sensul generic al lui τοῖς ἀνθρώποις
  choice: oamenilor
  alternative: bărbaților
  rationale: În acest context, ἄνθρωποι îi desemnează pe oameni în general, nu exclusiv persoane de sex masculin; „oamenilor” păstrează fidel referința fără a restrânge sensul.
- issue: Forța idiomatică a expresiei ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: și-au primit răsplata pe deplin
  alternative: își au răsplata
  rationale: Redarea explicită a ideii de plată primită integral păstrează avertismentul că aprecierea oamenilor constituie întreaga lor răsplată, fără a adăuga o concluzie doctrinară dincolo de text.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Formularea evită arhaismele, păstrează paralelismul discursului și redă direct contrastul dintre evlavia afișată și răsplata deja primită.
