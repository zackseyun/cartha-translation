id: MAT.6.28
reference: Matthew 6:28
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ περὶ ἐνδύματος τί μεριμνᾶτε; καταμάθετε τὰ κρίνα τοῦ ἀγροῦ πῶς ⸂αὐξάνουσιν· οὐ κοπιῶσιν οὐδὲ νήθουσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/028.yaml
  text: 'And why are you anxious about clothing? Consider the lilies of the field[a], how they grow: they do not labor[c][b], nor do they spin.'
translation:
  language: ro
  text: 'Și de ce vă îngrijorați cu privire la îmbrăcăminte? Priviți cu atenție crinii câmpului[a], cum cresc: nu trudesc, nici nu torc.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Termenul grecesc redat prin „crinii” poate fi înțeles mai larg ca referindu-se la florile sălbatice.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: cu privire la îmbrăcăminte
  rationale: ἔνδυμα denumește un veșmânt sau îmbrăcămintea; aici singularul are sens colectiv și privește necesarul de îmbrăcat în general.
- source_word: τί μεριμνᾶτε
  choice: de ce vă îngrijorați
  rationale: În context, μεριμνάω exprimă preocuparea neliniștită. Formularea este firească în româna actuală și păstrează forța întrebării.
- source_word: καταμάθετε
  choice: priviți cu atenție
  rationale: Imperativul cere observare atentă, care conduce la înțelegere; formularea redă mai mult decât simplul fapt de a vedea, fără a deveni tehnică.
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: crinii câmpului
  rationale: κρίνα înseamnă în primul rând „crini”, iar genitivul τοῦ ἀγροῦ indică plantele care cresc pe câmp; sensul posibil mai larg este păstrat în nota [a].
- source_word: πῶς αὐξάνουσιν
  choice: cum cresc
  rationale: αὐξάνω descrie aici creșterea naturală a plantelor; „cresc” este echivalentul direct și firesc.
- source_word: οὐ κοπιῶσιν
  choice: nu trudesc
  rationale: κοπιάω indică muncă obositoare sau trudă. „Nu trudesc” păstrează intensitatea verbului și paralelismul concis.
- source_word: οὐδὲ νήθουσιν
  choice: nici nu torc
  rationale: νήθω înseamnă a toarce fir; verbul românesc „a toarce” este suficient și păstrează concizia textului.
theological_decisions:
- issue: Sensul lui μεριμνάω în învățătura lui Isus despre purtarea de grijă
  choice: vă îngrijorați
  alternative: vă faceți griji
  rationale: Textul vizează neliniștea legată de nevoile materiale, nu simpla preocupare responsabilă. „Vă îngrijorați” redă această tensiune fără a absolutiza orice preocupare.
- issue: Identificarea plantelor numite κρίνα
  choice: crinii
  alternative: florile sălbatice
  rationale: Sensul lexical direct este păstrat în text, fără a exclude posibilitatea ca termenul să fi fost folosit mai larg pentru flori de câmp; alternativa apare în nota [a].
translation_notes:
  register: Română standard modernă, demnă și accesibilă. „Îmbrăcăminte” păstrează sensul colectiv al singularului grecesc, iar „priviți cu atenție” redă caracterul atent al observației cerute de imperativ.
