id: MAT.6.10
reference: Matthew 6:10
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου, ὡς ἐν οὐρανῷ καὶ ⸀ἐπὶ γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: ro
  text: Să vină Împărăția Ta; să se facă voia Ta[a], precum în cer, așa și pe pământ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, posibil: „Să vină Împărăția Ta; să se facă voia Ta, precum în cer, așa și pe pământ”, înțelegând că expresia „precum în cer, așa și pe pământ” se referă la ambele cereri.'
    reason: Lectură alternativă privind întinderea sintactică a expresiei comparative.
lexical_decisions:
- source_word: ἐλθέτω
  choice: Să vină
  rationale: Imperativul aorist activ, persoana a treia singular, exprimă aici o cerere adresată lui Dumnezeu; construcția românească cu conjunctivul redă firesc această forță în limbajul rugăciunii.
- source_word: βασιλεία
  choice: Împărăția
  rationale: Termenul poate desemna atât domnia, cât și împărăția. „Împărăția” este formularea consacrată și firească în contextul matean, fără a exclude sensul domniei regale a lui Dumnezeu.
- source_word: γενηθήτω
  choice: să se facă
  rationale: Imperativul aorist pasiv al lui γίνομαι, împreună cu θέλημα, are sensul idiomatic ca voia lui Dumnezeu să fie împlinită sau să devină realitate; „să se facă” este natural și fidel.
- source_word: θέλημα
  choice: voia
  rationale: „Voia” păstrează sensul a ceea ce Dumnezeu voiește, dorește sau intenționează, fără a restrânge termenul la simpla dorință ori la un plan abstract.
- source_word: ὡς
  choice: precum
  rationale: Introduce comparația într-o formă demnă și naturală în româna actuală, păstrând deschisă întinderea sintactică a comparației.
- source_word: ἐν οὐρανῷ
  choice: în cer
  rationale: Dativul singular cu ἐν este redat direct și idiomatic prin „în cer”, ca sferă cerească aflată în contrast cu pământul.
- source_word: ἐπὶ γῆς
  choice: pe pământ
  rationale: ἐπί cu genitivul are aici sens local, iar „pe pământ” este echivalentul românesc firesc.
- source_word: καὶ
  choice: așa și
  rationale: În structura comparativă ὡς... καί, formularea românească „precum..., așa și...” face limpede paralelismul fără a adăuga conținut.
theological_decisions:
- issue: Întinderea expresiei comparative ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς
  choice: În textul principal, expresia este legată cel mai direct de cererea „să se facă voia Ta”.
  alternative: 'Expresia „precum în cer, așa și pe pământ” poate fi înțeleasă ca referindu-se la ambele cereri precedente: venirea Împărăției și împlinirea voii lui Dumnezeu.'
  rationale: Punctuația edițiilor grecești moderne este editorială, iar sintaxa permite discutarea întinderii expresiei. Legarea de cererea imediat precedentă este cea mai firească gramatical, dar posibilitatea ca expresia să privească ambele cereri este păstrată în nota de subsol.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Majusculele reverențiale din „Împărăția Ta” și „voia Ta” mențin coerența stilului de rugăciune; formularea evită atât arhaismul excesiv, cât și parafraza doctrinară.
