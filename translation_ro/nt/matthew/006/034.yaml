id: MAT.6.34
reference: Matthew 6:34
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: ro
  text: Așadar, nu vă îngrijorați pentru ziua de mâine, căci ziua de mâine se va îngrijora de ea însăși. Fiecărei zile îi ajunge necazul ei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Fiecărei zile îi ajunge răul ei.” Cuvântul grecesc poate însemna „rău”, dar aici se referă probabil la necazul sau greutatea zilei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεριμνήσητε
  choice: nu vă îngrijorați
  rationale: În contextul din Matei 6:25–34, verbul exprimă preocuparea neliniștită. Formularea este firească în româna actuală și păstrează legătura lexicală cu repetarea verbului în propoziția următoare.
- source_word: εἰς τὴν αὔριον
  choice: pentru ziua de mâine
  rationale: Prepoziția indică aici obiectul spre care se îndreaptă îngrijorarea. Expresia românească redă clar referirea la viitor.
- source_word: ἡ αὔριον
  choice: ziua de mâine
  rationale: Substantivizarea lui αὔριον și articolul susțin personificarea zilei viitoare; româna o redă natural prin „ziua de mâine”.
- source_word: μεριμνήσει αὑτῆς
  choice: se va îngrijora de ea însăși
  rationale: Păstrează personificarea, reflexivul și repetarea aceluiași verb din prima propoziție, fără a elimina tensiunea retorică a afirmației.
- source_word: ἀρκετὸν τῇ ἡμέρᾳ
  choice: Fiecărei zile îi ajunge
  rationale: Construcția cu dativ este redată idiomatic, păstrând ideea distributivă și sensul de suficiență al adjectivului ἀρκετόν.
- source_word: ἡ κακία αὐτῆς
  choice: necazul ei
  rationale: În context, κακία desemnează cel mai probabil răul trăit ca necaz sau greutate, nu neapărat răutatea morală. Pronumele posesiv păstrează raportarea la fiecare zi.
theological_decisions:
- issue: Sensul lui κακία în maxima despre îngrijorare
  choice: necazul
  alternative: răul
  rationale: Contextul tratează povara și îngrijorările fiecărei zile, astfel că „necazul” comunică sensul contextual probabil. Alternativa lexicală „răul” rămâne consemnată în notă pentru a păstra amplitudinea termenului grec.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. „Așadar” marchează legătura concluzivă, iar repetarea lui „a se îngrijora” păstrează jocul retoric al originalului.
