id: MAT.6.27
reference: Matthew 6:27
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται προσθεῖναι ἐπὶ τὴν ἡλικίαν αὐτοῦ πῆχυν ἕνα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/027.yaml
  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: ro
  text: Și cine dintre voi, îngrijorându-se, poate adăuga un singur cot la durata vieții sale?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „la statura sa”. Cuvântul grecesc poate însemna fie „durata vieții/vârsta”, fie „statura”.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: Și cine dintre voi
  rationale: 'Construcția este o întrebare idiomatică: „cine dintre voi”. δέ are aici o funcție de legătură ușoară, redată firesc prin „Și”, fără a introduce un contrast puternic.'
- source_word: μεριμνῶν
  choice: îngrijorându-se
  rationale: Participiul exprimă starea sau mijlocul prin care cineva ar încerca zadarnic să obțină rezultatul; formularea românească păstrează legătura cu tema îngrijorării din context.
- source_word: δύναται
  choice: poate
  rationale: Redă direct și natural ideea de capacitate exprimată de δύναμαι.
- source_word: προσθεῖναι
  choice: adăuga
  rationale: Păstrează imaginea concretă a adăugării unei măsuri la ceva deja existent.
- source_word: ἐπὶ τὴν ἡλικίαν αὐτοῦ
  choice: la durata vieții sale
  rationale: ἡλικία poate desemna vârsta/durata vieții sau statura. În contextul grijii pentru viață, „durata vieții” este lectura principală potrivită, iar sensul „statură” este păstrat în nota de subsol.
- source_word: πῆχυν ἕνα
  choice: un singur cot
  rationale: πῆχυς este o unitate de lungime, „cot”. Păstrarea unității conservă imaginea metaforică, iar „singur” redă accentul numeralului ἕνα.
- source_word: αὐτοῦ
  choice: sale
  rationale: Pronumele posesiv se raportează la persoana generică din întrebare și este redat natural în română prin „sale”.
theological_decisions:
- issue: Sensul lui ἡλικία în această afirmație
  choice: durata vieții
  alternative: statura
  rationale: Ambele sensuri sunt lexical posibile. „Durata vieții” se potrivește argumentului despre grija lui Dumnezeu pentru viață, deși folosirea unei unități de lungime creează intenționat o imagine metaforică. Lectura tradițională „statura” nu este eliminată, ci este indicată explicit în nota de subsol.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Cot” păstrează unitatea antică și caracterul concret al imaginii, fără conversie interpretativă în unități moderne.
