id: MAT.6.14
reference: Matthew 6:14
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀφῆτε τοῖς ἀνθρώποις τὰ παραπτώματα αὐτῶν, ἀφήσει καὶ ὑμῖν ὁ πατὴρ ὑμῶν ὁ οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/014.yaml
  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: ro
  text: Căci, dacă le iertați oamenilor greșelile lor[a], Tatăl vostru ceresc[b] vă va ierta și vouă.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „abaterile”, „ofensele” ori „faptele lor rele”. Termenul grecesc se referă la greșeli morale sau la pași greșiți.
    reason: lexical_alternative
  - marker: b
    text: 'Literal: „Tatăl vostru, Cel ceresc”; tradițional: „Tatăl vostru din ceruri”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Căci, dacă
  rationale: „Căci” păstrează rolul explicativ al lui γάρ și legătura cu rugăciunea precedentă, iar „dacă” redă firesc propoziția condițională introdusă de ἐάν cu conjunctivul aorist.
- source_word: ἀφῆτε
  choice: iertați
  rationale: În contextul unei greșeli morale săvârșite față de cineva, ἀφίημι înseamnă „a ierta”. Același verb românesc este păstrat pentru ἀφήσει.
- source_word: τοῖς ἀνθρώποις
  choice: oamenilor
  rationale: Termenul se referă generic la ființe umane, nu numai la bărbați; „oamenilor” este echivalentul românesc firesc și incluziv.
- source_word: τὰ παραπτώματα αὐτῶν
  choice: greșelile lor
  rationale: παράπτωμα denumește o abatere, un pas greșit sau o ofensă morală. „Greșelile” este clar în româna actuală și păstrează dimensiunea moral-relațională; „lor” redă explicit pronumele αὐτῶν.
- source_word: ἀφήσει καὶ ὑμῖν
  choice: vă va ierta și vouă
  rationale: Viitorul lui ἀφίημι este redat prin același verb ca în prima propoziție, iar „și vouă” păstrează corespondența exprimată de καί și dativul ὑμῖν.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Tatăl vostru ceresc
  rationale: Redare naturală și demnă a construcției grecești cu adjectiv atributiv, păstrând desemnarea caracteristică Evangheliei după Matei.
theological_decisions:
- issue: Relația condițională dintre iertarea acordată de oameni și iertarea lui Dumnezeu
  choice: Afirmația este redată direct ca o condiție reală.
  alternative: Interpretarea condiției fie ca merit prin care se câștigă iertarea divină, fie numai ca dovadă a unei iertări divine deja primite.
  rationale: Textul grecesc formulează simplu condiția și nu explică aici natura ei teologică. Traducerea păstrează această tensiune fără a introduce o interpretare confesională.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea „le iertați oamenilor greșelile lor” păstrează obiectul moral exprimat în greacă, iar „vă va ierta și vouă” reproduce paralelismul verbal și reciprocitatea fără a adăuga o explicație doctrinară.
