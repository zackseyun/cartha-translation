id: MAT.6.2
reference: Matthew 6:2
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: ro
  text: 'Așadar, când dai milostenie[a], să nu suni din trâmbiță înaintea ta[b], cum fac ipocriții în sinagogi și pe străzi, ca să fie slăviți de oameni[c]. Adevărat vă spun: și-au primit pe deplin răsplata[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „când îi ajuți pe cei nevoiași” ori „când faci fapte de milostenie”. Expresia grecească se referă la ajutorul caritabil.
    reason: lexical_alternative
  - marker: b
    text: Sau „să nu anunți aceasta cu trâmbița”. Imaginea poate fi hiperbolică sau metaforică, însă greaca spune literal „să nu suni din trâmbiță”.
    reason: lexical_alternative
  - marker: c
    text: Sau „ca să fie lăudați” ori „cinstiți de oameni”. Verbul grecesc înseamnă literal „a slăvi”.
    reason: lexical_alternative
  - marker: d
    text: 'Expresia reflectă un idiom comercial: ei au primit deja întreaga răsplată pe care urmează să o aibă.'
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Așadar, când
  rationale: „Așadar” păstrează legătura inferențială cu învățătura precedentă, iar „când” redă natural în română situația generală introdusă de ὅταν cu conjunctivul.
- source_word: ποιῇς ἐλεημοσύνην
  choice: dai milostenie
  rationale: Expresia desemnează ajutorul material oferit celor nevoiași. Formularea este concisă, consacrată și încă inteligibilă în româna actuală.
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: să nu trâmbițezi înaintea ta
  rationale: Păstrează imaginea explicită și posibil hiperbolică a trompetei, precum și sensul spațial al lui ἔμπροσθέν σου, fără a transforma imaginea într-o simplă explicație.
- source_word: οἱ ὑποκριταὶ
  choice: ipocriții
  rationale: Echivalentul românesc consacrat redă persoanele care își afișează evlavia pentru a impresiona.
- source_word: ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις
  choice: în sinagogi și pe străzi
  rationale: „Sinagogi” identifică exact cadrul iudaic, iar „pe străzi” este formularea românească firească pentru spațiile publice avute în vedere.
- source_word: ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: ca să fie slăviți de oameni
  rationale: Păstrează construcția de scop și forța verbului δοξάζω, fără a o reduce la simplul sens de „lăudați”; „oameni” are aici sens generic.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Adevărat vă spun
  rationale: Redă natural și solemn formula autoritativă a lui Isus, păstrând atât valoarea lui ἀμήν, cât și caracterul direct al verbului λέγω.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: și-au primit pe deplin răsplata
  rationale: Verbul ἀπέχω are aici nuanța comercială de primire integrală; formularea arată că aceasta este întreaga răsplată pe care o vor avea.
theological_decisions:
- issue: Forța lui δοξασθῶσιν
  choice: să fie slăviți de oameni
  alternative: să fie lăudați / cinstiți de oameni
  rationale: „Slăviți” păstrează termenul mai puternic din greacă și tensiunea retorică dintre recunoașterea omenească și răsplata lui Dumnezeu din context.
- issue: Sensul generic al lui ἀνθρώπων
  choice: oameni
  alternative: ceilalți / bărbați
  rationale: Referința îi cuprinde generic pe observatorii umani, nu numai pe cei de sex masculin.
- issue: Caracterul răsplății exprimate de ἀπέχουσιν
  choice: și-au primit pe deplin răsplata
  alternative: își au răsplata
  rationale: Este păstrată nuanța că aprobarea publică reprezintă plata lor integrală, fără a adăuga explicit o concluzie doctrinară dincolo de idiomul comercial.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. S-a păstrat imaginea vie a trâmbiței și termenul mai puternic „slăviți”, iar idiomul comercial final a fost redat explicit și firesc.
