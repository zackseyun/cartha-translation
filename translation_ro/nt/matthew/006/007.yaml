  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: ro
  text: Iar când vă rugați, nu înșirați vorbe goale[a], ca păgânii[b], căci ei cred că vor fi ascultați din pricina mulțimii cuvintelor lor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „nu bolborosiți” ori „nu folosiți repetări lipsite de sens”. Verbul grecesc este rar și se referă probabil la vorbirea goală, mecanică sau excesivă, nu la orice repetare sinceră în rugăciune.
    reason: lexical_alternative
  - marker: b
    text: Sau „cei dintre neamuri”. Termenul grecesc se referă literal la neamurile din afara poporului legământului; în acest context poate fi redat prin „păgânii”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσευχόμενοι δὲ
  choice: Iar când vă rugați
  rationale: Participiul introduce împrejurarea în care se aplică porunca, iar δέ continuă învățătura fără a marca un contrast puternic. Formularea este firească în româna actuală.
- source_word: μὴ βατταλογήσητε
  choice: nu înșirați vorbe goale
  rationale: Verbul rar βατταλογέω pare să condamne vorbirea goală, mecanică ori excesivă. Redarea păstrează atât ideea lipsei de conținut, cât și pe cea a acumulării de cuvinte, fără să sugereze că orice repetare sinceră este interzisă.
- source_word: ὥσπερ οἱ ἐθνικοί
  choice: ca cei dintre neamuri
  rationale: În contextul iudaic, termenul îi desemnează pe cei din afara poporului legământului. „Cei dintre neamuri” păstrează această dimensiune mai bine decât redarea interpretativă „păgânii”.
- source_word: δοκοῦσιν
  choice: ei cred
  rationale: Verbul exprimă presupunerea lor cu privire la eficiența rugăciunii; „cred” este clar și natural.
- source_word: ἐν τῇ πολυλογίᾳ αὐτῶν
  choice: din pricina mulțimii cuvintelor lor
  rationale: Expresia indică temeiul greșit pe care ei se așteaptă să fie ascultați. Formularea redă sensul cauzal și păstrează referirea explicită la vorbirea abundentă.
- source_word: εἰσακουσθήσονται
  choice: vor fi ascultați
  rationale: Pasivul înseamnă a primi ascultare favorabilă. „Vor fi ascultați” păstrează formularea fără a introduce explicit ideea mai puternică de a primi răspuns.
theological_decisions:
- issue: Dacă Isus interzice orice repetare în rugăciune sau vorbirea goală și excesivă
  choice: Textul principal spune „nu înșirați vorbe goale”, prezentând interdicția ca vizând verbalismul gol, folosit ca mijloc de a obține atenția divină.
  alternative: „nu bolborosiți” sau „nu folosiți repetări lipsite de sens”
  rationale: Verbul grecesc este rar, iar sensul său exact nu este pe deplin sigur. Redarea aleasă nu transformă versetul într-o condamnare a oricărei rugăciuni repetate și păstrează accentul contextual asupra mulțimii de cuvinte considerate eficiente în sine.
- issue: Sensul lui οἱ ἐθνικοί în acest context
  choice: „cei dintre neamuri”
  alternative: „păgânii”
  rationale: Varianta principală păstrează referința la cei din afara poporului legământului, în timp ce nota oferă sensul religios contextual posibil fără a-l impune în text.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. „A înșira vorbe goale” este idiomatic și clar, iar „cei dintre neamuri” păstrează coloratura istorico-biblică; sensul alternativ mai curent, „păgânii”, este consemnat în notă.
