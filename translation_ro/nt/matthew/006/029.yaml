id: MAT.6.29
reference: Matthew 6:29
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: ro
  text: Dar vă spun că nici măcar Solomon, în toată splendoarea lui, nu s-a îmbrăcat ca unul dintre aceștia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Dar vă spun
  rationale: Redă firesc construcția cu dativul ὑμῖν, iar „dar” exprimă contrastul ușor marcat de δέ în context.
- source_word: οὐδὲ
  choice: nici măcar
  rationale: 'Păstrează accentul negației: până și Solomon rămâne sub nivelul comparației.'
- source_word: Σολομὼν
  choice: Solomon
  rationale: Folosește forma consacrată a numelui în română.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: în toată splendoarea lui
  rationale: În acest context, δόξα denumește măreția și fastul regal; „splendoarea” comunică limpede sensul fără a sugera în mod inutil gloria divină.
- source_word: περιεβάλετο
  choice: s-a îmbrăcat
  rationale: Forma medio-pasivă este redată idiomatic în română și păstrează imaginea veșmântului din comparația cu florile.
- source_word: ὡς ἓν τούτων
  choice: ca unul dintre aceștia
  rationale: Păstrează comparația și singularul ἓν, cu referire contextuală la crinii menționați anterior.
theological_decisions:
- issue: Sensul lui δόξα cu referire la Solomon
  choice: „splendoarea”, cu sens de fast și măreție regală pământească
  alternative: „slava”
  rationale: Contextul compară podoaba regală a lui Solomon cu felul în care Dumnezeu îmbracă florile. „Splendoarea” evită să transfere aici conotații proprii slavei divine.
- issue: Valoarea formei περιεβάλετο
  choice: „s-a îmbrăcat”
  alternative: „a fost îmbrăcat”
  rationale: Ambele sunt posibile în context; reflexivul este mai natural în româna actuală și nu afirmă cine a realizat îmbrăcarea.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formularea păstrează contrastul, intensificarea și imaginea vestimentară a textului grec.
