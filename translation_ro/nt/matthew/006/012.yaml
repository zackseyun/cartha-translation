  text: καὶ ἄφες ἡμῖν τὰ ὀφειλήματα ἡμῶν, ὡς καὶ ἡμεῖς ⸀ἀφήκαμεν τοῖς ὀφειλέταις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/012.yaml
  text: And forgive us our debts[b][a], as we also have forgiven our debtors.
translation:
  language: ro
  text: Și iartă-ne datoriile noastre[a], după cum și noi am iertat datornicilor noștri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „greșelile”; mai literal, „datoriile”. Greaca păstrează metafora a ceea ce este datorat, referindu-se aici la păcate sau ofense.
    reason: lexical_alternative
  - marker: b
    text: Verbul grecesc este la aorist și poate fi redat și „am iertat”; perfectul compus exprimă firesc în română o acțiune împlinită. Complementul direct („datoriile lor”) este subînțeles, ca în greacă.
    reason: grammatical_clarification
lexical_decisions:
- source_word: ἄφες
  choice: iartă-ne
  rationale: Imperativul aorist al lui ἀφίημι, în contextul rugăciunii și al datoriilor morale, este redat firesc prin „iartă-ne”, nu prin sensul mai general „eliberează-ne”.
- source_word: τὰ ὀφειλήματα ἡμῶν
  choice: datoriile noastre
  rationale: „Datoriile” păstrează sensul propriu și metafora greacă a lucrurilor datorate, aici cu referire la păcate sau greșeli morale.
- source_word: ὡς
  choice: după cum
  rationale: Redă clar raportul de comparație fără a transforma formularea într-o explicație cauzală.
- source_word: καὶ ἡμεῖς
  choice: și noi
  rationale: Păstrează particula aditivă καί și pronumele explicit, care evidențiază partea celor ce se roagă.
- source_word: ἀφήκαμεν
  choice: le-am iertat
  rationale: Perfectul compus românesc redă natural aoristul indicativ ca acțiune împlinită; pronumele „le” reia firesc datoriile implicite ale datornicilor.
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: datornicilor noștri
  rationale: „Datornicilor” păstrează legătura lexicală cu „datoriile” și coerența metaforei din textul grecesc.
theological_decisions:
- issue: Metafora morală a datoriilor
  choice: Păstrarea termenilor înrudiți „datoriile” și „datornicilor” în textul principal.
  alternative: „greșelile” și „cei care ne-au greșit”
  rationale: Greaca folosește în mod deliberat limbajul datoriei. Traducerea păstrează metafora și lasă nota să indice sensul moral, fără a o înlocui cu o interpretare explicită.
- issue: Relația exprimată prin ὡς
  choice: „după cum”, ca formulă comparativă
  alternative: „pentru că” sau „cu condiția că”
  rationale: Textul stabilește o corespondență între iertarea cerută și iertarea oferită de cei ce se roagă, dar nu explică aici în mod explicit această relație drept cauză sau condiție; tensiunea teologică este păstrată.
- issue: Valoarea temporală a lui ἀφήκαμεν
  choice: „am iertat”, prezentând acțiunea ca împlinită
  alternative: „iertăm”
  rationale: SBLGNT are aoristul ἀφήκαμεν, nu prezentul. Perfectul compus este redarea românească firească, fără a transforma forma verbală într-o afirmație despre o singură faptă izolată.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează paralelismul lexical „datorii—datornici”, iar „după cum” este natural în registrul rugăciunii fără a fi arhaic.
