id: MAT.6.31
reference: Matthew 6:31
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε λέγοντες· Τί φάγωμεν; ἤ· Τί πίωμεν; ἤ· Τί περιβαλώμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: ro
  text: 'De aceea, nu vă îngrijorați[a], zicând: „Ce vom mânca?” sau „Ce vom bea?” sau „Cu ce ne vom îmbrăca?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „nu vă neliniștiți”.'
    reason: Alternativă lexicală ce scoate mai explicit în evidență anxietatea sugerată de verbul grec.
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: De aceea, nu vă îngrijorați
  rationale: „A se îngrijora” exprimă în româna actuală preocuparea apăsătoare pentru nevoile materiale, fără a transforma interdicția într-o condamnare a chibzuinței. „De aceea” redă caracterul concluziv al lui οὖν, iar construcția negativă păstrează forța prohibitivă.
- source_word: λέγοντες
  choice: zicând
  rationale: Gerunziul redă direct participiul și introduce firesc întrebările care dau glas îngrijorării.
- source_word: Τί φάγωμεν;
  choice: Ce vom mânca?
  rationale: Întrebarea deliberativă despre asigurarea hranei este redată idiomatic prin viitorul românesc.
- source_word: Τί πίωμεν;
  choice: Ce vom bea?
  rationale: Păstrează paralelismul cu întrebarea precedentă și exprimă natural preocuparea pentru o nevoie viitoare.
- source_word: Τί περιβαλώμεθα;
  choice: Cu ce ne vom îmbrăca?
  rationale: Verbul se referă aici la îmbrăcare; formularea românească este naturală și păstrează ideea obiectului vestimentar, precum și forma reflexivă a grecei.
- source_word: ἤ ... ἤ ... ἤ
  choice: sau ... sau
  rationale: Conjuncțiile disjunctive vizibile în text leagă cele trei întrebări în succesiunea lor retorică.
theological_decisions:
- issue: Natura interdicției lui Isus cu privire la nevoile materiale
  choice: „nu vă îngrijorați”, ca interdicție a neliniștii apăsătoare
  alternative: „nu fiți preocupați” sau „nu vă faceți griji”
  rationale: Contextul vizează anxietatea privind hrana, băutura și îmbrăcămintea, nu interzicerea oricărei prevederi responsabile. Alegerea nu extinde afirmația dincolo de ceea ce susține contextul.
translation_notes:
  register: Română standard modernă, clară și demnă. „Nu vă îngrijorați” este ușor de înțeles și adecvat registrului didactic; întrebările la viitor sună firesc în vorbirea actuală. „Zicând” menține o ușoară solemnitate biblică fără arhaizare.
