id: MAT.6.18
reference: Matthew 6:18
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ ⸀κρυφαίῳ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸁κρυφαίῳ ἀποδώσει σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/018.yaml
  text: so that you may not appear to men to be fasting[a], but to your Father who is in secret[b]; and your Father who sees in secret will reward you.
translation:
  language: ro
  text: ca să nu pari că postești înaintea oamenilor, ci înaintea Tatălui tău, care este în ascuns; iar Tatăl tău, care vede în ascuns, te va răsplăti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως
  choice: ca să
  rationale: Introduce scopul și păstrează firesc valoarea telică a construcției grecești.
- source_word: μὴ φανῇς τοῖς ἀνθρώποις νηστεύων
  choice: să nu fii văzut de oameni postind
  rationale: Redarea prin pasiv este firească în română și exprimă ideea de a deveni vizibil observatorilor umani în timp ce postești, fără a reduce referința generică la bărbați.
- source_word: ἀλλὰ τῷ πατρί σου
  choice: ci de Tatăl tău
  rationale: Păstrează contrastul μὴ...ἀλλά și continuă în mod coerent construcția pasivă aleasă în prima parte.
- source_word: τῷ ἐν τῷ κρυφαίῳ
  choice: care este în ascuns
  rationale: Păstrează formularea concisă și caracterul nedeterminat al expresiei, fără a o transforma explicit într-un loc secret.
- source_word: ὁ βλέπων ἐν τῷ κρυφαίῳ
  choice: care vede în ascuns
  rationale: Urmează îndeaproape greaca și păstrează repetarea intenționată a expresiei „în ascuns”, fără adaosul interpretativ „ce se face”.
- source_word: ἀποδώσει σοι
  choice: te va răsplăti
  rationale: În contextul practicii evlavioase și al răspunsului divin, verbul exprimă recompensarea; această formulare este clară și consacrată în româna actuală.
theological_decisions:
- issue: Referința generică a lui ἀνθρώποις
  choice: oameni
  alternative: bărbați
  rationale: Contextul îi are în vedere pe observatorii umani în general, nu numai persoanele de sex masculin; „oameni” redă exact această sferă semantică în română.
- issue: Sensul expresiei ἐν τῷ κρυφαίῳ în ambele ocurențe
  choice: în ascuns
  alternative: în locul ascuns
  rationale: Aceeași redare în ambele locuri conservă legătura retorică dintre prezența nevăzută a Tatălui și vederea lui, fără a decide că textul indică neapărat un spațiu fizic.
- issue: Contrastul dintre observatorii umani și Tatăl
  choice: să nu fii văzut de oameni postind, ci de Tatăl tău
  alternative: să nu te arăți oamenilor că postești, ci Tatălui tău
  rationale: Construcția pasivă redă natural în română ideea apariției înaintea unui observator și păstrează contrastul, fără a sugera că postul însuși trebuie ascuns în mod absolut de orice om.
translation_notes:
  register: Română literară modernă, clară și demnă. Formularea evită atât rigiditatea unui calc sintactic, cât și explicitările care ar elimina ambiguitatea expresiei „în ascuns”.
