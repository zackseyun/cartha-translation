review_pass:
  verdict: revise
  source_fidelity: Textul redă corect contrastul adversativ, imperativul de acumulare pentru beneficiul propriu, pluralul „comori”, locativul „în cer”, precum și cele două amenințări la adresa bunurilor. „Degradarea” păstrează în mod legitim sfera mai largă, disputată, a lui βρῶσις, iar nota oferă alternativa tradițională „rugina”. Pentru διορύσσουσιν este necesară o formulare românească mai explicită decât „sparg”, fără a pierde imaginea literală păstrată în notă.
  naturalness: „Adunați-vă comori” este inteligibil, dar „strângeți-vă comori” este mai idiomatic pentru acumularea de bunuri. „Hoții nu sparg” rămâne eliptic în româna standard, deoarece nu precizează ce anume sparg; „nu pătrund prin efracție” redă clar și natural sensul contextual.
  terminology: „Comori în cer” păstrează metafora fără interpretare doctrinară. „Molia”, „degradarea”, „hoții” și „fură” sunt potrivite pentru registrul standard modern. Nota despre βρῶσις menține alternativa „rugina”, iar cea despre διορύσσω explică sensul literal și contextul construcțiilor cu pereți ce puteau fi străpunși.
  issues:
  - severity: low
    issue: „Adunați-vă comori” este mai puțin idiomatic decât „strângeți-vă comori”.
    rationale: Ambele pot reda θησαυρίζετε, însă „a strânge comori” este colocarea românească mai firească pentru ideea de a acumula sau a pune deoparte bunuri.
  - severity: medium
    issue: „Hoții nu sparg” este prea eliptic.
    rationale: διορύσσουσιν se referă la pătrunderea prin străpungerea/săparea prin peretele unei case. „Nu pătrund prin efracție” exprimă explicit acțiunea în română, iar nota păstrează detaliul literal-cultural.
  revised_text: Ci strângeți-vă comori în cer, unde nici molia, nici degradarea[a] nu le distrug și unde hoții nu pătrund prin efracție[b] și nu fură.
