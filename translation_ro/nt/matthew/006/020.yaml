id: MAT.6.20
reference: Matthew 6:20
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: ro
  text: Ci strângeți-vă comori în cer, unde nici molia, nici degradarea[a] nu le distrug și unde hoții nu pătrund prin efracție[b] și nu fură.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „rugina”. Cuvântul grecesc poate desemna, mai larg, deteriorarea sau coroziunea care consumă.
    reason: lexical_alternative
  - marker: b
    text: Literal, „sapă prin”, probabil cu referire la hoții care străpungeau pereții unei case pentru a pătrunde înăuntru.
    reason: cultural_note
lexical_decisions:
- source_word: θησαυρίζετε
  choice: adunați-vă
  rationale: Imperativul prezent cere o acțiune continuă; formularea românească este firească și păstrează ideea acumulării.
- source_word: δὲ
  choice: Ci
  rationale: Redă contrastul direct cu interdicția din versetul precedent.
- source_word: ὑμῖν
  choice: -vă
  rationale: Dativul de avantaj cu sens reflexiv este redat natural prin pronumele reflexiv atașat verbului.
- source_word: θησαυροὺς
  choice: comori
  rationale: Păstrează pluralul și metafora din textul grec.
- source_word: ἐν οὐρανῷ
  choice: în cer
  rationale: Redare locativă firească în româna modernă.
- source_word: σὴς
  choice: molia
  rationale: Desemnează molia care distruge hainele și alte bunuri depozitate.
- source_word: βρῶσις
  choice: degradarea
  rationale: Termenul poate indica ceea ce consumă sau deteriorează; alegerea păstrează sensul larg, fără a-l restrânge la rugină.
- source_word: ἀφανίζει
  choice: nu le distrug
  rationale: Exprimă limpede nimicirea bunurilor; pronumele «le» clarifică referirea la comori.
- source_word: κλέπται
  choice: hoții
  rationale: Echivalentul românesc direct al substantivului plural.
- source_word: διορύσσουσιν
  choice: sparg
  rationale: Redă idiomatic pătrunderea prin forțarea ori străpungerea peretelui, iar imaginea literală este explicată în notă.
- source_word: κλέπτουσιν
  choice: fură
  rationale: Echivalent direct și natural.
theological_decisions:
- issue: Natura «comorilor în cer»
  choice: Metafora «comori în cer» este păstrată fără explicație interpretativă.
  alternative: răsplăți cerești; bogății spirituale
  rationale: Textul nu precizează aici natura comorilor; păstrarea metaforei evită impunerea unei doctrine particulare despre merit sau răsplată.
- issue: Sfera semantică a lui βρῶσις
  choice: degradarea
  alternative: rugina; coroziunea; roaderea
  rationale: Alegerea păstrează sensul general al deteriorării care consumă bunurile, fără a limita contrastul la obiecte metalice.
translation_notes:
  register: Română standard modernă, clară și demnă. Contrastul contextual este redat prin «Ci», iar metafora și ambiguitatea lexicală relevantă sunt păstrate; toate marcajele de note apar în text.
