id: MAT.6.24
reference: Matthew 6:24
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Οὐδεὶς δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
translation:
  language: ro
  text: Nimeni nu poate sluji la doi stăpâni, căci ori îl va urî pe unul și îl va iubi pe celălalt, ori se va alipi de unul și îl va disprețui pe celălalt. Nu puteți sluji lui Dumnezeu și mamonei[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „bogăției” ori „banilor”. Greaca folosește împrumutul „mamona”, care poate personifica bogățiile ca pe un stăpân rival.
    reason: Alternativă lexicală și explicarea forței retorice a împrumutului.
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Nimeni
  rationale: Redă firesc pronumele negativ universal și păstrează caracterul categoric al afirmației.
- source_word: δύναται / δύνασθε
  choice: nu poate / nu puteți
  rationale: Verbul exprimă capacitatea sau posibilitatea; repetarea lui în română păstrează accentul pus de text pe incompatibilitatea celor două slujiri.
- source_word: δυσὶ κυρίοις
  choice: la doi stăpâni
  rationale: În contextul verbului δουλεύειν, κύριοι desemnează stăpâni cărora le slujește un rob; această redare este mai limpede decât „domni” și nu sugerează aici titlul divin.
- source_word: δουλεύειν
  choice: a sluji
  rationale: „A sluji” este expresia românească firească în această formulare și, împreună cu „stăpâni”, păstrează raportul de supunere implicat de verb.
- source_word: μισήσει
  choice: îl va urî
  rationale: Păstrează forța directă a verbului și opoziția intenționată cu „îl va iubi”, fără a o atenua interpretativ la „îl va iubi mai puțin”.
- source_word: ἀγαπήσει
  choice: îl va iubi
  rationale: Redare directă, care menține antiteza cu ura.
- source_word: ἑνὸς ἀνθέξεται
  choice: se va alipi de unul
  rationale: Verbul exprimă ideea de a se ține strâns de cineva, a-i rămâne atașat sau devotat; „se va alipi” păstrează imaginea relațională și intensitatea.
- source_word: καταφρονήσει
  choice: îl va disprețui
  rationale: Redă tratarea celuilalt cu desconsiderare și corespunde contrastului cu alipirea de primul.
- source_word: θεῷ
  choice: lui Dumnezeu
  rationale: Dativul este obiectul verbului „a sluji”; redarea este standard și naturală în română.
- source_word: μαμωνᾷ
  choice: mamonei
  rationale: Păstrarea împrumutului conservă paralela retorică dintre Dumnezeu și bogăție ca doi stăpâni rivali; sensurile explicative sunt oferite în notă.
theological_decisions:
- issue: Redarea lui κύριος într-un context social, nedivin
  choice: stăpâni
  alternative: domni
  rationale: Pluralul și cadrul slujirii evocă autoritatea unor stăpâni asupra slujitorului. „Stăpâni” exprimă sensul contextual fără a confunda termenul cu titlul divin.
- issue: Redarea lui μαμωνᾶς
  choice: mamona
  alternative: bogăția sau banii
  rationale: Textul îi prezintă pe Dumnezeu și mamona drept obiecte rivale ale slujirii. Menținerea împrumutului păstrează posibila personificare și tensiunea imaginii, iar nota clarifică sensul lexical.
translation_notes:
  register: Română standard modernă, cu un registru demn și accesibil. Formulele „a sluji la doi stăpâni” și „a se alipi de” păstrează concizia și forța proverbială a enunțului, fără a elimina metafora stăpân–slujitor.
