id: MAT.6.26
reference: Matthew 6:26
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐμβλέψατε εἰς τὰ πετεινὰ τοῦ οὐρανοῦ ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας, καὶ ὁ πατὴρ ὑμῶν ὁ οὐράνιος τρέφει αὐτά· οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/026.yaml
  text: Look at the birds of the sky[a], that they do not sow or reap or gather into barns, and your heavenly Father feeds them[b]. Are you not of much more value than they are?
translation:
  language: ro
  text: 'Priviți păsările cerului[a]: ele nu seamănă, nici nu seceră și nici nu adună în hambare, iar Tatăl vostru ceresc le hrănește. Oare nu sunteți voi cu mult mai de preț decât ele?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „păsările văzduhului”.
    reason: Alternativă lexicală pentru πετεινὰ τοῦ οὐρανοῦ.
  - marker: b
    text: Sau „Oare nu valorați voi mai mult decât ele?”
    reason: Alternativă naturală pentru sensul comparativ al lui διαφέρετε.
lexical_decisions:
- source_word: ἐμβλέψατε
  choice: Priviți
  rationale: Imperativul aorist cere îndreptarea atenției spre păsări. „Priviți” este direct, demn și firesc în româna actuală.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: păsările cerului
  rationale: Redă îndeaproape expresia grecească și desemnează natural păsările care zboară pe cer; alternativa tradițională „păsările văzduhului” este consemnată în notă.
- source_word: ὅτι
  choice: ': ele'
  rationale: În acest context, ὅτι introduce ceea ce trebuie observat la păsări. Două puncte redau natural în română această funcție explicativă fără a impune exclusiv sensul cauzal „pentru că”.
- source_word: σπείρουσιν ... θερίζουσιν ... συνάγουσιν
  choice: seamănă ... seceră ... adună
  rationale: Păstrează succesiunea imaginilor agricole și paralelismul verbal al textului grecesc.
- source_word: εἰς ἀποθήκας
  choice: în hambare
  rationale: „Hambare” este un echivalent românesc clar și firesc pentru locurile în care se depozitează recolta.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Tatăl vostru ceresc
  rationale: Păstrează atât relația exprimată prin „Tatăl vostru”, cât și calificativul οὐράνιος, într-o formulare românească naturală.
- source_word: τρέφει
  choice: le hrănește
  rationale: Verbul exprimă direct faptul că Dumnezeu le asigură hrana.
- source_word: οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
  choice: Oare nu sunteți voi cu mult mai de preț decât ele?
  rationale: Întrebarea retorică așteaptă un răspuns afirmativ. Formularea redă comparația de valoare și scoate în evidență pronumele ὑμεῖς prin „voi”.
theological_decisions:
- issue: Valoarea comparativă a oamenilor și a păsărilor în argumentul lui Isus
  choice: Versetul afirmă că ascultătorii lui Isus sunt mai de preț decât păsările, fără a preciza temeiul doctrinar al acestei valori.
  alternative: Explicarea valorii prin chipul lui Dumnezeu în om sau exclusiv printr-o relație de legământ.
  rationale: Textul exprimă comparația și grija Tatălui, dar nu oferă aici motivul teologic explicit al valorii umane; traducerea nu adaugă unul.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează imaginile agricole, întrebarea retorică și tensiunea dintre grija universală a lui Dumnezeu față de făpturi și valoarea mai mare atribuită oamenilor, fără explicații doctrinare adăugate.
