source:
  edition: SBLGNT
  text: ὅπως ᾖ σου ἡ ἐλεημοσύνη ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸀κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/004.yaml
  text: so that your giving to the poor may be in secret[b][a]; and your Father who sees in secret will reward you.
translation:
  language: ro
  text: pentru ca ajutorul tău pentru cei săraci[a] să fie oferit în ascuns; iar Tatăl tău, care vede în ascuns, te va răsplăti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „milostenia ta”. Termenul grecesc se referă în mod specific la ajutorul oferit celor săraci.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „îți va da înapoi”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: pentru ca
  rationale: Introduce scopul și păstrează legătura sintactică cu îndemnul din versetul anterior.
- source_word: ᾖ
  choice: să fie dat
  rationale: Subjunctivul cerut de construcția finală este redat firesc în română; verbul „dat” explicitează idiomatic acțiunea implicată de dar, fără a-i schimba sensul.
- source_word: ἐλεημοσύνη
  choice: darul tău pentru cei săraci
  rationale: Redă concret sensul de ajutor material oferit celor săraci și este mai transparent pentru cititorul modern decât termenul tradițional „milostenie”, păstrat în notă.
- source_word: ἐν τῷ κρυπτῷ
  choice: în ascuns
  rationale: Redă caracterul nevăzut de oameni și permite repetarea aceleiași expresii în ambele propoziții, asemenea textului grec.
- source_word: ὁ πατήρ σου
  choice: Tatăl tău
  rationale: Urmează textul grec, care nu conține aici calificativul „ceresc”.
- source_word: ὁ βλέπων
  choice: care vede
  rationale: Redare românească firească a participiului substantivizat, fără a adăuga ideea de supraveghere.
- source_word: ἀποδώσει
  choice: te va răsplăti
  rationale: În context exprimă răspunsul favorabil al lui Dumnezeu; alternativa mai formală „îți va răsplăti/da înapoi” este semnalată prin nota cu „îți va răsplăti”, fără a preciza natura răsplății.
- source_word: σοι
  choice: te
  rationale: Dativul grec este integrat idiomatic în complementul verbului românesc „a răsplăti”.
theological_decisions:
- issue: Natura răsplătirii divine exprimate prin ἀποδώσει
  choice: te va răsplăti
  alternative: îți va da înapoi
  rationale: Formularea păstrează promisiunea unui răspuns favorabil din partea Tatălui, fără să stabilească dacă răsplata este temporală sau veșnică, materială sau spirituală.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Repetarea expresiei „în ascuns” reproduce deliberat paralelismul textului grec; „Tatăl” este scris cu majusculă ca desemnare a lui Dumnezeu.
