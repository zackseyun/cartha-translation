  terminology: '„Tatăl”, „în ascuns” și „te va răsplăti” sunt potrivite. Nota b trebuie corectată: „îți va răsplăti” nu este o alternativă completă în română fără un obiect exprimat și nu redă direct construcția greacă cu persoana la dativ.'
