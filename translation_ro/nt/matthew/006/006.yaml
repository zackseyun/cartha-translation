id: MAT.6.6
reference: Matthew 6:6
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/006.yaml
  text: But when you pray[a], go into your inner room, and after shutting your door, pray to your Father who is in secret; and your Father, who sees in secret[b], will reward you.
translation:
  language: ro
  text: Dar tu, când te rogi, intră în încăperea ta lăuntrică[a] și, după ce ai închis ușa, roagă-te Tatălui tău, care este în ascuns; iar Tatăl tău, care vede în ascuns, te va răsplăti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „camera ta interioară”, „încăperea ta privată” sau, în mod tradițional, „cămara ta”. Termenul grecesc desemnează o încăpere interioară folosită pentru retragere sau depozitare.
    reason: lexical_alternative
  - marker: b
    text: Sau „îți va da înapoi”. Verbul grecesc poate însemna „a da înapoi”, „a răsplăti” sau „a răsplăti pe cineva”, în funcție de context.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Dar tu
  rationale: Pronumele explicit este emfatic și, împreună cu δέ, marchează contrastul cu fățarnicii din versetul anterior.
- source_word: ὅταν προσεύχῃ
  choice: când te rogi
  rationale: Construcția ὅταν cu conjunctivul exprimă o situație generală sau repetată; formularea este firească în româna actuală.
- source_word: εἴσελθε εἰς τὸ ταμεῖόν σου
  choice: intră în camera ta retrasă
  rationale: ταμεῖον desemnează o încăpere interioară, folosită pentru depozitare ori intimitate. „Camera retrasă” redă aici funcția de loc ferit fără a o restrânge la o singură configurație arhitecturală.
- source_word: κλείσας τὴν θύραν σου
  choice: închide ușa
  rationale: Participiul aorist indică o acțiune anterioară rugăciunii; coordonarea prin imperativ este naturală în română și păstrează succesiunea evidentă.
- source_word: πρόσευξαι τῷ πατρί σου
  choice: roagă-te Tatălui tău
  rationale: Păstrează direct desemnarea relațională din text, fără adaosul „ceresc”, absent aici.
- source_word: τῷ ἐν τῷ κρυπτῷ
  choice: care este în ascuns
  rationale: Formularea păstrează caracterul eliptic și ambiguitatea dintre locul ascuns și starea de nevăzut.
- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: care vede în ascuns
  rationale: Păstrează repetiția lui ἐν τῷ κρυπτῷ și evită adăugarea explicită a unui obiect precum „ce faci”.
- source_word: ἀποδώσει σοι
  choice: te va răsplăti
  rationale: În context, verbul indică răspunsul favorabil al Tatălui, dar poate avea și sensul mai general de a da înapoi sau a răsplăti; alternativa este consemnată în notă.
theological_decisions:
- issue: Sensul expresiei repetate ἐν τῷ κρυπτῷ
  choice: „în ascuns” în ambele apariții
  alternative: „în locul ascuns”, respectiv „vede ce se face în ascuns”
  rationale: Repetiția leagă prezența ascunsă a Tatălui de vederea lui și susține contrastul cu manifestarea publică, fără a transforma expresia într-o explicație mai precisă decât originalul.
- issue: Natura răspunsului exprimat prin ἀποδώσει
  choice: „te va răsplăti”
  alternative: „îți va răsplăti” / „îți va da înapoi”
  rationale: Contextul sugerează o reacție favorabilă a lui Dumnezeu, însă traducerea nu precizează forma ori momentul răsplătirii.
- issue: Desemnarea lui Dumnezeu ca πατήρ
  choice: „Tatăl”
  alternative: „Tatăl ceresc”
  rationale: Este păstrată desemnarea directă a textului, fără o completare teologică preluată din contextul mai larg.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. „Dar tu” păstrează accentul contrastiv; „camera ta retrasă” evită sensurile moderne înșelătoare ale unui termen precum „debara”. Repetiția „în ascuns” este menținută intenționat.
