  text: σὺ δὲ νηστεύων ἄλειψαί σου τὴν κεφαλὴν καὶ τὸ πρόσωπόν σου νίψαι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/017.yaml
  text: But you[a], when you fast, anoint your head and wash your face[b],
translation:
  language: ro
  text: Dar tu, când postești, unge-ți capul cu ulei[a] și spală-ți fața[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „dă-ți cu ulei pe cap”. Verbul grecesc poate desemna aplicarea uleiului ca parte a îngrijirii obișnuite.'
    reason: lexical_alternative
  - marker: b
    text: Adică păstrează-ți înfățișarea obișnuită, fără să le arăți altora că postești.
    reason: cultural_note
lexical_decisions:
- source_word: σὺ δὲ
  choice: Dar tu
  rationale: Pronumele exprimat explicit și particula δέ marchează contrastul cu fățarnicii din contextul anterior; formularea păstrează firesc accentul în română.
- source_word: νηστεύων
  choice: când postești
  rationale: Participiul prezent are valoare temporală și este redat idiomatic printr-o propoziție temporală.
- source_word: ἄλειψαί σου τὴν κεφαλήν
  choice: unge-ți capul cu untdelemn
  rationale: Imperativul se referă aici la aplicarea uleiului ca gest obișnuit de îngrijire. «Untdelemn» păstrează cadrul cultural și face explicit obiectul subînțeles al ungerii.
- source_word: καὶ
  choice: și
  rationale: Redă coordonarea simplă dintre cele două imperative.
- source_word: τὸ πρόσωπόν σου νίψαι
  choice: spală-ți fața
  rationale: νίπτω desemnează în mod obișnuit spălarea unei părți a corpului; formularea este directă și naturală în româna actuală.
theological_decisions:
- issue: Natura îndemnului privind înfățișarea în timpul postului
  choice: Textul poruncește îngrijirea obișnuită în timpul postului, în contrast cu afișarea ostentativă a postirii.
  alternative: Ar putea fi înțeles ca o ungere rituală sau ca o interdicție a postului public în sine.
  rationale: Contextul imediat opune desfigurării fățarnicilor o înfățișare normală. Traducerea nu transformă gestul într-un ritual și nici nu extinde porunca într-o interdicție generală.
translation_notes:
  register: Română standard modernă, clară și demnă. «Dar tu» păstrează contrastul emfatic, iar imperativul reflexiv «unge-ți» este firesc. «Untdelemn» păstrează culoarea culturală biblică fără a sugera în mod necesar un act ritual.
