id: MAT.6.21
reference: Matthew 6:21
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὅπου γάρ ἐστιν ὁ θησαυρός ⸀σου, ἐκεῖ ἔσται καὶ ἡ καρδία ⸁σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/021.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: ro
  text: Căci unde este comoara ta, acolo va fi și inima ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Căci unde este comoara ta, acolo este și inima ta.” Unele traduceri redau afirmația printr-un prezent atemporal, însă verbul grecesc este la viitor („va fi”).'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: unde
  rationale: Introduce propoziția relativă locativă și păstrează firesc paralelismul „unde… acolo”.
- source_word: γάρ
  choice: căci
  rationale: Păstrează legătura explicativă cu învățătura precedentă despre strângerea comorilor.
- source_word: θησαυρός
  choice: comoară
  rationale: Echivalentul românesc consacrat păstrează atât sensul concret, cât și forța metaforică din context.
- source_word: σου
  choice: ta
  rationale: Redă posesia la singular atât pe lângă „comoară”, cât și pe lângă „inimă”.
- source_word: ἐκεῖ
  choice: acolo
  rationale: Corespunde lui ὅπου și conservă structura compactă „unde… acolo”.
- source_word: ἔσται
  choice: va fi
  rationale: Redă explicit viitorul verbului εἰμί, fără a-l transforma într-un prezent proverbial.
- source_word: καρδία
  choice: inimă
  rationale: Redarea consacrată cuprinde dorințele, loialitatea și orientarea lăuntrică fără a restrânge sensul.
- source_word: καὶ
  choice: și
  rationale: Păstrează raportul aditiv dintre locul comorii și cel al inimii.
theological_decisions:
- issue: Valoarea temporală a lui ἔσται într-o afirmație cu caracter sapiențial
  choice: 'Păstrarea explicită a viitorului: „va fi”'
  alternative: 'Folosirea prezentului: „este”, pentru formularea unui adevăr general'
  rationale: Textul grec are o formă de viitor. Menținerea ei conservă atât corespondența dintre comoară și inimă, cât și posibila nuanță direcțională, fără a reduce afirmația la o descriere statică.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. „Căci” păstrează concis legătura explicativă, iar construcția „unde… acolo” reproduce paralelismul sursei.
