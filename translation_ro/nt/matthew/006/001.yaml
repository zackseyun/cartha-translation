id: MAT.6.1
reference: Matthew 6:1
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
translation:
  language: ro
  text: Dar aveți grijă să nu faceți faptele voastre de dreptate înaintea oamenilor, ca să fiți văzuți de ei[a]; altfel, nu aveți răsplată de la Tatăl vostru, care este în ceruri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. „dreptatea voastră”; expresia poate desemna fapte de dreptate. Unele manuscrise au „milostenia voastră”.
    reason: Păstrează termenul abstract din textul SBLGNT, explică redarea idiomatică din text și consemnează varianta textuală.
  - marker: b
    text: În greacă, „ceruri” este la plural; sensul poate fi redat și prin „în cer”.
    reason: Semnalează pluralul din textul-sursă și alternativa românească uzuală.
lexical_decisions:
- source_word: Προσέχετε
  choice: aveți grijă
  rationale: Imperativul prezent, la plural, exprimă o vigilență continuă; formularea este firească în româna actuală și păstrează caracterul de avertisment.
- source_word: δὲ
  choice: Dar
  rationale: Marchează trecerea cu nuanță adversativă de la învățătura anterioară la acest avertisment.
- source_word: δικαιοσύνην ὑμῶν
  choice: dreptatea voastră
  rationale: Păstrează substantivul larg δικαιοσύνη și posesivul din text, fără a restrânge sensul la milostenie; în context, expresia se referă la practicarea concretă a dreptății.
- source_word: μὴ ποιεῖν
  choice: să nu vă practicați
  rationale: Redă interdicția și caracterul unei conduite puse în practică, evitând formularea românească rigidă „să nu faceți dreptatea voastră”.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: înaintea oamenilor
  rationale: Se referă generic la observatorii umani și este o formulare românească demnă și clară.
- source_word: πρὸς τὸ θεαθῆναι αὐτοῖς
  choice: ca să fiți văzuți de ei
  rationale: Păstrează explicit sensul de scop al construcției grecești și diateza pasivă.
- source_word: εἰ δὲ μή γε
  choice: altfel
  rationale: Redă idiomatic în română consecința condițională a avertismentului.
- source_word: μισθὸν
  choice: răsplată
  rationale: În contextul recompensei divine, „răsplată” este sensul românesc firesc și nu sugerează o simplă plată salarială.
- source_word: παρὰ τῷ πατρὶ ὑμῶν
  choice: de la Tatăl vostru
  rationale: În contextul primirii răsplății, παρά cu dativul indică în mod natural sursa acesteia.
- source_word: τῷ ἐν τοῖς οὐρανοῖς
  choice: care este în ceruri
  rationale: Păstrează pluralul grecesc și stilul caracteristic lui Matei, într-o formulare românească inteligibilă.
theological_decisions:
- issue: Întinderea semantică a lui δικαιοσύνην
  choice: „dreptatea”, în sens larg de practică dreaptă
  alternative: „faptele drepte” sau, potrivit unei variante textuale, „milostenia”
  rationale: Textul SBLGNT are δικαιοσύνην, al cărui sens este mai larg decât milostenia. Traducerea principală păstrează această deschidere semantică, iar formulările mai concrete sunt consemnate în notă.
- issue: Referentul lui ἀνθρώπων
  choice: „oamenilor”, cu sens generic
  alternative: „bărbaților”
  rationale: Referința este la oameni în general, nu exclusiv la persoane de sex masculin.
- issue: Pluralul τοῖς οὐρανοῖς
  choice: „în ceruri”
  alternative: „în cer”
  rationale: Pluralul reproduce forma greacă și uzul matean fără a adăuga o interpretare doctrinară.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează avertismentul direct, scopul ostentativ condamnat în verset și pluralul matean „ceruri”, fără a restrânge δικαιοσύνη la milostenie.
