id: MAT.6.33
reference: Matthew 6:33
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: ro
  text: Dar căutați mai întâi Împărăția lui și dreptatea lui[a], iar toate acestea vi se vor adăuga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „neprihănirea lui”. Termenul grecesc poate desemna dreptatea sau justiția, precum și rectitudinea înaintea lui Dumnezeu; aici, „dreptatea” păstrează această arie de sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖτε
  choice: căutați
  rationale: Imperativul prezent, la plural, exprimă o preocupare activă și continuă; „căutați” este firesc și păstrează concizia originalului.
- source_word: δὲ
  choice: Dar
  rationale: Marchează contrastul cu preocuparea pentru hrană, băutură și îmbrăcăminte din contextul anterior.
- source_word: πρῶτον
  choice: mai întâi
  rationale: Redă atât ordinea, cât și prioritatea urmăririi Împărăției și dreptății lui Dumnezeu.
- source_word: βασιλείαν
  choice: Împărăția
  rationale: Este redarea consacrată și naturală în contextul lui Matei, putând cuprinde atât domnia, cât și sfera stăpânirii lui Dumnezeu.
- source_word: δικαιοσύνην
  choice: dreptatea
  rationale: În româna actuală, „dreptatea” poate cuprinde starea și conduita conforme voii lui Dumnezeu, păstrând totodată posibilul sens de justiție; alternativa „neprihănirea” ar putea suna mai confesional și ar restrânge sau ar arhaiza sensul pentru unii cititori.
- source_word: αὐτοῦ
  choice: lui
  rationale: Păstrează pronumele grecesc fără explicitarea interpretativă „lui Dumnezeu”; referentul este clar din context.
- source_word: ταῦτα πάντα
  choice: toate acestea
  rationale: Trimite firesc la lucrurile necesare vieții menționate în contextul imediat.
- source_word: προστεθήσεται
  choice: vi se vor adăuga
  rationale: Păstrează viitorul pasiv și imaginea adăugării, fără a înlocui verbul cu explicația mai interpretativă „vi se vor da”.
- source_word: ὑμῖν
  choice: vi se
  rationale: Dativul este redat idiomatic în construcția pasivă românească „vi se vor adăuga”.
theological_decisions:
- issue: Redarea lui δικαιοσύνη
  choice: dreptatea
  alternative: neprihănirea; justiția
  rationale: Termenul grec are o arie semantică largă, incluzând conformitatea cu voia lui Dumnezeu, conduita dreaptă și, după context, justiția. „Dreptatea” păstrează această amplitudine mai natural în româna modernă; nota consemnează alternativele fără a reduce sensul la una dintre ele.
- issue: Referentul lui αὐτοῦ
  choice: lui
  alternative: lui Dumnezeu
  rationale: Pronumele este păstrat ca atare, în acord cu greaca; contextul îl identifică drept Dumnezeu/Tatăl, fără a necesita explicitare în text.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. Majuscula din „Împărăția” este folosită pentru referirea la Împărăția lui Dumnezeu; pronumele referitor la Dumnezeu rămâne cu literă mică, conform uzului românesc curent. Formularea păstrează structura echilibrată și concizia greacă.
