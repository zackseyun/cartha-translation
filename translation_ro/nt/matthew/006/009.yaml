id: MAT.6.9
reference: Matthew 6:9
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Οὕτως οὖν προσεύχεσθε ὑμεῖς· Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς· ἁγιασθήτω τὸ ὄνομά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/009.yaml
  text: 'Therefore[a], you should pray like this: Our Father in the heavens, may your name be treated as holy[b],'
translation:
  language: ro
  text: 'Voi, așadar, rugați-vă astfel: „Tatăl nostru, care ești în ceruri[a], fie sfințit numele tău[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mai tradițional: „în cer”. Textul grecesc spune literal „în ceruri”, la plural.'
    reason: lexical_alternative
  - marker: b
    text: 'Formulare tradițională: „sfințească-se numele tău”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: astfel
  rationale: Introduce felul sau modelul rugăciunii; „astfel” este firesc, concis și păstrează caracterul instructiv.
- source_word: οὖν
  choice: așadar
  rationale: Păstrează legătura de concluzie cu învățătura anterioară, într-o formulare românească actuală și demnă.
- source_word: προσεύχεσθε ὑμεῖς
  choice: voi ... rugați-vă
  rationale: Imperativul redă îndemnul direct, iar pronumele explicit „voi” păstrează accentul pus în greacă pe destinatari.
- source_word: Πάτερ ἡμῶν
  choice: Tatăl nostru
  rationale: Redă firesc vocativul și dimensiunea comunitară a pronumelui la plural.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: care ești în ceruri
  rationale: Face explicită valoarea construcției articulare grecești și păstrează pluralul „ceruri”, fără a-l reduce la formularea tradițională la singular.
- source_word: ἁγιασθήτω
  choice: fie sfințit
  rationale: Păstrează forma pasivă și forța de cerere a imperativului grecesc, fără a preciza nejustificat cine realizează acțiunea.
- source_word: τὸ ὄνομά σου
  choice: numele tău
  rationale: Redare directă, care păstrează termenul biblic „nume” și nu îl înlocuiește cu o explicație interpretativă.
theological_decisions:
- issue: Redarea adresei divine și a transcendenței în începutul Rugăciunii Domnești
  choice: Tatăl nostru, care ești în ceruri
  alternative: Tatăl nostru care ești în cer; Tatăl nostru ceresc
  rationale: Textul grecesc are pluralul τοῖς οὐρανοῖς. Soluția păstrează atât apropierea exprimată prin „Tatăl”, cât și transcendența sugerată de „în ceruri”, fără parafrazare doctrinară.
- issue: Redarea lui ἁγιασθήτω fără identificarea implicită a agentului
  choice: fie sfințit numele tău
  alternative: sfințească-se numele tău; numele tău să fie recunoscut ca sfânt
  rationale: Pasivul românesc păstrează deschisă întrebarea privind agentul și exprimă cererea ca numele lui Dumnezeu să fie socotit și onorat ca sfânt. Alternativa explicativă ar restrânge sensul la recunoașterea umană.
translation_notes:
  register: Română standard modernă, clară și demnă. Ordinea „Voi, așadar” păstrează accentul pronumelui grecesc, iar formulările bine cunoscute ale rugăciunii sunt menținute acolo unde rămân naturale. Litera mică la pronumele referitor la Dumnezeu urmează ortografia curentă și nu introduce o convenție confesională.
