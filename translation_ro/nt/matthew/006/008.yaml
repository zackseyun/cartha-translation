id: MAT.6.8
reference: Matthew 6:8
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ⸀ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: ro
  text: Așadar, să nu deveniți asemenea lor[a], fiindcă Tatăl vostru știe de ce aveți nevoie înainte ca voi să i le cereți.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „să nu vă faceți asemenea lor” ori „să nu fiți ca ei”.'
    reason: Alternativa reflectă valoarea pasivă și gama semantică a verbului ὁμοιόω, în timp ce textul principal folosește exprimarea românească mai firească.
lexical_decisions:
- source_word: μὴ οὖν
  choice: Așadar, să nu
  rationale: Redă atât interdicția exprimată prin μή, cât și legătura concluzivă marcată de οὖν cu avertismentul precedent despre rugăciunea păgânilor.
- source_word: ὁμοιωθῆτε
  choice: deveniți asemenea
  rationale: Forma pasivă de aorist conjunctiv apare într-o interdicție. Formularea românească păstrează ideea conformării după modelul lor, fără pasivul rigid „să nu fiți făcuți asemenea”.
- source_word: αὐτοῖς
  choice: lor
  rationale: Pronumele trimite la păgânii menționați în versetul precedent; pronumele simplu păstrează coeziunea contextului fără explicații adăugate.
- source_word: οἶδεν
  choice: știe
  rationale: Deși οἶδα are formă de perfect, aici are sens prezent și se redă firesc prin „știe”.
- source_word: ὁ πατὴρ ὑμῶν
  choice: Tatăl vostru
  rationale: Urmează formularea greacă exactă, fără a adăuga „ceresc”, adjectiv care nu apare în acest verset.
- source_word: ὧν χρείαν ἔχετε
  choice: de ce aveți nevoie
  rationale: Este o redare românească naturală și precisă a construcției care indică lucrurile necesare ucenicilor.
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: înainte ca voi să i le cereți
  rationale: Construcția πρὸ τοῦ cu infinitivul indică anterioritatea. Pronumele „le” reia implicit lucrurile de care au nevoie, iar „i” îl indică pe Tatăl; această formulare este idiomatică în română.
theological_decisions:
- issue: Cunoașterea prealabilă a lui Dumnezeu în raport cu rugăciunea
  choice: 'Afirmația este redată direct: Tatăl cunoaște nevoile ucenicilor înainte ca ei să I le ceară.'
  alternative: O parafrază care ar explica rugăciunea drept relațională, nu informativă, sau care ar introduce explicit o doctrină sistematică despre preștiința divină.
  rationale: Textul afirmă cunoașterea prealabilă a Tatălui, dar nu explică de ce rugăciunea rămâne necesară. Traducerea păstrează această tensiune teologică fără să o rezolve prin adaosuri.
translation_notes:
  register: Română standard modernă, clară și demnă. „Așadar” păstrează legătura logică, iar „Tatăl vostru” evită atât arhaismul, cât și adaosul explicativ. Pronumele referitoare la Dumnezeu sunt scrise conform ortografiei românești obișnuite, fără majuscule devoționale introduse de traducător.
