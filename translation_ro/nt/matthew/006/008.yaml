  source_fidelity: 'Textul redă fidel toate elementele principale ale grecei: inferența lui οὖν („Așadar”), interdicția, sensul idiomatic al lui ὁμοιωθῆτε („să nu deveniți asemenea”), cunoașterea prezentă a Tatălui, nevoile destinatarilor și anterioritatea față de cerere. „Înainte ca voi să i le cereți” face explicit în română obiectul implicit al cererii („lucrurile” necesare) și destinatarul singular αὐτόν, fără a modifica sensul.'
