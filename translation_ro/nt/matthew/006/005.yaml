id: MAT.6.5
reference: Matthew 6:5
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ ὅταν ⸂προσεύχησθε, οὐκ ἔσεσθε ὡς⸃ οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, ⸀ὅπως φανῶσιν τοῖς ἀνθρώποις· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσι τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/005.yaml
  text: And whenever you pray[a], you shall not be like the hypocrites, because they love to stand and pray in the synagogues and on the corners of the broad streets, so that they may be seen by people. Truly I say to you[c][b], they have received their reward.
translation:
  language: ro
  text: 'Și, ori de câte ori vă rugați, să nu fiți ca ipocriții, fiindcă le place să se roage stând în picioare în sinagogi și la colțurile străzilor largi[a], ca să fie văzuți de oameni. Adevărat vă spun: și-au primit răsplata[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, mai idiomatic: „la colțurile străzilor”. Greaca spune mai literal „la colțurile străzilor largi”.'
    reason: lexical_alternative
  - marker: b
    text: 'Verbul grec poate avea sens comercial: a primi plata cuvenită, chiar a o primi integral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν προσεύχησθε
  choice: ori de câte ori vă rugați
  rationale: Redă valoarea temporală nedefinită și repetitivă a construcției cu ὅταν și conjunctivul prezent.
- source_word: οὐκ ἔσεσθε ὡς
  choice: să nu fiți ca
  rationale: Exprimă natural în româna modernă forța prohibitivă a viitorului grecesc, fără a pierde tonul de îndrumare solemnă.
- source_word: ὑποκριταί
  choice: ipocriții
  rationale: Este echivalentul românesc consacrat și potrivit contextului, unde evlavia este afișată pentru impresie.
- source_word: φιλοῦσιν
  choice: lor le place
  rationale: Redă idiomatic faptul că aceștia găsesc plăcere în practica descrisă; «iubesc să» ar suna nefiresc în acest context românesc.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: în sinagogi
  rationale: Păstrează specificul istoric și religios al locurilor menționate.
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: la colțurile străzilor largi
  rationale: Urmează sensul concret al expresiei grecești, în care πλατεῖαι sunt străzi sau artere largi, păstrând totodată o formulare inteligibilă.
- source_word: ἑστῶτες προσεύχεσθαι
  choice: să stea în picioare și să se roage
  rationale: Păstrează ordinea și relația acțiunilor din greacă; statul în picioare nu este condamnat în sine, ci este parte a expunerii publice descrise.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: ca să fie văzuți de oameni
  rationale: Redă limpede scopul, iar «oameni» are aici sens generic, asemenea termenului grec.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Adevărat vă spun
  rationale: Formulă solemnă, consacrată și naturală în română, care redă funcția lui ἀμήν la începutul afirmației.
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: și-au primit răsplata
  rationale: Redă idiomul comercial al verbului ἀπέχω, care poate indica primirea plății cuvenite; formularea evită să adauge explicit «în întregime» în text.
theological_decisions:
- issue: Sensul avertismentului despre răsplată
  choice: și-au primit răsplata
  alternative: își au răsplata / și-au primit pe deplin răsplata
  rationale: Perfectul compus românesc exprimă faptul că răsplata urmărită a fost deja obținută. Nu se introduce explicit «pe deplin», deși nuanța comercială a verbului grec poate sugera achitarea integrală.
- issue: Referința generică a lui ἀνθρώποις
  choice: oameni
  alternative: bărbați
  rationale: În context, termenul îi desemnează generic pe observatorii umani, nu exclusiv persoane de sex masculin.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formularea păstrează solemnitatea rostirii lui Isus, evitând atât arhaismele, cât și explicațiile doctrinare introduse în text.
