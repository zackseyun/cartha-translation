  text: τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/011.yaml
  text: Give us today our daily bread[a].
translation:
  language: ro
  text: Dă-ne astăzi pâinea noastră cea de fiecare zi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „pâinea noastră pentru astăzi”, „pâinea noastră pentru ziua care vine” ori „pâinea de care avem nevoie”. Adjectivul grecesc ἐπιούσιον este rar, iar sensul lui exact este disputat.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ἄρτον ἡμῶν
  choice: pâinea noastră
  rationale: Păstrează imaginea concretă a pâinii și redă firesc în română genitivul posesiv; deși ἄρτος poate desemna mai larg hrana, sensul literal nu trebuie diluat în textul principal.
- source_word: τὸν ἐπιούσιον
  choice: cea de fiecare zi
  rationale: Este formularea românească consacrată și inteligibilă pentru adjectivul rar ἐπιούσιος. Deoarece sensul exact al termenului rămâne disputat, alternativele importante sunt consemnate în nota de subsol.
- source_word: δὸς ἡμῖν
  choice: Dă-ne
  rationale: Redă direct și idiomatic imperativul aorist δὸς împreună cu pronumele la dativ ἡμῖν.
- source_word: σήμερον
  choice: astăzi
  rationale: Echivalentul modern și direct al adverbului σήμερον, păstrând explicit referința temporală.
theological_decisions:
- issue: Sensul lui ἐπιούσιον în Rugăciunea Domnească
  choice: cea de fiecare zi
  alternative: pentru astăzi; pentru ziua care vine; de care avem nevoie
  rationale: Termenul poate indica pâinea zilnică, pâinea pentru ziua prezentă ori următoare sau pâinea necesară traiului. Textul principal folosește exprimarea românească tradițională și naturală, fără a transforma una dintre reconstrucțiile lexicale într-o certitudine; ambiguitatea reală este păstrată în notă.
translation_notes:
  register: Română standard modernă, cu formulare demnă și ușor de înțeles. Expresia consacrată „pâinea noastră cea de fiecare zi” păstrează familiaritatea liturgică fără arhaisme, iar nota explică incertitudinea lexicală autentică.
