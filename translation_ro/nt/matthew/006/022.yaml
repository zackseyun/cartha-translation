source:
  edition: SBLGNT
  text: Ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός. ἐὰν οὖν ⸂ᾖ ὁ ὀφθαλμός σου ἁπλοῦς⸃, ὅλον τὸ σῶμά σου φωτεινὸν ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: ro
  text: Lampa trupului este ochiul. Așadar, dacă ochiul tău este sănătos[a], tot trupul tău va fi plin de lumină.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „simplu”, „neîmpărțit” sau „limpede”; termenul grecesc poate sugera și lipsa duplicității sau, în anumite contexte, generozitatea.
    reason: Alternativă lexicală pentru ἁπλοῦς, termen cu o gamă semantică mai largă decât poate reda un singur echivalent românesc.
lexical_decisions:
- source_word: λύχνος
  choice: lampă
  rationale: Termenul grecesc denumește în mod obișnuit o lampă; redarea păstrează imaginea concretă a ochiului ca sursă de lumină pentru trup.
- source_word: σῶμα
  choice: trup
  rationale: „Trup” este firesc în registrul biblic românesc actual și păstrează imaginea corporală directă.
- source_word: ὀφθαλμός
  choice: ochi
  rationale: Redarea literală funcționează atât pentru imaginea fizică, cât și pentru sensul ei metaforic.
- source_word: ἐὰν οὖν
  choice: Așadar, dacă
  rationale: „Așadar” păstrează valoarea inferențială a lui οὖν, iar construcția condițională este exprimată natural în română.
- source_word: ἁπλοῦς
  choice: sănătos
  rationale: În contrastul dintre ochiul care luminează trupul și ochiul rău din versetul următor, „sănătos” exprimă natural funcționarea corespunzătoare a ochiului, fără a elimina din notă celelalte nuanțe posibile.
- source_word: ὅλον
  choice: tot
  rationale: „Tot trupul” redă firesc și complet sensul cuprinzător al adjectivului.
- source_word: φωτεινὸν
  choice: plin de lumină
  rationale: Formula românească păstrează imaginea iluminării întregului trup și este mai firească aici decât un simplu adjectiv precum „luminos”.
- source_word: ἔσται
  choice: va fi
  rationale: Păstrează explicit timpul viitor al verbului grecesc.
theological_decisions:
- issue: Sensul lui ἁπλοῦς în metafora ochiului
  choice: „sănătos” în textul principal
  alternative: „neîmpărțit”, „limpede”, „bun” sau, în anumite contexte, „generos”
  rationale: Contextul imediat privește ochiul ca lampă a trupului și îl pune în contrast cu ochiul rău din versetul următor, astfel că o redare legată de buna funcționare a vederii păstrează cel mai clar metafora. Totuși, termenul grecesc poate sugera și simplitate, unitate de scop ori generozitate; aceste posibilități sunt păstrate în notă, fără a impune în text o interpretare doctrinară unică.
translation_notes:
  register: Română standard modernă, clară și demnă. Topica „Lampa trupului este ochiul” păstrează accentul și metafora sursei grecești, iar „plin de lumină” redă idiomatic rezultatul iluminării.
