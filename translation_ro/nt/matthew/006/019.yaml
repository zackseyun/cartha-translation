  source_fidelity: Textul redă bine interdicția prezentă, dativul reflexiv („vă”), acumularea de comori, contrastul terestru și cele două acțiuni ale hoților. Totuși, „deteriorarea” este un substantiv abstract de stare/proces și funcționează nefiresc ca agent care „distruge”. În contextul lui βρῶσις, „rugina” este o redare românească idiomatică și contextual plauzibilă; nota poate conserva sensul lexical mai larg, fără a pretinde o precizie nejustificată.
  naturalness: „Nu vă strângeți comori pe pământ” este firesc în registru biblic modern. „Molia și deteriorarea le distrug” este însă o asociere nenaturală în româna standard. „Molia și rugina le distrug” este fluent și inteligibil.
  terminology: „Comori”, „pe pământ”, „molia”, „hoții” și „fură” sunt potrivite. „Intră prin spargere” comunică idiomatic pătrunderea ilegală, iar nota păstrează imaginea literală a verbului διορύσσω. Pentru βρῶσις, „rugina” este admisibilă în text, cu o notă care indică faptul că termenul nu este neapărat limitat la coroziunea metalelor.
