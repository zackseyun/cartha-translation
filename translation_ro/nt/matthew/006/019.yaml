id: MAT.6.19
reference: Matthew 6:19
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
translation:
  language: ro
  text: Nu vă strângeți comori pe pământ, unde molia și rugina[a] le distrug și unde hoții intră prin spargere[b] și fură.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „deteriorarea”; termenul grec poate desemna mai larg un proces de consumare sau degradare, nu doar coroziunea metalelor.
    reason: lexical_alternative
  - marker: b
    text: Literal, „sapă prin”, probabil cu referire la hoții care străpungeau ziduri din cărămidă nearsă.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ θησαυρίζετε
  choice: Nu vă strângeți
  rationale: Imperativul prezent negat exprimă interdicția de a acumula; formularea este firească în româna actuală și păstrează ideea verbului înrudit cu „comori”.
- source_word: ὑμῖν
  choice: vă
  rationale: Pronumele datival are sens reflexiv și arată că acumularea este făcută pentru sine; construcția românească „vă strângeți” redă natural acest sens.
- source_word: θησαυρούς
  choice: comori
  rationale: Echivalent direct, suficient de larg pentru bunuri de preț, nu doar bani.
- source_word: ἐπὶ τῆς γῆς
  choice: pe pământ
  rationale: Redă firesc localizarea și păstrează contrastul cu cerul din versetul următor.
- source_word: σὴς
  choice: molia
  rationale: Termenul desemnează molia care distruge hainele și alte bunuri depozitate.
- source_word: βρῶσις
  choice: deteriorarea
  rationale: Substantivul indică în sens larg consumarea sau degradarea; alegerea nu îl restrânge la oxidarea metalelor.
- source_word: ἀφανίζει
  choice: le distrug
  rationale: Verbul exprimă nimicirea sau ruinarea. Pronumele „le” clarifică în română că obiectul îl constituie comorile.
- source_word: κλέπται
  choice: hoții
  rationale: Echivalent lexical direct.
- source_word: διορύσσουσιν
  choice: intră prin spargere
  rationale: Expresia comunică idiomatic pătrunderea hoților, păstrând ideea străpungerii unei bariere fără a introduce explicit un zid în text.
- source_word: κλέπτουσιν
  choice: fură
  rationale: Echivalentul românesc direct al verbului.
theological_decisions:
- issue: Sensul lui βρῶσις
  choice: deteriorarea
  alternative: rugina; roaderea
  rationale: Cuvântul grec poate desemna consumarea ori degradarea în sens mai larg, nu numai rugina. Textul principal păstrează această amplitudine semantică, iar alternativa tradițională este indicată în notă.
- issue: Forța expresiei ἐπὶ τῆς γῆς
  choice: pe pământ
  alternative: pe acest pământ
  rationale: Formularea redă contrastul concret cu cerul din context, fără a adăuga demonstrativul absent din greacă.
- issue: Imaginea din διορύσσουσιν
  choice: intră prin spargere
  alternative: sapă prin; străpung
  rationale: Redarea principală este inteligibilă cititorului modern, iar nota conservă imaginea literală și fundalul posibil al zidurilor din cărămidă nearsă.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea evită arhaismele, păstrează paralelismul celor două propoziții introduse prin „unde” și explică în note atât ambiguitatea lexicală a lui βρῶσις, cât și imaginea culturală din διορύσσουσιν.
