id: MAT.6.15
reference: Matthew 6:15
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ἀφῆτε τοῖς ⸀ἀνθρώποις, οὐδὲ ὁ πατὴρ ὑμῶν ἀφήσει τὰ παραπτώματα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: ro
  text: Dar, dacă nu-i iertați pe oameni, nici Tatăl vostru nu vă va ierta greșelile[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „abaterile” ori „încălcările”.
    reason: Alternativă lexicală pentru παραπτώματα.
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: Dar, dacă nu
  rationale: ἐάν introduce condiția, δέ marchează contrastul cu versetul anterior, iar μή neagă condiția; formularea este firească și păstrează opoziția.
- source_word: ἀφῆτε
  choice: iertați
  rationale: În contextul greșelilor dintre oameni, ἀφίημι înseamnă „a ierta”; aceeași alegere lexicală este păstrată și pentru ἀφήσει.
- source_word: τοῖς ἀνθρώποις
  choice: pe oameni
  rationale: ἄνθρωποι este generic și se referă la oameni, nu doar la bărbați. Pronumele clitic „-i” este cerut de uzul românesc firesc cu complementul direct personal reluat.
- source_word: οὐδὲ
  choice: nici
  rationale: Păstrează legătura negativă și paralelismul categoric dintre condiție și consecință.
- source_word: ὁ πατὴρ ὑμῶν
  choice: Tatăl vostru
  rationale: Redă exact expresia grecească, fără a adăuga „ceresc”, adjectiv care nu apare în acest verset.
- source_word: ἀφήσει
  choice: va ierta
  rationale: Viitorul lui ἀφίημι este redat prin „va ierta”, păstrând repetiția lexicală și structura reciprocă a afirmației.
- source_word: τὰ παραπτώματα ὑμῶν
  choice: greșelile
  rationale: παραπτώματα desemnează abateri, încălcări sau greșeli morale. „Greșelile” este natural și inteligibil în româna actuală, fără a diminua în context gravitatea morală a termenului; posesia este exprimată idiomatic prin pronumele „vă” din construcția verbală.
theological_decisions:
- issue: Relația condițională dintre iertarea acordată de oameni și iertarea divină
  choice: Păstrarea formulării condiționale directe, fără atenuare sau sistematizare
  alternative: Parafrazarea ei fie ca simplă dovadă a iertării deja primite, fie ca pierdere a părtășiei, nu a iertării propriu-zise
  rationale: Greaca exprimă direct o condiție și consecința ei. Traducerea păstrează tensiunea teologică a textului și nu impune o soluție doctrinară din afara versetului.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea „nu-i iertați pe oameni” este idiomatică, iar paralelismul „nu... nici” păstrează forța și echilibrul propoziției grecești.
