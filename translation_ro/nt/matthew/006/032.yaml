  text: πάντα γὰρ ταῦτα τὰ ἔθνη ⸀ἐπιζητοῦσιν· οἶδεν γὰρ ὁ πατὴρ ὑμῶν ὁ οὐράνιος ὅτι χρῄζετε τούτων ἁπάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/032.yaml
  text: For the Gentiles eagerly seek all these things; for your heavenly Father knows that you need all these things.
translation:
  language: ro
  text: Căci neamurile[a] caută toate aceste lucruri[b]; căci Tatăl vostru ceresc știe că aveți nevoie de toate acestea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „națiunile”, „neevreii” ori „păgânii”. Termenul grecesc poate desemna popoarele în general, dar aici se referă probabil la cei din afara poporului legământului.
    reason: alternative_reading
  - marker: b
    text: Sau „caută cu stăruință” ori „urmăresc”. Verbul poate sugera o căutare insistentă sau perseverentă.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: neamurile
  rationale: Păstrează termenul biblic românesc pentru popoarele din afara lui Israel și lasă deschisă nuanța dintre „națiuni”, „neevrei” și „păgâni”, fără a introduce o caracterizare peiorativă.
- source_word: ἐπιζητοῦσιν
  choice: le caută cu stăruință
  rationale: Redă căutarea insistentă sau preocuparea susținută sugerată de verb, într-o formulare românească firească.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Tatăl vostru ceresc
  rationale: Este construcția românească naturală care păstrează atât relația exprimată prin „vostru”, cât și calificarea cerească.
- source_word: οἶδεν
  choice: știe
  rationale: Deși forma grecească este istoric un perfect, verbul are aici sens prezent.
- source_word: χρῄζετε
  choice: aveți nevoie de
  rationale: Formulare modernă, clară și exactă pentru ideea de necesitate.
- source_word: πάντα γὰρ ταῦτα ... τούτων ἁπάντων
  choice: toate aceste lucruri ... toate acestea
  rationale: Păstrează repetiția și accentul textului grecesc, evitând însă o repetare greoaie a substantivului în a doua propoziție.
- source_word: γὰρ ... γὰρ
  choice: Căci ... căci
  rationale: Păstrează legătura explicativă dublă și structura argumentativă a originalului.
theological_decisions:
- issue: Referentul expresiei τὰ ἔθνη
  choice: neamurile
  alternative: națiunile; neevreii; păgânii
  rationale: În context există un contrast între ucenicii lui Isus și popoarele din afara comunității legământului. „Neamurile” păstrează această distincție istorică și teologică fără a o transforma într-o judecată morală absolută.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. „Neamurile” păstrează rezonanța biblică și ambiguitatea termenului grecesc; repetiția lui „căci” urmează deliberat structura explicativă a originalului.
