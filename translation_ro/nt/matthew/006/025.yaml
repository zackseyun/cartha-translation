id: MAT.6.25
reference: Matthew 6:25
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: ro
  text: 'De aceea vă spun: nu vă îngrijorați cu privire la viața[a] voastră, ce veți mânca, nici cu privire la trupul vostru, cu ce vă veți îmbrăca. Nu este oare viața mai mult decât hrana, iar trupul mai mult decât îmbrăcămintea?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „sufletul”; aici, contextul hranei și al îmbrăcăminții favorizează sensul „viață”.
    reason: Alternativă lexicală pentru ψυχή.
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: De aceea
  rationale: Redă firesc în româna actuală concluzia trasă din învățătura precedentă și păstrează legătura logică.
- source_word: μεριμνᾶτε
  choice: nu vă îngrijorați
  rationale: Verbul exprimă grija apăsătoare sau neliniștea; formularea este clară și idiomatică, fără a condamna preocuparea responsabilă în general.
- source_word: ψυχῇ / ψυχὴ
  choice: viața
  rationale: În contextul hranei și al nevoilor trupești, ψυχή desemnează viața persoanei, nu în mod specific sufletul imaterial. Alternativa lexicală autentică este păstrată în notă.
- source_word: τί φάγητε
  choice: ce veți mânca
  rationale: Subjunctivul din întrebarea indirectă privește o preocupare viitoare și se redă natural prin viitor în română.
- source_word: σώματι / σῶμα
  choice: trupul
  rationale: Se referă la corpul fizic și formează contrastul direct cu îmbrăcămintea; „trup” se potrivește registrului biblic modern fără a fi arhaic.
- source_word: τί ἐνδύσησθε
  choice: cu ce vă veți îmbrăca
  rationale: Redare românească firească a ideii de a pune pe sine sau a purta haine.
- source_word: οὐχὶ
  choice: Nu este oare
  rationale: Păstrează întrebarea retorică ce așteaptă un răspuns afirmativ și sună natural în română.
- source_word: πλεῖόν
  choice: mai mult decât
  rationale: Păstrează comparația deschisă din greacă, fără a o restrânge explicit la valoare sau importanță.
- source_word: τροφῆς
  choice: hrana
  rationale: Termen general pentru ceea ce susține viața; „hrană” este clar și potrivit registrului.
- source_word: ἐνδύματος
  choice: îmbrăcămintea
  rationale: Redă termenul general pentru haine și menține paralelismul cu „hrana”.
theological_decisions:
- issue: Sensul lui ψυχή în învățătura lui Isus
  choice: „viața” în textul principal
  alternative: „sufletul”
  rationale: Contextul imediat privește mâncarea, trupul și îmbrăcămintea, astfel că sensul contextual este viața persoanei. Nota păstrează alternativa lexicală fără a introduce o antropologie dualistă pe care versetul nu o afirmă explicit.
translation_notes:
  register: Română standard modernă, clară și demnă. S-a păstrat paralelismul dintre viață și hrană, respectiv trup și îmbrăcăminte, precum și caracterul retoric al întrebării finale.
