id: MAT.6.13
reference: Matthew 6:13
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ ⸀πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/013.yaml
  text: And do not lead us into temptation[b][a], but deliver us from evil.
translation:
  language: ro
  text: Și nu ne duce în ispită[a], ci scapă-ne de cel rău.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „încercare” ori „punere la probă”. Cuvântul grecesc poate desemna atât ispita, cât și o încercare grea.
    reason: lexical_alternative
  - marker: b
    text: Sau „de rău”. Expresia grecească poate fi înțeleasă personal („cel rău”) sau impersonal („răul”).
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εἰσενέγκῃς
  choice: nu ne duce
  rationale: Redă direct cererea formulată prin μή cu conjunctivul aorist, fără parafraza interpretativă „nu îngădui să fim duși”.
- source_word: πειρασμόν
  choice: ispită
  rationale: „Ispită” este expresia românească firească și consacrată aici, iar nota păstrează sensul posibil de încercare sau punere la probă.
- source_word: ῥῦσαι
  choice: scapă-ne
  rationale: Imperativul cere intervenția activă a lui Dumnezeu pentru salvare; „scapă-ne” este actual, direct și potrivit registrului rugăciunii.
- source_word: τοῦ πονηροῦ
  choice: cel rău
  rationale: Forma articulată poate fi masculină, cu referire personală la „cel rău”, sau neutră, „rău/răul”. Textul principal adoptă lectura personală, iar nota păstrează ambiguitatea autentică.
theological_decisions:
- issue: Sensul expresiei τοῦ πονηροῦ
  choice: cel rău
  alternative: rău / răul
  rationale: Greaca permite atât referirea personală la adversarul rău, cât și sensul impersonal de rău. Contextul ispitei susține lectura personală, fără a exclude lectura impersonală, consemnată în notă.
- issue: Raportul lui Dumnezeu cu ispita sau încercarea
  choice: nu ne duce
  alternative: nu îngădui să intrăm
  rationale: Este păstrată forma directă și tensiunea cererii grecești, fără introducerea unei explicații teologice care nu apare explicit în verset.
translation_notes:
  register: Română standard modernă, cu formulare demnă și ușor de înțeles. S-a păstrat cadența familiară a rugăciunii, evitându-se atât arhaismele, cât și parafrazele doctrinare.
