id: MAT.6.23
reference: Matthew 6:23
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν, τὸ σκότος πόσον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: ro
  text: Dar dacă ochiul tău este rău[a], tot trupul tău va fi întunecat. Așadar, dacă lumina din tine este întuneric, cât de mare este întunericul!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „nesănătos” ori, posibil, „zgârcit”, având în vedere idiomul legat de „ochi” și contextul apropiat.
    reason: Alternativă lexicală menită să păstreze gama semantică a lui πονηρός și posibila nuanță idiomatică.
lexical_decisions:
- source_word: πονηρὸς
  choice: rău
  rationale: 'Redă sensul larg al termenului și păstrează deschisă metafora: poate sugera răutate morală, vedere defectuoasă sau, idiomatic, lipsă de generozitate.'
- source_word: σκοτεινὸν
  choice: întunecat
  rationale: Echivalent adjectival firesc în română, care păstrează funcția predicativă și contrastul cu lumina.
- source_word: φῶς
  choice: lumina
  rationale: Păstrează imaginea explicită din greacă fără a o explica drept iluminare lăuntrică sau discernământ.
- source_word: σκότος
  choice: întuneric
  rationale: Păstrează contrastul metaforic cu lumina și repetiția culminantă din ultima propoziție.
- source_word: πόσον
  choice: cât de mare
  rationale: În propoziția exclamativă eliptică exprimă intensitatea; formularea este naturală și solemnă în română.
- source_word: ὀφθαλμός
  choice: ochiul
  rationale: Este păstrată imaginea corporală prin care sunt evocate percepția, orientarea și intenția.
- source_word: ὅλον τὸ σῶμά σου
  choice: tot trupul tău
  rationale: Redare directă și naturală, care păstrează accentul totalizator al lui ὅλον.
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: lumina din tine
  rationale: Redare concisă și apropiată de greacă; evită interpretarea suplimentară implicată de «lumina ta lăuntrică».
- source_word: οὖν
  choice: așadar
  rationale: Marchează clar concluzia sau inferența formulată de Isus, într-un registru demn și actual.
theological_decisions:
- issue: Sensul metaforei „ochiul rău”
  choice: Metafora largă este păstrată prin «rău», fără restrângerea la un singur sens.
  alternative: «nesănătos» ar accentua vederea defectuoasă; «invidios» sau «zgârcit» ar explicita idiomul privind lipsa generozității; «malefic» ar accentua corupția morală.
  rationale: 'Contextul din Matei 6:19–24 permite nuanțe suprapuse: întuneric moral, percepție distorsionată și posibil idiomul semitic al ochiului lipsit de generozitate. Textul principal păstrează tensiunea interpretativă, iar nota consemnează alternativele.'
translation_notes:
  register: Română standard modernă, clară și demnă. Sintaxa urmează îndeaproape progresia greacă, dar rămâne firească în română. Metaforele luminii, întunericului, ochiului și trupului sunt păstrate fără parafrază explicativă.
