id: MAT.6.30
reference: Matthew 6:30
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: ro
  text: Dar dacă Dumnezeu îmbracă astfel iarba de pe câmp, care astăzi este, iar mâine este aruncată în cuptor[a], nu vă va îmbrăca El cu atât mai mult, oameni cu puțină credință?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Cuptorul” se referă la un cuptor de copt; iarba și plantele uscate de pe câmp puteau fi folosite drept combustibil.
    reason: cultural_note
  - marker: b
    text: 'Sau: „voi, care aveți puțină credință”. Termenul grecesc este o adresare directă care mustră încrederea insuficientă.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χόρτον τοῦ ἀγροῦ
  choice: iarba de pe câmp
  rationale: Redă natural sensul de iarbă sau vegetație ierboasă spontană, fără a restrânge imaginea la flori.
- source_word: σήμερον ὄντα
  choice: care astăzi este
  rationale: Păstrează formularea existențială și caracterul trecător sugerat de participiul ὄντα, într-o exprimare românească demnă.
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: iar mâine este aruncată în cuptor
  rationale: κλίβανος desemnează un cuptor, probabil de pâine, iar pasivul păstrează imaginea vegetației uscate folosite drept combustibil.
- source_word: οὕτως ἀμφιέννυσιν
  choice: îmbracă astfel
  rationale: ἀμφιέννυμι înseamnă „a îmbrăca”; alegerea păstrează metafora îmbrăcării din context.
- source_word: οὐ πολλῷ μᾶλλον
  choice: nu vă va îmbrăca El cu atât mai mult
  rationale: Redă limpede întrebarea retorică și argumentul de la mai mic la mai mare, repetând verbul subînțeles în greacă pentru claritate.
- source_word: ὑμᾶς
  choice: pe voi
  rationale: Pronumele este obiectul verbului „a îmbrăca”; forma accentuată susține contrastul dintre iarba câmpului și destinatarii direcți.
- source_word: ὀλιγόπιστοι
  choice: oameni cu puțină credință
  rationale: Păstrează vocativul plural și mustrarea privind încrederea insuficientă, într-o română actuală și firească.
- source_word: εἰ δὲ
  choice: Dar dacă
  rationale: δέ marchează aici o ușoară opoziție sau continuare argumentativă, redată natural prin „Dar”.
theological_decisions:
- issue: Argumentul despre purtarea de grijă divină, de la mai mic la mai mare
  choice: Păstrarea întrebării retorice despre grija mai mare a lui Dumnezeu pentru destinatari
  alternative: Transformarea întrebării într-o afirmație
  rationale: Sintaxa greacă și vocativul final susțin o întrebare retorică menită să mustre lipsa de încredere, fără a adăuga afirmații doctrinare străine textului.
- issue: Forța lui ὀλιγόπιστοι
  choice: 'Adresare directă: „oameni cu puțină credință”'
  alternative: „necredincioșilor”
  rationale: Termenul indică o credință sau încredere insuficientă, nu absența totală a credinței; traducerea evită intensificarea teologică nejustificată.
translation_notes:
  register: Română standard modernă, clară și demnă. Inversiunea moderată „care astăzi este” păstrează caracterul concis și solemn al imaginii; „El” accentuează subiectul în întrebarea retorică, fără a introduce conținut nou.
