  source_fidelity: Textul redă corect construcția condițională, contrastul dintre vegetația trecătoare și destinatari, imaginea cuptorului, întrebarea retorică și vocativul final. „Cu atât mai mult” exprimă adecvat πολλῷ μᾶλλον. Nu este necesară introducerea unei interpretări doctrinare.
  naturalness: Formularea este în general firească în registru biblic modern. Totuși, combinația „vă ... pe voi” dublează inutil obiectul și, în această ordine, este greoaie. Pronumele clitic „vă” redă deja obiectul grec; eliminarea formei tonice face întrebarea mai fluentă.
