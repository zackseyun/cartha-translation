  text: ποιήσατε οὖν καρπὸν ἄξιον τῆς μετανοίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/008.yaml
  text: Therefore[a], produce fruit worthy of repentance.
translation:
  language: ro
  text: Așadar, aduceți rod vrednic de pocăință.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „rod potrivit cu pocăința”.'
    reason: Alternativa explicitează valoarea de corespondență a lui ἄξιον cu genitivul.
lexical_decisions:
- source_word: ποιήσατε
  choice: aduceți
  rationale: Imperativ aorist activ, persoana a doua plural, exprimă o chemare hotărâtă la acțiune. În română, „a aduce rod” este construcția firească pentru această imagine și redă sensul contextual al lui ποιέω fără formularea rigidă „faceți rod”.
- source_word: οὖν
  choice: Așadar
  rationale: Marchează concluzia trasă din avertizarea și îndemnul precedente. „Așadar” păstrează limpede legătura logică și are un registru demn, dar actual.
- source_word: καρπὸν
  choice: rod
  rationale: Redă substantivul singular καρπός, folosit metaforic pentru rezultatul vizibil în purtare. Singularul colectiv este firesc în română.
- source_word: ἄξιον
  choice: vrednic de
  rationale: Ἄξιος urmat de genitiv exprimă aici potrivire sau corespondență. „Vrednic de” păstrează formularea concentrată și tensiunea textului, iar nota oferă sensul alternativ explicit.
- source_word: μετανοίας
  choice: pocăință
  rationale: „Pocăință” este echivalentul românesc consacrat și adecvat contextual pentru μετάνοια, desemnând schimbarea lăuntrică și întoarcerea cerute de proclamarea lui Ioan, fără reducerea sensului la o simplă schimbare de opinie.
theological_decisions:
- issue: Sensul expresiei καρπὸν ἄξιον τῆς μετανοίας
  choice: O poruncă de a manifesta un rod care corespunde pocăinței autentice
  alternative: Un rod care câștigă pocăința sau care îi este egal ca valoare
  rationale: Construcția cu genitiv indică potrivire sau corespondență, nu merit. Traducerea păstrează cerința morală a textului fără să sugereze că faptele cumpără ori produc pocăința.
translation_notes:
  register: Română standard modernă, concisă și demnă. Expresia idiomatică „aduceți rod” păstrează imaginea agricolă și forța imperativului; „pocăință” evită parafraze reductive.
