id: MAT.3.1
reference: Matthew 3:1
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς ἡμέραις ἐκείναις παραγίνεται Ἰωάννης ὁ βαπτιστὴς κηρύσσων ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/001.yaml
  text: In those days John the Baptist came[a], preaching in the wilderness of Judea[b],
translation:
  language: ro
  text: În zilele acelea, a venit[a] Ioan Botezătorul[b], predicând în pustia Iudeei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „s-a arătat”. În greacă, verbul este la prezentul istoric.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „Ioan, cel care boteza”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ἐκείναις
  choice: În zilele acelea
  rationale: Expresia prepozițională indică timpul. Particula δέ marchează aici o tranziție narativă ușoară și nu necesită un echivalent românesc explicit.
- source_word: παραγίνεται
  choice: a venit
  rationale: Prezentul istoric grecesc este redat firesc prin perfectul compus în narațiunea românească. Verbul îl introduce pe Ioan în scenă fără a sugera în mod necesar o apariție miraculoasă.
- source_word: Ἰωάννης
  choice: Ioan
  rationale: Se folosește forma consacrată în limba română a numelui biblic.
- source_word: ὁ βαπτιστὴς
  choice: Botezătorul
  rationale: Este apelativul românesc consacrat și redă clar rolul lui Ioan ca persoană care botează.
- source_word: κηρύσσων
  choice: predicând
  rationale: Participiul exprimă o acțiune contemporană cu verbul principal; „predicând” este actual, natural și adecvat activității publice de vestire.
- source_word: ἐν τῇ ἐρήμῳ
  choice: în pustia
  rationale: Termenul desemnează o regiune nelocuită sau pustie; „pustia” evită imaginea modernă prea restrânsă a unui deșert nisipos.
- source_word: τῆς Ἰουδαίας
  choice: Iudeei
  rationale: Este denumirea geografică românească a regiunii Iudeea, nu numele tribal Iuda.
theological_decisions:
- issue: Redarea apelativului βαπτιστής
  choice: Botezătorul
  alternative: cel care boteza
  rationale: „Botezătorul” este apelativul tradițional și natural în română, iar alternativa explicitează sensul verbal fără a schimba conținutul. Alegerea este lexicală, nu confesională.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. S-a păstrat formula geografică familiară „pustia Iudeei”, evitând atât arhaismele, cât și formulările excesiv de explicative.
