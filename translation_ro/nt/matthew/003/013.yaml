id: MAT.3.13
reference: Matthew 3:13
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τότε παραγίνεται ὁ Ἰησοῦς ἀπὸ τῆς Γαλιλαίας ἐπὶ τὸν Ἰορδάνην πρὸς τὸν Ἰωάννην τοῦ βαπτισθῆναι ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/013.yaml
  text: Then Jesus comes from Galilee to the Jordan[a], to John[c][b], to be baptized by him.
translation:
  language: ro
  text: Atunci Isus vine din Galileea la Iordan, la Ioan, ca să fie botezat de el.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „pentru a fi botezat de el”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Marcator temporal care introduce următorul eveniment și păstrează cursul firesc al narațiunii.
- source_word: παραγίνεται
  choice: vine
  rationale: Prezent istoric folosit pentru vivacitate narativă; prezentul „vine” este firesc în română și păstrează efectul textului grec.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: din Galileea
  rationale: ἀπό indică punctul de plecare sau originea; „din Galileea” este formularea românească naturală.
- source_word: ἐπὶ τὸν Ἰορδάνην
  choice: la Iordan
  rationale: ἐπί cu acuzativul, într-un context de mișcare, indică deplasarea spre un loc; numele „Iordan” este suficient în context.
- source_word: πρὸς τὸν Ἰωάννην
  choice: la Ioan
  rationale: πρός cu acuzativul indică deplasarea spre o persoană. Repetarea prepoziției reflectă succesiunea greacă fără a adăuga titlul „Botezătorul”, absent din verset.
- source_word: τοῦ βαπτισθῆναι
  choice: ca să fie botezat
  rationale: Infinitivul articulat exprimă scopul; construcția românească „ca să” redă explicit și natural această funcție.
- source_word: ὑπ’ αὐτοῦ
  choice: de el
  rationale: ὑπό cu genitivul marchează agentul personal; pronumele păstrează formularea explicită a grecei fără repetarea interpretativă a numelui lui Ioan.
theological_decisions:
- issue: Redarea prezentului istoric παραγίνεται
  choice: Prezentul narativ „vine”
  alternative: Trecutul simplu narativ „a venit”
  rationale: Textul grec folosește prezentul istoric. Româna permite prezentul narativ, care păstrează caracterul viu al relatării fără implicații doctrinare.
- issue: Identificarea lui Ioan printr-un titlu
  choice: Numai „Ioan”
  alternative: „Ioan Botezătorul”
  rationale: Versetul grec conține doar numele. Titlul nu este adăugat, deoarece contextul îl identifică deja, iar traducerea nu trebuie să introducă material absent.
- issue: Raportul dintre Iordan și Ioan
  choice: „la Iordan, la Ioan”
  alternative: „la Iordan și la Ioan”
  rationale: Juxtapunerea păstrează mai îndeaproape cele două construcții prepoziționale grecești și îl prezintă pe Ioan ca persoana la care vine Isus în zona Iordanului, fără a transforma formularea într-o listă de destinații independente.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Prezentul narativ păstrează vivacitatea originalului; topica rămâne apropiată de greacă, dar este inteligibilă în română.
