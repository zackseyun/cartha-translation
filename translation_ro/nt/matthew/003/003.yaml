id: MAT.3.3
reference: Matthew 3:3
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: ro
  text: 'Căci acesta este cel despre care s-a vorbit prin profetul Isaia, care spune:


    „Glasul celui ce strigă în pustiu[a]:


    «Pregătiți calea Domnului[b],


    faceți drepte cărările lui!»”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, cu o altă delimitare a citatului: „Glasul celui ce strigă: «În pustiu pregătiți calea Domnului...»”'
    reason: Punctuația manuscriselor grecești timpurii nu stabilește fără echivoc dacă „în pustiu” se leagă de „strigă” sau de „pregătiți”.
  - marker: b
    text: Sau „DOMNULUI”; citatul trimite la Isaia 40:3, unde textul ebraic are numele divin YHWH.
    reason: Nota păstrează contextul veterotestamentar al lui κυρίου și explică alternativa tipografică folosită pentru numele divin.
lexical_decisions:
- source_word: οὗτος γάρ ἐστιν
  choice: Căci el este
  rationale: Demonstrația grecească se referă la Ioan Botezătorul; pronumele „el” este firesc în română, iar „căci” păstrează rolul explicativ al lui γάρ.
- source_word: ὁ ῥηθεὶς διὰ Ἠσαΐου τοῦ προφήτου
  choice: cel despre care s-a vorbit prin profetul Isaia
  rationale: Participiul pasiv substantivizat este redat idiomatic, iar „prin” păstrează ideea de mijlocire profetică exprimată de διά cu genitivul.
- source_word: λέγοντος
  choice: care spune
  rationale: Participiul îl determină pe Isaia și introduce citatul; prezentul românesc este natural într-o formulă de citare scripturistică.
- source_word: Φωνὴ βοῶντος
  choice: Glasul celui ce strigă
  rationale: Redarea păstrează relația dintre „glas” și persoana care strigă, într-o formulare românească firească și demnă.
- source_word: ἐν τῇ ἐρήμῳ
  choice: în pustiu
  rationale: „Pustiu” denumește potrivit ținutul nelocuit asociat slujirii lui Ioan și păstrează rezonanța citatului din Isaia.
- source_word: Ἑτοιμάσατε τὴν ὁδὸν κυρίου
  choice: Pregătiți calea Domnului
  rationale: Imperativul plural și metafora căii sunt păstrate direct; „Domnului” redă forma grecească κυρίου.
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: faceți drepte cărările lui
  rationale: Formularea reproduce explicit construcția „faceți drepte” și păstrează pluralul poetic „cărările”, precum și pronumele personal.
theological_decisions:
- issue: Redarea lui κυρίου într-un citat din Isaia 40:3, unde textul ebraic conține numele divin YHWH
  choice: Domnului
  alternative: DOMNULUI
  rationale: Textul grecesc al lui Matei are κυρίου, redat în mod normal prin „Domnului”. Nota semnalează transparent că sursa ebraică a citatului folosește numele divin YHWH, fără a înlocui forma textului grecesc în corpul versetului.
- issue: Legarea sintagmei ἐν τῇ ἐρήμῳ
  choice: 'de verbul „strigă”: „celui ce strigă în pustiu”'
  alternative: 'de porunca următoare: „În pustiu pregătiți calea...”'
  rationale: Ordinea și punctuația tradițională a textului grecesc susțin lectura principală, dar manuscrisele vechi nu aveau punctuația modernă, iar paralela ebraică din Isaia permite cealaltă delimitare; ambiguitatea este păstrată în notă.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Dispunerea poetică marchează citatul profetic, iar ghilimelele românești diferențiază citatul exterior de cuvintele rostite în interiorul lui.
