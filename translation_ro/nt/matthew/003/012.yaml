id: MAT.3.12
reference: Matthew 3:12
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: ro
  text: Are în mână lopata de vânturat[a] și își va curăța cu desăvârșire aria; își va strânge grâul în hambar[b], dar pleava o va arde cu totul într-un foc care nu se stinge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „furca de vânturat”. Unealta era folosită pentru a arunca cerealele în aer, astfel încât boabele să fie separate de pleavă.
    reason: lexical_alternative
  - marker: b
    text: Sau „grânar” ori „magazie”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: lopata de vânturat
  rationale: Desemnează unealta cu care cerealele erau aruncate în aer pentru separarea boabelor de pleavă. Formularea este firească în română și păstrează concret imaginea agricolă; forma exactă a uneltei nu este precizată fără echivoc.
- source_word: διακαθαριεῖ
  choice: Își va curăța cu desăvârșire
  rationale: Verbul compus exprimă o curățare deplină. „Cu desăvârșire” redă intensificarea fără a transforma metafora într-o explicație teologică.
- source_word: ἅλωνα
  choice: aria
  rationale: Este termenul românesc consacrat pentru locul unde cerealele sunt treierate și vânturate.
- source_word: σῖτον
  choice: grâul
  rationale: Deși termenul poate desemna cerealele în general, contrastul cu pleava și contextul vânturării susțin redarea firească prin „grâu”.
- source_word: ἀποθήκην
  choice: hambar
  rationale: Redă natural un loc destinat păstrării cerealelor, fără a pierde sensul general de spațiu de depozitare.
- source_word: ἄχυρον
  choice: pleava
  rationale: În această imagine a vânturării, desemnează partea fără valoare separată de boabe; „pleavă” este termenul contextual exact în română.
- source_word: κατακαύσει
  choice: o va arde cu totul
  rationale: Prefixul verbului sugerează arderea completă; „cu totul” păstrează această intensificare.
- source_word: πυρὶ ἀσβέστῳ
  choice: într-un foc care nu se stinge
  rationale: Formularea redă limpede focul imposibil de stins. Prepoziția „într-un” este idiomatică în română în acest context, deși dativul grec poate fi înțeles instrumental.
- source_word: οὗ
  choice: El Își are
  rationale: Pronumele relativ genitival trimite la Cel care vine din versetul precedent. Restructurarea ca propoziție independentă produce o formulare românească naturală și păstrează posesia.
theological_decisions:
- issue: Imaginea judecății prin separarea grâului de pleavă
  choice: Metafora agricolă concretă și limbajul viitoarei judecăți sunt păstrate fără atenuare.
  alternative: O parafrază care identifică explicit grâul cu cei drepți și pleava cu cei răi.
  rationale: Versetul prezintă imaginea și deznodământul ei sever, dar nu explicitează aici referenții metaforei. Traducerea nu trebuie să introducă în text o interpretare care aparține explicării lui.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. Termenii agricoli „arie”, „lopată de vânturat”, „grâu”, „hambar” și „pleavă” păstrează unitatea imaginii. Majuscula reverențială din „Își” indică referirea la Cel care vine, fără a adăuga o identificare absentă din verset.
