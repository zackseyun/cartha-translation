    issue: Construcția „El Își are lopata de vânturat în mână” este neidiomatică.
    rationale: În româna modernă, verbul „a avea” nu se construiește firesc aici cu reflexivul posesiv „își”. „Are în mână lopata de vânturat” redă posesivul grec și este natural.
  - severity: low
