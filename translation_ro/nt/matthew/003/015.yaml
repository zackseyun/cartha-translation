base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: ro
  text: 'Dar Isus i-a răspuns: „Îngăduie acum, căci în felul acesta se cuvine să împlinim toată dreptatea[a].” Atunci Ioan i-a îngăduit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „toată justiția”. Termenul grecesc poate desemna dreptatea sau justiția; aici „dreptatea” se potrivește mai bine cu accentul lui Matei asupra conformării cu voia lui Dumnezeu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: Dar Isus i-a răspuns
  rationale: Redă firesc idiomul grecesc „răspunzând, a zis”, iar „Dar” păstrează contrastul cu împotrivirea lui Ioan din versetul anterior.
- source_word: Ἄφες ἄρτι
  choice: Lasă să fie așa acum
  rationale: ἀφίημι are aici sensul de a permite, nu de a ierta sau de a părăsi. Formularea românească explicitează natural acțiunea subînțeleasă, iar „acum” păstrează referirea la momentul prezent.
- source_word: οὕτως γὰρ
  choice: căci în felul acesta
  rationale: Păstrează atât valoarea explicativă a lui γάρ, cât și trimiterea lui οὕτως la botezul pe care Ioan urmează să-l facă.
- source_word: πρέπον ἐστὶν ἡμῖν
  choice: se cuvine
  rationale: „Se cuvine” exprimă concis ceea ce este potrivit și corespunzător, păstrând totodată persoana întâi plural prin verbul următor.
- source_word: πληρῶσαι
  choice: să împlinim
  rationale: „A împlini” păstrează rezonanța caracteristică verbului πληρόω în Matei și ideea ducerii la îndeplinire a voii divine.
- source_word: πᾶσαν δικαιοσύνην
  choice: toată dreptatea
  rationale: Formularea păstrează amploarea expresiei grecești și nu o reduce la respectarea unor cerințe legale precise. În româna actuală, „dreptate” poate cuprinde atât caracterul drept, cât și ceea ce corespunde voii drepte a lui Dumnezeu.
- source_word: τότε ἀφίησιν αὐτόν
  choice: Atunci Ioan i-a dat voie
  rationale: Prezentul istoric este redat firesc prin trecut. Subiectul „Ioan” este explicitat din context pentru claritate, iar expresia arată că el a consimțit să-l boteze pe Isus, nu că l-a părăsit.
theological_decisions:
- issue: Sensul expresiei „toată dreptatea”
  choice: Referire largă la împlinirea a ceea ce corespunde voii drepte a lui Dumnezeu în această împrejurare, prin primirea botezului lui Ioan de către Isus.
  alternative: Împlinirea fiecărei cerințe legale sau accentul exclusiv pe justiție.
  rationale: Textul nu precizează un cod legal și nici nu dezvoltă aici un sistem doctrinar. Formularea largă păstrează tensiunea și amplitudinea expresiei mateene.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. Formularea evită atât arhaismul, cât și parafraza doctrinară; repetiția verbului grecesc ἀφίημι este redată idiomatic în funcție de context.
