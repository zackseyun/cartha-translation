  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: ro
  text: Când a fost botezat Isus, a ieșit îndată din apă.[a] Și iată, cerurile s-au deschis, iar el a văzut Duhul lui Dumnezeu coborând ca un porumbel și venind peste el.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. „a urcat de la apă”; greaca folosește expresia ἀπὸ τοῦ ὕδατος, „de la/dinspre apă”.
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „coborând asemenea unui porumbel și venind peste el”. Termenul grecesc exprimă o comparație, fără a preciza dacă aceasta privește forma ori felul coborârii.'
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτισθεὶς δὲ ὁ Ἰησοῦς
  choice: După ce a fost botezat, Isus
  rationale: Participiul aorist pasiv exprimă aici o acțiune anterioară verbului principal. Formularea românească redă limpede succesiunea și păstrează diateza pasivă, fără rigiditatea lui „fiind botezat”.
- source_word: εὐθὺς
  choice: îndată
  rationale: Redă promptitudinea succesiunii într-un registru actual, demn și firesc pentru narațiunea biblică.
- source_word: ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: a ieșit din apă
  rationale: În contextul botezului, ἀναβαίνω cu ἀπό indică urcarea sau ieșirea dinspre apă. „A ieșit din apă” este formularea românească naturală; nota păstrează mai transparent imaginea mișcării ascendente și valoarea prepoziției.
- source_word: ἰδοὺ
  choice: iată
  rationale: Păstrează funcția de captare a atenției și vivacitatea scenei, fiind totodată consacrat și inteligibil în româna modernă.
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: cerurile s-au deschis
  rationale: Păstrează pluralul grecesc și exprimă natural în română pasivul grecesc, fără a reduce termenul la simplul „cer” atmosferic.
- source_word: εἶδεν
  choice: el a văzut
  rationale: Pronumele explicit conservă subiectul gramatical masculin singular din context fără a decide prin traducere dacă și alți martori au văzut scena.
- source_word: πνεῦμα θεοῦ
  choice: Duhul lui Dumnezeu
  rationale: Redă construcția genitivală și referința contextuală determinată, fără a înlocui expresia sursă cu titlul mai explicit „Duhul Sfânt”.
- source_word: καταβαῖνον ὡσεὶ περιστερὰν
  choice: coborând ca un porumbel
  rationale: Păstrează mișcarea participială și comparația introdusă de ὡσεὶ, fără a afirma că Duhul era literalmente un porumbel.
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: venind peste el
  rationale: Redă verbul general „a veni” și direcția indicată de ἐπί, evitând interpretarea mai specifică „așezându-se pe el”.
theological_decisions:
- issue: Identitatea lui πνεῦμα θεοῦ
  choice: Duhul lui Dumnezeu
  alternative: un duh de la Dumnezeu / Duhul Sfânt
  rationale: Contextul indică Duhul lui Dumnezeu ca referent determinat. Traducerea păstrează exact expresia greacă și nu o face nici generică, nici mai explicită decât sursa.
- issue: Natura comparației ὡσεὶ περιστερὰν
  choice: ca un porumbel
  alternative: în chip de porumbel
  rationale: Particula ὡσεὶ marchează asemănarea. „Ca un porumbel” menține deschis dacă asemănarea privește în primul rând forma vizibilă ori felul coborârii.
- issue: Referentul subiectului din εἶδεν
  choice: el a văzut
  alternative: Ioan a văzut
  rationale: Forma verbală nu numește explicit subiectul. Antecedentul gramatical cel mai apropiat este Isus, dar traducerea nu introduce un nume absent din text și păstrează tensiunea cu relatările paralele.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. „Iată” și pluralul „cerurile” păstrează relieful și rezonanța textului biblic fără arhaizare excesivă. Toți markerii notelor apar în text.
