id: MAT.3.17
reference: Matthew 3:17
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ φωνὴ ἐκ τῶν οὐρανῶν λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: ro
  text: 'Și iată, un glas din ceruri[a] a zis: „Acesta este Fiul Meu preaiubit, în care Mi-am găsit plăcerea.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „din cer”. Greaca are pluralul „din ceruri”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „în care Îmi găsesc plăcerea”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Și iată
  rationale: Păstrează funcția de marcator discursiv care atrage solemn atenția asupra evenimentului, într-o formulare românească încă firească și ușor de înțeles.
- source_word: φωνὴ
  choice: un glas
  rationale: Contextul indică un glas articulat, deoarece urmează vorbire directă; „glas” se potrivește și registrului solemn al scenei.
- source_word: ἐκ τῶν οὐρανῶν
  choice: din ceruri
  rationale: Redă pluralul explicit al textului grec și sună natural în româna biblică modernă.
- source_word: λέγουσα
  choice: a zis
  rationale: Participiul introduce citatul, iar o formă verbală finită este mai firească în română decât construcția literală „un glas... zicând”.
- source_word: Οὗτός ἐστιν
  choice: Acesta este
  rationale: Redă direct și natural identificarea exprimată prin demonstrativ și copulă.
- source_word: ὁ υἱός μου
  choice: Fiul Meu
  rationale: Păstrează relația filială explicită și funcția cristologică a expresiei în context; majusculele marchează referirea la Isus și vorbitorul divin fără a adăuga conținut doctrinar.
- source_word: ὁ ἀγαπητός
  choice: preaiubit
  rationale: Redă sensul de „iubit în mod deosebit” și păstrează tonul solemn și afectiv al declarației; în română se leagă firesc de „Fiul Meu”.
- source_word: ἐν ᾧ
  choice: în care
  rationale: Păstrează construcția greacă și ambiguitatea ei relațională, fiind totodată idiomatică împreună cu expresia românească „Îmi găsesc plăcerea”.
- source_word: εὐδόκησα
  choice: Îmi găsesc plăcerea
  rationale: Exprimă aprobarea și desfătarea divină într-o formulare românească naturală, fără a forța aoristul într-un trecut punctual care ar putea denatura caracterul declarației.
theological_decisions:
- issue: Redarea declarației divine despre filiația lui Isus
  choice: Fiul Meu preaiubit
  alternative: Fiul Meu cel iubit
  rationale: Păstrează explicit filiația și iubirea declarate de text, fără să explice natura acestei filiații sau să introducă o schemă doctrinară suplimentară.
- issue: Valoarea temporală a aoristului εὐδόκησα
  choice: Îmi găsesc plăcerea
  alternative: Mi-am găsit plăcerea
  rationale: Formula declară aprobarea divină față de Fiul; prezentul idiomatic românesc comunică starea relevantă în context, fără a afirma că aoristul are neapărat o valoare strict trecută.
- issue: Pluralul οὐρανῶν
  choice: din ceruri
  alternative: din cer
  rationale: Este păstrat pluralul sursei grecești, fără a construi din el o afirmație cosmologică suplimentară.
translation_notes:
  register: Română standard modernă, cu ton demn și solemn. Au fost evitate atât arhaismele greoaie precum „zicând”, cât și parafrazele explicative. „Și iată” și „glas” mențin caracterul marcat al scenei, iar sintaxa rămâne limpede pentru cititorul contemporan.
