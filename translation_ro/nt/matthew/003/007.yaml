id: MAT.3.7
reference: Matthew 3:7
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: ro
  text: 'Dar, când a văzut că mulți dintre farisei și saduchei veneau la botezul lui[a], le-a spus: „Pui de vipere, cine v-a avertizat să fugiți de mânia care vine?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Unele manuscrise nu includ „lui”.
    reason: variantă textuală
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Dar, când a văzut
  rationale: Participiul aorist este redat firesc printr-o propoziție temporală, iar δέ păstrează tranziția ușor contrastivă din relatare.
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: mulți dintre farisei și saduchei
  rationale: Construcția partitivă arată că este vorba despre mulți membri ai acestor grupuri, nu neapărat despre toți.
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: veneau la botezul lui
  rationale: Redarea păstrează ideea apropierii de botezul administrat de Ioan, fără a afirma în plus că aceștia au și primit botezul.
- source_word: Γεννήματα ἐχιδνῶν
  choice: Pui de vipere
  rationale: Expresia este vie și firească în româna actuală și redă sensul de progenitură sau odraslă, păstrând forța mustrării profetice.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: cine v-a avertizat
  rationale: În contextul fugii de mânia iminentă, ὑποδείκνυμι are sensul contextual de a avertiza, nu doar de a arăta sau explica.
- source_word: φυγεῖν ἀπὸ
  choice: să fugiți de
  rationale: Păstrează direct imaginea unei fugi urgente din fața primejdiei.
- source_word: τῆς μελλούσης ὀργῆς
  choice: mânia care vine
  rationale: Redă atât sensul lui ὀργή, fără atenuare prin „pedeapsă” sau „judecată”, cât și caracterul iminent al lui μέλλω.
theological_decisions:
- issue: Întinderea mustrării adresate fariseilor și saducheilor
  choice: Mustrarea îi vizează pe mulți dintre membrii acestor grupuri care veneau la botez.
  alternative: Mustrarea caracterizează fără deosebire toate persoanele aparținând celor două grupuri.
  rationale: Genitivul partitiv din text susține referirea la o parte dintre ei și evită o generalizare care depășește formularea greacă.
- issue: Forța escatologică a termenului ὀργή
  choice: mânie
  alternative: judecată sau pedeapsă
  rationale: „Mânie” păstrează gravitatea teologică și tensiunea formulării originale, fără a preciza mai mult decât spune versetul despre forma acesteia.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea evită atât rigiditatea arhaizantă, cât și parafraza explicativă; interogația și invectiva își păstrează forța profetică.
