source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰωάννης διεκώλυεν αὐτὸν λέγων· Ἐγὼ χρείαν ἔχω ὑπὸ σοῦ βαπτισθῆναι, καὶ σὺ ἔρχῃ πρός με;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/014.yaml
  text: But John kept trying to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
translation:
  language: ro
  text: 'Dar Ioan tot încerca să-l oprească[a], spunând: „Eu am nevoie să fiu botezat de tine, și tu vii la mine?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Ioan încerca să-l oprească”. Imperfectul grecesc poate sugera o acțiune continuă sau repetată.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκώλυεν
  choice: încerca să-l oprească
  rationale: Imperfectul indică o acțiune în desfășurare sau o încercare stăruitoare. Formularea românească redă natural opoziția continuă fără a afirma că Ioan a reușit efectiv să-l împiedice.
- source_word: λέγων
  choice: spunând
  rationale: Păstrează legătura participială dintre încercarea lui Ioan de a-l opri și explicația rostită de acesta.
- source_word: χρείαν ἔχω
  choice: am nevoie
  rationale: Redă idiomatic și clar expresia grecească «a avea nevoie».
- source_word: ὑπὸ σοῦ
  choice: de tine
  rationale: În construcția pasivă, ὑπό cu genitivul indică agentul; în română, «să fiu botezat de tine» este formularea firească și exactă.
- source_word: βαπτισθῆναι
  choice: să fiu botezat
  rationale: Redă direct infinitivul aorist pasiv, fără a preciza în mod nejustificat modalitatea botezului.
- source_word: καὶ σὺ ἔρχῃ πρός με;
  choice: și tu vii la mine?
  rationale: Păstrează întrebarea retorică și contrastul implicit al textului grec, fără adaosul interpretativ «totuși».
- source_word: δὲ
  choice: Dar
  rationale: Exprimă contrastul dintre venirea lui Isus pentru a fi botezat și împotrivirea lui Ioan.
theological_decisions:
- issue: Obiecția lui Ioan față de botezarea lui Isus
  choice: Afirmația este redată simplu ca recunoaștere de către Ioan a propriei nevoi și a superiorității lui Isus.
  alternative: Explicarea explicită a obiecției prin lipsa de păcat a lui Isus sau numai prin rangul și autoritatea sa.
  rationale: Versetul nu precizează temeiul teologic complet al obiecției. Traducerea păstrează tensiunea și evită introducerea unei explicații doctrinare care nu apare explicit în text.
translation_notes:
  register: Română standard modernă, clară și demnă. «Încerca să-l oprească» este mai firesc decât o redare rigidă precum «îl împiedica», iar pronumele și ordinea cuvintelor păstrează claritatea dialogului.
