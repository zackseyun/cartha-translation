lexical_decisions:
- source_word: καὶ λέγων
  choice: și spunea
  rationale: Redă natural în română participiul prezent care continuă relatarea din versetul anterior, fără a introduce ideea mai precisă de proclamare.
- source_word: Μετανοεῖτε
  choice: Schimbați-vă felul de a gândi
  rationale: Imperativul plural cheamă la o reorientare fundamentală a minții și a perspectivei. Formularea evită sensul modern, uneori îngust sau confesional, pe care îl poate căpăta „pocăiți-vă”, fără a reduce chemarea la simplul regret afectiv.
- source_word: ἤγγικεν
  choice: s-a apropiat
  rationale: Perfectul verbului ἐγγίζω arată că Împărăția a venit aproape și se află acum aproape.
- source_word: γὰρ
  choice: căci
  rationale: Introduce temeiul chemării precedente și păstrează tonul concis, solemn al proclamării.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Împărăția cerurilor
  rationale: Păstrează expresia caracteristică lui Matei și pluralul grecesc, într-o formulare consacrată și firească în română.
theological_decisions:
- issue: Sensul chemării Μετανοεῖτε
  choice: Schimbați-vă felul de a gândi
  alternative: Pocăiți-vă
  rationale: Textul principal evidențiază reorientarea profundă cerută de verb, fără a o limita la sentimentul de vinovăție. Nota păstrează echivalentul biblic tradițional, care poate include și întoarcerea morală.
- issue: Sensul expresiei „Împărăția cerurilor”
  choice: Împărăția cerurilor
  alternative: domnia cerurilor / Împărăția lui Dumnezeu
  rationale: Este păstrată formularea proprie lui Matei, fără a o interpreta exclusiv ca domeniu, domnie abstractă sau substitut explicit pentru numele lui Dumnezeu.
translation_notes:
  register: Română standard modernă, cu ton demn și proclamativ. „Și spunea” evită rigiditatea lui „și zicând”, iar „căci” păstrează legătura argumentativă și registrul biblic fără a deveni arhaic.
