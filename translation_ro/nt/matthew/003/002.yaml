  text: 'și spunea: „Pocăiți-vă[a], căci Împărăția cerurilor[b] s-a apropiat.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Schimbați-vă gândirea”. Verbul grecesc implică o schimbare profundă a minții și a orientării, o întoarcere, nu doar regret sau vinovăție.'
