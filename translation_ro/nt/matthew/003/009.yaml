source:
  edition: SBLGNT
  text: καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/009.yaml
  text: And do not presume to say among yourselves[a], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: ro
  text: 'Nu vă închipuiți că puteți spune între voi[a]: «Îl avem ca tată pe Avraam!», căci vă spun că Dumnezeu poate să-i ridice lui Avraam copii din pietrele acestea.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „a spune în sinea voastră”. Expresia grecească poate desemna fie vorbirea lăuntrică, fie ceea ce își spun unii altora în cadrul grupului.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δόξητε
  choice: să nu vă închipuiți că puteți
  rationale: În interdicție, verbul avertizează împotriva adoptării unei presupuneri neîntemeiate și sigure de sine. Formularea românească redă atât ideea de presupunere, cât și pretenția implicită de a invoca descendența.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: spune între voi
  rationale: Pluralul reflexiv poate indica fie vorbirea în cadrul grupului, fie vorbirea lăuntrică. Textul principal redă firesc sensul colectiv, iar nota păstrează alternativa autentică.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Îl avem ca tată pe Avraam
  rationale: Păstrează construcția emfatică și revendicarea descendenței, într-o română actuală și naturală.
- source_word: λέγω γὰρ ὑμῖν
  choice: căci vă spun
  rationale: Redă formula solemnă de discurs și păstrează valoarea explicativă a lui γάρ.
- source_word: δύναται
  choice: poate
  rationale: Exprimă limpede puterea sau capacitatea lui Dumnezeu, fără adaos interpretativ.
- source_word: ἐκ τῶν λίθων τούτων
  choice: din pietrele acestea
  rationale: Redare directă și idiomatică a provenienței exprimate prin ἐκ.
- source_word: ἐγεῖραι
  choice: să-i ridice
  rationale: Păstrează forța verbului și rezonanța imaginii sursă; în context înseamnă a face să apară sau a da urmași, fără a impune aici sensul de înviere.
- source_word: τέκνα
  choice: copii
  rationale: Termenul este incluziv și desemnează copii sau descendenți, fără restrângerea la fii de sex masculin.
- source_word: τῷ Ἀβραάμ
  choice: lui Avraam
  rationale: Dativul exprimă relația cu Avraam; construcția românească este naturală și lasă contextul să indice sensul de descendenți.
theological_decisions:
- issue: Semnificația descendenței din Avraam în avertismentul lui Ioan
  choice: Versetul respinge încrederea în descendența fizică din Avraam ca temei suficient înaintea lui Dumnezeu, fără a nega paternitatea istorică a lui Avraam față de Israel.
  alternative: Afirmația ar fi doar o hiperbolă fără critică teologică a privilegiului genealogic sau ar implica înlocuirea Israelului etnic ca atare.
  rationale: Formularea mustră direct siguranța întemeiată pe origine, dar nu formulează concluzii despre înlocuirea Israelului. Traducerea păstrează această tensiune fără a introduce un sistem teologic ulterior.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Topica și punctuația urmăresc caracterul direct al mustrării; exclamația redă siguranța emfatică a revendicării, fără a adăuga conținut doctrinar.
