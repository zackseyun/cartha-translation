id: MAT.3.10
reference: Matthew 3:10
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: ro
  text: Securea este deja așezată la rădăcina pomilor.[a] Așadar, orice pom care nu face rod bun este tăiat și aruncat în foc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Securea zace deja la rădăcina pomilor.”'
    reason: Alternativă lexicală pentru κεῖται, care poate descrie nemijlocit faptul că securea se află acolo, gata de folosire.
lexical_decisions:
- source_word: ἤδη δὲ
  choice: este deja
  rationale: Redă nemijlocirea judecății și legătura ușoară cu avertismentul anterior; în română, continuitatea este exprimată firesc fără un corespondent separat, rigid, pentru δέ.
- source_word: ἡ ἀξίνη
  choice: securea
  rationale: „Securea” este termenul românesc curent și precis pentru unealta din imaginea tăierii pomilor.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: este așezată la rădăcina pomilor
  rationale: Păstrează atât poziționarea uneltei, cât și sensul lui κεῖται, fără a sugera încă executarea loviturii.
- source_word: πᾶν οὖν δένδρον
  choice: Așadar, orice pom
  rationale: οὖν introduce concluzia desprinsă din imaginea securii; „așadar” exprimă limpede inferența.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: care nu face rod bun
  rationale: Urmează îndeaproape verbul ποιέω și păstrează formularea metaforică simplă; „rod” este natural în registrul biblic românesc și ușor de înțeles.
- source_word: ἐκκόπτεται
  choice: este tăiat
  rationale: În contextul pomului, exprimă tăierea lui; româna nu cere adăugarea unui adverb pentru ca imaginea să fie clară.
- source_word: καὶ εἰς πῦρ βάλλεται
  choice: și aruncat în foc
  rationale: Redare directă și actuală, care păstrează imaginea judecății fără explicații doctrinare suplimentare.
theological_decisions:
- issue: Natura imaginii focului
  choice: „în foc”, fără precizare interpretativă
  alternative: „în focul judecății” sau „în focul iadului”
  rationale: Textul evocă limpede judecata, dar nu definește aici mai exact focul; formularea păstrează tensiunea și amploarea metaforei.
- issue: Timpul verbelor pasive ἐκκόπτεται și βάλλεται
  choice: 'prezentul: „este tăiat și aruncat”'
  alternative: 'viitorul: „va fi tăiat și aruncat”'
  rationale: Prezentul grecesc conferă avertismentului caracter viu și iminent; păstrarea prezentului evită transformarea lui explicită într-o simplă predicție viitoare.
translation_notes:
  register: Română standard modernă, cu ton demn și direct. „Pom”, „rod” și „secure” sunt termeni firești și păstrează claritatea imaginii biblice fără arhaizare excesivă.
