review_pass:
  verdict: revise
  source_fidelity: „Veneau la el” redă direcția și imperfectul, dar atenuează sensul lui ἐξεπορεύετο („ieșeau”, „porneau/mergeau dinspre locurile lor”). În plus, acordul plural cu denumiri geografice metonimice este posibil, însă formularea actuală face ca localitățile și regiunile înseși să pară subiectele directe ale deplasării. Explicitarea discretă a persoanelor păstrează sensul metonimic al originalului și este mai clară în româna actuală.
  naturalness: Textul este în general clar, dar „Ierusalimul ... veneau la el” este mai puțin firesc decât o formulare care identifică oamenii reprezentați de numele geografice. „Ieșeau la el” este o formulare biblică standard și inteligibilă; imperfectul redă adecvat caracterul continuu sau repetat.
  terminology: „Iudeea”, „Iordanul” și „regiunea din jurul Iordanului” sunt corecte și potrivite registrului. Nota alternativă trebuie actualizată, deoarece, cu textul actual, „continuau să vină” nu oferă o alternativă lexicală relevantă și nu păstrează nuanța de „ieșire” a verbului grec.
  issues:
  - severity: medium
    issue: Nuanța lui ἐξεπορεύετο este atenuată.
    rationale: Verbul desemnează literalmente ieșirea/plecarea dintr-un loc către Ioan. „Veneau” este acceptabil contextual, dar nu reflectă această componentă atunci când există o soluție românească firească.
  - severity: low
    issue: Metonimia geografică produce o construcție ușor nefirească.
    rationale: „Ierusalimul, toată Iudeea ... veneau” poate fi înțeles, dar în română sună ca și cum regiunile s-ar deplasa. „Oameni din...” explicitează numai ceea ce originalul exprimă metonimic.
  - severity: low
    issue: Nota a nu este aliniată cu opțiunea lexicală revizuită.
    rationale: Este preferabil ca alternativa să ofere lectura mai idiomatică „se duceau la el”, menționând totodată aspectul imperfectului.
  revised_text: Atunci, oameni din Ierusalim, din toată Iudeea și din toată regiunea din jurul Iordanului ieșeau la el.[a][b]
