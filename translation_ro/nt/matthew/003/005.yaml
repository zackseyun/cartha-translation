- from: Atunci, Ierusalimul, toată Iudeea și toată regiunea din jurul Iordanului veneau la el.[a][b]
  to: Atunci, oameni din Ierusalim, din toată Iudeea și din toată regiunea din jurul Iordanului ieșeau la el.[a][b]
  rationale: Revizuirea redă mai exact componenta de „ieșire” a lui ἐξεπορεύετο, păstrează imperfectul prin „ieșeau” și face metonimia geografică naturală pentru cititorul român prin „oameni din”. Totalizările geografice și ambiguitatea lor retorică rămân nealterate, iar ancorele notelor sunt consecutive și plasate la finalul versetului.
