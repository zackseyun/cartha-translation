  text: τότε ἐξεπορεύετο πρὸς αὐτὸν Ἱεροσόλυμα καὶ πᾶσα ἡ Ἰουδαία καὶ πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/005.yaml
  text: Then Jerusalem[a], all Judea, and all the region around the Jordan were going out to him[c][b],
translation:
  language: ro
  text: Atunci, oameni din Ierusalim, din toată Iudeea și din toată regiunea din jurul Iordanului ieșeau la el.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „se duceau la el”; imperfectul grecesc poate indica o acțiune în desfășurare sau repetată.'
    reason: lexical_alternative
  - marker: b
    text: Expresiile „toată Iudeea” și „toată regiunea din jurul Iordanului” descriu amploarea răspunsului la lucrarea lui Ioan, fără să însemne neapărat fiecare locuitor în parte.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Redă firesc marcatorul temporal care leagă reacția oamenilor de lucrarea lui Ioan descrisă anterior.
- source_word: ἐξεπορεύετο
  choice: veneau
  rationale: Imperfectul indică o acțiune în desfășurare sau repetată; în română, imperfectul „veneau” păstrează aspectul și exprimă idiomatic deplasarea către Ioan.
- source_word: πρὸς αὐτόν
  choice: la el
  rationale: Cu un verb de mișcare, πρός cu acuzativul indică deplasarea către o persoană; „la el” este formularea românească naturală.
- source_word: Ἱεροσόλυμα
  choice: Ierusalimul
  rationale: Numele cetății apare metonimic pentru locuitorii ei; articolul hotărât este firesc când numele orașului funcționează astfel ca subiect colectiv.
- source_word: πᾶσα ἡ Ἰουδαία
  choice: toată Iudeea
  rationale: Păstrează expresia geografică amplă și formularea colectivă a textului-sursă.
- source_word: πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: toată regiunea din jurul Iordanului
  rationale: Redă clar și natural περίχωρος ca ținut înconjurător, păstrând referința geografică la Iordan.
- source_word: καὶ ... καὶ
  choice: și ... și
  rationale: Păstrează coordonarea cumulativă a celor trei desemnări geografice.
theological_decisions:
- issue: Întinderea totalizărilor geografice
  choice: Păstrarea expresiilor „toată Iudeea” și „toată regiunea”, în sensul lor colectiv și reprezentativ obișnuit
  alternative: Parafrazarea ca „oameni din Ierusalim, din întreaga Iudee și din regiunea Iordanului”
  rationale: Textul descrie răspunsul larg la lucrarea lui Ioan prin desemnări geografice cuprinzătoare, fără a cere concluzia că fiecare locuitor, fără excepție, a venit.
translation_notes:
  register: Română standard modernă, clară și demnă. „Veneau la el” evită calc-ul nefiresc „ieșeau la el”, dar păstrează prin imperfect caracterul continuu sau repetat al acțiunii. Acordul la plural tratează denumirile geografice metonimic, ca populații ale regiunilor respective.
