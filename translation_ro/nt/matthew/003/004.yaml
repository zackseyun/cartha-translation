  text: αὐτὸς δὲ ὁ Ἰωάννης εἶχεν τὸ ἔνδυμα αὐτοῦ ἀπὸ τριχῶν καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, ἡ δὲ τροφὴ ⸂ἦν αὐτοῦ⸃ ἀκρίδες καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/004.yaml
  text: John himself wore clothing made of camel’s hair and a leather belt around his waist[c][b][a], and his food was locusts and wild honey.
translation:
  language: ro
  text: Ioan însuși purta[c] o haină[b] din păr de cămilă și un brâu de piele în jurul mijlocului[a], iar hrana lui era lăcuste și miere sălbatică.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Îmbrăcămintea lui Ioan amintește de înfățișarea profetului Ilie din 2 Regi 1:8, un fundal important pentru modul în care Matei îl prezintă pe Ioan.
    reason: cross_reference
  - marker: b
    text: 'Sau: „veșmântul lui era din păr de cămilă”.'
    reason: lexical_alternative
  - marker: c
    text: 'Sau: „avea o haină din păr de cămilă”.'
    reason: previous_rendering
lexical_decisions:
- source_word: αὐτὸς δὲ ὁ Ἰωάννης
  choice: Ioan însuși
  rationale: αὐτός are valoare emfatică, redată prin „însuși”; δέ marchează o tranziție ușoară, exprimată firesc prin continuitatea narațiunii, fără un adverb temporal adăugat.
- source_word: εἶχεν τὸ ἔνδυμα αὐτοῦ
  choice: purta o haină
  rationale: Deși εἶχεν înseamnă literal „avea”, în acest context descrie îmbrăcămintea purtată de Ioan. „Purta” este natural și evită impresia că ar fi comandat confecționarea hainei.
- source_word: ἀπὸ τριχῶν καμήλου
  choice: din păr de cămilă
  rationale: ἀπό indică aici materialul din care era făcută haina; formularea românească este directă și idiomatică.
- source_word: ζώνην δερματίνην
  choice: un brâu de piele
  rationale: ζώνη desemnează un brâu sau o centură purtată în jurul taliei. „Brâu” se potrivește vestimentației antice și rămâne ușor de înțeles.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: în jurul mijlocului
  rationale: ὀσφύς desemnează zona taliei sau a mijlocului; „mijlocului” este firesc în româna actuală și evită arhaicul „coapselor”.
- source_word: ἡ δὲ τροφὴ ἦν αὐτοῦ
  choice: iar hrana lui era alcătuită din
  rationale: Construcția păstrează descrierea nominală din greacă și leagă natural a doua parte a versetului.
- source_word: ἀκρίδες
  choice: lăcuste
  rationale: Sensul lexical obișnuit este insecta numită „lăcustă”; contextul nu justifică o interpretare alternativă.
- source_word: μέλι ἄγριον
  choice: miere sălbatică
  rationale: Redă direct mierea găsită în natură, fără a preciza mai mult decât textul-sursă.
theological_decisions:
- issue: Descrierea profetică austeră și ecoul înfățișării lui Ilie
  choice: Descrierea este redată direct, iar legătura cu Ilie este semnalată numai în notă.
  alternative: O formulare în text care să facă aluzia la Ilie mai explicită.
  rationale: Versetul descrie simplu îmbrăcămintea și hrana lui Ioan. Ecoul din 2 Regi 1:8 este relevant, dar nu trebuie transformat într-o interpretare inserată în text.
translation_notes:
  register: Română standard modernă, cu registru demn și narativ. „Haină” și „brâu” păstrează cadrul antic fără formulări greoaie sau excesiv de arhaice. Marcajele notelor sunt așezate lângă expresiile pe care le explică.
