id: MAT.3.11
reference: Matthew 3:11
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: ro
  text: Eu vă botez în apă[a], spre pocăință[b], dar Cel care vine după mine este mai puternic decât mine; eu nu sunt vrednic să-I port sandalele. El Însuși vă va boteza în Duhul Sfânt și în foc[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „cu apă”; în aceste expresii, prepoziția grecească ἐν poate fi redată atât prin „în”, cât și prin „cu”.
    reason: lexical_alternative
  - marker: b
    text: Expresia poate fi redată și „pentru pocăință”. Grecescul εἰς are aici un sens de orientare, fără a preciza singur dacă pocăința precedă botezul, este scopul lui sau este semnificată de acesta.
    reason: lexical_alternative
  - marker: c
    text: „Focul” poate indica purificarea sau judecata; formularea grecească lasă imaginea deschisă, iar contextul trebuie luat în considerare.
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτίζω / βαπτίσει
  choice: botez / va boteza
  rationale: Păstrează termenul consacrat pentru botezul ritual, fără a preciza prin traducere un anumit mod, precum scufundarea.
- source_word: ἐν ὕδατι
  choice: în apă
  rationale: Redă îndeaproape construcția grecească și menține paralelismul cu „în Duhul Sfânt și în foc”; prepoziția ἐν permite și sensul instrumental „cu”.
- source_word: εἰς μετάνοιαν
  choice: spre pocăință
  rationale: Păstrează orientarea exprimată de εἰς fără a decide dacă pocăința precedă botezul, este scopul lui ori este semnificată de acesta.
- source_word: ὁ δὲ ὀπίσω μου ἐρχόμενος
  choice: dar Cel care vine după mine
  rationale: Redare firească a participiului substantivizat, păstrând contrastul și succesiunea față de Ioan.
- source_word: ἰσχυρότερός μού
  choice: mai puternic decât mine
  rationale: Echivalent românesc direct, actual și clar al comparativului grecesc.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: eu nu sunt vrednic
  rationale: În formula de smerenie din context, „vrednic” exprimă firesc valoarea idiomatică a lui ἱκανός, nu doar capacitatea fizică.
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: să-I port sandalele
  rationale: βαστάσαι înseamnă „a purta”, iar „sandalele” redă adecvat obiectul antic; pronumele posesiv este implicit în relația cu antecedentul.
- source_word: αὐτὸς
  choice: El Însuși
  rationale: Păstrează accentul pronumelui și contrastul dintre lucrarea lui Ioan și cea a Celui care vine.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: în Duhul Sfânt
  rationale: Păstrează paralelismul prepozițional, iar forma personală consacrată „Duhul Sfânt” corespunde cel mai bine referentului din context.
- source_word: καὶ πυρί
  choice: și în foc
  rationale: Repetarea lui „în” este firească în română și clarifică coordonarea, fără a hotărî dacă focul indică purificare sau judecată.
theological_decisions:
- issue: Sensul expresiei „Duhul Sfânt și foc”
  choice: Formularea literală „în Duhul Sfânt și în foc” este păstrată fără explicație interpretativă în text.
  alternative: „în Duhul Sfânt și în foc curățitor” sau „în Duhul Sfânt și în focul judecății”
  rationale: Imaginea focului poate sugera purificarea sau judecata, iar contextul nu justifică introducerea uneia dintre interpretări direct în traducere.
- issue: Referentul lui πνεύματι ἁγίῳ
  choice: Duhul Sfânt
  alternative: „duh sfânt” ori „putere sfântă”
  rationale: În contextul matean, sintagma se referă cel mai firesc la Duhul Sfânt; traducerea evită totuși orice dezvoltare doctrinară care nu apare în text.
- issue: Raportul dintre botez și pocăință în εἰς μετάνοιαν
  choice: spre pocăință
  alternative: „pentru pocăință” ori „în vederea pocăinței”
  rationale: Formularea păstrează tensiunea semantică a lui εἰς și nu stabilește în mod nejustificat ordinea sau mecanismul relației dintre botez și pocăință.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. Majusculele reverențiale din „Cel”, „-I” și „El Însuși” fac referirea clară în stil românesc curent, fără adaos interpretativ. Sintaxa a fost ușor reorganizată pentru fluență, păstrând contrastele și paralelismul textului grec.
