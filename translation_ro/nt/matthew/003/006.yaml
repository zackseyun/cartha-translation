  text: καὶ ἐβαπτίζοντο ἐν τῷ Ἰορδάνῃ ⸀ποταμῷ ὑπ’ αὐτοῦ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/006.yaml
  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: ro
  text: Și erau botezați[a] de el în râul Iordan, mărturisindu-și păcatele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau „au fost botezați”; imperfectul grecesc poate evidenția o acțiune în desfășurare sau repetată: „erau botezați”.'
    reason: alternativă aspectuală
lexical_decisions:
- source_word: ἐβαπτίζοντο
  choice: erau botezați
  rationale: Imperfectul pasiv prezintă acțiunea ca desfășurată sau repetată în cadrul narațiunii. Termenul consacrat „botezați” păstrează caracterul ritual fără a preciza un mod pe care versetul nu îl explicitează.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: în râul Iordan
  rationale: Construcția cu ἐν este locativă, iar ποταμῷ identifică explicit Iordanul drept râu; formularea este firească în româna modernă.
- source_word: ὑπ’ αὐτοῦ
  choice: de el
  rationale: Ὑπό cu genitivul indică agentul personal. Pronumele îl are drept antecedent pe Ioan în context, însă traducerea păstrează formularea pronuminală a versetului.
- source_word: ἐξομολογούμενοι
  choice: mărturisindu-și
  rationale: Participiul exprimă o acțiune concomitentă cu botezarea și desemnează recunoașterea verbală a greșelilor. Forma reflexiv-posesivă este idiomatică în română.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: păcatele
  rationale: Împreună cu „mărturisindu-și”, redă obiectul la plural și posesia, indicând păcatele proprii ale celor botezați.
- source_word: καὶ
  choice: și
  rationale: Conjuncția simplă păstrează legătura narativă cu versetul precedent.
theological_decisions:
- issue: Terminologia și modul botezului
  choice: botezați
  alternative: cufundați; spălați
  rationale: Textul afirmă că oamenii erau botezați de Ioan în Iordan, dar nu definește explicit aici modul ritualului. „Botezați” păstrează formularea textului fără a introduce o concluzie confesională.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Ordinea propoziției rămâne apropiată de greacă, dar formularea este idiomatică. Marcajul notei este așezat la sfârșitul versetului deoarece explică aspectul verbului principal.
