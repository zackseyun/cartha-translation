id: MAT.10.41
reference: Matthew 10:41
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου μισθὸν προφήτου λήμψεται, καὶ ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου μισθὸν δικαίου λήμψεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
translation:
  language: ro
  text: Cine primește un profet în numele unui profet[a] va primi răsplata unui profet, iar cine primește un om drept în numele unui om drept[b] va primi răsplata unui om drept.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „pentru că este profet” ori „ca pe un profet”. Greaca spune literal: „în numele unui profet”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „pentru că este un om drept” ori „ca pe un om drept”. Greaca spune literal: „în numele unui om drept”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεχόμενος
  choice: cine primește
  rationale: Participiul articulat are sens general; formularea românească este naturală și păstrează caracterul proverbial al afirmației.
- source_word: προφήτην
  choice: un profet
  rationale: Redare directă a obiectului la acuzativ și termenul consacrat în româna biblică actuală.
- source_word: εἰς ὄνομα προφήτου
  choice: în numele unui profet
  rationale: Păstrează formularea greacă și posibilele ei rezonanțe, fără a decide în text dacă accentul cade pe calitate, identitate sau motivul primirii.
- source_word: μισθὸν προφήτου
  choice: răsplata unui profet
  rationale: 'Păstrează ambiguitatea genitivului: răsplata primită de un profet ori răsplata corespunzătoare primirii lui.'
- source_word: λήμψεται
  choice: va primi
  rationale: Redă firesc viitorul verbului λαμβάνω într-un registru demn și curent.
- source_word: δίκαιον
  choice: un om drept
  rationale: Adjectivul masculin substantivizat este exprimat clar în română, păstrând atât sensul moral, cât și forma masculină a sursei.
- source_word: εἰς ὄνομα δικαίου
  choice: în numele unui om drept
  rationale: Menține paralelismul strict cu prima propoziție și păstrează idiomul grecesc, explicat în notă.
- source_word: μισθὸν δικαίου
  choice: răsplata unui om drept
  rationale: Redarea repetă structura primei propoziții și nu precizează excesiv relația genitivală.
theological_decisions:
- issue: Sensul construcției εἰς ὄνομα + genitiv
  choice: Păstrarea expresiei „în numele” în text, cu explicarea sensurilor posibile în note.
  alternative: „pentru că este profet/om drept” sau „ca pe un profet/om drept”
  rationale: Construcția indică primirea cuiva în virtutea identității sau calității sale. Redarea literală păstrează textura și ambiguitatea expresiei, iar notele asigură claritatea.
- issue: Valoarea genitivului în μισθὸν προφήτου / δικαίου
  choice: „răsplata unui profet/unui om drept”
  alternative: „răsplata cuvenită unui profet/unui om drept”
  rationale: Forma aleasă nu hotărăște dacă este vorba despre răsplata primită de acea persoană sau despre răsplata asociată celui care o primește.
- issue: Redarea masculinului δίκαιον / δικαίου
  choice: „un om drept / unui om drept”
  alternative: „o persoană dreaptă / unei persoane drepte”
  rationale: Greaca folosește masculinul singular substantivizat; formularea aleasă îl păstrează fără a adăuga o afirmație despre exclusivitatea de gen.
translation_notes:
  register: Română standard modernă, clară și demnă. Repetițiile și paralelismul sursei au fost păstrate intenționat; expresia mai puțin transparentă „în numele” este clarificată prin note.
