id: MAT.10.29
reference: Matthew 10:29
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: ro
  text: Nu se vând oare două vrăbii pentru un asarion?[b] Și totuși nici măcar una dintre ele nu va cădea la pământ fără Tatăl vostru.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „în afara Tatălui vostru”; expresia poate sugera că aceasta nu se întâmplă în afara cunoașterii, grijii sau voii sale, dar greaca nu precizează în ce sens.
    reason: alternative_reading
  - marker: b
    text: Asarionul era o monedă romană mică de aramă, cu o valoare foarte redusă.
    reason: cultural_note
lexical_decisions:
- source_word: στρουθία
  choice: vrăbii
  rationale: În acest context, diminutivul se referă în mod natural la vrăbii, păstrând imaginea unor păsări mici și de mică valoare comercială.
- source_word: ἀσσαρίου
  choice: un asarion
  rationale: Păstrează denumirea istorică precisă a monedei romane; valoarea ei redusă este explicată în nota culturală.
- source_word: πωλεῖται
  choice: se vând
  rationale: Redă firesc în română prezentul pasiv și sensul comercial al verbului.
- source_word: ἓν ἐξ αὐτῶν
  choice: niciuna dintre ele
  rationale: În cadrul negației, aceasta este formularea românească idiomatică echivalentă cu «nici măcar una dintre ele».
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: va cădea la pământ
  rationale: Este echivalentul românesc natural și direct al expresiei grecești.
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: fără Tatăl vostru
  rationale: Urmează îndeaproape formularea greacă și îi păstrează ambiguitatea, fără a adăuga explicit «știrea», «grija» sau «voia» Tatălui.
- source_word: οὐχὶ ... ;
  choice: Nu se vând oare ...?
  rationale: Redă întrebarea retorică ce așteaptă un răspuns afirmativ într-o formă românească naturală.
- source_word: καὶ
  choice: Și totuși
  rationale: 'Exprimă în context valoarea ascensiv-adversativă: în pofida valorii lor mici, nici măcar una nu cade fără Tatăl.'
theological_decisions:
- issue: Sensul expresiei «fără Tatăl vostru» în raport cu providența divină
  choice: Textul păstrează formularea largă «fără Tatăl vostru».
  alternative: «fără știrea Tatălui vostru» sau «fără voia Tatălui vostru»
  rationale: Greaca afirmă raportarea evenimentului la Tatăl, dar nu precizează dacă este vorba în mod specific despre cunoașterea, grija, îngăduința ori voia lui. Traducerea nu restrânge această tensiune teologică.
translation_notes:
  register: Română standard modernă, clară și demnă. Întrebarea retorică este redată idiomatic, iar termenul istoric «asarion» este păstrat și explicat în notă.
