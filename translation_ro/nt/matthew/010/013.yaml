id: MAT.10.13
reference: Matthew 10:13
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἐὰν μὲν ᾖ ἡ οἰκία ἀξία, ἐλθάτω ἡ εἰρήνη ὑμῶν ἐπ’ αὐτήν· ἐὰν δὲ μὴ ᾖ ἀξία, ἡ εἰρήνη ὑμῶν ⸀πρὸς ὑμᾶς ἐπιστραφήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/013.yaml
  text: And if the house is worthy[a], let your peace come upon it; but if it is not worthy[c][b], let your peace return to you.
translation:
  language: ro
  text: Și dacă casa[a] este vrednică[b], pacea voastră să vină peste ea; dar dacă nu este vrednică, pacea voastră să se întoarcă la voi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „familie” ori „cămin”; termenul grecesc pentru „casă” poate desemna locuința și, prin extensie, oamenii care locuiesc în ea.
    reason: lexical_alternative
  - marker: b
    text: Aici, „vrednică” înseamnă potrivită să-i primească pe mesageri și pacea lor, nu lipsită de păcat din punct de vedere moral.
    reason: cultural_note
  - marker: c
    text: Sau „să se întoarcă înapoi la voi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: casă
  rationale: Este echivalentul direct și firesc; în context, poate desemna prin extensie și familia sau oamenii din casă.
- source_word: ἀξία
  choice: vrednică
  rationale: Păstrează evaluarea exprimată de termenul grec fără a o restrânge interpretativ la simpla receptivitate.
- source_word: ἐλθάτω
  choice: să vină
  rationale: Redă natural imperativul aorist la persoana a treia și păstrează imaginea păcii care vine peste casă.
- source_word: εἰρήνη
  choice: pacea
  rationale: Este echivalentul obișnuit și lasă contextului sensul mai larg de bunăstare și binecuvântare.
- source_word: ἐπ’ αὐτήν
  choice: peste ea
  rationale: Păstrează direcția și imaginea din greacă; pronumele se referă la „casă”.
- source_word: πρὸς ὑμᾶς
  choice: la voi
  rationale: Redă direcția către ucenici; ideea revenirii este deja exprimată de verb.
- source_word: ἐπιστραφήτω
  choice: să se întoarcă
  rationale: Redă idiomatic imperativul și sensul că pacea nu rămâne asupra casei, ci revine la ucenici.
- source_word: μὲν ... δὲ
  choice: dacă ...; dar dacă ...
  rationale: Exprimă clar și natural contrastul dintre cele două situații.
theological_decisions:
- issue: Natura expresiei „pacea voastră”
  choice: Am păstrat formularea concretă „pacea voastră”, care poate veni peste casă sau se poate întoarce la ucenici.
  alternative: „salutul vostru de pace”, „pacea pe care o rostiți” sau „binecuvântarea voastră”
  rationale: Textul leagă pacea de misiunea ucenicilor și o descrie într-un mod aproape transferabil, fără să explice mecanismul. Traducerea păstrează această tensiune și nu o reduce nici la o simplă urare, nici la o doctrină sistematizată.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. Sintaxa păstrează paralelismul și contrastul textului grec, iar formularea „pacea voastră” conservă imaginea originală.
