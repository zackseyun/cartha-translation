id: MAT.10.31
reference: Matthew 10:31
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: μὴ οὖν ⸀φοβεῖσθε· πολλῶν στρουθίων διαφέρετε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/031.yaml
  text: Therefore[a], do not be afraid; you are worth more than many sparrows.
translation:
  language: ro
  text: Așadar, nu vă temeți! Voi sunteți mai de preț decât multe vrăbii.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν
  choice: Așadar, nu
  rationale: οὖν exprimă concluzia trasă din argumentul precedent despre grija Tatălui, iar μή împreună cu imperativul prezent exprimă interdicția. „Așadar” redă limpede legătura logică.
- source_word: φοβεῖσθε
  choice: vă temeți
  rationale: Forma lui φοβέομαι se redă firesc în română prin verbul reflexiv „a se teme”; pluralul corespunde adresării către ucenici.
- source_word: πολλῶν στρουθίων
  choice: decât multe vrăbii
  rationale: În contextul imediat, στρουθίον desemnează vrabia, iar genitivul este cerut de comparația exprimată prin διαφέρετε.
- source_word: διαφέρετε
  choice: sunteți mai de preț decât
  rationale: Aici διαφέρω indică superioritatea ca valoare sau importanță, nu simpla deosebire. Expresia românească este naturală și păstrează comparația.
- source_word: ὑμεῖς
  choice: Voi
  rationale: Pronumele explicit este păstrat pentru a reda accentul din greacă și contrastul dintre ucenici și vrăbii.
theological_decisions:
- issue: Valoarea relativă a ucenicilor și a vrăbiilor în învățătura lui Isus
  choice: Voi sunteți mai de preț decât multe vrăbii
  alternative: Voi valorați mai mult decât multe vrăbii
  rationale: Formularea păstrează comparația din διαφέρετε și afirmă grija mai mare a lui Dumnezeu pentru ucenici în acest context, fără să nege grija lui pentru animale.
translation_notes:
  register: Română standard modernă, clară și demnă. „Așadar” păstrează inferența, pronumele „Voi” redă accentul original, iar semnul exclamării face naturală în română porunca de încurajare fără a-i schimba sensul.
