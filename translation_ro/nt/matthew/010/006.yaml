  text: but go instead to the lost sheep of the house of Israel[a].
translation:
  language: ro
  text: ci mergeți mai degrabă la oile pierdute ale casei lui Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „ci mergeți mai degrabă la oile care s-au pierdut, oile casei lui Israel”.'
    reason: 'Alternativă sintactică și lexicală: participiul poate fi redat printr-o propoziție relativă, iar genitivul «casei lui Israel» indică apartenența oilor.'
lexical_decisions:
- source_word: πορεύεσθε
  choice: mergeți
  rationale: Imperativul la persoana a doua plural exprimă o poruncă. „Mergeți” este forma firească în româna actuală și se potrivește instrucțiunii privind destinația ucenicilor.
- source_word: δὲ μᾶλλον
  choice: ci… mai degrabă
  rationale: Împreună, termenii marchează contrastul și redirecționarea față de destinațiile interzise în versetul anterior. Construcția românească păstrează atât opoziția, cât și preferința explicită.
- source_word: πρὸς
  choice: la
  rationale: După un verb de mișcare, prepoziția indică destinația; „la” este alegerea idiomatică în acest context.
- source_word: τὰ πρόβατα
  choice: oile
  rationale: Păstrează imaginea metaforică explicită din text, fără a o transforma într-o explicație despre israeliți.
- source_word: τὰ ἀπολωλότα
  choice: pierdute
  rationale: Participiul perfect descrie o stare rezultată. În metafora pastorală, „pierdute” redă sensul contextual fără a-l restrânge la rătăcire morală sau la nimicire fizică.
- source_word: οἴκου Ἰσραήλ
  choice: ale casei lui Israel
  rationale: Păstrează formularea corporativă și rezonanța biblică a expresiei, într-o construcție românească naturală.
theological_decisions:
- issue: Descrierea metaforică a lui Israel
  choice: „oile pierdute ale casei lui Israel”
  alternative: „israeliții care s-au rătăcit”
  rationale: Textul grecesc exprimă direct metafora oilor, care are rezonanțe profetice și pastorale. Menținerea ei evită introducerea unei interpretări explicative în text.
- issue: Relația sintactică a expresiei „casei lui Israel”
  choice: Oile pierdute care aparțin casei lui Israel
  alternative: Oile care s-au pierdut din casa lui Israel
  rationale: Construcția greacă poate fi înțeleasă fie ca indicând apartenența oilor, fie separarea lor de casă. Textul principal urmează lectura cea mai directă, iar nota păstrează alternativa autentică.
translation_notes:
  register: Română standard modernă, clară și demnă. Metafora biblică și expresia „casa lui Israel” sunt păstrate, iar ambiguitatea reală a construcției grecești este semnalată în notă.
