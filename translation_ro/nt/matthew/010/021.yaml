id: MAT.10.21
reference: Matthew 10:21
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: παραδώσει δὲ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/021.yaml
  text: And brother will hand over brother to death[a], and a father his child, and children will rise up against parents and put them to death.
translation:
  language: ro
  text: Un frate îl va da pe fratele său la moarte[a], iar un tată își va da copilul la moarte. Copiii se vor ridica împotriva părinților și îi vor ucide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „îl va preda la moarte”; verbul poate avea și sensul de „a trăda” în contexte de perfidie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: îl va da
  rationale: Verbul indică predarea unei persoane în mâinile altora, aici cu urmarea morții. Formularea „îl va da ... la moarte” păstrează forța concretă fără a preciza în mod nejustificat dacă este vorba strict despre trădare sau despre predarea către autorități.
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: un frate ... pe fratele său
  rationale: Păstrează termenii masculini și construcția singulară reprezentativă, iar posesivul face relația firească și limpede în română.
- source_word: εἰς θάνατον
  choice: la moarte
  rationale: 'Exprimă rezultatul sau ținta predării: persoana este dată astfel încât să moară.'
- source_word: πατὴρ τέκνον
  choice: un tată, pe copilul său
  rationale: „Copil” redă întinderea semantică a lui τέκνον, care nu înseamnă numai „fiu”; elipsa verbală este păstrată într-o formă românească naturală.
- source_word: ἐπαναστήσονται
  choice: se vor ridica împotriva
  rationale: Păstrează imaginea vie a împotrivirii ostile, fără a restrânge sensul la o răzvrătire politică.
- source_word: τέκνα
  choice: copiii
  rationale: Redă termenul plural inclusiv, fără limitare la sexul masculin.
- source_word: ἐπὶ γονεῖς
  choice: împotriva părinților
  rationale: Prepoziția, în acest context ostil, are sensul „împotriva”, iar γονεῖς îi cuprinde pe ambii părinți.
- source_word: θανατώσουσιν
  choice: îi vor ucide
  rationale: Verbul înseamnă a provoca moartea, adesea deliberat sau printr-o acțiune cu caracter formal. „Îi vor ucide” este limpede, grav și natural în româna actuală.
- source_word: αὐτούς
  choice: îi
  rationale: Pronumele se referă în mod firesc la „părinți” și păstrează cursivitatea textului.
theological_decisions:
- issue: Termenii de familie marcați sau nemarcați după gen
  choice: Se păstrează „frate” pentru ἀδελφός, iar τέκνα și γονεῖς sunt redate prin „copiii” și „părinții”.
  alternative: Redarea lui ἀδελφός prin termenul generic „frate sau soră”.
  rationale: ἀδελφός este masculin în această formulare, în timp ce τέκνα și γονεῖς au în context o sferă incluzivă. Traducerea păstrează această diferență din sursă fără a o uniformiza.
translation_notes:
  register: Română standard modernă, cu un ton demn și direct. Repetiția familială și paralelismul versetului sunt păstrate, iar punctuația face explicită elipsa verbului din a doua propoziție fără a adăuga conținut.
