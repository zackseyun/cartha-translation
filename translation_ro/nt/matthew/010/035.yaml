id: MAT.10.35
reference: Matthew 10:35
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἦλθον γὰρ διχάσαι ἄνθρωπον κατὰ τοῦ πατρὸς αὐτοῦ καὶ θυγατέρα κατὰ τῆς μητρὸς αὐτῆς καὶ νύμφην κατὰ τῆς πενθερᾶς αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/035.yaml
  text: For I came to set a man against his father[a], and a daughter against her mother, and a daughter-in-law against her mother-in-law[b],
translation:
  language: ro
  text: Căci am venit să pun un om împotriva tatălui său[a], o fiică împotriva mamei ei și o noră împotriva soacrei ei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „să despart un om de tatăl său”; verbul grecesc poate însemna „a despărți, a dezbina”, dar expresiile repetate „împotriva” indică opoziția dintre membrii familiei.
    reason: lexical_alternative
  - marker: b
    text: Termenul grecesc poate însemna în alte contexte „mireasă”; aici înseamnă „noră”, deoarece este asociat cu „soacră”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: am venit
  rationale: Aoristul indicativ se referă firesc la venirea și misiunea lui Isus; perfectul compus este redarea românească naturală.
- source_word: γὰρ
  choice: căci
  rationale: Păstrează legătura explicativă cu afirmația precedentă într-un registru biblic demn, dar ușor de înțeles.
- source_word: διχάσαι
  choice: să despart pe ... de
  rationale: Verbul exprimă provocarea unei dezbinări; construcția românească redă împreună sensul infinitivului și opoziția indicată de κατά, fără a reduce afirmația la o simplă separare fizică.
- source_word: ἄνθρωπον
  choice: un om
  rationale: În seria familială, termenul desemnează aici membrul masculin pus în opoziție cu tatăl său; redarea păstrează forma singulară și paralelismul.
- source_word: κατὰ τοῦ πατρὸς αὐτοῦ
  choice: de tatăl lui
  rationale: Împreună cu „să despart”, exprimă opoziția relațională marcată de κατά cu genitivul.
- source_word: θυγατέρα
  choice: o fiică
  rationale: Echivalent direct și firesc al substantivului grecesc.
- source_word: κατὰ τῆς μητρὸς αὐτῆς
  choice: de mama ei
  rationale: Continuă în mod natural construcția „a despărți pe cineva de cineva”, păstrând opoziția din text.
- source_word: νύμφην
  choice: o noră
  rationale: Deși νύμφη poate însemna și „mireasă”, asocierea cu πενθερά cere aici sensul de rudenie „noră”.
- source_word: κατὰ τῆς πενθερᾶς αὐτῆς
  choice: de soacra ei
  rationale: Redă firesc relația de rudenie și completează paralelismul celor trei perechi.
theological_decisions:
- issue: Natura misiunii declarate a lui Isus în context
  choice: Formularea descrie direct dezbinarea familială legată de venirea lui Isus, fără a explica în text dacă aceasta este scop ultim sau efect social.
  alternative: O parafrază care ar preciza că ostilitatea este numai un efect al loialității față de Isus.
  rationale: Greaca păstrează o afirmație voit frapantă. Traducerea nu trebuie nici să-i atenueze forța, nici să introducă o explicație teologică absentă din verset.
translation_notes:
  register: Română standard modernă, cu o sintaxă solemnă, dar accesibilă. „Căci” păstrează legătura argumentativă, iar repetiția perechilor familiale reproduce ritmul textului grec.
