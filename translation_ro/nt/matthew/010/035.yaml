  naturalness: „Căci am venit să pun un om împotriva tatălui său, o fiică împotriva mamei ei și o noră împotriva soacrei ei” este română standard modernă, clară și menține paralelismul retoric al grecei.
  terminology: „Om”, „fiică”, „noră” și „soacră” sunt alegeri corecte. „Său” după „tatălui” este puțin mai îngrijit și mai paralel cu celelalte posesive decât „lui”.
