id: MAT.10.37
reference: Matthew 10:37
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ φιλῶν πατέρα ἢ μητέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος· καὶ ὁ φιλῶν υἱὸν ἢ θυγατέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: ro
  text: Cine iubește pe tată sau pe mamă mai mult decât pe Mine nu este vrednic de Mine, iar cine iubește pe fiu sau pe fiică mai mult decât pe Mine nu este vrednic de Mine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: cine iubește
  rationale: Articolul cu participiul prezent are valoare substantivală și descrie generic persoana caracterizată de această iubire. Formula este firească și concisă în româna actuală.
- source_word: πατέρα ἢ μητέρα
  choice: pe tată sau pe mamă
  rationale: Substantivele relaționale sunt redate fără adăugarea unui posesiv absent din greacă; prepoziția „pe” marchează natural obiectul direct personal în română.
- source_word: ὑπὲρ ἐμέ
  choice: mai mult decât pe Mine
  rationale: În acest context comparativ, ὑπέρ indică un grad mai mare de iubire și, implicit, preferința acordată persoanei iubite. Redarea este idiomatică și păstrează contrastul direct cu Isus.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: nu este vrednic de Mine
  rationale: Păstrează construcția cu genitivul μου și formularea solemnă, încă limpede în româna modernă, fără explicații interpretative precum „să-Mi aparțină”.
- source_word: καὶ
  choice: iar
  rationale: „Iar” coordonează firesc cele două propoziții paralele în română și evidențiază reluarea structurii fără a introduce un contrast propriu-zis.
- source_word: υἱὸν ἢ θυγατέρα
  choice: pe fiu sau pe fiică
  rationale: Redarea directă păstrează paralelismul cu „tată sau mamă” și nu adaugă posesive care nu sunt exprimate în textul grec.
theological_decisions:
- issue: Prioritatea iubirii față de Isus în raport cu legăturile familiale
  choice: Versetul cere ca iubirea față de Isus să aibă întâietate chiar și față de cele mai apropiate relații familiale.
  alternative: O formulare atenuată precum „nu Mă iubește la fel de mult” sau una intensificată care ar cere ura față de familie.
  rationale: Construcția ὑπὲρ ἐμέ exprimă comparația directă și prioritatea, iar verdictul despre nevrednicie trebuie păstrat. Textul nu neagă valoarea iubirii familiale și nici nu folosește aici limbajul urii.
translation_notes:
  register: Română standard modernă, clară și demnă. Majusculele reverențiale din „Mine” indică referirea la Isus, conform unei convenții editoriale românești răspândite. Repetiția integrală a verdictului păstrează paralelismul și accentul textului grec.
