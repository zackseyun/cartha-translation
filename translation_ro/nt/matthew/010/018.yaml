source:
  edition: SBLGNT
  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: ro
  text: Și veți fi duși înaintea guvernatorilor și a regilor din cauza mea, ca mărturie pentru ei[b] și pentru neamuri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „pentru națiuni”.'
    reason: lexical_alternative
  - marker: b
    text: În context, expresia „pentru ei” poate fi înțeleasă și ca „împotriva lor”, deși dativul grecesc nu precizează aceasta în mod explicit.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας ... καὶ βασιλεῖς
  choice: înaintea guvernatorilor și a regilor
  rationale: Construcția ἐπί cu acuzativul după verbul «a duce» indică aducerea înaintea unor autorități. «Guvernatori» și «regi» sunt echivalente românești firești și precise în context.
- source_word: ἀχθήσεσθε
  choice: veți fi duși
  rationale: Viitorul pasiv al lui ἄγω exprimă faptul că ucenicii vor fi aduși de alții; formularea nu introduce ideea de violență, care nu este explicită.
- source_word: ἕνεκεν ἐμοῦ
  choice: din cauza mea
  rationale: ἕνεκεν cu genitivul exprimă cauza. Formularea este directă, modernă și păstrează referirea personală la Isus.
- source_word: εἰς μαρτύριον
  choice: ca mărturie
  rationale: 'Sintagma poate exprima scopul sau rezultatul: aducerea lor înaintea autorităților va funcționa ca mărturie. Este păstrată forma substantivală.'
- source_word: αὐτοῖς
  choice: pentru ei
  rationale: Pronumele la dativ se referă cel mai natural la guvernatori și regi. «Pentru ei» păstrează o formulare neutră; nota semnalează că, în context, poate fi înțeles și adversativ.
- source_word: τοῖς ἔθνεσιν
  choice: pentru neamuri
  rationale: ἔθνη poate desemna fie neamurile în general, fie neevreii. «Neamuri» păstrează deschiderea lexicală a termenului grec, iar nota explică alternativa contextuală.
theological_decisions:
- issue: Sensul sintagmei μαρτύριον αὐτοῖς
  choice: «mărturie pentru ei», formulare neutră
  alternative: «mărturie împotriva lor»
  rationale: 'Dativul αὐτοῖς nu exprimă în sine opoziția. Redarea neutră păstrează tensiunea: mărturia poate fi adresată autorităților, fără a exclude faptul că, în context, ea ar putea deveni mărturie împotriva lor.'
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Sintaxa urmărește îndeaproape textul grec, dar rămâne firească în română. Marcajele notelor sunt plasate imediat după expresiile la care se referă.
