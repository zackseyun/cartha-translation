  text: And a man's enemies will be those of his own household[a].
translation:
  language: ro
  text: Și dușmanii omului vor fi cei din casa lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „dușmanii unei persoane vor fi membrii casei sale”. Greaca folosește aici masculinul singular „om” în sens reprezentativ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Și
  rationale: Păstrează legătura coordonatoare simplă cu afirmația precedentă, fără a introduce o explicație suplimentară.
- source_word: ἐχθροὶ
  choice: dușmanii
  rationale: Redă firesc substantivarea adjectivului grecesc și păstrează sensul puternic de persoane ostile.
- source_word: τοῦ ἀνθρώπου
  choice: omului
  rationale: Genitivul este redat posesiv; „omului” păstrează singularul reprezentativ al formulării grecești și este idiomatic în română.
- source_word: οἱ οἰκιακοὶ αὐτοῦ
  choice: cei din propria lui casă
  rationale: Expresia desemnează persoanele care aparțin casei sau gospodăriei cuiva, nu clădirea; formularea păstrează și accentul relațional al lui αὐτοῦ.
theological_decisions:
- issue: Limbajul reprezentativ masculin în ἀνθρώπου
  choice: omului
  alternative: unei persoane
  rationale: Greaca folosește substantivul masculin singular în sens reprezentativ. Varianta principală păstrează forma sursei, iar nota indică alternativa explicit generalizatoare fără a restrânge afirmația numai la bărbați.
translation_notes:
  register: Română standard modernă, concisă și demnă. „Cei din propria lui casă” este inteligibil ca referire la membrii familiei sau gospodăriei și evită sensul greșit al clădirii propriu-zise.
