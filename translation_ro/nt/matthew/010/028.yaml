id: MAT.10.28
reference: Matthew 10:28
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: ro
  text: Și nu vă temeți de cei care ucid trupul, dar nu pot ucide sufletul. Temeți-vă mai degrabă de cel care poate să nimicească și sufletul, și trupul în gheenă[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „în iad”. Termenul grecesc „gheenă” provine din numele Văii lui Hinom și este folosit pentru locul judecății finale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβεῖσθε
  choice: (nu) vă temeți / temeți-vă
  rationale: Păstrează același verb în antiteza celor două îndemnuri și redă direct forța avertismentului.
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: de cei care ucid
  rationale: Participiul articulat desemnează generic o categorie de persoane; formularea este firească în româna actuală.
- source_word: σῶμα
  choice: trupul
  rationale: Redare directă și consacrată în acest contrast antropologic; „trup” are un registru biblic demn, dar rămâne ușor de înțeles.
- source_word: ψυχήν
  choice: sufletul
  rationale: În contrast explicit cu trupul, termenul indică aspectul necorporal al persoanei; „viața” ar estompa această opoziție.
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: nu pot ucide
  rationale: Exprimă limpede incapacitatea indicată de construcția greacă, într-o română naturală și concisă.
- source_word: μᾶλλον
  choice: mai degrabă
  rationale: Păstrează atât contrastul corectiv, cât și nuanța comparativă a adverbului.
- source_word: τὸν δυνάμενον
  choice: cel care poate
  rationale: Redă participiul substantivizat fără a identifica explicit referentul pe care greaca nu îl numește.
- source_word: ἀπολέσαι
  choice: să nimicească
  rationale: Exprimă distrugerea decisivă în judecată fără a preciza mecanismul sau natura metafizică a acesteia.
- source_word: ἐν γεέννῃ
  choice: în Gheenă
  rationale: Transliterarea păstrează termenul grec specific și fundalul său iudaic, iar echivalentul tradițional este explicat în notă.
theological_decisions:
- issue: Identitatea celui care poate nimici sufletul și trupul în Gheenă
  choice: „cel care poate”, fără identificare explicită
  alternative: Dumnezeu; Satan
  rationale: Contextul indică cel mai firesc spre Dumnezeu, ca autoritate a judecății finale, însă expresia greacă nu numește referentul; traducerea păstrează această deschidere textuală.
- issue: Redarea termenului γέεννα
  choice: Gheenă
  alternative: iad
  rationale: Forma transliterată respectă prioritatea textului-sursă și păstrează fundalul Văii lui Hinom; echivalentul interpretativ familiar este oferit în nota de subsol.
translation_notes:
  register: Română standard modernă, clară și demnă. Repetiția verbului „a se teme” și paralelismul „și sufletul, și trupul” păstrează structura și accentul retoric ale textului grec.
