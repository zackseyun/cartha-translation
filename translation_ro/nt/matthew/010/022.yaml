  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: ro
  text: Și veți fi urâți de toți din cauza numelui meu.[a] Dar cel care va răbda până la sfârșit va fi mântuit.[b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „de dragul numelui meu”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „cel care va stărui până la sfârșit”.'
    reason: lexical_alternative
  - marker: c
    text: Expresia „va fi mântuit” poate fi înțeleasă și cu sensul de „va fi izbăvit” sau „va fi salvat”, în funcție de felul în care este interpretat contextul.
    reason: alternative_reading
  - marker: d
    text: 'Mai literal, cu pronumele emfatic: „cel care va răbda până la sfârșit, acela va fi mântuit”.'
    reason: source_structure
lexical_decisions:
- source_word: μισούμενοι
  choice: urâți
  rationale: Redă direct starea viitoare exprimată de construcția perifrastică ἔσεσθε μισούμενοι, într-o română firească.
- source_word: ὑπὸ πάντων
  choice: de toți
  rationale: Ὑπό cu genitivul indică agenții personali ai pasivului, iar „de toți” păstrează caracterul cuprinzător al expresiei.
- source_word: διὰ τὸ ὄνομά μου
  choice: din cauza numelui meu
  rationale: Διά cu acuzativul exprimă cauza; formularea păstrează metonimia biblică a „numelui”, care trimite la persoana și autoritatea lui Isus și la loialitatea față de el.
- source_word: ὁ δὲ ὑπομείνας
  choice: Dar cel care va răbda
  rationale: Participiul aorist articulat are funcție substantivală. „Va răbda” se potrivește contextului persecuției și evită introducerea unei terminologii doctrinare ulterioare.
- source_word: εἰς τέλος
  choice: până la sfârșit
  rationale: Exprimă menținerea statorniciei până la punctul final; aceasta este formularea românească naturală.
- source_word: οὗτος
  choice: redat prin reluarea firească a subiectului în propoziția „cel care… va fi”
  rationale: Pronumele este resumptiv și emfatic în greacă. O redare separată prin „acela” ar fi posibilă, dar mai greoaie; structura românească păstrează sensul fără rigiditate.
- source_word: σωθήσεται
  choice: va fi mântuit
  rationale: Păstrează amploarea semantică și teologică a lui σῴζω în contextul uceniciei și al sfârșitului, fără a restrânge sensul la o simplă scăpare fizică.
theological_decisions:
- issue: Sensul mântuirii finale în raport cu răbdarea până la sfârșit
  choice: „va fi mântuit”, fără precizarea naturii mântuirii sau a unui model doctrinar al perseverenței
  alternative: „va fi izbăvit” ori „va fi salvat”, cu accent posibil pe scăparea din primejdie
  rationale: Textul leagă răbdarea în persecuție de mântuire, dar nu cere traducătorului să decidă între izbăvirea temporală, mântuirea escatologică și formulările doctrinare ulterioare. Redarea aleasă păstrează această tensiune.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea este naturală pentru cititorul obișnuit, păstrează imaginile și amplitudinea teologică ale textului grec și evită vocabularul confesional distinctiv.
