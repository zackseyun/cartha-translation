id: MAT.10.34
reference: Matthew 10:34
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/034.yaml
  text: Do not think that I came to bring peace on the earth[a]; I did not come to bring peace[b], but a sword.
translation:
  language: ro
  text: Să nu credeți că am venit să aduc pace pe pământ[a]. N-am venit să aduc pace, ci sabie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Verbul grec este la aorist; româna îl redă firesc aici prin „am venit”.
    reason: grammatical_note
  - marker: b
    text: În context, imaginea sabiei indică divizarea, nu o recomandare a violenței.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Să nu credeți
  rationale: Redă firesc în româna actuală interdicția exprimată prin μή cu conjunctivul aorist, păstrând caracterul direct al enunțului.
- source_word: ἦλθον
  choice: am venit
  rationale: Perfectul compus este corespondentul românesc natural aici pentru aoristul grec și exprimă venirea lui Isus în raport cu misiunea sa.
- source_word: βαλεῖν
  choice: să aduc
  rationale: Deși verbul poate însemna literal „a arunca”, în această construcție finală și cu obiectele „pace” și „sabie”, „a aduce” transmite idiomatic rezultatul avut în vedere fără a obscuriza sensul.
- source_word: εἰρήνην
  choice: pace
  rationale: Este echivalentul românesc direct și consacrat, fără o extindere interpretativă necerută de context.
- source_word: ἐπὶ τὴν γῆν
  choice: pe pământ
  rationale: Redare naturală și exactă a expresiei în sensul ei larg; româna nu cere articolul hotărât în această locuțiune.
- source_word: ἀλλὰ
  choice: ci
  rationale: După negație, „ci” exprimă în română mai precis contrastul corectiv puternic decât simplul „dar”.
- source_word: μάχαιραν
  choice: sabie
  rationale: Păstrează imaginea concretă din greacă. Articolul nehotărât poate lipsi firesc în română în opoziția predicativă „nu pace, ci sabie”, fără schimbarea referinței.
theological_decisions:
- issue: Dacă imaginea sabiei trebuie înlocuită în text cu parafraza interpretativă „dezbinare”
  choice: Păstrarea imaginii concrete „sabie” în textul principal
  alternative: dezbinare
  rationale: Textul grec spune explicit μάχαιραν. Contextul următor arată efectul de dezbinare, dar traducerea nu trebuie să rezolve metafora în textul principal și nici să elimine tensiunea afirmației.
translation_notes:
  register: Română standard modernă, directă și demnă. S-a păstrat paralelismul solemn al celor două propoziții și imaginea puternică a sabiei. Forma contractată „N-am” este curentă și naturală, fără a coborî registrul.
