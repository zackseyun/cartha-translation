id: MAT.10.11
reference: Matthew 10:11
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε, ἐξετάσατε τίς ἐν αὐτῇ ἄξιός ἐστιν· κἀκεῖ μείνατε ἕως ἂν ἐξέλθητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: ro
  text: În orice oraș sau sat veți intra, căutați să aflați[a] cine este vrednic acolo[b] și rămâneți acolo până când veți pleca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „întrebați cu atenție” ori „cercetați”.'
    reason: lexical_alternative
  - marker: b
    text: Aici, „vrednic” se referă probabil la cineva potrivit sau dispus să-i primească pe trimiși, nu la cineva care a câștigat favoarea lui Dumnezeu prin merite.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε
  choice: În orice oraș sau sat veți intra
  rationale: Redă construcția relativă nedefinită și sensul direcțional al intrării într-un loc, într-o formulare românească firească. „Oraș” și „sat” păstrează distincția dintre πόλις și κώμη.
- source_word: ἐξετάσατε
  choice: căutați să aflați
  rationale: Verbul cere o cercetare sau o întrebare atentă, nu doar dobândirea întâmplătoare a unei informații. Formularea este clară în româna actuală și evită impresia unei anchete formale.
- source_word: τίς ἐν αὐτῇ ἄξιός ἐστιν
  choice: cine este vrednic acolo
  rationale: Păstrează termenul evaluativ ἄξιος și leagă persoana de localitatea tocmai menționată, fără a preciza în text un criteriu pe care greaca nu îl explică explicit.
- source_word: κἀκεῖ μείνατε
  choice: și rămâneți acolo
  rationale: Păstrează atât valoarea conjunctivă a lui καί, cât și referința locală a lui ἐκεῖ. Nu transformă explicit locul în „casa lui”, deși contextul poate sugera găzduirea de către persoana vrednică.
- source_word: ἕως ἂν ἐξέλθητε
  choice: până când veți pleca
  rationale: Redă limita temporală viitoare exprimată prin ἕως ἄν cu conjunctivul. „Veți pleca” este mai natural aici decât redarea literală „veți ieși”.
theological_decisions:
- issue: Sensul lui „vrednic” în instrucțiunile misionare
  choice: Termenul „vrednic” este păstrat în text, iar nota indică sensul contextual probabil de persoană potrivită sau dispusă să-i primească pe trimiși.
  alternative: Interpretarea lui „vrednic” în sens moral general sau ca desemnând pe cineva care a dobândit merit înaintea lui Dumnezeu.
  rationale: Contextul privește identificarea unei gazde potrivite, dar textul nu definește explicit vrednicia. Păstrarea termenului în text menține deschiderea semantică și evită introducerea unei afirmații doctrinare despre merit.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea evită arhaismul „cetate” pentru πόλις și păstrează concizia instrucțiunii. Viitorul „veți intra/veți pleca” exprimă firesc situația anticipată, iar repetiția lui „acolo” urmează referința locală a textului grec fără a impune explicit ideea de casă sau gazdă.
