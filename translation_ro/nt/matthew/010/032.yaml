id: MAT.10.32
reference: Matthew 10:32
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ὁμολογήσει ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, ὁμολογήσω κἀγὼ ἐν αὐτῷ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/032.yaml
  text: Therefore everyone who confesses me before men[b][a], I also will confess before my Father who is in heaven.
translation:
  language: ro
  text: Așadar, pe oricine Mă va mărturisi înaintea oamenilor, îl voi mărturisi și Eu înaintea Tatălui Meu care este în ceruri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greaca spune mai literal „voi mărturisi și Eu în el” sau „cu privire la el”. În română, sensul este redat idiomatic prin „îl voi mărturisi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Așadar, pe oricine
  rationale: Construcția generalizatoare îi cuprinde pe toți cei care îndeplinesc condiția, iar „așadar” păstrează legătura inferențială cu contextul precedent.
- source_word: ὁμολογήσει ἐν ἐμοὶ
  choice: Mă va mărturisi
  rationale: În această construcție, ὁμολογέω cu ἐν indică recunoașterea publică a lui Isus; formularea românească este firească și păstrează dimensiunea verbală și publică.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: înaintea oamenilor
  rationale: Redă prezența publică indicată de ἔμπροσθεν, iar „oamenilor” are aici referință umană generică și este natural în româna actuală.
- source_word: ὁμολογήσω κἀγὼ ἐν αὐτῷ
  choice: îl voi mărturisi și Eu
  rationale: Repetarea aceluiași verb păstrează reciprocitatea expresivă a textului. Pronumele „îl” redă idiomatic persoana recunoscută, în timp ce nota consemnează construcția greacă neobișnuită cu ἐν.
- source_word: ἔμπροσθεν τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: înaintea Tatălui Meu care este în ceruri
  rationale: Păstrează atât relația personală exprimată prin „Tatăl Meu”, cât și pluralul grecesc οὐρανοῖς, într-o formulare biblică demnă și inteligibilă.
theological_decisions:
- issue: Mărturisirea publică a lui Isus și mărturisirea reciprocă de către Isus
  choice: Versetul este redat ca o promisiune directă de recunoaștere reciprocă înaintea Tatălui.
  alternative: Formularea ar putea fi explicitată ca referire exclusivă la judecata finală sau la o mărturisire eclezială formală.
  rationale: Textul afirmă reciprocitatea și cadrul ceresc, dar nu precizează aici mecanismul mântuirii, momentul exact ori o formă eclezială; traducerea nu introduce aceste concluzii.
translation_notes:
  register: Română standard modernă, clară și demnă. Viitorul este păstrat în ambele propoziții pentru a reda paralelismul grecesc, iar majusculele reverențiale urmează uzul biblic românesc.
