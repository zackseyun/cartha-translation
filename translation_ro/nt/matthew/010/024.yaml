  text: Οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν διδάσκαλον οὐδὲ δοῦλος ὑπὲρ τὸν κύριον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/024.yaml
  text: A disciple is not above the teacher[b][a], nor a slave above his master.
translation:
  language: ro
  text: Ucenicul nu este mai presus de învățător, nici sclavul[a] mai presus de stăpânul său[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „slujitor”; termenul grecesc δοῦλος poate desemna, în funcție de context, un sclav sau un slujitor.
    reason: alternative_reading
  - marker: b
    text: Sau „domnul”; termenul grecesc κύριος poate însemna și „domn”, dar aici desemnează stăpânul uman din această comparație.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: ucenic
  rationale: „Ucenic” redă atât învățarea, cât și relația personală de formare și urmare specifică Evangheliilor, mai bine decât termenul mai academic „elev”.
- source_word: ὑπέρ
  choice: mai presus de
  rationale: Cu acuzativul, termenul exprimă aici superioritatea de rang sau poziție; formularea este firească în română și păstrează comparația.
- source_word: διδάσκαλος
  choice: învățător
  rationale: Redă sensul direct al termenului și păstrează registrul demn al rostirii, fără a-l confunda cu „stăpân” din a doua comparație.
- source_word: δοῦλος
  choice: sclav
  rationale: În paralela socială cu κύριος, termenul indică o persoană aflată sub autoritatea și în posesia unui stăpân; „sclav” păstrează mai clar această realitate decât „slujitor”.
- source_word: κύριος
  choice: stăpân
  rationale: În această analogie socială, cuvântul desemnează superiorul uman al sclavului, nu un titlu divin; „stăpân” exprimă limpede relația contextuală.
- source_word: αὐτοῦ
  choice: său
  rationale: Pronumele genitival indică relația fiecăruia cu propriul superior. Repetarea lui „său” în ambele membre face explicit paralelismul firesc în română.
- source_word: οὐδέ
  choice: nici
  rationale: Leagă natural în română a doua propoziție negativă de prima.
theological_decisions:
- issue: Redarea lui δοῦλος într-o analogie socială
  choice: sclav
  alternative: slujitor
  rationale: Contrastul cu „stăpân” pune în prim-plan statutul de subordonare și dependență. Alternativa mai largă este păstrată în nota de subsol.
- issue: Redarea lui κύριος într-un context uman
  choice: stăpân
  alternative: Domn
  rationale: Contextul imediat este relația dintre sclav și superiorul său uman; traducerea nu transformă termenul într-un titlu divin, dar consemnează alternativa lexicală.
translation_notes:
  register: Română literară modernă, clară și demnă. Construcția paralelă „nu este mai presus de... nici...” păstrează forma sentențioasă a originalului. Pronumele posesiv este exprimat în ambele membre pentru simetrie și naturalețe în română.
