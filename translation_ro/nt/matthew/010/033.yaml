id: MAT.10.33
reference: Matthew 10:33
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: ro
  text: Dar oricine se va lepăda de mine înaintea oamenilor, mă voi lepăda și eu de el înaintea Tatălui meu care este în ceruri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: Dar pe oricine
  rationale: ὅστις împreună cu ἄν și conjunctivul introduce o situație generală, iar δέ marchează contrastul cu versetul anterior. Formularea românească păstrează atât caracterul general, cât și legătura adversativă.
- source_word: ἀρνήσηταί με
  choice: se va lepăda de mine
  rationale: Verbul ἀρνέομαι poate însemna a nega, a tăgădui sau a se dezice de cineva. În acest context relațional și public, „a se lepăda de” este o redare românească firească și solemnă.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: înaintea oamenilor
  rationale: ἔμπροσθεν indică prezența publică, iar pluralul ἀνθρώπων are aici sens generic. „Oamenilor” este natural în română și îi include pe oameni în general.
- source_word: ἀρνήσομαι κἀγὼ αὐτὸν
  choice: mă voi lepăda și eu de el
  rationale: Repetarea aceleiași expresii păstrează corespondența solemnă dintre lepădarea omului de Isus și lepădarea lui Isus de acel om; „și eu” redă accentul lui κἀγώ.
- source_word: ἔμπροσθεν τοῦ πατρός μου
  choice: înaintea Tatălui meu
  rationale: Redare directă a expresiei filiale folosite de Isus; majuscula marchează folosirea titulară a lui „Tatăl”, fără a extinde sensul textului.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: care este în ceruri
  rationale: Păstrează pluralul grecesc οὐρανοῖς, care este totodată firesc în registrul biblic românesc.
theological_decisions:
- issue: Corespondența dintre cele două apariții ale verbului ἀρνέομαι
  choice: se va lepăda de mine ... mă voi lepăda și eu de el
  alternative: mă va tăgădui ... îl voi tăgădui și eu
  rationale: Folosirea aceleiași expresii în ambele propoziții păstrează simetria retorică și teologică a textului, fără a explica în plus natura sau urmările lepădării.
- issue: Referirea generică prin ἀνθρώπων și reluarea masculină αὐτόν
  choice: oamenilor ... de el
  alternative: oamenilor ... de acea persoană
  rationale: „Oamenilor” redă natural sensul generic al substantivului grecesc, iar „de el” păstrează reluarea pronominală masculină singulară a textului, fără a restrânge aplicarea afirmației doar la bărbați.
translation_notes:
  register: Română standard modernă, cu ton demn și solemn. Construcția „se va lepăda de” este clară pentru cititorul obișnuit și păstrează forța relațională a verbului grec. Pronumele referitoare la Isus rămân cu literă mică potrivit ortografiei curente, iar „Tatăl” este tratat ca desemnare titulară.
