  text: εἰσερχόμενοι δὲ εἰς τὴν οἰκίαν ἀσπάσασθε αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/012.yaml
  text: As you enter the house[a], greet it.
translation:
  language: ro
  text: Când intrați în casă[a], salutați-o.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, „salutați-o”, cu referire la casă; probabil este o metonimie pentru cei care locuiesc în ea.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμενοι
  choice: Când intrați
  rationale: Participiul prezent nominativ plural are funcție adverbială și este redat firesc printr-o propoziție temporală; formularea păstrează raportul temporal cu imperativul.
- source_word: δὲ
  choice: nespecificat separat
  rationale: δέ este un conector discursiv slab; în română, legătura este redată suficient prin construcția temporală, fără a introduce un contrast nejustificat.
- source_word: οἰκίαν
  choice: în casă
  rationale: οἰκία poate desemna casa ori gospodăria/familia. Contextul intrării favorizează sensul concret „casă”, lăsând posibilă folosirea metonimică pentru locuitorii ei.
- source_word: ἀσπάσασθε
  choice: salutați
  rationale: Imperativul aorist mediu, persoana a doua plural, exprimă o poruncă directă. „Salutați” este echivalentul modern, clar și demn.
- source_word: αὐτήν
  choice: -o
  rationale: Pronumele feminin singular se acordă cu οἰκίαν. Cliticul românesc păstrează referirea gramaticală la „casă” și formularea metonimică a grecei.
theological_decisions:
- issue: Adresarea metonimică a casei sau referirea explicită la locuitorii ei
  choice: Păstrarea formulării metonimice „salutați-o” în text
  alternative: „salutați familia” / „salutați-i pe cei din ea”
  rationale: Greaca folosește pronumele feminin singular αὐτήν, care se referă direct la οἰκίαν. Redarea literal-metonomică păstrează ambiguitatea textului, iar sensul social probabil este explicat în nota de subsol.
translation_notes:
  register: Română standard modernă, clară și demnă. Construcția „Când intrați” este firească, iar „salutați-o” păstrează neobișnuita metonimie a originalului fără a-i elimina tensiunea interpretativă.
