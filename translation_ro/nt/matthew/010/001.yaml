id: MAT.10.1
reference: Matthew 10:1
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: ro
  text: Chemându-i la el pe cei doisprezece ucenici ai săi[a], le-a dat autoritate asupra duhurilor necurate[b], astfel încât să le alunge și să vindece orice boală și orice neputință[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „După ce i-a chemat la el pe cei doisprezece ucenici ai săi”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „putere asupra duhurilor necurate”; termenul grecesc ἐξουσία poate exprima autoritatea ori dreptul acordat de a acționa.'
    reason: lexical_alternative
  - marker: c
    text: Expresia „orice boală și orice neputință” redă doi termeni grecești apropiați ca sens (νόσος și μαλακία); μαλακία poate fi redat și „suferință”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: Chemându-i la el
  rationale: Participiul aorist mediu exprimă chemarea ucenicilor la sine; formularea păstrează această nuanță și este firească în româna actuală.
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: pe cei doisprezece ucenici ai săi
  rationale: „Ucenici” este termenul consacrat și precis în contextul Evangheliilor, iar „ai săi” redă posesivul αὐτοῦ.
- source_word: ἔδωκεν
  choice: le-a dat
  rationale: Redă direct sensul obișnuit al verbului δίδωμι, fără a introduce nuanțe suplimentare precum „a conferit”.
- source_word: ἐξουσίαν
  choice: autoritate
  rationale: ἐξουσία indică aici autoritatea sau dreptul acordat de Isus de a acționa, nu doar o putere impersonală.
- source_word: πνευμάτων ἀκαθάρτων
  choice: asupra duhurilor necurate
  rationale: Construcția cu „asupra” exprimă natural autoritatea exercitată asupra spiritelor, iar „duhuri necurate” păstrează terminologia evanghelică.
- source_word: ὥστε
  choice: ca să
  rationale: Împreună cu infinitivele următoare, ὥστε poate exprima scopul sau rezultatul avut în vedere; „ca să” redă natural legătura fără a încărca fraza.
- source_word: ἐκβάλλειν αὐτὰ
  choice: să le alunge
  rationale: În contextul exorcizării, ἐκβάλλω înseamnă a scoate sau a alunga; pronumele „le” se referă fără echivoc la duhurile necurate.
- source_word: θεραπεύειν
  choice: să vindece
  rationale: În acest context, θεραπεύω denumește vindecarea celor bolnavi.
- source_word: πᾶσαν νόσον
  choice: orice boală
  rationale: νόσος denumește boala sau maladia; „boală” este termenul românesc firesc și clar.
- source_word: πᾶσαν μαλακίαν
  choice: orice neputință
  rationale: μαλακία poate desemna slăbiciunea, neputința sau suferința trupească. „Neputință” păstrează distincția față de νόσος fără a restrânge excesiv sensul.
theological_decisions:
- issue: Natura însărcinării date celor doisprezece
  choice: Isus le-a dat autoritate asupra duhurilor necurate, manifestată prin alungarea lor și prin vindecare.
  alternative: Isus le-a dat putere asupra duhurilor necurate.
  rationale: „Autoritate” redă mai precis ἐξουσία ca drept sau capacitate conferită de Isus, fără a exclude puterea efectivă și fără a adăuga o doctrină care nu este formulată în verset.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează structura participială a textului grec, terminologia evanghelică „ucenici” și „duhuri necurate”, precum și distincția dintre cei doi termeni referitori la afecțiuni.
