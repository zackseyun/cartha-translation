  text: ὑμῶν δὲ καὶ αἱ τρίχες τῆς κεφαλῆς πᾶσαι ἠριθμημέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/030.yaml
  text: But even the hairs of your head are all numbered[a].
translation:
  language: ro
  text: Dar până și firele de păr de pe capul vostru sunt toate numărate[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „au fost numărate”. Perfectul pasiv grecesc poate accentua o acțiune încheiată al cărei rezultat continuă în prezent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῶν
  choice: vostru
  rationale: Genitivul persoanei a doua plural exprimă posesia; în română, „capul vostru” redă firesc această relație.
- source_word: δὲ
  choice: Dar
  rationale: Marchează o ușoară opoziție sau o continuare contrastivă față de contextul anterior.
- source_word: καὶ
  choice: până și
  rationale: Are valoare emfatică, subliniind că sunt cuprinse chiar și detaliile cele mai mici.
- source_word: αἱ τρίχες τῆς κεφαλῆς
  choice: firele de păr de pe capul vostru
  rationale: Formulare românească naturală care păstrează imaginea concretă și referirea colectivă la firele individuale.
- source_word: πᾶσαι
  choice: toate
  rationale: Păstrează accentul explicit asupra totalității și se acordă cu „firele”.
- source_word: ἠριθμημέναι εἰσίν
  choice: sunt toate numărate
  rationale: Construcția perfectă pasivă perifrastică descrie o acțiune împlinită cu rezultat prezent; această redare păstrează firesc starea rezultată.
theological_decisions:
- issue: Amploarea cunoașterii și grijii divine sugerate de afirmație
  choice: Afirmația este redată direct, prin imaginea firelor de păr numărate.
  alternative: O parafrază explicită despre grija, cunoașterea sau controlul providențial al lui Dumnezeu.
  rationale: Textul afirmă concret că firele de păr sunt numărate; implicația teologică trebuie să reiasă din context, fără adaos doctrinar explicativ.
translation_notes:
  register: Română standard modernă, clară și demnă. „Până și” redă firesc emfaza lui καὶ, iar „firele de păr de pe capul vostru” evită formularea rigidă „perii capului vostru”.
