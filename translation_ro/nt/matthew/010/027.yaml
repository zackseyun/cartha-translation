id: MAT.10.27
reference: Matthew 10:27
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὃ λέγω ὑμῖν ἐν τῇ σκοτίᾳ, εἴπατε ἐν τῷ φωτί· καὶ ὃ εἰς τὸ οὖς ἀκούετε, κηρύξατε ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/027.yaml
  text: What I tell you in the darkness[a], say in the light; and what you hear in the ear[b], proclaim on the housetops.
translation:
  language: ro
  text: Ceea ce vă spun în întuneric[a], spuneți la lumină; iar ceea ce auziți la ureche[b], proclamați de pe acoperișuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „în ascuns ... în public”; greaca păstrează imaginea „în întuneric ... la lumină”.'
    reason: lexical_alternative
  - marker: b
    text: Adică ceea ce este auzit în particular trebuie vestit public. Acoperișurile plate ale caselor din Antichitate puteau servi drept locuri înalte și vizibile pentru anunțuri publice.
    reason: cultural_note
lexical_decisions:
- source_word: ὃ λέγω ὑμῖν
  choice: Ceea ce vă spun
  rationale: Redă natural pronumele relativ substantivizat și construcția cu obiect indirect, păstrând adresarea directă.
- source_word: ἐν τῇ σκοτίᾳ
  choice: în întuneric
  rationale: Păstrează imaginea grecească și opoziția retorică față de „la lumină”, fără a o reduce la sensul interpretativ „în secret”.
- source_word: εἴπατε ἐν τῷ φωτί
  choice: spuneți la lumină
  rationale: Imperativul plural este redat direct, iar formularea păstrează contrastul întuneric–lumină într-o română firească.
- source_word: ὃ εἰς τὸ οὖς ἀκούετε
  choice: ceea ce auziți la ureche
  rationale: Păstrează expresia vie și singularul generic al textului grec; în context indică o comunicare făcută în particular.
- source_word: κηρύξατε
  choice: proclamați
  rationale: Redă ideea de vestire publică și autoritativă fără a restrânge sensul la predicarea formală.
- source_word: ἐπὶ τῶν δωμάτων
  choice: de pe acoperișuri
  rationale: Româna cere firesc perspectiva sursei anunțului; expresia păstrează cadrul cultural al acoperișurilor plate folosite ca locuri înalte și vizibile.
theological_decisions:
- issue: Dacă imaginile întuneric–lumină și ureche–acoperișuri trebuie păstrate sau înlocuite cu o parafrază despre comunicarea privată și publică
  choice: Păstrarea imaginilor în textul principal
  alternative: „în secret ... în public ... ceea ce vi se șoptește ... vestiți public”
  rationale: Textul grec folosește imagini antitetice pregnante. Păstrarea lor conservă forța retorică și lasă intactă relația dintre sensul concret și cel figurat, fără a impune o interpretare mai îngustă.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează paralelismul și imaginile sursei, folosind imperativul plural adresat ucenicilor.
