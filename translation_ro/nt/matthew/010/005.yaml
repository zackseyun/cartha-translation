source:
  edition: SBLGNT
  text: Τούτους τοὺς δώδεκα ἀπέστειλεν ὁ Ἰησοῦς παραγγείλας αὐτοῖς λέγων· Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε καὶ εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/005.yaml
  text: Jesus sent out these twelve, instructing them, saying, “Do not go on the road to the Gentiles, and do not enter a town of the Samaritans.”
translation:
  language: ro
  text: 'Pe acești doisprezece i-a trimis Isus, poruncindu-le: „Să nu porniți pe drumul neamurilor[a] și să nu intrați în vreun oraș al samaritenilor[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „spre neamuri”. Expresia grecească folosește literal limbajul drumului și poate indica îndreptarea spre teritoriul neamurilor.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „în vreun oraș samaritean”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: Pe aceștia doisprezece
  rationale: Păstrează demonstrativul și numeralul din greacă fără a adăuga „ucenici”, termen doar subînțeles din context.
- source_word: ἀπέστειλεν
  choice: i-a trimis
  rationale: Redă direct actul trimiterii în misiune; contextul oferă nuanța însărcinării fără a fi necesară explicitarea ei.
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: poruncindu-le
  rationale: παραγγέλλω are aici forță directivă, iar româna nu are nevoie de redarea separată și redundantă a lui λέγων înaintea vorbirii directe.
- source_word: Εἰς ὁδὸν ἐθνῶν
  choice: pe vreun drum al neamurilor
  rationale: Păstrează imaginea concretă a drumului și genitivul ambiguu, fără a transforma neechivoc expresia într-o indicație de destinație.
- source_word: ἐθνῶν
  choice: neamurilor
  rationale: În context desemnează popoarele neevreiești; „neamuri” este termenul biblic românesc consacrat și evită nuanța peiorativă a lui „păgâni”.
- source_word: μὴ ἀπέλθητε
  choice: Să nu mergeți
  rationale: Redă firesc în română interdicția exprimată prin μή cu conjunctivul aorist.
- source_word: εἰς πόλιν Σαμαριτῶν
  choice: în vreo cetate a samaritenilor
  rationale: „Cetate” redă πόλις într-un registru biblic demn, iar genitivul „a samaritenilor” urmează îndeaproape structura greacă.
- source_word: μὴ εἰσέλθητε
  choice: să nu intrați
  rationale: Este echivalentul direct și natural al interdicției de a intra.
theological_decisions:
- issue: Întinderea și durata interdicției privind neamurile și samaritenii
  choice: Instrucțiunea este redată ca o interdicție fermă adresată celor doisprezece în această trimitere, fără precizări explicative despre durata ei.
  alternative: O formulare care ar prezenta interdicția drept excludere absolută și permanentă.
  rationale: Versetul însuși consemnează o directivă concretă, dar nu îi definește aici durata teologică; traducerea păstrează tensiunea fără a importa o concluzie doctrinară.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează concizia textului grec; „poruncindu-le” conservă forța directivei, iar notele marchează alternativele lexicale autentice.
