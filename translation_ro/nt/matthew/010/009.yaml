  text: μὴ κτήσησθε χρυσὸν μηδὲ ἄργυρον μηδὲ χαλκὸν εἰς τὰς ζώνας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/009.yaml
  text: Do not acquire gold or silver or copper for your belts[b][a],
translation:
  language: ro
  text: Să nu vă procurați nici aur, nici argint, nici aramă[a] în brâiele voastre[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „bronz”.
    reason: lexical_alternative
  - marker: b
    text: Adică bani purtați în brâu sau în pungi pentru bani purtate la brâu.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ κτήσησθε
  choice: Să nu vă procurați
  rationale: Verbul κτάομαι înseamnă aici „a dobândi/a procura pentru sine”, nu doar „a purta”. Forma reflexivă românească păstrează nuanța verbului la diateza medie și interdicția din contextul trimiterii în misiune.
- source_word: χρυσὸν
  choice: aur
  rationale: Echivalentul direct al materialului, folosit aici cu referire la bani din aur.
- source_word: ἄργυρον
  choice: argint
  rationale: Echivalentul direct al materialului, folosit aici cu referire la bani din argint.
- source_word: χαλκὸν
  choice: aramă
  rationale: χαλκός poate desemna arama sau bronzul; într-o enumerare monetară alături de aur și argint, „aramă” redă firesc metalul monedelor de valoare mică. Alternativa „bronz” este păstrată în notă.
- source_word: εἰς τὰς ζώνας ὑμῶν
  choice: pentru brâiele voastre
  rationale: ζώνη desemnează brâul sau cingătoarea, care putea servi la păstrarea banilor. „Pentru brâiele voastre” păstrează construcția cu εἰς fără a introduce explicit în text noțiunea interpretativă de pungă.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu formulare demnă și accesibilă. „Să nu vă procurați” exprimă mai precis ideea dobândirii decât simplul „să nu luați”, iar „brâie” păstrează realitatea culturală antică; nota explică funcția lor.
