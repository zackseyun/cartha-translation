id: MAT.10.42
reference: Matthew 10:42
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: ro
  text: 'Și oricine îi va da unuia dintre acești micuți[b] chiar și un pahar cu apă rece, pentru că este ucenic[a], adevărat vă spun: nu-și va pierde nicidecum răsplata.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mai literal: „în numele unui ucenic”. Expresia grecească arată că gestul este făcut având în vedere identitatea destinatarului ca ucenic.'
    reason: alternative_reading
  - marker: b
    text: Expresia „acești micuți” se referă probabil, în acest context, la urmașii lui Isus considerați smeriți sau lipsiți de însemnătate, nu neapărat numai la copii.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς ἂν
  choice: oricine
  rationale: Pronumele relativ împreună cu ἄν are sens nedefinit și generalizator; „oricine” îl redă firesc în româna actuală.
- source_word: ποτίσῃ
  choice: îi va da ... un pahar cu apă
  rationale: Verbul înseamnă literal „a da să bea”; formularea aleasă este idiomatică în română și păstrează actul concret al oferirii apei.
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: unuia dintre acești micuți
  rationale: „Micuți” păstrează metafora și nu limitează referința la copii; contextul permite sensul unor ucenici smeriți ori lipsiți de însemnătate socială.
- source_word: ποτήριον ψυχροῦ
  choice: un pahar cu apă rece
  rationale: Substantivul „apă” este subînțeles în greacă; explicitarea lui este necesară și naturală în română.
- source_word: μόνον
  choice: chiar și
  rationale: În context, μόνον subliniază caracterul minim al darului. „Chiar și” transmite natural că până și un gest atât de modest contează.
- source_word: εἰς ὄνομα μαθητοῦ
  choice: pentru că este ucenic
  rationale: 'Expresia indică temeiul gestului: identitatea destinatarului ca ucenic. Nota păstrează formularea mai literală și ambiguitatea posibilă a construcției.'
- source_word: ἀμὴν λέγω ὑμῖν
  choice: adevărat vă spun
  rationale: Redă formula solemnă și autoritativă a lui Isus într-o română demnă și inteligibilă.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: nu-și va pierde nicidecum
  rationale: Dubla negație emfatică οὐ μή cere o asigurare puternică; „nicidecum” păstrează această forță.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: răsplata
  rationale: În contextul uceniciei, μισθός desemnează răsplata sau recompensa, nu simpla plată salarială.
theological_decisions:
- issue: Referentul expresiei „acești micuți”
  choice: Expresia este păstrată fără a fi restrânsă la copii.
  alternative: „acești neînsemnați” sau o referire exclusivă la copii
  rationale: Contextul imediat privește primirea ucenicilor, iar termenul poate desemna persoane smerite ori de statut redus dintre urmașii lui Isus. Traducerea nu elimină rezonanța literală.
- issue: Sensul expresiei εἰς ὄνομα μαθητοῦ
  choice: „pentru că este ucenic” în text, cu forma mai literală în notă
  alternative: „în numele unui ucenic”
  rationale: Construcția indică cel mai probabil că gestul este făcut datorită identității destinatarului ca ucenic. Nota conservă forma grecească și evită prezentarea interpretării drept singura posibilitate.
- issue: Natura răsplății
  choice: Textul afirmă certitudinea răsplății fără a-i defini natura.
  alternative: Precizarea explicită a unei răsplăți pământești sau cerești
  rationale: Versetul nu precizează aici natura ori momentul răsplății; traducerea nu adaugă o definiție doctrinară.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Micuți” păstrează imaginea textului fără a o reduce interpretativ la copii, iar „nicidecum” redă emfaza negației grecești. Marcajele notelor sunt așezate lângă expresiile pe care le explică.
