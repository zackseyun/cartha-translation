id: MAT.10.7
reference: Matthew 10:7
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: πορευόμενοι δὲ κηρύσσετε λέγοντες ὅτι Ἤγγικεν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/007.yaml
  text: And as you go[a], proclaim, saying[c][b], ‘The kingdom of heaven has drawn near.’
translation:
  language: ro
  text: 'Iar, în timp ce mergeți, vestiți: „Împărăția cerurilor s-a apropiat[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „a venit aproape” ori „este aproape”. Perfectul grecesc subliniază că apropierea s-a produs și că rezultatul ei este prezent.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευόμενοι
  choice: pe drum
  rationale: Participiul prezent exprimă acțiunea care însoțește porunca; formularea românească redă natural ideea „în timp ce mergeți”, fără a sugera că mersul însuși este porunca principală.
- source_word: δὲ
  choice: Iar
  rationale: Conector slab, care leagă instrucțiunea de contextul anterior fără a introduce un contrast puternic.
- source_word: κηρύσσετε
  choice: vestiți
  rationale: Imperativul denumește proclamarea publică și autorizată; „vestiți” este actual, demn și mai puțin limitat la contextul ecleziastic decât „predicați”.
- source_word: λέγοντες
  choice: 'astfel:'
  rationale: Participiul introduce conținutul proclamării. În română, „vestiți astfel:” evită redundanța rigidă „vestiți, spunând”, păstrând explicit funcția lui λέγοντες.
- source_word: ὅτι
  choice: „… ”
  rationale: Introduce conținutul direct; ghilimelele și două puncte îl redau idiomatic, fără un „că” nefiresc înaintea citatului.
- source_word: Ἤγγικεν
  choice: s-a apropiat
  rationale: Perfectul grec indică o apropiere care a avut loc și are relevanță prezentă. Perfectul compus românesc păstrează mai bine această nuanță decât simplul „este aproape”.
- source_word: ἡ βασιλεία
  choice: Împărăția
  rationale: Echivalent consacrat și inteligibil, suficient de larg pentru a cuprinde atât domnia, cât și sfera stăpânirii, fără a reduce sensul la una dintre ele.
- source_word: τῶν οὐρανῶν
  choice: cerurilor
  rationale: Pluralul păstrează forma expresiei mateene și sună firesc în formula românească consacrată „Împărăția cerurilor”.
theological_decisions:
- issue: Sensul expresiei „Împărăția cerurilor”
  choice: S-a păstrat formularea distinctivă a lui Matei, „Împărăția cerurilor”.
  alternative: „domnia cerului” sau „Împărăția lui Dumnezeu”
  rationale: Textul nu trebuie armonizat cu formularea frecventă din celelalte Evanghelii. „Împărăția” păstrează tensiunea dintre domnie și domeniul domniei.
- issue: Aspectul verbului ἤγγικεν
  choice: „s-a apropiat”
  alternative: „este aproape” sau „a venit aproape”
  rationale: Redarea păstrează ideea unei apropieri deja survenite și încă relevante, fără a defini mai precis decât textul modul sau gradul împlinirii Împărăției.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Iar” menține legătura discursivă, iar „vestiți astfel:” redă natural construcția κηρύσσετε λέγοντες fără a omite funcția participiului.
