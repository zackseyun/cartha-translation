  text: καὶ ὃς ⸀ἂν μὴ δέξηται ὑμᾶς μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν, ἐξερχόμενοι ⸀ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: ro
  text: Iar dacă cineva nu vă primește și nici nu ascultă cuvintele voastre[a], când ieșiți din casa aceea sau din orașul acela[c], scuturați praful de pe picioarele voastre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „și nici nu aude cuvintele voastre”.'
    reason: lexical_alternative
  - marker: b
    text: „A scutura praful de pe picioare” era un gest simbolic de delimitare și de judecată față de cei care respingeau mesajul.
    reason: cultural_note
  - marker: c
    text: 'Sau: „cetatea aceea”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν μὴ
  choice: dacă cineva nu
  rationale: Construcția relativă nedefinită are sens generic-condițional. Formularea este firească în româna actuală și păstrează condiția de care depinde porunca următoare.
- source_word: δέξηται ὑμᾶς
  choice: vă primește
  rationale: Verbul exprimă primirea favorabilă și ospitalieră a mesagerilor, fără a restrânge sensul la simpla găzduire.
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: și nici nu ascultă cuvintele voastre
  rationale: „Ascultă” redă aici auzirea atentă a mesajului, fără a introduce explicit ideea mai puternică de supunere.
- source_word: ἐξερχόμενοι ἔξω
  choice: când ieșiți
  rationale: Participiul circumstanțial indică momentul ieșirii; expresia românească este concisă și păstrează mișcarea explicită din text.
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: din casa sau din cetatea aceea
  rationale: Repetarea prepoziției clarifică în română cele două alternative, iar „aceea” păstrează forța demonstrativă. „Cetate” redă πόλις fără a impune dimensiunea unei metropole moderne.
- source_word: ἐκτινάξατε
  choice: scuturați-vă
  rationale: Imperativul descrie îndepărtarea energică a prafului. Forma reflexivă este idiomatică în construcția românească „a-și scutura praful de pe picioare”.
- source_word: τὸν κονιορτὸν τῶν ποδῶν ὑμῶν
  choice: praful de pe picioare
  rationale: „Praf” păstrează imaginea concretă, iar „de pe picioare” exprimă natural îndepărtarea acestuia.
theological_decisions:
- issue: Semnificația gestului față de cei care resping mesagerii și mesajul lor
  choice: Păstrarea poruncii concrete „scuturați-vă praful de pe picioare” în textul principal
  alternative: Parafrazarea gestului drept condamnare sau adăugarea formulei din relatările paralele „ca mărturie împotriva lor”
  rationale: Versetul descrie gestul fără a-i explicita aici întreaga interpretare. Traducerea nu importă în text formulări din pasajele paralele și păstrează tensiunea teologică.
translation_notes:
  register: Română standard modernă, clară și demnă. Coordonarea negativă „și nici” este idiomatică; „cetate” păstrează registrul biblic moderat, iar nota oferă alternativa curentă „oraș”.
