id: MAT.10.10
reference: Matthew 10:10
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: ro
  text: să nu luați pentru drum nici traistă[a], nici două tunici, nici sandale, nici toiag, căci lucrătorul este vrednic de hrana lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Unii înțeleg „nici toiag” ca interzicând luarea unui toiag în plus, mai ales în lumina textului din Marcu 6:8, unde este îngăduit un toiag.
    reason: alternative_reading
lexical_decisions:
- source_word: πήραν
  choice: traistă
  rationale: Termenul desemnează o geantă purtată în călătorie, îndeosebi pentru provizii. „Traistă” este concis, firesc în română și potrivit cadrului antic.
- source_word: εἰς ὁδὸν
  choice: pentru drum
  rationale: Redă idiomatic scopul călătoriei și păstrează concizia expresiei grecești.
- source_word: δύο χιτῶνας
  choice: două tunici
  rationale: χίτων este veșmântul de bază purtat pe corp; „tunici” păstrează precizia istorică.
- source_word: ὑποδήματα
  choice: sandale
  rationale: În contextul secolului întâi, „sandale” redă natural încălțămintea desemnată de termen.
- source_word: ῥάβδον
  choice: toiag
  rationale: În acest context, termenul denumește toiagul purtat la drum. Traducerea rămâne directă și nu armonizează formularea lui Matei cu Marcu 6:8.
- source_word: ἄξιος
  choice: este vrednic
  rationale: Păstrează sensul evaluativ al termenului și expresia biblică firească în română, fără a-l reduce la simplul „merită”.
- source_word: ὁ ἐργάτης
  choice: lucrătorul
  rationale: Este un echivalent modern și clar pentru cel care muncește, fără a introduce un sens eclezial tehnic.
- source_word: τῆς τροφῆς αὐτοῦ
  choice: de hrana lui
  rationale: τροφή înseamnă direct hrană sau mâncare. „Hrana” păstrează sensul concret, fără extinderea interpretativă la întreaga întreținere.
theological_decisions:
- issue: Posibila armonizare cu relatările paralele privind echipamentul permis la drum
  choice: 'Se păstrează interdicția lui Matei: „nici toiag”.'
  alternative: Expresia poate fi înțeleasă ca interzicând un toiag în plus, mai ales în lumina textului din Marcu 6:8.
  rationale: Textul grecesc al lui Matei enumeră explicit ῥάβδον printre lucrurile care nu trebuie luate. Traducerea păstrează tensiunea dintre relatări și nu o rezolvă prin armonizare.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Traistă”, „tunici” și „toiag” păstrează cadrul istoric fără formulări greoaie. Seria cu „nici” reproduce clar structura prohibitivă a grecei.
