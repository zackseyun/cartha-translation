  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: ro
  text: Dar, când vă vor preda[a], să nu vă îngrijorați cum sau ce să spuneți, căci în ceasul acela vi se va da[b] ce să spuneți.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „vă vor da pe mâna cuiva”.'
    reason: lexical_alternative
  - marker: b
    text: Forma pasivă „vi se va da” nu precizează aici cine dă; versetul următor îl identifică pe Duhul Tatălui vostru ca fiind cel care vorbește prin voi.
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Dar, când
  rationale: ὅταν indică o împrejurare viitoare, iar δέ marchează aici trecerea și contrastul ușor cu avertizarea precedentă.
- source_word: παραδῶσιν ὑμᾶς
  choice: vă vor da pe mâna autorităților
  rationale: Expresia românească „a da pe mâna” redă firesc predarea ostilă din contextul judiciar; „autorităților” explicitează doar referentul contextual, fără sensul mai îngust de „a trăda”.
- source_word: μὴ μεριμνήσητε
  choice: să nu vă îngrijorați
  rationale: Redă preocuparea anxioasă interzisă aici într-o română actuală și demnă.
- source_word: πῶς ἢ τί λαλήσητε
  choice: cum sau ce să spuneți
  rationale: Păstrează distincția dintre felul și conținutul vorbirii, precum și conjuncția disjunctivă ἤ; „a spune” este mai firesc în română decât repetarea lui „a vorbi” în această construcție.
- source_word: δοθήσεται
  choice: vi se va da
  rationale: Păstrează pasivul grec și lasă dătătorul neprecizat, așa cum face versetul.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: în ceasul acela
  rationale: Redare apropiată de text, inteligibilă în româna biblică modernă, care păstrează ideea ajutorului oferit chiar la timpul necesar.
- source_word: τί λαλήσητε
  choice: ce să spuneți
  rationale: Reia formularea anterioară și redă natural conținutul rostirii contemplate.
theological_decisions:
- issue: Pasivul divin implicit din δοθήσεται
  choice: „vi se va da”, fără numirea dătătorului în textul principal
  alternative: „Dumnezeu vă va da” sau „Duhul vă va da”
  rationale: Greaca nu numește agentul în acest verset. Versetul următor identifică lucrarea Duhului, dar traducerea păstrează reținerea și progresia textului.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea evită arhaismele inutile, păstrând totuși expresia biblică firească „în ceasul acela”. Marcajele [a] și [b] apar în textul principal.
