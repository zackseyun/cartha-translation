  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: ro
  text: Așadar, nu vă temeți de ei, căci nu este nimic acoperit care să nu fie descoperit și nimic ascuns care să nu ajungă cunoscut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν φοβηθῆτε αὐτούς
  choice: Așadar, nu vă temeți de ei
  rationale: Redă firesc legătura logică οὖν și interdicția aoristă, păstrând explicit pronumele αὐτούς.
- source_word: κεκαλυμμένον ... ἀποκαλυφθήσεται
  choice: acoperit ... să nu fie descoperit
  rationale: Păstrează opoziția lexicală dintre ceea ce este acoperit și dezvăluirea lui; „descoperit” este natural în română și conservă jocul de sens al termenilor grecești înrudiți.
- source_word: κρυπτὸν ... γνωσθήσεται
  choice: ascuns ... să nu ajungă cunoscut
  rationale: Distinge a doua pereche de prima și redă pasivul viitor γνωσθήσεται printr-o formulare românească limpede.
theological_decisions:
- issue: Agentul dezvăluirii și al aducerii la cunoștință nu este exprimat în textul grec.
  choice: Sunt păstrate construcții pasive, fără precizarea agentului.
  alternative: „Dumnezeu va descoperi” / „Dumnezeu va face cunoscut”
  rationale: Numirea explicită a lui Dumnezeu ar putea fi plauzibilă contextual, dar ar adăuga ceva ce versetul nu afirmă gramatical.
- issue: Caracterul general al celor două afirmații paralele
  choice: „nu este nimic ... și nimic ...”
  alternative: O formulare limitată explicit la persecuție ori la învățătura ucenicilor
  rationale: Textul formulează maxime generale; traducerea nu le restrânge interpretativ domeniul.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Paralelismul propoziției grecești este păstrat, cu repetarea lui „nimic” pentru claritate și naturalețe.
