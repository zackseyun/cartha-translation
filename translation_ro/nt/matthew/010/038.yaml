id: MAT.10.38
reference: Matthew 10:38
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ὃς οὐ λαμβάνει τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθεῖ ὀπίσω μου, οὐκ ἔστιν μου ἄξιος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/038.yaml
  text: And whoever does not take up his cross and follow after me is not worthy of me[a][b].
translation:
  language: ro
  text: Și cine nu-și ia crucea și nu mă urmează[a] nu este vrednic de mine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, „nu urmează în urma mea”; în greacă, formularea exprimă explicit urmarea din spatele lui Isus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: cine
  rationale: În construcția generică „cine nu...”, româna redă firesc sensul nedefinit al relativului grec, cu valoare aplicabilă oricărei persoane.
- source_word: λαμβάνει τὸν σταυρὸν αὐτοῦ
  choice: își ia crucea
  rationale: Pronumele reflexiv posesiv „își”, împreună cu substantivul articulat „crucea”, redă natural în română posesivul αὐτοῦ raportat la subiectul generic. Verbul „ia” păstrează imaginea concretă fără a o transforma într-o explicație abstractă.
- source_word: σταυρὸν
  choice: crucea
  rationale: „Cruce” este echivalentul consacrat, clar și adecvat contextului roman al execuției și imaginii uceniciei, fără supraspecificare.
- source_word: ἀκολουθεῖ ὀπίσω μου
  choice: mă urmează
  rationale: În româna actuală, „mă urmează” exprimă idiomatic atât verbul ἀκολουθεῖ, cât și ideea pozițională implicită din ὀπίσω μου. Redarea literală „urmează în urma mea” ar fi redundantă; nuanța explicită a grecei este consemnată în notă.
- source_word: ἄξιος
  choice: vrednic
  rationale: „Vrednic” păstrează tonul solemn și sensul evaluativ al adjectivului grec, fiind firesc în construcția „vrednic de mine”.
- source_word: μου ἄξιος
  choice: vrednic de mine
  rationale: Construcția românească redă direct genitivul persoanei cu ἄξιος, fără a extinde interpretativ sensul spre „vrednic să-mi aparțină”.
theological_decisions:
- issue: Imaginea luării crucii în ucenicie
  choice: Păstrarea imaginii concrete „își ia crucea”
  alternative: Parafrazarea ca „acceptă suferința” sau „se leapădă de sine”
  rationale: Textul folosește deliberat crucea ca imagine a rușinii, suferinței și costului urmării lui Isus. O parafrazare ar restrânge și ar explica excesiv această imagine bogată.
- issue: Valoarea generică a lui ὃς și αὐτοῦ
  choice: Construcția românească generică „cine nu-și ia crucea”
  alternative: O redare explicit masculină precum „cel ce nu-și ia crucea lui”
  rationale: Greaca folosește masculinul singular generic. Româna îl poate reda exact și firesc prin „cine” și reflexivul „își”, fără a schimba numărul sau sfera universală și fără a introduce o formulare greoaie.
translation_notes:
  register: Română standard modernă, clară și demnă. S-a preferat formularea idiomatică „mă urmează”, iar explicitarea lui ὀπίσω a fost păstrată în nota [a]. Repetarea negației („nu-și ia... și nu mă urmează”) este necesară în română pentru ca ambele verbe coordonate să rămână sub incidența negației grecești.
