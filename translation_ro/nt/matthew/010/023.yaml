source:
  edition: SBLGNT
  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: ro
  text: 'Dar, ori de câte ori vă vor persecuta în cetatea aceasta, fugiți în alta.[a] Căci adevărat vă spun: nicidecum nu veți termina de străbătut cetățile lui Israel[b] până când va veni Fiul Omului.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „fugiți în cealaltă cetate”. În greacă, literal: „în cealaltă/alta”, substantivul „cetate” fiind subînțeles din propoziția anterioară.'
    reason: lexical_alternative
  - marker: b
    text: 'Literal: „nu veți termina cetățile lui Israel”. Formularea „nu veți termina de străbătut” explicitează activitatea misionară itinerantă sugerată de context.'
    reason: lexical_alternative
  - marker: c
    text: 'Expresia „până când va veni Fiul Omului” este lăsată intenționat deschisă. Interpretările diferă: poate desemna vindicarea lui Isus, o venire în judecată sau revenirea sa finală.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: ori de câte ori
  rationale: Redă valoarea temporală nedefinită, cu sens potențial sau repetat, nu doar un singur moment.
- source_word: διώκωσιν
  choice: vă vor persecuta
  rationale: În contextul trimiterii ucenicilor, verbul indică ostilitate și persecuție, nu simpla urmărire.
- source_word: πόλει ταύτῃ
  choice: cetatea aceasta
  rationale: Păstrează demonstrativul proximal și folosește termenul românesc consacrat și demn pentru πόλις în context biblic.
- source_word: φεύγετε
  choice: fugiți
  rationale: Imperativ direct și urgent, firesc în română pentru îndepărtarea din fața persecuției.
- source_word: εἰς τὴν ἑτέραν
  choice: în alta
  rationale: Substantivul «cetate» este subînțeles din propoziția precedentă; ἑτέραν indică o altă cetate, fără a impune neapărat ideea strictă de «următoarea».
- source_word: ἀμὴν
  choice: adevărat
  rationale: Redă formula solemnă prin care Isus introduce o afirmație autoritativă, într-o exprimare românească limpede.
- source_word: οὐ μὴ τελέσητε
  choice: nicidecum nu veți termina de străbătut
  rationale: «Nicidecum nu» păstrează negația grecească emfatică, iar «de străbătut» explicitează în mod moderat activitatea itinerantă implicată de complementul «cetățile».
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: cetățile lui Israel
  rationale: Redare directă a construcției genitivale, care poate desemna cetățile aparținând teritoriului sau poporului Israel.
- source_word: ἕως ἂν ἔλθῃ
  choice: până când va veni
  rationale: Păstrează limita temporală viitoare exprimată de construcția grecească.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Formularea consacrată păstrează autodesemnarea și rezonanțele ei biblice și teologice.
theological_decisions:
- issue: Referința venirii Fiului Omului
  choice: până când va veni Fiul Omului
  alternative: până la învierea și îndreptățirea lui Isus; până la o venire în judecată; până la revenirea finală
  rationale: Textul grecesc nu precizează aici referentul venirii. Formularea literală păstrează intenționat deschiderea și tensiunea escatologică, fără a introduce în traducere o schemă interpretativă anume.
translation_notes:
  register: Română standard modernă, clară și demnă. «Cetate» menține registrul biblic fără a deveni arhaic, iar construcțiile sunt suficient de naturale pentru cititorul obișnuit. Ordinea marcatorilor urmează apariția lor în text.
