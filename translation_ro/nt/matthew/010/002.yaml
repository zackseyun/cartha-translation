id: MAT.10.2
reference: Matthew 10:2
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς ⸀αὐτοῦ, Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: ro
  text: 'Iată numele celor doisprezece apostoli: primul[a], Simon, cel numit Petru, și Andrei, fratele lui; Iacov, fiul lui Zebedei, și Ioan, fratele lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „primul” poate sugera o poziție de frunte între cei doisprezece, nu doar primul loc în enumerare.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Iată
  rationale: Particula marchează o tranziție ușoară spre enumerare. În română, construcția „Iată numele...” redă firesc introducerea listei, fără a introduce o valoare temporală explicită.
- source_word: δώδεκα ἀποστόλων
  choice: celor doisprezece apostoli
  rationale: „Apostoli” este termenul consacrat și exact în contextul grupului trimis de Isus.
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: Iată numele
  rationale: Redare românească naturală a structurii demonstrative, păstrând funcția de prezentare a listei.
- source_word: πρῶτος
  choice: primul
  rationale: Redă direct poziția lui Simon la începutul enumerării, fără a afirma explicit o supremație de autoritate.
- source_word: ὁ λεγόμενος
  choice: numit
  rationale: Identifică în mod concis și natural persoana prin numele Petru.
- source_word: Πέτρος
  choice: Petru
  rationale: Se folosește forma românească tradițională și standard a numelui.
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: fratele lui
  rationale: 'În ambele apariții, expresia desemnează relația familială: Andrei este fratele lui Simon, iar Ioan este fratele lui Iacov.'
- source_word: ὁ τοῦ Ζεβεδαίου
  choice: fiul lui Zebedei
  rationale: Genitivul de identificare implică filiația, exprimată idiomatic în română.
theological_decisions:
- issue: Sensul lui πρῶτος referitor la Simon/Petru
  choice: „primul” în text, în primul rând ca poziție în enumerare
  alternative: Termenul poate sugera și întâietate sau proeminență între cei doisprezece.
  rationale: Versetul introduce o listă, iar termenul poate indica simpla ordine. Nota păstrează posibilitatea unei nuanțe de proeminență fără a transforma traducerea într-o afirmație confesională despre autoritate.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Punctuația evidențiază perechile de frați, iar formele tradiționale ale numelor biblice sunt păstrate.
source_grounding:
  english_pob_role: consult_only
