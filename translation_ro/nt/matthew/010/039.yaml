id: MAT.10.39
reference: Matthew 10:39
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: ro
  text: Cine își găsește viața o va pierde,[a] iar cine își pierde viața pentru Mine o va găsi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „sufletul” în ambele propoziții; termenul grecesc ψυχή poate însemna „viață” sau „suflet”, însă aici „viață” se potrivește mai bine contextului pierderii și găsirii propriei vieți în ucenicie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: Cine își găsește
  rationale: Articolul urmat de participiu are valoare substantivală și generică. Construcția românească „cine” redă firesc persoana reprezentativă și caracterul sentențios al afirmației.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: viața sa / își ... viața
  rationale: În contextul uceniciei și al primejduirii vieții, ψυχή desemnează în primul rând viața persoanei. Forma reflexiv-posesivă este idiomatică în română și păstrează referirea la propria viață.
- source_word: ἀπολέσει
  choice: o va pierde
  rationale: Aici ἀπόλλυμι exprimă pierderea, nu neapărat nimicirea. Alegerea păstrează contrastul deliberat dintre „a pierde” și „a găsi”.
- source_word: ὁ ἀπολέσας
  choice: cine își pierde
  rationale: Deși participiul este aorist, în această formulare general-valabilă româna cere firesc prezentul, urmat de viitorul propoziției principale.
- source_word: ἕνεκεν ἐμοῦ
  choice: pentru Mine
  rationale: Redă concis cauza sau motivația legată de devotamentul față de Isus. Majuscula este o convenție românească reverențială, fără a schimba sensul lexical.
- source_word: εὑρήσει αὐτήν
  choice: o va găsi
  rationale: Păstrează corespondența verbală cu prima apariție a lui εὑρίσκω și simetria paradoxului.
theological_decisions:
- issue: Sensul lui ψυχή în paradoxul uceniciei
  choice: viață
  alternative: suflet
  rationale: Contextul vorbește despre păstrarea ori pierderea propriei vieți din devotament față de Isus, fără a afirma aici o opoziție tehnică între trup și suflet. Varianta „suflet” rămâne posibilă datorită ariei semantice a termenului grec și este consemnată în notă.
- issue: Forța expresiei ἕνεκεν ἐμοῦ
  choice: pentru Mine
  alternative: din cauza Mea
  rationale: „Pentru Mine” păstrează atât cauza, cât și nuanța de devotament personal, fără să precizeze mai mult decât textul grec.
translation_notes:
  register: Română standard modernă, cu formulare concisă și sentențioasă. Repetițiile „viața”, „pierde” și „găsi” sunt păstrate intenționat pentru a reda paralelismul și paradoxul originalului.
