id: MAT.10.15
reference: Matthew 10:15
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: ro
  text: 'Adevărat vă spun: în ziua judecății va fi mai ușor de îndurat[a] pentru ținutul Sodomei și Gomorei[b] decât pentru orașul acela[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „mai suportabil”.
    reason: lexical_alternative
  - marker: b
    text: Sau „pentru Sodoma și Gomora”. Greaca spune literal „pentru ținutul Sodomei și Gomorei”.
    reason: lexical_alternative
  - marker: c
    text: Sau „cetatea aceea”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Adevărat
  rationale: În formula solemnă ἀμὴν λέγω ὑμῖν, „Adevărat” redă limpede forța de confirmare solemnă, fără transliterarea mai puțin transparentă „Amin”.
- source_word: λέγω ὑμῖν
  choice: vă spun
  rationale: Este o formulare românească firească și directă, fidelă sensului expresiei grecești.
- source_word: ἀνεκτότερον
  choice: mai ușor de îndurat
  rationale: Redă comparativul cu sensul de „mai suportabil” într-o exprimare naturală și clară în româna actuală.
- source_word: γῇ
  choice: ținutul
  rationale: În context, γῆ desemnează teritoriul asociat Sodomei și Gomorei, nu planeta sau pământul în sens material.
- source_word: Σοδόμων καὶ Γομόρρων
  choice: Sodomei și Gomorei
  rationale: Sunt folosite formele consacrate în română ale numelor geografice, în genitiv, dependente de „ținutul”.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: în ziua judecății
  rationale: Păstrează formularea temporală și referirea solemnă la judecata viitoare, fără a adăuga detalii doctrinare.
- source_word: πόλει
  choice: orașul
  rationale: πόλις poate desemna un oraș sau o cetate; „orașul” este termenul curent și potrivit contextului localităților vizitate de ucenici.
- source_word: ἐκείνῃ
  choice: acela
  rationale: Demonstrativul trimite la localitatea care îi respinge pe mesageri; „acela” păstrează referința fără intensificare nejustificată.
theological_decisions:
- issue: Natura „zilei judecății”
  choice: Expresia este redată ca o zi viitoare a judecății, fără precizări doctrinare suplimentare.
  alternative: O perioadă sau un timp mai general de judecată.
  rationale: Construcția grecească indică în mod firesc ziua judecății, însă traducerea nu definește mai mult decât afirmă textul.
- issue: Comparația dintre soarta Sodomei și Gomorei și cea a orașului care respinge mesagerii
  choice: Este păstrată comparația directă privind cât de suportabilă va fi judecata.
  alternative: Explicitarea unor grade sau niveluri de pedeapsă.
  rationale: Textul exprimă o comparație reală, dar traducerea nu dezvoltă un sistem doctrinar al pedepselor dincolo de această afirmație.
translation_notes:
  register: Română standard modernă, clară și demnă. Formula introductivă păstrează solemnitatea rostirii, iar vocabularul rămâne accesibil cititorului obișnuit. Marcajele notelor sunt așezate lângă expresiile pe care le explică.
