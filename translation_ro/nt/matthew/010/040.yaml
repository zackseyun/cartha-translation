id: MAT.10.40
reference: Matthew 10:40
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/040.yaml
  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: ro
  text: Cine vă primește pe voi Mă primește pe Mine[a], iar cine Mă primește pe Mine Îl primește pe Cel care M-a trimis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Mă întâmpină cu bunăvoință”; verbul grecesc poate însemna „a primi”, „a accepta” sau „a întâmpina cu bunăvoință”, mai ales cu referire la primirea unui mesager.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: Cine ... primește
  rationale: Participiul prezent articulat are valoare substantivală și generică. Construcția românească „Cine ...” redă firesc sensul de „oricine/cel care”, fără formularea mai greoaie „Cel care” repetată de trei ori.
- source_word: δέχομαι / δέχεται
  choice: primește
  rationale: Repetarea verbului este deliberată și formează un lanț între ucenici, Isus și Cel care L-a trimis. „Primește” păstrează repetiția și poate cuprinde atât găzduirea, cât și acceptarea unui mesager.
- source_word: ὑμᾶς
  choice: vă ... pe voi
  rationale: Pronumele este la persoana a doua plural și îi desemnează pe ucenici. Reluarea prin „pe voi” face pluralul explicit și creează paralelismul emfatic cu „pe Mine”.
- source_word: ἐμέ
  choice: Mă ... pe Mine
  rationale: Pronumele grecesc este forma accentuată a persoanei întâi singular. Construcția românească dublată redă accentul și este firească în paralelismul propoziției.
- source_word: τὸν ἀποστείλαντά με
  choice: Cel care M-a trimis
  rationale: Participiul aorist activ articulat este substantival. Formularea păstrează referința personală fără a introduce explicit „Tatăl”, termen absent din textul grecesc.
theological_decisions:
- issue: Identitatea Celui care L-a trimis pe Isus
  choice: Cel care M-a trimis
  alternative: Tatăl care M-a trimis
  rationale: Contextul și teologia Evangheliei după Matei indică puternic spre Tatăl, însă textul grec spune doar „Cel care M-a trimis”. Traducerea păstrează formularea și lasă implicația teologică neexplicitată, așa cum este în sursă.
translation_notes:
  register: Română standard modernă, clară și demnă. Majusculele reverențiale la pronumele care se referă la Isus și la Cel care L-a trimis urmează o convenție românească răspândită; ele nu adaugă în text identificarea explicită a Trimițătorului. Repetarea lui „primește” păstrează structura retorică a originalului.
