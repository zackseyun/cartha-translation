    issue: Lipsește o notă pentru varianta textuală privind «înviați-i pe morți».
    rationale: Aparatul SBLGNT pune «νεκροὺς ἐγείρετε» între semne care indică o lectură disputată. Traducerea trebuie să păstreze lectura tipărită, dar să informeze cititorul că unele manuscrise o omit.
  - severity: low
    issue: «Fără plată să dați» atenuează ușor imperativul final.
    rationale: δότε este un imperativ prezent direct. «Fără plată dați» păstrează concizia, paralelismul și caracterul poruncii.
