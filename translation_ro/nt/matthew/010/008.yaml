id: MAT.10.8
reference: Matthew 10:8
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: ro
  text: Vindecați-i pe bolnavi, înviați-i pe morți[b], curățați-i pe leproși[a] și alungați demonii. Fără plată ați primit; fără plată dați.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Termenul redat tradițional prin „leproși” poate desemna în uzul biblic o categorie mai largă de afecțiuni grave ale pielii, nu numai lepra în sensul medical modern.
    reason: cultural_note
  - marker: b
    text: 'Unele manuscrise omit: „înviați-i pe morți”.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀσθενοῦντας
  choice: pe bolnavi
  rationale: Participiul îi desemnează aici pe cei care suferă de boli; formularea este firească și precisă în româna actuală.
- source_word: θεραπεύετε
  choice: Vindecați-i
  rationale: În contextul lucrărilor miraculoase, verbul înseamnă „a vindeca”, nu doar „a îngriji”.
- source_word: νεκροὺς ἐγείρετε
  choice: înviați-i pe morți
  rationale: Redă direct ridicarea unor persoane din moarte și păstrează forma de poruncă.
- source_word: λεπροὺς
  choice: pe leproși
  rationale: Este echivalentul tradițional și concis, iar nota explică faptul că termenul biblic poate acoperi o categorie mai largă de afecțiuni cutanate decât lepra modernă.
- source_word: καθαρίζετε
  choice: curățați-i
  rationale: Păstrează atât dimensiunea fizică, cât și implicația de curățire rituală, fără a reduce sensul la simpla vindecare.
- source_word: δαιμόνια ἐκβάλλετε
  choice: alungați demonii
  rationale: „A alunga” exprimă limpede expulzarea demonilor și este natural în româna modernă.
- source_word: δωρεὰν
  choice: fără plată
  rationale: În acest context, adverbul indică primirea și dăruirea fără cost; repetarea păstrează paralelismul retoric grecesc.
- source_word: ἐλάβετε
  choice: ați primit
  rationale: Perfectul compus redă firesc în română acțiunea trecută a primirii.
- source_word: δότε
  choice: să dați
  rationale: Conjunctivul cu valoare imperativă este natural după construcția eliptică „fără plată” și păstrează caracterul de poruncă.
theological_decisions:
- issue: Sfera poruncilor privind minunile
  choice: Imperativele sunt redate direct ca porunci adresate celor Doisprezece în cadrul acestei misiuni.
  alternative: Interpretarea unora dintre acțiuni ca simple metafore sau exclusiv ca practici ecleziale ulterioare.
  rationale: Textul grecesc prezintă imperative concrete la plural. Traducerea le păstrează forța istorică și teologică fără a stabili aici dacă și cum se extind dincolo de contextul imediat.
translation_notes:
  register: Română standard modernă, clară și demnă. Seria de imperative este păstrată concis, iar repetiția „fără plată” reproduce accentul și echilibrul originalului.
