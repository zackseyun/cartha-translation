review_pass:
  verdict: revise
  source_fidelity: Textul redă corect cele patru imperative și paralelismul δωρεὰν … δωρεὰν. Totuși, SBLGNT marchează «νεκροὺς ἐγείρετε» ca lectură textual disputată; această incertitudine trebuie semnalată printr-o notă, fără a omite expresia din textul de bază.
  naturalness: Formularea este în general firească în româna standard modernă. Imperativul direct «dați» este mai concis și mai apropiat de forța lui δότε decât construcția «să dați».
  terminology: «Vindecați», «înviați», «curățați», «demoni» și «fără plată» sunt alegeri potrivite. «Curățați-i pe leproși» păstrează deliberat limbajul de curățire, inclusiv rezonanța sa rituală, iar nota culturală limitează anacronismul termenului «leproși».
  issues:
