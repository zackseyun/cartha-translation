lexical_decisions:
- source_word: Φίλιππος
  choice: Filip
  rationale: Forma românească consacrată a numelui personal grec.
- source_word: Βαρθολομαῖος
  choice: Bartolomeu
  rationale: Forma românească consacrată a numelui personal.
- source_word: Θωμᾶς
  choice: Toma
  rationale: Forma tradițională și curentă în română pentru numele apostolului.
- source_word: Μαθθαῖος
  choice: Matei
  rationale: Forma românească consacrată a numelui personal.
- source_word: ὁ τελώνης
  choice: vameșul
  rationale: În româna biblică și curentă, „vameș” denumește recognoscibil colectorul de taxe sau taxe vamale; articolul hotărât redă construcția greacă apozițională.
- source_word: Ἰάκωβος
  choice: Iacov
  rationale: Forma românească consacrată în listele apostolilor și corespondentul direct al numelui grec.
- source_word: ὁ τοῦ Ἁλφαίου
  choice: fiul lui Alfeu
  rationale: Genitivul de filiație este explicitat firesc în română, fără a introduce o relație absentă din context.
- source_word: Ἁλφαίου
  choice: Alfeu
  rationale: Forma românească consacrată a numelui personal.
- source_word: Θαδδαῖος
  choice: Tadeu
  rationale: Redă direct lectura SBLGNT prin forma românească uzuală; variantele manuscrise sunt păstrate în nota de subsol.
- source_word: καὶ
  choice: și
  rationale: Păstrează coordonarea simplă și structura paratactică a listei grecești.
theological_decisions:
- issue: Identitatea ultimului apostol numit în verset
  choice: Tadeu
  alternative: Lebeus; Lebeus numit Tadeu; Iuda, fiul lui Iacov
  rationale: Textul grec de bază citește Θαδδαῖος, astfel că textul principal urmează această lectură. Tradițiile manuscrise diferite și formularea listelor din Luca sunt indicate în notă, fără armonizare.
translation_notes:
  register: Română standard modernă, demnă și ușor de înțeles. Sunt folosite formele românești consacrate ale numelor apostolilor. Punctuația evidențiază perechile din lista grecească și apozițiile de identificare.
