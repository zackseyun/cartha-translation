  text: Σίμων ὁ ⸀Καναναῖος καὶ Ἰούδας ⸀ὁ Ἰσκαριώτης ὁ καὶ παραδοὺς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/004.yaml
  text: Simon the Cananaean[a], and Judas Iscariot[b], who also betrayed him.
translation:
  language: ro
  text: Simon Cananeul[a] și Iuda Iscarioteanul[b], cel care l-a și trădat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „Simon Zelotul”. În greacă apare „Cananeul”, formă care reflectă probabil o denumire aramaică sau ebraică, înțeleasă în mod tradițional cu sensul de „Zelotul”.
    reason: lexical_alternative
  - marker: b
    text: Sau „cel care l-a predat”. Verbul grecesc poate însemna „a preda” sau „a da pe mâna cuiva”, deși, în cazul lui Iuda, „a trăda” se potrivește contextului relatării.
    reason: alternative_reading
lexical_decisions:
- source_word: Καναναῖος
  choice: Cananeul
  rationale: Transliterarea păstrează forma grecească provenită dintr-o denumire aramaică/ebraică, fără a introduce direct interpretarea „Zelotul”; această interpretare tradițională este indicată în notă.
- source_word: Ἰσκαριώτης
  choice: Iscarioteanul
  rationale: Forma consacrată și ușor de recunoscut în română pentru epitetul lui Iuda.
- source_word: παραδοὺς
  choice: a trădat
  rationale: Deși verbul poate însemna în sens larg „a da pe mâna cuiva”, în contextul lui Iuda exprimă o predare prin trădare; alternativa mai neutră este păstrată în notă.
- source_word: ὁ καὶ παραδοὺς αὐτόν
  choice: cel care l-a și trădat
  rationale: Articolul urmat de participiu îl identifică pe Iuda prin acțiunea sa; construcția românească păstrează și valoarea lui καί („și”).
theological_decisions:
- issue: Redarea neutră sau moral-contextuală a participiului παραδοὺς
  choice: l-a și trădat
  alternative: l-a și dat pe mâna lor
  rationale: În lista apostolilor, Iuda este identificat prin actul său ulterior, iar „a trădat” redă firesc forța relațională și morală a contextului. Nota păstrează transparența față de sensul lexical mai larg al verbului grecesc.
translation_notes:
  register: Română standard modernă, cu formulare concisă și demnă. Numele și epitetele urmează forme biblice românești recognoscibile; notele păstrează alternativele lexicale autentice.
