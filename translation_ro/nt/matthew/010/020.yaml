id: MAT.10.20
reference: Matthew 10:20
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οὐ γὰρ ὑμεῖς ἐστε οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τοῦ πατρὸς ὑμῶν τὸ λαλοῦν ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: ro
  text: Căci nu voi sunteți cei care vorbesc, ci Duhul Tatălui vostru, care vorbește în voi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „prin voi”. Grecescul spune „în voi”, expresie care poate implica și vorbirea Duhului prin ucenici.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Căci nu
  rationale: Redă valoarea explicativă a lui γάρ și leagă firesc afirmația de asigurarea din versetul anterior.
- source_word: ὑμεῖς ἐστε οἱ λαλοῦντες
  choice: voi sunteți cei care vorbesc
  rationale: Păstrează pronumele explicit și emfatic, precum și construcția care pune accentul pe identitatea vorbitorilor.
- source_word: ἀλλὰ
  choice: ci
  rationale: După o negație, „ci” exprimă în română contrastul corect și direct.
- source_word: τὸ πνεῦμα τοῦ πατρὸς ὑμῶν
  choice: Duhul Tatălui vostru
  rationale: Redă direct relația genitivală, fără a adăuga calificativul „ceresc”, absent din verset.
- source_word: τὸ λαλοῦν
  choice: este Cel care vorbește
  rationale: Articolul și participiul neutru reiau „Duhul”; formularea românească face limpede referentul și păstrează acțiunea prezentă.
- source_word: ἐν ὑμῖν
  choice: în voi
  rationale: Păstrează sensul direct al prepoziției ἐν și nu reduce tensiunea dintre prezența lăuntrică și lucrarea exprimată prin ucenici.
theological_decisions:
- issue: Dacă ἐν ὑμῖν trebuie redat ca prezență lăuntrică („în voi”) sau ca mijlocire instrumentală („prin voi”)
  choice: în voi
  alternative: prin voi
  rationale: Textul grec spune literalmente „în voi”. Contextul poate implica faptul că Duhul vorbește prin ucenici, dar traducerea principală păstrează formularea și ambiguitatea autentică a sursei.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. Repetiția verbului „a vorbi” reflectă repetiția lui λαλέω din textul grec; majuscula din „Cel” clarifică acordul semantic cu „Duhul” în construcția românească.
