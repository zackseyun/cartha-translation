id: MAT.10.25
reference: Matthew 10:25
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the slave like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: ro
  text: Îi este de ajuns ucenicului să devină ca învățătorul său, iar sclavului să devină ca stăpânul său. Dacă pe stăpânul casei l-au numit Beelzebul[a], cu cât mai mult pe cei din casa lui!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „Beelzebub”, o formă variantă tradițională a numelui.
    reason: variantă tradițională de redare a numelui
lexical_decisions:
- source_word: ἀρκετὸν
  choice: Îi este de ajuns
  rationale: Redă construcția predicativă de suficiență într-o formulare românească firească, păstrând raportarea explicită la ucenic.
- source_word: μαθητῇ
  choice: ucenicului
  rationale: „Ucenic” păstrează sensul relațional de discipol aflat sub îndrumarea unui învățător, potrivit contextului evanghelic.
- source_word: ἵνα γένηται
  choice: să ajungă
  rationale: Construcția cu conjunctiv exprimă aici atingerea unei stări sau poziții; „să ajungă” este natural în română și nu sugerează simpla asemănare statică.
- source_word: διδάσκαλος
  choice: învățătorul
  rationale: Termenul redă rolul celui care instruiește și menține distinctă această relație de perechea sclav–stăpân.
- source_word: δοῦλος
  choice: sclavul
  rationale: În opoziția directă cu κύριος, termenul indică o relație socială de subordonare și dependență mai puternică decât ar reda „slujitor”.
- source_word: κύριος
  choice: stăpânul
  rationale: Contextul este analogia socială dintre sclav și stăpân, nu folosirea explicită a unui titlu cristologic.
- source_word: οἰκοδεσπότην
  choice: stăpânul casei
  rationale: Redă atât conducerea gospodăriei, cât și legătura lexicală cu membrii casei menționați la final.
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: Urmează forma numelui din textul grec SBLGNT; forma tradițională românească alternativă este indicată în notă.
- source_word: ἐπεκάλεσαν
  choice: l-au numit
  rationale: În context, verbul înseamnă a desemna pe cineva printr-un nume; „l-au numit” este direct și idiomatic.
- source_word: πόσῳ μᾶλλον
  choice: cu cât mai mult
  rationale: Este echivalentul românesc consacrat al argumentului a fortiori.
- source_word: οἰκιακοὺς
  choice: cei din casa lui
  rationale: Expresia îi cuprinde în mod larg pe membrii sau aparținătorii gospodăriei, fără a-i restrânge la slujitori ori rude.
theological_decisions:
- issue: Redarea lui κύριος în analogia gospodăriei
  choice: stăpânul
  alternative: Domnul
  rationale: Paralelismul imediat cu δοῦλος și continuarea prin οἰκοδεσπότης cer sensul social de stăpân; traducerea nu introduce aici un titlu cristologic pe care formularea greacă nu îl evidențiază explicit.
- issue: Redarea lui δοῦλος
  choice: sclavul
  alternative: slujitorul
  rationale: Contrastul de statut cu „stăpânul” face relevantă lipsa libertății și subordonarea proprie termenului δοῦλος; „slujitor” ar atenua această relație.
- issue: Elipsa verbală din concluzia comparației
  choice: cu cât mai mult pe cei din casa lui
  alternative: cu cât mai mult îi vor numi astfel pe cei din casa lui
  rationale: Textul grec lasă verbul neexprimat în ultima propoziție. Păstrarea elipsei evită introducerea unui timp verbal sau a expresiei „astfel”, absente din sursă, iar construcția retorică rămâne inteligibilă în română.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. Paralelismul ucenic–învățător și sclav–stăpân este păstrat, iar exclamația finală redă forța retorică a comparației. Marcajul notei este așezat după numele la care se referă.
