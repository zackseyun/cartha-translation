id: MAT.10.17
reference: Matthew 10:17
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: ro
  text: Dar păziți-vă de oameni[a], căci ei vă vor da pe mâna tribunalelor și vă vor biciui în sinagogile lor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „de bărbați”; termenul grecesc este la masculin plural, dar aici se referă generic la oameni.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέχετε
  choice: păziți-vă
  rationale: Imperativul plural exprimă avertizarea și vigilența față de un pericol; „păziți-vă” este firesc și demn în româna actuală.
- source_word: δὲ
  choice: Dar
  rationale: Marchează trecerea contrastivă ușoară de la îndrumarea anterioară la avertizare.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: de oameni
  rationale: Cu προσέχω, prepoziția indică sursa pericolului. ἄνθρωποι are aici sens generic, nu exclusiv masculin.
- source_word: παραδώσουσιν
  choice: vă vor da pe mâna
  rationale: Redă natural predarea unor persoane autorităților, fără a introduce ideea mai specifică de trădare.
- source_word: συνέδρια
  choice: tribunalelor
  rationale: Pluralul desemnează organisme locale cu funcție judiciară; „tribunale” comunică limpede rolul lor fără a le identifica nejustificat cu Sanhedrinul din Ierusalim.
- source_word: συναγωγαῖς αὐτῶν
  choice: în sinagogile lor
  rationale: Păstrează cadrul concret al sinagogilor iudaice și pronumele asociativ/posesiv.
- source_word: μαστιγώσουσιν
  choice: vă vor biciui
  rationale: Verbul denumește pedeapsa corporală prin lovire cu biciul; formularea este clară, gravă și actuală.
theological_decisions:
- issue: Redarea generică a lui ἀνθρώπων
  choice: oameni
  alternative: bărbați
  rationale: Deși substantivul grecesc este masculin plural din punct de vedere gramatical, referința este generică la persecutori umani, nu exclusiv la persoane de sex masculin.
translation_notes:
  register: Română standard modernă, cu registru demn și direct. „Păziți-vă”, „vă vor da pe mâna” și „vă vor biciui” păstrează forța avertizării, caracterul juridic al predării și gravitatea pedepsei, fără arhaisme inutile.
source_grounding:
  english_pob_role: consult_only
