id: MAT.10.16
reference: Matthew 10:16
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: ro
  text: Iată, Eu vă trimit ca pe niște oi în mijlocul lupilor. Fiți, așadar, chibzuiți ca șerpii și nevinovați ca porumbeii.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Iată
  rationale: Redă firesc formula de atragere a atenției, într-un registru biblic demn, dar încă ușor de înțeles.
- source_word: ἀποστέλλω
  choice: trimit
  rationale: Verbul românesc redă direct acțiunea însărcinării și trimiterii ucenicilor.
- source_word: ὡς πρόβατα ἐν μέσῳ λύκων
  choice: ca pe niște oi în mijlocul lupilor
  rationale: Păstrează comparația și imaginea vulnerabilității din textul grec; «ca pe» este construcția românească firească după «vă trimit».
- source_word: φρόνιμοι
  choice: chibzuiți
  rationale: Termenul indică judecată practică, prudență și discernământ; «chibzuiți» evită sensul predominant intelectual pe care l-ar putea sugera «înțelepți».
- source_word: οἱ ὄφεις
  choice: șerpii
  rationale: Echivalentul direct și natural al substantivului grec, păstrând imaginea proverbială.
- source_word: ἀκέραιοι
  choice: nevinovați
  rationale: În context moral, exprimă lipsa intenției rele și caracterul nevătămător, fără a impune ideea unei perfecțiuni absolute.
- source_word: αἱ περιστεραί
  choice: porumbeii
  rationale: Redare directă a imaginii din textul-sursă; pluralul articulat este natural în comparația generică românească.
theological_decisions:
- issue: Relația dintre prudență și nevinovăție
  choice: 'Se păstrează alăturarea fără explicații suplimentare: «chibzuiți ... și nevinovați».'
  alternative: Interpretarea explicită a prudenței ca viclenie permisă sau a nevinovăției ca naivitate.
  rationale: Textul cere simultan discernământ practic și integritate morală; traducerea nu trebuie să reducă tensiunea dintre cele două îndemnuri și nici să introducă o doctrină particulară.
translation_notes:
  register: Română standard modernă, clară și demnă. «Iată» păstrează forța introductivă a grecescului Ἰδοὺ, iar «chibzuiți» comunică prudența practică fără conotația negativă a vicleniei.
