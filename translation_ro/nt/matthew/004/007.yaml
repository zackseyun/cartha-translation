  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Πάλιν γέγραπται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/007.yaml
  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
translation:
  language: ro
  text: 'Isus i-a spus: „Din nou, este scris: «Să nu-L pui la încercare pe Domnul Dumnezeul tău.»”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, mai simplu: „Să nu-L încerci pe Domnul Dumnezeul tău.” Verbul grecesc poate însemna „a încerca” sau „a pune la încercare”.'
    reason: lexical_alternative
  - marker: b
    text: Citat din Deuteronomul 6:16. În textul grecesc, „Domnul” reflectă modul în care Septuaginta redă numele divin.
    reason: cross_reference
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Isus i-a spus
  rationale: Redă firesc în română formula simplă de introducere a vorbirii și păstrează pronumele datival care îl indică pe interlocutor.
- source_word: Πάλιν
  choice: De asemenea
  rationale: În acest context, adverbul introduce o contra-citare a Scripturii; „De asemenea” evită impresia că aceeași afirmație ar fi fost deja scrisă, păstrând totodată legătura retorică.
- source_word: γέγραπται
  choice: este scris
  rationale: Formula românească consacrată pentru citarea Scripturii redă perfectul pasiv și valabilitatea continuă a textului citat.
- source_word: Οὐκ ἐκπειράσεις
  choice: Să nu-L pui la încercare
  rationale: Viitorul grecesc are aici forță prohibitivă, iar expresia românească redă sensul de a supune pe cineva unei probe provocatoare.
- source_word: κύριον τὸν θεόν σου
  choice: pe Domnul Dumnezeul tău
  rationale: Păstrează titlul κύριος și apoziția „Dumnezeul tău” într-o formulare românească naturală, cu rezonanța citatului scripturistic.
theological_decisions:
- issue: Redarea lui κύριος într-un citat despre Dumnezeul lui Israel
  choice: Domnul
  alternative: DOMNUL
  rationale: Textul-sursă imediat este grecescul κύριον, nu tetragrama ebraică; „Domnul” traduce direct textul grec, iar legătura cu numele divin din fundalul veterotestamentar este semnalată în notă.
- issue: Nuanța verbului ἐκπειράζω
  choice: a pune la încercare
  alternative: a ispiti / a încerca
  rationale: Formularea păstrează ideea de testare provocatoare fără a restrânge sensul la ispitirea morală și fără a-l neutraliza printr-un simplu „a încerca”.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formularea „i-a spus” este naturală în narațiune, iar „este scris” păstrează registrul scripturistic. Majuscula pronumelui enclitic din „nu-L” indică referirea la Dumnezeu, conform unei convenții românești răspândite.
