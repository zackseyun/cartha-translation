base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/009.yaml
  text: And he said to him[a], “I will give you all these things, if you fall down and worship me.”
translation:
  language: ro
  text: 'Și i-a spus: „Toate acestea ți le voi da, dacă te vei arunca la pământ și mi te vei închina[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „te vei pleca înaintea mea” ori „îmi vei aduce omagiu”. Verbul grecesc poate desemna prosternarea sau aducerea unui omagiu, dar aici contextul favorizează sensul de „închinare”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ
  choice: Și i-a spus
  rationale: Păstrează legătura narativă simplă și pronumele din greacă, fără a introduce explicit numele vorbitorului sau al destinatarului.
- source_word: Ταῦτά σοι πάντα δώσω
  choice: Toate acestea ți le voi da
  rationale: Redă demonstrativul neutru plural și caracterul cuprinzător al lui πάντα într-o formulare românească firească.
- source_word: ἐὰν πεσὼν
  choice: dacă vei cădea la pământ
  rationale: Păstrează condiția și imaginea concretă a coborârii trupului înaintea actului de închinare.
- source_word: προσκυνήσῃς μοι
  choice: mi te vei închina
  rationale: În contextul ispitirii și al răspunsului din versetul următor, expresia indică închinare religioasă; construcția românească redă firesc dativul μοι.
theological_decisions:
- issue: Sensul lui προσκυνέω în cererea adresată lui Isus
  choice: mi te vei închina
  alternative: te vei pleca înaintea mea / îmi vei aduce omagiu
  rationale: Contextul confruntă această cerere cu închinarea datorată exclusiv lui Dumnezeu în versetul următor, ceea ce favorizează sensul religios, fără a ascunde gama semantică mai largă a verbului.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. Formularea „mi te vei închina” este idiomatică și păstrează gravitatea religioasă a scenei; nota conservă alternativele lexicale reale.
