source:
  edition: SBLGNT
  text: Τότε παραλαμβάνει αὐτὸν ὁ διάβολος εἰς τὴν ἁγίαν πόλιν, καὶ ⸀ἔστησεν αὐτὸν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/005.yaml
  text: Then the devil takes him into the holy city and sets him on the pinnacle of the temple[b][a],
translation:
  language: ro
  text: Atunci diavolul îl ia cu el în cetatea sfântă[a] și îl pune să stea pe streașina templului[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Adică Ierusalim.
    reason: cross_reference
  - marker: b
    text: 'Sau: „aripa templului”; termenul grec poate desemna o margine ieșită în afară sau un punct înalt al ansamblului templului.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Redă firesc adverbul temporal care introduce următoarea scenă a narațiunii.
- source_word: παραλαμβάνει
  choice: îl ia cu el
  rationale: Verbul indică luarea unei persoane împreună cu sine; prezentul istoric este păstrat pentru vivacitatea narațiunii.
- source_word: ὁ διάβολος
  choice: diavolul
  rationale: În context, termenul funcționează ca desemnare personală consacrată, nu doar cu sensul lexical general de «calomniator».
- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: în cetatea sfântă
  rationale: Păstrează mișcarea spre interior exprimată de εἰς și desemnarea onorifică din greacă, fără a înlocui în text expresia cu numele Ierusalim.
- source_word: ἔστησεν
  choice: îl așază
  rationale: 'Forma este cauzativă și tranzitivă: diavolul îl pune pe Isus să stea într-un anumit loc. Prezentul românesc se armonizează cu prezentul istoric precedent.'
- source_word: ἐπὶ τὸ πτερύγιον
  choice: pe streașina
  rationale: «Streașina» este o redare românească tradițională și inteligibilă pentru o margine sau extremitate ieșită în afară, fără a afirma categoric că era punctul absolut cel mai înalt.
- source_word: τοῦ ἱεροῦ
  choice: templului
  rationale: ἱερόν desemnează aici templul în sens larg, adică ansamblul templului, nu doar sanctuarul interior; «templului» este forma firească în textul principal.
theological_decisions:
- issue: Identificarea «cetății sfinte»
  choice: Expresia «cetatea sfântă» este păstrată în text, iar Ierusalimul este identificat în notă.
  alternative: Înlocuirea expresiei direct cu «Ierusalim».
  rationale: Textul grec folosește o desemnare onorifică, nu numele propriu; păstrarea ei evită substituirea interpretativă inutilă.
- issue: Referentul arhitectural al expresiei πτερύγιον τοῦ ἱεροῦ
  choice: «streașina templului»
  alternative: «aripa templului» sau «punctul cel mai înalt al ansamblului templului»
  rationale: Locul arhitectural exact nu poate fi stabilit cu certitudine. Redarea principală rămâne naturală și tradițională, iar nota păstrează deschisă ambiguitatea termenului grec.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. Prezentul istoric al ambelor verbe este păstrat. Pronumele referitor la Isus este scris cu literă mică, potrivit normelor obișnuite și fără a introduce o convenție confesională.
