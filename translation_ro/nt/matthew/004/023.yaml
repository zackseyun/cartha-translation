revisions:
- from: Isus străbătea toată Galileea, învățând în sinagogile lor, proclamând vestea bună[a] a Împărăției și vindecând orice boală și orice suferință în popor.
  to: Isus străbătea toată Galileea, învățând în sinagogile lor, proclamând vestea bună[a] a Împărăției și vindecând orice boală și orice neputință printre oameni.
  rationale: Revizuirea limitează sensul lui μαλακία la domeniul bolii, al slăbiciunii și al infirmității prin «neputință» și înlocuiește formularea mai puțin idiomatică «în popor» cu «printre oameni». Restul textului păstrează fidel forma imperfectivă, participiile contemporane, posesivul din «sinagogile lor», genitivul «a Împărăției» și dubla formulare distributivă din greacă.
