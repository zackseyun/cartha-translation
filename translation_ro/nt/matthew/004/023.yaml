source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: ro
  text: Isus străbătea toată Galileea, învățând în sinagogile lor, proclamând vestea bună[a] a Împărăției și vindecând orice boală și orice neputință printre oameni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Evanghelia Împărăției”.'
    reason: Alternativă lexicală tradițională pentru εὐαγγέλιον.
lexical_decisions:
- source_word: περιῆγεν
  choice: străbătea
  rationale: Imperfectul descrie o activitate itinerantă desfășurată în mod continuu; „străbătea” redă firesc atât mișcarea, cât și întinderea ei prin regiune.
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: toată Galileea
  rationale: Cu verbul de mișcare, expresia indică parcurgerea întregii regiuni; complementul direct intern al verbului românesc „a străbate” este idiomatic.
- source_word: διδάσκων
  choice: învățând
  rationale: Gerunziul redă acțiunea concomitentă cu verbul principal și este termenul românesc firesc pentru activitatea de instruire.
- source_word: συναγωγαῖς αὐτῶν
  choice: sinagogile lor
  rationale: Păstrează referința precisă la sinagogi și pronumele posesiv din greacă.
- source_word: κηρύσσων
  choice: proclamând
  rationale: Redă ideea unei vestiri publice și autorizate, fără a limita sensul la uzul ecleziastic al verbului „a predica”.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: vestea bună a Împărăției
  rationale: „Vestea bună” exprimă transparent sensul lexical al lui εὐαγγέλιον, iar genitivul este păstrat prin „a Împărăției”, fără a decide dacă indică apartenența, conținutul sau caracterizarea veștii.
- source_word: θεραπεύων
  choice: vindecând
  rationale: În context, verbul denotă vindecarea efectivă și este redat prin termenul românesc curent și cuprinzător.
- source_word: πᾶσαν νόσον
  choice: orice boală
  rationale: Păstrează construcția distributivă și desemnează afecțiunea propriu-zisă.
- source_word: πᾶσαν μαλακίαν
  choice: orice suferință
  rationale: μαλακία poate desemna slăbiciune, neputință ori boală; „suferință” păstrează al doilea termen distinct de νόσος și sună natural în româna actuală.
- source_word: ἐν τῷ λαῷ
  choice: în popor
  rationale: Redă concis sfera în care aveau loc vindecările și păstrează termenul colectiv λαός.
theological_decisions:
- issue: Redarea lui εὐαγγέλιον
  choice: vestea bună
  alternative: Evanghelia
  rationale: Alegerea comunică direct sensul lexical în limba actuală, fără a elimina termenul tradițional, menționat în nota de subsol.
- issue: Relația genitivului τῆς βασιλείας
  choice: a Împărăției
  alternative: despre Împărăție
  rationale: Forma cu genitiv păstrează ambiguitatea reală dintre vestea caracterizată de Împărăție și vestea al cărei conținut privește Împărăția.
- issue: Întinderea vindecărilor în πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: orice boală și orice suferință
  alternative: toate bolile și toate neputințele
  rationale: Repetarea lui „orice” reflectă dublul πᾶσαν și caracterul cuprinzător al afirmației, fără a adăuga o precizare doctrinară absentă din verset.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Isus” explicitează subiectul cerut de contextul românesc, deși greaca are pronumele subînțeles în verb. Majuscula din „Împărăției” semnalează referirea contextuală la Împărăția lui Dumnezeu fără a o extinde explicit în text.
