id: MAT.4.4
reference: Matthew 4:4
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Γέγραπται· Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ἄνθρωπος, ἀλλ’ ⸀ἐπὶ παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/004.yaml
  text: 'But he answered[a], “It is written: ‘Man will not live by bread alone[b], but by every word proceeding through the mouth of God.’”'
translation:
  language: ro
  text: 'Dar el a răspuns: „Este scris: «Omul[a] nu va trăi numai cu pâine, ci cu orice cuvânt care iese prin gura lui Dumnezeu[b].»”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „ființa umană”; termenul grecesc este la masculin singular, dar are aici sens reprezentativ și se referă la oameni în general.
    reason: lexical_alternative
  - marker: b
    text: Multe traduceri românești au „din gura lui Dumnezeu”. Textul grecesc spune literal „prin gura lui Dumnezeu”, păstrând imaginea fiecărui cuvânt rostit de Dumnezeu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Dar el a răspuns
  rationale: Redă firesc în româna actuală formula narativă influențată semitic, fără redundanța literală „răspunzând, a zis”.
- source_word: Γέγραπται
  choice: Este scris
  rationale: Formula consacrată pentru introducerea unui citat din Scriptură; perfectul grec sugerează un text scris care rămâne în vigoare.
- source_word: ἄρτῳ μόνῳ
  choice: numai cu pâine
  rationale: Păstrează sensul concret al lui ἄρτος și redă idiomatic în română construcția grecească, fără generalizarea interpretativă „hrană”.
- source_word: ζήσεται
  choice: va trăi
  rationale: Redare firească a viitorului grec.
- source_word: ὁ ἄνθρωπος
  choice: Omul
  rationale: În context are valoare generică și reprezentativă, referindu-se la ființa umană în general; „omul” păstrează atât forma singulară, cât și dicțiunea scripturistică firească în română.
- source_word: παντὶ ῥήματι
  choice: cu orice cuvânt
  rationale: ῥῆμα desemnează aici ceea ce rostește Dumnezeu; „orice cuvânt” este natural și păstrează caracterul distributiv al expresiei.
- source_word: ἐκπορευομένῳ
  choice: care iese
  rationale: Redă clar și natural participiul prezent, păstrând imaginea cuvântului care iese din rostirea lui Dumnezeu.
- source_word: διὰ στόματος θεοῦ
  choice: prin gura lui Dumnezeu
  rationale: Urmează sensul de bază al lui διά cu genitivul, „prin”, și păstrează imaginea concretă a rostirii divine.
theological_decisions:
- issue: Valoarea generică a expresiei ὁ ἄνθρωπος
  choice: Omul
  alternative: ființa umană / orice om
  rationale: Afirmația privește omenirea în general, nu un anumit bărbat. Forma „omul” conservă singularul reprezentativ fără să restrângă sensul la sexul masculin.
- issue: Forța formulei Γέγραπται
  choice: Este scris
  alternative: Stă scris
  rationale: Formula tradițională și neutră „Este scris” introduce citatul fără adaos interpretativ și este compatibilă cu rezultatul prezent al perfectului grec.
- issue: Imaginea din διὰ στόματος θεοῦ
  choice: prin gura lui Dumnezeu
  alternative: din gura lui Dumnezeu
  rationale: „Prin” conservă prepoziția grecească διά și imaginea cuvântului transmis prin rostirea lui Dumnezeu, chiar dacă „din gura” este formularea românească mai familiară.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formularea păstrează cadența unui citat scripturistic, evitând atât arhaismele, cât și parafraza explicativă.
