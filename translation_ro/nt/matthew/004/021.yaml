id: MAT.4.21
reference: Matthew 4:21
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: ro
  text: 'Și, mergând mai departe de acolo, a văzut alți doi frați: pe Iacov, fiul lui Zebedei, și pe Ioan, fratele lui, în barcă împreună cu tatăl lor, Zebedei, reparându-și plasele; și i-a chemat.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: mergând mai departe de acolo
  rationale: Redă participiul aorist al lui προβαίνω ca înaintare față de locul anterior și păstrează explicit adverbul de proveniență ἐκεῖθεν, într-o formulare românească firească.
- source_word: εἶδεν
  choice: a văzut
  rationale: Păstrează sensul narativ simplu al verbului ὁράω, fără intensificarea nejustificată „a observat”.
- source_word: ἄλλους δύο ἀδελφούς
  choice: alți doi frați
  rationale: Păstrează atât numărul, cât și faptul că aceștia se adaugă perechii menționate anterior.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: pe Iacov, fiul lui Zebedei
  rationale: Folosește forma românească tradițională a numelui și explicitează firesc filiația exprimată eliptic în greacă.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: pe Ioan, fratele lui
  rationale: Identifică natural în română relația lui Ioan cu Iacov; referentul pronumelui rămâne limpede din ordinea numelor.
- source_word: ἐν τῷ πλοίῳ
  choice: în barcă
  rationale: În cadrul pescuitului, πλοῖον desemnează adecvat o barcă, nu o corabie mare.
- source_word: μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν
  choice: împreună cu tatăl lor, Zebedei
  rationale: Redă explicit însoțirea exprimată prin μετά și păstrează identificarea tatălui într-o ordine idiomatică românească.
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: își dregeau mrejele
  rationale: În acest context, καταρτίζω înseamnă punerea plaselor de pescuit în stare bună. „A drege mrejele” este precis, demn și bine înrădăcinat în româna biblică, fără a fi greu de înțeles.
- source_word: ἐκάλεσεν αὐτούς
  choice: i-a chemat
  rationale: Păstrează formularea simplă și motivul chemării din Evanghelie, fără să adauge explicit „să-L urmeze”, idee furnizată de context.
theological_decisions:
- issue: Implicația uceniciei în ἐκάλεσεν
  choice: i-a chemat
  alternative: i-a chemat să-L urmeze
  rationale: Contextul indică o chemare la ucenicie, dar versetul spune doar că i-a chemat. Traducerea nu explicitează ceea ce textul-sursă lasă contextului.
- issue: Subiectul lui ἐκάλεσεν
  choice: Isus i-a chemat
  alternative: i-a chemat
  rationale: Greaca folosește un subiect verbal implicit, identificat fără ambiguitate în context ca Isus. Repetarea numelui în română evită ca propoziția nouă să pară că îl are drept subiect pe Zebedei, cel mai apropiat substantiv masculin.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. Versetul grecesc formează o singură perioadă amplă; traducerea o împarte în trei enunțuri pentru claritate, fără pierdere semantică. „Mrejele” păstrează registrul specific pescuitului, iar „își dregeau” exprimă repararea și pregătirea lor.
