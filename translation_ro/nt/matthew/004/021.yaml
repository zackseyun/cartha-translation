- from: 'Și, mergând mai departe de acolo, a văzut alți doi frați: pe Iacov, fiul lui Zebedei, și pe Ioan, fratele lui. Ei erau în barcă împreună cu tatăl lor, Zebedei, și își dregeau mrejele. Isus i-a chemat.'
  to: 'Și, mergând mai departe de acolo, a văzut alți doi frați: pe Iacov, fiul lui Zebedei, și pe Ioan, fratele lui, în barcă împreună cu tatăl lor, Zebedei, reparându-și plasele; și i-a chemat.'
  rationale: Revizuirea păstrează toate informațiile și ambiguitățile relevante ale textului grec, dar reface descrierea celor doi frați ca parte a actului de „a văzut”, asemenea construcției participiale grecești. Înlocuiește, de asemenea, formularea mai tradițională „a drege mrejele” cu termenii moderni și exacți „a repara plasele”. Nu este necesară nicio notă de subsol.
  reviewer_model: gpt-5.6-terra
