id: MAT.4.17
reference: Matthew 4:17
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ὁ Ἰησοῦς κηρύσσειν καὶ λέγειν· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: ro
  text: 'Din acel moment, Isus a început să proclame, spunând: „Pocăiți-vă, căci Împărăția[a] cerurilor s-a apropiat[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „domnia”. Termenul grecesc poate desemna atât stăpânirea regală, cât și împărăția ca domeniu.
    reason: lexical_alternative
  - marker: b
    text: Sau „a venit aproape” ori „este aproape”. Perfectul grecesc subliniază că apropierea Împărăției a avut loc și rămâne valabilă.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Din acel moment
  rationale: Marchează în mod natural un moment de cotitură în narațiune și păstrează sensul temporal al expresiei grecești.
- source_word: ἤρξατο
  choice: a început
  rationale: Redă direct și firesc începutul unei activități continue în cadrul narațiunii.
- source_word: κηρύσσειν καὶ λέγειν
  choice: să proclame, spunând
  rationale: Păstrează ideea proclamării publice, iar participiul românesc introduce firesc conținutul mesajului, fără redundanța rigidă „să proclame și să spună”.
- source_word: Μετανοεῖτε
  choice: Pocăiți-vă
  rationale: Exprimă chemarea la o schimbare hotărâtă a gândirii și a vieții, nu doar la regret sau reconsiderare intelectuală.
- source_word: ἤγγικεν
  choice: s-a apropiat
  rationale: Perfectul grecesc indică o apropiere care a avut loc și ale cărei efecte rămân valabile; perfectul compus românesc păstrează mai bine această perspectivă decât simplul „este aproape”.
- source_word: βασιλεία
  choice: Împărăția
  rationale: Este echivalentul românesc consacrat și inteligibil, capabil să cuprindă atât ideea de stăpânire regală, cât și pe cea de împărăție.
- source_word: τῶν οὐρανῶν
  choice: cerurilor
  rationale: Păstrează pluralul caracteristic formulării lui Matei și constituie în același timp expresia biblică firească în limba română.
theological_decisions:
- issue: Sensul expresiei βασιλεία τῶν οὐρανῶν
  choice: Împărăția cerurilor
  alternative: domnia cerurilor
  rationale: Formularea păstrează expresia distinctivă a lui Matei fără a decide dacă βασιλεία accentuează în primul rând domnia activă sau domeniul împărăției.
- issue: Forța imperativului Μετανοεῖτε
  choice: Pocăiți-vă
  alternative: Întoarceți-vă / Schimbați-vă gândirea și viața
  rationale: Alegerea păstrează greutatea morală și spirituală a chemării, fără a o reduce nici la o simplă emoție de regret, nici la o schimbare pur intelectuală.
- issue: Aspectul verbal al lui ἤγγικεν
  choice: s-a apropiat
  alternative: este aproape / a venit aproape
  rationale: Redarea indică faptul că apropierea s-a produs și rămâne relevantă, fără a defini în mod partizan natura sau calendarul venirii Împărăției.
translation_notes:
  register: Română literară actuală, demnă și accesibilă. „A proclama” păstrează caracterul public al vestirii, iar construcția „proclame, spunând” evită rigiditatea unei coordonări literale, fără a pierde conținutul celor două infinitive grecești.
source_grounding:
  english_pob_role: consult_only
