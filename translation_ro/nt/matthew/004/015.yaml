id: MAT.4.15
reference: Matthew 4:15
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ, ὁδὸν θαλάσσης, πέραν τοῦ Ἰορδάνου, Γαλιλαία τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/015.yaml
  text: Land of Zebulun and land of Naphtali[a], the way of the sea, beyond the Jordan, Galilee of the Gentiles—
translation:
  language: ro
  text: „Țara lui Zabulon și țara lui Neftali, calea mării, dincolo de Iordan, Galileea neamurilor[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, în sens contextual: „Galileea neevreilor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ
  choice: Țara lui Zabulon și țara lui Neftali
  rationale: Păstrează repetiția și paralelismul textului grec; formele Zabulon și Neftali sunt consacrate în uzul biblic românesc.
- source_word: ὁδὸν θαλάσσης
  choice: calea mării
  rationale: Redare formală și firească a expresiei profetice, fără a decide dacă este vorba strict despre un drum cunoscut sau, mai larg, despre ținutul asociat mării.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: dincolo de Iordan
  rationale: Păstrează idiomul geografic și nu precizează mai mult decât textul perspectiva din care este descris locul.
- source_word: Γαλιλαία τῶν ἐθνῶν
  choice: Galileea neamurilor
  rationale: Expresie românească consacrată care păstrează forma citatului din Isaia și permite atât sensul de popoare, cât și referirea contextuală la neevrei.
theological_decisions:
- issue: Sensul lui ἐθνῶν în citatul din Isaia
  choice: neamurilor
  alternative: neevreilor
  rationale: În contextul iudaic al Evangheliei, termenul îi poate indica în mod particular pe neevrei, dar lexical înseamnă și „neamuri” sau „popoare”. Textul principal păstrează formularea mai largă și tensiunea expresiei, iar nota explică sensul contextual posibil fără a-l impune.
translation_notes:
  register: Registru demn și actual, cu formulare ușor solemnă adecvată unui citat profetic. Linia rămâne deschisă prin liniuță, deoarece enunțul continuă în versetul următor.
