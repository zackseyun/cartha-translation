  yaml_path: translation/nt/matthew/004/014.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled, saying:'
translation:
  language: ro
  text: 'ca să se împlinească ceea ce a fost spus prin profetul Isaia, care spune:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ca să
  rationale: Introduce în mod firesc în română ideea de scop sau rezultat și păstrează legătura sintactică cu acțiunea precedentă.
- source_word: πληρωθῇ
  choice: să se împlinească
  rationale: Redă aoristul pasiv conjunctiv și păstrează terminologia consacrată a formulei mateene despre împlinirea Scripturii.
- source_word: τὸ ῥηθὲν
  choice: ceea ce fusese spus
  rationale: Participiul pasiv substantivizat este redat idiomatic; mai-mult-ca-perfectul românesc marchează natural anterioritatea rostirii profetice față de eveniment.
- source_word: διὰ
  choice: prin
  rationale: 'Cu genitivul și un intermediar uman, indică medierea: mesajul a fost rostit prin Isaia.'
- source_word: Ἠσαΐου
  choice: Isaia
  rationale: Forma standard românească a numelui profetului.
- source_word: τοῦ προφήτου
  choice: profetul
  rationale: Păstrează explicit rolul lui Isaia; construcția românească „prin profetul Isaia” redă firesc apoziția greacă.
- source_word: λέγοντος
  choice: 'care zice:'
  rationale: Introduce direct citatul care urmează și păstrează aspectul prezent al participiului, formulă potrivită pentru glasul încă actual al Scripturii.
theological_decisions:
- issue: Formula împlinirii în Evanghelia după Matei
  choice: „să se împlinească”
  alternative: „să se adeverească” sau „să devină realitate”
  rationale: „A împlini” păstrează motivul textual și teologic al împlinirii Scripturii, fără a explica suplimentar natura relației dintre profeție și eveniment.
- issue: Medierea profetică
  choice: „spus prin profetul Isaia”
  alternative: „spus de profetul Isaia”
  rationale: „Prin” păstrează rolul lui Isaia ca intermediar al rostirii, fără a adăuga explicit un agent divin care nu este numit în acest verset.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Formularea păstrează caracterul scripturistic al expresiei, evitând atât rigiditatea literală, cât și parafraza explicativă.
