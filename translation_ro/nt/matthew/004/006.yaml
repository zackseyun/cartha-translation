id: MAT.4.6
reference: Matthew 4:6
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: ro
  text: 'Și i-a spus: „Dacă ești Fiul lui Dumnezeu, aruncă-te jos[a], căci este scris: «El le va porunci îngerilor săi cu privire la tine» și «Te vor purta pe mâini[b], ca nu cumva să-ți lovești piciorul de vreo piatră».”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, într-o formulare mai tradițională: „azvârle-te jos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „Te vor ridica pe mâini”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: i-a spus
  rationale: Prezentul grecesc este un prezent istoric; perfectul compus redă firesc în româna narativă acțiunea trecută.
- source_word: Εἰ
  choice: Dacă
  rationale: Păstrează caracterul condițional și provocator al ispitei, fără a transforma condiția într-o afirmație explicită.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Fiul lui Dumnezeu
  rationale: În contextul Evangheliei după Matei, expresia funcționează ca titlu; articolul hotărât este cerut de exprimarea românească firească.
- source_word: βάλε σεαυτὸν κάτω
  choice: aruncă-te jos
  rationale: Redă direct imperativul, pronumele reflexiv și adverbul, într-o formulare modernă și limpede.
- source_word: γέγραπται
  choice: este scris
  rationale: Este formula românească consacrată pentru citarea Scripturii și păstrează relevanța continuă exprimată de perfectul grecesc.
- source_word: ἐντελεῖται
  choice: le va porunci
  rationale: Redă porunca autoritativă exprimată de verb, iar pronumele datival îi indică firesc pe îngeri ca destinatari.
- source_word: περὶ σοῦ
  choice: cu privire la tine
  rationale: Redă precis construcția cu περί și genitivul, fără a-i adăuga ideea explicită de beneficiu.
- source_word: ἐπὶ χειρῶν
  choice: pe mâini
  rationale: Păstrează imaginea sprijinului oferit de mâinile îngerilor și este idiomatic în română.
- source_word: ἀροῦσίν σε
  choice: Te vor purta
  rationale: În acest context, αἴρω poate însemna a ridica sau a purta; alegerea se potrivește natural cu expresia „pe mâini” și păstrează imaginea protectoare.
- source_word: μήποτε προσκόψῃς
  choice: ca nu cumva să-ți lovești
  rationale: Construcția românească exprimă prevenirea, iar verbul „a lovi” se potrivește complementului concret „piciorul”.
- source_word: πρὸς λίθον
  choice: de vreo piatră
  rationale: Prepoziția „de” este idiomatică după „a-și lovi piciorul”, iar „vreo piatră” păstrează sensul nehotărât al substantivului fără articol.
- source_word: τὸν πόδα σου
  choice: piciorul
  rationale: Păstrează singularul sursei; posesia este exprimată idiomatic prin pronumele clitic „-ți”.
theological_decisions:
- issue: Forța cristologică a expresiei „Fiul lui Dumnezeu” în provocarea ispititorului
  choice: Fiul lui Dumnezeu
  alternative: un fiu al lui Dumnezeu
  rationale: Contextul mateian indică un titlu identificabil, nu simpla apartenență la o categorie; traducerea păstrează această forță fără explicații doctrinare adăugate.
- issue: Citarea Psalmului 91 de către diavol
  choice: Citatul este redat ca parte a discursului, fără corectare sau calificare interpretativă în text
  alternative: Introducerea unei explicații care să arate că Scriptura este folosită greșit
  rationale: Versetul prezintă apelul ispititorului la Scriptură; traducerea trebuie să păstreze tensiunea narativă și să nu introducă în replică un comentariu care lipsește din sursă.
- issue: Subiectul implicit al lui ἐντελεῖται
  choice: El
  alternative: Dumnezeu
  rationale: Româna cere aici o formulare clară; pronumele îl indică pe Dumnezeu din citatul scripturistic fără a repeta explicit numele și fără a adăuga conținut.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Ghilimelele românești delimitează replica, iar ghilimelele unghiulare delimitează citatul scripturistic. Pronumele referitoare la Dumnezeu sunt scrise cu literă mică, în acord cu ortografia curentă și fără a introduce o convenție confesională.
