  text: καὶ νηστεύσας ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα ὕστερον ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/002.yaml
  text: And after fasting forty days and forty nights[a], he was hungry.
translation:
  language: ro
  text: Și, după ce a postit patruzeci de zile și patruzeci de nopți, apoi I s-a făcut foame.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νηστεύσας
  choice: după ce a postit
  rationale: Participiul aorist exprimă aici o acțiune anterioară verbului principal; formularea este firească în româna modernă și păstrează clar raportul temporal.
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: patruzeci de zile și patruzeci de nopți
  rationale: Acuzativul indică durata, redată idiomatic în română fără o prepoziție suplimentară; expresia păstrează și rezonanța biblică.
- source_word: ὕστερον
  choice: la urmă
  rationale: Adverbul marchează momentul ulterior încheierii postului. «La urmă» evită repetarea greoaie a lui «după» și păstrează explicit succesiunea temporală.
- source_word: ἐπείνασεν
  choice: I s-a făcut foame
  rationale: Expresia românească naturală redă apariția foamei sugerată de aorist, fără ton arhaic sau rigid.
- source_word: καὶ
  choice: Și
  rationale: Păstrează legătura narativă simplă cu contextul precedent, fără a adăuga o nuanță interpretativă.
theological_decisions:
- issue: Evidențierea nevoii omenești reale a lui Isus după post
  choice: I s-a făcut foame
  alternative: a flămânzit
  rationale: Formularea comunică limpede foamea reală și debutul ei după post, rămânând în limitele sensului lexical și fără a transforma versetul într-o afirmație doctrinară explicită.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Pronumele clitic referitor la Isus este scris cu majusculă potrivit uzului biblic românesc; construcția evită atât rigiditatea literalistă, cât și formulările arhaice.
