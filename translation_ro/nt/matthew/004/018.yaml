id: MAT.4.18
reference: Matthew 4:18
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Περιπατῶν δὲ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν δύο ἀδελφούς, Σίμωνα τὸν λεγόμενον Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ, βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: ro
  text: Pe când mergea de-a lungul Mării Galileei, a văzut doi frați, pe Simon, numit Petru, și pe Andrei, fratele lui, aruncând o plasă de pescuit[a] în mare, căci erau pescari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „o plasă de aruncat”; termenul grecesc se referă la o plasă aruncată în apă pentru pescuit.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περιπατῶν
  choice: Pe când mergea
  rationale: Participiul prezent exprimă o acțiune în desfășurare, contemporană cu verbul principal; construcția românească redă natural această relație temporală.
- source_word: παρὰ τὴν θάλασσαν
  choice: de-a lungul Mării
  rationale: παρά cu acuzativul indică aici deplasarea pe lângă sau de-a lungul unui reper; formularea este firească în contextul mersului.
- source_word: θάλασσαν τῆς Γαλιλαίας
  choice: Mării Galileei
  rationale: Păstrează denumirea geografică tradițională și termenul grec θάλασσα, deși întinderea de apă este geografic un lac.
- source_word: εἶδεν
  choice: a văzut
  rationale: Redare directă a aoristului narativ al verbului ὁράω.
- source_word: δύο ἀδελφούς
  choice: doi frați
  rationale: Contextul îi identifică drept doi frați de sex masculin, Simon și Andrei.
- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: pe Simon, numit Petru
  rationale: Redă concis și natural participiul pasiv λεγόμενον fără a transforma numele într-o explicație suplimentară.
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: pe Andrei, fratele lui
  rationale: Păstrează apoziția și relația explicită dintre Andrei și Simon.
- source_word: βάλλοντας
  choice: aruncând
  rationale: Participiul prezent descrie acțiunea celor doi în momentul în care Isus i-a văzut; „aruncând” redă direct gestul pescăresc.
- source_word: ἀμφίβληστρον
  choice: o plasă de pescuit
  rationale: Termenul desemnează o plasă aruncată pentru pescuit. Formularea este clară pentru cititorul modern, iar sensul mai precis este păstrat în notă.
- source_word: εἰς τὴν θάλασσαν
  choice: în mare
  rationale: εἰς indică direcția aruncării spre interiorul apei; „mare” menține coerența cu denumirea Marea Galileei.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: căci erau pescari
  rationale: „Căci” păstrează valoarea explicativă a lui γάρ, iar „pescari” redă precis ocupația celor doi bărbați.
theological_decisions: []
