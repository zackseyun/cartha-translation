  edition: SBLGNT
  text: οἱ δὲ εὐθέως ἀφέντες τὰ δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/020.yaml
  text: And they immediately left the nets and followed him.
translation:
  language: ro
  text: Ei au lăsat îndată mrejele și l-au urmat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: (nereprodus separat)
  rationale: δέ este aici un conector narativ slab. În română, succesiunea curge mai natural fără un „iar” sau „și” inițial, iar legătura cu versetul anterior rămâne clară.
- source_word: εὐθέως
  choice: îndată
  rationale: Redă promptitudinea exprimată de εὐθέως într-un registru actual, demn și firesc pentru narațiunea biblică.
- source_word: ἀφέντες
  choice: au lăsat
  rationale: Participiul aorist indică o acțiune anterioară urmării. Coordonarea verbală românească exprimă natural succesiunea, fără construcția mai rigidă „lăsând”.
- source_word: τὰ δίκτυα
  choice: mrejele
  rationale: În context pescăresc, „mrejele” este precis și natural. Articolul hotărât îl reflectă pe cel grecesc, fără adaosul interpretativ „lor”.
- source_word: ἠκολούθησαν αὐτῷ
  choice: l-au urmat
  rationale: Formularea păstrează atât sensul concret al deplasării după Isus, cât și nuanța mai largă a atașării ca ucenici.
theological_decisions:
- issue: Nuanța uceniciei în ἠκολούθησαν αὐτῷ
  choice: l-au urmat
  alternative: au mers după el
  rationale: „L-au urmat” păstrează simultan sensul narativ, fizic, și posibilul sens al uceniciei, fără să expliciteze doctrinar mai mult decât spune textul.
translation_notes:
  register: Română standard modernă, concisă și demnă. „Îndată” menține tonul biblic fără a fi arhaic, iar „mrejele” este termenul firesc în contextul pescuitului.
