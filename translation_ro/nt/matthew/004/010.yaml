source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ὕπαγε, Σατανᾶ· γέγραπται γάρ· Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/010.yaml
  text: 'Then Jesus says to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and serve him only.’”'
translation:
  language: ro
  text: 'Atunci Isus îi spune: „Pleacă, Satano! Căci este scris: «Domnului Dumnezeului tău să te închini[a] și numai lui să-i slujești[b]».”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „să te pleci înaintea Domnului Dumnezeului tău”. Verbul grecesc poate desemna, mai literal, a te pleca sau a te prosterna înaintea cuiva în semn de reverență.'
    reason: lexical_alternative
  - marker: b
    text: Verbul tradus prin „să-i slujești” poate desemna în mod specific slujirea sacră sau religioasă adusă lui Dumnezeu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Marchează succesiunea narațiunii într-o formă firească și concisă în română.
- source_word: λέγει
  choice: îi spune
  rationale: Păstrează prezentul istoric grecesc și vivacitatea relatării; pronumele redă dativul αὐτῷ.
- source_word: Ὕπαγε
  choice: Pleacă
  rationale: Imperativ ferm de îndepărtare, natural în româna actuală.
- source_word: Σατανᾶ
  choice: Satan
  rationale: Redă forma consacrată a numelui folosit aici la vocativ.
- source_word: γέγραπται
  choice: este scris
  rationale: Redă formula la perfect pasiv prin expresia românească consacrată pentru introducerea unui citat scripturistic.
- source_word: Κύριον τὸν θεόν σου
  choice: Domnului Dumnezeului tău
  rationale: Construcția românească la dativ este cerută de verbul „a se închina” și păstrează apoziția dintre „Domnul” și „Dumnezeul tău”.
- source_word: προσκυνήσεις
  choice: să te închini
  rationale: În context exprimă închinarea adusă lui Dumnezeu, păstrând totodată imaginea reverenței implicată de verb.
- source_word: αὐτῷ μόνῳ
  choice: numai lui
  rationale: Așezarea lui „numai” înaintea pronumelui evidențiază firesc în română exclusivitatea referentului.
- source_word: λατρεύσεις
  choice: să-i slujești
  rationale: Păstrează distincția față de προσκυνήσεις și poate cuprinde sensul de slujire religioasă adusă lui Dumnezeu.
theological_decisions:
- issue: Redarea distinctă a verbelor προσκυνέω și λατρεύω
  choice: „să te închini” pentru προσκυνήσεις și „să-i slujești” pentru λατρεύσεις
  alternative: Redarea ambelor prin termeni din familia lexicală a închinării sau traducerea primului prin „să te pleci înaintea”
  rationale: Greaca folosește două verbe înrudite conceptual, dar distincte. Redarea lor separată păstrează atât închinarea, cât și slujirea exclusivă datorate lui Dumnezeu, fără a reduce unul dintre sensuri la celălalt.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Prezentul istoric a fost păstrat, iar citatul scripturistic folosește o formulare solemnă, fără arhaisme inutile.
