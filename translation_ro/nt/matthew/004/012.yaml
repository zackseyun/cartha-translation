  text: Ἀκούσας ⸀δὲ ὅτι Ἰωάννης παρεδόθη ἀνεχώρησεν εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/012.yaml
  text: When he heard that John had been handed over[a], he withdrew into Galilee.
translation:
  language: ro
  text: Când a auzit că Ioan fusese predat[a], s-a retras în Galileea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, mai precis în acest context: „fusese arestat”.'
    reason: Alternativă lexicală ce explicitează sensul contextual al verbului fără a-i restrânge sensul în textul principal.
lexical_decisions:
- source_word: Ἀκούσας
  choice: Când a auzit
  rationale: Participiul aorist are aici valoare temporală față de verbul principal; formularea este firească în româna actuală și păstrează raportul dintre acțiuni.
- source_word: δὲ
  choice: redat implicit prin tranziția narativă
  rationale: Particula marchează o legătură narativă ușoară, nu un contrast puternic. În română, propoziția temporală asigură natural tranziția, fără introducerea unui „dar” sau „acum” mai apăsat decât cere contextul.
- source_word: Ἰωάννης
  choice: Ioan
  rationale: Forma consacrată în limba română pentru numele Ἰωάννης.
- source_word: παρεδόθη
  choice: fusese predat
  rationale: Pasivul lui παραδίδωμι are sensul larg de a fi dat sau predat altora. Mai-mult-ca-perfectul exprimă firesc faptul că aceasta se petrecuse înainte ca Isus să audă vestea.
- source_word: ἀνεχώρησεν
  choice: s-a retras
  rationale: Verbul poate desemna plecarea sau retragerea ca reacție la împrejurări; „s-a retras” păstrează această nuanță fără a sugera neapărat o fugă de frică.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: în Galileea
  rationale: Redă direcția exprimată de εἰς într-o formulare românească naturală.
theological_decisions:
- issue: Sensul lui παραδίδωμι cu referire la Ioan
  choice: fusese predat
  alternative: fusese arestat
  rationale: Textul principal păstrează sensul lexical mai larg și posibilele rezonanțe ale verbului în Evanghelia după Matei, fără a-l reduce la termenul tehnic pentru arestare. Nota oferă sensul contextual mai precis.
translation_notes:
  register: Română literară actuală, clară și demnă. Subiectul neexprimat al verbelor este firesc în română și este identificat din context ca Isus; nu a fost adăugat numele în verset, deoarece lipsește din formularea greacă.
