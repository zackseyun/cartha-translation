    rationale: Este inteligibilă, dar „să devină” este o redare mai directă a lui γίνομαι și evită nuanța posibilă de producere sau confecționare pe care o poate avea „a se face”.
  - severity: medium
    issue: Nota b restrânge nejustificat sensul pluralului ἄρτοι
    rationale: Afirmația „pâini sau pâini întregi, nu doar de pâine ca materie” este mai categorică decât permite textul. Pluralul poate fi redat prin „pâini”, dar româna poate folosi natural și „pâine” ca nume de masă; nota trebuie să prezinte aceasta ca alternativă de traducere, nu ca excludere semantică.
