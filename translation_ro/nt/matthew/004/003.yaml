  source_fidelity: Textul redă corect participiul de mișcare, titlul „Ispititorul”, condiția introdusă de εἰ, titlul „Fiul lui Dumnezeu”, demonstrativul și pluralul ἄρτοι. „Spune ca ... să se facă” este posibil, însă „să devină” redă mai direct γένωνται și este mai firesc în registrul standard actual.
  naturalness: Formularea este în general clară și firească. În acest context, „Spune ca pietrele acestea să devină pâini” sună mai idiomatic și mai precis decât „să se facă pâini”.
  terminology: '„Ispititorul” și „Fiul lui Dumnezeu” sunt alegeri consacrate și potrivite. Nota b actuală explică pluralul într-un mod prea restrictiv: grecescul ἄρτοι poate indica pâini/colaci individuali, dar nu impune precizarea „pâini întregi” și nu exclude pur și simplu redarea românească prin numele de masă „pâine”.'
