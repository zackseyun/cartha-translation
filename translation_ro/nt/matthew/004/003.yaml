id: MAT.4.3
reference: Matthew 4:3
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ⸂ὁ πειράζων εἶπεν αὐτῷ⸃· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ ἵνα οἱ λίθοι οὗτοι ἄρτοι γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/003.yaml
  text: And the tempter came and said to him[a], “If you are the Son of God[b], tell these stones to become bread.”
translation:
  language: ro
  text: 'Ispititorul s-a apropiat și i-a zis: „Dacă ești Fiul lui Dumnezeu[a], spune ca pietrele acestea să devină pâini[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „De vreme ce ești Fiul lui Dumnezeu.” Condiția grecească poate avea aici forța unei provocări, fără să exprime neapărat îndoială.'
    reason: alternative_reading
  - marker: b
    text: 'Greacă: „pâini”, la plural. În română, se poate reda și „pâine”, folosit adesea ca nume de masă.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: s-a apropiat
  rationale: Participiul aorist indică apropierea de Isus înaintea rostirii; formularea este firească în româna actuală și păstrează mișcarea exprimată de verb.
- source_word: ὁ πειράζων
  choice: ispititorul
  rationale: Participiul substantivizat îl desemnează pe cel care îl ispitește pe Isus; „ispititorul” este concis, consacrat și adecvat contextului.
- source_word: εἶπεν αὐτῷ
  choice: i-a zis
  rationale: Redare românească naturală și exactă a verbului λέγω urmat de pronumele la dativ.
- source_word: Εἰ
  choice: Dacă
  rationale: Păstrează forma condițională și nu hotărăște dacă vorbitorul exprimă îndoială, presupunere sau provocare.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Fiul lui Dumnezeu
  rationale: Construcția predicativă și contextul mateian indică titlul cunoscut, nu apartenența la o clasă nedefinită.
- source_word: εἰπὲ ἵνα
  choice: spune ca
  rationale: Redă porunca urmată de conținutul sau rezultatul introdus prin ἵνα, fără a întări nejustificat λέγω prin „poruncește”.
- source_word: οἱ λίθοι οὗτοι
  choice: pietrele acestea
  rationale: Păstrează substantivul și accentul demonstrativ al expresiei grecești.
- source_word: ἄρτοι
  choice: pâini
  rationale: Păstrează pluralul explicit din greacă; în română, „pâini” poate desemna în mod firesc pâini individuale.
- source_word: γένωνται
  choice: să se facă
  rationale: Redă direct și natural devenirea exprimată de γίνομαι, fără adaosul mai interpretativ „să se transforme”.
theological_decisions:
- issue: Forța propoziției condiționale Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: „Dacă ești Fiul lui Dumnezeu”
  alternative: „De vreme ce ești Fiul lui Dumnezeu” / „Dacă într-adevăr ești Fiul lui Dumnezeu”
  rationale: '„Dacă” păstrează ambiguitatea originalului: condiția poate funcționa ca provocare și nu implică neapărat o îndoială simplă.'
- issue: Titlul hristologic υἱὸς τοῦ θεοῦ
  choice: „Fiul lui Dumnezeu”
  alternative: „un fiu al lui Dumnezeu”
  rationale: Deși υἱός nu are articol în construcția predicativă, contextul îl prezintă ca pe un titlu care îl identifică pe Isus în mod unic; traducerea nu extinde însă afirmația dincolo de text.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează ordinea logică a textului grec, evită arhaismele și menține atât condiția retorică, cât și pluralul lui ἄρτοι.
