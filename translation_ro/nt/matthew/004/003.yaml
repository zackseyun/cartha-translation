  to: 'Ispititorul s-a apropiat și i-a zis: „Dacă ești Fiul lui Dumnezeu[a], spune ca pietrele acestea să devină pâini[b].”'
  rationale: Revizia păstrează ambiguitatea condiției grecești, titlul hristologic și pluralul explicit al lui ἄρτοι. Înlocuirea cu „să devină” oferă o redare mai directă și naturală a lui γένωνται. Nota despre plural este reformulată pentru a informa fără a impune o distincție semantică pe care greaca nu o cere.
