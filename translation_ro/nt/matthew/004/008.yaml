id: MAT.4.8
reference: Matthew 4:8
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Πάλιν παραλαμβάνει αὐτὸν ὁ διάβολος εἰς ὄρος ὑψηλὸν λίαν, καὶ δείκνυσιν αὐτῷ πάσας τὰς βασιλείας τοῦ κόσμου καὶ τὴν δόξαν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/008.yaml
  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: ro
  text: Din nou, diavolul Îl ia cu el pe un munte foarte înalt și Îi arată toate împărățiile lumii și gloria lor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „splendoarea lor”.'
    reason: Alternativă lexicală contextuală pentru δόξα, care aici poate desemna măreția și strălucirea împărățiilor.
lexical_decisions:
- source_word: Πάλιν
  choice: Din nou
  rationale: Marchează repetarea în succesiunea ispitelor și este o formulare firească în româna actuală.
- source_word: παραλαμβάνει
  choice: Îl ia cu el
  rationale: Redă sensul de a lua pe cineva împreună cu sine, păstrând prezentul istoric al narațiunii grecești.
- source_word: ὁ διάβολος
  choice: diavolul
  rationale: În context, termenul funcționează ca titlu consacrat pentru adversarul lui Isus; aceasta este redarea românească standard.
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: pe un munte foarte înalt
  rationale: În română, mișcarea spre un loc înalt este exprimată natural prin „pe”; „foarte” păstrează intensificarea lui λίαν.
- source_word: δείκνυσιν
  choice: Îi arată
  rationale: Redare directă și neintensificată a verbului grecesc, cu prezent istoric.
- source_word: πάσας τὰς βασιλείας
  choice: toate împărățiile
  rationale: Păstrează pluralul și sensul politic-regal al lui βασιλεία.
- source_word: τοῦ κόσμου
  choice: lumii
  rationale: Redarea naturală și suficient de largă a lui κόσμος în acest context.
- source_word: τὴν δόξαν αὐτῶν
  choice: gloria lor
  rationale: Păstrează legătura lexicală cu sensul teologic mai larg al lui δόξα, iar alternativa contextuală „splendoarea” este indicată în notă.
theological_decisions:
- issue: Natura scenei de pe munte din relatarea ispitirii
  choice: Scena este tradusă direct, așa cum este relatată, fără a preciza mecanismul prin care sunt arătate toate împărățiile.
  alternative: O panoramă geografică literală de pe un munte fizic sau o descoperire vizionară ori supranaturală.
  rationale: Textul grecesc afirmă doar că diavolul Îl ia pe Isus pe un munte foarte înalt și Îi arată împărățiile; traducerea nu trebuie să impună o explicație pe care textul nu o oferă.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Pronumele clitice referitoare la Isus sunt scrise cu majusculă conform uzului biblic românesc răspândit; prezentul istoric al grecei este păstrat pentru vivacitatea narațiunii.
