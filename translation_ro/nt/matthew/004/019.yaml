  text: καὶ λέγει αὐτοῖς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: ro
  text: 'Și le spune: „Veniți după Mine și vă voi face pescari de oameni.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: le spune
  rationale: Păstrează prezentul istoric grecesc, care este firesc și în narațiunea românească.
- source_word: Δεῦτε
  choice: Veniți
  rationale: Redă direct chemarea imperativă la plural; sensul urmării este exprimat separat prin ὀπίσω μου.
- source_word: ὀπίσω μου
  choice: după Mine
  rationale: Păstrează imaginea literală „după mine” și sensul ei de ucenicie, fără a contopi expresia cu imperativul precedent.
- source_word: ποιήσω
  choice: vă voi face
  rationale: Redă direct viitorul activ și acțiunea transformatoare promisă de Isus.
- source_word: ἁλιεῖς
  choice: pescari
  rationale: Este echivalentul românesc firesc și direct al substantivului grecesc.
- source_word: ἀνθρώπων
  choice: de oameni
  rationale: În acest context, ἄνθρωπος îi desemnează generic pe oameni; românescul „oameni” păstrează atât forma firească a expresiei, cât și sensul general.
theological_decisions:
- issue: Sensul generic al expresiei ἁλιεῖς ἀνθρώπων
  choice: pescari de oameni
  alternative: pescari de bărbați
  rationale: Deși forma grecească este gramatical masculină, ἀνθρώπων se referă aici la ființe umane în general. „De oameni” redă exact și idiomatic această întindere semantică în română, fără a restrânge chemarea la bărbați.
translation_notes:
  register: 'Română standard modernă, demnă și accesibilă. Formularea păstrează prezentul istoric și structura distinctă a chemării: „Veniți” + „după Mine”. Pronumele referitor la Isus este scris cu majusculă potrivit uzului biblic românesc tradițional, fără efect asupra sensului.'
