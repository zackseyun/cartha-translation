  text: Τότε ὁ Ἰησοῦς ἀνήχθη εἰς τὴν ἔρημον ὑπὸ τοῦ πνεύματος, πειρασθῆναι ὑπὸ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/001.yaml
  text: Then Jesus was led up into the wilderness by the Spirit to be tempted by the devil[a].
translation:
  language: ro
  text: Atunci Isus a fost dus de Duhul în pustiu ca să fie ispitit de diavol[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „ca să fie pus la încercare”; verbul grecesc poate însemna atât „a ispiti”, cât și „a pune la încercare”, deși contextul imediat favorizează aici sensul „a ispiti”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Redă firesc legătura temporală cu episodul precedent și succesiunea narațiunii.
- source_word: ἀνήχθη
  choice: a fost dus
  rationale: Păstrează diateza pasivă; în română, «dus în pustiu» este mai natural decât o redare rigidă a nuanței direcționale «dus în sus».
- source_word: εἰς τὴν ἔρημον
  choice: în pustiu
  rationale: «Pustiu» denumește natural o regiune nelocuită sau aridă, fără a preciza excesiv relieful.
- source_word: ὑπὸ τοῦ πνεύματος
  choice: de Duhul
  rationale: Contextul imediat al botezului lui Isus indică Duhul lui Dumnezeu; majuscula marchează această referință fără a adăuga adjectivul «Sfânt» absent din verset.
- source_word: πειρασθῆναι
  choice: ca să fie ispitit
  rationale: Agentul, diavolul, și episodul următor favorizează sensul «ispitit», iar sensul posibil «pus la încercare» este păstrat în notă.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: de diavol
  rationale: În context, διάβολος funcționează ca desemnare a adversarului personal; «diavol» este echivalentul românesc consacrat și clar.
theological_decisions:
- issue: Identificarea lui τοῦ πνεύματος
  choice: «Duhul» se referă la Duhul lui Dumnezeu
  alternative: un duh sau duhul omenesc
  rationale: Contextul imediat, în care Duhul coboară peste Isus la botez, susține această identificare; formularea nu adaugă «Sfânt», care lipsește aici din greacă.
- issue: Sensul lui πειρασθῆναι
  choice: «să fie ispitit»
  alternative: «să fie pus la încercare»
  rationale: Acțiunea diavolului din relatarea următoare favorizează «ispitit», dar verbul grec poate exprima și punerea la încercare; ambiguitatea este semnalată în notă.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Ordinea propoziției este naturală în română, iar formulările tradiționale inteligibile («Duhul», «pustiu», «diavol») sunt păstrate fără arhaisme.
