source:
  edition: SBLGNT
  text: ὁ λαὸς ὁ καθήμενος ἐν ⸀σκοτίᾳ ⸂φῶς εἶδεν⸃ μέγα, καὶ τοῖς καθημένοις ἐν χώρᾳ καὶ σκιᾷ θανάτου φῶς ἀνέτειλεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/016.yaml
  text: The people sitting in darkness saw a great light[a], and on those sitting in the region and shadow of death, a light dawned.
translation:
  language: ro
  text: Poporul care ședea în întuneric a văzut o lumină mare, iar peste cei ce ședeau în ținutul și în umbra morții a răsărit o lumină.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, pentru „umbra morții”: „întuneric adânc”. Totuși, greaca spune literal „în ținutul și în umbra morții” și păstrează ecoul imagistic biblic.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαὸς
  choice: poporul
  rationale: Redă firesc substantivul colectiv și păstrează forma articulată, fără a restrânge sensul la o națiune în accepțiune politică modernă.
- source_word: καθήμενος / καθημένοις
  choice: care ședea / ce ședeau
  rationale: Păstrează imaginea concretă și paralelismul participiilor grecești; „a locui” ar fi posibil, dar ar estompa ecoul profetic.
- source_word: σκοτίᾳ
  choice: întuneric
  rationale: Echivalent românesc standard, capabil să păstreze deopotrivă sensul concret și pe cel metaforic fără a le preciza excesiv.
- source_word: φῶς εἶδεν μέγα
  choice: a văzut o lumină mare
  rationale: Redă aoristul prin perfectul compus, timpul narativ firesc în româna modernă, și păstrează accentul adjectivului „mare”.
- source_word: χώρᾳ
  choice: ținutul
  rationale: Exprimă bine o zonă sau regiune și se integrează natural în registrul poetic al citatului profetic.
- source_word: σκιᾷ θανάτου
  choice: umbra morții
  rationale: Păstrează explicit θανάτου, ecoul biblic și ambiguitatea imaginii, fără a o reduce la simplul „întuneric adânc”.
- source_word: ἀνέτειλεν
  choice: a răsărit
  rationale: Păstrează metafora ivirii unui astru sau a luminii și este expresia românească firească în această construcție.
- source_word: αὐτοῖς
  choice: peste cei
  rationale: În combinație cu „a răsărit”, prepoziția „peste” exprimă idiomatic orientarea luminii către destinatari, reprezentați deja prin „cei ce ședeau”.
theological_decisions:
- issue: Natura imaginilor întunericului și luminii
  choice: Imaginile sunt păstrate fără a preciza dacă întunericul este spiritual, moral, politic ori existențial și fără a identifica explicit lumina în această propoziție.
  alternative: Redarea interpretativă a întunericului drept păcat sau necunoaștere și a luminii drept revelația mântuitoare a lui Mesia.
  rationale: Textul grecesc și ecoul profetic permit o semnificație teologică bogată, dar propoziția nu delimitează explicit imaginile; traducerea nu trebuie să rezolve această deschidere semantică.
translation_notes:
  register: Română standard modernă, cu o solemnitate moderată potrivită citatului profetic. „Ședea/ședeau” este ușor elevat, dar încă inteligibil și păstrează mai bine decât „locuia/locuiau” imaginea și paralelismul sursei. Marcajul de notă este așezat la sfârșitul versetului deoarece nota privește expresia din a doua jumătate.
