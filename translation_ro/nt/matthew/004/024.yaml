id: MAT.4.24
reference: Matthew 4:24
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: ro
  text: Vestea despre el s-a răspândit în toată Siria, iar oamenii i-au adus pe toți cei bolnavi, cuprinși de felurite boli și chinuri, pe cei aflați sub puterea demonilor[a], pe cei care aveau crize[b] și pe cei paralizați; și el i-a vindecat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „cei posedați de demoni” ori „cei demonizați”.'
    reason: lexical_alternative
  - marker: b
    text: Grecescul σεληνιαζομένους a fost redat tradițional prin „epilepticii”; mai literal, termenul se referă la oameni considerați afectați de lună.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκοὴ
  choice: vestea despre el
  rationale: În context, substantivul desemnează ceea ce se auzea despre Isus, adică vestea sau relatarea care circula, nu facultatea auzului.
- source_word: ἀπῆλθεν
  choice: s-a răspândit
  rationale: Redă firesc în română imaginea veștii care ajunge în întreaga regiune, deși verbul grecesc exprimă literal ideea de a pleca sau a ieși.
- source_word: κακῶς ἔχοντας
  choice: cei bolnavi
  rationale: Expresia idiomatică grecească îi indică pe cei care se aflau într-o stare rea din punct de vedere fizic, adică pe bolnavi.
- source_word: ποικίλαις νόσοις καὶ βασάνοις συνεχομένους
  choice: cuprinși de felurite boli și chinuri
  rationale: „Cuprinși” păstrează forța participiului συνεχομένους, iar „chinuri” redă intensitatea lui βάσανοι fără a restrânge sensul la un anumit tip de durere.
- source_word: δαιμονιζομένους
  choice: cei aflați sub puterea demonilor
  rationale: Formularea afirmă explicit realitatea acțiunii demonice, dar nu impune o distincție tehnică modernă între posedare și alte forme de dominație demonică.
- source_word: σεληνιαζομένους
  choice: cei care aveau crize
  rationale: Redă pentru cititorul modern manifestarea probabil vizată, fără a afirma că luna era cauza ei; legătura lexicală a termenului cu luna este păstrată în notă.
- source_word: παραλυτικούς
  choice: cei paralizați
  rationale: Este echivalentul românesc clar și actual pentru persoanele afectate de paralizie.
- source_word: ἐθεράπευσεν
  choice: i-a vindecat
  rationale: Verbul denotă aici vindecarea celor aduși la Isus.
theological_decisions:
- issue: Sensul și intensitatea lui δαιμονιζομένους
  choice: cei aflați sub puterea demonilor
  alternative: cei posedați de demoni; cei demonizați
  rationale: Textul nu trebuie demitologizat, dar participiul grecesc nu cere în mod neechivoc o categorie tehnică modernă mai îngustă. Varianta aleasă păstrează referirea supranaturală și ambiguitatea privind forma exactă a influenței demonice.
- issue: Redarea lui σεληνιαζομένους
  choice: cei care aveau crize
  alternative: epilepticii; cei afectați de lună
  rationale: Termenul este legat etimologic de lună și a fost redat tradițional printr-un diagnostic precum epilepsia. Textul principal comunică manifestarea recognoscibilă fără a valida o etiologie lunară și fără a impune retrospectiv un diagnostic medical exact.
translation_notes:
  register: Română standard modernă, cu un registru demn și accesibil. Enumerarea păstrează relația sintactică relativ deschisă din greacă, fără a introduce un diagnostic medical precis sau o schemă tehnică a influenței demonice.
