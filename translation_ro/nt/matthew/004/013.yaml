id: MAT.4.13
reference: Matthew 4:13
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν τὴν Ναζαρὰ ἐλθὼν κατῴκησεν εἰς Καφαρναοὺμ τὴν παραθαλασσίαν ἐν ὁρίοις Ζαβουλὼν καὶ Νεφθαλίμ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: ro
  text: Și, după ce a părăsit Nazara[a], a venit și s-a stabilit în Capernaum, lângă mare, în ținuturile lui Zabulon și Neftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'În greacă: „Nazara”; multe traduceri englezești folosesc „Nazaret”.'
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπὼν
  choice: după ce a părăsit
  rationale: Participiul aorist indică o acțiune anterioară verbului principal; formularea redă limpede succesiunea și este firească în româna modernă.
- source_word: Ναζαρὰ
  choice: Nazara
  rationale: Păstrează forma greacă specifică din acest verset, Ναζαρά, fără a o înlocui tacit cu forma mai cunoscută „Nazaret”.
- source_word: ἐλθὼν
  choice: a venit
  rationale: Participiul aorist este redat printr-un verb coordonat, pentru o succesiune clară și idiomatică în română.
- source_word: κατῴκησεν
  choice: s-a așezat
  rationale: În context, verbul exprimă stabilirea locuinței, nu doar șederea temporară.
- source_word: Καφαρναοὺμ
  choice: Capernaum
  rationale: Forma consacrată în limba română pentru acest toponim biblic.
- source_word: τὴν παραθαλασσίαν
  choice: lângă mare
  rationale: Redă descrierea Capernaumului ca localitate situată în apropierea mării, într-o formulare naturală și concisă.
- source_word: ἐν ὁρίοις
  choice: în ținuturile
  rationale: Pluralul ὅρια poate desemna teritoriile sau districtele; „ținuturile” păstrează pluralul și sensul geografic.
- source_word: Ζαβουλὼν
  choice: Zabulon
  rationale: Forma tradițională și recognoscibilă în uzul biblic românesc, apropiată de forma greacă.
- source_word: Νεφθαλίμ
  choice: Neftali
  rationale: Forma consacrată în limba română pentru numele tribal și geografic.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Sintaxa participială greacă este desfășurată natural, iar forma neobișnuită a toponimului Nazara este păstrată în text și explicată în notă.
