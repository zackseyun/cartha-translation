id: MAT.4.25
reference: Matthew 4:25
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοὶ ἀπὸ τῆς Γαλιλαίας καὶ Δεκαπόλεως καὶ Ἱεροσολύμων καὶ Ἰουδαίας καὶ πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/025.yaml
  text: And large crowds followed him from Galilee and the Decapolis and Jerusalem and Judea and beyond the Jordan[a].
translation:
  language: ro
  text: Și mulțimi mari l-au urmat din Galileea, din Decapole, din Ierusalim, din Iudeea și de dincolo de Iordan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „de pe celălalt mal al Iordanului”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: l-au urmat
  rationale: Redă natural aoristul lui ἀκολουθέω și păstrează atât sensul concret al deplasării după Isus, cât și posibila nuanță incipientă de adeziune, fără a afirma un angajament deplin.
- source_word: ὄχλοι πολλοὶ
  choice: mulțimi mari
  rationale: Formulare românească firească pentru grupuri numeroase de oameni; evită rigidul „multe mulțimi”.
- source_word: ἀπὸ
  choice: din
  rationale: Marchează proveniența mulțimilor și este reluat în română înaintea toponimelor pentru claritate și fluență.
- source_word: Γαλιλαίας
  choice: Galileea
  rationale: Forma consacrată în limba română pentru această regiune.
- source_word: Δεκαπόλεως
  choice: Decapole
  rationale: Forma românească consacrată a numelui regiunii asociate celor zece cetăți.
- source_word: Ἱεροσολύμων
  choice: Ierusalim
  rationale: Forma românească standard a numelui cetății; pluralul morfologic grecesc nu se reproduce.
- source_word: Ἰουδαίας
  choice: Iudeea
  rationale: Forma românească standard a numelui regiunii.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: de dincolo de Iordan
  rationale: În cadrul listei guvernate de ideea provenienței, formularea indică natural ținutul aflat pe cealaltă parte a Iordanului, fără a preciza în mod nejustificat orientarea geografică.
- source_word: καὶ ... καὶ ... καὶ
  choice: și ... din ... din ... și
  rationale: Coordonarea cumulativă este păstrată, iar repetarea lui „din” face lista geografică limpede și idiomatică în română.
theological_decisions: []
