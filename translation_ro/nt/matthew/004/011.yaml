source:
  edition: SBLGNT
  text: τότε ἀφίησιν αὐτὸν ὁ διάβολος, καὶ ἰδοὺ ἄγγελοι προσῆλθον καὶ διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/011.yaml
  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: ro
  text: Atunci diavolul l-a lăsat, iar iată că niște îngeri s-au apropiat și îi slujeau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „au venit și îi serveau”. Verbul grecesc redat prin „s-au apropiat” poate fi tradus și „au venit”, iar cel redat prin „îi slujeau” poate însemna și „îi serveau”; timpul imperfect sugerează o acțiune în desfășurare.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Redă firesc adverbul temporal care marchează succesiunea evenimentelor.
- source_word: ἀφίησιν αὐτὸν
  choice: l-a lăsat
  rationale: Prezentul istoric grecesc este redat prin perfectul compus, timpul narativ obișnuit în româna modernă; în context, expresia arată că diavolul s-a îndepărtat de Isus.
- source_word: ὁ διάβολος
  choice: diavolul
  rationale: În relatarea ispitirii, termenul este o desemnare personală consacrată; traducerea literală „calomniatorul” ar diminua claritatea referinței.
- source_word: ἰδοὺ
  choice: iată
  rationale: Păstrează funcția de semnal discursiv care atrage atenția asupra intervenției neașteptate a îngerilor.
- source_word: ἄγγελοι
  choice: niște îngeri
  rationale: Substantivul grecesc este nearticulat, iar contextul indică ființe cerești; „niște” oferă în română o introducere naturală a unor participanți noi fără a-i identifica mai precis.
- source_word: προσῆλθον
  choice: s-au apropiat
  rationale: Redă sensul de venire către cineva și păstrează mai explicit decât simplul „au venit” orientarea verbului grecesc.
- source_word: διηκόνουν αὐτῷ
  choice: îi slujeau
  rationale: Imperfectul românesc păstrează aspectul durativ al imperfectului grecesc, iar „a sluji” redă adecvat serviciul sau îngrijirea oferită lui Isus.
theological_decisions:
- issue: Sensul lui διάβολος ca desemnare personală
  choice: diavolul
  alternative: calomniatorul
  rationale: În acest context, cuvântul îl desemnează pe adversarul personal din relatarea ispitirii. Forma consacrată păstrează referința clară fără adaos doctrinar.
- issue: Natura slujirii îngerilor
  choice: îi slujeau
  alternative: îl serveau
  rationale: Textul nu precizează exact în ce a constat slujirea. Formularea aleasă păstrează această deschidere semantică și caracterul continuu al acțiunii.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. Pronumele referitoare la Isus nu sunt scrise cu majusculă, conform uzului gramatical neutru și pentru a evita introducerea unei convenții confesionale. Punctul și virgula separă limpede plecarea diavolului de intervenția îngerilor, fără a slăbi legătura narativă.
