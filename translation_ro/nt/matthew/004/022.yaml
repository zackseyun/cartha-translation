id: MAT.4.22
reference: Matthew 4:22
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οἱ δὲ εὐθέως ἀφέντες τὸ πλοῖον καὶ τὸν πατέρα αὐτῶν ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: ro
  text: Iar ei au lăsat îndată[a] barca și pe tatăl lor și l-au urmat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „imediat”.'
    reason: Alternativă lexicală pentru εὐθέως.
lexical_decisions:
- source_word: δὲ
  choice: Iar
  rationale: Conjuncția continuă relatarea printr-o legătură ușoară, fără a introduce un contrast puternic.
- source_word: εὐθέως
  choice: îndată
  rationale: Redă promptitudinea accentuată de termenul grecesc și păstrează un registru firesc, demn și accesibil.
- source_word: ἀφέντες
  choice: au lăsat
  rationale: Participiul aorist indică o acțiune anterioară verbului principal; coordonarea românească exprimă natural faptul că mai întâi au lăsat barca și pe tatăl lor, apoi l-au urmat.
- source_word: τὸ πλοῖον
  choice: barca
  rationale: În contextul pescuitului, „barca” este mai exact și mai firesc decât „corabia” sau „vasul”.
- source_word: τὸν πατέρα αὐτῶν
  choice: pe tatăl lor
  rationale: Construcția este idiomatică în română și păstrează explicit dimensiunea familială a răspunsului lor.
- source_word: ἠκολούθησαν αὐτῷ
  choice: l-au urmat
  rationale: Redă atât deplasarea după Isus, cât și nuanța de ucenicie, fără explicații interpretative suplimentare.
- source_word: οἱ
  choice: ei
  rationale: Articolul substantivizat îi indică pe cei doi frați menționați anterior; româna cere aici un pronume explicit pentru claritate.
theological_decisions:
- issue: Răspunsul ucenicilor și despărțirea de familie
  choice: Textul afirmă direct că au lăsat barca și pe tatăl lor pentru a-l urma pe Isus.
  alternative: „Și-au părăsit tatăl” ar putea sugera explicit o abandonare definitivă.
  rationale: Verbul ἀφίημι exprimă aici plecarea sau lăsarea în urmă, dar versetul nu precizează durata ori caracterul definitiv al despărțirii; „au lăsat” păstrează forța relatării fără a o amplifica teologic.
- issue: Majuscula reverențială pentru pronumele referitor la Isus
  choice: l-au urmat
  alternative: L-au urmat
  rationale: Greaca nu marchează o majusculă reverențială distinctivă. Forma cu literă mică urmează uzul românesc general și evită introducerea unei convenții confesionale absente din sursă.
translation_notes:
  register: Română standard modernă, cu formulare simplă și demnă. Ordinea elementelor păstrează accentul narativ asupra reacției prompte și asupra costului concret al urmării lui Isus.
