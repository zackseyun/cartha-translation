  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οὐκ ἔχει δὲ ῥίζαν ἐν ἑαυτῷ ἀλλὰ πρόσκαιρός ἐστιν, γενομένης δὲ θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον εὐθὺς σκανδαλίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/021.yaml
  text: Yet he has no root in himself[a], but is temporary. When affliction or persecution arises because of the word[b], he immediately falls away.
translation:
  language: ro
  text: Dar nu are rădăcină în sine, ci dăinuie doar o vreme. Când vine necazul sau persecuția din pricina cuvântului, se poticnește îndată.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „cade” ori „se simte ofensat”; verbul grecesc poate însemna „a se poticni”, „a cădea” sau „a se simți ofensat”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν
  choice: rădăcină
  rationale: Păstrează metafora agricolă explicită și legătura cu cadrul parabolei.
- source_word: ἐν ἑαυτῷ
  choice: în sine
  rationale: Redă firesc în română valoarea reflexivă și ideea lipsei unei rădăcini lăuntrice, fără explicații suplimentare.
- source_word: πρόσκαιρός
  choice: dăinuie doar o vreme
  rationale: Exprimă durata limitată într-o română naturală; evită formularea rigidă „este temporar”, aplicată unei persoane, fără a introduce o durată precisă.
- source_word: γενομένης ... θλίψεως ἢ διωγμοῦ
  choice: când vine necazul sau persecuția
  rationale: Redă construcția absolută la genitiv printr-o propoziție temporală firească. „Necazul” păstrează ideea de apăsare și suferință, iar „persecuția” denumește precis ostilitatea îndreptată împotriva persoanei.
- source_word: διὰ τὸν λόγον
  choice: din pricina cuvântului
  rationale: Păstrează termenul λόγος și legătura lexicală cu mesajul semănat în parabolă; „din pricina” exprimă limpede cauza.
- source_word: εὐθὺς
  choice: îndată
  rationale: Redă promptitudinea accentuată de text într-un registru biblic încă firesc și ușor de înțeles.
- source_word: σκανδαλίζεται
  choice: se poticnește
  rationale: Păstrează metafora și lărgimea semantică a verbului grec, fără a decide în mod nejustificat dacă este vorba explicit despre apostazie, ofensare sau simpla cedare sub presiune.
- source_word: δὲ
  choice: dar
  rationale: Marchează contrastul cu primirea bucuroasă a cuvântului descrisă în contextul imediat.
theological_decisions:
- issue: Sensul lui σκανδαλίζεται în contextul uceniciei și al presiunii
  choice: se poticnește
  alternative: cade; renunță; se scandalizează
  rationale: „Se poticnește” păstrează metafora verbului grec și tensiunea privind natura exactă a eșecului. Nota indică sensurile contextuale posibile fără a impune o doctrină despre apostazie.
translation_notes:
  register: Română standard modernă, cu o formulare demnă și accesibilă. „Dăinuie doar o vreme” evită caracterul nefiresc al lui „este temporar” pentru o persoană, iar „se poticnește” conservă ambiguitatea originalului. Punctuația în două enunțuri asigură cursivitate fără a rupe legătura logică.
