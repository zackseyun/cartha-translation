  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: ro
  text: Iar cel semănat între spini este cel care aude cuvântul, dar îngrijorarea veacului acestuia[a] și amăgirea bogăției[b] înăbușă cuvântul, iar el ajunge neroditor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „grija lumii acesteia”. Mai literal, greaca spune „îngrijorarea veacului acestuia”.'
    reason: alternative_reading
  - marker: b
    text: 'Sau: „înșelăciunea avuției”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: Iar cel semănat între spini
  rationale: Participiul masculin singular articulat îl desemnează pe omul reprezentat de sămânță. „Între spini” redă firesc în română imaginea lui εἰς τὰς ἀκάνθας.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: cel care aude cuvântul
  rationale: Participiul prezent este redat natural printr-o propoziție relativă, iar λόγος desemnează aici mesajul proclamat.
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: îngrijorarea veacului acestuia
  rationale: „Îngrijorarea” păstrează sensul negativ de preocupare apăsătoare al lui μέριμνα, iar „veacul acesta” redă sensul temporal și moral al lui αἰών.
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: amăgirea bogăției
  rationale: Expresia redă caracterul înșelător al bogăției fără a transforma construcția într-o afirmație mai explicită decât greaca.
- source_word: συμπνίγει
  choice: înăbușă
  rationale: Verbul păstrează metafora agricolă a spinilor care sufocă planta și o împiedică să rodească.
- source_word: ἄκαρπος γίνεται
  choice: el ajunge neroditor
  rationale: Pronumele personal păstrează trecerea din explicație la omul care aude, iar „ajunge neroditor” redă devenirea exprimată de γίνεται.
theological_decisions:
- issue: Redarea lui αἰών
  choice: veacul acesta
  alternative: lumea aceasta
  rationale: αἰών indică în primul rând o epocă sau un veac; această redare păstrează contrastul temporal și moral fără a introduce ideea lumii fizice. Alternativa uzuală este menționată în notă.
- issue: Referentul personal sau impersonal din încheiere
  choice: el ajunge neroditor
  alternative: ajunge neroditor / cuvântul ajunge neroditor
  rationale: Explicația îl identifică pe cel semănat cu omul care aude. Redarea personală evită sugestia că mesajul ar fi neroditor în sine.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. „Veacul acesta” păstrează precizia termenului grec, iar notele oferă variante românești familiare. Repetarea lui „cuvântul” urmează textul-sursă și menține claritatea imaginii.
