  yaml_path: translation/nt/matthew/013/037.yaml
  text: He answered[a], “The one who sows the good seed is the Son of Man.”
translation:
  language: ro
  text: 'El a răspuns: „Cel care seamănă sămânța bună este Fiul Omului.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: El a răspuns
  rationale: Participiul și verbul finit alcătuiesc formula idiomatică de introducere a răspunsului; redarea unitară evită calchierea greoaie „răspunzând, a zis”.
- source_word: Ὁ σπείρων
  choice: Cel care seamănă
  rationale: Păstrează valoarea substantivală și forța generică a participiului prezent, într-o formulare românească firească.
- source_word: τὸ καλὸν σπέρμα
  choice: sămânța bună
  rationale: καλός indică aici ceea ce este bun sau de calitate; singularul colectiv din greacă se păstrează natural în română.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Este desemnarea consacrată a lui Isus în Evanghelii și păstrează ecoul din Daniel 7, fără a reduce expresia la o simplă referire generică la o ființă umană.
theological_decisions:
- issue: Redarea titlului cristologic υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  alternative: Omul / Cel omenesc
  rationale: Forma consacrată păstrează atât caracterul de titlu, cât și rezonanța apocaliptică și mesianică, fără a impune o parafrază interpretativă.
translation_notes:
  register: Română standard modernă, clară și demnă. Formula de introducere a vorbirii este idiomatică, iar titlul tradițional este păstrat pentru continuitatea biblică și intertextuală.
