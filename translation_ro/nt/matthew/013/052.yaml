  text: ὁ δὲ εἶπεν αὐτοῖς· Διὰ τοῦτο πᾶς γραμματεὺς μαθητευθεὶς ⸂τῇ βασιλείᾳ⸃ τῶν οὐρανῶν ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: ro
  text: 'Iar el le-a spus: „De aceea, orice cărturar care a fost instruit pentru Împărăția cerurilor[a] este asemenea unui stăpân al casei[b], care scoate din comoara sa[c] lucruri noi și vechi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „care a devenit ucenic al Împărăției cerurilor”. Participiul grecesc poate avea atât sensul de a fi făcut ucenic, cât și pe cel de a fi instruit ori pregătit.'
    reason: alternative_reading
  - marker: b
    text: 'Sau: „cap al gospodăriei” ori „gospodar”.'
    reason: lexical_alternative
  - marker: c
    text: 'Termenul grecesc poate desemna atât o comoară, cât și locul în care sunt păstrate bunuri de preț: o vistierie sau o cămară.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: De aceea
  rationale: Redă firesc în română legătura de concluzie cu dialogul precedent.
- source_word: πᾶς γραμματεὺς
  choice: orice cărturar
  rationale: „Cărturar” este echivalentul românesc consacrat și păstrează referirea directă la un cunoscător și învățător al Scripturilor, fără a restrânge sensul la o funcție juridică.
- source_word: μαθητευθεὶς
  choice: care a fost instruit
  rationale: Păstrează forma pasivă și ideea formării, într-o exprimare românească naturală; sensul posibil de „făcut ucenic” este consemnat în notă.
- source_word: τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: pentru Împărăția cerurilor
  rationale: Păstrează orientarea sau raportarea exprimată de dativul neobișnuit, fără a decide că acesta înseamnă strict apartenență ori localizare.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: unui stăpân al casei
  rationale: Redă rolul de autoritate și administrare al lui οἰκοδεσπότης într-o formulare clară pentru cititorul modern.
- source_word: ἐκβάλλει
  choice: scoate
  rationale: În contextul bunurilor păstrate, verbul înseamnă a scoate sau a aduce afară, nu a izgoni.
- source_word: ἐκ τοῦ θησαυροῦ αὐτοῦ
  choice: din vistieria sa
  rationale: „Vistierie” păstrează atât ideea unui loc de păstrare, cât și asocierea cu bunuri de preț.
- source_word: καινὰ καὶ παλαιά
  choice: lucruri noi și vechi
  rationale: Adjectivele neutre substantivizate sunt redate explicit prin „lucruri”, păstrând ordinea și contrastul grecesc.
theological_decisions:
- issue: Sensul lui μαθητευθεὶς în raport cu cărturarul și Împărăția
  choice: Un cărturar instruit pentru Împărăția cerurilor
  alternative: Un cărturar care a devenit ucenic al Împărăției cerurilor
  rationale: Participiul poate descrie atât instruirea, cât și devenirea ca ucenic. Textul principal păstrează ideea formării, iar nota menține deschis sensul explicit al uceniciei, fără a reduce expresia la convertire sau la pregătire academică.
- issue: Identitatea lui οἰκοδεσπότης
  choice: stăpân al casei
  alternative: cap al gospodăriei / gospodar
  rationale: Alegerea păstrează autoritatea și responsabilitatea administrativă din metaforă, fără a introduce concluzii sociale sau doctrinare suplimentare.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formularea păstrează ritmul comparativ al rostirii lui Isus și termenul mateian consacrat „Împărăția cerurilor”, evitând atât arhaismele inutile, cât și parafraza doctrinară.
