id: MAT.13.42
reference: Matthew 13:42
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: ro
  text: și îi vor arunca în cuptorul de foc. Acolo va fi plânsul și scrâșnirea dinților.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαλοῦσιν
  choice: vor arunca
  rationale: Redă firesc viitorul activ al lui βάλλω și păstrează ideea unei aruncări forțate.
- source_word: κάμινον τοῦ πυρός
  choice: cuptorul de foc
  rationale: Păstrează construcția genitivală și imaginea concretă din greacă; formularea este clară și consacrată în română.
- source_word: ἐκεῖ
  choice: Acolo
  rationale: Redă direct valoarea locativă, trimițând la locul tocmai menționat.
- source_word: κλαυθμός
  choice: plânsul
  rationale: Este echivalentul românesc firesc și tradițional al substantivului, fără a-i intensifica nejustificat sensul prin «jelirea».
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: scrâșnirea dinților
  rationale: Redă idiomatic și exact expresia greacă, fără a preciza dacă gestul exprimă numai durere sau numai mânie.
- source_word: καὶ
  choice: și
  rationale: Păstrează legătura simplă cu afirmația precedentă.
- source_word: αὐτούς
  choice: îi
  rationale: Pronumele clitic acuzativ plural este forma naturală în română și trimite la grupul menționat anterior.
theological_decisions:
- issue: Natura imaginii judecății din «cuptorul de foc»
  choice: Este păstrată metafora concretă a judecății, fără atenuare sau precizare doctrinară suplimentară.
  alternative: Parafrazarea prin «focul iadului» sau amplificarea prin «cuptorul cu foc mistuitor».
  rationale: Textul grecesc oferă o imagine vie, nu un termen doctrinar explicativ; traducerea trebuie să conserve imaginea și tensiunea ei.
- issue: Sensul expresiei «plânsul și scrâșnirea dinților»
  choice: Este păstrată formula mateiană ca expresie a suferinței și judecății.
  alternative: Interpretarea scrâșnirii exclusiv ca mânie sau a întregii expresii exclusiv ca tristețe.
  rationale: Expresia poate cuprinde o suferință complexă; traducerea nu îi restrânge sensul la o singură stare afectivă.
translation_notes:
  register: Română standard modernă, clară și demnă. Ordinea «Acolo va fi...» urmează accentul locativ al grecescului ἐκεῖ, iar articolul hotărât din «plânsul» și «scrâșnirea» reflectă formula nominală definită din textul-sursă.
