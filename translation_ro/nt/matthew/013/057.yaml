  terminology: „Profet” și „lipsit de onoare” sunt potrivite. Nota despre οἰκία trebuie să mențină ambiguitatea dintre clădire și cercul domestic, fără a introduce „respingerea” ca echivalent lexical direct al expresiei grecești.
