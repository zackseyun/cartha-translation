  text: καὶ ἐσκανδαλίζοντο ἐν αὐτῷ. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ ⸀πατρίδι καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
translation:
  language: ro
  text: 'Și se simțeau ofensați de el.[a] Dar Isus le-a zis: „Un profet nu este lipsit de onoare decât în locul său natal[b] și în propria lui casă[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „se poticneau de el”; literal: „se poticneau în el”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „în patria sa” ori „în ținutul său natal”.'
    reason: lexical_alternative
  - marker: c
    text: 'Sau: „în propria lui familie”. Termenul grecesc poate desemna casa sau cei din casa lui, adică familia ori cercul domestic.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: se poticneau din cauza lui
  rationale: Păstrează metafora greacă a poticnirii, inteligibilă și în româna biblică actuală, iar nota indică sensul contextual de ofensare sau respingere.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Dar Isus le-a zis
  rationale: „Dar” redă contrastul ușor marcat de δέ între reacția lor și răspunsul lui Isus.
- source_word: προφήτης
  choice: profet
  rationale: Echivalentul românesc standard, direct și ușor de recunoscut.
- source_word: ἄτιμος
  choice: lipsit de onoare
  rationale: Păstrează formularea proverbială și dimensiunea de onoare/dezonoare a adjectivului grec.
- source_word: εἰ μὴ
  choice: decât
  rationale: În construcția negativă românească „nu... decât”, redă firesc excepția exprimată de εἰ μή.
- source_word: πατρίδι
  choice: locul său natal
  rationale: În context desemnează locul de origine, aici Nazaretul, fără a restrânge nejustificat sensul la oraș și fără a-l extinde la întreaga patrie.
- source_word: οἰκίᾳ αὐτοῦ
  choice: propria lui casă
  rationale: Redă direct οἰκία și păstrează ambiguitatea dintre casă, familie și cercul gospodăriei printr-o notă.
theological_decisions:
- issue: Sfera proverbului lui Isus despre lipsa de onoare
  choice: Formulare generală despre un profet care nu este lipsit de onoare decât în mediul său natal și domestic
  alternative: Parafrază care accentuează în mod explicit necredința familiei lui Isus
  rationale: Greaca prezintă un proverb aplicat situației imediate; traducerea păstrează tema respingerii locale și familiale fără a adăuga o afirmație doctrinară mai amplă.
translation_notes:
  register: Română standard modernă, cu ton demn și proverbial. Metafora „se poticneau” conservă expresia sursă, iar notele clarifică sensurile contextuale și ambiguitatea termenilor πατρίς și οἰκία.
