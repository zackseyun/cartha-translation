id: MAT.13.39
reference: Matthew 13:39
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ ἐχθρὸς ὁ σπείρας αὐτά ἐστιν ὁ διάβολος· ὁ δὲ θερισμὸς συντέλεια ⸀αἰῶνός ἐστιν, οἱ δὲ θερισταὶ ἄγγελοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: ro
  text: Iar dușmanul care le-a semănat este diavolul; secerișul este sfârșitul veacului[a], iar secerătorii sunt îngerii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „încheierea veacului”; tradițional, „sfârșitul lumii”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχθρὸς
  choice: dușmanul
  rationale: Redă direct opoziția personală din explicarea pildei și este termenul firesc în româna actuală.
- source_word: ὁ σπείρας
  choice: care le-a semănat
  rationale: Participiul aorist îl identifică pe dușman prin acțiunea sa încheiată; „a semănat” păstrează exact imaginea agricolă.
- source_word: αὐτά
  choice: le
  rationale: Pronumele reia buruienile/neghina semănate anterior; forma neaccentuată este cea mai firească în română.
- source_word: διάβολος
  choice: diavolul
  rationale: În context este o desemnare personală consacrată, nu o simplă descriere etimologică precum „calomniatorul”.
- source_word: θερισμὸς
  choice: secerișul
  rationale: Termen românesc limpede care păstrează metafora agricolă și desemnează atât strângerea recoltei, cât și vremea ei.
- source_word: συντέλεια αἰῶνός
  choice: sfârșitul veacului
  rationale: „Veac” păstrează sensul temporal al lui αἰών, fără a sugera în mod necesar distrugerea lumii materiale; „sfârșitul” este natural, iar nota păstrează nuanța de culminare a lui συντέλεια.
- source_word: θερισταὶ
  choice: secerătorii
  rationale: Denumirea firească a celor care seceră, menținând legătura lexicală cu „secerișul”.
- source_word: ἄγγελοί
  choice: îngerii
  rationale: Contextul escatologic indică ființe cerești, nu mesageri omenești.
- source_word: δὲ
  choice: iar / punctuație
  rationale: Repetiția particulei structurează explicația; „iar” și punctuația redau progresia natural, fără un contrast mai puternic decât cere greaca.
theological_decisions:
- issue: Redarea expresiei escatologice συντέλεια αἰῶνός
  choice: sfârșitul veacului
  alternative: încheierea veacului; sfârșitul lumii
  rationale: Alegerea păstrează referința temporală a lui αἰών și evită să introducă ideea mai specifică a nimicirii cosmosului. Varianta „încheierea veacului” conservă mai explicit nuanța de culminare, iar tradiționalul „sfârșitul lumii” este mai puțin precis.
translation_notes:
  register: 'Română standard modernă, clară și demnă. Coordonarea prin „iar” păstrează ritmul explicativ al versetului, iar vocabularul agricol rămâne consecvent: „a semănat”, „secerișul”, „secerătorii”.'
