  text: ὑμῶν δὲ μακάριοι οἱ ὀφθαλμοὶ ὅτι βλέπουσιν, καὶ τὰ ὦτα ὑμῶν ὅτι ⸀ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/016.yaml
  text: But blessed are your eyes[a], because they see, and your ears, because they hear.
translation:
  language: ro
  text: Dar ferice de ochii voștri, fiindcă văd, și de urechile voastre, fiindcă aud.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „că văd ... că aud”. Conjuncția grecească poate fi redată în ambele moduri aici.'
    reason: alternativă lexicală
lexical_decisions:
- source_word: δὲ
  choice: Dar
  rationale: Redă contrastul cu cei care privesc fără să vadă și aud fără să înțeleagă din contextul anterior.
- source_word: μακάριοι
  choice: fericiți
  rationale: Este formularea românească firească în contexte de tipul fericirilor și exprimă o stare privilegiată, nu doar o emoție trecătoare.
- source_word: οἱ ὀφθαλμοὶ ὑμῶν
  choice: ochii voștri
  rationale: Păstrează posesivul și accentul pus asupra ochilor ucenicilor, într-o ordine naturală în română.
- source_word: ὅτι βλέπουσιν
  choice: pentru că văd
  rationale: Interpretează ὅτι în sens cauzal, ca motiv pentru care ochii sunt numiți fericiți.
- source_word: τὰ ὦτα ὑμῶν
  choice: urechile voastre
  rationale: Redare românească naturală, paralelă cu «ochii voștri».
- source_word: ὅτι ἀκούουσιν
  choice: pentru că aud
  rationale: Păstrează valoarea cauzală probabilă a lui ὅτι și paralelismul construcției.
- source_word: βλέπουσιν / ἀκούουσιν
  choice: văd / aud
  rationale: Păstrează verbele senzoriale simple și lasă contextului implicația spirituală, fără a introduce explicit «înțeleg».
theological_decisions:
- issue: Dacă vederea și auzirea trebuie explicitate ca percepție spirituală
  choice: Se păstrează limbajul senzorial literal «văd» și «aud».
  alternative: «înțeleg» sau «pricep»
  rationale: Versetul folosește verbe obișnuite pentru vedere și auzire; sensul spiritual rezultă din context și nu trebuie introdus interpretativ în text.
- issue: Valoarea lui ὅτι în cele două propoziții
  choice: 'Cauzală: «pentru că»'
  alternative: 'Explicativă/declarativă: «că»'
  rationale: Lectura cauzală exprimă firesc motivul fericirii, dar greaca permite și redarea prin «că», de aceea alternativa este consemnată în notă.
translation_notes:
  register: Română standard modernă, clară și demnă. Paralelismul dintre ochi/văd și urechi/aud este păstrat, precum și contrastul inițial marcat prin «Dar».
