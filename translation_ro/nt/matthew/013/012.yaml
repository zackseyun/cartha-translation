id: MAT.13.12
reference: Matthew 13:12
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: ro
  text: Căci celui care are i se va da și va avea din belșug; dar celui care nu are i se va lua chiar și ceea ce are.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις
  choice: celui care
  rationale: Pronumele relativ nehotărât formulează un principiu general. Construcția românească „celui care” se potrivește firesc cu dativul din propoziția principală și păstrează forma reprezentativă la singular.
- source_word: γὰρ
  choice: Căci
  rationale: Introduce explicația afirmației precedente și păstrează limpede legătura argumentativă.
- source_word: ἔχει
  choice: are
  rationale: Redare directă a verbului de posesie; complementul rămâne neexprimat, ca în greacă.
- source_word: δοθήσεται αὐτῷ
  choice: i se va da
  rationale: Păstrează viitorul pasiv și dativul beneficiarului fără a adăuga explicit „mai mult”, absent din textul grecesc.
- source_word: περισσευθήσεται
  choice: va avea din belșug
  rationale: Exprimă în româna curentă rezultatul de abundență al verbului περισσεύω, fără formularea nefirească „va abunda” aplicată unei persoane.
- source_word: δὲ
  choice: dar
  rationale: Redă contrastul clar dintre cele două părți ale enunțului.
- source_word: οὐκ ἔχει
  choice: nu are
  rationale: Redare simplă și directă a posesiei negate.
- source_word: καὶ
  choice: chiar și
  rationale: Are aici valoare ascensivă și accentuează paradoxul pierderii a ceea ce persoana pare să aibă.
- source_word: ὃ ἔχει
  choice: ceea ce are
  rationale: Redă natural pronumele relativ neutru și păstrează nedefinit obiectul posedat.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: i se va lua
  rationale: Construcția românească redă firesc viitorul pasiv și ideea îndepărtării unui lucru de la persoana respectivă.
theological_decisions:
- issue: Complementul implicit al verbului „a avea” și al expresiei „i se va da”
  choice: Complementul rămâne neexprimat.
  alternative: Precizarea lui drept înțelegere, receptivitate sau cunoaștere a tainelor Împărăției.
  rationale: Contextul poate orienta sensul spre receptivitatea față de învățătura lui Isus, însă greaca nu exprimă complementul. Formularea păstrează deschiderea și tensiunea proverbului.
- issue: Forma generică la masculin singular
  choice: „celui care” la masculin singular, cu valoare reprezentativă
  alternative: O reformulare la plural sau prin „persoanei care”.
  rationale: Textul-sursă folosește singularul masculin generic. Româna poate păstra natural această formă fără a-i restrânge referința la bărbați.
- issue: Adaosul interpretativ „mai mult”
  choice: Nu a fost introdus în text.
  alternative: „i se va da mai mult”
  rationale: Ideea sporirii este sugerată de verbul următor, însă „mai mult” nu apare explicit în greacă. „I se va da și va avea din belșug” păstrează atât forma sursei, cât și sensul rezultatului.
translation_notes:
  register: Română standard modernă, demnă și ușor de înțeles. Sintaxa este proverbială și concisă; „va avea din belșug” evită atât arhaismul, cât și o formulare rigid literală.
