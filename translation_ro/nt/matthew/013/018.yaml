  text: Ὑμεῖς οὖν ἀκούσατε τὴν παραβολὴν τοῦ ⸀σπείραντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/018.yaml
  text: You[a], then, hear the parable of the one who sowed.
translation:
  language: ro
  text: Voi, așadar, ascultați pilda celui care a semănat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „pilda semănătorului”.'
    reason: Alternativă idiomatică pentru participiul articulat τοῦ σπείραντος, care poate fi redat substantival.
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Voi
  rationale: Pronumele este exprimat explicit și are valoare emfatică; redarea lui prin „Voi” păstrează contrastul cu cei despre care s-a vorbit anterior.
- source_word: οὖν
  choice: așadar
  rationale: Marchează legătura de concluzie sau tranziție cu explicația precedentă; „așadar” este firesc și demn în româna actuală.
- source_word: ἀκούσατε
  choice: ascultați
  rationale: Este un imperativ aorist activ, persoana a doua plural. „Ascultați” redă chemarea la atenție fără a introduce sensul mai interpretativ „înțelegeți”.
- source_word: παραβολὴν
  choice: pilda
  rationale: „Pildă” este termenul românesc consacrat și accesibil pentru παραβολή în acest context de învățătură narativă.
- source_word: τοῦ σπείραντος
  choice: celui care a semănat
  rationale: Redă direct participiul aorist articulat și aspectul acțiunii trecute, fără a-l transforma în mod necesar într-un titlu fix, „semănătorul”.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu ton clar și demn. Ordinea „Voi, așadar” păstrează accentul pronumelui grecesc, iar imperativul plural se adresează direct ucenicilor.
