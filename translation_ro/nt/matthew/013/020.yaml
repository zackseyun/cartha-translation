id: MAT.13.20
reference: Matthew 13:20
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ εὐθὺς μετὰ χαρᾶς λαμβάνων αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/020.yaml
  text: As for the one sown on the rocky ground[a], this is the one who hears the word and immediately receives it with joy,
translation:
  language: ro
  text: Iar cel semănat pe pământul pietros[a], acesta este cel care aude cuvântul și îl primește îndată cu bucurie,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, mai literal: „cel semănat în locurile stâncoase”.'
    reason: Alternativă lexicală ce reflectă mai formal pluralul substantivizat τὰ πετρώδη.
lexical_decisions:
- source_word: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς
  choice: Iar cel semănat pe pământul pietros
  rationale: Redă construcția participială substantivizată și păstrează metafora comprimată, în care ceea ce este semănat este apoi identificat cu persoana care aude. „Iar” marchează firesc tranziția ușoară exprimată de δέ.
- source_word: πετρώδη
  choice: pământul pietros
  rationale: Exprimă idiomatic terenul cu strat pietros și păstrează imaginea agricolă; formularea mai literală este indicată în nota de subsol.
- source_word: σπαρείς
  choice: semănat
  rationale: Păstrează concis participiul aorist pasiv și imaginea semănării, fără a explicita interpretativ agentul.
- source_word: οὗτός ἐστιν
  choice: acesta este
  rationale: Păstrează identificarea directă din greacă, fără parafraza interpretativă „îl reprezintă pe”.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: cel care aude cuvântul
  rationale: Transformă participiul prezent într-o propoziție relativă firească în română și păstrează termenul tematic „cuvântul”, fără a-l parafraza drept „mesajul”.
- source_word: εὐθὺς
  choice: îndată
  rationale: Echivalent românesc actual și demn, care păstrează accentul asupra reacției rapide.
- source_word: μετὰ χαρᾶς
  choice: cu bucurie
  rationale: Redă natural construcția prepozițională și păstrează substantivul χαρά.
- source_word: λαμβάνων αὐτόν
  choice: îl primește
  rationale: În acest context, λαμβάνω are sensul de a primi sau accepta; pronumele masculin românesc reia firesc „cuvântul”.
theological_decisions:
- issue: Referentul celui semănat în explicarea parabolei
  choice: Metafora este redată prin „cel semănat pe pământul pietros”, iar propoziția următoare îl identifică drept persoana care aude.
  alternative: „Sămânța semănată pe pământ pietros îl reprezintă pe cel care...”
  rationale: Greaca păstrează deliberat formularea comprimată, vorbind despre „cel semănat” și identificându-l apoi cu ascultătorul. Traducerea nu rezolvă această tensiune printr-o parafrază explicativă.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează structura și ambiguitatea metaforică a textului grec, folosind totodată expresii firești pentru cititorul obișnuit.
