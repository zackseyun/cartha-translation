- source_word: ὁ σπείρων
  choice: semănătorul
  rationale: Redă participiul substantivizat prin denumirea firească a celui care seamănă.
- source_word: τοῦ σπείρειν
  choice: să semene
  rationale: Infinitivul genitival exprimă scopul ieșirii; construcția românească redă direct acest sens.
