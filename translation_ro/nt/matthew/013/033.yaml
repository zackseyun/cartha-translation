source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἐνέκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: ro
  text: 'Le-a spus o altă pildă: „Împărăția cerurilor este asemenea aluatului dospit[a] pe care o femeie l-a luat și l-a ascuns[b] în trei măsuri[c] de făină, până când s-a dospit totul.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „drojdie”. Termenul grecesc desemnează un agent de dospire.
    reason: lexical_alternative
  - marker: b
    text: Sau „l-a amestecat” ori „l-a încorporat”; în greacă, literal, „l-a ascuns”.
    reason: lexical_alternative
  - marker: c
    text: În greacă, „trei sea de făină”, o cantitate mare.
    reason: cultural_note
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς
  choice: Le-a spus o altă pildă
  rationale: Redă firesc introducerea narativă și păstrează sensul aditiv al lui ἄλλην.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Împărăția cerurilor
  rationale: Formulare consacrată și exactă în română pentru expresia specifică lui Matei; pluralul grecesc este păstrat natural.
- source_word: ζύμῃ
  choice: aluatului dospit
  rationale: În româna curentă, „aluat dospit” denumește limpede o porție de aluat fermentat folosită pentru dospirea unei cantități mai mari și evită asocierea exclusiv modernă a lui „drojdie” cu produsul comercial.
- source_word: ἐνέκρυψεν εἰς
  choice: l-a ascuns în
  rationale: Păstrează sensul lexical pregnant al verbului, fără a-l reduce interpretativ la simplul act de amestecare.
- source_word: ἀλεύρου σάτα τρία
  choice: trei măsuri de făină
  rationale: Este inteligibil pentru cititorul modern, iar unitatea antică exactă este explicată în notă.
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: până când s-a dospit totul
  rationale: Păstrează pasivul și totalitatea exprimată prin ὅλον, fără a adăuga explicit un substantiv precum „plămădeala”.
theological_decisions:
- issue: Conotația lui ζύμη în pilda despre împărăție
  choice: Imaginea este redată neutru prin „aluat dospit”.
  alternative: Folosirea lui „drojdie” sau formularea textului astfel încât imaginea să capete explicit o valoare pozitivă ori negativă.
  rationale: Textul compară împărăția cu acțiunea ascunsă și cuprinzătoare a agentului de dospire, dar nu cere ca traducerea să soluționeze disputele privind valoarea simbolică a aluatului dospit în alte contexte.
- issue: Forța metaforică a lui ἐνέκρυψεν
  choice: Se păstrează literal „l-a ascuns”.
  alternative: „l-a amestecat” sau „l-a încorporat”.
  rationale: Redarea literală conservă caracterul ascuns sugerat de greacă; alternativele explică acțiunea culinară, dar slăbesc această nuanță.
translation_notes:
  register: Română standard modernă, cu un registru demn și accesibil. „Pildă” și „Împărăția cerurilor” păstrează vocabularul biblic familiar fără construcții arhaice. Ordinea notelor urmează apariția markerilor în text.
