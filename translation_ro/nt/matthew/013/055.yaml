  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός; ⸀οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ οἱ ἀδελφοὶ αὐτοῦ Ἰάκωβος καὶ ⸀Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
translation:
  language: ro
  text: Nu este acesta fiul tâmplarului? Nu se numește mama lui Maria? Iar frații lui[a] nu sunt Iacov, Iosif[b], Simon și Iuda?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „rude” pentru „frații lui”; cuvântul grecesc înseamnă de obicei „frați”, dar unii îl înțeleg aici într-un sens familial mai larg.
    reason: lexical_alternative
  - marker: b
    text: Unele manuscrise au „Ioses” în loc de „Iosif”.
    reason: textual_variant
lexical_decisions:
- source_word: τέκτονος
  choice: tâmplarului
  rationale: τέκτων desemnează un meșteșugar care lucra mai ales în lemn sau în construcții; „tâmplar” este redarea românească tradițională și firească aici.
- source_word: υἱός
  choice: fiul
  rationale: Contextul familial cere sensul direct de fiu.
- source_word: λέγεται
  choice: se numește
  rationale: Pasivul prezent are aici sensul idiomatic „este numită/se numește”; forma reflexivă este naturală în româna actuală.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Este forma consacrată în română a numelui Μαριάμ.
- source_word: ἀδελφοὶ
  choice: frații
  rationale: Sensul lexical obișnuit este „frați”; această redare păstrează textul de suprafață fără să tranșeze disputa privind relația familială exactă.
- source_word: Ἰάκωβος
  choice: Iacov
  rationale: Forma românească biblică standard pentru Ἰάκωβος.
- source_word: Ἰωσὴφ
  choice: Iosif
  rationale: Redă lectura SBLGNT Ἰωσήφ; varianta textuală Ἰωσῆς este menționată în notă.
- source_word: Σίμων
  choice: Simon
  rationale: Transliterarea românească standard a numelui.
- source_word: Ἰούδας
  choice: Iuda
  rationale: Forma românească biblică standard pentru numele grec Ἰούδας.
- source_word: οὐχ ... ;
  choice: Nu este...? Nu se numește...? ...nu sunt...?
  rationale: Particula introduce întrebări retorice care așteaptă confirmare; formularea românească păstrează caracterul lor retoric și rămâne naturală.
theological_decisions:
- issue: Sensul expresiei ἀδελφοὶ αὐτοῦ în raport cu familia lui Isus
  choice: „frații lui” în textul principal
  alternative: „rudele lui” sau „cei din neamul lui”
  rationale: „Frați” este sensul obișnuit al termenului grec. Nota recunoaște posibilitatea unei folosiri familiale mai largi, fără a impune o concluzie doctrinară despre relația biologică exactă.
translation_notes:
  register: Română standard modernă, clară și demnă. Ordinea ultimei întrebări a fost ușor adaptată pentru fluență, păstrând toate elementele și forța retorică a grecei. Marcajele notelor sunt așezate imediat după elementele relevante.
