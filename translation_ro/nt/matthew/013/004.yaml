source:
  edition: SBLGNT
  text: καὶ ἐν τῷ σπείρειν αὐτὸν ἃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ⸂ἐλθόντα τὰ πετεινὰ⸃ κατέφαγεν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/004.yaml
  text: And as he was sowing[a], some seeds fell beside the path, and the birds came and devoured them.
translation:
  language: ro
  text: Și, în timp ce semăna[a], unele semințe au căzut lângă drum; păsările au venit și le-au devorat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'În greacă, literal: „unele lucruri au căzut lângă drum”; „semințe” este completat din contextul semănătorului.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: în timp ce semăna
  rationale: Construcția ἐν cu infinitivul articulat exprimă simultaneitatea. Redarea este firească în româna actuală și păstrează sensul temporal.
- source_word: ἃ μὲν
  choice: unele semințe
  rationale: Pronumele relativ neutru plural înseamnă literal „unele lucruri”, iar substantivul „semințe” este subînțeles din contextul semănătorului. Completarea face referința clară în română.
- source_word: ἔπεσεν
  choice: au căzut
  rationale: Aoristul indicativ este redat firesc prin perfectul compus în narațiunea românească; pluralul este cerut de „unele semințe”.
- source_word: παρὰ τὴν ὁδόν
  choice: lângă drum
  rationale: παρά cu acuzativul indică aici locul de alături. „Lângă drum” este natural și evită formulări arhaice.
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: păsările au venit
  rationale: Participiul aorist circumstanțial este redat idiomatic printr-un verb finit care exprimă succesiunea. πετεινά înseamnă aici „păsările”; nu se adaugă „cerului”, absent din text.
- source_word: κατέφαγεν
  choice: au devorat
  rationale: Verbul κατεσθίω exprimă consumarea completă sau vorace. „Au devorat” păstrează intensitatea și este inteligibil în româna modernă.
- source_word: αὐτά
  choice: le
  rationale: Pronumele se referă la semințele căzute; forma neaccentuată „le” este suficientă și firească în română.
theological_decisions: []
