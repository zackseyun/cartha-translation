source:
  edition: SBLGNT
  text: οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ αἰῶνος· ἐξελεύσονται οἱ ἄγγελοι καὶ ἀφοριοῦσιν τοὺς πονηροὺς ἐκ μέσου τῶν δικαίων
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/049.yaml
  text: 'So it will be at the end of the age: the angels will go out and separate the wicked from among the righteous,[a]'
translation:
  language: ro
  text: 'Așa va fi la încheierea veacului: îngerii vor ieși și îi vor despărți pe cei răi din mijlocul celor drepți.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „la împlinirea veacului”. În mod tradițional, expresia a fost redată uneori prin „la sfârșitul lumii”, dar aici termenul grecesc αἰών se referă la „veac”, nu direct la lumea fizică.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως ἔσται
  choice: Așa va fi
  rationale: Redă firesc în română valoarea concluzivă și viitoare a expresiei, legând explicația de imaginea parabolei.
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: la încheierea veacului
  rationale: „Încheierea” exprimă ideea de ducere la capăt, iar „veacul” redă αἰών fără a-l confunda cu lumea fizică.
- source_word: ἐξελεύσονται οἱ ἄγγελοι
  choice: îngerii vor ieși
  rationale: Ordinea este naturală în română, iar în contextul judecății finale ἄγγελοι desemnează ființe cerești.
- source_word: ἀφοριοῦσιν
  choice: îi vor despărți
  rationale: Verbul indică separarea unor persoane dintr-un grup amestecat; pronumele anticipativ este idiomatic în română.
- source_word: τοὺς πονηροὺς
  choice: pe cei răi
  rationale: Adjectivul substantivizat desemnează persoane rele și este redat clar, fără o formulare arhaică.
- source_word: ἐκ μέσου τῶν δικαίων
  choice: din mijlocul celor drepți
  rationale: Păstrează imaginea scoaterii celor răi dintr-un grup în care se află cei drepți.
theological_decisions:
- issue: Sensul lui αἰών în formula escatologică
  choice: veacului
  alternative: lumii
  rationale: αἰών denumește aici veacul sau ordinea prezentă, nu în mod direct lumea fizică; traducerea evită să introducă ideea distrugerii cosmosului.
- issue: Identitatea lui οἱ ἄγγελοι
  choice: îngerii cerești
  alternative: mesagerii
  rationale: Contextul explicației despre judecata finală indică îngeri, nu mesageri umani.
translation_notes:
  register: Română standard modernă, clară și demnă. „Veac” păstrează distincția lexicală necesară față de „lume”, iar „la încheierea veacului” este inteligibil și evită atât arhaizarea excesivă, cât și parafraza interpretativă.
