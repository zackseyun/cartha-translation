  text: Τότε οἱ δίκαιοι ἐκλάμψουσιν ὡς ὁ ἥλιος ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν. ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/043.yaml
  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: ro
  text: Atunci cei drepți vor străluci[a] ca soarele în Împărăția Tatălui lor. Cine are urechi să audă.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „vor străluci intens” sau „vor străluci cu putere”.'
    reason: lexical_alternative
  - marker: b
    text: 'În greacă, chemarea este formulată la singular și are valoare generică: fiecare persoană care are urechi este chemată să ia aminte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Redă firesc adverbul temporal și leagă afirmația de desfășurarea escatologică descrisă anterior.
- source_word: οἱ δίκαιοι
  choice: cei drepți
  rationale: Echivalent românesc consacrat și clar pentru adjectivul substantivizat, fără a restrânge sensul la o singură dimensiune morală sau juridică.
- source_word: ἐκλάμψουσιν
  choice: vor străluci
  rationale: Redă viitorul lui ἐκλάμπω într-o formulare românească naturală; ideea intensă de strălucire este susținută și de comparația cu soarele.
- source_word: ὡς ὁ ἥλιος
  choice: ca soarele
  rationale: Formularea românească directă și idiomatică păstrează comparația.
- source_word: ἐν τῇ βασιλείᾳ
  choice: în Împărăția
  rationale: Contextul și construcția locativă favorizează «Împărăția», care păstrează și asocierea cu stăpânirea regală.
- source_word: τοῦ πατρὸς αὐτῶν
  choice: Tatălui lor
  rationale: Urmează îndeaproape genitivul grecesc, fără adaosul «ceresc», absent din verset.
- source_word: ὁ ἔχων ὦτα
  choice: Cine are urechi
  rationale: Este o formulare românească naturală cu valoare generică, păstrând construcția reprezentativă la singular.
- source_word: ἀκουέτω
  choice: să audă
  rationale: Redă imperativul de persoana a treia și păstrează jocul semantic dintre existența urechilor și auzirea care implică luare-aminte.
theological_decisions:
- issue: Caracterul reprezentativ al chemării finale
  choice: «Cine are urechi să audă!»
  alternative: «Cel ce are urechi să audă!»
  rationale: «Cine» funcționează la singular și generic în română, incluzând firesc orice ascultător fără a altera forța chemării grecești. Alternativa este mai literală, dar mai rigidă.
- issue: Sensul lui βασιλεία în context
  choice: «Împărăția»
  alternative: «domnia»
  rationale: Prepoziția ἐν și imaginea celor drepți care strălucesc în ea favorizează aici aspectul de domeniu escatologic, fără a exclude sensul de domnie regală.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Majuscula din «Împărăția» urmează uzul biblic românesc pentru Împărăția lui Dumnezeu; exclamația finală redă caracterul solemn și insistent al îndemnului.
