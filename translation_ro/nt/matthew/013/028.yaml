  text: ὁ δὲ ἔφη αὐτοῖς· Ἐχθρὸς ἄνθρωπος τοῦτο ἐποίησεν. οἱ δὲ ⸂δοῦλοι αὐτῷ λέγουσιν⸃· Θέλεις οὖν ἀπελθόντες ⸀συλλέξωμεν αὐτά;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the slaves said to him, “Do you want us to go and gather them up?”
translation:
  language: ro
  text: 'Le-a zis: „Un dușman a făcut aceasta.” Atunci sclavii[a] i-au zis: „Vrei, așadar, să ne ducem și să le adunăm?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „slujitorii”. Termenul grecesc poate desemna sclavi ori slujitori, în funcție de context.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: le-a zis
  rationale: Redă direct și firesc verbul de vorbire la aorist, păstrând destinatarul exprimat prin αὐτοῖς.
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: Un dușman
  rationale: În româna actuală, formularea exprimă idiomatic sensul sintagmei; ἄνθρωπος individualizează adversarul, fără a cere calchierea nenaturală „un om dușman”.
- source_word: τοῦτο ἐποίησεν
  choice: a făcut aceasta
  rationale: Perfectul compus este timpul narativ românesc firesc pentru aorist, iar „aceasta” păstrează referința demonstrativului.
- source_word: δοῦλοι
  choice: sclavii
  rationale: Termenul redă transparent statutul de dependență și subordonare față de stăpân; alternativa tradițională „slujitorii” este indicată în notă.
- source_word: λέγουσιν
  choice: îi spun
  rationale: Prezentul istoric al sursei este păstrat pentru vivacitatea schimbului de replici.
- source_word: Θέλεις
  choice: Vrei
  rationale: Este echivalentul românesc curent și direct pentru exprimarea voinței.
- source_word: οὖν
  choice: deci
  rationale: Marchează concluzia practică trasă de sclavi din explicația stăpânului.
- source_word: ἀπελθόντες
  choice: să mergem
  rationale: Participiul este redat natural ca verb coordonat, subordonat semantic întrebării introduse prin „Vrei”.
- source_word: συλλέξωμεν
  choice: să le strângem
  rationale: „A strânge” păstrează ideea de adunare fără a introduce prematur sensul specific de smulgere, exprimat distinct în versetul următor.
- source_word: αὐτά
  choice: le
  rationale: Pronumele plural păstrează numărul formei grecești și trimite la plantele nedorite menționate în context.
theological_decisions:
- issue: Redarea lui δοῦλοι în cadrul parabolei
  choice: sclavii
  alternative: slujitorii
  rationale: „Sclavii” păstrează realitatea socială ierarhică a termenului grec, fără a transforma relația într-una de simplă angajare. Deoarece „slujitorii” este o redare românească tradițională și posibilă contextual, aceasta este consemnată în notă.
translation_notes:
  register: Română standard modernă, clară și demnă. Dialogul este formulat firesc, iar prezentul istoric din λέγουσιν este păstrat. Nu s-a folosit „să le smulgem”, deoarece verbul sursă înseamnă aici „a strânge/aduna”, iar smulgerea este exprimată distinct în versetul următor.
