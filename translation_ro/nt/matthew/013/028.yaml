revisions:
- from: 'El le-a zis: „Un dușman a făcut aceasta.” Iar sclavii[a] lui îi spun: „Vrei, deci, să mergem și să le strângem?”'
  to: 'Le-a zis: „Un dușman a făcut aceasta.” Atunci sclavii[a] i-au zis: „Vrei, așadar, să ne ducem și să le adunăm?”'
  rationale: Revizuirea elimină posesivul necerut și construcția greoaie „sclavii lui îi spun”, păstrând în același timp sensul dialogului. „Atunci” și „așadar” redau funcția discursivă a lui οὖν, iar „să ne ducem și să le adunăm” păstrează succesiunea participiu plus conjunctiv fără a introduce interpretarea „să le smulgem”.
