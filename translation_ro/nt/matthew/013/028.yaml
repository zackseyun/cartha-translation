    text: Sau „slujitorii”. Termenul grecesc poate desemna sclavi ori slujitori, în funcție de context.
    reason: lexical_alternative
  revision_rationale: Revizuirea elimină posesivul necerut și construcția greoaie „sclavii lui îi spun”, păstrând în același timp sensul dialogului. „Atunci” și „așadar” redau funcția discursivă a lui οὖν, iar „să ne ducem și să le adunăm” păstrează succesiunea participiu plus conjunctiv fără a introduce interpretarea „să le smulgem”.
