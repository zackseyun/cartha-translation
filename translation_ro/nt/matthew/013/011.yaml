id: MAT.13.11
reference: Matthew 13:11
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
translation:
  language: ro
  text: 'El le-a răspuns: „Pentru că vouă v-a fost dat[b] să cunoașteți tainele[a] Împărăției cerurilor, dar lor nu le-a fost dat.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „secretele”.
    reason: lexical_alternative
  - marker: b
    text: Formularea pasivă „v-a fost dat” nu îl numește pe cel care dă; în context, agentul poate fi înțeles ca Dumnezeu.
    reason: implicit_divine_agent
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: le-a răspuns
  rationale: Construcția cu participiu și verb finit este un idiom grecesc influențat semitic; în româna actuală, „le-a răspuns” redă firesc sensul fără redundanța rigidă „răspunzând, a zis”.
- source_word: Ὅτι
  choice: Pentru că
  rationale: În context, introduce explicația dată de Isus cu privire la motivul vorbirii sale; „Pentru că” păstrează explicit valoarea explicativ-cauzală posibilă a lui ὅτι.
- source_word: ὑμῖν δέδοται
  choice: vouă v-a fost dat
  rationale: Păstrează accentul contrastiv asupra destinatarilor și perfectul pasiv, exprimând o stare prezentă rezultată dintr-un dar anterior fără a numi agentul implicit.
- source_word: γνῶναι
  choice: să cunoașteți
  rationale: Redă sensul de bază al lui γινώσκω și evită restrângerea interpretativă la simpla înțelegere intelectuală.
- source_word: τὰ μυστήρια
  choice: tainele
  rationale: „Tainele” este o formulare românească demnă și inteligibilă pentru realități divine ascunse și apoi descoperite; evită atât ideea de enigme insolubile, cât și tonul prea cotidian al lui „secretele”.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: Împărăției cerurilor
  rationale: Redă expresia caracteristică lui Matei, păstrând pluralul substantivului οὐρανῶν într-o formulare românească consacrată și naturală.
- source_word: ἐκείνοις δὲ οὐ δέδοται
  choice: dar lor nu le-a fost dat
  rationale: Păstrează contrastul dintre cele două grupuri și paralelismul pasiv al celor două propoziții, fără adaosul interpretativ „acelor oameni”.
theological_decisions:
- issue: Agentul divin implicit al pasivului δέδοται
  choice: Păstrarea pasivului „v-a fost dat / nu le-a fost dat”, fără numirea lui Dumnezeu
  alternative: „Dumnezeu v-a dat / nu le-a dat”
  rationale: Textul grec lasă agentul neexprimat. Chiar dacă Dumnezeu este agentul subînțeles cel mai probabil, formularea pasivă păstrează discreția și tensiunea teologică a sursei.
- issue: Sensul lui μυστήρια în contextul Împărăției
  choice: „tainele”
  alternative: „secretele” sau „adevărurile ascunse”
  rationale: „Tainele” păstrează categoria biblică a realităților divine ascunse și revelate, fără a o reduce la informații secrete și fără a introduce o explicație în text.
- issue: Forța lui ὅτι la începutul răspunsului
  choice: „Pentru că”
  alternative: Omiterea conectorului sau redarea prin „că”
  rationale: În contextul întrebării din versetul anterior, formularea este explicativă. „Pentru că” păstrează această legătură discursivă fără a modifica fondul răspunsului.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Ordinea „vouă v-a fost dat” păstrează accentul contrastiv al grecei, iar „lor nu le-a fost dat” menține echilibrul retoric. Marcajele notelor sunt așezate lângă expresiile pe care le explică.
