source:
  edition: SBLGNT
  text: ⸀Ἐν τῇ ἡμέρᾳ ἐκείνῃ ἐξελθὼν ὁ Ἰησοῦς ⸀τῆς οἰκίας ἐκάθητο παρὰ τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/001.yaml
  text: On that day Jesus went out of the house and sat beside the sea[a][b].
translation:
  language: ro
  text: În ziua aceea, Isus a ieșit din casă și ședea lângă mare[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „În aceeași zi”, dacă expresia este înțeleasă ca subliniind continuitatea cu relatarea anterioară, nu doar ca reper temporal.
    reason: alternative_reading
  - marker: b
    text: Sau „în apropierea mării”. Expresia grecească indică un loc aproape de mare, fără să precizeze distanța exactă față de țărm.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: În ziua aceea
  rationale: Redă firesc expresia temporală grecească, fără a introduce explicit ideea de „aceeași”, deși contextul poate sugera continuitatea.
- source_word: ἐξελθὼν ... τῆς οἰκίας
  choice: a ieșit din casă
  rationale: Participiul aorist și genitivul locului părăsit sunt redate printr-un verb finit coordonat, construcție naturală în româna modernă.
- source_word: ἐκάθητο
  choice: S-a așezat
  rationale: Redarea este firească în succesiunea narativă și păstrează ideea poziției șezânde; imperfectul grecesc prezintă totodată scena în desfășurare, nu doar actul inițial.
- source_word: παρὰ τὴν θάλασσαν
  choice: lângă mare
  rationale: παρά cu acuzativul indică aici o poziție în apropierea mării, fără a preciza exact distanța față de țărm.
- source_word: ὁ Ἰησοῦς
  choice: Isus
  rationale: Numele propriu este transliterat în forma românească modernă adoptată de proiect.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu formulare clară și demnă. Majuscula din pronumele reflexiv „S-a” urmează convenția reverențială a proiectului; construcția evită atât rigiditatea participială, cât și termenul mai livresc „a ședea”.
