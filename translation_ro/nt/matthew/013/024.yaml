id: MAT.13.24
reference: Matthew 13:24
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ ⸀σπείραντι καλὸν σπέρμα ἐν τῷ ἀγρῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/024.yaml
  text: He set another parable before them[a], saying, “The kingdom of heaven is like a man who sowed good seed in his field.”
translation:
  language: ro
  text: 'Le-a pus înainte o altă pildă, spunând: „Împărăția cerurilor se aseamănă cu un om care a semănat sămânță bună în ogorul lui.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄλλην παραβολὴν
  choice: o altă pildă
  rationale: Introduce încă o pildă în succesiune; „o altă pildă” este formularea românească firească.
- source_word: παρέθηκεν αὐτοῖς
  choice: le-a pus înainte
  rationale: Păstrează metafora concretă a verbului παρατίθημι și exprimă prezentarea învățăturii.
- source_word: λέγων
  choice: spunând
  rationale: Redă participiul și leagă natural introducerea de vorbirea directă.
- source_word: Ὡμοιώθη
  choice: se aseamănă cu
  rationale: În formula introductivă a pildei, forma pasivă aoristă are sens comparativ; această redare este naturală și nu sugerează impropriu că împărăția ar fi suferit o transformare.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Împărăția cerurilor
  rationale: Redare consacrată și exactă a expresiei caracteristice lui Matei, păstrând pluralul grecesc într-o formulare românească firească.
- source_word: ἀνθρώπῳ
  choice: un om
  rationale: Substantivul masculin singular desemnează aici personajul masculin al pildei.
- source_word: σπείραντι
  choice: care a semănat
  rationale: Transformă firesc participiul aorist într-o propoziție relativă și păstrează acțiunea încheiată.
- source_word: καλὸν σπέρμα
  choice: sămânță bună
  rationale: Exprimă buna calitate a seminței și pregătește contrastul cu neghina din context.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: în ogorul lui
  rationale: „Ogor” redă clar terenul cultivat, iar posesivul se referă natural la omul din pildă.
theological_decisions:
- issue: Redarea formulei mateene despre împărăție
  choice: Împărăția cerurilor
  alternative: Împărăția cerului
  rationale: Pluralul „cerurilor” păstrează forma caracteristică a expresiei lui Matei și este idiomatic în registrul biblic românesc.
- issue: Forța lui Ὡμοιώθη în introducerea pildei
  choice: se aseamănă cu
  alternative: a fost asemănată cu
  rationale: Redarea reflexivă exprimă comparația formulată de pildă fără a introduce ideea că împărăția s-ar fi transformat; păstrează totodată o nuanță verbală mai evidentă decât simplul „este ca”.
translation_notes:
  register: Română standard modernă, clară și demnă. „Pildă”, „Împărăția cerurilor” și „ogor” păstrează registrul biblic familiar fără arhaisme sintactice.
