reference: Matthew 13:27
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: προσελθόντες δὲ οἱ δοῦλοι τοῦ οἰκοδεσπότου εἶπον αὐτῷ· Κύριε, οὐχὶ καλὸν σπέρμα ⸀ἔσπειρας ἐν τῷ σῷ ἀγρῷ; πόθεν οὖν ἔχει ζιζάνια;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the slaves of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: ro
  text: 'Atunci sclavii stăpânului casei s-au apropiat de el și i-au spus: „Stăpâne, n-ai semănat sămânță bună în ogorul tău? De unde a apărut atunci neghina[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „buruienile”. Termenul grec se referă probabil la neghină, o buruiană care seamănă cu grâul în primele faze de creștere.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: s-au apropiat de el
  rationale: Participiul aorist exprimă apropierea care precedă vorbirea; formularea este firească în română și redă explicit mișcarea spre stăpân.
- source_word: δοῦλοι
  choice: sclavii
  rationale: Termenul indică persoane aflate în proprietatea și sub autoritatea unui stăpân; „sclavii” păstrează statutul social mai limpede decât „slujitorii”.
- source_word: οἰκοδεσπότου
  choice: stăpânului casei
  rationale: Redă elementele compusului grec și relația de autoritate din gospodărie, fără a restrânge sensul la simpla proprietate funciară.
- source_word: Κύριε
  choice: Stăpâne
  rationale: În dialogul parabolei este adresarea respectuoasă a sclavilor către stăpânul gospodăriei; „Stăpâne” redă natural funcția contextuală a vocativului, fără a transforma replica într-o afirmație hristologică explicită.
- source_word: οὐχὶ
  choice: n-ai
  rationale: Introduce o întrebare care așteaptă răspuns afirmativ; forma negativă românească păstrează această orientare.
- source_word: καλὸν σπέρμα
  choice: sămânță bună
  rationale: Echivalent agricol direct, limpede și idiomatic.
- source_word: ἔσπειρας
  choice: ai semănat
  rationale: Verbul „a semăna” corespunde precis acțiunii desemnate de σπείρω.
- source_word: ἐν τῷ σῷ ἀγρῷ
  choice: în ogorul tău
  rationale: „Ogor” este termenul agricol firesc pentru teren cultivat, iar posesivul redă σῷ.
- source_word: πόθεν οὖν ἔχει ζιζάνια
  choice: De unde a apărut atunci neghina?
  rationale: Construcția greacă este literal „de unde are atunci neghină?”, cu ogorul ca subiect implicit. Româna cere o restructurare idiomatică; „de unde a apărut” păstrează întrebarea despre originea plantei și valoarea inferențială a lui οὖν.
- source_word: ζιζάνια
  choice: neghina
  rationale: Termenul grec desemnează probabil neghina, o buruiană asemănătoare grâului în primele faze de creștere. Singularul românesc are aici valoare colectivă.
theological_decisions:
- issue: Redarea lui δοῦλοι în cadrul gospodăresc al parabolei
  choice: sclavii
  alternative: slujitorii; robii
  rationale: „Sclavii” păstrează explicit raportul social și juridic exprimat de δοῦλοι. „Slujitorii” ar putea atenua acest raport, iar „robii” este mai tradițional și poate căpăta conotații religioase străine contextului imediat.
- issue: Redarea vocativului Κύριε
  choice: Stăpâne
  alternative: Doamne; domnule
  rationale: Aici vorbitorii se adresează stăpânului casei. „Stăpâne” păstrează relația narativă și autoritatea termenului, în timp ce „Doamne” ar putea sugera în româna actuală o adresare direct divină, iar „domnule” ar slăbi raportul dintre sclavi și stăpân.
translation_notes:
  register: Română standard modernă, cu registru narativ demn și accesibil. „Sclavii” este deliberat direct; „stăpânului casei” păstrează structura socială a scenei. „Neghina” este precis și cunoscut, iar nota explică sensul pentru cititorii care nu cunosc planta.
