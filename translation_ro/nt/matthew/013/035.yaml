id: MAT.13.35
reference: Matthew 13:35
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος· Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου, ἐρεύξομαι κεκρυμμένα ἀπὸ ⸀καταβολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: ro
  text: 'ca să se împlinească ceea ce fusese spus prin profet, care zice: „Îmi voi deschide gura în pilde; voi rosti lucruri ascunse de la întemeiere[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Unele manuscrise adaugă „lumii”: „de la întemeierea lumii”.'
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: ca să se împlinească
  rationale: Redă firesc în română raportul de scop/rezultat și păstrează formula mateiană a împlinirii.
- source_word: τὸ ῥηθὲν
  choice: ceea ce fusese spus
  rationale: Participiul articular este redat idiomatic, iar mai-mult-ca-perfectul situează rostirea profetică înaintea împlinirii ei.
- source_word: διὰ τοῦ προφήτου
  choice: prin profet
  rationale: Păstrează ideea medierii profetice exprimată de διά cu genitivul, fără a preciza un nume absent din text.
- source_word: λέγοντος
  choice: '[redat prin introducerea directă a citatului]'
  rationale: În română, după «ceea ce fusese spus prin profet», două puncte introduc citatul mai natural decât o construcție redundantă precum «care zicea».
- source_word: Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου
  choice: Îmi voi deschide gura în pilde
  rationale: Păstrează imaginea poetică, viitorul și termenul consacrat, dar încă actual, «pilde».
- source_word: ἐρεύξομαι
  choice: voi rosti
  rationale: Exprimă vorbirea scoasă la iveală fără a impune conotația fizică nepotrivită pe care ar avea-o o redare strict literală.
- source_word: κεκρυμμένα
  choice: lucruri ascunse
  rationale: Păstrează valoarea substantivală și starea rezultată a participiului perfect pasiv, fără interpretarea mai îngustă «taine».
- source_word: ἀπὸ καταβολῆς
  choice: de la întemeiere
  rationale: Urmează textul SBLGNT furnizat, care nu conține κόσμου, și păstrează caracterul eliptic al expresiei; varianta extinsă este consemnată în notă.
theological_decisions:
- issue: Identitatea profetului citat
  choice: prin profet
  alternative: prin Asaf, profetul
  rationale: Textul grec furnizat nu numește profetul. Traducerea nu adaugă o identificare și nu armonizează formula cu alte citate.
- issue: Întinderea expresiei ἀπὸ καταβολῆς
  choice: de la întemeiere
  alternative: de la întemeierea lumii
  rationale: Textul principal urmează formularea SBLGNT, în care lipsește «lumii». Lectura mai amplă și mai familiară este semnalată ca variantă textuală, nu introdusă tacit.
translation_notes:
  register: Română standard modernă, cu registru demn și ușor poetic în citat. «Pilde» păstrează terminologia biblică bine cunoscută și rămâne inteligibil; punctuația evită redundanța unei redări mecanice a lui λέγοντος.
