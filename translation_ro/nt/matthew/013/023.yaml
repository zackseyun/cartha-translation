  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὴν ⸂καλὴν γῆν⸃ σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ ⸀συνιείς, ὃς δὴ καρποφορεῖ καὶ ποιεῖ ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: ro
  text: 'Iar cel semănat în pământul bun[a] este cel care aude cuvântul și îl înțelege, care într-adevăr aduce rod și dă recoltă: într-un caz o sută, în altul șaizeci, iar în altul treizeci.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „pe solul bun”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literal: „unul o sută, altul șaizeci, iar altul treizeci”; adică recolte de mărimi diferite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: pe pământul bun
  rationale: În contextul agricol, γῆ desemnează terenul care primește sămânța. „Pământul bun” este firesc și păstrează imaginea tradițională; καλὴν indică aici un pământ potrivit și roditor.
- source_word: σπαρείς
  choice: semănat
  rationale: Participiul aorist pasiv păstrează metafora seminței, deși în explicarea pildei îl desemnează pe omul reprezentat de aceasta.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: cel care aude Cuvântul
  rationale: Redarea exprimă acțiunea caracteristică indicată de participiul prezent. „Cuvântul” păstrează idiomul evanghelic și legătura cu contextul pildei.
- source_word: συνιείς
  choice: îl înțelege
  rationale: Verbul indică priceperea sensului celor auzite; pronumele „îl” reia firesc „Cuvântul”.
- source_word: δὴ
  choice: într-adevăr
  rationale: Particula are valoare emfatică, redată discret fără a îngreuna propoziția.
- source_word: καρποφορεῖ
  choice: aduce rod
  rationale: Păstrează metafora agricolă și formularea românească firească pentru rodirea spirituală.
- source_word: ποιεῖ
  choice: dă recoltă
  rationale: În acest context, ποιεῖ se referă la producerea unei recolte. Formularea păstrează distinct al doilea verb, fără a repeta nefiresc ideea de rodire.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: unul de o sută de ori, altul de șaizeci de ori, iar altul de treizeci de ori
  rationale: Construcția distributivă descrie recolte diferite. „De ... ori” explicitează în română raportul de producție subînțeles din context, iar nota păstrează forma mai literală.
theological_decisions:
- issue: Natura răspunsului față de Cuvânt în pildă
  choice: Ascultătorul reprezentat de pământul bun aude, înțelege și aduce rod în măsuri diferite.
  alternative: O redare interpretativă ar putea introduce explicit idei precum perseverența sau convertirea autentică.
  rationale: Textul grec afirmă auzirea, înțelegerea și rodirea, fără să formuleze aici categorii doctrinare ulterioare. Traducerea păstrează tensiunea și termenii proprii ai textului.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. Sintaxa păstrează paralelismul pildei, iar „Cuvântul” menține rezonanța biblică fără adaos confesional.
