    rationale: Construcția greacă este eliptică („unul o sută, unul șaizeci, unul treizeci”). Contextul indică randamente, dar „de ... ori” adaugă o formulare de multiplicare care nu apare explicit; „într-un caz...” o păstrează mai exact.
