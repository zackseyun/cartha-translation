revisions:
- from: 'Iar cel semănat pe pământul bun[a] este cel care aude Cuvântul și îl înțelege; acesta aduce într-adevăr rod și dă recoltă: unul de o sută de ori, altul de șaizeci de ori, iar altul de treizeci de ori.[b]'
  to: 'Iar cel semănat în pământul bun[a] este cel care aude cuvântul și îl înțelege, care într-adevăr aduce rod și dă recoltă: într-un caz o sută, în altul șaizeci, iar în altul treizeci.[b]'
  rationale: 'S-au făcut numai ajustări sigure: s-a folosit litera mică pentru „cuvântul”, conform formei nepersonificate a lui λόγος în verset, și s-a redat distribuția randamentelor fără adaosul explicit „de ... ori”. „În pământul bun” este idiomatic pentru sămânță în română și menține sensul agricol al expresiei grecești. Cele două verbe grecești sunt păstrate prin „aduce rod și dă recoltă”.'
