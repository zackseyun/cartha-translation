  source_fidelity: 'Revizuire necesară: majuscula din „Cuvântul” nu este cerută de λόγον, iar formularea „de ... ori” explicitează un raport de multiplicare care este doar implicat de elipsa greacă. Textul revizuit păstrează distincția dintre καρποφορεῖ și ποιεῖ și distribuția „unul... altul...”.'
  naturalness: „Pământul bun”, „aude cuvântul”, „îl înțelege” și „aduce rod” sunt firești în româna standard actuală. „Într-un caz... în altul...” redă natural construcția distributivă fără a introduce inutil „ori”.
  terminology: „Cuvântul” trebuie scris cu literă mică, deoarece textul grec are τὸν λόγον fără un indicator care să impună personificarea sau un titlu. „Pământul bun” este potrivit în cadrul agricol; nota oferă alternativa mai tehnică „solul bun”.
  issues:
