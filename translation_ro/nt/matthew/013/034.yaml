id: MAT.13.34
reference: Matthew 13:34
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: ro
  text: Isus le-a spus mulțimilor toate aceste lucruri în pilde și nu le spunea nimic fără pildă.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Imperfectul grecesc poate descrie aici o acțiune obișnuită sau repetată: „nu obișnuia să le spună nimic fără pildă”.'
    reason: Clarifică valoarea aspectuală a verbului fără a impune o singură nuanță contextuală.
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: toate aceste lucruri
  rationale: Redă atât forța demonstrativă, cât și caracterul cuprinzător al expresiei grecești, într-o formulare românească firească.
- source_word: ἐλάλησεν
  choice: le-a spus
  rationale: Aoristul rezumă actul de vorbire; construcția cu pronumele «le» este naturală în română și anticipează destinatarul exprimat prin «mulțimilor».
- source_word: ἐν παραβολαῖς
  choice: în pilde
  rationale: Redă mijlocul sau modul vorbirii. «Pildă» este termenul biblic românesc consacrat și rămâne ușor de înțeles în context.
- source_word: τοῖς ὄχλοις
  choice: mulțimilor
  rationale: Păstrează pluralul grecesc și identifică limpede destinatarii.
- source_word: χωρὶς παραβολῆς
  choice: fără pildă
  rationale: Păstrează sensul lui χωρίς și singularul substantivului, într-o formulare românească idiomatică.
- source_word: οὐδὲν ἐλάλει
  choice: nu le spunea nimic
  rationale: Imperfectul românesc redă firesc caracterul continuu sau obișnuit al imperfectului grecesc, fără a-l reduce la un simplu eveniment punctual.
- source_word: αὐτοῖς
  choice: le
  rationale: Pronumele neaccentuat reia natural în română referentul «mulțimilor», fără repetare greoaie.
theological_decisions:
- issue: Valoarea aspectuală a imperfectului ἐλάλει în a doua propoziție
  choice: nu le spunea nimic
  alternative: nu le-a spus nimic
  rationale: Imperfectul românesc păstrează accentul narativ asupra modului caracteristic sau repetat în care Isus se adresa mulțimilor în acest cadru, fără a transforma observația într-o afirmație doctrinară mai largă.
translation_notes:
  register: Română standard modernă, clară și demnă. «Pildă» este preferat față de «parabolă» pentru naturalețe în registrul biblic românesc; ordinea cu pronumele anticipativ «le-a spus mulțimilor» este idiomatică.
