id: MAT.13.31
reference: Matthew 13:31
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: ro
  text: 'Le-a prezentat o altă pildă, spunând: „Împărăția cerurilor este asemenea unui grăunte de muștar, pe care un om l-a luat și l-a semănat în ogorul său.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν
  choice: le-a pus înainte
  rationale: Redă imaginea concretă a verbului παρατίθημι și sensul său contextual de a prezenta o pildă unui auditoriu, într-o formulare românească demnă și ușor de înțeles.
- source_word: παραβολὴν
  choice: pildă
  rationale: „Pildă” este termenul românesc consacrat pentru παραβολή în contextul învățăturii sinoptice și păstrează caracterul narativ-comparativ al genului.
- source_word: Ὁμοία ἐστὶν
  choice: este asemenea
  rationale: Formularea redă firesc construcția comparativă grecească și păstrează registrul demn al enunțului.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Împărăția cerurilor
  rationale: Păstrează expresia caracteristică Evangheliei după Matei și lasă deschisă bogăția semantică a lui βασιλεία, care poate indica atât domnia, cât și sfera ei.
- source_word: κόκκῳ σινάπεως
  choice: unui grăunte de muștar
  rationale: „Grăunte de muștar” redă precis imaginea seminței mici și permite acordul firesc al pronumelui relativ masculin din continuarea frazei.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: pe care un om l-a luat
  rationale: Transformă participiul grecesc într-o construcție verbală românească naturală, păstrând atât succesiunea acțiunilor, cât și actorul individual exprimat prin ἄνθρωπος.
- source_word: ἔσπειρεν
  choice: l-a semănat
  rationale: „A semăna” este echivalentul agricol precis al lui σπείρω și se potrivește mai bine decât mai generalul „a planta”.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: în ogorul său
  rationale: „Ogor” exprimă clar terenul cultivat din cadrul pildei, iar „său” păstrează posesivul αὐτοῦ fără ambiguitate.
theological_decisions:
- issue: Redarea expresiei βασιλεία τῶν οὐρανῶν
  choice: Împărăția cerurilor
  alternative: domnia cerurilor; împărăția cerului
  rationale: Formularea tradițională și inteligibilă păstrează expresia distinctivă a lui Matei fără să restrângă βασιλεία numai la actul abstract al domnirii și fără să uniformizeze pluralul οὐρανῶν.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. Formulările consacrate „pildă” și „Împărăția cerurilor” sunt păstrate, iar sintaxa este suficient de apropiată de greacă pentru a conserva imaginea și succesiunea acțiunilor, fără a deveni greoaie.
