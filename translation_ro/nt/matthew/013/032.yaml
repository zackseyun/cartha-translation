id: MAT.13.32
reference: Matthew 13:32
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: ro
  text: Acesta este, într-adevăr, mai mic decât toate semințele, dar, când a crescut, este mai mare decât plantele din grădină și devine un copac, astfel încât păsările cerului[a] vin și își fac cuib în ramurile lui.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „păsările văzduhului”.
    reason: lexical_alternative
  - marker: b
    text: Imaginea păsărilor care își fac cuib în ramuri poate evoca imagini din Vechiul Testament ale unui copac mare asociat cu o împărăție (de exemplu, Ezechiel 17:23; Daniel 4:12), dar versetul nu explică simbolismul în mod explicit.
    reason: cross_reference
lexical_decisions:
- source_word: μικρότερον
  choice: mai mic
  rationale: Păstrează forma comparativă din greacă, fără a o transforma direct în superlativul „cel mai mic”.
- source_word: πάντων τῶν σπερμάτων
  choice: decât toate semințele
  rationale: Redă explicit genitivul de comparație și păstrează termenul general „semințe”.
- source_word: μέν ... δέ
  choice: într-adevăr ... dar
  rationale: Marchează contrastul dintre începutul mic și rezultatul mare într-o formulare românească firească.
- source_word: ὅταν ... αὐξηθῇ
  choice: când crește
  rationale: Exprimă situația generală în care creșterea ajunge la rezultatul descris; formularea este naturală în româna actuală.
- source_word: μεῖζον τῶν λαχάνων
  choice: mai mare decât plantele din grădină
  rationale: λάχανα desemnează plante cultivate de grădină; această redare este mai largă și mai exactă contextual decât „legumele” sau „ierburile”.
- source_word: γίνεται δένδρον
  choice: devine un copac
  rationale: Păstrează fără atenuare imaginea explicită și vie a textului grecesc.
- source_word: ὥστε ἐλθεῖν
  choice: astfel încât ... vin
  rationale: Redă valoarea consecutivă a construcției ὥστε cu infinitivul.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: păsările cerului
  rationale: Redare apropiată de greacă și idiomatică în registrul biblic românesc; alternativa „păsările văzduhului” este posibilă.
- source_word: κατασκηνοῦν
  choice: își fac cuib
  rationale: În contextul păsărilor și al ramurilor, exprimă firesc ideea de a se așeza și a-și face locuința acolo.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: în ramurile lui
  rationale: Redare locativă directă; pronumele se raportează firesc în română la „copac”.
theological_decisions:
- issue: Posibila aluzie la imaginea veterotestamentară a păsărilor adăpostite într-un copac mare
  choice: Imaginea este păstrată literal, fără identificarea simbolică a păsărilor în textul principal.
  alternative: Păsările ar putea fi interpretate explicit drept popoarele sau națiunile care găsesc adăpost în Împărăția lui Dumnezeu.
  rationale: Imaginile pot evoca Ezechiel 17:23 și Daniel 4:12, dar versetul nu explică simbolismul; traducerea păstrează rezonanța și ambiguitatea textului.
translation_notes:
  register: Română standard modernă, clară și demnă. „Acesta” reia grăuntele menționat în contextul imediat; acordul la masculin urmează substantivul românesc „grăunte”. Formularea păstrează comparațiile și imaginea concretă ale grecei, evitând atât limbajul tehnic, cât și interpretarea doctrinară introdusă în text.
