id: MAT.13.36
reference: Matthew 13:36
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τότε ἀφεὶς τοὺς ὄχλους ἦλθεν εἰς τὴν ⸀οἰκίαν. καὶ προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ λέγοντες· ⸀Διασάφησον ἡμῖν τὴν παραβολὴν τῶν ζιζανίων τοῦ ἀγροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/036.yaml
  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: ro
  text: 'Atunci, după ce a lăsat mulțimile, a intrat în casă. Ucenicii lui s-au apropiat de el și i-au zis: „Explică-ne pilda neghinei[a] din ogor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „buruienilor”; termenul grecesc se poate referi mai precis la neghină, o buruiană asemănătoare grâului.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Redă natural marcatorul temporal care introduce următorul episod narativ.
- source_word: ἀφεὶς τοὺς ὄχλους
  choice: după ce a lăsat mulțimile
  rationale: Exprimă limpede anterioritatea participiului aorist și păstrează pluralul substantivului ὄχλους.
- source_word: ἦλθεν εἰς τὴν οἰκίαν
  choice: a intrat în casă
  rationale: În context, construcția indică deplasarea din spațiul exterior în interiorul casei; formularea este firească în româna actuală.
- source_word: προσῆλθον αὐτῷ
  choice: s-au apropiat de el
  rationale: Redă direct sensul lui προσέρχομαι, fără rigiditate.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ucenicii lui
  rationale: Echivalent românesc consacrat și firesc pentru grupul discipolilor lui Isus.
- source_word: λέγοντες
  choice: și i-au zis
  rationale: Transformarea participiului într-un verb coordonat produce o narațiune românească naturală, fără pierdere semantică.
- source_word: Διασάφησον ἡμῖν
  choice: Explică-ne
  rationale: Imperativul cere ca sensul să fie făcut clar; forma enclitică redă concis dativul ἡμῖν.
- source_word: τὴν παραβολὴν
  choice: pilda
  rationale: „Pildă” este termenul biblic românesc bine cunoscut pentru παραβολή și rămâne accesibil cititorului modern.
- source_word: τῶν ζιζανίων
  choice: neghinei
  rationale: ζιζάνια desemnează probabil neghina, o buruiană asemănătoare grâului; alegerea este specifică și consacrată în română, iar caracterul probabil al identificării este semnalat în notă.
- source_word: τοῦ ἀγροῦ
  choice: din ogor
  rationale: Redă idiomatic relația genitivală și leagă buruiana de locul în care crește.
theological_decisions: []
