  text: καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τὰς παραβολὰς ταύτας, μετῆρεν ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/053.yaml
  text: And when Jesus had finished these parables[a], he departed from there.
translation:
  language: ro
  text: După ce Isus a terminat aceste pilde, a plecat de acolo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: După ce
  rationale: Formula narativă introduce aici succesiunea temporală. „După ce” redă firesc în română faptul că încheierea pildelor precedă plecarea, fără rigiditatea unei calchieri precum „Și s-a întâmplat când”.
- source_word: ἐτέλεσεν
  choice: a terminat
  rationale: Verbul înseamnă aici a duce la capăt, a încheia. „A terminat” este clar și natural în româna actuală.
- source_word: τὰς παραβολὰς ταύτας
  choice: aceste pilde
  rationale: „Pildă” este termenul românesc consacrat pentru παραβολή în contextul învățăturii sinoptice, iar demonstrativul indică pildele imediat precedente.
- source_word: μετῆρεν
  choice: a plecat
  rationale: Verbul exprimă mutarea sau plecarea dintr-un loc. „A plecat” păstrează sensul fără a preciza nejustificat destinația ori modul deplasării.
- source_word: ἐκεῖθεν
  choice: de acolo
  rationale: Redare directă și idiomatică a adverbului de loc, care indică punctul de plecare.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu formulare narativă simplă și demnă. Construcția grecească καὶ ἐγένετο ὅτε este redată idiomatic, iar termenul tradițional și accesibil „pilde” este păstrat.
