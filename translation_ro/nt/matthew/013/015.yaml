  terminology: „A devenit insensibilă” comunică sensul metaforic al inimii devenite nereceptive fără a importa ideea de împietrire/judicial hardening asociată mai direct cu alți termeni. „Să se întoarcă” și „îi voi vindeca” sunt potrivite și neconfesionale.
