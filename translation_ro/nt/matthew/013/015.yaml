id: MAT.13.15
reference: Matthew 13:15
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: ro
  text: Căci inima acestui popor a devenit insensibilă[a], iar cu urechile au auzit cu greu și și-au închis ochii, ca nu cumva să vadă cu ochii, să audă cu urechile, să înțeleagă cu inima și să se întoarcă[b], și îi voi vindeca.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: „s-a îngroșat”; în acest context, inima a devenit insensibilă sau nereceptivă.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „să revină”; verbul poate descrie atât întoarcerea, cât și revenirea.'
    reason: lexical_alternative
  - marker: c
    text: Citat din Isaia 6:9–10.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: s-a împietrit
  rationale: Verbul înseamnă literal „s-a îngroșat”, iar despre inimă exprimă insensibilitatea și lipsa de receptivitate. „S-a împietrit” este o formulare românească firească, fără a elimina metafora somatică.
- source_word: καρδία
  choice: inima
  rationale: Păstrează termenul biblic pentru centrul înțelegerii și al dispoziției lăuntrice, legat explicit aici de verbul „să înțeleagă”.
- source_word: λαοῦ τούτου
  choice: acestui popor
  rationale: Redă direct genitivul și păstrează accentul demonstrativ al expresiei grecești.
- source_word: βαρέως ἤκουσαν
  choice: cu urechile aud greu
  rationale: „Aud greu” redă natural în română adverbul βαρέως, literal „greu”, și păstrează ideea unei auziri anevoioase fără a preciza dacă este incapacitate sau împotrivire.
- source_word: ἐκάμμυσαν
  choice: și-au închis
  rationale: 'Păstrează acțiunea deliberată și reflexivă în sens: oamenii înșiși și-au închis ochii.'
- source_word: μήποτε
  choice: ca nu cumva
  rationale: Redare firească a construcției negative, păstrând tensiunea de scop/rezultat a citatului.
- source_word: συνῶσιν
  choice: să înțeleagă
  rationale: Exprimă sensul contextual de pricepere sau înțelegere profundă.
- source_word: ἐπιστρέψωσιν
  choice: să se întoarcă
  rationale: Păstrează sensul de întoarcere fără a introduce terminologia confesională mai specifică „să se convertească”.
- source_word: ἰάσομαι
  choice: îi voi vindeca
  rationale: Redă direct viitorul grecesc și imaginea vindecării, fără a-l transforma într-un condițional interpretativ.
theological_decisions:
- issue: Tensiunea dintre judecata divină și răspunderea oamenilor în propoziția introdusă prin μήποτε
  choice: ca nu cumva să vadă ... să se întoarcă, iar Eu îi voi vindeca
  alternative: altfel ar vedea ... s-ar întoarce, iar Eu i-aș vindeca
  rationale: Formularea aleasă păstrează forța de suprafață a textului grecesc și nu soluționează disputa dacă propoziția exprimă scop, rezultat ori descriere ironică. Totodată, menține răspunderea activă a oamenilor, care „și-au închis ochii”.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Paralelismul dintre ochi, urechi și inimă este păstrat, precum și succesiunea verbelor din greacă. Marcajele de note sunt așezate lângă expresiile relevante; nota de trimitere apare la sfârșitul citatului.
