  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἡλίου δὲ ἀνατείλαντος ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/006.yaml
  text: But when the sun rose[a], it was scorched, and because it had no root, it withered away.
translation:
  language: ro
  text: Dar, când a răsărit soarele, a fost pârjolită și, pentru că nu avea rădăcină, s-a uscat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „s-a ofilit”.
    reason: Alternativă lexicală pentru ἐξηράνθη în contextul unei plante.
lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: Dar, când a răsărit soarele
  rationale: Construcția cu genitiv absolut exprimă împrejurarea temporală, iar δέ marchează o continuare ușor contrastivă. Formularea este firească în româna actuală.
- source_word: ἐκαυματίσθη
  choice: a fost pârjolită
  rationale: Pasivul verbului καυματίζω indică vătămarea produsă de arșița soarelui; „pârjolită” se potrivește imaginii vegetale fără a implica neapărat arderea completă.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: pentru că nu avea
  rationale: διά urmat de infinitivul articulat exprimă cauza; propoziția cauzală redă sensul limpede și idiomatic în română.
- source_word: ῥίζαν
  choice: rădăcină
  rationale: Păstrează singularul textului grecesc și este idiomatic pentru lipsa înrădăcinării plantei.
- source_word: ἐξηράνθη
  choice: s-a uscat
  rationale: În context vegetal, ξηραίνω poate descrie uscarea sau ofilirea; „s-a uscat” redă direct rezultatul și păstrează alternativa semantică în nota de subsol.
theological_decisions: []
translation_notes:
  register: Română standard modernă, clară și demnă. Formele la feminin presupun subiectul contextual „sămânța”, neexprimat în acest verset, fără a adăuga un substantiv în text.
