id: MAT.13.13
reference: Matthew 13:13
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ, ὅτι βλέποντες οὐ βλέπουσιν καὶ ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: ro
  text: De aceea le vorbesc în pilde, pentru că, văzând, nu văd și, auzind, nu aud, nici nu înțeleg.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: De aceea
  rationale: Redă firesc și direct valoarea cauzală a expresiei grecești, fără a o transforma într-o concluzie mai puternică.
- source_word: ἐν παραβολαῖς
  choice: în pilde
  rationale: „Pilde” este termenul românesc biblic consacrat și încă ușor de înțeles pentru narațiuni sau comparații figurate; construcția păstrează modul vorbirii exprimat de ἐν cu dativul.
- source_word: αὐτοῖς λαλῶ
  choice: le vorbesc
  rationale: Dativul αὐτοῖς este redat natural prin pronumele neaccentuat „le”, iar prezentul λαλῶ prin „vorbesc”.
- source_word: ὅτι
  choice: pentru că
  rationale: Introduce motivul pentru care Isus le vorbește în pilde și păstrează sensul cauzal.
- source_word: βλέποντες οὐ βλέπουσιν
  choice: văzând, nu văd
  rationale: Păstrează forma participială și paradoxul textului grec fără a explicita prin „deși” o nuanță concesivă doar implicită.
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: auzind, nu aud
  rationale: Menține paralelismul formal și retoric cu propoziția despre vedere.
- source_word: οὐδὲ συνίουσιν
  choice: nici nu înțeleg
  rationale: Redă continuarea seriei negative și sensul lui συνίημι ca pricepere a semnificației.
theological_decisions:
- issue: Forța participiilor βλέποντες și ἀκούοντες
  choice: 'Formulare formală: „văzând” și „auzind”'
  alternative: „deși văd” și „deși aud”
  rationale: Greaca permite în context o nuanță concesivă, însă nu o marchează explicit. Redarea participială păstrează ambiguitatea și tensiunea dintre percepția exterioară și lipsa înțelegerii.
- issue: Sensul lui συνίουσιν
  choice: „înțeleg”
  alternative: „pricep” sau „pătrund sensul”
  rationale: „Înțeleg” exprimă clar lipsa sesizării sensului, fără a introduce o explicație doctrinară suplimentară despre cauza sau gradul acestei lipse.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Pilde” păstrează rezonanța biblică uzuală; topica și repetițiile urmăresc paralelismul sobru al textului grec.
