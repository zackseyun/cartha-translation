  text: ⸂εὑρὼν δὲ⸃ ἕνα πολύτιμον μαργαρίτην ἀπελθὼν πέπρακεν πάντα ὅσα εἶχεν καὶ ἠγόρασεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/046.yaml
  text: and having found one pearl of great value[a], he went away, sold all that he had, and bought it.
translation:
  language: ro
  text: iar când a găsit o perlă de mare valoare[a], s-a dus, a vândut tot ce avea și a cumpărat-o.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „o perlă prețioasă”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν δὲ
  choice: iar când a găsit
  rationale: Participiul aorist exprimă o acțiune anterioară verbelor principale, iar δέ are aici o funcție de legătură ușoară. Formularea este firească în româna actuală și păstrează succesiunea narațiunii.
- source_word: ἕνα
  choice: un
  rationale: În context, numeralul grec subliniază un singur mărgăritar; articolul nehotărât românesc «un» păstrează natural atât valoarea numerică, cât și introducerea obiectului în discurs.
- source_word: πολύτιμον
  choice: de mare valoare
  rationale: Redă limpede valoarea excepțională a mărgăritarului într-un registru modern și demn; alternativa «prețios» este consemnată în notă.
- source_word: μαργαρίτην
  choice: mărgăritar
  rationale: Echivalent românesc consacrat și precis pentru perlă ca obiect de mare preț, potrivit registrului biblic fără a fi neinteligibil.
- source_word: ἀπελθὼν
  choice: s-a dus
  rationale: Participiul este redat firesc prin verb la modul personal, păstrând succesiunea acțiunilor.
- source_word: πέπρακεν
  choice: a vândut
  rationale: Perfectul grec indică acțiunea dusă la îndeplinire; perfectul compus românesc o redă idiomatic în narațiune.
- source_word: πάντα ὅσα εἶχεν
  choice: tot ce avea
  rationale: Formulare românească naturală care păstrează totalitatea explicită a expresiei grecești.
- source_word: ἠγόρασεν
  choice: a cumpărat
  rationale: Echivalent direct, clar și actual al verbului grec.
- source_word: αὐτόν
  choice: l-a
  rationale: Pronumele masculin îl reia în mod firesc pe «mărgăritar», substantiv masculin în română, și nu adaugă o personificare.
theological_decisions: []
