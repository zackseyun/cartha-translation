id: MAT.13.25
reference: Matthew 13:25
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους ἦλθεν αὐτοῦ ὁ ἐχθρὸς καὶ ⸀ἐπέσπειρεν ζιζάνια ἀνὰ μέσον τοῦ σίτου καὶ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: ro
  text: Dar, pe când oamenii dormeau, a venit dușmanul lui, a semănat neghină printre grâu și a plecat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: oamenii
  rationale: Redă pluralul generic ἄνθρωποι în româna modernă, fără a-l restrânge nejustificat la bărbați.
- source_word: ὁ ἐχθρὸς
  choice: dușmanul
  rationale: Echivalent firesc și clar pentru un adversar personal în contextul parabolei.
- source_word: ζιζάνια
  choice: neghină
  rationale: Termenul românesc tradițional și precis contextual pentru buruiana asemănătoare grâului, probabil Lolium temulentum.
- source_word: ἀνὰ μέσον τοῦ σίτου
  choice: în mijlocul grâului
  rationale: Păstrează ideea distribuirii buruienii printre plantele de grâu, într-o formulare românească naturală.
- source_word: ἀπῆλθεν
  choice: a plecat
  rationale: Redare directă și idiomatică a acțiunii de îndepărtare.
theological_decisions:
- issue: Identitatea celor care dormeau
  choice: oamenii
  alternative: bărbații
  rationale: ἄνθρωποι este în mod obișnuit generic; versetul nu cere o identificare exclusiv masculină și nu trebuie încărcat cu o interpretare alegorică.
- issue: Identificarea buruienii
  choice: neghină
  alternative: buruieni
  rationale: „Neghină” păstrează mai bine imaginea unei plante nocive asemănătoare grâului, fără a modifica sensul teologic al parabolei.
translation_notes:
  register: Română standard modernă, clară și demnă. Ordinea acțiunilor din greacă este păstrată, iar formularea evită atât arhaizarea inutilă, cât și explicitarea alegorică prematură.
