id: MAT.13.50
reference: Matthew 13:50
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/050.yaml
  text: and they will throw them into the furnace of fire[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: ro
  text: Și îi vor arunca în cuptorul de foc[a]. Acolo va fi plânsul și scrâșnirea dinților.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, mai idiomatic: „cuptorul aprins”. În greacă, literal: „cuptorul de foc”.'
    reason: alternativă lexicală
lexical_decisions:
- source_word: βαλοῦσιν
  choice: vor arunca
  rationale: Viitorul activ al lui βάλλω exprimă aruncarea forțată; „vor arunca” este firesc în româna actuală și păstrează forța verbului.
- source_word: αὐτοὺς
  choice: îi
  rationale: Pronumele acuzativ masculin plural se referă la cei răi din contextul precedent; forma românească neaccentuată este naturală și suficientă.
- source_word: κάμινον τοῦ πυρός
  choice: cuptorul de foc
  rationale: Redarea păstrează construcția genitivală și imaginea concretă din greacă, fiind totodată consacrată și ușor de înțeles în română.
- source_word: ἐκεῖ
  choice: Acolo
  rationale: Adverbul indică locul cu o anumită emfază; „Acolo” redă direct și solemn valoarea locativă.
- source_word: ἔσται
  choice: va fi
  rationale: Viitorul lui εἰμί este redat direct, iar singularul este firesc înaintea celor două substantive articulate care formează expresia consacrată.
- source_word: ὁ κλαυθμὸς
  choice: plânsul
  rationale: κλαυθμός desemnează plânsul sau tânguirea; „plânsul” este exact, clar și potrivit formulei mateene.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: scrâșnirea dinților
  rationale: Expresia românească consacrată redă fidel imaginea greacă și conotațiile ei de chin și judecată.
theological_decisions:
- issue: Redarea imaginilor judecății în context escatologic
  choice: Păstrarea imaginilor concrete „cuptorul de foc”, „plânsul” și „scrâșnirea dinților” fără atenuare sau explicație interpretativă.
  alternative: O parafrază precum „cuptorul aprins”, urmată de o explicare a suferinței celor judecați.
  rationale: Textul prezintă imagini severe ale judecății, fără a le explica aici natura. Traducerea păstrează tensiunea și concretețea formulării grecești fără a impune o interpretare doctrinară.
translation_notes:
  register: Română standard modernă, clară și demnă. S-a păstrat formula biblică bine cunoscută, evitând atât arhaismele, cât și parafraza explicativă.
