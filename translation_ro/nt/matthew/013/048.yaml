  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: ro
  text: Când s-a umplut, au tras-o la țărm, apoi s-au așezat și au strâns peștii buni în recipiente[a], iar pe cei stricați[b] i-au aruncat afară.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „în vase”. Termenul grecesc desemnează în general recipiente, nu neapărat coșuri.
    reason: lexical_alternative
  - marker: b
    text: Sau „răi” ori „fără valoare”. Termenul grecesc poate însemna „stricat”, „putred” sau, mai general, „nefolositor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: o
  rationale: Pronumele relativ se referă la năvodul din versetul anterior; în română, reluarea prin pronumele neaccentuat feminin este firească în construcția verbală.
- source_word: ἐπληρώθη
  choice: s-a umplut
  rationale: Redă direct aoristul pasiv al lui πληρόω și descrie năvodul ajuns plin de pești.
- source_word: ἀναβιβάσαντες
  choice: au tras-o
  rationale: Participiul indică ridicarea și tragerea năvodului din apă; formularea este naturală în româna actuală.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: la țărm
  rationale: αἰγιαλός desemnează țărmul sau malul; «la țărm» se potrivește contextului pescuitului fără a presupune o plajă nisipoasă.
- source_word: καθίσαντες
  choice: s-au așezat
  rationale: Redă acțiunea următoare din succesiunea narativă într-o formulare românească firească.
- source_word: συνέλεξαν
  choice: au strâns
  rationale: Verbul înseamnă a aduna sau a strânge laolaltă și se potrivește operațiunii de sortare.
- source_word: τὰ καλὰ
  choice: peștii buni
  rationale: Substantivul «peștii» este subînțeles din context; exprimarea lui clarifică referentul fără a adăuga o interpretare teologică.
- source_word: εἰς ἄγγη
  choice: în recipiente
  rationale: ἄγγη este un termen general pentru vase ori recipiente; «recipiente» păstrează această lipsă de specificitate.
- source_word: τὰ δὲ σαπρά
  choice: pe cei stricați
  rationale: σαπρός poate însemna stricat, putred sau, mai general, fără valoare; «stricați» păstrează imaginea concretă și evită formularea nefirească «pești putrezi» în acest context.
- source_word: ἔξω ἔβαλον
  choice: i-au aruncat
  rationale: În contextul scoaterii din selecție, româna exprimă natural ideea prin «i-au aruncat»; «afară» ar fi posibil, dar nu este necesar pentru sens.
theological_decisions:
- issue: Interpretarea sortării din parabolă
  choice: Versetul este redat concret ca scenă de pescuit, fără introducerea explicită a judecății finale.
  alternative: O formulare interpretativă care anticipează explicația escatologică din versetele următoare.
  rationale: Textul de față prezintă imaginea parabolei, iar explicația ei urmează ulterior; traducerea păstrează această succesiune și tensiunea narativă.
translation_notes:
  register: Română standard modernă, clară și demnă. Subiectul «pescarii» este explicitat din context pentru a evita o succesiune greoaie de participii și un subiect neclar. Marcajele de notă sunt plasate imediat după expresiile vizate.
