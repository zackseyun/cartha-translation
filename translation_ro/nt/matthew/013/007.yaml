id: MAT.13.7
reference: Matthew 13:7
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰς ἀκάνθας, καὶ ἀνέβησαν αἱ ἄκανθαι καὶ ⸀ἔπνιξαν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/007.yaml
  text: Other seeds fell among the thorns[a], and the thorns came up and choked them.
translation:
  language: ro
  text: Alte semințe au căzut între spini[a], iar spinii au crescut și le-au înăbușit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: „pe spini”; în acest context agricol, sensul firesc este „între spini”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: Alte semințe
  rationale: Adjectiv neutru plural folosit substantival; referentul implicit este sămânța din context. Substantivul „semințe” este exprimat pentru claritate firească în română.
- source_word: δὲ
  choice: iar
  rationale: Conjuncția marchează aici continuarea relatării, cu o ușoară diferențiere față de cazul precedent, nu un contrast puternic.
- source_word: ἔπεσεν
  choice: au căzut
  rationale: Se păstrează sensul direct al verbului πίπτω, fără a-l înlocui interpretativ cu „au fost semănate”.
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: între spini
  rationale: Deși construcția poate fi redată literal „pe spini”, în context agricol româna firească cere „între spini”, adică în locul unde creșteau spinii.
- source_word: ἀκάνθας / ἄκανθαι
  choice: spini
  rationale: „Spini” redă natural atât vegetația spinoasă în mijlocul căreia au căzut semințele, cât și plantele care au crescut apoi.
- source_word: ἀνέβησαν
  choice: au crescut
  rationale: Verbul descrie ridicarea sau ieșirea în sus a plantelor; „au crescut” este formularea românească naturală în acest context.
- source_word: ἔπνιξαν
  choice: au înăbușit
  rationale: 'Redă metafora agricolă vie a verbului πνίγω: spinii împiedică dezvoltarea plantelor, sufocându-le.'
- source_word: αὐτά
  choice: le-
  rationale: Pronumele neutru plural se referă la semințele ori plantele implicite; cliticul românesc păstrează referirea pronominală fără repetare explicită.
theological_decisions: []
