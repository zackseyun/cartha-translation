  text: ⸀Συνήκατε ταῦτα πάντα; λέγουσιν αὐτῷ· ⸀Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/051.yaml
  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: ro
  text: '„Ați înțeles toate acestea?” Ei i-au spus: „Da.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνήκατε
  choice: Ați înțeles
  rationale: Aoristul indicativ, persoana a doua plural, privește firesc la înțelegerea dobândită până în acel moment; perfectul compus românesc redă bine întrebarea despre rezultatul acestei înțelegeri.
- source_word: ταῦτα πάντα
  choice: toate acestea
  rationale: Redă natural și explicit demonstrativul neutru plural împreună cu πᾶς și trimite la învățăturile și pildele precedente.
- source_word: λέγουσιν αὐτῷ
  choice: Ei I-au răspuns
  rationale: Prezentul istoric grecesc este redat prin perfect compus, firesc în narațiunea românească. Verbul „au răspuns” exprimă idiomatic funcția replicii în acest dialog, iar pronumele neaccentuat păstrează destinatarul.
- source_word: Ναί
  choice: Da
  rationale: Păstrează răspunsul afirmativ simplu din textul grec, fără a adăuga vreun titlu absent din sursă.
theological_decisions:
- issue: Dacă răspunsul ucenicilor trebuie extins cu un titlu reverențial
  choice: Se păstrează răspunsul simplu „Da.”
  alternative: „Da, Doamne.”
  rationale: Textul SBLGNT conține numai particula afirmativă ναί; adăugarea titlului „Doamne” ar introduce conținut absent din sursa greacă.
translation_notes:
  register: Română standard modernă, clară și demnă. Perfectul compus este idiomatic atât în întrebare, cât și în relatarea răspunsului. Majuscula reverențială din „I-au” urmează o convenție românească răspândită fără a adăuga un titlu în text.
