  text: καὶ αἱ ἀδελφαὶ αὐτοῦ οὐχὶ πᾶσαι πρὸς ἡμᾶς εἰσιν; πόθεν οὖν τούτῳ ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: ro
  text: Și nu sunt toate surorile lui printre noi? De unde are atunci omul acesta toate acestea?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „rudele lui de sex feminin”. Cuvântul grecesc înseamnă în mod obișnuit „surori” aici, dar unii îl interpretează mai larg în lumina unor discuții teologice ulterioare.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: surorile
  rationale: Este sensul familial obișnuit și cel mai firesc în contextul referirii la familia lui Isus.
- source_word: οὐχὶ πᾶσαι
  choice: nu sunt toate
  rationale: Păstrează întrebarea retorică ce așteaptă un răspuns afirmativ și accentul asupra tuturor surorilor.
- source_word: πρὸς ἡμᾶς
  choice: printre noi
  rationale: Redă natural prezența și asocierea lor cu comunitatea vorbitorilor.
- source_word: πόθεν οὖν
  choice: Atunci de unde
  rationale: Păstrează atât întrebarea privitoare la sursă, cât și legătura inferențială exprimată de οὖν.
- source_word: τούτῳ
  choice: omul acesta
  rationale: Redă demonstrativul într-o română firească și păstrează nuanța ușor disprețuitoare din context.
- source_word: ταῦτα πάντα
  choice: toate aceste lucruri
  rationale: Redă direct pluralul și trimite în mod larg la înțelepciunea și lucrările puternice menționate în context.
theological_decisions:
- issue: Natura referirii la surorile lui Isus
  choice: Termenul ἀδελφαὶ este tradus în sensul său lexical obișnuit, „surorile”, fără explicații doctrinare introduse în text.
  alternative: rudele lui de sex feminin / verișoarele lui
  rationale: Contextul familial susține sensul direct, iar traducerea nu trebuie să soluționeze prin reformulare dezbateri teologice ulterioare.
translation_notes:
  register: Română standard modernă, clară și demnă. „Printre noi” exprimă firesc prezența în comunitate, iar „omul acesta” păstrează forța demonstrativului.
