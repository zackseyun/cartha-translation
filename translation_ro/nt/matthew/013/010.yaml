base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/010.yaml
  text: Then the disciples came up and said to him[a], “Why do you speak to them in parables?”
translation:
  language: ro
  text: 'Atunci ucenicii s-au apropiat și I-au zis: „De ce le vorbești în pilde?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Atunci
  rationale: În acest context, καί continuă firul narațiunii; „Atunci” redă firesc succesiunea fără a adăuga conținut.
- source_word: προσελθόντες
  choice: s-au apropiat
  rationale: Participiul aorist al lui προσέρχομαι indică apropierea de Isus înainte de rostirea întrebării; formularea este naturală și păstrează mișcarea spre El.
- source_word: οἱ μαθηταὶ
  choice: ucenicii
  rationale: Articolul îi identifică pe ucenicii deja cunoscuți din context; posesivul „Săi” nu este exprimat explicit în greacă.
- source_word: εἶπαν αὐτῷ
  choice: I-au zis
  rationale: Redă direct verbul λέγω și pronumele datival, rămânând idiomatic în română chiar dacă replica este o întrebare.
- source_word: Διὰ τί
  choice: De ce
  rationale: Este echivalentul românesc direct și firesc al expresiei interogative.
- source_word: ἐν παραβολαῖς
  choice: în pilde
  rationale: Prepoziția ἐν exprimă aici maniera sau mijlocul vorbirii; „în pilde” este formularea consacrată, clară și exactă.
- source_word: λαλεῖς
  choice: vorbești
  rationale: Prezentul, persoana a doua singular, este redat simplu și natural în întrebarea directă.
- source_word: αὐτοῖς
  choice: le
  rationale: Pronumele datival indică auditoriul căruia îi vorbește Isus; cliticul românesc „le” este echivalentul firesc.
