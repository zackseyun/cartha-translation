  text: ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/009.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: ro
  text: Cine are urechi să audă!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Cine are
  rationale: Articolul cu participiul prezent are valoare substantivală și generică. În româna actuală, „cine are” redă firesc referirea la orice persoană, fără a introduce un masculin explicit absent ca necesitate semantică.
- source_word: ὦτα
  choice: urechi
  rationale: Păstrează pluralul grecesc și formularea idiomatică din context.
- source_word: ἀκουέτω
  choice: să audă
  rationale: Conjunctivul cu valoare imperativă este modul firesc de redare în română a imperativului grec la persoana a treia singular. „Audă” păstrează legătura lexicală cu verbul a auzi, iar în context implică ascultare atentă și receptivă.
theological_decisions:
- issue: Referirea generică la persoană
  choice: Cine are urechi să audă!
  alternative: Cel ce are urechi să audă!
  rationale: Greaca folosește o construcție substantivală la masculin singular cu sens generic. „Cine are” păstrează singularul semantic și caracterul universal, într-o română modernă și naturală, fără a restrânge enunțul la bărbați.
- issue: Forța exhortativă a lui ἀκουέτω
  choice: să audă
  alternative: să asculte
  rationale: „Să audă” păstrează sensul lexical și formula biblică, fără a elimina implicația contextuală de ascultare atentă. „Să asculte” ar explicita această implicație, dar ar pierde corespondența directă cu ἀκούω.
translation_notes:
  register: Formulare concisă, solemnă și naturală în româna standard modernă. Semnul exclamării reflectă forța de chemare a imperativului, fără adaos explicativ.
