id: MAT.13.38
reference: Matthew 13:38
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: ro
  text: Ogorul este lumea, iar sămânța bună — aceștia sunt fiii Împărăției[b]. Iar neghinele[a] sunt fiii celui rău[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Termenul desemnează buruieni asemănătoare grâului, probabil neghina/darnelul; se poate reda mai general prin „buruienile”.
    reason: lexical_alternative
  - marker: b
    text: Aici, „fiii” este o expresie relațională care îi desemnează pe cei ce aparțin Împărăției; aceeași expresie este folosită apoi pentru cei ce aparțin celui rău.
    reason: cultural_note
  - marker: c
    text: Sau „răului”.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἀγρός
  choice: ogorul
  rationale: Redă firesc terenul cultivat din cadrul pildei și păstrează imaginea agricolă.
- source_word: κόσμος
  choice: lumea
  rationale: Este echivalentul românesc direct și obișnuit pentru sfera largă în care are loc semănatul.
- source_word: καλὸν σπέρμα
  choice: sămânța bună
  rationale: Păstrează metafora agricolă și contrastul explicit cu neghina.
- source_word: οὗτοί εἰσιν
  choice: aceștia sunt
  rationale: Păstrează trecerea intenționată de la simbolul colectiv la persoanele pe care acesta le desemnează.
- source_word: υἱοὶ τῆς βασιλείας
  choice: fiii Împărăției
  rationale: Redă forma masculină și expresia relațională din greacă, fără a o reduce la simpla apartenență.
- source_word: ζιζάνια
  choice: neghina
  rationale: Termen românesc consacrat și botanic adecvat pentru buruiana asemănătoare grâului avută în vedere în pildă.
- source_word: τοῦ πονηροῦ
  choice: celui rău
  rationale: Articolul și forma masculină singulară susțin referirea personală, dar formularea românească evită introducerea explicită a unui nume absent din verset.
theological_decisions:
- issue: Dacă τοῦ πονηροῦ este personal («celui rău») sau abstract («răului»).
  choice: celui rău
  alternative: răului
  rationale: Construcția articulată la masculin singular, în contrastul dintre două grupuri de fii, favorizează referirea la un agent personal; alternativa abstractă este păstrată în notă.
- issue: Dacă υἱοὶ trebuie redat prin «fiii» sau prin termenul incluziv «copiii».
  choice: fiii
  alternative: copiii
  rationale: Greaca folosește explicit pluralul masculin υἱοί, iar expresia relațională este păstrată în text; nota explică faptul că denumește reprezentativ persoanele care aparțin celor două realități.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. Linia de pauză păstrează ritmul explicativ și trecerea de la imaginile agricole la persoanele reprezentate. Virgula finală indică faptul că explicația continuă în versetul următor.
