  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ⸀ἀνθρώπῳ ἐμπόρῳ ζητοῦντι καλοὺς μαργαρίτας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/045.yaml
  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: ro
  text: Din nou[a], împărăția cerurilor se aseamănă cu un negustor care caută mărgăritare alese.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mai literal: „Din nou, împărăția cerurilor se aseamănă cu un om, un negustor, care caută mărgăritare alese.”'
    reason: alternativă lexicală
lexical_decisions:
- source_word: Πάλιν
  choice: Din nou
  rationale: Introduce încă o comparație în seria pildelor despre împărăție și păstrează firesc continuitatea discursului.
- source_word: ὁμοία ἐστὶν
  choice: se aseamănă cu
  rationale: Formulare românească naturală pentru comparația parabolică, fără a-i extinde sensul.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: împărăția cerurilor
  rationale: Redă expresia caracteristică Evangheliei după Matei într-o formă consacrată și firească în română.
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: un negustor
  rationale: Substantivul ἔμπορος identifică deja persoana; omiterea explicită a lui ἄνθρωπος evită o repetare greoaie, iar nota păstrează forma mai literală.
- source_word: ζητοῦντι
  choice: care caută
  rationale: Redă natural participiul prezent și activitatea continuă a negustorului.
- source_word: καλοὺς μαργαρίτας
  choice: mărgăritare frumoase
  rationale: Păstrează sensul larg al lui καλός—frumos, bun sau ales—fără a introduce explicit ideea de preț ori valoare, care nu este exprimată lexical aici.
theological_decisions:
- issue: Sfera comparației din formula pildei
  choice: Împărăția este comparată imediat cu negustorul.
  alternative: Împărăția este asemenea întregii situații în care un negustor caută mărgăritare frumoase.
  rationale: Construcția greacă ὁμοία ἐστὶν ... ἀνθρώπῳ ἐμπόρῳ îl prezintă pe negustor drept termenul gramatical imediat al comparației. Traducerea nu restrânge însă semnificația pildei doar la persoana lui.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. „Mărgăritare” păstrează tonul biblic fără a fi neinteligibil, iar sintaxa rămâne simplă și naturală.
