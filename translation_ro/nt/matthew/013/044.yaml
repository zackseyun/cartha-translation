  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ⸀Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ ⸂πωλεῖ πάντα ὅσα ἔχει⸃ καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/044.yaml
  text: The kingdom of heaven is like a treasure hidden in a field[a], which a man found and hid[b]; and in his joy he goes and sells all that he has and buys that field.
translation:
  language: ro
  text: Împărăția cerurilor este asemenea unei comori ascunse într-un ogor[a], pe care un om a găsit-o și a ascuns-o; apoi, de bucurie[b], se duce, vinde tot ce are și cumpără ogorul acela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Împărăția cerurilor este asemenea unei comori ascunse în ogor.”'
    reason: alternativă lexicală
  - marker: b
    text: 'Sau: „din bucuria lui”.'
    reason: alternativă lexicală
lexical_decisions:
- source_word: Ὁμοία ἐστὶν
  choice: este asemenea
  rationale: Redă firesc formula comparativă a parabolei și păstrează registrul demn, fără rigiditatea unei traduceri strict literale.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Împărăția cerurilor
  rationale: Este expresia consacrată și naturală în română pentru formula specifică lui Matei; păstrează atât ideea domniei, cât și pe cea a sferei împărăției.
- source_word: θησαυρῷ
  choice: unei comori
  rationale: 'Dativul fără articol, cerut de comparație, susține sensul nedefinit: «unei comori».'
- source_word: κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: ascunse într-un ogor
  rationale: Participiul perfect pasiv descrie starea comorii ca fiind ascunsă; «într-un ogor» este idiomatic și nu supradetermină articolul grecesc.
- source_word: ὃν εὑρὼν ἄνθρωπος
  choice: pe care un om a găsit-o
  rationale: Păstrează antecedentul feminin cerut în română de «comoară» și redă ἄνθρωπος prin figura masculină concretă din parabolă.
- source_word: ἔκρυψεν
  choice: a ascuns-o din nou
  rationale: Contextul arată că omul ascunde comoara după ce o găsește; «din nou» face limpede în română această succesiune, fără a schimba acțiunea relatată.
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: de bucurie
  rationale: 'Redă concis și idiomatic valoarea cauzală a expresiei: bucuria îl motivează să acționeze.'
- source_word: ὑπάγει
  choice: se duce
  rationale: Păstrează prezentul narativ viu și sensul simplu de plecare, fără a-l încărca.
- source_word: πωλεῖ πάντα ὅσα ἔχει
  choice: vinde tot ce are
  rationale: Formulare românească naturală care păstrează caracterul cuprinzător al expresiei grecești.
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: cumpără ogorul acela
  rationale: Redă demonstrativul ἐκεῖνον și accentul pus pe ogorul precis în care se află comoara.
theological_decisions:
- issue: Redarea lui ἄνθρωπος
  choice: un om
  alternative: o persoană
  rationale: Substantivul este masculin singular, iar parabola prezintă o figură masculină reprezentativă; traducerea nu neutralizează inutil genul.
- issue: Redarea lui βασιλεία
  choice: Împărăția
  alternative: domnia
  rationale: «Împărăția» este naturală și consacrată în formula mateană, păstrând deschisă gama semantică dintre domnia lui Dumnezeu și realitatea împărăției sale.
- issue: Obiectul comparației
  choice: Împărăția cerurilor este asemenea unei comori
  alternative: Situația Împărăției cerurilor este asemenea celei a unui om care găsește o comoară
  rationale: Sintaxa greacă leagă gramatical comparația de «comoară». Traducerea păstrează această formulare și nu rezolvă interpretativ eventuala tensiune privind întregul scenariu al parabolei.
- issue: Reascunderea comorii
  choice: a ascuns-o din nou
  alternative: a ascuns-o
  rationale: «Din nou» explicitează succesiunea implicată de faptul că obiectul era deja ascuns, dar nu formulează o judecată morală asupra acțiunii omului.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. «Ogor» este preferat lui «câmp» deoarece desemnează natural un teren agricol ce poate fi cumpărat, fără a suna tehnic sau arhaic. Succesiunea timpurilor urmează introducerea la prezent, relatarea găsirii la trecut și prezentul narativ al acțiunilor următoare.
