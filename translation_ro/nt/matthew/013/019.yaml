id: MAT.13.19
reference: Matthew 13:19
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: παντὸς ἀκούοντος τὸν λόγον τῆς βασιλείας καὶ μὴ συνιέντος, ἔρχεται ὁ πονηρὸς καὶ ἁρπάζει τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ· οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: ro
  text: Când cineva aude cuvântul împărăției și nu-l înțelege, vine cel rău și smulge ce a fost semănat în inima lui. Acesta este cel semănat lângă drum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „cel semănat de-a lungul cărării” ori „la marginea drumului”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: Când cineva aude
  rationale: Redă natural în română construcția grecească la genitiv cu participiu și păstrează sensul general, distributiv.
- source_word: λόγον τῆς βασιλείας
  choice: cuvântul împărăției
  rationale: Păstrează forma și metafora semănării din greacă; „cuvântul” rămâne firesc și inteligibil în context biblic.
- source_word: μὴ συνιέντος
  choice: nu-l înțelege
  rationale: Verbul indică neînțelegerea sensului; pronumele „-l” trimite firesc la „cuvântul”.
- source_word: ὁ πονηρὸς
  choice: cel rău
  rationale: Articolul și contextul susțin referirea la un agent personal, fără a-l identifica mai precis decât o face versetul.
- source_word: ἁρπάζει
  choice: smulge
  rationale: Redă caracterul brusc și violent al îndepărtării și se potrivește imaginii agricole.
- source_word: τὸ ἐσπαρμένον
  choice: ce a fost semănat
  rationale: Redă participiul pasiv substantivizat fără a adăuga explicit „sămânța” sau „cuvântul”.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: în inima lui
  rationale: Păstrează termenul antropologic biblic și pronumele singular reprezentativ din textul-sursă.
- source_word: ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: cel semănat lângă drum
  rationale: Păstrează formularea metonimică deliberată prin care persoana este identificată cu ceea ce a fost semănat și cu locul semănării.
theological_decisions:
- issue: Identitatea lui ὁ πονηρός
  choice: 'un agent personal: „cel rău”'
  alternative: 'forța abstractă a răului: „răul”'
  rationale: În interpretarea pildei, cel care vine și îndepărtează ceea ce a fost semănat este prezentat personal; traducerea nu îl identifică mai precis decât textul.
- issue: Ambiguitatea metaforei din ὁ ... σπαρείς
  choice: „cel semănat”, păstrând identificarea persoanei cu elementul semănat
  alternative: „sămânța semănată” sau „omul care a primit sămânța”
  rationale: Greaca folosește un participiu masculin singular, iar reformulările explicative ar rezolva tensiunea metaforică existentă în text.
- issue: Genul și numărul lui αὐτοῦ
  choice: „în inima lui”
  alternative: „în inima sa” sau o formulare neutralizată la plural
  rationale: Pronumele masculin singular este reprezentativ și corespunde lui „cineva”; formularea păstrează gramatica sursei fără a restrânge aplicarea generală.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează concizia textului grec, imaginea agricolă și tensiunea metonimică din propoziția finală. Markerul [a] este plasat după expresia pe care o explică.
