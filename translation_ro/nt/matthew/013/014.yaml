  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἀναπληροῦται αὐτοῖς ἡ προφητεία Ἠσαΐου ἡ λέγουσα· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: ro
  text: 'Și în ei se împlinește profeția lui Isaia, care spune: „Veți auzi într-adevăr, dar nicidecum nu veți înțelege; și, privind, veți vedea, dar nicidecum nu veți percepe.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, „Cu auzul veți auzi ... și, privind, veți vedea”; construcțiile repetitive sunt expresii semitizante de intensificare, transmise aici prin greacă.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: se împlinește
  rationale: Redă natural prezentul pasiv și formula de împlinire profetică, fără a accentua nejustificat sensul posibil de împlinire deplină sau definitivă.
- source_word: αὐτοῖς
  choice: în ei
  rationale: Dativul indică faptul că profeția își găsește împlinirea în cazul oamenilor despre care se vorbește; formularea păstrează îndeaproape construcția greacă și este inteligibilă în română.
- source_word: προφητεία Ἠσαΐου
  choice: profeția lui Isaia
  rationale: Este construcția firească în româna modernă pentru genitivul grecesc.
- source_word: ἡ λέγουσα
  choice: care spune
  rationale: Redă participiul atributiv ce introduce citatul într-o formă românească fluentă.
- source_word: Ἀκοῇ ἀκούσετε
  choice: Veți auzi negreșit
  rationale: Exprimă valoarea emfatică a construcției semitizante, evitând literalismul nefiresc „cu auzul veți auzi”.
- source_word: οὐ μὴ συνῆτε
  choice: dar nicidecum nu veți înțelege
  rationale: „Nicidecum” păstrează forța negației emfactice οὐ μή, iar „dar” redă în română contrastul contextual.
- source_word: βλέποντες βλέψετε
  choice: veți privi negreșit
  rationale: Păstrează paralelismul și accentul construcției repetate, folosind „a privi” pentru βλέπω.
- source_word: οὐ μὴ ἴδητε
  choice: dar nicidecum nu veți pricepe
  rationale: Diferențiază vederea fizică exprimată prin βλέπω de perceperea sau discernerea sensului, sugerată aici de ὁράω, și păstrează negația emfatică.
theological_decisions:
- issue: Natura împlinirii profetice
  choice: Profeția „se împlinește” în acești oameni.
  alternative: Profeția este doar ilustrată prin ei sau ajunge aici la o împlinire exhaustivă și definitivă.
  rationale: Formularea păstrează afirmația textului despre împlinire fără a introduce o explicație doctrinară privind împietrirea, predestinarea ori caracterul exclusiv tipologic al citatului.
- issue: Relația dintre vederea fizică și percepția lăuntrică
  choice: βλέπω este redat prin „a privi”, iar ὁράω prin „a pricepe”.
  alternative: Ambele verbe ar putea fi redate prin „a vedea”.
  rationale: Alegerea face inteligibil contrastul contextual dintre actul exterior al privirii și lipsa perceperii sensului, fără a formula mai mult decât permite contextul.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. „Negreșit” păstrează solemnitatea moderată și exprimă emfaza fără construcții literale greoaie; „nicidecum” redă clar negația puternică.
