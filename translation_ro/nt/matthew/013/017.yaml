id: MAT.13.17
reference: Matthew 13:17
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: ro
  text: Căci adevărat vă spun că mulți profeți și oameni drepți[a] au tânjit să vadă ceea ce vedeți și nu au văzut, și să audă ceea ce auziți și nu au auzit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „cei drepți”. În greacă este folosit un adjectiv cu valoare de substantiv, cu sensul de persoane drepte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: adevărat
  rationale: În formula solemnă ἀμὴν λέγω ὑμῖν, „adevărat” redă firesc în româna actuală valoarea de confirmare solemnă, fără a recurge la transliterarea „amin”.
- source_word: γὰρ
  choice: căci
  rationale: Conjuncția introduce temeiul explicativ al afirmației precedente; „căci” păstrează clar această legătură și se potrivește registrului biblic demn.
- source_word: λέγω ὑμῖν
  choice: vă spun
  rationale: Este formularea directă și firească în româna modernă pentru adresarea lui Isus.
- source_word: πολλοὶ προφῆται
  choice: mulți profeți
  rationale: Redare directă, clară și actuală a expresiei grecești.
- source_word: δίκαιοι
  choice: oameni drepți
  rationale: Adjectivul este folosit substantival și desemnează persoane caracterizate prin dreptate; adăugarea lui „oameni” face construcția firească și limpede în română.
- source_word: ἐπεθύμησαν
  choice: au tânjit
  rationale: Verbul exprimă o dorință puternică; „au tânjit” păstrează intensitatea fără conotația negativă pe care verbul o poate avea în alte contexte.
- source_word: ἰδεῖν / ἀκοῦσαι
  choice: să vadă / să audă
  rationale: Conjunctivul este construcția românească naturală după „au tânjit” și păstrează paralelismul celor două infinitive grecești.
- source_word: ἃ βλέπετε / ἃ ἀκούετε
  choice: ceea ce vedeți / ceea ce auziți
  rationale: Redarea păstrează obiectele nespecificate, așa cum sunt în textul grec, și exprimă natural acțiunile la prezent.
- source_word: καὶ οὐκ εἶδαν / καὶ οὐκ ἤκουσαν
  choice: dar n-au văzut / dar n-au auzit
  rationale: Deși καί are sensul de bază „și”, în aceste construcții coordonarea are valoare contrastivă; „dar” redă firesc în română contrastul dintre dorință și neîmplinirea ei.
theological_decisions:
- issue: Sfera semantică a lui δίκαιοι
  choice: „oameni drepți”, ca grup mai larg alături de profeți
  alternative: „cei drepți”
  rationale: Pluralul substantival desemnează persoane drepte, fără a le identifica exclusiv cu profeții. Formularea aleasă păstrează această categorie distinctă și este clară pentru cititorul modern.
- issue: Identitatea lucrurilor văzute și auzite
  choice: 'Obiectele rămân implicite: „ceea ce vedeți” și „ceea ce auziți”.'
  alternative: Explicitarea prin „Mesia”, „lucrarea lui Isus” sau „tainele Împărăției”
  rationale: Contextul indică revelația Împărăției în lucrarea lui Isus, însă versetul nu numește explicit obiectele. Traducerea nu restrânge interpretativ referința.
translation_notes:
  register: Română standard modernă, clară și demnă. S-a păstrat formula solemnă „adevărat vă spun”, iar paralelismul dintre vedere și auzire a fost conservat fără completări interpretative.
