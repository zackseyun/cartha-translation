id: MAT.13.41
reference: Matthew 13:41
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
translation:
  language: ro
  text: Fiul Omului îi va trimite pe îngerii săi, iar ei vor strânge din împărăția lui toate pricinile de poticnire[a] și pe cei ce săvârșesc fărădelegea[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „toate piedicile”. Termenul grecesc poate desemna lucruri, influențe sau persoane care îi fac pe alții să păcătuiască ori să cadă.
    reason: lexical_alternative
  - marker: b
    text: Literal, „cei ce fac fărădelegea”. Formularea poate descrie o conduită continuă și caracteristică de nesocotire a legii lui Dumnezeu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: îi va trimite
  rationale: Viitorul verbului ἀποστέλλω indică trimiterea îngerilor ca agenți ai Fiului Omului; formularea este firească în româna actuală, fără a adăuga o nuanță absentă din context.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Redarea consacrată păstrează caracterul titular al expresiei și rezonanța ei apocaliptică, inclusiv legătura cu Daniel 7.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: pe îngerii săi
  rationale: În scena escatologică a judecății, ἄγγελοι desemnează îngeri cerești, nu mesageri omenești.
- source_word: συλλέξουσιν
  choice: vor strânge
  rationale: Verbul se potrivește imaginii secerișului din context și redă natural acțiunea de adunare în vederea îndepărtării.
- source_word: ἐκ τῆς βασιλείας αὐτοῦ
  choice: din împărăția lui
  rationale: Prepoziția ἐκ exprimă scoaterea din interiorul sferei împărăției; „din” redă idiomatic această relație în română.
- source_word: πάντα τὰ σκάνδαλα
  choice: toate pricinile de poticnire
  rationale: Expresia păstrează ideea a tot ceea ce îi împinge pe alții spre păcat sau cădere, fără a limita referentul doar la obiecte ori doar la persoane.
- source_word: τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: pe cei ce săvârșesc fărădelegea
  rationale: Participiul prezent descrie conduita caracteristică, iar „fărădelegea” păstrează sensul moral-teologic al lui ἀνομία, mai precis decât termenul general „răul”.
theological_decisions:
- issue: Redarea titlului ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  alternative: Omul ceresc / Cel omenesc
  rationale: Forma consacrată păstrează titlul, ambiguitatea lui proprie și ecoul din Daniel 7, fără a introduce o interpretare explicativă în text.
- issue: Sfera semantică a lui σκάνδαλα în contextul judecății
  choice: toate pricinile de poticnire
  alternative: toate piedicile / tot ce duce la păcat
  rationale: Termenul poate cuprinde persoane, influențe sau lucruri care îi fac pe alții să păcătuiască ori să cadă; formularea aleasă menține această deschidere semantică.
- issue: Caracterul conduitei exprimate prin participiul ποιοῦντας
  choice: cei ce săvârșesc fărădelegea
  alternative: cei ce fac fărădelegea
  rationale: Construcția românească este naturală și poate indica o conduită caracteristică, fără a transforma explicit participiul într-o afirmație doctrinară despre frecvență.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. „Fiul Omului”, „împărăția” și „fărădelegea” păstrează terminologia biblică bine cunoscută, iar sintaxa rămâne naturală pentru cititorul contemporan.
