id: MAT.13.30
reference: Matthew 13:30
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: ro
  text: 'Lăsați-le pe amândouă să crească împreună până la seceriș, iar la vremea secerișului le voi spune secerătorilor: «Strângeți mai întâi neghina[a] și legați-o în snopi, ca s-o ardeți, iar grâul adunați-l în hambarul meu.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „buruienile”. Termenul grecesc poate desemna în mod specific neghina.'
    reason: Oferă alternativa lexicală și precizarea semantică pentru ζιζάνια; ancora este plasată la termenul explicat.
lexical_decisions:
- source_word: ἄφετε
  choice: Lăsați
  rationale: 'Imperativul are aici sens permisiv: lucrătorii trebuie să îngăduie creșterea ambelor plante.'
- source_word: συναυξάνεσθαι ἀμφότερα
  choice: pe amândouă să crească împreună
  rationale: Redă atât referirea la cele două feluri de plante, cât și ideea explicită a creșterii lor laolaltă.
- source_word: μέχρι τοῦ θερισμοῦ
  choice: până la seceriș
  rationale: Formulare românească firească pentru evenimentul agricol bine definit din parabolă.
- source_word: ἐν καιρῷ τοῦ θερισμοῦ
  choice: la vremea secerișului
  rationale: Păstrează nuanța lui καιρός ca timp potrivit sau stabilit și corespunde îndeaproape construcției grecești.
- source_word: θερισταῖς
  choice: secerătorilor
  rationale: Termen agricol precis, natural și consacrat în limba română.
- source_word: Συλλέξατε πρῶτον τὰ ζιζάνια
  choice: Strângeți mai întâi neghina
  rationale: Păstrează ordinea acțiunilor și distinge firesc acest verb de συναγάγετε redat ulterior prin „adunați”.
- source_word: ζιζάνια
  choice: neghina
  rationale: În context desemnează buruiana asemănătoare grâului, identificată de obicei drept neghină; termenul este inteligibil în română și păstrează imaginea specifică.
- source_word: δήσατε αὐτὰ εἰς δέσμας
  choice: legați-o în snopi
  rationale: Pronumele singular colectiv se acordă firesc cu „neghina”, iar „snopi” redă mănunchiurile legate pentru ardere.
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: ca să fie arsă
  rationale: Redă construcția de scop și forța verbului de ardere fără a introduce explicit interpretarea escatologică.
- source_word: τὸν δὲ σῖτον συναγάγετε εἰς τὴν ἀποθήκην μου
  choice: iar grâul adunați-l în hambarul meu
  rationale: Păstrează contrastul marcat de δέ, tematizarea grâului și destinația exprimată prin εἰς.
theological_decisions:
- issue: Imaginea parabolică a separării finale
  choice: Este păstrată strict imaginea agricolă a neghinei arse și a grâului adunat în hambar.
  alternative: Explicitarea aici a judecății finale sau a distrugerii depline.
  rationale: Interpretarea parabolei este oferită ulterior în capitol; traducerea acestui verset nu trebuie să o introducă anticipat și nici să elimine tensiunea imaginii.
translation_notes:
  register: Registru modern, demn și accesibil. Formele agricole „seceriș”, „secerători”, „snopi” și „hambar” sunt concrete și larg inteligibile; topica din ultima propoziție păstrează contrastul grecesc fără să devină rigidă.
