  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὴν γῆν τὴν καλὴν καὶ ἐδίδου καρπόν, ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/008.yaml
  text: But other seed fell on the good soil and was producing fruit—one a hundredfold, another sixty, and another thirty.
translation:
  language: ro
  text: 'Dar alte semințe au căzut pe pământul bun și dădeau rod: unele de o sută de ori, altele de șaizeci, iar altele de treizeci.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, într-o formulare mai tradițională: „și a dat rod: una o sută, alta șaizeci, alta treizeci”. Construcția grecească distribuie cele trei randamente între semințele căzute pe pământul bun; numerele exprimă implicit randamentul.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: alte semințe
  rationale: Adjectivul neutru plural este folosit substantival și se referă, în contextul parabolei, la sămânța semănată; substantivul „semințe” este adăugat pentru claritate și permite o exprimare firească în română.
- source_word: δὲ
  choice: Dar
  rationale: Conjuncția marchează contrastul dintre rezultatul precedentelor căderi și rodirea pe pământul bun.
- source_word: ἔπεσεν
  choice: au căzut
  rationale: Este păstrat sensul concret al verbului „a cădea”; acordul la plural este cerut de română, deși greaca folosește verbul la singular cu un subiect neutru plural.
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: pe pământul bun
  rationale: În context agricol, „pământul bun” este o formulare românească naturală pentru solul fertil și păstrează imaginea semințelor care cad pe suprafața lui.
- source_word: ἐδίδου καρπόν
  choice: dădeau rod
  rationale: Imperfectul redă o acțiune în desfășurare sau caracteristică, iar expresia românească „a da rod” păstrează firesc metafora agricolă.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: unele de o sută de ori, altele de șaizeci, iar altele de treizeci
  rationale: Construcția distributivă indică randamente diferite. Expresia „de ... ori” explicitează multiplicarea recoltei fără a adăuga o interpretare teologică.
