id: MAT.13.40
reference: Matthew 13:40
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ πυρὶ ⸀καίεται, οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ ⸀αἰῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/040.yaml
  text: Therefore[a], just as the weeds are gathered and burned with fire[b], so it will be at the end of the age.
translation:
  language: ro
  text: Așadar, după cum buruienile[a] sunt strânse și arse în foc, tot așa va fi la sfârșitul veacului[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „neghina”. Termenul grecesc desemnează buruieni dăunătoare, probabil neghină.
    reason: lexical_alternative
  - marker: b
    text: Sau „la sfârșitul lumii”; în greacă, „al veacului”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: Așadar, după cum
  rationale: „După cum” introduce comparația, iar „așadar” păstrează legătura logică și inferențială cu explicația precedentă.
- source_word: συλλέγεται
  choice: sunt strânse
  rationale: Verbul la prezent, cu sens pasiv, descrie adunarea buruienilor; pluralul este cerut firesc de gramatica românească.
- source_word: τὰ ζιζάνια
  choice: buruienile
  rationale: Termenul desemnează buruieni dăunătoare, probabil neghină. „Buruienile” este clar și actual, iar articolul hotărât indică plantele deja menționate în parabolă.
- source_word: πυρὶ καίεται
  choice: arse în foc
  rationale: Redarea păstrează explicit imaginea focului și este mai firească în româna actuală decât formularea literală „arse cu foc”.
- source_word: οὕτως ἔσται
  choice: tot așa va fi
  rationale: Expresia reia limpede comparația și păstrează orientarea viitoare a verbului.
- source_word: ἐν τῇ συντελείᾳ
  choice: la sfârșitul
  rationale: „La sfârșitul” redă idiomatic culminarea sau încheierea avută în vedere de συντέλεια, fără termenul mai tehnic „consumarea”.
- source_word: τοῦ αἰῶνος
  choice: veacului
  rationale: „Veacului” păstrează sensul temporal al lui αἰών și evită identificarea lui directă cu lumea fizică.
theological_decisions:
- issue: Expresia escatologică τοῦ αἰῶνος
  choice: veacului
  alternative: lumii
  rationale: Alegerea păstrează sensul temporal al textului și tensiunea escatologică, fără a introduce o schemă doctrinară specifică ori ideea explicită a distrugerii cosmosului.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea păstrează structura comparativă și legătura logică din greacă, folosind vocabular accesibil și evitând atât arhaismele neexplicate, cât și precizările escatologice care depășesc textul.
