id: MAT.13.54
reference: Matthew 13:54
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: ro
  text: 'Și, venind în locul său de baștină, îi învăța în sinagoga lor, astfel încât ei erau uimiți și spuneau: „De unde are omul acesta înțelepciunea aceasta și puterile acestea[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „faptele de putere”; adică manifestări ale puterii, înțelese adesea ca minuni.
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: locul său de baștină
  rationale: În context, termenul indică locul de origine unde Isus era cunoscut, nu o țară sau un stat. Formularea românească păstrează sensul local fără să precizeze nejustificat că era neapărat un oraș.
- source_word: ἐδίδασκεν
  choice: îi învăța
  rationale: Imperfectul redă o acțiune în desfășurare în trecut, iar această formulare este firească în româna actuală.
- source_word: συναγωγῇ
  choice: sinagoga
  rationale: În acest cadru iudaic, termenul desemnează în mod clar sinagoga ca loc și instituție a adunării.
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: astfel încât ei erau uimiți și spuneau
  rationale: Construcția cu ὥστε exprimă rezultatul învățăturii lui Isus. Verbele finite redau natural în română infinitivele grecești, iar «uimiți» păstrează intensitatea reacției.
- source_word: Πόθεν
  choice: De unde are
  rationale: Întrebarea privește originea sau sursa înțelepciunii și a puterilor; «De unde are» este direct și idiomatic.
- source_word: τούτῳ
  choice: omul acesta
  rationale: Demonstrativul are aici o nuanță de distanțare. «Omul acesta» o comunică firesc și evită forma rigidă «acesta» folosită singură.
- source_word: σοφία
  choice: înțelepciunea
  rationale: Este echivalentul românesc standard și denotă în context înțelegerea și capacitatea de a învăța manifestate de Isus.
- source_word: δυνάμεις
  choice: puterile
  rationale: Alegerea păstrează sensul lexical al pluralului grecesc și lasă deschisă metonimia prin care termenul poate desemna fapte miraculoase; nota explică alternativa contextuală.
theological_decisions:
- issue: Redarea lui δυνάμεις cu referire la activitatea extraordinară a lui Isus
  choice: puterile
  alternative: faptele de putere; minunile
  rationale: Textul evocă activitatea supranaturală a lui Isus fără să folosească termenul grec obișnuit pentru «semne» sau un substantiv care să însemne exclusiv «minuni». «Puterile» păstrează tensiunea lexicală, iar nota arată sensul metonimic probabil fără a-l impune în text.
translation_notes:
  register: Română standard modernă, clară și demnă. «Locul său de baștină» evită atât sensul modern de stat al lui «patrie», cât și precizarea excesivă «orașul natal». Marcajul notei este așezat la «puterile», termenul pe care nota îl explică.
