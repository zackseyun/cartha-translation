  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐποίησεν ἐκεῖ δυνάμεις πολλὰς διὰ τὴν ἀπιστίαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/058.yaml
  text: And he did not do many mighty works there because of their unbelief[a].
translation:
  language: ro
  text: Și n-a făcut acolo multe minuni din cauza necredinței lor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Termenul grecesc poate fi redat și prin „multe fapte de putere” sau „multe lucrări puternice”. În acest context, el se referă la lucrări miraculoase prin care se manifestă puterea.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐκ ἐποίησεν
  choice: Și n-a făcut
  rationale: καί continuă relatarea, iar οὐκ neagă verbul aorist ἐποίησεν. Formularea redă acțiunea neînfăptuită, fără a introduce ideea de incapacitate.
- source_word: ἐκεῖ
  choice: acolo
  rationale: Adverb de loc direct și firesc în română, cu referire la locul menționat în context.
- source_word: δυνάμεις πολλὰς
  choice: multe minuni
  rationale: În contextul evanghelic, pluralul δυνάμεις desemnează fapte prin care se manifestă puterea, adică lucrări miraculoase. „Minuni” este formularea românească naturală și ușor de înțeles, iar nota păstrează nuanța lexicală de putere; πολλὰς este redat prin „multe”.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: din cauza necredinței lor
  rationale: διά cu acuzativul exprimă cauza. ἀπιστία este redat direct prin „necredință”, păstrând forța negativă a termenului în contextul respingerii.
theological_decisions:
- issue: Dacă versetul afirmă incapacitatea lui Isus sau faptul că nu a săvârșit multe minuni ca răspuns la necredința lor
  choice: „n-a făcut acolo multe minuni”
  alternative: „n-a putut face acolo multe minuni”
  rationale: Textul grec spune οὐκ ἐποίησεν („n-a făcut”), nu folosește un verb care exprimă incapacitatea. Redarea păstrează afirmația lui Matei la nivelul acțiunii și nu introduce o concluzie teologică mai puternică.
translation_notes:
  register: Română standard modernă, clară și demnă. Contracția „n-a” este firească în narațiunea românească actuală, fără a coborî registrul. „Minuni” evită o formulare greoaie în textul principal, iar nota explică nuanța de putere a termenului grec.
