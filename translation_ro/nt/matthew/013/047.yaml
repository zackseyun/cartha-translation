source:
  edition: SBLGNT
  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν σαγήνῃ βληθείσῃ εἰς τὴν θάλασσαν καὶ ἐκ παντὸς γένους συναγαγούσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/047.yaml
  text: Again[b][a], the kingdom of heaven is like a dragnet cast into the sea and gathering from every kind.
translation:
  language: ro
  text: Din nou, Împărăția cerurilor este asemenea unui năvod[a] aruncat în mare, care adună de toate felurile[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „o plasă”; termenul grecesc desemnează mai precis un năvod mare, tras prin apă.
    reason: lexical_alternative
  - marker: b
    text: 'Literal: „adunând din orice fel”; din imaginea pescuitului se subînțelege „pești”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Din nou
  rationale: Marchează încă o pildă în succesiune și este firesc în româna actuală.
- source_word: ὁμοία ἐστὶν
  choice: este asemenea
  rationale: Păstrează formula comparativă a pildelor într-un registru demn și natural.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Împărăția cerurilor
  rationale: Păstrează formularea specifică lui Matei, bine cunoscută în română, fără a o înlocui interpretativ cu «Împărăția lui Dumnezeu».
- source_word: σαγήνῃ
  choice: unui năvod
  rationale: Termenul desemnează o plasă mare de pescuit trasă prin apă; «năvod» este echivalentul românesc precis și inteligibil.
- source_word: βληθείσῃ εἰς τὴν θάλασσαν
  choice: aruncat în mare
  rationale: Redă participiul pasiv și păstrează termenul sursă «mare», fără a-l adapta la «lac».
- source_word: καὶ ἐκ παντὸς γένους συναγαγούσῃ
  choice: care a strâns din orice fel
  rationale: Redă acțiunea năvodului și păstrează obiectul neexprimat și formularea eliptică a grecei; contextul pescuitului sugerează peștii.
theological_decisions:
- issue: Sensul expresiei «Împărăția cerurilor»
  choice: Păstrarea expresiei mateene «Împărăția cerurilor»
  alternative: «Împărăția lui Dumnezeu» sau «domnia cerurilor»
  rationale: Textul distinctiv al lui Matei trebuie păstrat, fără armonizare sau explicare doctrinară în corpul versetului.
- issue: Obiectul implicit al verbului συναγαγούσῃ
  choice: Nu se introduce «pești» în textul principal
  alternative: «care a strâns pești de orice fel»
  rationale: Greaca lasă obiectul neexprimat. Păstrarea elipsei conservă ambiguitatea formală, iar nota clarifică sensul evident din imagine.
translation_notes:
  register: Română standard modernă, într-un registru clar și demn. «Năvod» oferă precizie fără a deveni tehnic, iar construcția eliptică finală urmează îndeaproape sursa greacă și este explicată în notă.
