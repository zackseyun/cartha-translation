id: MAT.13.29
reference: Matthew 13:29
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δέ ⸀φησιν· Οὔ, μήποτε συλλέγοντες τὰ ζιζάνια ἐκριζώσητε ἅμα αὐτοῖς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/029.yaml
  text: But he said[a], ‘No, lest while gathering the weeds you uproot the wheat along with them.’
translation:
  language: ro
  text: 'Dar el a spus: „Nu, ca nu cumva, strângând neghina[a], să smulgeți odată cu ea și grâul.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „buruienile”; termenul grecesc se poate referi la neghină, posibil o specie de Lolium, o buruiană care seamănă cu grâul în primele stadii de creștere.
    reason: alternativă lexicală și precizare botanică prudentă
lexical_decisions:
- source_word: φησιν
  choice: le-a zis
  rationale: Prezentul istoric grecesc este redat prin perfectul compus, firesc în narațiunea românească; pronumele «le» face explicit destinatarul deja prezent în context, fără a schimba sensul.
- source_word: Οὔ
  choice: Nu
  rationale: Redă direct și natural răspunsul negativ.
- source_word: μήποτε
  choice: ca nu cumva
  rationale: Păstrează ideea de avertizare privind un rezultat posibil și nedorit.
- source_word: συλλέγοντες
  choice: strângând
  rationale: Gerunziul păstrează raportul de simultaneitate al participiului grec față de acțiunea principală.
- source_word: ζιζάνια
  choice: neghina
  rationale: «Neghină» este termenul românesc consacrat și încă inteligibil pentru buruiana asemănătoare grâului; singularul are aici valoare colectivă.
- source_word: ἐκριζώσητε
  choice: să smulgeți din rădăcini
  rationale: 'Exprimă explicit sensul verbului: scoaterea plantei cu tot cu rădăcină.'
- source_word: ἅμα αὐτοῖς
  choice: odată cu ea
  rationale: Redă asocierea dintre smulgerea neghinei și cea a grâului; pronumele se acordă cu singularul colectiv românesc «neghina».
- source_word: τὸν σῖτον
  choice: grâul
  rationale: În acest context agricol și în contrast cu neghina, referința specifică la grâu este cea mai firească.
theological_decisions:
- issue: Redarea lui ζιζάνια în parabola bine cunoscută
  choice: neghina
  alternative: buruienile; zizania
  rationale: Termenul nu impune o concluzie doctrinară, dar are o tradiție puternică de traducere. «Neghina» păstrează imaginea unei buruieni care poate semăna cu grâul, iar nota explică sensul pentru cititorul modern fără a pretinde o identificare botanică absolut sigură.
translation_notes:
  register: Română standard modernă, cu formulare narativă naturală și demnă. «Neghina» este folosit la singular colectiv, conform uzului românesc; nota păstrează alternativa mai generală. Marcajul [a] este așezat lângă termenul pe care îl explică.
