  source_fidelity: 'Redarea păstrează corect succesiunea și imaginile textului grec: alte semințe cad pe teren pietros/stâncos, răsar repede din cauza lipsei unui strat adânc de sol. Totuși, „unde nu aveau pământ mult” atribuie în română semințelor posesia pământului și este mai puțin firesc; greaca permite o formulare impersonală referitoare la loc.'
