base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/005.yaml
  text: Other seed fell on rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil,
translation:
  language: ro
  text: Alte semințe au căzut pe teren stâncos[a], unde nu era mult pământ, și au răsărit îndată, pentru că pământul nu avea adâncime.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: „pe locurile stâncoase”; expresia se referă la un strat subțire de pământ deasupra stâncii.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα δὲ
  choice: Alte semințe
  rationale: Adjectivul neutru plural trimite eliptic la semințele din context; substantivul este exprimat în română pentru claritate, iar pluralul este păstrat.
- source_word: ἔπεσεν
  choice: au căzut
  rationale: Verbul înseamnă simplu „au căzut”; formularea evită interpretarea suplimentară „au fost semănate”.
- source_word: ἐπὶ τὰ πετρώδη
  choice: pe locurile stâncoase
  rationale: Redarea păstrează pluralul substantivizat al expresiei grecești și indică terenul cu strat subțire de pământ deasupra stâncii.
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: unde nu aveau pământ mult
  rationale: Acordul la plural urmează firesc în română semințele subînțelese; „pământ” este termenul agricol obișnuit și păstrează imaginea.
- source_word: καὶ εὐθέως ἐξανέτειλεν
  choice: și au răsărit îndată
  rationale: „Au răsărit” redă firesc apariția plantelor, iar „îndată” păstrează forța temporală a lui εὐθέως.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: pentru că pământul nu era adânc
  rationale: Construcția cauzală este redată explicit, iar formularea românească exprimă natural lipsa adâncimii stratului de sol.
