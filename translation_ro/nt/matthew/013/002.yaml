  text: καὶ συνήχθησαν πρὸς αὐτὸν ὄχλοι πολλοί, ὥστε αὐτὸν ⸀εἰς πλοῖον ἐμβάντα καθῆσθαι, καὶ πᾶς ὁ ὄχλος ἐπὶ τὸν αἰγιαλὸν εἱστήκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/002.yaml
  text: And large crowds gathered to him[a], so that he got into a boat and sat down[b], and the whole crowd stood on the shore.
translation:
  language: ro
  text: Și s-au adunat la el mulțimi mari, așa încât s-a urcat într-o barcă și s-a așezat[a], iar toată mulțimea stătea pe țărm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „s-a îmbarcat într-o barcă și s-a așezat”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sau: „pe malul apei” ori „pe plajă”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: s-au adunat
  rationale: 'Pasivul aorist are aici sens firesc intranzitiv: mulțimile au venit și s-au strâns laolaltă.'
- source_word: πρὸς αὐτόν
  choice: la el
  rationale: Redă în româna curentă mișcarea către Isus, fără a adăuga ideea interpretativă de «în jurul lui».
- source_word: ὄχλοι πολλοί
  choice: mulțimi mari
  rationale: Formulare românească firească pentru pluralul grecesc însoțit de πολλοί, care sugerează o afluență numeroasă de oameni.
- source_word: ὥστε
  choice: așa încât
  rationale: Păstrează limpede raportul de rezultat introdus de conjuncția grecească.
- source_word: εἰς πλοῖον ἐμβάντα
  choice: s-a urcat într-o barcă
  rationale: Exprimă idiomatic intrarea sau îmbarcarea în barcă și se potrivește fluxului narativ.
- source_word: καθῆσθαι
  choice: s-a așezat
  rationale: Redă natural faptul că Isus a luat loc în barcă.
- source_word: πᾶς ὁ ὄχλος
  choice: toată mulțimea
  rationale: Păstrează trecerea de la pluralul «mulțimi» la prezentarea lor colectivă ca o singură mulțime.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: pe țărm
  rationale: Este formularea neutră și demnă pentru malul mării sau al lacului, fără a restrânge sensul la o plajă amenajată.
- source_word: εἱστήκει
  choice: stătea
  rationale: 'Imperfectul românesc redă bine starea continuă descrisă de forma grecească: mulțimea rămânea în picioare pe țărm.'
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu sintaxă narativă limpede și registru demn. «La el» este mai firesc decât literalul «către el», iar «stătea» păstrează mai bine decât perfectul simplu caracterul durativ al scenei.
