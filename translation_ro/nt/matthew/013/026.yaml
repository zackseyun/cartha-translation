id: MAT.13.26
reference: Matthew 13:26
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐβλάστησεν ὁ χόρτος καὶ καρπὸν ἐποίησεν, τότε ἐφάνη καὶ τὰ ζιζάνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/026.yaml
  text: But when the plants had sprouted and produced grain[a], then the weeds also appeared.
translation:
  language: ro
  text: Dar când semănătura a răsărit și a dat rod, atunci s-a văzut și neghina.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „buruienile”; termenul poate desemna neghina, posibil zizania, o buruiană asemănătoare grâului.
    reason: Alternativă lexicală și posibilă identificare botanică pentru ζιζάνια.
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Dar, când
  rationale: ὅτε introduce propoziția temporală, iar δέ marchează o ușoară schimbare și un contrast narativ cu semănarea anterioară.
- source_word: ἐβλάστησεν
  choice: au răsărit
  rationale: Verbul βλαστάνω descrie apariția lăstarilor; perfectul compus este firesc în narațiunea românească și păstrează succesiunea evenimentelor.
- source_word: ὁ χόρτος
  choice: plantele
  rationale: În context, χόρτος se referă la vegetația cultivată care crește, nu la iarbă în sens obișnuit; „plantele” rămâne accesibil și nu precizează prematur grâul.
- source_word: καρπὸν ἐποίησεν
  choice: au făcut rod
  rationale: Expresia înseamnă a produce rod sau recoltă. „Au făcut rod” păstrează metafora și formularea agricolă naturală, fără a restrânge καρπός exclusiv la boabe.
- source_word: τότε
  choice: atunci
  rationale: Redă direct adverbul temporal care marchează etapa următoare.
- source_word: ἐφάνη
  choice: s-a văzut
  rationale: Redă sensul intranzitiv de a deveni vizibilă sau evidentă; formularea este naturală în română.
- source_word: καὶ τὰ ζιζάνια
  choice: și neghina
  rationale: καί are valoare aditivă, iar ζιζάνια desemnează buruiana din lan, probabil neghină. Termenul românesc „neghină” este tradițional, inteligibil și potrivit contextului, în timp ce incertitudinea botanică este indicată în notă.
theological_decisions:
- issue: Identificarea precisă a termenului ζιζάνια
  choice: „neghina” în textul principal
  alternative: „buruienile” sau, mai precis din punct de vedere botanic, „zizania” (Lolium temulentum)
  rationale: Contextul indică o buruiană asemănătoare cerealelor, dar versetul nu impune o identificare botanică absolută. „Neghina” păstrează termenul românesc consacrat, iar nota conservă alternativa generică și incertitudinea.
translation_notes:
  register: Română standard modernă, cu formulare simplă și demnă. Acordul la plural din „plantele au răsărit” este firesc în română, deși substantivele grecești χόρτος și verbul sunt la singular. Nota evită prezentarea identificării botanice drept certă.
