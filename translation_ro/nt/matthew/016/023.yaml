id: MAT.16.23
reference: Matthew 16:23
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ στραφεὶς εἶπεν τῷ Πέτρῳ· Ὕπαγε ὀπίσω μου, Σατανᾶ· σκάνδαλον ⸂εἶ ἐμοῦ⸃, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/023.yaml
  text: But he turned and said to Peter[a], “Go behind me, Satan! You are a stumbling block to me, because you are not setting your mind on the things of God[b], but on the things of men.”
translation:
  language: ro
  text: 'Dar Isus S-a întors și i-a spus lui Petru: „Du-te în urma Mea, Satan[a]! Ești o piatră de poticnire pentru Mine, fiindcă nu te gândești la cele ale lui Dumnezeu, ci la cele ale oamenilor[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, mai tradițional: „Înapoia Mea, Satano!”'
    reason: lexical_alternative
  - marker: b
    text: Adică la preocupările omenești.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: S-a întors
  rationale: Participiul aorist pasiv este folosit intranzitiv și descrie întoarcerea lui Isus înainte de a-i vorbi lui Petru.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Mergi în urma Mea
  rationale: Păstrează atât imperativul de mișcare, cât și sensul spațial al lui ὀπίσω, fără a reduce expresia doar la o poruncă de îndepărtare.
- source_word: Σατανᾶ
  choice: Satan
  rationale: Redă vocativul ca nume sau titlu consacrat și păstrează forța mustrării, fără a decide dacă Petru este identificat cu Satan ori acționează ca instrument advers.
- source_word: σκάνδαλον
  choice: o piatră de poticnire
  rationale: Păstrează metafora unui obstacol care face pe cineva să se împiedice și se potrivește încercării lui Petru de a-L abate pe Isus de la calea Sa.
- source_word: ἐμοῦ
  choice: pentru Mine
  rationale: În construcție cu σκάνδαλον, genitivul indică persoana pentru care cineva constituie un obstacol; formularea este firească în română.
- source_word: φρονεῖς
  choice: te gândești la
  rationale: În context exprimă orientarea minții și preocuparea, nu doar un gând trecător; formularea românească este naturală și păstrează contrastul.
- source_word: τὰ τοῦ θεοῦ
  choice: cele ale lui Dumnezeu
  rationale: Redare concisă și relativ formală a expresiei substantivale, care păstrează contrastul fără să precizeze excesiv dacă este vorba despre planuri, interese sau preocupări.
- source_word: τὰ τῶν ἀνθρώπων
  choice: cele ale oamenilor
  rationale: Redă pluralul generic ἀνθρώπων în româna modernă firească și arată că referința este la preocupări omenești în general.
theological_decisions:
- issue: Forța adresării „Satan” către Petru
  choice: Isus i se adresează direct lui Petru prin desemnarea „Satan”, fără explicație interpretativă în text.
  alternative: „adversarule” sau o formulare care afirmă că Satan vorbește prin Petru
  rationale: Greaca păstrează o tensiune între adresarea directă și posibila funcție adversarială a lui Petru; traducerea nu trebuie să hotărască interpretarea.
- issue: Sensul poruncii Ὕπαγε ὀπίσω μου
  choice: „Mergi în urma Mea” păstrează dimensiunea spațială și posibila chemare implicită la locul de ucenic.
  alternative: „Pleacă dinaintea Mea” sau tradiționalul „Înapoia Mea”
  rationale: Textul cere mișcare în spatele lui Isus, iar formularea aleasă evită să transforme ambiguitatea într-o simplă alungare.
- issue: Domeniul expresiilor „cele ale lui Dumnezeu” și „cele ale oamenilor”
  choice: Se păstrează expresiile largi și paralele.
  alternative: „interesele lui Dumnezeu” și „interesele omenești”
  rationale: Formularea greacă poate cuprinde gândurile, preocupările, scopurile și voia; o parafrază mai îngustă ar rezolva nejustificat sensul.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Pronumele referitoare la Isus sunt scrise cu majusculă potrivit uzului editorial religios românesc. Paralelismul dintre „cele ale lui Dumnezeu” și „cele ale oamenilor” este păstrat.
