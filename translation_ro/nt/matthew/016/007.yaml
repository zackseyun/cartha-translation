  text: οἱ δὲ διελογίζοντο ἐν ἑαυτοῖς λέγοντες ὅτι Ἄρτους οὐκ ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/007.yaml
  text: And they were discussing among themselves[a], saying, “We did not bring bread.”
translation:
  language: ro
  text: 'Iar ei discutau între ei, zicând: „N-am luat pâine cu noi[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „N-am adus pâine.”'
    reason: Alternativă lexicală pentru οὐκ ἐλάβομεν, care în acest context poate fi redat idiomatic atât prin „n-am luat cu noi”, cât și prin „n-am adus”.
lexical_decisions:
- source_word: οἱ δὲ
  choice: Iar ei
  rationale: δέ este un conector narativ ușor; „iar” păstrează continuitatea și nu accentuează excesiv contrastul.
- source_word: διελογίζοντο
  choice: discutau
  rationale: Imperfectul redă o deliberare în desfășurare; „discutau” este firesc în româna actuală și se potrivește schimbului din cadrul grupului.
- source_word: ἐν ἑαυτοῖς
  choice: între ei
  rationale: Expresia indică o discuție purtată în interiorul propriului grup; „între ei” este echivalentul idiomatic românesc.
- source_word: λέγοντες
  choice: zicând
  rationale: Participiul introduce direct conținutul discuției și păstrează forma narativă a sursei.
- source_word: ὅτι
  choice: marcat prin introducerea vorbirii directe
  rationale: Aici ὅτι introduce conținutul spuselor; în română, două puncte și citatul direct exprimă natural această funcție, fără a adăuga explicit „pentru că”.
- source_word: Ἄρτους
  choice: pâine
  rationale: Deși substantivul grec este la plural, în context desemnează proviziile de pâine în sens generic; singularul colectiv „pâine” este firesc în română.
- source_word: οὐκ ἐλάβομεν
  choice: N-am luat ... cu noi
  rationale: În contextul unei călătorii, λαμβάνω are sensul de a lua ceva cu sine. Formularea redă explicit și natural această valoare contextuală, păstrând în notă alternativa „a aduce”.
theological_decisions: []
translation_notes:
  register: Română standard modernă, cu formulare narativă demnă și accesibilă. Textul păstrează deliberarea dintre ucenici fără a introduce explicația interpretativă „este pentru că”, absentă explicit din greacă.
