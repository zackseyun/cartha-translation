id: MAT.16.28
reference: Matthew 16:28
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι εἰσίν τινες ⸂τῶν ὧδε ἑστώτων⸃ οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν τῇ βασιλείᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/028.yaml
  text: Truly I tell you[c][b][a], there are some standing here who will certainly not taste death until they see the Son of Man coming in his kingdom.
translation:
  language: ro
  text: 'Adevărat vă spun: unii dintre cei care stau aici nu vor gusta nicidecum moartea[a] până când îl vor vedea pe Fiul Omului venind în împărăția sa[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „nu vor gusta în niciun caz moartea”; în greacă, negația este emfatică.
    reason: lexical_alternative
  - marker: b
    text: Expresia „Fiul Omului venind în împărăția sa” poate face referire la schimbarea la față, la înviere și înălțare, la Cincizecime, la judecata asupra Ierusalimului sau la venirea finală; textul nu precizează evenimentul.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Adevărat
  rationale: Redă în româna actuală formula solemnă de afirmare care introduce o declarație autoritativă, fără transliterarea mai puțin transparentă „Amin”.
- source_word: λέγω ὑμῖν
  choice: vă spun
  rationale: Formulare directă și firească în română, care păstrează adresarea la plural și solemnitatea enunțului.
- source_word: εἰσίν τινες τῶν ὧδε ἑστώτων
  choice: unii dintre cei care stau aici
  rationale: Păstrează explicit sensul partitiv al genitivului și redă participiul printr-o construcție românească naturală.
- source_word: οὐ μὴ γεύσωνται
  choice: nu vor gusta nicidecum
  rationale: Dubla negație grecească este emfatică; „nicidecum” îi păstrează forța fără a transforma afirmația în altă construcție.
- source_word: γεύσωνται θανάτου
  choice: vor gusta ... moartea
  rationale: Păstrează metafora vie și recognoscibilă a textului-sursă, în loc să o reducă la simplul „vor muri”.
- source_word: ἕως ἂν ἴδωσιν
  choice: până când ... vor vedea
  rationale: Redă natural construcția temporală orientată spre un eveniment viitor.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Păstrează titlul consacrat și rezonanțele sale biblice și apocaliptice.
- source_word: ἐρχόμενον
  choice: venind
  rationale: Redare directă a participiului, fără a adăuga idei precum puterea sau slava, absente din verset.
- source_word: ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: în împărăția sa
  rationale: „Împărăție” păstrează termenul-cheie și imaginea concretă, fără a exclude nuanța de domnie sau exercitare a autorității regale.
theological_decisions:
- issue: Referentul venirii Fiului Omului în împărăția sa
  choice: Formularea este redată fără identificarea evenimentului.
  alternative: Schimbarea la față, învierea și înălțarea, Cincizecimea, judecata asupra Ierusalimului sau venirea finală.
  rationale: Greaca nu precizează evenimentul avut în vedere; traducerea păstrează ambiguitatea și tensiunea interpretativă.
- issue: Sensul lui βασιλεία
  choice: împărăție
  alternative: domnie; stăpânire regală
  rationale: „Împărăție” păstrează imaginea și terminologia biblică, fără a restrânge sensul exclusiv la un teritoriu ori exclusiv la actul domnirii.
translation_notes:
  register: Română standard modernă, cu un ton demn și accesibil. Sintaxa este naturală, iar metafora „a gusta moartea” și titlul „Fiul Omului” sunt păstrate pentru fidelitate și rezonanță biblică.
