id: MAT.16.26
reference: Matthew 16:26
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφεληθήσεται ἄνθρωπος ἐὰν τὸν κόσμον ὅλον κερδήσῃ τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ; ἢ τί δώσει ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/026.yaml
  text: For what will it profit a man if he gains the whole world but forfeits his life? Or what will a man give in exchange for his life?[a]
translation:
  language: ro
  text: Căci ce folos va avea un om dacă va câștiga lumea întreagă, dar își va pierde viața?[a] Sau ce va da un om în schimbul vieții sale?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „sufletul”, aici și în a doua apariție a cuvântului „viață”. Termenul grecesc ψυχή poate însemna „viață”, „sine” sau „suflet”, în funcție de context.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Căci ce folos
  rationale: „Căci” păstrează legătura explicativă cu învățătura precedentă, iar formularea interogativă românească redă firesc τί.
- source_word: ὠφεληθήσεται
  choice: va avea ... folos
  rationale: Redă sensul de beneficiu sau profit al pasivului grecesc într-o construcție românească naturală, fără rigiditatea unui calc formal.
- source_word: ἄνθρωπος
  choice: un om
  rationale: Substantivul masculin singular are aici valoare generică; „un om” păstrează forma reprezentativă și este idiomatic în română.
- source_word: τὸν κόσμον ὅλον
  choice: lumea întreagă
  rationale: Păstrează atât sensul lui κόσμος, cât și accentul totalizator al lui ὅλον.
- source_word: κερδήσῃ
  choice: va câștiga
  rationale: „A câștiga” redă direct metafora economică și contrastează limpede cu pierderea.
- source_word: τὴν ... ψυχὴν αὐτοῦ
  choice: își ... viața / vieții sale
  rationale: În context, ψυχή poate desemna viața sau persoana însăși în valoarea ei ultimă. „Viața” este natural în text, iar alternativa tradițională „sufletul” este păstrată în notă.
- source_word: ζημιωθῇ
  choice: își va pierde
  rationale: Redă clar ideea de a suferi pierderea ori de a fi lipsit de ceva; reflexivul românesc leagă firesc pierderea de subiect.
- source_word: ἀντάλλαγμα
  choice: în schimbul
  rationale: Păstrează imaginea schimbului fără a introduce sensul mai restrâns de răscumpărare sau compensație.
theological_decisions:
- issue: Redarea lui ψυχή în contextul pierderii ultime
  choice: viață
  alternative: suflet
  rationale: Termenul grecesc nu impune aici o distincție tehnică între trup și o componentă imaterială, ci poate indica viața sau sinele persoanei. Textul principal folosește „viață”, iar nota păstrează alternativa teologic semnificativă „suflet”.
translation_notes:
  register: Română standard modernă, clară și demnă. Construcția „ce folos va avea” este idiomatică, păstrează întrebarea retorică și evită atât arhaismul, cât și formularea excesiv de tehnică.
