  text: πῶς οὐ νοεῖτε ὅτι οὐ περὶ ⸀ἄρτων εἶπον ὑμῖν; ⸂προσέχετε δὲ⸃ ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/011.yaml
  text: How do you not understand that I did not speak to you about bread? But beware of the leaven of the Pharisees and Sadducees[a][b].
translation:
  language: ro
  text: Cum de nu înțelegeți că nu v-am vorbit despre pâini? Dar feriți-vă de aluatul fariseilor și al saducheilor.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Fiți cu băgare de seamă la aluatul fariseilor și al saducheilor”.'
    reason: lexical_alternative
  - marker: b
    text: „Aluatul” este aici o metaforă; în versetul următor este explicat ca învățătura fariseilor și a saducheilor.
    reason: cross_reference
lexical_decisions:
- source_word: πῶς οὐ νοεῖτε
  choice: Cum de nu înțelegeți
  rationale: Întrebarea are forță de mustrare și exprimă nedumerirea față de lipsa lor de înțelegere. Formularea este firească în româna actuală și păstrează caracterul retoric.
- source_word: ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν
  choice: că nu despre pâini v-am vorbit
  rationale: Pluralul ἄρτων este păstrat prin „pâini”, potrivit contextului imediat al pâinilor înmulțite; „v-am vorbit” redă simplu construcția εἶπον ὑμῖν.
- source_word: προσέχετε ... ἀπό
  choice: păziți-vă de
  rationale: 'Împreună, imperativul προσέχετε și prepoziția ἀπό exprimă un avertisment: ucenicii trebuie să se ferească de ceva, nu doar să-i acorde atenție.'
- source_word: δὲ
  choice: Ci
  rationale: Particula marchează aici corectarea contrastivă dintre ceea ce Isus nu spusese și avertismentul pe care îl dăduse de fapt. „Ci” redă natural această opoziție în română.
- source_word: τῆς ζύμης
  choice: aluatul
  rationale: „Aluat” este echivalentul românesc firesc și păstrează metafora, fără a o explica anticipat drept „învățătură”.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: fariseilor și al saducheilor
  rationale: Sunt folosite denumirile consacrate în română; repetarea articolului posesiv „al” clarifică asocierea aluatului cu ambele grupuri.
theological_decisions:
- issue: Forța metaforică a lui ζύμη
  choice: Metafora „aluatul” este păstrată în textul principal.
  alternative: „învățătura fariseilor și a saducheilor”
  rationale: Versetul următor identifică aluatul cu învățătura lor, însă acest verset păstrează încă imaginea figurată. Explicarea ei direct în text ar anticipa interpretarea oferită de context.
translation_notes:
  register: Română standard modernă, clară și demnă. „Cum de” păstrează mustrarea retorică fără rigiditate, iar „păziți-vă” transmite limpede caracterul de avertisment. Metafora originală rămâne neexplicată în text, fiind lămurită doar în nota contextuală.
