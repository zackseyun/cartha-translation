  text: He says to them[a], “But who do you say that I am?”
translation:
  language: ro
  text: 'El le spune: „Dar voi cine spuneți că sunt?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: El le spune
  rationale: Prezentul narativ grecesc este păstrat prin prezentul românesc, care redă firesc vivacitatea relatării.
- source_word: αὐτοῖς
  choice: le
  rationale: Pronumele la dativ plural este redat idiomatic prin forma neaccentuată românească „le”.
- source_word: Ὑμεῖς
  choice: voi
  rationale: Pronumele explicit are valoare emfatică; „voi” păstrează contrastul cu părerile altora din context.
- source_word: δὲ
  choice: Dar
  rationale: Conjuncția marchează aici contrastul dintre opinia oamenilor și răspunsul discipolilor.
- source_word: τίνα
  choice: cine
  rationale: Pronumele interogativ este redat natural în română prin „cine”, în propoziția predicativă dependentă.
- source_word: με
  choice: sunt
  rationale: Acuzativul με, subiect al infinitivului în construcția greacă, este restructurat idiomatic în română ca subiect subînțeles la persoana întâi singular.
- source_word: λέγετε
  choice: spuneți
  rationale: Prezentul indicativ, persoana a doua plural, este redat direct prin „spuneți”.
- source_word: εἶναι
  choice: că sunt
  rationale: Construcția greacă cu acuzativ și infinitiv este redată printr-o propoziție finită introdusă de „că”, forma firească în româna modernă.
theological_decisions:
- issue: Accentul pus pe mărturisirea personală a discipolilor
  choice: „Dar voi cine spuneți că sunt?”
  alternative: „Dar cine spuneți voi că sunt?”
  rationale: Așezarea lui „voi” imediat după „Dar” păstrează contrastul exprimat de pronumele grec explicit, fără a introduce în verset conținutul mărturisirii care urmează.
translation_notes:
  register: Română standard modernă, naturală și demnă. Formularea păstrează prezentul narativ și emfaza asupra lui „voi”, evitând literalismul nefiresc al construcției „cine spuneți că sunt eu?”.
