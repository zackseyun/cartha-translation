id: MAT.16.14
reference: Matthew 16:14
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Οἱ μὲν Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἕτεροι δὲ Ἰερεμίαν ἢ ἕνα τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/014.yaml
  text: And they said[a], “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”
translation:
  language: ro
  text: 'Ei au răspuns: „Unii spun: «Ioan Botezătorul»; alții: «Ilie»; iar alții: «Ieremia sau unul dintre profeți».”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau, mai explicit: „Unii spun că ești Ioan Botezătorul, alții Ilie, iar alții Ieremia sau unul dintre profeți.”'
    reason: Clarifică obiectul subînțeles al identificărilor din formularea eliptică grecească.
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Ei au răspuns
  rationale: În contextul unei întrebări, εἶπαν se redă firesc prin „au răspuns”; δέ susține continuarea dialogului, fără a necesita un „dar” explicit.
- source_word: Οἱ μὲν
  choice: Unii spun
  rationale: μέν deschide o enumerare distributivă, continuată prin ἄλλοι și ἕτεροι; prezentul „spun” redă natural raportarea opiniilor curente.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Ioan Botezătorul
  rationale: Forma consacrată și clară în româna biblică modernă pentru titlul βαπτιστής.
- source_word: ἄλλοι δὲ
  choice: alții
  rationale: Continuă distribuirea grupurilor; particula δέ nu cere aici marcarea unui contrast puternic.
- source_word: Ἠλίαν
  choice: Ilie
  rationale: Forma românească tradițională și standard a numelui profetului.
- source_word: ἕτεροι δὲ
  choice: iar alții
  rationale: „Iar” marchează fluent adăugarea unui al treilea grup, fără să accentueze excesiv contrastul.
- source_word: Ἰερεμίαν
  choice: Ieremia
  rationale: Forma standard românească a numelui profetului.
- source_word: ἢ ἕνα τῶν προφητῶν
  choice: sau unul dintre profeți
  rationale: Redă direct alternativa introdusă de ἤ și nu adaugă „ceilalți”, element absent din greacă.
theological_decisions:
- issue: Obiectul subînțeles al identificărilor
  choice: 'Textul păstrează formularea eliptică prin citarea directă a răspunsurilor: „Ioan Botezătorul”, „Ilie” etc.'
  alternative: „Unii spun că ești Ioan Botezătorul...”
  rationale: Greaca enumeră numele la acuzativ fără să repete explicit „că ești”. În română, reproducerea răspunsurilor ca formulări citate păstrează elipsa și rămâne limpede în context; nota oferă explicitarea posibilă.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. Punctuația cu două puncte și citate interne face enumerarea eliptică naturală, fără a introduce în text cuvinte care nu sunt exprimate în versetul grecesc.
