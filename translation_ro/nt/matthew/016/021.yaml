id: MAT.16.21
reference: Matthew 16:21
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ⸂ὁ Ἰησοῦς⸃ δεικνύειν τοῖς μαθηταῖς αὐτοῦ ὅτι δεῖ αὐτὸν ⸂εἰς Ἱεροσόλυμα ἀπελθεῖν⸃ καὶ πολλὰ παθεῖν ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/021.yaml
  text: From that time Jesus began to show his disciples that he must go to Jerusalem and suffer many things from the elders and chief priests and scribes[a], and be killed[c][b], and on the third day be raised.
translation:
  language: ro
  text: Din acel moment, Isus a început să le arate ucenicilor săi că trebuie să meargă la Ierusalim, să sufere multe[a] din partea bătrânilor, a marilor preoți și a cărturarilor[b], să fie omorât și, în a treia zi, să fie înviat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „să sufere mult”. Greaca spune literal „să sufere multe”, subliniind varietatea suferințelor.
    reason: alternativă lexicală
  - marker: b
    text: Sau „de mâna bătrânilor, a marilor preoți și a cărturarilor”.
    reason: alternativă de redare a relației exprimate prin ἀπό
  - marker: c
    text: 'Sau „să învie”. În greacă, forma este pasivă: „să fie înviat”.'
    reason: alternativă lexicală și păstrarea diatezei
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Din acel moment
  rationale: Marchează în mod natural și demn un punct de cotitură în narațiune; alternativa „De atunci înainte” ar accentua mai explicit continuitatea.
- source_word: ἤρξατο δεικνύειν
  choice: a început să le arate
  rationale: Păstrează atât caracterul inaugural al acțiunii, cât și sensul de a face cunoscut sau limpede, fără a restrânge verbul la simpla explicație verbală.
- source_word: δεῖ αὐτὸν
  choice: trebuie să
  rationale: Redă concis necesitatea exprimată de δεῖ, fără a preciza în text sursa acestei necesități.
- source_word: εἰς Ἱεροσόλυμα ἀπελθεῖν
  choice: să meargă la Ierusalim
  rationale: Formulare românească firească pentru deplasarea spre o destinație; „să plece la Ierusalim” ar pune un accent suplimentar pe părăsirea locului prezent.
- source_word: πολλὰ παθεῖν
  choice: să sufere multe
  rationale: Redă neutru plural πολλὰ și sugerează multitudinea suferințelor, rămânând idiomatic în română.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: din partea bătrânilor, a conducătorilor preoților și a cărturarilor
  rationale: „Din partea” exprimă natural relația de sursă sau agenție a lui ἀπό și permite ca toate cele trei grupuri să fie înțelese ca implicate în suferințe și în omorâre.
- source_word: ἀρχιερέων
  choice: conducătorilor preoților
  rationale: În plural, termenul desemnează elita preoțească, nu mai mulți titulari simultani ai funcției de mare-preot; formularea este mai transparentă pentru cititorul modern decât tradiționalul „preoților celor mai de seamă”.
- source_word: γραμματέων
  choice: cărturarilor
  rationale: Este echivalentul românesc consacrat și apropiat lexical; o notă explică funcția lor pentru cititorul modern.
- source_word: ἀποκτανθῆναι
  choice: să fie omorât
  rationale: Păstrează pasivul și redă direct acțiunea violentă; „să fie dat la moarte” ar introduce o nuanță procedurală absentă din verb.
- source_word: τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι
  choice: a treia zi, să fie înviat
  rationale: Păstrează atât reperul temporal, cât și forma pasivă a infinitivului grec.
theological_decisions:
- issue: Forța necesității exprimate prin δεῖ
  choice: trebuie să
  alternative: este necesar ca el să
  rationale: Textul afirmă necesitatea drumului, suferinței, morții și învierii, dar nu precizează aici dacă aceasta este explicată prin hotărârea lui Dumnezeu, împlinirea Scripturilor sau altfel; formularea păstrează tensiunea.
- issue: Relația sintactică a expresiei ἀπὸ τῶν... cu suferința și omorârea
  choice: Păstrarea expresiei „din partea...” imediat după suferințe, fără repetarea agenților la „să fie omorât”
  alternative: „să sufere multe și să fie omorât de către...”
  rationale: Ordinea greacă leagă explicit expresia de „să sufere multe”, dar contextul permite ca agenția să se extindă și asupra omorârii. Traducerea nu forțează o singură analiză, iar nota semnalează sensul firesc.
- issue: Vocea lui ἐγερθῆναι
  choice: să fie înviat
  alternative: să învie
  rationale: Infinitivul grec este pasiv. Păstrarea pasivului nu numește explicit agentul și lasă intactă formularea teologică a textului.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. „Bătrânii” și „cărturarii” păstrează terminologia biblică recognoscibilă, iar „conducătorii preoților” clarifică pentru cititorul actual sensul pluralului ἀρχιερεῖς. Coordonarea repetată prin „să” urmărește succesiunea infinitivelor grecești și menține solemnitatea predicției.
