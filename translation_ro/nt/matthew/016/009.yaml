  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: οὔπω νοεῖτε, οὐδὲ μνημονεύετε τοὺς πέντε ἄρτους τῶν πεντακισχιλίων καὶ πόσους κοφίνους ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/009.yaml
  text: Do you still not understand[a], nor do you remember the five loaves for the five thousand[b], and how many baskets you gathered?
translation:
  language: ro
  text: Tot nu înțelegeți și nici nu vă amintiți de cele cinci pâini pentru cei cinci mii de oameni și de câte coșuri ați strâns?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὔπω
  choice: tot nu
  rationale: Redă firesc în română forța temporală a adverbului în întrebarea mustrătoare; sensul literal alternativ este „încă nu”.
- source_word: νοεῖτε
  choice: înțelegeți
  rationale: În context, verbul privește înțelegerea semnificației faptelor anterioare, nu simpla percepție.
- source_word: οὐδὲ
  choice: și nici nu
  rationale: Leagă natural în română cele două verbe negate, păstrând coordonarea greacă.
- source_word: μνημονεύετε
  choice: vă amintiți
  rationale: Este echivalentul românesc direct și curent pentru evocarea minunii anterioare.
- source_word: τοὺς πέντε ἄρτους
  choice: cele cinci pâini
  rationale: „Pâini” este termenul românesc firesc pentru pâinile întregi din relatarea hrănirii mulțimii.
- source_word: τῶν πεντακισχιλίων
  choice: pentru cei cinci mii
  rationale: 'Face explicită relația contextuală: cele cinci pâini folosite la hrănirea celor cinci mii.'
- source_word: πόσους κοφίνους
  choice: câte coșuri
  rationale: Păstrează imaginea concretă și întrebarea privitoare la numărul coșurilor.
- source_word: ἐλάβετε
  choice: ați strâns
  rationale: În contextul adunării resturilor, redă idiomatic acțiunea exprimată de λαμβάνω, fără a impune sensul general „a primi”.
