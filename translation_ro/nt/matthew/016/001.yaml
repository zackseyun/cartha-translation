id: MAT.16.1
reference: Matthew 16:1
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ Φαρισαῖοι καὶ Σαδδουκαῖοι πειράζοντες ἐπηρώτησαν αὐτὸν σημεῖον ἐκ τοῦ οὐρανοῦ ἐπιδεῖξαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/001.yaml
  text: And the Pharisees and Sadducees came and[a], testing him, asked him to show them a sign from heaven.
translation:
  language: ro
  text: Fariseii și saducheii s-au apropiat de Isus și, punându-l la încercare[a], i-au cerut să le arate un semn din cer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „ispitindu-l” ori „încercând să-l prindă în capcană”.'
    reason: Alternativă lexicală pentru πειράζοντες, ale cărui nuanțe pot include testarea, ispitirea sau încercarea de compromitere.
lexical_decisions:
- source_word: προσελθόντες
  choice: s-au apropiat de Isus
  rationale: Participiul aorist descrie apropierea de el înaintea cererii. Reluarea explicită a lui Isus este firească în română și clarifică referentul pronumelui grec.
- source_word: Φαρισαῖοι
  choice: Fariseii
  rationale: Denumirea consacrată în limba română pentru această grupare iudaică.
- source_word: Σαδδουκαῖοι
  choice: saducheii
  rationale: Denumirea consacrată în limba română pentru această grupare iudaică.
- source_word: πειράζοντες
  choice: punându-l la încercare
  rationale: Redă sensul de testare cu intenție ostilă fără a preciza mai mult decât spune textul grec; construcția participială românească păstrează raportul cu acțiunea principală.
- source_word: ἐπηρώτησαν
  choice: i-au cerut
  rationale: În construcție cu infinitivul ἐπιδεῖξαι, verbul exprimă aici o cerere, nu doar adresarea unei întrebări; formularea este naturală în română.
- source_word: σημεῖον
  choice: un semn
  rationale: Păstrează termenul general al textului grec, fără a adăuga explicit caracterul miraculos sugerat de context.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: din cer
  rationale: Redare idiomatică a originii semnului, păstrând formularea teologic încărcată, dar neexplicată, a sursei.
- source_word: ἐπιδεῖξαι
  choice: să le arate
  rationale: Redă natural în română infinitivul complementar și păstrează ideea unei manifestări vizibile oferite lor.
theological_decisions:
- issue: Nuanța ostilă a cererii fariseilor și saducheilor
  choice: punându-l la încercare
  alternative: ispitindu-l; încercând să-l prindă în capcană
  rationale: Formularea păstrează caracterul advers al acțiunii și sensul lexical al lui πειράζω, fără a-l restrânge la ispitire morală sau a introduce explicit imaginea unei capcane.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. Ordinea propoziției este adaptată sintaxei românești, iar termenii tradiționali „fariseii”, „saducheii”, „semn” și „cer” sunt păstrați fără explicații confesionale.
