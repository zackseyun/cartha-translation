id: MAT.16.24
reference: Matthew 16:24
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/024.yaml
  text: Then Jesus said to his disciples[a], “If anyone wants to come after me, let him deny himself and take up his cross and follow me.”
translation:
  language: ro
  text: 'Atunci Isus le-a spus ucenicilor săi: „Dacă vrea cineva să vină după mine, să se lepede de sine, să-și ia crucea și să mă urmeze.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Atunci
  rationale: Redă firesc marcatorul temporal care leagă această rostire de episodul precedent.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ucenicilor săi
  rationale: „Ucenici” este termenul consacrat și exact pentru relația dintre învățător și cei care îl urmează.
- source_word: Εἴ τις θέλει
  choice: Dacă vrea cineva
  rationale: Păstrează condiția, voința exprimată de θέλει și sfera generală a pronumelui τις, într-o formulare românească naturală.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: să vină după mine
  rationale: Păstrează metafora poziționării în urma lui Isus și nu o confundă cu verbul explicit „să mă urmeze” de la sfârșit.
- source_word: ἀπαρνησάσθω ἑαυτὸν
  choice: să se lepede de sine
  rationale: Redă imperativul decisiv al renunțării la revendicarea de sine; „de sine” păstrează referința reflexivă generală și are registru demn.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: să-și ia crucea
  rationale: „Să-și ia” exprimă luarea crucii pentru a o purta și păstrează posesivul reflexiv, adică propria cruce a fiecăruia.
- source_word: ἀκολουθείτω μοι
  choice: să mă urmeze
  rationale: Este echivalentul românesc direct și natural; contextul uceniciei permite ca valoarea continuă a imperativului prezent să rămână implicită.
theological_decisions:
- issue: Caracterul universal al chemării și formele gramaticale la singular
  choice: „Dacă vrea cineva... să se lepede de sine, să-și ia... să mă urmeze”
  alternative: „Dacă vreun bărbat vrea... să se lepede de el însuși...”
  rationale: Greaca folosește singularul masculin în sens reprezentativ, nu pentru a limita chemarea la bărbați. Româna poate păstra natural singularul și universalitatea prin „cineva”, fără să adauge o restrângere de gen.
- issue: Relația dintre venirea după Isus și urmarea lui
  choice: Se păstrează atât „să vină după mine”, cât și „să mă urmeze”
  alternative: Contopirea ambelor expresii într-o singură formulare despre ucenicie
  rationale: Textul grec folosește două expresii distincte; păstrarea lor conservă progresia și forța chemării fără a-i reduce tensiunea.
translation_notes:
  register: Română standard modernă, cu formulare limpede și demnă. Construcțiile conjunctivale redau natural imperativele grecești de persoana a treia. Pronumele reverențiale nu sunt adăugate, iar majusculele teologice care nu apar în sursă sunt evitate.
