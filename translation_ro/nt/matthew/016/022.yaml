id: MAT.16.22
reference: Matthew 16:22
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ προσλαβόμενος αὐτὸν ὁ Πέτρος ἤρξατο ἐπιτιμᾶν αὐτῷ λέγων· Ἵλεώς σοι, κύριε· οὐ μὴ ἔσται σοι τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/022.yaml
  text: And Peter took him aside and began to rebuke him[a], saying, “Far be it from you, Lord; this will certainly not happen to you.”
translation:
  language: ro
  text: 'Petru l-a luat deoparte și a început să-l mustre, spunând: „Să fii cruțat, Doamne![a] Așa ceva nicidecum nu ți se va întâmpla.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Expresia grecească este idiomatică și eliptică; se poate reda și: „Doamne, să te ferească Dumnezeu!” sau „Nicidecum, Doamne!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσλαβόμενος
  choice: l-a luat deoparte
  rationale: Participiul mediu sugerează că Petru l-a tras pe Isus spre sine pentru o intervenție separată; formularea românească redă firesc această nuanță contextuală.
- source_word: ἤρξατο ἐπιτιμᾶν
  choice: a început să-l mustre
  rationale: Redă construcția ingresivă ἤρξατο + infinitiv și forța verbului ἐπιτιμάω, fără a o atenua.
- source_word: Ἵλεώς σοι
  choice: Să-ți fie cruțat
  rationale: Expresia greacă este eliptică și idiomatică. Această redare păstrează ideea de îndurare/cruțare și protestul lui Petru, fără a introduce explicit numele lui Dumnezeu, absent din text.
- source_word: κύριε
  choice: Doamne
  rationale: Este vocativul românesc firesc pentru κύριε și păstrează atât adresarea respectuoasă, cât și rezonanța cristologică.
- source_word: οὐ μὴ ἔσται σοι τοῦτο
  choice: Așa ceva nicidecum nu ți se va întâmpla
  rationale: „Nicidecum” împreună cu viitorul redă negația greacă emfatică οὐ μή, iar „nu ți se va întâmpla” exprimă natural construcția cu σοι.
theological_decisions:
- issue: Redarea protestului lui Petru fără explicitare teologică nejustificată
  choice: Să-ți fie cruțat, Doamne!
  alternative: Doamne, să te ferească Dumnezeu! / Nicidecum, Doamne!
  rationale: Ἵλεώς σοι este o formulă eliptică, iar agentul milei sau al cruțării nu este exprimat. Textul principal păstrează această elipsă pe cât permite româna, iar nota consemnează variantele idiomatice fără a impune una drept singurul sens.
translation_notes:
  register: Română standard modernă, cu ton narativ demn și accesibil. „A mustra” păstrează caracterul surprinzător de puternic al reacției lui Petru, iar topica și punctuația fac limpede că exclamația aparține vorbirii sale.
