  naturalness: '„Să-ți fie cruțat” nu este firesc în româna standard în acest context: construcția sugerează că un obiect neexprimat ar fi cruțat „pentru tine”, nu că persoana adresată ar fi cruțată. „Să fii cruțat” este gramatical, clar și păstrează caracterul eliptic al formulei.'
