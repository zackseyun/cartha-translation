id: MAT.16.4
reference: Matthew 16:4
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ. καὶ καταλιπὼν αὐτοὺς ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/004.yaml
  text: An evil and adulterous generation seeks a sign[a], and no sign will be given to it except the sign of Jonah. And leaving them[b], he went away.
translation:
  language: ro
  text: O generație rea și adulteră[a] caută un semn și nu i se va da niciun semn, în afară de semnul lui Iona[b]. Și, lăsându-i, a plecat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „necredincioasă”. Termenul grecesc înseamnă literal „adulteră” și probabil evocă limbajul profetic despre infidelitatea față de Dumnezeu.
    reason: lexical_alternative
  - marker: b
    text: „Semnul lui Iona” este explicat în Matei 12:39–40 prin cele trei zile și trei nopți ale lui Iona, ca un tipar aplicat Fiului Omului.
    reason: cross_reference
lexical_decisions:
- source_word: Γενεὰ
  choice: generație
  rationale: 'Redă direct sensul obișnuit al lui γενεά în Matei: generația contemporană caracterizată prin necredință. Evită sensurile suplimentare pe care le-ar putea sugera „neam”.'
- source_word: πονηρὰ
  choice: rea
  rationale: Este echivalentul românesc direct și firesc pentru calificarea morală exprimată de πονηρά.
- source_word: μοιχαλὶς
  choice: adulteră
  rationale: Păstrează metafora puternică a adulterului din greacă și lasă deschisă aluzia profetică la infidelitatea față de Dumnezeu.
- source_word: σημεῖον
  choice: semn
  rationale: Redă termenul fără a adăuga explicit ideea de miracol, pe care contextul o poate sugera, dar greaca nu o exprimă aici printr-un calificativ.
- source_word: ἐπιζητεῖ
  choice: caută
  rationale: Redare directă și naturală; nu impune nuanța mai puternică „cere cu insistență”, deși contextul poate implica ostilitate.
- source_word: οὐ δοθήσεται αὐτῇ
  choice: nu i se va da
  rationale: Păstrează construcția pasivă și pronumele care se referă la generație, într-o formulare românească firească.
- source_word: εἰ μὴ
  choice: în afară de
  rationale: Exprimă limpede excepția unică introdusă de εἰ μή în această construcție.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: semnul lui Iona
  rationale: Păstrează concizia și ambiguitatea genitivului grec, fără a introduce în text explicația tipologică din Matei 12:39–40.
- source_word: καταλιπὼν αὐτοὺς
  choice: lăsându-i
  rationale: Redă participiul aorist și referirea la interlocutori fără completări absente din text.
- source_word: ἀπῆλθεν
  choice: a plecat
  rationale: Formulare modernă și naturală pentru îndepărtarea lui Isus de acolo.
theological_decisions:
- issue: Sensul expresiei „generație adulteră”
  choice: Metafora „adulteră” este păstrată în textul principal.
  alternative: „generație necredincioasă” sau „generație infidelă”
  rationale: Limbajul poate evoca infidelitatea spirituală și legământală din profeți, dar termenul grec folosește metafora adulterului. Traducerea nu restrânge sensul la o singură interpretare.
- issue: Sensul expresiei „semnul lui Iona”
  choice: Expresia este redată literal și rămâne neexplicată în textul principal.
  alternative: O explicitare directă a morții și învierii lui Isus
  rationale: Matei 12:39–40 dezvoltă semnificația tipologică, însă versetul de față păstrează formula concisă; explicitarea în text ar rezolva o tensiune pe care originalul o lasă deschisă.
translation_notes:
  register: Română standard modernă, cu registru demn și accesibil. Sintaxa rămâne apropiată de greacă acolo unde este firească, iar termenii-cheie și metaforele sunt păstrate fără suprainterpretare.
