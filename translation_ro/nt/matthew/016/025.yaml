id: MAT.16.25
reference: Matthew 16:25
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/025.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will find it.
translation:
  language: ro
  text: Căci oricine vrea să-și salveze viața o va pierde[a], dar oricine își pierde viața pentru Mine o va găsi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „sufletul” în tot versetul; termenul grecesc psychē poate însemna, după context, „viață”, „sine” sau „suflet”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἐὰν / ὃς δ’ ἂν
  choice: Căci oricine... dar oricine
  rationale: Construcțiile relative cu ἐὰν/ἂν exprimă condiții generale nedefinite. „Oricine” este formularea românească firească; „căci” păstrează legătura explicativă a lui γάρ cu versetul precedent, iar „dar” redă contrastul marcat de δέ.
- source_word: θέλῃ
  choice: vrea
  rationale: θέλω exprimă aici voința sau dorința; „vrea” este direct, actual și natural în româna standard.
- source_word: ψυχὴν
  choice: viața
  rationale: În paradoxul despre ucenicie, ψυχή desemnează viața persoanei, dar poate avea și sensurile „suflet” sau „sine”. „Viața” se potrivește cel mai firesc cu verbele „a salva”, „a pierde” și „a găsi”, fără a elimina alternativa lexicală, consemnată în notă.
- source_word: σῶσαι
  choice: să-și salveze
  rationale: σῴζω înseamnă „a salva” sau „a păstra”. „Să-și salveze” menține paralelismul verbal și exprimă limpede încercarea persoanei de a-și cruța viața.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: o va pierde / își pierde
  rationale: ἀπόλλυμι are aici sensul de pierdere a vieții, nu trebuie restrâns la ideea de anihilare. Viitorul din prima propoziție este păstrat, iar aoristul conjunctiv din condiția generală este redat firesc prin prezent.
- source_word: ἕνεκεν ἐμοῦ
  choice: pentru Mine
  rationale: ἕνεκεν cu genitivul indică motivul sau cauza. „Pentru Mine” este concis și natural și păstrează accentul pus pe devotamentul personal față de Isus.
- source_word: εὑρήσει
  choice: o va găsi
  rationale: εὑρίσκω înseamnă direct „a găsi”. Redarea literal-firească păstrează forța paradoxului și evită explicarea lui prin „a câștiga”.
- source_word: αὐτοῦ / αὐτήν
  choice: își / o
  rationale: Pronumele reflexiv posesiv „își” redă natural în română raportarea vieții la subiectul generic „oricine”, iar „o” se referă fără echivoc la substantivul feminin „viața”.
theological_decisions:
- issue: Redarea lui ψυχή în paradoxul uceniciei
  choice: viață
  alternative: suflet; sine
  rationale: Contextul vorbește despre urmarea lui Isus și asumarea morții, iar succesiunea „salva–pierde–găsi” susține sensul de „viață”. Totuși, ψυχή are un câmp semantic mai larg, astfel că alternativa tradițională și teologic semnificativă „suflet” este păstrată în nota de subsol, fără a îngusta artificial sensul.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. Formularea păstrează paralelismul și paradoxul originalului. Majuscula reverențială din „Mine” urmează uzul editorial românesc pentru referirea directă la Isus, fără a adăuga conținut interpretativ.
