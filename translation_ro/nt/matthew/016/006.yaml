id: MAT.16.6
reference: Matthew 16:6
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ὁρᾶτε καὶ προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/006.yaml
  text: But Jesus said to them[a], “Watch out and beware of the leaven of the Pharisees and Sadducees.”
translation:
  language: ro
  text: 'Dar Isus le-a spus: „Luați seama și păziți-vă de drojdia fariseilor și a saducheilor!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Dar
  rationale: Marchează un contrast ușor sau o tranziție față de contextul precedent; „Dar” redă firesc această funcție în română.
- source_word: εἶπεν αὐτοῖς
  choice: le-a spus
  rationale: Redare românească naturală și fidelă a verbului λέγω urmat de obiectul indirect.
- source_word: Ὁρᾶτε
  choice: Luați seama
  rationale: Imperativul lui ὁράω are aici valoare de avertizare, nu simplul sens vizual „vedeți”.
- source_word: προσέχετε
  choice: păziți-vă
  rationale: Păstrează al doilea imperativ și intensificarea avertismentului, fără a contopi cele două verbe.
- source_word: ἀπὸ
  choice: de
  rationale: După „păziți-vă”, prepoziția românească firească este „de”, corespunzând construcției grecești de avertizare cu ἀπό.
- source_word: ζύμης
  choice: aluatul
  rationale: „Aluat” păstrează imaginea agentului de dospire și rezonanța metaforică a termenului grec; alternativa modernă „drojdie” este indicată în notă.
- source_word: Φαρισαίων
  choice: fariseilor
  rationale: Forma consacrată în limba română pentru numele grupului.
- source_word: Σαδδουκαίων
  choice: saducheilor
  rationale: Forma consacrată în limba română pentru numele grupului.
theological_decisions:
- issue: Forța metaforică a termenului ζύμη
  choice: Metafora „aluatul” este păstrată fără explicație în textul principal.
  alternative: „învățătura” sau „influența” fariseilor și a saducheilor
  rationale: Deși contextul ulterior explică metafora prin raportare la învățătură, acest vers folosește termenul figurat ζύμη. Păstrarea lui evită introducerea prematură a explicației și menține desfășurarea narativă.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. Perechea de imperative „Luați seama și păziți-vă” conservă repetarea retorică și forța avertismentului din greacă.
