id: MAT.16.8
reference: Matthew 16:8
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς ⸀εἶπεν· Τί διαλογίζεσθε ἐν ἑαυτοῖς, ὀλιγόπιστοι, ὅτι ἄρτους οὐκ ⸀ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/008.yaml
  text: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you have no bread?”
translation:
  language: ro
  text: 'Dar Isus, știind aceasta, a zis: „De ce discutați între voi, voi, cei cu puțină credință, despre faptul că nu ați luat pâini?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „De ce discutați între voi, voi, cei cu puțină credință, pentru că nu ați luat pâini?”'
    reason: Ambiguitatea lui ὅτι, care poate introduce fie conținutul discuției, fie cauza ei.
lexical_decisions:
- source_word: γνοὺς
  choice: știind aceasta
  rationale: Participiul aorist indică faptul că Isus a cunoscut discuția înainte de a răspunde; „aceasta” redă natural în română obiectul implicit din context.
- source_word: δὲ
  choice: Dar
  rationale: Marchează trecerea contrastantă de la preocuparea ucenicilor la răspunsul lui Isus.
- source_word: διαλογίζεσθε ἐν ἑαυτοῖς
  choice: discutați între voi
  rationale: Redă deliberarea reciprocă a ucenicilor într-o română actuală și firească, fără a exclude nuanța de raționare.
- source_word: ὀλιγόπιστοι
  choice: voi, cei cu puțină credință
  rationale: Păstrează mustrarea directă privind credința insuficientă și evită forma românească ambiguă „puțin credincioșilor”, care poate sugera lipsă de fidelitate.
- source_word: ἄρτους οὐκ ἐλάβετε
  choice: nu ați luat pâini
  rationale: Păstrează atât pluralul concret ἄρτους, cât și sensul de bază al lui λαμβάνω; în context, este vorba despre faptul că ucenicii nu luaseră pâine cu ei.
theological_decisions:
- issue: Forța mustrării ὀλιγόπιστοι
  choice: Mustrare adresată credinței insuficiente a ucenicilor
  alternative: Simplă observație despre neînțelegerea lor
  rationale: Termenul menționează explicit puținătatea credinței; traducerea păstrează această tensiune teologică fără a o transforma într-o afirmație doctrinară mai largă.
- issue: Funcția lui ὅτι
  choice: 'Introduce conținutul discuției: „despre faptul că”'
  alternative: 'Introduce cauza discuției: „pentru că”'
  rationale: În context, construcția poate fi înțeleasă drept conținutul deliberării, dar valoarea cauzală rămâne posibilă și este păstrată în nota de subsol.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. Repetiția intenționată „între voi, voi” delimitează vocativul și păstrează adresarea directă, deși poate fi netezită editorial prin punctuație.
