  text: τότε συνῆκαν ὅτι οὐκ εἶπεν προσέχειν ἀπὸ τῆς ζύμης ⸂τῶν ἄρτων⸃ ἀλλὰ ἀπὸ τῆς διδαχῆς τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/012.yaml
  text: Then they understood that he had not said to beware of the leaven of bread[a], but of the teaching of the Pharisees and Sadducees.
translation:
  language: ro
  text: Atunci au înțeles că nu le spusese să se păzească de aluatul pâinii[a], ci de învățătura fariseilor și a saducheilor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „aluatul pâinilor”. Greaca are aici un substantiv la plural.'
    reason: alternativă lexicală
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Redă firesc adverbul temporal și marchează momentul în care ucenicii ajung la înțelegere.
- source_word: συνῆκαν
  choice: au înțeles
  rationale: Aoristul indică ajungerea la înțelegerea sensului spuselor lui Isus; formularea este clară și idiomatică.
- source_word: οὐκ εἶπεν
  choice: nu le spusese
  rationale: Mai-mult-ca-perfectul românesc exprimă natural anterioritatea avertismentului față de momentul înțelegerii; pronumele «le» explicitează firesc complementul subînțeles din context.
- source_word: προσέχειν ἀπό
  choice: să se păzească de
  rationale: În contextul unui avertisment, construcția are sensul de a fi în gardă față de ceva; expresia românească este naturală și păstrează forța avertizării.
- source_word: τῆς ζύμης
  choice: aluatul
  rationale: «Aluat» păstrează metafora biblică și este termenul românesc firesc pentru agentul de dospire în acest context.
- source_word: τῶν ἄρτων
  choice: pâinilor
  rationale: Păstrează pluralul explicit al substantivului grec și legătura cu pâinile discutate în context, fără a transforma expresia într-un substantiv colectiv singular.
- source_word: ἀλλὰ
  choice: ci
  rationale: După negație, «ci» exprimă precis contrastul corectiv dintre sensul literal și referentul metaforic.
- source_word: τῆς διδαχῆς
  choice: învățătura
  rationale: Redă clar conținutul transmis de farisei și saduchei, într-un registru actual și demn, fără jargon confesional inutil.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: fariseilor și a saducheilor
  rationale: Folosește formele consacrate în română pentru numele celor două grupări și marchează natural dependența genitivală.
theological_decisions:
- issue: Forța metaforică a «aluatului»
  choice: Metafora este păstrată, iar explicația ei este limitată la «învățătura fariseilor și a saducheilor».
  alternative: O explicitare interpretativă precum «învățătura corupătoare», «ipocrizia» sau «învățătura greșită».
  rationale: Versetul identifică aluatul cu învățătura, dar nu îi adaugă aici o caracterizare morală explicită. Traducerea nu importă precizări din pasaje paralele și păstrează nivelul de explicație al textului.
translation_notes:
  register: Română standard modernă, cu sintaxă naturală și registru demn. «Ci» redă contrastul corectiv după negație, iar «pâinilor» păstrează pluralul lecturii tipărite în SBLGNT. Nota semnalează variația textuală indicată de marcajele critice ale ediției.
