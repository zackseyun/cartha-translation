  text: Nici de cele șapte pâini ale celor patru mii și câte coșuri mari ați strâns?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: Nici
  rationale: Continuă seria de întrebări din context și păstrează valoarea negativă/aditivă a termenului grec; în română, construcția depinde firesc de întrebarea precedentă.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: de cele șapte pâini
  rationale: „Pâini” redă concret ἄρτους, iar prepoziția „de” este cerută idiomatic de verbul „a-și aminti”, subînțeles din versetul anterior.
- source_word: τῶν τετρακισχιλίων
  choice: pentru cei patru mii
  rationale: Genitivul indică aici episodul hrănirii celor patru mii; „pentru” exprimă natural în română relația contextuală.
- source_word: πόσας
  choice: câte
  rationale: Redă direct adjectivul interogativ care determină substantivul „coșuri”.
- source_word: σπυρίδας
  choice: coșuri mari
  rationale: σπυρίς desemnează un coș încăpător; adjectivul „mari” păstrează deosebirea lexicală față de κόφινος din relatarea celeilalte hrăniri.
- source_word: ἐλάβετε
  choice: ați ridicat
  rationale: În contextul adunării resturilor, exprimă luarea și ridicarea coșurilor, rămânând aproape de sensul verbului grec fără o formulare arhaică.
