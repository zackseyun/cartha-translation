- from: Nici[a] de cele șapte pâini pentru cei patru mii și câte coșuri mari ați ridicat?
  to: Nici de cele șapte pâini ale celor patru mii și câte coșuri mari ați strâns?
  rationale: Revizuirea păstrează elipsa intenționată, legată de întrebarea precedentă, redă mai direct genitivul grec prin „ale celor patru mii” și elimină o notă care oferea o alternativă mai puțin fidelă funcției lui οὐδέ. „Ați strâns” precizează natural acțiunea de adunare a coșurilor cu resturi în contextul relatării.
