  text: Καὶ ἐλθόντες οἱ ⸀μαθηταὶ εἰς τὸ πέραν ἐπελάθοντο ἄρτους λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/005.yaml
  text: And when the disciples came to the other side[a], they had forgotten to take bread.
translation:
  language: ro
  text: Când ucenicii au ajuns pe celălalt țărm, uitaseră să ia pâini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθόντες
  choice: când ... au ajuns
  rationale: Participiul aorist este redat printr-o propoziție temporală firească în română, păstrând raportul său cu verbul principal.
- source_word: οἱ μαθηταὶ
  choice: ucenicii
  rationale: Este termenul consacrat și natural în Evanghelii pentru discipolii lui Isus.
- source_word: εἰς τὸ πέραν
  choice: pe celălalt țărm
  rationale: În contextul traversării lacului, exprimă idiomatic și precis ajungerea pe malul opus.
- source_word: ἐπελάθοντο
  choice: uitaseră
  rationale: Mai-mult-ca-perfectul românesc arată firesc că omisiunea de a lua pâini avusese loc înainte de sosirea lor.
- source_word: ἄρτους
  choice: pâini
  rationale: Păstrează pluralul concret al substantivului grec și se potrivește contextului proviziilor luate pentru drum.
- source_word: λαβεῖν
  choice: să ia
  rationale: Redă direct infinitivul complementar după verbul «a uita».
theological_decisions: []
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea este naturală narativ, iar «pâini» păstrează numărul plural din greacă fără să necesite notă.
