id: MAT.16.17
reference: Matthew 16:17
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ⸂ἀποκριθεὶς δὲ⸃ ὁ Ἰησοῦς εἶπεν αὐτῷ· Μακάριος εἶ, Σίμων Βαριωνᾶ, ὅτι σὰρξ καὶ αἷμα οὐκ ἀπεκάλυψέν σοι ἀλλ’ ὁ πατήρ μου ὁ ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/017.yaml
  text: And Jesus answered him[a], “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you[c][b], but my Father who is in heaven did.”
translation:
  language: ro
  text: 'Iar Isus i-a răspuns: „Fericit ești, Simon Bar-Iona[a], fiindcă nu carnea și sângele[b] ți-au descoperit aceasta, ci Tatăl Meu, care este în ceruri.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „Simon, fiul lui Iona”. Greaca păstrează aici forma patronimică aramaică „Bar-Iona”.
    reason: lexical_alternative
  - marker: b
    text: Literal „carnea și sângele”, expresie care se referă la oameni sau la o sursă pur omenească.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτῷ
  choice: Iar Isus i-a răspuns
  rationale: Redă firesc în româna modernă construcția participiu + verb finit cu sensul „a răspuns și a zis”; „iar” continuă relatarea fără a accentua excesiv contrastul lui δέ.
- source_word: Μακάριος
  choice: Fericit
  rationale: „Fericit” este formula consacrată și demnă pentru μακάριος în rostirile lui Isus, exprimând starea binecuvântată, nu doar o emoție trecătoare.
- source_word: Σίμων Βαριωνᾶ
  choice: Simon Bar-Iona
  rationale: Păstrează forma patronimică aramaică transmisă prin greacă, adaptând numele la uzul românesc; sensul este explicat în notă.
- source_word: ὅτι
  choice: fiindcă
  rationale: Introduce limpede motivul declarației „Fericit ești” și sună natural în discurs direct.
- source_word: σὰρξ καὶ αἷμα
  choice: carnea și sângele
  rationale: Păstrează idiomul concret al textului-sursă și contrastul său cu revelația Tatălui; articolul hotărât face expresia firească în română.
- source_word: ἀπεκάλυψέν σοι
  choice: ți-au descoperit aceasta
  rationale: „A descoperi” păstrează ideea de dezvăluire a unui adevăr ascuns; „aceasta” explicitează obiectul subînțeles din context. Acordul la plural urmează forma coordonată „carnea și sângele”.
- source_word: ἀλλ’ ὁ πατήρ μου
  choice: ci Tatăl Meu
  rationale: „Ci” redă opoziția puternică dintre sursa omenească exclusă și Tatăl ca sursă a revelației.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: care este în ceruri
  rationale: Redă explicit construcția atributivă și păstrează pluralul grecesc „ceruri”, care este natural și familiar în registrul biblic românesc.
theological_decisions:
- issue: Sursa mărturisirii lui Petru
  choice: Expresia „carnea și sângele” exclude în general o sursă omenească, iar revelația este atribuită Tatălui.
  alternative: Expresia ar putea fi restrânsă fie la raționamentul natural al lui Petru, fie la instruirea primită de la alți oameni.
  rationale: Textul nu precizează care formă de mijlocire omenească este exclusă; traducerea păstrează contrastul larg dintre originea omenească și descoperirea venită de la Tatăl, fără a construi aici o doctrină mai amplă a inspirației.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. S-a păstrat idiomul „carnea și sângele”, explicat prin notă, precum și pluralul „în ceruri”. Majuscula reverențială din „Tatăl Meu” urmează convenția editorială românească, fără a adăuga conținut semantic textului grec.
