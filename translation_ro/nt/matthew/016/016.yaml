id: MAT.16.16
reference: Matthew 16:16
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Σίμων Πέτρος εἶπεν· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ τοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/016.yaml
  text: Simon Peter answered[a], “You are the Messiah, the Son of the living God.”
translation:
  language: ro
  text: 'Simon Petru a răspuns: „Tu ești Mesia[a], Fiul Dumnezeului celui viu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Cristos”. Titlul grecesc Χριστός înseamnă „Unsul” și corespunde titlului „Mesia”; aici este redat „Mesia” pentru a păstra clar sensul său de titlu și contextul mesianic iudaic.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: a răspuns
  rationale: Participiul ἀποκριθείς împreună cu εἶπεν introduce idiomatic un răspuns. Redarea unitară „a răspuns” evită formula greoaie „răspunzând, a zis” și păstrează funcția narativă.
- source_word: δὲ
  choice: —
  rationale: Particula marchează o continuare sau tranziție ușoară; în română, cursul narațiunii este firesc fără un corespondent explicit.
- source_word: Σίμων Πέτρος
  choice: Simon Petru
  rationale: Numele sunt redate potrivit formei românești consacrate.
- source_word: Σὺ
  choice: Tu
  rationale: Pronumele exprimat explicit în greacă are valoare emfatică, păstrată prin „Tu” la începutul enunțului.
- source_word: ὁ χριστός
  choice: Mesia
  rationale: Χριστός funcționează aici ca titlu mesianic, nu ca parte a unui nume. „Mesia” păstrează sensul titlului și contextul iudaic; forma tradițională „Cristos” este indicată în notă.
- source_word: ὁ υἱός
  choice: Fiul
  rationale: Articolul și substantivul desemnează un Fiu anume și au forță titulară; forma articulată „Fiul” o păstrează.
- source_word: τοῦ θεοῦ τοῦ ζῶντος
  choice: Dumnezeului celui viu
  rationale: Construcția genitivală și participiul atributiv sunt păstrate într-o formulare românească naturală și solemnă, care exprimă relația filială și calificativul „viu”.
theological_decisions:
- issue: Redarea lui Χριστός ca titlu sau ca formă tradițională
  choice: Mesia
  alternative: Cristos
  rationale: În mărturisirea lui Petru, termenul este un titlu mesianic. „Mesia” face transparentă această funcție, iar nota păstrează echivalentul tradițional direct al grecescului Χριστός.
- issue: Forța expresiei „Fiul lui Dumnezeu”
  choice: Fiul Dumnezeului celui viu
  alternative: Fiul lui Dumnezeu, care este viu
  rationale: Redarea păstrează formularea confesională și titulară a textului grec fără a o extinde prin explicații doctrinare ulterioare.
translation_notes:
  register: Română standard modernă, într-un registru demn și accesibil. Topica păstrează accentul pronumelui „Tu”, iar formularea evită atât arhaismul narativ „răspunzând, a zis”, cât și explicarea excesivă a afirmației teologice.
