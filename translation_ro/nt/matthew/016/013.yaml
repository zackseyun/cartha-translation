reference: Matthew 16:13
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ ὁ Ἰησοῦς εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου ἠρώτα τοὺς μαθητὰς αὐτοῦ λέγων· ⸀Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι τὸν υἱὸν τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/013.yaml
  text: When Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
translation:
  language: ro
  text: 'Când Isus a ajuns în ținutul Cezareei lui Filip, îi întreba pe ucenicii săi: „Cine spun oamenii că este Fiul Omului[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Fiul Omului» redă expresia grecească folosită de Isus ca autodesemnare caracteristică.
    reason: Clarifică expresia-cheie fără a introduce o alternativă gramaticală nejustificată sau a-i fixa interpretarea teologică.
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: Când ... a ajuns
  rationale: Participiul aorist împreună cu δέ introduce o scenă nouă și are aici valoare temporală; formularea românească redă firesc tranziția fără a adăuga un «acum» inexistent în text.
- source_word: εἰς τὰ μέρη
  choice: în ținutul
  rationale: Pluralul idiomatic μέρη indică teritoriul sau împrejurimile unei localități, nu «părțile» ei în sens literal.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: Cezareei lui Filip
  rationale: Redarea păstrează distincția istorică a localității și exprimă natural în română construcția grecească de identificare.
- source_word: ἠρώτα
  choice: îi întreba
  rationale: Imperfectul sugerează o acțiune în desfășurare sau cadrul conversației; imperfectul românesc păstrează această nuanță.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: pe ucenicii săi
  rationale: «Ucenici» este termenul consacrat și exact în contextul Evangheliilor, iar posesivul redă explicit αὐτοῦ.
- source_word: λέγων
  choice: ':'
  rationale: În româna actuală, participiul introductiv «spunând» ar fi redundant după «îi întreba»; două puncte introduc direct și natural conținutul întrebării.
- source_word: Τίνα λέγουσιν οἱ ἄνθρωποι
  choice: Cine spun oamenii
  rationale: ἄνθρωποι are sens generic, redat prin «oamenii», iar «cine» este forma idiomatică românească în această întrebare predicativă.
- source_word: εἶναι
  choice: că este
  rationale: Discursul indirect românesc cere în mod natural o propoziție finită introdusă prin «că», păstrând sensul infinitivului grecesc.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Formula tradițională păstrează autodesemnarea caracteristică a lui Isus, ecoul intertextual și încărcătura teologică a expresiei.
theological_decisions:
- issue: Redarea expresiei ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  alternative: Omul / Cel omenesc
  rationale: Forma consacrată păstrează caracterul de autodesemnare, legăturile biblice posibile, inclusiv ecoul din Daniel 7, și ambiguitatea dintre expresie idiomatică și titlu, fără să impună o interpretare.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. S-a evitat calchierea participiului λέγων prin redundantul «spunând». Toponimul «Cezareea lui Filip» este transparent pentru cititorul român. Marcajul de notă este plasat după întrebarea la care se referă.
