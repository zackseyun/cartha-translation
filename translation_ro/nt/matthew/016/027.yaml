id: MAT.16.27
reference: Matthew 16:27
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/027.yaml
  text: For the Son of Man is about to come in the glory of his Father with his angels[b][a], and then he will repay each one according to his deed.
translation:
  language: ro
  text: Căci Fiul Omului urmează să vină[a] în slava Tatălui său, împreună cu îngerii săi, și atunci va răsplăti fiecăruia după fapta lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau „va veni” ori „este pe punctul de a veni”. Verbul grecesc păstrează ideea unei veniri iminente sau apropiate.
    reason: lexical_alternative
  - marker: b
    text: Sau „după ceea ce a făcut”. În greacă, „faptă/acțiune” este la singular și are aici sens distributiv, referindu-se la conduita fiecăruia.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλει ... ἔρχεσθαι
  choice: urmează să vină
  rationale: Construcția μέλλω + infinitiv indică o venire așteptată sau iminentă. Formularea românească păstrează această nuanță fără a o reduce la un simplu viitor.
- source_word: γὰρ
  choice: Căci
  rationale: Introduce motivul afirmației precedente și păstrează legătura argumentativă într-un registru biblic firesc, dar actual.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Fiul Omului
  rationale: Redarea consacrată păstrează forma titlului și rezonanța sa intertextuală.
- source_word: ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ
  choice: în slava Tatălui său
  rationale: Păstrează prepoziția și relația genitivală, exprimând cadrul și manifestarea gloriei în care are loc venirea.
- source_word: μετὰ τῶν ἀγγέλων αὐτοῦ
  choice: împreună cu îngerii săi
  rationale: Redă clar ideea de însoțire exprimată de μετά cu genitivul și păstrează posesivul.
- source_word: καὶ τότε
  choice: și atunci
  rationale: 'Păstrează atât legătura, cât și succesiunea temporală: venirea, apoi judecata.'
- source_word: ἀποδώσει
  choice: va da
  rationale: În context, verbul înseamnă a da fiecăruia ceea ce îi revine. «Va da» este natural, suficient de neutru pentru răsplată sau pedeapsă și evită sensul exclusiv pozitiv pe care «va răsplăti» îl poate avea în româna curentă.
- source_word: ἑκάστῳ
  choice: fiecăruia
  rationale: Dativul singular are valoare distributivă și individualizează judecata.
- source_word: κατὰ τὴν πρᾶξιν αὐτοῦ
  choice: după fapta lui
  rationale: Păstrează singularul din greacă și formularea distributivă raportată la fiecare persoană, fără a extinde interpretativ sensul la plural.
theological_decisions:
- issue: Forța escatologică a construcției μέλλει ... ἔρχεσθαι
  choice: urmează să vină
  alternative: va veni
  rationale: Construcția grecească adaugă ideea unei acțiuni care se apropie sau este așteptată. Traducerea păstrează această tensiune fără a soluționa prin formulare dezbaterile despre timpul venirii.
- issue: Judecata potrivit faptei
  choice: va da fiecăruia după fapta lui
  alternative: va răsplăti pe fiecare după ceea ce a făcut
  rationale: Formularea păstrează caracterul individual și judiciar al răsplătirii, dar nu precizează dacă rezultatul este favorabil sau nefavorabil și nu introduce un sistem doctrinar mai larg.
translation_notes:
  register: Română standard modernă, demnă și accesibilă. «Căci» și «slava» păstrează registrul biblic recognoscibil, iar «urmează să vină» exprimă firesc nuanța de iminență. Majusculele din titlul «Fiul Omului» și din «Tatălui» urmează uzul editorial creștin românesc.
