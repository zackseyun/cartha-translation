  - severity: low
    issue: Nota a adaugă ideea unei veniri «așteptate».
    rationale: μέλλει + infinitiv exprimă acțiune iminentă, apropiată sau pe cale să se întâmple; nu afirmă prin sine că venirea este «așteptată».
