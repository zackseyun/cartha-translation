  to: Căci Fiul Omului urmează să vină[a] în slava Tatălui său, împreună cu îngerii săi, și atunci va răsplăti fiecăruia după fapta lui[b].
  rationale: Revizuirea precizează sensul judiciar-retributiv al lui ἀποδώσει prin «va răsplăti» și elimină din nota a o explicație care depășea valoarea lexicală a lui μέλλει. Restul formulării este păstrat, inclusiv nuanța prospectivă a lui «urmează să vină» și singularul lui πρᾶξις.
