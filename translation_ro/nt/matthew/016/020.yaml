id: MAT.16.20
reference: Matthew 16:20
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: τότε ⸀διεστείλατο τοῖς ⸀μαθηταῖς ἵνα μηδενὶ εἴπωσιν ὅτι αὐτός ⸀ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/020.yaml
  text: Then he strictly instructed the disciples to tell no one that he is the Messiah[a].
translation:
  language: ro
  text: Atunci le-a poruncit categoric ucenicilor să nu spună nimănui că el este Mesia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sau: „Cristosul”. Termenul grecesc Χριστός este un titlu care înseamnă „Unsul” și corespunde titlului „Mesia”.'
    reason: Clarifică titlul grec și consemnează redarea alternativă fără a transforma titlul într-un nume.
lexical_decisions:
- source_word: τότε
  choice: Atunci
  rationale: Marchează succesiunea în narațiune și este echivalentul românesc firesc și concis.
- source_word: διεστείλατο
  choice: le-a poruncit cu strictețe
  rationale: Verbul exprimă aici o dispoziție fermă; formularea păstrează forța interdicției fără a sugera neapărat primejdie, cum ar putea face „i-a avertizat”.
- source_word: τοῖς μαθηταῖς
  choice: ucenicilor
  rationale: Substantivul articulat se referă la grupul deja cunoscut al ucenicilor; posesivul „săi” este implicit și nu trebuie adăugat.
- source_word: ἵνα μηδενὶ εἴπωσιν
  choice: să nu spună nimănui
  rationale: Construcția cu ἵνα și conjunctivul redă conținutul poruncii, iar formularea este idiomatică în româna actuală.
- source_word: ὅτι αὐτός ἐστιν
  choice: că el este
  rationale: Redă predicația simplă și păstrează pronumele explicit din greacă, fără a introduce accentuarea suplimentară „el însuși”.
- source_word: ὁ χριστός
  choice: Mesia
  rationale: Χριστός funcționează ca titlu mesianic; „Mesia” îi comunică sensul, în loc să îl trateze ca pe un nume propriu.
theological_decisions:
- issue: Redarea titlului Χριστός
  choice: Mesia
  alternative: Cristos
  rationale: În context, termenul este titlul mesianic recunoscut, nu un simplu nume. „Mesia” păstrează legătura semantică cu unsul așteptat, iar nota consemnează alternativa tradițională.
translation_notes:
  register: Română standard modernă, clară și demnă. Formularea este concisă, păstrează fermitatea poruncii și evită atât arhaismele, cât și adaosurile interpretative.
