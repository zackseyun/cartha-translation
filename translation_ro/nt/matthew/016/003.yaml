id: MAT.16.3
reference: Matthew 16:3
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: καὶ πρωΐ· Σήμερον χειμών, πυρράζει γὰρ στυγνάζων ὁ οὐρανός. ⸀τὸ μὲν πρόσωπον τοῦ οὐρανοῦ γινώσκετε διακρίνειν, τὰ δὲ σημεῖα τῶν καιρῶν οὐ δύνασθε.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/003.yaml
  text: And in the morning[a], ‘Today, stormy weather, for the sky is red and overcast.’ You know how to discern the appearance of the sky[b], but you are not able to discern the signs of the times.
translation:
  language: ro
  text: 'Iar dimineața spuneți: „Astăzi va fi vreme rea, căci cerul este roșu și întunecat.” Știți să interpretați înfățișarea cerului, dar nu puteți interpreta semnele vremurilor[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expresia se poate referi mai precis la caracterul semnificativ din punct de vedere spiritual al momentului prezent, inclusiv la lucrările mesianice ale lui Isus.
    reason: alternative_reading
lexical_decisions:
- source_word: πρωΐ
  choice: dimineața
  rationale: Redă firesc valoarea adverbială temporală și păstrează contrastul cu observația meteorologică anterioară.
- source_word: χειμών
  choice: vreme rea
  rationale: În acest context, termenul denumește vreme furtunoasă, nu anotimpul iarna; formularea este idiomatică în româna actuală.
- source_word: πυρράζει
  choice: este roșu
  rationale: Redă direct culoarea roșiatică a cerului, fără intensificarea neimpusă „roșu ca focul”.
- source_word: στυγνάζων
  choice: întunecat
  rationale: Participiul descrie aspectul sumbru sau amenințător al cerului; „întunecat” se potrivește contextului meteorologic și rămâne ușor de înțeles.
- source_word: πρόσωπον τοῦ οὐρανοῦ
  choice: înfățișarea cerului
  rationale: „Înfățișarea” transmite sensul idiomatic al lui πρόσωπον („față”, „aspect vizibil”) într-o română naturală și demnă.
- source_word: γινώσκετε διακρίνειν
  choice: știți s-o deosebiți
  rationale: Construcția exprimă o capacitate dobândită de a evalua sau interpreta; alegerea păstrează atât ideea de cunoaștere, cât și pe cea de discernere.
- source_word: σημεῖα
  choice: semnele
  rationale: Este echivalentul firesc și tradițional, păstrând valoarea de indicii cu semnificație revelatoare.
- source_word: καιρῶν
  choice: vremurilor
  rationale: Aici καιρός se referă la momente sau perioade semnificative, nu la anotimpuri meteorologice; pluralul „vremurilor” păstrează amploarea expresiei grecești.
- source_word: οὐ δύνασθε
  choice: nu le puteți deosebi
  rationale: Redă explicit incapacitatea afirmată de verb și repetă în mod clar verbul subînțeles din a doua propoziție.
theological_decisions:
- issue: Sensul expresiei „semnele vremurilor”
  choice: Expresia este păstrată fără a-i restrânge sensul la o singură categorie de semne.
  alternative: „semnele acestei vremi” sau „semnele epocii mesianice”
  rationale: Contextul indică semnificația spirituală a momentului prezent și poate include lucrările mesianice ale lui Isus, precum și o dimensiune escatologică. Greaca nu impune limitarea la una dintre aceste nuanțe.
translation_notes:
  register: Română standard modernă, clară și demnă. S-a preferat vocabularul curent („vreme rea”, „înfățișarea cerului”), păstrând paralelismul și contrastul ascuțit al originalului.
