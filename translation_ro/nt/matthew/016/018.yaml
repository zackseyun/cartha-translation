id: MAT.16.18
reference: Matthew 16:18
language:
  code: ro
  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/018.yaml
  text: And I also say to you that you are Peter[a], and on this rock I will build my church[b], and the gates of Hades will not prevail against it.
translation:
  language: ro
  text: Iar eu îți spun că tu ești Petru, iar pe această piatră[a] îmi voi zidi biserica, iar porțile locuinței morților[b] nu o vor birui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expresia „pe această piatră” poate fi înțeleasă ca referindu-se la Petru, la mărturisirea lui Petru sau la Petru ca mărturisitor și reprezentant apostolic.
    reason: alternative_reading
  - marker: b
    text: 'Greacă: „Hades”, adică tărâmul morților; în mod tradițional, „iad”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δέ σοι λέγω
  choice: Iar eu îți spun
  rationale: „Iar” redă continuarea cu o ușoară nuanță de răspuns marcată de δέ, iar „eu” păstrează accentul lui κἀγώ fără a exagera contrastul.
- source_word: Πέτρος / πέτρα
  choice: Petru / piatră
  rationale: Forma consacrată a numelui este „Petru”, iar „piatră” păstrează cât permite româna jocul de cuvinte din greacă.
- source_word: ἐπὶ ταύτῃ τῇ πέτρᾳ
  choice: pe această piatră
  rationale: Redare directă și firească a prepoziției ἐπί cu dativul și a demonstrativului ταύτῃ.
- source_word: οἰκοδομήσω
  choice: îmi voi zidi
  rationale: „A zidi” păstrează metafora construcției; pronumele posesiv neaccentuat redă natural în română ideea exprimată de μου.
- source_word: μου τὴν ἐκκλησίαν
  choice: 'biserica mea (redat idiomatic: „îmi voi zidi biserica”)'
  rationale: „Biserică” este termenul românesc consacrat pentru comunitatea lui Isus; construcția cu dativ posesiv este naturală și păstrează apartenența.
- source_word: πύλαι ᾅδου
  choice: porțile Locuinței morților
  rationale: Expresia face transparent sensul lui ᾅδης ca tărâm al morților și evită confundarea lui cu Gheena sau cu pedeapsa finală.
- source_word: οὐ κατισχύσουσιν αὐτῆς
  choice: nu o vor birui
  rationale: „A birui” redă concis sensul adversativ al lui κατισχύω, iar „o” se referă fără echivoc la biserică.
theological_decisions:
- issue: Referentul expresiei „această piatră”
  choice: Referentul nu este precizat dincolo de formularea greacă.
  alternative: Petru însuși; mărturisirea lui Petru; Petru în calitate de mărturisitor și reprezentant apostolic.
  rationale: Textul păstrează jocul de cuvinte dintre Πέτρος și πέτρα, dar nu explică explicit relația dintre ele. Traducerea nu trebuie să soluționeze o dispută teologică pe care formularea o lasă deschisă.
- issue: Sensul lui ᾅδης
  choice: Locuința morților
  alternative: Hades; iad
  rationale: „Locuința morților” exprimă sensul contextual fără a importa asocierile doctrinare ulterioare ale termenului „iad” cu pedeapsa finală.
translation_notes:
  register: Română standard modernă, cu ton demn și accesibil. S-a păstrat metafora zidirii și ambiguitatea teologică a „pietrei”, iar „Locuința morților” diferențiază ᾅδης de Gheena.
