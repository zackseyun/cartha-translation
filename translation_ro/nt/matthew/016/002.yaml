  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· ⸂Ὀψίας γενομένης λέγετε· Εὐδία, πυρράζει γὰρ ὁ οὐρανός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/002.yaml
  text: But he answered and said to them[a], “When evening comes, you say, ‘Fair weather, for the sky is red.’
translation:
  language: ro
  text: 'Dar el le-a răspuns: „Când se lasă seara, spuneți: «Va fi vreme frumoasă, fiindcă cerul este roșu.»”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: le-a răspuns
  rationale: Formula participială grecească înseamnă literal „răspunzând, a spus”; redarea firească în româna modernă este „le-a răspuns”, fără dublarea greoaie „a răspuns și a spus”.
- source_word: Ὀψίας γενομένης
  choice: Când se lasă seara
  rationale: Genitivul absolut are sens temporal. Formularea aleasă este actuală și idiomatică, păstrând ideea venirii serii.
- source_word: λέγετε
  choice: spuneți
  rationale: Prezentul exprimă aici un obicei sau o afirmație repetată, redat natural prin prezentul simplu românesc.
- source_word: Εὐδία
  choice: Va fi vreme frumoasă
  rationale: Substantivul indică vreme bună sau senină. Viitorul este firesc în română într-o prognoză bazată pe semnul observat, deși greaca are o expresie eliptică, fără verb explicit.
- source_word: πυρράζει
  choice: este roșu
  rationale: Verbul descrie culoarea roșiatică a cerului; redarea simplă evită intensificarea nejustificată prin „roșu ca focul”.
- source_word: οὐρανός
  choice: cerul
  rationale: În context meteorologic, termenul desemnează cerul vizibil. În română, „cer” acoperă firesc și sensul de boltă cerească, fără a necesita o notă lexicală.
theological_decisions: []
translation_notes:
  register: Română standard modernă, clară și demnă. Formula introductivă a fost netezită idiomatic, iar zicerea meteorologică a fost redată ca prognoză firească în română.
