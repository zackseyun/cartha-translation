  name: Romanian
  native_name: Română
  variant: modern standard Romanian
source:
  edition: SBLGNT
  text: ⸀δώσω σοι τὰς ⸀κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ⸀ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ⸁ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/019.yaml
  text: I will give you the keys of the kingdom of heaven[a], and whatever you bind on earth will have been bound in heaven[c][b], and whatever you loose on earth will have been loosed in heaven.
translation:
  language: ro
  text: Îți voi da cheile Împărăției cerurilor, iar orice vei lega pe pământ va fi fost legat în ceruri[b][c], iar orice vei dezlega pe pământ va fi fost dezlegat în ceruri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: În mod tradițional se traduce adesea „va fi legat… va fi dezlegat”. Construcția grecească poate fi redată mai precis prin „va fi fost legat… va fi fost dezlegat”.
    reason: alternative_reading
  - marker: c
    text: „A lega” și „a dezlega” pot avea sensul de a interzice și a permite sau de a impune și a ridica obligații; traducerea păstrează însă metafora grecească.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω σοι
  choice: Îți voi da
  rationale: Redă firesc în română viitorul activ și dativul obiectului indirect.
- source_word: τὰς κλεῖδας
  choice: cheile
  rationale: Păstrează metafora concretă din greacă, fără a o transforma într-o explicație despre autoritate.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: Împărăției cerurilor
  rationale: Formularea consacrată și naturală în română păstrează pluralul grecesc „cerurilor”, caracteristic expresiei mateene.
- source_word: ὃ ἐὰν
  choice: orice
  rationale: Redare românească idiomatică a construcției relative nehotărâte, repetată simetric în ambele propoziții.
- source_word: δήσῃς
  choice: vei lega
  rationale: Păstrează metafora și posibilele ei rezonanțe juridice ori normative fără a le explicita în text.
- source_word: ἐπὶ τῆς γῆς
  choice: pe pământ
  rationale: Echivalent românesc firesc în opoziția formulară dintre pământ și ceruri.
- source_word: ἔσται δεδεμένον
  choice: va fi fost legat
  rationale: Construcția cu viitorul lui εἰμί și participiul perfect pasiv indică o stare viitoare rezultată dintr-o acțiune împlinită; viitorul anterior românesc păstrează această forță aspectuală.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: în ceruri
  rationale: Păstrează pluralul explicit al textului grecesc și sună firesc în registrul biblic românesc.
- source_word: λύσῃς
  choice: vei dezlega
  rationale: „A dezlega” formează în română perechea metaforică firească cu „a lega” și evită restrângerea sensului la o singură interpretare.
- source_word: ἔσται λελυμένον
  choice: va fi fost dezlegat
  rationale: Redă paralel viitorul cu participiu perfect pasiv și menține simetria atentă a originalului.
theological_decisions:
- issue: Aspectul și implicația teologică a formulei „a lega/a dezlega”
  choice: va fi fost legat / va fi fost dezlegat
  alternative: va fi legat / va fi dezlegat
  rationale: Forma grecească poate indica faptul că acțiunea de pe pământ corespunde unei realități deja stabilite în ceruri. Redarea păstrează această posibilitate gramaticală fără a decide o doctrină confesională despre raportul exact dintre autoritatea cerească și cea pământească.
- issue: Sensul cheilor Împărăției cerurilor
  choice: Metafora „cheile” este păstrată fără explicație în text.
  alternative: autoritatea de a primi sau exclude; autoritate de administrare
  rationale: Imaginea sugerează autoritate, dar versetul nu îi definește aici întinderea exactă; traducerea evită introducerea unui sistem ecleziologic anume.
- issue: Sensul expresiilor „a lega” și „a dezlega”
  choice: Metaforele sunt păstrate în text, iar posibilele sensuri sunt indicate în notă.
  alternative: a interzice / a permite; a impune / a ridica obligații
  rationale: Termenii pot avea rezonanțe normative sau juridice, însă înlocuirea lor cu o singură interpretare ar elimina ambiguitatea autentică a textului.
translation_notes:
  register: Română standard modernă, clară și demnă. S-au păstrat metaforele centrale și paralelismul originalului. Viitorul anterior este mai puțin frecvent în vorbirea curentă, dar este gramatical, inteligibil și justificat aici de precizia aspectuală a construcției grecești.
