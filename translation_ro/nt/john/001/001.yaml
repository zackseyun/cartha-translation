revisions:
- from: La început era Cuvântul, iar Cuvântul era cu Dumnezeu și Cuvântul era Dumnezeu.[a][b]
  to: La început[b] era Cuvântul, și Cuvântul era cu Dumnezeu, și Cuvântul era Dumnezeu.[a]
  rationale: Revizuirea păstrează sensul, repetiția și registrul solemn al textului grec, elimină nuanța contrastivă necerută de „iar” și mută fiecare ancoră lângă elementul pe care îl explică. Nota privind θεός este formulată mai neutru pentru a semnala nuanța calitativă posibilă fără a închide o discuție sintactică disputată.
  reviewer_model: gpt-5.6-terra
