source:
  edition: SBLGNT
  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: ro
  text: La început[b] era Cuvântul, și Cuvântul era cu Dumnezeu, și Cuvântul era Dumnezeu.[a]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'Sau: „Cuvântul era divin” ori „ce era Dumnezeu, era și Cuvântul”. În ultima propoziție, formularea greacă poate evidenția calitatea sau natura Cuvântului, păstrând totodată distincția dintre Cuvânt și „Dumnezeu” din propoziția precedentă.'
    reason: alternative_reading
  - marker: b
    text: Expresia „La început” trimite la Geneza 1:1 și leagă Cuvântul de începutul creației.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: La început
  rationale: Redă firesc expresia greacă și păstrează ecoul deliberat al Genezei 1:1.
- source_word: ἦν
  choice: era
  rationale: Imperfectul verbului εἰμί este redat natural prin „era”, păstrând totodată repetiția și cadența textului grec.
- source_word: ὁ λόγος
  choice: Cuvântul
  rationale: „Cuvântul” este echivalentul românesc consacrat și adecvat aici; păstrează atât ideea de exprimare și revelare, cât și caracterul personal al desemnării, fără a restrânge sensul la „Mesajul” ori la conceptul filozofic „Rațiunea”.
- source_word: πρὸς τὸν θεόν
  choice: cu Dumnezeu
  rationale: În acest context, „cu Dumnezeu” exprimă firesc relația și distincția personală sugerate de πρός cu acuzativul; „către Dumnezeu” ar fi prea literal și mai puțin natural.
- source_word: τὸν θεόν
  choice: Dumnezeu
  rationale: Substantivul articulat îl desemnează în mod definit pe Dumnezeu; în română, numele divin nu cere articol în această construcție.
- source_word: θεὸς ἦν ὁ λόγος
  choice: Cuvântul era Dumnezeu
  rationale: Redarea păstrează ordinea predicativă firească în română și afirmă natura dumnezeiască deplină a Cuvântului, fără a-l confunda personal cu Dumnezeu din propoziția precedentă. Varianta „era dumnezeiesc” ar putea sugera în româna curentă doar o calitate derivată sau mai slabă.
theological_decisions:
- issue: Redarea numelui predicativ nearticulat θεός din ultima propoziție
  choice: Cuvântul era Dumnezeu
  alternative: Cuvântul era dumnezeiesc; ceea ce era Dumnezeu, era și Cuvântul
  rationale: 'Construcția greacă are o forță predominant calitativă: îi atribuie Cuvântului natura lui Dumnezeu, păstrând în același timp distincția față de Dumnezeu menționat anterior. Textul principal redă direct afirmația, iar nota consemnează nuanța și alternativele fără a diminua sau a rezolva artificial tensiunea textului.'
translation_notes:
  register: Română standard modernă, demnă și accesibilă. S-a păstrat paralelismul solemn al celor trei propoziții. Conjuncția καί este redată mai întâi prin „iar”, pentru legare și contrast relațional firesc, apoi prin „și”, pentru culminarea afirmației. Marcajele notelor sunt plasate după verset, deoarece nota [a] privește ultima propoziție, iar nota [b] explică expresia inițială.
