  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: ro
  text: „Aburul aburilor[a]”, spune Qohelet[b], „aburul aburilor; totul este doar abur.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶבֶל
  choice: abur
  rationale: Termenul ebraic denumește literalmente suflarea sau aburul și, ca imagine dominantă a cărții, sugerează simultan ceea ce este trecător, de necuprins și contrar așteptărilor. Românescul „abur” păstrează imaginea concretă și evită restrângerea sensului la „deșertăciune”, „zădărnicie” ori „lipsă de sens”.
- source_word: הֲבֵל הֲבָלִים
  choice: aburul aburilor
  rationale: Construcția ebraică exprimă superlativul absolut prin tiparul „X al X-urilor”, comparabil cu „Cântarea Cântărilor”. Formula românească păstrează atât structura, cât și imaginea concretă.
- source_word: אָמַר
  choice: spune
  rationale: Deși forma ebraică este perfectivă, formula literară introduce o afirmație valabilă și prezentată viu; prezentul este firesc în româna actuală.
- source_word: קֹהֶלֶת
  choice: Qohelet
  rationale: Transliterarea păstrează deschisă valoarea titlului sau numelui ebraic, fără a o limita la interpretările „Învățătorul” ori „Predicatorul”.
- source_word: הַכֹּל
  choice: totul
  rationale: Redă firesc în română caracterul cuprinzător al expresiei ebraice.
- source_word: הָבֶל
  choice: doar abur
  rationale: În poziție predicativă, „doar” transmite nuanța evaluativă și efectul de dezumflare al afirmației, fără a transforma imaginea într-o definiție materială a tuturor lucrurilor.
theological_decisions:
- issue: Redarea motivului central הֶבֶל
  choice: Păstrarea imaginii concrete prin „aburul aburilor” și „doar abur”.
  alternative: „deșertăciunea deșertăciunilor”, „zădărnicie deplină”, „totul este lipsit de sens”
  rationale: Formulările abstracte aleg câte un singur aspect și pot introduce concluzii mai categorice decât textul. Imaginea aburului lasă să rămână împreună caracterul trecător, insesizabil și ironic al realității descrise.
- issue: Identitatea și funcția lui קֹהֶלֶת
  choice: Transliterarea „Qohelet”.
  alternative: „Eclesiastul”, „Învățătorul”, „Predicatorul”
  rationale: Sensul și funcția exactă a desemnării sunt discutate; transliterarea nu rezolvă nejustificat ambiguitatea și nu impune o funcție eclezială ori didactică precisă.
translation_notes:
  register: Română literară modernă, clară și solemnă fără arhaisme. Repetiția deliberată și forma superlativă a ebraicii sunt păstrate. „Abur” este preferat lui „suflare”, deoarece în română evită asocierile suplimentare cu viața, spiritul sau actul creator și exprimă limpede caracterul trecător și de necuprins al imaginii.
