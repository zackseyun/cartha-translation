  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: ro
  text: La început, când Dumnezeu a creat cerurile și pământul[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'În mod tradițional, cuvintele sunt redate ca o propoziție completă: „La început, Dumnezeu a creat cerurile și pământul.” Ebraica — בְּרֵאשִׁית fără articol, urmat de verbul finit בָּרָא — poate fi înțeleasă și ca o construcție temporală subordonată, în paralel cu Geneza 2:4b. În această lectură, propoziția principală apare în versetul 3: „Dumnezeu a zis: «Să fie lumină!»”'
    reason: lectură alternativă; nota păstrează ambiguitatea sintactică disputată
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: La început, când … a creat
  rationale: Forma fără articol בְּרֵאשִׁית, urmată de verbul finit בָּרָא, se citește firesc drept o construcție temporală dependentă. Redarea păstrează totodată sensul lexical al lui רֵאשִׁית, „început”.
- source_word: בָּרָא
  choice: a creat
  rationale: Verbul este folosit în Biblia ebraică pentru actul creator al lui Dumnezeu. „A creat” este echivalentul românesc direct și consacrat, fără a preciza în mod nejustificat mecanismul creației.
- source_word: אֱלֹהִים
  choice: Dumnezeu
  rationale: Deși substantivul are formă morfologică de plural, aici este însoțit de verbul la singular בָּרָא și se referă la un singur Dumnezeu.
- source_word: אֵת
  choice: '[neredat; marcă a complementului direct definit]'
  rationale: Particula marchează în ebraică un complement direct definit și nu are un echivalent lexical necesar în română; funcția ei este exprimată prin sintaxă.
- source_word: הַשָּׁמַיִם
  choice: cerurile
  rationale: Pluralul românesc reflectă forma ebraică. Împreună cu „pământul”, expresia desemnează totalitatea ordinii create.
- source_word: הָאָרֶץ
  choice: pământul
  rationale: Deși אֶרֶץ poate însemna și „țară” sau „uscat”, în perechea cosmică „cerurile și pământul” sensul potrivit este „pământul”.
theological_decisions:
- issue: Sintaxa propoziției de deschidere
  choice: 'Propoziție temporală dependentă: „La început, când Dumnezeu a creat cerurile și pământul—”'
  alternative: 'Propoziție principală independentă: „La început, Dumnezeu a creat cerurile și pământul.”'
  rationale: Forma fără articol a lui בְּרֵאשִׁית, urmată imediat de verbul finit בָּרָא, favorizează lectura temporală dependentă, comparabilă cu deschiderile din Geneza 2:4b și Osea 1:2. Traducerea păstrează această tensiune sintactică, fără a face ca o doctrină despre modul creației să depindă numai de analiza acestui verset.
translation_notes:
  register: Română standard modernă, clară și demnă. „Cerurile” păstrează pluralul ebraic, iar linia de pauză arată că enunțul continuă dincolo de limita versetului.
